  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">树突状细胞：从全身哨兵到最强抗原提呈细胞</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">未成熟DC广布上皮下持续采样、低MHC与共刺激倾向诱导耐受；识别PAMP/DAMP后成熟，上调MHC-肽与CD80/86并循CCR7-CCL19/21迁入淋巴结T区；cDC1擅长交叉提呈与</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">IL-12、cDC2引导Th2/Th17、pDC经TLR7/9分泌I型干扰素；1973年Steinman发现DC，2011年获诺贝尔奖</text>
  <rect x="30" y="132" width="1340" height="402" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、未成熟 DC 与成熟 DC：成熟与否决定免疫或耐受的方向</text>
  <rect x="60" y="176" width="400" height="130" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="76" y="202" font-size="14" fill="#1e293b" font-weight="700">未成熟 DC —— 全身哨兵</text>
  <text x="76" y="226" font-size="11" fill="#475569">广布皮肤、呼吸道、肠道与结缔组织的上皮之下，持续采样外界抗原；</text>
  <text x="76" y="258" font-size="11" fill="#475569">高摄取 · 低 MHC · 低共刺激——提呈倾向诱导耐受。</text>
  <g><circle cx="300" cy="286" r="5.5" fill="#0f766e" fill-opacity="0.5"/><line x1="300" y1="290" x2="300" y2="295" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="300" cy="299" r="5.5" fill="#0f766e" fill-opacity="0.5"/><circle cx="324" cy="286" r="5.5" fill="#0f766e" fill-opacity="0.5"/><line x1="324" y1="290" x2="324" y2="295" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="324" cy="299" r="5.5" fill="#0f766e" fill-opacity="0.5"/><circle cx="348" cy="286" r="5.5" fill="#0f766e" fill-opacity="0.5"/><line x1="348" y1="290" x2="348" y2="295" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="348" cy="299" r="5.5" fill="#0f766e" fill-opacity="0.5"/><circle cx="372" cy="286" r="5.5" fill="#0f766e" fill-opacity="0.5"/><line x1="372" y1="290" x2="372" y2="295" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="372" cy="299" r="5.5" fill="#0f766e" fill-opacity="0.5"/><circle cx="396" cy="286" r="5.5" fill="#0f766e" fill-opacity="0.5"/><line x1="396" y1="290" x2="396" y2="295" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="396" cy="299" r="5.5" fill="#0f766e" fill-opacity="0.5"/><circle cx="420" cy="286" r="5.5" fill="#0f766e" fill-opacity="0.5"/><line x1="420" y1="290" x2="420" y2="295" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="420" cy="299" r="5.5" fill="#0f766e" fill-opacity="0.5"/></g>
