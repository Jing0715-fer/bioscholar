  <circle cx="244" cy="288" r="2.6" fill="#dc2626"/>
  <circle cx="340" cy="270" r="3.5" fill="#dc2626"/>
  <text x="300" y="320" font-size="9.5" fill="#64748b" text-anchor="middle">上皮下持续采样</text>
  <line x1="470" y1="236" x2="566" y2="236" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-bad)"/>
  <text x="518" y="214" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">PRR 识别 PAMP/DAMP</text>
  <text x="518" y="260" font-size="11" fill="#dc2626" text-anchor="middle">危险信号（TNF · IL-1）</text>
  <rect x="570" y="176" width="400" height="130" rx="9" fill="#ccfbf1" fill-opacity="0.4" stroke="#0f766e" stroke-width="1.8"/>
  <text x="586" y="202" font-size="14" fill="#134e4a" font-weight="700">成熟 DC —— 迁徙的信使</text>
  <text x="586" y="226" font-size="11" fill="#475569">下调摄取；上调并稳定 MHC-肽与共刺激分子 CD80/86；</text>
  <text x="586" y="258" font-size="11" fill="#475569">循 CCR7–CCL19/21 梯度迁入引流淋巴结 T 区。</text>
  <circle cx="830" cy="284" r="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <line x1="845" y1="284" x2="900" y2="284" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <circle cx="930" cy="284" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="930" y="288" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">T</text>
  <text x="880" y="320" font-size="9.5" fill="#64748b" text-anchor="middle">淋巴结 T 区激活初始 T 细胞</text>
  <rect x="1000" y="176" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1065" y="203.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">两态对照</text>
  <rect x="1130" y="176" width="210" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="203.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">要点</text>
  <rect x="1000" y="220" width="130" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1065" y="239.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">摄取能力</text>
  <rect x="1130" y="220" width="210" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="239.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">高 → 下调</text>
  <rect x="1000" y="248" width="340" height="28" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="1000" y="248" width="130" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1065" y="267.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">MHC-肽</text>
  <rect x="1130" y="248" width="210" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="267.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">低 → 上调且稳定</text>
  <rect x="1000" y="276" width="130" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1065" y="295.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">CD80/86</text>
  <rect x="1130" y="276" width="210" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="295.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">低 → 上调</text>
  <rect x="1000" y="304" width="340" height="28" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="1000" y="304" width="130" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1065" y="323.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">效应方向</text>
  <rect x="1130" y="304" width="210" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="323.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">耐受 → 免疫</text>
  <rect x="60" y="336" width="200" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="363.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">比较项</text>
  <rect x="260" y="336" width="520" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="520" y="363.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">未成熟 DC</text>
  <rect x="780" y="336" width="560" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="363.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">成熟 DC</text>
  <rect x="60" y="380" width="200" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="404.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">分布与去向</text>
  <rect x="260" y="380" width="520" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="520" y="404.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">广布全身上皮下（外周血单个核细胞中不足 1%）</text>
  <rect x="780" y="380" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="404.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">循 CCR7–CCL19/21 梯度迁入引流淋巴结 T 区</text>
  <rect x="60" y="418" width="1280" height="38" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="418" width="200" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="442.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">摄取 / 提呈</text>
  <rect x="260" y="418" width="520" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="520" y="442.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">持续采样、高摄取；低 MHC 与共刺激</text>
  <rect x="780" y="418" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="442.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">下调摄取；MHC-肽与 CD80/86 上调而稳定</text>
  <rect x="60" y="456" width="200" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="480.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">免疫学效应</text>
  <rect x="260" y="456" width="520" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="520" y="480.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">提呈倾向诱导耐受（成熟与否决定方向）</text>
  <rect x="780" y="456" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="480.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">唯一能高效激活初始 T 细胞的专职 APC</text>
  <rect x="30" y="550" width="1340" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="572.84" font-size="19" fill="#475569" font-weight="700">二、DC 的亚群：cDC 与 pDC 的分工</text>
  <rect x="60" y="588" width="380" height="120" rx="9" fill="#0f766e" fill-opacity="0.08" stroke="#0f766e" stroke-width="1.7"/>
  <text x="78" y="612" font-size="14" fill="#134e4a" font-weight="700">cDC1</text>
  <text x="78" y="636" font-size="11" fill="#64748b">交叉提呈擅长者</text>
  <text x="78" y="660" font-size="11.5" fill="#134e4a" font-weight="600">分泌 IL-12</text>
  <text x="78" y="684" font-size="11.5" fill="#475569">启动 CD8⁺ T 与 Th1 应答</text>
  <rect x="470" y="588" width="380" height="120" rx="9" fill="#6d28d9" fill-opacity="0.08" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="488" y="612" font-size="14" fill="#4c1d95" font-weight="700">cDC2</text>
  <text x="488" y="636" font-size="11" fill="#64748b">免疫应答引导者</text>
  <text x="488" y="660" font-size="11.5" fill="#4c1d95" font-weight="600">提呈并极化</text>
  <text x="488" y="684" font-size="11.5" fill="#475569">引导 Th2 / Th17 应答方向</text>
  <rect x="880" y="588" width="440" height="120" rx="9" fill="#0369a1" fill-opacity="0.08" stroke="#0369a1" stroke-width="1.7"/>
  <text x="898" y="612" font-size="14" fill="#075985" font-weight="700">pDC（浆细胞样 DC）</text>
  <text x="898" y="636" font-size="11" fill="#64748b">I 型干扰素工厂</text>
  <text x="898" y="660" font-size="11.5" fill="#075985" font-weight="600">经 TLR7 / TLR9</text>
  <text x="898" y="684" font-size="11.5" fill="#475569">大量分泌 I 型干扰素（IFN-α/β）</text>
  <rect x="30" y="756" width="1340" height="222" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="778.84" font-size="19" fill="#475569" font-weight="700">三、交叉提呈：最强的抗原提呈细胞与它的发现者</text>
  <rect x="60" y="792" width="150" height="62" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="135" y="816" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">外源抗原</text>
  <text x="135" y="838" font-size="9.5" fill="#64748b" text-anchor="middle">病毒 / 肿瘤抗原</text>
  <line x1="212" y1="823" x2="220" y2="823" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="222" y="792" width="150" height="62" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="297" y="816" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">DC 摄取</text>
  <text x="297" y="838" font-size="9.5" fill="#64748b" text-anchor="middle">吞噬 / 内吞</text>
  <line x1="374" y1="823" x2="382" y2="823" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="384" y="792" width="150" height="62" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="459" y="816" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">送入 MHC I 类通路</text>
  <text x="459" y="838" font-size="9.5" fill="#64748b" text-anchor="middle">「交叉」之处</text>
  <line x1="536" y1="823" x2="544" y2="823" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="546" y="792" width="150" height="62" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="621" y="816" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">提呈给 CD8⁺ T</text>
  <text x="621" y="838" font-size="9.5" fill="#64748b" text-anchor="middle">MHC-肽 + CD80/86</text>
  <line x1="698" y1="823" x2="706" y2="823" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="708" y="792" width="150" height="62" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="783" y="816" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">启动 CTL 应答</text>
  <text x="783" y="838" font-size="9.5" fill="#64748b" text-anchor="middle">杀伤感染与肿瘤细胞</text>
  <text x="460" y="888" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">交叉提呈把外源抗原送入 MHC I 类通路以启动 CD8 应答——抗病毒与抗肿瘤疫苗免疫的核心机制</text>
  <text x="460" y="914" font-size="11" fill="#64748b" text-anchor="middle">未成熟 DC 低共刺激的提呈则诱导耐受：同一 APC 决定免疫或耐受的方向</text>
  <rect x="900" y="792" width="460" height="130" rx="9" fill="#fef3c7" fill-opacity="0.35" stroke="#b45309" stroke-width="1.6"/>
  <text x="918" y="818" font-size="13.5" fill="#78350f" font-weight="700">历史与地位</text>
  <text x="918" y="842" font-size="11" fill="#475569">1973 年 Steinman 在小鼠脾脏中发现树突状细胞并证明其为独立谱系；</text>
  <text x="918" y="858" font-size="11" fill="#475569">2011 年诺贝尔奖一半授予 Steinman，</text>
  <text x="918" y="874" font-size="11" fill="#475569">另一半授予发现 Toll 样受体识别作用的 Beutler 与 Hoffmann。</text>
  <text x="918" y="906" font-size="11" fill="#78350f" font-weight="600">外周血单个核细胞中不足 1% 的 DC，却是激活初始 T 细胞的最强 APC。</text>
</svg>