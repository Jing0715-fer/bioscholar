  <text x="110" y="452" font-size="9.5" fill="#64748b" text-anchor="middle">同一位置单碱基不同</text>
  <rect x="192.5894" y="392.1" width="46.821200000000005" height="23.8" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="216" y="409.04" font-size="14" fill="#831843" text-anchor="middle" font-weight="700">SNP</text>
  <text x="216" y="430" font-size="11.5" fill="#475569">多态性来源：单碱基变异</text>
  <text x="216" y="454" font-size="11.5" fill="#475569">检测：芯片 / 测序 ｜ 特点：数量最多（千万级）· 二等位为主</text>
  <rect x="46" y="478" width="728" height="54" rx="8" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.3"/>
  <text x="60" y="502" font-size="12" fill="#075985">用途：遗传连锁图构建 · QTL 定位 · GWAS · 法医 DNA 指纹 · 亲缘与群体遗传分析</text>
  <text x="60" y="524" font-size="11" fill="#64748b">SNP 芯片使全基因组关联研究（GWAS）常规化</text>
  <rect x="810" y="132" width="560" height="408" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="826" y="154.84" font-size="19" fill="#475569" font-weight="700">二、酵母双杂交（Y2H）：体内检测蛋白-蛋白互作</text>
  <rect x="836" y="162" width="96" height="30" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="884" y="182" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">BD 结合域</text>
  <text x="943" y="182" font-size="15" fill="#64748b" text-anchor="middle" font-weight="700">＋</text>
  <rect x="950" y="162" width="96" height="30" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <text x="998" y="182" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">AD 激活域</text>
  <text x="1068" y="178" font-size="11.5" fill="#475569">转录因子 Gal4 拆分为两个可独立融合的结构域</text>
  <line x1="840" y1="430" x2="1340" y2="430" stroke="#0f766e" stroke-width="3"/>
  <rect x="884" y="416" width="56" height="28" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
