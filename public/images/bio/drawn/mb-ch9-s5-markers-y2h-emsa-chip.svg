  <line x1="1300.7" y1="640.7" x2="1295.1" y2="635.1" stroke="#059669" stroke-width="1.4"/>
  <line x1="1327.3" y1="640.7" x2="1332.9" y2="635.1" stroke="#059669" stroke-width="1.4"/>
