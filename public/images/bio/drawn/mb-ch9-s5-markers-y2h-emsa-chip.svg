  <text x="116" y="250" font-size="9.5" fill="#64748b" text-anchor="middle"> Southern 杂交</text>
  <rect x="188.1192" y="188.1" width="55.7616" height="23.8" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="216" y="205.04" font-size="14" fill="#134e4a" text-anchor="middle" font-weight="700">RFLP</text>
  <text x="216" y="230" font-size="11.5" fill="#475569">多态性来源：限制位点有无 / 片段长度差异</text>
  <text x="216" y="254" font-size="11.5" fill="#475569">检测：Southern 印迹 ｜ 特点：共显性 · 需 DNA 量大</text>
  <rect x="46" y="276" width="728" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
