  <text x="120" y="352" font-size="9.5" fill="#64748b" text-anchor="middle">等位间 (CA)<tspan dy="2.1" font-size="6.8">n</tspan><tspan dy="-2.1"> 重复数不同</tspan></text>
  <rect x="164.0378" y="290.1" width="103.9244" height="23.8" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="216" y="307.04" font-size="14" fill="#78350f" text-anchor="middle" font-weight="700">SSR / 微卫星</text>
  <text x="216" y="330" font-size="11.5" fill="#475569">多态性来源：(CA)<tspan dy="2.5" font-size="8.3">n</tspan><tspan dy="-2.5"> 等重复数变异</tspan></text>
  <text x="216" y="354" font-size="11.5" fill="#475569">检测：PCR + 电泳 ｜ 特点：多等位 · 共显性 · 基因组中丰富</text>
  <rect x="46" y="378" width="728" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
