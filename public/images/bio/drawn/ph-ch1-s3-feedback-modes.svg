  <text x="730" y="872" font-size="10.5" fill="#475569">三种逻辑常共守同一变量——体温：添衣（行为性前馈）+ 寒战与皮肤血管收缩（负反馈）+ 褐色脂肪产热与甲状腺激素上调</text>
  <text x="730" y="890" font-size="10.5" fill="#475569">（长时程体液适应）；血糖：头期胰岛素分泌（前馈色彩）+ 胰岛素-胰高血糖素拮抗（负反馈）</text>
  <text x="730" y="938" font-size="11.5" fill="#64748b" font-weight="700">控制逻辑是语法，器官系统是词汇——其余章节用这套语法造句</text>
