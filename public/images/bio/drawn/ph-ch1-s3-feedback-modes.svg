  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">反馈与前馈：稳态的三种控制逻辑</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">负反馈以偏差治偏差（增益 = 校正量 ÷ 残余偏差，血压反射例 = 3）；正反馈放大、须自限终点关闭；前馈按扰动预告预先调整——三者协作守护稳态</text>
  <rect x="30" y="132" width="660" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、负反馈闭环：动脉血压骤升的纠正</text>
  <rect x="92.7293" y="195.65" width="124.5414" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="155" y="208.96" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">扰动：骤升 +40 mmHg</text>
  <line x1="155" y1="218" x2="155" y2="246" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-warn)"/>
  <rect x="70" y="250" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="145" y="276" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">受控变量</text>
  <text x="145" y="298" font-size="11" fill="#475569" text-anchor="middle">动脉血压 MAP</text>
  <rect x="270" y="250" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="350" y="270" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">感受器</text>
  <text x="350" y="290" font-size="10.5" fill="#475569" text-anchor="middle">颈动脉窦·主动脉弓</text>
  <text x="350" y="308" font-size="10.5" fill="#475569" text-anchor="middle">压力感受器</text>
  <rect x="480" y="250" width="180" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="570" y="270" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">控制中枢（延髓）</text>
  <text x="570" y="290" font-size="10.5" fill="#475569" text-anchor="middle">与设定点比较</text>
  <text x="570" y="308" font-size="10.5" fill="#475569" text-anchor="middle">输出偏差信号</text>
  <line x1="222" y1="285" x2="266" y2="285" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="244" y="266" font-size="10" fill="#64748b" text-anchor="middle">监测</text>
  <line x1="432" y1="285" x2="476" y2="285" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="454" y="266" font-size="10" fill="#64748b" text-anchor="middle">传入</text>
  <line x1="570" y1="322" x2="570" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="582" y="362" font-size="10.5" fill="#64748b">传出神经</text>
  <rect x="340" y="400" width="320" height="82" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="2"/>
  <text x="500" y="424" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">效应器：心迷走增强 · 心交感与缩血管减弱</text>
  <text x="500" y="446" font-size="11" fill="#475569" text-anchor="middle">心率减慢 · 心输出量与外周阻力下降</text>
  <text x="500" y="468" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">→ 血压回降</text>
  <line x1="340" y1="438" x2="174" y2="326" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <text x="250" y="342" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">纠正：与偏差反向</text>
  <circle cx="252" cy="382" r="11" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <line x1="244" y1="382" x2="260" y2="382" stroke="#059669" stroke-width="2.2"/>
  <text x="250" y="408" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">负反馈</text>
  <text x="60" y="462" font-size="10.5" fill="#475569">设定点 = 拮抗效应器活动的平衡点</text>
  <text x="60" y="484" font-size="10.5" fill="#475569">运动时重置：心率 70 → 150 次/分</text>
  <text x="60" y="512" font-size="12" fill="#075985" font-weight="700">增益 = 校正量 ÷ 残余偏差 = (40-10) ÷ 10 = 3</text>
  <text x="60" y="538" font-size="10.5" fill="#475569">残余偏差不可避免——偏差归零则误差信号消失；时间滞后叠加强增益是振荡之源（血压 Mayer 波、餐后血糖过冲与回摆），</text>
  <text x="60" y="556" font-size="10.5" fill="#475569">滞后过大可致反向超调</text>
  <rect x="710" y="132" width="660" height="460" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、正反馈：必须自限的放大器</text>
  <text x="800" y="186" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">启动信号</text>
  <text x="985" y="186" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">放大环</text>
  <text x="1180" y="186" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">自限终点</text>
  <rect x="758.01" y="215.65" width="83.98" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="800" y="228.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">胎头压迫宫颈</text>
  <line x1="858" y1="225" x2="940" y2="225" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <path d="M 967,225 A 18 18 0 0 1 1003,225" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <path d="M 1003,225 A 18 18 0 0 1 967,225" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="985" y="229" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700">放大</text>
  <line x1="1013" y1="225" x2="1120" y2="225" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <rect x="1149.34" y="215.65" width="61.32" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1180" y="228.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">胎儿娩出</text>
  <text x="730" y="259" font-size="10.5" fill="#475569">催产素释放增多 → 宫缩更强 → 胎头压迫更强（互为因果）</text>
  <rect x="758.01" y="305.65" width="83.98" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="800" y="318.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">组织因子暴露</text>
  <line x1="858" y1="315" x2="940" y2="315" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <path d="M 967,315 A 18 18 0 0 1 1003,315" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <path d="M 1003,315 A 18 18 0 0 1 967,315" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="985" y="319" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700">放大</text>
  <line x1="1013" y1="315" x2="1120" y2="315" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <rect x="1138.01" y="305.65" width="83.98" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1180" y="318.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">血栓封住破口</text>
  <text x="730" y="349" font-size="10.5" fill="#475569">凝血酶激活更多凝血因子（级联放大）</text>
  <rect x="752.345" y="395.65" width="95.31" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="800" y="408.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">去极化达阈电位</text>
  <line x1="858" y1="405" x2="940" y2="405" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <path d="M 967,405 A 18 18 0 0 1 1003,405" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <path d="M 1003,405 A 18 18 0 0 1 967,405" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="985" y="409" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700">放大</text>
  <line x1="1013" y1="405" x2="1120" y2="405" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <rect x="1138.948124" y="395.65" width="82.103752" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1180" y="408.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">Na<tspan dy="-3.7" font-size="7.9">+</tspan><tspan dy="3.7"> 通道失活</tspan></text>
  <text x="730" y="439" font-size="10.5" fill="#475569">Na<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 内流与去极化互为因果（再生性升支，超射约 +30 mV）</tspan></text>
  <text x="730" y="470" font-size="10.5" fill="#475569">共同点：正反馈自带自限终点——终点事件物理性消除启动偏差源（胎头娩出完成 / 血栓封口 / 通道失活 / 卵泡破裂终结 LH 峰）。</text>
  <text x="730" y="488" font-size="10.5" fill="#475569">一旦失去自限即恶性循环：严重失血时冠脉灌注不足 → 泵血更弱 → 血压更低，须临床主动打断</text>
  <text x="730" y="540" font-size="11.5" fill="#991b1b" font-weight="700">正反馈不维持任何稳态——只把「必须一次做成」的事件推到完成</text>
  <rect x="30" y="606" width="660" height="376" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="628.84" font-size="19" fill="#475569" font-weight="700">三、前馈：不等偏差出现</text>
  <rect x="85.35" y="680.65" width="129.3" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="150" y="693.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">条件刺激：食物形色味</text>
  <line x1="222" y1="690" x2="300" y2="690" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <rect x="306" y="664" width="130" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="371" y="686" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">皮层条件反射</text>
  <text x="371" y="706" font-size="10" fill="#64748b" text-anchor="middle">（Pavlov）</text>
  <line x1="442" y1="690" x2="505" y2="690" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-ok)"/>
  <rect x="519.8672" y="680.65" width="110.26559999999999" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="575" y="693.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">唾液·胃液分泌启动</text>
  <text x="50" y="730" font-size="10.5" fill="#475569">食物入口之前分泌已启动——偏差尚未出现</text>
  <rect x="94.8672" y="775.65" width="110.2656" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="150" y="788.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">运动皮层·中央命令</text>
  <line x1="222" y1="785" x2="300" y2="785" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <rect x="306" y="759" width="130" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="371" y="781" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">内部预测模型</text>
  <text x="371" y="801" font-size="10" fill="#64748b" text-anchor="middle">（可学习）</text>
  <line x1="442" y1="785" x2="505" y2="785" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-ok)"/>
  <rect x="518.0544" y="775.65" width="113.8912" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="575" y="788.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">心率·通气·血流预调</text>
  <text x="50" y="825" font-size="10.5" fill="#475569">起跑之前动员已完成；训练有素者预判误差更小</text>
  <text x="50" y="856" font-size="10.5" fill="#475569">前馈快而无兜底：预判失准便放大错误（运动前过度通气）；故与负反馈并行——前馈抢时间，负反馈保精度</text>
  <line x1="60" y1="952" x2="640" y2="952" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="350" y="972" font-size="11" fill="#475569" text-anchor="middle">时间</text>
  <line x1="300" y1="890" x2="300" y2="952" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="300" y="884" font-size="10" fill="#64748b" text-anchor="middle">扰动到达</text>
  <polyline points="240,952 280,932 330,922 380,932 420,952" fill="none" stroke="#059669" stroke-width="2.4"/>
  <text x="170" y="922" font-size="10.5" fill="#065f46" font-weight="700">有前馈</text>
  <polyline points="300,952 350,910 430,885 510,910 560,952" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="520" y="880" font-size="10.5" fill="#991b1b" font-weight="700">无前馈</text>
  <rect x="710" y="606" width="660" height="376" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="628.84" font-size="19" fill="#475569" font-weight="700">四、三种控制逻辑对比</text>
  <rect x="730" y="665" width="80" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="770" y="692.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">类型</text>
  <rect x="810" y="665" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="885" y="692.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">触发信号</text>
  <rect x="960" y="665" width="175" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1047.5" y="692.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">对偏差作用</text>
  <rect x="1135" y="665" width="215" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1242.5" y="692.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">失控后果</text>
  <rect x="730" y="709" width="80" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="770" y="736.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">负反馈</text>
  <rect x="810" y="709" width="150" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="885" y="736.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">偏差本身</text>
  <rect x="960" y="709" width="175" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1047.5" y="736.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">对抗 · 压缩（闭环）</text>
  <rect x="1135" y="709" width="215" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1242.5" y="736.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">振荡、残余偏差</text>
  <rect x="730" y="753" width="620" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="753" width="80" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="770" y="780.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">正反馈</text>
  <rect x="810" y="753" width="150" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="885" y="780.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">启动信号</text>
  <rect x="960" y="753" width="175" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1047.5" y="780.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">放大 · 推向终点</text>
  <rect x="1135" y="753" width="215" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1242.5" y="780.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">恶性循环</text>
  <rect x="730" y="797" width="80" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="770" y="824.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">前馈</text>
  <rect x="810" y="797" width="150" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="885" y="824.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">扰动预告</text>
  <rect x="960" y="797" width="175" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1047.5" y="824.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">预先抵消（开环）</text>
