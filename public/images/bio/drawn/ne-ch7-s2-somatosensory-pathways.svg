<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">躯体感觉的传入通路：两条三级通路与交叉平面的分野</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">Aβ 走背柱-内侧丘系（延髓交叉）；Aδ/C 走脊髓丘脑束（脊髓内交叉）——分离性感觉障碍的钥匙</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、三类初级传入纤维：内外分流入脊髓</text>
  <rect x="60" y="190" width="70" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">纤维</text>
  <rect x="130" y="190" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="185" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">直径（μm）</text>
  <rect x="240" y="190" width="90" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="285" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">髓鞘</text>
  <rect x="330" y="190" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">传导速度</text>
  <rect x="460" y="190" width="200" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="560" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">功能</text>
  <rect x="60" y="234" width="70" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="260.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">Aβ</text>
  <rect x="130" y="234" width="110" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="185" y="260.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">6–12</text>
  <rect x="240" y="234" width="90" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="285" y="260.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">有髓</text>
  <rect x="330" y="234" width="130" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="260.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">30–70 m/s</text>
  <rect x="460" y="234" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="560" y="260.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">精细触觉、振动觉、静态位置觉</text>
  <rect x="60" y="276" width="600" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="276" width="70" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="302.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">Aδ</text>
  <rect x="130" y="276" width="110" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="185" y="302.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">2–5</text>
  <rect x="240" y="276" width="90" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="285" y="302.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">薄髓</text>
  <rect x="330" y="276" width="130" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="302.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">12–30 m/s</text>
  <rect x="460" y="276" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="560" y="302.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">快痛、冷觉</text>
  <rect x="60" y="318" width="70" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="344.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">C</text>
  <rect x="130" y="318" width="110" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="185" y="344.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">0.5–2</text>
  <rect x="240" y="318" width="90" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="285" y="344.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">无髓</text>
  <rect x="330" y="318" width="130" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="344.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">0.5–2 m/s</text>
  <rect x="460" y="318" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="560" y="344.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">慢痛、温觉、痒</text>
  <text x="60" y="398" font-size="11.5" fill="#1e293b" font-weight="700">脊髓横断面（后角朝上）</text>
  <ellipse cx="200" cy="480" rx="100" ry="52" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="200" y="490" font-size="10" fill="#64748b" text-anchor="middle">中央管</text>
  <path d="M118,462 C136,434 164,420 200,432 C236,420 264,434 282,462" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="200" y="422" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">后角</text>
  <line x1="92" y1="404" x2="120" y2="440" stroke="#0f766e" stroke-width="2.6" marker-end="url(#arr-dna)"/>
  <text x="62" y="378" font-size="10.5" fill="#134e4a" font-weight="700">粗纤维 → 后角内侧 → 后索</text>
  <line x1="308" y1="404" x2="280" y2="440" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-bad)"/>
  <text x="296" y="378" font-size="10.5" fill="#dc2626" font-weight="700">细纤维 → 后角外侧 → Lissauer 束</text>
  <text x="360" y="448" font-size="10.5" fill="#475569">「内外分流」是两条上行通路分野的起点；C 纤维数量最多，</text>
  <text x="360" y="463" font-size="10.5" fill="#475569">末梢多为多型伤害性感受器，伴 P 物质与降钙素基因相关肽。</text>
  <text x="62" y="552" font-size="9.5" fill="#64748b">速度与直径近似线性源于轴突电缆性质；Aα（70–120 m/s）属运动系、Aγ（15–30 m/s）支配梭内肌。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、背柱-内侧丘系 vs 脊髓丘脑束：三级传导对照</text>
  <text x="880" y="192" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="700">背柱-内侧丘系（Aβ）</text>
  <text x="1210" y="192" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="700">脊髓丘脑束（Aδ / C）</text>
  <rect x="740" y="208" width="280" height="48" rx="7" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="880" y="229" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="500">经后角内侧入同侧后索</text>
  <line x1="880" y1="256" x2="880" y2="266" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="740" y="266" width="280" height="48" rx="7" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="880" y="287" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="500">薄束（下半身）/ 楔束（上半身）</text>
  <line x1="880" y1="314" x2="880" y2="324" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="740" y="324" width="280" height="48" rx="7" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="880" y="345" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="500">延髓薄束核 / 楔束核换元</text>
  <line x1="880" y1="372" x2="880" y2="382" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="740" y="382" width="280" height="48" rx="7" fill="#ccfbf1" fill-opacity="0.7" stroke="#0f766e" stroke-width="2"/>
  <text x="880" y="403" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">二级纤维经中央管腹侧交叉</text>
  <text x="880" y="419" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">← 交叉平面在延髓</text>
  <line x1="880" y1="430" x2="880" y2="440" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="740" y="440" width="280" height="48" rx="7" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="880" y="461" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="500">内侧丘系 → 丘脑 VPL → 中央后回</text>
  <rect x="1070" y="208" width="280" height="48" rx="7" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1210" y="229" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="500">经后角外侧入 Lissauer 束</text>
  <line x1="1210" y1="256" x2="1210" y2="266" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="1070" y="266" width="280" height="48" rx="7" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1210" y="287" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="500">入髓 1–2 节段内后角换元</text>
  <line x1="1210" y1="314" x2="1210" y2="324" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="1070" y="324" width="280" height="48" rx="7" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1210" y="345" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="500">（第 I、V 层及胶状质）</text>
  <line x1="1210" y1="372" x2="1210" y2="382" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="1070" y="382" width="280" height="48" rx="7" fill="#fee2e2" fill-opacity="0.6" stroke="#dc2626" stroke-width="2"/>
  <text x="1210" y="403" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">经前连合交叉至对侧</text>
  <text x="1210" y="419" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">← 交叉在脊髓内完成</text>
  <line x1="1210" y1="430" x2="1210" y2="440" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="1070" y="440" width="280" height="48" rx="7" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1210" y="461" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="500">外侧索（痛温）/ 前索（粗触）→ VPL</text>
  <text x="740" y="522" font-size="10.5" fill="#475569">对照记忆两条通路的交叉平面，是解析分离性感觉障碍的钥匙：后索损伤（脊髓痨）</text>
  <text x="740" y="537" font-size="10.5" fill="#475569">→ 同侧损伤平面以下分辨性触觉与本体觉丧失，闭目难立征阳性。</text>
  <rect x="30" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、分离性感觉障碍：交叉平面不同的临床后果</text>
  <rect x="60" y="648" width="300" height="210" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.6"/>
  <text x="76" y="674" font-size="13" fill="#dc2626" font-weight="700">Brown-Séquard 综合征</text>
  <text x="76" y="694" font-size="10.5" fill="#64748b">（一侧脊髓半切）</text>
  <text x="76" y="720" font-size="11" fill="#475569">· 对侧：痛觉、温觉障碍</text>
  <text x="76" y="737" font-size="11" fill="#475569">（脊髓丘脑束已在脊髓内交叉）</text>
  <text x="76" y="772" font-size="11" fill="#475569">· 同侧：分辨性触觉与本体觉障碍（后索交叉在延髓，</text>
  <text x="76" y="789" font-size="11" fill="#475569">半切时尚未交叉）</text>
  <text x="76" y="824" font-size="11" fill="#475569">· 同侧运动麻痹（皮质脊髓束）</text>
  <rect x="390" y="648" width="300" height="210" rx="9" fill="#fce7f3" fill-opacity="0.4" stroke="#be185d" stroke-width="1.6"/>
  <text x="406" y="674" font-size="13" fill="#831843" font-weight="700">脊髓空洞症</text>
  <text x="406" y="694" font-size="10.5" fill="#64748b">（中央管扩大）</text>
  <text x="406" y="720" font-size="11" fill="#475569">中央管扩大先破坏刚经前连合交叉的痛温纤维：</text>
  <text x="406" y="737" font-size="11" fill="#475569">出现节段性的痛温觉分离性丧失（痛温觉丧失、</text>
  <text x="406" y="754" font-size="11" fill="#475569">触觉保留），「不痛不烫却摸得着」。</text>
  <text x="390" y="892" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">交叉平面差一个节段，临床表现截然不同</text>
  <rect x="710" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="600.84" font-size="19" fill="#475569" font-weight="700">四、最后驿站与皮层分工：体感小人</text>
  <rect x="740" y="648" width="300" height="96" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.6"/>
  <text x="756" y="674" font-size="13" fill="#075985" font-weight="700">丘脑腹后核：门控驿站</text>
  <text x="756" y="698" font-size="11" fill="#475569">VPL 接躯干四肢、VPM 接头面部（三叉系）；</text>
  <text x="756" y="714" font-size="11" fill="#475569">具门控功能，是感觉进入意识的最后一道闸门。</text>
  <rect x="1070" y="648" width="270" height="96" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1086" y="674" font-size="13" fill="#134e4a" font-weight="700">S1 四分区（中央后回）</text>
  <text x="1086" y="698" font-size="11" fill="#475569">3a 本体觉 · 3b 触压觉 · 1 快适应 · 2 关节觉与纹理，</text>
  <text x="1086" y="714" font-size="11" fill="#475569">经内囊后肢投射。</text>
  <text x="980" y="782" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">体感小人：各区面积与感觉分辨力成正比</text>
  <rect x="770" y="810" width="52" height="96" rx="5" fill="#ccfbf1" fill-opacity="0.7" stroke="#0f766e" stroke-width="1.6"/>
  <text x="796" y="926" font-size="10.5" fill="#475569" text-anchor="middle">手/唇</text>
  <rect x="856" y="846" width="52" height="60" rx="5" fill="#ccfbf1" fill-opacity="0.7" stroke="#0f766e" stroke-width="1.6"/>
  <text x="882" y="926" font-size="10.5" fill="#475569" text-anchor="middle">舌</text>
  <rect x="942" y="866" width="52" height="40" rx="5" fill="#ccfbf1" fill-opacity="0.7" stroke="#0f766e" stroke-width="1.6"/>
  <text x="968" y="926" font-size="10.5" fill="#475569" text-anchor="middle">面</text>
  <rect x="1028" y="882" width="52" height="24" rx="5" fill="#ccfbf1" fill-opacity="0.7" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1054" y="926" font-size="10.5" fill="#475569" text-anchor="middle">躯干</text>
  <rect x="1114" y="872" width="52" height="34" rx="5" fill="#ccfbf1" fill-opacity="0.7" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1140" y="926" font-size="10.5" fill="#475569" text-anchor="middle">腿/足</text>
  <line x1="740" y1="906" x2="1330" y2="906" stroke="#475569" stroke-width="2"/>
  <text x="740" y="952" font-size="10.5" fill="#64748b">指尖两点辨别最锐、背部最钝——代表区可随经验与训练重塑（弦乐手的左手代表区扩大）。</text>
</svg>