<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">膜弹性理论：弯曲刚度与 Helfrich 能量</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">KA ≈ 0.1–0.3 N/m（拉大 2–3% 即破裂）；κ ≈ 10–25 k_BT；E = ∫[(κ/2)(2H−C₀)² + κ̄K + σ]dA；成球 8πκ ≈ 500 k_BT，膜管 E ≈ 2πκ·L/r + πσr²</text>
  <rect x="30" y="132" width="1340" height="288" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、流体膜弹性的三个层次：拉伸（面积）、剪切（无阻力）与弯曲（曲率）</text>
  <g><circle cx="150" cy="196" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="150" y1="200" x2="150" y2="206" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="150" cy="210" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="174" cy="196" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="174" y1="200" x2="174" y2="206" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="174" cy="210" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="198" cy="196" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="198" y1="200" x2="198" y2="206" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="198" cy="210" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="222" cy="196" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="222" y1="200" x2="222" y2="206" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="222" cy="210" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="246" cy="196" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="246" y1="200" x2="246" y2="206" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="246" cy="210" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="270" cy="196" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="270" y1="200" x2="270" y2="206" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="270" cy="210" r="5.5" fill="#0f766e" fill-opacity="0.85"/></g>
  <line x1="162" y1="203" x2="108" y2="203" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="262" y1="203" x2="316" y2="203" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="230" y="258" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">拉伸：面积改变</text>
  <text x="125" y="282" font-size="10.5" fill="#475569">面积压缩模量 KA ≈ 0.1–0.3 N/m；</text>
  <text x="125" y="296" font-size="10.5" fill="#475569">纯脂双层拉大面积 2–3% 即破裂。</text>
  <g><circle cx="372" cy="186" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="372" y1="190" x2="372" y2="195" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="372" cy="199" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="396" cy="186" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="396" y1="190" x2="396" y2="195" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="396" cy="199" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="420" cy="186" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="420" y1="190" x2="420" y2="195" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="420" cy="199" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="444" cy="186" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="444" y1="190" x2="444" y2="195" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="444" cy="199" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="468" cy="186" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="468" y1="190" x2="468" y2="195" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="468" cy="199" r="5.5" fill="#0369a1" fill-opacity="0.85"/></g>
  <g><circle cx="352" cy="230" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="352" y1="234" x2="352" y2="239" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="352" cy="243" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="376" cy="230" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="376" y1="234" x2="376" y2="239" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="376" cy="243" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="400" cy="230" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="400" y1="234" x2="400" y2="239" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="400" cy="243" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="424" cy="230" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="424" y1="234" x2="424" y2="239" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="424" cy="243" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="448" cy="230" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="448" y1="234" x2="448" y2="239" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="448" cy="243" r="5.5" fill="#0369a1" fill-opacity="0.85"/></g>
  <line x1="490" y1="192" x2="542" y2="192" stroke="#075985" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="472" y1="236" x2="420" y2="236" stroke="#075985" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="460" y="262" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">剪切：流体膜无阻力</text>
  <text x="348" y="286" font-size="10.5" fill="#475569">双层是二维流体（μ ≈ 0）；</text>
  <text x="348" y="300" font-size="10.5" fill="#475569">红细胞另靠膜下血影蛋白网架获得剪切刚度。</text>
  <path d="M 690,252 Q 820,156 950,252" fill="none" opacity="0.85" stroke="#0f766e" stroke-width="3"/>
  <path d="M 690,264 Q 820,168 950,264" fill="none" opacity="0.85" stroke="#0f766e" stroke-width="3"/>
  <line x1="690" y1="252" x2="950" y2="252" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="820" y="232" font-size="11" fill="#64748b" text-anchor="middle">2H</text>
  <text x="820" y="290" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">弯曲：曲率改变</text>
  <text x="700" y="312" font-size="10.5" fill="#475569">弯曲刚度 κ，</text>
  <text x="700" y="326" font-size="10.5" fill="#475569">弯曲能 ∝ (2H − C₀)²——Helfrich 能量的主角（下）</text>
  <text x="700" y="340" font-size="10.5" fill="#475569">。</text>
  <rect x="1000" y="176" width="356" height="228" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="1020" y="204" font-size="13.5" fill="#075985" font-weight="700">面积弹性：膜几乎不可压</text>
  <circle cx="1028" cy="234" r="4" fill="#0369a1"/>
  <text x="1040" y="238" font-size="11.5" fill="#1e293b" font-weight="700">生理张力仅 ~0.01 mN/m 量级</text>
  <text x="1040" y="258" font-size="10.5" fill="#475569">该张力下面积变化通常不足 1%</text>
  <circle cx="1028" cy="318" r="4" fill="#0369a1"/>
  <text x="1040" y="322" font-size="11.5" fill="#1e293b" font-weight="700">变形不靠拉伸，靠折叠</text>
  <text x="1040" y="342" font-size="10.5" fill="#475569">细胞用「多余的膜」储备应对形状改变</text>
  <rect x="30" y="444" width="1340" height="316" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="466.84" font-size="19" fill="#475569" font-weight="700">二、Helfrich 弯曲能量（1973）：稳态形状 = 泛函在面积/体积约束下的极小化</text>
  <text x="118" y="512" font-size="22" fill="#1e293b" font-weight="700">E = ∫ [</text>
  <text x="360" y="512" font-size="22" fill="#0f766e" text-anchor="middle" font-weight="700">(κ/2)·(2H − C₀)²</text>
  <text x="478" y="512" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">+</text>
  <text x="545" y="512" font-size="22" fill="#6d28d9" text-anchor="middle" font-weight="700">κ̄·K</text>
  <text x="612" y="512" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="700">+</text>
  <text x="662" y="512" font-size="22" fill="#0369a1" text-anchor="middle" font-weight="700">σ</text>
  <text x="700" y="512" font-size="22" fill="#1e293b" font-weight="700">] dA</text>
  <path d="M 255,539 Q 255,530 264,530 M 456,530 Q 465,530 465,539" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="264" y1="530" x2="456" y2="530" stroke="#64748b" stroke-width="1.7"/>
  <text x="360" y="554" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">平均曲率项：形状主力</text>
  <path d="M 513,539 Q 513,530 522,530 M 568,530 Q 577,530 577,539" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="522" y1="530" x2="568" y2="530" stroke="#64748b" stroke-width="1.7"/>
  <text x="545" y="554" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">高斯曲率项</text>
  <path d="M 634,539 Q 634,530 643,530 M 681,530 Q 690,530 690,539" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="643" y1="530" x2="681" y2="530" stroke="#64748b" stroke-width="1.7"/>
  <text x="662" y="554" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">张力项</text>
  <text x="118" y="580" font-size="10.5" fill="#64748b">H：平均曲率（球面 H = 1/R，圆柱 H = 1/(2R)）；K：高斯曲率；C₀：自发曲率；κ：弯曲刚度；κ̄：高斯模量；σ：膜张力</text>
  <rect x="780" y="470" width="576" height="122" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="800" y="494" font-size="13.5" fill="#134e4a" font-weight="700">弯曲刚度 κ 的量级</text>
  <circle cx="808" cy="517" r="3.5" fill="#0f766e"/>
  <text x="820" y="521" font-size="11" fill="#475569">流体磷脂双层 κ ≈ 10–25 k_BT（约 0.4–1 × 10⁻¹⁹ J）</text>
  <circle cx="808" cy="541" r="3.5" fill="#0f766e"/>
  <text x="820" y="545" font-size="11" fill="#475569">连续介质理论：κ ~ KA·h² / 常数（h 为膜厚）</text>
  <circle cx="808" cy="565" r="3.5" fill="#0f766e"/>
  <text x="820" y="569" font-size="11" fill="#475569">室温 k_BT ≈ 4.1 × 10⁻²¹ J——热运动恰能激起显著弯曲涨落，膜「软而不垮」</text>
  <line x1="100" y1="648" x2="290" y2="648" stroke="#0f766e" stroke-width="3.5"/>
  <line x1="100" y1="660" x2="290" y2="660" stroke="#0f766e" stroke-width="3.5"/>
  <text x="195" y="700" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">平面：H = 0</text>
  <circle cx="440" cy="650" r="28" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.2"/>
  <line x1="440" y1="650" x2="462" y2="630" stroke="#be185d" stroke-width="1.8" marker-end="url(#arr-enz)"/>
  <text x="470" y="626" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">R</text>
  <text x="440" y="700" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">球面：H = 1/R</text>
  <ellipse cx="640" cy="650" rx="12" ry="26" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <rect x="640" y="624" width="80" height="52" fill="#e0f2fe" stroke="none"/>
  <line x1="640" y1="624" x2="640" y2="676" stroke="#0369a1" stroke-width="2"/>
  <line x1="720" y1="624" x2="720" y2="676" stroke="#0369a1" stroke-width="2"/>
  <ellipse cx="720" cy="650" rx="12" ry="26" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <line x1="690" y1="650" x2="690" y2="626" stroke="#be185d" stroke-width="1.8" marker-end="url(#arr-enz)"/>
  <text x="698" y="620" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">R</text>
  <text x="680" y="700" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">圆柱：H = 1/(2R)</text>
  <rect x="800" y="606" width="556" height="134" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="820" y="632" font-size="13.5" fill="#4c1d95" font-weight="700">自发曲率 C₀ 的来源</text>
  <text x="820" y="656" font-size="10.5" fill="#475569">① 膜两侧成分不对称——如仅在胞质单层插入锥形脂；② 嵌入蛋白挤压一侧单层。红细胞双凹碟形、出芽、</text>
  <text x="820" y="671" font-size="10.5" fill="#475569">纳米管等稳态形状，都是 Helfrich 能量在给定面积与体积约束下的极小化结果。</text>
  <rect x="30" y="784" width="1340" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="806.84" font-size="19" fill="#475569" font-weight="700">三、尺度分析：从公式到细胞器形态</text>
  <rect x="50" y="820" width="410" height="115" rx="8" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="108" cy="878" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="108" y="882" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">8πκ</text>
  <text x="146" y="843" font-size="12" fill="#dc2626" font-weight="700">弯成完整球壳：8πκ ≈ 500 k_BT</text>
  <text x="146" y="865" font-size="10" fill="#475569">κ = 20 k_BT 的膜弯成球壳约需 500 k_BT——热涨落远不足以自发成球，</text>
  <text x="146" y="878.5" font-size="10" fill="#475569">而 ATP 驱动的蛋白机器（发动蛋白 dynamin）可轻松支付。</text>
  <rect x="480" y="820" width="410" height="115" rx="8" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="500" y1="905" x2="590" y2="905" stroke="#0f766e" stroke-width="3.5"/>
  <line x1="500" y1="916" x2="590" y2="916" stroke="#0f766e" stroke-width="3.5"/>
  <line x1="528" y1="905" x2="528" y2="848" stroke="#0f766e" stroke-width="2.2"/>
  <line x1="542" y1="905" x2="542" y2="848" stroke="#0f766e" stroke-width="2.2"/>
  <path d="M 528,848 A 7 7 0 0 1 542,848" fill="none" stroke="#0f766e" stroke-width="2.2"/>
  <text x="556" y="838" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">r, L</text>
  <text x="600" y="843" font-size="12" fill="#134e4a" font-weight="700">拉出膜管：E ≈ 2πκ·L/r + πσr²</text>
  <text x="600" y="865" font-size="10" fill="#475569">半径 r、</text>
  <text x="600" y="878.5" font-size="10" fill="#475569">长度 L 的膜管能量——马达拖拽膜管实验正是由此测定 κ 与 σ 的经典方法。</text>
  <rect x="910" y="820" width="440" height="115" rx="8" fill="#ede9fe" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1.2"/>
  <circle cx="952" cy="868" r="12" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/>
  <circle cx="978" cy="868" r="12" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/>
  <line x1="998" y1="868" x2="1026" y2="868" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <circle cx="1052" cy="868" r="19" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="1092" y="843" font-size="12" fill="#4c1d95" font-weight="700">高斯曲率项（Gauss–Bonnet）</text>
  <text x="1092" y="865" font-size="10" fill="#475569">拓扑不变时 κ̄·K 项为常数；仅在膜的融合、断裂</text>
  <text x="1092" y="878.5" font-size="10" fill="#475569">（拓扑数改变）事件中起作用。</text>
  <text x="50" y="960" font-size="10.5" fill="#64748b">膜弹性理论把细胞器的形态学——内质网的三维网络、高尔基体的层堆、线粒体嵴——变成可计算的力学问题，是定量细胞生物学的支柱之一。</text>
</svg>