  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">细胞学说与细胞的统一性</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">1665 Hooke 命名细胞、1838–1839 Schleiden 与 Schwann 建立学说、1855 Virchow 补「细胞来自细胞」；一切细胞共享 DNA–RNA–蛋白质体系、ATP、磷脂双层与通用密码</text>
  <rect x="30" y="132" width="1340" height="214" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、从细胞的发现到细胞学说（1665—1855）</text>
  <line x1="130" y1="262" x2="1330" y2="262" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="154" cy="262" r="6.5" fill="#0369a1"/>
  <line x1="154" y1="253" x2="154" y2="232" stroke="#0369a1" stroke-width="1.7"/>
  <text x="154" y="212" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1665 Hooke</text>
  <text x="154" y="192" font-size="12" fill="#64748b" text-anchor="middle">软木「小室」命名 cell</text>
  <circle cx="370" cy="262" r="6.5" fill="#0369a1"/>
  <line x1="370" y1="271" x2="370" y2="292" stroke="#0369a1" stroke-width="1.7"/>
  <text x="370" y="312" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Leeuwenhoek</text>
  <text x="370" y="332" font-size="12" fill="#64748b" text-anchor="middle">首次观察到活细胞</text>
  <circle cx="706" cy="262" r="6.5" fill="#0f766e"/>
  <line x1="706" y1="253" x2="706" y2="232" stroke="#0f766e" stroke-width="1.7"/>
  <text x="706" y="212" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1838–39 学说建立</text>
  <text x="706" y="192" font-size="12" fill="#64748b" text-anchor="middle">Schleiden＋Schwann</text>
  <circle cx="994" cy="262" r="6.5" fill="#0f766e"/>
  <line x1="994" y1="271" x2="994" y2="292" stroke="#0f766e" stroke-width="1.7"/>
  <text x="994" y="312" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1855 Virchow</text>
  <text x="994" y="332" font-size="12" fill="#64748b" text-anchor="middle">细胞来自细胞</text>
  <circle cx="1270" cy="262" r="6.5" fill="#6d28d9"/>
  <line x1="1270" y1="253" x2="1270" y2="232" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="1270" y="212" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">三大发现之一</text>
  <text x="1270" y="192" font-size="12" fill="#64748b" text-anchor="middle">与进化论、遗传定律并称</text>
  <rect x="30" y="366" width="430" height="282" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="388.84" font-size="19" fill="#475569" font-weight="700">二、细胞学说三大要点</text>
  <circle cx="62" cy="418" r="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="62" y="423" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">1</text>
  <text x="88" y="424" font-size="13.5" fill="#1e293b" font-weight="700">结构与功能的基本单位</text>
  <text x="88" y="444" font-size="11.5" fill="#475569">多细胞生物由细胞及其产物构成</text>
  <circle cx="62" cy="482" r="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="62" y="487" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">2</text>
  <text x="88" y="488" font-size="13.5" fill="#1e293b" font-weight="700">生命活动的基本单位</text>
  <text x="88" y="508" font-size="11.5" fill="#475569">代谢、生长、增殖、遗传与应激以细胞为独立单元</text>
  <circle cx="62" cy="546" r="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="62" y="551" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">3</text>
  <text x="88" y="552" font-size="13.5" fill="#1e293b" font-weight="700">新细胞来自已存在细胞</text>
  <text x="88" y="572" font-size="11.5" fill="#475569">Virchow（1855）：omnis cellula e cellula</text>
  <text x="56" y="620" font-size="11.5" fill="#64748b">细胞学说将生物学研究的焦点从组织器官聚焦到细胞，</text>
  <text x="56" y="636" font-size="11.5" fill="#64748b">是现代生物学的基石。</text>
  <rect x="480" y="366" width="890" height="282" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="496" y="388.84" font-size="19" fill="#475569" font-weight="700">三、细胞的统一性：一切细胞共享同一套分子装置</text>
