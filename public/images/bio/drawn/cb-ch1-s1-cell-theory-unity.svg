  <text x="548" y="588" font-size="11" fill="#475569">一切细胞均以 ATP 为能量流通货币</text>
  <rect x="812" y="528" width="262" height="88" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="943" y="560" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">磷脂双分子层</text>
  <text x="830" y="588" font-size="11" fill="#475569">一切生物膜以磷脂双层为基本骨架</text>
  <rect x="1094" y="528" width="262" height="88" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1225" y="560" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">通用遗传密码</text>
  <text x="1112" y="588" font-size="11" fill="#475569">密码几乎完全通用——源自共同祖先</text>
