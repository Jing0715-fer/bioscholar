  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">病毒转化与致瘤：检查站沦陷、原癌基因与炎症致癌</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">E6经E6AP降解p53并激活端粒酶、E7降解Rb；1976年Bishop与Varmus证明v-src源自细胞（1989诺奖）；LMP1模拟CD40持续点燃NF-κB；约12%人类癌症归因感染</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、检查站的沦陷：Rb 与 p53 双双失守</text>
  <circle cx="200" cy="240" r="30" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="200" y="245" font-size="15" fill="#134e4a" text-anchor="middle" font-weight="700">Rb</text>
  <circle cx="440" cy="240" r="30" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="440" y="245" font-size="15" fill="#4c1d95" text-anchor="middle" font-weight="700">p53</text>
  <text x="200" y="290" font-size="10" fill="#475569" text-anchor="middle">E2F 被 Rb 扣押 → 周期刹车</text>
  <text x="440" y="290" font-size="10" fill="#475569" text-anchor="middle">DNA 损伤哨兵 → 凋亡／修复</text>
  <rect x="134.88" y="347.075" width="130.24" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="359.78" font-size="10.5" fill="#dc2626" text-anchor="middle">E7（高危 HPV）降解 Rb</text>
  <line x1="200" y1="334" x2="200" y2="274" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="410.76" y="347.075" width="118.47999999999999" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="470" y="359.78" font-size="10.5" fill="#dc2626" text-anchor="middle">E6 经 E6AP 降解 p53</text>
  <line x1="470" y1="334" x2="456" y2="272" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="470" y="400" font-size="10" fill="#475569" text-anchor="middle">并激活端粒酶 → 永生化</text>
  <text x="50" y="452" font-size="11" fill="#475569">SV40 大 T 抗原同时扣留 Rb 与 p53、小 t 解除 PP2A 刹车；腺病毒以 E1A（Rb）＋E1B-55K／19K（p53／凋亡）</text>
  <text x="50" y="468" font-size="11" fill="#475569">分工同一逻辑。</text>
  <text x="50" y="496" font-size="11" fill="#64748b">宫颈癌几乎全部检出 HPV DNA——E6／E7 是高危型的「驾驶证」。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、癌基因的病毒之窗：v-src 的细胞起源</text>
  <rect x="740" y="200" width="250" height="40" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="865" y="224" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">正常鸡基因组：c-src</text>
  <line x1="1000" y1="220" x2="1060" y2="220" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <text x="1030" y="204" font-size="9.5" fill="#831843" text-anchor="middle">偶然捕获</text>
  <rect x="1064" y="200" width="270" height="40" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1199" y="218" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">禽肉瘤病毒：v-src</text>
  <text x="1199" y="234" font-size="9.5" fill="#475569" text-anchor="middle">失去调控的酪氨酸激酶</text>
  <text x="740" y="286" font-size="11" fill="#475569">1976 年 Bishop 与 Varmus 的杂交实验证明 v-src 序列本就存在于正常鸡基因组——原癌基因概念确立：</text>
  <text x="740" y="302" font-size="11" fill="#475569">癌症的范式从「病毒带来什么」翻转为「细胞丢失了什么」（1989 年诺贝尔奖）。</text>
  <text x="740" y="372" font-size="12" fill="#1e293b" font-weight="700">插入活化：</text>
