  <text x="955" y="384" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">前病毒</text>
  <rect x="1090" y="372" width="60" height="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1120" y="384" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">c-myc</text>
  <line x1="990" y1="360" x2="1090" y2="360" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <text x="1040" y="346" font-size="9.5" fill="#dc2626" text-anchor="middle">顺式激活</text>
  <text x="740" y="424" font-size="10.5" fill="#475569">禽白血病病毒把前病毒插到 c-myc 旁顺式激活——不带癌基因的逆转录病毒也能致癌。</text>
  <text x="740" y="464" font-size="10.5" fill="#64748b">转导（带基因）与插入（插基因）是逆转录病毒致癌的两条路。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、LMP1 以假乱真与炎症-再生循环</text>
  <circle cx="180" cy="700" r="34" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="180" y="704" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">LMP1</text>
  <line x1="218" y1="700" x2="268" y2="700" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#arr-pro)"/>
  <text x="243" y="684" font-size="9.5" fill="#64748b" text-anchor="middle">模拟</text>
  <circle cx="300" cy="700" r="34" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="300" y="704" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">CD40</text>
  <line x1="336" y1="700" x2="400" y2="700" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="368" y="684" font-size="9.5" fill="#dc2626" text-anchor="middle">组成性</text>
  <rect x="404" y="676" width="210" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="509" y="696" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">NF-κB 持续点燃</text>
  <text x="509" y="714" font-size="9.5" fill="#475569" text-anchor="middle">B 细胞增殖不刹车</text>
  <text x="50" y="762" font-size="11" fill="#475569">EB 病毒 LMP1 模拟「已收到 T 细胞救援信号」的 CD40——无需配体、永不断电的假开关。</text>
  <text x="50" y="810" font-size="12" fill="#1e293b" font-weight="700">HBV／HCV：慢性炎症—再生循环致癌</text>
  <rect x="90" y="836.65" width="60" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="120" y="849.96" font-size="11" fill="#78350f" text-anchor="middle">慢性炎症</text>
  <line x1="190" y1="846" x2="230" y2="846" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-warn)"/>
  <rect x="238.5" y="836.65" width="115" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="296" y="849.96" font-size="11" fill="#78350f" text-anchor="middle">肝细胞反复坏死再生</text>
  <line x1="396" y1="846" x2="436" y2="846" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <rect x="475" y="836.65" width="82" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="516" y="849.96" font-size="11" fill="#dc2626" text-anchor="middle">突变累积成癌</text>
  <text x="50" y="892" font-size="11" fill="#64748b">乙肝疫苗使儿童肝癌发病率下降约七成——防感染即防癌的最好例证。</text>
  <rect x="710" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="608.84" font-size="19" fill="#475569" font-weight="700">四、肿瘤病毒学简史与感染归因</text>
