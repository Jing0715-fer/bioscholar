  <text x="262" y="232" font-size="9.5" fill="#075985">Glu</text>
  <line x1="280" y1="272" x2="558" y2="272" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="380" y="262" font-size="10" fill="#991b1b" font-weight="700">直接通路：D1-GABA 抑制 GPi</text>
  <line x1="190" y1="304" x2="190" y2="358" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="206" y="336" font-size="9" fill="#991b1b">GABA</text>
