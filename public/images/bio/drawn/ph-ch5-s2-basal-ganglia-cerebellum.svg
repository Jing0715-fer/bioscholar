  <text x="580" y="340" font-size="9.5" fill="#065f46">Glu</text>
  <line x1="635" y1="258" x2="635" y2="218" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="648" y="242" font-size="9" fill="#991b1b">GABA</text>
  <line x1="558" y1="196" x2="412" y2="196" stroke="#059669" stroke-width="2" marker-end="url(#arr-ok)"/>
  <text x="480" y="188" font-size="10" fill="#065f46" font-weight="700">兴奋皮层运动区（Go）</text>
  <line x1="310" y1="376" x2="184" y2="308" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <line x1="336" y1="376" x2="258" y2="308" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <text x="172" y="322" font-size="12" fill="#991b1b" font-weight="700">−</text>
  <text x="262" y="322" font-size="12" fill="#065f46" font-weight="700">+</text>
  <text x="268" y="352" font-size="10" fill="#78350f" font-weight="700">DA：D1(+) · D2(−)</text>
  <text x="50" y="470" font-size="10.5" fill="#475569">直接通路：纹状体 D1 抑制 GPi → 丘脑去抑制 → 皮层兴奋（运动易化）；间接通路：D2 抑制 GPe → STN 解除抑制 → GPi 增强对丘脑的抑制（NoGo）</text>
  <rect x="88.45442499999999" y="513.075" width="323.09115" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="525.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">帕金森病：SNc 多巴胺神经元退变 → 运动减少·僵直·静止性震颤</text>
  <rect x="453.162825" y="513.075" width="293.67435000000006" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="525.78" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">亨廷顿病：纹状体间接通路神经元退变 → 舞蹈样运动过多</text>
  <rect x="840" y="132" width="530" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="856" y="154.84" font-size="19" fill="#475569" font-weight="700">二、小脑三个功能分区</text>
  <rect x="856" y="186" width="118" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="915" y="213.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">分区（结构）</text>
  <rect x="974" y="186" width="108" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1028" y="213.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">主要连接</text>
