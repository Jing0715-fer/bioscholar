  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">基底节与小脑：运动的筛选、放大与误差校正</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">直接通路D1-Go与间接通路D2-NoGo相互拮抗，黑质多巴胺同时兴奋前者（D1）、抑制后者（D2）；小脑颗粒细胞约690亿，浦肯野细胞为唯一皮层输出</text>
  <rect x="30" y="132" width="790" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、基底节回路：直接通路 Go 与间接通路 NoGo</text>
  <rect x="240" y="176" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="325" y="200" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">大脑皮层（Glu）</text>
  <rect x="120" y="260" width="160" height="44" rx="8" fill="#ede9fe" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="200" y="286" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">纹状体</text>
  <text x="200" y="300" font-size="8.5" fill="#64748b" text-anchor="middle">D1（直接）· D2（间接）</text>
  <rect x="560" y="260" width="150" height="44" rx="8" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="635" y="286" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">GPi / SNr（输出）</text>
  <rect x="560" y="176" width="150" height="40" rx="8" fill="#d1fae5" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="635" y="200" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">丘脑 VA/VL</text>
  <rect x="120" y="360" width="130" height="40" rx="8" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="185" y="384" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">GPe</text>
