  <text x="1151" y="213.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">功能</text>
  <rect x="1220" y="186" width="134" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1287" y="213.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">损伤表现</text>
  <rect x="856" y="230" width="118" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="915" y="261.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">前庭小脑（绒球小结叶）</text>
  <rect x="974" y="230" width="108" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1028" y="261.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">前庭神经核</text>
  <rect x="1082" y="230" width="138" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1151" y="261.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">平衡与眼动（前庭-眼反射）</text>
  <rect x="1220" y="230" width="134" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1287" y="261.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">眩晕、眼震、躯干共济失调</text>
  <rect x="856" y="282" width="498" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="856" y="282" width="118" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="915" y="313.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">脊髓小脑（蚓部+中间）</text>
  <rect x="974" y="282" width="108" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1028" y="313.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">脊髓上/下行</text>
  <rect x="1082" y="282" width="138" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1151" y="313.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">监控进行中运动、步态</text>
  <rect x="1220" y="282" width="134" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1287" y="313.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">共济失调、肌张力低下</text>
  <rect x="856" y="334" width="118" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="915" y="365.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">大脑小脑（半球外侧）</text>
  <rect x="974" y="334" width="108" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1028" y="365.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">皮层-脑桥-齿状核</text>
  <rect x="1082" y="334" width="138" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1151" y="365.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">运动计划、时序与灵巧动作</text>
  <rect x="1220" y="334" width="134" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1287" y="365.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">意向性震颤、轮替不能</text>
  <text x="856" y="404" font-size="10.5" fill="#475569">小脑不直接发起运动，而是比较「意图」与「实际执行」，</text>
  <text x="856" y="422" font-size="10.5" fill="#475569">经丘脑-皮层与红核通路输出校正——运动的误差校正引擎</text>
  <text x="856" y="448" font-size="10.5" fill="#475569">传出对应：前庭小脑 → 前庭核；脊髓小脑 → 快核与间置核；</text>
  <text x="856" y="466" font-size="10.5" fill="#475569">大脑小脑 → 齿状核 → 丘脑 VA/VL → 皮层运动区</text>
  <rect x="983.665" y="503.075" width="212.67000000000002" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1090" y="515.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">小脑损伤不影响肌力，只损害协调与时序</text>
  <rect x="30" y="584" width="1340" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="606.84" font-size="19" fill="#475569" font-weight="700">三、小脑皮层微回路：苔藓/攀缘纤维—浦肯野细胞误差校正</text>
  <rect x="94.42204999999997" y="671.075" width="211.15590000000006" height="17.849999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="200" y="683.78" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">平行纤维-浦肯野突触的 LTD = 运动学习</text>
  <line x1="60" y1="856" x2="96" y2="892" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="60" y="846" font-size="10.5" fill="#075985" font-weight="700">苔藓纤维（多源兴奋）</text>
