  <text x="430" y="893" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">深部核团</text>
  <path d="M590,905 C584.3,898.8 552.7,878.8 556,868 C559.3,857.2 610.0,849.3 610,840 C610.0,830.7 571.3,819.3 556,812 C540.7,804.7 526.5,801.7 518,796 C509.5,790.3 507.2,781.0 505,778" fill="none" stroke="#b45309" stroke-width="2.2"/>
  <ellipse cx="606" cy="922" rx="40" ry="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="606" y="958" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">下橄榄核</text>
  <text x="620" y="846" font-size="10.5" fill="#78350f" font-weight="700">攀缘纤维（1:1 强兴奋）</text>
  <text x="620" y="874" font-size="10.5" fill="#78350f">复杂放电 = 错误/教学信号</text>
  <text x="720" y="630" font-size="10.5" fill="#475569">苔藓纤维：携带运动指令副本（经脑桥）与感觉信息，经颗粒细胞-平行纤维以高频简单放电驱动浦肯野细胞</text>
  <text x="720" y="672" font-size="10.5" fill="#475569">攀缘纤维：发自下橄榄核，每个浦肯野细胞仅接收 1 条，强去极化触发复杂放电（约 1 次/秒）——作为误差教学信号</text>
  <text x="720" y="714" font-size="10.5" fill="#475569">两者同时激活 → 平行纤维-浦肯野突触长时程抑制（LTD）：下调造成误差的输入权重——小脑运动学习的细胞基础</text>
  <text x="720" y="756" font-size="10.5" fill="#475569">浦肯野细胞是小脑皮层唯一输出（GABA，抑制深部核团）；深部核团为小脑唯一传出（兴奋性）</text>
  <rect x="863.27485" y="803.075" width="273.45029999999997" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1000" y="815.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">人小脑：颗粒细胞约 690 亿、浦肯野细胞约 1500 万</text>
  <text x="720" y="866" font-size="10.5" fill="#475569">前庭-眼反射的适应性增益调节、兔眨眼条件反射与技能习得（乐器、骑行）均为该回路可塑性的经典实证</text>
</svg>