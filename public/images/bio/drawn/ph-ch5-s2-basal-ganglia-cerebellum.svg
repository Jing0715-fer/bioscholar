  <line x1="250" y1="894" x2="250" y2="860" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="300" cy="900" r="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <line x1="300" y1="894" x2="300" y2="860" stroke="#0f766e" stroke-width="1.8"/>
  <line x1="95" y1="860" x2="380" y2="860" stroke="#0f766e" stroke-width="2"/>
  <text x="250" y="850" font-size="10.5" fill="#134e4a" font-weight="700">平行纤维</text>
  <text x="100" y="940" font-size="10.5" fill="#475569">颗粒细胞（小脑神经元数量的绝大多数）</text>
  <line x1="430" y1="894" x2="430" y2="760" stroke="#6d28d9" stroke-width="2.4"/>
  <line x1="430" y1="760" x2="370" y2="720" stroke="#6d28d9" stroke-width="2"/>
