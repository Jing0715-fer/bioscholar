  <text x="1030" y="544" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">φ (°)</text>
  <text x="714" y="340" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">ψ (°)</text>
  <ellipse cx="850.1800000000001" cy="224.48000000000002" rx="58" ry="40" fill="#e0f2fe" fill-opacity="0.85" stroke="#0369a1" stroke-width="1.8"/>
  <text x="850.1800000000001" y="228.48000000000002" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">β 折叠</text>
  <ellipse cx="944.6800000000001" cy="381.92" rx="44" ry="36" fill="#ede9fe" fill-opacity="0.85" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="944.6800000000001" y="385.92" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">α 螺旋</text>
  <ellipse cx="1115.32" cy="381.92" rx="26" ry="22" fill="#fef3c7" fill-opacity="0.85" stroke="#b45309" stroke-width="1.8"/>
  <text x="1115.32" y="347.92" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">左手 α</text>
  <text x="1052" y="286" font-size="11" fill="#64748b">每个残基的构象由一对 (φ, ψ) 决定；</text>
  <text x="1052" y="302" font-size="11" fill="#64748b">肽平面刚性使多数稳定二级结构集中于 α 螺旋与 β 折叠允许区。</text>
  <text x="760" y="540" font-size="11.5" fill="#475569">书写方向：N 端（左）→ C 端（右），如 Ala-Gly-Ser</text>
  <rect x="30" y="588" width="1340" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="610.84" font-size="19" fill="#475569" font-weight="700">三、生物活性肽：γ-肽键、环肽与神经肽</text>
  <rect x="169.3773" y="620.95" width="121.2454" height="22.099999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="230" y="636.68" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">谷胱甘肽（GSH）</text>
  <text x="56" y="660" font-size="11" fill="#64748b">γ-谷氨酰-半胱氨酰-甘氨酸：第一个肽键由 Glu 的 γ-羧基形成（非 α-羧基）</text>
  <circle cx="110" cy="740" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="110" y="744" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">Glu</text>
  <circle cx="250" cy="740" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="250" y="744" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">Cys</text>
  <circle cx="380" cy="740" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="380" y="744" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">Gly</text>
  <path d="M110,720 C110,688 250,688 250,720" fill="none" stroke="#be185d" stroke-width="3"/>
  <rect x="157.56119999999999" y="673.075" width="44.8776" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="180" y="685.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">γ-肽键</text>
  <line x1="270" y1="740" x2="360" y2="740" stroke="#64748b" stroke-width="2.4"/>
  <text x="250" y="782" font-size="11.5" fill="#d97706" font-weight="700">–SH</text>
  <text x="56" y="822" font-size="11.5" fill="#475569">GSH ↔ GSSG：细胞内最重要的巯基抗氧化剂——清除 H₂O₂、</text>
  <text x="56" y="839" font-size="11.5" fill="#475569">维持蛋白质巯基还原态。</text>
  <rect x="598.5378000000001" y="620.95" width="202.9244" height="22.099999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="700" y="636.68" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">催产素 / 加压素（下丘脑九肽）</text>
  <circle cx="700" cy="690" r="7.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
