  <path d="M670,700 Q685,660 700,690" fill="none" stroke="#d97706" stroke-width="2.4"/>
  <text x="685" y="654" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">二硫键（—S—S—）</text>
  <text x="700" y="740" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">九肽环</text>
  <text x="560" y="822" font-size="11.5" fill="#475569">均为下丘脑合成的九肽，含二硫键环；</text>
  <text x="560" y="839" font-size="11.5" fill="#475569">肽键可被蛋白酶水解或 6 mol/L HCl 化学裂解。</text>
  <rect x="1075.135" y="620.95" width="109.73" height="22.099999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1130" y="636.68" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">更多生物活性肽</text>
  <rect x="930" y="656" width="420" height="176" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="950" y="688" font-size="12" fill="#1e293b" font-weight="700">脑啡肽 · 内啡肽</text>
  <text x="1130" y="688" font-size="11" fill="#475569">神经递质 / 神经调质</text>
  <text x="950" y="724" font-size="12" fill="#1e293b" font-weight="700">短杆菌肽 S · 缬氨霉素</text>
  <text x="1130" y="724" font-size="11" fill="#475569">微生物环肽抗菌剂</text>
  <text x="950" y="760" font-size="12" fill="#1e293b" font-weight="700">TRH（三肽）</text>
  <text x="1130" y="760" font-size="11" fill="#475569">促甲状腺素释放激素</text>
  <text x="950" y="796" font-size="12" fill="#1e293b" font-weight="700">抗利尿激素类似物</text>
  <text x="1130" y="796" font-size="11" fill="#475569">肽类激素</text>
  <text x="56" y="928" font-size="11.5" fill="#64748b">多肽按 N 端 → C 端书写；专一性裂解（蛋白酶 / 化学法）构成蛋白质一级结构测定「碎片化」策略的基础。</text>
</svg>