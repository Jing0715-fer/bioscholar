  <text x="316" y="431" font-size="9" fill="#065f46" text-anchor="middle" font-weight="700">H</text>
  <path d="M186,344 a15,15 0 1 1 22,4" fill="none" stroke="#be185d" stroke-width="1.8" marker-end="url(#arr-enz)"/>
  <text x="196" y="336" font-size="12" fill="#831843" text-anchor="middle" font-weight="700" font-style="italic">ψ</text>
  <path d="M352,352 a15,15 0 1 0 -20,8" fill="none" stroke="#be185d" stroke-width="1.8" marker-end="url(#arr-enz)"/>
  <text x="366" y="344" font-size="12" fill="#831843" text-anchor="middle" font-weight="700" font-style="italic">φ</text>
  <text x="284" y="458" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">C–N 键长 0.133 nm</text>
  <text x="56" y="496" font-size="11.5" fill="#475569">部分双键性质（介于单键 0.147 与双键 0.127 nm 之间）→ 不能自由旋转。</text>
  <text x="56" y="524" font-size="11.5" fill="#475569">构象自由度来自 Cα 两侧单键的二面角 φ 与 ψ；肽键通常反式，X-Pro 可顺式（约 6%）。</text>
  <rect x="710" y="132" width="660" height="436" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、Ramachandran 图：φ–ψ 允许区</text>
  <rect x="760" y="180" width="540" height="320" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="760" y1="420" x2="1300" y2="420" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="895" y1="500" x2="895" y2="180" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
