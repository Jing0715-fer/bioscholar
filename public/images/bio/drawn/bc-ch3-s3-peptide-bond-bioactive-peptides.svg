  <text x="176" y="378" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="700">Cα</text>
  <circle cx="246" cy="350" r="10" fill="#1e293b"/>
  <text x="246" y="354" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">C</text>
  <circle cx="316" cy="386" r="10" fill="#1e293b"/>
  <text x="316" y="390" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">N</text>
