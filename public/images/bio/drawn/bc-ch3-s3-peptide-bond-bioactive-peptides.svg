  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">肽键与生物活性肽：刚性平面与可旋转二面角</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">C–N 键 0.133 nm 的部分双键使六原子共面，构象自由度来自 φ/ψ；GSH 的 γ-肽键、催产素九肽二硫键环与环肽抗菌剂</text>
  <rect x="30" y="132" width="660" height="436" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、肽键的形成与肽平面</text>
  <rect x="56" y="176" width="190" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="151" y="198" font-size="12.5" fill="#1e293b" text-anchor="middle">H₂N–CHR₁–COOH</text>
  <text x="151" y="218" font-size="10.5" fill="#64748b" text-anchor="middle">（氨基酸 1）</text>
  <text x="266" y="202" font-size="16" fill="#475569" text-anchor="middle" font-weight="700">+</text>
  <rect x="286" y="176" width="190" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="381" y="198" font-size="12.5" fill="#1e293b" text-anchor="middle">H₂N–CHR₂–COOH</text>
  <text x="381" y="218" font-size="10.5" fill="#64748b" text-anchor="middle">（氨基酸 2）</text>
  <line x1="494" y1="202" x2="560" y2="202" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <text x="527" y="186" font-size="10.5" fill="#831843" text-anchor="middle">脱水缩合</text>
  <text x="527" y="226" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">– H₂O</text>
  <text x="56" y="262" font-size="13" fill="#1e293b" font-weight="600">H₂N–CHR₁–CO–NH–CHR₂–COOH（二肽）</text>
  <path d="M 150,283 Q 150,274 159,274 M 237,274 Q 246,274 246,283" fill="none" stroke="#be185d" stroke-width="1.7"/>
  <line x1="159" y1="274" x2="237" y2="274" stroke="#be185d" stroke-width="1.7"/>
  <text x="198" y="298" font-size="11" fill="#be185d" text-anchor="middle" font-weight="600">肽键（酰胺键）</text>
  <rect x="222" y="292" width="124" height="156" rx="6" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="284" y="284" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">肽平面：六原子共面</text>
  <line x1="176" y1="372" x2="240" y2="352" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="252" y1="348" x2="310" y2="388" stroke="#be185d" stroke-width="3.6"/>
  <line x1="322" y1="384" x2="386" y2="366" stroke="#1e293b" stroke-width="2.2"/>
