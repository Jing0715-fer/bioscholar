<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">细胞粘附分子与白细胞渗出：四大家族与四级级联</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">四大粘附家族（钙粘蛋白/选择素/整联蛋白/IgSF）；渗出级联：选择素滚动→LFA-1 激活→ICAM-1 牢固粘附→PECAM-1 穿内皮；LAD 与那他珠单抗正反印证</text>
  <rect x="30" y="132" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、四大细胞粘附分子家族</text>
  <rect x="60" y="186" width="220" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="213.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">家族</text>
  <rect x="280" y="186" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="213.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">离子依赖</text>
  <rect x="450" y="186" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="213.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">结合方式</text>
  <rect x="700" y="186" width="640" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="213.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">代表成员与功能</text>
  <rect x="60" y="230" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="250.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">钙粘蛋白（cadherin）</text>
  <rect x="280" y="230" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="250.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">Ca²⁺</text>
  <rect x="450" y="230" width="250" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="250.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">同型结合</text>
  <rect x="700" y="230" width="640" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="250.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">E-/N-/P-钙粘蛋白：上皮、神经粘合带；胚胎形态发生</text>
  <rect x="60" y="260" width="1280" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="260" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="280.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">选择素（selectin）</text>
  <rect x="280" y="260" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="280.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">Ca²⁺</text>
  <rect x="450" y="260" width="250" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="280.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">识别糖链</text>
  <rect x="700" y="260" width="640" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="280.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">P-（血小板）、E-（内皮）、L-（白细胞）选择素：白细胞滚动</text>
  <rect x="60" y="290" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="310.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">整联蛋白（integrin）</text>
  <rect x="280" y="290" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="310.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">Mg²⁺/Mn²⁺</text>
  <rect x="450" y="290" width="250" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="310.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">异型（配体 RGD 等）</text>
  <rect x="700" y="290" width="640" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="310.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">α/β 异二聚体 24 种：ECM 粘附、白细胞 LFA-1</text>
  <rect x="60" y="320" width="1280" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="320" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="340.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">免疫球蛋白超家族（IgSF）</text>
  <rect x="280" y="320" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="340.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">不依赖</text>
  <rect x="450" y="320" width="250" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="340.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">同型或异型</text>
  <rect x="700" y="320" width="640" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="340.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">ICAM-1/VCAM-1（整联蛋白配体）、NCAM（神经）、PECAM-1</text>
  <rect x="124.2775" y="357.925" width="231.445" height="16.15" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="240" y="369.42" font-size="9.5" fill="#dc2626" text-anchor="middle">E-→N-钙粘蛋白转换＝EMT 标志（肿瘤获得侵袭性）</text>
  <rect x="565.2275" y="357.925" width="229.54499999999996" height="16.15" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="680" y="369.42" font-size="9.5" fill="#78350f" text-anchor="middle">E-钙粘蛋白（CDH1）胚系突变 → 遗传性弥漫型胃癌</text>
  <rect x="1009.425" y="357.925" width="121.15" height="16.15" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1070" y="369.42" font-size="9.5" fill="#075985" text-anchor="middle">双向信号：外→内与内→外</text>
  <rect x="30" y="482" width="700" height="498" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="504.84" font-size="19" fill="#475569" font-weight="700">二、白细胞渗出级联：滚动 → 激活 → 牢固粘附 → 穿内皮迁移</text>
  <rect x="60" y="536" width="640" height="96" fill="#e0f2fe" fill-opacity="0.4"/>
  <text x="150" y="556" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">血管腔（血流）</text>
  <line x1="80" y1="580" x2="300" y2="580" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="60" y="632" width="280" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <rect x="420" y="632" width="280" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="200" y="664" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">内皮细胞</text>
  <text x="560" y="664" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">内皮细胞</text>
  <text x="380" y="656" font-size="9" fill="#64748b" text-anchor="middle">连接旁</text>
  <rect x="60" y="688" width="640" height="26" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.6"/>
  <text x="380" y="705" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">基膜</text>
  <rect x="60" y="714" width="640" height="110" fill="#f1f5f9" fill-opacity="0.6"/>
  <text x="150" y="736" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">组织（感染灶方向）</text>
  <circle cx="170" cy="600" r="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="170" y="576" font-size="9" fill="#78350f" text-anchor="middle" font-weight="700">① 滚动</text>
  <circle cx="430" cy="600" r="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="576" font-size="9" fill="#78350f" text-anchor="middle" font-weight="700">② 激活</text>
  <ellipse cx="520" cy="640" rx="30" ry="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="520" y="616" font-size="9" fill="#78350f" text-anchor="middle" font-weight="700">③ 牢固粘附（铺展）</text>
  <ellipse cx="380" cy="700" rx="14" ry="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="452" y="760" font-size="9" fill="#78350f" text-anchor="middle" font-weight="700">④ 穿内皮迁移</text>
  <circle cx="390" cy="790" r="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="70" y="860" font-size="9.5" fill="#475569">① 组胺与 TNF-α/IL-1 使内皮表达 P-选择素（Weibel-Palade 小体释放）并转录上调 E-选择素；</text>
  <text x="70" y="873.5" font-size="9.5" fill="#475569">白细胞糖链配体 Sialyl-Lewis X 与选择素松散可逆结合 → 减速滚动。</text>
  <text x="70" y="912" font-size="9.5" fill="#475569">② 内皮表面趋化因子（IL-8/CXCL8、fMLP）经 GPCR 触发 Rap1/Talin 信号 → β2 整联蛋白 LFA-1 由弯折低亲和伸展为高亲和</text>
  <text x="70" y="925.5" font-size="9.5" fill="#475569">（inside-out 激活）。</text>
  <text x="70" y="952" font-size="9.5" fill="#475569">③ 高亲和 LFA-1 与 Mac-1 结合内皮 ICAM-1（IgSF）→ 铺展停驻。④ 经 ICAM-1 富集的连接旁（PECAM-1/CD31 介导）挤过内皮，</text>
  <text x="70" y="965.5" font-size="9.5" fill="#475569">分泌胶原酶穿越基膜，顺趋化因子梯度抵达感染灶。</text>
  <rect x="750" y="482" width="620" height="498" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="504.84" font-size="19" fill="#475569" font-weight="700">三、级联模型的临床印证与粘附分子的信号功能</text>
  <text x="776" y="536" font-size="11.5" fill="#1e293b" font-weight="700">正反两面的临床证据</text>
  <rect x="767.9135" y="557.925" width="184.17299999999997" height="16.15" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="860" y="569.42" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">LAD 白细胞粘附缺陷：CD18（β2）突变</text>
  <text x="776" y="592" font-size="9.5" fill="#dc2626">白细胞不能牢固粘附 → 反复细菌感染、伤口不愈、脐带延迟脱落。</text>
  <rect x="816.295" y="621.925" width="207.41000000000003" height="16.15" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="920" y="633.42" font-size="9.5" fill="#075985" text-anchor="middle">那他珠单抗（抗 α4 整联蛋白）治疗多发性硬化</text>
  <text x="776" y="656" font-size="9.5" fill="#475569">阻断白细胞与 VCAM-1 的结合，减少中枢炎症。</text>
  <text x="776" y="700" font-size="11.5" fill="#1e293b" font-weight="700">粘附分子并非&quot;分子胶水&quot;</text>
  <rect x="835.645" y="719.925" width="68.71000000000001" height="16.15" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="870" y="731.42" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="700">整联蛋白簇集</text>
  <text x="776" y="748" font-size="9.5" fill="#475569">激活 FAK-Src 与 Rho 通路，调控增殖、存活与迁移方向——脱离 ECM 的贴壁依赖细胞发生失巢凋亡（anoikis）</text>
  <rect x="845.43" y="781.925" width="49.14" height="16.15" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="870" y="793.42" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="700">钙粘蛋白</text>
  <text x="776" y="810" font-size="9.5" fill="#475569">参与接触抑制与形态发生</text>
  <rect x="850.3225" y="843.925" width="39.355000000000004" height="16.15" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="870" y="855.42" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="700">选择素</text>
  <text x="776" y="872" font-size="9.5" fill="#475569">与肿瘤转移的器官选择性相关</text>
  <text x="776" y="930" font-size="10" fill="#64748b">渗出级联是粘附分子协同作用的经典过程：选择素负责减速筛选，整联蛋白负责锚定制动，IgSM 提供内皮侧把手，</text>
  <text x="776" y="944" font-size="10" fill="#64748b">穿胞与旁路途径并行完成越界。</text>
</svg>