    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">乳糖操纵子的正调控与二度生长</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">CAP-cAMP 结合 -61 位点弯折 DNA 并招募 RNAP——「有乳糖 + 无葡萄糖」的与门条件与碳源时序编程</text>
  <rect x="30" y="132" width="880" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、CAP-cAMP 正调控：-61 位点与 RNAP 招募</text>
  <line x1="64" y1="330" x2="164" y2="330" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="65" y="315" width="98" height="30" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="114" y="363" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">lacI</text>
  <text x="114" y="384" font-size="12.5" fill="#64748b" text-anchor="middle">阻遏蛋白基因</text>
  <line x1="210" y1="330" x2="850" y2="330" stroke="#94a3b8" stroke-width="1.6"/>
