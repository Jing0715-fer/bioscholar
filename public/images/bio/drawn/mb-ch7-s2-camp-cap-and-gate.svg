  <text x="251.6" y="363" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">CAP 位点</text>
  <rect x="294.2" y="315" width="55.599999999999994" height="30" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="322" y="363" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">lacP</text>
  <rect x="351.79999999999995" y="315" width="55.599999999999994" height="30" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <text x="379.59999999999997" y="363" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">lacO</text>
  <rect x="409.4" y="315" width="183.6" height="30" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="501.2" y="363" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">lacZ（β-半乳糖苷酶）</text>
  <rect x="595" y="315" width="132.4" height="30" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="661.2" y="363" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">lacY（透性酶）</text>
  <rect x="729.4" y="315" width="119.6" height="30" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="789.1999999999999" y="363" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">lacA</text>
  <text x="251.6" y="234" font-size="11" fill="#78350f" text-anchor="middle">cAMP</text>
  <circle cx="217.6" cy="252" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <circle cx="285.6" cy="252" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <ellipse cx="251.6" cy="278" rx="60" ry="32" fill="#d1fae5" stroke="#059669" stroke-width="2.4"/>
  <text x="251.6" y="272" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">CAP 二聚体</text>
  <text x="251.6" y="292" font-size="11.5" fill="#64748b" text-anchor="middle">HTH 结合 DNA</text>
  <path d="M215.6,316 q12,24 36,28" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-ok)"/>
  <text x="251.6" y="318" font-size="11.5" fill="#059669" text-anchor="middle">弯折≈90°</text>
  <ellipse cx="379.6" cy="284" rx="64" ry="38" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.4"/>
  <text x="379.6" y="278" font-size="16.5" fill="#0369a1" text-anchor="middle" font-weight="700">RNAP</text>
  <text x="379.6" y="298" font-size="11.5" fill="#64748b" text-anchor="middle">α-CTD 接触 CAP</text>
  <line x1="309.6" y1="270" x2="325.6" y2="284" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <text x="355.6" y="248" font-size="12.5" fill="#059669" text-anchor="middle">招募（正调控）</text>
  <line x1="427.6" y1="408" x2="830" y2="408" stroke="#b45309" stroke-width="3" marker-end="url(#arr-rna)"/>
  <text x="435.6" y="394" font-size="14" fill="#78350f">多顺反子 mRNA（Z·Y·A）</text>
  <text x="530" y="428" font-size="13" fill="#64748b" text-anchor="middle">lacP 为弱启动子：无 CAP-cAMP 时开放复合物形成率低，转录寥寥</text>
  <rect x="930" y="132" width="440" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="946" y="154.84" font-size="19" fill="#475569" font-weight="700">二、「与门」：两个信号积分后输出</text>
  <rect x="972.75" y="184.525" width="114.5" height="22.95" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1030" y="200.86" font-size="13.5" fill="#831843" text-anchor="middle">乳糖（异乳糖）</text>
  <text x="1030" y="224" font-size="11.5" fill="#64748b" text-anchor="middle">LacI 阻遏解除</text>
  <line x1="1090" y1="196" x2="1106" y2="214" stroke="#be185d" stroke-width="2"/>
  <rect x="993" y="254.525" width="74" height="22.95" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1030" y="270.86" font-size="13.5" fill="#059669" text-anchor="middle">无葡萄糖</text>
  <text x="1030" y="294" font-size="11.5" fill="#64748b" text-anchor="middle">cAMP 升高 → CAP 结合</text>
  <line x1="1090" y1="266" x2="1106" y2="248" stroke="#059669" stroke-width="2"/>
  <path d="M1106,200 L1106,262 A32,31 0 0 1 1106,200 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
