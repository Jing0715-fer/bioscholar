  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">低温对辐射损伤的抑制：100 K 的红利与红线</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">三条收益把可用剂量从室温个位数 e<tspan dy="-6.5" font-size="13.7">-</tspan><tspan dy="6.5">/Å</tspan><tspan dy="-6.5" font-size="13.7">2</tspan><tspan dy="6.5"> 提升至约 20（运动校正时代 40–60）；液氦增益至多约两倍；反玻璃化红线 136–160 K，链路低于约 130 K</tspan></text>
  <rect x="30" y="132" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、约 100 K 的三条收益：损伤被收紧的三条机制</text>
  <rect x="52" y="186" width="396" height="110" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="250" y="212" font-size="13.5" fill="#075985" text-anchor="middle" font-weight="700">① 自由基冻结</text>
  <text x="250" y="238" font-size="10.5" fill="#475569" text-anchor="middle">OH· 与水合电子迁移率骤降</text>
  <text x="250" y="257" font-size="10.5" fill="#475569" text-anchor="middle">被钉死在生成位点周围数纳米</text>
  <text x="250" y="276" font-size="10.5" fill="#475569" text-anchor="middle">「远程打击」退化为「就地滋扰」</text>
  <rect x="472" y="186" width="396" height="110" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="670" y="212" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="700">② 挥发被抑制</text>
  <text x="670" y="238" font-size="10.5" fill="#475569" text-anchor="middle">损伤产物不再脱附逃逸</text>
  <text x="670" y="257" font-size="10.5" fill="#475569" text-anchor="middle">质量损失近乎停止</text>
  <text x="670" y="276" font-size="10.5" fill="#475569" text-anchor="middle">样品的元素账面保持稳定</text>
  <rect x="892" y="186" width="396" height="110" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="1090" y="212" font-size="13.5" fill="#065f46" text-anchor="middle" font-weight="700">③ 刻蚀停摆</text>
  <text x="1090" y="238" font-size="10.5" fill="#475569" text-anchor="middle">束致溅射刻蚀在低温下</text>
  <text x="1090" y="257" font-size="10.5" fill="#475569" text-anchor="middle">退出竞争</text>
  <text x="190" y="320" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">常温液态水（示意）</text>
