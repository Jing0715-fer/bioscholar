  <text x="995" y="422" font-size="10.5" fill="#475569" text-anchor="middle">低温保护因子约一个数量级——全部来自物理而非化学（单位 e<tspan dy="-3.6" font-size="7.6">-</tspan><tspan dy="3.6">/Å</tspan><tspan dy="-3.6" font-size="7.6">2</tspan><tspan dy="3.6">）</tspan></text>
  <rect x="30" y="456" width="700" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="478.84" font-size="19" fill="#475569" font-weight="700">二、损伤速率对比：三个温度挡位的高分辨信号衰减</text>
