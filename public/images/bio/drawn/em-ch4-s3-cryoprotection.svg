  <text x="350" y="498" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">高分辨信号保留（虚线：Henderson 极限 20 e<tspan dy="-5.4" font-size="11.5">-</tspan><tspan dy="5.4">/Å</tspan><tspan dy="-5.4" font-size="11.5">2</tspan><tspan dy="5.4">）</tspan></text>
  <rect x="444" y="510" width="186" height="190" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 3"/>
