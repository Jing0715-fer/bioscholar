  <text x="420" y="745" font-size="10" fill="#475569">最先失去的恰是最想要的：高分辨信息最先衰减</text>
  <rect x="750" y="456" width="620" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="478.84" font-size="19" fill="#475569" font-weight="700">三、液氮与液氦之争的落幕：约 100 K 成为事实标准</text>
  <rect x="770" y="500" width="120" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="830" y="527.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">维度</text>
  <rect x="890" y="500" width="230" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1005" y="527.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">液氮区（约 100 K）</text>
  <rect x="1120" y="500" width="230" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="527.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">液氦区（4–20 K）</text>
  <rect x="770" y="544" width="120" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="830" y="566" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">损伤抑制</text>
  <rect x="890" y="544" width="230" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1005" y="566" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">拿走绝大部分收益</text>
  <rect x="1120" y="544" width="230" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="566" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">边际改善（至多约两倍）</text>
  <rect x="770" y="577" width="580" height="33" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="770" y="577" width="120" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="830" y="599" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">温度稳定性</text>
  <rect x="890" y="577" width="230" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1005" y="599" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">平稳、漂移易控</text>
  <rect x="1120" y="577" width="230" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="599" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">沸腾扰动、漂移棘手</text>
  <rect x="770" y="610" width="120" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="830" y="632" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">运行成本</text>
  <rect x="890" y="610" width="230" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1005" y="632" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">常规（液氮日补）</text>
  <rect x="1120" y="610" width="230" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="632" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">昂贵（需氦回收系统）</text>
  <rect x="770" y="643" width="580" height="33" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="770" y="643" width="120" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="830" y="665" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">生态地位</text>
  <rect x="890" y="643" width="230" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1005" y="665" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">cryo-EM 事实标准</text>
  <rect x="1120" y="643" width="230" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="665" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">少数专门研究</text>
  <rect x="910.405" y="691.075" width="299.19" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1060" y="703.78" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">减速带而非免死金牌：被冻结的自由基仍在原位随剂量累积</text>
  <text x="770" y="730" font-size="10.5" fill="#475569">无束流的深低温储存下，自由基既不自愈也不扩大——冷库里的样品可存数年而剂量账面不动，可分批采集、跨机时整合。</text>
  <rect x="30" y="766" width="1340" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="788.84" font-size="19" fill="#475569" font-weight="700">四、全链路低温：反玻璃化红线与防霜防污染</text>
  <text x="70" y="828" font-size="12.5" fill="#475569" font-weight="700">从制样到曝光的温度链（K）</text>
  <line x1="70" y1="880" x2="680" y2="880" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-ink)"/>
  <rect x="390" y="866" width="101" height="28" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="141" cy="880" r="5" fill="#0369a1"/>
  <text x="141" y="858" font-size="9.5" fill="#075985" text-anchor="middle">77 K 液氮</text>
  <circle cx="238" cy="880" r="5" fill="#0f766e"/>
  <text x="238" y="904" font-size="9.5" fill="#134e4a" text-anchor="middle">约 100 K 冷台</text>
  <circle cx="364" cy="880" r="5" fill="#059669"/>
  <text x="364" y="858" font-size="9.5" fill="#065f46" text-anchor="middle">130 K 链路上限</text>
  <circle cx="491" cy="880" r="5" fill="#dc2626"/>
  <text x="545" y="858" font-size="9.5" fill="#991b1b" text-anchor="middle">继续退火转六方冰</text>
  <text x="440" y="904" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">136–160 K 反玻璃化红线</text>
  <text x="440" y="920" font-size="9.5" fill="#475569" text-anchor="middle">数十秒内不可逆重结晶为立方冰</text>
  <text x="70" y="948" font-size="10" fill="#475569">任何一环漏热（室温空气的短暂闪曝、传输卡顿）都会事后以冰晶环的形式显形；</text>
  <text x="70" y="962" font-size="10" fill="#475569">束流还会压低有效反玻璃化阈值——「束致结晶」一并纳入剂量管理。</text>
  <rect x="720" y="792" width="630" height="84" rx="8" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.6"/>
  <text x="736" y="816" font-size="12" fill="#991b1b" font-weight="700">霜：防线在外（环境水汽）</text>
  <text x="736" y="836" font-size="10" fill="#475569">冷载网上凝华成六方冰晶（六角或星形暗色颗粒），肉眼即见、无法挽救；工程解：液氮屏蔽罩、带盖转移盒、干燥气氛操作箱。</text>
  <rect x="720" y="884" width="630" height="84" rx="8" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.6"/>
  <text x="736" y="908" font-size="12" fill="#92400e" font-weight="700">污染：防线在内（低温悖论）</text>
  <text x="736" y="928" font-size="10" fill="#475569">冷样品像微型冷阱，持续捕集镜筒残余碳氢，束下污染可比室温更快（形貌为均匀增厚的无定形碳膜）；对策：冷指加等离子清洗。</text>
