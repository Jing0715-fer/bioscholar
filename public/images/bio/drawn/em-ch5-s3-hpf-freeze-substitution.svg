<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">冷冻固定与冷冻替代：高压冷冻到低温包埋</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">HPF 约 2100 bar 把冰点压至约 −22 °C、毫秒冻停，有效深度约 100–200 μm；FS 以 −90 °C 丙酮（含锇与铀）置换、数天逐步升温至低温包埋</text>
  <rect x="30" y="132" width="700" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、高压冷冻（HPF）横截面：约 2100 bar 毫秒冻停</text>
  <rect x="60" y="178" width="620" height="196" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <rect x="84" y="206" width="44" height="140" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="106" y="366" font-size="9.5" fill="#075985" text-anchor="middle">液氮冷面</text>
  <rect x="612" y="206" width="44" height="140" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="634" y="366" font-size="9.5" fill="#075985" text-anchor="middle">液氮冷面</text>
  <rect x="132" y="200" width="476" height="152" rx="6" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="203.748" y="207.5" width="72.50400000000002" height="17" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="240" y="219.6" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">约 2100 bar</text>
  <text x="440" y="224" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="600">压媒：先在数十毫秒内加压，再让冷面两侧夹击骤冷</text>
  <rect x="330" y="252" width="100" height="48" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="352" y="260" width="56" height="12" fill="#d97706" fill-opacity="0.6"/>
  <text x="380" y="288" font-size="9.5" fill="#92400e" text-anchor="middle" font-weight="700">样品浅槽</text>
  <text x="380" y="336" font-size="9.5" fill="#475569" text-anchor="middle">直径约 2 mm、深 0.1–0.2 mm（铝杯或金杯）</text>
  <line x1="130" y1="250" x2="182" y2="250" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="130" y1="302" x2="182" y2="302" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="610" y1="250" x2="558" y2="250" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="610" y1="302" x2="558" y2="302" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="102.46759999999999" y="387.075" width="255.06480000000002" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="230" y="399.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">有效冷冻深度约 100–200 μm（无可见冰晶判据）</text>
  <rect x="391.25" y="387.075" width="217.5" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="399.78" font-size="10.5" fill="#475569" text-anchor="middle">深度上限由热流决定：中心热量须传导出来</text>
  <text x="60" y="421" font-size="9.5" fill="#64748b">次序不可颠倒：先加压后骤冷，否则样品在常压下已先结冰（Moor 与 Riehle 1968 年原型一脉）。</text>
  <rect x="750" y="132" width="620" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="154.84" font-size="19" fill="#475569" font-weight="700">二、压力的物理账与三角权衡</text>
  <rect x="790" y="198" width="250" height="132" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="790" y1="330" x2="790" y2="336" stroke="#475569" stroke-width="1.8"/>
  <text x="790" y="352" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="1040" y1="330" x2="1040" y2="336" stroke="#475569" stroke-width="1.8"/>
  <text x="1040" y="352" font-size="13" fill="#64748b" text-anchor="middle">约 2100 bar</text>
  <line x1="784" y1="198" x2="790" y2="198" stroke="#475569" stroke-width="1.8"/>
  <text x="780" y="202" font-size="13" fill="#64748b" text-anchor="end">0 °C</text>
  <line x1="784" y1="294.36" x2="790" y2="294.36" stroke="#475569" stroke-width="1.8"/>
  <text x="780" y="298.36" font-size="13" fill="#64748b" text-anchor="end">−22 °C</text>
  <line x1="784" y1="330" x2="790" y2="330" stroke="#475569" stroke-width="1.8"/>
  <text x="780" y="334" font-size="13" fill="#64748b" text-anchor="end">−30 °C</text>
  <text x="915" y="186" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">冰 I 熔化曲线（示意）</text>
  <path d="M790,198 C798.3,199.5 823.3,203.5 840,207.24 C856.7,211.0 873.3,214.9 890,220.44 C906.7,225.9 923.3,232.5 940,240.24 C956.7,247.9 973.3,257.6 990,266.64 C1006.7,275.7 1031.7,289.7 1040,294.36" fill="none" stroke="#0369a1" stroke-width="2.6"/>
  <circle cx="1040" cy="294" r="4.5" fill="#d97706"/>
  <text x="796" y="254" font-size="9.5" fill="#075985" font-weight="600">冰点压低至约 −22 °C</text>
  <text x="1032" y="314" font-size="9.5" fill="#92400e" text-anchor="middle" font-weight="700">2100 bar</text>
  <text x="796" y="372" font-size="10" fill="#475569">高压抑制成核与晶体生长、</text>
  <text x="796" y="386" font-size="10" fill="#475569">把结冰膨胀压回去——毫秒级完成「冻停」。</text>
  <text x="1066" y="200" font-size="10.5" fill="#475569">约 2100 bar 把水的冰点压到约 −22 °C——液态水获得更宽的过冷区间；</text>
  <text x="1066" y="216" font-size="10.5" fill="#475569">高压同时抑制水分子扩散，</text>
  <text x="1066" y="232" font-size="10.5" fill="#475569">冰晶成核率与生长速率双双下降。</text>
  <text x="1066" y="252" font-size="10.5" fill="#475569">玻璃化所需冷却速率因此放宽约两个数量级：</text>
  <text x="1066" y="268" font-size="10.5" fill="#475569">可玻璃化深度从常压几微米跃升到约 200 μm。</text>
  <text x="1066" y="300" font-size="10.5" fill="#1e293b" font-weight="700">三角权衡：</text>
  <rect x="1142.25" y="291.5" width="65.5" height="17" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1175" y="303.6" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">压力换深度</text>
  <rect x="1232.25" y="291.5" width="65.5" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1265" y="303.6" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">速度换纯度</text>
  <rect x="1181.8" y="317.5" width="96.4" height="17" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1230" y="329.6" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">保护剂换冰晶风险</text>
  <text x="796" y="398" font-size="10" fill="#475569">保护剂：甘油、蔗糖或海藻糖 5–20%，或 BSA、葡聚糖等无渗透活性填充剂——能不加就不加、必须加选胞内兼容者；</text>
  <text x="796" y="412" font-size="10" fill="#475569">压力打折或含水量极高时以 5–20% 补差额。</text>
  <text x="796" y="426" font-size="9.5" fill="#64748b">压力与保护剂可互兑：2100 bar 下小体积致密的原生样品常可零保护剂直冻。</text>
  <rect x="30" y="456" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="478.84" font-size="19" fill="#475569" font-weight="700">三、冷冻替代（FS）：把冰慢慢换成树脂的数天时间表</text>
  <rect x="60" y="506" width="310" height="148" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="215" y="532" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">① 置换主段 −90 °C</text>
  <text x="215" y="560" font-size="10.5" fill="#475569" text-anchor="middle">8–16 h</text>
  <text x="215" y="581" font-size="10.5" fill="#475569" text-anchor="middle">丙酮（溶有四氧化锇与醋酸铀）</text>
  <text x="215" y="602" font-size="10.5" fill="#475569" text-anchor="middle">置换冰、锇缓释；分子相对不动窝</text>
  <rect x="385" y="506" width="310" height="148" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="540" y="532" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">② 升温一段 −90 至 −60 °C</text>
  <text x="540" y="560" font-size="10.5" fill="#475569" text-anchor="middle">约 5 °C/h</text>
  <text x="540" y="581" font-size="10.5" fill="#475569" text-anchor="middle">锇与脂质的加成在 −70 至 −50 °C 发力</text>
  <text x="540" y="602" font-size="10.5" fill="#475569" text-anchor="middle">醋酸铀随替代液同行</text>
  <rect x="710" y="506" width="310" height="148" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="865" y="532" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">③ 升温二段 −60 至 −30 °C</text>
  <text x="865" y="560" font-size="10.5" fill="#475569" text-anchor="middle">过夜</text>
  <text x="865" y="581" font-size="10.5" fill="#475569" text-anchor="middle">铀对蛋白与核酸低温补充固定</text>
  <rect x="1035" y="506" width="310" height="148" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1190" y="532" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">④ 聚合段 −45 至 0 °C</text>
  <text x="1190" y="560" font-size="10.5" fill="#475569" text-anchor="middle">24–48 h</text>
  <text x="1190" y="581" font-size="10.5" fill="#475569" text-anchor="middle">Lowicryl 紫外聚合（约 −35 至 −45 °C）</text>
  <text x="1190" y="602" font-size="10.5" fill="#475569" text-anchor="middle">或环氧热聚合，全程不越过 0 °C</text>
  <line x1="372" y1="580" x2="383" y2="580" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="697" y1="580" x2="708" y2="580" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="1022" y1="580" x2="1033" y2="580" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="143.40994999999998" y="673.075" width="413.18010000000004" height="17.849999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="350" y="685.78" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">Lowicryl（HM20、K4M）亲水低温树脂：抗原性保存显著优于 60 °C 热聚合的环氧</text>
  <text x="700" y="668" font-size="10.5" fill="#475569">玻璃化的块太脆且须全程低温，不能直接常规切片；</text>
  <text x="700" y="683" font-size="10.5" fill="#475569">数天时间表把「冻停的瞬态」低损伤地搬进树脂——每一步升温都以损伤最小为约束。</text>
  <text x="60" y="716" font-size="10.5" fill="#475569">对照研究一再显示：FS 对微管、突触囊泡等精细结构的保存明显优于常规化学固定——「先冻停、再慢慢换溶剂」胜过「泡固定剂等渗透」。</text>
  <rect x="30" y="766" width="1340" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="788.84" font-size="19" fill="#475569" font-weight="700">四、路线选择：四条固定与切片路线对照</text>
  <rect x="50" y="798" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="825.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">路线</text>
  <rect x="200" y="798" width="270" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="825.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">固定方式</text>
  <rect x="470" y="798" width="270" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="605" y="825.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">关键条件</text>
  <rect x="740" y="798" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="865" y="825.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">优势</text>
  <rect x="990" y="798" width="360" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="825.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">典型用途</text>
  <rect x="50" y="842" width="150" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="861.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">常规化学固定</text>
  <rect x="200" y="842" width="270" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="861.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">戊二醛加锇双固定</text>
  <rect x="470" y="842" width="270" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="605" y="861.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">室温</text>
  <rect x="740" y="842" width="250" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="865" y="861.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">便宜、可批量</text>
  <rect x="990" y="842" width="360" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="861.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">形态学、病理诊断</text>
  <rect x="50" y="870" width="1300" height="28" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="870" width="150" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="889.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">HPF-FS</text>
  <rect x="200" y="870" width="270" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="889.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">高压冷冻加冷冻替代</text>
  <rect x="470" y="870" width="270" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="605" y="889.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 2100 bar，−90 °C 丙酮</text>
  <rect x="740" y="870" width="250" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="865" y="889.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">结构保存佳</text>
  <rect x="990" y="870" width="360" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="889.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">细胞组织超微结构</text>
  <rect x="50" y="898" width="150" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="917.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">CEMOVIS</text>
  <rect x="200" y="898" width="270" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="917.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">HPF 后低温直接切片</text>
  <rect x="470" y="898" width="270" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="605" y="917.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 −160 °C，约 70 nm 切片</text>
  <rect x="740" y="898" width="250" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="865" y="917.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">最原生、无固定</text>
  <rect x="990" y="898" width="360" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="917.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">结构真实度研究</text>
  <rect x="50" y="926" width="1300" height="28" fill="#f8fafc" fill-opacity="0.85"/>
