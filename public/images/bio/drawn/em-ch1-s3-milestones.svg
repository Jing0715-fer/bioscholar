<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">生物电子显微学里程碑（1939—2020）</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">1939首张病毒电镜照片（TMV）→1955–1959负染色→1974低温减损→1975紫膜7Å→1982玻璃化→2013TRPV13.4Å→2017诺贝尔化学奖→2020前后apoferritin1.2Å</text>
  <rect x="30" y="132" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、生物电镜里程碑时间线（1939—2020）</text>
  <line x1="110" y1="310" x2="1270" y2="310" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="110" cy="310" r="6.5" fill="#0369a1"/>
  <line x1="110" y1="301" x2="110" y2="280" stroke="#0369a1" stroke-width="1.7"/>
  <text x="110" y="260" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1939 考舍等</text>
  <text x="110" y="240" font-size="12" fill="#64748b" text-anchor="middle">首张病毒电镜照片（TMV）</text>
  <circle cx="255" cy="310" r="6.5" fill="#0f766e"/>
  <line x1="255" y1="319" x2="255" y2="340" stroke="#0f766e" stroke-width="1.7"/>
  <text x="255" y="360" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1955–1959 负染色</text>
  <text x="255" y="380" font-size="12" fill="#64748b" text-anchor="middle">霍尔；布伦纳与霍恩</text>
  <circle cx="400" cy="310" r="6.5" fill="#0369a1"/>
  <line x1="400" y1="301" x2="400" y2="280" stroke="#0369a1" stroke-width="1.7"/>
  <text x="400" y="260" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1974 泰勒与格拉泽</text>
  <text x="400" y="240" font-size="12" fill="#64748b" text-anchor="middle">冷冻晶体电子衍射</text>
  <circle cx="545" cy="310" r="6.5" fill="#6d28d9"/>
  <line x1="545" y1="319" x2="545" y2="340" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="545" y="360" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1975 亨德森与昂温</text>
  <text x="545" y="380" font-size="12" fill="#64748b" text-anchor="middle">紫膜二维晶体 7 Å</text>
  <circle cx="690" cy="310" r="6.5" fill="#0f766e"/>
  <line x1="690" y1="301" x2="690" y2="280" stroke="#0f766e" stroke-width="1.7"/>
  <text x="690" y="260" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1982 杜博歇</text>
  <text x="690" y="240" font-size="12" fill="#64748b" text-anchor="middle">plunge-freezing 玻璃化</text>
  <circle cx="835" cy="310" r="6.5" fill="#dc2626"/>
  <line x1="835" y1="319" x2="835" y2="340" stroke="#dc2626" stroke-width="1.7"/>
  <text x="835" y="360" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2013 廖等</text>
  <text x="835" y="380" font-size="12" fill="#64748b" text-anchor="middle">直接探测：TRPV1 3.4 Å</text>
  <circle cx="980" cy="310" r="6.5" fill="#d97706"/>
  <line x1="980" y1="301" x2="980" y2="280" stroke="#d97706" stroke-width="1.7"/>
  <text x="980" y="260" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2017 诺贝尔化学奖</text>
  <text x="980" y="240" font-size="12" fill="#64748b" text-anchor="middle">杜博歇、弗兰克、亨德森</text>
  <circle cx="1125" cy="310" r="6.5" fill="#dc2626"/>
  <line x1="1125" y1="319" x2="1125" y2="340" stroke="#dc2626" stroke-width="1.7"/>
  <text x="1125" y="360" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2020 前后</text>
  <text x="1125" y="380" font-size="12" fill="#64748b" text-anchor="middle">apoferritin 1.2 Å</text>
  <text x="700" y="424" font-size="10.5" fill="#475569" text-anchor="middle">同期细胞线：1945 年波特首见内质网；帕拉德解析线粒体嵴与核糖体；克劳德、德迪夫、帕拉德共享 1974 年诺贝尔生理学或医学奖</text>
  <text x="700" y="446" font-size="10.5" fill="#475569" text-anchor="middle">每约十年一次制样或探测的范式更替：负染色（1950s）→ 低温（1974）→ 玻璃化（1982）→ 直接探测（2013）</text>
  <rect x="30" y="484" width="660" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="506.84" font-size="19" fill="#475569" font-weight="700">二、分辨率革命：从 blob 到 1.2 Å</text>
  <rect x="113.6" y="557" width="119.46666666666667" height="98" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="173.33333333333331" y="548" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">7 Å</text>
  <text x="173.33333333333331" y="675" font-size="12.5" fill="#64748b" text-anchor="middle">1975 紫膜二维晶体</text>
  <rect x="300.26666666666665" y="607.4" width="119.46666666666667" height="47.6" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="359.99999999999994" y="598.4" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">3.4 Å</text>
  <text x="359.99999999999994" y="675" font-size="12.5" fill="#64748b" text-anchor="middle">2013 TRPV1</text>
  <rect x="486.9333333333333" y="638.2" width="119.46666666666667" height="16.8" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="546.6666666666666" y="629.2" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">1.2 Å</text>
  <text x="546.6666666666666" y="675" font-size="12.5" fill="#64748b" text-anchor="middle">2020 前后 apoferritin</text>
  <text x="50" y="700" font-size="10.5" fill="#475569">直接电子探测相机使 TRPV1 达 3.4 Å，结束几十年的「blob 学」时代；</text>
  <text x="50" y="715" font-size="10.5" fill="#475569">2020 年前后 apoferritin 以电子计数与多层校正达 1.2 Å，与晶体学正面会师。</text>
  <rect x="710" y="484" width="660" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="506.84" font-size="19" fill="#475569" font-weight="700">三、相机革命：为什么直接探测改变一切</text>
  <text x="730" y="532" font-size="11.5" fill="#64748b" font-weight="700">CCD（闪烁体耦合）：</text>
  <rect x="730" y="542" width="84" height="32" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="772" y="562" font-size="10.5" fill="#475569" text-anchor="middle">电子</text>
  <line x1="818" y1="558" x2="836" y2="558" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="840" y="542" width="128" height="32" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="904" y="562" font-size="10.5" fill="#475569" text-anchor="middle">闪烁体（转光）</text>
  <line x1="972" y1="558" x2="990" y2="558" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="994" y="542" width="96" height="32" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1042" y="562" font-size="10.5" fill="#475569" text-anchor="middle">光学耦合</text>
  <line x1="1094" y1="558" x2="1112" y2="558" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="1116" y="542" width="92" height="32" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1162" y="562" font-size="10.5" fill="#475569" text-anchor="middle">CCD 芯片</text>
  <text x="730" y="596" font-size="10.5" fill="#64748b">散射与串扰把探测量子效率（DQE）压在低水平</text>
  <text x="730" y="622" font-size="11.5" fill="#075985" font-weight="700">直接电子探测：</text>
  <rect x="730" y="632" width="84" height="32" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="772" y="652" font-size="10.5" fill="#075985" text-anchor="middle">电子</text>
  <line x1="818" y1="648" x2="836" y2="648" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="840" y="632" width="150" height="32" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="915" y="652" font-size="10.5" fill="#075985" text-anchor="middle">CMOS 像素直接轰击</text>
  <line x1="994" y1="648" x2="1012" y2="648" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="1016" y="632" width="132" height="32" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1082" y="652" font-size="10.5" fill="#075985" text-anchor="middle">逐事件电子计数</text>
  <text x="730" y="686" font-size="10.5" fill="#475569">逐事件计数剔除读出噪声：半奈奎斯特频率处 DQE 提升一倍以上</text>
  <rect x="746.145" y="701.075" width="47.71" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="770" y="713.78" font-size="10.5" fill="#475569" text-anchor="middle">Falcon</text>
  <rect x="823.94" y="701.075" width="52.12" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="850" y="713.78" font-size="10.5" fill="#475569" text-anchor="middle">K2 / K3</text>
  <rect x="903.31" y="701.075" width="53.379999999999995" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="930" y="713.78" font-size="10.5" fill="#475569" text-anchor="middle">DE 系列</text>
  <text x="1010" y="703" font-size="10" fill="#475569">电影模式 + 束致运动校正 + 剂量分级：同一剂量可提取的信息量成倍增长</text>
  <rect x="30" y="744" width="1340" height="234" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="766.84" font-size="19" fill="#475569" font-weight="700">四、硬件—制样—算法：三线轮动</text>
  <text x="52" y="807" font-size="13.5" fill="#0f766e" font-weight="700">制样</text>
  <rect x="150" y="789" width="139.9762" height="26" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="219.9881" y="806" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="600">1939 干燥 + 金属投影</text>
  <line x1="297.9762" y1="802" x2="321.9762" y2="802" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="329.9762" y="789" width="126.23600000000002" height="26" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="393.0942" y="806" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="600">1955–1959 负染色</text>
  <line x1="464.21220000000005" y1="802" x2="488.21220000000005" y2="802" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="496.21220000000005" y="789" width="102.546" height="26" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="547.4852000000001" y="806" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="600">1974 低温减损</text>
  <line x1="606.7582000000001" y1="802" x2="630.7582000000001" y2="802" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="638.7582000000001" y="789" width="114.391" height="26" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="695.9537000000001" y="806" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="600">1982 玻璃化冷冻</text>
  <text x="52" y="861" font-size="13.5" fill="#0369a1" font-weight="700">探测</text>
  <rect x="150" y="843" width="116.2862" height="26" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="208.1431" y="860" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="600">荧光屏 / 照相干板</text>
  <line x1="274.2862" y1="856" x2="298.2862" y2="856" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="306.2862" y="843" width="122.6825" height="26" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="367.62745" y="860" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="600">1990s CCD 闪烁体</text>
  <line x1="436.9687" y1="856" x2="460.9687" y2="856" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="468.9687" y="843" width="146.1356" height="26" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="542.0365" y="860" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="600">2010s 直接探测 + 计数</text>
  <text x="52" y="915" font-size="13.5" fill="#6d28d9" font-weight="700">算法</text>
  <rect x="150" y="897" width="185.22410000000002" height="26" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="242.61205" y="914" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="600">1968 DeRosier–Klug 三维重构</text>
  <line x1="343.2241" y1="910" x2="367.2241" y2="910" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="375.2241" y="897" width="191.85730000000004" height="26" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="471.15275" y="914" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="600">1975–1990s Frank 单颗粒框架</text>
  <line x1="575.0814" y1="910" x2="599.0814" y2="910" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="607.0814" y="897" width="165.7983" height="26" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="689.98055" y="914" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="600">2012 贝叶斯 + 金标准 FSC</text>
  <text x="700" y="962" font-size="11.5" fill="#475569" text-anchor="middle">硬件、制样与算法三线轮动——每条线的革新都把观察边界外推一程，是这门学科一百年来最稳定的演化规律</text>
</svg>