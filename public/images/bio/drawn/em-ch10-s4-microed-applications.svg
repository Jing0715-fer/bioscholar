  <text x="345" y="356" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">LCP 脂相提取</text>
  <text x="345" y="372" font-size="9.5" fill="#64748b" text-anchor="middle">酶消化或去垢剂溶解</text>
  <rect x="440" y="208" width="130" height="108" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <ellipse cx="505" cy="262" rx="40" ry="30" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <rect x="497" y="218" width="16" height="88" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <line x1="470" y1="262" x2="492" y2="262" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="452" y="250" font-size="9.5" fill="#075985">Ga<tspan dy="-3.2" font-size="6.8">+</tspan></text>
  <text x="505" y="356" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">FIB 定点减薄</text>
  <text x="505" y="372" font-size="9.5" fill="#64748b" text-anchor="middle">数微米大晶铣成 100–300 nm</text>
  <text x="50" y="404" font-size="10.5" fill="#475569">第三路与第 9 章 lamella 的工艺同源、目的互补：那里为让电子穿透成像，这里为压厚晶保运动学近似（动力学散射重的大晶体）。</text>
  <rect x="209.25" y="461.075" width="301.5" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="360" y="473.78" font-size="10.5" fill="#475569" text-anchor="middle">研钵研磨的粉末直接上样已成系列（天然产物与合成中间体）</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、配体浸泡：灌注时间随尺寸平方</text>
  <rect x="760" y="220" width="400" height="200" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="760" y1="420" x2="760" y2="426" stroke="#475569" stroke-width="1.8"/>
  <text x="760" y="442" font-size="13" fill="#64748b" text-anchor="middle">0.1 μm</text>
  <line x1="960" y1="420" x2="960" y2="426" stroke="#475569" stroke-width="1.8"/>
  <text x="960" y="442" font-size="13" fill="#64748b" text-anchor="middle">1 μm</text>
  <line x1="1160" y1="420" x2="1160" y2="426" stroke="#475569" stroke-width="1.8"/>
  <text x="1160" y="442" font-size="13" fill="#64748b" text-anchor="middle">10 μm+</text>
  <line x1="754" y1="420" x2="760" y2="420" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="424" font-size="13" fill="#64748b" text-anchor="end">秒</text>
  <line x1="754" y1="320" x2="760" y2="320" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="324" font-size="13" fill="#64748b" text-anchor="end">小时</text>
  <line x1="754" y1="220" x2="760" y2="220" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="224" font-size="13" fill="#64748b" text-anchor="end">天</text>
  <text x="960" y="464" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">晶体特征尺寸（示意）</text>
  <text x="714" y="320" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">浸泡时间</text>
  <text x="960" y="208" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">扩散时标按尺寸平方增长</text>
  <path d="M760.0,420.0 L768.0,419.9 L776.0,419.8 L784.0,419.5 L792.0,419.0 L800.0,418.4 L808.0,417.7 L816.0,416.8 L824.0,415.7 L832.0,414.5 L840.0,413.2 L848.0,411.7 L856.0,410.0 L864.0,408.2 L872.0,406.2 L880.0,404.0 L888.0,401.7 L896.0,399.2 L904.0,396.6 L912.0,393.8 L920.0,390.8 L928.0,387.7 L936.0,384.3 L944.0,380.8 L952.0,377.2 L960.0,373.3 L968.0,369.3 L976.0,365.2 L984.0,360.8 L992.0,356.3 L1000.0,351.6 L1008.0,346.7 L1016.0,341.7 L1024.0,336.4 L1032.0,331.0 L1040.0,325.4 L1048.0,319.7 L1056.0,313.7 L1064.0,307.6 L1072.0,301.3 L1080.0,294.8 L1088.0,288.2 L1096.0,281.3 L1104.0,274.3 L1112.0,267.1 L1120.0,259.7 L1128.0,252.1 L1136.0,244.4 L1144.0,236.4 L1152.0,228.3 L1160.0,220.0" fill="none" stroke="#be185d" stroke-width="2.6"/>
  <rect x="809.8875" y="461.075" width="180.225" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="900" y="473.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">微晶以秒计；大晶体以小时到天计</text>
  <text x="1180" y="200" font-size="10.5" fill="#475569">时间分辨（混合-冻停）</text>
  <text x="1180" y="215" font-size="10.5" fill="#475569">与片段筛选的物理红利：</text>
  <text x="1180" y="230" font-size="10.5" fill="#475569">配体在微晶里秒级达平衡，</text>
  <text x="1180" y="245" font-size="10.5" fill="#475569">快扫化学中间态成为可能。</text>
  <rect x="1074.4" y="311.5" width="131.2" height="17" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1140" y="323.6" font-size="10" fill="#075985" text-anchor="middle">混合-喷雾捕集亚秒中间态</text>
  <rect x="1092" y="343.5" width="96" height="17" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1140" y="355.6" font-size="10" fill="#075985" text-anchor="middle">片段筛选通量立增</text>
  <text x="960" y="510" font-size="10" fill="#64748b" text-anchor="middle" font-weight="700">「尺寸小」从缺陷变成装置——MicroED 的化学红利</text>
  <rect x="30" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、应用谱系：小分子、肽与蛋白</text>
  <rect x="50" y="616" width="620" height="72" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="66" y="642" font-size="12.5" fill="#075985" font-weight="700">小分子与晶型筛选</text>
  <text x="66" y="664" font-size="10" fill="#475569">粉末直接上样解析天然产物与合成中间体；多晶型与共晶快筛</text>
  <text x="654" y="642" font-size="9.5" fill="#64748b" text-anchor="end">工业主战场</text>
  <rect x="50" y="698" width="620" height="72" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="66" y="724" font-size="12.5" fill="#78350f" font-weight="700">绝对构型判定</text>
  <text x="66" y="746" font-size="10" fill="#475569">经动力学精修的反常散射路径独立给出手性</text>
  <text x="654" y="724" font-size="9.5" fill="#64748b" text-anchor="end">Brázda 与 Palatinus 2019（Science）</text>
  <rect x="50" y="780" width="620" height="72" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="66" y="806" font-size="12.5" fill="#4c1d95" font-weight="700">淀粉样肽拉链结构</text>
  <text x="66" y="828" font-size="10" fill="#475569">与 Eisenberg 实验室合作的拉链骨架系列；4.7 Å 签名升级到原子级</text>
  <text x="654" y="806" font-size="9.5" fill="#64748b" text-anchor="end">招牌案例</text>
  <rect x="50" y="862" width="620" height="72" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="66" y="888" font-size="12.5" fill="#134e4a" font-weight="700">蛋白微晶筛查</text>
  <text x="66" y="910" font-size="10" fill="#475569">替结晶学快速判决「这滴结晶有没有戏」，免长晶等待</text>
  <text x="654" y="888" font-size="9.5" fill="#64748b" text-anchor="end">决策工具</text>
  <rect x="710" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、四笔未清的账与生态位</text>
  <text x="730" y="618" font-size="11.5" fill="#1e293b" font-weight="700">四笔账：</text>
  <rect x="767" y="637.5" width="126" height="17" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="830" y="649.6" font-size="10" fill="#991b1b" text-anchor="middle">动力学散射限制厚晶精修</text>
  <rect x="1042" y="637.5" width="96" height="17" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1090" y="649.6" font-size="10" fill="#991b1b" text-anchor="middle">辐射损伤要求快收</text>
  <rect x="772.4" y="669.5" width="115.20000000000002" height="17" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="830" y="681.6" font-size="10" fill="#991b1b" text-anchor="middle">蛋白分辨率多停 1–2 Å</text>
  <rect x="1052" y="669.5" width="76" height="17" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1090" y="681.6" font-size="10" fill="#991b1b" text-anchor="middle">单晶数据量小</text>
  <text x="730" y="716" font-size="10.5" fill="#475569">生态位定位：补「晶体太小、太少、长不大」的拼图，非替代 X 射线晶体学——均一大复合物（约 100 kDa 以上）归单颗粒冷冻电镜，</text>
  <text x="730" y="731" font-size="10.5" fill="#475569">长得出 10 μm 以上三维大晶归 X 射线，太小的晶体归 MicroED（分工决策联动第 12 章）。</text>
  <rect x="990.345" y="790.65" width="99.31" height="18.7" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1040" y="803.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">方法史的对仗：</text>
  <text x="730" y="838" font-size="10.5" fill="#475569">1975 年的加冕之作靠「图像给相位」，2013 年的复兴靠「旋转给几何」——电子晶体学两次证明，</text>
  <text x="730" y="853" font-size="10.5" fill="#475569">最可靠的突破都来自把电子波的物理性质（透镜传相位、Ewald 球平、散射强）直接兑换成方法。</text>
  <text x="1040" y="926" font-size="10" fill="#64748b" text-anchor="middle">Gonen 组与制药界 2018 年起的合作浪潮把粉末上样做成常规</text>
</svg>