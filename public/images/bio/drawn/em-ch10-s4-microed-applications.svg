  <text x="150" y="356" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">涡旋打散的微晶悬液</text>
  <text x="150" y="372" font-size="9.5" fill="#64748b" text-anchor="middle">直接上载约 1 μL</text>
