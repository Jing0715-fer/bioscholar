  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">MicroED 的样品与应用：小晶体的化学红利</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">上载三路（涡旋悬液约1μL、LCP提取、FIB铣100–300nm）；浸泡时间随尺寸平方——微晶以秒计；小分子晶型筛选为工业主战场，绝对构型由动力学精修独立判定（Brázda与</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">Palatinus2019）；蛋白分辨率多停1–2Å</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、样品上载：从沉淀到微晶的三条路</text>
  <circle cx="150" cy="262" r="62" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <rect x="178" y="256" width="12" height="12" rx="2" fill="#ffffff" stroke="#075985" stroke-width="1.4"/>
