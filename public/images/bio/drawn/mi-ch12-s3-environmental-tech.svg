    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">环境微生物技术：活性污泥法、A²/O 与厌氧消化、生物修复</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">活性污泥法以菌胶团吸附氧化，SVI&gt;150 mL/g 提示膨胀；A²/O 三区接力脱氮除磷；厌氧消化三阶段互营，沼气 CH₄ 约 55%–70%；湿法冶金供全球约 15%–25% 的铜</text>
  <rect x="30" y="132" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、活性污泥法：菌胶团吸附氧化 + 原生动物指示 + 污泥回流</text>
  <rect x="70.54249999999999" y="190.225" width="98.915" height="19.55" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="120" y="204.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">原水（有机物）</text>
  <line x1="190" y1="200" x2="250" y2="200" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-mute)"/>
  <rect x="250" y="165" width="340" height="110" rx="8" fill="#ccfbf1" fill-opacity="0.4" stroke="#0f766e" stroke-width="2"/>
  <text x="420" y="188" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">曝气池</text>
  <circle cx="300" cy="220" r="13" fill="#0f766e" fill-opacity="0.45" stroke="#134e4a" stroke-width="1.2"/>
  <circle cx="296" cy="217" r="3" fill="#134e4a"/>
  <circle cx="304" cy="222" r="3" fill="#134e4a"/>
