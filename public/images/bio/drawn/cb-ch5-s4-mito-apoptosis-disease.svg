  <text x="740" y="478" font-size="10.5" fill="#475569">多系统受累：能量需求高的脑、肌肉、眼、耳症状突出；</text>
  <text x="740" y="492.5" font-size="10.5" fill="#475569">mtDNA 与核基因突变均致呼吸链缺陷。</text>
  <text x="740" y="522" font-size="10" fill="#64748b">受累母亲可将突变传给所有子代、比例各异；父方完全不传递——严格的母系遗传。</text>
