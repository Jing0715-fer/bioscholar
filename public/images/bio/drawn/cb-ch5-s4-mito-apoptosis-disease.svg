  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">线粒体与细胞凋亡及线粒体疾病</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">mPTP（ANT·VDAC·亲环蛋白 D）开放致 Δψ 崩解与基质肿胀、环孢素 A 抑制；Bax/Bak 成孔释放 Cyt c 组装凋亡复合体启动 caspase 级联；LHON/MELAS/MERRF/KSS 呈母系遗传、多系统受累、异质性阈值效应与破碎红纤维</text>
