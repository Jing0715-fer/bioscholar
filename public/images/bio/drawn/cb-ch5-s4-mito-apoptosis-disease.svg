  <text x="505" y="360" font-size="9.5" fill="#64748b">环孢素 A 结合亲环蛋白 D 抑制其开放——缺血再灌注损伤</text>
  <text x="505" y="373" font-size="9.5" fill="#64748b">（心肌梗死、脑卒中）</text>
  <text x="505" y="386" font-size="9.5" fill="#64748b">保护研究的焦点。</text>
  <text x="255" y="522" font-size="10" fill="#64748b">嵴重构（OPA1 断裂）与动力学：分裂促进 Cyt c 释放、融合延缓凋亡。</text>
