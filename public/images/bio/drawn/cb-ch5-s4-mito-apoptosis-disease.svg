  <text x="494" y="252" font-size="9" fill="#475569">ANT·VDAC·亲环蛋白 D</text>
  <text x="505" y="285" font-size="9.5" fill="#475569">开放 → 内膜失去选择性、Δψ 崩解、</text>
  <text x="505" y="298" font-size="9.5" fill="#475569">基质肿胀、外膜破裂</text>
