<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">抗原的基本特性：免疫原性与反应原性的一体两面</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">抗原兼具免疫原性（诱导应答）与反应原性（与应答产物特异结合）两重性能且彼此独立；完全抗原多大于 10 kDa、半抗原常不足 1 kDa，半抗原偶联载体蛋白后获得免疫原性——载体效应（DNP-OVA/DNP-BSA 实验）证明 B 表位识别半抗原、T 表位识别载体的分工协作，也是青霉素超敏与结合疫苗的分子基础</text>
  <rect x="30" y="132" width="1340" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、抗原的一体两面：免疫原性与反应原性彼此独立</text>
  <rect x="659.2988" y="193.85" width="81.4024" height="32.3" rx="7" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="700" y="216.84" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">抗 原</text>
  <rect x="60" y="176" width="420" height="130" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.8"/>
  <text x="270" y="206" font-size="16" fill="#134e4a" text-anchor="middle" font-weight="700">免疫原性</text>
  <text x="80" y="234" font-size="11.5" fill="#475569">诱导机体产生免疫应答的能力——刺激机体生成抗体与致敏淋巴细胞等应答产物。</text>
  <line x1="612" y1="230" x2="486" y2="230" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-mute)"/>
  <rect x="920" y="176" width="420" height="130" rx="9" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1130" y="206" font-size="16" fill="#075985" text-anchor="middle" font-weight="700">反应原性</text>
  <text x="940" y="234" font-size="11.5" fill="#475569">与其应答产物特异性结合的能力——抗原表位与抗体 / TCR 互补结合。</text>
  <line x1="788" y1="230" x2="914" y2="230" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-mute)"/>
  <text x="700" y="340" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">兼具两重性能者为完全抗原；仅具反应原性者为半抗原（多为小分子化合物）</text>
  <text x="700" y="372" font-size="11" fill="#64748b" text-anchor="middle">引申概念：诱导免疫耐受的抗原称耐受原</text>
  <rect x="30" y="418" width="1340" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="440.84" font-size="19" fill="#475569" font-weight="700">二、完全抗原与半抗原：分子量与两重性能的对照</text>
  <rect x="60" y="462" width="120" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="489.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">比较项目</text>
  <rect x="180" y="462" width="260" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="489.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">完全抗原</text>
  <rect x="440" y="462" width="240" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="560" y="489.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">半抗原</text>
  <rect x="60" y="506" width="120" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="537.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">两重性能</text>
  <rect x="180" y="506" width="260" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="537.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">兼具免疫原性与反应原性</text>
  <rect x="440" y="506" width="240" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="560" y="537.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">仅有反应原性</text>
  <rect x="60" y="558" width="620" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="558" width="120" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="589.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">分子量</text>
  <rect x="180" y="558" width="260" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="589.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">通常较大（多大于 10 kDa）</text>
  <rect x="440" y="558" width="240" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="560" y="589.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">小（常不足 1 kDa）</text>
  <rect x="60" y="610" width="120" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="641.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">常见实例</text>
  <rect x="180" y="610" width="260" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="641.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">蛋白质等大分子</text>
  <rect x="440" y="610" width="240" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="560" y="641.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">药物等小分子化合物</text>
  <rect x="771.56" y="463.8" width="116.88" height="20.4" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="830" y="478.32" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">半抗原（小分子）</text>
  <text x="960" y="474" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="700">+</text>
  <rect x="1058.28" y="463.8" width="67.44" height="20.4" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1092" y="478.32" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">载体蛋白</text>
  <line x1="980" y1="492" x2="980" y2="528" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <text x="1030" y="514" font-size="10.5" fill="#64748b" text-anchor="middle">偶联</text>
  <ellipse cx="980" cy="582" rx="120" ry="46" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="2.2"/>
  <circle cx="880" cy="560" r="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <circle cx="920" cy="548" r="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <circle cx="1050" cy="552" r="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <text x="980" y="588" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">载体蛋白</text>
  <text x="980" y="648" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">半抗原-载体偶联物 = 完全抗原（获得免疫原性）</text>
  <text x="980" y="672" font-size="10" fill="#64748b" text-anchor="middle">圆点示结合于载体的半抗原（B 表位），载体蛋白提供 T 表位</text>
  <rect x="30" y="694" width="1340" height="284" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="716.84" font-size="19" fill="#475569" font-weight="700">三、载体效应：B 表位与 T 表位的分工协作（Mitchison 经典实验 · 药物超敏 · 结合疫苗）</text>
  <rect x="60" y="738" width="400" height="202" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="78" y="764" font-size="12.5" fill="#075985" font-weight="700">经典载体效应实验（60 年代）</text>
  <text x="78" y="788" font-size="11" fill="#475569">DNP-OVA 免疫小鼠后分别加强：</text>
  <text x="78" y="812" font-size="11" fill="#059669" font-weight="600">· DNP-OVA（同载体）→ 强再次应答</text>
  <text x="78" y="836" font-size="11" fill="#dc2626" font-weight="600">· DNP-BSA（换载体）→ 应答微弱</text>
  <text x="78" y="860" font-size="10.5" fill="#64748b">结论：半抗原的应答依赖载体上的 T 表位——B 识别半抗原、T 识别载体，</text>
  <text x="78" y="875" font-size="10.5" fill="#64748b">二者协作。</text>
  <rect x="490" y="738" width="400" height="202" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.6"/>
  <text x="508" y="764" font-size="12.5" fill="#dc2626" font-weight="700">药物超敏的分子基础</text>
  <text x="508" y="788" font-size="11" fill="#475569">青霉素等药物小分子本身无免疫原性；</text>
  <text x="508" y="805" font-size="11" fill="#475569">进入体内与组织蛋白结合后成为完全抗原，继而诱发药物超敏反应。</text>
  <rect x="604.67275" y="870.65" width="170.65449999999998" height="18.7" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="690" y="883.96" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">小分子 + 组织蛋白 → 完全抗原</text>
  <rect x="920" y="738" width="400" height="202" rx="9" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.6"/>
  <text x="938" y="764" font-size="12.5" fill="#065f46" font-weight="700">结合疫苗的巧用</text>
  <text x="938" y="788" font-size="11" fill="#475569">细菌荚膜多糖本身难以在婴幼儿中诱导记忆性免疫；将其偶联载体蛋白，</text>
  <text x="938" y="805" font-size="11" fill="#475569">即借载体效应获得 T 细胞依赖的记忆性免疫。</text>
  <rect x="1029.91415" y="870.65" width="180.1717" height="18.7" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="1120" y="883.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">多糖偶联载体蛋白 → 记忆性免疫</text>
</svg>