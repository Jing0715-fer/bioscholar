<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" font-family="Noto Serif SC, LXGW WenKai, sans-serif">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="950" fill="#ffffff"/>
  <text x="750" y="56" text-anchor="middle" font-size="34" font-weight="700" fill="#1e293b">静息膜电位的离子基础</text>
  <text x="750" y="92" text-anchor="middle" font-size="19" fill="#64748b">离子分布不均 + K⁺ 漏通道外流 + Na⁺/K⁺-ATP 酶生电性泵 → 外正内负 ≈ −70 mV</text>

  <!-- ==================== 细胞外液区域 ==================== -->
  <rect x="60" y="120" width="1380" height="330" fill="#fef3c7" fill-opacity="0.30"/>
  <text x="92" y="156" font-size="21" font-weight="700" fill="#92400e">细胞外液（组织液 / 血浆）</text>
  <text x="92" y="184" font-size="17" fill="#a16207">高 Na⁺ · 高 Cl⁻ · 低 K⁺</text>

  <!-- 胞外 Na+（金色） -->
  <g font-size="17" font-weight="700">
    <g transform="translate(240,240)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
    <g transform="translate(320,300)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
    <g transform="translate(400,235)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
    <g transform="translate(490,315)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
    <g transform="translate(580,245)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
    <g transform="translate(660,320)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
    <g transform="translate(1150,245)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
    <g transform="translate(1230,315)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
    <g transform="translate(1310,240)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
    <g transform="translate(1380,300)"><circle r="17" fill="#fbbf24" fill-opacity="0.9" stroke="#b45309" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#78350f">Na⁺</text></g>
  </g>
  <!-- 胞外 Cl-（石板灰） -->
  <g font-size="16" font-weight="700">
    <g transform="translate(270,360)"><circle r="17" fill="#cbd5e1" fill-opacity="0.95" stroke="#475569" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#1e293b">Cl⁻</text></g>
    <g transform="translate(430,370)"><circle r="17" fill="#cbd5e1" fill-opacity="0.95" stroke="#475569" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#1e293b">Cl⁻</text></g>
    <g transform="translate(610,375)"><circle r="17" fill="#cbd5e1" fill-opacity="0.95" stroke="#475569" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#1e293b">Cl⁻</text></g>
    <g transform="translate(1180,365)"><circle r="17" fill="#cbd5e1" fill-opacity="0.95" stroke="#475569" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#1e293b">Cl⁻</text></g>
    <g transform="translate(1345,370)"><circle r="17" fill="#cbd5e1" fill-opacity="0.95" stroke="#475569" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#1e293b">Cl⁻</text></g>
    <g transform="translate(960,300)"><circle r="17" fill="#cbd5e1" fill-opacity="0.95" stroke="#475569" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#1e293b">Cl⁻</text></g>
  </g>
  <!-- 胞外少量 K+ -->
  <g font-size="16" font-weight="700">
    <g transform="translate(350,250)"><circle r="17" fill="#6ee7b7" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
    <g transform="translate(1290,330)"><circle r="17" fill="#6ee7b7" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
  </g>

  <!-- ==================== 磷脂双分子层（膜） ==================== -->
  <g>
    <!-- 上层头部 -->
    <g fill="#2dd4bf" fill-opacity="0.75">
      <circle cx="100" cy="450" r="10"/><circle cx="140" cy="450" r="10"/><circle cx="180" cy="450" r="10"/><circle cx="220" cy="450" r="10"/><circle cx="260" cy="450" r="10"/><circle cx="300" cy="450" r="10"/><circle cx="340" cy="450" r="10"/><circle cx="380" cy="450" r="10"/><circle cx="420" cy="450" r="10"/><circle cx="460" cy="450" r="10"/><circle cx="500" cy="450" r="10"/><circle cx="540" cy="450" r="10"/><circle cx="580" cy="450" r="10"/><circle cx="620" cy="450" r="10"/><circle cx="660" cy="450" r="10"/><circle cx="700" cy="450" r="10"/><circle cx="740" cy="450" r="10"/><circle cx="780" cy="450" r="10"/><circle cx="820" cy="450" r="10"/><circle cx="860" cy="450" r="10"/><circle cx="900" cy="450" r="10"/><circle cx="940" cy="450" r="10"/><circle cx="980" cy="450" r="10"/><circle cx="1020" cy="450" r="10"/><circle cx="1060" cy="450" r="10"/><circle cx="1100" cy="450" r="10"/><circle cx="1140" cy="450" r="10"/><circle cx="1180" cy="450" r="10"/><circle cx="1220" cy="450" r="10"/><circle cx="1260" cy="450" r="10"/><circle cx="1300" cy="450" r="10"/><circle cx="1340" cy="450" r="10"/><circle cx="1380" cy="450" r="10"/><circle cx="1420" cy="450" r="10"/>
    </g>
    <!-- 尾部（竖线带弯） -->
    <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
      <line x1="100" y1="460" x2="100" y2="540"/><line x1="140" y1="460" x2="140" y2="540"/><line x1="180" y1="460" x2="180" y2="540"/><line x1="220" y1="460" x2="220" y2="540"/><line x1="260" y1="460" x2="260" y2="540"/><line x1="300" y1="460" x2="300" y2="540"/><line x1="340" y1="460" x2="340" y2="540"/><line x1="380" y1="460" x2="380" y2="540"/><line x1="420" y1="460" x2="420" y2="540"/><line x1="460" y1="460" x2="460" y2="540"/><line x1="500" y1="460" x2="500" y2="540"/><line x1="540" y1="460" x2="540" y2="540"/><line x1="580" y1="460" x2="580" y2="540"/><line x1="620" y1="460" x2="620" y2="540"/><line x1="660" y1="460" x2="660" y2="540"/><line x1="700" y1="460" x2="700" y2="540"/><line x1="740" y1="460" x2="740" y2="540"/><line x1="780" y1="460" x2="780" y2="540"/><line x1="820" y1="460" x2="820" y2="540"/><line x1="860" y1="460" x2="860" y2="540"/><line x1="900" y1="460" x2="900" y2="540"/><line x1="940" y1="460" x2="940" y2="540"/><line x1="980" y1="460" x2="980" y2="540"/><line x1="1020" y1="460" x2="1020" y2="540"/><line x1="1060" y1="460" x2="1060" y2="540"/><line x1="1100" y1="460" x2="1100" y2="540"/><line x1="1140" y1="460" x2="1140" y2="540"/><line x1="1180" y1="460" x2="1180" y2="540"/><line x1="1220" y1="460" x2="1220" y2="540"/><line x1="1260" y1="460" x2="1260" y2="540"/><line x1="1300" y1="460" x2="1300" y2="540"/><line x1="1340" y1="460" x2="1340" y2="540"/><line x1="1380" y1="460" x2="1380" y2="540"/><line x1="1420" y1="460" x2="1420" y2="540"/>
    </g>
    <!-- 下层头部 -->
    <g fill="#f59e0b" fill-opacity="0.80">
      <circle cx="100" cy="550" r="10"/><circle cx="140" cy="550" r="10"/><circle cx="180" cy="550" r="10"/><circle cx="220" cy="550" r="10"/><circle cx="260" cy="550" r="10"/><circle cx="300" cy="550" r="10"/><circle cx="340" cy="550" r="10"/><circle cx="380" cy="550" r="10"/><circle cx="420" cy="550" r="10"/><circle cx="460" cy="550" r="10"/><circle cx="500" cy="550" r="10"/><circle cx="540" cy="550" r="10"/><circle cx="580" cy="550" r="10"/><circle cx="620" cy="550" r="10"/><circle cx="660" cy="550" r="10"/><circle cx="700" cy="550" r="10"/><circle cx="740" cy="550" r="10"/><circle cx="780" cy="550" r="10"/><circle cx="820" cy="550" r="10"/><circle cx="860" cy="550" r="10"/><circle cx="900" cy="550" r="10"/><circle cx="940" cy="550" r="10"/><circle cx="980" cy="550" r="10"/><circle cx="1020" cy="550" r="10"/><circle cx="1060" cy="550" r="10"/><circle cx="1100" cy="550" r="10"/><circle cx="1140" cy="550" r="10"/><circle cx="1180" cy="550" r="10"/><circle cx="1220" cy="550" r="10"/><circle cx="1260" cy="550" r="10"/><circle cx="1300" cy="550" r="10"/><circle cx="1340" cy="550" r="10"/><circle cx="1380" cy="550" r="10"/><circle cx="1420" cy="550" r="10"/>
    </g>
    <text x="1448" y="456" font-size="16" fill="#475569" text-anchor="middle">膜</text>
    <text x="1448" y="548" font-size="16" fill="#475569" text-anchor="middle">磷脂双层</text>
  </g>

  <!-- ==================== K+ 漏通道 ==================== -->
  <g transform="translate(430,500)">
    <!-- 通道蛋白（跨膜桶状） -->
    <path d="M-38,-52 C-30,-14 -30,14 -38,52 L38,52 C30,14 30,-14 38,-52 Z" fill="#a7f3d0" fill-opacity="0.85" stroke="#047857" stroke-width="2.5"/>
    <path d="M-14,-52 C-8,-20 -8,20 -14,52" fill="none" stroke="#047857" stroke-width="2"/>
    <path d="M14,-52 C8,-20 8,20 14,52" fill="none" stroke="#047857" stroke-width="2"/>
    <text x="0" y="86" text-anchor="middle" font-size="19" font-weight="700" fill="#047857">K⁺ 漏通道（孔道开放）</text>
    <text x="0" y="112" text-anchor="middle" font-size="15" fill="#64748b">膜对 K⁺ 的本底通透性最高</text>
    <!-- K+ 正在通过（向上外流） -->
    <g transform="translate(0,-18)">
      <circle r="15" fill="#6ee7b7" fill-opacity="0.95" stroke="#047857" stroke-width="1.8"/>
      <text y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">K⁺</text>
    </g>
    <line x1="0" y1="42" x2="0" y2="-6" stroke="#047857" stroke-width="3" marker-end="url(#arrE)"/>
    <text x="64" y="-26" font-size="16" fill="#047857">K⁺ 顺浓度梯度外流</text>
    <text x="64" y="-4" font-size="15" fill="#64748b">（正电荷净外移）</text>
  </g>

  <!-- ==================== Na+/K+ ATP 酶 ==================== -->
  <g transform="translate(1010,500)">
    <!-- 泵蛋白 -->
    <path d="M-58,-56 C-48,-16 -48,16 -58,56 L58,56 C48,16 48,-56 58,-56 Z" fill="#fecaca" fill-opacity="0.7" stroke="#b91c1c" stroke-width="2.5"/>
    <ellipse cx="0" cy="-20" rx="30" ry="16" fill="#ef4444" fill-opacity="0.30" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="0" y="88" text-anchor="middle" font-size="19" font-weight="700" fill="#b91c1c">Na⁺/K⁺-ATP 酶</text>
    <text x="0" y="114" text-anchor="middle" font-size="15" fill="#64748b">每水解 1 ATP 泵出 3 Na⁺、泵入 2 K⁺</text>
    <!-- 3 Na+ 出（向上箭头） -->
    <line x1="-34" y1="-30" x2="-34" y2="-104" stroke="#b45309" stroke-width="3.5" marker-end="url(#arrA)"/>
    <line x1="-8" y1="-30" x2="-8" y2="-104" stroke="#b45309" stroke-width="3.5" marker-end="url(#arrA)"/>
    <line x1="18" y1="-30" x2="18" y2="-104" stroke="#b45309" stroke-width="3.5" marker-end="url(#arrA)"/>
    <text x="-12" y="-128" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">3 Na⁺ 泵出</text>
    <!-- 2 K+ 入（向下箭头） -->
    <line x1="-18" y1="34" x2="-18" y2="108" stroke="#047857" stroke-width="3.5" marker-end="url(#arrE)"/>
    <line x1="12" y1="34" x2="12" y2="108" stroke="#047857" stroke-width="3.5" marker-end="url(#arrE)"/>
    <text x="106" y="66" font-size="17" font-weight="700" fill="#047857">2 K⁺ 泵入</text>
    <!-- ATP -->
    <g transform="translate(-88,-46)">
      <ellipse cx="0" cy="0" rx="30" ry="17" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/>
      <text y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">ATP</text>
      <text x="-6" y="40" font-size="14" fill="#64748b">磷酸化供能</text>
    </g>
    <text x="150" y="-40" font-size="15" fill="#64748b">净外移 1 个正电荷</text>
    <text x="150" y="-18" font-size="15" fill="#64748b">→ 生电性泵</text>
  </g>

  <!-- ==================== 细胞质区域 ==================== -->
  <rect x="60" y="620" width="1380" height="250" fill="#d1fae5" fill-opacity="0.30"/>
  <text x="92" y="656" font-size="21" font-weight="700" fill="#065f46">细胞质（细胞内液）</text>
  <text x="92" y="684" font-size="17" fill="#047857">高 K⁺ · 低 Na⁺ · 富含不可通透阴离子 A⁻</text>

  <!-- 胞内 K+（翠绿） -->
  <g font-size="16" font-weight="700">
    <g transform="translate(240,740)"><circle r="17" fill="#34d399" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
    <g transform="translate(330,800)"><circle r="17" fill="#34d399" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
    <g transform="translate(430,745)"><circle r="17" fill="#34d399" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
    <g transform="translate(530,810)"><circle r="17" fill="#34d399" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
    <g transform="translate(630,748)"><circle r="17" fill="#34d399" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
    <g transform="translate(1160,745)"><circle r="17" fill="#34d399" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
    <g transform="translate(1250,810)"><circle r="17" fill="#34d399" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
    <g transform="translate(1345,748)"><circle r="17" fill="#34d399" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
    <g transform="translate(1420,812)"><circle r="17" fill="#34d399" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/><text y="6" text-anchor="middle" fill="#064e3b">K⁺</text></g>
  </g>
  <!-- 胞内 A-（大分子阴离子） -->
  <g>
    <g transform="translate(760,780)"><ellipse rx="56" ry="30" fill="#94a3b8" fill-opacity="0.55" stroke="#334155" stroke-width="2"/><text y="7" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">A⁻</text></g>
    <g transform="translate(980,790)"><ellipse rx="56" ry="30" fill="#94a3b8" fill-opacity="0.55" stroke="#334155" stroke-width="2"/><text y="7" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">A⁻</text></g>
    <text x="870" y="856" text-anchor="middle" font-size="15" fill="#475569">蛋白质、磷酸化中间物等（不能透过膜）</text>
  </g>
  <!-- 胞内少量 Na+ -->
  <g transform="translate(180,810)"><circle r="15" fill="#fbbf24" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Na⁺</text></g>

  <!-- ==================== 电位计 ==================== -->
  <g transform="translate(1350,430)">
    <circle cx="0" cy="0" r="86" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <path d="M-58,30 A65,65 0 0 1 58,30" fill="none" stroke="#e11d48" stroke-width="5"/>
    <!-- 指针指向负区（左上） -->
    <line x1="0" y1="6" x2="-34" y2="-52" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="9" fill="#1e293b"/>
    <text x="-66" y="-34" font-size="20" font-weight="700" fill="#e11d48">−</text>
    <text x="58" y="-34" font-size="20" font-weight="700" fill="#334155">+</text>
    <text x="0" y="112" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">静息电位 ≈ −70 mV</text>
    <text x="0" y="138" text-anchor="middle" font-size="15" fill="#64748b">（膜内相对膜外）</text>
  </g>

  <!-- 极性标记：膜外+ / 膜内− -->
  <g font-size="20" font-weight="700" fill="#334155">
    <text x="70" y="448">+</text><text x="118" y="448">+</text><text x="166" y="448">+</text><text x="214" y="448">+</text><text x="262" y="448">+</text>
    <text x="70" y="576">−</text><text x="118" y="576">−</text><text x="166" y="576">−</text><text x="214" y="576">−</text><text x="262" y="576">−</text>
  </g>

  <!-- ==================== 底部注释 ==================== -->
  <line x1="60" y1="884" x2="1440" y2="884" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="750" y="916" text-anchor="middle" font-size="18" fill="#475569">K⁺ 外流使膜内负电荷积累，电位接近 K⁺ 的 Nernst 平衡电位 E<tspan font-size="13" baseline-shift="sub">K</tspan>（约 −90 mV）；生电性 Na⁺/K⁺ 泵与 Na⁺/Cl⁻ 渗漏把实测值拉升至约 −70 mV</text>
  <text x="750" y="944" text-anchor="middle" font-size="15" fill="#94a3b8">依据教材静息电位模型绘制（矢量示意图，非 AI 生成）</text>
</svg>
