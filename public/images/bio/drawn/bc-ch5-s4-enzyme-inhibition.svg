  <text x="726" y="830" font-size="11.5" fill="#475569">抑制剂多为底物类似物：丙二酸抑制琥珀酸脱氢酶（经典）；磺胺药（对氨基苯甲酸类似物）抑制细菌二氢叶酸合成酶；</text>
  <text x="726" y="847" font-size="11.5" fill="#475569">他汀与 HMG-CoA 竞争。</text>
  <text x="726" y="890" font-size="11.5" fill="#64748b">别构抑制（如 ATP 对 PFK-1）不属于上述动力学类型，产生 S 形而非双曲线动力学。</text>
</svg>