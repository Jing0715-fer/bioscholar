  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">酶的抑制作用：可逆三类与不可逆共价修饰</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">竞争性 Km↑Vmax 不变（双曲线右移、双倒数交纵轴）、非竞争性 Vmax↓Km 不变（交横轴）、反竞争性平行线；有机磷/氰化物等不可逆共价修饰必需基团</text>
