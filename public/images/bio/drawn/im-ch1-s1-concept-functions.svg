<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">免疫的基本概念与三大功能：防御、自稳与监视</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">免疫是识别自己与非己、排除非己、耐受自身以维持内稳态的生物学过程；固有免疫与生俱来、应答快、无经典记忆，适应性免疫特异、有记忆、启动慢；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">功能过强或不足分别对应超敏反应、自身免疫病与免疫缺陷、肿瘤</text>
  <rect x="30" y="132" width="1340" height="312" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、免疫的概念与三大功能：识别自己与非己，维持内稳态</text>
  <rect x="93.5225" y="188.525" width="172.955" height="22.95" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="180" y="204.86" font-size="13.5" fill="#075985" text-anchor="middle" font-weight="700">识别「自己」与「非己」</text>
  <line x1="272" y1="200" x2="330" y2="200" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="336.28499999999997" y="188.525" width="103.43" height="22.95" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="388" y="204.86" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="700">排除非己抗原</text>
  <line x1="446" y1="200" x2="504" y2="200" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="510.28499999999997" y="188.525" width="103.43" height="22.95" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="562" y="204.86" font-size="13.5" fill="#065f46" text-anchor="middle" font-weight="700">耐受自身成分</text>
  <line x1="620" y1="200" x2="678" y2="200" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="671.6175" y="188.525" width="200.76500000000001" height="22.95" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="772" y="204.86" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="700">维持内稳态（远不止抗感染）</text>
  <rect x="895" y="176" width="452" height="50" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="909" y="196" font-size="10.5" fill="#475569">公元前 430 年雅典大瘟疫：</text>
  <text x="909" y="211" font-size="10.5" fill="#475569">修昔底德观察到幸存者不会再二次染病——免疫「记忆」的最早记载</text>
  <rect x="60" y="244" width="398" height="176" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <rect x="60" y="244" width="398" height="40" rx="10" fill="#0f766e" fill-opacity="0.14" stroke="#0f766e" stroke-width="1.2"/>
  <text x="259" y="270" font-size="17" fill="#134e4a" text-anchor="middle" font-weight="700">免疫防御</text>
  <text x="259" y="306" font-size="11.5" fill="#64748b" text-anchor="middle">对象：病原体</text>
  <rect x="95.67" y="326.65" width="36.66" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="114" y="339.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">生理</text>
  <text x="168" y="340" font-size="12.5" fill="#475569">抵御病原体感染</text>
  <rect x="95.67" y="362.65" width="36.66" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="114" y="375.96" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">过强</text>
  <text x="168" y="376" font-size="12.5" fill="#475569">超敏反应</text>
  <rect x="95.67" y="398.65" width="36.66" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="114" y="411.96" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">不足</text>
  <text x="168" y="412" font-size="12.5" fill="#475569">免疫缺陷 · 反复感染</text>
  <rect x="505" y="244" width="398" height="176" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/>
  <rect x="505" y="244" width="398" height="40" rx="10" fill="#6d28d9" fill-opacity="0.14" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="704" y="270" font-size="17" fill="#4c1d95" text-anchor="middle" font-weight="700">免疫自稳</text>
  <text x="704" y="306" font-size="11.5" fill="#64748b" text-anchor="middle">对象：自身衰变成分</text>
  <rect x="540.67" y="326.65" width="36.66" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="559" y="339.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">生理</text>
  <text x="613" y="340" font-size="12.5" fill="#475569">清除衰变、凋亡的自身成分</text>
  <rect x="540.67" y="362.65" width="36.66" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="559" y="375.96" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">异常</text>
  <text x="613" y="376" font-size="12.5" fill="#475569">自身免疫病</text>
  <rect x="950" y="244" width="398" height="176" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.8"/>
  <rect x="950" y="244" width="398" height="40" rx="10" fill="#0369a1" fill-opacity="0.14" stroke="#0369a1" stroke-width="1.2"/>
  <text x="1149" y="270" font-size="17" fill="#075985" text-anchor="middle" font-weight="700">免疫监视</text>
  <text x="1149" y="306" font-size="11.5" fill="#64748b" text-anchor="middle">对象：突变与病毒感染细胞</text>
  <rect x="985.67" y="326.65" width="36.66" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1004" y="339.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">生理</text>
  <text x="1058" y="340" font-size="12.5" fill="#475569">清除突变细胞与病毒感染细胞</text>
  <rect x="985.67" y="362.65" width="36.66" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1004" y="375.96" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">异常</text>
  <text x="1058" y="376" font-size="12.5" fill="#475569">肿瘤发生 · 持续感染</text>
  <rect x="30" y="460" width="1340" height="244" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="482.84" font-size="19" fill="#475569" font-weight="700">二、固有免疫与适应性免疫：两层防御的接力协作</text>
  <rect x="60" y="512" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="539.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">比较项</text>
  <rect x="170" y="512" width="230" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="285" y="539.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">固有免疫</text>
  <rect x="400" y="512" width="280" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="539.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">适应性免疫</text>
  <rect x="60" y="556" width="110" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="581.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">获得方式</text>
  <rect x="170" y="556" width="230" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="285" y="581.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">与生俱来</text>
  <rect x="400" y="556" width="280" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="581.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">抗原激发后获得</text>
  <rect x="60" y="596" width="620" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="596" width="110" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="621.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">应答速度</text>
  <rect x="170" y="596" width="230" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="285" y="621.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">快，即刻启动</text>
  <rect x="400" y="596" width="280" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="621.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">慢，需克隆扩增</text>
  <rect x="60" y="636" width="110" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="661.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">特异性</text>
  <rect x="170" y="636" width="230" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="285" y="661.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">非特异、广谱</text>
  <rect x="400" y="636" width="280" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="661.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">高度特异</text>
  <rect x="60" y="676" width="620" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="676" width="110" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="701.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">记忆性</text>
  <rect x="170" y="676" width="230" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="285" y="701.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">无经典记忆</text>
  <rect x="400" y="676" width="280" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="701.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">有免疫记忆</text>
  <rect x="710" y="508" width="630" height="62" rx="9" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.8"/>
  <text x="730" y="534" font-size="14" fill="#134e4a" font-weight="700">固有免疫 —— 快而广</text>
  <text x="730" y="556" font-size="11.5" fill="#475569">屏障 · 吞噬 · NK · 补体 · 炎症</text>
  <line x1="1025" y1="572" x2="1025" y2="596" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="1155" y="588" font-size="11" fill="#64748b" text-anchor="middle">提呈抗原，启动适应应答</text>
  <rect x="710" y="598" width="630" height="62" rx="9" fill="#ede9fe" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="730" y="624" font-size="14" fill="#4c1d95" font-weight="700">适应性免疫 —— 慢而准</text>
  <text x="730" y="646" font-size="11.5" fill="#475569">T/B 克隆扩增 · 特异性清除 · 记忆</text>
  <text x="710" y="682" font-size="11" fill="#64748b">训练免疫：固有免疫细胞亦具表观记忆——两类免疫的传统边界被模糊。</text>
  <rect x="30" y="720" width="1340" height="258" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="742.84" font-size="19" fill="#475569" font-weight="700">三、免疫功能的「双刃剑」：免疫追求适度而非「强」</text>
  <line x1="80" y1="786" x2="1310" y2="786" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <text x="80" y="774" font-size="12.5" fill="#475569" font-weight="700">免疫功能强度</text>
  <rect x="80" y="806" width="400" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="280" y="828" font-size="14.5" fill="#b91c1c" text-anchor="middle" font-weight="700">功能不足</text>
  <rect x="480" y="806" width="440" height="34" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="700" y="828" font-size="14.5" fill="#065f46" text-anchor="middle" font-weight="700">适度 · 内稳态</text>
  <rect x="920" y="806" width="390" height="34" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="1115" y="828" font-size="14.5" fill="#b45309" text-anchor="middle" font-weight="700">功能过强</text>
  <text x="280" y="868" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="600">免疫缺陷 · 反复感染</text>
  <text x="280" y="888" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="600">监视失效 → 肿瘤易发</text>
  <text x="700" y="868" font-size="12" fill="#065f46" text-anchor="middle" font-weight="600">防御 · 自稳 · 监视平衡</text>
  <text x="700" y="888" font-size="12" fill="#065f46" text-anchor="middle" font-weight="600">识别自己、耐受自身</text>
  <text x="1115" y="868" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">超敏反应（I–IV 型）</text>
  <text x="1115" y="888" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">自身免疫病</text>
  <text x="700" y="946" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">「免疫」不是越强越好——过犹不及，适度即健康</text>
</svg>