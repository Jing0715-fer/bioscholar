<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">补体的组成、命名与合成：命名序号 ≠ 激活顺序</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">补体由 40 余种蛋白质组成，总量约占血清球蛋白的 10%；固有成分按发现先后命名 C1–C9，经典途径实际激活顺序为 C1、C4、C2、C3、C5；C3 浓度最高（约 1.2–1.6 g/L）、D 因子最小（约 24 kDa，1–2 mg/L）、C4bp 可达约 550 kDa；56 °C 30 分钟即被灭活；血浆补体主要由肝细胞合成，巨噬细胞是炎症灶局部补体的重要来源</text>
  <rect x="30" y="132" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、命名法则：按发现先后编号（C1–C9），与激活顺序并不一致</text>
  <text x="700" y="186" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">发现顺序（命名序号）</text>
  <rect x="80" y="200" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="140" y="222" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">C1</text>
  <rect x="225" y="200" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="285" y="222" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">C2</text>
  <rect x="370" y="200" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="430" y="222" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">C3</text>
  <rect x="515" y="200" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="575" y="222" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">C4</text>
  <rect x="660" y="200" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="720" y="222" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">C5</text>
  <rect x="805" y="200" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="865" y="222" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">C6</text>
  <rect x="950" y="200" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1010" y="222" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">C7</text>
  <rect x="1095" y="200" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1155" y="222" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">C8</text>
  <rect x="1240" y="200" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1300" y="222" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="700">C9</text>
  <text x="700" y="286" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">经典途径的实际激活顺序</text>
  <rect x="90" y="300" width="150" height="40" rx="7" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.8"/>
  <text x="165" y="326" font-size="14.5" fill="#dc2626" text-anchor="middle" font-weight="700">C1</text>
  <line x1="244" y1="320" x2="308" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="315" y="300" width="150" height="40" rx="7" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.8"/>
  <text x="390" y="326" font-size="14.5" fill="#dc2626" text-anchor="middle" font-weight="700">C4</text>
  <line x1="469" y1="320" x2="533" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="540" y="300" width="150" height="40" rx="7" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.8"/>
  <text x="615" y="326" font-size="14.5" fill="#dc2626" text-anchor="middle" font-weight="700">C2</text>
  <line x1="694" y1="320" x2="758" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="765" y="300" width="150" height="40" rx="7" fill="#fce7f3" fill-opacity="0.5" stroke="#be185d" stroke-width="1.8"/>
  <text x="840" y="326" font-size="14.5" fill="#831843" text-anchor="middle" font-weight="700">C3</text>
  <line x1="919" y1="320" x2="983" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="990" y="300" width="150" height="40" rx="7" fill="#fce7f3" fill-opacity="0.5" stroke="#be185d" stroke-width="1.8"/>
  <text x="1065" y="326" font-size="14.5" fill="#831843" text-anchor="middle" font-weight="700">C5</text>
  <line x1="1144" y1="320" x2="1208" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="1215" y="300" width="150" height="40" rx="7" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1290" y="326" font-size="14.5" fill="#dc2626" text-anchor="middle" font-weight="700">C6–C9</text>
  <text x="700" y="376" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">能裂解 C3 与 C5 的复合酶分别称 C3 转化酶与 C5 转化酶——三条激活途径殊途同归的汇合点</text>
  <text x="700" y="404" font-size="10.5" fill="#64748b" text-anchor="middle">注意：C4 与 C2 的序号早于 C3，却在 C3 之前被激活</text>
  <rect x="30" y="448" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="470.84" font-size="19" fill="#475569" font-weight="700">二、40 余种蛋白按职能分组：固有成分 · 调节蛋白 · 补体受体</text>
  <rect x="60" y="494" width="220" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="521.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">组别</text>
  <rect x="280" y="494" width="520" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="521.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">代表成分</text>
  <rect x="800" y="494" width="540" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1070" y="521.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">主要职能</text>
  <rect x="60" y="538" width="220" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="565.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">固有成分</text>
  <rect x="280" y="538" width="520" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="565.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">C1–C9 · B / D / P 因子 · MBL</text>
  <rect x="800" y="538" width="540" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1070" y="565.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">组成级联反应的执行序列</text>
  <rect x="60" y="582" width="1280" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="582" width="220" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="609.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">可溶性调节蛋白</text>
  <rect x="280" y="582" width="520" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="609.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">C1-INH · C4bp · H 因子 · I 因子 · S 蛋白</text>
  <rect x="800" y="582" width="540" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1070" y="609.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">灭活启动酶与转化酶，限制 MAC</text>
  <rect x="60" y="626" width="220" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="653.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">膜型调节蛋白与受体</text>
  <rect x="280" y="626" width="520" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="653.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">DAF（CD55）· MCP（CD46）· CD59 · CR1–CR4</text>
  <rect x="800" y="626" width="540" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1070" y="653.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">保护自身细胞并介导效应</text>
  <text x="700" y="672" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">调节蛋白的数量与固有成分相当——级联之猛，恰需刹车之精</text>
  <rect x="30" y="714" width="1340" height="264" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="736.84" font-size="19" fill="#475569" font-weight="700">三、理化特性与生物合成：肝细胞与巨噬细胞双中心</text>
  <rect x="60" y="758" width="620" height="186" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="80" y="784" font-size="13" fill="#1e293b" font-weight="700">理化特性与量级悬殊</text>
  <circle cx="100" cy="810" r="3.5" fill="#0369a1"/>
  <text x="112" y="814" font-size="11.5" fill="#1e293b" font-weight="700">总量</text>
  <text x="204" y="814" font-size="10.5" fill="#475569">约占血清球蛋白的 10%，体液丰度最高的蛋白体系之一</text>
  <circle cx="100" cy="842" r="3.5" fill="#0369a1"/>
  <text x="112" y="846" font-size="11.5" fill="#1e293b" font-weight="700">热不稳定性</text>
  <text x="204" y="846" font-size="10.5" fill="#475569">血清经 56 °C 作用 30 分钟即被灭活（体外清除补体活性的经典操作）</text>
  <circle cx="100" cy="874" r="3.5" fill="#0369a1"/>
  <text x="112" y="878" font-size="11.5" fill="#1e293b" font-weight="700">浓度两端</text>
  <text x="204" y="878" font-size="10.5" fill="#475569">C3 最高（约 1.2–1.6 g/L）；D 因子最小（约 24 kDa、1–2 mg/L）</text>
  <circle cx="100" cy="906" r="3.5" fill="#0369a1"/>
  <text x="112" y="910" font-size="11.5" fill="#1e293b" font-weight="700">分子量两端</text>
  <text x="204" y="910" font-size="10.5" fill="#475569">D 因子约 24 kDa；C4bp 可达约 550 kDa</text>
  <text x="370" y="930" font-size="10" fill="#64748b" text-anchor="middle">D 因子浓度最低，恰与其旁路限速酶的身份相称</text>
  <rect x="710" y="758" width="610" height="186" rx="9" fill="#fef3c7" fill-opacity="0.35" stroke="#b45309" stroke-width="1.5"/>
  <text x="730" y="784" font-size="13" fill="#78350f" font-weight="700">生物合成双中心</text>
  <rect x="740" y="806" width="250" height="72" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="865" y="832" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">肝细胞</text>
  <text x="865" y="854" font-size="10.5" fill="#475569" text-anchor="middle">血浆补体的主要来源</text>
  <rect x="1040" y="806" width="250" height="72" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="1165" y="832" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">巨噬细胞</text>
  <text x="1165" y="854" font-size="10.5" fill="#475569" text-anchor="middle">炎症灶局部补体的重要来源</text>
  <text x="1015" y="912" font-size="11" fill="#78350f" text-anchor="middle" font-weight="600">局部合成受 IL-6、IFN-γ 等细胞因子调控</text>
  <text x="1015" y="936" font-size="10.5" fill="#64748b" text-anchor="middle">补体 = 全身储备 + 局部增产</text>
</svg>