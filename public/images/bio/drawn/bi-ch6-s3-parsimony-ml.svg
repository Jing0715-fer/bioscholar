  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">最大简约与最大似然：信息位点、Fitch 与模型驱动</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">简约法选替换总步数最少的拓扑，Fitch算法后序交并集计变化、前序落实状态；信息位点须至少两种状态且各出现至少两次；ML以数据似然为准则、GTR+Γ+I为常用模型族，</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">修剪算法把逐位点似然压成线性，模型选择以AIC/BIC权衡，IQ-TREE与RAxML为现代引擎</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、信息位点：不是每列都投票</text>
  <rect x="93" y="204" width="34" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="222" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">A</text>
  <rect x="93" y="234" width="34" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="252" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">A</text>
  <rect x="93" y="264" width="34" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="110" y="282" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">A</text>
