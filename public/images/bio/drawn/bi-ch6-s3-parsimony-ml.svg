  <text x="607.5" y="866.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">AIC / BIC 权衡拟合与复杂度</text>
  <rect x="60" y="884" width="130" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="912.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">现代引擎</text>
  <rect x="190" y="884" width="265" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="322.5" y="912.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">——</text>
  <rect x="455" y="884" width="305" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="607.5" y="912.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">IQ-TREE / RAxML：大规模类元与分区模型</text>
  <rect x="790" y="660" width="560" height="124" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="810" y="688" font-size="13" fill="#1e293b" font-weight="700">模型选择</text>
  <text x="810" y="714" font-size="11.5" fill="#475569">AIC / BIC 在拟合优度与参数复杂度之间权衡；嵌套模型可用似然比检验直接比较。</text>
  <rect x="790" y="800" width="560" height="124" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
