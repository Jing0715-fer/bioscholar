  <rect x="455" y="656" width="305" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="607.5" y="683.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">最大似然法</text>
  <rect x="60" y="700" width="130" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="728.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">评分准则</text>
  <rect x="190" y="700" width="265" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="322.5" y="728.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">替换总步数最少</text>
  <rect x="455" y="700" width="305" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="607.5" y="728.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">数据似然最大（模型驱动）</text>
  <rect x="60" y="746" width="700" height="46" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="746" width="130" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="774.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">替换模型</text>
  <rect x="190" y="746" width="265" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="322.5" y="774.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">无需显式替换模型</text>
  <rect x="455" y="746" width="305" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="607.5" y="774.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">GTR+Γ+I 等显式模型族</text>
  <rect x="60" y="792" width="130" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="820.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">核心算法</text>
  <rect x="190" y="792" width="265" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="322.5" y="820.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">Fitch 后序 / 前序遍历</text>
  <rect x="455" y="792" width="305" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="607.5" y="820.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">修剪算法把逐位点似然压成线性</text>
  <rect x="60" y="838" width="700" height="46" fill="#f8fafc" fill-opacity="0.85"/>
