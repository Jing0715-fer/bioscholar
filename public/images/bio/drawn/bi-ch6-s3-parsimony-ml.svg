  <rect x="573" y="264" width="34" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="590" y="282" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">C</text>
  <rect x="573" y="294" width="34" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="590" y="312" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">T</text>
  <text x="590" y="360" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">四态各一次</text>
  <text x="590" y="380" font-size="10.5" fill="#94a3b8" text-anchor="middle">无区分力</text>
  <text x="60" y="420" font-size="11.5" fill="#475569">信息位点须至少两种状态且各出现至少两次——恒定、单例与四态各一次的位点均无区分力，</text>
  <text x="60" y="437" font-size="11.5" fill="#475569">不参与简约法的拓扑投票。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、Fitch 算法：后序计数、前序落实</text>
  <circle cx="820" cy="420" r="15" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
