  <text x="270" y="360" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">单例</text>
  <text x="270" y="380" font-size="10.5" fill="#94a3b8" text-anchor="middle">无区分力</text>
  <rect x="413" y="204" width="34" height="26" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="430" y="222" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">A</text>
  <rect x="413" y="234" width="34" height="26" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="430" y="252" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">A</text>
