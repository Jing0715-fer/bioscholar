  <rect x="413" y="294" width="34" height="26" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="430" y="312" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">G</text>
  <text x="430" y="360" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">信息位点</text>
  <text x="430" y="380" font-size="10.5" fill="#059669" text-anchor="middle">有区分力</text>
  <rect x="573" y="204" width="34" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="590" y="222" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">A</text>
