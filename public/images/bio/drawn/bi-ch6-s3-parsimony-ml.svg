  <circle cx="1120" cy="340" r="6" fill="#0369a1"/>
  <circle cx="1000" cy="270" r="7" fill="#dc2626"/>
  <text x="898" y="336" font-size="12" fill="#075985" font-weight="700">{A}，+0</text>
  <text x="1138" y="336" font-size="12" fill="#075985" font-weight="700">{G}，+0</text>
  <text x="1000" y="252" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">{A,G}，+1</text>
  <line x1="1000" y1="250" x2="1000" y2="238" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-bad)"/>
  <text x="1030" y="230" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">根：交集为空 → 取并集，计一次变化</text>
  <text x="740" y="450" font-size="11.5" fill="#475569">后序（叶 → 根）：对每内部节点取子集交集，空则并集并计一次变化；前序（根 → 叶）：</text>
  <text x="740" y="467" font-size="11.5" fill="#475569">把状态落实到分支。</text>
  <text x="740" y="218" font-size="11.5" fill="#64748b">该列在此拓扑下：</text>
  <rect x="879.0996" y="183.8" width="101.8008" height="20.4" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="930" y="198.32" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">最小变化数 = 1</text>
  <rect x="30" y="576" width="1340" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、最大简约法与最大似然法：两种评分哲学</text>
