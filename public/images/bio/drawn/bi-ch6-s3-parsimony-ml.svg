  <text x="110" y="360" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">恒定位点</text>
  <text x="110" y="380" font-size="10.5" fill="#94a3b8" text-anchor="middle">无区分力</text>
  <rect x="253" y="204" width="34" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
