  <text x="600" y="384" font-size="9" fill="#831843" text-anchor="middle">视网膜</text>
  <text x="140" y="412" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">正视眼</text>
  <text x="350" y="412" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">近视：眼轴过长/折光过强</text>
  <text x="560" y="412" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">远视：眼轴过短/折光过弱</text>
  <text x="50" y="462" font-size="10.5" fill="#475569">老视：晶状体弹性随增龄下降，调节幅度由青年 &gt;10 D 降至老年 &lt;2 D，近点远移；散光因角膜各经线曲率不一需柱镜矫正</text>
  <text x="50" y="512" font-size="10.5" fill="#475569">瞳孔光反射：视网膜 → 顶盖前区 → 双侧 E-W 核 → 动眼神经 → 睫状神经节 → 瞳孔括约肌（对光双侧同缩）</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、视网膜分层：光逆向穿过、信号正向传出</text>
