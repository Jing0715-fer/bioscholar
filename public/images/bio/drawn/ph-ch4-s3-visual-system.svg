  <text x="1195" y="330" font-size="10.5" fill="#475569">光感受器外段</text>
  <text x="1195" y="348" font-size="9.5" fill="#64748b">（视杆/视锥，远端）</text>
  <rect x="800" y="408" width="380" height="18" fill="#1e293b" fill-opacity="0.82"/>
  <text x="1195" y="421" font-size="10" fill="#475569">色素上皮（吞噬膜盘）</text>
  <rect x="800" y="432" width="380" height="14" fill="#dc2626" fill-opacity="0.3"/>
  <text x="1195" y="443" font-size="10" fill="#475569">脉络膜（血供）</text>
  <line x1="1160" y1="390" x2="1160" y2="220" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <text x="1160" y="208" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">信号流</text>
  <text x="800" y="470" font-size="10.5" fill="#475569">光必须先穿过透明的神经节与双极层才到达感受器——逆向设计；中心凹处内层被推向周边，光直接落在视锥上</text>
  <text x="800" y="488" font-size="10.5" fill="#475569">（视力最锐处，无视杆）</text>
  <text x="800" y="516" font-size="10.5" fill="#475569">视杆会聚度高（数十至数百杆汇于 1 个神经节细胞）→ 高灵敏低分辨；中央凹视锥近 1:1 → 高分辨</text>
  <rect x="30" y="572" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、视杆与视锥：两种光感受器</text>
  <rect x="50" y="626" width="90" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="653.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">特征</text>
  <rect x="140" y="626" width="260" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="270" y="653.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">视杆</text>
  <rect x="400" y="626" width="270" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="653.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">视锥</text>
  <rect x="50" y="670" width="90" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="695.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">数量</text>
  <rect x="140" y="670" width="260" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="270" y="695.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">约 1.2 亿/眼（&gt;95%）</text>
  <rect x="400" y="670" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="695.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">约 600 万/眼</text>
  <rect x="50" y="710" width="620" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="710" width="90" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="735.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">分布</text>
  <rect x="140" y="710" width="260" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="270" y="735.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">视网膜周边部，中央凹无</text>
  <rect x="400" y="710" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="735.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">中央凹密集（纯视锥区）</text>
  <rect x="50" y="750" width="90" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="775.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">视色素</text>
  <rect x="140" y="750" width="260" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="270" y="775.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">视紫红质（视蛋白+11-顺视黄醛）单一型</text>
  <rect x="400" y="750" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="775.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">L/M/S 三种视锥视蛋白（三色视觉基础）</text>
  <rect x="50" y="790" width="620" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="790" width="90" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="815.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">功能</text>
  <rect x="140" y="790" width="260" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="270" y="815.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">暗视：单光子敏感、无色觉、易饱和</text>
  <rect x="400" y="790" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="815.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">明视：三色觉、高时空分辨</text>
  <rect x="50" y="830" width="90" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="855.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">会聚</text>
  <rect x="140" y="830" width="260" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="270" y="855.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">高会聚（可达 100+ 杆 : 1 节细胞）</text>
  <rect x="400" y="830" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="855.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">中央凹近 1:1 → 高锐度</text>
  <text x="50" y="938" font-size="10.5" fill="#475569">暗适应：视锥先恢复（约 5–10 分钟），视杆阈值继续下降至 20–30 分钟达坪；维生素 A 缺乏 → 夜盲</text>
  <rect x="710" y="572" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、视觉通路：视交叉半交叉 → LGN → V1</text>
