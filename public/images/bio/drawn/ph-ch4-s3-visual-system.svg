  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">视觉：眼光学、视网膜换能与视觉通路</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">视杆约 1.2 亿（视紫红质、暗视单色），视锥约 600 万（L/M/S 三色明视）；近视焦点在前用凹透镜、远视焦点在后用凸透镜矫正；鼻侧纤维在视交叉交叉</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、眼光学与屈光矫正</text>
  <text x="50" y="176" font-size="10.5" fill="#475569">简化眼：角膜+晶状体合计折光力约 +59 D（角膜约 +43 D，占 2/3），房水/玻璃体折射率约 1.33；正视眼静息聚焦于视网膜，</text>
  <text x="50" y="194" font-size="10.5" fill="#475569">眼轴约 24 mm</text>
  <circle cx="140" cy="330" r="52" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
