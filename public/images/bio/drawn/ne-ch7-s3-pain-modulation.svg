<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">痛觉及其调制：分子换能、闸门学说与下行镇痛系统</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">TRPV1/ASIC 换能与炎性敏化；粗纤维关闸、细纤维开闸；PAG-大缝核下行以 5-HT/NE/脑啡肽刹车</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、伤害性感受器的分子换能与快慢痛</text>
  <rect x="121.8072" y="185.8" width="116.38560000000001" height="20.4" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="200.32" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">游离末梢 · 高阈值</text>
  <rect x="336.9636" y="185.8" width="166.0728" height="20.4" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="420" y="200.32" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">TRPV1：辣椒素 / &gt;43 ℃ 热</text>
  <rect x="547.1336" y="185.8" width="85.7328" height="20.4" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="590" y="200.32" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">ASIC：酸化</text>
  <text x="60" y="248" font-size="11" fill="#475569">炎症介质（缓激肽、前列腺素等）使末梢敏化——阈值降低、放电增强，炎症部位痛敏；伤害性感受器几乎不适应甚至敏化。</text>
  <rect x="60" y="310" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="337.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">比较项</text>
  <rect x="170" y="310" width="240" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="337.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">快痛（第一痛）</text>
  <rect x="410" y="310" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="337.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">慢痛（第二痛）</text>
  <rect x="60" y="354" width="110" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="379.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">传入纤维</text>
  <rect x="170" y="354" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="379.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">Aδ（薄髓，12–30 m/s）</text>
  <rect x="410" y="354" width="250" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="379.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">C（无髓，0.5–2 m/s）</text>
  <rect x="60" y="394" width="600" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="394" width="110" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="419.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">性质</text>
  <rect x="170" y="394" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="419.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">尖锐、刺痛，定位明确</text>
  <rect x="410" y="394" width="250" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="419.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">灼样、胀样钝痛，定位弥散</text>
  <rect x="60" y="434" width="110" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="459.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">时程</text>
  <rect x="170" y="434" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="459.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">即刻发生、短暂</text>
  <rect x="410" y="434" width="250" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="459.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">滞后出现、持续</text>
  <rect x="60" y="474" width="600" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="474" width="110" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="499.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">伴随反应</text>
  <rect x="170" y="474" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="499.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">常引发屈肌回缩</text>
  <rect x="410" y="474" width="250" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="535" y="499.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">情绪烦躁、出汗、内脏反应</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、闸门学说（Melzack 与 Wall，1965）</text>
  <line x1="740" y1="250" x2="1010" y2="250" stroke="#0f766e" stroke-width="3"/>
  <text x="760" y="232" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">粗纤维 Aβ（触觉）</text>
  <line x1="740" y1="380" x2="1010" y2="380" stroke="#dc2626" stroke-width="3"/>
  <text x="760" y="402" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">细纤维 Aδ / C（痛觉）</text>
  <circle cx="1060" cy="315" r="26" fill="#fef3c7" fill-opacity="0.7" stroke="#b45309" stroke-width="2"/>
  <text x="1060" y="319" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="700">SG</text>
  <text x="988" y="316" font-size="10" fill="#64748b" text-anchor="middle">胶状质抑制性</text>
  <text x="988" y="331" font-size="10" fill="#64748b" text-anchor="middle">中间神经元</text>
  <circle cx="1190" cy="315" r="30" fill="#e0f2fe" fill-opacity="0.7" stroke="#0369a1" stroke-width="2.2"/>
  <text x="1190" y="319" font-size="14" fill="#075985" text-anchor="middle" font-weight="700">T</text>
  <text x="1190" y="358" font-size="10" fill="#64748b" text-anchor="middle">投射神经元</text>
  <line x1="1000" y1="250" x2="1042" y2="292" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <text x="990" y="268" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">＋</text>
  <line x1="1010" y1="250" x2="1168" y2="292" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr-dna)"/>
  <line x1="1086" y1="315" x2="1160" y2="315" stroke="#b45309" stroke-width="2.4" stroke-dasharray="7 4" marker-end="url(#arr-rna)"/>
  <text x="1123" y="302" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">−</text>
  <line x1="1000" y1="380" x2="1042" y2="338" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="990" y="372" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">−</text>
  <line x1="1010" y1="380" x2="1172" y2="344" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <text x="1140" y="388" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">＋</text>
  <line x1="1190" y1="285" x2="1190" y2="216" stroke="#0369a1" stroke-width="2.6" marker-end="url(#arr-acc)"/>
  <text x="1190" y="200" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">至丘脑 → 痛知觉</text>
  <line x1="1300" y1="420" x2="1085" y2="336" stroke="#6d28d9" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr-pro)"/>
  <text x="1305" y="442" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">下行控制</text>
  <text x="740" y="470" font-size="10.5" fill="#475569">粗纤维兴奋 SG → 抑制 T 细胞（关门）；细纤维抑制 SG 并直接兴奋 T（开门）——轻抚伤处可镇痛</text>
  <text x="740" y="485" font-size="10.5" fill="#475569">（TENS 经皮电刺激据此设计），下行控制可拨动闸门。符号：＋ / − 为箭头对所指向神经元的直接效应。</text>
  <rect x="30" y="578" width="1340" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、下行镇痛系统：从 PAG 到脊髓背角的刹车</text>
  <rect x="90" y="664" width="210" height="76" rx="9" fill="#ede9fe" fill-opacity="0.5" stroke="#6d28d9" stroke-width="2"/>
  <text x="195" y="690" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">PAG 导水管周围灰质</text>
  <text x="195" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">（中脑 · 镇痛核心）</text>
  <rect x="400" y="664" width="250" height="76" rx="9" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="2"/>
  <text x="525" y="690" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">延髓大缝核（5-HT）</text>
  <text x="525" y="710" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">蓝斑（去甲肾上腺素）</text>
  <rect x="750" y="664" width="210" height="76" rx="9" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="2"/>
  <text x="855" y="690" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="700">脊髓背角</text>
  <text x="855" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">（突触前 + 突触后抑制）</text>
  <line x1="300" y1="702" x2="400" y2="702" stroke="#475569" stroke-width="2.6" marker-end="url(#arr-ink)"/>
  <line x1="650" y1="702" x2="750" y2="702" stroke="#475569" stroke-width="2.6" marker-end="url(#arr-ink)"/>
  <text x="350" y="684" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">下行</text>
  <text x="700" y="684" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">下行</text>
  <text x="700" y="760" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">5-羟色胺 · 去甲肾上腺素 · 脑啡肽 → 抑制痛觉传递</text>
  <rect x="1010" y="648" width="340" height="120" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1030" y="676" font-size="11" fill="#475569">20 世纪 60 年代邹冈与张昌绍发现：</text>
  <text x="1030" y="693" font-size="11" fill="#475569">向家兔 PAG 内微量注射吗啡，</text>
  <text x="1030" y="710" font-size="11" fill="#475569">即产生强烈镇痛——揭开内源性镇痛研究的序幕。</text>
  <rect x="90" y="800" width="400" height="140" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.6"/>
  <text x="110" y="826" font-size="13" fill="#134e4a" font-weight="700">内源性阿片肽</text>
  <text x="110" y="850" font-size="11" fill="#475569">脑啡肽、β-内啡肽、强啡肽作用于 μ、δ、</text>
  <text x="110" y="866" font-size="11" fill="#475569">κ 受体——既沿下行通路在背角抑制传递，也在 PAG 水平级联放大。</text>
  <rect x="530" y="800" width="400" height="140" rx="9" fill="#fce7f3" fill-opacity="0.45" stroke="#be185d" stroke-width="1.6"/>
  <text x="550" y="826" font-size="13" fill="#831843" font-weight="700">纳洛酮：竞争性拮抗剂</text>
  <text x="550" y="850" font-size="11" fill="#475569">可阻断吗啡、针刺与安慰剂镇痛——安慰剂效应竟被阿片拮抗剂取消，</text>
  <text x="550" y="866" font-size="11" fill="#475569">证明内源性阿片系统是其下游通路。</text>
  <rect x="970" y="800" width="380" height="140" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.6"/>
  <text x="990" y="826" font-size="13" fill="#dc2626" font-weight="700">慢性痛：独立成病</text>
  <text x="990" y="850" font-size="11" fill="#475569">C 纤维反复激活 → 背角「上发条」（wind-up，NMDA 解除阻塞）</text>
  <text x="990" y="866" font-size="11" fill="#475569">→ 中枢敏化叠加外周敏化，慢性痛不再只是组织损伤的影子。</text>
</svg>