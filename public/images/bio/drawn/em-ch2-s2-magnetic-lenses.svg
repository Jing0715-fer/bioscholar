  <rect x="50" y="814" width="620" height="26" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="814" width="104" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="102" y="832.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">透镜</text>
  <rect x="154" y="814" width="236" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="272" y="832.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">玻璃透镜近完美，NA 达 1.4</text>
  <rect x="390" y="814" width="280" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="530" y="832.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">磁透镜像差固有，α 仅约 10 mrad</text>
  <rect x="50" y="840" width="104" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
