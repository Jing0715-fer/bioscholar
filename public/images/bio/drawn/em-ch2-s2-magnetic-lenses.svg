  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">电磁透镜与成像光路：从螺线管到投影镜</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">磁透镜靠洛伦兹力会聚电子，短透镜1/f≈(e/8mV)·∫B<tspan dy="3.7" font-size="12.2">z</tspan><tspan dy="-9.5" font-size="12.2">2</tspan><tspan dy="5.8">dz；C1定束斑、C2光阑定照明半角（TEM约0.1–1mrad）；M=M</tspan><tspan dy="3.7" font-size="12.2">obj</tspan><tspan dy="-3.7">×M</tspan><tspan dy="3.7" font-size="12.2">int</tspan><tspan dy="-3.7">×M</tspan><tspan dy="3.7" font-size="12.2">proj</tspan><tspan dy="-3.7">连续覆盖约50倍至百万倍级</tspan></text>
