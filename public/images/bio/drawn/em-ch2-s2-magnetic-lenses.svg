  <text x="430" y="344" font-size="11" fill="#475569" text-anchor="middle">电子绕轴旋转的同时被会聚</text>
  <rect x="533.51225" y="238.95" width="92.97549999999998" height="22.099999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="580" y="254.68" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">F = −e(v×B)</text>
  <text x="560" y="282" font-size="10.5" fill="#475569">角向速度再与轴向磁场作用，</text>
  <text x="560" y="297" font-size="10.5" fill="#475569">产生指向光轴的会聚力——磁透镜永远会聚，</text>
  <text x="560" y="312" font-size="10.5" fill="#475569">与电荷符号无关</text>
  <rect x="138.7248" y="378.65" width="322.5504" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="300" y="391.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">场强由安匝数 NI 决定：变倍、变焦、换模式都表现为改电流</text>
  <text x="50" y="388" font-size="11" fill="#475569">1926 年布施证明其服从薄透镜式成像方程，</text>
  <text x="50" y="404" font-size="11" fill="#475569">电子光学立门</text>
  <rect x="710" y="132" width="660" height="600" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、TEM 成像光路：双聚光镜 - 物镜 - 中间镜 - 投影镜</text>
