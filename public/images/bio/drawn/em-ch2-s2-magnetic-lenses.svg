  <text x="860" y="281" font-size="14" fill="#64748b" text-anchor="end" font-weight="600">照明系统</text>
  <path d="M 869,338 Q 878,338 878,347 M 878,549 Q 878,558 869,558" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="878" y1="347" x2="878" y2="549" stroke="#64748b" stroke-width="1.7"/>
  <text x="860" y="448" font-size="14" fill="#64748b" text-anchor="end" font-weight="600">成像系统</text>
  <text x="1015" y="196" font-size="11.5" fill="#475569">电子枪（亮度与能量展宽见本章第 1 节）</text>
  <text x="1015" y="244" font-size="11.5" fill="#475569">C1 强透镜：缩小源像数十倍，定束斑尺寸与空间相干性</text>
  <text x="1015" y="292" font-size="11.5" fill="#475569">C2 弱透镜 + 聚光镜光阑：</text>
  <text x="1015" y="307" font-size="11.5" fill="#475569">定照明半角——TEM 平行照明约 0.1–1 mrad，</text>
  <text x="1015" y="322" font-size="11.5" fill="#475569">STEM 会聚 10–30 mrad</text>
  <text x="1015" y="352" font-size="11.5" fill="#475569">物镜：样品夹在极靴缝隙中央，分辨率的心脏——物镜损失的信息，</text>
  <text x="1015" y="367" font-size="11.5" fill="#475569">后面谁也救不回来</text>
  <text x="1015" y="398" font-size="11.5" fill="#475569">物镜光阑（后焦面附近）：挑选参与成像的角谱</text>
  <text x="1015" y="448" font-size="11.5" fill="#475569">中间镜（数级）：物面对到像平面即成像模式、</text>
  <text x="1015" y="463" font-size="11.5" fill="#475569">对到背焦面即衍射模式</text>
  <text x="1015" y="506" font-size="11.5" fill="#475569">投影镜：总放大 M = M<tspan dy="2.5" font-size="8.3">obj</tspan><tspan dy="-2.5"> × M</tspan><tspan dy="2.5" font-size="8.3">int</tspan><tspan dy="-2.5"> × M</tspan><tspan dy="2.5" font-size="8.3">proj</tspan><tspan dy="-2.5">，</tspan></text>
  <text x="1015" y="521" font-size="11.5" fill="#475569">约 50 倍至百万倍级连续可调</text>
  <text x="1015" y="588" font-size="11.5" fill="#475569">荧光屏 / 直接电子探测相机</text>
  <rect x="780.3175" y="640.225" width="219.365" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="890" y="654.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">成像模式：中间镜物面对到物镜像平面</text>
  <rect x="1058.82785" y="640.225" width="242.3443" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1180" y="654.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">衍射模式：对到物镜背焦面（相机长度 L）</text>
  <text x="1040" y="700" font-size="11" fill="#64748b" text-anchor="middle">只改一组电流，同一台仪器便在「照片」与「衍射图」之间切换——光学显微镜做不到</text>
  <rect x="30" y="432" width="660" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="454.84" font-size="19" fill="#475569" font-weight="700">三、短透镜焦距、稳定性与像旋转</text>
  <rect x="92.31779399999998" y="474.95" width="245.36441200000004" height="22.099999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="215" y="490.68" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">1/f ≈ (e/8mV)·∫B<tspan dy="2.9" font-size="9.4">z</tspan><tspan dy="-7.3" font-size="9.4">2</tspan><tspan dy="4.4"> dz（短透镜近似）</tspan></text>
  <text x="50" y="522" font-size="11.5" fill="#475569">· f 与场强平方成反比：励磁加倍、场强近似加倍，焦距缩短到约四分之一</text>
  <text x="50" y="546" font-size="11.5" fill="#475569">· f 与加速电压成正比：换高压必须重配励磁电流，否则整条光路散焦</text>
  <rect x="139.90721200000002" y="568.225" width="200.185576" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="240" y="582.14" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="700">高压与透镜电流稳定性要求达 10<tspan dy="-3.9" font-size="8.3">-6</tspan></text>
  <rect x="470" y="470" width="34" height="34" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.8"/>
  <text x="487" y="524" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">物</text>
  <line x1="514" y1="487" x2="556" y2="487" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <polygon points="609.4,509.1 577.9,496.4 590.6,464.9 622.1,477.6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="600" y="530" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">像（随励磁旋转）</text>
  <text x="50" y="616" font-size="11" fill="#475569">磁透镜成像伴随像旋转：偏转角随励磁电流改变，改变放大倍数时像会整体旋转——跨倍数追踪、</text>
  <text x="50" y="632" font-size="11" fill="#475569">立体对与倾转系列的几何都须计入像转角。现代物镜焦距仅约 1–2 mm，比光学物镜短两个数量级。</text>
  <rect x="30" y="692" width="660" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="714.84" font-size="19" fill="#475569" font-weight="700">四、与光学显微镜的光路类比</text>
