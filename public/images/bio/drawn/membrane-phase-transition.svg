    <g transform="translate(1332,300)"><circle cx="0" cy="0" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><circle cx="0" cy="-17" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/><path d="M-7,14 C-3,65 -14,125 -4,175 C-8,192 -3,199 -5,205" fill="none" stroke="#475569" stroke-width="4"/><path d="M7,14 C5,60 14,118 4,168 C8,190 2,197 5,205" fill="none" stroke="#475569" stroke-width="4"/></g>
    <g transform="translate(1372,300)"><circle cx="0" cy="0" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><circle cx="0" cy="-17" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/><path d="M-7,14 C-11,70 2,128 -8,178 C-2,194 -7,200 -7,205" fill="none" stroke="#475569" stroke-width="4"/><path d="M7,14 C11,65 -3,122 9,172 C4,192 9,199 9,205" fill="none" stroke="#475569" stroke-width="4"/></g>
  </g>
  <text x="1120" y="560" text-anchor="middle" font-size="19" fill="#334155">尾部产生歪扭（gauche）构象、活动加剧</text>
  <text x="1120" y="588" text-anchor="middle" font-size="19" fill="#334155">膜流动性增大：侧向扩散、翻转酶活性上升</text>
  <text x="1120" y="636" text-anchor="middle" font-size="20" font-weight="600" fill="#0d9488">胆固醇（灰）：Tm 以上限制流动 · Tm 以下阻止紧密排列</text>
  <text x="1120" y="700" text-anchor="middle" font-size="19" fill="#64748b">动物细胞膜大量掺入胆固醇，把相变“抹平”为宽温区中间态</text>

  <!-- ==================== 底部注释 ==================== -->
  <g>
    <line x1="70" y1="816" x2="1430" y2="816" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="750" y="856" text-anchor="middle" font-size="19" fill="#475569">顺式双键使不饱和尾部产生约 30° 固定弯折（金色头部仅示意极性区）——链间无法紧密堆积，Tm 显著低于同链长饱和磷脂（油酸 13.4 ℃ vs 硬脂酸 69.6 ℃）</text>
    <text x="750" y="890" text-anchor="middle" font-size="19" fill="#475569">膜功能（酶活性、信号转导、物质转运）依赖液晶相流动性——体温下细胞膜须处于 Tm 之上</text>
    <text x="750" y="944" text-anchor="middle" font-size="15" fill="#94a3b8">依据教材相变模型绘制（矢量示意图，非 AI 生成）· 磷脂头部：胆碱（青）/磷酸（金）</text>
  </g>
</svg>
