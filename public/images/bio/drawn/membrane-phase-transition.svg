    <g transform="translate(1252,300)"><circle cx="0" cy="0" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><circle cx="0" cy="-17" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/><path d="M-7,14 C-9,60 5,115 -5,165 C0,185 -5,195 -6,205" fill="none" stroke="#475569" stroke-width="4"/><path d="M7,14 C10,70 -2,120 8,170 C3,190 9,198 6,205" fill="none" stroke="#475569" stroke-width="4"/></g>
