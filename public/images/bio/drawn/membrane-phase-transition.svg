      <text x="0" y="82" text-anchor="middle" font-size="15" fill="#44403c">胆固醇</text>
    </g>
    <g transform="translate(1012,300)"><circle cx="0" cy="0" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><circle cx="0" cy="-17" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/><path d="M-7,14 C-2,65 -14,115 -4,165 C-8,188 -2,197 -5,205" fill="none" stroke="#475569" stroke-width="4"/><path d="M7,14 C11,70 0,125 9,170 C4,190 11,198 7,205" fill="none" stroke="#475569" stroke-width="4"/></g>
    <g transform="translate(1052,300)"><circle cx="0" cy="0" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><circle cx="0" cy="-17" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/><path d="M-7,14 C-10,75 4,125 -6,175 C-1,192 -6,199 -7,205" fill="none" stroke="#475569" stroke-width="4"/><path d="M7,14 C3,60 15,115 5,165 C9,190 2,197 5,205" fill="none" stroke="#475569" stroke-width="4"/></g>
    <g transform="translate(1092,300)"><circle cx="0" cy="0" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><circle cx="0" cy="-17" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/><path d="M-7,14 C-13,60 1,110 -9,160 C-4,185 -9,196 -8,205" fill="none" stroke="#475569" stroke-width="4"/><path d="M7,14 C12,65 -1,120 10,168 C5,192 12,200 10,205" fill="none" stroke="#475569" stroke-width="4"/></g>
