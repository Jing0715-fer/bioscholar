    <g transform="translate(932,300)"><circle cx="0" cy="0" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><circle cx="0" cy="-17" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/><path d="M-7,14 C-12,80 2,130 -8,180 C-3,196 -8,200 -8,205" fill="none" stroke="#475569" stroke-width="4"/><path d="M7,14 C13,75 1,135 11,175 C6,194 10,199 8,205" fill="none" stroke="#475569" stroke-width="4"/></g>
    <!-- 胆固醇（刚性甾环插入尾部之间） -->
    <g transform="translate(972,290)">
      <circle cx="0" cy="10" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/>
      <circle cx="0" cy="-7" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/>
