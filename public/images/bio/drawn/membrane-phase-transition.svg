      <g transform="translate(632,300)"><circle cx="0" cy="0" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><circle cx="0" cy="-17" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/><line x1="-7" y1="14" x2="-7" y2="205" stroke="#475569" stroke-width="4"/><line x1="7" y1="14" x2="7" y2="205" stroke="#475569" stroke-width="4"/></g>
    </g>
  </g>
  <text x="380" y="560" text-anchor="middle" font-size="19" fill="#334155">脂肪酸尾部全反式伸展、排列紧密有序</text>
  <text x="380" y="588" text-anchor="middle" font-size="19" fill="#334155">膜刚性强、流动性与通透性低</text>
  <text x="380" y="636" text-anchor="middle" font-size="20" font-weight="600" fill="#0f766e">尾部振动幅度小 · 链间紧密堆积 · 厚度略大</text>
  <text x="380" y="700" text-anchor="middle" font-size="19" fill="#64748b">饱和磷脂（如 DPPC，Tm ≈ 41 ℃）常处于此态</text>

  <!-- ==================== 中：升温箭头 ==================== -->
  <g>
    <line x1="705" y1="400" x2="795" y2="400" stroke="#b45309" stroke-width="5" marker-end="url(#arrT)"/>
    <text x="750" y="368" text-anchor="middle" font-size="21" font-weight="700" fill="#b45309">升温</text>
    <text x="750" y="445" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">T → Tm</text>
    <text x="750" y="475" text-anchor="middle" font-size="17" fill="#64748b">吸热峰</text>
    <!-- 温度计 -->
    <g transform="translate(750,510)">
      <rect x="-9" y="-55" width="18" height="85" rx="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="42" r="14" fill="#ef4444" fill-opacity="0.85" stroke="#334155" stroke-width="2"/>
      <rect x="-4" y="-40" width="8" height="80" fill="#ef4444" fill-opacity="0.85"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="80" text-anchor="middle" font-size="16" fill="#475569">Tm</text>
    </g>
    <text x="750" y="640" text-anchor="middle" font-size="17" fill="#64748b">降温则逆向</text>
    <text x="750" y="664" text-anchor="middle" font-size="17" fill="#64748b">回到凝胶相</text>
  </g>

  <!-- ==================== 右：液晶相 ==================== -->
  <rect x="810" y="140" width="620" height="640" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1120" y="185" text-anchor="middle" font-size="26" font-weight="700" fill="#0d9488">液晶相（L<span baseline-shift="sub" font-size="16">α</span>）</text>
  <text x="1120" y="216" text-anchor="middle" font-size="18" fill="#64748b">T &gt; Tm：生理温度下的功能态</text>

