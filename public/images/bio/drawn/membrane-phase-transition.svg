      <g transform="translate(392,300)"><circle cx="0" cy="0" r="15" fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5"/><circle cx="0" cy="-17" r="10" fill="#2dd4bf" fill-opacity="0.8" stroke="#0f766e" stroke-width="1.2"/><line x1="-7" y1="14" x2="-7" y2="205" stroke="#475569" stroke-width="4"/><line x1="7" y1="14" x2="7" y2="205" stroke="#475569" stroke-width="4"/></g>
