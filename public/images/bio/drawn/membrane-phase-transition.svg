  <rect x="0" y="0" width="1500" height="980" fill="#ffffff"/>
  <text x="750" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#1e293b">膜脂的相变：凝胶相与液晶相</text>
  <text x="750" y="94" text-anchor="middle" font-size="19" fill="#64748b">同一磷脂双层在相变温度 Tm 上下的两种状态（侧视图，上为膜外侧）</text>

  <!-- ==================== 左：凝胶相 ==================== -->
  <rect x="70" y="140" width="620" height="640" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
