  <circle cx="1108" cy="300" r="6" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="1144" cy="300" r="6" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="1180" cy="300" r="6" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="1216" cy="300" r="6" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="1252" cy="300" r="6" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="1165" y="276" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="700">E 面（胞外半层）：对应位置留坑</text>
  <text x="740" y="392" font-size="10" fill="#475569">断口沿膜中平面裂开——命名由 Branton 等 1970 年代规范。以次氯酸钠一类腐蚀剂溶去样品、铜网捞取残膜，</text>
  <text x="740" y="406" font-size="10" fill="#475569">透射电镜下看的是这层「复型」而非样品本身；旋转投影使各方向均匀。</text>
  <rect x="849.8875" y="461.075" width="180.225" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="940" y="473.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">间隙连接六角颗粒阵列是经典证据</text>
  <text x="1150" y="440" font-size="9.5" fill="#64748b" text-anchor="middle">第 3 章的投影衬度在此服役</text>
  <rect x="30" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、体积电镜：SBF-SEM 与 FIB-SEM</text>
  <rect x="60" y="616" width="280" height="160" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="120" y="700" width="150" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="195" y="729" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">树脂块</text>
  <polygon points="240,660 258,660 249,706" fill="#0369a1" stroke="#075985" stroke-width="1.4"/>
  <text x="249" y="652" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">微型钻石刀</text>
  <text x="200" y="772" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">SBF-SEM：切一刀、拍一张块面像</text>
  <text x="200" y="788" font-size="9.5" fill="#64748b" text-anchor="middle">z 步长即刀进给量 10–50 nm；牺牲式成像</text>
  <rect x="360" y="616" width="280" height="160" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="420" y="700" width="150" height="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="495" y="729" font-size="10" fill="#4c1d95" text-anchor="middle" font-weight="700">树脂块</text>
  <line x1="560" y1="720" x2="590" y2="720" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <text x="556" y="706" font-size="9.5" fill="#075985">Ga<tspan dy="-3.2" font-size="6.8">+</tspan></text>
  <text x="500" y="772" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">FIB-SEM：30 kV 镓离子铣削</text>
  <text x="500" y="788" font-size="9.5" fill="#64748b" text-anchor="middle">z 步长 4–10 nm、体素各向同性</text>
  <rect x="60" y="812" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="839.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">技术</text>
  <rect x="230" y="812" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="300" y="839.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">z 步长</text>
  <rect x="370" y="812" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="440" y="839.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">各向同性</text>
  <rect x="510" y="812" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="839.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">通量</text>
  <rect x="60" y="856" width="170" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="874.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">SBF-SEM（Denk 与 Horstmann 2004）</text>
  <rect x="230" y="856" width="140" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="300" y="874.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">10–50 nm</text>
  <rect x="370" y="856" width="140" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="440" y="874.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">否</text>
  <rect x="510" y="856" width="130" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="874.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">最高</text>
  <rect x="60" y="882" width="580" height="26" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="882" width="170" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="900.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">FIB-SEM</text>
  <rect x="230" y="882" width="140" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="300" y="900.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">4–10 nm</text>
  <rect x="370" y="882" width="140" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="440" y="900.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">是</text>
  <rect x="510" y="882" width="130" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="900.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">中</text>
  <text x="350" y="920" font-size="9.5" fill="#64748b" text-anchor="middle">带电样品（核酸类）与硬组织宜 FIB-SEM；大体积普查宜 SBF-SEM</text>
  <rect x="710" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、临床与分子应用</text>
  <text x="730" y="618" font-size="11.5" fill="#1e293b" font-weight="700">肾脏病理：足细胞足突融合</text>
  <rect x="740" y="634" width="180" height="80" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <rect x="756" y="646" width="14" height="44" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <rect x="782" y="646" width="14" height="44" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <rect x="808" y="646" width="14" height="44" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <rect x="834" y="646" width="14" height="44" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <rect x="860" y="646" width="14" height="44" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <rect x="886" y="646" width="14" height="44" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="830" y="728" font-size="9.5" fill="#065f46" text-anchor="middle">正常：指状足突交错</text>
  <rect x="940" y="634" width="180" height="80" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <rect x="956" y="646" width="148" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1030" y="728" font-size="9.5" fill="#991b1b" text-anchor="middle">病理：足突融合连续化</text>
  <text x="730" y="762" font-size="10" fill="#475569">足突融合是肾小球滤过屏障病变的直接形态学证据——扫描电镜的表面形貌在临床病理中即诊断。</text>
  <rect x="800.7025" y="803.075" width="158.595" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="880" y="815.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">免疫金双标：背散射读共分布</text>
  <rect x="1112.935" y="803.075" width="134.13" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1180" y="815.78" font-size="10.5" fill="#075985" text-anchor="middle">5–15 nm 金粒高衬度白点</text>
  <rect x="772.1509" y="837.075" width="215.6982" height="17.849999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="880" y="849.78" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">核孔复合物篮结构：Ris 场发射 SEM 立档</text>
