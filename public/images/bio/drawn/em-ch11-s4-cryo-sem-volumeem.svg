  <circle cx="962" cy="300" r="6" fill="#6d28d9"/>
  <text x="875" y="276" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="700">P 面（胞质半层）：颗粒即膜蛋白原位分布</text>
  <rect x="1030" y="226" width="270" height="130" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="1050" y1="300" x2="1280" y2="300" stroke="#475569" stroke-width="2.4"/>
