  <line x1="476.06888370749726" y1="308.04226065180615" x2="483.485291572496" y2="327.0633909777092" stroke="#059669" stroke-width="2"/>
  <line x1="443.93111629250274" y1="308.04226065180615" x2="436.514708427504" y2="327.0633909777092" stroke="#059669" stroke-width="2"/>
  <line x1="417.93111629250274" y1="293.5114100916989" x2="398.514708427504" y2="305.2671151375484" stroke="#059669" stroke-width="2"/>
  <line x1="408" y1="270" x2="384" y2="270" stroke="#059669" stroke-width="2"/>
  <line x1="417.93111629250274" y1="246.4885899083011" x2="398.514708427504" y2="234.7328848624516" stroke="#059669" stroke-width="2"/>
  <line x1="443.93111629250274" y1="231.95773934819385" x2="436.514708427504" y2="212.93660902229078" stroke="#059669" stroke-width="2"/>
  <line x1="476.06888370749726" y1="231.95773934819385" x2="483.485291572496" y2="212.93660902229078" stroke="#059669" stroke-width="2"/>
  <line x1="502.06888370749726" y1="246.48858990830107" x2="521.485291572496" y2="234.7328848624516" stroke="#059669" stroke-width="2"/>
  <text x="460" y="358" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">被掩埋的微绒毛露出</text>
  <text x="460" y="374" font-size="9.5" fill="#64748b" text-anchor="middle">表面细节重新可读</text>
  <text x="590" y="200" font-size="10" fill="#475569">把温度短暂升到约 −100 °C</text>
  <text x="590" y="214" font-size="10" fill="#475569">（170–180 K），</text>
  <text x="590" y="228" font-size="10" fill="#475569">表面冰缓慢升华数十秒到几分钟——盖在结构之上的冰壳被掏走，</text>
  <text x="590" y="242" font-size="10" fill="#475569">乳浊液界面膜等细节重见天日。</text>
  <rect x="168.5" y="419.075" width="123" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="431.78" font-size="10.5" fill="#475569" text-anchor="middle">冰面低电压下衬度温和</text>
  <rect x="458.76" y="419.075" width="162.48" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="540" y="431.78" font-size="10.5" fill="#475569" text-anchor="middle">细结构再镀 1–2 nm 薄铂稳电荷</text>
  <text x="360" y="480" font-size="10" fill="#64748b" text-anchor="middle">免脱水免镀厚膜——形貌保真与低荷电的折中路线</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、深蚀刻冷冻断裂复型：五步与 P/E 面</text>
  <rect x="750.3731" y="178.35" width="39.2538" height="15.299999999999999" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="770" y="189.24" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">1 快冻</text>
  <line x1="814" y1="186" x2="844" y2="186" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <rect x="859.1031" y="178.35" width="57.793800000000005" height="15.299999999999999" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="888" y="189.24" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">2 真空断裂</text>
  <line x1="932" y1="186" x2="962" y2="186" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <rect x="986.3731" y="178.35" width="39.2538" height="15.299999999999999" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1006" y="189.24" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">3 蚀刻</text>
  <line x1="1050" y1="186" x2="1080" y2="186" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <rect x="1069.8887" y="178.35" width="108.22259999999999" height="15.299999999999999" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1124" y="189.24" font-size="9" fill="#78350f" text-anchor="middle" font-weight="600">4 铂碳低角投影 2–3 nm</text>
  <line x1="1168" y1="186" x2="1198" y2="186" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <rect x="1175.745" y="178.35" width="132.51" height="15.299999999999999" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1242" y="189.24" font-size="9" fill="#78350f" text-anchor="middle" font-weight="600">5 碳加固 5–10 nm、溶样捞膜</text>
  <rect x="740" y="226" width="270" height="130" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="760" y1="300" x2="990" y2="300" stroke="#475569" stroke-width="2.4"/>
