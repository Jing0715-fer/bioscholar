  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">生物扫描电镜与冷冻扫描电镜：从冷台到体积电镜</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">约110K冷台直读含水样品，升华蚀刻于约−100°C掏出被冰掩埋的细节；深蚀刻复型五步（铂碳低角投影2–3nm加碳5–10nm）；SBF-SEMz步长10–50nm通量之最、FIB-SEM</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">4–10nm各向同性，果蝇全脑约8nm体素</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、冷冻扫描电镜：含水样品直读</text>
  <rect x="60" y="190" width="200" height="150" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <ellipse cx="160" cy="270" rx="62" ry="48" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <ellipse cx="160" cy="270" rx="74" ry="58" fill="none" stroke="#0369a1" stroke-width="6" opacity="0.35"/>
  <text x="160" y="358" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">冰壳掩埋细节</text>
  <text x="160" y="374" font-size="9.5" fill="#64748b" text-anchor="middle">约 110 K 冷台直读</text>
  <line x1="280" y1="265" x2="340" y2="265" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="279.37" y="231.075" width="61.26" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="310" y="243.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">升华蚀刻</text>
  <rect x="360" y="190" width="200" height="150" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <ellipse cx="460" cy="270" rx="56" ry="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <line x1="512" y1="270" x2="536" y2="270" stroke="#059669" stroke-width="2"/>
