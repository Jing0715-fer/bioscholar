  <rect x="1030" y="554" width="320" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1190" y="579.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">记忆 T / B 细胞 + 骨髓长寿命浆细胞</text>
  <rect x="730" y="614" width="620" height="60" rx="9" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
  <text x="748" y="638" font-size="13.5" fill="#065f46" font-weight="700">疫苗学的基石</text>
  <text x="748" y="660" font-size="11.5" fill="#475569">初免—加强程序正是利用免疫记忆，以再次应答的快、高、强获得保护。</text>
