  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">免疫应答的基本规律：初次与再次应答的抗体动态曲线</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">初次应答潜伏期约 1–2 周、IgM 先行、平台低；再次应答潜伏期 1–3 天、IgG 为主、平台高且亲和力高；免疫记忆由记忆 T/B 细胞与骨髓长寿命浆细胞构成，是疫苗初免—加强程序的理论依据；CTLA-4、PD-1 检查点与 Treg 负责应答自限</text>
  <rect x="30" y="132" width="1340" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、免疫应答的四个阶段：识别 → 活化 → 效应 → 记忆</text>
  <rect x="70" y="176" width="300" height="60" rx="8" fill="#0369a1" fill-opacity="0.09" stroke="#0369a1" stroke-width="1.6"/>
  <text x="86" y="200" font-size="14" fill="#0369a1" font-weight="700">① 识别</text>
  <text x="86" y="222" font-size="10.5" fill="#475569">TCR 识别 MHC-肽；BCR 直接识别天然抗原表位</text>
  <rect x="400" y="176" width="300" height="60" rx="8" fill="#0f766e" fill-opacity="0.09" stroke="#0f766e" stroke-width="1.6"/>
  <text x="416" y="200" font-size="14" fill="#0f766e" font-weight="700">② 活化</text>
  <text x="416" y="222" font-size="10.5" fill="#475569">T 细胞需双信号：MHC-肽第一信号 + 共刺激第二信号</text>
  <rect x="730" y="176" width="300" height="60" rx="8" fill="#6d28d9" fill-opacity="0.09" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="746" y="200" font-size="14" fill="#6d28d9" font-weight="700">③ 效应</text>
  <text x="746" y="222" font-size="10.5" fill="#475569">CTL · Th · 抗体等协同清除抗原</text>
  <rect x="1060" y="176" width="300" height="60" rx="8" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-width="1.6"/>
  <text x="1076" y="200" font-size="14" fill="#b45309" font-weight="700">④ 记忆</text>
  <text x="1076" y="222" font-size="10.5" fill="#475569">记忆 T/B 细胞 + 骨髓长寿命浆细胞</text>
