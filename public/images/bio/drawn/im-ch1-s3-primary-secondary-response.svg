  <text x="100" y="872" font-size="13.5" fill="#075985" font-weight="700">免疫检查点：CTLA-4 · PD-1</text>
  <text x="100" y="896" font-size="11" fill="#475569">抑制性受体为活化的 T 细胞「踩刹车」，负调控应答强度，防止过度免疫损伤。</text>
