  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">原核 RNA 聚合酶与启动子结构</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">核心酶α₂ββ′ω（约400kDa）加入σ⁷⁰组成全酶方具特异起始——启动子由-35（TTGACA）、间隔约17bp与-10Pribnow盒（TATAAT）等分散短元件构成</text>
  <rect x="30" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、大肠杆菌 RNA 聚合酶：核心酶 + σ 因子</text>
  <ellipse cx="210" cy="264" rx="140" ry="62" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <rect x="96" y="240" width="56" height="34" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="124" y="261" font-size="16" fill="#4c1d95" text-anchor="middle" font-weight="700">α</text>
  <rect x="160" y="240" width="56" height="34" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="188" y="261" font-size="16" fill="#4c1d95" text-anchor="middle" font-weight="700">α</text>
  <rect x="118" y="286" width="96" height="40" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="166" y="311" font-size="16" fill="#075985" text-anchor="middle" font-weight="700">β</text>
  <rect x="224" y="286" width="96" height="40" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="272" y="311" font-size="16" fill="#075985" text-anchor="middle" font-weight="700">β′</text>
  <rect x="200" y="336" width="40" height="22" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="220" y="351" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">ω</text>
  <text x="210" y="192" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">核心酶 α₂ββ′ω（约 400 kDa）</text>
  <rect x="380" y="250" width="96" height="56" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="428" y="276" font-size="15" fill="#831843" text-anchor="middle" font-weight="700">σ 因子</text>
  <text x="428" y="294" font-size="10.5" fill="#64748b" text-anchor="middle">（σ⁷⁰，rpoD）</text>
  <line x1="352" y1="278" x2="376" y2="278" stroke="#be185d" stroke-width="2.4" marker-end="url(#arr-enz)"/>
  <text x="360" y="262" font-size="15" fill="#831843" font-weight="700">+</text>
  <text x="428" y="234" font-size="13" fill="#831843" text-anchor="middle" font-weight="700">全酶 α₂ββ′ωσ</text>
  <text x="486" y="216" font-size="12" fill="#1e293b" font-weight="700">α</text>
  <text x="528" y="216" font-size="10.5" fill="#475569">组装酶骨架；</text>
  <text x="528" y="230" font-size="10.5" fill="#475569">α-CTD 识别 UP 元件</text>
  <text x="486" y="250" font-size="12" fill="#1e293b" font-weight="700">β / β′</text>
  <text x="528" y="250" font-size="10.5" fill="#475569">共同构成催化中心</text>
  <text x="528" y="264" font-size="10.5" fill="#475569">（活性中心含双 Mg²⁺）</text>
  <text x="486" y="284" font-size="12" fill="#1e293b" font-weight="700">ω</text>
  <text x="528" y="284" font-size="10.5" fill="#475569">辅助 β′ 稳定折叠</text>
  <text x="486" y="318" font-size="12" fill="#1e293b" font-weight="700">σ⁷⁰</text>
  <text x="528" y="318" font-size="10.5" fill="#475569">识别启动子、降低非特异结合；</text>
  <text x="528" y="332" font-size="10.5" fill="#475569">起始后释放</text>
  <rect x="60.572" y="376.65" width="278.856" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="389.96" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">利福平结合 β 亚基——阻断起始后头几个核苷酸的合成</text>
  <text x="478" y="386" font-size="11" fill="#64748b" text-anchor="middle">σ⁷⁰ 浓度远低于核心酶：可循环利用的起始因子</text>
  <rect x="710" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、启动子核心元件：分散的短保守序列</text>
  <line x1="730" y1="226" x2="1350" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="790" y1="218" x2="790" y2="234" stroke="#475569" stroke-width="1.6"/>
  <text x="790" y="210" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">-60</text>
  <line x1="890" y1="218" x2="890" y2="234" stroke="#475569" stroke-width="1.6"/>
  <text x="890" y="210" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">-35</text>
  <line x1="1060" y1="218" x2="1060" y2="234" stroke="#475569" stroke-width="1.6"/>
  <text x="1060" y="210" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">-10</text>
  <line x1="1200" y1="218" x2="1200" y2="234" stroke="#475569" stroke-width="1.6"/>
  <text x="1200" y="210" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">+1</text>
  <rect x="740" y="244" width="110" height="30" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="795" y="264" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">UP 元件</text>
  <rect x="860" y="244" width="100" height="30" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="910" y="264" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">TTGACA</text>
  <rect x="970" y="244" width="120" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="1030" y="264" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">间隔 17 bp</text>
  <rect x="1100" y="244" width="100" height="30" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1150" y="264" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">TATAAT</text>
  <circle cx="1200" cy="259" r="5" fill="#1e293b"/>
  <text x="1200" y="288" font-size="10.5" fill="#64748b" text-anchor="middle">起始点</text>
  <line x1="795" y1="244" x2="795" y2="196" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="795" y="188" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">α-CTD 结合</text>
  <text x="795" y="172" font-size="10" fill="#64748b" text-anchor="middle">-40～-60 · AT 富集</text>
  <line x1="910" y1="274" x2="910" y2="320" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="910" y="332" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">σ 因子 4 结构域识别</text>
  <text x="910" y="350" font-size="10" fill="#64748b" text-anchor="middle">-35 区（Sextama 盒）</text>
  <line x1="1030" y1="244" x2="1030" y2="196" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1030" y="188" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">15～19 bp（最佳 17）</text>
  <text x="1030" y="172" font-size="10" fill="#64748b" text-anchor="middle">两元件相位（螺旋转角）匹配</text>
  <line x1="1150" y1="274" x2="1150" y2="320" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1150" y="332" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">AT 富集利于解链</text>
  <text x="1150" y="350" font-size="10" fill="#64748b" text-anchor="middle">-10 区 Pribnow 盒 → 开放复合物</text>
  <text x="730" y="396" font-size="11.5" fill="#475569">突变与足迹实验确立上述共有元件；-35 与 -10 越接近共有序列、间隔越接近 17 bp，启动子越强。</text>
  <text x="730" y="412" font-size="11.5" fill="#475569">-1 弱化嘌呤偏好与 +1 嘌呤也影响起始效率。</text>
  <rect x="30" y="452" width="660" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">三、σ 因子循环与转录的化学逻辑</text>
  <rect x="40" y="498" width="140" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="110" y="525" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">全酶结合启动子</text>
  <rect x="230" y="498" width="140" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="300" y="525" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">起始 · 开放复合物</text>
  <rect x="230" y="618" width="140" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="300" y="645" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">核心酶延伸</text>
  <rect x="40" y="618" width="140" height="44" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <text x="110" y="645" font-size="12" fill="#831843" text-anchor="middle" font-weight="600">σ 再循环</text>
  <line x1="182" y1="520" x2="228" y2="520" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="290" y="584" font-size="10.5" fill="#831843" text-anchor="end" font-weight="700">合成约 10 nt 后 σ 释放</text>
  <line x1="300" y1="544" x2="300" y2="616" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="228" y1="640" x2="182" y2="640" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <line x1="110" y1="616" x2="110" y2="544" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="420" y="500" font-size="11.5" fill="#475569">· 模板阅读方向 3′→5′，</text>
  <text x="420" y="526" font-size="11.5" fill="#475569">新生 RNA 5′→3′ 延伸· 底物为四种 NTP</text>
  <text x="420" y="552" font-size="11.5" fill="#475569">（ATP / GTP / CTP / UTP）</text>
  <text x="420" y="578" font-size="11.5" fill="#475569">· 首个核苷酸常保留 5′-三磷酸· RNA-DNA 杂交双链约 8～9 bp；</text>
  <text x="420" y="604" font-size="11.5" fill="#475569">转录泡约 12～14 bp</text>
  <text x="420" y="620" font-size="11" fill="#64748b">延伸由核心酶独立完成；化学逻辑与复制一致。</text>
  <rect x="710" y="452" width="660" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="474.84" font-size="19" fill="#475569" font-weight="700">四、启动子元件速查与足迹法证据</text>
  <rect x="730" y="496" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="805" y="523.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">元件</text>
  <rect x="880" y="496" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="523.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">位置</text>
  <rect x="990" y="496" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="523.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">共有序列</text>
  <rect x="1130" y="496" width="220" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="523.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">功能</text>
  <rect x="730" y="540" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="805" y="560.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">-35 区</text>
  <rect x="880" y="540" width="110" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="560.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">-35</text>
  <rect x="990" y="540" width="140" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="560.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">TTGACA</text>
  <rect x="1130" y="540" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="560.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">σ 区域 4 识别，闭合复合物</text>
  <rect x="730" y="570" width="620" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="570" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="805" y="590.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">-10 区</text>
  <rect x="880" y="570" width="110" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="590.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">-10</text>
  <rect x="990" y="570" width="140" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="590.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">TATAAT</text>
  <rect x="1130" y="570" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="590.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">AT 富集，开放复合物</text>
  <rect x="730" y="600" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="805" y="620.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">间隔区</text>
  <rect x="880" y="600" width="110" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="620.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">两元件间</text>
  <rect x="990" y="600" width="140" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="620.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">15～19 bp</text>
  <rect x="1130" y="600" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="620.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">相位匹配（最佳 17）</text>
  <rect x="730" y="630" width="620" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="630" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="805" y="650.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">UP 元件</text>
  <rect x="880" y="630" width="110" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="650.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">-40～-60</text>
  <rect x="990" y="630" width="140" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="650.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">AT 富集</text>
  <rect x="1130" y="630" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="650.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">α-CTD 结合增强转录</text>
  <text x="730" y="682" font-size="12" fill="#1e293b" font-weight="700">足迹法（DNase I footprinting）：全酶结合范围约 -55～+20</text>
  <text x="730" y="704" font-size="11" fill="#475569">启动子-down 突变削弱起始、up 突变增强起始——定量各元件贡献的遗传学证据。</text>
  <rect x="30" y="752" width="1340" height="218" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="774.84" font-size="19" fill="#475569" font-weight="700">五、组织原则的普适性：从大肠杆菌到真核</text>
  <rect x="60" y="800" width="400" height="100" rx="10" fill="#f1f5f9" fill-opacity="0.6" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="260" y="826" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="700">原核</text>
  <text x="260" y="850" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">单个 RNAP + 替换 σ 因子</text>
  <text x="260" y="884" font-size="11" fill="#64748b" text-anchor="middle">识别不同启动子家族，实现转录程序切换</text>
  <rect x="490" y="800" width="400" height="100" rx="10" fill="#f1f5f9" fill-opacity="0.6" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="690" y="826" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="700">真核</text>
  <text x="690" y="850" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">三类 RNA pol 分工（pol I / II / III）</text>
  <text x="690" y="884" font-size="11" fill="#64748b" text-anchor="middle">机器分化替代 σ 替换，调控层叠加（第 4 节）</text>
  <rect x="920" y="800" width="400" height="100" rx="10" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1120" y="826" font-size="14.5" fill="#134e4a" text-anchor="middle" font-weight="700">共同原则</text>
  <text x="1120" y="850" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">「分散的短保守元件」组织启动子</text>
  <text x="1120" y="884" font-size="11" fill="#64748b" text-anchor="middle">真核启动子结构远为多样，但该组织原则贯穿始终</text>
  <text x="60" y="940" font-size="11" fill="#64748b">核心酶通用而 σ 因子可替换——不同 σ 识别不同启动子家族，是原核转录程序切换的全局开关（详见第 7 章）。</text>
</svg>