  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">数据质量指标体系：R 三兄弟、CC1/2 与红绿灯</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">Rmerge随冗余恶化（2.8%→3.9%）、Rmeas恒定4.0%、Rpim降至0.9%；CC1/2=0.143↔CC*=0.5为现代截断主判据；I/σ≥2惯例退居辅助；完整度≥95%，反常冗余7–10×</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Rmerge／Rmeas／Rpim：三兄弟辨析</text>
  <rect x="52" y="172" width="616" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="64" y="194" font-size="12.5" fill="#d97706" font-weight="700">R<tspan dy="2.8" font-size="9.0">merge</tspan></text>
  <text x="196" y="194" font-size="11" fill="#1e293b">Σ|I<tspan dy="2.4" font-size="7.9">i</tspan><tspan dy="-2.4">−〈I〉| / Σ〈I〉</tspan></text>
  <text x="656" y="194" font-size="10" fill="#64748b" text-anchor="end">随冗余单调恶化</text>
  <rect x="52" y="214" width="616" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="64" y="236" font-size="12.5" fill="#dc2626" font-weight="700">R<tspan dy="2.8" font-size="9.0">meas</tspan></text>
  <text x="196" y="236" font-size="11" fill="#1e293b">每次测量 ×√(N/(N−1))</text>
  <text x="656" y="236" font-size="10" fill="#64748b" text-anchor="end">单次精度·与冗余无关</text>
  <rect x="52" y="256" width="616" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="64" y="278" font-size="12.5" fill="#065f46" font-weight="700">R<tspan dy="2.8" font-size="9.0">pim</tspan></text>
  <text x="196" y="278" font-size="11" fill="#1e293b">每次测量 ×√(1/(N−1))</text>
  <text x="656" y="278" font-size="10" fill="#64748b" text-anchor="end">合并精度·随冗余下降</text>
  <text x="52" y="312" font-size="10.5" fill="#475569">Rmerge 的先天缺陷：拿「每次测量对平均的偏离」记账，却把「平均因此更准」的红利记为零——测得越多指标越难看，</text>
  <text x="52" y="327" font-size="10.5" fill="#475569">尺子天生偏向惩罚勤奋。Diederichs 与 Karplus 1997 年给出校正；看质量应盯 Rmeas 与 Rpim，</text>
  <text x="52" y="342" font-size="10.5" fill="#475569">而非被高冗余推高的 Rmerge 吓退。</text>
