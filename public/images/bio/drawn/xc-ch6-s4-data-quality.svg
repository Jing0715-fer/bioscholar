  <rect x="1000" y="836" width="360" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1180" y="858.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">无信号而方案依赖反常</text>
  <text x="60" y="890" font-size="10.5" fill="#475569">截断规程：以 CC<tspan dy="2.3" font-size="7.6">1/2</tspan><tspan dy="-2.3"> 与 I/σ 双指标在各壳层的走势为据、以图为准——放宽与收紧各试一档，比较电子密度与差值图是否只剩噪声条纹。</tspan></text>
  <text x="60" y="905.5" font-size="10.5" fill="#475569">警惕「无效高分辨外推」：把噪声当数据，误差进入精修，自由 R 会揭穿这种自欺；反之把仍有信号的高角一刀切掉同样是浪费。</text>
  <text x="730" y="890" font-size="10.5" fill="#475569">I/σ ≥ 2 出身「肉眼时代」（胶片挑斑的经验阈），CC1/2 时代退居辅助；两判据冲突恰是数据处于临界带的信号，</text>
  <text x="730" y="905.5" font-size="10.5" fill="#475569">应显式标注而非静默取舍。红绿灯只是初筛：黄灯数据常仍可用于分子置换，红灯数据救不回相位——「宁可重收，不可硬解」。</text>
</svg>