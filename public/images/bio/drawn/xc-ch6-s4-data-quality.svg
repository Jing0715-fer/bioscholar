  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、CC1/2：分半相关的革命</text>
  <rect x="730" y="178" width="150" height="40" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="805" y="202" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">反射的 N 次观测</text>
  <line x1="884" y1="198" x2="916" y2="198" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <text x="900" y="184" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">随机对半</text>
  <rect x="920" y="166" width="108" height="32" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="974" y="187" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">半组 A → I<tspan dy="2.3" font-size="7.6">1</tspan></text>
  <rect x="920" y="202" width="108" height="32" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="974" y="223" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">半组 B → I<tspan dy="2.3" font-size="7.6">2</tspan></text>
  <line x1="1032" y1="182" x2="1064" y2="182" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="1032" y1="218" x2="1064" y2="218" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="1068" y="174" width="140" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="1138" y="195" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">逐壳层算相关</text>
  <text x="1138" y="215" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">CC<tspan dy="2.6" font-size="8.6">1/2</tspan></text>
  <text x="1240" y="182" font-size="10" fill="#475569">信号真实则两半互「认得」</text>
  <text x="1240" y="196" font-size="10" fill="#475569">（CC1/2 高）；</text>
  <text x="1240" y="210" font-size="10" fill="#475569">只剩噪声则互不相认</text>
  <text x="1240" y="224" font-size="10" fill="#475569">（趋零）。</text>
  <line x1="760" y1="470" x2="1300" y2="470" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="760" y1="470" x2="760" y2="316" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="760" y1="320" x2="1300" y2="320" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6"/>
  <text x="752" y="324" font-size="9.5" fill="#64748b" text-anchor="end">1</text>
  <line x1="760" y1="395" x2="1300" y2="395" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6"/>
  <text x="752" y="399" font-size="9.5" fill="#64748b" text-anchor="end">0.5</text>
  <line x1="760" y1="448.55" x2="1300" y2="448.55" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" opacity="1"/>
  <text x="752" y="452.55" font-size="9.5" fill="#dc2626" text-anchor="end" font-weight="700">0.143</text>
  <text x="1030" y="494" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">低分辨率 ← 壳层 → 高分辨率</text>
  <polyline points="760,327.5 841,332 922,342.5 1003,362 1057,387.5 1094.8,410 1127.2,432.5 1159.6,448.55 1192,458 1246,465.5 1300,468.5" fill="none" stroke="#0f766e" stroke-width="3"/>
  <line x1="1159.6" y1="470" x2="1159.6" y2="448.55" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="1099.359022" y="398.65" width="157.281956" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1178" y="411.96" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">CC<tspan dy="2.4" font-size="7.9">1/2</tspan><tspan dy="-2.4"> = 0.143 ↔ CC* = 0.5</tspan></text>
  <text x="1159" y="438" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">截断点 d<tspan dy="2.3" font-size="7.6">min</tspan></text>
  <text x="730" y="514" font-size="10.5" fill="#475569">CC* = √(2CC<tspan dy="2.3" font-size="7.6">1/2</tspan><tspan dy="-2.3">/(1+CC</tspan><tspan dy="2.3" font-size="7.6">1/2</tspan><tspan dy="-2.3">)) 把「数据与真实强度的相关」与「模型与真实的相关」放上同一标尺；</tspan></text>
  <text x="730" y="528" font-size="10.5" fill="#475569">0.143 恰对应 CC* = 0.5——CC<tspan dy="2.3" font-size="7.6">1/2</tspan><tspan dy="-2.3"> 不低于 0.143 成为现代分辨率截断的主判据，比 I/σ 惯例更「敢」：I/σ 跌破 2 的壳层，</tspan></text>
  <text x="730" y="542" font-size="10.5" fill="#475569">CC1/2 仍常证明信号真实。Karplus 与 Diederichs 2012。</text>
  <rect x="30" y="592" width="1340" height="370" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="614.84" font-size="19" fill="#475569" font-weight="700">三、数据质量红绿灯与分辨率截断规程</text>
