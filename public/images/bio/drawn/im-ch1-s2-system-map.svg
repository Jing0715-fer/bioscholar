<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">免疫系统的组成概览：器官、细胞与分子的三层防御网络</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">中枢器官（骨髓、胸腺）育成免疫细胞，外周器官（淋巴结、脾、MALT）启动应答；细胞源于造血干细胞的髓系与淋巴系两谱系；T 细胞约占外周血淋巴细胞 60–70%、B 细胞 10–20%、NK 5–10%；中性粒细胞占白细胞 50–70%</text>
  <rect x="30" y="132" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、免疫系统的三层次地图：器官 — 细胞 — 分子（分布式，无「司令部」）</text>
  <rect x="60" y="186" width="1280" height="70" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="98.13" y="208.675" width="83.74000000000001" height="24.65" rx="7" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
  <text x="140" y="226.22" font-size="14.5" fill="#134e4a" text-anchor="middle" font-weight="700">免疫器官</text>
  <rect x="328.465" y="211.225" width="87.07000000000001" height="19.55" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="372" y="225.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">中枢（育成）</text>
  <text x="440" y="225" font-size="11.5" fill="#475569">骨髓 · 胸腺 —— T/B 细胞发育成熟的「质检车间」</text>
  <rect x="798.465" y="211.225" width="87.07000000000001" height="19.55" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="842" y="225.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">外周（应答）</text>
  <text x="910" y="225" font-size="11.5" fill="#475569">淋巴结 · 脾 · MALT —— 免疫应答启动场所</text>
  <rect x="60" y="264" width="1280" height="70" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="98.13" y="286.675" width="83.74000000000001" height="24.65" rx="7" fill="#6d28d9" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="140" y="304.22" font-size="14.5" fill="#4c1d95" text-anchor="middle" font-weight="700">免疫细胞</text>
  <rect x="346.2325" y="289.225" width="51.535000000000004" height="19.55" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="372" y="303.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">淋巴系</text>
  <text x="440" y="303" font-size="11.5" fill="#475569">T 细胞 · B 细胞 · NK 细胞</text>
  <rect x="822.155" y="289.225" width="39.69" height="19.55" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="842" y="303.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">髓系</text>
  <text x="910" y="303" font-size="11.5" fill="#475569">单核-巨噬细胞 · 树突状细胞 · 粒细胞</text>
  <rect x="60" y="342" width="1280" height="70" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="98.13" y="364.675" width="83.74000000000001" height="24.65" rx="7" fill="#0369a1" stroke="#0369a1" stroke-width="1.5"/>
  <text x="140" y="382.22" font-size="14.5" fill="#075985" text-anchor="middle" font-weight="700">免疫分子</text>
  <rect x="322.5425" y="367.225" width="98.915" height="19.55" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="372" y="381.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">可溶性（武器）</text>
  <text x="440" y="381" font-size="11.5" fill="#475569">抗体 · 补体 · 细胞因子</text>
  <rect x="798.465" y="367.225" width="87.07000000000001" height="19.55" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="842" y="381.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">膜型（信号）</text>
  <text x="910" y="381" font-size="11.5" fill="#475569">MHC · CD 分子 · 各类抗原受体</text>
  <text x="700" y="448" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">主线：识别 — 应答 — 调节（应答的自限与负调控与效应本身同等重要）</text>
  <rect x="30" y="478" width="1340" height="372" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="500.84" font-size="19" fill="#475569" font-weight="700">二、免疫细胞：源于造血干细胞的两大谱系，外周血分类计数是免疫状态窗口</text>
  <rect x="103.40084999999999" y="533.525" width="143.19830000000002" height="22.95" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="175" y="549.86" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="700">造血干细胞（HSC）</text>
  <line x1="140" y1="562" x2="110" y2="600" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="210" y1="562" x2="275" y2="600" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="91.61" y="602.95" width="46.78" height="22.099999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="115" y="618.68" font-size="13" fill="#831843" text-anchor="middle" font-weight="700">髓系</text>
  <rect x="241.915" y="602.95" width="60.17" height="22.099999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="272" y="618.68" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">淋巴系</text>
  <rect x="45" y="650" width="150" height="26" rx="13" fill="#ffffff" stroke="#be185d" stroke-width="1.2"/>
  <text x="120" y="667" font-size="11" fill="#475569" text-anchor="middle">中性粒细胞</text>
  <rect x="45" y="684" width="150" height="26" rx="13" fill="#ffffff" stroke="#be185d" stroke-width="1.2"/>
  <text x="120" y="701" font-size="11" fill="#475569" text-anchor="middle">单核-巨噬细胞</text>
  <rect x="45" y="718" width="150" height="26" rx="13" fill="#ffffff" stroke="#be185d" stroke-width="1.2"/>
  <text x="120" y="735" font-size="11" fill="#475569" text-anchor="middle">树突状细胞（DC）</text>
  <rect x="45" y="752" width="150" height="26" rx="13" fill="#ffffff" stroke="#be185d" stroke-width="1.2"/>
  <text x="120" y="769" font-size="11" fill="#475569" text-anchor="middle">嗜酸 / 嗜碱性粒细胞</text>
  <rect x="200" y="650" width="160" height="26" rx="13" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="280" y="667" font-size="11" fill="#475569" text-anchor="middle">T 细胞 · 60–70%</text>
  <rect x="200" y="684" width="160" height="26" rx="13" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="280" y="701" font-size="11" fill="#475569" text-anchor="middle">B 细胞 · 10–20%</text>
  <rect x="200" y="718" width="160" height="26" rx="13" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="280" y="735" font-size="11" fill="#475569" text-anchor="middle">NK 细胞 · 5–10%</text>
  <text x="60" y="800" font-size="10.5" fill="#64748b">占比为占外周血淋巴细胞的比例。DC 在外周血单个核细胞中不足 1%，</text>
  <text x="60" y="815" font-size="10.5" fill="#64748b">却是激活初始 T 细胞的最强抗原提呈细胞（APC）。</text>
  <text x="1000" y="552" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">外周血白细胞分类计数（参考区间）</text>
  <rect x="758.72" y="601.7142857142858" width="66.56" height="154.28571428571428" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="792" y="592.7142857142858" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">50–70%</text>
  <text x="792" y="776" font-size="12.5" fill="#64748b" text-anchor="middle">中性粒细胞</text>
  <rect x="862.72" y="678.8571428571429" width="66.56" height="77.14285714285714" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="896" y="669.8571428571429" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">20–40%</text>
  <text x="896" y="776" font-size="12.5" fill="#64748b" text-anchor="middle">淋巴细胞</text>
  <rect x="966.72" y="741.8571428571429" width="66.56" height="14.142857142857142" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1000" y="732.8571428571429" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">3–8%</text>
  <text x="1000" y="776" font-size="12.5" fill="#64748b" text-anchor="middle">单核细胞</text>
  <rect x="1070.72" y="748.9285714285714" width="66.56" height="7.071428571428571" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1104" y="739.9285714285714" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">0.5–5%</text>
  <text x="1104" y="776" font-size="12.5" fill="#64748b" text-anchor="middle">嗜酸性粒细胞</text>
  <rect x="1174.72" y="754.7142857142857" width="66.56" height="1.2857142857142856" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1208" y="745.7142857142857" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">0–1%</text>
  <text x="1208" y="776" font-size="12.5" fill="#64748b" text-anchor="middle">嗜碱性粒细胞</text>
  <text x="1000" y="830" font-size="11" fill="#64748b" text-anchor="middle">五类白细胞的比例区间是免疫学诊断的常用参考</text>
  <rect x="30" y="866" width="1340" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="888.84" font-size="19" fill="#475569" font-weight="700">三、免疫系统的工作主线：识别 — 应答 — 调节</text>
  <rect x="80" y="906" width="350" height="50" rx="8" fill="#0369a1" fill-opacity="0.1" stroke="#0369a1" stroke-width="1.6"/>
  <text x="98" y="927" font-size="13.5" fill="#0369a1" font-weight="700">① 识别</text>
  <text x="164" y="927" font-size="11.5" fill="#475569">抗原受体识别「非己」表位 / 肽</text>
  <rect x="490" y="906" width="350" height="50" rx="8" fill="#0f766e" fill-opacity="0.1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="508" y="927" font-size="13.5" fill="#0f766e" font-weight="700">② 应答</text>
  <text x="574" y="927" font-size="11.5" fill="#475569">固有免疫先启动 · 适应性克隆扩增</text>
  <rect x="900" y="906" width="350" height="50" rx="8" fill="#6d28d9" fill-opacity="0.1" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="918" y="927" font-size="13.5" fill="#6d28d9" font-weight="700">③ 调节</text>
  <text x="984" y="927" font-size="11.5" fill="#475569">自限与负调控，回归内稳态</text>
  <line x1="438" y1="931" x2="482" y2="931" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="848" y1="931" x2="892" y2="931" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
</svg>