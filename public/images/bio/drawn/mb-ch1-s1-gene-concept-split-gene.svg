<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">基因概念的发展：从遗传因子到断裂基因</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">孟德尔遗传因子 → Morgan 基因学说 → Beadle-Tatum 一个基因一种酶 → Benzer 顺反子 → 1977 年断裂基因（外显子/内含子）——R 环电镜证据与顺反测验</text>
  <rect x="30" y="132" width="1340" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、基因概念的演进：从「遗传因子」到断裂基因</text>
  <line x1="70" y1="252" x2="1330" y2="252" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <circle cx="150" cy="252" r="6" fill="#1e293b"/>
  <text x="150" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1865</text>
  <text x="150" y="274" font-size="11" fill="#475569" text-anchor="middle">孟德尔提出「遗传因子」控制性状分离</text>
  <circle cx="355" cy="252" r="6" fill="#1e293b"/>
  <text x="355" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1910</text>
  <text x="355" y="274" font-size="11" fill="#475569" text-anchor="middle">摩尔根：</text>
  <text x="355" y="290" font-size="11" fill="#475569" text-anchor="middle">基因位于染色体上并呈线性排列</text>
  <text x="355" y="306" font-size="11" fill="#475569" text-anchor="middle">（基因学说）</text>
  <circle cx="580" cy="252" r="6" fill="#1e293b"/>
  <text x="580" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1941</text>
  <text x="580" y="274" font-size="11" fill="#475569" text-anchor="middle">Beadle 与 Tatum：</text>
  <text x="580" y="290" font-size="11" fill="#475569" text-anchor="middle">一个基因一种酶 → 后修正为一个基因一条多肽链</text>
  <text x="580" y="306" font-size="11" fill="#475569" text-anchor="middle">（1958 诺奖）</text>
  <circle cx="810" cy="252" r="6" fill="#1e293b"/>
  <text x="810" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1957</text>
  <text x="810" y="274" font-size="11" fill="#475569" text-anchor="middle">Benzer 顺反测验：</text>
  <text x="810" y="290" font-size="11" fill="#475569" text-anchor="middle">顺反子是不可再分的功能单位；</text>
  <text x="810" y="306" font-size="11" fill="#475569" text-anchor="middle">突变子与重组子仅 1～2 个核苷酸对</text>
  <circle cx="1040" cy="252" r="6" fill="#1e293b"/>
  <text x="1040" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1977</text>
  <text x="1040" y="274" font-size="11" fill="#475569" text-anchor="middle">Roberts 与 Sharp 发现断裂基因：</text>
  <text x="1040" y="290" font-size="11" fill="#475569" text-anchor="middle">外显子与内含子相间（1993 诺奖）</text>
  <circle cx="1248" cy="252" r="6" fill="#1e293b"/>
  <text x="1248" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">现代</text>
  <text x="1248" y="274" font-size="11" fill="#475569" text-anchor="middle">基因＝编码功能 RNA 或多肽链的 DNA 片段单位</text>
  <rect x="30" y="388" width="720" height="296" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="410.84" font-size="19" fill="#475569" font-weight="700">二、断裂基因与 R 环：mRNA–DNA 杂交的电镜证据（1977）</text>
  <text x="84" y="450" font-size="12.5" fill="#64748b">DNA（断裂基因）</text>
  <rect x="80" y="462" width="130" height="30" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="145" y="482" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="700">外显子1</text>
  <rect x="300" y="462" width="130" height="30" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="365" y="482" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="700">外显子2</text>
  <rect x="520" y="462" width="130" height="30" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="585" y="482" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="700">外显子3</text>
  <path d="M210,477 C 226,545 284,545 300,477" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M430,477 C 446,545 504,545 520,477" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="255" y="556" font-size="11.5" fill="#64748b" text-anchor="middle">内含子 1（环出）</text>
  <text x="475" y="556" font-size="11.5" fill="#64748b" text-anchor="middle">内含子 2（环出）</text>
  <line x1="94" y1="494" x2="94" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="118" y1="494" x2="118" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="142" y1="494" x2="142" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="166" y1="494" x2="166" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="190" y1="494" x2="190" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="314" y1="494" x2="314" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="338" y1="494" x2="338" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="362" y1="494" x2="362" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="386" y1="494" x2="386" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="410" y1="494" x2="410" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="534" y1="494" x2="534" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="558" y1="494" x2="558" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="582" y1="494" x2="582" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="606" y1="494" x2="606" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <line x1="630" y1="494" x2="630" y2="568" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
  <path d="M 80,580 q 19,-18 38,0 q 19,18 38,0 q 19,-18 38,0 q 19,18 38,0 q 19,-18 38,0 q 19,18 38,0 q 19,-18 38,0 q 19,18 38,0 q 19,-18 38,0 q 19,18 38,0 q 19,-18 38,0 q 19,18 38,0 q 19,-18 38,0 q 19,18 38,0 q 19,-18 38,0" fill="none" opacity="0.8" stroke="#b45309" stroke-width="3.2"/>
  <text x="365" y="616" font-size="13" fill="#78350f" text-anchor="middle">mRNA：外显子序列已连成一体，与模板链杂交</text>
  <text x="56" y="648" font-size="12.5" fill="#475569">腺病毒晚期 mRNA 与模板 DNA 杂交后，内含子在电镜下形成环状突起（R 环）——编码序列不连续，</text>
  <text x="56" y="666" font-size="12.5" fill="#475569">内含子在 RNA 加工中被剪接去除。</text>
  <rect x="770" y="388" width="600" height="296" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="786" y="410.84" font-size="19" fill="#475569" font-weight="700">三、顺反测验（cis-trans test）：顺反子的操作性定义</text>
  <text x="800" y="450" font-size="13" fill="#475569" font-weight="700">反式（trans）：两条染色体各带一个突变</text>
  <rect x="800" y="462" width="440" height="22" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <line x1="942" y1="466" x2="958" y2="480" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="942" y1="480" x2="958" y2="466" stroke="#dc2626" stroke-width="2.2"/>
  <rect x="800" y="494" width="440" height="22" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <line x1="1082" y1="498" x2="1098" y2="512" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="1082" y1="512" x2="1098" y2="498" stroke="#dc2626" stroke-width="2.2"/>
  <rect x="1262.19" y="468.525" width="75.62" height="22.95" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1300" y="484.86" font-size="13.5" fill="#991b1b" text-anchor="middle" font-weight="700">突变表型</text>
  <text x="800" y="555" font-size="13" fill="#475569" font-weight="700">顺式（cis）：两个突变位于同一条染色体</text>
  <rect x="800" y="567" width="440" height="22" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <line x1="942" y1="571" x2="958" y2="585" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="942" y1="585" x2="958" y2="571" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="1082" y1="571" x2="1098" y2="585" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="1082" y1="585" x2="1098" y2="571" stroke="#dc2626" stroke-width="2.2"/>
  <rect x="800" y="599" width="440" height="22" rx="11" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <rect x="1262.19" y="578.525" width="75.62" height="22.95" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1300" y="594.86" font-size="13.5" fill="#065f46" text-anchor="middle" font-weight="700">表型正常</text>
  <text x="1140" y="632" font-size="11" fill="#dc2626">✕＝突变位点</text>
  <text x="800" y="652" font-size="12.5" fill="#475569">反式排列出现突变表型而顺式排列正常 → 两突变属于同一顺反子（功能单位不可再分）。</text>
  <rect x="30" y="704" width="1340" height="266" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="726.84" font-size="19" fill="#475569" font-weight="700">四、现代基因概念的类型学拓展</text>
  <rect x="60" y="748" width="210" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="165" y="775.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">基因类型</text>
  <rect x="270" y="748" width="460" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="775.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">特征</text>
  <rect x="730" y="748" width="610" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1035" y="775.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">举例</text>
  <rect x="60" y="792" width="210" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="165" y="812.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">结构基因</text>
  <rect x="270" y="792" width="460" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="812.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">编码蛋白质或 RNA 产物</text>
  <rect x="730" y="792" width="610" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1035" y="812.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">lacZ、珠蛋白基因</text>
  <rect x="60" y="822" width="1280" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="822" width="210" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="165" y="842.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">调控基因</text>
  <rect x="270" y="822" width="460" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="842.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">编码调节蛋白</text>
  <rect x="730" y="822" width="610" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1035" y="842.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">lacI、p53</text>
  <rect x="60" y="852" width="210" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="165" y="872.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">重叠基因</text>
  <rect x="270" y="852" width="460" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="872.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">一段序列参与编码多个肽链</text>
  <rect x="730" y="852" width="610" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1035" y="872.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">噬菌体 φX174</text>
  <rect x="60" y="882" width="1280" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="882" width="210" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="165" y="902.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">假基因</text>
  <rect x="270" y="882" width="460" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="902.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">与功能基因同源但已失活</text>
  <rect x="730" y="882" width="610" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1035" y="902.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">人 β-珠蛋白 ψ 基因</text>
  <rect x="60" y="912" width="210" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="165" y="932.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">转座基因</text>
  <rect x="270" y="912" width="460" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="932.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">可在基因组内移动</text>
  <rect x="730" y="912" width="610" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1035" y="932.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">果蝇 P 元件、人 LINE-1</text>
  <text x="60" y="958" font-size="12" fill="#64748b">从「一个基因一种酶」到「一个基因一条多肽链」：多种蛋白质由多条肽链组成，学说随之修正。</text>
</svg>