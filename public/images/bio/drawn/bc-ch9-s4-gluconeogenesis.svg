<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">糖异生：三处旁路绕行与互为倒数调节</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">丙酮酸羧化酶 + PEP 羧激酶、果糖二磷酸酶-1、葡萄糖-6-磷酸酶三处绕行（耗 4 ATP + 2 GTP）；Cori 循环防酸中毒；F-2,6-BP 为酵解 / 糖异生互为倒数的调节枢纽</text>
  <rect x="30" y="132" width="1340" height="452" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、糖酵解与糖异生：三处不可逆步骤的旁路对照</text>
  <text x="665" y="172" font-size="10.5" fill="#64748b" text-anchor="middle">糖酵解 10 步中 7 步可逆（双向共用酶），仅 3 步不可逆——糖异生须「绕行」</text>
  <rect x="345.613175" y="170.225" width="108.77365000000002" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="400" y="184.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">糖酵解（放能 ↓）</text>
  <rect x="933.7681749999999" y="170.225" width="132.46365000000003" height="19.55" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1000" y="184.14" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">糖异生（耗能旁路 ↑）</text>
  <rect x="590" y="184" width="150" height="32" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="665" y="204" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">葡萄糖</text>
  <rect x="590" y="246" width="150" height="32" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="665" y="266" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">6-磷酸葡萄糖</text>
  <rect x="590" y="308" width="150" height="32" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="665" y="328" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">6-磷酸果糖</text>
  <rect x="590" y="370" width="150" height="32" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="665" y="390" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1,6-二磷酸果糖</text>
  <rect x="590" y="454" width="150" height="32" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="665" y="474" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">磷酸烯醇式丙酮酸</text>
  <rect x="590" y="516" width="150" height="32" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="665" y="536" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">丙酮酸</text>
  <line x1="665" y1="278" x2="665" y2="308" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="735" y="296" font-size="9" fill="#64748b" text-anchor="middle">磷酸己糖异构酶</text>
  <line x1="665" y1="402" x2="665" y2="454" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="690" y="428" font-size="9.5" fill="#64748b">中间 6 步可逆（醛缩酶 → 烯醇化酶，</text>
  <text x="690" y="441" font-size="9.5" fill="#64748b">双向共用）</text>
  <line x1="552" y1="216" x2="552" y2="246" stroke="#0369a1" stroke-width="2.6" marker-end="url(#arr-acc)"/>
  <rect x="403.37" y="222.075" width="53.26" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="430" y="234.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">己糖激酶</text>
  <text x="430" y="251" font-size="9" fill="#64748b" text-anchor="middle">耗 1 ATP</text>
  <line x1="552" y1="340" x2="552" y2="370" stroke="#0369a1" stroke-width="2.6" marker-end="url(#arr-acc)"/>
  <rect x="408.7775" y="346.075" width="42.445" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="430" y="358.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">PFK-1</text>
  <text x="430" y="375" font-size="9" fill="#64748b" text-anchor="middle">耗 1 ATP</text>
  <line x1="552" y1="486" x2="552" y2="516" stroke="#0369a1" stroke-width="2.6" marker-end="url(#arr-acc)"/>
  <rect x="397.9625" y="492.075" width="64.075" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="430" y="504.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">丙酮酸激酶</text>
  <text x="430" y="521" font-size="9" fill="#64748b" text-anchor="middle">产 1 ATP</text>
  <path d="M740,262 C830,262 830,200 740,200" fill="none" stroke="#be185d" stroke-width="2.6" marker-end="url(#arr-enz)"/>
  <rect x="891.6061" y="214.65" width="96.78779999999999" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="940" y="227.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">葡萄糖-6-磷酸酶</text>
  <text x="940" y="248" font-size="9.5" fill="#475569" text-anchor="middle">（仅存在于肝 · 肾内质网）</text>
  <path d="M740,386 C830,386 830,324 740,324" fill="none" stroke="#be185d" stroke-width="2.6" marker-end="url(#arr-enz)"/>
  <rect x="894.5519" y="338.65" width="90.8962" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="940" y="351.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">果糖二磷酸酶-1</text>
  <text x="940" y="372" font-size="9.5" fill="#475569" text-anchor="middle">（F-2,6-BP 抑制 · 柠檬酸激活）</text>
  <rect x="756" y="494" width="210" height="70" rx="9" fill="#ffedd5" fill-opacity="0.5" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="768" y="508" font-size="9.5" fill="#78350f" font-weight="700">线粒体</text>
  <path d="M740,532 L927,532 L927,486" fill="none" stroke="#be185d" stroke-width="2.6" marker-end="url(#arr-enz)"/>
  <rect x="791.582" y="547.5" width="132.836" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="858" y="559.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">丙酮酸羧化酶（耗 1 ATP）</text>
  <rect x="862" y="452" width="130" height="34" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="927" y="473" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">草酰乙酸</text>
  <path d="M927,452 C927,410 830,410 742,470" fill="none" stroke="#be185d" stroke-width="2.6" marker-end="url(#arr-enz)"/>
  <rect x="820.9855" y="388.65" width="138.029" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="890" y="401.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">PEP 羧激酶（耗 1 GTP）</text>
  <text x="1004" y="492" font-size="9.5" fill="#475569">草酰乙酸不能穿膜：以苹果酸</text>
  <text x="1004" y="506" font-size="9.5" fill="#475569">（兼带出 NADH）</text>
  <text x="1004" y="520" font-size="9.5" fill="#475569">或天冬氨酸形式出线粒体。</text>
  <rect x="1090" y="240" width="250" height="128" rx="9" fill="#fce7f3" fill-opacity="0.5" stroke="#be185d" stroke-width="1.5"/>
  <text x="1106" y="264" font-size="11" fill="#831843" font-weight="700">旁路代价（2 丙酮酸 → 葡萄糖）</text>
  <text x="1106" y="290" font-size="10.5" fill="#475569">· 丙酮酸羧化酶 ×2 → 2 ATP</text>
  <text x="1106" y="312" font-size="10.5" fill="#475569">· PEP 羧激酶 ×2 → 2 GTP</text>
  <text x="1106" y="338" font-size="11" fill="#831843" font-weight="700">合计 6 个高能磷酸键</text>
  <text x="1106" y="358" font-size="9.5" fill="#64748b">（糖酵解仅净回收 2 ATP）</text>
  <rect x="1090" y="396" width="250" height="76" rx="8" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1106" y="420" font-size="10.5" fill="#dc2626" font-weight="700">肌 · 脑无葡萄糖-6-磷酸酶</text>
  <text x="1106" y="440" font-size="10.5" fill="#475569">肌糖原不能直接补充血糖</text>
  <text x="1106" y="460" font-size="9.5" fill="#64748b">（仅肝、肾可输出游离葡萄糖）</text>
  <rect x="30" y="596" width="440" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="618.84" font-size="19" fill="#475569" font-weight="700">二、场所、原料与总代价</text>
  <text x="46" y="640" font-size="11" fill="#475569">主要场所：肝（约 80%~90%）；肾皮质次之——长期饥饿时肾糖异生比例大增，</text>
  <text x="46" y="656" font-size="11" fill="#475569">被称「第二个糖异生器官」。</text>
  <text x="46" y="692" font-size="11" fill="#475569">空腹血糖约 4.5 mmol/L（总量仅约 20 g），脑日耗葡萄糖 100~120 g，</text>
  <text x="46" y="708" font-size="11" fill="#475569">全靠糖异生维持。</text>
  <text x="46" y="744" font-size="12" fill="#1e293b" font-weight="700">原料：</text>
  <text x="46" y="768" font-size="10.5" fill="#475569">乳酸（LDH 氧化为丙酮酸）· 甘油（→ 磷酸二羟丙酮，仅肝）· 生糖氨基酸</text>
  <text x="46" y="783" font-size="10.5" fill="#475569">（转氨后成 TCA 中间物 → OAA）· 丙酸</text>
  <rect x="46" y="824" width="410" height="92" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="62" y="848" font-size="10.5" fill="#1e293b" font-weight="700">2 丙酮酸 + 4 ATP + 2 GTP + 2 NADH + 6 H₂O → 葡萄糖 + 4 ADP + 2 GDP + 6 Pi + 2 NAD⁺ + 2 H⁺</text>
  <text x="62" y="892" font-size="10" fill="#64748b">消耗 6 个高能磷酸键 ≫ 糖酵解回收的 2 ATP——代价换来反应方向的不可逆性。</text>
  <text x="251" y="952" font-size="10.5" fill="#64748b" text-anchor="middle">由非糖物质合成葡萄糖或糖原</text>
  <rect x="470" y="596" width="460" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="486" y="618.84" font-size="19" fill="#475569" font-weight="700">三、Cori 循环与葡萄糖-丙氨酸循环</text>
  <ellipse cx="590" cy="700" rx="62" ry="44" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="590" y="700" font-size="18" fill="#475569" text-anchor="middle" font-weight="600">肌肉</text>
  <text x="590" y="724" font-size="9" fill="#64748b" text-anchor="middle">糖酵解产乳酸</text>
  <ellipse cx="812" cy="700" rx="62" ry="44" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="812" y="700" font-size="18" fill="#475569" text-anchor="middle" font-weight="600">肝</text>
  <text x="812" y="724" font-size="9" fill="#64748b" text-anchor="middle">糖异生成葡萄糖</text>
  <line x1="624" y1="662" x2="776" y2="662" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <text x="700" y="648" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">乳酸（血）</text>
  <line x1="776" y1="742" x2="624" y2="742" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <text x="700" y="764" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">葡萄糖（血）</text>
  <rect x="673.855" y="691.5" width="52.29" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="700" y="703.6" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">Cori 循环</text>
  <text x="486" y="806" font-size="10.5" fill="#475569">红细胞与剧烈运动的肌肉糖酵解产乳酸 → 肝摄取糖异生成葡萄糖回输——能量上「肝贴补 ATP」换取肌糖即时供给，</text>
  <text x="486" y="821" font-size="10.5" fill="#475569">并防止乳酸酸中毒。</text>
  <text x="486" y="862" font-size="11.5" fill="#1e293b" font-weight="700">葡萄糖-丙氨酸循环（兼运氮）：</text>
  <rect x="544.185" y="897.075" width="31.63" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="560" y="909.78" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">肌肉</text>
  <rect x="831.5925" y="897.075" width="20.814999999999998" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="842" y="909.78" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">肝</text>
  <line x1="600" y1="906" x2="800" y2="906" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#arr-pro)"/>
  <text x="700" y="890" font-size="10" fill="#4c1d95" text-anchor="middle" font-weight="700">丙氨酸（携氨基氮）</text>
  <line x1="800" y1="934" x2="600" y2="934" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <text x="700" y="952" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">葡萄糖</text>
  <rect x="930" y="596" width="440" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="946" y="618.84" font-size="19" fill="#475569" font-weight="700">四、互为倒数调节：F-2,6-BP 是枢纽</text>
  <rect x="1086.3603" y="652.95" width="127.27940000000001" height="22.099999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1150" y="668.68" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">F-2,6-BP（枢纽）</text>
  <line x1="1108" y1="682" x2="1044" y2="706" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <line x1="1192" y1="682" x2="1256" y2="706" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <rect x="996.2321" y="721.075" width="67.5358" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1030" y="733.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">激活 PFK-1</text>
  <text x="1030" y="752" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">糖酵解 ↑</text>
  <rect x="1229.7964" y="721.075" width="84.4072" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1272" y="733.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">抑制 FBPase-1</text>
  <text x="1272" y="752" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">糖异生 ↓</text>
  <rect x="946" y="780" width="204" height="128" rx="9" fill="#f8fafc" stroke="#0369a1" stroke-width="1.5"/>
  <text x="960" y="804" font-size="10" fill="#475569">胰高血糖素 / 肾上腺素：</text>
  <text x="960" y="818" font-size="10" fill="#475569">cAMP-PKA 磷酸化双功能酶</text>
  <text x="960" y="832" font-size="10" fill="#475569">（PFK-2 / FBPase-2）</text>
  <text x="960" y="846" font-size="10" fill="#475569">→ 肝内 FBPase-2 占优 → F-2,6-BP ↓ → 糖异生 ↑</text>
  <rect x="1162" y="780" width="194" height="128" rx="9" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
  <text x="1176" y="804" font-size="10" fill="#475569">胰岛素：使双功能酶去磷酸化</text>
  <text x="1176" y="818" font-size="10" fill="#475569">（PFK-2 占优）</text>
  <text x="1176" y="832" font-size="10" fill="#475569">→ F-2,6-BP ↑ → 酵解 ↑、糖异生 ↓</text>
  <text x="946" y="930" font-size="10" fill="#475569">乙酰CoA 激活丙酮酸羧化酶、同时抑制 PDH（「丙酮酸分流」）；ATP / 柠檬酸抑制 PFK-1，</text>
  <text x="946" y="944" font-size="10" fill="#475569">均推动糖异生。</text>
  <text x="946" y="962" font-size="10" fill="#64748b">互为倒数避免无效循环（ATP 空转）；底物循环可产热（颤抖性产热）；</text>
  <text x="946" y="976" font-size="10" fill="#64748b">饥饿时糖皮质激素诱导关键酶转录上调。</text>
</svg>