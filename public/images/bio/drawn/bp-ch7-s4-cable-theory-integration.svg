  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">电缆理论与神经元信息整合：λ–τ 划定时空窗口</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">V(x) = V₀e^(−x/λ)（x = λ 处衰减至 37%）；τ = r_m·c_m 典型 5–20 ms、λ = √(r_m/r_i) 典型 0.1–1 mm（髓鞘 → cm 级）；神经元 ≈ 泄漏积分–发放器</text>
