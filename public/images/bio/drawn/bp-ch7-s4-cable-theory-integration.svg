  <text x="46" y="786.84" font-size="19" fill="#475569" font-weight="700">三、几何与髓鞘决定 λ；主动电导使树突成为「非线性电缆」</text>
  <rect x="50" y="790" width="630" height="170" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="70" y="816" font-size="13" fill="#1e293b" font-weight="700">λ 与 τ 的参数学</text>
  <circle cx="88" cy="844" r="4" fill="#0369a1"/>
  <text x="100" y="848" font-size="10.5" fill="#475569" font-weight="600">λ = √(r_m/r_i)：大直径（r_i 小）、高膜阻（r_m 大）→ λ 大 → 信号传得远</text>
  <circle cx="88" cy="876" r="4" fill="#0369a1"/>
  <text x="100" y="880" font-size="10.5" fill="#475569" font-weight="600">髓鞘：r_m 增大几个数量级、c_m 减小数倍 → λ 延长到 cm 级（跳跃传导）</text>
  <circle cx="88" cy="908" r="4" fill="#0369a1"/>
  <text x="100" y="912" font-size="10.5" fill="#475569" font-weight="600">起源：Kelvin 为海底电报电缆发展的方程，被 Hodgkin 等移植到神经突起</text>
  <rect x="700" y="790" width="640" height="170" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="720" y="816" font-size="13" fill="#1e293b" font-weight="700">从被动到主动</text>
  <text x="720" y="846" font-size="10.5" fill="#475569">真实树突布满电压门控通道，被动电缆只是零阶近似；带主动电导的「非线性电缆」可支持树突局部放电、</text>
  <text x="720" y="860.5" font-size="10.5" fill="#475569">反向传播的 AP 与平台电位。</text>
  <text x="720" y="894" font-size="10.5" fill="#64748b">但线性 λ–τ 框架仍是理解神经元几何—功能关系（树突长度、分叉自相似、髓鞘周期）的第一语言，</text>
  <text x="720" y="908.5" font-size="10.5" fill="#64748b">也是计算神经科学所有精细模型的底座。</text>
</svg>