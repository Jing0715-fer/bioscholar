  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">RNA 的种类与结构：三大类 RNA 与非编码 RNA 家族</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">mRNA 帽-尾结构（5′ m⁷Gppp + 3′ poly(A) 20~250）、tRNA 三叶草/倒 L 形「适配器」（稀有碱基最多）、rRNA 催化核心（23S rRNA 核酶）与 miRNA/lncRNA 等 ncRNA</text>
  <rect x="30" y="132" width="660" height="415" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、RNA 的一般特征与 mRNA 的帽-尾结构</text>
  <path d="M 66,214 q 20,-18 40,0 q 20,18 40,0 q 20,-18 40,0 q 20,18 40,0 q 20,-18 40,0" fill="none" opacity="0.8" stroke="#b45309" stroke-width="3.2"/>
  <path d="M294,217 L294,181 A12,12 0 0 1 306,181 L306,217" fill="none" stroke="#b45309" stroke-width="2.2"/>
  <text x="360" y="200" font-size="11" fill="#78350f" font-weight="600">茎环（发夹）</text>
  <text x="66" y="252" font-size="11" fill="#475569">单链回折 → 局部双螺旋（A 型）与茎环；</text>
  <text x="66" y="268" font-size="11" fill="#475569">2′-OH 亲核进攻磷酸二酯键 → 对碱不稳定，</text>
  <text x="66" y="284" font-size="11" fill="#475569">比 DNA 更易降解（不能形成长 B 型双螺旋）。</text>
  <text x="360" y="226" font-size="11" fill="#64748b">碱基组成无 Chargaff 当量关系；</text>
  <text x="360" y="242" font-size="11" fill="#64748b">某些病毒以 RNA 为遗传物质。</text>
  <text x="66" y="306" font-size="13" fill="#1e293b" font-weight="700">真核 mRNA（占总 RNA 约 3%~5%）</text>
  <rect x="108.84004999999999" y="338.65" width="82.31990000000002" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="150" y="351.96" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">5′ m⁷Gppp 帽</text>
  <line x1="206" y1="348" x2="236" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="238" y="330" width="232" height="36" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="354" y="352" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">编码区 ORF（单顺反子）</text>
  <text x="262" y="372" font-size="9.5" fill="#64748b">起始</text>
  <text x="430" y="372" font-size="9.5" fill="#64748b">终止</text>
  <line x1="472" y1="348" x2="502" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="519.4632" y="338.65" width="81.07360000000001" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="560" y="351.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">3′ poly(A) 尾</text>
  <text x="560" y="378" font-size="9.5" fill="#64748b" text-anchor="middle">20~250 个 A</text>
  <text x="66" y="402" font-size="10.5" fill="#475569">帽：保护 mRNA、参与翻译起始识别；poly(A) 尾：维持稳定性、提高翻译效率；内含子剪接后形成成熟 mRNA。</text>
  <text x="66" y="417" font-size="10.5" fill="#475569">原核 mRNA 为多顺反子、半衰期短，无帽与尾。</text>
  <rect x="46" y="448" width="92" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="92" y="475.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">特征</text>
  <rect x="138" y="448" width="236" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="256" y="475.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">DNA</text>
  <rect x="374" y="448" width="284" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="516" y="475.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">RNA</text>
  <rect x="46" y="492" width="92" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="92" y="511" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">链</text>
  <rect x="138" y="492" width="236" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="256" y="511" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">双链（主要）</text>
  <rect x="374" y="492" width="284" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="516" y="511" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">单链（局部双链）</text>
  <rect x="46" y="519" width="612" height="27" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="46" y="519" width="92" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="92" y="538" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">碱基</text>
  <rect x="138" y="519" width="236" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="256" y="538" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">A · T · G · C</text>
  <rect x="374" y="519" width="284" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="516" y="538" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">A · U · G · C（+稀有碱基）</text>
  <rect x="46" y="546" width="92" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="92" y="565" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">戊糖</text>
  <rect x="138" y="546" width="236" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="256" y="565" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">2′-脱氧核糖</text>
  <rect x="374" y="546" width="284" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="516" y="565" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">核糖（含 2′-OH）</text>
  <rect x="710" y="132" width="660" height="415" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、tRNA（73~94 nt）：三叶草二级结构 × 倒 L 三级结构</text>
  <polyline points="948.5,322 948.5,260" fill="none" stroke="#b45309" stroke-width="2.4"/>
  <polyline points="961.5,322 961.5,260" fill="none" stroke="#b45309" stroke-width="2.4"/>
