  <line x1="961.5" y1="438" x2="948.5" y2="438" stroke="#b45309" stroke-width="1.2" opacity="0.5"/>
  <path d="M982.6,369.3 L1003.1,385.4 A13,13 0 0 1 995.1,395.6 L974.6,379.6" fill="none" stroke="#b45309" stroke-width="2.4"/>
  <line x1="989.7342189802789" y1="374.888727639257" x2="981.7306198010453" y2="385.13286743614435" stroke="#b45309" stroke-width="1.2" opacity="0.5"/>
  <rect x="933.9656" y="229.075" width="48.068799999999996" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="958" y="241.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">3′-CCA</text>
  <text x="889" y="264" font-size="9.5" fill="#64748b" text-anchor="middle">5′</text>
  <text x="955" y="218" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">氨基酸臂（接受氨基酸）</text>
  <text x="827" y="346" font-size="10.5" fill="#1e293b" text-anchor="end" font-weight="700">DHU 环</text>
  <text x="827" y="364" font-size="9" fill="#64748b" text-anchor="end">（二氢尿嘧啶）</text>
  <text x="1083" y="346" font-size="10.5" fill="#1e293b" font-weight="700">TψC 环</text>
  <text x="1083" y="364" font-size="9" fill="#64748b">（含稀有碱基 T·ψ）</text>
  <text x="955" y="504" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">反密码子环</text>
  <text x="955" y="522" font-size="9" fill="#64748b" text-anchor="middle">（中部含反密码子）</text>
  <text x="1051" y="430" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">可变环</text>
  <circle cx="943" cy="466" r="3.4" fill="#be185d"/>
  <circle cx="955" cy="472" r="3.4" fill="#be185d"/>
  <circle cx="967" cy="466" r="3.4" fill="#be185d"/>
  <text x="1226" y="214" font-size="12" fill="#1e293b" font-weight="700">三级结构：倒 L 形</text>
  <path d="M1236,398 L1236,262 L1330,262" fill="none" opacity="0.32" stroke="#b45309" stroke-width="11"/>
  <path d="M1236,398 L1236,262 L1330,262" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 4"/>
  <rect x="1214.7784" y="231.925" width="42.4432" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1236" y="243.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">3′-CCA</text>
  <rect x="1312.43" y="275.925" width="47.14" height="16.15" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1336" y="287.42" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">反密码子</text>
  <text x="1283" y="430" font-size="9.5" fill="#64748b" text-anchor="middle">氨基酸臂与反密码子臂</text>
  <text x="1283" y="444" font-size="9.5" fill="#64748b" text-anchor="middle">分居 L 两端</text>
  <text x="726" y="500" font-size="10.5" fill="#475569">tRNA 是「适配器」分子：一端连密码（反密码子识别 mRNA 密码子）、一端连氨基酸（3′-CCA）；含稀有碱基最多</text>
  <text x="726" y="515" font-size="10.5" fill="#475569">（假尿苷 ψ · DHU · T · 甲基化碱基）。</text>
  <rect x="30" y="566" width="660" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="588.84" font-size="19" fill="#475569" font-weight="700">三、rRNA（约 80%）：核糖体的结构与催化核心</text>
  <rect x="56" y="624" width="96" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="104" y="651.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700"></text>
  <rect x="152" y="624" width="244" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="274" y="651.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">原核 70S 核糖体</text>
  <rect x="396" y="624" width="272" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="532" y="651.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">真核 80S 核糖体</text>
  <rect x="56" y="668" width="96" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="104" y="694.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">大亚基</text>
  <rect x="152" y="668" width="244" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="274" y="694.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">50S = 23S + 5S</text>
  <rect x="396" y="668" width="272" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="532" y="694.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">60S = 28S + 5.8S + 5S</text>
  <rect x="56" y="710" width="612" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="56" y="710" width="96" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="104" y="736.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">小亚基</text>
  <rect x="152" y="710" width="244" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="274" y="736.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">30S = 16S</text>
  <rect x="396" y="710" width="272" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="532" y="736.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">40S = 18S</text>
  <rect x="56" y="756" width="612" height="66" rx="8" fill="#fce7f3" fill-opacity="0.55" stroke="#be185d" stroke-width="1.6"/>
  <text x="72" y="780" font-size="12.5" fill="#831843" font-weight="700">肽酰转移酶活性由 23S rRNA 本身承担——是核酶</text>
  <text x="72" y="802" font-size="10.5" fill="#475569">RNA 既携带信息又具催化功能，为「RNA 世界假说」的重要证据。</text>
  <rect x="103" y="947.2" width="96" height="4.8" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="151" y="938.2" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">3~5%</text>
  <text x="151" y="972" font-size="12.5" fill="#64748b" text-anchor="middle">mRNA</text>
  <rect x="253" y="856" width="96" height="96" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="301" y="847" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">~80%</text>
  <text x="301" y="972" font-size="12.5" fill="#64748b" text-anchor="middle">rRNA</text>
  <text x="400" y="880" font-size="11.5" fill="#1e293b" font-weight="700">rRNA 含量最多（约 80%），</text>
  <text x="400" y="916" font-size="10.5" fill="#475569">是核糖体的结构骨架与催化核心；mRNA 仅约 3%~5%，</text>
  <text x="400" y="931" font-size="10.5" fill="#475569">寿命短而更新快。</text>
  <rect x="710" y="566" width="660" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="588.84" font-size="19" fill="#475569" font-weight="700">四、非编码 RNA（ncRNA）：不编码蛋白质的功能 RNA</text>
  <rect x="736" y="614" width="296" height="100" rx="9" fill="#fef3c7" fill-opacity="0.45" stroke="#b45309" stroke-width="1.5"/>
  <text x="752" y="642" font-size="13" fill="#b45309" font-weight="700">miRNA · siRNA</text>
  <text x="752" y="664" font-size="10.5" fill="#475569">~22 nt，介导 RNA 干扰（转录后基因沉默）；</text>
  <text x="752" y="679" font-size="10.5" fill="#475569">Fire 与 Mello 获 2006 年诺贝尔奖</text>
  <rect x="1052" y="614" width="296" height="100" rx="9" fill="#ede9fe" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1068" y="642" font-size="13" fill="#6d28d9" font-weight="700">lncRNA</text>
  <text x="1068" y="664" font-size="10.5" fill="#475569">长链非编码 RNA，参与表观遗传调控（如 Xist）</text>
  <rect x="736" y="726" width="296" height="100" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.5"/>
  <text x="752" y="754" font-size="13" fill="#0f766e" font-weight="700">snRNA</text>
  <text x="752" y="776" font-size="10.5" fill="#475569">与蛋白质构成剪接体，执行内含子剪接</text>
  <rect x="1052" y="726" width="296" height="100" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1068" y="754" font-size="13" fill="#0369a1" font-weight="700">snoRNA</text>
  <text x="1068" y="776" font-size="10.5" fill="#475569">指导 rRNA 核苷酸的修饰</text>
  <rect x="736" y="838" width="296" height="100" rx="9" fill="#fce7f3" fill-opacity="0.45" stroke="#be185d" stroke-width="1.5"/>
  <text x="752" y="866" font-size="13" fill="#be185d" font-weight="700">核酶（催化 RNA）</text>
  <text x="752" y="888" font-size="10.5" fill="#475569">RNase P 的 M1 RNA 与锤头状核酶可催化生化反应</text>
  <rect x="1052" y="838" width="296" height="100" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="1068" y="866" font-size="13" fill="#475569" font-weight="700">要义</text>
  <text x="1068" y="888" font-size="10.5" fill="#475569">RNA 兼具「信息分子」与「工具分子」双重身份：</text>
  <text x="1068" y="903" font-size="10.5" fill="#475569">从核酶到 RNA 干扰，催化与调控皆由 RNA 直接执行。</text>
</svg>