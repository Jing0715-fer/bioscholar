<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">微生物的营养要素与营养类型：六大要素、四型分类与碳氮比</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">水占鲜重 70%–90%；固氮每分子 N₂ 耗 16 ATP；按能源 × 供氢体 × 碳源分光能自养、光能异养、化能自养、化能异养四型；细菌细胞 C/N ≈ 5、真菌 ≈ 10</text>
  <rect x="30" y="132" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、六大营养要素：水、碳源、氮源、无机盐、生长因子与氧气</text>
  <rect x="50" y="178" width="410" height="96" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="68" y="205" font-size="13.5" fill="#075985" font-weight="700">① 水（占鲜重 70%–90%）</text>
  <text x="68" y="229" font-size="11.5" fill="#475569">一切营养须先溶于水才能吸收；胞内酶促反应都在水相中进行。</text>
  <rect x="470" y="178" width="410" height="96" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="488" y="205" font-size="13.5" fill="#134e4a" font-weight="700">② 碳源（约占细胞干重一半）</text>
  <text x="488" y="229" font-size="11.5" fill="#475569">糖类最常用；从 CO₂ 到烃类，可利用谱极宽。</text>
  <rect x="890" y="178" width="410" height="96" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="908" y="205" font-size="13.5" fill="#78350f" font-weight="700">③ 氮源</text>
  <text x="908" y="229" font-size="11.5" fill="#475569">谱极宽：N₂（固氮耗 16 ATP/分子）、铵盐等速效氮、蛋白胨等迟效氮。</text>
  <rect x="50" y="286" width="410" height="96" rx="9" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="68" y="313" font-size="13.5" fill="#4c1d95" font-weight="700">④ 无机盐</text>
  <text x="68" y="337" font-size="11.5" fill="#475569">大量与微量元素多为酶辅基或激活剂；微量元素过量有毒。</text>
  <rect x="470" y="286" width="410" height="96" rx="9" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="488" y="313" font-size="13.5" fill="#831843" font-weight="700">⑤ 生长因子</text>
  <text x="488" y="337" font-size="11.5" fill="#475569">维生素、氨基酸、碱基等；营养缺陷型是氨基酸发酵的菌种基础。</text>
  <rect x="890" y="286" width="410" height="96" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="908" y="313" font-size="13.5" fill="#92400e" font-weight="700">⑥ 氧气</text>
  <text x="908" y="337" font-size="11.5" fill="#475569">好氧呼吸的末端电子受体（厌氧微生物不需要）。</text>
  <rect x="30" y="452" width="1340" height="528" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">二、四种营养类型：能源 × 供氢体 × 碳源三维判定</text>
  <rect x="50" y="508" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="535.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">营养类型</text>
  <rect x="160" y="508" width="128" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="224" y="535.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">能源</text>
  <rect x="288" y="508" width="202" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="389" y="535.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">供氢（电子）供体</text>
  <rect x="490" y="508" width="92" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="536" y="535.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">碳源</text>
  <rect x="582" y="508" width="168" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="666" y="535.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">代表微生物</text>
  <rect x="50" y="552" width="110" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="582.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">光能自养</text>
  <rect x="160" y="552" width="128" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="224" y="582.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">光能</text>
  <rect x="288" y="552" width="202" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="389" y="582.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">H₂O、H₂S 等还原态无机物</text>
  <rect x="490" y="552" width="92" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="536" y="582.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">CO₂</text>
  <rect x="582" y="552" width="168" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="666" y="582.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">蓝细菌、绿硫细菌</text>
  <rect x="50" y="602" width="700" height="50" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="602" width="110" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="632.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">光能异养</text>
  <rect x="160" y="602" width="128" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="224" y="632.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">光能</text>
  <rect x="288" y="602" width="202" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="389" y="632.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">有机物</text>
  <rect x="490" y="602" width="92" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="536" y="632.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">有机物</text>
  <rect x="582" y="602" width="168" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="666" y="632.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">紫色非硫细菌</text>
  <rect x="50" y="652" width="110" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="682.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">化能自养</text>
  <rect x="160" y="652" width="128" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="224" y="682.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">无机物氧化</text>
  <rect x="288" y="652" width="202" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="389" y="682.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">H₂、H₂S、NH₃、Fe²⁺</text>
  <rect x="490" y="652" width="92" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="536" y="682.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">CO₂</text>
  <rect x="582" y="652" width="168" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="666" y="682.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">硝化细菌、硫杆菌</text>
  <rect x="50" y="702" width="700" height="50" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="702" width="110" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="732.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">化能异养</text>
  <rect x="160" y="702" width="128" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="224" y="732.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">有机物氧化</text>
  <rect x="288" y="702" width="202" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="389" y="732.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">有机物</text>
  <rect x="490" y="702" width="92" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="536" y="732.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">有机物</text>
  <rect x="582" y="702" width="168" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="666" y="732.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">绝大多数细菌、全部真菌</text>
  <rect x="50" y="790" width="700" height="172" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="68" y="816" font-size="13.5" fill="#1e293b" font-weight="700">类型判定三维度</text>
  <rect x="68" y="836" width="8" height="8" rx="2" fill="#0369a1"/>
  <text x="84" y="845" font-size="12" fill="#475569" font-weight="700">能源：</text>
  <text x="129.07999999999998" y="845" font-size="12" fill="#475569">光能 ｜ 化能（无机物或有机物氧化产能）</text>
  <rect x="68" y="868" width="8" height="8" rx="2" fill="#0369a1"/>
  <text x="84" y="877" font-size="12" fill="#475569" font-weight="700">供氢（电子）供体：</text>
  <text x="203.24" y="877" font-size="12" fill="#475569">还原态无机物 ｜ 有机物</text>
  <rect x="68" y="900" width="8" height="8" rx="2" fill="#0369a1"/>
  <text x="84" y="909" font-size="12" fill="#475569" font-weight="700">碳源：</text>
  <text x="129.07999999999998" y="909" font-size="12" fill="#475569">CO₂（自养） ｜ 有机物（异养）</text>
  <text x="68" y="944" font-size="11.5" fill="#64748b" font-weight="700">——三个维度组合，构成左表四种营养类型</text>
  <rect x="790" y="495" width="560" height="210" rx="9" fill="#fef3c7" fill-opacity="0.3" stroke="#b45309" stroke-width="1.5"/>
  <text x="810" y="521" font-size="14" fill="#78350f" font-weight="700">氮源谱：从 N₂ 到蛋白胨</text>
  <rect x="810" y="548" width="190" height="40" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="905" y="573" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">分子态 N₂</text>
  <text x="1016" y="566" font-size="11" fill="#475569">需固氮酶——每固定 1 分子耗 16 ATP</text>
  <line x1="905" y1="590" x2="905" y2="596" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <rect x="810" y="600" width="190" height="40" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="905" y="625" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">铵盐、硝酸盐</text>
  <text x="1016" y="618" font-size="11" fill="#475569">速效氮：直接掺入氨基酸合成</text>
  <line x1="905" y1="642" x2="905" y2="648" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <rect x="810" y="652" width="190" height="40" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="905" y="677" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">蛋白胨、尿素等</text>
  <text x="1016" y="670" font-size="11" fill="#475569">迟效氮：须先降解为小分子</text>
  <rect x="790" y="725" width="560" height="120" rx="9" fill="#ccfbf1" fill-opacity="0.35" stroke="#0f766e" stroke-width="1.5"/>
  <text x="810" y="751" font-size="14" fill="#134e4a" font-weight="700">碳氮比（C/N）的生理意义</text>
  <text x="810" y="775" font-size="12" fill="#475569">细菌细胞 C/N ≈ 5，真菌 ≈ 10；培养基配制常用约 10:1，</text>
  <text x="810" y="794" font-size="12" fill="#475569">并依「生长菌体」还是「积累代谢产物」动态调整。</text>
</svg>