  <line x1="1190" y1="323" x2="1190" y2="337" stroke="#0f766e" stroke-width="1.4" opacity="0.55"/>
  <line x1="1210" y1="337" x2="1210" y2="323" stroke="#0f766e" stroke-width="1.4" opacity="0.55"/>
  <text x="1140" y="412" font-size="11" fill="#475569">壳层在核孔处解体，基因组经核孔入核。</text>
  <text x="730" y="490" font-size="11" fill="#64748b">递送终点由基因组而定：DNA 病毒入核，多数 RNA 病毒留在胞质。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、痘病毒两阶段脱壳与噬菌体机械注射</text>
  <text x="50" y="646" font-size="12.5" fill="#1e293b" font-weight="700">痘病毒：两阶段脱壳</text>
  <rect x="70" y="668" width="96" height="60" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <rect x="88" y="682" width="60" height="32" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
