  <text x="295" y="412" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">vRNP 释放</text>
  <line x1="300" y1="416" x2="340" y2="416" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <rect x="417.41499999999996" y="330.225" width="105.17000000000002" height="19.55" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="470" y="344.14" font-size="11.5" fill="#78350f" text-anchor="middle">M1 与 vRNP 解离</text>
  <text x="400" y="396" font-size="11" fill="#475569">M2 质子通道把内体的酸导入毒粒核心：酸化使 M1</text>
  <text x="400" y="412" font-size="11" fill="#475569">（基质）与 vRNP 分家，核糖核蛋白才得以释放、</text>
  <text x="400" y="428" font-size="11" fill="#475569">入核转录。</text>
  <text x="400" y="456" font-size="11" fill="#64748b">金刚烷胺类即 M2 通道抑制剂——最早的抗流感药之一，</text>
  <text x="400" y="472" font-size="11" fill="#64748b">现已普遍耐药。</text>
  <text x="50" y="496" font-size="11" fill="#475569">脱壳须等待明确信号（此处为内体酸化），</text>
  <text x="50" y="512" font-size="11" fill="#475569">时机与场所均受精确控制。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、腺病毒：内体破裂、微管运输与核孔输入</text>
  <rect x="730" y="176" width="150" height="52" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="805" y="198" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">① 吸附</text>
  <text x="805" y="218" font-size="9.5" fill="#475569" text-anchor="middle">纤维 knob 结合受体</text>
  <rect x="890" y="176" width="150" height="52" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="965" y="198" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">② 内吞</text>
  <text x="965" y="218" font-size="9.5" fill="#475569" text-anchor="middle">五邻体基板结合整合素</text>
  <rect x="1050" y="176" width="150" height="52" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1125" y="198" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">③ 破膜而出</text>
  <text x="1125" y="218" font-size="9.5" fill="#475569" text-anchor="middle">酸化变构释放蛋白 VI 裂解内体膜</text>
  <line x1="882" y1="202" x2="888" y2="202" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="1042" y1="202" x2="1048" y2="202" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="740" y1="330" x2="1120" y2="330" stroke="#6d28d9" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="930" y="312" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">微管</text>
  <rect x="980" y="306" width="46" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1003" y="328" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">壳层</text>
  <line x1="976" y1="324" x2="890" y2="324" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <rect x="920.31" y="363.075" width="179.38" height="17.849999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1010" y="375.78" font-size="10.5" fill="#4c1d95" text-anchor="middle">动力蛋白（dynein）· 每秒约数微米</text>
  <text x="730" y="412" font-size="11" fill="#475569">此时衣壳已先后丢弃纤维与五邻体，</text>
  <text x="730" y="428" font-size="11" fill="#475569">剩余六邻体壳层携约 36 kb 基因组沿微管逆行，运抵核孔复合体（NPC）。</text>
  <circle cx="1240" cy="330" r="88" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <text x="1240" y="326" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">细胞核</text>
  <rect x="1160" y="318" width="14" height="24" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <text x="1167" y="358" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">NPC</text>
