  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">脱壳与基因组递送：M2 通道、核孔输入与机械注射</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">流感 M2 导酸脱壳（金刚烷胺靶点、已普遍耐药）；腺病毒破膜后沿微管每秒约数微米抵达 NPC；痘病毒两阶段脱壳；T4 尾鞘收缩把脱壳与侵入并为一步</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、流感：M2 质子通道与酸化脱壳</text>
  <circle cx="240" cy="340" r="122" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.2"/>
  <text x="240" y="208" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">内体（pH 酸化）</text>
