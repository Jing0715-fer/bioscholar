  <text x="252" y="716" font-size="9.5" fill="#64748b" text-anchor="middle">早期 mRNA 自核心释出</text>
  <line x1="300" y1="700" x2="340" y2="700" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <rect x="344" y="668" width="96" height="60" rx="12" fill="#ffffff" stroke="#be185d" stroke-width="2" stroke-dasharray="6 4"/>
