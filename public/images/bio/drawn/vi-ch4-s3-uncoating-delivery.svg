  <text x="118" y="744" font-size="10.5" fill="#64748b" text-anchor="middle">完整核心</text>
  <line x1="176" y1="700" x2="216" y2="700" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <text x="196" y="684" font-size="9.5" fill="#831843" text-anchor="middle">早期转录</text>
