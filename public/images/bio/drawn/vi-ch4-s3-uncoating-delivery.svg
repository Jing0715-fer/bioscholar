  <line x1="407.5" y1="691" x2="407.5" y2="705" stroke="#0f766e" stroke-width="1.4" opacity="0.55"/>
  <text x="392" y="744" font-size="10.5" fill="#64748b" text-anchor="middle">核心瓦解</text>
  <text x="70" y="780" font-size="10.5" fill="#475569">第一阶段在完整核心内转录早期 mRNA；</text>
  <text x="70" y="795" font-size="10.5" fill="#475569">核心瓦解后方开始胞质复制——「病毒工厂」就地开工。</text>
  <text x="470" y="646" font-size="12.5" fill="#1e293b" font-weight="700">T4：机械注射</text>
  <rect x="530" y="677" width="120" height="46" rx="23" fill="#d1fae5" stroke="#075985" stroke-width="2.2"/>
  <text x="590" y="762" font-size="10.5" fill="#64748b" text-anchor="middle">细菌</text>
  <rect x="562" y="616" width="34" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="566" y="650" width="26" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="579" y1="664" x2="579" y2="688" stroke="#dc2626" stroke-width="4"/>
  <text x="579" y="600" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">尾鞘收缩</text>
  <line x1="579" y1="688" x2="579" y2="706" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-dna)"/>
  <text x="579" y="726" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">DNA 注入</text>
  <text x="470" y="780" font-size="10.5" fill="#475569">以尾鞘收缩把基因组直接注射入菌——脱壳与侵入一步完成，</text>
  <text x="470" y="795" font-size="10.5" fill="#475569">衣壳根本不进细胞。</text>
  <rect x="710" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="608.84" font-size="19" fill="#475569" font-weight="700">四、脱壳＝基因组递送的时空调控程序</text>
  <text x="730" y="646" font-size="12.5" fill="#1e293b" font-weight="700">逐级触发的信号：</text>
  <rect x="758" y="670.225" width="64" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="790" y="684.14" font-size="11.5" fill="#075985" text-anchor="middle">内体酸化</text>
  <rect x="904" y="670.225" width="64" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="936" y="684.14" font-size="11.5" fill="#134e4a" text-anchor="middle">受体结合</text>
  <rect x="1042" y="670.225" width="64" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1074" y="684.14" font-size="11.5" fill="#4c1d95" text-anchor="middle">核孔锚定</text>
  <line x1="1160" y1="680" x2="1200" y2="680" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <rect x="1210" y="652" width="130" height="56" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <text x="1275" y="674" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">逐级触发</text>
  <text x="1275" y="696" font-size="10" fill="#475569" text-anchor="middle">时机·场所精确控制</text>
  <text x="730" y="746" font-size="12.5" fill="#1e293b" font-weight="700">脱壳时机与先天免疫的博弈：</text>
  <rect x="760" y="768" width="120" height="84" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="820" y="796" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">渐进解体</text>
  <text x="820" y="816" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">的衣壳</text>
  <text x="820" y="838" font-size="9.5" fill="#475569" text-anchor="middle">遮蔽基因组</text>
  <circle cx="960" cy="800" r="24" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="960" y="804" font-size="9" fill="#065f46" text-anchor="middle" font-weight="700">先天</text>
  <text x="960" y="830" font-size="10.5" fill="#475569" text-anchor="middle">免疫传感器</text>
  <line x1="892" y1="800" x2="926" y2="800" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-bad)"/>
  <text x="908" y="784" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">够不着</text>
  <text x="1030" y="776" font-size="10.5" fill="#475569">基因组在最后一刻才暴露——脱壳太快会被传感器「看见」，</text>
  <text x="1030" y="791" font-size="10.5" fill="#475569">太慢则复制落后。</text>
  <text x="730" y="902" font-size="11" fill="#475569">现代病毒学把脱壳理解为「基因组递送的时空调控程序」：信号、路径、终点三位一体，而非简单的「脱衣服」。</text>
</svg>