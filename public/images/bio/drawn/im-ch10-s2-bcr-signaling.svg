  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">BCR 复合体与 B 细胞活化信号：构造、正负调控与三类抗原</text>
  <text x="700" y="74" text-anchor="middle" font-size="13" fill="#64748b">BCR 由 mIgM/mIgD 与 Igα/Igβ（CD79a/b）组成，信号亚单位共携两枚 ITAM，经 Lyn-Syk-BLNK-PLCγ2 接通钙流、MAPK 与 NF-κB 三条主干（Btk 缺陷致 XLA）；CD21-CD19-CD81 共受体以 C3d 耦联补体激活、显著降低活化阈值</text>
  <text x="700" y="100" text-anchor="middle" font-size="13" fill="#64748b">，EB 病毒经 gp350 盗用 CD21；CD22 与 FCGR2B 经 ITIM 招募 SHP-1 与 SHIP 负调，抗体反馈构成自限环；TD 抗原须 Tfh 辅助并产出记忆与亲和力成熟，TI-1 依赖丝裂原、TI-2 依赖重复表位交联，婴幼儿对 TI-2 应答弱故多糖疫苗须制成结合疫苗</text>
  <rect x="30" y="132" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、BCR 复合体：识别亚单位 + 信号亚单位，接通三条主干</text>
