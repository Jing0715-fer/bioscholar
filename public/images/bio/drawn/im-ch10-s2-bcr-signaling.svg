  <line x1="1220" y1="264" x2="1220" y2="296" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr-dna)"/>
  <text x="670" y="378" font-size="10.5" fill="#475569">ITAM 磷酸化后接通三条主干：Btk 在通路中承前启后——其缺陷即 XLA。</text>
  <rect x="30" y="448" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="470.84" font-size="19" fill="#475569" font-weight="700">二、CD21 共受体耦联补体正反馈 · CD22/FCGR2B 负调与抗体反馈</text>
  <rect x="60" y="498" width="620" height="182" rx="9" fill="#ccfbf1" fill-opacity="0.4" stroke="#0f766e" stroke-width="1.6"/>
  <text x="78" y="522" font-size="12.5" fill="#134e4a" font-weight="700">CD21-CD19-CD81 共受体：阈值调低器</text>
  <text x="78" y="546" font-size="10.5" fill="#475569">抗原若同时携带 C3d，经 CD21（CR2）把补体激活与 BCR 信号并联——显著降低活化所需抗原量。</text>
  <rect x="84" y="586" width="150" height="44" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="159" y="612" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">C3d-抗原</text>
  <line x1="238" y1="608" x2="278" y2="608" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-dna)"/>
  <rect x="282" y="586" width="160" height="44" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="362" y="612" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">CD21-CD19-CD81</text>
  <line x1="446" y1="608" x2="486" y2="608" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-dna)"/>
  <rect x="490" y="586" width="130" height="44" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="555" y="612" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">活化阈值↓</text>
  <text x="78" y="654" font-size="10.5" fill="#dc2626" font-weight="600">EB 病毒以 gp350 盗用 CD21 通道进入 B 细胞。</text>
  <rect x="710" y="498" width="630" height="182" rx="9" fill="#fee2e2" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.6"/>
  <text x="728" y="522" font-size="12.5" fill="#dc2626" font-weight="700">负调双闸与抗体反馈自限环</text>
  <text x="728" y="546" font-size="10.5" fill="#475569">CD22 与 FCGR2B 胞内段带 ITIM：分别招募 SHP-1 与 SHIP，给 BCR 信号踩刹车。</text>
  <rect x="748" y="580" width="240" height="44" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="868" y="604" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">CD22 → SHP-1</text>
  <rect x="1030" y="580" width="250" height="44" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="1155" y="604" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">FCGR2B → SHIP</text>
  <text x="728" y="648" font-size="10.5" fill="#475569">免疫复合物交联 BCR 与 FCGR2B → 抗体反馈构成体液应答的自限环：抗体多了，刹车自动收紧。</text>
  <rect x="30" y="712" width="1340" height="262" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="734.84" font-size="19" fill="#475569" font-weight="700">三、TD · TI-1 · TI-2：三类抗原的分野（婴幼儿 TI-2 应答弱，多糖须制成结合疫苗）</text>
