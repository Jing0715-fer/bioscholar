  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">电子显微学的分支版图：模式、传统与选型</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">TEM成像与衍射一体、SEM收表面信号、STEM兼得Z衬度与谱学；负染15–20Å、树脂切片2–10nm、玻璃化冷冻1.2–4Å；SPA-ET-电子晶体学三角权衡</text>
  <rect x="30" y="132" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、三大模式：透射、扫描与扫描透射</text>
  <rect x="173.81220000000002" y="178.1" width="152.3756" height="23.8" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="250" y="195.04" font-size="14" fill="#075985" text-anchor="middle" font-weight="700">TEM 透射电子显微镜</text>
  <rect x="235" y="208" width="30" height="8" fill="#475569"/>
  <line x1="230" y1="218" x2="230" y2="250" stroke="#d97706" stroke-width="1.3"/>
  <line x1="250" y1="218" x2="250" y2="250" stroke="#d97706" stroke-width="1.3"/>
  <line x1="270" y1="218" x2="270" y2="250" stroke="#d97706" stroke-width="1.3"/>
  <rect x="200" y="252" width="100" height="5" fill="#be185d"/>
  <rect x="212" y="262" width="76" height="22" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <circle cx="212" cy="273" r="4" fill="#0369a1"/>
  <circle cx="288" cy="273" r="4" fill="#0369a1"/>
  <line x1="230" y1="259" x2="224" y2="264" stroke="#d97706" stroke-width="1.2"/>
  <line x1="270" y1="259" x2="276" y2="264" stroke="#d97706" stroke-width="1.2"/>
  <line x1="224" y1="284" x2="206" y2="310" stroke="#d97706" stroke-width="1.2"/>
  <line x1="276" y1="284" x2="294" y2="310" stroke="#d97706" stroke-width="1.2"/>
  <rect x="203" y="312" width="94" height="7" fill="#059669"/>
  <text x="250" y="342" font-size="10.5" fill="#64748b" text-anchor="middle">样品</text>
  <text x="250" y="340" font-size="10" text-anchor="middle"></text>
  <text x="70" y="356" font-size="11.5" fill="#475569">平行束穿透薄样品，一次性记录整幅像；</text>
  <text x="70" y="373" font-size="11.5" fill="#475569">同一台仪器可在成像与衍射模式间切换——分辨率最高的模式。</text>
  <rect x="593.8122" y="178.1" width="152.3756" height="23.8" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="670" y="195.04" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="700">SEM 扫描电子显微镜</text>
  <rect x="655" y="208" width="30" height="8" fill="#475569"/>
  <line x1="670" y1="218" x2="670" y2="258" stroke="#d97706" stroke-width="1.6"/>
  <line x1="630" y1="236" x2="710" y2="236" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <rect x="610" y="260" width="120" height="7" fill="#be185d"/>
  <line x1="645" y1="258" x2="617" y2="222" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <line x1="695" y1="258" x2="723" y2="222" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <text x="600" y="214" font-size="10.5" fill="#991b1b" text-anchor="middle">二次电子</text>
  <text x="742" y="214" font-size="10.5" fill="#991b1b" text-anchor="middle">背散射电子</text>
  <text x="490" y="356" font-size="11.5" fill="#475569">聚焦探针在表面逐点扫描，</text>
  <text x="490" y="373" font-size="11.5" fill="#475569">收集二次电子与背散射电子重建形貌——景深大、制样相对简单，</text>
  <text x="490" y="390" font-size="11.5" fill="#475569">表面形貌主力。</text>
  <rect x="1024.922" y="178.1" width="190.156" height="23.8" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1120" y="195.04" font-size="14" fill="#134e4a" text-anchor="middle" font-weight="700">STEM 扫描透射电子显微镜</text>
  <rect x="1105" y="208" width="30" height="8" fill="#475569"/>
  <line x1="1100" y1="218" x2="1120" y2="254" stroke="#d97706" stroke-width="1.4"/>
  <line x1="1140" y1="218" x2="1120" y2="254" stroke="#d97706" stroke-width="1.4"/>
  <line x1="1080" y1="236" x2="1160" y2="236" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <rect x="1092" y="256" width="56" height="5" fill="#be185d"/>
  <line x1="1120" y1="263" x2="1120" y2="296" stroke="#d97706" stroke-width="1.4"/>
  <circle cx="1120" cy="312" r="26" fill="none" stroke="#be185d" stroke-width="2.4"/>
  <circle cx="1120" cy="312" r="10" fill="#0369a1"/>
  <text x="1120" y="316" font-size="9" fill="#075985" text-anchor="middle" font-weight="700">BF</text>
  <text x="1152" y="316" font-size="9.5" fill="#831843" font-weight="700">ADF/HAADF</text>
  <text x="940" y="356" font-size="11.5" fill="#475569">探针逐点扫描、样品下方按散射角分区接收：</text>
  <text x="940" y="373" font-size="11.5" fill="#475569">兼得 Z 衬度成像与逐点谱学（EELS/EDS）的优势。</text>
  <text x="700" y="424" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">三大模式的区别，本质是从电子-样品相互作用的同一信号家族中各自挑选哪些信号来成像</text>
  <rect x="30" y="456" width="660" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="478.84" font-size="19" fill="#475569" font-weight="700">二、生物制样三大体系与两大应用传统</text>
  <rect x="50" y="516" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="543.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">制样体系</text>
  <rect x="180" y="516" width="290" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="543.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">核心操作</text>
  <rect x="470" y="516" width="200" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="570" y="543.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">可达分辨率</text>
  <rect x="50" y="560" width="130" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="582.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">负染</text>
  <rect x="180" y="560" width="290" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="582.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">重金属盐环绕干燥成壳</text>
  <rect x="470" y="560" width="200" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="570" y="582.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">约 15–20 Å，分钟级筛查</text>
  <rect x="50" y="594" width="620" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="594" width="130" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="616.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">树脂包埋切片</text>
  <rect x="180" y="594" width="290" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="616.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">戊二醛/锇酸固定、脱水、超薄切片</text>
  <rect x="470" y="594" width="200" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="570" y="616.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">约 2–10 nm，形态学金标准</text>
  <rect x="50" y="628" width="130" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="650.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">玻璃化冷冻</text>
  <rect x="180" y="628" width="290" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="650.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">液态乙烷 plunge-freezing</text>
  <rect x="470" y="628" width="200" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="570" y="650.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">1.2–4 Å（颗粒），近天然态</text>
  <rect x="129.93" y="674.225" width="160.14000000000001" height="19.55" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="210" y="688.14" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="700">材料传统：强束流原子分辨</text>
  <rect x="384.508712" y="674.225" width="230.982576" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="500" y="688.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">生物传统：低剂量 数十 e<tspan dy="-3.9" font-size="8.3">-</tspan><tspan dy="3.9">/Å</tspan><tspan dy="-3.9" font-size="8.3">2</tspan><tspan dy="3.9"> + 平均重构</tspan></text>
  <rect x="710" y="456" width="660" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="478.84" font-size="19" fill="#475569" font-weight="700">三、三维方法谱系：分辨率-通量-原位的三角权衡</text>
  <text x="730" y="510" font-size="11.5" fill="#475569">· 单颗粒分析（SPA）：</text>
  <text x="730" y="527" font-size="11.5" fill="#475569">相同颗粒的多视角投影靠平均与分类逼出高分辨，</text>
  <text x="730" y="544" font-size="11.5" fill="#475569">1.2–4 Å；要求可溶、均一</text>
  <text x="730" y="560" font-size="11.5" fill="#475569">· 电子断层扫描（ET）：</text>
  <text x="730" y="577" font-size="11.5" fill="#475569">单次倾转序列直接反投影，</text>
  <text x="730" y="594" font-size="11.5" fill="#475569">唯一适合不可重复结构，2–10 nm；</text>
  <text x="730" y="611" font-size="11.5" fill="#475569">厚度须低于约 300 nm</text>
  <text x="730" y="630" font-size="11.5" fill="#475569">· 电子晶体学（含 MicroED）：</text>
  <text x="730" y="647" font-size="11.5" fill="#475569">衍射相位外推获得原子参数，原子级；</text>
  <text x="730" y="664" font-size="11.5" fill="#475569">结晶是瓶颈</text>
  <polygon points="1190,505 1060,665 1320,665" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="1190" y="492" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">分辨率</text>
  <text x="1052" y="686" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">原位</text>
  <text x="1330" y="686" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">通量</text>
  <circle cx="1190" cy="545" r="5.5" fill="#dc2626"/>
  <text x="1200" y="549" font-size="11" fill="#991b1b" font-weight="700">SPA</text>
  <circle cx="1095" cy="625" r="5.5" fill="#0f766e"/>
  <text x="1088" y="612" font-size="11" fill="#134e4a" font-weight="700">ET</text>
  <circle cx="1272" cy="588" r="5.5" fill="#6d28d9"/>
  <text x="1240" y="574" font-size="11" fill="#4c1d95" font-weight="700">晶体学</text>
  <rect x="30" y="730" width="1340" height="248" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="752.84" font-size="19" fill="#475569" font-weight="700">四、选型路线图：样品形态、制样可能与目标精度的交点</text>
  <rect x="45" y="778" width="330" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="210" y="805.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">问题类型</text>
  <rect x="375" y="778" width="300" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="805.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">首选方法</text>
  <rect x="675" y="778" width="220" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="785" y="805.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">典型分辨率</text>
  <rect x="895" y="778" width="460" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="805.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">关键限制</text>
  <rect x="45" y="822" width="330" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="210" y="842.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">可溶蛋白/复合物原子结构</text>
  <rect x="375" y="822" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="842.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">单颗粒分析</text>
  <rect x="675" y="822" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="785" y="842.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">1.2–4 Å</text>
  <rect x="895" y="822" width="460" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="842.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">需大量均一颗粒，分子量偏小时信噪比不足</text>
  <rect x="45" y="852" width="1310" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="45" y="852" width="330" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="210" y="872.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">细胞器/细胞原位三维形态</text>
  <rect x="375" y="852" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="872.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">电子断层扫描</text>
  <rect x="675" y="852" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="785" y="872.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">2–10 nm</text>
  <rect x="895" y="852" width="460" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="872.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">厚度须低于约 300 nm，倾转致剂量累积</text>
  <rect x="45" y="882" width="330" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="210" y="902.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">病毒颗粒快速筛查</text>
  <rect x="375" y="882" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="902.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">负染 TEM</text>
  <rect x="675" y="882" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="785" y="902.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">15–20 Å</text>
  <rect x="895" y="882" width="460" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="902.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">染料掩盖表面细节</text>
  <rect x="45" y="912" width="1310" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="45" y="912" width="330" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="210" y="932.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">表面形貌与断口</text>
  <rect x="375" y="912" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="932.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">SEM</text>
  <rect x="675" y="912" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="785" y="932.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">约 1 nm（场发射）</text>
  <rect x="895" y="912" width="460" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="932.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">仅表面信息</text>
  <rect x="45" y="942" width="330" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
