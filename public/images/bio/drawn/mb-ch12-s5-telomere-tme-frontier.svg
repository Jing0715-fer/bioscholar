<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">端粒、肿瘤微环境与癌症治疗前沿</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">端粒缩短触发衰老与危机两道屏障——约 85%～90% 肿瘤重激活端粒酶（TERT 启动子突变）获永生化，其余走 ALT；Warburg 有氧糖酵解支撑合成代谢（FDG-PET 显像）；VEGF-HIF 轴血管生成与 PD-1 / CTLA-4 检查点抑制剂（2018 诺奖）；治疗范式从细胞毒向靶向、免疫与精准预防逐级演进</text>
  <rect x="30" y="132" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、端粒与复制永生化：跨越衰老与危机两道屏障</text>
  <rect x="60" y="210" width="270" height="84" rx="9" fill="#d1fae5" fill-opacity="0.6" stroke="#065f46" stroke-width="1.8"/>
  <text x="195" y="234" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">正常体细胞</text>
  <text x="195" y="256" font-size="9.5" fill="#475569" text-anchor="middle">缺乏端粒酶活性</text>
  <text x="195" y="276" font-size="9.5" fill="#64748b" text-anchor="middle">每次分裂端粒缩短</text>
  <rect x="400" y="210" width="270" height="84" rx="9" fill="#fef3c7" fill-opacity="0.6" stroke="#9a3412" stroke-width="1.8"/>
  <text x="535" y="234" font-size="12.5" fill="#9a3412" text-anchor="middle" font-weight="700">复制衰老（第一道屏障）</text>
  <text x="535" y="256" font-size="9.5" fill="#475569" text-anchor="middle">p53 / p16 介导</text>
  <text x="535" y="276" font-size="9.5" fill="#64748b" text-anchor="middle">Hayflick 极限</text>
  <rect x="740" y="210" width="270" height="84" rx="9" fill="#fee2e2" fill-opacity="0.6" stroke="#991b1b" stroke-width="1.8"/>
  <text x="875" y="234" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="700">危机 crisis（第二道屏障）</text>
  <text x="875" y="256" font-size="9.5" fill="#475569" text-anchor="middle">端粒融合-断裂-桥（BFB）</text>
  <text x="875" y="276" font-size="9.5" fill="#64748b" text-anchor="middle">多数细胞死亡</text>
  <rect x="1080" y="210" width="270" height="84" rx="9" fill="#ccfbf1" fill-opacity="0.6" stroke="#134e4a" stroke-width="1.8"/>
  <text x="1215" y="234" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">复制永生化</text>
  <text x="1215" y="256" font-size="9.5" fill="#475569" text-anchor="middle">约 85%～90% 重激活端粒酶</text>
  <text x="1215" y="276" font-size="9.5" fill="#64748b" text-anchor="middle">（TERT 启动子突变常见）</text>
  <line x1="334" y1="252" x2="396" y2="252" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="365" y="234" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="600">端粒逐次缩短</text>
  <line x1="674" y1="252" x2="736" y2="252" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="705" y="234" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="600">p53 / Rb 失活绕过</text>
  <line x1="1014" y1="252" x2="1076" y2="252" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <text x="1045" y="234" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="600">端粒酶重新激活</text>
  <text x="1045" y="312" font-size="9.5" fill="#64748b" text-anchor="middle">其余肿瘤经 ALT（重组机制）延长端粒</text>
  <text x="1215" y="296" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">Hallmark 之一</text>
  <text x="60" y="340" font-size="10.5" fill="#475569">端粒酶活性可经 TRAP 实验检测；端粒长度与 TERT 表达是预后与风险分层指标——靶向端粒酶的 imetelestat 已在骨髓增殖性疾病中显效。</text>
  <rect x="30" y="402" width="660" height="558" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="424.84" font-size="19" fill="#475569" font-weight="700">二、肿瘤微环境（TME）：一个「篡改的器官」</text>
  <ellipse cx="350" cy="610" rx="115" ry="80" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="2.2"/>
  <circle cx="322" cy="596" r="22" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <circle cx="382" cy="626" r="13" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="350" y="672" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">癌细胞（克隆群体）</text>
  <text x="350" y="566" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">缺氧 · HIF-1α↑</text>
  <text x="535" y="466" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="600">血管生成：缺氧 → HIF-1α → VEGF（Folkman 假说）</text>
  <rect x="430" y="478" width="210" height="26" rx="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="460" cy="491" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="500" cy="491" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="540" cy="491" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="580" cy="491" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <path d="M480,504 q-10,26 -4,46" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M560,504 q12,26 6,46" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="428" y1="560" x2="486" y2="508" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <text x="442" y="534" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">VEGF↑</text>
  <text x="472" y="574" font-size="9" fill="#475569">贝伐珠单抗（抗 VEGF）</text>
  <text x="472" y="587" font-size="9" fill="#475569">与多种 TKI 已用于临床</text>
  <ellipse cx="110" cy="540" rx="40" ry="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="110" y="536" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">CAF</text>
  <text x="110" y="552" font-size="8" fill="#075985" text-anchor="middle">癌症相关成纤维细胞</text>
  <line x1="152" y1="548" x2="232" y2="580" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="56" y="600" font-size="9" fill="#075985" font-weight="600">MMP 重塑胞外基质 → 促侵袭</text>
  <circle cx="560" cy="780" r="26" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="560" y="776" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">T 细胞</text>
  <rect x="582" y="762" width="24" height="15" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="594" y="773" font-size="7" fill="#065f46" text-anchor="middle" font-weight="700">PD-1</text>
  <rect x="448" y="740" width="26" height="15" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="461" y="751" font-size="7" fill="#991b1b" text-anchor="middle" font-weight="700">PD-L1</text>
  <line x1="578" y1="770" x2="478" y2="748" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="520" y1="754" x2="540" y2="774" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="540" y1="754" x2="520" y2="774" stroke="#dc2626" stroke-width="2.5"/>
  <text x="468" y="822" font-size="9.5" fill="#475569">免疫编辑与逃逸：</text>
  <text x="468" y="836" font-size="9.5" fill="#475569">PD-L1 表达 · 抗原丢失 · TGF-β 分泌</text>
  <rect x="56" y="780" width="214" height="60" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#d97706" stroke-width="1.6"/>
  <text x="163" y="802" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">慢性炎症</text>
  <text x="68" y="820" font-size="9" fill="#78350f">NF-κB / STAT3——胃炎→肠化→癌序列</text>
  <text x="56" y="900" font-size="10.5" fill="#475569" font-weight="600">肿瘤是「篡改的器官」：癌细胞 + 基质 + 免疫 + 血管构成的生态系统——微环境的每个组分皆可成为治疗靶点。</text>
  <rect x="710" y="402" width="660" height="272" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="424.84" font-size="19" fill="#475569" font-weight="700">三、Warburg 效应与免疫检查点抑制剂</text>
  <text x="905" y="440" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">Warburg 效应（有氧糖酵解）</text>
  <circle cx="756" cy="484" r="21" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="756" y="487.06" font-size="8.5" fill="#065f46" text-anchor="middle" font-weight="700">葡萄糖</text>
  <line x1="780" y1="484" x2="826" y2="484" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="830" y="456" width="150" height="56" rx="9" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.8"/>
  <text x="905" y="480" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">癌细胞</text>
  <text x="905" y="500" font-size="9.5" fill="#475569" text-anchor="middle">糖酵解为主</text>
  <line x1="982" y1="470" x2="1024" y2="470" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-warn)"/>
  <circle cx="1048" cy="470" r="19" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="1048" y="473.24" font-size="9" fill="#78350f" text-anchor="middle" font-weight="700">乳酸</text>
  <line x1="982" y1="498" x2="1024" y2="498" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-ok)"/>
  <text x="1064" y="502" font-size="9.5" fill="#065f46" text-anchor="middle" font-weight="600">少量 ATP（快速产能）</text>
  <circle cx="756" cy="545" r="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="756" y="548.24" font-size="9" fill="#075985" text-anchor="middle" font-weight="700">O₂</text>
  <text x="800" y="549" font-size="9" fill="#075985" text-anchor="middle">氧存在（有氧条件）</text>
  <text x="726" y="576" font-size="10.5" fill="#475569">即使在有氧条件下仍以糖酵解供能（葡萄糖→乳酸）——支撑快速增殖的合成前体需求；</text>
  <text x="726" y="591" font-size="10.5" fill="#475569">FDG-PET 正是利用葡萄糖类似物的摄取显像肿瘤。</text>
  <text x="726" y="628" font-size="11.5" fill="#1e293b" font-weight="700">免疫检查点抑制剂：解除免疫刹车</text>
  <text x="726" y="648" font-size="10.5" fill="#475569">抗 PD-1（纳武利尤单抗 / 帕博利珠单抗）与抗 CTLA-4（伊匹木单抗）解除刹车，</text>
  <text x="726" y="663" font-size="10.5" fill="#475569">实现晚期肿瘤长期缓解——2018 年诺贝尔生理学或医学奖。</text>
  <rect x="710" y="694" width="660" height="266" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="716.84" font-size="19" fill="#475569" font-weight="700">四、治疗范式的演进：从细胞毒到精准预防</text>
  <rect x="740" y="853.5" width="139" height="42.5" rx="5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="754" y="877.5" font-size="13" fill="#1e293b">细胞毒</text>
  <rect x="885" y="811" width="139" height="42.5" rx="5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="899" y="835" font-size="13" fill="#1e293b">靶向治疗</text>
  <rect x="1030" y="768.5" width="139" height="42.5" rx="5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1044" y="792.5" font-size="13" fill="#1e293b">免疫治疗</text>
  <rect x="1175" y="726" width="139" height="42.5" rx="5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1189" y="750" font-size="13" fill="#1e293b">精准预防</text>
  <text x="742" y="910" font-size="9.5" fill="#475569">烷化剂 · 抗代谢物</text>
  <text x="742" y="923.5" font-size="9.5" fill="#475569">（非特异杀伤增殖细胞）</text>
  <text x="887" y="910" font-size="9.5" fill="#475569">伊马替尼 · 赫赛汀 · 奥拉帕尼</text>
  <text x="887" y="923.5" font-size="9.5" fill="#475569">（抑制驱动基因）</text>
  <text x="1032" y="910" font-size="9.5" fill="#475569">PD-1 / CTLA-4 抑制剂 · CAR-T</text>
  <text x="1032" y="923.5" font-size="9.5" fill="#475569">（解除免疫刹车）</text>
  <text x="1177" y="910" font-size="9.5" fill="#475569">BRCA 携带者预防性手术 · HPV 疫苗</text>
  <text x="1177" y="923.5" font-size="9.5" fill="#475569">（遗传风险干预）</text>
  <text x="1030" y="952" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="600">分子生物学把「不治之症」转化为一系列可管理的慢性分子疾病</text>
</svg>