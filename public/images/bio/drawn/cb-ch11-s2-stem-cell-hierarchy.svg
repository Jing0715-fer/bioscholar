<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">细胞全能性与干细胞：潜能分级、建系与干细胞巢</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">全能→多能（ICM/ESC）→多潜能（HSC）→单能；ESC 1981/1998 建系，Oct4/Nanog/Sox2 标志；成体干细胞 HSC/MSC/NSC/ISC；干细胞巢决定命运</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、发育潜能的分级：全能 → 多能 → 多潜能 → 单能</text>
  <rect x="80" y="174" width="190" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
  <text x="175" y="196" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">全能性</text>
  <text x="175" y="220" font-size="9" fill="#475569" text-anchor="middle">受精卵与卵裂早期卵裂球</text>
  <text x="300" y="188" font-size="10" fill="#475569">可发育为完整个体及胚外组织</text>
  <line x1="175" y1="238" x2="175" y2="254" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="80" y="258" width="190" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
  <text x="175" y="280" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">多能性</text>
  <text x="175" y="304" font-size="9" fill="#475569" text-anchor="middle">囊胚内细胞团（ICM）</text>
  <text x="300" y="272" font-size="10" fill="#475569">三胚层所有细胞类型，但不能形成胚外组织</text>
  <line x1="175" y1="322" x2="175" y2="338" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="80" y="342" width="190" height="62" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.2"/>
  <text x="175" y="364" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">多潜能性</text>
  <text x="175" y="388" font-size="9" fill="#475569" text-anchor="middle">造血干细胞等成体干细胞</text>
  <text x="300" y="356" font-size="10" fill="#475569">限于某一谱系内的分化能力</text>
  <line x1="175" y1="406" x2="175" y2="422" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="80" y="426" width="190" height="62" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.2"/>
  <text x="175" y="448" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">单能性</text>
  <text x="175" y="472" font-size="9" fill="#475569" text-anchor="middle">表皮基底层干细胞</text>
  <text x="300" y="440" font-size="10" fill="#475569">仅一种终末分化方向</text>
  <text x="330" y="556" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="700">体外对应：全能／多能标志 Oct4·Nanog·Sox2</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、胚胎干细胞建系与五类成体干细胞</text>
  <text x="740" y="186" font-size="11.5" fill="#1e293b" font-weight="700">胚胎干细胞（ESC）</text>
  <text x="740" y="208" font-size="9.5" fill="#475569">1981 年 Evans 与 Kaufman 从小鼠囊胚 ICM 建系；1998 年 Thomson 建立人 ESC 系。特征：无限自我更新、正常核型、</text>
  <text x="740" y="221.5" font-size="9.5" fill="#475569">表达 Oct4／Nanog／Sox2、注射入囊胚产生嵌合体、体外形成含三胚层的畸胎瘤；与胚状体（EB）定向分化是细胞替代治疗的核心体系。</text>
  <rect x="740" y="300" width="290" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="752" y="320" font-size="10" fill="#1e293b" font-weight="700">造血干细胞 HSC</text>
  <text x="752" y="338" font-size="9" fill="#134e4a" font-weight="700">CD34⁺·骨髓移植</text>
  <text x="752" y="348" font-size="8" fill="#64748b">Till 与 McCulloch（1961）脾结节（CFU-S）实验首次证明</text>
  <rect x="1050" y="300" width="290" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1062" y="320" font-size="10" fill="#1e293b" font-weight="700">间充质干细胞 MSC</text>
  <text x="1062" y="338" font-size="9" fill="#134e4a" font-weight="700">骨髓基质来源</text>
  <text x="1062" y="348" font-size="8" fill="#64748b">分化为骨、软骨、脂肪与基质</text>
  <rect x="740" y="374" width="290" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="752" y="394" font-size="10" fill="#1e293b" font-weight="700">神经干细胞 NSC</text>
  <text x="752" y="412" font-size="9" fill="#134e4a" font-weight="700">SVZ 与海马 SGZ</text>
  <text x="752" y="422" font-size="8" fill="#64748b">B1 细胞放射状胶质延续产生神经元与胶质；神经球培养</text>
  <rect x="1050" y="374" width="290" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1062" y="394" font-size="10" fill="#1e293b" font-weight="700">肠道隐窝干细胞 ISC</text>
  <text x="1062" y="412" font-size="9" fill="#134e4a" font-weight="700">Lgr5⁺ 隐窝基底柱状</text>
  <text x="1062" y="422" font-size="8" fill="#64748b">Clevers 类器官培养</text>
  <rect x="740" y="448" width="290" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="752" y="468" font-size="10" fill="#1e293b" font-weight="700">角膜缘 / 毛囊隆突</text>
  <text x="752" y="486" font-size="9" fill="#134e4a" font-weight="700">Leu⁺ 等</text>
  <text x="752" y="496" font-size="8" fill="#64748b">组织局部修复</text>
  <rect x="30" y="576" width="1340" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、干细胞巢（niche）：微环境信号决定静息或分裂（Schofield，1978）</text>
  <rect x="70" y="626" width="560" height="240" rx="10" fill="#f1f5f9" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="650" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">骨髓 HSC 巢</text>
  <circle cx="200" cy="730" r="20" fill="#d1fae5" stroke="#059669" stroke-width="2.4"/>
  <text x="200" y="734" font-size="9.5" fill="#059669" text-anchor="middle" font-weight="700">HSC</text>
  <text x="200" y="762" font-size="9" fill="#64748b" text-anchor="middle">静息（G0）</text>
  <rect x="286.25" y="682.775" width="67.5" height="14.45" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="320" y="693.06" font-size="8.5" fill="#4c1d95" text-anchor="middle">骨内膜成骨细胞</text>
  <line x1="410" y1="690" x2="222" y2="722" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <rect x="423.47" y="682.775" width="113.05999999999999" height="14.45" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="480" y="693.06" font-size="8.5" fill="#4c1d95" text-anchor="middle">CAR 基质细胞（分泌 SCF）</text>
  <line x1="390" y1="690" x2="240" y2="722" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <rect x="299" y="762.775" width="42" height="14.45" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="320" y="773.06" font-size="8.5" fill="#4c1d95" text-anchor="middle">交感神经</text>
  <line x1="410" y1="770" x2="222" y2="740" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <rect x="459" y="762.775" width="42" height="14.45" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="480" y="773.06" font-size="8.5" fill="#4c1d95" text-anchor="middle">巨核细胞</text>
  <line x1="390" y1="770" x2="240" y2="740" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <text x="70" y="856" font-size="9.5" fill="#475569">维持信号：SCF/c-Kit、CXCL12/CXCR4（归巢）、Notch、Wnt 与 TGF-β；衰老与疾病状态下干细胞功能衰退（骨髓脂肪化、</text>
  <text x="70" y="869.5" font-size="9.5" fill="#475569">神经发生减少）是组织衰老的核心环节。</text>
  <text x="700" y="626" font-size="11.5" fill="#1e293b" font-weight="700">不对称分裂与群体不对称</text>
  <circle cx="780" cy="700" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2.2"/>
  <text x="780" y="704" font-size="8.5" fill="#059669" text-anchor="middle" font-weight="700">干细胞</text>
  <line x1="806" y1="690" x2="880" y2="660" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <line x1="806" y1="712" x2="880" y2="744" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <circle cx="905" cy="650" r="20" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="905" y="654" font-size="8" fill="#059669" text-anchor="middle" font-weight="700">干细胞</text>
  <circle cx="905" cy="754" r="20" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="905" y="758" font-size="8" fill="#075985" text-anchor="middle" font-weight="700">定向祖</text>
  <rect x="762.25" y="784.35" width="75.5" height="15.299999999999999" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="800" y="795.24" font-size="9" fill="#78350f" text-anchor="middle">Numb 不对称分配</text>
  <text x="790" y="822" font-size="9.5" fill="#475569" text-anchor="middle">「一个干细胞、一个分化细胞」的稳态输出</text>
  <text x="1040" y="640" font-size="10" fill="#475569">群体不对称：按巢信号在干细胞与定向祖细胞间取得平衡，</text>
  <text x="1040" y="654" font-size="10" fill="#475569">与不对称分裂共同维持组织稳态——干细胞的行为由其所处的微环境决定。</text>
  <text x="1040" y="730" font-size="9.5" fill="#64748b">HSC（CD34⁺）在骨髓中重建整个血液系统，是干细胞移植</text>
  <text x="1040" y="743" font-size="9.5" fill="#64748b">（骨髓移植）的基础。</text>
</svg>