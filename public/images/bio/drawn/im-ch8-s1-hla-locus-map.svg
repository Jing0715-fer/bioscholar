<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">HLA 复合体的基因结构与遗传特征：6p21.3 的分区与三重多样性</text>
  
  <text x="700" y="77" font-size="12" fill="#64748b" text-anchor="middle">HLA 复合体位于第 6 号染色体短臂 6p21.3、跨越约 3600 kb、座位超 200 个；I 类区（HLA-A/B/C 经典，E/F/G 非经典）、II 类区（DR/DQ/DP 经典 + TAP/PSMB/DM-DO 配套）与 III 类区（C2、C4、Bf、TNF）；</text>
  <text x="700" y="94" font-size="12" fill="#64748b" text-anchor="middle">多样性来自多基因性与多态性（HLA-B 已逾八千等位基因，多态残基集中于肽结合槽编码区）两层，共显性表达使单个细胞陈列至多 6 种 I 类与 10 种上下 II 类分子；</text>
  <text x="700" y="111" font-size="12" fill="#64748b" text-anchor="middle">紧密连锁的单元型整体传递、连锁不平衡与公共表位交叉反应是移植配型的遗传学基础</text>
  <rect x="30" y="132" width="1340" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、HLA 复合体基因图：第 6 号染色体短臂 6p21.3 的「免疫基因特区」</text>
  <text x="700" y="178" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">跨越约 3600 kb · 已确认基因座位超过 200 个——人体基因密度最高、多态性最强的区段之一</text>
  <rect x="60" y="192" width="80" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="100" y="223" font-size="10.5" fill="#64748b" text-anchor="middle">端粒侧</text>
  <rect x="140" y="192" width="400" height="54" rx="6" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="1.8"/>
  <text x="340" y="216" font-size="15" fill="#134e4a" text-anchor="middle" font-weight="700">I 类区</text>
  <text x="340" y="236" font-size="9.5" fill="#475569" text-anchor="middle">经典 + 非经典</text>
  <rect x="540" y="192" width="220" height="54" rx="6" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.8"/>
  <text x="650" y="216" font-size="15" fill="#78350f" text-anchor="middle" font-weight="700">III 类区</text>
  <text x="650" y="236" font-size="9.5" fill="#475569" text-anchor="middle">居中而设</text>
  <rect x="760" y="192" width="420" height="54" rx="6" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="970" y="216" font-size="15" fill="#4c1d95" text-anchor="middle" font-weight="700">II 类区</text>
  <text x="970" y="236" font-size="9.5" fill="#475569" text-anchor="middle">经典 + 配套</text>
  <rect x="1180" y="192" width="120" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1240" y="223" font-size="10.5" fill="#64748b" text-anchor="middle">着丝粒侧</text>
  <rect x="140" y="262" width="195" height="132" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="152" y="286" font-size="11.5" fill="#0f766e" font-weight="700">I 类区（经典）</text>
  <text x="152" y="306" font-size="10" fill="#1e293b" font-weight="700">HLA-A · -B · -C</text>
  <text x="152" y="330" font-size="9.5" fill="#475569">提呈内源性抗原给 CD8⁺ T</text>
  <text x="152" y="372" font-size="9.5" fill="#64748b" font-weight="600">多态水平：极高</text>
  <rect x="345" y="262" width="195" height="132" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="357" y="286" font-size="11.5" fill="#0f766e" font-weight="700">I 类区（非经典）</text>
  <text x="357" y="306" font-size="10" fill="#1e293b" font-weight="700">HLA-E · -F · -G</text>
  <text x="357" y="330" font-size="9.5" fill="#475569">调控 NK 活性、母胎耐受等</text>
  <text x="357" y="372" font-size="9.5" fill="#64748b" font-weight="600">多态水平：低</text>
  <rect x="540" y="262" width="220" height="132" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="552" y="286" font-size="11.5" fill="#b45309" font-weight="700">III 类区</text>
  <text x="552" y="306" font-size="10" fill="#1e293b" font-weight="700">C2、C4、Bf、TNF 等</text>
  <text x="552" y="330" font-size="9.5" fill="#475569">补体与炎症介质，不直接提呈抗原</text>
  <text x="552" y="372" font-size="9.5" fill="#64748b" font-weight="600">多态水平：中</text>
  <rect x="760" y="262" width="205" height="132" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="772" y="286" font-size="11.5" fill="#6d28d9" font-weight="700">II 类区（经典）</text>
  <text x="772" y="306" font-size="10" fill="#1e293b" font-weight="700">HLA-DR · -DQ · -DP</text>
  <text x="772" y="330" font-size="9.5" fill="#475569">提呈外源性抗原给 CD4⁺ T</text>
  <text x="772" y="372" font-size="9.5" fill="#64748b" font-weight="600">多态水平：高</text>
  <rect x="975" y="262" width="205" height="132" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="987" y="286" font-size="11.5" fill="#6d28d9" font-weight="700">II 类区（配套）</text>
  <text x="987" y="306" font-size="10" fill="#1e293b" font-weight="700">TAP1/2 · PSMB8/9 · HLA-DM/DO</text>
  <text x="987" y="330" font-size="9.5" fill="#475569">抗原加工、转运与肽加载</text>
  <text x="987" y="372" font-size="9.5" fill="#64748b" font-weight="600">多态水平：低至中</text>
  <text x="700" y="412" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">大量产物直接参与免疫应答——名副其实的「免疫基因特区」</text>
  <rect x="30" y="438" width="1340" height="258" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="460.84" font-size="19" fill="#475569" font-weight="700">二、多基因性 × 多态性 × 共显性表达：HLA 多样性的三重来源</text>
  <rect x="60" y="490" width="390" height="148" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.6"/>
  <text x="78" y="514" font-size="13" fill="#075985" font-weight="700">多基因性（个体内）</text>
  <text x="78" y="538" font-size="10.5" fill="#475569">一个个体内 I、II 类多个座位并存（A/B/C 与 DR/DQ/DP……），</text>
  <text x="78" y="554" font-size="10.5" fill="#475569">拓宽单个细胞的提呈覆盖面。</text>
  <rect x="82" y="596" width="50" height="28" rx="5" fill="#ffffff" stroke="#0369a1" stroke-width="1.3"/>
  <text x="107" y="614" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">A</text>
  <rect x="142" y="596" width="50" height="28" rx="5" fill="#ffffff" stroke="#0369a1" stroke-width="1.3"/>
  <text x="167" y="614" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">B</text>
  <rect x="202" y="596" width="50" height="28" rx="5" fill="#ffffff" stroke="#0369a1" stroke-width="1.3"/>
  <text x="227" y="614" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">C</text>
  <rect x="262" y="596" width="50" height="28" rx="5" fill="#ffffff" stroke="#0369a1" stroke-width="1.3"/>
  <text x="287" y="614" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">DR</text>
  <rect x="322" y="596" width="50" height="28" rx="5" fill="#ffffff" stroke="#0369a1" stroke-width="1.3"/>
  <text x="347" y="614" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">DQ</text>
  <rect x="382" y="596" width="50" height="28" rx="5" fill="#ffffff" stroke="#0369a1" stroke-width="1.3"/>
  <text x="407" y="614" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">DP</text>
  <rect x="470" y="490" width="390" height="148" rx="9" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="1.6"/>
  <text x="488" y="514" font-size="13" fill="#134e4a" font-weight="700">多态性（群体内）</text>
  <text x="488" y="538" font-size="10.5" fill="#475569">群体内每个座位等位基因众多；</text>
  <text x="488" y="554" font-size="10.5" fill="#475569">多态残基集中于肽结合槽编码区——HLA-B 已逾八千个等位基因。</text>
  <rect x="500.816" y="567.64" width="45.568000000000005" height="22.36" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="523.6" y="610" font-size="12.5" fill="#64748b" text-anchor="middle">A</text>
  <rect x="572.0160000000001" y="578.04" width="45.568000000000005" height="11.96" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="594.8000000000001" y="610" font-size="12.5" fill="#64748b" text-anchor="middle">B</text>
  <rect x="643.216" y="574.4" width="45.568000000000005" height="15.6" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="666" y="610" font-size="12.5" fill="#64748b" text-anchor="middle">C</text>
  <rect x="714.416" y="583.76" width="45.568000000000005" height="6.24" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="737.2" y="610" font-size="12.5" fill="#64748b" text-anchor="middle">DRB1</text>
  <rect x="785.616" y="582.2" width="45.568000000000005" height="7.8" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="808.4" y="610" font-size="12.5" fill="#64748b" text-anchor="middle">DQB1</text>
  <text x="666" y="630" font-size="9.5" fill="#64748b" text-anchor="middle">各座位等位基因数（示意，B 居首、已逾 8000）</text>
  <rect x="880" y="490" width="460" height="148" rx="9" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="898" y="514" font-size="13" fill="#4c1d95" font-weight="700">共显性表达（细胞面）</text>
  <text x="898" y="538" font-size="10.5" fill="#475569">来自父母双方的等位基因同时开动：</text>
  <text x="898" y="554" font-size="10.5" fill="#475569">一个有核细胞可同时陈列至多 6 种 I 类分子与 10 种上下的 II 类分子。</text>
  <rect x="910" y="580" width="190" height="44" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="1005" y="600" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">I 类分子 ≤ 6 种</text>
  <text x="1005" y="616" font-size="9" fill="#64748b" text-anchor="middle">A · B · C 各两份</text>
  <rect x="1120" y="580" width="190" height="44" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="1215" y="600" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">II 类分子 ~10 种</text>
  <text x="1215" y="616" font-size="9" fill="#64748b" text-anchor="middle">DR · DQ · DP 各两份</text>
  <text x="700" y="668" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">多基因性拓宽个体覆盖面，多态性加深群体储备库——HLA 是个体的免疫身份签名</text>
  <rect x="30" y="712" width="1340" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="734.84" font-size="19" fill="#475569" font-weight="700">三、单元型遗传 · 连锁不平衡 · 公共表位：移植配型的遗传学基础</text>
  <rect x="90" y="766" width="190" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="104" y="792" font-size="11.5" fill="#1e293b" font-weight="700">父：单元型 a ｜ b</text>
  <rect x="90" y="838" width="190" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="104" y="864" font-size="11.5" fill="#1e293b" font-weight="700">母：单元型 c ｜ d</text>
  <line x1="284" y1="786" x2="340" y2="816" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <line x1="284" y1="858" x2="340" y2="828" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="344" y="788" width="276" height="68" rx="8" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.6"/>
  <text x="482" y="812" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">子代必得父一条 + 母一条</text>
  <text x="482" y="836" font-size="11" fill="#475569" text-anchor="middle">组合：ac · ad · bc · bd</text>
  <text x="90" y="902" font-size="10.5" fill="#475569">紧密连锁使亲代以单元型（haplotype）整体传递 HLA，如同「成套家具」罕见拆散。</text>
  <text x="90" y="938" font-size="10" fill="#64748b">单元型与等位基因组合信息共同用于器官移植的供受配型评估。</text>
  <rect x="660" y="766" width="680" height="88" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.6"/>
  <text x="678" y="790" font-size="12.5" fill="#134e4a" font-weight="700">连锁不平衡（linkage disequilibrium）</text>
  <text x="678" y="812" font-size="10.5" fill="#475569">特定等位基因的组合频率偏离随机期望——疾病关联分析与移植配型的遗传学基础。</text>
  <rect x="660" y="866" width="680" height="92" rx="9" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.6"/>
  <text x="678" y="890" font-size="12.5" fill="#92400e" font-weight="700">公共表位与交叉反应</text>
  <text x="678" y="912" font-size="10.5" fill="#475569">不同等位基因可共享公共表位：致敏受者的抗公共表位抗体，可对同组等位基因的供器官发生交叉阳性反应。</text>
</svg>