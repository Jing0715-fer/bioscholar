  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">Coot 与真实空间建模：从图里长出模型</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">Coot（Emsley与Cowtan2004）双图加载：主图1σ判读、差值图±3σ；五件套Mutate／Rotamer／RSR／PeptideFlip／Chiral；round-trip三五个循环收敛、</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">判据三轮无新发现；配体字典GRADE／eLBOW</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Coot 驾驶舱：双图加载与渲染纪律</text>
  <rect x="56" y="186" width="360" height="300" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="236" y="176" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">密度图与模型同屏（编辑即时反映）</text>
  <ellipse cx="150" cy="280" rx="70" ry="24" fill="none" stroke="#0f766e" stroke-width="2" opacity="0.9" transform="rotate(-12 150 280)"/>
  <ellipse cx="150" cy="280" rx="50.4" ry="17.28" fill="none" stroke="#0f766e" stroke-width="1.4" opacity="0.55" transform="rotate(-12 150 280)"/>
  <ellipse cx="250" cy="330" rx="78" ry="25" fill="none" stroke="#0f766e" stroke-width="2" opacity="0.9" transform="rotate(-8 250 330)"/>
  <ellipse cx="250" cy="330" rx="56.16" ry="18" fill="none" stroke="#0f766e" stroke-width="1.4" opacity="0.55" transform="rotate(-8 250 330)"/>
  <ellipse cx="320" cy="252" rx="40" ry="20" fill="none" stroke="#0f766e" stroke-width="2" opacity="0.9" transform="rotate(18 320 252)"/>
  <ellipse cx="320" cy="252" rx="28.799999999999997" ry="14.399999999999999" fill="none" stroke="#0f766e" stroke-width="1.4" opacity="0.55" transform="rotate(18 320 252)"/>
  <polyline points="92,258 128,274 164,288 200,300 236,312 272,328 308,336 344,318" fill="none" stroke="#1e293b" stroke-width="2.6"/>
  <circle cx="92" cy="258" r="5.5" fill="#059669" stroke="#1e293b" stroke-width="1"/>
  <circle cx="128" cy="274" r="5.5" fill="#059669" stroke="#1e293b" stroke-width="1"/>
  <circle cx="164" cy="288" r="5.5" fill="#059669" stroke="#1e293b" stroke-width="1"/>
  <line x1="164" y1="288" x2="174" y2="266" stroke="#475569" stroke-width="1.8"/>
  <circle cx="200" cy="300" r="5.5" fill="#059669" stroke="#1e293b" stroke-width="1"/>
  <line x1="200" y1="300" x2="210" y2="278" stroke="#475569" stroke-width="1.8"/>
  <circle cx="236" cy="312" r="5.5" fill="#dc2626" stroke="#1e293b" stroke-width="1"/>
  <line x1="236" y1="312" x2="246" y2="290" stroke="#475569" stroke-width="1.8"/>
  <circle cx="272" cy="328" r="5.5" fill="#d97706" stroke="#1e293b" stroke-width="1"/>
  <line x1="272" y1="328" x2="282" y2="306" stroke="#475569" stroke-width="1.8"/>
  <circle cx="308" cy="336" r="5.5" fill="#d97706" stroke="#1e293b" stroke-width="1"/>
  <line x1="308" y1="336" x2="318" y2="314" stroke="#475569" stroke-width="1.8"/>
  <circle cx="344" cy="318" r="5.5" fill="#059669" stroke="#1e293b" stroke-width="1"/>
  <circle cx="200" cy="278" r="12" fill="#fce7f3" stroke="#be185d" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="214" y="268" font-size="9" fill="#831843" text-anchor="middle" font-weight="700">+3σ 差值峰</text>
  <text x="236" y="486" font-size="9.5" fill="#64748b" text-anchor="middle">主链走线＋验证双色球（红黄绿）＋差值斑</text>
  <rect x="508.28" y="197.8" width="67.44" height="20.4" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="542" y="212.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">双图加载</text>
  <text x="440" y="234" font-size="10.5" fill="#475569">2mFo−DFc 主图画约 1σ（有什么）</text>
  <text x="440" y="249" font-size="10.5" fill="#475569">＋mFo−DFc 差值图画 ±3σ（差在哪）——Coot</text>
  <text x="440" y="264" font-size="10.5" fill="#475569">（Emsley 与 Cowtan，2004 年）的标准开场；</text>
  <text x="440" y="279" font-size="10.5" fill="#475569">模型带着 Ramachandran 与 rotamer 着色进场，</text>
  <text x="440" y="294" font-size="10.5" fill="#475569">「哪里有问题」动手前一目了然。</text>
  <text x="440" y="320" font-size="10.5" fill="#475569">map radius 显示半径日常取 8–15 Å：</text>
  <text x="440" y="335" font-size="10.5" fill="#475569">过小则上下文断裂、走向误判，过大则图淹模型。</text>
  <text x="440" y="372" font-size="10.5" fill="#64748b">sigma 滑条是诚实度旋钮：</text>
  <text x="440" y="387" font-size="10.5" fill="#64748b">降到 0.8σ 密度胖一圈是图在讨好你；</text>
  <text x="440" y="402" font-size="10.5" fill="#64748b">升到 1.3σ 仍贴得住才是真贴合。纪律：</text>
  <text x="440" y="417" font-size="10.5" fill="#64748b">判读一律在标准 1σ 下进行，</text>
  <text x="440" y="432" font-size="10.5" fill="#64748b">±0.3σ 的变幅只用于检验；</text>
  <text x="440" y="447" font-size="10.5" fill="#64748b">差值图以 2σ 级小斑立原子永远是越权裁判。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、核心操作五件套与各自指纹</text>
  <rect x="730" y="186" width="300" height="52" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="746" y="207" font-size="11" fill="#1e293b" font-weight="700">Mutate Residue</text>
  <text x="746" y="224" font-size="9.5" fill="#475569">残基换成序列正确类型（register 校正基本步）</text>
  <rect x="730" y="244" width="300" height="52" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="746" y="265" font-size="11" fill="#1e293b" font-weight="700">Fit Rotamer to Density</text>
  <text x="746" y="282" font-size="9.5" fill="#475569">从 Lovell 完备库挑密度最优侧链构象，一键完成</text>
  <rect x="730" y="302" width="300" height="52" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="746" y="323" font-size="11" fill="#1e293b" font-weight="700">Real Space Refine Zone</text>
  <text x="746" y="340" font-size="9.5" fill="#475569">密度梯度为势场、几何约束为弹簧；区段三到八个残基为佳</text>
  <rect x="730" y="360" width="300" height="52" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="746" y="381" font-size="11" fill="#1e293b" font-weight="700">Peptide Flip</text>
  <text x="746" y="398" font-size="9.5" fill="#475569">指纹：ψ 孤悬禁区而主链密度完好——翻转 180° 即愈</text>
  <rect x="730" y="418" width="300" height="52" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="746" y="439" font-size="11" fill="#1e293b" font-weight="700">Chiral 翻转</text>
  <text x="746" y="456" font-size="9.5" fill="#475569">指纹：侧链差半个身位、CB 呈镜像；Ile 与 Thr 最常中招</text>
  <rect x="1070" y="200" width="270" height="220" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="1205" y="190" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">peptide flip 的 Ramachandran 指纹</text>
  <ellipse cx="1145.6" cy="283.6" rx="42" ry="34" fill="#d1fae5" fill-opacity="0.8" stroke="#059669" stroke-width="1.4"/>
  <ellipse cx="1248.2" cy="354" rx="36" ry="30" fill="#d1fae5" fill-opacity="0.8" stroke="#059669" stroke-width="1.4"/>
  <text x="1145.6" y="283.6" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">β</text>
  <text x="1248.2" y="354" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">α<tspan dy="2.4" font-size="7.9">R</tspan></text>
  <circle cx="1210.4" cy="248.4" r="6" fill="#dc2626"/>
  <text x="1222.4" y="252.4" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700">ψ 禁区</text>
  <line x1="1210.4" y1="257.2" x2="1248.2" y2="336.4" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-bad)"/>
  <text x="1280.6" y="305.6" font-size="9.5" fill="#065f46" text-anchor="middle" font-weight="700">翻转后</text>
  <text x="1205" y="440" font-size="9.5" fill="#64748b" text-anchor="middle">φ（横）与 ψ（纵）：酰胺平面装反的典型落点</text>
  <text x="730" y="490" font-size="10" fill="#64748b">五件套之外：沿骨架自动伸链、片段拆分与合并、以及 Undo——建模是试错的事业，撤销键与保存键同等重要（每轮局部修正即另存版本）。</text>
  <rect x="30" y="572" width="660" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、round-trip：建模-精修循环（典型三五个循环收敛）</text>
  <rect x="70" y="620" width="280" height="64" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="210" y="644" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">Coot 手工建模</text>
  <text x="210" y="664" font-size="9.5" fill="#475569" text-anchor="middle">清验证球、修 register、局部整形、配体与水</text>
  <rect x="350" y="620" width="270" height="64" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="485" y="644" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">导出 PDB／mmCIF</text>
  <text x="485" y="664" font-size="9.5" fill="#475569" text-anchor="middle">交给精修器，模型与图版本同步另存</text>
  <rect x="350" y="720" width="270" height="64" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="485" y="744" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">phenix.refine／REFMAC</text>
  <text x="485" y="764" font-size="9.5" fill="#475569" text-anchor="middle">坐标与 B 因子精修、自动水（第 10 章）</text>
  <rect x="70" y="720" width="280" height="64" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="210" y="744" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">新模型配新图回 Coot</text>
  <text x="210" y="764" font-size="9.5" fill="#475569" text-anchor="middle">正反馈：图越来越好、模型越来越顺</text>
  <line x1="330" y1="646" x2="360" y2="646" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="485" y1="684" x2="485" y2="716" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="346" y1="752" x2="336" y2="752" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <path d="M 70,752 L 56,752 L 56,652 L 66,652" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <text x="213" y="700" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">循环</text>
  <text x="60" y="806" font-size="10.5" fill="#475569">每轮节奏：先看 R 与 R<tspan dy="2.3" font-size="7.6">free</tspan><tspan dy="-2.3"> 走势（正常为双双缓降、差值稳定），再巡一遍差值图有无新的未解释斑块，然后才动手清验证球；</tspan></text>
  <text x="60" y="821" font-size="10.5" fill="#475569">动手次序先大后小——整段重搭、register 平移这类结构性修正优先，侧链微调殿后。</text>
  <text x="60" y="870" font-size="10.5" fill="#64748b">收敛判据「三轮无新发现」：验证球清不出新货、差值图无新斑、R<tspan dy="2.3" font-size="7.6">free</tspan><tspan dy="-2.3"> 停在平台，建模者的交付才算完成。</tspan></text>
  <rect x="710" y="572" width="660" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、典型会话清单与配体字典纪律</text>
  <rect x="730" y="622" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="649.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">步骤</text>
  <rect x="900" y="622" width="240" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="649.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">工具或操作</text>
  <rect x="1140" y="622" width="210" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="649.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">检查点</text>
  <rect x="730" y="666" width="170" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="685" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">读入新图与模型</text>
  <rect x="900" y="666" width="240" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="685" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">双图加载、验证着色</text>
  <rect x="1140" y="666" width="210" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="685" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">差值峰分布</text>
  <rect x="730" y="693" width="620" height="27" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="693" width="170" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="712" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">清验证图标</text>
  <rect x="900" y="693" width="240" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="712" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">双色球逐个跳转</text>
  <rect x="1140" y="693" width="210" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="712" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">红球清零</text>
  <rect x="730" y="720" width="170" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="739" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">修 register 与侧链</text>
  <rect x="900" y="720" width="240" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="739" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">Mutate、Fit rotamer</text>
  <rect x="1140" y="720" width="210" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="739" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">大侧链锚定</text>
  <rect x="730" y="747" width="620" height="27" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="747" width="170" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="766" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">局部整形</text>
  <rect x="900" y="747" width="240" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="766" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">Real Space Refine、peptide flip</text>
  <rect x="1140" y="747" width="210" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="766" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">图形贴合</text>
  <rect x="730" y="774" width="170" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="793" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">配体与水</text>
  <rect x="900" y="774" width="240" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="793" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">Find ligands、加水位</text>
  <rect x="1140" y="774" width="210" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="793" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">字典就位</text>
  <rect x="730" y="801" width="620" height="27" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="801" width="170" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="820" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">导出精修</text>
  <rect x="900" y="801" width="240" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="820" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">phenix.refine 或 REFMAC</text>
  <rect x="1140" y="801" width="210" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="820" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">R 与 R<tspan dy="2.2" font-size="7.2">free</tspan><tspan dy="-2.2"> 走势</tspan></text>
  <text x="730" y="838" font-size="10.5" fill="#475569">骨架化与蝙蝠：骨架化把图约化为棒状骨架网络（bones）帮助眼睛连出走向；蝙蝠工具以短棒（对应两三个残基的肽段）</text>
  <text x="730" y="853" font-size="10.5" fill="#475569">沿骨架跳出主链路径——先骨架走向、再序列嫁接、后侧链收拾，顺序颠倒会把精力耗在注定重来的细节上。</text>
  <text x="730" y="902" font-size="10.5" fill="#64748b">配体拟合：Find Ligands 在差值图里搜索孤立的 +3σ 峰簇并给出候选构象；配体字典（restraints：键长、键角、平面、手性参数）</text>
  <text x="730" y="917" font-size="10.5" fill="#64748b">须先就位——GRADE 与 eLBOW 由 SMILES 自动生成，单体库已有的直接调用；库缺又无字典的配体绝不能「裸建」。</text>
