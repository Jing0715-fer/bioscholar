  <text x="730" y="368" font-size="9.5" fill="#475569">HH 模型的 m³h、n⁴ 门控即隐式马尔可夫模型；速率图可由单通道记录以最大似然法直接估计——突变 / 药物即改写个别 k_ij</text>
