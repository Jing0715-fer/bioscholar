  <text x="716" y="638" font-size="13" fill="#1e293b" font-weight="700">通道噪声：从涨落到功能</text>
  <circle cx="734" cy="668" r="4" fill="#be185d"/>
  <text x="746" y="672" font-size="10.5" fill="#475569" font-weight="600">离子通道随机开合产生的膜噪声，设定神经元阈下信号检测的极限</text>
  <circle cx="734" cy="700" r="4" fill="#be185d"/>
  <text x="746" y="704" font-size="10.5" fill="#475569" font-weight="600">内耳毛细胞「听」到热噪声——布朗运动放大到可闻阈的物理背景</text>
  <circle cx="734" cy="732" r="4" fill="#be185d"/>
  <text x="746" y="736" font-size="10.5" fill="#475569" font-weight="600">随机共振：适度噪声反而提高弱信号检出率</text>
  <text x="716" y="790" font-size="10.5" fill="#64748b">通道噪声并非「缺陷」而是功能资源：用速率常数写成的马尔可夫图，</text>
  <text x="716" y="805" font-size="10.5" fill="#64748b">正是神经元膜上亿万个随机门共同演奏的总谱——单分子统计物理与神经科学的接口正在此处。</text>
</svg>