  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">单通道行为与马尔可夫模型：随机构象跃迁子</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">I=N·P_o·g·(V−E_rev)连接单分子与全细胞；驻留时间指数分布↔马尔可夫状态图（HH的m³h、n⁴即隐式马尔可夫）；P_o–电压S形曲线（P_o可0→&gt;0.9）；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">膜噪声设定检测极限</text>
