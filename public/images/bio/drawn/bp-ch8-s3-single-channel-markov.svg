  <text x="70" y="540" font-size="9.5" fill="#64748b">宏观电流与单分子行为的桥梁：全细胞电流的任何变化都可分解为 N（通道数）、P_o 或 g 的变化——药理学、</text>
  <text x="70" y="553" font-size="9.5" fill="#64748b">遗传学与生物物理记在同一张账上。</text>
