  <text x="496" y="752" font-size="10.5" font-weight="700">河豚毒素 TTX：nM 级亲和封孔</text>
  <text x="496" y="772" font-size="9.5" fill="#475569">神经元 Nav（TTX 敏感）vs 心肌 Nav1.5（亲和力低数百–上千倍）→ 中毒时神经症状、心肌相对幸存；也是 HH 实验分离电流的关键工具。</text>
  <rect x="480" y="804" width="850" height="66" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="496" y="826" font-size="10.5" fill="#d97706" font-weight="700">局麻药（利多卡因等）：使用依赖性</text>
  <text x="496" y="846" font-size="9.5" fill="#475569">带电形式从胞内侧进入孔道，优先结合开放 / 失活态——高频发放的疼痛纤维先被阻断，构成治疗指数的物理基础。</text>
  <rect x="480" y="878" width="850" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
