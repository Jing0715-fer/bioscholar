  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">Piezo三叶螺旋桨三聚体（每亚基30余个跨膜螺旋，碟形→展平，2021诺贝尔奖）；TTX胍基⁺从胞外封Na⁺通道滤器口（nM级，神经型敏感高数百–上千倍）；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">局麻药从胞内结合开放/失活态（使用依赖性）；TEA/4-AP堵K_v内口</text>
