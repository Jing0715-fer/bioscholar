  <text x="820" y="955.6" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">统一图像：阻断剂以态依赖方式占据孔道或变构位点，把马尔可夫图向关闭 / 失活态偏置——既是治疗武器，也是动力学探针</text>
