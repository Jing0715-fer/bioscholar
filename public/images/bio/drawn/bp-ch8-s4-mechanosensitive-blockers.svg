  <text x="66" y="340" font-size="10" fill="#475569">通道跨膜区形状像「张力计」——被拉伸的膜直接撬开孔道，防止渗透冲击胀破；Piezo 亦属此机制。</text>
  <rect x="700" y="160" width="640" height="220" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
