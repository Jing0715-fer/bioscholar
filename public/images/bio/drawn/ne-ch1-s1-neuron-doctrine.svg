  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">神经元学说：从网与元之争到突触间隙的电镜裁决</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">1873高尔基染色显示单个神经元全貌；Golgi网状学说与Cajal神经元学说对峙三十余年，1906年同获诺奖而立场对立；1950s电镜揭示20–40nm突触间隙终裁；人脑约860</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">亿神经元（小脑690亿、皮层160亿），突触10¹⁴–10¹⁵量级</text>
