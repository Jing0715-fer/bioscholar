  <text x="210" y="854" font-size="10.5" fill="#475569">负端导向的例外（如 ncd）</text>
  <rect x="117.735" y="873.5" width="64.53" height="17" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="150" y="885.6" font-size="10" fill="#4c1d95" text-anchor="middle" font-weight="700">Kinesin-13</text>
  <text x="210" y="886" font-size="10.5" fill="#475569">不行走——催化微管两端解聚，调控纺锤体长度</text>
  <text x="60" y="925" font-size="10.5" fill="#64748b">病毒「搭便车」：狂犬病毒与腺病毒劫持 dynein 向核周运输；驱动蛋白为有丝分裂所必需，是抗肿瘤药物的靶点。</text>
