  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">微管马达蛋白：驱动蛋白与动力蛋白</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">驱动蛋白-1 走向微管正端（顺向轴浆运输）、动力蛋白走向负端（逆向）；ATP 水解耦联构象变化、8 nm 步进 hand-over-hand；轴丝动力蛋白驱动纤毛鞭毛弯曲，缺陷致 Kartagener 综合征（不育＋内脏反位）</text>
