  <rect x="1230.7569" y="311.925" width="40.486200000000004" height="16.15" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1251" y="323.42" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="700">8-oxoG</text>
  <text x="746" y="356" font-size="10.5" fill="#475569">攻击不饱和脂肪酸引发脂质过氧化链式反应</text>
  <text x="746" y="371" font-size="10.5" fill="#475569">（膜损伤、MDA 生成）。</text>
  <text x="956" y="356" font-size="10.5" fill="#475569">蛋白质侧链氧化、肽键断裂，</text>
  <text x="956" y="371" font-size="10.5" fill="#475569">发生聚集与交联。</text>
  <text x="1166" y="356" font-size="10.5" fill="#475569">攻击 DNA 碱基产生 8-氧鸟嘌呤</text>
  <text x="1166" y="371" font-size="10.5" fill="#475569">（8-oxoG）→ G→T 突变。</text>
  <rect x="788.65625" y="459.375" width="202.6875" height="21.25" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="890" y="474.5" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">氧化应激 = ROS 产生 &gt; 清除能力</text>
  <text x="736" y="506" font-size="11" fill="#475569">与衰老、动脉粥样硬化、糖尿病并发症、肿瘤、神经退行性疾病及炎症损伤相关。</text>
  <rect x="30" y="566" width="660" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="588.84" font-size="19" fill="#475569" font-weight="700">三、酶性防御级联：SOD → CAT / GPx 与 GSH 再生循环</text>
  <circle cx="110" cy="652" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="110" y="655.96" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">O₂•⁻</text>
  <line x1="138" y1="652" x2="208" y2="652" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="229.9953" y="642.65" width="116.00940000000001" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="288" y="655.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">SOD 超氧化物歧化酶</text>
  <text x="288" y="628" font-size="10" fill="#64748b" text-anchor="middle">2 O₂•⁻ + 2 H⁺ → H₂O₂ + O₂</text>
  <line x1="380" y1="652" x2="450" y2="652" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <circle cx="482" cy="652" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="482" y="655.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">H₂O₂</text>
  <line x1="506" y1="636" x2="566" y2="606" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="506" y1="668" x2="566" y2="698" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="566.17415" y="583.075" width="87.6517" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="610" y="595.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">CAT 过氧化氢酶</text>
  <text x="610" y="570" font-size="10" fill="#64748b" text-anchor="middle">2 H₂O₂ → 2 H₂O + O₂</text>
  <rect x="523.4549" y="703.075" width="173.0902" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="610" y="715.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">GPx 谷胱甘肽过氧化物酶（含硒）</text>
  <text x="610" y="690" font-size="10" fill="#64748b" text-anchor="middle">2 GSH + H₂O₂（或 LOOH）</text>
  <text x="610" y="744" font-size="10" fill="#64748b" text-anchor="middle">→ GSSG + 2 H₂O（或 LOH）</text>
  <rect x="96" y="792" width="150" height="44" rx="8" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.6"/>
  <text x="171" y="812" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">GSSG（氧化型）</text>
  <text x="171" y="828" font-size="9.5" fill="#64748b" text-anchor="middle">2 GSH → 1 GSSG</text>
  <line x1="246" y1="814" x2="330" y2="814" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <rect x="337.02385" y="805.075" width="165.9523" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="420" y="817.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">谷胱甘肽还原酶（辅酶 NADPH）</text>
  <line x1="510" y1="814" x2="590" y2="814" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <rect x="592" y="792" width="130" height="44" rx="8" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.6"/>
  <text x="657" y="812" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">2 GSH（还原型）</text>
  <text x="657" y="828" font-size="9.5" fill="#64748b" text-anchor="middle">巯基缓冲 · mM 级</text>
  <path d="M657,790 L657,770 Q657,760 647,760 L120,760 Q110,760 110,770 L110,790" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr-ok)"/>
  <text x="384" y="750" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">循环再生：GSSG → 2 GSH</text>
  <rect x="213.50897500000002" y="869.075" width="172.98204999999996" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="300" y="881.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">NADPH ← 磷酸戊糖途径（G6PD）</text>
  <line x1="300" y1="862" x2="300" y2="838" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <text x="56" y="916" font-size="11" fill="#475569">NADPH 是抗氧化还原力的最终供给者——G6PD 缺乏（蚕豆病）者 NADPH 不足，易发生氧化应激溶血。</text>
  <text x="56" y="950" font-size="10.5" fill="#64748b">同工酶分布：胞质 Cu/Zn-SOD · 线粒体 Mn-SOD；CAT 以过氧化物酶体为主；GPx 分布于胞质与线粒体。</text>
  <rect x="710" y="566" width="660" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="588.84" font-size="19" fill="#475569" font-weight="700">四、非酶性抗氧化剂与 ROS 的生理意义</text>
  <rect x="736" y="618" width="290" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="750" y="644" font-size="12" fill="#1e293b" font-weight="700">维生素 E（脂溶性）</text>
  <text x="750" y="666" font-size="10.5" fill="#475569">中断脂质过氧化链式反应</text>
  <rect x="1046" y="618" width="290" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="1060" y="644" font-size="12" fill="#1e293b" font-weight="700">维生素 C（水溶性）</text>
  <text x="1060" y="666" font-size="10.5" fill="#475569">水相清除自由基 · 再生维生素 E</text>
  <rect x="736" y="708" width="290" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="750" y="734" font-size="12" fill="#1e293b" font-weight="700">谷胱甘肽 GSH</text>
  <text x="750" y="756" font-size="10.5" fill="#475569">巯基缓冲，Millimolar 级</text>
  <rect x="1046" y="708" width="290" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="1060" y="734" font-size="12" fill="#1e293b" font-weight="700">β-胡萝卜素</text>
  <text x="1060" y="756" font-size="10.5" fill="#475569">淬灭单线态氧 ¹O₂</text>
  <rect x="736" y="798" width="290" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="750" y="824" font-size="12" fill="#1e293b" font-weight="700">尿酸</text>
  <text x="750" y="846" font-size="10.5" fill="#475569">血浆重要抗氧化剂</text>
  <rect x="1046" y="798" width="290" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="1060" y="824" font-size="12" fill="#1e293b" font-weight="700">转铁蛋白 · 金属硫蛋白</text>
  <text x="1060" y="846" font-size="10.5" fill="#475569">螯合金属离子，封锁 Fenton 反应</text>
  <text x="726" y="906" font-size="11" fill="#1e293b" font-weight="700">生理条件下 ROS 亦是信号分子：血管舒张 · 免疫杀伤 · HIF-1 调控——抗氧化体系的意义在于维持「信号浓度」而非清零。</text>
  <text x="726" y="950" font-size="10.5" fill="#64748b">酶系（SOD/CAT/GPx）与非酶系（维生素 E/C、GSH、尿酸等）分工覆盖水相与脂相。</text>
</svg>