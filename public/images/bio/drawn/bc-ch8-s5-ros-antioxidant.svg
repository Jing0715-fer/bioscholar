  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">活性氧与抗氧化体系：产生、损伤与级联清除</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">呼吸链 1%~2% 电子泄漏产 O₂•⁻，Fenton 反应生成攻击性最强的 •OH；SOD → CAT/GPx（含硒）级联清除，GSH 经 NADPH（磷酸戊糖途径）再生——氧化应激与衰老、动脉粥样硬化、肿瘤相关</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、ROS 的产生：1%~2% 电子泄漏与 Fenton 反应</text>
  <circle cx="120" cy="232" r="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="120" y="236.68" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">O₂</text>
  <line x1="148" y1="232" x2="218" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="183" y="214" font-size="9.5" fill="#475569" text-anchor="middle">呼吸链单电子泄漏</text>
  <text x="183" y="254" font-size="9.5" fill="#64748b" text-anchor="middle">1%~2% 耗氧</text>
  <circle cx="250" cy="232" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="250" y="236.32" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">O₂•⁻</text>
  <text x="250" y="272" font-size="9.5" fill="#64748b" text-anchor="middle">超氧阴离子</text>
  <line x1="280" y1="232" x2="350" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="315" y="214" font-size="9.5" fill="#475569" text-anchor="middle">SOD 歧化</text>
  <circle cx="382" cy="232" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="382" y="236.32" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">H₂O₂</text>
  <text x="382" y="272" font-size="9.5" fill="#64748b" text-anchor="middle">过氧化氢</text>
  <line x1="412" y1="232" x2="482" y2="232" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="447" y="214" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">Fenton 反应</text>
  <text x="447" y="254" font-size="9.5" fill="#64748b" text-anchor="middle">Fe²⁺ → Fe³⁺</text>
  <circle cx="514" cy="232" r="26" fill="#dc2626" stroke="#dc2626" stroke-width="1.6"/>
  <text x="514" y="236.68" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">•OH</text>
  <text x="514" y="272" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">羟自由基（最强）</text>
  <text x="56" y="306" font-size="11" fill="#475569">Fenton：Fe²⁺ + H₂O₂ → Fe³⁺ + •OH + OH⁻；Haber-Weiss：O₂•⁻ + H₂O₂ → •OH + O₂ + OH⁻。ROS 家族：</text>
  <text x="56" y="322" font-size="11" fill="#475569">O₂•⁻ · H₂O₂ · •OH · 单线态氧 ¹O₂ · 脂过氧基 LOO•。</text>
  <text x="56" y="366" font-size="12.5" fill="#1e293b" font-weight="700">产生位点：</text>
  <text x="56" y="394" font-size="11" fill="#475569">· 线粒体呼吸链（复合物 I 的 FMN · 复合物 III Q 循环外漏 CoQ•⁻）</text>
  <text x="56" y="420" font-size="11" fill="#475569">· 内质网细胞色素 P450</text>
  <text x="56" y="446" font-size="11" fill="#475569">· 吞噬细胞 NADPH 氧化酶（呼吸爆发杀菌）</text>
  <text x="56" y="472" font-size="11" fill="#475569">· 黄嘌呤氧化酶（缺血-再灌注损伤）</text>
  <text x="56" y="510" font-size="10.5" fill="#64748b">细胞内约 1%~2% 的耗氧经单电子泄漏生成 ROS——氧化代谢的「代价」。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、氧化损伤：•OH 攻击三大靶分子</text>
  <rect x="736" y="196" width="190" height="250" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="831" y="222" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">脂质</text>
  <rect x="746" y="238" width="170" height="92" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="946" y="196" width="190" height="250" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1041" y="222" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">蛋白质</text>
  <rect x="956" y="238" width="170" height="92" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1156" y="196" width="190" height="250" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1251" y="222" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">DNA</text>
  <rect x="1166" y="238" width="170" height="92" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <g><circle cx="752" cy="262" r="5.5" fill="#dc2626" fill-opacity="0.85"/><line x1="752" y1="266" x2="752" y2="269" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="752" cy="273" r="5.5" fill="#dc2626" fill-opacity="0.85"/><circle cx="776" cy="262" r="5.5" fill="#dc2626" fill-opacity="0.85"/><line x1="776" y1="266" x2="776" y2="269" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="776" cy="273" r="5.5" fill="#dc2626" fill-opacity="0.85"/><circle cx="800" cy="262" r="5.5" fill="#dc2626" fill-opacity="0.85"/><line x1="800" y1="266" x2="800" y2="269" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="800" cy="273" r="5.5" fill="#dc2626" fill-opacity="0.85"/><circle cx="824" cy="262" r="5.5" fill="#dc2626" fill-opacity="0.85"/><line x1="824" y1="266" x2="824" y2="269" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="824" cy="273" r="5.5" fill="#dc2626" fill-opacity="0.85"/><circle cx="848" cy="262" r="5.5" fill="#dc2626" fill-opacity="0.85"/><line x1="848" y1="266" x2="848" y2="269" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="848" cy="273" r="5.5" fill="#dc2626" fill-opacity="0.85"/><circle cx="872" cy="262" r="5.5" fill="#dc2626" fill-opacity="0.85"/><line x1="872" y1="266" x2="872" y2="269" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="872" cy="273" r="5.5" fill="#dc2626" fill-opacity="0.85"/><circle cx="896" cy="262" r="5.5" fill="#dc2626" fill-opacity="0.85"/><line x1="896" y1="266" x2="896" y2="269" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="896" cy="273" r="5.5" fill="#dc2626" fill-opacity="0.85"/></g>
  <circle cx="800" cy="316" r="12" fill="#dc2626" stroke="#dc2626" stroke-width="1.6"/>
  <text x="800" y="318.88" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">•OH</text>
  <text x="880" y="316" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">LOO•</text>
  <polyline points="962,262 980,250 996,272 1014,252 1032,268 1050,254 1066,266" fill="none" stroke="#d97706" stroke-width="2.4"/>
