  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">Hodgkin-Huxley 模型：电压钳、门控变量与手摇计算机上的奇迹</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">枪乌贼巨轴突直径0.5–1mm；1939年测得超射+40mV否定Bernstein膜学说，1949年钠假说登场；胆碱置换（后用TTX/TEA）分离出快失活的I_Na与持续延迟的I_K；g_Na=</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">g<tspan dy="-9.9" font-size="13.6" dx="-8.8">¯</tspan><tspan dy="9.9" dx="8.8">_Na·m</tspan><tspan dy="-5.8" font-size="12.2">3</tspan><tspan dy="5.8">h、g_K=g</tspan><tspan dy="-9.9" font-size="13.6" dx="-8.8">¯</tspan><tspan dy="9.9" dx="8.8">_K·n</tspan><tspan dy="-5.8" font-size="12.2">4</tspan><tspan dy="5.8">（E_Na=+50、E_K=−77、E_l=−54.4mV）；数值积分重现波形与传导速度（计算约18.7m/s对实测约21m/s），1963年三人共获诺奖</tspan></text>
  <rect x="30" y="132" width="700" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、枪乌贼巨轴突：大自然送来的实验台</text>
  <rect x="60" y="176" width="640" height="52" rx="8" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.4"/>
  <text x="78" y="196" font-size="11.5" fill="#075985">直径 0.5–1 mm、肉眼可见、可插入电极的神经纤维——本是枪乌贼喷水推进的高速信号线。</text>
  <rect x="75.5894" y="243.075" width="40.821200000000005" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="96" y="255.78" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">1902</text>
  <text x="146" y="256" font-size="11" fill="#475569">Bernstein 膜学说：兴奋时膜「崩塌」，电位向零坍塌——无法容纳超射</text>
  <rect x="75.5894" y="277.075" width="40.821200000000005" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="96" y="289.78" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">1939</text>
  <text x="146" y="290" font-size="11" fill="#475569">Hodgkin &amp; Huxley 微电极刺入巨轴突：测得超射 +40 mV，旧说当场失效</text>
  <rect x="75.5894" y="311.075" width="40.821200000000005" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="96" y="323.78" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">1949</text>
  <text x="146" y="324" font-size="11" fill="#475569">钠假说登场：兴奋时膜转为对 Na<tspan dy="-3.7" font-size="7.9">+</tspan><tspan dy="3.7"> 通透，电位冲向 E_Na</tspan></text>
  <rect x="66.07220000000001" y="345.075" width="59.855599999999995" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="96" y="357.78" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">1947–52</text>
  <text x="146" y="358" font-size="11" fill="#475569">电压钳系列实验：把放电问题化为各钳位电压下的电流测量</text>
