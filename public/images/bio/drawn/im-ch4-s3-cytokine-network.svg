  <text x="645" y="452.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">基质细胞与免疫细胞</text>
  <rect x="780" y="426" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="452.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">造血与白细胞生成</text>
