  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">细胞因子：免疫系统的信使——家族谱、JAK-STAT 与细胞因子风暴</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">细胞因子为低分子量分泌蛋白，以自泌与旁泌为主，具多效性、冗余性、协同性与网络性；IL、TNF、IFN、趋化因子（约 8–10 kDa）与集落刺激因子分工覆盖活化增殖、极化、趋化与造血；多数经 JAK-STAT 通路转导、SOCS 负反馈刹停；风暴见于超抗原中毒、CAR-T 与重症感染（IL-6 为中心节点），抗 IL-6R、抗 TNF 与 IL-1 受体拮抗剂为精准干预</text>
  <rect x="30" y="132" width="1340" height="342" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、细胞因子的共同特性与家族功能谱：免疫系统的信使网络</text>
  <rect x="83.62" y="168.225" width="112.76" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="140" y="182.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">低分子量分泌蛋白</text>
  <rect x="313.8569" y="168.225" width="112.2862" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="370" y="182.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">以自泌 / 旁泌为主</text>
  <rect x="573.2325" y="168.225" width="53.535000000000004" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="182.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">多效性</text>
  <rect x="683.2325" y="168.225" width="53.535000000000004" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="710" y="182.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">冗余性</text>
  <rect x="793.2325" y="168.225" width="53.535000000000004" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="820" y="182.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">协同性</text>
  <rect x="903.2325" y="168.225" width="53.535000000000004" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="930" y="182.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">网络性</text>
  <text x="1070" y="182" font-size="10.5" fill="#64748b">1979 年国际会议统一命名白细胞介素（IL）</text>
  <rect x="60" y="214" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="241.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">家族</text>
