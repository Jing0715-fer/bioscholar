  <text x="645" y="368.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">pDC · NK 细胞 · T 细胞</text>
  <rect x="780" y="342" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="368.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">抗病毒与免疫调节</text>
  <rect x="60" y="384" width="1280" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="384" width="170" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="410.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">趋化因子</text>
  <rect x="230" y="384" width="280" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="370" y="410.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">IL-8 等约 8–10 kDa 小蛋白</text>
  <rect x="510" y="384" width="270" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="645" y="410.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">多种细胞</text>
  <rect x="780" y="384" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="410.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">按 C / CXC 等亚家族趋化白细胞定向迁移</text>
  <rect x="60" y="426" width="170" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="452.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">集落刺激因子（CSF）</text>
  <rect x="230" y="426" width="280" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="370" y="452.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">G-CSF · GM-CSF</text>
