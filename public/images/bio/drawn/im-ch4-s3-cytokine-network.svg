  <text x="370" y="284.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">IL-1 · IL-2 · IL-4 · IL-6 · IL-12</text>
  <rect x="510" y="258" width="270" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="645" y="284.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">单核巨噬细胞 · T 细胞等</text>
  <rect x="780" y="258" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="284.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">活化增殖、分化与 Th 极化</text>
