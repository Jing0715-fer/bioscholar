  <rect x="230" y="300" width="280" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="370" y="326.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">TNF-α</text>
  <rect x="510" y="300" width="270" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="645" y="326.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">活化的单核-巨噬细胞</text>
  <rect x="780" y="300" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="326.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">炎症介质与细胞毒性</text>
  <rect x="60" y="342" width="170" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
