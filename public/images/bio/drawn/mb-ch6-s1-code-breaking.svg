<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">遗传密码的破译</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">poly(U) 确立 UUU=Phe（1961）→ 随机共聚物定组成 → Khorana 重复共聚物与三核苷酸结合实验收尾——1966 年全部 64 个密码子破译：61 个有义（AUG 兼起始）+ 3 个终止</text>
  <rect x="30" y="132" width="1340" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、破译密码的十年：1961–1966</text>
  <line x1="70" y1="252" x2="1330" y2="252" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <circle cx="150" cy="252" r="6" fill="#1e293b"/>
  <text x="150" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1958</text>
  <text x="150" y="274" font-size="10.5" fill="#475569" text-anchor="middle">Crick 提出接头假说：</text>
  <text x="150" y="289" font-size="10.5" fill="#475569" text-anchor="middle">预言既识别密码子又携带氨基酸的接头分子</text>
  <text x="150" y="304" font-size="10.5" fill="#475569" text-anchor="middle">（即 tRNA）</text>
  <circle cx="370" cy="252" r="6" fill="#1e293b"/>
  <text x="370" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1961</text>
  <text x="370" y="274" font-size="10.5" fill="#475569" text-anchor="middle">Nirenberg 与 Matthaei：</text>
  <text x="370" y="289" font-size="10.5" fill="#475569" text-anchor="middle">poly(U) → UUU = Phe，首个密码子破译</text>
  <circle cx="610" cy="252" r="6" fill="#1e293b"/>
  <text x="610" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1964</text>
  <text x="610" y="274" font-size="10.5" fill="#475569" text-anchor="middle">Nirenberg 与 Leder：</text>
  <text x="610" y="289" font-size="10.5" fill="#475569" text-anchor="middle">三核苷酸-核糖体结合实验，</text>
  <text x="610" y="304" font-size="10.5" fill="#475569" text-anchor="middle">逐一检验 64 种组合</text>
  <circle cx="860" cy="252" r="6" fill="#1e293b"/>
  <text x="860" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1966</text>
  <text x="860" y="274" font-size="10.5" fill="#475569" text-anchor="middle">全部 64 个密码子破译完成</text>
  <text x="860" y="289" font-size="10.5" fill="#475569" text-anchor="middle">（Khorana 重复共聚物收尾）</text>
  <circle cx="1120" cy="252" r="6" fill="#1e293b"/>
  <text x="1120" y="232" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1968</text>
  <text x="1120" y="274" font-size="10.5" fill="#475569" text-anchor="middle">Nirenberg、Khorana 与 Holley</text>
  <text x="1120" y="289" font-size="10.5" fill="#475569" text-anchor="middle">（首个核酸序列：酵母丙氨酸 tRNA）</text>
  <text x="1120" y="304" font-size="10.5" fill="#475569" text-anchor="middle">获诺贝尔奖</text>
  <text x="70" y="200" font-size="11.5" fill="#64748b">Zamecnik 的无细胞翻译体系（大肠杆菌核糖体 + 酶液 + 能量系统）与人工合成 RNA 模板技术共同奠定实验基础</text>
  <rect x="30" y="392" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="414.84" font-size="19" fill="#475569" font-weight="700">二、三个关键实验的设计逻辑</text>
  <rect x="56" y="440" width="610" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="72" y="462" font-size="12.5" fill="#1e293b" font-weight="700">① poly(U)（1961）</text>
  <text x="72" y="480" font-size="10.5" fill="#475569" font-weight="600">人工多聚尿苷酸加入无细胞体系</text>
  <text x="72" y="496" font-size="10" fill="#64748b">得到仅含苯丙氨酸的肽链 → UUU = Phe；同法确定 CCC = Pro、AAA = Lys、GGG = Gly</text>
  <rect x="56" y="522" width="610" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="72" y="544" font-size="12.5" fill="#1e293b" font-weight="700">② 随机共聚物</text>
  <text x="72" y="562" font-size="10.5" fill="#475569" font-weight="600">U 与 G 按 5:1 等已知比例随机共聚</text>
  <text x="72" y="578" font-size="10" fill="#64748b">按统计频率匹配氨基酸掺入量——定组成但无法区分组内排列（如 UUG / UGU / GUU）</text>
  <rect x="56" y="604" width="610" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="72" y="626" font-size="12.5" fill="#1e293b" font-weight="700">③ 重复共聚物</text>
  <text x="72" y="644" font-size="10.5" fill="#475569" font-weight="600">Khorana 合成 poly(UC)ₙ、poly(UUC)ₙ 等序列确定的模板</text>
  <text x="72" y="660" font-size="10" fill="#64748b">poly(UC)ₙ 读出 UCU CUC…→ Ser–Leu 交替；poly(UUC)ₙ 按三种读框周期性唯一确定密码子</text>
  <text x="56" y="682" font-size="11" fill="#475569">三核苷酸 + 对应氨酰-tRNA + 核糖体形成被硝酸纤维素滤膜截留的复合物——「结合实验」直接读出三联体归属。</text>
  <rect x="710" y="392" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="414.84" font-size="19" fill="#475569" font-weight="700">三、64 个密码子的组织规律</text>
  <text x="740" y="438" font-size="11" fill="#475569">· 同一氨基酸的密码子多聚在第 1、2 位固定的一格内</text>
  <text x="740" y="460" font-size="11" fill="#475569">· 第 3 位「摆动」——简并性的结构基础（下节）</text>
  <text x="740" y="482" font-size="11" fill="#475569">· 破译把「核酸语言」逐字翻译为「蛋白质语言」</text>
  <rect x="740" y="528" width="305" height="30" fill="#0f766e" opacity="0.85"/>
  <rect x="1045" y="528" width="15" height="30" fill="#dc2626"/>
  <text x="900" y="548" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">64 个三联体密码子</text>
  <text x="890" y="580" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">有义密码子 61 个</text>
  <text x="1060" y="580" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">终止 3 个</text>
  <rect x="782.3256" y="600.65" width="235.3488" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="900" y="613.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">AUG：起始密码子兼蛋氨酸（原核为 fMet）</text>
  <rect x="785.17445" y="651.075" width="229.65110000000004" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="900" y="663.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">UAA（ochre）· UAG（amber）· UGA（opal）</text>
  <rect x="30" y="712" width="1340" height="258" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="734.84" font-size="19" fill="#475569" font-weight="700">四、标准遗传密码表（行＝第 1 位碱基，列＝第 2 位；格内为第 3 位四种密码子）</text>
  <rect x="120" y="752" width="300" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="270" y="768" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">第 2 位：U</text>
  <rect x="420" y="752" width="300" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="570" y="768" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">第 2 位：C</text>
  <rect x="720" y="752" width="300" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="870" y="768" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">第 2 位：A</text>
  <rect x="1020" y="752" width="300" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1170" y="768" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">第 2 位：G</text>
  <rect x="120" y="776" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="146" y="802" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">UU</text>
  <text x="182" y="792" font-size="10" fill="#475569">Phe（UUU·UUC）</text>
  <text x="182" y="806" font-size="10" fill="#475569">Leu（UUA·UUG）</text>
  <rect x="420" y="776" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="446" y="802" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">UC</text>
  <text x="482" y="792" font-size="10" fill="#475569">Ser（UCU·UCC·UCA·UCG）</text>
  <rect x="720" y="776" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="746" y="802" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">UA</text>
  <text x="782" y="792" font-size="10" fill="#475569">Tyr（UAU·UAC）</text>
  <text x="782" y="806" font-size="10" fill="#991b1b">终止（UAA·UAG）</text>
  <rect x="1020" y="776" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1046" y="802" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">UG</text>
  <text x="1082" y="792" font-size="10" fill="#475569">Cys（UGU·UGC）</text>
  <text x="1082" y="806" font-size="10" fill="#991b1b">终止（UGA）· Trp（UGG）</text>
  <rect x="120" y="818" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="146" y="844" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">CU</text>
  <text x="182" y="834" font-size="10" fill="#475569">Leu（CUU·CUC·CUA·CUG）</text>
  <rect x="420" y="818" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="446" y="844" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">CC</text>
  <text x="482" y="834" font-size="10" fill="#475569">Pro（CCU·CCC·CCA·CCG）</text>
  <rect x="720" y="818" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="746" y="844" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">CA</text>
  <text x="782" y="834" font-size="10" fill="#475569">His（CAU·CAC）</text>
  <text x="782" y="848" font-size="10" fill="#475569">Gln（CAA·CAG）</text>
  <rect x="1020" y="818" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1046" y="844" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">CG</text>
  <text x="1082" y="834" font-size="10" fill="#475569">Arg（CGU·CGC·CGA·CGG）</text>
  <rect x="120" y="860" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="146" y="886" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">AU</text>
  <text x="182" y="876" font-size="10" fill="#475569">Ile（AUU·AUC·AUA）</text>
  <text x="182" y="890" font-size="10" fill="#475569">Met / 起始（AUG）</text>
  <rect x="420" y="860" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="446" y="886" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">AC</text>
  <text x="482" y="876" font-size="10" fill="#475569">Thr（ACU·ACC·ACA·ACG）</text>
  <rect x="720" y="860" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="746" y="886" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">AA</text>
  <text x="782" y="876" font-size="10" fill="#475569">Asn（AAU·AAC）</text>
  <text x="782" y="890" font-size="10" fill="#475569">Lys（AAA·AAG）</text>
  <rect x="1020" y="860" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1046" y="886" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">AG</text>
  <text x="1082" y="876" font-size="10" fill="#475569">Ser（AGU·AGC）</text>
  <text x="1082" y="890" font-size="10" fill="#475569">Arg（AGA·AGG）</text>
  <rect x="120" y="902" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="146" y="928" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">GU</text>
  <text x="182" y="918" font-size="10" fill="#475569">Val（GUU·GUC·GUA·GUG）</text>
  <rect x="420" y="902" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="446" y="928" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">GC</text>
  <text x="482" y="918" font-size="10" fill="#475569">Ala（GCU·GCC·GCA·GCG）</text>
  <rect x="720" y="902" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="746" y="928" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">GA</text>
  <text x="782" y="918" font-size="10" fill="#475569">Asp（GAU·GAC）</text>
  <text x="782" y="932" font-size="10" fill="#475569">Glu（GAA·GAG）</text>
  <rect x="1020" y="902" width="300" height="42" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1046" y="928" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">GG</text>
  <text x="1082" y="918" font-size="10" fill="#475569">Gly（GGU·GGC·GGA·GGG）</text>
  <rect x="50" y="776" width="70" height="42" fill="#ccfbf1" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="85" y="794" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">第 1 位</text>
  <text x="85" y="810" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">U</text>
  <rect x="50" y="818" width="70" height="42" fill="#ccfbf1" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="85" y="836" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">第 1 位</text>
  <text x="85" y="852" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">C</text>
  <rect x="50" y="860" width="70" height="42" fill="#ccfbf1" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="85" y="878" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">第 1 位</text>
  <text x="85" y="894" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">A</text>
  <rect x="50" y="902" width="70" height="42" fill="#ccfbf1" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="85" y="920" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">第 1 位</text>
  <text x="85" y="936" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">G</text>
</svg>