<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">半保留复制的证实：Meselson-Stahl 实验</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">¹⁵N→¹⁴N 转移培养 + CsCl 密度梯度离心——第 1 代全为中间密度杂合带、第 2 代中间带与轻带约 1:1，唯一符合半保留复制（1958）</text>
  <rect x="30" y="132" width="1340" height="164" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、实验设计：¹⁵N → ¹⁴N 同位素转移 + CsCl 密度梯度离心（1958）</text>
  <rect x="56" y="172" width="300" height="84" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="72" y="196" font-size="13.5" fill="#1e293b" font-weight="700">① ¹⁵N 标记</text>
  <text x="72" y="218" font-size="11.5" fill="#475569">大肠杆菌在含 ¹⁵NH₄Cl（重氮）培养液中培养多代，</text>
  <text x="72" y="234" font-size="11.5" fill="#475569">DNA 双链均被 ¹⁵N 标记</text>
  <line x1="358" y1="214" x2="384" y2="214" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="386" y="172" width="300" height="84" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="402" y="196" font-size="13.5" fill="#1e293b" font-weight="700">② 转入 ¹⁴N</text>
  <text x="402" y="218" font-size="11.5" fill="#475569">突然转入 ¹⁴N（轻氮）培养基，继续培养</text>
  <line x1="688" y1="214" x2="714" y2="214" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="716" y="172" width="300" height="84" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="732" y="196" font-size="13.5" fill="#1e293b" font-weight="700">③ 分代取样</text>
  <text x="732" y="218" font-size="11.5" fill="#475569">在不同代数取样，提取 DNA</text>
  <line x1="1018" y1="214" x2="1044" y2="214" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="1046" y="172" width="300" height="84" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1062" y="196" font-size="13.5" fill="#1e293b" font-weight="700">④ 梯度离心</text>
  <text x="1062" y="218" font-size="11.5" fill="#475569">CsCl 平衡超速离心，</text>
  <text x="1062" y="234" font-size="11.5" fill="#475569">重 / 轻 DNA 因浮力密度不同而分离成带</text>
  <text x="56" y="282" font-size="12.5" fill="#1e293b" font-weight="700">被誉为「生物学最美实验」——实验结果同时排除全保留与分散两种假说。</text>
  <rect x="30" y="308" width="420" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="330.84" font-size="19" fill="#475569" font-weight="700">二、三种假说的预期与排除</text>
  <rect x="48" y="362" width="80" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="88" y="389.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">假说</text>
  <rect x="128" y="362" width="96" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="176" y="389.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">第 1 代</text>
  <rect x="224" y="362" width="136" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="292" y="389.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">第 2 代</text>
  <rect x="360" y="362" width="72" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="396" y="389.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">判定</text>
  <rect x="48" y="406" width="80" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="88" y="437.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">半保留</text>
  <rect x="128" y="406" width="96" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="176" y="437.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">全部中间带</text>
  <rect x="224" y="406" width="136" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="292" y="437.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">中间 + 轻（1:1）</text>
  <rect x="360" y="406" width="72" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="396" y="437.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">符合</text>
  <rect x="48" y="458" width="384" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="48" y="458" width="80" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="88" y="489.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">全保留</text>
  <rect x="128" y="458" width="96" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="176" y="489.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">重 + 轻两带</text>
  <rect x="224" y="458" width="136" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="292" y="489.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">重 + 轻两带</text>
  <rect x="360" y="458" width="72" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="396" y="489.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">排除</text>
  <rect x="48" y="510" width="80" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="88" y="541.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">分散</text>
  <rect x="128" y="510" width="96" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="176" y="541.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">一条弥散带</text>
  <rect x="224" y="510" width="136" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="292" y="541.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">一条弥散带</text>
  <rect x="360" y="510" width="72" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="396" y="541.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">排除</text>
  <text x="48" y="584" font-size="12" fill="#475569">第 1 代即排除全保留；</text>
  <text x="48" y="601" font-size="12" fill="#475569">第 2 代 1:1 分离再排除分散——唯一符合半保留复制。</text>
  <rect x="470" y="308" width="900" height="392" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="486" y="330.84" font-size="19" fill="#475569" font-weight="700">三、CsCl 密度梯度离心结果：条带随代数的分布</text>
  <rect x="880" y="337.17" width="12.65" height="9.66" rx="3" fill="#be185d" stroke="#cbd5e1" stroke-width="1"/>
  <text x="900.65" y="346.14" font-size="11.5" fill="#475569">重 ¹⁵N/¹⁵N</text>
  <rect x="981.07" y="337.17" width="12.65" height="9.66" rx="3" fill="#0f766e" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1001.72" y="346.14" font-size="11.5" fill="#475569">杂合 ¹⁵N/¹⁴N</text>
  <rect x="1093.64" y="337.17" width="12.65" height="9.66" rx="3" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1114.2900000000002" y="346.14" font-size="11.5" fill="#475569">轻 ¹⁴N/¹⁴N</text>
  <text x="500" y="348" font-size="12.5" fill="#1e293b" font-weight="700">第 0 代（转移前）</text>
  <rect x="500" y="356" width="560" height="46" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="597" y="364" width="30" height="30" rx="4" fill="#be185d" opacity="0.85"/>
  <text x="1084" y="386" font-size="12.5" fill="#475569">只有重带</text>
  <text x="500" y="422" font-size="12.5" fill="#1e293b" font-weight="700">第 1 代</text>
  <rect x="500" y="430" width="560" height="46" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="765" y="438" width="30" height="30" rx="4" fill="#0f766e" opacity="0.85"/>
  <text x="1084" y="460" font-size="12.5" fill="#475569">全部为中间密度杂合带</text>
  <text x="500" y="496" font-size="12.5" fill="#1e293b" font-weight="700">第 2 代</text>
  <rect x="500" y="504" width="560" height="46" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="767" y="512" width="26" height="30" rx="4" fill="#0f766e" opacity="0.85"/>
  <rect x="923.8" y="512" width="26" height="30" rx="4" fill="#0369a1" opacity="0.85"/>
  <text x="1084" y="534" font-size="12.5" fill="#475569">中间 : 轻 ≈ 1 : 1</text>
  <text x="500" y="570" font-size="12.5" fill="#1e293b" font-weight="700">第 3 代</text>
  <rect x="500" y="578" width="560" height="46" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="772" y="586" width="16" height="30" rx="4" fill="#0f766e" opacity="0.85"/>
  <rect x="915.8" y="586" width="42" height="30" rx="4" fill="#0369a1" opacity="0.85"/>
  <text x="1084" y="608" font-size="12.5" fill="#475569">中间 : 轻 ≈ 1 : 3</text>
  <line x1="500" y1="648" x2="1060" y2="648" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="500" y="670" font-size="11.5" fill="#64748b">← 浮力密度大（重侧）</text>
  <text x="1060" y="670" font-size="11.5" fill="#64748b" text-anchor="end">浮力密度小（轻侧）→</text>
  <text x="1084" y="644" font-size="12" fill="#64748b">杂合带按 (1/2)ⁿ 递减</text>
  <rect x="30" y="620" width="420" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="642.84" font-size="19" fill="#475569" font-weight="700">四、两条补强证据</text>
  <text x="48" y="668" font-size="12.5" fill="#1e293b" font-weight="700">第 1 代杂合 DNA 变性分离：</text>
  <rect x="70" y="684" width="40" height="118" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="72" y="706" width="36" height="12" rx="3" fill="#be185d" opacity="0.85"/>
  <rect x="72" y="756" width="36" height="12" rx="3" fill="#0369a1" opacity="0.85"/>
  <text x="122" y="715" font-size="11.5" fill="#831843">重单链（¹⁵N）</text>
  <text x="122" y="740" font-size="11.5" fill="#64748b">≈ 等量</text>
  <text x="122" y="765" font-size="11.5" fill="#075985">轻单链（¹⁴N）</text>
  <text x="48" y="826" font-size="12" fill="#475569">得等量重 / 轻单链——每个子代双分子各含一条亲代链与一条新合成链。</text>
  <text x="48" y="880" font-size="12.5" fill="#1e293b" font-weight="700">1957 年 Taylor：蚕豆根尖细胞</text>
  <text x="48" y="904" font-size="12" fill="#475569">³H-胸苷参入 + 放射自显影，</text>
  <text x="48" y="921" font-size="12" fill="#475569">证明真核染色体 DNA 同样半保留复制——一条染色单体含旧链、</text>
  <text x="48" y="938" font-size="12" fill="#475569">另一条含新链。</text>
  <rect x="470" y="720" width="900" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="486" y="742.84" font-size="19" fill="#475569" font-weight="700">五、半保留复制的分子谱系：杂合分子按 (1/2)ⁿ 递减</text>
  <rect x="1180" y="751.17" width="12.65" height="9.66" rx="3" fill="#be185d" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1200.65" y="760.14" font-size="11.5" fill="#475569">¹⁵N 旧链</text>
  <rect x="1269.11" y="751.17" width="12.65" height="9.66" rx="3" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1289.76" y="760.14" font-size="11.5" fill="#475569">¹⁴N 新链</text>
  <text x="496" y="792" font-size="12" fill="#64748b" font-weight="700">0 代</text>
  <text x="496" y="872" font-size="12" fill="#64748b" font-weight="700">1 代</text>
  <text x="496" y="946" font-size="12" fill="#64748b" font-weight="700">2 代</text>
  <rect x="620" y="770" width="120" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="630" y1="781" x2="730" y2="781" stroke="#be185d" stroke-width="4"/>
  <line x1="630" y1="795" x2="730" y2="795" stroke="#be185d" stroke-width="4"/>
  <line x1="660" y1="806" x2="590" y2="850" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="700" y1="806" x2="770" y2="850" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="520" y="850" width="120" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="530" y1="861" x2="630" y2="861" stroke="#be185d" stroke-width="4"/>
  <line x1="530" y1="875" x2="630" y2="875" stroke="#0369a1" stroke-width="4"/>
  <rect x="720" y="850" width="120" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="730" y1="861" x2="830" y2="861" stroke="#be185d" stroke-width="4"/>
  <line x1="730" y1="875" x2="830" y2="875" stroke="#0369a1" stroke-width="4"/>
  <line x1="560" y1="886" x2="530" y2="924" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="600" y1="886" x2="660" y2="924" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="760" y1="886" x2="860" y2="924" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="800" y1="886" x2="1080" y2="924" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="480" y="924" width="120" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="490" y1="935" x2="590" y2="935" stroke="#be185d" stroke-width="4"/>
  <line x1="490" y1="949" x2="590" y2="949" stroke="#0369a1" stroke-width="4"/>
  <rect x="640" y="924" width="120" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="650" y1="935" x2="750" y2="935" stroke="#0369a1" stroke-width="4"/>
  <line x1="650" y1="949" x2="750" y2="949" stroke="#0369a1" stroke-width="4"/>
  <rect x="840" y="924" width="120" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="850" y1="935" x2="950" y2="935" stroke="#be185d" stroke-width="4"/>
  <line x1="850" y1="949" x2="950" y2="949" stroke="#0369a1" stroke-width="4"/>
  <rect x="1040" y="924" width="120" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="1050" y1="935" x2="1150" y2="935" stroke="#0369a1" stroke-width="4"/>
  <line x1="1050" y1="949" x2="1150" y2="949" stroke="#0369a1" stroke-width="4"/>
  <text x="1180" y="800" font-size="11.5" fill="#475569">每个杂合分子复制 → 1 杂合 + 1 轻；</text>
  <text x="1180" y="816" font-size="11.5" fill="#475569">杂合占比逐代减半，</text>
  <text x="1180" y="832" font-size="11.5" fill="#475569">与离心结果一致。</text>
</svg>