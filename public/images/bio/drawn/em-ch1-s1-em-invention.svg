  <rect x="485.7957991617031" y="826.225" width="158.14000000000001" height="19.55" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="564.8657991617031" y="840.14" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">现代电子显微镜：亚纳米级</text>
  <rect x="1074.442649161703" y="788.225" width="140.8463" height="19.55" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1144.865799161703" y="802.14" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">光学衍射极限约 200 nm</text>
  <rect x="1168.9747533022205" y="826.225" width="121.65740000000001" height="19.55" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="1229.8034533022205" y="840.14" font-size="11.5" fill="#d97706" text-anchor="middle" font-weight="700">可见光 400–700 nm</text>
  <line x1="1118.865799161703" y1="776" x2="604.8657991617031" y2="776" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="854.8657991617031" y="762" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="700">约三个数量级</text>
  <text x="60" y="938" font-size="11.5" fill="#475569">波长不是瓶颈、像差才是：皮米级的电子波长被毫米级的磁透镜像差削平到亚纳米——现代电镜远未用尽波长的潜力。</text>
  <text x="760" y="938" font-size="11.5" fill="#475569">1986 年鲁斯卡因电子显微镜的发明与宾尼希、罗雷尔（扫描隧道显微镜）</text>
  <text x="760" y="955" font-size="11.5" fill="#475569">共享诺贝尔物理学奖——距 1931 年样机问世逾半个世纪。</text>
</svg>