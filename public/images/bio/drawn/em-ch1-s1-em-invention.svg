  <line x1="893.3333333333333" y1="860" x2="893.3333333333333" y2="867" stroke="#475569" stroke-width="1.8"/>
  <text x="893.3333333333333" y="884" font-size="12" fill="#64748b" text-anchor="middle">10</text>
  <line x1="1086.6666666666667" y1="860" x2="1086.6666666666667" y2="867" stroke="#475569" stroke-width="1.8"/>
  <text x="1086.6666666666667" y="884" font-size="12" fill="#64748b" text-anchor="middle">10<tspan dy="-4.1" font-size="8.6">2</tspan></text>
  <line x1="1280" y1="860" x2="1280" y2="867" stroke="#475569" stroke-width="1.8"/>
  <text x="1280" y="884" font-size="12" fill="#64748b" text-anchor="middle">10<tspan dy="-4.1" font-size="8.6">3</tspan></text>
