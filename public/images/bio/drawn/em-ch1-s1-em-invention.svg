  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">电子显微镜的诞生：从物质波到超显微镜</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">阿贝光学极限约 200 nm、电子波长短约十万倍；1924 物质波、1926 磁透镜、1931 首台 TEM、1939 商品化、1986 鲁斯卡获诺贝尔物理学奖</text>
  <rect x="30" y="132" width="660" height="286" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、波长革命：光学极限与物质波</text>
  <text x="50" y="184" font-size="16.5" fill="#1e293b" font-weight="700">d = 0.61λ/(n·sin α)（阿贝判据，1873）</text>
  <text x="50" y="210" font-size="12.5" fill="#475569">以可见光 400–700 nm 的波长、油浸物镜约 1.4 的数值孔径计算，</text>
  <text x="50" y="229" font-size="12.5" fill="#475569">光学极限分辨率约 200 nm——镜片磨得再完美，更小的细节也无力分辨。</text>
  <rect x="110.905" y="295.375" width="198.19" height="21.25" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="210" y="310.5" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">1924 德布罗意物质波：λ = h/p</text>
  <rect x="416.9125" y="295.375" width="146.175" height="21.25" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="310.5" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">1929 诺贝尔物理学奖</text>
  <text x="50" y="344" font-size="12.5" fill="#475569">波长与动量成反比，一切运动粒子皆具波动性；1927 年电子衍射实验证实这一预言。</text>
  <text x="50" y="363" font-size="12.5" fill="#475569">电子只需数千伏电压加速，波长远短于可见光——短约十万倍（10<tspan dy="-4.3" font-size="9.0">5</tspan><tspan dy="4.3"> 量级），波长从此不再是分辨率的枷锁。</tspan></text>
  <rect x="710" y="132" width="660" height="286" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、1931：柏林工大的「超显微镜」（Übermikroskop）</text>
