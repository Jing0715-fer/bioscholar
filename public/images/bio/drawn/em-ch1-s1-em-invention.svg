  <text x="862" y="380" font-size="12" fill="#065f46" font-weight="600">荧光屏（放大像）</text>
  <text x="1190" y="200" font-size="12.5" fill="#475569" text-anchor="middle">电气工程师诺尔（Knoll）与</text>
  <text x="1190" y="220" font-size="12.5" fill="#475569" text-anchor="middle">博士生鲁斯卡（Ruska），</text>
  <text x="1190" y="240" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">柏林工业大学，1931 年春</text>
  <text x="1010" y="286" font-size="12" fill="#475569">电子枪发射的电子束穿透薄样品，经磁透镜链逐级放大，</text>
  <text x="1010" y="304" font-size="12" fill="#475569">在荧光屏上形成放大像。</text>
  <rect x="1081.502" y="350.225" width="216.99599999999998" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1190" y="364.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">1933 年改进机型首次超越光学显微镜</text>
  <rect x="30" y="438" width="1340" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="460.84" font-size="19" fill="#475569" font-weight="700">三、仪器演进年表：从物质波到单原子（1924–1986）</text>
  <line x1="70" y1="560" x2="1330" y2="560" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="114.1" cy="560" r="6.5" fill="#6d28d9"/>
  <line x1="114.1" y1="551" x2="114.1" y2="530" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="114.1" y="510" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1924 物质波假说</text>
  <text x="114.1" y="490" font-size="12" fill="#64748b" text-anchor="middle">德布罗意</text>
  <circle cx="240.10000000000002" cy="560" r="6.5" fill="#6d28d9"/>
  <line x1="240.10000000000002" y1="569" x2="240.10000000000002" y2="590" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="240.10000000000002" y="610" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1926 磁透镜理论</text>
  <text x="240.10000000000002" y="630" font-size="12" fill="#64748b" text-anchor="middle">布施，电子光学奠基</text>
  <circle cx="366.09999999999997" cy="560" r="6.5" fill="#dc2626"/>
  <line x1="366.09999999999997" y1="551" x2="366.09999999999997" y2="530" stroke="#dc2626" stroke-width="1.7"/>
  <text x="366.09999999999997" y="510" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1931 首台透射电镜</text>
  <text x="366.09999999999997" y="490" font-size="12" fill="#64748b" text-anchor="middle">诺尔与鲁斯卡，柏林工大</text>
  <circle cx="492.1" cy="560" r="6.5" fill="#dc2626"/>
  <line x1="492.1" y1="569" x2="492.1" y2="590" stroke="#dc2626" stroke-width="1.7"/>
  <text x="492.1" y="610" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1937 首张生物样品像</text>
  <text x="492.1" y="630" font-size="12" fill="#64748b" text-anchor="middle">硅藻，西门子</text>
  <circle cx="618.1" cy="560" r="6.5" fill="#0369a1"/>
  <line x1="618.1" y1="551" x2="618.1" y2="530" stroke="#0369a1" stroke-width="1.7"/>
  <text x="618.1" y="510" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1938 首台扫描透射电镜</text>
  <text x="618.1" y="490" font-size="12" fill="#64748b" text-anchor="middle">冯·阿登纳</text>
  <circle cx="744.1" cy="560" r="6.5" fill="#dc2626"/>
  <line x1="744.1" y1="569" x2="744.1" y2="590" stroke="#dc2626" stroke-width="1.7"/>
  <text x="744.1" y="610" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1939 首台商品电镜</text>
  <text x="744.1" y="630" font-size="12" fill="#64748b" text-anchor="middle">西门子交付</text>
  <circle cx="870.1" cy="560" r="6.5" fill="#0369a1"/>
  <line x1="870.1" y1="551" x2="870.1" y2="530" stroke="#0369a1" stroke-width="1.7"/>
  <text x="870.1" y="510" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1942 首台 SEM</text>
  <text x="870.1" y="490" font-size="12" fill="#64748b" text-anchor="middle">兹沃雷金，RCA</text>
  <circle cx="996.1" cy="560" r="6.5" fill="#0369a1"/>
  <line x1="996.1" y1="569" x2="996.1" y2="590" stroke="#0369a1" stroke-width="1.7"/>
  <text x="996.1" y="610" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1965 首台商品 SEM</text>
  <text x="996.1" y="630" font-size="12" fill="#64748b" text-anchor="middle">Stereoscan，剑桥仪器</text>
  <circle cx="1134.7" cy="560" r="6.5" fill="#0f766e"/>
  <line x1="1134.7" y1="551" x2="1134.7" y2="530" stroke="#0f766e" stroke-width="1.7"/>
  <text x="1134.7" y="510" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1970 单原子成像</text>
  <text x="1134.7" y="490" font-size="12" fill="#64748b" text-anchor="middle">克鲁，场发射 STEM</text>
  <circle cx="1267" cy="560" r="6.5" fill="#d97706"/>
  <line x1="1267" y1="569" x2="1267" y2="590" stroke="#d97706" stroke-width="1.7"/>
  <text x="1267" y="610" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1986 诺贝尔物理学奖</text>
  <text x="1267" y="630" font-size="12" fill="#64748b" text-anchor="middle">鲁斯卡（与宾尼希、罗雷尔）</text>
  <rect x="30" y="696" width="1340" height="284" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="718.84" font-size="19" fill="#475569" font-weight="700">四、与光学显微镜的分辨率对比：三个数量级的跃迁（对数标尺）</text>
