  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">比较基因组学与功能基因组学</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">直系 / 旁系同源与共线性（synteny）——CRISPR 文库 · scRNA-seq · 空间转录组 · Perturb-seq 与网络时代的系统生物学</text>
  <rect x="30" y="132" width="760" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、直系同源 vs 旁系同源：功能转移的判断依据</text>
  <rect x="120" y="182" width="100" height="22" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="170" y="197" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="600">祖先基因</text>
