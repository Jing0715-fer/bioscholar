  <text x="170" y="322" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">功能通常保守</text>
  <text x="170" y="344" font-size="11" fill="#64748b" text-anchor="middle">功能转移的首选依据</text>
  <rect x="138.28" y="155.8" width="63.44" height="20.4" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="170" y="170.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">直系同源</text>
