  <text x="878" y="270" font-size="11" fill="#475569" text-anchor="end" font-weight="700">小鼠 chr11</text>
  <text x="826" y="300" font-size="11" fill="#64748b">基因顺序保守的 syntenic block：跨物种基因 ID 映射 · 重现祖先染色体结构</text>
  <text x="826" y="330" font-size="11.5" fill="#475569">· 基因组以全基因组加倍（鱼类 / 植物常见）· 节段重复 · 染色体重排演化</text>
  <text x="826" y="354" font-size="11.5" fill="#475569">· 中性进化：小鼠-人约每 2 个中性位点 1 个固定差异</text>
  <text x="826" y="378" font-size="11.5" fill="#475569">· 必需基因可由跨物种保守性预测；泛基因组在细菌与植物中重新定义「物种的基因组」</text>
  <text x="826" y="412" font-size="12" fill="#1e293b" font-weight="700">Ka/Ks 比值：</text>
  <rect x="938.765" y="398.225" width="82.47" height="19.55" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="980" y="412.14" font-size="11.5" fill="#059669" text-anchor="middle">≪ 1 纯化选择</text>
  <rect x="1098.3675" y="398.225" width="63.265" height="19.55" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1130" y="412.14" font-size="11.5" fill="#475569" text-anchor="middle">≈ 1 中性</text>
  <rect x="1232.515" y="398.225" width="70.97" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1268" y="412.14" font-size="11.5" fill="#dc2626" text-anchor="middle">&gt; 1 正选择</text>
  <rect x="30" y="452" width="1340" height="508" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">三、功能基因组学：逐基因扰动 + 单细胞与原位解析</text>
  <rect x="56" y="496" width="250" height="122" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="1.6"/>
  <text x="181" y="522" font-size="14" fill="#be185d" text-anchor="middle" font-weight="700">基因敲除 / 敲低</text>
  <text x="181" y="548" font-size="11.5" fill="#475569" text-anchor="middle">CRISPR-Cas9 突变文库 → 全基因组筛选</text>
  <text x="181" y="565" font-size="11.5" fill="#475569" text-anchor="middle">（正筛 / 负筛）</text>
  <line x1="308" y1="556" x2="322" y2="556" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="326" y="496" width="250" height="122" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="451" y="522" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">RNAi 文库筛选</text>
  <text x="451" y="548" font-size="11.5" fill="#475569" text-anchor="middle">以 dsRNA / shRNA 文库系统性敲低</text>
  <line x1="578" y1="556" x2="592" y2="556" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="596" y="496" width="250" height="122" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="721" y="522" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="700">单细胞 RNA-seq</text>
  <text x="721" y="548" font-size="11.5" fill="#475569" text-anchor="middle">10x 微流控分选单细胞建库；</text>
  <text x="721" y="565" font-size="11.5" fill="#475569" text-anchor="middle">t-SNE / UMAP 聚类识别细胞类型与发育轨迹</text>
  <line x1="848" y1="556" x2="862" y2="556" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="866" y="496" width="250" height="122" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="991" y="522" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="700">空间转录组</text>
  <text x="991" y="548" font-size="11.5" fill="#475569" text-anchor="middle">保留组织学位置的表达谱——连接形态与分子</text>
  <line x1="1118" y1="556" x2="1132" y2="556" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="1136" y="496" width="250" height="122" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1261" y="522" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="700">Perturb-seq</text>
  <text x="1261" y="548" font-size="11.5" fill="#475569" text-anchor="middle">CRISPR 扰动 × 单细胞转录读出偶联</text>
  <text x="56" y="660" font-size="14.5" fill="#1e293b" font-weight="700">网络拓扑与动态：表型的「第二套遗传学」</text>
