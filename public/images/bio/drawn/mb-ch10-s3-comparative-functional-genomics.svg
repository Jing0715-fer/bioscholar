  <text x="646" y="684" font-size="15" fill="#1e293b" font-weight="700">系统生物学：从零件清单到「整机电路图」</text>
  <text x="646" y="716" font-size="12" fill="#475569">· 生命的信息不仅存于零件清单（基因目录），更存于网络拓扑与动态</text>
  <text x="646" y="748" font-size="12" fill="#475569">· 蛋白互作组：酵母双杂交 / 亲和纯化-质谱（AP-MS）绘制复合物图谱</text>
  <text x="646" y="780" font-size="12" fill="#475569">· 比较基因组学提供零件的同源关系；功能基因组学提供删除表型</text>
  <text x="646" y="814" font-size="12" fill="#475569">· 系统生物学整合二者去读「整机电路图」——基因调控网络 · 代谢网络 · 蛋白互作组共同构成表型的「第二套遗传学」</text>
