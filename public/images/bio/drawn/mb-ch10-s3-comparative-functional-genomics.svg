  <text x="520" y="322" font-size="12.5" fill="#831843" text-anchor="middle" font-weight="700">常发生功能分化</text>
  <text x="520" y="344" font-size="11" fill="#64748b" text-anchor="middle">亚功能化 / 新功能化</text>
  <rect x="488.28" y="155.8" width="63.44" height="20.4" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="520" y="170.32" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">旁系同源</text>
  <rect x="46" y="366" width="690" height="46" rx="9" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.3"/>
  <text x="391" y="394" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="600">判断常靠系统发生树而非单纯相似度——「最相似 ≠ 直系同源」是常见误读</text>
  <rect x="810" y="132" width="560" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="826" y="154.84" font-size="19" fill="#475569" font-weight="700">二、共线性（synteny）与基因组进化</text>
  <text x="826" y="180" font-size="12.5" fill="#1e293b" font-weight="700">人 17 号 ↔ 小鼠 11 号：Hox 簇共线</text>
