  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">中心截面定理：从二维投影到三维重构</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">p(x, y) = ∫ρ dz 的二维傅里叶变换＝三维傅里叶体积中过原点、以投影方向为法向的中心截面；欧拉角 φ/θ/ψ 参数化取向，θ 定法向、ψ 仅面内自旋</text>
  <rect x="30" y="132" width="690" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、实空间：投影＝三维密度沿视线的积分</text>
  <text x="50" y="184" font-size="13.5" fill="#1e293b" font-weight="700">p(x<tspan dy="3.0" font-size="9.7">r</tspan><tspan dy="-3.0">, y</tspan><tspan dy="3.0" font-size="9.7">r</tspan><tspan dy="-3.0">) = ∫ ρ(x</tspan><tspan dy="3.0" font-size="9.7">r</tspan><tspan dy="-3.0">, y</tspan><tspan dy="3.0" font-size="9.7">r</tspan><tspan dy="-3.0">, z</tspan><tspan dy="3.0" font-size="9.7">r</tspan><tspan dy="-3.0">) dz</tspan><tspan dy="3.0" font-size="9.7">r</tspan><tspan dy="-3.0">（Radon 1917，平行束特例）</tspan></text>
  <line x1="150" y1="192" x2="150" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="158" y="208" font-size="10" fill="#475569">e<tspan dy="-3.4" font-size="7.2">-</tspan></text>
  <polygon points="187.80281133230852,272 182.58304102908437,292.9398489868672 163.08960043041577,300.6622268941888 145.43418321146552,303.75595329218544 124.51149402587419,301.4153039606143 114.03452174768816,282.56041724607746 122.43582186347285,263.90642704304315 127.37996358251071,245.89508637752027 144.390339168705,232.98395192050947 164.82388439911227,239.54022092887635 172.8863546133059,257.29183298039186" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="158" cy="266" r="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <line x1="150" y1="312" x2="150" y2="326" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="105" y="332" width="90" height="74" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <ellipse cx="150" cy="369" rx="33" ry="25" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="150" y="426" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">取向 1（沿轴）</text>
  <line x1="360" y1="192" x2="360" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="368" y="208" font-size="10" fill="#475569">e<tspan dy="-3.4" font-size="7.2">-</tspan></text>
  <polygon points="386.9757891841525,272 390.6655384057761,291.70754487724906 376.32555181932764,307.7479720565881 355.215803334944,305.2748186956736 340.4574702385463,294.5532816115648 323.49696613847993,282.7182578143686 323.00753817120375,261.13803316805416 339.6783091125258,248.54751851459974 355.36884816239274,239.78963146016216 376.22451899514795,236.47325896920174 391.29757806813376,251.886267895731" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="368" cy="266" r="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <line x1="360" y1="312" x2="360" y2="326" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="315" y="332" width="90" height="74" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <rect x="326" y="353" width="68" height="32" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="360" y="426" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">取向 2（侧向）</text>
  <line x1="570" y1="192" x2="570" y2="224" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="578" y="208" font-size="10" fill="#475569">e<tspan dy="-3.4" font-size="7.2">-</tspan></text>
  <polygon points="607.3308706014816,272 593.9314573158988,287.3798137436977 584.440880588252,303.62111770887867 564.3883849981792,311.0296396340395 546.7642134632997,298.81552714132476 543.6248600696251,279.74443983851467 534.7167884011277,261.6399143186208 544.3204723215513,242.36424524084003 565.2776691904969,239.15546778105346 582.6019835516319,244.40550513410625 602.1923752252529,251.31121668036934" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="578" cy="266" r="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <line x1="570" y1="312" x2="570" y2="326" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="525" y="332" width="90" height="74" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <polygon points="542,384 602,376 578,346" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="570" y="426" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">取向 3（斜向）</text>
  <text x="50" y="452" font-size="10.5" fill="#475569">同一结构的大量拷贝以随机取向分散于薄冰，电子束平行穿过——每个颗粒影子都是一次积分投影；一维自由度被「抹平」，</text>
  <text x="50" y="467" font-size="10.5" fill="#475569">二维像独立携带振幅与相位。</text>
  <rect x="179.8234" y="498.65" width="360.3532" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="360" y="511.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">Crowther 判据：D = 100 Å、d = 4 Å → 约需 πD/d ≈ 80 个均匀视角</text>
  <text x="360" y="544" font-size="10" fill="#64748b" text-anchor="middle">判据只算几何账；考虑噪声后每个视角还须重复测量，实际颗粒数高出几个数量级（10⁵ 级数据集的由来）</text>
  <rect x="740" y="132" width="630" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="154.84" font-size="19" fill="#475569" font-weight="700">二、傅里叶空间：中心截面拼成三维体积</text>
  <text x="940" y="176" font-size="10" fill="#64748b" text-anchor="middle">分辨率壳层（1/d）</text>
  <circle cx="940" cy="320" r="125" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="831.0705124384273" y1="304.6909588943928" x2="1048.9294875615728" y2="335.3090411056072" stroke="#0f766e" stroke-width="3" opacity="0.75"/>
  <line x1="848.8058670189454" y1="258.48878061821785" x2="1031.1941329810545" y2="381.51121938178215" stroke="#6d28d9" stroke-width="3" opacity="0.75"/>
  <line x1="885" y1="224.73720558371176" x2="995" y2="415.2627944162882" stroke="#be185d" stroke-width="3" opacity="0.75"/>
  <line x1="940" y1="210" x2="940" y2="430" stroke="#0369a1" stroke-width="3" opacity="0.75"/>
  <line x1="988.2208261467986" y1="221.13265490709165" x2="891.7791738532014" y2="418.86734509290835" stroke="#b45309" stroke-width="3" opacity="0.75"/>
  <line x1="1026.6811828967393" y1="252.27723771417757" x2="853.3188171032606" y2="387.72276228582245" stroke="#059669" stroke-width="3" opacity="0.75"/>
  <line x1="1047.5962360807187" y1="297.1297140100465" x2="832.4037639192813" y2="342.8702859899535" stroke="#d97706" stroke-width="3" opacity="0.75"/>
  <circle cx="940" cy="320" r="5" fill="#1e293b"/>
  <line x1="1160" y1="235" x2="1010" y2="272" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <text x="1168" y="233" font-size="10.5" fill="#475569">中心截面（法向＝投影方向）</text>
  <line x1="1078" y1="320" x2="1168" y2="320" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <text x="1122" y="303" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">逆 3D FT</text>
  <polygon points="1277.5455503502417,320 1267.8335467698644,347.5274490227065 1241.3055164397151,355.70410069478294 1218.3931611436835,365.95157358416964 1190.0947991156181,360.2827492071398 1178.415427065363,333.678464775829 1190.0584991303429,309.7402496416397 1192.7374169217192,282.76699431635683 1217.4315051805552,267.35996227838586 1243.9215799292697,278.5675193057035 1258.9003384242399,298.21357538194087" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <text x="1225" y="392" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">三维密度复原</text>
  <text x="760" y="468" font-size="10.5" fill="#475569">投影的二维傅里叶变换＝三维傅里叶体积中过原点、以投影方向为法向的中心截面（Z = 0 时相位因子处处为 1）。</text>
  <text x="760" y="483" font-size="10.5" fill="#475569">成千上万个随机取向的切片稠密铺满体积，逆变换即复原三维密度——无须如衍射般攻坚相位问题。</text>
  <rect x="907.9141500000001" y="542.65" width="184.1717" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1000" y="555.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">切片足够多、足够匀 → 重构可行</text>
  <rect x="30" y="596" width="690" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="618.84" font-size="19" fill="#475569" font-weight="700">三、欧拉角（ZYZ 约定）：φ、θ、ψ</text>
  <line x1="170" y1="730" x2="170" y2="645" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="176" y="652" font-size="11" fill="#1e293b" font-weight="700">z</text>
  <line x1="170" y1="730" x2="285" y2="730" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="292" y="734" font-size="11" fill="#1e293b" font-weight="700">x</text>
  <path d="M 140,655 A 30,11 0 0 1 200,655" fill="none" stroke="#0369a1" stroke-width="1.8"/>
  <text x="206" y="650" font-size="12" fill="#0369a1" font-weight="700">φ</text>
  <line x1="170" y1="730" x2="255" y2="660" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <text x="262" y="655" font-size="10" fill="#4c1d95">投影方向</text>
  <path d="M 170,680 A 50,50 0 0 1 202,692" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="146" y="678" font-size="12" fill="#0f766e" font-weight="700">θ</text>
  <path d="M 200,672 A 14,6 0 0 1 224,688" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="228" y="668" font-size="12" fill="#b45309" font-weight="700">ψ</text>
  <text x="360" y="640" font-size="11" fill="#475569">θ 决定投影方向（中心截面法向与 z 轴的夹角）；ψ 仅面内自旋、</text>
  <text x="360" y="657" font-size="11" fill="#475569">不改变截面位置。取向搜索由粗到细：</text>
  <text x="360" y="674" font-size="11" fill="#475569">7.5°–15° 粗网格全局 → 0.5°–2° 局部精化；</text>
  <text x="360" y="691" font-size="11" fill="#475569">θ 趋零时 φ 与 ψ 退化（万向锁）。</text>
  <text x="520" y="770" font-size="10" fill="#64748b" text-anchor="middle">RELION（rot / tilt / psi）与 cryoSPARC 参数化等价，跨程序交换须显式换算</text>
  <rect x="740" y="596" width="630" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="618.84" font-size="19" fill="#475569" font-weight="700">四、同一数学、三条脉络；理想与真实的三重缺口</text>
  <rect x="804.02" y="638.65" width="131.95999999999998" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="870" y="651.96" font-size="11" fill="#075985" text-anchor="middle">医学 CT（1979 诺奖）</text>
  <rect x="982.07" y="638.65" width="119.86" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1042" y="651.96" font-size="11" fill="#78350f" text-anchor="middle">电子断层（第 9 章）</text>
  <rect x="1142.3" y="638.65" width="143.39999999999998" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1214" y="651.96" font-size="11" fill="#4c1d95" text-anchor="middle">单颗粒分析（第 7–8 章）</text>
  <text x="760" y="686" font-size="10.5" fill="#475569">Radon 1917 建立积分几何；1968 年 DeRosier 与 Klug 借螺旋对称重构 TMV（Klug 1982 年诺贝尔化学奖）；</text>
  <text x="760" y="701" font-size="10.5" fill="#475569">Cormack 与 Hounsfield 因 CT 共享 1979 年诺贝尔生理学或医学奖。</text>
  <text x="760" y="742" font-size="11" fill="#1e293b" font-weight="700">真实投影的三重非理想性：</text>
  <rect x="818.555" y="763.075" width="122.89" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="880" y="775.78" font-size="10.5" fill="#991b1b" text-anchor="middle">CTF 调制（零点湮灭）</text>
  <rect x="984.25" y="763.075" width="131.5" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1050" y="775.78" font-size="10.5" fill="#991b1b" text-anchor="middle">束致运动（电影可校正）</text>
  <rect x="1151.205" y="763.075" width="137.59000000000003" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1220" y="775.78" font-size="10.5" fill="#991b1b" text-anchor="middle">低剂量噪声（SNR &lt; 0.1）</text>
</svg>