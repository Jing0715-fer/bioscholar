<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">脊髓上的运动控制：易化-抑制平衡、皮质脊髓束与上下运动神经元综合征</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">约 75–90% 皮质脊髓纤维交叉为侧束管远端精细动作；痉挛与弛缓的相反体征用于定位诊断</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、脑干易化-抑制平衡与皮质脊髓束交叉</text>
  <rect x="60" y="196" width="300" height="150" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.8"/>
  <text x="76" y="222" font-size="13" fill="#075985" font-weight="700">脑干下行系统</text>
  <text x="76" y="246" font-size="11" fill="#475569">网状脊髓束与前庭脊髓束各含抑制性与易化性成分，</text>
  <text x="76" y="262" font-size="11" fill="#475569">其平衡决定肌张力基线。</text>
  <text x="76" y="316" font-size="10.5" fill="#dc2626" font-weight="700">上下丘之间横断 → 易化占优 → 去大脑强直</text>
  <text x="76" y="331" font-size="10.5" fill="#dc2626" font-weight="700">（伸肌张力亢进）——平衡失衡的经典例证。</text>
  <rect x="390" y="196" width="270" height="150" rx="9" fill="#ccfbf1" fill-opacity="0.4" stroke="#0f766e" stroke-width="1.8"/>
  <text x="406" y="222" font-size="13" fill="#134e4a" font-weight="700">皮质脊髓束</text>
  <text x="406" y="246" font-size="11" fill="#475569">起自中央前回等区锥体细胞，经放射冠、</text>
  <text x="406" y="262" font-size="11" fill="#475569">内囊后肢、大脑脚底、锥体下行。</text>
  <text x="406" y="316" font-size="10.5" fill="#475569">约 75–90% 在延髓颈髓交界处交叉为侧束</text>
  <text x="406" y="331" font-size="10.5" fill="#475569">（支配远端精细动作）；前束多在节段水平交叉</text>
  <text x="406" y="346" font-size="10.5" fill="#475569">（支配中轴近端肌）。</text>
  <text x="60" y="372" font-size="11" fill="#475569">定位价值：内囊病变致对侧痉挛性偏瘫而中轴肌相对保留（双侧前束冗余支配）——交叉平面与束别分工共同解释临床表现。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、M1、PMA 与 SMA：运动小人 + 两类启动</text>
  <rect x="740" y="200" width="190" height="240" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.8"/>
  <text x="835" y="226" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">M1（4 区）</text>
  <text x="756" y="250" font-size="11" fill="#475569">以运动小人拓扑代表对侧躯体；</text>
  <text x="756" y="265" font-size="11" fill="#475569">Betz 细胞</text>
  <text x="756" y="280" font-size="11" fill="#475569">（直径可达约 100 μm，</text>
  <text x="756" y="295" font-size="11" fill="#475569">人类最大神经元之列）</text>
  <text x="756" y="310" font-size="11" fill="#475569">人脑约含 3 万个——经典形态学标志。</text>
  <rect x="950" y="200" width="190" height="110" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1045" y="226" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">PMA（外侧前运动区）</text>
  <text x="966" y="250" font-size="11" fill="#475569">偏重外部线索触发动作：</text>
  <text x="966" y="265" font-size="11" fill="#475569">看见杯子把手而伸手。</text>
  <rect x="950" y="330" width="190" height="110" rx="9" fill="#ede9fe" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1045" y="356" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">SMA（辅助运动区）</text>
  <text x="966" y="380" font-size="11" fill="#475569">偏重内在启动与序列计划：</text>
  <text x="966" y="395" font-size="11" fill="#475569">自发的复杂序列排练</text>
  <text x="966" y="410" font-size="11" fill="#475569">（「心理运动排练」时激活）。</text>
  <text x="835" y="470" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">运动小人：手与唇的代表区不成比例地大</text>
  <text x="1160" y="250" font-size="10.5" fill="#64748b">M1 损伤并非全瘫：</text>
  <text x="1160" y="265" font-size="10.5" fill="#64748b">皮层起源仅占下行纤维的一部分，</text>
  <text x="1160" y="280" font-size="10.5" fill="#64748b">脑干通路可维持姿势与粗大动作——「姿势先行、</text>
  <text x="1160" y="295" font-size="10.5" fill="#64748b">皮层精修」。</text>
  <rect x="30" y="578" width="1340" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、巴宾斯基征与上、下运动神经元综合征：定位诊断基本功</text>
  <rect x="60" y="648" width="380" height="170" rx="9" fill="#fef3c7" fill-opacity="0.45" stroke="#d97706" stroke-width="1.8"/>
  <text x="76" y="676" font-size="13.5" fill="#92400e" font-weight="700">巴宾斯基征阳性</text>
  <text x="76" y="702" font-size="11" fill="#475569">划足底外侧 → 拇趾背伸伴四趾扇形展开——本质是原始回撤模式的脱抑制释放。</text>
  <text x="76" y="718" font-size="11" fill="#475569">见于皮质脊髓束损伤与 2 岁前婴儿（髓鞘未熟）。</text>
  <text x="76" y="786" font-size="11" fill="#92400e" font-weight="700">上运动神经元损伤的「病理征」窗口。</text>
  <rect x="480" y="648" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="545" y="675.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">项目</text>
  <rect x="610" y="648" width="360" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="675.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">下运动神经元综合征</text>
  <rect x="970" y="648" width="370" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1155" y="675.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">上运动神经元综合征</text>
  <rect x="480" y="692" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="545" y="719.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">肌张力</text>
  <rect x="610" y="692" width="360" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="719.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">弛缓（失去最后公路）</text>
  <rect x="970" y="692" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1155" y="719.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">痉挛（易化失衡占优）</text>
  <rect x="480" y="736" width="860" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="480" y="736" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="545" y="763.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">腱反射</text>
  <rect x="610" y="736" width="360" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="763.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">消失或减弱</text>
  <rect x="970" y="736" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1155" y="763.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">亢进</text>
  <rect x="480" y="780" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="545" y="807.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">病理征</text>
  <rect x="610" y="780" width="360" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="807.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">无</text>
  <rect x="970" y="780" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1155" y="807.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">巴宾斯基征阳性</text>
  <rect x="480" y="824" width="860" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="480" y="824" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="545" y="851.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">肌萎缩</text>
  <rect x="610" y="824" width="360" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="851.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">显著萎缩 + 束颤</text>
  <rect x="970" y="824" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1155" y="851.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">轻度失用性萎缩</text>
  <rect x="480" y="868" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="545" y="895.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">损伤定位</text>
  <rect x="610" y="868" width="360" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="895.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">前角 / 前根 / 周围神经</text>
  <rect x="970" y="868" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1155" y="895.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">皮层 / 内囊 / 脑干 / 脊髓侧束</text>
  <text x="480" y="920" font-size="11" fill="#64748b">各项相反的两组体征把病变「定位到解剖平面」：弛缓 + 反射消失指向最后公路（α 神经元本身），痉挛 + 反射亢进指向下行通路。</text>
</svg>