    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">宿主因素与免疫致病：年龄、ADE、CD4 与长新冠</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">先天性CMV为最常见先天感染；Dengvaxia约83万学童与灭活RSV住院率八成；HIV年均CD4滑坡50–100/μL、低于200进艾滋病期；柏林病人2008；长新冠约6%</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、年龄两端：不成熟与衰老的免疫</text>
  <rect x="70" y="220" width="340" height="240" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="70" y1="460" x2="70" y2="466" stroke="#475569" stroke-width="1.8"/>
  <text x="70" y="482" font-size="13" fill="#64748b" text-anchor="middle">出生</text>
  <line x1="240" y1="460" x2="240" y2="466" stroke="#475569" stroke-width="1.8"/>
  <text x="240" y="482" font-size="13" fill="#64748b" text-anchor="middle">青壮年</text>
  <line x1="410" y1="460" x2="410" y2="466" stroke="#475569" stroke-width="1.8"/>
  <text x="410" y="482" font-size="13" fill="#64748b" text-anchor="middle">老年</text>
  <line x1="64" y1="460" x2="70" y2="460" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="464" font-size="13" fill="#64748b" text-anchor="end">低</text>
  <line x1="64" y1="220" x2="70" y2="220" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="224" font-size="13" fill="#64748b" text-anchor="end">高</text>
  <text x="242" y="196" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">重症／感染风险（示意）</text>
  <path d="M70,239.2 C76.8,254.0 93.8,298.4 110.8,328 C127.8,357.6 147.6,399.6 172,416.8 C196.4,434.0 231.5,436.0 257,431.2 C282.5,426.4 305.2,410.4 325,388 C344.8,365.6 361.8,320.8 376,296.79999999999995 C390.2,272.8 404.3,252.8 410,244" fill="none" stroke="#dc2626" stroke-width="2.8"/>
  <rect x="117.323" y="227.5" width="65.35400000000001" height="17" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="150" y="239.6" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">先天性 CMV</text>
  <rect x="303.4" y="241.5" width="53.2" height="17" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="253.6" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">免疫衰老</text>
  <text x="440" y="210" font-size="10.5" fill="#475569">先天性 CMV 感染为最常见先天感染，</text>
  <text x="440" y="225" font-size="10.5" fill="#475569">也是非遗传性耳聋的首因；</text>
  <text x="440" y="240" font-size="10.5" fill="#475569">免疫衰老使老年流感与带状疱疹风险陡升。</text>
  <text x="440" y="292" font-size="10.5" fill="#64748b">同一病毒在生命两端换上两副面孔：</text>
  <text x="440" y="307" font-size="10.5" fill="#64748b">宫内经胎盘的温和持续 vs 老年神经节的再激活。</text>
  <text x="46" y="500" font-size="10.5" fill="#64748b">年龄并非单纯的「免疫力刻度」，而是重塑病毒病表现谱的独立维度。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、抗体依赖性增强（ADE）与疫苗教训</text>
  <circle cx="790" cy="260" r="16" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="2.4"/>
  <line x1="806" y1="260" x2="818" y2="260" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="818" cy="260" r="4.6" fill="#dc2626"/>
  <line x1="803.856406460551" y1="268" x2="814.2487113059643" y2="274" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="814.2487113059643" cy="274" r="4.6" fill="#dc2626"/>
  <line x1="798" y1="273.856406460551" x2="804" y2="284.24871130596426" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="804" cy="284.24871130596426" r="4.6" fill="#dc2626"/>
  <line x1="790" y1="276" x2="790" y2="288" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="790" cy="288" r="4.6" fill="#dc2626"/>
  <line x1="782" y1="273.856406460551" x2="776" y2="284.24871130596426" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="776" cy="284.24871130596426" r="4.6" fill="#dc2626"/>
  <line x1="776.143593539449" y1="268" x2="765.7512886940357" y2="274" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="765.7512886940357" cy="274" r="4.6" fill="#dc2626"/>
  <line x1="774" y1="260" x2="762" y2="260" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="762" cy="260" r="4.6" fill="#dc2626"/>
  <line x1="776.143593539449" y1="252" x2="765.7512886940357" y2="246" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="765.7512886940357" cy="246" r="4.6" fill="#dc2626"/>
  <line x1="782" y1="246.143593539449" x2="776" y2="235.75128869403574" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="776" cy="235.75128869403574" r="4.6" fill="#dc2626"/>
  <line x1="790" y1="244" x2="790" y2="232" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="790" cy="232" r="4.6" fill="#dc2626"/>
  <line x1="798" y1="246.14359353944897" x2="804" y2="235.7512886940357" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="804" cy="235.7512886940357" r="4.6" fill="#dc2626"/>
  <line x1="803.856406460551" y1="252" x2="814.2487113059643" y2="246" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="814.2487113059643" cy="246" r="4.6" fill="#dc2626"/>
  <path d="M 781.2,260.0 L 782.3,265.3 L 783.4,266.5 L 784.5,262.9 L 785.6,257.0 L 786.7,253.4 L 787.8,254.8 L 788.9,260.1 L 790.0,265.3 L 791.1,266.5 L 792.2,262.8 L 793.3,256.9 L 794.4,253.4 L 795.5,254.9 L 796.6,260.2 L 797.7,265.4 L 798.8,266.5 " fill="none" opacity="0.85" stroke="#dc2626" stroke-width="4.4"/>
  <path d="M 830,244 l -6,16 M 830,244 l 6,16 M 830,244 l 0,18" fill="none" stroke="#be185d" stroke-width="2.4"/>
  <path d="M 852,240 l -6,16 M 852,240 l 6,16 M 852,240 l 0,18" fill="none" stroke="#be185d" stroke-width="2.4"/>
  <text x="830" y="296" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">次中和抗体</text>
  <line x1="880" y1="260" x2="946" y2="260" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <text x="912" y="244" font-size="9.5" fill="#831843" text-anchor="middle">Fc 段</text>
  <ellipse cx="1010" cy="260" rx="52" ry="34" fill="#f8fafc" stroke="#0369a1" stroke-width="2"/>
  <text x="1010" y="256" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">Fc 受体细胞</text>
  <text x="1010" y="276" font-size="9" fill="#64748b" text-anchor="middle">（单核／巨噬细胞）</text>
  <line x1="1074" y1="260" x2="1130" y2="260" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="1102" y="244" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">摄取↑</text>
  <rect x="1134" y="236" width="190" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1229" y="256" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">感染增强</text>
  <text x="1229" y="274" font-size="9.5" fill="#475569" text-anchor="middle">高病毒载量→重症</text>
  <text x="726" y="330" font-size="10.5" fill="#475569">Dengvaxia（黄热 17D 骨架、表达四型 prM/E）2015–2016 年在菲律宾接种约 83 万名学童；2017 年公布的分析显示：</text>
  <text x="726" y="345" font-size="10.5" fill="#475569">血清阴性接种者日后感染登革的重症风险反增——确立按血清状态分层评估疫苗的原则。</text>
  <text x="726" y="392" font-size="10.5" fill="#64748b">更早的教训：1960 年代中期福尔马林灭活 RSV 疫苗——接种组住院率高达八成、对照组仅约百分之五，并有幼儿死亡；</text>
  <text x="726" y="407" font-size="10.5" fill="#64748b">机制指向 Th2 偏斜与非中和抗体。</text>
  <text x="726" y="436" font-size="10.5" fill="#64748b">同一机制（疫苗源性免疫偏斜）两度改写疫苗审评原则。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、HIV：CD4 耗竭的坡道与宿主遗传</text>
  <rect x="70" y="680" width="330" height="170" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="70" y1="807.5" x2="400" y2="807.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="152.5" y1="850" x2="152.5" y2="680" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="70" y1="765" x2="400" y2="765" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="235" y1="850" x2="235" y2="680" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="70" y1="722.5" x2="400" y2="722.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="317.5" y1="850" x2="317.5" y2="680" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="70" y1="850" x2="70" y2="856" stroke="#475569" stroke-width="1.8"/>
  <text x="70" y="872" font-size="13" fill="#64748b" text-anchor="middle">感染</text>
  <line x1="218.5" y1="850" x2="218.5" y2="856" stroke="#475569" stroke-width="1.8"/>
  <text x="218.5" y="872" font-size="13" fill="#64748b" text-anchor="middle">4</text>
  <line x1="317.5" y1="850" x2="317.5" y2="856" stroke="#475569" stroke-width="1.8"/>
  <text x="317.5" y="872" font-size="13" fill="#64748b" text-anchor="middle">8</text>
  <line x1="400" y1="850" x2="400" y2="856" stroke="#475569" stroke-width="1.8"/>
  <text x="400" y="872" font-size="13" fill="#64748b" text-anchor="middle">10（年）</text>
  <line x1="64" y1="850" x2="70" y2="850" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="854" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="64" y1="809.2" x2="70" y2="809.2" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="813.2" font-size="13" fill="#64748b" text-anchor="end">200</text>
  <line x1="64" y1="680" x2="70" y2="680" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="684" font-size="13" fill="#64748b" text-anchor="end">1000</text>
  <line x1="70" y1="809.2" x2="400" y2="809.2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="353.8" y="799.2" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">200/μL</text>
  <path d="M70,688.5 C73.3,706.4 81.0,782.9 89.8,795.6 C98.6,808.4 101.4,767.8 122.80000000000001,765 C144.3,762.2 186.1,772.9 218.5,778.6 C250.9,784.3 287.3,792.8 317.5,799 C347.8,805.2 386.3,813.2 400,816" fill="none" stroke="#0369a1" stroke-width="2.8"/>
  <text x="155" y="700" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">急性期：肠道 CD4 急性耗竭</text>
  <text x="274" y="742" font-size="9.5" fill="#475569" text-anchor="middle">慢性期：年均下滑约 50–100 个/μL</text>
  <text x="290" y="836" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">艾滋病期（约 8–10 年）</text>
  <text x="440" y="650" font-size="10.5" fill="#475569">CCR5Δ32 纯合子对 R5 型 HIV 高度抵抗、</text>
  <text x="440" y="665" font-size="10.5" fill="#475569">杂合子进展迟缓——「柏林病人」2008 年经 CCR5Δ32 纯合干细胞移植实现 HIV 治愈首例；</text>
  <text x="440" y="680" font-size="10.5" fill="#475569">HLA-B57/B27 关联慢进展。</text>
  <text x="440" y="760" font-size="10.5" fill="#64748b">ART 重建免疫可诱发免疫重建炎症综合征</text>
  <text x="440" y="775" font-size="10.5" fill="#64748b">（IRIS）——治愈的代价之一。</text>
  <text x="46" y="890" font-size="10.5" fill="#475569">急性期病毒与免疫的拉锯先清空肠道 CD4；慢性免疫激活、旁观者凋亡与胸腺功能衰竭使外周 CD4 计数缓慢滑坡。</text>
  <rect x="710" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="608.84" font-size="19" fill="#475569" font-weight="700">四、免疫缺陷宿主与长新冠</text>
  <text x="726" y="644" font-size="11.5" fill="#1e293b" font-weight="700">免疫控制的边界（移植／原发免疫缺陷）：</text>
  <rect x="754.98915" y="667.075" width="70.02170000000001" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="790" y="679.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">CMV 再激活</text>
  <rect x="922.9343" y="667.075" width="74.1314" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="960" y="679.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">BK 病毒肾病</text>
  <rect x="1073.35915" y="667.075" width="113.2817" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1130" y="679.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">EBV 移植后淋巴增殖</text>
  <text x="726" y="708" font-size="10.5" fill="#475569">TLR3-UNC93B1 缺陷对应儿童重症疱疹脑炎——「谁的免疫缺哪块，哪种病毒就趁虚而入」。</text>
  <text x="726" y="756" font-size="11.5" fill="#1e293b" font-weight="700">长新冠：多条假说并行：</text>
  <rect x="750.555" y="779.075" width="78.89" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="790" y="791.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">持续抗原假说</text>
  <rect x="931.37" y="779.075" width="57.26" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="960" y="791.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">免疫失调</text>
  <rect x="1076.7775" y="779.075" width="46.445" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1100" y="791.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">微血栓</text>
  <rect x="1174.9891499999999" y="779.075" width="70.02170000000001" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1210" y="791.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">EBV 再激活</text>
  <text x="726" y="820" font-size="10.5" fill="#475569">WHO 委托的模型估计：2020–2021 年间约 6% 的症状性感染者在三个月后仍带至少一种后遗症状，</text>
  <text x="726" y="835" font-size="10.5" fill="#475569">住院者中升至五成上下——女性与中年更高危。</text>
  <text x="726" y="874" font-size="10.5" fill="#64748b">患病率不同口径从百分之几到百分之三十不等——定义与研究人群差异所致。</text>
  <text x="726" y="920" font-size="10.5" fill="#64748b">宿主因素与病毒结局互为镜像：免疫年龄、遗传与既有免疫史共同决定同一感染的不同命运。</text>
</svg>