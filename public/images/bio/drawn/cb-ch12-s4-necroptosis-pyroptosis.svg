  <text x="140" y="313.06" font-size="8.5" fill="#78350f" text-anchor="middle" font-weight="700">复合体 Ⅰ（TRADD·TRAF2·RIPK1·cIAP）</text>
  <line x1="140" y1="330" x2="140" y2="354" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <rect x="23.71712499999998" y="370.775" width="232.56575000000004" height="14.45" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="381.06" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">caspase-8 失活（病毒抑制子 / 药物）→ RIPK1 去泛素化</text>
  <line x1="140" y1="398" x2="140" y2="420" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <rect x="80" y="424" width="120" height="44" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2.2"/>
  <text x="140" y="442" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">坏死小体</text>
  <text x="140" y="458" font-size="8.5" fill="#831843" text-anchor="middle">RIPK1×RIPK3</text>
  <line x1="204" y1="446" x2="280" y2="446" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <text x="292" y="428" font-size="9" fill="#475569">RIPK1 磷酸化并募集 RIPK3（相互磷酸化）</text>
  <text x="292" y="448" font-size="9" fill="#475569">RIPK3 磷酸化 MLKL（混合谱系激酶结构域样蛋白）</text>
  <text x="292" y="468" font-size="9" fill="#475569">p-MLKL 寡聚插入细胞膜 → 成孔、膜破裂</text>
