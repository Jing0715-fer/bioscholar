  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">坏死性凋亡与焦亡：受调控的炎症性死亡</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">坏死性凋亡＝RIPK1-RIPK3-MLKL 轴（caspase-8 抑制时）→DAMPs 强炎；焦亡＝NLRP3→caspase-1→GSDMD 成孔＋IL-1β；铁死亡＝GPX4 失活脂质过氧化</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、坏死性凋亡（necroptosis）：caspase-8 被抑制时的备用通路</text>
  <text x="64" y="184" font-size="9.5" fill="#475569">由死亡受体（TNFR1）在 caspase-8 被抑制时启动的&quot;备用&quot;死亡方式——兼具坏死形态（膜破裂、炎症）与程序性（信号依赖）特征。</text>
