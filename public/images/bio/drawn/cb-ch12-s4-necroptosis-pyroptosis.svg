  <text x="64" y="544" font-size="9" fill="#64748b">生理意义：对抗能抑制 caspase 的病毒（痘病毒、HSV）的防御机制；</text>
  <text x="64" y="556.5" font-size="9" fill="#64748b">参与炎症性疾病（克罗恩病、脊髓损伤）。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
