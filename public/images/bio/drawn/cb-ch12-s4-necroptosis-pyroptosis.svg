  <text x="250" y="849.6" font-size="10" fill="#4c1d95" text-anchor="middle">铁死亡（ferroptosis）：铁依赖脂质过氧化（GPX4 失活）——线粒体缩小变密，肿瘤治疗新方向</text>
  <text x="60" y="890" font-size="10" fill="#475569">医学意义：促凋亡与抑制异常存活是肿瘤治疗核心（化疗、放疗多经 p53-线粒体途径诱导凋亡）；神经退行病（AD、PD）与缺血再灌注损伤则以过度凋亡 / 坏死为靶点——RIPK1 抑制剂阻断 necroptosis 成为治疗策略。</text>
  <text x="60" y="940" font-size="10" fill="#64748b">受调控坏死（regulated necrosis）兼具坏死形态与程序性信号——&quot;坏死并非总是被动无序&quot;是当代细胞死亡研究的核心更新。</text>
