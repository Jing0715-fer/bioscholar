<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">生理学的对象、方法与整合观</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">整体→系统→器官→细胞→分子五级整合，还原与综合互为镜像；急性/慢性、在体/离体实验互补；1628 年哈维以定量实验开创实验生理学</text>
  <rect x="30" y="132" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、从分子到整体：生理学的层级与整合</text>
  <rect x="285" y="178" width="150" height="56" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="360" y="202" font-size="14.5" fill="#4c1d95" text-anchor="middle" font-weight="700">整体（个体）</text>
  <text x="360" y="222" font-size="11.5" fill="#475569" text-anchor="middle">行为、体温、整体适应</text>
  <rect x="240" y="240" width="240" height="56" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="360" y="264" font-size="14.5" fill="#134e4a" text-anchor="middle" font-weight="700">器官系统</text>
  <text x="360" y="284" font-size="11.5" fill="#475569" text-anchor="middle">循环、呼吸、消化功能</text>
  <rect x="195" y="302" width="330" height="56" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="360" y="326" font-size="14.5" fill="#065f46" text-anchor="middle" font-weight="700">器官</text>
  <text x="360" y="346" font-size="11.5" fill="#475569" text-anchor="middle">心脏泵血、肾滤过</text>
  <rect x="160" y="364" width="400" height="56" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="360" y="388" font-size="14.5" fill="#075985" text-anchor="middle" font-weight="700">细胞</text>
  <text x="360" y="408" font-size="11.5" fill="#475569" text-anchor="middle">心肌细胞收缩、神经元放电</text>
  <rect x="130" y="426" width="460" height="56" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="360" y="450" font-size="14.5" fill="#78350f" text-anchor="middle" font-weight="700">分子</text>
  <text x="360" y="470" font-size="11.5" fill="#475569" text-anchor="middle">离子通道、肌钙蛋白、酶</text>
  <text x="88" y="192" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">还原（分析）</text>
  <line x1="88" y1="208" x2="88" y2="460" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="640" y="192" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">整合（综合）</text>
  <line x1="640" y1="460" x2="640" y2="208" stroke="#059669" stroke-width="2" marker-end="url(#arr-ok)"/>
  <text x="50" y="506" font-size="11.5" fill="#475569">机制在分子层面、意义在整体层面——「还原」拆解机器，「整合」重装功能，两个方向互为镜像、缺一不可。</text>
  <rect x="710" y="132" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、实验方法：急性与慢性、在体与离体</text>
  <text x="730" y="185" font-size="12.5" fill="#475569">按实验时程与机体完整性分类：</text>
  <rect x="730" y="205" width="95" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="777.5" y="232.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">方法</text>
  <rect x="825" y="205" width="190" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="232.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">要点</text>
  <rect x="1015" y="205" width="190" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1110" y="232.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">代表</text>
  <rect x="1205" y="205" width="145" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1277.5" y="232.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">主要局限</text>
  <rect x="730" y="249" width="95" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="777.5" y="282.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">急性在体</text>
  <rect x="825" y="249" width="190" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="282.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">麻醉下短时手术观测</text>
  <rect x="1015" y="249" width="190" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1110" y="282.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">动脉血压神经调节</text>
  <rect x="1205" y="249" width="145" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1277.5" y="282.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">急性扰乱、存活短</text>
  <rect x="730" y="305" width="620" height="56" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="305" width="95" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="777.5" y="338.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">急性离体</text>
  <rect x="825" y="305" width="190" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="338.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">离体器官/细胞灌流记录</text>
  <rect x="1015" y="305" width="190" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1110" y="338.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">离体蛙心灌流、膜片钳</text>
  <rect x="1205" y="305" width="145" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1277.5" y="338.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">脱离整体调节</text>
  <rect x="730" y="361" width="95" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="777.5" y="394.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">慢性在体</text>
  <rect x="825" y="361" width="190" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="394.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">预置瘘管/电极，恢复后长期观察</text>
  <rect x="1015" y="361" width="190" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1110" y="394.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">巴甫洛夫小胃、慢性导管</text>
  <rect x="1205" y="361" width="145" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1277.5" y="394.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">周期长、成本高</text>
  <text x="730" y="445" font-size="11.5" fill="#475569">急性实验回答「机制在隔离条件下如何运作」，慢性实验回答「完整机体在自然生活中如何调节」——二者互补，</text>
  <text x="730" y="462" font-size="11.5" fill="#475569">结论须回到整体语境整合。</text>
  <rect x="30" y="548" width="1340" height="437" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="570.84" font-size="19" fill="#475569" font-weight="700">三、科学循环：功能问题 → 假说 → 实验 → 定量模型</text>
  <rect x="110" y="610" width="250" height="88" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="235" y="640" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">① 功能问题</text>
  <text x="235" y="668" font-size="11.5" fill="#475569" text-anchor="middle">现象观察：血压为何自动回升？</text>
  <rect x="450" y="610" width="250" height="88" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="575" y="640" font-size="15" fill="#4c1d95" text-anchor="middle" font-weight="700">② 假说</text>
  <text x="575" y="668" font-size="11.5" fill="#475569" text-anchor="middle">可检验的机制猜想</text>
  <rect x="450" y="790" width="250" height="88" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="575" y="820" font-size="15" fill="#134e4a" text-anchor="middle" font-weight="700">③ 实验</text>
  <text x="575" y="848" font-size="11.5" fill="#475569" text-anchor="middle">控制变量、定量测量</text>
  <rect x="110" y="790" width="250" height="88" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="235" y="820" font-size="15" fill="#78350f" text-anchor="middle" font-weight="700">④ 定量模型</text>
  <text x="235" y="848" font-size="11.5" fill="#475569" text-anchor="middle">数学描述 → 新预测</text>
  <line x1="362" y1="654" x2="446" y2="654" stroke="#334155" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="575" y1="700" x2="575" y2="786" stroke="#334155" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="448" y1="834" x2="364" y2="834" stroke="#334155" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="235" y1="786" x2="235" y2="700" stroke="#334155" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="405" y="749" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">循环迭代</text>
  <text x="730" y="610" font-size="15" fill="#1e293b" font-weight="700">生理学的奠基时刻</text>
  <rect x="732.035" y="629.375" width="49.93" height="21.25" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="757" y="644.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">1628</text>
  <text x="800" y="645" font-size="12.5" fill="#475569">哈维《心血运动论》：定量实验证明血液循环</text>
  <rect x="732.035" y="679.375" width="49.93" height="21.25" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="757" y="694.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">1865</text>
  <text x="800" y="695" font-size="12.5" fill="#475569">贝尔纳提出「内环境」：细胞直接生活的液体环境</text>
  <rect x="732.035" y="729.375" width="49.93" height="21.25" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="757" y="744.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">1926</text>
  <text x="800" y="745" font-size="12.5" fill="#475569">坎农创造「稳态」（homeostasis）一词</text>
  <rect x="732.035" y="779.375" width="49.93" height="21.25" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="757" y="794.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">1948</text>
  <text x="800" y="795" font-size="12.5" fill="#475569">维纳《控制论》：反馈工程模型进入生理学</text>
  <text x="730" y="852" font-size="12" fill="#475569">生理学以「功能」为问题意识：结构为何如此，须由其在整体功能中的角色解释；</text>
  <text x="730" y="870" font-size="12" fill="#475569">一切机制假说最终都要接受可重复、可定量的实验检验。</text>
</svg>