    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">电磁透镜像差与分辨率：球差、色差、像散与 Scherzer 最优欠焦</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">球差Δf=Cs·α<tspan dy="-5.8" font-size="12.2">2</tspan><tspan dy="5.8">、色差r_c≈Cc·α·(ΔE/E)、像散以Thon环正圆为判据；Scherzer分辨率δ≈0.66·Cs</tspan><tspan dy="-5.8" font-size="12.2">1/4</tspan><tspan dy="5.8">·λ</tspan><tspan dy="-5.8" font-size="12.2">3/4</tspan><tspan dy="5.8">：300kV、Cs=1.2mm得约0.21nm、Δf_S≈−58nm</tspan></text>
  <rect x="30" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、球差：旋转对称透镜的宿命</text>
  <line x1="70" y1="280" x2="640" y2="280" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <ellipse cx="200" cy="280" rx="13" ry="64" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="130" y="236" font-size="10.5" fill="#64748b" text-anchor="middle">平行入射（不同孔径角 α）</text>
  <line x1="75" y1="248" x2="200" y2="248" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="200" y1="248" x2="352" y2="280" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="352" y1="280" x2="470" y2="302" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="75" y1="312" x2="200" y2="312" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="200" y1="312" x2="352" y2="280" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="352" y1="280" x2="470" y2="258" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="75" y1="263" x2="200" y2="263" stroke="#d97706" stroke-width="1.6"/>
  <line x1="200" y1="263" x2="405" y2="280" stroke="#d97706" stroke-width="1.6"/>
  <line x1="405" y1="280" x2="510" y2="290" stroke="#d97706" stroke-width="1.6"/>
  <line x1="75" y1="297" x2="200" y2="297" stroke="#d97706" stroke-width="1.6"/>
  <line x1="200" y1="297" x2="405" y2="280" stroke="#d97706" stroke-width="1.6"/>
  <line x1="405" y1="280" x2="510" y2="270" stroke="#d97706" stroke-width="1.6"/>
  <circle cx="352" cy="280" r="4" fill="#dc2626"/>
  <circle cx="405" cy="280" r="4" fill="#d97706"/>
  <text x="330" y="256" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">远轴焦点（提前）</text>
  <text x="435" y="256" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">近轴焦点</text>
  <text x="470" y="240" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">最小弥散盘 r_s ≈ Cs·α<tspan dy="-3.6" font-size="7.6">3</tspan></text>
  <line x1="352" y1="316" x2="405" y2="316" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-bad)" marker-start="url(#arr-bad)"/>
  <text x="378" y="340" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Δf = Cs·α<tspan dy="-4.1" font-size="8.6">2</tspan></text>
  <circle cx="470" cy="280" r="22" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="45.80760000000001" y="366.225" width="300.3848" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="196" y="380.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">Scherzer 定理（1936）：旋转对称透镜的 Cs 恒为正</text>
  <text x="50" y="402" font-size="10.5" fill="#475569">没有「负球差玻璃」可以配平：出路只有多极校正器打破旋转对称，或 Scherzer 欠焦在数学上配平。三次方依赖意味着孔径角稍大、</text>
  <text x="50" y="417" font-size="10.5" fill="#475569">弥散立刻爆炸——电子透镜只敢用约 10 mrad 小孔径的根源。</text>
  <rect x="710" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、色差：能量的不确定性</text>
  <line x1="750" y1="280" x2="1320" y2="280" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <ellipse cx="880" cy="280" rx="13" ry="60" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="810" y="236" font-size="10.5" fill="#64748b" text-anchor="middle">同一束电子，能量不同焦点不同</text>
  <line x1="755" y1="258" x2="880" y2="258" stroke="#475569" stroke-width="1.7"/>
  <line x1="755" y1="302" x2="880" y2="302" stroke="#475569" stroke-width="1.7"/>
  <line x1="880" y1="258" x2="1050" y2="280" stroke="#0369a1" stroke-width="1.7"/>
  <line x1="880" y1="302" x2="1050" y2="280" stroke="#0369a1" stroke-width="1.7"/>
  <line x1="1050" y1="280" x2="1250" y2="297" stroke="#0369a1" stroke-width="1.7"/>
  <line x1="1050" y1="280" x2="1250" y2="263" stroke="#0369a1" stroke-width="1.7"/>
  <line x1="880" y1="258" x2="980" y2="280" stroke="#6d28d9" stroke-width="1.7" stroke-dasharray="6 4"/>
  <line x1="880" y1="302" x2="980" y2="280" stroke="#6d28d9" stroke-width="1.7" stroke-dasharray="6 4"/>
  <line x1="980" y1="280" x2="1250" y2="305" stroke="#6d28d9" stroke-width="1.7" stroke-dasharray="6 4"/>
  <line x1="980" y1="280" x2="1250" y2="255" stroke="#6d28d9" stroke-width="1.7" stroke-dasharray="6 4"/>
  <circle cx="1050" cy="280" r="4" fill="#0369a1"/>
  <circle cx="980" cy="280" r="4" fill="#6d28d9"/>
  <text x="1092" y="258" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">能量 E<tspan dy="2.3" font-size="7.6">0</tspan></text>
  <text x="930" y="316" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">能量较低（E−ΔE）</text>
  <line x1="980" y1="250" x2="1050" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="1015" y="232" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">低能电子焦距更短</text>
  <circle cx="1250" cy="280" r="22" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1250" y="326" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">焦散盘 r_c ≈ Cc·α·(ΔE/E)</text>
  <rect x="730" y="352" width="620" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="742" y="372" font-size="10.5" fill="#475569">预算一算：Cc = 1.4 mm、α = 10 mrad、肖特基枪 ΔE = 1 eV，300 kV 下 ΔE/E ≈ 3.3×10<tspan dy="-3.6" font-size="7.6">-6</tspan><tspan dy="3.6">，得 r_c ≈ 0.05 nm——尚可。</tspan></text>
  <text x="742" y="390" font-size="10.5" fill="#475569">换 100 kV 与钨丝（ΔE = 2.5 eV）：ΔE/E 大六倍、λ 更长，色差立即与球差同量级。厚冰多次非弹性损失（约 20 eV/次）</text>
  <text x="742" y="405" font-size="10.5" fill="#475569">是 cryo-EM 的「样品自带 ΔE」。</text>
  <rect x="30" y="452" width="660" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">三、像散与彗差：Thon 环判据与 Zemlin 表</text>
  <line x1="60" y1="560" x2="460" y2="560" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <ellipse cx="120" cy="560" rx="12" ry="42" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="160" y="508" font-size="10.5" fill="#64748b" text-anchor="middle">x、y 两正交方向焦距失配</text>
  <line x1="70" y1="530" x2="120" y2="530" stroke="#d97706" stroke-width="1.5"/>
  <line x1="120" y1="530" x2="300" y2="560" stroke="#d97706" stroke-width="1.5"/>
  <line x1="300" y1="560" x2="420" y2="592" stroke="#d97706" stroke-width="1.5"/>
  <line x1="70" y1="590" x2="120" y2="590" stroke="#d97706" stroke-width="1.5"/>
  <line x1="120" y1="590" x2="300" y2="560" stroke="#d97706" stroke-width="1.5"/>
  <line x1="300" y1="560" x2="420" y2="528" stroke="#d97706" stroke-width="1.5"/>
  <line x1="70" y1="545" x2="380" y2="560" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="380" y1="560" x2="450" y2="572" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="70" y1="575" x2="380" y2="560" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="380" y1="560" x2="450" y2="548" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="300" y1="538" x2="300" y2="582" stroke="#d97706" stroke-width="3.5"/>
  <text x="300" y="600" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">焦线 1</text>
  <line x1="362" y1="560" x2="398" y2="560" stroke="#0369a1" stroke-width="3.5"/>
  <text x="380" y="534" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">焦线 2</text>
  <circle cx="340" cy="560" r="10" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="352" y="622" font-size="10" fill="#991b1b" text-anchor="middle">最小弥散圆</text>
  <circle cx="560" cy="585" r="44" fill="none" stroke="#475569" stroke-width="2.5"/>
  <circle cx="560" cy="585" r="26" fill="none" stroke="#475569" stroke-width="2" opacity="0.7"/>
  <circle cx="560" cy="585" r="11" fill="none" stroke="#475569" stroke-width="1.6" opacity="0.5"/>
  <text x="560" y="648" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">正圆：已校好</text>
  <ellipse cx="650" cy="585" rx="46" ry="32" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <ellipse cx="650" cy="585" rx="27" ry="19" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.7"/>
  <text x="650" y="648" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">椭圆：像散</text>
  <text x="50" y="672" font-size="10.5" fill="#475569">消像散器（两组正交四极场）把两焦线拉回一点，判据是非晶碳膜功率谱的 Thon 环为正圆；彗差源于束流失中，</text>
  <text x="50" y="687" font-size="10.5" fill="#475569">须束对中并以 Zemlin 表定量——各倾角下 Thon 环圆心一致方为对中。</text>
  <rect x="710" y="452" width="660" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="474.84" font-size="19" fill="#475569" font-weight="700">四、Scherzer 分辨率、稳定性与校正器时代</text>
  <rect x="801.260179" y="488.525" width="141.479642" height="22.95" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="872" y="504.86" font-size="13.5" fill="#075985" text-anchor="middle" font-weight="700">δ ≈ 0.66·Cs<tspan dy="-4.6" font-size="9.7">1/4</tspan><tspan dy="4.6">·λ</tspan><tspan dy="-4.6" font-size="9.7">3/4</tspan></text>
  <rect x="1088.890306" y="488.525" width="142.219388" height="22.95" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1160" y="504.86" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="700">Δf<tspan dy="3.0" font-size="9.7">S</tspan><tspan dy="-3.0"> = −1.2·(Cs·λ)</tspan><tspan dy="-4.6" font-size="9.7">1/2</tspan></text>
  <rect x="730" y="524" width="620" height="70" rx="8" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="744" y="546" font-size="11.5" fill="#134e4a" font-weight="600">代入 300 kV（λ = 0.00197 nm）、Cs = 1.2 mm 的生物机型：δ ≈ 0.21 nm，Δf<tspan dy="2.5" font-size="8.3">S</tspan><tspan dy="-2.5"> ≈ −58 nm。</tspan></text>
  <text x="744" y="572" font-size="11.5" fill="#475569">200 kV、Cs = 1.2 mm 给出约 0.23 nm——升到 300 kV 立省约 10%。</text>
  <rect x="880.68695" y="610.225" width="318.6261" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1040" y="624.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">1998 年 Haider 六极球差校正 HRTEM（Rose 理论方案）</text>
  <rect x="887.2017000000001" y="642.225" width="305.59659999999997" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1040" y="656.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">2009 年前后双校正 300 kV 突破 0.5 Å（TEAM 计划）</text>
  <rect x="878.4364" y="674.225" width="323.1272" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1040" y="688.14" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="700">生物 cryo-EM 不装 Cs 校正器：算法 CTF 校正更具性价比</text>
  <text x="730" y="708" font-size="10.5" fill="#475569">稳定性地板：高压与透镜电流稳定 10<tspan dy="-3.6" font-size="7.6">-6</tspan><tspan dy="3.6">、冷却水温约 ±0.1 °C——漂移破表即分辨率塌方。</tspan></text>
</svg>