  <text x="862.5" y="623" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">皮质醇昼夜节律（晨峰夜谷）</text>
  <path d="M745,750.5 C748.9,749.1 760.7,751.0 768.5,742.25 C776.3,733.5 783.0,714.2 792,697.7 C801.0,681.2 810.8,641.3 822.55,643.25 C834.3,645.2 850.0,692.8 862.5,709.25 C875.0,725.8 886.0,734.8 897.75,742.25 C909.5,749.7 922.0,750.2 933,753.8 C944.0,757.4 955.7,761.0 963.55,763.7 C971.4,766.5 977.3,769.2 980,770.3" fill="none" stroke="#b45309" stroke-width="3"/>
