  <text x="745" y="822" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="803.75" y1="800" x2="803.75" y2="806" stroke="#475569" stroke-width="1.8"/>
  <text x="803.75" y="822" font-size="13" fill="#64748b" text-anchor="middle">6</text>
  <line x1="862.5" y1="800" x2="862.5" y2="806" stroke="#475569" stroke-width="1.8"/>
  <text x="862.5" y="822" font-size="13" fill="#64748b" text-anchor="middle">12</text>
  <line x1="921.25" y1="800" x2="921.25" y2="806" stroke="#475569" stroke-width="1.8"/>
  <text x="921.25" y="822" font-size="13" fill="#64748b" text-anchor="middle">18</text>
  <line x1="980" y1="800" x2="980" y2="806" stroke="#475569" stroke-width="1.8"/>
  <text x="980" y="822" font-size="13" fill="#64748b" text-anchor="middle">24</text>
