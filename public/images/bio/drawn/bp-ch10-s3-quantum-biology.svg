<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">量子生物现象概述：相干、隧穿与磁感</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">FMO 飞秒量子节拍 · 隐花色素自由基对磁罗盘 · 氢隧穿大 KIE（3–10，极端 &gt;80）· 嗅觉振动理论——可检验的量子假说</text>
  <rect x="30" y="132" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、FMO 复合物：数百飞秒的量子节拍</text>
  <circle cx="130" cy="240" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="130" y="245" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">1</text>
  <circle cx="230" cy="200" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="230" y="205" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">2</text>
  <circle cx="320" cy="250" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="320" y="255" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">3</text>
  <circle cx="200" cy="320" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="200" y="325" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">4</text>
  <circle cx="330" cy="350" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="330" y="355" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">5</text>
  <circle cx="430" cy="280" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="430" y="285" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">6</text>
  <circle cx="540" cy="330" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="540" y="335" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">7</text>
  <circle cx="580" cy="240" r="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="580" y="245" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">RC</text>
  <line x1="130" y1="240" x2="230" y2="200" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
  <line x1="230" y1="200" x2="320" y2="250" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
  <line x1="320" y1="250" x2="430" y2="280" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
  <line x1="230" y1="200" x2="200" y2="320" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
  <line x1="200" y1="320" x2="330" y2="350" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
  <line x1="430" y1="280" x2="540" y2="330" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
  <line x1="430" y1="280" x2="580" y2="240" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.75"/>
  <text x="70" y="190" font-size="13" fill="#475569">细菌光合天线 FMO：激发能以「量子节拍」在 7 个色素位点间震荡传递</text>
  <text x="70" y="210" font-size="13" fill="#475569">（2D 电子谱观测数百 fs 相干拍频）</text>
  <text x="70" y="420" font-size="13.5" fill="#d97706" font-weight="600">争论点：生理温度下相干是「量子漫步导引」还是仅经典跳跃的表象？功能意义至今未有定论。</text>
  <rect x="87.1676" y="359.8" width="65.6648" height="20.4" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="374.32" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">低温 77K</text>
  <rect x="207.5152" y="359.8" width="104.9696" height="20.4" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="260" y="374.32" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="600">相干时间数百 fs</text>
  <rect x="391.0494" y="359.8" width="77.9012" height="20.4" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="430" y="374.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="600">→ 反应中心</text>
  <rect x="720" y="132" width="650" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="736" y="154.84" font-size="19" fill="#475569" font-weight="700">二、鸟磁罗盘：自由基对机制（cryptochrome 假说）</text>
  <path d="M 760,220 L 1180,220" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <text x="970" y="205" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="600">地磁场 B ≈ 50 μT</text>
  <rect x="780.64" y="279.8" width="38.72" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="800" y="294.32" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">蓝光</text>
  <line x1="840" y1="290" x2="900" y2="290" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="886.3375" y="279.375" width="147.32500000000002" height="21.25" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="960" y="294.5" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">Cryptochrome（FAD）</text>
  <line x1="1090" y1="290" x2="1150" y2="290" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <rect x="1214.138125" y="264.375" width="51.72375" height="21.25" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1240" y="279.5" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">FAD•⁻</text>
  <rect x="1215.425625" y="304.375" width="49.14875" height="21.25" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1240" y="319.5" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="700">Trp•⁺</text>
  <text x="760" y="380" font-size="13" fill="#475569">单重态 ⇌ 三重态：地磁场经超精细相互作用改变自旋演化速率→单/三重态化学产率随磁倾角变化</text>
  <text x="760" y="460" font-size="13" fill="#134e4a" font-weight="600">对蓝光依赖、射频磁场干扰（弱场射频可扰乱罗盘）与倾角感知（区分南北 vs 南北倒转）</text>
  <text x="760" y="480" font-size="13" fill="#134e4a" font-weight="600">的实验证据共同指向自由基对假说。</text>
  <rect x="30" y="550" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="572.84" font-size="19" fill="#475569" font-weight="700">三、氢隧穿与动力学同位素效应</text>
  <rect x="80" y="680" width="280" height="200" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="220" y="924" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">反应坐标</text>
  <text x="34" y="780" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">势能</text>
  <path d="M80,820 C91.7,818.3 126.7,833.3 150,810 C173.3,786.7 196.7,680.0 220,680 C243.3,680.0 266.7,786.7 290,810 C313.3,833.3 348.3,818.3 360,820" fill="none" stroke="#0f766e" stroke-width="3"/>
  <path d="M80,750 C91.7,748.3 126.7,751.7 150,740 C173.3,728.3 196.7,680.0 220,680 C243.3,680.0 266.7,728.3 290,740 C313.3,751.7 348.3,748.3 360,750" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="158.4" y1="816" x2="281.6" y2="816" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#arr-pro)"/>
  <text x="220" y="796" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">H 隧穿</text>
  <rect x="400" y="694.75" width="13.750000000000002" height="10.5" rx="3" fill="#0f766e" stroke="#cbd5e1" stroke-width="1"/>
  <text x="421.75" y="704.5" font-size="12.5" fill="#475569">H（轻，隧穿强）</text>
  <rect x="539" y="694.75" width="13.750000000000002" height="10.5" rx="3" fill="#dc2626" stroke="#cbd5e1" stroke-width="1"/>
  <text x="560.75" y="704.5" font-size="12.5" fill="#475569">D/T（重，隧穿弱）</text>
  <text x="400" y="760" font-size="13" fill="#475569">KIE = k(H)/k(D)：经典过渡态理论上限 ≈ 7</text>
  <text x="400" y="780" font-size="13" fill="#475569">（零点能差）</text>
  <text x="400" y="830" font-size="13" fill="#134e4a" font-weight="600">酶促氢转移实测 3–10、</text>
  <text x="400" y="850" font-size="13" fill="#134e4a" font-weight="600">极端 &gt;80——超出经典解释，</text>
  <text x="400" y="870" font-size="13" fill="#134e4a" font-weight="600">需量子隧穿+蛋白热振动「-promoting vibrations」辅助</text>
  <text x="400" y="890" font-size="13" fill="#134e4a" font-weight="600">（Klinman 实验）。</text>
  <rect x="720" y="550" width="650" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="736" y="572.84" font-size="19" fill="#475569" font-weight="700">四、嗅觉振动理论：可检验的量子假说</text>
  <text x="760" y="620" font-size="13.5" fill="#475569">经典锁钥模型：形状互补决定气味识别。</text>
  <text x="760" y="665" font-size="13.5" fill="#475569">振动理论（Turin）：</text>
  <text x="760" y="685" font-size="13.5" fill="#475569">受体作为「非弹性电子隧穿谱仪」——电子隧穿跨越气味分子时释放的能量须匹配分子振动频率，</text>
  <text x="760" y="705" font-size="13.5" fill="#475569">指纹振动决定气味。</text>
  <rect x="740.178125" y="739.375" width="119.64375" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="800" y="754.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">H → D 同位素替换</text>
  <line x1="990" y1="750" x2="1060" y2="750" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <text x="1170" y="745" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">振动频率变化</text>
  <text x="1170" y="775" font-size="12" fill="#64748b" text-anchor="middle">形状几乎不变</text>
  <text x="760" y="830" font-size="13" fill="#d97706" font-weight="600">判决实验：果蝇对気代气味分子的行为辨别（2011）；人类实验结果反复——假说至今存争议。</text>
  <text x="760" y="900" font-size="13.5" fill="#134e4a" font-weight="600">量子生物学的共同品格：可检验、可证伪——从光合、磁感、隧穿到嗅觉，</text>
  <text x="760" y="920" font-size="13.5" fill="#134e4a" font-weight="600">皆以实验裁决而非神秘主义。</text>
</svg>