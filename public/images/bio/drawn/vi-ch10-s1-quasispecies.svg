  <circle cx="966.8787614468562" cy="828.670234774864" r="3.4" fill="#78350f"/>
  <circle cx="974.9832960348783" cy="841.2922995469825" r="3.4" fill="#78350f"/>
  <line x1="992" y1="842" x2="1056" y2="842" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <circle cx="1100" cy="842" r="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <circle cx="1097.08697214417" cy="848.3650819877797" r="3.4" fill="#78350f"/>
  <circle cx="1093.6349180122202" cy="839.08697214417" r="3.4" fill="#78350f"/>
  <circle cx="1102.91302785583" cy="835.6349180122203" r="3.4" fill="#78350f"/>
  <circle cx="1106.3650819877798" cy="844.91302785583" r="3.4" fill="#78350f"/>
  <text x="800" y="900" font-size="9.5" fill="#64748b" text-anchor="middle">瓶颈①</text>
  <text x="960" y="900" font-size="9.5" fill="#64748b" text-anchor="middle">瓶颈②</text>
  <text x="1100" y="900" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">适应度衰减</text>
  <text x="730" y="926" font-size="10" fill="#475569">小群体逐代传递中，最少突变的最优类一旦随机丢失便不可复得——群体的平均适应度单向下滑。</text>
  <rect x="828.4934000000001" y="942.65" width="383.0132" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1020" y="955.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">医学含义：耐药与免疫逃逸变异预先存在——联合用药与疫苗设计必须直面</text>
</svg>