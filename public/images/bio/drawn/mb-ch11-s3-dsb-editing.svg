  <text x="305" y="166" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">DSB</text>
  <line x1="305" y1="212" x2="200" y2="248" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <line x1="305" y1="212" x2="490" y2="248" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <rect x="56" y="252" width="300" height="122" rx="9" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.5"/>
  <text x="206" y="276" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="700">NHEJ（非同源末端连接）</text>
  <text x="70" y="298" font-size="11" fill="#475569">Ku70/80 识别末端 → DNA-PKcs</text>
  <text x="70" y="314" font-size="11" fill="#475569">/ Artemis 加工 → XRCC4-LigIV 连接</text>
  <text x="70" y="350" font-size="11" fill="#dc2626" font-weight="600">快速 · 易错：indel → 移码基因敲除（全周期，G1 为主）</text>
  <rect x="372" y="252" width="300" height="122" rx="9" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
  <text x="522" y="276" font-size="13.5" fill="#059669" text-anchor="middle" font-weight="700">HDR（同源定向修复）</text>
  <text x="386" y="298" font-size="11" fill="#475569">切除成 3′ 突出 → 侵入带同源臂供体模板</text>
  <text x="386" y="314" font-size="11" fill="#475569">（ssODN / 质粒）→ 合成替换</text>
  <text x="386" y="350" font-size="11" fill="#059669" font-weight="600">精确：定点突变 · 插入 · 报告基因敲入（限 S/G2 期，效率常 &lt;30%）</text>
  <rect x="56" y="386" width="616" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="408" font-size="11.5" fill="#475569">基因敲除（KO）依赖 NHEJ 的 indel；</text>
  <text x="72" y="425" font-size="11.5" fill="#475569">敲入与点突变校正依赖 HDR + 供体模板——RS-1 / scr7 抑制 NHEJ 与细胞周期同步是常用增效策略</text>
  <rect x="740" y="132" width="630" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="154.84" font-size="19" fill="#475569" font-weight="700">二、碱基编辑（David Liu 实验室）：绕开 DSB 的化学转化</text>
  <rect x="756" y="172" width="298" height="178" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.5"/>
  <text x="905" y="196" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="700">CBE 胞嘧啶碱基编辑器</text>
  <text x="772" y="220" font-size="11" fill="#475569">d/nCas9（D10A 切口酶）融合大鼠 APOBEC1 + UGI</text>
  <text x="772" y="236" font-size="11" fill="#475569">（尿嘧啶 DNA 糖苷酶抑制剂）</text>
  <text x="772" y="274" font-size="11" fill="#64748b">编辑窗口（约第 4–8 位）内：</text>
  <text x="905" y="298" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">C → U → U·G 错配</text>
  <text x="905" y="322" font-size="11" fill="#475569" text-anchor="middle">经复制 / 缺口修复固定为 T·A</text>
  <rect x="867.323125" y="325.375" width="75.35374999999999" height="21.25" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="905" y="340.5" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">C·G → T·A</text>
  <rect x="1066" y="172" width="288" height="178" rx="9" fill="#fef3c7" fill-opacity="0.45" stroke="#b45309" stroke-width="1.5"/>
  <text x="1210" y="196" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="700">ABE 腺嘌呤碱基编辑器</text>
  <text x="1082" y="220" font-size="11" fill="#475569">由大肠杆菌 tRNA 腺苷脱氨酶（TadA）</text>
  <text x="1082" y="236" font-size="11" fill="#475569">经工程进化而来</text>
  <text x="1082" y="274" font-size="11" fill="#64748b">腺嘌呤脱氨为肌苷（I）：</text>
  <text x="1210" y="298" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="700">A → I → 复制读作 G</text>
  <text x="1210" y="322" font-size="11" fill="#475569" text-anchor="middle">肌苷被聚合酶当作 G 配对</text>
  <rect x="1172.323125" y="325.375" width="75.35374999999999" height="21.25" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="1210" y="340.5" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="700">A·T → G·C</text>
  <rect x="756" y="362" width="598" height="76" rx="8" fill="#fef3c7" fill-opacity="0.35" stroke="#b45309" stroke-width="1.3"/>
  <text x="772" y="384" font-size="11.5" fill="#475569">C→T 与 A→G 经反义链设计合起来可覆盖约 60% 的人类致病点突变，且无 DSB——大幅降低 indel 与易位风险</text>
  <text x="772" y="420" font-size="11" fill="#78350f">局限：编辑窗口内的旁观者效应 · 不能插入 / 缺失 · 序列上下文偏好</text>
  <rect x="30" y="466" width="1340" height="244" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="488.84" font-size="19" fill="#475569" font-weight="700">三、先导编辑（Prime Editing，2019）：Cas9-逆转录酶融合 + 自带模板的 pegRNA</text>
  <rect x="56" y="512" width="250" height="46" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <text x="181" y="530" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">Cas9（H840A 切口酶）</text>
  <text x="181" y="548" font-size="10" fill="#64748b" text-anchor="middle">融合</text>
  <rect x="316" y="512" width="170" height="46" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="401" y="530" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">M-MLV</text>
  <text x="401" y="548" font-size="10.5" fill="#64748b" text-anchor="middle">逆转录酶</text>
  <rect x="56" y="576" width="130" height="34" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="121" y="598" font-size="11" fill="#78350f" text-anchor="middle" font-weight="600">间隔序列</text>
  <rect x="194" y="576" width="100" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="244" y="598" font-size="11" fill="#475569" text-anchor="middle">sgRNA 骨架</text>
  <rect x="302" y="576" width="110" height="34" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="357" y="598" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="700">PBS</text>
  <rect x="420" y="576" width="130" height="34" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="485" y="598" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">RTT（模板）</text>
  <text x="56" y="630" font-size="11" fill="#64748b">pegRNA＝向导 RNA 3′ 延伸出引物结合位点（PBS）与逆转录模板（RTT）</text>
  <rect x="560" y="506" width="316" height="74" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="718" y="536" font-size="11.5" fill="#475569" text-anchor="middle">① pegRNA 引导切口靶标链</text>
  <line x1="718" y1="582" x2="718" y2="592" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="890" y="506" width="316" height="74" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="1048" y="536" font-size="11.5" fill="#475569" text-anchor="middle">② 游离 3′-OH 与 PBS 配对</text>
  <line x1="1048" y1="582" x2="1048" y2="592" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="560" y="596" width="316" height="74" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="718" y="626" font-size="11.5" fill="#475569" text-anchor="middle">③ 逆转录酶按 RTT 合成含目标突变的「编辑翼」</text>
  <rect x="890" y="596" width="316" height="74" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="1048" y="626" font-size="11.5" fill="#475569" text-anchor="middle">④ 编辑翼与原序列竞争置换（3′ flap vs 5′ flap）</text>
  <text x="1048" y="643" font-size="11.5" fill="#475569" text-anchor="middle">→ 错配修复固定</text>
  <text x="70" y="678" font-size="11" fill="#78350f">代价：pegRNA 设计复杂 · 效率因位点而异 · 编辑产物嵌合</text>
  <text x="560" y="688" font-size="10.5" fill="#059669">PE2 + 第二条引导链（PE3）可提高效率；无需外源供体即可实现全部 12 种碱基转换 + 小片段插入 / 删除，</text>
  <text x="560" y="703" font-size="10.5" fill="#059669">理论上覆盖约 89% 已知致病突变。</text>
  <rect x="30" y="726" width="1340" height="234" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="748.84" font-size="19" fill="#475569" font-weight="700">四、脱靶效应与优化：精准度与安全性步步推进</text>
  <text x="56" y="766" font-size="11.5" fill="#475569">脱靶根源：sgRNA 与非靶位点的部分互补（尤其种子区错配耐受）+ Cas9 停留时间决定脱靶概率</text>
  <rect x="56" y="774" width="640" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
