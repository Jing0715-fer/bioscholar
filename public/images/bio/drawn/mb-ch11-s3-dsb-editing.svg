  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">DSB 修复路线与精准编辑策略</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">NHEJ / HDR 竞争修复——CBE 与 ABE 免断裂碱基转化、先导编辑 pegRNA 自携模板与脱靶控制的完整技术栈</text>
  <rect x="30" y="132" width="700" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Cas9 造成的 DSB：两条细胞通路的竞争修复</text>
