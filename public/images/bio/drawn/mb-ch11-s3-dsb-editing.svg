  <text x="732" y="814" font-size="11" fill="#475569">dCas9-FokI（需二聚体提高特异性）· 截短引导链 tru-gRNA（17–18 nt）</text>
  <rect x="56" y="836" width="640" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="858" font-size="12.5" fill="#1e293b" font-weight="700">递送时程控制</text>
  <text x="72" y="876" font-size="11" fill="#475569">RNP（核糖核蛋白）直接递送——瞬时活性、快速降解</text>
