  <text x="72" y="814" font-size="11" fill="#475569">eSpCas9(1.0) · SpCas9-HF1（消除非特异性 DNA 接触）· HiFi Cas9</text>
  <rect x="716" y="774" width="640" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
