  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">信号假说与蛋白质分选信号</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">Blobel（1999 诺贝尔奖）：多肽链自带「地址信息」——信号肽（线性可切除）与信号斑（折叠后三维斑块）；NLS 入核、KDEL 滞留 ER、PTS1 入过氧化物酶体；分选经门控／跨膜／囊泡三种方式执行</text>
  <rect x="30" y="132" width="1340" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Blobel 信号假说：蛋白质自带「地址信息」（1999 年诺贝尔生理学或医学奖）</text>
  <text x="56" y="196" font-size="11.5" fill="#475569">多肽链自身携带的分选信号决定其在细胞内的最终去向，由细胞中相应的受体与转运机器识别执行。</text>
  <text x="56" y="212.5" font-size="11.5" fill="#475569">信号假说首先在分泌蛋白进入内质网的过程得到证明，并推广为细胞内蛋白质定向分选的普遍原则。</text>
  <text x="56" y="288" font-size="11" fill="#64748b">两个基本特征——充分性：把信号融合到无关蛋白足以引导其到达相应部位；必要性：</text>
  <text x="56" y="303.5" font-size="11" fill="#64748b">突变或删除信号使蛋白失去正确定位（可用移植实验验证）。</text>
  <rect x="660" y="200" width="40" height="16" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="700" y="204" width="290" height="8" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="680" y="240" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">信号肽</text>
  <text x="660" y="264" font-size="10.5" fill="#475569">N 端 15–30 aa 的线性序列，含疏水核心，转运后常被切除。</text>
  <circle cx="1160" cy="218" r="34" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <polygon points="1140,206 1156,200 1168,210 1152,218" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1160" y="282" font-size="11" fill="#be185d" text-anchor="middle" font-weight="700">信号斑</text>
  <text x="990" y="264" font-size="10.5" fill="#475569">折叠后由不连续肽段构成的三维表面斑块（如溶酶体酶被识别的位点）</text>
  <text x="990" y="278.5" font-size="10.5" fill="#475569">。</text>
  <rect x="30" y="364" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="386.84" font-size="19" fill="#475569" font-weight="700">二、经典分选信号总表</text>
  <rect x="56" y="410" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="141" y="437.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">信号类型</text>
