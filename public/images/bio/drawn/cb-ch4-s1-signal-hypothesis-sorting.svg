  <rect x="226" y="590" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="426" y="612.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">富含亮氨酸的短肽</text>
  <rect x="626" y="590" width="368" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="612.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">含 NES 的蛋白出核</text>
  <rect x="994" y="590" width="350" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1169" y="612.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">出核（CRM1 途径）</text>
  <rect x="56" y="624" width="1288" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="56" y="624" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
