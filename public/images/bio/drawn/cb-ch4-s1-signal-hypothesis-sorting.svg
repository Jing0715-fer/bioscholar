  <text x="56" y="924" font-size="10.5" fill="#475569">经核孔复合体在细胞核与细胞质间运输；蛋白质保持折叠状态，</text>
  <text x="56" y="938.5" font-size="10.5" fill="#475569">甚至以核糖核蛋白复合体形式通过。</text>
  <text x="480" y="780" font-size="12.5" fill="#1e293b" font-weight="700">② 跨膜运输</text>
