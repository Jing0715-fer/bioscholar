  <rect x="226" y="624" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="426" y="646.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">C 端 KDEL（可溶性蛋白）/ KKXX（膜蛋白）</text>
  <rect x="626" y="624" width="368" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="646.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">BiP、calreticulin</text>
  <rect x="994" y="624" width="350" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1169" y="646.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">内质网滞留与回收</text>
  <rect x="56" y="658" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
