  <text x="426" y="437.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">结构特征</text>
  <rect x="626" y="410" width="368" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="437.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">典型例子</text>
  <rect x="994" y="410" width="350" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1169" y="437.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">指导去向</text>
  <rect x="56" y="454" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="141" y="476.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">信号肽</text>
  <rect x="226" y="454" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="426" y="476.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">N 端 15–30 aa，含疏水核心，常被切除</text>
  <rect x="626" y="454" width="368" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="476.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">分泌蛋白 ER 信号肽</text>
  <rect x="994" y="454" width="350" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1169" y="476.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">进入内质网</text>
  <rect x="56" y="488" width="1288" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="56" y="488" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="141" y="510.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">导肽</text>
  <rect x="226" y="488" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="426" y="510.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">N 端，带正电的两性螺旋</text>
  <rect x="626" y="488" width="368" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="510.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">线粒体、叶绿体前体蛋白</text>
  <rect x="994" y="488" width="350" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1169" y="510.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">进入线粒体/叶绿体</text>
  <rect x="56" y="522" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
