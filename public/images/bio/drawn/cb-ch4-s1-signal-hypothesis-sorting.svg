  <rect x="226" y="658" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="426" y="680.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">PTS1（C 端 SKL）/ PTS2（N 端）</text>
  <rect x="626" y="658" width="368" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="680.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">过氧化氢酶</text>
