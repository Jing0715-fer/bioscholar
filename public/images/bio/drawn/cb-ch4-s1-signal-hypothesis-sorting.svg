  <rect x="226" y="522" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="426" y="544.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">折叠后由不连续肽段构成的表面斑块</text>
  <rect x="626" y="522" width="368" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="544.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">溶酶体酶被 GlcNAc 磷酸转移酶识别的位点</text>
  <rect x="994" y="522" width="350" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1169" y="544.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">M6P 标记</text>
  <rect x="56" y="556" width="1288" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="56" y="556" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="141" y="578.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">核定位信号（NLS）</text>
  <rect x="226" y="556" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="426" y="578.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">内部短肽，富含碱性氨基酸（SV40 大 T 抗原的 PKKKRKV）</text>
  <rect x="626" y="556" width="368" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="578.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">转录因子、输入蛋白货物</text>
  <rect x="994" y="556" width="350" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1169" y="578.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">入核</text>
  <rect x="56" y="590" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
