  <text x="1251" y="410.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">势能最饱满的信号离子</text>
  <rect x="770" y="452" width="570" height="82" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="790" y="476" font-size="11.5" fill="#475569">失分点提示：E_Cl 的 z = −1，代入 Nernst 时符号翻转（阴离子内外项对调）；E_Ca 为二价，</text>
  <text x="790" y="493" font-size="11.5" fill="#475569">每十倍浓度差仅移动 30.75 mV。</text>
  <rect x="30" y="566" width="1340" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="588.84" font-size="19" fill="#475569" font-weight="700">三、实验检验：改变胞外钾浓度——理论线与实测的分歧</text>
