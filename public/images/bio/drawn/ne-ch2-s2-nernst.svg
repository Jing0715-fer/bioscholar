  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">Nernst 方程与平衡电位：十倍一档的心算尺及其检验</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">E=(RT/zF)·ln(外/内)；37℃单价离子每十倍浓度差对应61.5mV；E_K=61.5×log₁₀(5/140)≈−90mV、E_Na≈+60mV、E_Cl≈−64mV、E_Ca≈+130mV（二价每十倍30.75mV）；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">高钾段实测贴合理论斜率，低钾段因钠漏与泵偏离；高钾血症抬高E_K致心律失常</text>
  <rect x="30" y="132" width="700" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Nernst 方程与「十倍一档」心算尺</text>
  <rect x="60" y="176" width="640" height="64" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="380" y="202" font-size="17.5" fill="#1e293b" text-anchor="middle" font-weight="700">E_ion = (RT / zF) · ln（胞外浓度 / 胞内浓度）</text>
  <text x="380" y="228" font-size="11.5" fill="#475569" text-anchor="middle">37 ℃：RT/F ≈ 26.7 mV；换以 10 为底——单价离子每十倍浓度差对应 61.5 mV</text>
  <line x1="170" y1="268" x2="170" y2="512" stroke="#475569" stroke-width="2"/>
  <line x1="164" y1="280" x2="170" y2="280" stroke="#475569" stroke-width="1.6"/>
  <text x="158" y="284" font-size="11" fill="#64748b" text-anchor="end">+130</text>
  <line x1="164" y1="350" x2="170" y2="350" stroke="#475569" stroke-width="1.6"/>
  <text x="158" y="354" font-size="11" fill="#64748b" text-anchor="end">+60</text>
  <line x1="164" y1="410" x2="170" y2="410" stroke="#475569" stroke-width="1.6"/>
  <text x="158" y="414" font-size="11" fill="#64748b" text-anchor="end">0</text>
  <line x1="164" y1="500" x2="170" y2="500" stroke="#475569" stroke-width="1.6"/>
  <text x="158" y="504" font-size="11" fill="#64748b" text-anchor="end">−90</text>
  <text x="170" y="538" font-size="11.5" fill="#64748b" text-anchor="middle">平衡电位（mV）</text>
  <line x1="176" y1="280" x2="250" y2="280" stroke="#6d28d9" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="275.010625" y="269.375" width="129.97875" height="21.25" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="340" y="284.5" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">E_Ca ≈ +130 mV</text>
  <line x1="176" y1="350" x2="250" y2="350" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="279.001875" y="339.375" width="121.99625" height="21.25" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="354.5" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">E_Na ≈ +60 mV</text>
  <line x1="176" y1="474" x2="204" y2="474" stroke="#0369a1" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="247.226875" y="463.375" width="209.54625000000001" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="352" y="478.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">E_Cl ≈ −64 mV（与静息相当）</text>
  <line x1="176" y1="500" x2="250" y2="500" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="282.349375" y="489.375" width="115.30125" height="21.25" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="340" y="504.5" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">E_K ≈ −90 mV</text>
  <line x1="200" y1="350" x2="200" y2="500" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="212" y="420" font-size="11" fill="#64748b" font-weight="700">150 mV</text>
  <text x="212" y="436" font-size="10.5" fill="#64748b">≈2.4 个十倍档</text>
  <text x="490" y="286" font-size="11.5" fill="#475569">十倍一档：浓度差每差一个数量级，</text>
  <text x="490" y="303" font-size="11.5" fill="#475569">平衡电位移动 61.5 mV</text>
  <text x="490" y="320" font-size="11.5" fill="#475569">（25 ℃ 时约 59 mV）。二价离子减半：</text>
  <text x="490" y="337" font-size="11.5" fill="#475569">每十倍仅移 30.75 mV。</text>
  <text x="380" y="548" font-size="11.5" fill="#475569" text-anchor="middle">E_K = 61.5×log₁₀(5/140) ≈ −90 mV；E_Na = 61.5×log₁₀(145/15) ≈ +60 mV</text>
  <rect x="740" y="132" width="630" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="154.84" font-size="19" fill="#475569" font-weight="700">二、四大离子的平衡电位、驱动力与意义</text>
