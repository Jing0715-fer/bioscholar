  <rect x="1162" y="336" width="178" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1251" y="364.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">与静息相当；分流抑制</text>
  <rect x="770" y="382" width="570" height="46" fill="#f8fafc" fill-opacity="0.85"/>
