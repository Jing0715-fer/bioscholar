  <text x="240" y="872" font-size="11" fill="#475569">低钾段：Na⁺ 漏电流与泵电流掺入，实测点高于理论线；高钾段：</text>
  <text x="240" y="887" font-size="11" fill="#475569">K⁺ 通透占绝对优势，实测贴合 Nernst 斜率。</text>
  <rect x="960" y="616" width="380" height="128" rx="9" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.6"/>
  <text x="980" y="644" font-size="14.5" fill="#dc2626" font-weight="700">临床警示：高钾血症</text>
  <text x="980" y="668" font-size="11.5" fill="#475569">胞外 K⁺ 升高 → E_K 抬高（变正）</text>
  <text x="980" y="685" font-size="11.5" fill="#475569">→ 心肌静息膜去极化 → 兴奋性与传导异常 → 心律失常。</text>
  <text x="960" y="772" font-size="11.5" fill="#475569">使用须知：Nernst 只适用于净流为零或单离子通透的情形；</text>
  <text x="960" y="789" font-size="11.5" fill="#475569">应代入活度而非浓度；数值随温度与浓度变化。</text>
