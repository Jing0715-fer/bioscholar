  <text x="660" y="644" font-size="11" fill="#134e4a">（斜率 61.5 mV / 十倍）</text>
  <path d="M190,815.9 C200.8,816.1 233.6,817.8 254.8,817.35 C276.0,816.9 283.8,816.6 317.44,813 C351.0,809.4 410.8,806.2 456.4,795.6 C502.0,785.0 546.6,765.2 591.04,749.2 C635.4,733.3 669.6,720.9 722.8,699.9 C776.0,678.9 878.8,635.9 910,623.05" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="316" y="856" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">实测 E_K：低钾段抬离理论线</text>
