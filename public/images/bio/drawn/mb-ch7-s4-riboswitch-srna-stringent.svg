  <text x="510" y="454" font-size="12" fill="#475569">遮蔽 RBS 抑制外膜蛋白合成</text>
  <text x="510" y="472" font-size="12" fill="#475569">（渗透压响应）</text>
  <rect x="688" y="386" width="178" height="118" rx="8" fill="#fee2e2" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.4"/>
  <text x="777" y="410" font-size="14.5" fill="#dc2626" text-anchor="middle" font-weight="700">促降解</text>
  <text x="704" y="436" font-size="12" fill="#475569">双链区被 RNase E 切割，</text>
  <text x="704" y="454" font-size="12" fill="#475569">sodB / sdh 等含铁酶 mRNA 被清除</text>
  <rect x="494" y="520" width="372" height="120" rx="8" fill="#d1fae5" fill-opacity="0.35" stroke="#059669" stroke-width="1.4"/>
  <text x="680" y="546" font-size="14.5" fill="#059669" text-anchor="middle" font-weight="700">铁平衡的经济学</text>
  <text x="510" y="572" font-size="12.5" fill="#475569">铁饥饿 → RyhB 大量表达 → 降解含铁酶 mRNA → 把有限的铁留给必需酶</text>
  <text x="510" y="610" font-size="12" fill="#64748b">同理：Spot 42 参与半乳糖操纵子选择性调控；</text>
  <text x="510" y="628" font-size="12" fill="#64748b">ColE1 质粒拷贝数控制（RNA I/II）</text>
  <text x="510" y="646" font-size="12" fill="#64748b">与转座子免疫同为反义逻辑</text>
  <rect x="494" y="656" width="372" height="96" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="680" y="682" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="700">全局 mRNA 调节网络</text>
  <text x="510" y="708" font-size="12.5" fill="#475569">一个 sRNA 可同时调节数十个 mRNA——原核系统生物学的前沿</text>
