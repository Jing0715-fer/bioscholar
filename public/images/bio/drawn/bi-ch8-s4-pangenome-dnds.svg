<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">比较基因组与泛基因组：共线性断点、核心–可变两桶与 dN/dS 标尺</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">共线性指基因次序的保守，断点即倒位、易位等重排事件，非等位同源重组为主要成因；大肠杆菌各菌株基因四千余而核心仅约两千余（约四成），</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">泛基因组上万且持续增长（开放）；dN/dS明显低于1为纯化选择、接近1为中性、高于1提示正选择，全基因组平均约0.1——分析须密码子比对、甄别直向同源并警惕dS饱和</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、共线性与染色体重排：以倒位为例</text>
  <text x="70" y="188" font-size="12.5" fill="#475569" font-weight="700">物种 A（参考）</text>
  <rect x="80" y="198" width="500" height="40" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <rect x="105" y="206" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="135" y="223" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">1</text>
  <rect x="185" y="206" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="215" y="223" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">2</text>
  <rect x="265" y="206" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="295" y="223" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">3</text>
  <rect x="345" y="206" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="375" y="223" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">4</text>
  <rect x="425" y="206" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="455" y="223" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">5</text>
  <rect x="505" y="206" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="535" y="223" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">6</text>
  <text x="70" y="306" font-size="12.5" fill="#475569" font-weight="700">物种 B（倒位携带者）</text>
  <rect x="80" y="316" width="500" height="40" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <rect x="105" y="324" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="135" y="341" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">1</text>
  <rect x="185" y="324" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="215" y="341" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">2</text>
  <rect x="265" y="324" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="295" y="341" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">4</text>
  <rect x="345" y="324" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="375" y="341" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">3</text>
  <rect x="425" y="324" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="455" y="341" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">5</text>
  <rect x="505" y="324" width="60" height="24" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="535" y="341" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">6</text>
  <line x1="135" y1="232" x2="135" y2="322" stroke="#64748b" stroke-width="1.6"/>
  <line x1="215" y1="232" x2="215" y2="322" stroke="#64748b" stroke-width="1.6"/>
  <line x1="295" y1="232" x2="375" y2="322" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="375" y1="232" x2="295" y2="322" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="455" y1="232" x2="455" y2="322" stroke="#64748b" stroke-width="1.6"/>
  <line x1="535" y1="232" x2="535" y2="322" stroke="#64748b" stroke-width="1.6"/>
  <line x1="258" y1="240" x2="258" y2="330" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="412" y1="240" x2="412" y2="330" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="252" y="258" font-size="11" fill="#dc2626" text-anchor="end" font-weight="700">断点</text>
  <text x="418" y="258" font-size="11" fill="#dc2626" font-weight="700">断点</text>
  <path d="M 265,381 Q 265,372 274,372 M 401,372 Q 410,372 410,381" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="274" y1="372" x2="401" y2="372" stroke="#64748b" stroke-width="1.7"/>
  <text x="337.5" y="396" font-size="14" fill="#64748b" text-anchor="middle" font-weight="600">倒位区段（3–4 次序颠倒）</text>
  <text x="60" y="430" font-size="11.5" fill="#475569">共线性：染色体区段内基因次序的保守；检测等价于在基因级排布上找最长保守运行，断点即倒位、</text>
  <text x="60" y="446" font-size="11.5" fill="#475569">易位等重排事件的足迹。</text>
  <text x="60" y="478" font-size="11.5" fill="#475569">非等位同源重组是重排的主要成因；倒位在减数分裂中形成倒位环，可致配子不平衡，</text>
  <text x="60" y="494" font-size="11.5" fill="#475569">也可能因抑制重组而被选择保留为适应性组合。</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、泛基因组：核心与可变（大肠杆菌，开放的经典）</text>
  <rect x="939.875" y="181.375" width="200.25" height="21.25" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1040" y="196.5" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">大肠杆菌：开放泛基因组的经典</text>
  <rect x="800" y="231.38" width="12.100000000000001" height="9.24" rx="3" fill="#0f766e" stroke="#cbd5e1" stroke-width="1"/>
  <text x="820.1" y="239.96" font-size="11" fill="#475569">核心基因（全体共有）</text>
  <rect x="946.1" y="231.38" width="12.100000000000001" height="9.24" rx="3" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="966.2" y="239.96" font-size="11" fill="#475569">可变基因（部分个体携带）</text>
  <text x="742" y="279" font-size="11.5" fill="#475569" font-weight="600">菌株 1</text>
  <rect x="800" y="262" width="216" height="24" fill="#0f766e"/>
  <rect x="1016" y="262" width="304" height="24" fill="#0369a1"/>
  <text x="742" y="313" font-size="11.5" fill="#475569" font-weight="600">菌株 2</text>
  <rect x="800" y="296" width="216" height="24" fill="#0f766e"/>
  <rect x="1016" y="296" width="254" height="24" fill="#0369a1"/>
  <text x="742" y="347" font-size="11.5" fill="#475569" font-weight="600">菌株 3</text>
  <rect x="800" y="330" width="216" height="24" fill="#0f766e"/>
  <rect x="1016" y="330" width="334" height="24" fill="#0369a1"/>
  <text x="1330" y="250" font-size="11" fill="#64748b" text-anchor="end">各菌株基因组 4.5–5.5 Mb · 基因数四千余</text>
  <path d="M 800,369 Q 800,360 809,360 M 1007,360 Q 1016,360 1016,369" fill="none" stroke="#134e4a" stroke-width="1.7"/>
  <line x1="809" y1="360" x2="1007" y2="360" stroke="#134e4a" stroke-width="1.7"/>
  <text x="908" y="384" font-size="14" fill="#134e4a" text-anchor="middle" font-weight="600">核心 ≈ 2000 余 · 约四成</text>
  <line x1="1040" y1="366" x2="1040" y2="384" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr-pro)"/>
  <rect x="740" y="384" width="600" height="48" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1040" y="406" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">泛基因组：累计基因上万 · 开放——随新菌株加入持续增长</text>
  <text x="1040" y="426" font-size="11" fill="#475569" text-anchor="middle">核心：必需功能为主 · 可变：关联适应与毒力</text>
  <text x="740" y="456" font-size="11.5" fill="#475569">「泛基因组」一词由 Tettelin 等（2005）对无乳链球菌的多菌株比较研究提出；分开放与封闭两类，</text>
  <text x="740" y="472" font-size="11.5" fill="#475569">图基因组以图结构消解参考偏倚。</text>
  <text x="740" y="500" font-size="11.5" fill="#475569">水稻泛基因组揭示大量存在–缺失变异与抗逆基因在可变区的分布；核心与可变以 99% 或 95% 划线并无普适标准，</text>
  <text x="740" y="516" font-size="11.5" fill="#475569">比较研究须统一口径。</text>
  <rect x="30" y="576" width="1340" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、dN/dS：选择压力的分子标尺</text>
  <rect x="60" y="620" width="420" height="132" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="270" y="654" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">ω = dN / dS</text>
  <text x="80" y="682" font-size="11" fill="#475569">dN ＝ 非同义替换数 ÷ 非同义可替换位点（dS 对同义类推）</text>
  <text x="80" y="714" font-size="11" fill="#64748b">先数可替换位点、再数观察到的替换，各自相除取比值——Nei 与 Gojobori</text>
  <text x="80" y="729" font-size="11" fill="#64748b">（1986）计数法沿此骨架展开。</text>
  <text x="930" y="650" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">选择压力标尺（ω）</text>
  <rect x="520" y="672" width="395" height="44" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="717" y="699" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">纯化选择 ω &lt; 1（大部分编码区）</text>
  <rect x="915" y="672" width="20" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="925" y="699" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">≈1</text>
  <rect x="935" y="672" width="395" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1132" y="699" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">正选择 ω &gt; 1（需位点 / 分支模型检验）</text>
  <line x1="520" y1="716" x2="520" y2="724" stroke="#475569" stroke-width="1.8"/>
  <text x="520" y="742" font-size="12" fill="#64748b" text-anchor="middle">0</text>
  <line x1="722.5" y1="716" x2="722.5" y2="724" stroke="#475569" stroke-width="1.8"/>
  <text x="722.5" y="742" font-size="12" fill="#64748b" text-anchor="middle">0.5</text>
  <line x1="925" y1="716" x2="925" y2="724" stroke="#475569" stroke-width="1.8"/>
  <text x="925" y="742" font-size="12" fill="#64748b" text-anchor="middle">1</text>
  <line x1="1127.5" y1="716" x2="1127.5" y2="724" stroke="#475569" stroke-width="1.8"/>
  <text x="1127.5" y="742" font-size="12" fill="#64748b" text-anchor="middle">1.5</text>
  <line x1="1330" y1="716" x2="1330" y2="724" stroke="#475569" stroke-width="1.8"/>
  <text x="1330" y="742" font-size="12" fill="#64748b" text-anchor="middle">2</text>
  <line x1="560" y1="636" x2="560" y2="716" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="640" y="630" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">全基因组平均 ω ≈ 0.1</text>
  <text x="60" y="792" font-size="11.5" fill="#475569">ω 明显低于 1 → 纯化选择（有害突变被清除）；接近 1 → 中性演化；</text>
  <text x="60" y="808" font-size="11.5" fill="#475569">高于 1 → 提示正选择——正选择常作用于个别位点或分支，须以位点 / 分支模型检验局部 ω。</text>
  <text x="720" y="792" font-size="11.5" fill="#475569">分析前置：先做密码子比对、甄别直向同源、警惕 dS 饱和对比值的干扰。全基因组平均约 0.1 的强纯化背景，</text>
  <text x="720" y="808" font-size="11.5" fill="#475569">使局部 ω &gt; 1 的信号更醒目也更须求证。</text>
  <text x="700" y="930" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">dN/dS 是比值也是平均量：位点间的异质性会被均值掩盖——这正是位点 / 分支模型存在的理由。</text>
</svg>