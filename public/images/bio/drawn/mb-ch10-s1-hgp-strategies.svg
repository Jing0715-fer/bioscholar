<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">人类基因组计划：两种战略与大科学遗产</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">1990–2003 测定 30 亿碱基对——分级战略与全基因组鸟枪法的竞争、约 2 万基因的核心发现与 HapMap / ENCODE / TCGA / T2T 的延续</text>
  <rect x="30" y="132" width="1340" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、HGP 时间轴：1990 启动 → 2003 完成图 → 2022 T2T</text>
  <rect x="169.975" y="161.375" width="260.05" height="21.25" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="300" y="176.5" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="600">六国公共联盟（美 · 英 · 日 · 法 · 德 · 中）</text>
  <rect x="773.71" y="161.375" width="312.58" height="21.25" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="930" y="176.5" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="600">ELSI：预算 3%–5% 专设伦理 · 法律与社会影响研究</text>
  <text x="700" y="208" font-size="12.5" fill="#475569" text-anchor="middle">目标：测定人类基因组全部 30 亿碱基对 · 定位全部基因 · 同步完成大肠杆菌 / 酵母 / 线虫 / 果蝇 / 小鼠等模式生物基因组</text>
  <line x1="70" y1="268" x2="1330" y2="268" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <circle cx="160" cy="268" r="6" fill="#1e293b"/>
  <text x="160" y="250" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1990</text>
  <text x="160" y="288" font-size="11" fill="#475569" text-anchor="middle">HGP 启动</text>
  <circle cx="380" cy="268" r="6" fill="#1e293b"/>
  <text x="380" y="250" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1998</text>
  <text x="380" y="288" font-size="11" fill="#475569" text-anchor="middle">Venter 的 Celera 以全基因组鸟枪法加入竞争，</text>
  <text x="380" y="304" font-size="11" fill="#475569" text-anchor="middle">完成时间表提前</text>
  <circle cx="600" cy="268" r="6" fill="#1e293b"/>
  <text x="600" y="250" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">2000.6</text>
  <text x="600" y="288" font-size="11" fill="#475569" text-anchor="middle">两大阵营共同宣布完成工作框架图</text>
  <circle cx="830" cy="268" r="6" fill="#1e293b"/>
  <text x="830" y="250" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">2001.2</text>
  <text x="830" y="288" font-size="11" fill="#475569" text-anchor="middle">Nature 与 Science 分别发表</text>
  <text x="830" y="304" font-size="11" fill="#475569" text-anchor="middle">（历时约 11 年 · 耗资约 27 亿美元）</text>
  <circle cx="1050" cy="268" r="6" fill="#1e293b"/>
  <text x="1050" y="250" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">2003.4</text>
  <text x="1050" y="288" font-size="11" fill="#475569" text-anchor="middle">完成图：</text>
  <text x="1050" y="304" font-size="11" fill="#475569" text-anchor="middle">常染色质区覆盖 &gt;99% · 准确率 99.99%</text>
  <circle cx="1250" cy="268" r="6" fill="#1e293b"/>
  <text x="1250" y="250" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">2022</text>
  <text x="1250" y="288" font-size="11" fill="#475569" text-anchor="middle">T2T 联盟：</text>
  <text x="1250" y="304" font-size="11" fill="#475569" text-anchor="middle">真正「端粒到端粒」的完整序列</text>
  <rect x="30" y="386" width="700" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="408.84" font-size="19" fill="#475569" font-weight="700">二、两种测序战略：由图到序 vs 直接打碎</text>
  <rect x="98.79180000000001" y="416.95" width="242.41639999999998" height="22.099999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="220" y="432.68" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">公共联盟 · 分级战略（BAC-by-BAC）</text>
  <rect x="56" y="442" width="152" height="64" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="132" y="466" font-size="11.5" fill="#475569" text-anchor="middle">遗传图</text>
  <line x1="210" y1="474" x2="218" y2="474" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <rect x="220" y="442" width="152" height="64" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="296" y="466" font-size="11.5" fill="#475569" text-anchor="middle">物理图</text>
  <text x="296" y="482" font-size="11.5" fill="#475569" text-anchor="middle">（STS 标锚定 BAC 重叠群）</text>
  <line x1="374" y1="474" x2="382" y2="474" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <rect x="384" y="442" width="152" height="64" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="460" y="466" font-size="11.5" fill="#475569" text-anchor="middle">逐克隆鸟枪测序</text>
  <line x1="538" y1="474" x2="546" y2="474" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <rect x="548" y="442" width="152" height="64" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="624" y="466" font-size="11.5" fill="#475569" text-anchor="middle">逐级装配</text>
  <text x="56" y="526" font-size="11.5" fill="#64748b">优：顺序可靠 · 重复区段定位准确　｜　难：周期长 · 组织庞大</text>
  <rect x="91.6462" y="548.95" width="216.7076" height="22.099999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="200" y="564.68" font-size="13" fill="#831843" text-anchor="middle" font-weight="700">Celera · 全基因组鸟枪法（WGS）</text>
  <rect x="56" y="574" width="152" height="64" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="132" y="598" font-size="11.5" fill="#475569" text-anchor="middle">全基因组随机 2–10 kb 文库</text>
  <line x1="210" y1="606" x2="242" y2="606" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <rect x="246" y="574" width="152" height="64" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="322" y="598" font-size="11.5" fill="#475569" text-anchor="middle">高冗余测序</text>
  <line x1="400" y1="606" x2="432" y2="606" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <rect x="436" y="574" width="152" height="64" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="512" y="598" font-size="11.5" fill="#475569" text-anchor="middle">计算机装配</text>
  <text x="56" y="658" font-size="11.5" fill="#64748b">优：快捷 · 成本低 · 不需前期图谱　｜　难：重复序列致错拼 · 缺口多</text>
  <rect x="740" y="386" width="630" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="408.84" font-size="19" fill="#475569" font-weight="700">三、核心发现：3.1 Gb 基因组的「意外」</text>
  <path d="M860,510 L860,444 A66,66 0 0 1 866.1,444.3 Z" fill="#be185d"/>
  <path d="M860,510 L866.1,444.3 A66,66 0 1 1 833.9,570.6 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <path d="M860,510 L833.9,570.6 A66,66 0 0 1 860,444 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="860" y="506" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">3.1 Gb</text>
  <text x="860" y="528" font-size="11" fill="#64748b" text-anchor="middle">人类基因组</text>
  <line x1="866" y1="442" x2="900" y2="425" stroke="#be185d" stroke-width="1.6" marker-end="url(#arr-enz)"/>
  <text x="906" y="421" font-size="11.5" fill="#831843" font-weight="700">编码序列 ~1.5%</text>
  <rect x="786" y="603.17" width="12.65" height="9.66" rx="3" fill="#be185d" stroke="#cbd5e1" stroke-width="1"/>
  <text x="806.65" y="612.14" font-size="11.5" fill="#475569">编码序列 ~1.5%</text>
  <rect x="908.23" y="603.17" width="12.65" height="9.66" rx="3" fill="#0f766e" stroke="#cbd5e1" stroke-width="1"/>
  <text x="928.88" y="612.14" font-size="11.5" fill="#475569">重复序列 &gt;50%</text>
  <rect x="1026.78" y="603.17" width="12.65" height="9.66" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1047.43" y="612.14" font-size="11.5" fill="#475569">其他非编码</text>
  <text x="966" y="480" font-size="11.5" fill="#1e293b">· 蛋白编码基因约 2 万个——远低于预期的 5–10 万</text>
  <text x="966" y="508" font-size="11.5" fill="#64748b">　与葡萄等植物相当甚至更少</text>
  <text x="966" y="536" font-size="11.5" fill="#1e293b">· 编码序列仅约 1.5%，一半以上为重复序列</text>
  <text x="966" y="564" font-size="11.5" fill="#1e293b">· 基因分布极不均匀：chr19 密集，chr13 / 18 稀疏</text>
  <text x="966" y="592" font-size="11.5" fill="#1e293b">· 任意两人 DNA 差异约 0.1%（约 300 万位点）</text>
  <rect x="30" y="690" width="1340" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="712.84" font-size="19" fill="#475569" font-weight="700">四、HGP 的延伸与遗产：从 HapMap 到 T2T</text>
  <rect x="56" y="730" width="300" height="100" rx="10" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="206" y="756" font-size="14.5" fill="#0f766e" text-anchor="middle" font-weight="700">HapMap · 1000 Genomes</text>
  <text x="206" y="782" font-size="11.5" fill="#475569" text-anchor="middle">人类遗传变异图谱</text>
  <line x1="358" y1="780" x2="374" y2="780" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="376" y="730" width="300" height="100" rx="10" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="526" y="756" font-size="14.5" fill="#0369a1" text-anchor="middle" font-weight="700">ENCODE</text>
  <text x="526" y="782" font-size="11.5" fill="#475569" text-anchor="middle">功能元件百科全书</text>
  <line x1="678" y1="780" x2="694" y2="780" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="696" y="730" width="300" height="100" rx="10" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.6"/>
  <text x="846" y="756" font-size="14.5" fill="#dc2626" text-anchor="middle" font-weight="700">TCGA</text>
  <text x="846" y="782" font-size="11.5" fill="#475569" text-anchor="middle">肿瘤基因组图谱</text>
  <line x1="998" y1="780" x2="1014" y2="780" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="1016" y="730" width="300" height="100" rx="10" fill="#ede9fe" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="1166" y="756" font-size="14.5" fill="#6d28d9" text-anchor="middle" font-weight="700">T2T 联盟（2022）</text>
  <text x="1166" y="782" font-size="11.5" fill="#475569" text-anchor="middle">端粒到端粒完整序列——补上高度重复的着丝粒与卫星区</text>
  <text x="56" y="856" font-size="14" fill="#1e293b" font-weight="700">制度与文化遗产：</text>
  <rect x="70" y="868" width="390" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="86" y="894" font-size="13" fill="#475569" font-weight="700">百慕大原则</text>
  <text x="86" y="918" font-size="11.5" fill="#64748b">数据即时公开共享的规范</text>
  <rect x="480" y="868" width="390" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="496" y="894" font-size="13" fill="#475569" font-weight="700">测序工业</text>
  <text x="496" y="918" font-size="11.5" fill="#64748b">自动化高通量测序产业</text>
  <rect x="890" y="868" width="390" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="906" y="894" font-size="13" fill="#475569" font-weight="700">学科与人才</text>
  <text x="906" y="918" font-size="11.5" fill="#64748b">「基因组学」由愿景变为常规学科</text>
</svg>