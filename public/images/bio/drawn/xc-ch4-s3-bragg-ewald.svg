  <text x="368" y="246" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700" font-style="italic">θ</text>
  <text x="230" y="188" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">入射</text>
  <text x="438" y="188" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">反射</text>
  <text x="372" y="316" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700" font-style="italic">θ</text>
  <text x="330" y="420" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">2d sinθ = nλ</text>
  <text x="430" y="408" font-size="10" fill="#475569">相邻两面「反射」的程差恰为波长整数倍时相干加强；</text>
  <text x="430" y="422" font-size="10" fill="#475569">「镜面反射」是全体电子散射干涉相长的几何近似</text>
  <rect x="710" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、布拉格角数量级与高级反射</text>
  <text x="878" y="190" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">λ = 1 Å 的算例</text>
  <rect x="730" y="202" width="76" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="768" y="229.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">d（Å）</text>
  <rect x="806" y="202" width="70" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="841" y="229.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">θ</text>
  <rect x="876" y="202" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="951" y="229.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">要点</text>
  <rect x="730" y="246" width="76" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="768" y="267.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">2.0</text>
  <rect x="806" y="246" width="70" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="841" y="267.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">14.5°</text>
  <rect x="876" y="246" width="150" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="951" y="267.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">中分辨率</text>
  <rect x="730" y="278" width="296" height="32" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="278" width="76" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="768" y="299.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1.0</text>
  <rect x="806" y="278" width="70" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="841" y="299.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">30.0°</text>
  <rect x="876" y="278" width="150" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="951" y="299.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">原子分辨率</text>
  <rect x="730" y="310" width="76" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="768" y="331.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">0.8</text>
  <rect x="806" y="310" width="70" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="841" y="331.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">38.7°</text>
  <rect x="876" y="310" width="150" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="951" y="331.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">高角区</text>
  <text x="730" y="372" font-size="10.5" fill="#475569">高分辨率数据天然住在高角区——探测器须后撤或 2θ 偏移才能接住</text>
  <text x="730" y="387" font-size="10.5" fill="#475569">（第 5 章）。倒易格矢长度 1/d = |g| = 2 sinθ/λ。</text>
  <text x="1060" y="200" font-size="12" fill="#1e293b" font-weight="700">高级反射：</text>
  <text x="1060" y="222" font-size="10.5" fill="#475569">(hkl) 的一级反射与 (2h 2k 2l) 的「一级」指向同一方向</text>
  <text x="1060" y="237" font-size="10.5" fill="#475569">（后者面间距恰为 d/2）——级数吸收进指数，</text>
  <text x="1060" y="252" font-size="10.5" fill="#475569">统一写作 2d<tspan dy="2.3" font-size="7.6">hkl</tspan><tspan dy="-2.3"> sinθ = λ。</tspan></text>
  <text x="1060" y="292" font-size="12" fill="#1e293b" font-weight="700">谐波污染：</text>
  <text x="1060" y="314" font-size="10.5" fill="#475569">单色光混有 λ/2 分量时，</text>
  <text x="1060" y="329" font-size="10.5" fill="#475569">会以同一布拉格角在探测器上冒充「更高等」反射——家用源靠镍滤波片与石墨单色器、</text>
  <text x="1060" y="344" font-size="10.5" fill="#475569">同步辐射靠单色器谐波抑制设计压住。</text>
  <rect x="30" y="452" width="660" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">三、埃瓦尔德反射球：衍射条件的几何化（五步作图）</text>
  <circle cx="240" cy="700" r="180" fill="#e0f2fe" fill-opacity="0.28" stroke="#0369a1" stroke-width="2.4"/>
  <line x1="58" y1="700" x2="232" y2="700" stroke="#d97706" stroke-width="2.6" marker-end="url(#arr-warn)"/>
  <text x="120" y="684" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">入射波矢 k<tspan dy="2.4" font-size="7.9">in</tspan></text>
  <text x="240" y="722" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">晶体 O（球心）</text>
