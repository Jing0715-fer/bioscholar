  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">布拉格定律、倒易点阵与埃瓦尔德反射球</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">2dsinθ=nλ（λ=1Å：d=2.0/1.0/0.8Å→θ=14.5°/30.0°/38.7°）；倒易格矢|g|=1/d；Ewald球半径1/λ、五步作图；限制球2/λ=2Å<tspan dy="-5.8" font-size="12.2">-1</tspan><tspan dy="5.8">；d</tspan><tspan dy="3.7" font-size="12.2">min</tspan><tspan dy="-3.7">2→1Å反射数×8</tspan></text>
