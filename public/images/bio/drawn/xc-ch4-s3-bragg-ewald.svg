  <text x="296" y="626" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">衍射束 k<tspan dy="2.4" font-size="7.9">out</tspan></text>
  <line x1="420" y1="700" x2="384" y2="592" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="452" y="640" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">g = h b<tspan dy="2.4" font-size="7.9">1</tspan><tspan dy="-2.4"> + k b</tspan><tspan dy="2.4" font-size="7.9">2</tspan><tspan dy="-2.4"> + l b</tspan><tspan dy="2.4" font-size="7.9">3</tspan></text>
  <text x="452" y="658" font-size="10.5" fill="#dc2626" text-anchor="middle">|g| = 1/d<tspan dy="2.3" font-size="7.6">hkl</tspan></text>
  <text x="388" y="566" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">落在球面即衍射</text>
  <text x="462" y="530" font-size="10" fill="#475569">① 取一点 O 为晶体（球心）</text>
  <text x="462" y="548" font-size="10" fill="#475569">② 自 O 沿入射方向取长度 1/λ 得 L</text>
  <text x="462" y="566" font-size="10" fill="#475569">③ 以 O 为心、1/λ 为半径作球</text>
  <text x="462" y="584" font-size="10" fill="#475569">④ 把倒易点阵原点置于 L</text>
  <text x="462" y="602" font-size="10" fill="#475569">⑤ 旋转晶体＝倒易点阵绕过 L 的轴旋转——格点扫过球面的瞬间即产生衍射斑</text>
  <text x="462" y="668" font-size="10" fill="#64748b">盲区：</text>
  <text x="462" y="682" font-size="10" fill="#64748b">紧贴转轴的格点永远贴不上球面——单轴旋转天然留下锥形盲区，</text>
  <text x="462" y="696" font-size="10" fill="#64748b">须靠等效反射（高对称群）</text>
  <text x="462" y="710" font-size="10" fill="#64748b">或第二个晶体取向补足。</text>
  <text x="60" y="906" font-size="10.5" fill="#475569">数量级：λ≈1 Å → 球半径 1 Å<tspan dy="-3.6" font-size="7.6">-1</tspan><tspan dy="3.6">；晶胞 100 Å 的倒易格点间距仅约 0.01 Å</tspan><tspan dy="-3.6" font-size="7.6">-1</tspan><tspan dy="3.6">——球面相对格点阵近乎平直，静止晶体几乎不出斑，</tspan></text>
  <text x="60" y="921" font-size="10.5" fill="#475569">旋转法由此成为必然。</text>
  <rect x="710" y="452" width="660" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="474.84" font-size="19" fill="#475569" font-weight="700">四、限制球 2/λ 与反射数立方律</text>
  <circle cx="960" cy="730" r="200" fill="#fee2e2" fill-opacity="0.3" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="8 5"/>
  <circle cx="960" cy="730" r="100" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="2.2"/>
  <circle cx="960" cy="730" r="50" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="2.2"/>
  <circle cx="960" cy="730" r="4" fill="#1e293b"/>
  <text x="960" y="692" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">d<tspan dy="2.3" font-size="7.6">min</tspan><tspan dy="-2.3">=2 Å</tspan></text>
  <text x="960" y="708" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">|g| ≤ 0.5 Å<tspan dy="-3.6" font-size="7.6">-1</tspan></text>
  <text x="960" y="620" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">d<tspan dy="2.3" font-size="7.6">min</tspan><tspan dy="-2.3">=1 Å</tspan></text>
  <text x="960" y="636" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">|g| ≤ 1 Å<tspan dy="-3.6" font-size="7.6">-1</tspan></text>
  <text x="960" y="552" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">限制球 |g| ≤ 2/λ = 2 Å<tspan dy="-3.7" font-size="7.9">-1</tspan><tspan dy="3.7">（λ=1 Å，背散射极限）</tspan></text>
  <text x="1178" y="590" font-size="10.5" fill="#475569">d<tspan dy="2.3" font-size="7.6">min</tspan><tspan dy="-2.3"> 从 2 Å 推到 1 Å：</tspan></text>
  <text x="1178" y="605" font-size="10.5" fill="#475569">倒易球半径翻倍、反射数约增 8 倍</text>
  <text x="1178" y="620" font-size="10.5" fill="#475569">（立方律）</text>
  <text x="1178" y="635" font-size="10.5" fill="#475569">——10⁶ Å³ 晶胞到 2 Å 约 5×10⁵ 个反射、</text>
  <text x="1178" y="650" font-size="10.5" fill="#475569">到 1 Å 约 4×10⁶ 个；</text>
  <text x="1178" y="665" font-size="10.5" fill="#475569">2 Å 分辨率球体积仅占限制球 1/64，</text>
  <text x="1178" y="680" font-size="10.5" fill="#475569">1 Å 时升至 1/8。</text>
  <text x="730" y="906" font-size="10.5" fill="#64748b">正交晶胞 a=80、b=100、c=120 Å 的倒易格点间距分别为 0.0125、0.0100、0.0083 Å<tspan dy="-3.6" font-size="7.6">-1</tspan><tspan dy="3.6">——球面随便哪个方向都排七八十个格点，</tspan></text>
  <text x="730" y="921" font-size="10.5" fill="#64748b">长晶胞衍射图拥挤由此而来（大晶胞须小转角、远距离）。</text>
