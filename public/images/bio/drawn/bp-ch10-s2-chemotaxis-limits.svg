<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">生物系统的信息处理：趋化、完美适应与感知极限</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">跑-翻滚有偏随机游走 · 甲基化积分反馈（Barkai–Leibler）· Berg–Purcell 扩散噪声下界——感受器运行在物理极限附近</text>
  <rect x="30" y="132" width="640" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、有偏随机游走：跑（run）与翻滚（tumble）</text>
  <path d="M 80,250 L 220,250 L 220,180 L 420,180 L 420,290 L 560,290" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arr-dna)"/>
  <circle cx="220" cy="250" r="6" fill="#d97706" stroke="#d97706"/>
  <circle cx="220" cy="180" r="6" fill="#d97706" stroke="#d97706"/>
  <circle cx="420" cy="180" r="6" fill="#d97706" stroke="#d97706"/>
  <circle cx="420" cy="290" r="6" fill="#d97706" stroke="#d97706"/>
  <rect x="30.306874999999998" y="194.375" width="119.38625" height="21.25" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="90" y="209.5" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="600">跑 ≈1 s · 20 μm/s</text>
  <rect x="259.8575" y="301.375" width="180.285" height="21.25" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="350" y="316.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">翻滚（tumble）= 随机重定向</text>
  <rect x="30" y="132" width="640" height="420" fill="none" stroke="#cbd5e1" stroke-width="0"/>
  <text x="70" y="340" font-size="13" fill="#475569">引诱剂浓度梯度 ↑（时间比较而非空间比较：细菌仅 2 μm，太短无法测两端浓度差）</text>
  <text x="350" y="405" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="600">浓度上升 → 去甲基化 → CheA 活性↓ → 翻滚减少 → 长跑偏向高浓度</text>
  <text x="350" y="435" font-size="13.5" fill="#d97706" text-anchor="middle" font-weight="600">浓度下降 → 甲基化 → CheA 活性↑ → 翻滚增多 → 随机重试</text>
  <rect x="700" y="132" width="670" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="716" y="154.84" font-size="19" fill="#475569" font-weight="700">二、完美适应：甲基化积分反馈（Barkai–Leibler 鲁棒性）</text>
  <rect x="761.9012" y="198.95" width="96.19760000000001" height="22.099999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="810" y="214.68" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">引诱剂浓度 c</text>
  <line x1="900" y1="210" x2="1010" y2="210" stroke="#0369a1" stroke-width="2.4" marker-end="url(#arr-acc)"/>
  <text x="955" y="195" font-size="12" fill="#64748b" text-anchor="middle">结合受体</text>
  <rect x="1047.9267" y="198.95" width="84.1466" height="22.099999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1090" y="214.68" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">受体活性 A</text>
  <line x1="1180" y1="210" x2="1280" y2="210" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-dna)"/>
  <text x="1230" y="195" font-size="12" fill="#64748b" text-anchor="middle">CheA→翻滚率</text>
  <path d="M 1090,240 Q 1090,330 950,330 Q 810,330 810,270" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arr-bad)"/>
  <text x="860" y="370" font-size="12.5" fill="#475569">反馈：活性 A 驱动甲基化水平 m 变化（CheR 加 / CheB 减），</text>
  <text x="860" y="389" font-size="12.5" fill="#475569">m 是对信号的「积分」——稳态时 A 精确回到设定点</text>
  <rect x="880" y="370" width="340" height="130" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="880" y1="467.5" x2="1220" y2="467.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="965" y1="500" x2="965" y2="370" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="880" y1="435" x2="1220" y2="435" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1050" y1="500" x2="1050" y2="370" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="880" y1="402.5" x2="1220" y2="402.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1135" y1="500" x2="1135" y2="370" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="880" y1="500" x2="880" y2="506" stroke="#475569" stroke-width="1.8"/>
  <line x1="965" y1="500" x2="965" y2="506" stroke="#475569" stroke-width="1.8"/>
  <text x="965" y="522" font-size="13" fill="#64748b" text-anchor="middle">加引诱剂</text>
  <line x1="1067" y1="500" x2="1067" y2="506" stroke="#475569" stroke-width="1.8"/>
  <line x1="1186" y1="500" x2="1186" y2="506" stroke="#475569" stroke-width="1.8"/>
  <line x1="874" y1="500" x2="880" y2="500" stroke="#475569" stroke-width="1.8"/>
  <text x="870" y="504" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="874" y1="422" x2="880" y2="422" stroke="#475569" stroke-width="1.8"/>
  <text x="870" y="426" font-size="13" fill="#64748b" text-anchor="end">设定点</text>
  <line x1="874" y1="370" x2="880" y2="370" stroke="#475569" stroke-width="1.8"/>
  <text x="1050" y="544" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">时间</text>
  <text x="834" y="435" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">活性 A</text>
  <path d="M880,422 C892.5,422.0 937.8,428.9 954.8,422 C971.8,415.1 969.0,383.6 982,380.4 C995.0,377.1 1014.9,396.0 1033,402.5 C1051.1,409.0 1071.0,416.1 1090.8,419.4 C1110.6,422.6 1130.5,421.6 1152,422 C1173.5,422.4 1208.7,422.0 1220,422" fill="none" stroke="#0f766e" stroke-width="2.6"/>
  <line x1="880" y1="422" x2="1220" y2="422" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="1050" y="348" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">完美适应：暂态响应后精确回归</text>
  <rect x="30" y="570" width="640" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="592.84" font-size="19" fill="#475569" font-weight="700">三、Berg–Purcell 极限：扩散感知的物理下界</text>
  <text x="70" y="640" font-size="22" fill="#1e293b" font-weight="700">(δc/c)² ≥ 1/(D·a·c·τ)</text>
  <text x="120" y="690" font-size="17" fill="#075985" text-anchor="middle" font-weight="700">D</text>
  <text x="160" y="690" font-size="13" fill="#475569">分子扩散系数（引诱剂）</text>
  <text x="440" y="690" font-size="17" fill="#075985" text-anchor="middle" font-weight="700">a</text>
  <text x="480" y="690" font-size="13" fill="#475569">受体尺度（捕获半径）</text>
  <text x="120" y="736" font-size="17" fill="#075985" text-anchor="middle" font-weight="700">c</text>
  <text x="160" y="736" font-size="13" fill="#475569">平均浓度</text>
  <text x="440" y="736" font-size="17" fill="#075985" text-anchor="middle" font-weight="700">τ</text>
  <text x="480" y="736" font-size="13" fill="#475569">感知积分时间</text>
  <text x="70" y="810" font-size="13.5" fill="#475569">物理含义：涨落使测量精度存在下界——浓度越高、时间越长、受体越大，相对误差越小。</text>
  <text x="70" y="880" font-size="13.5" fill="#134e4a" font-weight="600">大肠杆菌趋化与视杆细胞单光子响应都运行在物理极限数倍之内——生物感受器逼近量子与涨落设定的天花板。</text>
  <rect x="700" y="570" width="670" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="716" y="592.84" font-size="19" fill="#475569" font-weight="700">四、趋化网络的分子账本（两组分系统）</text>
  <rect x="755.09125" y="629.375" width="69.8175" height="21.25" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="790" y="644.5" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">MCP 受体</text>
  <rect x="770.4967" y="670.225" width="39.0066" height="19.55" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="790" y="684.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">CheW</text>
  <rect x="733.075" y="709.375" width="113.85000000000001" height="21.25" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="790" y="724.5" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">CheA 组氨酸激酶</text>
  <line x1="950" y1="680" x2="1040" y2="680" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#arr-pro)"/>
  <rect x="1099.98375" y="669.375" width="60.0325" height="21.25" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1130" y="684.5" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">CheY~P</text>
  <line x1="1210" y1="680" x2="1280" y2="680" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#arr-pro)"/>
  <text x="1245" y="662" font-size="12" fill="#64748b" text-anchor="middle">马达 CW</text>
  <text x="1245" y="700" font-size="12" fill="#64748b" text-anchor="middle">→ 翻滚</text>
  <line x1="1130" y1="710" x2="1040" y2="710" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-mute)"/>
  <rect x="944.9115" y="700.225" width="90.177" height="19.55" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="990" y="714.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">CheZ 去磷酸化</text>
  <rect x="873.2166" y="819.8" width="153.5668" height="20.4" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="950" y="834.32" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">CheR（甲基化，活性↑）</text>
  <rect x="1109.9914" y="819.8" width="180.01719999999997" height="20.4" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1200" y="834.32" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">CheB~P（去甲基化，活性↓）</text>
  <line x1="950" y1="850" x2="850" y2="745" stroke="#059669" stroke-width="2" marker-end="url(#arr-ok)"/>
  <line x1="1200" y1="850" x2="850" y2="750" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="730" y="930" font-size="13" fill="#475569" font-weight="600">甲基化 m 的积分反馈实现完美适应——网络结构（而非参数微调）保证鲁棒性。</text>
</svg>