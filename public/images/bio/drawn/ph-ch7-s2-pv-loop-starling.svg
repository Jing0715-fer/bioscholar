  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">心动周期与心输出量：Wiggers 图、压力-容积环与心的定律</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">周期0.8s七时相；EDV125ml、ESV55ml、SV70ml、EF55%–70%、CO=HR×SV≈5L/min；Frank-Starling最适初长2.0–2.2μm，环面积＝每搏功≈0.8J</text>
  <rect x="30" y="132" width="1340" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Wiggers 图（简化）：四条曲线与七时相同步描记（心率 75 次/分，周期 0.8 s）</text>
  <rect x="90" y="175" width="150" height="255" fill="#ede9fe" fill-opacity="0.28" stroke="none"/>
  <rect x="240" y="175" width="75" height="255" fill="#fef3c7" fill-opacity="0.28" stroke="none"/>
  <rect x="315" y="175" width="165" height="255" fill="#fee2e2" fill-opacity="0.28" stroke="none"/>
  <rect x="480" y="175" width="165" height="255" fill="#fee2e2" fill-opacity="0.28" stroke="none"/>
  <rect x="645" y="175" width="90" height="255" fill="#d1fae5" fill-opacity="0.28" stroke="none"/>
  <rect x="735" y="175" width="105" height="255" fill="#ccfbf1" fill-opacity="0.28" stroke="none"/>
  <rect x="840" y="175" width="300" height="255" fill="#ccfbf1" fill-opacity="0.28" stroke="none"/>
  <rect x="1140" y="175" width="150" height="255" fill="#ede9fe" fill-opacity="0.28" stroke="none"/>
  <text x="165" y="448" font-size="9.5" fill="#475569" text-anchor="middle">房收缩</text>
  <text x="277.5" y="448" font-size="9.5" fill="#475569" text-anchor="middle">等容收缩</text>
  <text x="397.5" y="448" font-size="9.5" fill="#475569" text-anchor="middle">快速射血</text>
  <text x="562.5" y="448" font-size="9.5" fill="#475569" text-anchor="middle">减慢射血</text>
  <text x="690" y="448" font-size="9.5" fill="#475569" text-anchor="middle">等容舒张</text>
  <text x="787.5" y="448" font-size="9.5" fill="#475569" text-anchor="middle">快速充盈</text>
  <text x="990" y="448" font-size="9.5" fill="#475569" text-anchor="middle">减慢充盈</text>
  <text x="1215" y="448" font-size="9.5" fill="#475569" text-anchor="middle">（下一周期）房收缩</text>
  <line x1="90" y1="430" x2="1290" y2="430" stroke="#475569" stroke-width="1.6"/>
  <polyline points="90,228 150,214 240,190 315,190 380,200 480,212 560,235 645,250 735,250 790,235 840,225 1140,218 1290,190" fill="none" stroke="#0f766e" stroke-width="2.6"/>
  <text x="1000" y="208" font-size="10" fill="#134e4a" font-weight="700">心室容积（EDV 125→ESV 55 ml）</text>
  <text x="240" y="182" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">EDV</text>
  <text x="690" y="268" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">ESV 55 ml</text>
  <polyline points="90,343 240,349 315,352 370,295 420,281 480,290 600,315 645,318 655,326 665,314 735,325 840,332 1140,342 1290,343" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <text x="900" y="306" font-size="10" fill="#991b1b" font-weight="700">主动脉压 120/80</text>
  <text x="690" y="300" font-size="9" fill="#991b1b">重搏切迹</text>
  <polyline points="90,425 200,422 240,418 280,395 315,352 370,293 420,281 480,288 645,320 680,380 735,428 760,430 840,427 1140,424 1290,418" fill="none" stroke="#0369a1" stroke-width="2.6"/>
  <text x="420" y="268" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">心室压（峰值 ≈120 mmHg）</text>
  <polyline points="90,400 130,398 165,384 200,396 240,400 320,390 420,394 540,386 645,378 700,398 760,400 840,398 1140,396 1290,390" fill="none" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="950" y="415" font-size="10" fill="#4c1d95" font-weight="700">心房压 a·c·v 波（放大）</text>
  <text x="165" y="376" font-size="9" fill="#4c1d95" text-anchor="middle" font-weight="700">a</text>
  <text x="320" y="380" font-size="9" fill="#4c1d95" text-anchor="middle" font-weight="700">c</text>
  <text x="645" y="368" font-size="9" fill="#4c1d95" text-anchor="middle" font-weight="700">v</text>
  <line x1="240" y1="175" x2="240" y2="430" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="645" y1="175" x2="645" y2="430" stroke="#0369a1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="240" y="470" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">S1 房室瓣关</text>
  <text x="645" y="470" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">S2 半月瓣关</text>
  <text x="100" y="172" font-size="10" fill="#475569">收缩期约 0.3 s ／ 舒张期约 0.5 s——心率增快首先压缩舒张期</text>
  <rect x="30" y="502" width="660" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="524.84" font-size="19" fill="#475569" font-weight="700">二、压力-容积环：心泵的「示功图」</text>
  <line x1="100" y1="705" x2="640" y2="705" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="100" y1="705" x2="100" y2="530" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="110" y="545" font-size="10" fill="#475569">心室压 (mmHg)</text>
  <path d="M 187,698 C 260,696 420,692 565,690 L 565,588 C 535,540 480,530 430,550 C 350,568 240,572 187,576 Z" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="2.6"/>
  <line x1="187" y1="705" x2="187" y2="570" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="565" y1="705" x2="565" y2="686" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="187" y="722" font-size="10" fill="#475569" text-anchor="middle">ESV 55</text>
  <text x="565" y="722" font-size="10" fill="#475569" text-anchor="middle">EDV 125</text>
  <text x="370" y="720" font-size="10" fill="#475569" text-anchor="middle">心室容积 (ml)</text>
  <line x1="195" y1="660" x2="557" y2="660" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="376" y="654" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">SV = 70 ml</text>
  <text x="376" y="678" font-size="10" fill="#475569" text-anchor="middle">EF = SV/EDV ≈ 56%（临床 55%–70%）</text>
  <text x="572" y="588" font-size="10" fill="#075985">半月瓣开</text>
  <text x="572" y="688" font-size="10" fill="#075985">房室瓣关</text>
  <text x="100" y="570" font-size="10" fill="#075985">半月瓣关</text>
  <text x="100" y="694" font-size="10" fill="#075985">房室瓣开</text>
  <circle cx="376" cy="691" r="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="376" y="695" font-size="9" fill="#134e4a" text-anchor="middle" font-weight="700">①</text>
  <circle cx="565" cy="640" r="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="565" y="644" font-size="9" fill="#4c1d95" text-anchor="middle" font-weight="700">②</text>
  <circle cx="450" cy="552" r="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
  <text x="450" y="556" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700">③</text>
  <circle cx="187" cy="640" r="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
  <text x="187" y="644" font-size="9" fill="#065f46" text-anchor="middle" font-weight="700">④</text>
  <line x1="187" y1="576" x2="640" y2="542" stroke="#be185d" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="470" y="528" font-size="9.5" fill="#831843" font-weight="700">ESPVR：收缩性↑ 时左上移</text>
  <text x="60" y="741" font-size="10" fill="#475569">①充盈 ②等容收缩 ③射血 ④等容舒张｜环面积＝每搏功 ≈0.8 J；高血压/主动脉狭窄使环增高变窄，反流与分流使环变宽</text>
  <rect x="710" y="502" width="660" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="524.84" font-size="19" fill="#475569" font-weight="700">三、Frank-Starling 定律：异长自身调节</text>
  <line x1="790" y1="715" x2="1330" y2="715" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="790" y1="715" x2="790" y2="545" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="784" y="558" font-size="10.5" fill="#475569" text-anchor="end" font-weight="700">SV</text>
  <rect x="1040" y="545" width="120" height="170" fill="#ccfbf1" fill-opacity="0.3" stroke="none"/>
  <text x="1100" y="700" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">最适初长 2.0–2.2 μm</text>
  <polyline points="800,708 880,690 960,660 1040,632 1120,615 1200,605 1280,600 1330,598" fill="none" stroke="#0f766e" stroke-width="2.6"/>
  <polyline points="820,660 900,625 980,595 1060,575 1140,562 1220,555 1300,552" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="7 5"/>
  <polyline points="860,705 940,695 1020,680 1100,665 1180,655 1260,648" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="1150" y="545" font-size="10" fill="#065f46" font-weight="700">运动/儿茶酚胺</text>
  <text x="1270" y="588" font-size="10" fill="#134e4a" font-weight="700">正常</text>
  <text x="1180" y="638" font-size="10" fill="#991b1b" font-weight="700">心力衰竭</text>
  <line x1="800" y1="715" x2="800" y2="721" stroke="#475569" stroke-width="1.4"/>
  <text x="800" y="735" font-size="9.5" fill="#64748b" text-anchor="middle">1.6</text>
  <line x1="920" y1="715" x2="920" y2="721" stroke="#475569" stroke-width="1.4"/>
  <text x="920" y="735" font-size="9.5" fill="#64748b" text-anchor="middle">1.8</text>
  <line x1="1040" y1="715" x2="1040" y2="721" stroke="#475569" stroke-width="1.4"/>
  <text x="1040" y="735" font-size="9.5" fill="#64748b" text-anchor="middle">2.0</text>
  <line x1="1160" y1="715" x2="1160" y2="721" stroke="#475569" stroke-width="1.4"/>
  <text x="1160" y="735" font-size="9.5" fill="#64748b" text-anchor="middle">2.2</text>
  <line x1="1280" y1="715" x2="1280" y2="721" stroke="#475569" stroke-width="1.4"/>
  <text x="1280" y="735" font-size="9.5" fill="#64748b" text-anchor="middle">2.4</text>
  <text x="1060" y="752" font-size="10" fill="#475569" text-anchor="middle">肌节初长 (μm)</text>
  <text x="810" y="690" font-size="9.5" fill="#475569">机制：肌丝最佳重叠＋长度依赖性钙敏；</text>
  <text x="810" y="704" font-size="9.5" fill="#475569">「容量计」而非「油门」——异长调节管匹配，</text>
  <text x="810" y="718" font-size="9.5" fill="#475569">等长调节管动员</text>
  <text x="726" y="778" font-size="10" fill="#475569">Frank（1895 离体蛙心）与 Starling（犬心肺制备）：舒张末容积↑ → 初长↑ → 搏出量↑；心功能曲线与静脉回流曲线交点即平衡工作点</text>
  <text x="726" y="793" font-size="10" fill="#475569">（LVEDP 5–10 mmHg、CO ≈5 L/min）</text>
  <rect x="30" y="772" width="1340" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="794.84" font-size="19" fill="#475569" font-weight="700">四、心输出量的四变量框架与心率的双重神经支配</text>
  <rect x="100" y="800" width="130" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="165" y="824" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">心率 HR</text>
  <rect x="100" y="868" width="130" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="165" y="888" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">搏出量 SV</text>
  <text x="165" y="924" font-size="9" fill="#475569" text-anchor="middle">前负荷·后负荷·收缩性</text>
  <text x="255" y="855" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="700">×</text>
  <line x1="240" y1="820" x2="300" y2="840" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <line x1="240" y1="888" x2="300" y2="868" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="305" y="826" width="160" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="385" y="850" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">CO ≈ 5 L/min</text>
  <text x="385" y="872" font-size="9.5" fill="#475569" text-anchor="middle">心脏指数 ≈3.0 L/(min·m<tspan dy="-3.2" font-size="6.8">2</tspan><tspan dy="3.2">)</tspan></text>
  <text x="500" y="812" font-size="9.5" fill="#475569">静息迷走张力主导：</text>
  <text x="500" y="825" font-size="9.5" fill="#475569">切断迷走后静息心率立即升至约 100 次/分</text>
  <text x="500" y="838" font-size="9.5" fill="#475569">（窦房结内在频率）；运动先撤迷走、</text>
  <text x="500" y="851" font-size="9.5" fill="#475569">后增交感。</text>
  <text x="500" y="864" font-size="9.5" fill="#475569">后负荷急性↑ → 心室先「胀而后有力」</text>
  <text x="500" y="877" font-size="9.5" fill="#475569">（ESV 一过性↑、SV 暂降，</text>
  <text x="500" y="890" font-size="9.5" fill="#475569">再借 Starling 机制恢复）。</text>
  <line x1="700" y1="930" x2="700" y2="800" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <line x1="700" y1="930" x2="960" y2="930" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <polyline points="710,925 760,900 810,870 860,850 900,843 940,862 960,882" fill="none" stroke="#0f766e" stroke-width="2.4"/>
  <text x="694" y="812" font-size="10" fill="#475569" text-anchor="end" font-weight="700">CO</text>
  <text x="830" y="948" font-size="10" fill="#475569" text-anchor="middle">心率 (次/分)</text>
  <text x="905" y="825" font-size="9.5" fill="#134e4a" font-weight="700">HR ≈150–180 峰值</text>
  <text x="1000" y="816" font-size="10" fill="#475569">心率过快（&gt;180 次/分）时舒张充盈时间锐减，</text>
  <text x="1000" y="831" font-size="10" fill="#475569">CO 反而下降——严重心动过速「越快越糟」的原因；dP/dt 对负荷不敏感，</text>
  <text x="1000" y="846" font-size="10" fill="#475569">是衡量收缩性的经典指标。</text>
</svg>