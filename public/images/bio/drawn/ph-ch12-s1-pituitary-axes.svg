  <text x="730" y="512" font-size="10.5" fill="#475569">门脉＝血管专线：释放激素以远高于体循环的浓度直送腺垂体；神经分泌＝轴突延伸：激素沿途运输、末梢释放入血。</text>
  <rect x="30" y="548" width="660" height="437" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
