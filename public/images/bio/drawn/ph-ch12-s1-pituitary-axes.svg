  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">激素总论与下丘脑-垂体系统：化学三类·两套解剖方案</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">含氮激素走膜受体秒-分钟速效线、类固醇走胞内核受体基因效应线（胺类「两栖」）；垂体门脉把释放激素高浓度直送腺垂体，</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">神经垂体为下丘脑轴突延伸——五路因子对应腺垂体六激素</text>
  <rect x="30" y="132" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、激素三大化学类：两种信号策略</text>
  <rect x="50" y="175" width="190" height="125" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="145" y="199" font-size="13.5" fill="#075985" text-anchor="middle" font-weight="700">含氮类</text>
  <text x="145" y="220" font-size="10.5" fill="#475569" text-anchor="middle">肽·蛋白·糖蛋白</text>
  <text x="74" y="242" font-size="10" fill="#64748b">胰岛素·GH·PTH·LH/FSH/TSH</text>
  <text x="145" y="288" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">→ 膜受体·速效</text>
  <rect x="255" y="175" width="190" height="125" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="350" y="199" font-size="13.5" fill="#4c1d95" text-anchor="middle" font-weight="700">类固醇类</text>
  <text x="350" y="220" font-size="10.5" fill="#475569" text-anchor="middle">胆固醇衍生物</text>
  <text x="279" y="242" font-size="10" fill="#64748b">皮质醇·醛固酮·雌二醇·睾酮</text>
  <text x="350" y="288" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">→ 胞内核受体</text>
  <rect x="460" y="175" width="190" height="125" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="555" y="199" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="700">胺类</text>
  <text x="555" y="220" font-size="10.5" fill="#475569" text-anchor="middle">酪氨酸衍生物</text>
  <text x="484" y="242" font-size="10" fill="#64748b">儿茶酚胺→膜受体；</text>
  <text x="484" y="256" font-size="10" fill="#64748b">甲状腺激素→核受体</text>
  <text x="555" y="288" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">「两栖」</text>
  <text x="50" y="328" font-size="11.5" fill="#075985" font-weight="700">① 膜受体通路（速效）</text>
  <rect x="50" y="338" width="110" height="34" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="105" y="359" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">亲水配体</text>
  <line x1="162" y1="355" x2="180" y2="355" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="184" y="338" width="150" height="34" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="259" y="359" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">膜受体 G 蛋白/RTK</text>
  <line x1="336" y1="355" x2="354" y2="355" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="358" y="338" width="160" height="34" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="438" y="359" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">级联放大数量级</text>
  <line x1="520" y1="355" x2="538" y2="355" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="542" y="338" width="118" height="34" rx="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="601" y="359" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">秒-分钟·速撤</text>
  <text x="50" y="398" font-size="11.5" fill="#4c1d95" font-weight="700">② 胞内受体通路（基因效应）</text>
  <rect x="50" y="408" width="110" height="34" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="105" y="429" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">脂溶配体</text>
  <line x1="162" y1="425" x2="180" y2="425" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <rect x="184" y="408" width="150" height="34" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="259" y="429" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">直接穿过质膜</text>
  <line x1="336" y1="425" x2="354" y2="425" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <rect x="358" y="408" width="160" height="34" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="438" y="429" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">核受体·转录因子</text>
  <line x1="520" y1="425" x2="538" y2="425" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <rect x="542" y="408" width="118" height="34" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="601" y="429" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">小时-天·绵长</text>
  <text x="50" y="470" font-size="11" fill="#475569">分秒应答（血糖·血压·应激即刻）交给膜受体快线；改写细胞表型的长期工程（发育·分化·代谢基线）</text>
  <text x="50" y="486.5" font-size="11" fill="#475569">交给核受体慢线——级联放大使 10<tspan dy="-3.7" font-size="7.9">-10</tspan><tspan dy="3.7">–10</tspan><tspan dy="-3.7" font-size="7.9">-8</tspan><tspan dy="3.7"> mol/L 的激素即可发号施令。</tspan></text>
  <rect x="710" y="132" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
