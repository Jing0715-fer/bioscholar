<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">微生物在生态系统中的地位：碳氮循环的主力与三大角色</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">微生物兼生产者、消费者与分解者主导物质循环；氮循环全部关键反应由微生物驱动；人体微生物组约10¹⁴（修订约1:1）为「第二基因组」；每克肥土10⁷–10⁹菌</text>
  <rect x="30" y="132" width="1340" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、微生物一身兼三职：生产者 · 消费者 · 分解者</text>
  <rect x="50" y="160" width="400" height="118" rx="9" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.6"/>
  <rect x="109.1425" y="176.525" width="61.715" height="22.95" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="140" y="192.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">生产者</text>
  <text x="66" y="218" font-size="11" fill="#475569">光合与化能自养固定 CO₂——蓝细菌、藻类、</text>
  <text x="66" y="234" font-size="11" fill="#475569">硝化菌与硫氧化菌是水域与黑暗深海的初级生产者</text>
  <rect x="495" y="160" width="400" height="118" rx="9" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.6"/>
  <rect x="554.1425" y="176.525" width="61.715" height="22.95" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="585" y="192.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">消费者</text>
  <text x="511" y="218" font-size="11" fill="#475569">原生动物捕食细菌与藻类，衔接食物链——微生物也是被取食与取食者</text>
  <rect x="940" y="160" width="400" height="118" rx="9" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="999.1425" y="176.525" width="61.715" height="22.95" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1030" y="192.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">分解者</text>
  <text x="956" y="218" font-size="11" fill="#475569">把有机残体彻底矿化归还环境——收尾者身份使微生物主导物质循环</text>
  <rect x="30" y="314" width="660" height="332" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="336.84" font-size="19" fill="#475569" font-weight="700">二、碳循环：微生物在两端都是主力</text>
  <rect x="322.48355" y="360.95" width="75.0329" height="22.099999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="360" y="376.68" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">大气 CO₂</text>
  <line x1="240" y1="388" x2="240" y2="540" stroke="#059669" stroke-width="3" marker-end="url(#arr-ok)"/>
  <text x="110" y="430" font-size="11" fill="#059669" font-weight="700">光合 / 化能自养固定</text>
  <text x="110" y="445" font-size="11" fill="#059669" font-weight="700">（生产者）</text>
  <text x="110" y="480" font-size="10" fill="#475569">蓝细菌 · 藻类 · 硝化菌 · 硫氧化菌经 Calvin 等途径固碳</text>
  <rect x="262.6363" y="560.225" width="194.72740000000005" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="360" y="574.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">有机物（生物量 · 残体 · 排泄物）</text>
  <line x1="480" y1="540" x2="480" y2="388" stroke="#0f766e" stroke-width="3" marker-end="url(#arr-dna)"/>
  <text x="510" y="430" font-size="11" fill="#134e4a" font-weight="700">呼吸与发酵矿化</text>
  <text x="510" y="445" font-size="11" fill="#134e4a" font-weight="700">（分解者收尾）</text>
  <text x="510" y="480" font-size="10" fill="#475569">彻底分解为 CO₂ 归还大气——碳的主循环闭合</text>
  <line x1="430" y1="588" x2="560" y2="588" stroke="#b45309" stroke-width="2.4" marker-end="url(#arr-rna)"/>
  <text x="495" y="576" font-size="9.5" fill="#64748b" text-anchor="middle">无氧环境</text>
  <rect x="561.398725" y="578.225" width="37.20255" height="19.55" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="580" y="592.14" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">CH₄</text>
  <text x="560" y="618" font-size="10" fill="#64748b" text-anchor="middle">产甲烷古菌</text>
  <text x="50" y="630" font-size="10.5" fill="#475569">未被完全矿化的有机碳埋藏为化石燃料——燃烧将其快速释放，打破收支平衡。</text>
  <rect x="710" y="314" width="660" height="332" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="336.84" font-size="19" fill="#475569" font-weight="700">三、氮循环：微生物独揽全部关键反应</text>
  <rect x="994.0494" y="361.8" width="81.9012" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1035" y="376.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">N₂（大气）</text>
  <line x1="960" y1="392" x2="890" y2="460" stroke="#059669" stroke-width="2.6" marker-end="url(#arr-ok)"/>
  <text x="860" y="420" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="700">生物固氮</text>
  <text x="760" y="436" font-size="9.5" fill="#64748b">根瘤菌 · 固氮菌（固氮酶）</text>
  <rect x="821.854475" y="468.225" width="76.29105000000001" height="19.55" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="860" y="482.14" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">NH₄⁺ / NH₃</text>
  <line x1="905" y1="500" x2="975" y2="545" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <text x="960" y="512" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">氨化（分解者）</text>
  <line x1="905" y1="478" x2="1145" y2="478" stroke="#be185d" stroke-width="2.4" marker-end="url(#arr-enz)"/>
  <text x="1025" y="464" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">硝化（两级）</text>
  <text x="1025" y="492" font-size="9.5" fill="#64748b" text-anchor="middle">亚硝化单胞菌 + 硝化杆菌</text>
  <rect x="1173.14135" y="468.225" width="43.7173" height="19.55" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1195" y="482.14" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">NO₃⁻</text>
  <line x1="1195" y1="498" x2="1130" y2="545" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <text x="1180" y="528" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">同化为有机氮</text>
  <rect x="978.62" y="560.225" width="112.76" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1035" y="574.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">有机氮（生物量）</text>
  <line x1="1215" y1="460" x2="1090" y2="392" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arr-bad)"/>
  <text x="1210" y="420" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">反硝化</text>
  <text x="1210" y="436" font-size="9.5" fill="#64748b" text-anchor="middle">返回大气</text>
  <text x="730" y="618" font-size="10.5" fill="#475569">固氮、氨化、硝化与反硝化全部由微生物驱动——植物的「可利用氮」几乎全部出自微生物之手。</text>
  <rect x="30" y="658" width="1340" height="322" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="680.84" font-size="19" fill="#475569" font-weight="700">四、微生物与动植物的共生；土壤与人体微生物组</text>
  <text x="60" y="692" font-size="13" fill="#059669" font-weight="700">与植物共生</text>
  <circle cx="74" cy="714" r="3.5" fill="#059669"/>
  <text x="88" y="718" font-size="11.5" fill="#1e293b" font-weight="700">根际 PGPR</text>
  <text x="218" y="718" font-size="10.5" fill="#475569">根系分泌物供养高密度菌群，促生防病</text>
  <circle cx="74" cy="752" r="3.5" fill="#059669"/>
  <text x="88" y="756" font-size="11.5" fill="#1e293b" font-weight="700">外生/丛枝菌根</text>
  <text x="218" y="756" font-size="10.5" fill="#475569">真菌以碳磷交换为核心与根互惠</text>
  <circle cx="74" cy="790" r="3.5" fill="#059669"/>
  <text x="88" y="794" font-size="11.5" fill="#1e293b" font-weight="700">地衣</text>
  <text x="218" y="794" font-size="10.5" fill="#475569">藻菌共生体——裸岩成土的先锋</text>
  <text x="470" y="692" font-size="13" fill="#d97706" font-weight="700">与动物共生</text>
  <circle cx="484" cy="710" r="3.5" fill="#d97706"/>
  <text x="498" y="714" font-size="11.5" fill="#1e293b" font-weight="700">瘤胃</text>
  <text x="558" y="714" font-size="10.5" fill="#475569">种间氢转移互营彻底分解纤维素</text>
  <circle cx="484" cy="748" r="3.5" fill="#d97706"/>
  <text x="498" y="752" font-size="11.5" fill="#1e293b" font-weight="700">白蚁肠道</text>
  <text x="558" y="752" font-size="10.5" fill="#475569">共生微生物消化特殊底物</text>
  <circle cx="484" cy="786" r="3.5" fill="#d97706"/>
  <text x="498" y="790" font-size="11.5" fill="#1e293b" font-weight="700">深海管虫</text>
  <text x="558" y="790" font-size="10.5" fill="#475569">体内化能自养菌供养整个群落</text>
  <rect x="850" y="700" width="480" height="118" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.5"/>
  <text x="870" y="724" font-size="13" fill="#075985" font-weight="700">人体微生物组</text>
  <text x="870" y="748" font-size="10.5" fill="#475569">经典估计约 10¹⁴ 个细胞（为自身细胞的 10 倍）；直接计数修订为约 3.8×10¹³（约 1:1）。</text>
  <text x="870" y="763" font-size="10.5" fill="#475569">微生物基因数远超人类基因组约 2 万个基因——「第二基因组」。</text>
  <text x="870" y="800" font-size="10.5" fill="#475569">承担免疫训练、维生素合成与定植抗力；失调与代谢免疫疾病相关。</text>
  <rect x="50" y="840" width="620" height="116" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.5"/>
  <text x="70" y="864" font-size="13" fill="#134e4a" font-weight="700">土壤：微生物的大本营</text>
  <text x="70" y="888" font-size="11" fill="#475569">每克肥土含 10⁷–10⁹ 个微生物——数量最大、多样性最高、抗生素资源最富的微生物储库。</text>
  <rect x="700" y="840" width="630" height="116" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="720" y="864" font-size="13" fill="#1e293b" font-weight="700">研究模型</text>
  <text x="720" y="888" font-size="11" fill="#475569">无菌动物与悉生动物证明菌群对免疫发育与营养供应的因果性贡献；宏基因组学绕开培养直接读取群落基因。</text>
</svg>