  <text x="900" y="570" font-size="10.5" fill="#475569" text-anchor="middle">获自身 MHC 限制性</text>
  <text x="900" y="586" font-size="10.5" fill="#475569" text-anchor="middle">定向为 CD4 或 CD8 单阳性</text>
  <line x1="1034" y1="564" x2="1066" y2="564" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
