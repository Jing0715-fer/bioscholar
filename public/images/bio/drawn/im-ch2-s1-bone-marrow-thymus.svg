  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">中枢免疫器官：骨髓与胸腺的育成与质检</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">骨髓育成 B 细胞（重排 → 前 BCR 校验 → 中枢耐受筛选）并兼为浆细胞定居场所；胸腺经阳性选择赋予自身 MHC 限制性、阴性选择清除自身反应克隆，约 95% 胸腺细胞被淘汰，仅约 5% 以初始 T 细胞形式输出；AIRE 缺陷致自身免疫性多内分泌病</text>
  <rect x="30" y="132" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、中枢免疫器官：骨髓（B 细胞）与胸腺（T 细胞）的育成与质检</text>
