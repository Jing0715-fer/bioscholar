  <rect x="30" y="794" width="1340" height="184" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="816.84" font-size="19" fill="#475569" font-weight="700">三、临床注脚：当中枢「质检」失灵</text>
  <rect x="60" y="830" width="620" height="118" rx="9" fill="#ede9fe" fill-opacity="0.3" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="80" y="858" font-size="13.5" fill="#4c1d95" font-weight="700">AIRE 与组织限制性抗原</text>
  <text x="80" y="882" font-size="11.5" fill="#475569">AIRE 驱动胸腺髓质上皮细胞异位表达组织限制性抗原，让阴性选择得以「阅尽」全身自身抗原；</text>
  <text x="80" y="899" font-size="11.5" fill="#475569">AIRE 基因缺陷 → 自身免疫性多内分泌病。</text>
  <rect x="720" y="830" width="620" height="118" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.6"/>
  <text x="740" y="858" font-size="13.5" fill="#dc2626" font-weight="700">DiGeorge 综合征与裸鼠</text>
  <text x="740" y="882" font-size="11.5" fill="#475569">胸腺发育缺陷的经典模型：T 细胞无从育成、细胞免疫严重受损——从反面印证「胸腺是 T 细胞的学校」。</text>
