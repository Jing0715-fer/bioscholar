  <text x="577" y="814" font-size="8.5" fill="#64748b" text-anchor="middle">NMR / GC / LC</text>
  <rect x="696" y="768" width="186" height="64" rx="8" fill="#f1f5f9" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="789" y="794" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">峰提取 · 鉴定</text>
  <text x="789" y="814" font-size="8.5" fill="#64748b" text-anchor="middle">HMDB · KEGG · MassBank</text>
  <rect x="908" y="768" width="186" height="64" rx="8" fill="#f1f5f9" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1001" y="794" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">多变量统计</text>
  <text x="1001" y="814" font-size="8.5" fill="#64748b" text-anchor="middle">PCA 无监督 · PLS-DA 有监督</text>
  <rect x="1120" y="768" width="186" height="64" rx="8" fill="#f1f5f9" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1213" y="794" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">通路富集 · 解释</text>
  <text x="1213" y="814" font-size="8.5" fill="#64748b" text-anchor="middle">生物学意义</text>
  <line x1="248" y1="800" x2="268" y2="800" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="460" y1="800" x2="480" y2="800" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="672" y1="800" x2="692" y2="800" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="884" y1="800" x2="904" y2="800" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="1096" y1="800" x2="1116" y2="800" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <text x="60" y="848" font-size="11.5" fill="#475569" font-weight="700">③ 应用</text>
  <rect x="60" y="856" width="300" height="100" rx="9" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.4"/>
  <text x="74" y="880" font-size="12" fill="#075985" font-weight="700">疾病生物标志物</text>
  <text x="74" y="902" font-size="9.5" fill="#475569">糖尿病：支链 / 芳香族氨基酸升高早于血糖异常；</text>
  <text x="74" y="915.5" font-size="9.5" fill="#475569">产前串联质谱筛查遗传代谢病</text>
  <rect x="388" y="856" width="300" height="100" rx="9" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.4"/>
  <text x="402" y="880" font-size="12" fill="#075985" font-weight="700">药物研发与毒理</text>
  <text x="402" y="902" font-size="9.5" fill="#475569">肝肾毒性早期代谢指纹 · 药物代谢酶多态性分型</text>
  <rect x="716" y="856" width="300" height="100" rx="9" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.4"/>
  <text x="730" y="880" font-size="12" fill="#075985" font-weight="700">精准营养</text>
  <text x="730" y="902" font-size="9.5" fill="#475569">个体化膳食应答：肠道菌群-胆汁酸-短链脂肪酸轴</text>
  <rect x="1044" y="856" width="300" height="100" rx="9" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.4"/>
  <text x="1058" y="880" font-size="12" fill="#075985" font-weight="700">系统生物学</text>
  <text x="1058" y="902" font-size="9.5" fill="#475569">GEM 基因组尺度模型 + FBA 约束通量分析，预测细胞代谢行为</text>
