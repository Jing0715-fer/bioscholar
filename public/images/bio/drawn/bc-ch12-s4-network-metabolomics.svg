  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">代谢网络与代谢组学：交汇节点与小分子全局谱</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">三大代谢经 G6P/丙酮酸/乙酰CoA/OAA 节点互联（能量经济·互为倒数·分区分工）；代谢组学测 &lt;1000 Da 小分子谱：NMR·GC-MS·LC-MS + PCA/PLS-DA</text>
  <rect x="30" y="132" width="700" height="478" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、三大代谢的交汇网络：以节点互通</text>
  <rect x="100" y="196" width="70" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="218" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">糖原</text>
  <line x1="160" y1="232" x2="210" y2="276" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)" marker-start="url(#arr-ink)"/>
  <rect x="225" y="196" width="125" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="287" y="218" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">磷酸戊糖途径</text>
  <line x1="300" y1="232" x2="265" y2="276" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="334" y="196" width="104" height="34" rx="7" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="386" y="218" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">氨基酸碳架</text>
  <text x="386" y="184" font-size="8.5" fill="#64748b" text-anchor="middle">→ 丙酮酸 · 乙酰CoA · OAA · α-KG</text>
  <line x1="386" y1="232" x2="386" y2="276" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr-pro)"/>
  <rect x="472" y="196" width="112" height="34" rx="7" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.6"/>
  <text x="528" y="218" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">脂肪酸</text>
  <line x1="528" y1="232" x2="528" y2="276" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <text x="551" y="258" font-size="9.5" fill="#78350f" text-anchor="middle">β氧化</text>
  <rect x="56" y="288" width="90" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="101" y="313" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">葡萄糖</text>
  <line x1="146" y1="308" x2="178" y2="308" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="180" y="280" width="120" height="56" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.8"/>
  <text x="240" y="303" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">G6P</text>
  <text x="240" y="324" font-size="9" fill="#475569" text-anchor="middle">糖代谢分配点</text>
  <line x1="300" y1="308" x2="332" y2="308" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="334" y="280" width="104" height="56" rx="8" fill="#fce7f3" fill-opacity="0.55" stroke="#be185d" stroke-width="1.8"/>
  <text x="386" y="303" font-size="12.5" fill="#831843" text-anchor="middle" font-weight="700">丙酮酸</text>
  <text x="386" y="324" font-size="8.5" fill="#475569" text-anchor="middle">糖·脂·AA 枢纽</text>
  <line x1="438" y1="308" x2="470" y2="308" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="472" y="280" width="112" height="56" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#b45309" stroke-width="1.8"/>
  <text x="528" y="303" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="700">乙酰CoA</text>
  <text x="528" y="324" font-size="8.5" fill="#475569" text-anchor="middle">产能·合成共用入口</text>
  <line x1="584" y1="308" x2="606" y2="308" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <ellipse cx="650" cy="308" rx="40" ry="52" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.8"/>
  <text x="650" y="302" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">TCA</text>
  <text x="650" y="320" font-size="10.5" fill="#134e4a" text-anchor="middle">循环</text>
  <rect x="334" y="400" width="104" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="386" y="422" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">乳酸</text>
  <line x1="386" y1="396" x2="386" y2="342" stroke="#be185d" stroke-width="1.8" marker-end="url(#arr-enz)" marker-start="url(#arr-enz)"/>
  <text x="398" y="374" font-size="8.5" fill="#64748b">Cori 循环</text>
  <rect x="440" y="400" width="100" height="34" rx="7" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.6"/>
  <text x="490" y="422" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">酮体</text>
  <line x1="500" y1="336" x2="500" y2="396" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <line x1="565" y1="336" x2="580" y2="394" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <text x="575" y="416" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">脂肪酸合成</text>
  <rect x="613.3557" y="372.35" width="69.2886" height="15.299999999999999" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="648" y="383.24" font-size="9" fill="#134e4a" text-anchor="middle" font-weight="700">草酰乙酸 OAA</text>
  <text x="648" y="406" font-size="9" fill="#134e4a" text-anchor="middle" font-weight="600">α-酮戊二酸</text>
  <path d="M610,388 C520,485 320,485 240,342" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-dna)"/>
  <text x="420" y="474" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">糖异生（OAA → 葡萄糖）</text>
  <rect x="56" y="400" width="90" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="101" y="422" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">甘油</text>
  <line x1="101" y1="396" x2="205" y2="344" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-acc)"/>
  <text x="56" y="452" font-size="9" fill="#64748b">甘油 → 磷酸二羟丙酮 → 糖异生入糖</text>
  <text x="56" y="505" font-size="10.5" fill="#475569">节点清单：G6P（糖代谢分配点）· 丙酮酸（糖↔脂 / 氨基酸枢纽）· 乙酰CoA（产能与合成共用入口）· 草酰乙酸（TCA 与糖异生交叉）</text>
  <text x="56" y="520" font-size="10.5" fill="#475569">· α-酮戊二酸（氨基酸与 TCA）· 甘油-3-磷酸 / 磷酸二羟丙酮（糖↔脂通道）。</text>
  <text x="56" y="548" font-size="10.5" fill="#1e293b" font-weight="600">三条原则贯穿全书：能量经济 · 互为倒数 · 分区与分工（见右图）。</text>
  <rect x="750" y="132" width="620" height="478" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="154.84" font-size="19" fill="#475569" font-weight="700">二、网络运行三原则与代谢组学定位</text>
  <rect x="766" y="196" width="588" height="70" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.6"/>
  <text x="782" y="222" font-size="12.5" fill="#075985" font-weight="700">① 能量经济</text>
  <text x="782" y="246" font-size="10.5" fill="#475569">ATP/ADP · NADH/NAD⁺ · NADPH/NADP⁺ 三对「能量货币」的状态决定通量方向</text>
  <rect x="766" y="278" width="588" height="70" rx="9" fill="#fce7f3" fill-opacity="0.45" stroke="#be185d" stroke-width="1.6"/>
  <text x="782" y="304" font-size="12.5" fill="#831843" font-weight="700">② 互为倒数</text>
  <text x="782" y="328" font-size="10.5" fill="#475569">合成与分解的限速酶受相反信号调节（F-2,6-BP；丙二酰CoA–CPT-I 互锁），避免无效循环</text>
  <rect x="766" y="360" width="588" height="70" rx="9" fill="#ede9fe" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="782" y="386" font-size="12.5" fill="#4c1d95" font-weight="700">③ 分区与分工</text>
  <text x="782" y="410" font-size="10.5" fill="#475569">亚细胞区室（胞质 / 线粒体 / 内质网）与器官分工（肝-脑-肌-脂）使矛盾反应并行不悖</text>
  <text x="766" y="458" font-size="13" fill="#1e293b" font-weight="700">代谢组学（metabolomics）</text>
  <text x="766" y="482" font-size="10.5" fill="#475569">研究特定时空下全部小分子代谢物（&lt; 1000 Da）的集合与动态变化——继基因组、转录组、蛋白质组学之后的「组学」成员；</text>
  <text x="766" y="497" font-size="10.5" fill="#475569">Nicholson 于 1999 年正式提出术语。</text>
  <text x="766" y="540" font-size="10.5" fill="#475569" font-weight="700">分层：</text>
  <rect x="826.1475" y="527.075" width="87.705" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="870" y="539.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="600">靶向：绝对定量</text>
  <rect x="970.74" y="527.075" width="98.52" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1020" y="539.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="600">非靶向：相对定量</text>
  <rect x="1122.37" y="527.075" width="55.26" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1150" y="539.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="600">脂质组学</text>
  <rect x="1224.2541" y="527.075" width="95.4918" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1272" y="539.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="600">通量组学（¹³C）</text>
  <rect x="30" y="644" width="1340" height="336" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="666.84" font-size="19" fill="#475569" font-weight="700">三、代谢组学技术路线：平台 → 流程 → 统计 → 应用</text>
  <text x="60" y="690" font-size="11.5" fill="#475569" font-weight="700">① 分析平台</text>
  <rect x="56" y="700" width="400" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="72" y="722" font-size="13" fill="#075985" font-weight="700">NMR（核磁共振）</text>
  <text x="72" y="740" font-size="10" fill="#475569">无偏向 · 可定量 · 灵敏度低</text>
  <rect x="500" y="700" width="400" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="516" y="722" font-size="13" fill="#075985" font-weight="700">GC-MS（气相色谱-质谱）</text>
  <text x="516" y="740" font-size="10" fill="#475569">需衍生化 · 适合挥发 / 极性物</text>
  <rect x="944" y="700" width="400" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="960" y="722" font-size="13" fill="#075985" font-weight="700">LC-MS/MS（液相色谱-质谱）</text>
  <text x="960" y="740" font-size="10" fill="#475569">覆盖最广 · 代谢组学主力</text>
  <text x="60" y="760" font-size="11.5" fill="#475569" font-weight="700">② 流程</text>
