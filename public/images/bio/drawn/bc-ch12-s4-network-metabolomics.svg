  <text x="153" y="814" font-size="8.5" fill="#64748b" text-anchor="middle">避免扰动</text>
  <rect x="272" y="768" width="186" height="64" rx="8" fill="#f1f5f9" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="365" y="794" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">代谢物提取</text>
  <text x="365" y="814" font-size="8.5" fill="#64748b" text-anchor="middle">保持稳态</text>
