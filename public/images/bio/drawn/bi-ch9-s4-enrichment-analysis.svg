  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">功能富集分析：超几何检验、GSEA 排序检验与解读陷阱</text>
  <text x="700" y="74" text-anchor="middle" font-size="16" fill="#64748b">ORA以超几何检验问「名单中某功能类别的占比是否显著超出背景期望」，背景集须与名单出自同一检测空间（第一守门规则）；GO三分支以真路径规则相连，顶层必然富集、</text>
  <text x="700" y="100" text-anchor="middle" font-size="16" fill="#64748b">信息量在中层；GSEA不设阈值，对全基因排序以富集分加标签置换检验，领先集揭示核心贡献成员；KEGG、Reactome与MSigDB各有侧重——富集结果是假设发生器而非结论本身</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、ORA 与超几何检验：背景集是第一守门规则</text>
  <rect x="70" y="190" width="400" height="232" rx="14" fill="#e0f2fe" fill-opacity="0.28" stroke="#0369a1" stroke-width="1.8"/>
  <text x="90" y="218" font-size="12.5" fill="#075985" font-weight="700">背景集：实际检测到的基因（共 N）</text>
  <ellipse cx="190" cy="322" rx="100" ry="82" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.8"/>
  <text x="158" y="316" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">目标名单</text>
  <text x="158" y="336" font-size="11" fill="#134e4a" text-anchor="middle">(n 个基因)</text>
  <ellipse cx="340" cy="322" rx="100" ry="82" fill="#fef3c7" fill-opacity="0.6" stroke="#b45309" stroke-width="1.8"/>
  <text x="372" y="316" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="700">通路基因集</text>
  <text x="372" y="336" font-size="11" fill="#78350f" text-anchor="middle">(M 个)</text>
  <text x="265" y="322" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">交叠 k</text>
  <rect x="500" y="190" width="170" height="196" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="585" y="214" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">超几何检验</text>
  <text x="512" y="238" font-size="10.5" fill="#475569">P(X ≥ k) ＝ Σ C(M, i)·C(N−M, n−i) ÷ C(N, n)</text>
  <text x="512" y="253" font-size="10.5" fill="#475569">（i = k…n）</text>
  <text x="512" y="302" font-size="10.5" fill="#64748b">问：名单中该类别的占比，</text>
  <text x="512" y="317" font-size="10.5" fill="#64748b">是否显著超出背景期望？</text>
  <text x="60" y="452" font-size="11.5" fill="#475569">背景集必须与名单出自同一检测空间——用「实际检测到的基因」而非「全基因组」作背景，是富集的第一守门规则。</text>
  <text x="60" y="500" font-size="11.5" fill="#64748b">常见输入：一份带阈值的差异基因名单（如 padj &lt; 0.05 且 |log₂FC| &gt; 1）。</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、GSEA：不设阈值的全基因排序检验</text>
  <text x="1040" y="178" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">全基因排序（按与表型的关联程度）</text>
  <rect x="740" y="190" width="600" height="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
