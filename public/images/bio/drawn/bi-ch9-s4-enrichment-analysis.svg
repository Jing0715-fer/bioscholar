  <text x="1220" y="699.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">全基因排序列表</text>
  <rect x="740" y="714" width="600" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="714" width="120" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="739.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">统计核心</text>
  <rect x="860" y="714" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="980" y="739.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">超几何检验</text>
  <rect x="1100" y="714" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1220" y="739.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">富集分 ＋ 标签置换</text>
  <rect x="740" y="754" width="120" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="779.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">方向性</text>
  <rect x="860" y="754" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="980" y="779.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">分上下调检验</text>
  <rect x="1100" y="754" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1220" y="779.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">可做带方向的检验</text>
  <rect x="809.8045" y="826.225" width="110.391" height="19.55" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="865" y="840.14" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="600">KEGG 手工通路图</text>
  <rect x="1010.18495" y="826.225" width="119.63010000000001" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1070" y="840.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="600">Reactome 开放友好</text>
  <rect x="1213.7521" y="826.225" width="108.4958" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1268" y="840.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="600">MSigDB 标准总库</text>
  <text x="740" y="872" font-size="11.5" fill="#475569">KEGG 以手工通路图见长但须核对许可版本；Reactome 反应层级开放友好；</text>
  <text x="740" y="888" font-size="11.5" fill="#475569">MSigDB 是 GSEA 的标准基因集总库——标识符转换丢基因是高频实操事故。</text>
  <text x="740" y="920" font-size="11.5" fill="#dc2626">解读陷阱：</text>
  <text x="740" y="936" font-size="11.5" fill="#dc2626">背景集不当 · 集合冗余 · 方向失明 · 把富集当因果 · 输入泄漏——分上下调检验或带方向的 GSEA 可治方向失明；</text>
  <text x="740" y="952" font-size="11.5" fill="#dc2626">富集结果是假设发生器，而非结论本身。</text>
</svg>