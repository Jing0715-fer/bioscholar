  <text x="980" y="657.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">ORA（超几何）</text>
  <rect x="1100" y="630" width="240" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1220" y="657.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">GSEA</text>
