  <text x="740" y="492" font-size="13" fill="#64748b" text-anchor="middle">排序前端</text>
  <line x1="1340" y1="470" x2="1340" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="1340" y="492" font-size="13" fill="#64748b" text-anchor="middle">末端</text>
  <line x1="734" y1="470" x2="740" y2="470" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="474" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="734" y1="320" x2="740" y2="320" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="324" font-size="13" fill="#64748b" text-anchor="end">ES</text>
  <text x="694" y="395" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">运行和 ES</text>
  <text x="1040" y="308" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">富集分曲线（示意）</text>
  <path d="M740,467 C745.0,465.0 760.0,459.5 770,455 C780.0,450.5 791.0,446.3 800,440 C809.0,433.8 816.0,426.3 824,417.5 C832.0,408.8 840.0,396.8 848,387.5 C856.0,378.3 862.0,369.5 872,362 C882.0,354.5 895.0,347.5 908,342.5 C921.0,337.5 933.0,332.8 950,332 C967.0,331.3 985.0,332.5 1010,338 C1035.0,343.5 1070.0,354.3 1100,365 C1130.0,375.8 1160.0,390.0 1190,402.5 C1220.0,415.0 1255.0,430.0 1280,440 C1305.0,450.0 1330.0,458.8 1340,462.5" fill="none" stroke="#be185d" stroke-width="3"/>
  <text x="950" y="294" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">领先集</text>
  <line x1="950" y1="320" x2="950" y2="470" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="1090" y="336" font-size="10.5" fill="#831843" font-weight="600">ES ＝ 曲线偏离零线的最大值</text>
  <text x="740" y="500" font-size="11.5" fill="#475569">GSEA 不设阈值：对全基因排序检验基因集成员的系统性偏移，以富集分（ES）加标签置换检验打分，</text>
  <text x="740" y="516" font-size="11.5" fill="#475569">领先集揭示核心贡献成员。</text>
  <rect x="30" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、GO 本体：三分支与真路径规则</text>
  <rect x="105.6392" y="625.8" width="88.7216" height="20.4" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="150" y="640.32" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">分子功能 MF</text>
  <rect x="315.6392" y="625.8" width="88.7216" height="20.4" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="360" y="640.32" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">生物过程 BP</text>
  <rect x="525.6392" y="625.8" width="88.7216" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="570" y="640.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">细胞组分 CC</text>
  <rect x="260" y="680" width="200" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="360" y="703" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">顶层术语（宽泛）</text>
  <rect x="260" y="740" width="200" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="360" y="763" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">中层术语（信息量高）</text>
  <rect x="260" y="800" width="200" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="360" y="823" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">末端术语（特异 · 稀疏）</text>
  <line x1="360" y1="740" x2="360" y2="718" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <line x1="360" y1="800" x2="360" y2="778" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <line x1="360" y1="650" x2="360" y2="680" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <text x="470" y="700" font-size="11" fill="#64748b">← 顶层：必然富集（汇总使然）</text>
  <text x="470" y="760" font-size="11" fill="#64748b">← 中层：信息量高，富集首选</text>
  <text x="470" y="820" font-size="11" fill="#64748b">← 末端：特异但覆盖稀疏</text>
  <text x="60" y="862" font-size="11.5" fill="#475569">GO 为有向无环图：真路径规则下，任一节点的注释沿边向上传播到其所有祖先——顶层术语必然富集，信息量在中层；</text>
  <text x="60" y="878" font-size="11.5" fill="#475569">GO slim 是精简版本体，供全景报告。</text>
  <text x="60" y="918" font-size="11.5" fill="#64748b">示例：注释到「过氧化物酶体」的基因，在其祖先「细胞器」与根术语「细胞组分」处同时可见——这正是真路径规则。</text>
  <rect x="710" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="598.84" font-size="19" fill="#475569" font-weight="700">四、通路数据库与解读陷阱</text>
