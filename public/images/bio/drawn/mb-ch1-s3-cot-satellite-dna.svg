  <text x="730" y="818" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">Alu（SINE）</text>
  <text x="610" y="852" font-size="11.5" fill="#64748b">7SL RNA 衍生 · 约 100 万拷贝；非自主元件，</text>
  <text x="610" y="869" font-size="11.5" fill="#64748b">借用 LINE-1 的 ORF2 酶系转座</text>
  <text x="940" y="786" font-size="13.5" fill="#1e293b" font-weight="700">重复序列与疾病 / 功能</text>
  <text x="940" y="812" font-size="12.5" fill="#475569">· 微卫星不稳定扩张：脆性 X 综合征、亨廷顿病（三核苷酸重复病）</text>
  <text x="940" y="831" font-size="12.5" fill="#475569">· 高度重复序列不编码产物：参与染色质结构维持、</text>
  <text x="940" y="850" font-size="12.5" fill="#475569">着丝粒形成与减数分裂配对 · 重复序列的扩增与重排是基因组进化的重要驱动力</text>
