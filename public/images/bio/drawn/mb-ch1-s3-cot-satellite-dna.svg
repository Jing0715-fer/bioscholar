  <text x="164" y="857" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">ORF1（RNA 结合蛋白）</text>
  <rect x="269" y="809" width="310" height="30" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <text x="424" y="857" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">ORF2（内切酶 + 逆转录酶）</text>
  <text x="60" y="884" font-size="11.5" fill="#64748b">TPRT：ORF2 在基因组靶点切口 → 以 LINE-1 mRNA 为模板反转录插入新拷贝</text>
  <line x1="584" y1="824" x2="606" y2="824" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <text x="610" y="786" font-size="13.5" fill="#78350f" font-weight="700">Alu 序列：约 280 bp</text>
