  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">DNA 序列的复杂性与卫星 DNA</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">Cot曲线把人基因组分为单一（约45%～50%）、中度重复（25%～30%）与高度重复（10%～15%）三类——卫星DNA按重复单位分大卫星171bp、小卫星6～25bp与微卫星1～6</text>
