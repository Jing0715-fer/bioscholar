  <text x="212" y="380" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">① 等比例浓缩</text>
  <text x="216" y="396" font-size="10" fill="#dc2626" text-anchor="middle">（蒸气扩散）</text>
  <text x="428" y="380" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">② 晶核消耗溶质</text>
  <text x="428" y="396" font-size="10" fill="#134e4a" text-anchor="middle">回落亚稳区养晶</text>
  <text x="300" y="460" font-size="10" fill="#475569" text-anchor="middle">亚稳区宽度因蛋白而异：宽者好养晶、窄者易跨入沉淀</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、经典成核理论：表面惩罚与体积收益的竞争</text>
  <text x="1040" y="196" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">ΔG(r) = 4πr<tspan dy="-4.4" font-size="9.4">2</tspan><tspan dy="4.4">γ − (4/3)πr</tspan><tspan dy="-4.4" font-size="9.4">3</tspan><tspan dy="4.4">·ρΔμ</tspan></text>
  <line x1="780" y1="480" x2="1314" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="780" y1="480" x2="780" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="1040" y="506" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">核半径 r →</text>
  <text x="770" y="206" font-size="12.5" fill="#475569" text-anchor="end" font-weight="600">ΔG</text>
  <line x1="780" y1="354" x2="1300" y2="354" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="1256" y="348" font-size="10.5" fill="#64748b" text-anchor="middle">0</text>
  <polyline points="780,354 910,345.32 1040,319 1170,275.32 1300,214" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 4"/>
  <polyline points="780,354 910,355.96 1040,368.7 1170,403.56 1300,471.6" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="7 4"/>
  <polyline points="780,354 842.4,347.84000000000003 910,342.24 977.6,337.2 1040,327.4 1092,323.2 1144,327.4 1196,344.20000000000005 1248,368 1300,396" fill="none" stroke="#be185d" stroke-width="3"/>
  <text x="1185.6" y="258.79999999999995" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">表面项 4πr<tspan dy="-3.7" font-size="7.9">2</tspan><tspan dy="3.7">γ</tspan></text>
  <text x="1102.4" y="424" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">体积项 −(4/3)πr<tspan dy="-3.7" font-size="7.9">3</tspan><tspan dy="3.7">ρΔμ</tspan></text>
  <text x="1102.4" y="306.4" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">ΔG 总曲线</text>
  <line x1="1092" y1="480" x2="1092" y2="323.2" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="1092" y="496" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700" font-style="italic">r*</text>
  <line x1="780" y1="323.2" x2="1092" y2="323.2" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="810" y="315.2" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700" font-style="italic">ΔG*</text>
  <text x="730" y="528" font-size="10.5" fill="#475569">临界核 r* = 2γ/(ρΔμ)；能垒 ΔG* = 16πγ<tspan dy="-3.6" font-size="7.6">3</tspan><tspan dy="3.6">/(3(Δμ)</tspan><tspan dy="-3.6" font-size="7.6">2</tspan><tspan dy="3.6">ρ</tspan><tspan dy="-3.6" font-size="7.6">2</tspan><tspan dy="3.6">)。成核速率近似正比于 exp(−ΔG*/kT)——对过饱和度极其陡峭：S = c/c*，</tspan></text>
  <text x="730" y="543.5" font-size="10.5" fill="#475569">Δμ = kT·ln S，小幅提高 S 可使速率跨越数个数量级（「一夜满板微晶」与「三周无一核」的两极命运）。</text>
  <rect x="30" y="572" width="660" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、两步成核：液滴先行</text>
  <rect x="55" y="630" width="130" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="120" y="652" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">① 过饱和溶液</text>
  <text x="120" y="670" font-size="9.5" fill="#64748b" text-anchor="middle">分子散布</text>
