  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">成核理论与结晶相图：四区、能垒与两步成核</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">相图四区（不饱和/亚稳/成核/沉淀）；ΔG(r)=4πr²γ−(4/3)πr³ρΔμ，r*=2γ/(ρΔμ)、ΔG*=16πγ³/(3(Δμ)²ρ²)；成核速率∝exp(−ΔG*/kT)；致密液滴先行；晶种解耦成核与生长</text>
