  <rect x="359" y="630" width="130" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="424" y="652" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">③ 滴内萌发晶核</text>
  <text x="424" y="670" font-size="9.5" fill="#64748b" text-anchor="middle">有序相出现</text>
  <circle cx="424" cy="706" r="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <rect x="414" y="696" width="20" height="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <line x1="424" y1="696" x2="424" y2="716" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="414" y1="706" x2="434" y2="706" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="511" y="630" width="130" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="576" y="652" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">④ 晶体</text>
  <text x="576" y="670" font-size="9.5" fill="#64748b" text-anchor="middle">逐层生长</text>
  <polygon points="549,688 585,682 598,702 583,726 548,722" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <line x1="186" y1="676" x2="204" y2="676" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="338" y1="676" x2="356" y2="676" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="490" y1="676" x2="508" y2="676" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="60" y="756" font-size="10.5" fill="#475569">韦基洛夫与潘等用光学显微镜对溶菌酶等体系给出直接证据：晶核在致密液滴中出现、</text>
  <text x="60" y="771.5" font-size="10.5" fill="#475569">液滴本身可逆涨落——解释成核对蛋白浓度异常陡的依赖与「先浑浊后出晶」的肉眼时序；</text>
  <text x="60" y="787" font-size="10.5" fill="#475569">「沉淀」与「结晶」由此从对立变成前后相继。</text>
  <text x="60" y="826" font-size="10.5" fill="#64748b">异相成核：尘埃、划痕、纤维、器壁与残晶充当现成界面——「半个核」已就位、能垒更低。无尘操作、</text>
  <text x="60" y="841.5" font-size="10.5" fill="#64748b">0.22 μm 过滤与硅化盖片的物理理由正在于此。</text>
  <rect x="710" y="572" width="660" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、成核要快、生长要慢：晶种解耦</text>
  <rect x="815.28" y="625.8" width="69.44" height="20.4" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="850" y="640.32" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">成核要快</text>
  <text x="850" y="668" font-size="10.5" fill="#475569" text-anchor="middle">须高过饱和跨过能垒</text>
  <line x1="960" y1="636" x2="1050" y2="636" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="1005" y="620" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">时间上切开</text>
  <rect x="1125.28" y="625.8" width="69.44" height="20.4" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1160" y="640.32" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">生长要慢</text>
  <text x="1160" y="668" font-size="10.5" fill="#475569" text-anchor="middle">低过饱和逐层铺展、缺陷最少</text>
  <text x="730" y="712" font-size="11.5" fill="#1e293b" font-weight="700">晶种三法（种子已就位，液滴只管在亚稳区内生长）：</text>
  <rect x="723.2" y="733.075" width="133.6" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="790" y="745.78" font-size="10.5" fill="#075985" text-anchor="middle">streak seeding 须晶划种</text>
  <rect x="912.6116" y="733.075" width="174.7768" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1000" y="745.78" font-size="10.5" fill="#075985" text-anchor="middle">microseeding 梯度稀释 10<tspan dy="-3.6" font-size="7.6">-1</tspan><tspan dy="3.6">–10</tspan><tspan dy="-3.6" font-size="7.6">-8</tspan></text>
  <rect x="1184.88" y="733.075" width="130.24" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1250" y="745.78" font-size="10.5" fill="#075985" text-anchor="middle">macro-seeding 大晶续长</text>
  <text x="730" y="782" font-size="10.5" fill="#475569">与晶种组合的 MMS（微晶种基质筛选）把「成核数目」变成可调参数——在整套面板上逐条件投送同一种子，</text>
  <text x="730" y="797.5" font-size="10.5" fill="#475569">常把「永不结晶」的蛋白拉出 hit。</text>
  <text x="730" y="838" font-size="10.5" fill="#64748b">奥斯特瓦尔德阶段规则：体系常先析出与母相界面能最低的亚稳相——同一液滴先后两种晶型、第一波微晶被取代皆由此解释；</text>
  <text x="730" y="853.5" font-size="10.5" fill="#64748b">最先出现的晶体未必是最终值得收集的那一个。</text>
  <text x="1040" y="920" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">工业蛋白结晶（胰岛素量产纯化）与结构生物学结晶同遵此框架</text>
</svg>