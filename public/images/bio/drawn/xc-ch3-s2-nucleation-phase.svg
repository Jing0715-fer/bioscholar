  <rect x="207" y="630" width="130" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="272" y="652" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">② 致密液滴</text>
  <text x="272" y="670" font-size="9.5" fill="#64748b" text-anchor="middle">无序·可逆涨落</text>
  <circle cx="272" cy="706" r="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <circle cx="287" cy="706" r="2.2" fill="#b45309"/>
  <circle cx="284.9903810567666" cy="711.5" r="2.2" fill="#b45309"/>
  <circle cx="279.5" cy="715.5262794416288" r="2.2" fill="#b45309"/>
  <circle cx="272" cy="717" r="2.2" fill="#b45309"/>
  <circle cx="264.5" cy="715.5262794416288" r="2.2" fill="#b45309"/>
  <circle cx="259.0096189432334" cy="711.5" r="2.2" fill="#b45309"/>
  <circle cx="257" cy="706" r="2.2" fill="#b45309"/>
  <circle cx="259.0096189432334" cy="700.5" r="2.2" fill="#b45309"/>
