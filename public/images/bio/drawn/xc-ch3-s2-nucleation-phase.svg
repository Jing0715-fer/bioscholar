  <text x="84" y="172" font-size="13" fill="#475569" text-anchor="middle" font-weight="600">蛋白浓度 ↑</text>
  <text x="490" y="478" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">不饱和区</text>
  <text x="490" y="497" font-size="10" fill="#64748b" text-anchor="middle">晶体溶解、变小</text>
  <text x="430" y="428" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">亚稳区</text>
  <text x="430" y="447" font-size="10" fill="#64748b" text-anchor="middle">只长不生·养晶区</text>
  <text x="430" y="378" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">成核区</text>
  <text x="430" y="397" font-size="10" fill="#64748b" text-anchor="middle">新核不断冒出</text>
  <text x="300" y="215" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">沉淀区</text>
  <text x="300" y="234" font-size="10" fill="#dc2626" text-anchor="middle">絮状·油滴·聚集</text>
  <text x="500" y="386" font-size="10" fill="#475569" text-anchor="middle" font-weight="600">溶解度曲线</text>
  <path d="M 170,468 C 240,430 300,392 330,332" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arr-bad)"/>
