<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">跨种传播与人兽共患：四阶段、蝙蝠病毒库与种属屏障</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">60%–75% 新发人类传染病为人兽共患；储存宿主—溢出—人传人—流行四阶段；SARS／MERS／SARS-CoV-2（RaTG13 约 96%）三种结局；H5N1 病死率过半、2024 牛群感染</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、跨种传播的四个阶段</text>
  <text x="46" y="190" font-size="11" fill="#475569">对二十世纪末以来新发传染病的系统评估显示：约 60%–75% 的新发人类传染病源于人兽共患，</text>
  <text x="46" y="206" font-size="11" fill="#475569">其中多数病毒的源头为野生动物。</text>
  <rect x="56" y="240" width="142" height="168" rx="10" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="127" y="396" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">储存宿主循环</text>
  <text x="68" y="414" font-size="9.5" fill="#64748b">动物种群内长期维持</text>
  <line x1="200" y1="324" x2="210" y2="324" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="212" y="240" width="142" height="168" rx="10" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="283" y="396" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">溢出</text>
  <text x="224" y="414" font-size="9.5" fill="#64748b">偶然跨种感染个体</text>
  <line x1="356" y1="324" x2="366" y2="324" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="368" y="240" width="142" height="168" rx="10" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="439" y="396" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">获得人传人</text>
  <text x="380" y="414" font-size="9.5" fill="#64748b">适应人际传播链条</text>
  <line x1="512" y1="324" x2="522" y2="324" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="524" y="240" width="142" height="168" rx="10" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="595" y="396" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">人群流行</text>
  <text x="536" y="414" font-size="9.5" fill="#64748b">社区乃至全球扩散</text>
  <polygon points="119,290 101,281 113,295" fill="#0f766e" fill-opacity="0.7"/>
  <polygon points="135,290 153,281 141,295" fill="#0f766e" fill-opacity="0.7"/>
  <ellipse cx="127" cy="290" rx="9" ry="6" fill="#0f766e" fill-opacity="0.85"/>
  <polygon points="123,285 120,280 126,284" fill="#0f766e"/>
  <polygon points="131,285 134,280 128,284" fill="#0f766e"/>
  <circle cx="127" cy="290" r="36" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="5 4"/>
  <polygon points="250,280 232,271 244,285" fill="#0f766e" fill-opacity="0.7"/>
  <polygon points="266,280 284,271 272,285" fill="#0f766e" fill-opacity="0.7"/>
  <ellipse cx="258" cy="280" rx="9" ry="6" fill="#0f766e" fill-opacity="0.85"/>
  <polygon points="254,275 251,270 257,274" fill="#0f766e"/>
  <polygon points="262,275 265,270 259,274" fill="#0f766e"/>
  <circle cx="332" cy="292" r="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="327" y="300" width="10" height="18" rx="3" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="276" y1="284" x2="312" y2="288" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="295" y="268" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">溢出</text>
  <circle cx="440" cy="282" r="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="435" y="290" width="10" height="18" rx="3" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="492" cy="282" r="6" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="487" y="290" width="10" height="18" rx="3" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="458" y1="292" x2="474" y2="292" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <line x1="474" y1="306" x2="458" y2="306" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <rect x="560" y="288" width="90" height="56" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <path d="M560,342.88 C564.5,340.7 578.8,338.7 587,330 C595.3,321.3 602.0,293.1 609.5,290.8 C617.0,288.5 625.3,308.5 632,316 C638.8,323.5 647.0,332.3 650,335.6" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <text x="46" y="466" font-size="10.5" fill="#475569">溢出未必成疫：多数跨种跳跃止步于第二阶段；一旦获得稳定的人传人能力，才可能点燃人群流行。</text>
  <text x="46" y="500" font-size="10.5" fill="#64748b">生态界面治理（土地利用、活体动物市场、养殖场选址）正是干预的关键窗口。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、蝙蝠：异常重要的病毒库</text>
  <polygon points="872,300 854,291 866,305" fill="#134e4a" fill-opacity="0.7"/>
  <polygon points="888,300 906,291 894,305" fill="#134e4a" fill-opacity="0.7"/>
  <ellipse cx="880" cy="300" rx="9" ry="6" fill="#134e4a" fill-opacity="0.85"/>
  <polygon points="876,295 873,290 879,294" fill="#134e4a"/>
  <polygon points="884,295 887,290 881,294" fill="#134e4a"/>
  <rect x="802.7025" y="199.075" width="154.595" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="880" y="211.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">飞行高温（每日发热样代谢）</text>
  <rect x="722.06135" y="253.075" width="115.8773" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="780" y="265.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">STING 通路低反应性</text>
  <rect x="950.555" y="253.075" width="78.89" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="990" y="265.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">组成性干扰素</text>
  <rect x="813.9501" y="357.075" width="132.09980000000002" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="880" y="369.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">长寿 · 高密度群居 · 冬眠</text>
  <text x="880" y="412" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">低炎症＋高耐受的免疫模式</text>
  <text x="726" y="452" font-size="10.5" fill="#475569">亨德拉（1994，澳大利亚，狐蝠经马）、尼帕（1998，马来西亚，狐蝠经猪）、SARSr-CoV 等均以蝙蝠为储存宿主。</text>
  <text x="726" y="488" font-size="10.5" fill="#64748b">尼帕 1998 年的暴发与养猪场侵入蝙蝠觅食区直接相关——土地利用变化把人类与蝙蝠、啮齿类推入新接触。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、三次冠状病毒跨种事件：三种结局</text>
  <rect x="50" y="660" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="687.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">事件</text>
  <rect x="160" y="660" width="70" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="195" y="687.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">年份</text>
  <rect x="230" y="660" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="355" y="687.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">动物环节</text>
  <rect x="480" y="660" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="565" y="687.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">结局</text>
  <rect x="50" y="704" width="110" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="732.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">SARS-CoV</text>
  <rect x="160" y="704" width="70" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="195" y="732.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">2003</text>
  <rect x="230" y="704" width="250" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="355" y="732.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">果子狸（放大宿主）</text>
  <rect x="480" y="704" width="170" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="565" y="732.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">疫情被扑灭</text>
  <rect x="50" y="750" width="600" height="46" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="750" width="110" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="778.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">MERS-CoV</text>
  <rect x="160" y="750" width="70" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="195" y="778.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">2012</text>
  <rect x="230" y="750" width="250" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="355" y="778.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">骆驼（稳定界面）</text>
  <rect x="480" y="750" width="170" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="565" y="778.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">持续零星溢出</text>
  <rect x="50" y="796" width="110" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="824.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">SARS-CoV-2</text>
  <rect x="160" y="796" width="70" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="195" y="824.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">2019 起</text>
  <rect x="230" y="796" width="250" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="355" y="824.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">中间环节未定（RaTG13 同源性约 96%）</text>
  <rect x="480" y="796" width="170" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="565" y="824.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">全球大流行</text>
  <text x="50" y="862" font-size="10.5" fill="#475569">SARS-CoV 经果子狸放大而 MERS-CoV 与骆驼建立稳定界面；SARS-CoV-2 的最近亲属为蝙蝠 RaTG13（同源性约 96%），</text>
  <text x="50" y="877" font-size="10.5" fill="#475569">中间环节未定——起源仍在调查。</text>
  <text x="50" y="900" font-size="10.5" fill="#64748b">同一类病毒、三种跨种结局：围堵、拉锯与大流行。</text>
  <rect x="710" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="608.84" font-size="19" fill="#475569" font-weight="700">四、禽流感 H5N1：种属屏障的分子构成</text>
  <text x="730" y="644" font-size="12" fill="#1e293b" font-weight="700">三道屏障：</text>
  <rect x="730" y="662" width="320" height="44" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="742" y="681" font-size="11" fill="#dc2626" font-weight="700">① 受体连接方式</text>
  <text x="742" y="697" font-size="9.5" fill="#475569">α2,6 与 α2,3 唾液酸的组织分布</text>
  <rect x="730" y="716" width="320" height="44" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="742" y="735" font-size="11" fill="#dc2626" font-weight="700">② HA 多碱性切割位点</text>
  <text x="742" y="751" font-size="9.5" fill="#475569">需多种蛋白酶活化方能高效入侵</text>
  <rect x="730" y="770" width="320" height="44" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="742" y="789" font-size="11" fill="#dc2626" font-weight="700">③ PB2 627K–ANP32A</text>
  <text x="742" y="805" font-size="9.5" fill="#475569">聚合酶辅主因子的种属适配</text>
  <text x="1080" y="656" font-size="10.5" fill="#475569">1997 年香港以来，</text>
  <text x="1080" y="671" font-size="10.5" fill="#475569">H5N1 全球累计人间病例八百余例、</text>
  <text x="1080" y="686" font-size="10.5" fill="#475569">死亡四百余例——病死率过半。</text>
  <text x="1080" y="716" font-size="10.5" fill="#475569">2020 年以来 2.3.4.4b 分支在候鸟中泛动物流行，</text>
  <text x="1080" y="731" font-size="10.5" fill="#475569">多次溢出至海狮等哺乳动物。</text>
  <text x="1080" y="776" font-size="10.5" fill="#dc2626">2024 年更现北美奶牛场牛群感染与工人暴露：</text>
  <text x="1080" y="791" font-size="10.5" fill="#dc2626">病毒经乳汁与挤奶设备在牛群间高效传播——哺乳动物适应的门槛远比想象中低。</text>
  <text x="730" y="856" font-size="11.5" fill="#1e293b" font-weight="700">宿主范围的分子决定因素：</text>
  <rect x="732.2" y="871.5" width="32.6" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="748.5" y="883.6" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">受体</text>
  <rect x="779.5" y="871.5" width="63.5" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="811.25" y="883.6" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">蛋白酶活化</text>
  <rect x="858.1" y="871.5" width="73.80000000000001" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="895" y="883.6" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">聚合酶辅因子</text>
  <rect x="947.1" y="871.5" width="73.80000000000001" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="984" y="883.6" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">免疫拮抗匹配</text>
  <rect x="1035.7" y="871.5" width="32.6" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1052" y="883.6" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">温度</text>
  <text x="730" y="920" font-size="10.5" fill="#64748b">生态界面治理是 One Health 的干预点：溢出预防优于疫情应对。</text>
</svg>