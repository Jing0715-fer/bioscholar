  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">感觉的一般生理：换能、适应与 Weber–Fechner 定律</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">快适应报告变化、慢适应监测变量、伤害性几乎不适应；Weber 分数越小辨别越敏锐</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、五类感受器与适宜刺激：感觉性质由专线通路决定</text>
