  <text x="690" y="754" font-size="10.5" fill="#475569" text-anchor="end" font-weight="600">强 → 高频</text>
  <text x="60" y="800" font-size="11" fill="#475569">量的编码靠放电频率、纤维募集与时间模式；感觉单位的感受野大小决定空间分辨本领——两点辨别在指尖最锐、在背部最钝。</text>
  <text x="70" y="862" font-size="11.5" fill="#64748b" font-weight="700">刺激能量 → 分级感受器电位 → 达阈值即在传入纤维上诱发动作电位</text>
  <rect x="710" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
