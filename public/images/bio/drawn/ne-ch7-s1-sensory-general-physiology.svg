  <text x="1147.04" y="499.96" font-size="11" fill="#475569">伤害性（不适应）</text>
  <text x="760" y="536" font-size="10.5" fill="#475569">环层小体在恒压下数十毫秒内近乎沉默——「衣物不再被察觉」；肌梭须随时报告肌肉长度以支撑姿势；</text>
  <text x="760" y="550" font-size="10.5" fill="#475569">伤害性感受器几乎不适应甚至敏化（阈值降低、放电增强），与其「报警器」职能一致。</text>
  <rect x="30" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、换能与编码：模拟量进、数字量出</text>
  <text x="70" y="650" font-size="12" fill="#1e293b" font-weight="700">感受器电位（分级、可总和）</text>
