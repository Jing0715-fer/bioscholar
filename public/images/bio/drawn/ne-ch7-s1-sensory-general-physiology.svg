  <rect x="200" y="240" width="150" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="267.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">压力 / 振动 / 牵拉</text>
  <rect x="350" y="240" width="160" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="267.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">环层小体 · 肌梭</text>
