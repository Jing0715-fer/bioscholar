  <text x="585" y="399.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">视觉</text>
  <rect x="60" y="416" width="140" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="443.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">伤害性感受器</text>
  <rect x="200" y="416" width="150" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="443.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">组织损伤性刺激</text>
  <rect x="350" y="416" width="160" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="443.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">高阈值游离末梢</text>
  <rect x="510" y="416" width="150" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="585" y="443.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">痛觉</text>
  <text x="60" y="500" font-size="11" fill="#475569">耳蜗的适宜刺激是 20–20000 Hz 的空气振动、肌梭是肌肉长度改变。感觉性质并非由刺激能量形式决定，</text>
  <text x="60" y="516" font-size="11" fill="#475569">而由专线通路连接的中枢部位决定——Müller「特殊神经能量定律」：无论以何种方式兴奋视神经，</text>
  <text x="60" y="532" font-size="11" fill="#475569">产生的感觉永远是「光」。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、感觉适应：快适应报告变化，慢适应监测变量</text>
