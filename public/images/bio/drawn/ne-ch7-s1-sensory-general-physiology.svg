  <text x="130" y="355.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">温度感受器</text>
  <rect x="200" y="328" width="150" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="355.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">温度变化</text>
