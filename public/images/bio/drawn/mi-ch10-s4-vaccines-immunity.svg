<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">特异性免疫与免疫防治：应答动力学、五类 Ig 与疫苗四代技术</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">初次应答慢低（IgM）、再次应答快高（IgG且亲和力成熟）——0-1-6月程序与4倍升高原则的依据；疫苗四代：减毒、灭活、亚单位/结合、mRNA；主动诱导记忆，</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">被动即时报护</text>
  <rect x="30" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、初次与再次应答：疫苗加强程序的依据</text>
  <rect x="70" y="180" width="560" height="150" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="70" y1="292.5" x2="630" y2="292.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="210" y1="330" x2="210" y2="180" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="70" y1="255" x2="630" y2="255" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="350" y1="330" x2="350" y2="180" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="70" y1="217.5" x2="630" y2="217.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="490" y1="330" x2="490" y2="180" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="193.2" y1="330" x2="193.2" y2="336" stroke="#475569" stroke-width="1.8"/>
  <text x="193.2" y="352" font-size="13" fill="#64748b" text-anchor="middle">初次应答</text>
  <line x1="450.8" y1="330" x2="450.8" y2="336" stroke="#475569" stroke-width="1.8"/>
  <text x="450.8" y="352" font-size="13" fill="#64748b" text-anchor="middle">再次应答</text>
  <line x1="64" y1="322.5" x2="70" y2="322.5" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="326.5" font-size="13" fill="#64748b" text-anchor="end">低</text>
  <line x1="64" y1="255" x2="70" y2="255" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="259" font-size="13" fill="#64748b" text-anchor="end">中</text>
  <line x1="64" y1="187.5" x2="70" y2="187.5" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="191.5" font-size="13" fill="#64748b" text-anchor="end">高</text>
  <text x="350" y="374" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">抗原刺激后时间</text>
  <text x="100" y="196" font-size="10" fill="#475569" font-weight="600">血清抗体效价</text>
  <path d="M92.4,327.0 L148.4,322.5 L193.2,312.0 L238.0,285.0 L282.8,267.0 L338.8,276.0 L417.2,297.0 L473.2,306.0 L546.0,312.0 L630.0,318.0" fill="none" stroke="#0369a1" stroke-width="2.8"/>
  <path d="M394.8,327.0 L422.8,315.0 L439.6,285.0 L462.0,237.0 L484.4,202.5 L518.0,187.5 L562.8,192.0 L630.0,198.0" fill="none" stroke="#0f766e" stroke-width="3"/>
  <rect x="90" y="213.59" width="11.55" height="8.82" rx="3" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="109.55" y="221.78" font-size="10.5" fill="#475569">初次应答（IgM 先锋）</text>
  <rect x="225.39" y="213.59" width="11.55" height="8.82" rx="3" fill="#0f766e" stroke="#cbd5e1" stroke-width="1"/>
  <text x="244.94" y="221.78" font-size="10.5" fill="#475569">再次应答（IgG，更快更高）</text>
  <line x1="394.79999999999995" y1="338" x2="394.79999999999995" y2="325.5" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="394.79999999999995" y="354" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">再次抗原刺激</text>
  <text x="70" y="394" font-size="10.5" fill="#475569">潜伏期短、峰值高、类别转 IgG、</text>
  <text x="70" y="409" font-size="10.5" fill="#475569">亲和力成熟——这是乙肝疫苗 0-1-6 月加强程序与「恢复期血清抗体效价 4 倍升高」诊断原则的共同依据。</text>
  <rect x="710" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、五类免疫球蛋白的职能分工</text>
  <rect x="740.1232" y="175.8" width="39.7536" height="20.4" rx="7" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.5"/>
  <text x="760" y="190.32" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">IgM</text>
  <text x="820" y="190" font-size="11.5" fill="#475569">初次应答先锋；五聚体，早期诊断标志</text>
  <rect x="740.1232" y="221.8" width="39.7536" height="20.4" rx="7" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="760" y="236.32" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">IgG</text>
  <text x="820" y="236" font-size="11.5" fill="#475569">血清主力（约占血清 Ig 的 75%）；唯一能跨胎盘</text>
  <rect x="736.9096" y="267.8" width="46.180800000000005" height="20.4" rx="7" fill="#f1f5f9" stroke="#059669" stroke-width="1.5"/>
  <text x="760" y="282.32" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">sIgA</text>
  <text x="820" y="282" font-size="11.5" fill="#475569">黏膜防线（初乳输送婴儿）</text>
  <rect x="740.1232" y="313.8" width="39.7536" height="20.4" rx="7" fill="#f1f5f9" stroke="#d97706" stroke-width="1.5"/>
  <text x="760" y="328.32" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">IgE</text>
  <text x="820" y="328" font-size="11.5" fill="#475569">速发型过敏；抗寄生虫</text>
  <rect x="740.1232" y="359.8" width="39.7536" height="20.4" rx="7" fill="#f1f5f9" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="760" y="374.32" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="700">IgD</text>
  <text x="820" y="374" font-size="11.5" fill="#475569">成熟 B 细胞受体</text>
  <text x="730" y="424" font-size="10.5" fill="#64748b">生发中心的体细胞高频突变与类别转换均由 AID 介导——前者成就亲和力成熟，后者成就类别多样化。</text>
  <rect x="30" y="444" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="466.84" font-size="19" fill="#475569" font-weight="700">三、主动免疫：疫苗四代技术对照（人工免疫防治的主力）</text>
  <rect x="60" y="494" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="521.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">技术代次</text>
  <rect x="200" y="494" width="220" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="521.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">制剂类型</text>
  <rect x="420" y="494" width="380" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="610" y="521.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">代表</text>
  <rect x="800" y="494" width="540" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1070" y="521.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">特点与注意事项</text>
  <rect x="60" y="538" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="560.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">第一代 · 减毒活疫苗</text>
  <rect x="200" y="538" width="220" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="560.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">减毒活疫苗</text>
  <rect x="420" y="538" width="380" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="610" y="560.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">天花疫苗（天花 1980 年被消灭）；BCG（1921 年启用，牛分枝杆菌经 13 年 230 代传代减毒）</text>
  <rect x="800" y="538" width="540" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1070" y="560.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">免疫原性强、一剂长效；活菌有回复与免疫缺陷者风险</text>
  <rect x="60" y="572" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="572" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="594.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">第一代 · 灭活疫苗</text>
  <rect x="200" y="572" width="220" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="594.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">灭活全体制剂</text>
  <rect x="420" y="572" width="380" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="610" y="594.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">百日咳灭活疫苗等</text>
  <rect x="800" y="572" width="540" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1070" y="594.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">安全、稳定；需多剂加强，免疫原性较弱</text>
  <rect x="60" y="606" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="628.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">第三代 · 亚单位/结合</text>
  <rect x="200" y="606" width="220" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="628.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">亚单位 · 结合疫苗</text>
  <rect x="420" y="606" width="380" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="610" y="628.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">HBsAg 重组疫苗；多糖-蛋白结合疫苗</text>
  <rect x="800" y="606" width="540" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1070" y="628.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">成分明确安全；需佐剂与加强</text>
  <rect x="60" y="640" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="640" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="662.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">第四代 · mRNA 疫苗</text>
  <rect x="200" y="640" width="220" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="662.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">mRNA 制剂</text>
  <rect x="420" y="640" width="380" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="610" y="662.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">新冠 mRNA 疫苗（修饰核苷酸技术获 2023 年诺贝尔生理学或医学奖）</text>
  <rect x="800" y="640" width="540" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1070" y="662.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">研发快、可快速改版；需冷链</text>
  <text x="60" y="690" font-size="11" fill="#1e293b" font-weight="700">主动免疫以疫苗诱导免疫记忆——预防之本；初次/再次应答动力学决定加强程序的节奏。</text>
  <rect x="30" y="756" width="1340" height="224" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="778.84" font-size="19" fill="#475569" font-weight="700">四、主动免疫与被动免疫：预防与急救的两翼</text>
  <rect x="50" y="792" width="620" height="120" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="143.22" y="808.95" width="73.56" height="22.099999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="180" y="824.68" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">主动免疫</text>
  <text x="70" y="852" font-size="11" fill="#475569">接种疫苗（减毒、灭活、亚单位/结合、mRNA 四代技术）：抗原刺激自身免疫系统，</text>
  <text x="70" y="868" font-size="11" fill="#475569">诱导记忆 B/T 细胞——保护到来但需时间。</text>
  <text x="70" y="896" font-size="11" fill="#134e4a" font-weight="700">记忆细胞使再次应答更快更高——长效保护的基础。</text>
  <rect x="690" y="792" width="650" height="120" rx="9" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.6"/>
  <rect x="793.22" y="808.95" width="73.56" height="22.099999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="830" y="824.68" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">被动免疫</text>
  <text x="710" y="852" font-size="11" fill="#475569">输入现成抗体——抗毒素（破伤风抗毒素等）与免疫球蛋白制剂：即时保护但无记忆，效应随抗体半衰期衰减。</text>
  <text x="710" y="896" font-size="11" fill="#78350f" font-weight="700">治疗窗与暴露后预防的救命选项。</text>
  <text x="50" y="944" font-size="10.5" fill="#64748b">免疫学诊断应用：双份血清（急性期 + 恢复期）抗体效价 4 倍升高即判定现症感染——再次应动力学的血清学翻译。</text>
</svg>