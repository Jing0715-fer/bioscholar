  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">多相分类与经典鉴定流程：表型、基因型与系统发育三足</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">经典鉴定四线索：菌落、形态与革兰、生理生化（IMViC++−−对−−++）、血清学；数值分类S值≥70%–75%；多相分类整合表型、基因型与系统发育；MALDI-TOF分钟级</text>
  <rect x="30" y="132" width="1340" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、经典表型鉴定：四条线索的标准流程</text>
  <rect x="64" y="176" width="304" height="108" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="115.3351" y="194.225" width="73.3298" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="152" y="208.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">① 菌落形态</text>
  <text x="80" y="232" font-size="10.5" fill="#475569">大小 · 颜色 · 边缘 · 光滑度——平板上的第一眼</text>
  <rect x="392" y="176" width="304" height="108" rx="9" fill="#ede9fe" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="413.7226" y="194.225" width="132.5548" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="480" y="208.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">② 细胞形态与革兰反应</text>
  <text x="408" y="232" font-size="10.5" fill="#475569">球菌/杆菌/螺旋 · 芽孢与鞭毛 · 革兰阳/阴性</text>
  <rect x="720" y="176" width="304" height="108" rx="9" fill="#fce7f3" fill-opacity="0.45" stroke="#be185d" stroke-width="1.5"/>
  <rect x="759.4901" y="194.225" width="97.0198" height="19.55" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="808" y="208.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">③ 生理生化试验</text>
  <text x="736" y="232" font-size="10.5" fill="#475569">IMViC · 触酶 · 氧化酶等代谢指纹</text>
  <rect x="1048" y="176" width="304" height="108" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="1093.4126" y="194.225" width="85.1748" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1136" y="208.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">④ 血清学分型</text>
  <text x="1064" y="232" font-size="10.5" fill="#475569">已知抗体鉴定表面抗原（血清型）</text>
  <text x="700" y="316" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">四条线索互补印证 → 初步鉴定到属、种</text>
  <rect x="30" y="364" width="660" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="386.84" font-size="19" fill="#475569" font-weight="700">二、数值分类与商品化鉴定系统（API 20E / VITEK）</text>
  <text x="60" y="402" font-size="10.5" fill="#475569">Sneath 与 Sokal（1950–60 年代）系统化：对两株菌测定 50–100 项以上等权特征，</text>
  <text x="60" y="418" font-size="10.5" fill="#475569">逐项编码计算相似系数 S 值聚类——S 值达约定阈值（同种通常 ≥70%–75%）即归为一个表观群。</text>
  <rect x="60" y="468" width="620" height="54" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <rect x="76" y="478" width="24" height="34" rx="3" fill="#fce7f3" stroke="#94a3b8" stroke-width="1"/>
  <text x="88" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">1</text>
  <rect x="106" y="478" width="24" height="34" rx="3" fill="#d1fae5" stroke="#94a3b8" stroke-width="1"/>
  <text x="118" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">2</text>
  <rect x="136" y="478" width="24" height="34" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="148" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">3</text>
  <rect x="166" y="478" width="24" height="34" rx="3" fill="#fce7f3" stroke="#94a3b8" stroke-width="1"/>
  <text x="178" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">4</text>
  <rect x="196" y="478" width="24" height="34" rx="3" fill="#d1fae5" stroke="#94a3b8" stroke-width="1"/>
  <text x="208" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">5</text>
  <rect x="226" y="478" width="24" height="34" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="238" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">6</text>
  <rect x="256" y="478" width="24" height="34" rx="3" fill="#fce7f3" stroke="#94a3b8" stroke-width="1"/>
  <text x="268" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">7</text>
  <rect x="286" y="478" width="24" height="34" rx="3" fill="#d1fae5" stroke="#94a3b8" stroke-width="1"/>
  <text x="298" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">8</text>
  <rect x="316" y="478" width="24" height="34" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="328" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">9</text>
  <rect x="346" y="478" width="24" height="34" rx="3" fill="#fce7f3" stroke="#94a3b8" stroke-width="1"/>
  <text x="358" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">10</text>
  <rect x="376" y="478" width="24" height="34" rx="3" fill="#d1fae5" stroke="#94a3b8" stroke-width="1"/>
  <text x="388" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">11</text>
  <rect x="406" y="478" width="24" height="34" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="418" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">12</text>
  <rect x="436" y="478" width="24" height="34" rx="3" fill="#fce7f3" stroke="#94a3b8" stroke-width="1"/>
  <text x="448" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">13</text>
  <rect x="466" y="478" width="24" height="34" rx="3" fill="#d1fae5" stroke="#94a3b8" stroke-width="1"/>
  <text x="478" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">14</text>
  <rect x="496" y="478" width="24" height="34" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="508" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">15</text>
  <rect x="526" y="478" width="24" height="34" rx="3" fill="#fce7f3" stroke="#94a3b8" stroke-width="1"/>
  <text x="538" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">16</text>
  <rect x="556" y="478" width="24" height="34" rx="3" fill="#d1fae5" stroke="#94a3b8" stroke-width="1"/>
  <text x="568" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">17</text>
  <rect x="586" y="478" width="24" height="34" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="598" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">18</text>
  <rect x="616" y="478" width="24" height="34" rx="3" fill="#fce7f3" stroke="#94a3b8" stroke-width="1"/>
  <text x="628" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">19</text>
  <rect x="646" y="478" width="24" height="34" rx="3" fill="#d1fae5" stroke="#94a3b8" stroke-width="1"/>
  <text x="658" y="532" font-size="7.5" fill="#64748b" text-anchor="middle">20</text>
  <text x="370" y="552" font-size="10" fill="#64748b" text-anchor="middle">20 个生化底物干燥于反应杯，接种后 4–24 小时显色</text>
  <rect x="151.69445" y="581.075" width="56.6111" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="180" y="593.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">阳性记 1</text>
  <line x1="236" y1="590" x2="300" y2="590" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="328.3499" y="580.65" width="83.3002" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="370" y="593.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">7 位数字编码</text>
  <line x1="430" y1="590" x2="494" y2="590" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="521.23415" y="580.65" width="89.53170000000001" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="566" y="593.96" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">检索库 → 菌名</text>
  <text x="60" y="624" font-size="10.5" fill="#475569">API 20E 把数值分类固化为「试条即数据库」；VITEK 等自动化系统同源而高通量。</text>
  <rect x="710" y="364" width="660" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="386.84" font-size="19" fill="#475569" font-weight="700">三、多相分类：表型 · 基因型 · 系统发育三证据链</text>
  <ellipse cx="880" cy="480" rx="90" ry="62" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="2"/>
  <text x="880" y="470" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">表型</text>
  <text x="880" y="490" font-size="9" fill="#64748b" text-anchor="middle">形态·生化·血清</text>
  <ellipse cx="1090" cy="480" rx="90" ry="62" fill="#ede9fe" fill-opacity="0.6" stroke="#6d28d9" stroke-width="2"/>
  <text x="1090" y="470" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">基因型</text>
  <text x="1090" y="490" font-size="9" fill="#64748b" text-anchor="middle">DNA-DNA 杂交</text>
  <text x="1090" y="504" font-size="9" fill="#64748b" text-anchor="middle">G+C 等</text>
  <ellipse cx="985" cy="566" rx="90" ry="62" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="2"/>
  <text x="985" y="556" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">系统发育</text>
  <text x="985" y="576" font-size="9" fill="#64748b" text-anchor="middle">16S rRNA / 基因组树</text>
  <text x="985" y="508" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">多相分类</text>
  <text x="730" y="630" font-size="11" fill="#1e293b" font-weight="700">三条证据链整合成当代新种描述的规范框架——任何单链都不足为凭。</text>
  <rect x="30" y="666" width="1340" height="314" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="688.84" font-size="19" fill="#475569" font-weight="700">四、IMViC 对照 · MALDI-TOF 蛋白指纹 · 未培养微生物</text>
  <text x="340" y="704" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">肠道菌鉴定的经典组合</text>
  <rect x="60" y="716" width="180" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="150" y="743.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">IMViC 项目</text>
  <rect x="240" y="716" width="190" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="743.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">大肠埃希菌</text>
  <rect x="430" y="716" width="190" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="743.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">产气肠杆菌</text>
  <rect x="60" y="760" width="180" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="150" y="780.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">吲哚（I）</text>
  <rect x="240" y="760" width="190" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="780.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">+</text>
  <rect x="430" y="760" width="190" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="780.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">−</text>
  <rect x="60" y="790" width="560" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="790" width="180" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="150" y="810.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">甲基红（M）</text>
  <rect x="240" y="790" width="190" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="810.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">+</text>
  <rect x="430" y="790" width="190" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="810.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">−</text>
  <rect x="60" y="820" width="180" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="150" y="840.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">伏-普（V）</text>
  <rect x="240" y="820" width="190" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="840.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">−</text>
  <rect x="430" y="820" width="190" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="840.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">+</text>
  <rect x="60" y="850" width="560" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="850" width="180" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="150" y="870.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">柠檬酸盐（C）</text>
  <rect x="240" y="850" width="190" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="870.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">−</text>
  <rect x="430" y="850" width="190" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="525" y="870.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">+</text>
  <text x="340" y="906" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">大肠埃希菌 ++−− 与产气肠杆菌 −−++ 恰成镜像</text>
  <rect x="650" y="706" width="330" height="130" rx="9" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="730" font-size="13" fill="#059669" font-weight="700">MALDI-TOF</text>
  <text x="670" y="754" font-size="11" fill="#475569">以核糖体蛋白指纹比对数据库：分钟级、低成本，</text>
  <text x="670" y="770" font-size="11" fill="#475569">已成临床鉴定常规。</text>
  <rect x="1000" y="706" width="340" height="130" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1020" y="730" font-size="13" fill="#dc2626" font-weight="700">未培养微生物</text>
  <text x="1020" y="754" font-size="11" fill="#475569">VBNC 状态与「微生物暗物质」划定培养边界；</text>
  <text x="1020" y="770" font-size="11" fill="#475569">培养组学以海量条件矩阵复兴培养，与宏基因组互补。</text>
  <rect x="650" y="850" width="690" height="110" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="670" y="874" font-size="12.5" fill="#1e293b" font-weight="700">Bergey 手册：分类学革命的凝固史</text>
  <text x="670" y="898" font-size="10.5" fill="#475569">1923 年初版《伯杰氏鉴定细菌学手册》以表型鉴定为纲；1984 年四卷本仍按表型编排；</text>
  <text x="670" y="913" font-size="10.5" fill="#475569">2001–2012 年二版五卷改按 16S rRNA 系统发育的门级框架——从「表型排列」到「系统发育排列」的转变，</text>
  <text x="670" y="928" font-size="10.5" fill="#475569">本身就是二十世纪分类学革命的一段凝固历史。</text>
</svg>