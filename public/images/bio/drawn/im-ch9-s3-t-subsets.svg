    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">T 细胞亚群及其功能：三信号分化、主转录因子与记忆三型</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">效应 T 分化由 TCR 特异性、共刺激与极化细胞因子三信号决定：Th1/T-bet（IFN-γ，细胞免疫）与 Th2/GATA3（IL-4，IgE 与抗寄生虫）互为跷跷板，Th17/RORγt 以 IL-17 动员中性粒细胞，Tfh/BCL6 辅导生发中心，Treg/Foxp3 维持外周耐受；CTL 经穿孔素-颗粒酶与 FasL-Fas 两条途径定向诱导凋亡；克隆收缩后留存 CCR7⁺ TCM、TEM 与 CD69⁺ TRM 三型记忆细胞</text>
  <rect x="30" y="132" width="1340" height="334" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、效应 T 分化的三信号与各亚群的主转录因子</text>
  <rect x="60" y="182" width="280" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.5"/>
  <text x="76" y="202" font-size="11.5" fill="#075985" font-weight="700">信号一：TCR 特异性</text>
  <text x="76" y="220" font-size="9.5" fill="#475569">抗原识别的特异性门牌</text>
  <rect x="360" y="182" width="280" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.5"/>
  <text x="376" y="202" font-size="11.5" fill="#075985" font-weight="700">信号二：共刺激</text>
  <text x="376" y="220" font-size="9.5" fill="#475569">CD28-B7 等放大许可</text>
  <rect x="660" y="182" width="280" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.5"/>
  <text x="676" y="202" font-size="11.5" fill="#075985" font-weight="700">信号三：极化细胞因子</text>
  <text x="676" y="220" font-size="9.5" fill="#475569">指定亚群分化方向</text>
  <line x1="948" y1="205" x2="996" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="1000" y="182" width="310" height="46" rx="8" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1155" y="202" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">主转录因子执掌亚群命运</text>
  <text x="1155" y="220" font-size="9.5" fill="#475569" text-anchor="middle">T-bet · GATA3 · RORγt · BCL6 · Foxp3</text>
  <rect x="60" y="240" width="90" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="267.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">亚群</text>
  <rect x="150" y="240" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="267.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">主转录因子</text>
  <rect x="260" y="240" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="385" y="267.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">主要诱导信号</text>
  <rect x="510" y="240" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="635" y="267.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">特征细胞因子</text>
  <rect x="760" y="240" width="580" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="267.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">主要职能</text>
  <rect x="60" y="284" width="90" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="306.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Th1</text>
  <rect x="150" y="284" width="110" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="306.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">T-bet</text>
  <rect x="260" y="284" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="385" y="306.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IL-12、IFN-γ</text>
  <rect x="510" y="284" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="635" y="306.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IFN-γ、IL-2、TNF-α</text>
  <rect x="760" y="284" width="580" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="306.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">巨噬细胞活化、细胞免疫</text>
  <rect x="60" y="318" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="318" width="90" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="340.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Th2</text>
  <rect x="150" y="318" width="110" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="340.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">GATA3</text>
  <rect x="260" y="318" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="385" y="340.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IL-4</text>
  <rect x="510" y="318" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="635" y="340.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IL-4、IL-5、IL-13</text>
  <rect x="760" y="318" width="580" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="340.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IgE 转类、抗寄生虫、速发型超敏</text>
  <rect x="60" y="352" width="90" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="374.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Th17</text>
  <rect x="150" y="352" width="110" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="374.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">RORγt</text>
  <rect x="260" y="352" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="385" y="374.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">TGF-β 加 IL-6，IL-23 维持</text>
  <rect x="510" y="352" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="635" y="374.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IL-17A/F、IL-22</text>
  <rect x="760" y="352" width="580" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="374.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">中性粒细胞炎症、屏障防御</text>
  <rect x="60" y="386" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="386" width="90" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="408.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Tfh</text>
  <rect x="150" y="386" width="110" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="408.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">BCL6</text>
  <rect x="260" y="386" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="385" y="408.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IL-6、IL-21</text>
  <rect x="510" y="386" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="635" y="408.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IL-21</text>
  <rect x="760" y="386" width="580" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="408.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">生发中心反应、抗体亲和力成熟</text>
  <rect x="60" y="420" width="90" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="442.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Treg</text>
  <rect x="150" y="420" width="110" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="442.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">Foxp3</text>
  <rect x="260" y="420" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="385" y="442.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">TGF-β、IL-2</text>
  <rect x="510" y="420" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="635" y="442.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IL-10、TGF-β、IL-35</text>
  <rect x="760" y="420" width="580" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="442.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">外周耐受与免疫抑制</text>
  <rect x="30" y="478" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="500.84" font-size="19" fill="#475569" font-weight="700">二、Th1 与 Th2 的跷跷板 · CTL 定向杀伤的两套兵器</text>
  <text x="350" y="548" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Th1 ⇄ Th2：相互拮抗的跷跷板</text>
  <line x1="180" y1="642" x2="520" y2="698" stroke="#64748b" stroke-width="5" opacity="0.6"/>
  <polygon points="350,668 322,706 378,706" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="95" y="568" width="190" height="64" rx="8" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="190" y="588" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">Th1（T-bet）</text>
  <text x="190" y="606" font-size="9" fill="#475569" text-anchor="middle">IFN-γ、IL-2、TNF-α</text>
  <text x="190" y="622" font-size="9" fill="#475569" text-anchor="middle">巨噬细胞活化 · 细胞免疫</text>
  <rect x="415" y="636" width="190" height="64" rx="8" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.6"/>
  <text x="510" y="656" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">Th2（GATA3）</text>
  <text x="510" y="674" font-size="9" fill="#475569" text-anchor="middle">IL-4、IL-5、IL-13</text>
  <text x="510" y="690" font-size="9" fill="#475569" text-anchor="middle">IgE 转类 · 抗寄生虫</text>
  <text x="350" y="726" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">一端抬起，另一端落下——细胞免疫与体液免疫的两翼平衡</text>
  <rect x="710" y="528" width="630" height="180" rx="9" fill="#fee2e2" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.6"/>
  <text x="728" y="552" font-size="12.5" fill="#dc2626" font-weight="700">CD8⁺ CTL：定向诱导靶细胞凋亡（不伤旁观）</text>
  <rect x="730" y="568" width="290" height="122" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="746" y="590" font-size="11" fill="#1e293b" font-weight="700">兵器一：穿孔素-颗粒酶</text>
  <text x="746" y="610" font-size="9.5" fill="#475569">穿孔素在靶膜打孔，颗粒酶循孔进入，</text>
  <text x="746" y="624" font-size="9.5" fill="#475569">激活胱天蛋白酶诱导凋亡。</text>
  <text x="875" y="672" font-size="9" fill="#64748b" text-anchor="middle">分泌型 · 靶向释放于免疫突触</text>
  <rect x="1030" y="568" width="290" height="122" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="1046" y="590" font-size="11" fill="#1e293b" font-weight="700">兵器二：FasL-Fas</text>
  <text x="1046" y="610" font-size="9.5" fill="#475569">CTL 表面 FasL 结合靶细胞 Fas，启动凋亡级联。</text>
  <text x="1175" y="672" font-size="9" fill="#64748b" text-anchor="middle">膜分子接触型 · 定向点对点</text>
  <rect x="30" y="740" width="1340" height="234" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="762.84" font-size="19" fill="#475569" font-weight="700">三、克隆收缩后的幸存者：TCM · TEM · TRM 三型记忆 T 细胞</text>
  <rect x="60" y="790" width="1240" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="80" y="814" font-size="11" fill="#1e293b" font-weight="600">效应应答清除抗原后，大部分效应 T 细胞凋亡（克隆收缩）；Treg（Foxp3）平时维持外周耐受与免疫稳态。</text>
  <rect x="60" y="848" width="400" height="70" rx="9" fill="#0369a1" fill-opacity="0.08" stroke="#0369a1" stroke-width="1.6"/>
  <text x="78" y="872" font-size="12.5" fill="#0369a1" font-weight="700">TCM 中枢记忆</text>
  <text x="78" y="892" font-size="10" fill="#1e293b" font-weight="700">CCR7⁺</text>
  <text x="78" y="908" font-size="9.5" fill="#475569">驻淋巴器官再循环、长期待命</text>
  <rect x="500" y="848" width="400" height="70" rx="9" fill="#0f766e" fill-opacity="0.08" stroke="#0f766e" stroke-width="1.6"/>
  <text x="518" y="872" font-size="12.5" fill="#0f766e" font-weight="700">TEM 效应记忆</text>
  <text x="518" y="892" font-size="10" fill="#1e293b" font-weight="700">即时应答</text>
  <text x="518" y="908" font-size="9.5" fill="#475569">快速抵达感染灶即时发挥效应</text>
  <rect x="940" y="848" width="400" height="70" rx="9" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-width="1.6"/>
  <text x="958" y="872" font-size="12.5" fill="#b45309" font-weight="700">TRM 组织驻留</text>
  <text x="958" y="892" font-size="10" fill="#1e293b" font-weight="700">CD69⁺</text>
  <text x="958" y="908" font-size="9.5" fill="#475569">长驻皮肤、肠道等屏障组织</text>
  <text x="700" y="950" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">记忆 T 对再次抗原反应更快、更强、门槛更低——疫苗保护效应的直接载体</text>
</svg>