<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">学习记忆的神经基础：分类地图、海马三突触环路与巩固机制</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">陈述性记忆依赖海马-内侧颞叶、程序性依赖基底节/小脑/杏仁核；HM 揭示海马是巩固通道而非仓库</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、记忆的分类地图：两大系统可分别损坏</text>
  <rect x="60" y="196" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="223.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">类别</text>
  <rect x="170" y="196" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="223.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">亚型</text>
  <rect x="300" y="196" width="190" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="223.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">内容</text>
  <rect x="490" y="196" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="223.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">关键脑区</text>
  <rect x="60" y="240" width="110" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="267.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">陈述性</text>
  <rect x="170" y="240" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="267.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">情景记忆</text>
  <rect x="300" y="240" width="190" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="267.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">事件、地点、情节</text>
  <rect x="490" y="240" width="170" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="267.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">海马-内侧颞叶</text>
  <rect x="60" y="284" width="600" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="284" width="110" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="311.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">（可言传）</text>
  <rect x="170" y="284" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="311.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">语义记忆</text>
  <rect x="300" y="284" width="190" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="311.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">事实、概念、词汇</text>
  <rect x="490" y="284" width="170" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="311.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">海马 → 新皮层</text>
  <rect x="60" y="328" width="110" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="355.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">程序性</text>
  <rect x="170" y="328" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="355.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">技能学习</text>
  <rect x="300" y="328" width="190" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="355.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">运动、认知技能</text>
  <rect x="490" y="328" width="170" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="355.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">基底节</text>
  <rect x="60" y="372" width="600" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="372" width="110" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="399.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">（会做不会说）</text>
  <rect x="170" y="372" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="399.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">条件反射</text>
  <rect x="300" y="372" width="190" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="399.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">经典条件化</text>
  <rect x="490" y="372" width="170" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="399.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">小脑 · 杏仁核</text>
  <rect x="60" y="416" width="110" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="443.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700"></text>
  <rect x="170" y="416" width="130" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="443.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">启动效应</text>
  <rect x="300" y="416" width="190" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="443.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">无意识知觉加工易化</text>
  <rect x="490" y="416" width="170" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="575" y="443.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">新皮层</text>
  <rect x="60" y="472" width="600" height="64" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="78" y="496" font-size="11" fill="#475569">工作记忆是秒级在线的「心灵黑板」：经典容量约 7±2 个组块（Miller，1956），更严格的估计压至约 4 个</text>
  <text x="78" y="512" font-size="11" fill="#475569">（Cowan，2001）。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、海马三突触环路：三级突触，各级可诱导 LTP</text>
  <rect x="760" y="300" width="130" height="56" rx="9" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="2"/>
  <text x="825" y="322" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">内嗅皮层</text>
  <text x="825" y="340" font-size="10.5" fill="#64748b" text-anchor="middle">（入口 / 出口）</text>
  <rect x="950" y="190" width="130" height="56" rx="9" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="2"/>
  <text x="1015" y="212" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">齿状回</text>
  <text x="1015" y="230" font-size="10.5" fill="#64748b" text-anchor="middle">（颗粒细胞）</text>
  <rect x="1150" y="300" width="130" height="56" rx="9" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="2"/>
  <text x="1215" y="322" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">CA3</text>
  <text x="1215" y="340" font-size="10.5" fill="#64748b" text-anchor="middle">（锥体细胞）</text>
  <rect x="950" y="410" width="130" height="56" rx="9" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="2"/>
  <text x="1015" y="432" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">CA1</text>
  <text x="1015" y="450" font-size="10.5" fill="#64748b" text-anchor="middle">（锥体细胞）</text>
  <line x1="870" y1="300" x2="950" y2="235" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <text x="878" y="252" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">穿通路</text>
  <line x1="1080" y1="218" x2="1150" y2="300" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <text x="1148" y="252" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">苔藓纤维</text>
  <line x1="1150" y1="356" x2="1080" y2="410" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <text x="1148" y="398" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">Schaffer 侧枝</text>
  <line x1="950" y1="438" x2="870" y2="356" stroke="#0369a1" stroke-width="2.4" marker-end="url(#arr-acc)"/>
  <text x="878" y="398" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">返回内嗅皮层</text>
  <text x="760" y="500" font-size="11" fill="#475569">三级突触均可诱导 LTP；</text>
  <text x="760" y="516" font-size="11" fill="#475569">CA1 的 Schaffer 侧枝-CA1 突触是 Bliss 与 Lømo 1973 年发现 LTP 的地点——记忆研究的「标准跑道」。</text>
  <rect x="30" y="578" width="700" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、HM 与 Morris 水迷宫：把机制钉在行为上</text>
  <line x1="70" y1="668" x2="660" y2="668" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="90" cy="668" r="5.5" fill="#0f766e"/>
  <text x="90" y="692" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1953</text>
  <text x="90" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">HM 手术</text>
  <circle cx="220" cy="668" r="5.5" fill="#0f766e"/>
  <text x="220" y="692" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1971</text>
  <text x="220" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">位置细胞</text>
  <circle cx="350" cy="668" r="5.5" fill="#0f766e"/>
  <text x="350" y="692" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1982</text>
  <text x="350" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">水迷宫</text>
  <circle cx="480" cy="668" r="5.5" fill="#0f766e"/>
  <text x="480" y="692" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">2005</text>
  <text x="480" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">网格细胞</text>
  <circle cx="600" cy="668" r="5.5" fill="#0f766e"/>
  <text x="600" y="692" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">2008</text>
  <text x="600" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">HM 切片保存</text>
  <rect x="60" y="730" width="300" height="150" rx="9" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.6"/>
  <text x="76" y="756" font-size="13" fill="#dc2626" font-weight="700">HM：顺行性遗忘的教科书</text>
  <text x="76" y="778" font-size="10.5" fill="#475569">1953 年 Scoville 行双侧内侧颞叶切除</text>
  <text x="76" y="793" font-size="10.5" fill="#475569">（含双侧海马大部分与杏仁核）治疗难治性癫痫：</text>
  <text x="76" y="808" font-size="10.5" fill="#475569">短时记忆与程序性学习完好，唯独不能</text>
  <text x="76" y="823" font-size="10.5" fill="#475569">形成新的陈述性长时记忆——海马是</text>
  <text x="76" y="838" font-size="10.5" fill="#475569">巩固通道而非最终仓库。</text>
  <text x="76" y="862" font-size="10" fill="#64748b">Corkin 等 1997 年 MRI 复查：损毁限于内侧颞叶、</text>
  <text x="76" y="876" font-size="10" fill="#64748b">新皮层大体完好。</text>
  <rect x="390" y="730" width="310" height="150" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.6"/>
  <text x="406" y="756" font-size="13" fill="#075985" font-weight="700">Morris 水迷宫（1982）</text>
  <text x="406" y="778" font-size="10.5" fill="#475569">不透明浑水池中寻找隐于水面下约 1–2 cm 的平台，</text>
  <text x="406" y="793" font-size="10.5" fill="#475569">入水点随机轮换；海马 NMDA 受体阻断剂 AP5</text>
  <text x="406" y="808" font-size="10.5" fill="#475569">阻断空间学习而不阻断可见平台任务——</text>
  <text x="406" y="823" font-size="10.5" fill="#475569">把可塑性机制与行为连成闭环。</text>
  <text x="60" y="910" font-size="10.5" fill="#64748b">空间记忆的细胞学底座：位置细胞（O'Keefe 1971，只在特定位置放电）、网格细胞（Hafting 2005，六边形栅格铺满环境）</text>
  <text x="60" y="925" font-size="10.5" fill="#64748b">与 Tolman 1948 的「认知地图」假说。</text>
  <rect x="750" y="578" width="620" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="600.84" font-size="19" fill="#475569" font-weight="700">四、巩固与 CREB：分子开关与时间层级</text>
  <rect x="770" y="650" width="580" height="84" rx="9" fill="#fef3c7" fill-opacity="0.45" stroke="#b45309" stroke-width="1.6"/>
  <text x="786" y="676" font-size="13" fill="#78350f" font-weight="700">CREB：跨物种保守的长时记忆开关</text>
  <text x="786" y="698" font-size="10.5" fill="#475569">cAMP/PKA 磷酸化 CREB（Ser133）开启 CRE 驱动转录，</text>
  <text x="786" y="713" font-size="10.5" fill="#475569">产出可塑性相关蛋白支持突触持久增强与新突触生长——海兔长时敏化、</text>
  <text x="786" y="728" font-size="10.5" fill="#475569">果蝇长时记忆与小鼠海马晚相 LTP 共用此开关。</text>
  <rect x="770" y="750" width="280" height="130" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.6"/>
  <text x="786" y="776" font-size="12.5" fill="#134e4a" font-weight="700">系统级巩固：数月至数年</text>
  <text x="786" y="798" font-size="10.5" fill="#475569">记忆从依赖海马过渡到分布式储存于新皮层；</text>
  <text x="786" y="813" font-size="10.5" fill="#475569">睡眠中海马在慢波睡眠的尖波涟漪中以十数倍</text>
  <text x="786" y="828" font-size="10.5" fill="#475569">压缩速度重演当日路线，边播边向皮层转存。</text>
  <rect x="1070" y="750" width="280" height="130" rx="9" fill="#ede9fe" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="1086" y="776" font-size="12.5" fill="#4c1d95" font-weight="700">再巩固与情绪放大</text>
  <text x="1086" y="798" font-size="10.5" fill="#475569">提取不是只读操作——记忆每次被提取都重回</text>
  <text x="1086" y="813" font-size="10.5" fill="#475569">可塑状态，可被更新或削弱。</text>
  <text x="1086" y="828" font-size="10.5" fill="#475569">情绪记忆经杏仁核-NE-β 受体通路放大：</text>
  <text x="1086" y="843" font-size="10.5" fill="#475569">「记忆不是磁带，而是持续重写的施工」。</text>
</svg>