  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">大分子链的统计性质：无规行走、持续长度与回转半径</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">自由连接链 ⟨R²⟩=Nb²（R~b·N^1/2）；持续长度 p 与 Kuhn 长度 b≈2p（DNA p≈50 nm ≈150 bp）；Rg=b√(N/6)；相对涨落 ~1/√N</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、自由连接链：三维无规行走与末端距</text>
  <text x="60" y="184" font-size="10.5" fill="#1e293b" font-weight="700">N 个长为 b 的刚性链段（Kuhn 链段），相邻取向随机</text>
  <text x="60" y="201" font-size="10" fill="#64748b">——末端距矢量 R 为各链段矢量之和</text>
  <polyline points="220,330 240.99999875586994,330.00722865552314 259.4508237470154,319.9789158788831 254.3258756544627,340.34395717637716 259.4779232710997,360.70215958611624 256.7635617390141,339.87832128783094 236.20563552912,335.5921026806494 226.16841696468754,354.03808445147996 226.43929880573938,333.03983159491617 227.10879481870143,312.05050632970983 206.86533356253892,306.4646065480947 198.466480326409,287.21728818116503 184.66968278212175,271.3854096595887 193.22209059320363,252.20582883432178 203.65957269636579,270.4283140475458 198.16933659465428,250.15869867015243 215.07926373141376,262.6107813967281 206.60730755243495,243.39552811967076 196.90666650323755,262.02071438007164 204.3184033132881,242.3721480848291 207.6122263799313,263.11222353323694 226.21239890532445,253.36370661907972 218.2982840600162,233.9120540873468 216.23436087578332,254.8103846687494 234.10493301652355,243.78121192721522 234.72377780241652,264.7720916403424 223.99006916675958,282.8216760933104 234.92549705343566,264.8935859291209 224.54934806727198,283.15106473143464 236.6165558274384,300.3377600761767 230.42410802697853,320.40399017150304 211.50957380998562,329.52760762042124 205.66680342791878,349.6984289785723 225.05621910973963,341.6330362716075 205.40587017683603,334.2260269685801 202.6786263042414,313.4038719201852 217.79156385035776,298.82309283512996 237.38303254332988,306.3844653594997 234.29473024412133,327.1561381113197 214.80017899397828,319.34829131751377 193.8322801172089,318.1875946760201 175.33887020089347,328.13715696122273 182.70628165645255,347.80238638893337 200.36395897700663,336.4354856836756 220.1278201141708,343.53406250941276 206.19446048456876,359.24588892877523 194.48666655107246,376.6794072544256" fill="none" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="220" cy="330" r="5" fill="#1e293b"/>
  <circle cx="194.48666655107246" cy="376.6794072544256" r="5" fill="#6d28d9"/>
  <line x1="220" y1="330" x2="194.48666655107246" y2="376.6794072544256" stroke="#6d28d9" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arr-pro)"/>
  <text x="186.1836788153158" y="341.82923213312887" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="700">R</text>
  <text x="208" y="356" font-size="9.5" fill="#64748b">起点</text>
  <text x="202.48666655107246" y="366.6794072544256" font-size="9.5" fill="#64748b">终点</text>
  <line x1="90" y1="488" x2="152" y2="488" stroke="#0f766e" stroke-width="4.5"/>
  <text x="168" y="492" font-size="10.5" fill="#475569">链段（Kuhn 链段）长 b</text>
  <text x="60" y="524" font-size="11" fill="#134e4a" font-weight="700">⟨R⟩ = 0，但均方末端距 ⟨R²⟩ = Nb² ≠ 0</text>
  <text x="410" y="225" font-size="11.5" fill="#1e293b" font-weight="700">同一根链的两种极端</text>
  <text x="525" y="255" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">完全伸展：L = Nb</text>
  <line x1="415" y1="272" x2="635" y2="272" stroke="#0f766e" stroke-width="3.5"/>
  <line x1="415" y1="264" x2="415" y2="280" stroke="#0f766e" stroke-width="2"/>
  <line x1="635" y1="264" x2="635" y2="280" stroke="#0f766e" stroke-width="2"/>
  <text x="525" y="296" font-size="9.5" fill="#64748b" text-anchor="middle">（轮廓长度）</text>
  <polyline points="525,375 535.9999929644392,375.01244115301745 546.860544498891,376.75841376663834 538.8930564571865,384.34255078447325 528.4093004922225,381.0122563730011 528.1572972849676,392.0093693752182 538.8761421353709,394.48047541765806 548.4472719914947,399.90205021445047 540.1454484300475,392.68542180815166 532.3096902164015,384.96526033203736 521.3106146599603,385.10786784830975 526.0284158038398,375.1709491927703 536.4145060649284,371.54753518267967 544.7922902083093,378.67584022994845 547.8717134081376,368.1156720136576 549.27659574517,379.0255897777425 553.7651460267997,389.0681450486524 543.6308444557205,393.34551943797385 548.4975728016418,403.2103537096181 553.0908989795304,393.21528719540606 542.3927594512887,390.65602741291536 533.5828595297414,384.069247974349 536.7029890688021,373.5210352508835 526.1684104209199,370.35517790861667 517.2676240017659,376.8186136142304 506.5823205627017,379.43094789895054 514.6311017726335,386.9287556475293 522.8735195613394,394.21316015280115 533.5255905559771,396.95786114292673 523.514001272713,392.40066024509156 531.1748137243528,400.29445227305894 541.3342879776742,396.07721586800653 530.5363804828734,393.97836052908355 541.2496465248505,396.4735420282577 550.4743771979196,402.46556539347733 560.4240392209991,397.77469920198473 549.9494071304526,394.4158180537908 539.5025569527254,390.9715007971895 530.7084673557806,397.57937399216735 533.701619978303,386.99443009159387 524.6904857202824,393.30311136297917" fill="none" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="525" y="455" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">无规行走线团</text>
  <text x="525" y="473" font-size="10" fill="#475569" text-anchor="middle">R ~ b·N^(1/2) ≪ L = Nb</text>
  <rect x="488.3351" y="495.65" width="73.3298" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="525" y="508.96" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">⟨R²⟩ = Nb²</text>
  <text x="525" y="538" font-size="9.5" fill="#64748b" text-anchor="middle">高斯链：末端距服从高斯分布（右图）</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、末端距分布：高斯型曲线与 ~1/√N 涨落</text>
  <rect x="750" y="190" width="560" height="240" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="750" y1="370" x2="1310" y2="370" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="890" y1="430" x2="890" y2="190" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="750" y1="310" x2="1310" y2="310" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1030" y1="430" x2="1030" y2="190" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="750" y1="250" x2="1310" y2="250" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1170" y1="430" x2="1170" y2="190" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="750" y1="430" x2="750" y2="436" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="452" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="974" y1="430" x2="974" y2="436" stroke="#475569" stroke-width="1.8"/>
  <text x="974" y="452" font-size="13" fill="#64748b" text-anchor="middle">b√N</text>
  <line x1="1198" y1="430" x2="1198" y2="436" stroke="#475569" stroke-width="1.8"/>
  <text x="1198" y="452" font-size="13" fill="#64748b" text-anchor="middle">2b√N</text>
  <line x1="744" y1="430" x2="750" y2="430" stroke="#475569" stroke-width="1.8"/>
  <text x="740" y="434" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="744" y1="190" x2="750" y2="190" stroke="#475569" stroke-width="1.8"/>
  <text x="740" y="194" font-size="13" fill="#64748b" text-anchor="end">峰</text>
  <text x="1030" y="474" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">末端距 R（单位 b√N）</text>
  <text x="704" y="310" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">概率密度 P(R)</text>
  <text x="1030" y="178" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">高斯链末端距分布 P(R) ∝ R²·e^(−3R²/2Nb²)</text>
  <path d="M750,430 C757.5,423.8 779.9,413.4 794.8,393.04 C809.7,372.6 824.7,335.4 839.6,307.6 C854.5,279.8 868.5,245.6 884.4,226 C900.3,206.4 919.9,192.0 934.8,190 C949.7,188.0 960.0,200.8 974,214 C988.0,227.2 1003.9,250.0 1018.8,269.2 C1033.7,288.4 1048.7,311.6 1063.6,329.2 C1078.5,346.8 1093.5,362.2 1108.4,374.8 C1123.3,387.4 1138.3,397.2 1153.2,404.8 C1168.1,412.4 1183.1,416.8 1198,420.4 C1212.9,424.0 1224.1,425.2 1242.8,426.64 C1261.5,428.1 1298.8,428.6 1310,429.04" fill="none" stroke="#6d28d9" stroke-width="3"/>
  <line x1="974" y1="190" x2="974" y2="430" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="974" y="182" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">⟨R²⟩^1/2 = b√N</text>
  <line x1="806" y1="300" x2="1060" y2="300" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-warn)" marker-start="url(#arr-warn)"/>
  <text x="935" y="288" font-size="9.5" fill="#d97706" text-anchor="middle" font-weight="700">分布宽度与均值同量级</text>
  <text x="935" y="316" font-size="9.5" fill="#64748b" text-anchor="middle">相对涨落 ~ 1/√N</text>
  <text x="730" y="500" font-size="10.5" fill="#475569">单条高斯链的尺寸并非定值：N ~ 10³ 的链涨落仍达百分之几——单分子实验中 DNA 长度不断「呼吸」。</text>
  <text x="730" y="532" font-size="10.5" fill="#64748b">凝胶电泳与排阻色谱能够按链长分离分子，其物理基础正是链尺寸的统计规律。</text>
  <rect x="30" y="572" width="1340" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、持续长度 p、Kuhn 长度 b 与回转半径 Rg</text>
  <line x1="448" y1="610" x2="448" y2="940" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="918" y1="610" x2="918" y2="940" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="628" font-size="12" fill="#1e293b" font-weight="700">持续长度 p：取向关联尺度</text>
  <path d="M80,730 C93.3,727.3 133.3,718.3 160,714 C186.7,709.7 213.3,708.0 240,704 C266.7,700.0 293.3,694.0 320,690 C346.7,686.0 386.7,681.7 400,680" fill="none" stroke="#0369a1" stroke-width="2.8"/>
  <line x1="85" y1="728" x2="117" y2="710" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <line x1="243" y1="704" x2="275" y2="697" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <line x1="362" y1="685" x2="394" y2="678" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <text x="70" y="675" font-size="10" fill="#be185d" font-weight="700">t(s)</text>
  <text x="382" y="662" font-size="10" fill="#be185d" font-weight="700">t(s+Δs)</text>
  <path d="M 85,757 Q 85,748 94,748 M 196,748 Q 205,748 205,757" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="94" y1="748" x2="196" y2="748" stroke="#64748b" stroke-width="1.7"/>
  <text x="145" y="772" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">弧长 ≈ p</text>
  <text x="60" y="792" font-size="10.5" fill="#475569" font-weight="700">取向关联按弧长指数衰减：</text>
  <text x="60" y="815" font-size="12" fill="#075985" font-weight="700">⟨t(s)·t(s+Δs)⟩ ≈ e^(−Δs/p)</text>
  <text x="60" y="842" font-size="11" fill="#134e4a" font-weight="700">链段（Kuhn）长度 b ≈ 2p</text>
  <text x="60" y="872" font-size="10" fill="#64748b">p 度量化学骨架决定的弯曲刚性：弧长约超过 p，链的取向即失去关联。</text>
  <text x="470" y="628" font-size="12" fill="#1e293b" font-weight="700">半柔性链与柔性链</text>
  <path d="M480,695 C500.0,688.3 553.3,655.8 600,655 C646.7,654.2 713.3,690.0 760,690 C806.7,690.0 860.0,660.8 880,655" fill="none" stroke="#0f766e" stroke-width="3"/>
  <text x="680" y="725" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">双链 DNA：p ≈ 50 nm（约 150 bp），b ≈ 100 nm</text>
  <text x="680" y="743" font-size="9.5" fill="#64748b" text-anchor="middle">（半柔性链）</text>
  <polyline points="680,810 692.9998698405146,810.0581732728759 705.7686652438996,807.6172996697377 706.591815648102,794.643386481649 705.5443269252678,781.6856564576234 692.6290604301319,783.167510485393 704.2227305247092,777.2864549901522 701.7017733562698,790.0396810508355 703.8715846413218,777.2220401217386 709.1073446102936,765.3230142142404 697.1100369425386,770.3294709178612 695.7330375336966,783.2563372290771 686.1369038728072,774.4862620434047 694.0359724168898,784.8112180305209 702.633565159326,775.0602488973932 706.4390981824309,787.4907725553112 718.0372026281636,793.3630781728583 714.0615608045572,780.9859108034482 724.1210119646838,772.7513833514915 711.1292935785102,772.2874292865705 698.13277453396,772.5882493734025 687.4675324146245,765.1550393981661 681.1847754791456,753.7740479962849 672.8413401655653,763.7433552524636 664.0136285392764,773.2864945390446 651.0248916086731,772.7454650134345 659.0533071588812,762.5207623892416 663.7129110945007,750.384531872184 669.6775145696615,761.9354411603786 679.3323331164678,753.2300130360272 670.8248576642499,763.0597058811729 679.6830754227607,753.5448765005269 673.5143268737659,764.9880640520475 678.7220348134367,776.8993938692884 679.0635025635991,789.8949084714732" fill="none" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="680" y="890" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">变性蛋白链 / 单链 RNA：p ≈ 1 nm</text>
  <text x="680" y="908" font-size="9.5" fill="#64748b" text-anchor="middle">（柔性链）</text>
  <text x="680" y="935" font-size="10" fill="#64748b" text-anchor="middle">同为链状大分子，弯曲刚度相差约 50 倍</text>
  <text x="940" y="628" font-size="12" fill="#1e293b" font-weight="700">回转半径 Rg</text>
  <text x="940" y="660" font-size="12.5" fill="#134e4a" font-weight="700">Rg = b·√(N/6)（理想高斯链）</text>
