<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">分辨率革命的技术要素：直接探测、电影与算法</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">K2Summit2012–2013年商用，逐事件计数把DQE从不足0.1升至约0.3–0.5；40–60e⁻/Å²切成50–60帧电影经对齐、抛光、剂量加权三部曲；里程碑从TRPV13.4Å到</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">apoferritin约1.2Å，2017年诺奖加冕</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、革命前夜：三重瓶颈压住 10–20 Å</text>
  <rect x="50" y="180" width="620" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="66" y="205" font-size="12.5" fill="#991b1b" font-weight="700">CCD 探测器</text>
  <text x="66" y="226" font-size="10" fill="#475569">经闪烁体与光纤耦合，半奈奎斯特处 DQE 不足 0.1——每枚电子的信息大半损耗在转换链上</text>
  <rect x="50" y="252" width="620" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="66" y="277" font-size="12.5" fill="#991b1b" font-weight="700">束致运动</text>
  <text x="66" y="298" font-size="10" fill="#475569">辐照升温与充电让颗粒走出数埃至数十埃，高频信息被抹平</text>
  <rect x="50" y="324" width="620" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="66" y="349" font-size="12.5" fill="#991b1b" font-weight="700">剂量天花板</text>
  <text x="66" y="370" font-size="10" fill="#475569">Henderson 极限约 20 e<tspan dy="-3.4" font-size="7.2">-</tspan><tspan dy="3.4">/Å</tspan><tspan dy="-3.4" font-size="7.2">2</tspan><tspan dy="3.4"> 不容商量，电子总数封顶</tspan></text>
  <rect x="157.21120000000002" y="417.8" width="145.5776" height="20.4" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="432.32" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">常规样品停在 10–20 Å</text>
  <rect x="453" y="418.65" width="174" height="18.7" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="540" y="431.96" font-size="11" fill="#475569" text-anchor="middle">理论框架早已齐备，缺的是硬件</text>
  <text x="360" y="480" font-size="10" fill="#64748b" text-anchor="middle">回望 2000 年代：像隔着毛玻璃看电影——中心截面定理、贝叶斯框架、剂量与 CTF 账本都在，产出却上不去</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、直接电子探测相机：把每个电子数清</text>
  <rect x="760" y="230" width="400" height="240" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="760" y1="470" x2="760" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="760" y="492" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="960" y1="470" x2="960" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="960" y="492" font-size="13" fill="#64748b" text-anchor="middle">0.5</text>
  <line x1="1160" y1="470" x2="1160" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="1160" y="492" font-size="13" fill="#64748b" text-anchor="middle">奈奎斯特</text>
  <line x1="754" y1="470" x2="760" y2="470" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="474" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="754" y1="350" x2="760" y2="350" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="354" font-size="13" fill="#64748b" text-anchor="end">0.5</text>
  <line x1="754" y1="230" x2="760" y2="230" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="234" font-size="13" fill="#64748b" text-anchor="end">1.0</text>
  <text x="960" y="514" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">归一化空间频率</text>
  <text x="714" y="350" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">DQE</text>
  <text x="960" y="218" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">量子探测效率：CCD 对比直接探测计数</text>
  <path d="M760.0,378.8 L770.0,384.1 L780.0,389.1 L790.0,393.8 L800.0,398.3 L810.0,402.4 L820.0,406.4 L830.0,410.1 L840.0,413.6 L850.0,416.9 L860.0,419.9 L870.0,422.9 L880.0,425.6 L890.0,428.2 L900.0,430.6 L910.0,432.9 L920.0,435.1 L930.0,437.1 L940.0,439.0 L950.0,440.8 L960.0,442.5 L970.0,444.1 L980.0,445.6 L990.0,447.1 L1000.0,448.4 L1010.0,449.7 L1020.0,450.8 L1030.0,452.0 L1040.0,453.0 L1050.0,454.0 L1060.0,454.9 L1070.0,455.8 L1080.0,456.6 L1090.0,457.4 L1100.0,458.1 L1110.0,458.8 L1120.0,459.5 L1130.0,460.1 L1140.0,460.7 L1150.0,461.2 L1160.0,461.7" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="7 5"/>
  <path d="M760.0,273.2 L770.0,278.1 L780.0,282.8 L790.0,287.4 L800.0,291.9 L810.0,296.3 L820.0,300.6 L830.0,304.8 L840.0,308.9 L850.0,312.9 L860.0,316.7 L870.0,320.5 L880.0,324.2 L890.0,327.8 L900.0,331.3 L910.0,334.7 L920.0,338.1 L930.0,341.3 L940.0,344.5 L950.0,347.6 L960.0,350.6 L970.0,353.6 L980.0,356.5 L990.0,359.3 L1000.0,362.0 L1010.0,364.7 L1020.0,367.3 L1030.0,369.8 L1040.0,372.3 L1050.0,374.7 L1060.0,377.0 L1070.0,379.3 L1080.0,381.6 L1090.0,383.8 L1100.0,385.9 L1110.0,388.0 L1120.0,390.0 L1130.0,392.0 L1140.0,393.9 L1150.0,395.8 L1160.0,397.6" fill="none" stroke="#059669" stroke-width="2.8"/>
  <text x="774" y="252" font-size="10.5" fill="#065f46" font-weight="700">直接探测计数（约 0.3–0.5）</text>
  <text x="1100" y="436" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="700">CCD（不足 0.1）</text>
  <text x="740" y="510" font-size="10" fill="#475569">三家几乎同时把产品推向市场：Gatan 的 K2 Summit（2012–2013 年商用）率先实现逐事件电子计数，</text>
  <text x="740" y="524" font-size="10" fill="#475569">Falcon 与 DE 系列跟进——电子直接打进 CMOS 半导体，逐事件计数消灭读出噪声。</text>
  <rect x="814.444582" y="521.075" width="251.110836" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="940" y="533.78" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">计数剂量率约 5–10 e<tspan dy="-3.6" font-size="7.6">-</tspan><tspan dy="3.6">/像素/秒（重合损失上限）</tspan></text>
  <rect x="30" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、分子电影的三部曲</text>
  <text x="360" y="618" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">剂量分数化：把 40–60 e<tspan dy="-3.9" font-size="8.3">-</tspan><tspan dy="3.9">/Å</tspan><tspan dy="-3.9" font-size="8.3">2</tspan><tspan dy="3.9"> 切成 50–60 帧电影</tspan></text>
  <rect x="70" y="632" width="48" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="94" y="656" font-size="9" fill="#075985" text-anchor="middle">1</text>
  <rect x="128" y="632" width="48" height="44" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="152" y="656" font-size="9" fill="#075985" text-anchor="middle">2</text>
  <rect x="186" y="632" width="48" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="210" y="656" font-size="9" fill="#075985" text-anchor="middle">3</text>
  <rect x="244" y="632" width="48" height="44" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="268" y="656" font-size="9" fill="#075985" text-anchor="middle">4</text>
  <rect x="302" y="632" width="48" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="326" y="656" font-size="9" fill="#075985" text-anchor="middle">5</text>
  <rect x="360" y="632" width="48" height="44" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="384" y="656" font-size="9" fill="#075985" text-anchor="middle">6</text>
  <rect x="418" y="632" width="48" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="442" y="656" font-size="9" fill="#075985" text-anchor="middle">7</text>
  <rect x="476" y="632" width="48" height="44" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="500" y="656" font-size="9" fill="#075985" text-anchor="middle">8</text>
  <rect x="534" y="632" width="48" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="558" y="656" font-size="9" fill="#075985" text-anchor="middle">9</text>
  <rect x="592" y="632" width="48" height="44" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="616" y="656" font-size="9" fill="#075985" text-anchor="middle">10</text>
  <rect x="70" y="696" width="580" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="86" y="720" font-size="12" fill="#075985" font-weight="700">第一部曲：帧对齐（MotionCor，Li 等 2013）</text>
  <text x="86" y="740" font-size="9.5" fill="#475569">各帧对参考帧互相关求全局轨迹，网格分块求局部轨迹，低阶多项式拟合成平滑位移场</text>
  <rect x="70" y="762" width="580" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="86" y="786" font-size="12" fill="#4c1d95" font-weight="700">第二部曲：贝叶斯抛光（Zivanov 2019）</text>
  <text x="86" y="806" font-size="9.5" fill="#475569">概率模型逐颗粒回溯最优轨迹，电影帧按后验最优加权再平均</text>
  <rect x="70" y="828" width="580" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="86" y="852" font-size="12" fill="#78350f" font-weight="700">第三部曲：剂量加权（Grant 与 Grigorieff 2015）</text>
  <text x="86" y="872" font-size="9.5" fill="#475569">按「各频率信号衰减一半的临界曝光」逐帧逐频率赋权——电影被按信息寿命剪辑</text>
  <text x="360" y="932" font-size="10" fill="#64748b" text-anchor="middle">「对齐」之外又被「按信息寿命剪辑」——晚帧低频照用、高频自动降权</text>
  <rect x="710" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、算法革命与里程碑年表</text>
  <rect x="726.671" y="607.5" width="86.65800000000002" height="17" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="770" y="619.6" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">Sigworth 1998</text>
  <text x="770" y="626" font-size="9" fill="#64748b">最大似然估计引入单颗粒分类</text>
  <rect x="998.861" y="607.5" width="142.27800000000002" height="17" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1070" y="619.6" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">RELION（Scheres 2012）</text>
  <text x="1070" y="626" font-size="9" fill="#64748b">贝叶斯边缘化框架</text>
  <rect x="740.473" y="647.5" width="59.053999999999995" height="17" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="770" y="659.6" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">GPU 加速</text>
  <text x="770" y="666" font-size="9" fill="#64748b">一至两个数量级提速</text>
  <rect x="993.4019999999999" y="647.5" width="153.19600000000005" height="17" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1070" y="659.6" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">cryoSPARC（Punjani 2017）</text>
  <text x="1070" y="666" font-size="9" fill="#64748b">SGD 与分支定界压缩周期</text>
  <text x="740" y="706" font-size="11" fill="#065f46" font-weight="700">2013</text>
  <line x1="838" y1="701" x2="848" y2="701" stroke="#059669" stroke-width="2.4"/>
  <text x="858" y="706" font-size="10.5" fill="#475569">TRPV1 3.4 Å（Liao 等）——膜蛋白小样品首证</text>
  <text x="740" y="740" font-size="11" fill="#065f46" font-weight="700">2015</text>
  <line x1="838" y1="735" x2="848" y2="735" stroke="#059669" stroke-width="2.4"/>
  <text x="858" y="740" font-size="10.5" fill="#475569">β-半乳糖苷酶 2.2 Å（Bartesaghi 等）</text>
  <text x="740" y="774" font-size="11" fill="#065f46" font-weight="700">2017</text>
  <line x1="838" y1="769" x2="848" y2="769" stroke="#059669" stroke-width="2.4"/>
  <text x="858" y="774" font-size="10.5" fill="#475569">诺贝尔化学奖加冕（Dubochet、Frank、Henderson）</text>
  <text x="740" y="808" font-size="11" fill="#065f46" font-weight="700">2020 前后</text>
  <line x1="838" y1="803" x2="848" y2="803" stroke="#059669" stroke-width="2.4"/>
  <text x="858" y="808" font-size="10.5" fill="#475569">apoferritin 约 1.2 Å（Yip 与 Kato 等团队）</text>
  <text x="1040" y="866" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">硬件一半（直接探测）＋软件一半（贝叶斯与算力）——相变发生在两半同时到位</text>
  <text x="1040" y="906" font-size="10" fill="#64748b" text-anchor="middle">常规峰值从 10–20 Å 跃入原子分辨率区间</text>
</svg>