  <text x="830" y="835.6" font-size="10" fill="#075985" text-anchor="middle">阿米巴运动（变形运动）</text>
  <rect x="946.6" y="823.5" width="166.8" height="17" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1030" y="835.6" font-size="10" fill="#dc2626" text-anchor="middle">肿瘤侵袭（EMT 重编程 Rho 开关）</text>
