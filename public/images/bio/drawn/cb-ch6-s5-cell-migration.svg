  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">细胞骨架与细胞运动</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">迁移四步循环（伸展→粘着→牵引→释放）；Rac1→板状伪足、Cdc42→丝状伪足与极性、RhoA→应力纤维收缩；趋化核心是 PIP₃ 胞内极化梯度（PI3K/PTEN）；微管探路、微丝产力、中间丝保完整性</text>
  <rect x="30" y="132" width="1340" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、迁移循环：前端伸展 → 新粘着 → 胞体牵引 → 尾部释放</text>
