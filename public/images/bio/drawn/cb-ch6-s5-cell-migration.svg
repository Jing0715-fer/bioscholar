  <text x="665" y="425" font-size="10.5" fill="#1e293b">新粘着形成（整联蛋白点状粘着与粘着斑）</text>
  <circle cx="415" cy="420" r="11" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
