  <text x="1000" y="875.6" font-size="10" fill="#4c1d95" text-anchor="middle">形态发生（原肠作用群体迁移）</text>
  <text x="740" y="918" font-size="10.5" fill="#475569">力学转导：粘着斑处的张力经 talin、YAP/TAZ 转化为基因表达改变——机械生物学前沿；抗转移策略靶向整联蛋白与 ROCK。</text>
