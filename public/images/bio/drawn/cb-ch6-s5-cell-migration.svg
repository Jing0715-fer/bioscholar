  <rect x="842.0384757729337" y="584" width="12" height="8" rx="2" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
  <text x="900" y="700" font-size="9.5" fill="#075985" text-anchor="middle">趋化因子受体（GPCR）均匀分布</text>
  <text x="726" y="726" font-size="10" fill="#64748b">中性粒细胞追杀细菌、单核细胞趋向炎症灶；盘基网柄菌为经典模式生物——Rac/Cdc42 招募至前端，局部启动肌动网络伸展。</text>
  <rect x="30" y="754" width="1340" height="226" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="776.84" font-size="19" fill="#475569" font-weight="700">四、三类骨架的协作与其他运动形式</text>
  <rect x="60" y="790" width="190" height="130" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="155" y="830" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">微管</text>
  <text x="155" y="862" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">探路并运送膜组分</text>
  <text x="155" y="886" font-size="9.5" fill="#64748b" text-anchor="middle">（微管马达长程运输）</text>
  <rect x="270" y="790" width="190" height="130" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
