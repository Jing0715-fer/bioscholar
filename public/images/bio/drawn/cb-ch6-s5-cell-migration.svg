  <rect x="298.58785" y="606.075" width="46.824299999999994" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="322" y="618.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">Arp2/3</text>
  <text x="395" y="619" font-size="10.5" fill="#1e293b">丝状伪足＋建立前端极性</text>
  <rect x="91.6709" y="661.075" width="36.658199999999994" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#78350f" stroke-width="1.5"/>
