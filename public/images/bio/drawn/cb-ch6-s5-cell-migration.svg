  <rect x="192.5894" y="661.075" width="38.821200000000005" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="212" y="673.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">ROCK</text>
  <line x1="245" y1="670" x2="278" y2="670" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="287.98915" y="661.075" width="68.02170000000001" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="322" y="673.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">MLC 磷酸化</text>
  <text x="395" y="674" font-size="10.5" fill="#1e293b">应力纤维收缩</text>
  <text x="60" y="715" font-size="10.5" fill="#64748b">三者构成相互制约的回路，在细胞内建立前后极性 → 运动具有持续方向。</text>
  <rect x="710" y="494" width="660" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="516.84" font-size="19" fill="#475569" font-weight="700">三、趋化作用：极化信号转导（细胞＝梯度比较器）</text>
  <rect x="1240" y="545" width="60" height="145" fill="#b45309" fill-opacity="0.5"/>
