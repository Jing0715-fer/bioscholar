  <rect x="1133.1475" y="231.075" width="93.705" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1180" y="243.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">近焦即得高衬度</text>
  <rect x="1113.25" y="265.075" width="133.5" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1180" y="277.78" font-size="10.5" fill="#065f46" text-anchor="middle">小分子量样品的低频救命</text>
  <rect x="892.2435499999999" y="511.075" width="295.51290000000006" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1040" y="523.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">血红蛋白约 64 kDa 解析到 3 Å 级（Khoshouei 等 2017）</text>
  <text x="1040" y="480" font-size="9.5" fill="#64748b" text-anchor="middle">落在无相位板时公认「困难区」的样品（小于 100 kDa 地板线）</text>
  <rect x="30" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、Volta 的账单与像差校正的生物冷遇</text>
  <text x="50" y="618" font-size="11.5" fill="#1e293b" font-weight="700">Volta 的账单三项：</text>
  <rect x="92" y="637.5" width="196" height="17" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="190" y="649.6" font-size="10" fill="#92400e" text-anchor="middle">相位随时长漂移（须逐张拟合相位偏移）</text>
  <rect x="497" y="637.5" width="66" height="17" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="530" y="649.6" font-size="10" fill="#92400e" text-anchor="middle">膜寿命有限</text>
  <rect x="487" y="669.5" width="86" height="17" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="530" y="681.6" font-size="10" fill="#92400e" text-anchor="middle">对准精度要求高</text>
  <text x="50" y="710" font-size="10.5" fill="#475569">球差校正的材料学军备：Haider 等 1998 年装机、Batson 等 2002 年达亚埃——生物侧却遇冷：CTF 形态被重写、低频衬度权衡、</text>
  <text x="50" y="725" font-size="10.5" fill="#475569">机电稳定性风险，三笔账都不好算。</text>
  <rect x="166.11" y="763.075" width="147.78" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="240" y="775.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">材料学：亚埃分辨已成常规</text>
  <rect x="447.40005" y="763.075" width="185.19989999999999" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="540" y="775.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">生物侧：Cs 校正遇冷、相位板补位</text>
  <text x="50" y="812" font-size="10.5" fill="#475569">单色器加色差校正把能量分辨推到毫电子伏量级——低温生物应用仍在萌芽；激光相位板等新器件在研。</text>
  <text x="360" y="900" font-size="10" fill="#64748b" text-anchor="middle">「相位问题的另一条路」：不改透镜，改后焦面</text>
  <rect x="710" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、4D-STEM、叠层成像与模式对照</text>
  <text x="730" y="618" font-size="10.5" fill="#475569">4D-STEM 以像素阵列探测器逐点记录完整衍射图（每个扫描位置一张二维图，故为四维）；叠层成像（ptychography）</text>
  <text x="730" y="633" font-size="10.5" fill="#475569">从中以迭代算法恢复相位——剂量效率高；微分相衬读内建电磁场；低温生物应用萌芽。</text>
  <rect x="730" y="692" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="805" y="719.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">模式</text>
  <rect x="880" y="692" width="180" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="719.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">机制</text>
  <rect x="1060" y="692" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1135" y="719.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">主要优点</text>
  <rect x="1210" y="692" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1280" y="719.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">主要局限</text>
  <rect x="730" y="736" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="805" y="756.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">离焦相位衬度</text>
  <rect x="880" y="736" width="180" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="756.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">欠焦 χ 相位差</text>
  <rect x="1060" y="736" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1135" y="756.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">成熟普适</text>
  <rect x="1210" y="736" width="140" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1280" y="756.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">低频缺失、零点环</text>
  <rect x="730" y="766" width="620" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="766" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="805" y="786.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">Volta 相位板</text>
  <rect x="880" y="766" width="180" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="786.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">荷电斑 π/2 相移</text>
