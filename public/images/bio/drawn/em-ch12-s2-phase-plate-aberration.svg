  <rect x="536.925" y="181.075" width="126.15" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="193.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">代价一：低频衬度缺失</text>
  <rect x="520.7025" y="215.075" width="158.595" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="227.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">代价二：传递函数随欠焦振荡</text>
  <rect x="526.11" y="249.075" width="147.78" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="261.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">代价三：零点环带湮灭信息</text>
  <text x="450" y="320" font-size="10" fill="#475569">光学显微学早在 1930 年代给过答案——Zernike 相衬法：</text>
  <text x="450" y="334" font-size="10" fill="#475569">给未散射的中央束单独加 π/2 相移，</text>
  <text x="450" y="348" font-size="10" fill="#475569">相位差直接转成强度差</text>
  <text x="450" y="362" font-size="10" fill="#475569">（1953 年诺贝尔物理学奖）。</text>
  <text x="450" y="376" font-size="10" fill="#475569">把板搬进电镜的尝试持续半个世纪：</text>
  <text x="450" y="390" font-size="10" fill="#475569">Boersch 1947 年静电环电极方案为首创，</text>
  <text x="450" y="404" font-size="10" fill="#475569">碳膜污染与充电长期困住这条路。</text>
  <text x="240" y="470" font-size="10" fill="#64748b" text-anchor="middle">「欠焦＝天然泽尼克板」，但板本身带伤</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、Volta 相位板：把漏电做成器件（Danev 2014）</text>
  <line x1="760" y1="190" x2="760" y2="420" stroke="#0369a1" stroke-width="2.4" marker-end="url(#arr-acc)"/>
  <text x="770" y="212" font-size="9.5" fill="#075985">散射电子（弱）</text>
  <line x1="790" y1="190" x2="790" y2="420" stroke="#1e293b" stroke-width="3.4" marker-end="url(#arr-ink)"/>
  <text x="800" y="330" font-size="9.5" fill="#1e293b" font-weight="700">中央束（强）</text>
  <rect x="742" y="300" width="96" height="8" fill="#64748b" fill-opacity="0.35" stroke="#475569" stroke-width="1.4"/>
  <text x="790" y="288" font-size="9" fill="#475569" text-anchor="middle">约 10 nm 无定形碳膜（后焦面）</text>
  <circle cx="790" cy="304" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="790" y="336" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700">Volta 电位荷电斑</text>
  <text x="880" y="190" font-size="10.5" fill="#475569">中央束在照射点把膜「充」出一个局部表面电位——荷电斑点恰好充当 π/2 相移器，</text>
  <text x="880" y="205" font-size="10.5" fill="#475569">且随束自动对准：与其对抗充电，不如收编充电。</text>
  <rect x="880" y="340" width="280" height="130" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="880" y1="470" x2="880" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="880" y="492" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="1160" y1="470" x2="1160" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="1160" y="492" font-size="13" fill="#64748b" text-anchor="middle">g</text>
  <line x1="874" y1="353" x2="880" y2="353" stroke="#475569" stroke-width="1.8"/>
  <text x="870" y="357" font-size="13" fill="#64748b" text-anchor="end">+1</text>
  <line x1="874" y1="457" x2="880" y2="457" stroke="#475569" stroke-width="1.8"/>
  <text x="870" y="461" font-size="13" fill="#64748b" text-anchor="end">−1</text>
  <text x="1020" y="328" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">带相位板的 CTF：低频被救回</text>
