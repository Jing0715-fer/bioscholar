  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">相位板与像差校正：把漏电做成器件</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">Zernike相衬获1953年诺奖；Volta相位板（Danev2014）以约10nm碳膜上的荷电斑作π/2相移器，近焦即得高衬度——血红蛋白约64kDa解析到3Å级；球差校正（Haider1998、</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">Batson2002亚埃）在生物侧遇冷；4D-STEM叠层成像剂量效率高</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、离焦相位衬度的三笔代价与 Zernike 思想</text>
  <rect x="70" y="200" width="340" height="200" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="70" y1="400" x2="70" y2="406" stroke="#475569" stroke-width="1.8"/>
  <text x="70" y="422" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="410" y1="400" x2="410" y2="406" stroke="#475569" stroke-width="1.8"/>
  <text x="410" y="422" font-size="13" fill="#64748b" text-anchor="middle">频率 g</text>
  <line x1="64" y1="300" x2="70" y2="300" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="304" font-size="13" fill="#64748b" text-anchor="end">+1</text>
  <line x1="64" y1="391" x2="70" y2="391" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="395" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="64" y1="210" x2="70" y2="210" stroke="#475569" stroke-width="1.8"/>
  <text x="60" y="214" font-size="13" fill="#64748b" text-anchor="end">−1</text>
  <text x="240" y="188" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">离焦 CTF：低频缺失、振荡、零点环带</text>
