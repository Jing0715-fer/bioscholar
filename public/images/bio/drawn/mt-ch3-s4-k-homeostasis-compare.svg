<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">动植物钾稳态对照：排泄闭环 vs 储存再动员</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">动物体内约98%的钾在细胞内、外液仅3.5–5.5mmol/L——急性靠胰岛素等细胞间缓冲，慢性靠肾「近端恒定重吸收＋远端ROMK/ENaC按需分泌」与醛固酮总开关；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">植物无排泄概念，走吸收—木质部/韧皮部分配—液泡储存—老叶再动员的全内循环，缺钾先写老叶叶缘焦枯</text>
  <rect x="30" y="132" width="1340" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、全链对照：动物的肾（排泄闭环）vs 植物的整体（储存再动员）</text>
  <text x="48" y="176" font-size="12.5" fill="#991b1b" font-weight="700">动物侧：滤过—恒定重吸收—远端精细分泌</text>
  <text x="48" y="202" font-size="10.5" fill="#475569">体内约 98% 的钾在细胞内（约 140 mmol/L）· 外液 3.5–5.5 mmol/L——内外比约 35:1</text>
  <rect x="48" y="214" width="640" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="60" y="231" font-size="10" fill="#475569">急性防御（分钟级）：胰岛素与 β₂ 儿茶酚胺把吸收的钾推入细胞，抹平血钾尖峰</text>
  <text x="60" y="248" font-size="10" fill="#475569">溶血·横纹肌溶解·酸中毒把 1%–2% 胞内钾搬出，即足以冲出血钾窄窗</text>
  <rect x="60" y="268" width="390" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="255" y="285" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="600">肾小球滤过 约 700 mmol/日</text>
  <line x1="255" y1="302" x2="255" y2="316" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="60" y="320" width="390" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="255" y="337" font-size="10.5" fill="#475569" text-anchor="middle">近端小管：恒定重吸收约 2/3（定量环节，不随盈亏调节）</text>
  <line x1="255" y1="354" x2="255" y2="368" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="60" y="372" width="390" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="255" y="389" font-size="10.5" fill="#475569" text-anchor="middle">髓襻升支：再吸收约 1/4（NKCC2）</text>
  <line x1="255" y1="406" x2="255" y2="420" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="60" y="424" width="390" height="44" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="255" y="440" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="600">远端主细胞：ENaC 吸 Na<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> → 管腔负电位</tspan></text>
  <text x="255" y="458" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="600">ROMK 顺势泌 K<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6">（变量调节全压在远端）</tspan></text>
  <text x="472" y="378" font-size="9.5" fill="#64748b">高钾血症直接刺激肾上腺球状带</text>
  <text x="472" y="394" font-size="9.5" fill="#64748b">（数分钟至数小时起效）</text>
  <line x1="572" y1="398" x2="572" y2="420" stroke="#d97706" stroke-width="1.4" marker-end="url(#arr-warn)"/>
  <rect x="470" y="424" width="205" height="44" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="572" y="440" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">醛固酮（总开关）</text>
  <text x="572" y="458" font-size="10" fill="#92400e" text-anchor="middle">↑ENaC·ROMK·钠泵</text>
  <line x1="468" y1="446" x2="452" y2="446" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-warn)"/>
  <text x="48" y="500" font-size="10.5" fill="#475569">高钾餐后数小时内尿钾追平摄入——「吃得多少排多少」；摄入锐减时主细胞下调 ROMK、闰细胞经 H<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6">/K</tspan><tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6">-ATPase 保钾泌 H</tspan><tspan dy="-3.6" font-size="7.6">+</tspan></text>
  <text x="48" y="542" font-size="10.5" fill="#991b1b" font-weight="600">心脏对血钾窄窗最敏感：高钾 T 波高尖·低钾心律失常——临床恪守「见尿补钾」</text>
  <text x="710" y="176" font-size="12.5" fill="#065f46" font-weight="700">植物侧：吸收—分配—储存—再动员（无排泄概念）</text>
  <text x="710" y="202" font-size="10.5" fill="#475569">钾占植物干重 1%–5%——最丰富的无机阳离子：酶激活·蛋白合成·渗透势·气孔运动·电荷配重</text>
  <rect x="720" y="218" width="640" height="42" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1040" y="244" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">吸收（根成熟区）：AKT1＋HAK5 双系统接力</text>
  <line x1="1040" y1="261" x2="1040" y2="274" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="720" y="276" width="640" height="42" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1040" y="293" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">长距离分配：木质部 SKOR 装载·蒸腾流上行</text>
  <text x="1040" y="310" font-size="10.5" fill="#475569" text-anchor="middle">韧皮部 AKT2 双向装卸（糖-钾互为电学配重）</text>
  <line x1="1040" y1="319" x2="1040" y2="332" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="720" y="334" width="640" height="42" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="1040" y="360" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">气孔日循环：保卫细胞 K<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 与苹果酸涨落——最大日常消耗户</tspan></text>
  <line x1="1040" y1="377" x2="1040" y2="390" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="720" y="392" width="640" height="42" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="1040" y="418" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">储存：液泡（成熟细胞八至九成的钾）——「胞质恒定、液泡弹性」</text>
  <line x1="1040" y1="435" x2="1040" y2="448" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="720" y="450" width="640" height="42" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="1040" y="476" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">再动员：老叶衰老 → 钾经韧皮部撤出，调往新叶与果实（可移动元素）</text>
  <text x="710" y="516" font-size="10.5" fill="#475569">蒸腾微弱的夜间由根压与韧皮部再循环接替——钾的运输没有下班时间，只有换班</text>
  <text x="710" y="544" font-size="10.5" fill="#134e4a" font-weight="600">动物带着钾跑（血浆循环＋肾小管液），植物守着钾等（木质部＋韧皮部再循环）</text>
  <rect x="30" y="574" width="1340" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="596.84" font-size="19" fill="#475569" font-weight="700">二、门控方向反用与缺钾症状</text>
  <text x="48" y="612" font-size="12" fill="#475569" font-weight="700">同一 S4 骨架，相反的接法（电压轴）</text>
  <text x="70" y="625" font-size="9.5" fill="#134e4a">植物静息（−120～−200 mV）</text>
  <rect x="70" y="630" width="188" height="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="329" y="625" font-size="9.5" fill="#92400e">动物静息（−30～−90 mV）</text>
  <rect x="329" y="630" width="141" height="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <rect x="70" y="646" width="205" height="26" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="172" y="663" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="600">KAT1：超极化开（内向吸 K<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6">）</tspan></text>
  <rect x="440" y="646" width="218" height="26" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="549" y="663" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="600">Kv：去极化开（外向复极）</text>
  <line x1="55" y1="690" x2="670" y2="690" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="70" y1="690" x2="70" y2="697" stroke="#475569" stroke-width="1.6"/>
  <text x="70" y="714" font-size="9.5" fill="#64748b" text-anchor="middle">−200</text>
  <line x1="258" y1="690" x2="258" y2="697" stroke="#475569" stroke-width="1.6"/>
  <text x="258" y="714" font-size="9.5" fill="#64748b" text-anchor="middle">−120</text>
  <line x1="329" y1="690" x2="329" y2="697" stroke="#475569" stroke-width="1.6"/>
  <text x="329" y="714" font-size="9.5" fill="#64748b" text-anchor="middle">−90</text>
  <line x1="470" y1="690" x2="470" y2="697" stroke="#475569" stroke-width="1.6"/>
  <text x="470" y="714" font-size="9.5" fill="#64748b" text-anchor="middle">−30</text>
  <line x1="540" y1="690" x2="540" y2="697" stroke="#475569" stroke-width="1.6"/>
  <text x="540" y="714" font-size="9.5" fill="#64748b" text-anchor="middle">0</text>
  <line x1="658" y1="690" x2="658" y2="697" stroke="#475569" stroke-width="1.6"/>
  <text x="658" y="714" font-size="9.5" fill="#64748b" text-anchor="middle">+50</text>
  <text x="362" y="736" font-size="10.5" fill="#475569" text-anchor="middle">膜电位（mV）</text>
  <text x="48" y="760" font-size="10.5" fill="#475569">植物把 H<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6">-ATPase 泵出的更负电位兑现为吸钾驱动力；动物 Kv 几乎清一色外向复极</tspan></text>
  <text x="720" y="612" font-size="12" fill="#92400e" font-weight="700">缺钾先写老叶：可移动元素的信号图谱</text>
  <path d="M 860 690 Q 950 615 1040 690 Q 950 748 860 690 Z" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <path d="M 860 690 Q 950 615 1040 690" fill="none" opacity="0.5" stroke="#dc2626" stroke-width="5"/>
  <path d="M 860 690 Q 950 748 1040 690" fill="none" opacity="0.5" stroke="#dc2626" stroke-width="5"/>
  <line x1="872" y1="690" x2="1028" y2="690" stroke="#0f766e" stroke-width="1.6"/>
  <line x1="910" y1="690" x2="895" y2="668" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="910" y1="690" x2="895" y2="712" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="990" y1="690" x2="1005" y2="668" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="990" y1="690" x2="1005" y2="712" stroke="#0f766e" stroke-width="1.2"/>
  <text x="950" y="766" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="600">叶缘先黄化、后焦枯（烧灼状镶边）</text>
  <text x="1090" y="640" font-size="10.5" fill="#475569">· 钾优先调往幼嫩组织——老叶先衰</text>
  <text x="1090" y="664" font-size="10.5" fill="#475569">· 茎秆机械强度下降·易倒伏</text>
  <text x="1090" y="688" font-size="10.5" fill="#475569">· 果实着色差·淀粉积累不足</text>
  <text x="1090" y="712" font-size="10.5" fill="#475569">· 抗逆性下滑——大田追施钾肥的信号</text>
  <text x="1090" y="738" font-size="10" fill="#64748b">动物缺钾危险在心（心律失常·肌无力）；</text>
  <text x="1090" y="754" font-size="10" fill="#64748b">植物缺钾损失在产量与品质</text>
  <rect x="30" y="786" width="1340" height="199" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="808.84" font-size="19" fill="#475569" font-weight="700">三、共同点：同一套钾经济学</text>
  <rect x="45" y="836" width="200" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="863.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">共同点</text>
  <rect x="245" y="836" width="350" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="420" y="863.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">动物</text>
  <rect x="595" y="836" width="350" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="770" y="863.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">植物</text>
  <rect x="45" y="880" width="200" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="898.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">最富胞内阳离子</text>
  <rect x="245" y="880" width="350" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="420" y="898.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">胞内约 140 mmol/L·98% 在胞内</text>
  <rect x="595" y="880" width="350" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="770" y="898.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">100–200 mM·占干重 1%–5%</text>
  <rect x="45" y="906" width="900" height="26" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="45" y="906" width="200" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="924.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">通道＋转运体双系统</text>
  <rect x="245" y="906" width="350" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="420" y="924.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">Kv/Kir/ROMK 配 NKCC/KCC</text>
  <rect x="595" y="906" width="350" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="770" y="924.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">AKT1（mM 级）配 HAK5（μM 级）</text>
  <rect x="45" y="932" width="200" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="950.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">翻译后级联为旋钮</text>
  <rect x="245" y="932" width="350" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="420" y="950.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">PKA·醛固酮—ENaC/ROMK</text>
  <rect x="595" y="932" width="350" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="770" y="950.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">CBL-CIPK23 钙依赖磷酸化—AKT1</text>
  <rect x="45" y="958" width="900" height="26" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="45" y="958" width="200" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="976.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">一次泵供能</text>
  <rect x="245" y="958" width="350" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="420" y="976.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">Na<tspan dy="-4.1" font-size="8.6">+</tspan><tspan dy="4.1"> 循环（Na</tspan><tspan dy="-4.1" font-size="8.6">+</tspan><tspan dy="4.1">/K</tspan><tspan dy="-4.1" font-size="8.6">+</tspan><tspan dy="4.1">-ATPase）</tspan></text>
  <rect x="595" y="958" width="350" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="770" y="976.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">H<tspan dy="-4.1" font-size="8.6">+</tspan><tspan dy="4.1"> 循环（H</tspan><tspan dy="-4.1" font-size="8.6">+</tspan><tspan dy="4.1">-ATPase·PMF）</tspan></text>
  <text x="965" y="850" font-size="10.5" fill="#475569">连通道本身都同源：植物 Shaker 与动物 Kv 共享 6TMS 拓扑与带电 S4，</text>
  <text x="965" y="868" font-size="10.5" fill="#475569">只是门控方向被演化各取所需地反转</text>
  <text x="965" y="915" font-size="10.5" fill="#475569">激素层面平行：醛固酮与 ABA 都是应激激素，</text>
  <text x="965" y="933" font-size="10.5" fill="#475569">都以「快速非基因组＋慢速转录重塑」双轨作用于各自的转运机器</text>
  <text x="965" y="972" font-size="11" fill="#134e4a" font-weight="700">分子高度同源，分岔在生态位——动物带着钾跑，植物守着钾等</text>
