  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">灭菌、消毒与防腐：四术语递进与湿热强于干热的原理</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">湿热强于干热：水导热快、蛋白含水越多越易凝固、蒸汽冷凝释潜热；高压蒸汽121℃15–30min杀芽孢，巴氏63℃/30min或72℃/15s；D值90%杀灭时间、Z约10℃、12D</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">商业无菌；乙醇70%–75%</text>
  <rect x="30" y="132" width="1340" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、灭菌 · 消毒 · 防腐 · 化学治疗：按杀灭强度与使用对象递进</text>
  <line x1="80" y1="168" x2="1320" y2="168" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <text x="700" y="160" font-size="10.5" fill="#64748b" text-anchor="middle">杀灭强度递减</text>
  <rect x="167.55" y="195.25" width="54.900000000000006" height="25.5" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="195" y="213.4" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">灭菌</text>
  <text x="50" y="248" font-size="10.5" fill="#475569">杀灭物品上一切微生物（包括细菌芽孢）——培养基、手术器械</text>
  <rect x="487.55" y="195.25" width="54.900000000000006" height="25.5" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="515" y="213.4" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">消毒</text>
  <text x="370" y="248" font-size="10.5" fill="#475569">杀灭病原微生物的繁殖体（不一定杀芽孢）——物体表面、环境</text>
  <rect x="807.55" y="195.25" width="54.900000000000006" height="25.5" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="835" y="213.4" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">防腐</text>
  <text x="690" y="248" font-size="10.5" fill="#475569">抑制微生物生长繁殖（不杀灭）——食品、药品保存</text>
  <rect x="1112.1" y="195.25" width="85.80000000000001" height="25.5" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1155" y="213.4" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">化学治疗</text>
  <text x="1010" y="248" font-size="10.5" fill="#475569">化学治疗剂选择性杀灭体内病原——可进入体内使用</text>
  <text x="60" y="300" font-size="11" fill="#1e293b" font-weight="700">消毒剂因毒性不可体内使用——这是「消毒」与「化学治疗」的分界。</text>
  <rect x="30" y="334" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="356.84" font-size="19" fill="#475569" font-weight="700">二、湿热灭菌为什么强于干热；热力工艺阶梯</text>
  <rect x="46" y="384" width="300" height="68" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="60" y="406" font-size="12.5" fill="#134e4a" font-weight="700">① 水导热快</text>
  <text x="60" y="428" font-size="10.5" fill="#475569">蒸汽对流与冷凝把热迅速传到物品各处。</text>
  <rect x="46" y="456" width="300" height="68" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="60" y="478" font-size="12.5" fill="#134e4a" font-weight="700">② 蛋白含水越多越易凝固</text>
  <text x="60" y="500" font-size="10.5" fill="#475569">卵清蛋白含水约 50% 时 56 ℃ 即凝固；</text>
  <text x="60" y="514" font-size="10.5" fill="#475569">完全干燥则需 160 ℃ 以上。</text>
  <rect x="46" y="528" width="300" height="68" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="60" y="550" font-size="12.5" fill="#134e4a" font-weight="700">③ 蒸汽冷凝释放潜热</text>
  <text x="60" y="572" font-size="10.5" fill="#475569">每克 100 ℃ 蒸汽冷凝释放约 2.26 kJ 汽化潜热，</text>
  <text x="60" y="586" font-size="10.5" fill="#475569">物品表面迅速升温。</text>
  <line x1="384" y1="596" x2="384" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#arr-mute)"/>
  <text x="368" y="500" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">温度 ↑</text>
  <rect x="400" y="396" width="276" height="40" rx="7" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.5"/>
  <text x="538" y="413" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">UHT 135 ℃ 以上 · 数秒</text>
  <text x="538" y="428" font-size="8.5" fill="#475569" text-anchor="middle">商业无菌</text>
  <rect x="400" y="444" width="276" height="40" rx="7" fill="#fef3c7" fill-opacity="0.55" stroke="#d97706" stroke-width="1.5"/>
  <text x="538" y="461" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">高压蒸汽 121 ℃ · 0.1 MPa · 15–30 min</text>
  <text x="538" y="476" font-size="8.5" fill="#475569" text-anchor="middle">杀灭芽孢——灭菌</text>
  <rect x="400" y="492" width="276" height="40" rx="7" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="1.5"/>
  <text x="538" y="509" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">煮沸 100 ℃ · 数分钟</text>
  <text x="538" y="524" font-size="8.5" fill="#475569" text-anchor="middle">杀繁殖体；芽孢需数小时，加 2% 碳酸钠增效防锈</text>
  <rect x="400" y="540" width="276" height="40" rx="7" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.5"/>
  <text x="538" y="557" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">巴氏消毒 63 ℃/30 min 或 72 ℃/15 s</text>
  <text x="538" y="572" font-size="8.5" fill="#475569" text-anchor="middle">不杀芽孢</text>
  <rect x="710" y="334" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="356.84" font-size="19" fill="#475569" font-weight="700">三、灭菌动力学定量：D 值、Z 值与 F 值（存活曲线为对数直线）</text>
  <rect x="740" y="435" width="300" height="175" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="740" y1="566.25" x2="1040" y2="566.25" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="815" y1="610" x2="815" y2="435" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="740" y1="522.5" x2="1040" y2="522.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="890" y1="610" x2="890" y2="435" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="740" y1="478.75" x2="1040" y2="478.75" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="965" y1="610" x2="965" y2="435" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="815" y1="610" x2="815" y2="616" stroke="#475569" stroke-width="1.8"/>
  <text x="815" y="632" font-size="13" fill="#64748b" text-anchor="middle">10</text>
  <line x1="890" y1="610" x2="890" y2="616" stroke="#475569" stroke-width="1.8"/>
  <text x="890" y="632" font-size="13" fill="#64748b" text-anchor="middle">20</text>
  <line x1="965" y1="610" x2="965" y2="616" stroke="#475569" stroke-width="1.8"/>
  <text x="965" y="632" font-size="13" fill="#64748b" text-anchor="middle">30</text>
  <line x1="734" y1="592.5" x2="740" y2="592.5" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="596.5" font-size="13" fill="#64748b" text-anchor="end">10⁶</text>
  <line x1="734" y1="557.5" x2="740" y2="557.5" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="561.5" font-size="13" fill="#64748b" text-anchor="end">10⁵</text>
  <line x1="734" y1="522.5" x2="740" y2="522.5" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="526.5" font-size="13" fill="#64748b" text-anchor="end">10⁴</text>
  <line x1="734" y1="487.5" x2="740" y2="487.5" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="491.5" font-size="13" fill="#64748b" text-anchor="end">10³</text>
  <line x1="734" y1="452.5" x2="740" y2="452.5" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="456.5" font-size="13" fill="#64748b" text-anchor="end">10²</text>
  <text x="890" y="654" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">加热时间（min）</text>
  <text x="694" y="522.5" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">存活数（对数）</text>
  <path d="M740.0,435.0 L845.0,610.0" fill="none" stroke="#dc2626" stroke-width="2.6"/>
  <path d="M740.0,435.0 L920.0,601.3" fill="none" stroke="#d97706" stroke-width="2.6"/>
  <path d="M740.0,435.0 L1040.0,548.8" fill="none" stroke="#0369a1" stroke-width="2.6"/>
  <rect x="940" y="585.8" width="11" height="8.4" rx="3" fill="#dc2626" stroke="#cbd5e1" stroke-width="1"/>
  <text x="959" y="593.6" font-size="10" fill="#475569">121 ℃</text>
  <rect x="1000" y="585.8" width="11" height="8.4" rx="3" fill="#d97706" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1019" y="593.6" font-size="10" fill="#475569">115 ℃</text>
  <rect x="1060" y="585.8" width="11" height="8.4" rx="3" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1079" y="593.6" font-size="10" fill="#475569">105 ℃</text>
  <line x1="740" y1="470" x2="832.4" y2="470" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-ink)" marker-start="url(#arr-ink)"/>
  <text x="785" y="456" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">D 值 = 降 1 个数量级的时间</text>
  <rect x="1070" y="380" width="286" height="218" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="1086" y="404" font-size="10.5" fill="#475569">D 值：给定温度下活数下降一个数量级（杀灭 90%）</text>
  <text x="1086" y="419" font-size="10.5" fill="#475569">所需时间——肉毒梭菌芽孢在 121 ℃ 的 D 值约 0.2–0.3 min。</text>
  <text x="1086" y="456" font-size="10.5" fill="#475569">Z 值：使 D 值变动 10 倍所需的温度变化度数</text>
  <text x="1086" y="471" font-size="10.5" fill="#475569">（细菌芽孢常取约 10 ℃），</text>
  <text x="1086" y="486" font-size="10.5" fill="#475569">用于不同温度间热力等效换算。</text>
  <text x="1086" y="512" font-size="10.5" fill="#475569">F 值：</text>
  <text x="1086" y="527" font-size="10.5" fill="#475569">折算的等效灭菌时间——如某芽孢 121 ℃ 的 D 值为 1.5 min，</text>
  <text x="1086" y="542" font-size="10.5" fill="#475569">工艺折算 F₀ = 6 min 即获 4 个数量级杀灭。</text>
  <text x="1086" y="568" font-size="10.5" fill="#dc2626" font-weight="700">商业无菌：低酸罐头以肉毒梭菌芽孢 12D 为目标。</text>
  <rect x="30" y="646" width="1340" height="334" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="668.84" font-size="19" fill="#475569" font-weight="700">四、常用控制方法对照：热力 · 过滤 · 化学</text>
  <rect x="60" y="700" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="727.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">方法类别</text>
  <rect x="190" y="700" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="315" y="727.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">具体手段</text>
  <rect x="440" y="700" width="400" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="727.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">关键参数</text>
  <rect x="840" y="700" width="500" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1090" y="727.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">适用与特点</text>
  <rect x="60" y="744" width="130" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="766.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">干热灭菌</text>
  <rect x="190" y="744" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="315" y="766.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">火焰烧灼 · 干热灭菌箱</text>
  <rect x="440" y="744" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="766.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">卵清蛋白完全干燥时需 160 ℃ 以上才凝固</text>
  <rect x="840" y="744" width="500" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1090" y="766.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">金属接种环、玻璃器皿等耐烧物品</text>
  <rect x="60" y="778" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="778" width="130" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="800.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">湿热灭菌</text>
  <rect x="190" y="778" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="315" y="800.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">高压蒸汽灭菌</text>
  <rect x="440" y="778" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="800.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">121 ℃（0.1 MPa）15–30 min 可杀灭芽孢</text>
  <rect x="840" y="778" width="500" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1090" y="800.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">培养基、生理盐水、手术器械等常规首选</text>
  <rect x="60" y="812" width="130" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="834.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">湿热消毒</text>
  <rect x="190" y="812" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="315" y="834.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">巴氏消毒 · 煮沸</text>
  <rect x="440" y="812" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="834.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">63 ℃/30 min 或 72 ℃/15 s；煮沸 100 ℃ 数分钟</text>
  <rect x="840" y="812" width="500" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1090" y="834.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">乳品酒类与一般器械——不杀芽孢</text>
  <rect x="60" y="846" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="846" width="130" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="868.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">超高温</text>
  <rect x="190" y="846" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="315" y="868.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">UHT</text>
  <rect x="440" y="846" width="400" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="868.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">135 ℃ 以上数秒</text>
