  <rect x="500" y="784" width="300" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="650" y="812.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">Na⁺ 通道再生性正反馈</text>
  <rect x="60" y="830" width="740" height="46" fill="#f8fafc" fill-opacity="0.85"/>
