  <line x1="586.48" y1="480" x2="586.48" y2="486" stroke="#475569" stroke-width="1.8"/>
  <text x="586.48" y="502" font-size="13" fill="#64748b" text-anchor="middle">5</text>
  <line x1="114" y1="455.1" x2="120" y2="455.1" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="459.1" font-size="13" fill="#64748b" text-anchor="end">−70</text>
  <line x1="114" y1="417.6" x2="120" y2="417.6" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="421.6" font-size="13" fill="#64748b" text-anchor="end">−55</text>
  <line x1="114" y1="279.9" x2="120" y2="279.9" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="283.9" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="114" y1="204.89999999999998" x2="120" y2="204.89999999999998" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="208.89999999999998" font-size="13" fill="#64748b" text-anchor="end">+30</text>
  <text x="400" y="524" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">时间（ms）</text>
  <text x="74" y="330" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">膜电位（mV）</text>
  <line x1="120" y1="417.6" x2="680" y2="417.6" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="6 5" opacity="0.8"/>
  <text x="676" y="411" font-size="11.5" fill="#dc2626" text-anchor="end" font-weight="700">阈值 ≈ −55 mV（静息之上 10–15 mV）</text>
  <line x1="120" y1="455.1" x2="680" y2="455.1" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.8"/>
  <text x="676" y="471" font-size="11" fill="#64748b" text-anchor="end">静息 −70 mV</text>
