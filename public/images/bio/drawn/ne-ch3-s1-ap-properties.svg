  <text x="135" y="290" font-size="11.5" fill="#134e4a" font-weight="700">① 上升支 0.2–0.5 ms</text>
  <line x1="222" y1="300" x2="236" y2="362" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-dna)"/>
  <text x="355" y="330" font-size="11.5" fill="#075985" font-weight="700">③ 下降支（K⁺ 外流）</text>
  <line x1="352" y1="340" x2="328" y2="386" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <text x="430" y="430" font-size="11.5" fill="#4c1d95" font-weight="700">④ 后超极化（持续数 ms）</text>
  <line x1="428" y1="438" x2="412" y2="464" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#arr-pro)"/>
  <text x="452" y="236" font-size="11" fill="#475569">上升支：</text>
  <text x="452" y="251" font-size="11" fill="#475569">Na⁺ 通道在 0.1–0.2 ms 内雪崩式开放，</text>
  <text x="452" y="266" font-size="11" fill="#475569">膜电位直冲 E_Na 方向，</text>
  <text x="452" y="281" font-size="11" fill="#475569">但从未真正到达 +60 mV。</text>
  <line x1="213" y1="528" x2="410" y2="528" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="311" y="550" font-size="11.5" fill="#64748b" text-anchor="middle">峰—峰全程约 1–2 ms（后超极化可持续数 ms）</text>
  <rect x="870" y="132" width="500" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="886" y="154.84" font-size="19" fill="#475569" font-weight="700">二、不应期：钠通道的强制冷却</text>
  <line x1="900" y1="300" x2="1330" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#arr-ink)"/>
  <polyline points="905,300 909,294 913,258 919,306 923,318 927,300" fill="none" stroke="#be185d" stroke-width="2.4"/>
  <rect x="940" y="262" width="120" height="76" rx="6" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="1000" y="250" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">绝对不应期 ≈ 1 ms</text>
  <text x="938" y="360" font-size="10.5" fill="#475569">Na⁺ 通道失活：</text>
  <text x="938" y="374" font-size="10.5" fill="#475569">任何刺激都不能再触发——保证单向传播、</text>
  <text x="938" y="388" font-size="10.5" fill="#475569">设定频率上限。</text>
  <rect x="1060" y="262" width="200" height="76" rx="6" fill="#fef3c7" fill-opacity="0.55" stroke="#d97706" stroke-width="1.6"/>
  <text x="1160" y="250" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">相对不应期（数 ms）</text>
  <text x="1064" y="360" font-size="10.5" fill="#475569">K⁺ 外流残余 + 后超极化：</text>
  <text x="1064" y="374" font-size="10.5" fill="#475569">需更强刺激方能到达阈值。</text>
  <rect x="1260" y="262" width="70" height="76" rx="6" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.6"/>
  <text x="1295" y="250" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">恢复</text>
  <text x="1115" y="428" font-size="11" fill="#64748b" text-anchor="middle">放电后时间 →</text>
  <rect x="900" y="452" width="430" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="918" y="474" font-size="11.5" fill="#475569">频率上限 = 1 / 绝对不应期：理论上限约千 Hz，</text>
  <text x="918" y="490" font-size="11.5" fill="#475569">实际放电频率上限在数百赫兹量级——强度被翻译为频率。</text>
  <rect x="30" y="576" width="1340" height="402" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、分级电位 vs 动作电位：局部模拟计算 + 长程数字传输</text>
  <rect x="60" y="648" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="675.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">特性</text>
  <rect x="170" y="648" width="330" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="335" y="675.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">分级电位（突触/感受器电位）</text>
  <rect x="500" y="648" width="300" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="650" y="675.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">动作电位</text>
  <rect x="60" y="692" width="110" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
