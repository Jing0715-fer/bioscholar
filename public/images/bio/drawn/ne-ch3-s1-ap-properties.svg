  <text x="135" y="214" font-size="11" fill="#64748b" font-weight="700">阈下刺激：分级、衰减</text>
  <line x1="156" y1="226" x2="168" y2="428" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arr-mute)"/>
