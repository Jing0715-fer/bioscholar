  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">动作电位的特性：全或无、四阶段波形与不应期</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">阈值约−55mV（静息之上10–15mV）；上升支约0.2–0.5ms、超射+30～+40mV（Na⁺通道0.1–0.2ms内雪崩开放但从未到达E_Na）、下降支与持续数ms的后超极化，全程约1–2</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">ms；绝对不应期约1ms源于钠通道失活，保证单向传播并设定数百赫兹的频率上限；强度以放电频率编码，分级电位与动作电位构成「局部模拟+长程数字」分工</text>
  <rect x="30" y="132" width="820" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、一次放电的解剖：全或无的固定剧本</text>
  <rect x="120" y="180" width="560" height="300" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="120" y1="405" x2="680" y2="405" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
