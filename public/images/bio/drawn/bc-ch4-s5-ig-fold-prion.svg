  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">免疫球蛋白、蛋白质折叠与朊病毒</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">Ig的Y形四链与β三明治结构域、五类免疫球蛋白分工；Anfinsen复性实验证明一级结构决定构象（ΔG−20~−60kJ/mol）；PrPᶜ→PrPˢᶜ模板化传播构象病</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、免疫球蛋白：Y 形四链分子（以 IgG 为例）</text>
  <path d="M410,525 L410,432 Q410,368 352,336 L250,290" fill="none" stroke="#6d28d9" stroke-width="7"/>
  <path d="M410,525 L410,432 Q410,368 468,336 L570,290" fill="none" stroke="#6d28d9" stroke-width="7"/>
  <path d="M250,290 L250,390" fill="none" stroke="#b45309" stroke-width="5.5"/>
  <path d="M570,290 L570,390" fill="none" stroke="#b45309" stroke-width="5.5"/>
  <line x1="258" y1="322" x2="258" y2="358" stroke="#dc2626" stroke-width="2"/>
  <line x1="562" y1="322" x2="562" y2="358" stroke="#dc2626" stroke-width="2"/>
  <line x1="253" y1="378" x2="289" y2="378" stroke="#dc2626" stroke-width="2"/>
  <line x1="531" y1="378" x2="567" y2="378" stroke="#dc2626" stroke-width="2"/>
  <rect x="220.96405" y="249.075" width="58.0719" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="261.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">VH + CDR</text>
  <rect x="540.96405" y="249.075" width="58.0719" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="570" y="261.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">VH + CDR</text>
  <text x="226" y="412" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">VL</text>
  <text x="274" y="412" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">CL</text>
  <text x="546" y="412" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">CL</text>
  <text x="594" y="412" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">VL</text>
  <text x="392" y="458" font-size="11" fill="#4c1d95" text-anchor="end" font-weight="700">CH1</text>
  <text x="392" y="500" font-size="11" fill="#4c1d95" text-anchor="end" font-weight="700">CH2 / CH3（Fc）</text>
  <line x1="396" y1="466" x2="418" y2="444" stroke="#be185d" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="429.55" y="453.5" width="40.900000000000006" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="450" y="465.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">铰链区</text>
  <text x="46" y="200" font-size="11.5" fill="#4c1d95" font-weight="700">重链 H ×2（~450 aa）</text>
  <text x="46" y="224" font-size="11.5" fill="#78350f" font-weight="700">轻链 L ×2（~220 aa，κ / λ 型）</text>
  <text x="46" y="258" font-size="10.5" fill="#475569">V 区 CDR（3 段超变环）</text>
  <text x="46" y="273" font-size="10.5" fill="#475569">构成抗原结合位点：</text>
  <text x="46" y="288" font-size="10.5" fill="#475569">VH+VL 共同形成两个相同结合位点；</text>
  <text x="46" y="303" font-size="10.5" fill="#475569">C 区决定类别与效应功能。</text>
  <text x="46" y="336" font-size="10.5" fill="#475569">木瓜蛋白酶切铰链 →</text>
  <text x="46" y="351" font-size="10.5" fill="#475569">2 Fab + 1 Fc；</text>
  <text x="46" y="366" font-size="10.5" fill="#475569">胃蛋白酶 → F(ab')₂。</text>
  <text x="46" y="384" font-size="10.5" fill="#475569">每条链由若干免疫球蛋白折叠结构域</text>
  <text x="46" y="399" font-size="10.5" fill="#475569">（β 三明治，</text>
  <text x="46" y="414" font-size="10.5" fill="#475569">两层反平行 β 片由二硫键锁定）</text>
  <text x="46" y="429" font-size="10.5" fill="#475569">串联而成。</text>
  <line x1="64" y1="448" x2="64" y2="512" stroke="#0369a1" stroke-width="5"/>
  <line x1="76" y1="456" x2="76" y2="504" stroke="#0369a1" stroke-width="5"/>
  <line x1="88" y1="448" x2="88" y2="512" stroke="#0369a1" stroke-width="5"/>
  <line x1="100" y1="456" x2="100" y2="504" stroke="#0369a1" stroke-width="5"/>
  <line x1="112" y1="448" x2="112" y2="512" stroke="#0369a1" stroke-width="5"/>
  <line x1="124" y1="456" x2="124" y2="504" stroke="#0369a1" stroke-width="5"/>
  <line x1="76" y1="472" x2="100" y2="472" stroke="#dc2626" stroke-width="1.8"/>
  <text x="94" y="532" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">β 三明治</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、五类免疫球蛋白（重链决定类别）</text>
  <rect x="726" y="190" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="781" y="217.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">类别</text>
  <rect x="836" y="190" width="518" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1095" y="217.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">特征与功能</text>
  <rect x="726" y="234" width="110" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="781" y="265.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">IgG</text>
  <rect x="836" y="234" width="518" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1095" y="265.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">血清主要抗体，唯一通过胎盘；激活补体、调理吞噬</text>
  <rect x="726" y="286" width="628" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="726" y="286" width="110" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="781" y="317.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">IgM</text>
  <rect x="836" y="286" width="518" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1095" y="317.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">五聚体（J 链连接），初次免疫应答、早期防御，激活补体最强</text>
  <rect x="726" y="338" width="110" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="781" y="369.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">IgA</text>
  <rect x="836" y="338" width="518" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1095" y="369.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">二聚体（分泌片），外分泌液（乳汁、黏膜）局部免疫</text>
  <rect x="726" y="390" width="628" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="726" y="390" width="110" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="781" y="421.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">IgD</text>
  <rect x="836" y="390" width="518" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1095" y="421.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">B 细胞膜受体</text>
  <rect x="726" y="442" width="110" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="781" y="473.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">IgE</text>
  <rect x="836" y="442" width="518" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1095" y="473.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">结合肥大细胞，介导过敏反应与抗寄生虫</text>
  <text x="726" y="500" font-size="11.5" fill="#475569">抗体多样性由 V(D)J 基因重排与体细胞超变产生，可识别 10⁸ 种以上抗原表位；</text>
  <text x="726" y="517" font-size="11.5" fill="#475569">Köhler 与 Milstein 的杂交瘤单克隆抗体技术使抗体成为诊疗核心工具。</text>
  <rect x="30" y="574" width="660" height="406" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="596.84" font-size="19" fill="#475569" font-weight="700">三、Anfinsen 实验：一级结构决定天然构象</text>
  <rect x="56" y="620" width="190" height="92" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5"/>
  <text x="151" y="646" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">天然 RNase A</text>
  <text x="151" y="670" font-size="10.5" fill="#475569" text-anchor="middle">正确折叠 · 4 个二硫键</text>
  <text x="151" y="686" font-size="10.5" fill="#475569" text-anchor="middle">有活性</text>
  <rect x="280" y="620" width="190" height="92" rx="8" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="375" y="646" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">变性去折叠</text>
  <text x="375" y="670" font-size="10.5" fill="#475569" text-anchor="middle">8 mol/L 尿素 + β-巯基乙醇</text>
  <text x="375" y="686" font-size="10.5" fill="#475569" text-anchor="middle">切断二硫键 · 失活</text>
  <rect x="504" y="620" width="190" height="92" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5"/>
  <text x="599" y="646" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">透析复性</text>
  <text x="599" y="670" font-size="10.5" fill="#475569" text-anchor="middle">去除变性剂后自发复性</text>
  <text x="599" y="686" font-size="10.5" fill="#475569" text-anchor="middle">正确重配 4 个二硫键 · 活性恢复</text>
  <line x1="250" y1="666" x2="276" y2="666" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <line x1="474" y1="666" x2="500" y2="666" stroke="#059669" stroke-width="2" marker-end="url(#arr-ok)"/>
  <text x="56" y="744" font-size="11.5" fill="#1e293b">结论：一级结构包含全部折叠信息，天然构象是热力学最稳态（折叠自由能 ΔG 仅 −20~−60 kJ/mol 的「边际稳定」）。</text>
  <text x="56" y="800" font-size="12.5" fill="#1e293b" font-weight="700">体内折叠并非完全自发——分子伴侣体系：</text>
  <text x="70" y="828" font-size="11.5" fill="#475569" font-weight="700">· Hsp70 家族</text>
  <text x="200" y="828" font-size="11.5" fill="#475569">识别暴露疏水区，阻断错误聚集</text>
  <text x="70" y="858" font-size="11.5" fill="#475569" font-weight="700">· Hsp60 / GroEL</text>
  <text x="200" y="858" font-size="11.5" fill="#475569">桶状结构提供隔离折叠环境</text>
  <text x="70" y="888" font-size="11.5" fill="#475569" font-weight="700">· PDI · PPIase</text>
  <text x="200" y="888" font-size="11.5" fill="#475569">二硫键异构酶与脯氨酰异构酶加速限速步骤</text>
  <text x="56" y="930" font-size="11.5" fill="#64748b">分子伴侣阻止错误聚集、提高折叠效率，但不改变最终构象。</text>
  <rect x="710" y="574" width="660" height="406" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="596.84" font-size="19" fill="#475569" font-weight="700">四、朊病毒：PrPᶜ → PrPˢᶜ 的模板化传播</text>
  <circle cx="800" cy="690" r="42" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <path d="M817.4050791115786,668.0668465304304 q14,10 4,26" fill="none" stroke="#059669" stroke-width="2.6"/>
  <path d="M828,690 q14,10 4,26" fill="none" stroke="#059669" stroke-width="2.6"/>
  <path d="M817.4050791115786,711.9331534695696 q14,10 4,26" fill="none" stroke="#059669" stroke-width="2.6"/>
  <text x="800" y="634" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">PrPᶜ（正常）</text>
  <text x="800" y="752" font-size="10.5" fill="#64748b" text-anchor="middle">α 螺旋丰富 · 可溶</text>
  <line x1="852" y1="690" x2="906" y2="690" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <text x="879" y="672" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">错误折叠</text>
  <rect x="922" y="646" width="90" height="88" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <line x1="936" y1="660" x2="1004" y2="660" stroke="#dc2626" stroke-width="3"/>
  <line x1="936" y1="676" x2="1004" y2="676" stroke="#dc2626" stroke-width="3"/>
  <line x1="936" y1="692" x2="1004" y2="692" stroke="#dc2626" stroke-width="3"/>
  <line x1="936" y1="708" x2="1004" y2="708" stroke="#dc2626" stroke-width="3"/>
  <line x1="936" y1="724" x2="1004" y2="724" stroke="#dc2626" stroke-width="3"/>
  <text x="967" y="634" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">PrPˢᶜ（致病）</text>
  <text x="967" y="752" font-size="10.5" fill="#64748b" text-anchor="middle">β 折叠丰富 · 不溶 · 抗蛋白酶</text>
  <path d="M1012,690 L1044,690 Q1066,690 1066,712 L1066,756 Q1066,788 1030,788 L800,788 Q744,788 744,752 L750,724" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="905" y="812" font-size="10.5" fill="#dc2626" text-anchor="middle">作为「模板」催化更多 PrPᶜ 错误折叠 → 淀粉样纤维沉积</text>
  <text x="726" y="866" font-size="11.5" fill="#475569">只有蛋白质、不含核酸的感染因子；引起库鲁病、克雅氏病（CJD）、疯牛病（BSE）、羊瘙痒症；</text>
  <text x="726" y="883" font-size="11.5" fill="#475569">Prusiner 获 1997 年诺贝尔生理学或医学奖。</text>
  <text x="726" y="930" font-size="11.5" fill="#64748b">类似的蛋白错误折叠/聚集机制亦见于阿尔茨海默病（Aβ、tau）与帕金森病（α-突触核蛋白）——统称蛋白质构象病。</text>
</svg>