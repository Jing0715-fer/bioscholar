<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">病毒学与公共卫生前沿</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">GISRS 全球监测 · 天花 1980 唯一消灭案例 · 脊灰 2/3 型已根除 · 噬菌体复兴与 T-VEC 溶瘤 · AAV 载体 · One Health 界面治理</text>
  <rect x="30" y="132" width="660" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、GISRS：全球流感监测与疫苗组分匹配</text>
  <rect x="86.7392" y="184.8" width="146.5216" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="160" y="199.32" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1952 建立 · 2011 更名</text>
  <text x="70" y="240" font-size="12.5" fill="#475569">全球毒株监测网络支撑每年两次（南/北半球）的疫苗组分推荐；</text>
  <text x="70" y="259" font-size="12.5" fill="#475569">鸡胚适应与预测滞后是 H3N2 疫苗有效性波动的主因。</text>
  <circle cx="140" cy="320" r="8" fill="#0369a1"/>
  <text x="140" y="346" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">WHO 中心</text>
  <circle cx="300" cy="335" r="8" fill="#0369a1"/>
  <text x="300" y="361" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">国家实验室</text>
  <circle cx="460" cy="320" r="8" fill="#0369a1"/>
  <text x="460" y="346" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">疫苗厂商</text>
  <circle cx="580" cy="345" r="8" fill="#0369a1"/>
  <text x="580" y="371" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">预警发布</text>
  <line x1="148" y1="320" x2="292" y2="335" stroke="#0369a1" stroke-width="1.8" opacity="0.6"/>
  <line x1="308" y1="335" x2="452" y2="320" stroke="#0369a1" stroke-width="1.8" opacity="0.6"/>
  <line x1="468" y1="320" x2="572" y2="345" stroke="#0369a1" stroke-width="1.8" opacity="0.6"/>
  <text x="360" y="372" font-size="11.5" fill="#64748b" text-anchor="middle">正向细胞与序列化制备及更广呼吸道病毒扩展</text>
  <rect x="720" y="132" width="650" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="736" y="154.84" font-size="19" fill="#475569" font-weight="700">二、控制 → 消除 → 消灭：三级递进</text>
  <rect x="760" y="426.6666666666667" width="184" height="43.333333333333336" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="774" y="450.6666666666667" font-size="15" fill="#1e293b">控制</text>
  <rect x="950" y="383.3333333333333" width="184" height="43.333333333333336" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="964" y="407.3333333333333" font-size="15" fill="#1e293b">消除</text>
  <rect x="1140" y="340" width="184" height="43.333333333333336" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1154" y="364" font-size="15" fill="#1e293b">消灭</text>
  <text x="760" y="200" font-size="13" fill="#1e293b" font-weight="600">天花（1980）：唯一被消灭的人类病原</text>
  <text x="1060" y="200" font-size="13" fill="#475569" font-weight="600">牛瘟（2011）：动物界首例</text>
  <text x="760" y="250" font-size="12.5" fill="#475569">脊灰：2 型与 3 型野生毒株分别于 2015 与 2019 年宣告根除，</text>
  <text x="760" y="269" font-size="12.5" fill="#475569">1 型残存于阿巴两国——消灭的「最后一英里」最难。</text>
  <rect x="30" y="402" width="660" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="424.84" font-size="19" fill="#475569" font-weight="700">三、耐药闭环与噬菌体治疗复兴</text>
  <text x="70" y="460" font-size="12.5" fill="#475569">耐药监测与治疗指南形成闭环：HIV 治疗前耐药超阈值推动一线方案转向多替拉韦；</text>
  <text x="70" y="479" font-size="12.5" fill="#475569">流感 H275Y 与乙肝恩替卡韦时代数据共同支撑「高屏障联合用药」原则。</text>
  <rect x="128.3" y="536.2" width="23.400000000000002" height="67.60000000000001" rx="5.8500000000000005" fill="#ccfbf1" fill-opacity="0.6" stroke="#dc2626" stroke-width="2.2"/>
  <path d="M 128.3,545.2 q 5.8500000000000005,6.552000000000001 11.700000000000001,0 q 5.8500000000000005,-6.552000000000001 11.700000000000001,0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <path d="M 128.3,551.4 q 5.8500000000000005,6.552000000000001 11.700000000000001,0 q 5.8500000000000005,-6.552000000000001 11.700000000000001,0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <path d="M 128.3,557.6 q 5.8500000000000005,6.552000000000001 11.700000000000001,0 q 5.8500000000000005,-6.552000000000001 11.700000000000001,0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <path d="M 128.3,563.8 q 5.8500000000000005,6.552000000000001 11.700000000000001,0 q 5.8500000000000005,-6.552000000000001 11.700000000000001,0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <path d="M 128.3,570.0 q 5.8500000000000005,6.552000000000001 11.700000000000001,0 q 5.8500000000000005,-6.552000000000001 11.700000000000001,0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <path d="M 128.3,576.2 q 5.8500000000000005,6.552000000000001 11.700000000000001,0 q 5.8500000000000005,-6.552000000000001 11.700000000000001,0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <path d="M 128.3,582.4 q 5.8500000000000005,6.552000000000001 11.700000000000001,0 q 5.8500000000000005,-6.552000000000001 11.700000000000001,0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <path d="M 128.3,588.6 q 5.8500000000000005,6.552000000000001 11.700000000000001,0 q 5.8500000000000005,-6.552000000000001 11.700000000000001,0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <path d="M 128.3,594.8 q 5.8500000000000005,6.552000000000001 11.700000000000001,0 q 5.8500000000000005,-6.552000000000001 11.700000000000001,0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <line x1="140" y1="527.2" x2="140" y2="612.8" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 5"/>
  <text x="140" y="635" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">噬菌体</text>
  <text x="230" y="545" font-size="12.5" fill="#475569">2016 静脉个体化噬菌体鸡尾酒与 2019 工程化分枝杆菌噬菌体成功病例 → 噬菌体治疗复兴；</text>
  <text x="230" y="564" font-size="12.5" fill="#475569">个体化定制 vs 批量监管的矛盾是规模化瓶颈。</text>
  <rect x="720" y="402" width="650" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="736" y="424.84" font-size="19" fill="#475569" font-weight="700">四、溶瘤病毒、载体治疗与 One Health</text>
  <text x="760" y="460" font-size="12.5" fill="#475569" font-weight="600">T-VEC（2015 获批）：删除毒力基因 + GM-CSF 的 HSV-1 载体实现「复制 + 免疫」的溶瘤治疗。</text>
  <text x="760" y="510" font-size="12.5" fill="#475569">AAV 与慢病毒载体支撑基因治疗——包装上限、预存抗体、剂量毒性与产能构成规模化挑战。</text>
  <circle cx="900" cy="600" r="34" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="900" y="605" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">人</text>
  <circle cx="1010" cy="600" r="34" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="1010" y="605" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">动物</text>
  <circle cx="955" cy="668" r="34" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="955" y="673" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">环境</text>
  <text x="1050" y="580" font-size="11" fill="#059669" font-weight="600">One Health：人-动物-环境界面治理统摄溢出预防、</text>
  <text x="1050" y="599" font-size="11" fill="#059669" font-weight="600">污水监测与禽流感预警——病毒学转化为公共卫生成果的制度出口。</text>
  <rect x="30" y="690" width="1340" height="48" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="720" font-size="13" fill="#475569" text-anchor="middle" font-weight="600">从实验室到全球治理：监测网络（GISRS）× 分级目标（消灭/消除/控制）× 耐药闭环 × 新疗法（噬菌体/溶瘤/载体）× One Health 制度出口</text>
</svg>