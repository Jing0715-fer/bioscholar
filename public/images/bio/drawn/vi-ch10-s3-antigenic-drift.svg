  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">抗原漂移与免疫逃逸：表位、糖盾与呈递封锁</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">HA 年积 1%–2% 替换、集群每二至八年跃迁；糖盾遮蔽表位；TAP 封堵／MHC I 降解／HLA 下调三线封锁；免疫印记（Francis 1953）</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、流感 HA：漂移的靶点与抗原图谱</text>
  <text x="46" y="190" font-size="11" fill="#475569">A 型流感 H3N2 的 HA 每年积累约 1%–2% 氨基酸替换，</text>
  <text x="46" y="206" font-size="11" fill="#475569">集中于头部围绕受体结合部位的五个主要抗体表位。</text>
