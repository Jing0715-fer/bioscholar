  <line x1="530" y1="380" x2="562" y2="336" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <text x="510" y="296" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">抗原集群跃迁</text>
  <text x="510" y="312" font-size="9.5" fill="#64748b" text-anchor="middle">每二至八年一次</text>
  <text x="46" y="486" font-size="10.5" fill="#475569">抗原图谱把数十年血凝抑制数据投成二维地图：H3N2 的抗原演化并非匀速漂移，而是集群间跃迁；</text>
  <text x="46" y="501" font-size="10.5" fill="#475569">鸡胚适应突变曾致 2014–2015 季节疫苗有效性跌至两成上下。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、糖盾：把表位藏进糖链之间</text>
  <text x="866" y="196" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">1918 H1N1：糖链寥寥</text>
