  <circle cx="1135" cy="294" r="3.4" fill="#0369a1"/>
  <path d="M 1130,352 l -8,20 M 1130,352 l 8,20 M 1130,352 l 0,24" fill="none" stroke="#be185d" stroke-width="2.6"/>
  <text x="1130" y="396" font-size="9.5" fill="#831843" text-anchor="middle">抗体只能打「糖链之间可及的角落」</text>
  <text x="866" y="340" font-size="9.5" fill="#475569" text-anchor="middle">糖链如盾牌遮蔽蛋白表位，</text>
  <text x="866" y="356" font-size="9.5" fill="#475569" text-anchor="middle">抗原则转向可及角落继续漂移</text>
  <text x="726" y="424" font-size="10.5" fill="#475569">HIV gp120：高变区加约半表面积的糖链覆盖，使中和应答快速逃逸；广谱中和抗体靶向 CD4 结合位点、</text>
  <text x="726" y="439" font-size="10.5" fill="#475569">V3/V1V2 聚糖与 MPER 等保守表位——但其发育需体细胞超突变两至三成，极难经疫苗诱导。</text>
  <rect x="802.7025" y="491.075" width="154.595" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="880" y="503.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">广谱中和抗体：稀有的天然解</text>
  <rect x="1051.8875" y="491.075" width="176.225" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1140" y="503.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">糖盾＋高变区：疫苗诱导的双屏障</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、T 细胞免疫逃逸：抗原呈递的三条封锁线</text>
  <rect x="50" y="686" width="140" height="58" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="120" y="710" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">蛋白酶体</text>
  <text x="120" y="730" font-size="9.5" fill="#64748b" text-anchor="middle">切割产生肽</text>
  <line x1="192" y1="715" x2="208" y2="715" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="210" y="686" width="140" height="58" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="280" y="710" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">TAP 转运</text>
  <text x="280" y="730" font-size="9.5" fill="#64748b" text-anchor="middle">肽入内质网</text>
  <line x1="352" y1="715" x2="368" y2="715" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="370" y="686" width="140" height="58" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="440" y="710" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">MHC I 装载</text>
  <text x="440" y="730" font-size="9.5" fill="#64748b" text-anchor="middle">内质网组装</text>
  <line x1="512" y1="715" x2="528" y2="715" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="530" y="686" width="140" height="58" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="600" y="710" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">表面呈递</text>
  <text x="600" y="730" font-size="9.5" fill="#64748b" text-anchor="middle">CD8 T 细胞识别</text>
  <line x1="210" y1="668" x2="210" y2="682" stroke="#dc2626" stroke-width="2.6"/>
  <text x="210" y="662" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">✕</text>
  <rect x="178.1676" y="765.925" width="63.6648" height="16.15" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="777.42" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">HSV ICP47</text>
  <text x="210" y="800" font-size="9.5" fill="#475569" text-anchor="middle">封堵 TAP</text>
  <line x1="370" y1="668" x2="370" y2="682" stroke="#dc2626" stroke-width="2.6"/>
  <text x="370" y="662" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">✕</text>
  <rect x="319.86965" y="765.925" width="100.2607" height="16.15" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="370" y="777.42" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">CMV US2/US3/US11</text>
  <text x="370" y="800" font-size="9.5" fill="#475569" text-anchor="middle">降解 MHC I</text>
  <line x1="530" y1="668" x2="530" y2="682" stroke="#dc2626" stroke-width="2.6"/>
  <text x="530" y="662" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">✕</text>
  <rect x="505.2128" y="765.925" width="49.5744" height="16.15" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="530" y="777.42" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">HIV Nef</text>
  <text x="530" y="800" font-size="9.5" fill="#475569" text-anchor="middle">选择性下调 HLA-A/B</text>
  <text x="50" y="840" font-size="10.5" fill="#475569">表位突变与抗原呈递下调是 T 细胞逃逸的两大利器——病毒把「山不就我」变成「拆路断桥」。</text>
  <text x="50" y="878" font-size="10.5" fill="#64748b">CTL 杀伤受限于 HLA 呈递：Nef 只下调 HLA-A/B 而保留 HLA-C/E，NK 细胞的「自我」信号不被惊动——逃逸与防误伤并行。</text>
  <rect x="710" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="608.84" font-size="19" fill="#475569" font-weight="700">四、漂移与转变对照＋免疫印记</text>
  <rect x="730" y="652" width="120" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="679.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">比较项目</text>
  <rect x="850" y="652" width="240" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="679.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">抗原漂移（drift）</text>
  <rect x="1090" y="652" width="240" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1210" y="679.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">抗原转变（shift）</text>
  <rect x="730" y="696" width="120" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="722.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">机制</text>
  <rect x="850" y="696" width="240" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="722.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">点突变的渐进积累</text>
  <rect x="1090" y="696" width="240" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1210" y="722.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">节段重排的亚型跃迁</text>
  <rect x="730" y="738" width="600" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="738" width="120" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="764.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">幅度</text>
  <rect x="850" y="738" width="240" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="764.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">抗原性小步微调</text>
  <rect x="1090" y="738" width="240" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1210" y="764.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">亚型替换、可致大流行</text>
  <rect x="730" y="780" width="120" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="806.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">频率</text>
  <rect x="850" y="780" width="240" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="806.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">持续发生（年积约 1%–2%）</text>
  <rect x="1090" y="780" width="240" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
