  <text x="160" y="470" font-size="9.5" fill="#64748b" text-anchor="middle">茎部高度保守，头部承压漂移</text>
  <text x="505" y="250" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">抗原图谱（Smith 等 2004）</text>
