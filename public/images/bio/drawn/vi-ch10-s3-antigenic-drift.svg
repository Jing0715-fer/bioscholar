  <circle cx="907" cy="242" r="3.4" fill="#0369a1"/>
  <text x="1130" y="196" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">现代季节性毒株：增设数处</text>
  <ellipse cx="1130" cy="262" rx="52" ry="38" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <line x1="1082" y1="244" x2="1082" y2="232" stroke="#0369a1" stroke-width="2"/>
