  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">从矿物形态学到晶体几何学：夹角、指数与对称分类</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">1669晶面角守恒（石英柱面间120°，歪斜不改变夹角）；1784有理指数定律（截距2a、3b、6c得(321)）；32晶类、14布拉维格子、230空间群先于原子实证穷举完毕；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">偏光显微镜以双折射鉴定晶系</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、晶面角守恒定律（1669，斯坦诺）</text>
  <text x="60" y="196" font-size="10.5" fill="#475569">测量取代描述：</text>
  <text x="60" y="211" font-size="10.5" fill="#475569">斯坦诺以酸溶蚀与溶液培养实验推断晶体「逐层添加」生长；</text>
  <text x="60" y="226" font-size="10.5" fill="#475569">接触式与反射式测角仪成为十九世纪矿物学实验室的标准装备，</text>
  <text x="60" y="241" font-size="10.5" fill="#475569">数以万计的夹角数据记录成册。</text>
  <polygon points="164.20428331024323,290.32 128.4085666204864,268 128.4085666204864,442 164.20428331024323,464.32" fill="#e0f2fe" stroke="#475569" stroke-width="1.4"/>
