  <text x="530" y="178" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">理想横截面（垂直 c 轴）</text>
  <polygon points="533.8196907134314,515.52 448.46422691643716,367.68 460.1036083433,347.52 611.4155668925171,347.52 617.2352576059486,357.6 526.0601030955229,515.52" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="2"/>
