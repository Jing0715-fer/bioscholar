  <text x="1172" y="320" font-size="13" fill="#075985" text-anchor="middle" font-weight="700" font-style="italic">b</text>
  <line x1="1070" y1="418.6" x2="1086.6" y2="504.3" stroke="#be185d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="1140.5" y1="327.1" x2="1171.4" y2="487.2" stroke="#be185d" stroke-width="2.4"/>
  <circle cx="1168" cy="470" r="4.6" fill="#be185d" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="1146" cy="355.7" r="4.6" fill="#be185d" stroke="#ffffff" stroke-width="1.2"/>
  <text x="1180" y="494" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">2a</text>
  <text x="1124" y="346" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">3b</text>
  <text x="1218" y="402" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">晶面（虚线为平行面族）</text>
  <text x="730" y="512" font-size="10.5" fill="#475569">截距之比皆为有理数：二维截距 2a、3b 取倒数 1/2、1/3 化为整数比 3:2；三维例截距 2a、3b、6c 得 (321)。</text>
  <text x="730" y="526.5" font-size="10.5" fill="#475569">Miller 1839 年规范化的指数记号由此奠基（第 2 章）。</text>
  <rect x="30" y="558" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="580.84" font-size="19" fill="#475569" font-weight="700">三、点阵、晶类与空间群：纯几何的完备分类（1830–1894）</text>
  <text x="60" y="606" font-size="10.5" fill="#475569">十九世纪纯几何推导把晶体对称分类穷举完毕——在不知道任何原子实体的年代完成，堪称「理论先行」的典范。</text>
  <line x1="70" y1="690" x2="650" y2="690" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
