  <text x="186" y="760" font-size="12" fill="#64748b" text-anchor="middle">阿羽依·积木与有理指数</text>
  <circle cx="290.4" cy="690" r="6.5" fill="#0f766e"/>
  <line x1="290.4" y1="681" x2="290.4" y2="660" stroke="#0f766e" stroke-width="1.7"/>
  <text x="290.4" y="640" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1830</text>
  <text x="290.4" y="620" font-size="12" fill="#64748b" text-anchor="middle">赫塞尔·32 种晶类</text>
  <circle cx="389" cy="690" r="6.5" fill="#0369a1"/>
  <line x1="389" y1="699" x2="389" y2="720" stroke="#0369a1" stroke-width="1.7"/>
  <text x="389" y="740" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1850</text>
  <text x="389" y="760" font-size="12" fill="#64748b" text-anchor="middle">布拉维·14 种格子</text>
  <circle cx="487.59999999999997" cy="690" r="6.5" fill="#0f766e"/>
  <line x1="487.59999999999997" y1="681" x2="487.59999999999997" y2="660" stroke="#0f766e" stroke-width="1.7"/>
  <text x="487.59999999999997" y="640" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1879</text>
  <text x="487.59999999999997" y="620" font-size="12" fill="#64748b" text-anchor="middle">索恩克·65 个 Sohncke 群</text>
  <circle cx="592" cy="690" r="6.5" fill="#dc2626"/>
  <line x1="592" y1="699" x2="592" y2="720" stroke="#dc2626" stroke-width="1.7"/>
  <text x="592" y="740" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1890–94</text>
  <text x="592" y="760" font-size="12" fill="#64748b" text-anchor="middle">舍恩夫利斯等·230 空间群</text>
  <rect x="244.12" y="801.8" width="221.76" height="20.4" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="355" y="816.32" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">空间群＝点群对称操作＋平移周期性</text>
  <rect x="68.895" y="853.375" width="142.21" height="21.25" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="140" y="868.5" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">32 种晶类（点群）</text>
  <rect x="290.3325" y="853.375" width="129.335" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="355" y="868.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">14 种布拉维格子</text>
  <rect x="509.21625" y="853.375" width="111.5675" height="21.25" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="565" y="868.5" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="700">230 种空间群</text>
  <text x="60" y="916" font-size="10.5" fill="#64748b">后世X射线测定的数千种晶体，无一跳出 230 种空间群之外；由 L-氨基酸构成的手性生物分子只能栖身 65 个 Sohncke 群</text>
  <text x="60" y="930.5" font-size="10.5" fill="#64748b">（第 2 章）。</text>
  <rect x="710" y="558" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="580.84" font-size="19" fill="#475569" font-weight="700">四、光学晶体学：偏光显微镜下的各向异性</text>
  <polygon points="850,635 990,660 970,770 830,745" fill="#fef3c7" fill-opacity="0.55" stroke="#d97706" stroke-width="2.2"/>
  <text x="908" y="700" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="700">方解石</text>
  <line x1="748" y1="692" x2="838" y2="690" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="840" y1="690" x2="1028" y2="690" stroke="#0369a1" stroke-width="2.4" marker-end="url(#arr-acc)"/>
  <line x1="840" y1="690" x2="958" y2="778" stroke="#be185d" stroke-width="2.4" marker-end="url(#arr-enz)"/>
  <text x="1032" y="672" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">寻常光 o</text>
  <text x="1000" y="796" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">非常光 e</text>
  <text x="730" y="826" font-size="10.5" fill="#475569">1669 年巴尔托林：一束入射光分解为两束——折射率随方向而变</text>
  <text x="730" y="840.5" font-size="10.5" fill="#475569">（各向异性），正是内部周期有序的光学表现。</text>
