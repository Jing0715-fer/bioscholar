  <text x="96" y="356" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700" font-style="italic">c</text>
  <text x="200" y="470" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">石英六棱柱（理想外形）</text>
  <text x="60" y="496" font-size="10.5" fill="#475569">无论个头大小、外形如何「歪斜」，</text>
  <text x="60" y="510.5" font-size="10.5" fill="#475569">同一矿物对应晶面间夹角恒定：</text>
  <text x="60" y="525" font-size="10.5" fill="#475569">石英相邻柱面间总为 120°，</text>
  <text x="60" y="539.5" font-size="10.5" fill="#475569">柱面与锥面间亦各有定值。</text>
  <polygon points="497.66838492538096,300 465.3367698507619,244.00000000000003 497.66838492538096,188 562.331615074619,188 594.6632301492381,243.99999999999997 562.3316150746191,300" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="2"/>
