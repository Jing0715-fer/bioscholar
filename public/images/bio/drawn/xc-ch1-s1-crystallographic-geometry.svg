  <text x="87.4" y="620" font-size="12" fill="#64748b" text-anchor="middle">斯坦诺·晶面角守恒</text>
  <circle cx="186" cy="690" r="6.5" fill="#0369a1"/>
  <line x1="186" y1="699" x2="186" y2="720" stroke="#0369a1" stroke-width="1.7"/>
