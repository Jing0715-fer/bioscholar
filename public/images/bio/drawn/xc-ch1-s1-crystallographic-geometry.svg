  <polygon points="164.20428331024323,290.32 128.4085666204864,268 164.20428331024317,245.68 235.79571668975677,245.68 271.5914333795136,268 235.7957166897568,290.32" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
