  <text x="481.10360834330004" y="387.8930669589464" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">120°</text>
  <polyline points="538.0601030955229,494.73539030917345 540.1669491505422,496.10359213500124 542.1192376481355,497.6845241885425 543.8955789069804,499.4608654473874 545.4765109605216,501.41315394498065 546.8447127863494,503.52 547.9851940789454,505.75832056618077 548.8854594866066,508.10359213500124 549.5356455131342,510.53011942037375 549.9286285843615,513.0113168815762 550.0601030955229,515.52" fill="none" stroke="#dc2626" stroke-width="1.7"/>
  <text x="562.4331700544693" y="498.52" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">120°</text>
  <text x="528" y="530" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">歪斜横截面：各面平行内移，夹角不变</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、解理「积木」与有理指数定律（1784，阿羽依）</text>
  <text x="730" y="186" font-size="10.5" fill="#475569">观察方解石解理：大小不一的碎块仍保持同样的菱面体外形与解理性；晶体可沿解理面一路劈分，</text>
  <text x="730" y="201" font-size="10.5" fill="#475569">整个晶体是小积木在三维空间的密堆砌。</text>
