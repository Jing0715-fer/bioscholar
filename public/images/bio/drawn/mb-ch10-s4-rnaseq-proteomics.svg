    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">转录组学与蛋白质组学</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">RNA-seq（TPM 定量 · 负二项差异检验）与 2D 电泳 / LC-MS/MS（b / y 离子 · SILAC / iTRAQ）——相关性 0.4–0.6 的互补拼接</text>
  <rect x="30" y="132" width="700" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、转录组学：RNA-seq 定量全转录本</text>
  <rect x="46" y="176" width="120" height="100" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="106" y="198" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">总 RNA 提取</text>
  <text x="106" y="218" font-size="10.5" fill="#475569" text-anchor="middle">样品总 RNA</text>
  <line x1="168" y1="226" x2="176" y2="226" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <rect x="180" y="176" width="120" height="100" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="240" y="198" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">富集 / 去除</text>
  <text x="240" y="218" font-size="10.5" fill="#475569" text-anchor="middle">poly(A) 富集或 rRNA 去除</text>
  <line x1="302" y1="226" x2="310" y2="226" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <rect x="314" y="176" width="120" height="100" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="374" y="198" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">片段化 + RT</text>
  <text x="374" y="218" font-size="10.5" fill="#475569" text-anchor="middle">片段化 → 反转录 cDNA 文库</text>
  <line x1="436" y1="226" x2="444" y2="226" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <rect x="448" y="176" width="120" height="100" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="508" y="198" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">NGS 测序</text>
  <text x="508" y="218" font-size="10.5" fill="#475569" text-anchor="middle">高通量读段产出</text>
  <line x1="570" y1="226" x2="578" y2="226" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <rect x="582" y="176" width="120" height="100" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="642" y="198" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">回贴 / 定量</text>
  <text x="642" y="218" font-size="10.5" fill="#475569" text-anchor="middle">读段回贴基因组或转录本 → 定量</text>
  <rect x="46" y="296" width="330" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="60" y="318" font-size="13" fill="#1e293b" font-weight="700">定量指标</text>
  <text x="60" y="342" font-size="11" fill="#475569">RPKM / FPKM：每百万读段中每 kb 外显子的片段数</text>
  <text x="60" y="362" font-size="11" fill="#475569">TPM：转模标准化——先按基因长度归一（r/长度），</text>
  <text x="60" y="378" font-size="11" fill="#475569">再按总量归一；跨样本比较更适合</text>
  <rect x="390" y="296" width="324" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="404" y="318" font-size="13" fill="#1e293b" font-weight="700">差异表达分析</text>
  <text x="404" y="342" font-size="11" fill="#475569">DESeq2 / edgeR：负二项分布模型</text>
  <text x="404" y="362" font-size="11" fill="#475569">报告 log2FC 与 FDR 校正 P 值</text>
  <rect x="46" y="404" width="668" height="88" rx="8" fill="#fef3c7" fill-opacity="0.4" stroke="#b45309" stroke-width="1.3"/>
  <text x="60" y="428" font-size="12.5" fill="#78350f" font-weight="700">RNA-seq 还能发现：</text>
  <text x="60" y="452" font-size="11.5" fill="#475569">新转录本与 lncRNA · 选择性剪接事件（rMATS 等）· 融合基因（肿瘤诊断）· 等位特异性表达 · RNA 编辑位点</text>
  <rect x="730" y="132" width="640" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="746" y="154.84" font-size="19" fill="#475569" font-weight="700">二、蛋白质组学：翻译后现实</text>
  <text x="746" y="180" font-size="12.5" fill="#1e293b" font-weight="700">二维电泳（2D-PAGE）</text>
  <line x1="770" y1="300" x2="1010" y2="300" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="770" y1="300" x2="770" y2="194" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <circle cx="790" cy="280" r="4.5" fill="#6d28d9" opacity="0.55"/>
  <circle cx="810" cy="265" r="3.5" fill="#6d28d9" opacity="0.55"/>
