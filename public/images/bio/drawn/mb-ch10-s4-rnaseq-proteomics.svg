  <circle cx="855" cy="225" r="4.5" fill="#6d28d9" opacity="0.55"/>
  <circle cx="880" cy="205" r="3.5" fill="#6d28d9" opacity="0.55"/>
  <circle cx="915" cy="215" r="3.5" fill="#6d28d9" opacity="0.55"/>
  <circle cx="945" cy="200" r="4.5" fill="#6d28d9" opacity="0.55"/>
  <circle cx="965" cy="210" r="3.5" fill="#6d28d9" opacity="0.55"/>
  <circle cx="840" cy="290" r="3.5" fill="#6d28d9" opacity="0.55"/>
  <circle cx="880" cy="282" r="4.5" fill="#6d28d9" opacity="0.55"/>
  <circle cx="925" cy="272" r="3.5" fill="#6d28d9" opacity="0.55"/>
  <circle cx="960" cy="285" r="3.5" fill="#6d28d9" opacity="0.55"/>
  <text x="746" y="194" font-size="10.5" fill="#64748b">第一向：pI ↑</text>
  <text x="890" y="318" font-size="10.5" fill="#64748b" text-anchor="middle">第二向：SDS-PAGE（分子量）→</text>
  <text x="890" y="336" font-size="10.5" fill="#64748b" text-anchor="middle">复杂蛋白混合物铺展为千余点阵</text>
  <text x="1030" y="180" font-size="12.5" fill="#1e293b" font-weight="700">LC-MS/MS 鉴定</text>
  <rect x="1030" y="192" width="324" height="24" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.3"/>
  <text x="1192" y="208" font-size="10.5" fill="#475569" text-anchor="middle">胰蛋白酶酶解 → 肽段</text>
  <line x1="1192" y1="217" x2="1192" y2="219" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-pro)"/>
  <rect x="1030" y="220" width="324" height="24" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.3"/>
  <text x="1192" y="236" font-size="10.5" fill="#475569" text-anchor="middle">一级 MS：测定肽段质量</text>
  <line x1="1192" y1="245" x2="1192" y2="247" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-pro)"/>
  <rect x="1030" y="248" width="324" height="24" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.3"/>
  <text x="1192" y="264" font-size="10.5" fill="#475569" text-anchor="middle">二级 MS/MS：CID / HCD 碎裂 → b / y 离子</text>
  <line x1="1192" y1="273" x2="1192" y2="275" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-pro)"/>
  <rect x="1030" y="276" width="324" height="24" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.3"/>
  <text x="1192" y="292" font-size="10.5" fill="#475569" text-anchor="middle">数据库检索匹配蛋白</text>
  <text x="1192" y="316" font-size="10.5" fill="#64748b" text-anchor="middle">ESI 电喷雾 · MALDI 离子化（2002 诺贝尔化学奖）</text>
  <rect x="746" y="348" width="608" height="144" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="760" y="370" font-size="13" fill="#1e293b" font-weight="700">定量与修饰蛋白质组</text>
  <text x="760" y="394" font-size="11.5" fill="#475569">标记定量：SILAC（代谢掺入重标氨基酸）· iTRAQ / TMT（同重标签报告离子）</text>
  <text x="760" y="416" font-size="11.5" fill="#475569">无标记定量（label-free）：谱计数 / 峰面积</text>
  <text x="760" y="438" font-size="11.5" fill="#475569">修饰组学：TiO₂ / IMAC 富集磷酸肽 → 磷酸化网络；乙酰化 · 泛素化同理</text>
  <text x="760" y="460" font-size="11.5" fill="#475569">互作组：亲和纯化-质谱（AP-MS）绘制蛋白复合物图谱</text>
  <rect x="30" y="532" width="1340" height="428" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="554.84" font-size="19" fill="#475569" font-weight="700">三、转录组 vs 蛋白质组：相关性有限，必须互补</text>
  <text x="56" y="574" font-size="13.5" fill="#1e293b" font-weight="700">mRNA-蛋白相关性有限</text>
  <line x1="80" y1="792" x2="80" y2="596" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="80" y1="792" x2="400" y2="792" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="56" y="592" font-size="10.5" fill="#475569">蛋白丰度 ↑</text>
  <text x="240" y="814" font-size="10.5" fill="#475569" text-anchor="middle">mRNA 丰度 →</text>
  <line x1="100" y1="762" x2="372" y2="588" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="110" cy="750" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="140" cy="720" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="160" cy="740" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="180" cy="690" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="200" cy="710" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="220" cy="660" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="240" cy="690" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="260" cy="640" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="280" cy="670" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="300" cy="620" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="320" cy="660" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="340" cy="600" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="200" cy="762" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="260" cy="722" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="320" cy="700" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <circle cx="360" cy="640" r="5" fill="#0369a1" stroke="#075985" stroke-width="1" opacity="0.6"/>
  <text x="334" y="662" font-size="13.5" fill="#134e4a" font-weight="700">r ≈ 0.4–0.6</text>
  <rect x="440" y="590" width="500" height="42" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="616" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">项目</text>
  <text x="665" y="616" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">RNA-seq</text>
  <text x="845" y="616" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">蛋白质组</text>
  <rect x="440" y="636" width="500" height="42" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="662" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">测量对象</text>
  <text x="665" y="662" font-size="11.5" fill="#78350f" text-anchor="middle">mRNA 丰度</text>
  <text x="845" y="662" font-size="11.5" fill="#4c1d95" text-anchor="middle">蛋白丰度 / 修饰 / 互作</text>
  <rect x="440" y="682" width="500" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="708" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">动态范围</text>
  <text x="665" y="708" font-size="11.5" fill="#78350f" text-anchor="middle">极宽</text>
  <text x="845" y="708" font-size="11.5" fill="#4c1d95" text-anchor="middle">受检测限约束</text>
  <rect x="440" y="728" width="500" height="42" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="754" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">定量模型</text>
  <text x="665" y="754" font-size="11.5" fill="#78350f" text-anchor="middle">读段计数统计</text>
  <text x="845" y="754" font-size="11.5" fill="#4c1d95" text-anchor="middle">峰面积 / 同位素比</text>
  <rect x="440" y="774" width="500" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="800" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">与表型的距离</text>
  <text x="665" y="800" font-size="11.5" fill="#78350f" text-anchor="middle">间接（受翻译调控）</text>
  <text x="845" y="800" font-size="11.5" fill="#4c1d95" text-anchor="middle">直接</text>
  <rect x="970" y="570" width="380" height="232" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="986" y="598" font-size="14" fill="#1e293b" font-weight="700">为什么必须互补？</text>
  <text x="986" y="624" font-size="11.5" fill="#475569">翻译效率 · 降解 · 修饰的解释力必须由蛋白质组补齐——mRNA 丰度无法替代「翻译后现实」。</text>
  <rect x="1000" y="690" width="150" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="1075" y="730" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">RNA-seq</text>
  <circle cx="1150" cy="725" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <rect x="1162" y="690" width="150" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1237" y="730" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">蛋白质组</text>
  <text x="1160" y="780" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">互补拼接 → 逼近「细胞状态」</text>
  <rect x="46" y="830" width="1292" height="104" rx="10" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.3"/>
  <text x="692" y="862" font-size="13" fill="#075985" text-anchor="middle">mRNA 与蛋白相关性通常仅 0.4–0.6——翻译效率、降解与修饰的解释力必须由蛋白质组补齐；</text>
  <text x="692" y="892" font-size="13" fill="#075985" text-anchor="middle" font-weight="600">两套组学互补拼接，才能逼近「细胞状态」的完整描述。</text>
</svg>