  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">消化腺分泌与小肠吸收：从胃酸泵到微绒毛</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">M<tspan dy="4.2" font-size="13.7">3</tspan><tspan dy="-4.2">/CCK</tspan><tspan dy="4.2" font-size="13.7">B</tspan><tspan dy="-4.2">/H</tspan><tspan dy="4.2" font-size="13.7">2</tspan><tspan dy="-4.2"> 三受体协同驱动 H</tspan><tspan dy="-6.5" font-size="13.7">+</tspan><tspan dy="6.5">/K</tspan><tspan dy="-6.5" font-size="13.7">+</tspan><tspan dy="6.5">-ATPase 泵酸；皱襞×绒毛×微绒毛使吸收面积约扩 600 倍；胆盐 94% 经回肠回收入门静脉再利用</tspan></text>
  <rect x="30" y="132" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
