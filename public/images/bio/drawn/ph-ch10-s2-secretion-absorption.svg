  <rect x="961.0594" y="735.65" width="147.8812" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1035" y="748.96" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">糖·氨基酸·脂质（主战场）</text>
  <line x1="1035" y1="733" x2="1035" y2="697" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="1320" y="738" font-size="11" fill="#475569" text-anchor="middle">水·Na<tspan dy="-3.7" font-size="7.9">+</tspan></text>
  <text x="1320" y="758" font-size="11" fill="#475569" text-anchor="middle">短链脂肪酸</text>
  <line x1="1320" y1="726" x2="1320" y2="697" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="730" y="800" font-size="12" fill="#475569">专属部位的代价：切除回肠（克罗恩病等）→ B<tspan dy="2.6" font-size="8.6">12</tspan><tspan dy="-2.6"> 缺乏致巨幼细胞贫血、胆盐流失致脂肪泻与胆结石风险；</tspan></text>
  <text x="730" y="819" font-size="12" fill="#475569">铁的吸收集中于十二指肠——酸性环境维持 Fe<tspan dy="-4.1" font-size="8.6">2+</tspan><tspan dy="4.1"> 溶解、DMT1 转运。</tspan></text>
  <text x="730" y="855" font-size="12" fill="#475569">水量账本：每日消化液约 7–8 L 加摄水约 2 L，小肠回收约 8.5 L，结肠再吸收约 0.9 L，</text>
  <text x="730" y="874" font-size="12" fill="#475569">终粪仅约 0.1–0.2 L——分泌与吸收的巨大流转是腹泻脱水风险的根源。</text>
  <rect x="928.977188" y="925.65" width="222.045624" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1040" y="938.96" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">B<tspan dy="2.4" font-size="7.9">12</tspan><tspan dy="-2.4"> 必须与内因子结合才能在回肠被吸收</tspan></text>
</svg>