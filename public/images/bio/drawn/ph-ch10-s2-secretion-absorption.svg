  <text x="730" y="468" font-size="12" fill="#475569">两激素协同：促胰液素偏「量」（水与 HCO<tspan dy="2.6" font-size="8.6">3</tspan><tspan dy="-6.7" font-size="8.6">-</tspan><tspan dy="4.1">），CCK 偏「酶」（酶原），彼此相互增强；</tspan></text>
  <text x="730" y="487" font-size="12" fill="#475569">加上迷走 ACh/GRP 的头-胃期反射，共同构成胰液分泌的三期调节。</text>
  <rect x="30" y="546" width="660" height="439" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
