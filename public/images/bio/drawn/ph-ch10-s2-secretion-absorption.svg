  <text x="320" y="330" font-size="13" fill="#475569" text-anchor="middle" font-weight="600">CO<tspan dy="2.9" font-size="9.4">2</tspan><tspan dy="-2.9"> + H</tspan><tspan dy="2.9" font-size="9.4">2</tspan><tspan dy="-2.9">O —碳酸酐酶→ H</tspan><tspan dy="-4.4" font-size="9.4">+</tspan><tspan dy="4.4"> + HCO</tspan><tspan dy="2.9" font-size="9.4">3</tspan><tspan dy="-7.3" font-size="9.4">-</tspan></text>
  <line x1="510" y1="330" x2="546" y2="330" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
