    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">肌球蛋白 II 与肌肉收缩：滑动丝学说与摆动横桥循环</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">肌节静息 ~2.2 μm（粗丝 ~1.6 μm）；Lymn–Taylor 循环：ADP·Pi 待发 → Ca²⁺ 暴露位点结合 → 杠杆臂摆 5–10 nm（力 3–5 pN）→ ATP 再武装；整肌最大比张力 ≈ 0.3 MPa</text>
  <rect x="30" y="132" width="1340" height="268" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、肌节与滑动丝学说（1954）：粗丝细丝长度不变，细丝向 M 线滑入</text>
  <rect x="146" y="195" width="8" height="120" rx="2" fill="#475569"/>
  <rect x="1246" y="195" width="8" height="120" rx="2" fill="#475569"/>
  <text x="150" y="186" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Z 盘</text>
  <text x="1250" y="186" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Z 盘</text>
  <line x1="154" y1="212" x2="660" y2="212" stroke="#dc2626" stroke-width="3"/>
  <line x1="154" y1="298" x2="660" y2="298" stroke="#dc2626" stroke-width="3"/>
  <line x1="740" y1="212" x2="1246" y2="212" stroke="#dc2626" stroke-width="3"/>
  <line x1="740" y1="298" x2="1246" y2="298" stroke="#dc2626" stroke-width="3"/>
  <rect x="430" y="236" width="540" height="28" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="700" y="254" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">myosin II 双极粗丝（长 ~1.6 μm）</text>
  <line x1="450" y1="236" x2="460" y2="222" stroke="#6d28d9" stroke-width="2"/>
  <line x1="450" y1="264" x2="460" y2="278" stroke="#6d28d9" stroke-width="2"/>
