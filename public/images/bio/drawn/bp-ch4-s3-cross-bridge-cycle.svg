  <line x1="550" y1="236" x2="560" y2="222" stroke="#6d28d9" stroke-width="2"/>
  <line x1="550" y1="264" x2="560" y2="278" stroke="#6d28d9" stroke-width="2"/>
  <line x1="600" y1="236" x2="610" y2="222" stroke="#6d28d9" stroke-width="2"/>
  <line x1="600" y1="264" x2="610" y2="278" stroke="#6d28d9" stroke-width="2"/>
  <line x1="650" y1="236" x2="660" y2="222" stroke="#6d28d9" stroke-width="2"/>
  <line x1="650" y1="264" x2="660" y2="278" stroke="#6d28d9" stroke-width="2"/>
  <line x1="750" y1="236" x2="760" y2="222" stroke="#6d28d9" stroke-width="2"/>
  <line x1="750" y1="264" x2="760" y2="278" stroke="#6d28d9" stroke-width="2"/>
  <line x1="800" y1="236" x2="810" y2="222" stroke="#6d28d9" stroke-width="2"/>
  <line x1="800" y1="264" x2="810" y2="278" stroke="#6d28d9" stroke-width="2"/>
  <line x1="850" y1="236" x2="860" y2="222" stroke="#6d28d9" stroke-width="2"/>
  <line x1="850" y1="264" x2="860" y2="278" stroke="#6d28d9" stroke-width="2"/>
  <line x1="900" y1="236" x2="910" y2="222" stroke="#6d28d9" stroke-width="2"/>
  <line x1="900" y1="264" x2="910" y2="278" stroke="#6d28d9" stroke-width="2"/>
  <line x1="950" y1="236" x2="960" y2="222" stroke="#6d28d9" stroke-width="2"/>
  <line x1="950" y1="264" x2="960" y2="278" stroke="#6d28d9" stroke-width="2"/>
  <line x1="700" y1="226" x2="700" y2="274" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="700" y="222" font-size="9.5" fill="#64748b" text-anchor="middle">M 线</text>
  <line x1="240" y1="322" x2="330" y2="322" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <line x1="1160" y1="322" x2="1070" y2="322" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <text x="700" y="326" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">收缩：细丝向 M 线滑入</text>
  <path d="M 152,357 Q 152,348 161,348 M 421,348 Q 430,348 430,357" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="161" y1="348" x2="421" y2="348" stroke="#64748b" stroke-width="1.7"/>
  <text x="291" y="372" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">I 带（仅细丝）</text>
  <path d="M 430,357 Q 430,348 439,348 M 961,348 Q 970,348 970,357" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="439" y1="348" x2="961" y2="348" stroke="#64748b" stroke-width="1.7"/>
  <text x="700" y="372" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">A 带（粗丝 + 重叠）</text>
  <path d="M 970,357 Q 970,348 979,348 M 1239,348 Q 1248,348 1248,357" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="979" y1="348" x2="1239" y2="348" stroke="#64748b" stroke-width="1.7"/>
  <text x="1109" y="372" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">I 带</text>
  <line x1="150" y1="388" x2="1250" y2="388" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="700" y="382" font-size="10" fill="#64748b" text-anchor="middle">静息肌节长 ~2.2 μm</text>
  <rect x="880" y="167.59" width="11.55" height="8.82" rx="3" fill="#6d28d9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="899.55" y="175.78" font-size="10.5" fill="#475569">粗丝（myosin II）</text>
  <rect x="1006.59" y="167.59" width="11.55" height="8.82" rx="3" fill="#dc2626" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1026.1399999999999" y="175.78" font-size="10.5" fill="#475569">细丝（肌动蛋白 + 原肌球蛋白 + 肌钙蛋白）</text>
  <rect x="30" y="424" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="446.84" font-size="19" fill="#475569" font-weight="700">二、Lymn–Taylor 摆动横桥循环（1971）：ATP → 构象应变 → 机械冲程</text>
  <rect x="46" y="468" width="310" height="228" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="68" y1="552" x2="334" y2="552" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="68" y1="558" x2="334" y2="558" stroke="#dc2626" stroke-width="2.6"/>
  <circle cx="166" cy="520" r="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <line x1="158" y1="512" x2="124" y2="478" stroke="#6d28d9" stroke-width="4"/>
  <rect x="240.932" y="489.5" width="46.136" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="264" y="501.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">ADP·Pi</text>
  <text x="62" y="600" font-size="12.5" fill="#1e293b" font-weight="700">① 待发态（上弦）</text>
  <text x="62" y="622" font-size="10" fill="#475569">头部持有 ADP·Pi，</text>
  <text x="62" y="635.5" font-size="10" fill="#475569">杠杆臂处于预存应变的高能构象——像上满弦的发条。</text>
  <rect x="378" y="468" width="310" height="228" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="400" y1="552" x2="666" y2="552" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="400" y1="558" x2="666" y2="558" stroke="#dc2626" stroke-width="2.6"/>
  <circle cx="498" cy="538" r="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <line x1="490" y1="530" x2="456" y2="478" stroke="#6d28d9" stroke-width="4"/>
  <rect x="565.516" y="489.5" width="60.967999999999996" height="17" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="596" y="501.6" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">Ca²⁺ 开关</text>
  <text x="394" y="600" font-size="12.5" fill="#1e293b" font-weight="700">② 结合</text>
  <text x="394" y="622" font-size="10" fill="#475569">Ca²⁺ 经肌钙蛋白–原肌球蛋白开关暴露细丝结合位点；</text>
  <text x="394" y="635.5" font-size="10" fill="#475569">头部与肌动蛋白弱结合 → 强结合。</text>
  <rect x="710" y="468" width="310" height="228" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="732" y1="552" x2="998" y2="552" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="732" y1="558" x2="998" y2="558" stroke="#dc2626" stroke-width="2.6"/>
  <circle cx="830" cy="538" r="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <line x1="838" y1="530" x2="878" y2="486" stroke="#075985" stroke-width="4"/>
  <path d="M 805,513 Q 830,470 860,488" fill="none" stroke="#be185d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-enz)"/>
  <rect x="889.482" y="489.5" width="77.036" height="17" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="928" y="501.6" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">Pi、ADP 释放</text>
  <text x="726" y="600" font-size="12.5" fill="#1e293b" font-weight="700">③ 冲程（做功）</text>
  <text x="726" y="622" font-size="10" fill="#475569">Pi 与 ADP 依次释放，杠杆臂相对肌动蛋白摆动 5–10 nm，</text>
  <text x="726" y="635.5" font-size="10" fill="#475569">拖动细丝——单个冲程力约 3–5 pN。</text>
  <rect x="1042" y="468" width="310" height="228" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="1064" y1="552" x2="1330" y2="552" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="1064" y1="558" x2="1330" y2="558" stroke="#dc2626" stroke-width="2.6"/>
  <circle cx="1162" cy="520" r="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <line x1="1154" y1="512" x2="1120" y2="478" stroke="#6d28d9" stroke-width="4"/>
  <rect x="1243.421" y="489.5" width="33.158" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1260" y="501.6" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">ATP</text>
  <text x="1058" y="600" font-size="12.5" fill="#1e293b" font-weight="700">④ 再武装</text>
  <text x="1058" y="622" font-size="10" fill="#475569">新 ATP 结合使头部脱离细丝；</text>
  <text x="1058" y="635.5" font-size="10" fill="#475569">ATP 水解把杠杆臂重新「上弦」，进入下一轮循环。</text>
  <line x1="358" y1="590" x2="375" y2="590" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <line x1="690" y1="590" x2="707" y2="590" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <line x1="1022" y1="590" x2="1039" y2="590" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <path d="M 1197,700 C 1197,732 201,732 201,700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <text x="700" y="750" font-size="10.5" fill="#64748b" text-anchor="middle">循环往复</text>
  <line x1="830" y1="545" x2="878" y2="545" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="854" y="536" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">5–10 nm</text>
  <rect x="30" y="778" width="1340" height="202" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="800.84" font-size="19" fill="#475569" font-weight="700">三、从分子到整肌：非同步循环与宏观力学</text>
  <rect x="46" y="810" width="310" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="62" y="836" font-size="12.5" fill="#1e293b" font-weight="700">非同步循环 → 平滑张力</text>
  <text x="62" y="860" font-size="10" fill="#475569">整根粗丝上数百个头处于循环的不同相位，</text>
  <text x="62" y="873.5" font-size="10" fill="#475569">总张力平滑不掉线。</text>
  <rect x="376" y="810" width="310" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="392" y="836" font-size="12.5" fill="#1e293b" font-weight="700">力–速度关系（Hill 方程）</text>
  <line x1="400" y1="912" x2="660" y2="912" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <line x1="400" y1="845" x2="400" y2="912" stroke="#475569" stroke-width="1.6"/>
  <path d="M402,850 C406.7,857.7 416.2,886.7 430,896 C443.8,905.3 461.7,903.8 485,906 C508.3,908.2 541.5,908.3 570,909 C598.5,909.7 641.7,909.8 656,910" fill="none" stroke="#0369a1" stroke-width="2.6"/>
  <text x="648" y="926" font-size="9" fill="#64748b" text-anchor="middle">速度 →</text>
  <text x="388" y="852" font-size="9" fill="#64748b" text-anchor="middle">力</text>
  <text x="470" y="862" font-size="9.5" fill="#475569">横桥循环速率随负荷减慢的宏观表现</text>
  <rect x="706" y="810" width="310" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="722" y="836" font-size="12.5" fill="#1e293b" font-weight="700">最大等长比张力</text>
  <text x="861" y="878" font-size="22" fill="#075985" text-anchor="middle" font-weight="700">≈ 0.3 MPa</text>
  <text x="861" y="906" font-size="10" fill="#475569" text-anchor="middle">（30 N/cm²）——数百万横桥力之和</text>
  <rect x="1036" y="810" width="310" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="1052" y="836" font-size="12.5" fill="#1e293b" font-weight="700">兴奋–收缩耦联</text>
  <text x="1052" y="860" font-size="10" fill="#475569">动作电位沿肌膜与 T 管传入 → 肌浆网 RyR 释放 Ca²⁺ → 与肌钙蛋白 C 结合，</text>
  <text x="1052" y="873.5" font-size="10" fill="#475569">解除原肌球蛋白的位阻。</text>
  <text x="46" y="948" font-size="10" fill="#64748b">ATP 供给由磷酸肌酸缓冲；疲劳与僵直（rigor，ATP 耗尽使横桥不可逆锁死）都从能量学得到解释——摆动横桥模型把宏观肌肉力学一路还原到「ATP → 构象应变 → 机械冲程」的分子事件链。</text>
</svg>