<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">转基因动物、iPS 与基因治疗</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">显微注射 → ES 打靶 → 条件性 Cre-lox → iPS 重编程——AAV / 慢病毒载体、CAR-T 合成受体与生殖系编辑的伦理红线</text>
  <rect x="30" y="132" width="900" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、转基因与基因敲除动物：从随机整合到定点改造</text>
  <rect x="46" y="170" width="868" height="84" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="62" y="194" font-size="13.5" fill="#134e4a" font-weight="700">原核显微注射</text>
  <text x="62" y="216" font-size="11.5" fill="#475569">1981–1982 建立：外源 DNA 注入受精卵雄原核，随机整合——首代「超级小鼠」为金属硫蛋白启动子驱动的生长激素基因；缺点：位置效应 · 嵌合体</text>
  <rect x="817.37" y="185.075" width="57.26" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="846" y="197.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">随机插入</text>
  <rect x="46" y="264" width="868" height="84" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="62" y="288" font-size="13.5" fill="#134e4a" font-weight="700">ES 细胞同源重组打靶</text>
  <text x="62" y="310" font-size="11.5" fill="#475569">小鼠胚胎干细胞中以正-负选择（neo 正选 + HSV-tk 负选）富集中靶克隆 → 囊胚注射 → 嵌合体配种获生殖系传递；</text>
  <text x="62" y="327" font-size="11.5" fill="#475569">Capecchi · Smithies 与 Evans 获 2007 年诺贝尔奖</text>
  <rect x="817.37" y="279.075" width="57.26" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="846" y="291.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">定点敲除</text>
  <rect x="46" y="358" width="868" height="84" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="62" y="382" font-size="13.5" fill="#134e4a" font-weight="700">条件性敲除（Cre-lox）</text>
  <text x="62" y="404" font-size="11.5" fill="#475569">loxP 位点夹住关键外显子（flox）+ 组织 / 时序特异性 Cre——白蛋白启动子-Cre 限肝脏、CreER + 他莫昔芬诱导；克服全身敲除的胚胎致死，金标准</text>
  <rect x="806.555" y="373.075" width="78.89" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="846" y="385.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">限定组织时序</text>
  <rect x="46" y="452" width="868" height="84" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="62" y="476" font-size="13.5" fill="#134e4a" font-weight="700">iPS 诱导多能干细胞</text>
  <text x="62" y="498" font-size="11.5" fill="#475569">Yamanaka（2006 / 2007）以四因子 OCT4 · SOX2 · KLF4 · c-MYC 将成纤维细胞重编程为多能干细胞（2012 年诺贝尔奖）</text>
  <text x="62" y="515" font-size="11.5" fill="#475569">——疾病建模与基因校正后自体移植</text>
  <rect x="822.7775" y="467.075" width="46.445" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="846" y="479.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">重编程</text>
  <line x1="890" y1="196" x2="838" y2="222" stroke="#475569" stroke-width="2.2"/>
  <polygon points="838,222 830,214 834,226" fill="#475569"/>
  <circle cx="816" cy="240" r="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <circle cx="806" cy="232" r="7" fill="#0f766e"/>
  <text x="846" y="340" font-size="9.5" fill="#831843" text-anchor="middle">loxP</text>
  <rect x="820" y="346" width="14" height="10" rx="2" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
  <rect x="838" y="346" width="30" height="10" rx="2" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="872" y="346" width="14" height="10" rx="2" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
  <text x="846" y="372" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">Cre</text>
  <ellipse cx="822" cy="470" rx="18" ry="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
  <line x1="846" y1="470" x2="868" y2="470" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-ok)"/>
  <circle cx="892" cy="470" r="15" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="892" y="474" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">iPS</text>
  <rect x="940" y="132" width="410" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="956" y="154.84" font-size="19" fill="#475569" font-weight="700">二、基因治疗载体：按载体与策略分类</text>
  <rect x="956" y="172" width="378" height="86" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="972" y="196" font-size="13" fill="#059669" font-weight="700">AAV 腺相关病毒</text>
  <text x="972" y="216" font-size="10.5" fill="#475569">非致病 · 血清型定组织向性（AAV2 视网膜 · AAV9 神经 / 心肌）</text>
  <text x="972" y="231" font-size="10.5" fill="#475569">· 载量约 4.7 kb · 附加体长期表达</text>
  <text x="972" y="244" font-size="10" fill="#64748b">Luxturna（RPE65 视网膜营养不良）· Zolgensma（SMA，SMN1 补充）</text>
  <rect x="956" y="268" width="378" height="86" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="972" y="292" font-size="13" fill="#b45309" font-weight="700">慢病毒（HIV 改造）</text>
  <text x="972" y="312" font-size="10.5" fill="#475569">整合型 · 容量约 8 kb · 适合 ex vivo 造血干细胞 / 淋巴细胞</text>
  <text x="972" y="340" font-size="10" fill="#64748b">ADA-SCID 治疗</text>
  <rect x="956" y="364" width="378" height="86" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="972" y="388" font-size="13" fill="#dc2626" font-weight="700">腺病毒</text>
  <text x="972" y="408" font-size="10.5" fill="#475569">大容量 · 非整合 · 免疫原性强</text>
  <rect x="956" y="460" width="378" height="86" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="972" y="484" font-size="13" fill="#0369a1" font-weight="700">LNP-mRNA</text>
  <text x="972" y="504" font-size="10.5" fill="#475569">瞬时表达（疫苗范式）· 与体内编辑联用</text>
  <text x="972" y="532" font-size="10" fill="#64748b">NTLA-2001：LNP 递送 Cas9 mRNA + sgRNA 治疗转甲状腺素蛋白淀粉样变</text>
  <rect x="30" y="578" width="900" height="382" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、CAR-T 嵌合抗原受体 T 细胞：合成免疫受体</text>
  <line x1="200" y1="656" x2="700" y2="656" stroke="#0369a1" stroke-width="5" opacity="0.5"/>
  <text x="120" y="660" font-size="10.5" fill="#64748b" text-anchor="middle">细胞膜</text>
  <ellipse cx="300" cy="630" rx="40" ry="20" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <text x="300" y="635" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">scFv</text>
  <text x="350" y="634" font-size="10.5" fill="#64748b">单链抗体识别肿瘤抗原</text>
  <line x1="300" y1="650" x2="300" y2="672" stroke="#475569" stroke-width="2"/>
  <text x="300" y="686" font-size="10" fill="#64748b" text-anchor="middle">铰链区</text>
  <rect x="500" y="668" width="150" height="30" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="575" y="688" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">共刺激域 CD28 / 4-1BB</text>
  <rect x="500" y="702" width="150" height="28" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="575" y="721" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">CD3ζ 信号域</text>
  <line x1="575" y1="656" x2="575" y2="668" stroke="#475569" stroke-width="2"/>
  <text x="575" y="742" font-size="10" fill="#64748b" text-anchor="middle">胞内信号输出</text>
  <text x="450" y="616" font-size="10.5" fill="#78350f" text-anchor="middle">（第二代 CAR：共刺激域是疗效关键）</text>
  <rect x="56" y="748" width="200" height="44" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="156" y="774" font-size="12" fill="#075985" text-anchor="middle" font-weight="600">分离患者 T 细胞</text>
  <line x1="258" y1="770" x2="270" y2="770" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="272" y="748" width="200" height="44" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="372" y="774" font-size="12" fill="#075985" text-anchor="middle" font-weight="600">慢病毒导入受体基因</text>
  <line x1="474" y1="770" x2="486" y2="770" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="488" y="748" width="200" height="44" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="588" y="774" font-size="12" fill="#075985" text-anchor="middle" font-weight="600">体外扩增</text>
  <line x1="690" y1="770" x2="702" y2="770" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="704" y="748" width="200" height="44" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="804" y="774" font-size="12" fill="#075985" text-anchor="middle" font-weight="600">回输患者</text>
  <rect x="56" y="812" width="858" height="128" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="838" font-size="13" fill="#1e293b" font-weight="700">临床与毒性管理</text>
  <text x="72" y="862" font-size="11.5" fill="#475569">抗 CD19 CAR-T（Kymriah，2017）治疗 B 细胞白血病 / 淋巴瘤完全缓解率高；抗 BCMA 产品用于多发性骨髓瘤</text>
  <text x="72" y="898" font-size="11.5" fill="#475569">主要毒性：细胞因子释放综合征（CRS）与神经毒性（ICANS）——托珠单抗与剂量分级管理已成熟</text>
  <text x="72" y="926" font-size="10.5" fill="#64748b">“合成生物学式”受体：识别域（抗体）与信号域（T 细胞）跨模块拼接</text>
  <rect x="940" y="578" width="410" height="382" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="956" y="600.84" font-size="19" fill="#475569" font-weight="700">四、伦理与治理：生殖系编辑的红线</text>
  <rect x="956" y="624" width="378" height="108" rx="9" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.5"/>
  <text x="972" y="650" font-size="13" fill="#dc2626" font-weight="700">贺建奎「基因编辑婴儿」事件</text>
  <text x="972" y="674" font-size="11.5" fill="#475569">2018 年越过生殖系编辑的全球共识红线，</text>
  <text x="972" y="691" font-size="11.5" fill="#475569">被判刑并引发国际治理反思</text>
  <text x="972" y="716" font-size="13" fill="#1e293b" font-weight="700">当前共识：</text>
  <rect x="956" y="736" width="378" height="42" rx="8" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.3"/>
  <text x="972" y="762" font-size="12.5" fill="#1e293b" font-weight="700">体细胞治疗</text>
  <text x="1318" y="762" font-size="11.5" fill="#475569" text-anchor="end">经严格审批推进</text>
  <rect x="956" y="788" width="378" height="42" rx="8" fill="#fef3c7" fill-opacity="0.4" stroke="#b45309" stroke-width="1.3"/>
  <text x="972" y="814" font-size="12.5" fill="#1e293b" font-weight="700">生殖系编辑</text>
  <text x="1318" y="814" font-size="11.5" fill="#475569" text-anchor="end">暂缓</text>
  <rect x="956" y="840" width="378" height="42" rx="8" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.3"/>
  <text x="972" y="866" font-size="12.5" fill="#1e293b" font-weight="700">增强性应用</text>
  <text x="1318" y="866" font-size="11.5" fill="#475569" text-anchor="end">禁止</text>
  <text x="956" y="906" font-size="11" fill="#64748b">技术能力与伦理边界的张力将持续考验分子生物学</text>
  <text x="956" y="923" font-size="11" fill="#64748b">——「能否做到」与「是否应当」必须同步回答</text>
</svg>