  <line x1="790" y1="838" x2="790" y2="844" stroke="#475569" stroke-width="1.8"/>
  <text x="790" y="860" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="880" y1="838" x2="880" y2="844" stroke="#475569" stroke-width="1.8"/>
  <text x="880" y="860" font-size="13" fill="#64748b" text-anchor="middle">20</text>
  <line x1="925" y1="838" x2="925" y2="844" stroke="#475569" stroke-width="1.8"/>
  <text x="925" y="860" font-size="13" fill="#64748b" text-anchor="middle">30</text>
  <line x1="1015" y1="838" x2="1015" y2="844" stroke="#475569" stroke-width="1.8"/>
  <text x="1015" y="860" font-size="13" fill="#64748b" text-anchor="middle">50</text>
  <line x1="1105" y1="838" x2="1105" y2="844" stroke="#475569" stroke-width="1.8"/>
  <text x="1105" y="860" font-size="13" fill="#64748b" text-anchor="middle">70</text>
