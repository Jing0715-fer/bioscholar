  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">从序列到结构：结构生物学的使命</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">中心命题「结构决定功能」：Anfinsen复性实验确立热力学假说（1972年诺奖）；PDB由13条增至逾22万条、约八成五来自晶体学；序列一致性高于约30%即可同源模建</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、中心命题与 Anfinsen 复性实验</text>
  <text x="50" y="172" font-size="10.5" fill="#475569">结构生物学在原子分辨率水平研究生物大分子三维结构，用原子坐标解释生命现象；催化、</text>
  <text x="50" y="187" font-size="10.5" fill="#475569">识别与变构的最终答案不在序列的线性排列里，而在折叠形成的活性位点、结合口袋与别构通路之中。</text>
  <rect x="53.349999999999994" y="216.65" width="129.3" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="118" y="229.96" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">一级结构：氨基酸序列</text>
  <line x1="186" y1="226" x2="214" y2="226" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="218.35500000000002" y="216.65" width="163.29" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="300" y="229.96" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">三维折叠：口袋、通路与别构</text>
  <line x1="386" y1="226" x2="414" y2="226" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="429.3894" y="216.65" width="125.22120000000001" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="492" y="229.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">功能：催化·识别·调节</text>
