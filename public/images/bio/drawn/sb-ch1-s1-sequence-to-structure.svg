  <line x1="1135" y1="470" x2="1135" y2="300" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="760" y1="470" x2="760" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="760" y="492" font-size="13" fill="#64748b" text-anchor="middle">1971</text>
  <line x1="1110" y1="470" x2="1110" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="1110" y="492" font-size="13" fill="#64748b" text-anchor="middle">2008</text>
