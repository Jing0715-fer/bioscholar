  <text x="225" y="281" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">盐酸胍＋还原剂</text>
  <line x1="332" y1="300" x2="458" y2="300" stroke="#059669" stroke-width="2" marker-end="url(#arr-ok)"/>
  <text x="395" y="281" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">透析去除变性剂</text>
  <text x="140" y="366" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">天然 RNase A</text>
  <text x="310" y="366" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">伸展的无规卷曲</text>
  <text x="480" y="366" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">重建天然构象</text>
  <rect x="171.1534" y="394.65" width="337.6932" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="340" y="407.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">复性后活性几乎完全恢复——一级结构已蕴含折叠所需的全部信息</text>
  <text x="50" y="434" font-size="10.5" fill="#475569">「热力学假说」为 Anfinsen 赢得 1972 年诺贝尔化学奖。其后折叠漏斗、分子伴娘与体内纠错的研究不断划出这条原理的边界，</text>
  <text x="50" y="449" font-size="10.5" fill="#475569">但作为一级结构与三维结构因果链的首次实验演示，它始终是学科的起点。</text>
  <text x="50" y="490" font-size="10.5" fill="#475569">直接从序列推算结构长期是最困难的计算问题之一，</text>
  <text x="50" y="505" font-size="10.5" fill="#475569">实验测定始终是结构生物学的立身之本——这正是本课程以「实验方法」为题的原因。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、两座数据库：PDB 与 AlphaFold DB</text>
  <text x="730" y="172" font-size="10.5" fill="#475569">衡量学科规模最直观的尺子是数据库：PDB 1971 年建于布鲁克海文国家实验室，起步仅 13 个结构；到 2024 年，</text>
  <text x="730" y="187" font-size="10.5" fill="#475569">其存量已超过 22 万条，每年新增逾万条。</text>
  <rect x="794.88905" y="231.075" width="170.22190000000003" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="880" y="243.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">存量约八成五来自 X 射线晶体学</text>
  <rect x="1076.93615" y="231.075" width="206.12770000000003" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1180" y="243.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">AlphaFold DB：约 2 亿条 UniProt 预测</text>
