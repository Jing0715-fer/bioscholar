  <text x="1165" y="492" font-size="13" fill="#64748b" text-anchor="middle">2014</text>
  <line x1="1260" y1="470" x2="1260" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="1260" y="492" font-size="13" fill="#64748b" text-anchor="middle">2024</text>
  <line x1="754" y1="470" x2="760" y2="470" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="474" font-size="13" fill="#64748b" text-anchor="end">10<tspan dy="-4.4" font-size="9.4">1</tspan></text>
  <line x1="754" y1="395.2" x2="760" y2="395.2" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="399.2" font-size="13" fill="#64748b" text-anchor="end">10<tspan dy="-4.4" font-size="9.4">3</tspan></text>
  <line x1="754" y1="322.1" x2="760" y2="322.1" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="326.1" font-size="13" fill="#64748b" text-anchor="end">10<tspan dy="-4.4" font-size="9.4">5</tspan></text>
  <text x="1010" y="514" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">年份</text>
  <text x="714" y="385" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">条目数</text>
  <text x="1010" y="288" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">PDB 条目数（对数刻度）</text>
  <path d="M760,464.9 C785.0,463.2 864.2,462.9 910,454.7 C955.8,446.5 1001.7,435.7 1035,415.6 C1068.3,395.5 1088.3,349.6 1110,334 C1131.7,318.4 1140.0,326.2 1165,322.1 C1190.0,318.0 1244.2,311.5 1260,309.35" fill="none" stroke="#0369a1" stroke-width="2.6"/>
  <circle cx="760" cy="464.9" r="4.5" fill="#075985" stroke="#ffffff" stroke-width="1.2"/>
  <text x="760" y="446.9" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">13 条</text>
  <circle cx="1110" cy="334" r="4.5" fill="#075985" stroke="#ffffff" stroke-width="1.2"/>
  <text x="1110" y="352" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">5 万</text>
  <circle cx="1165" cy="322.1" r="4.5" fill="#075985" stroke="#ffffff" stroke-width="1.2"/>
  <text x="1165" y="340.1" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">10 万</text>
  <circle cx="1260" cy="309.35" r="4.5" fill="#075985" stroke="#ffffff" stroke-width="1.2"/>
  <text x="1260" y="327.35" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">逾 22 万</text>
  <text x="730" y="530" font-size="10" fill="#475569">指数曲线背后是同步辐射光源、直接电子探测相机与机器人化结晶筛选三类基础设施的接力；</text>
  <text x="730" y="544" font-size="10" fill="#475569">2003 年起 PDB 由 wwPDB 联盟共治——RCSB、PDBe、PDBj 三中心同源同步，条目须通过统一验证方可发布。</text>
  <rect x="30" y="578" width="660" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、结构生物学回答的四类经典问题</text>
  <ellipse cx="80" cy="634" rx="22" ry="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <polygon points="104,626 112,631 112,641 104,646 96,641 96,631" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <line x1="104" y1="634" x2="90" y2="634" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-rna)"/>
  <text x="130" y="620" font-size="12" fill="#1e293b" font-weight="700">① 酶催化机制</text>
  <text x="130" y="638" font-size="10.5" fill="#475569">1965 年 Phillips 团队以 2 Å 解析鸡蛋清溶菌酶，Glu35 与 Asp52 协同断裂糖苷键，</text>
  <text x="130" y="653" font-size="10.5" fill="#475569">底物 D 环被结合能挤压成半椅式构象——催化应变学说的经典例证。</text>
  <path d="M 72,722 L 72,706 L 64,694 M 72,706 L 80,694" fill="none" stroke="#0369a1" stroke-width="2.2"/>
  <ellipse cx="98" cy="690" rx="11" ry="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="130" y="692" font-size="12" fill="#1e293b" font-weight="700">② 分子识别</text>
  <text x="130" y="710" font-size="10.5" fill="#475569">抗原-抗体界面由约 17 个抗体残基与十余个抗原残基互补堆叠，埋藏面积常达 600 至 900 Å<tspan dy="-3.6" font-size="7.6">2</tspan><tspan dy="3.6">，并非刚性锁钥，</tspan></text>
  <text x="130" y="725" font-size="10.5" fill="#475569">而是诱导契合的动态匹配。</text>
  <circle cx="76" cy="770" r="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <circle cx="94" cy="770" r="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <circle cx="76" cy="786" r="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <circle cx="94" cy="786" r="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="130" y="764" font-size="12" fill="#1e293b" font-weight="700">③ 变构调节</text>
  <text x="130" y="782" font-size="10.5" fill="#475569">血红蛋白在 T 态与 R 态之间转换，氧合伴随离子键网络断裂、亚基相对转动与铁原子约 0.6 Å 位移，</text>
  <text x="130" y="797" font-size="10.5" fill="#475569">为 MWC 齐变模型提供结构注脚。</text>
  <ellipse cx="78" cy="850" rx="13" ry="17" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <ellipse cx="106" cy="850" rx="13" ry="17" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <line x1="92" y1="830" x2="92" y2="870" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <polygon points="86,850 92,844 98,850 92,856" fill="#d97706" fill-opacity="0.85"/>
  <text x="130" y="836" font-size="12" fill="#1e293b" font-weight="700">④ 基于结构的药物设计</text>
  <text x="130" y="854" font-size="10.5" fill="#475569">HIV 蛋白酶是具 C2 对称性的同源二聚体天冬氨酸蛋白酶，</text>
  <text x="130" y="869" font-size="10.5" fill="#475569">依活性位点几何设计的抑制剂沙奎那韦 1995 年获批上市，此后联合疗法将艾滋病转变为可长期管理的慢性病。</text>
  <text x="50" y="912" font-size="10" fill="#64748b">四类问题是结构知识解释力的试金石；学会用 PyMOL 或 ChimeraX 打开 PDB 坐标文件审视结论，是本课程的第一项课外作业。</text>
  <rect x="710" y="578" width="660" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="600.84" font-size="19" fill="#475569" font-weight="700">四、序列一致性与折叠保守性</text>
  <text x="730" y="616" font-size="10" fill="#64748b">Chothia 与 Lesk（1986）的定量规律：一致性约 30% 时可叠合核心残基约占一半，50% 时升至约三分之二。</text>
  <rect x="790" y="648" width="450" height="190" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="790" y1="790.5" x2="1240" y2="790.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
