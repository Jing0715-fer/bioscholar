  <circle cx="140" cy="300" r="11" fill="#6d28d9" fill-opacity="0.8"/>
  <path d="M 133,296 q 7,-7 14,0 q -7,7 -14,0" fill="none" stroke="#4c1d95" stroke-width="1.4"/>
  <path d="M 297,304 q 6,-14 12,0 q 6,14 12,0 q 6,-14 12,0" fill="none" stroke="#dc2626" stroke-width="1.8"/>
