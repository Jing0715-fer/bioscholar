  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">超二级结构与结构域：从模体到功能模块</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">βαβ、β 发夹、HTH 与希腊钥匙四种模体；Src 的 SH2/SH3/激酶域分域调节；TIM 桶（8β+8α）与 EF 手（螺旋-环-螺旋配位 Ca²⁺）两大经典</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、超二级结构（模体）：二级结构元件的保守组合</text>
  <rect x="56" y="178" width="300" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="70" y="202" font-size="12.5" fill="#1e293b" font-weight="700">① βαβ 单元</text>
  <text x="70" y="326" font-size="10" fill="#64748b">两段 β 链由一段 α 螺旋连接（螺旋越过折叠片上方）</text>
  <polygon points="76,300 158,300 172,308 158,316 76,316" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <polygon points="236,300 250,300 236,308 250,316 236,316" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <polyline points="168,252 172,244.72294403716384 176,245.95400340516593 180,254.25386045473144 184,259.9185715350475 188,256.32512653964477 192,247.67487346035523 196,244.08142846495252 200,249.74613954526856 204,258.0459965948341 208,259.27705596283613 212,252 216,244.72294403716387 220,245.95400340516593 224,254.25386045473144 228,259.9185715350475 232,256.32512653964477 236,247.67487346035523 240,244.08142846495255 244,249.74613954526856" fill="none" stroke="#6d28d9" stroke-width="3"/>
  <line x1="172" y1="292" x2="172" y2="262" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="240" y1="262" x2="240" y2="292" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="76" y="336" font-size="10.5" fill="#075985" font-weight="700">β₁</text>
  <text x="300" y="336" font-size="10.5" fill="#075985" font-weight="700">β₂</text>
  <text x="200" y="230" font-size="12" fill="#4c1d95" font-weight="700" font-style="italic">α</text>
  <rect x="360" y="178" width="300" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="374" y="202" font-size="12.5" fill="#1e293b" font-weight="700">② β 发夹（β-meander）</text>
  <text x="374" y="326" font-size="10" fill="#64748b">反平行 β 链由紧凑转角串联</text>
  <polygon points="430,226 430,302 439,314 448,302 448,226" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <polygon points="470,226 470,238 479,226 488,238 488,226" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <path d="M439,226 Q449,204 479,226" fill="none" stroke="#0369a1" stroke-width="1.8"/>
  <text x="500" y="260" font-size="10" fill="#64748b">转角</text>
  <rect x="56" y="350" width="300" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="70" y="374" font-size="12.5" fill="#1e293b" font-weight="700">③ αα 模体（helix-turn-helix）</text>
  <text x="70" y="498" font-size="10" fill="#64748b">两段 α 螺旋由转角连接——λ 阻遏蛋白识别螺旋插入 DNA 大沟</text>
  <polyline points="76,408 80,401.6325760325184 84,402.7097529795202 88,409.97212789789 92,414.9287500931665 96,411.7844857221892 100,404.2155142778108 104,401.0712499068335 108,406.02787210211 112,413.2902470204798 116,414.3674239674816 120,408 124,401.6325760325184 128,402.7097529795202 132,409.97212789789 136,414.9287500931665 140,411.7844857221892 144,404.2155142778108 148,401.0712499068335 152,406.02787210211 156,413.2902470204798 160,414.3674239674816 164,408 168,401.6325760325184 172,402.7097529795202 176,409.97212789789" fill="none" stroke="#6d28d9" stroke-width="3"/>
  <path d="M176,412 q18,-24 36,0" fill="none" stroke="#6d28d9" stroke-width="3"/>
  <polyline points="212,430 216,423.6325760325184 220,424.7097529795202 224,431.97212789789 228,436.9287500931665 232,433.7844857221892 236,426.2155142778108 240,423.0712499068335 244,428.02787210211 248,435.2902470204798 252,436.3674239674816 256,430 260,423.6325760325184 264,424.7097529795202 268,431.97212789789 272,436.9287500931665 276,433.7844857221892 280,426.2155142778108 284,423.0712499068335 288,428.02787210211 292,435.2902470204798 296,436.3674239674816 300,430 304,423.6325760325184 308,424.7097529795202 312,431.97212789789" fill="none" stroke="#6d28d9" stroke-width="3"/>
  <text x="250" y="388" font-size="10" fill="#4c1d95" font-weight="700">识别螺旋</text>
  <text x="180" y="400" font-size="10" fill="#64748b">转角</text>
  <rect x="360" y="350" width="300" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="374" y="374" font-size="12.5" fill="#1e293b" font-weight="700">④ 希腊钥匙（Greek key）</text>
  <text x="374" y="498" font-size="10" fill="#64748b">四段反平行 β 链的特殊连接方式</text>
  <polygon points="424,398 424,470 432,482 440,470 440,398" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <polygon points="460,398 460,410 468,398 476,410 476,398" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
