  <circle cx="1178" cy="740" r="15" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="1178" y="743.6" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">Ca²⁺</text>
  <text x="1128" y="706" font-size="10" fill="#4c1d95" text-anchor="middle" font-weight="700">螺旋 E</text>
