  <text x="552" y="379" font-size="10" fill="#64748b">跨接</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、结构域：独立折叠的功能单元（以 Src 激酶为例）</text>
  <circle cx="790" cy="268" r="42" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="790" y="264" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="700">SH3</text>
  <text x="790" y="284" font-size="10.5" fill="#64748b" text-anchor="middle">调节</text>
  <circle cx="950" cy="268" r="42" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="950" y="264" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="700">SH2</text>
  <text x="950" y="284" font-size="10.5" fill="#64748b" text-anchor="middle">调节</text>
  <ellipse cx="1180" cy="268" rx="108" ry="52" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="1180" y="264" font-size="14" fill="#831843" text-anchor="middle" font-weight="700">激酶域</text>
  <text x="1180" y="284" font-size="10.5" fill="#64748b" text-anchor="middle">（催化）</text>
  <path d="M834,268 q28,-34 72,0" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M994,268 q34,-34 76,0" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="872" y="314" font-size="10.5" fill="#64748b" text-anchor="middle">柔性铰链</text>
  <text x="1038" y="314" font-size="10.5" fill="#64748b" text-anchor="middle">柔性铰链（可被蛋白酶切开）</text>
  <text x="726" y="196" font-size="13" fill="#475569" font-weight="700">N</text>
  <text x="1314" y="196" font-size="13" fill="#475569" text-anchor="end" font-weight="700">C</text>
  <text x="726" y="366" font-size="11.5" fill="#475569">结构域由 100~200 个残基构成，可独立折叠、功能相对独立；酶的底物结合域与调节域分开，</text>
  <text x="726" y="383" font-size="11.5" fill="#475569">有利于别构调节与模块化进化。</text>
  <text x="726" y="432" font-size="11.5" fill="#64748b">域间运动（铰链弯曲）是别构酶与肌动球蛋白工作的基础；结构域的模块化是蛋白进化与别构调节的结构基础。</text>
  <text x="726" y="490" font-size="11.5" fill="#475569">大蛋白常由数个结构域组装——每个结构域常对应一个功能。</text>
  <rect x="30" y="556" width="1340" height="424" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="578.84" font-size="19" fill="#475569" font-weight="700">三、常见结构域类型与两个经典模体</text>
  <rect x="56" y="620" width="190" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="151" y="647.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">结构域</text>
  <rect x="246" y="620" width="290" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="391" y="647.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">特征</text>
  <rect x="536" y="620" width="240" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="656" y="647.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">代表蛋白</text>
  <rect x="56" y="664" width="190" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="151" y="688.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">平行 β 桶（TIM 桶）</text>
  <rect x="246" y="664" width="290" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="391" y="688.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">8 段平行 β 链围成内桶，外绕 8 段 α 螺旋</text>
  <rect x="536" y="664" width="240" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="656" y="688.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">磷酸丙糖异构酶及众多代谢酶</text>
  <rect x="56" y="702" width="720" height="38" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="56" y="702" width="190" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="151" y="726.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">开放式 β 片（Rossmann）</text>
  <rect x="246" y="702" width="290" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="391" y="726.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">β 折叠片一侧被 α 螺旋覆盖</text>
  <rect x="536" y="702" width="240" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="656" y="726.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">乳酸脱氢酶核苷酸结合域</text>
  <rect x="56" y="740" width="190" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="151" y="764.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">全 α 螺旋束（4 螺旋束）</text>
  <rect x="246" y="740" width="290" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="391" y="764.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">四段 α 螺旋装配成束</text>
  <rect x="536" y="740" width="240" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="656" y="764.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">细胞色素 b₅₆₂、载脂蛋白</text>
  <rect x="56" y="778" width="720" height="38" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="56" y="778" width="190" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="151" y="802.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">免疫球蛋白折叠</text>
  <rect x="246" y="778" width="290" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="391" y="802.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">两层反平行 β 片由二硫键锁定（β 三明治）</text>
  <rect x="536" y="778" width="240" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="656" y="802.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">抗体、细胞表面受体</text>
  <rect x="56" y="816" width="190" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="151" y="840.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">β 螺旋</text>
  <rect x="246" y="816" width="290" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="391" y="840.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">平行 β 片卷成螺旋</text>
  <rect x="536" y="816" width="240" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="656" y="840.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">果胶酸裂解酶</text>
  <text x="56" y="892" font-size="11.5" fill="#475569">模体与结构域的重复利用体现「进化是修补匠」；Rossmann 折叠结合 NAD⁺/FAD，在 β-α-β 连接处的环有保守 Gly-Gly-xx-Gly 序列，</text>
  <text x="56" y="909" font-size="11.5" fill="#475569">广泛见于脱氢酶。</text>
