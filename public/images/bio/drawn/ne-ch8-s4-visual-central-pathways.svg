<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">视觉中枢通路：半交叉、LGN 分层、特征检测层级与双流假说</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">鼻侧半交叉使每侧半球管理对侧视野；腹侧流管「是什么」、背侧流管「在哪里/怎么做」</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、从视网膜到 V1：半野交叉与 LGN 分层</text>
  <rect x="60" y="210" width="90" height="90" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="105" y="250" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">左视野</text>
  <text x="105" y="270" font-size="9.5" fill="#64748b" text-anchor="middle">颞侧→右眼</text>
  <text x="105" y="285" font-size="9.5" fill="#64748b" text-anchor="middle">鼻侧→左眼</text>
  <rect x="170" y="210" width="90" height="90" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="215" y="250" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">右视野</text>
  <text x="215" y="270" font-size="9.5" fill="#64748b" text-anchor="middle">颞侧→左眼</text>
  <text x="215" y="285" font-size="9.5" fill="#64748b" text-anchor="middle">鼻侧→右眼</text>
  <line x1="105" y1="300" x2="215" y2="360" stroke="#0f766e" stroke-width="2.2"/>
  <line x1="215" y1="300" x2="105" y2="360" stroke="#dc2626" stroke-width="2.2"/>
  <rect x="101.015" y="375.65" width="117.97" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="160" y="388.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">视交叉：鼻侧半交叉</text>
  <rect x="310" y="330" width="150" height="80" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="318" y="344" width="16" height="56" rx="3" fill="#0369a1" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.2"/>
  <text x="326" y="414" font-size="9" fill="#64748b" text-anchor="middle">1</text>
  <rect x="340" y="344" width="16" height="56" rx="3" fill="#0369a1" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.2"/>
  <text x="348" y="414" font-size="9" fill="#64748b" text-anchor="middle">2</text>
  <rect x="362" y="344" width="16" height="56" rx="3" fill="#6d28d9" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="370" y="414" font-size="9" fill="#64748b" text-anchor="middle">3</text>
  <rect x="384" y="344" width="16" height="56" rx="3" fill="#6d28d9" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="392" y="414" font-size="9" fill="#64748b" text-anchor="middle">4</text>
  <rect x="406" y="344" width="16" height="56" rx="3" fill="#6d28d9" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="414" y="414" font-size="9" fill="#64748b" text-anchor="middle">5</text>
  <rect x="428" y="344" width="16" height="56" rx="3" fill="#6d28d9" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="436" y="414" font-size="9" fill="#64748b" text-anchor="middle">6</text>
  <text x="385" y="322" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">LGN 六层</text>
  <text x="385" y="436" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">1–2 大细胞（M）</text>
  <text x="385" y="452" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">3–6 小细胞（P）</text>
  <line x1="460" y1="370" x2="556" y2="370" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <rect x="562" y="342" width="110" height="56" rx="8" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="2"/>
  <text x="617" y="364" font-size="14" fill="#134e4a" text-anchor="middle" font-weight="700">V1</text>
  <text x="617" y="382" font-size="9" fill="#64748b" text-anchor="middle">（17 区 · 纹状）</text>
  <text x="617" y="424" font-size="10.5" fill="#64748b" text-anchor="middle">双眼信息至 V1 才汇合</text>
  <text x="60" y="490" font-size="11" fill="#475569">视交叉的「半交叉」设计把对侧视野的左右眼信息送进同一半球：每侧半球管理对侧视野，左半球看右半视野；</text>
  <text x="60" y="506" font-size="11" fill="#475569">LGN 并非简单中继——注意与眼动的门控在此汇入。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、V1：简单→复杂细胞的特征检测层级</text>
  <text x="880" y="200" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">简单细胞：方位选择性</text>
  <circle cx="770" cy="250" r="13" fill="#0f766e" fill-opacity="0.25" stroke="#0f766e" stroke-width="1.6"/>
  <circle cx="770" cy="250" r="6" fill="#0f766e" fill-opacity="0.7"/>
  <circle cx="820" cy="250" r="13" fill="#0f766e" fill-opacity="0.25" stroke="#0f766e" stroke-width="1.6"/>
  <circle cx="820" cy="250" r="6" fill="#0f766e" fill-opacity="0.7"/>
  <circle cx="870" cy="250" r="13" fill="#0f766e" fill-opacity="0.25" stroke="#0f766e" stroke-width="1.6"/>
  <circle cx="870" cy="250" r="6" fill="#0f766e" fill-opacity="0.7"/>
  <circle cx="920" cy="250" r="13" fill="#0f766e" fill-opacity="0.25" stroke="#0f766e" stroke-width="1.6"/>
  <circle cx="920" cy="250" r="6" fill="#0f766e" fill-opacity="0.7"/>
  <line x1="960" y1="250" x2="1010" y2="250" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="1020" y="222" width="130" height="56" rx="8" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1085" y="244" font-size="10.5" fill="#64748b" text-anchor="middle">汇聚成</text>
  <text x="1085" y="262" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">「亮条」检测器</text>
  <text x="1180" y="236" font-size="10" fill="#475569">LGN 同心圆感受野线性排列汇聚而来。</text>
  <text x="880" y="330" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">复杂细胞：位置不变性</text>
  <rect x="770" y="352" width="250" height="34" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.8"/>
  <text x="895" y="373" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">同样的方位，无论落在感受野何处</text>
  <text x="1050" y="356" font-size="10" fill="#475569">再汇聚一层即得；V1 以方位柱与眼优势柱的冰模马赛克组织。</text>
  <rect x="740" y="430" width="600" height="74" rx="9" fill="#fef3c7" fill-opacity="0.4" stroke="#b45309" stroke-width="1.6"/>
  <text x="760" y="454" font-size="11" fill="#475569">Hubel 与 Wiesel 以特征检测系列研究获 1981 年诺贝尔奖（与 Sperry 分享）；</text>
  <text x="760" y="470" font-size="11" fill="#475569">其单眼剥夺实验开创关键期可塑性研究——幼猫单眼缝合数周即令其眼优势柱大幅萎缩。</text>
  <rect x="30" y="578" width="1340" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、腹侧流与背侧流：是什么 vs 在哪里/怎么做</text>
  <rect x="90" y="660" width="560" height="120" rx="10" fill="#ccfbf1" fill-opacity="0.4" stroke="#0f766e" stroke-width="1.8"/>
  <text x="110" y="688" font-size="14" fill="#134e4a" font-weight="700">腹侧流（是什么）</text>
  <rect x="164.3368" y="715.8" width="31.3264" height="20.4" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="180" y="730.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">V1</text>
  <rect x="294.3368" y="715.8" width="31.3264" height="20.4" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="310" y="730.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">V2</text>
  <rect x="424.3368" y="715.8" width="31.3264" height="20.4" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="440" y="730.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">V4</text>
  <rect x="537.28" y="715.8" width="65.44" height="20.4" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="570" y="730.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">颞下皮层</text>
  <line x1="215" y1="726" x2="285" y2="726" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <line x1="335" y1="726" x2="415" y2="726" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <line x1="465" y1="726" x2="530" y2="726" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <text x="110" y="762" font-size="10.5" fill="#475569">形状、颜色、纹理、物体类别；慢而细、意识表征清晰——损伤致视觉失认症、面孔失认。</text>
  <rect x="700" y="660" width="590" height="120" rx="10" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.8"/>
  <text x="720" y="688" font-size="14" fill="#075985" font-weight="700">背侧流（在哪里/怎么做）</text>
  <rect x="774.3368" y="715.8" width="31.3264" height="20.4" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="790" y="730.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">V1</text>
  <rect x="904.3368" y="715.8" width="31.3264" height="20.4" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="920" y="730.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">V2</text>
  <rect x="1034.3368" y="715.8" width="31.3264" height="20.4" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1050" y="730.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">MT</text>
  <rect x="1159.64" y="715.8" width="40.72" height="20.4" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1180" y="730.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">顶叶</text>
  <line x1="825" y1="726" x2="895" y2="726" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="945" y1="726" x2="1025" y2="726" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="1075" y1="726" x2="1155" y2="726" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="720" y="762" font-size="10.5" fill="#475569">运动、位置、深度、光流；快而粗、可无意识引导动作——损伤致视觉共济失调、运动知觉丧失。</text>
  <text x="700" y="824" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">高级视觉的「专家模块」</text>
  <rect x="90" y="844" width="400" height="100" rx="9" fill="#ede9fe" fill-opacity="0.4" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="110" y="870" font-size="12.5" fill="#4c1d95" font-weight="700">梭状回面孔区（FFA）</text>
  <text x="110" y="892" font-size="10.5" fill="#475569">对面孔最适刺激选择性反应；损伤致面孔失认症——认得出是脸，</text>
  <text x="110" y="907" font-size="10.5" fill="#475569">认不出是谁的脸。</text>
  <rect x="510" y="844" width="400" height="100" rx="9" fill="#fef3c7" fill-opacity="0.4" stroke="#b45309" stroke-width="1.6"/>
  <text x="530" y="870" font-size="12.5" fill="#78350f" font-weight="700">旁海马回位置区（PPA）</text>
  <text x="530" y="892" font-size="10.5" fill="#475569">对场景与布局敏感；</text>
  <text x="530" y="907" font-size="10.5" fill="#475569">与 FFA 共同展示高级视觉的领域特异性与经验可塑性——象棋专家的「棋盘模块」亦循此理。</text>
  <rect x="930" y="844" width="410" height="100" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="950" y="870" font-size="10.5" fill="#475569">双流假说的临床证据：视觉失认症患者能准确把信投进邮筒（背侧流完好）</text>
  <text x="950" y="885" font-size="10.5" fill="#475569">却说不出邮筒是什么（腹侧流受损）</text>
  <text x="950" y="900" font-size="10.5" fill="#475569">——「完好的视觉引导动作 + 缺失的视觉意识」。</text>
</svg>