<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">弹性与非弹性散射：衬度与损伤的共同起点</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">弹性只改方向（衍射与相位衬度），非弹性沉积能量（EELS与损伤）；等离激元10–25eV、CK284/NK401/OK532eV；弹性自由程100–300nm、非弹性50–150nm（约20/Z）</text>
  <rect x="30" y="132" width="660" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、两类散射：衬度与损伤的共同起点</text>
  <circle cx="260" cy="262" r="7" fill="#475569"/>
  <circle cx="260" cy="262" r="22" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <circle cx="260" cy="262" r="36" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="2 5"/>
  <line x1="110" y1="262" x2="216" y2="262" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-warn)"/>
  <circle cx="104" cy="262" r="4.5" fill="#d97706"/>
  <text x="150" y="240" font-size="10.5" fill="#64748b" text-anchor="middle">入射电子</text>
  <line x1="282" y1="250" x2="360" y2="204" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <circle cx="370" cy="201" r="4.5" fill="#0369a1"/>
  <text x="380" y="200" font-size="11" fill="#075985" font-weight="700">弹性：只改方向，E 不变</text>
  <line x1="282" y1="274" x2="360" y2="320" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#arr-pro)"/>
  <circle cx="370" cy="323" r="4.5" fill="#6d28d9"/>
  <text x="380" y="326" font-size="11" fill="#4c1d95" font-weight="700">非弹性：E−ΔE，能量沉积</text>
  <line x1="240" y1="232" x2="228" y2="178" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <circle cx="226" cy="172" r="3.5" fill="#dc2626"/>
  <text x="140" y="170" font-size="10.5" fill="#991b1b" font-weight="600">ΔE 沉积：电离与激发</text>
  <text x="50" y="372" font-size="10.5" fill="#475569">100–300 keV 的电子以约 0.5–0.8 倍光速穿越样品（波长约 2–4 pm）：弹性散射是衍射花样与相位衬度的物理来源；</text>
  <text x="50" y="387" font-size="10.5" fill="#475569">非弹性散射贡献 EELS 信号，也是辐射损伤的元凶。被散射出光阑的电子并未消失——环形探测器上是暗场信号，</text>
  <text x="50" y="402" font-size="10.5" fill="#475569">能量色散系统里是谱学数据。</text>
  <rect x="710" y="132" width="660" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、弹性散射与 Mott 截面：三条趋势</text>
  <rect x="750" y="170" width="300" height="180" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="750" y1="350" x2="750" y2="356" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="372" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="900" y1="350" x2="900" y2="356" stroke="#475569" stroke-width="1.8"/>
  <text x="900" y="372" font-size="13" fill="#64748b" text-anchor="middle">中角</text>
  <line x1="1050" y1="350" x2="1050" y2="356" stroke="#475569" stroke-width="1.8"/>
  <text x="1050" y="372" font-size="13" fill="#64748b" text-anchor="middle">大角</text>
  <line x1="744" y1="170" x2="750" y2="170" stroke="#475569" stroke-width="1.8"/>
  <text x="740" y="174" font-size="13" fill="#64748b" text-anchor="end">强</text>
  <line x1="744" y1="350" x2="750" y2="350" stroke="#475569" stroke-width="1.8"/>
  <text x="740" y="354" font-size="13" fill="#64748b" text-anchor="end">弱</text>
  <text x="1000" y="372" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">散射角 θ</text>
  <text x="860" y="188" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">微分截面 dσ/dΩ（示意，对数纵轴）</text>
  <path d="M750,170 C754.0,182.0 765.0,222.2 774,242 C783.0,261.8 793.0,276.2 804,288.8 C815.0,301.4 826.5,310.1 840,317.6 C853.5,325.1 869.0,329.8 885,333.8 C901.0,337.9 918.5,339.9 936,341.9 C953.5,343.9 971.0,345.1 990,346.04 C1009.0,347.0 1040.0,347.5 1050,347.84" fill="none" stroke="#0369a1" stroke-width="2.6"/>
  <rect x="960" y="170" width="90" height="180" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1005" y="186" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700">HAADF 只收这里</text>
  <text x="1070" y="190" font-size="11" fill="#475569">· 随散射角增大急剧下降——前向为主</text>
  <text x="1070" y="214" font-size="11" fill="#475569">· 随原子序数按平方量级增长（Z 衬度的出处）</text>
  <text x="1070" y="246" font-size="11" fill="#475569">· 随电子速度（加速电压）增大而减小</text>
  <rect x="1070" y="262.075" width="298.70410000000004" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1219.35" y="274.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">Mott 截面（1929）：卢瑟福截面的相对论修正 + 电子自旋</text>
  <rect x="1070" y="294.075" width="260.27191600000003" height="17.849999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1200.13" y="306.78" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">成像毫弧度角上原子散射振幅约比 X 射线强 10<tspan dy="-3.6" font-size="7.6">3</tspan><tspan dy="3.6"> 倍</tspan></text>
  <text x="750" y="397" font-size="10.5" fill="#475569">极小晶体 + 远小于 X 射线的剂量即可拿到可用衍射强度（第 10 章电子晶体学与 MicroED 的资本）；</text>
  <text x="750" y="414" font-size="10.5" fill="#475569">氢碳氮氧的振幅彼此接近——生物样品自带内源性衬度。</text>
  <rect x="30" y="422" width="700" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="444.84" font-size="19" fill="#475569" font-weight="700">三、非弹性散射的三条通道：一张 EELS 谱</text>
  <rect x="70" y="470" width="630" height="170" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="70" y1="640" x2="70" y2="646" stroke="#475569" stroke-width="1.8"/>
  <text x="70" y="662" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="221.2" y1="640" x2="221.2" y2="646" stroke="#475569" stroke-width="1.8"/>
  <text x="221.2" y="662" font-size="13" fill="#64748b" text-anchor="middle">150</text>
  <line x1="372.4" y1="640" x2="372.4" y2="646" stroke="#475569" stroke-width="1.8"/>
  <text x="372.4" y="662" font-size="13" fill="#64748b" text-anchor="middle">300</text>
  <line x1="523.5999999999999" y1="640" x2="523.5999999999999" y2="646" stroke="#475569" stroke-width="1.8"/>
  <text x="523.5999999999999" y="662" font-size="13" fill="#64748b" text-anchor="middle">450</text>
  <line x1="674.8" y1="640" x2="674.8" y2="646" stroke="#475569" stroke-width="1.8"/>
  <text x="674.8" y="662" font-size="13" fill="#64748b" text-anchor="middle">600</text>
  <text x="385" y="684" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">能量损失 ΔE（eV）</text>
  <polygon points="70,640 77,470 85,640" fill="#0369a1" fill-opacity="0.85"/>
  <text x="100" y="486" font-size="10.5" fill="#075985" font-weight="700">零损失峰</text>
  <path d="M 88,640 C 96,548 108,548 118,640" fill="none" stroke="#d97706" stroke-width="2.2"/>
  <line x1="136" y1="574" x2="106" y2="596" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-warn)"/>
  <text x="142" y="572" font-size="10.5" fill="#92400e" font-weight="700">等离子体激发 10–25 eV</text>
  <path d="M 118,628 C 250,648 400,656 690,662" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M 348,638 L 354,604 L 388,630" fill="none" stroke="#be185d" stroke-width="2.2"/>
  <path d="M 465,636 L 471,596 L 506,624" fill="none" stroke="#be185d" stroke-width="2.2"/>
  <path d="M 596,634 L 602,590 L 638,618" fill="none" stroke="#be185d" stroke-width="2.2"/>
  <text x="354" y="588" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">C K 边 284 eV</text>
  <text x="471" y="580" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">N K 边 401 eV</text>
  <text x="602" y="566" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">O K 边 532 eV</text>
  <text x="50" y="700" font-size="10.5" fill="#475569">三通道：等离子体激发 10–25 eV（谱学测厚、价带分析）· 内壳层电离数十至上千 eV（特征边、元素成像的基石）· 声子激发低于 1 eV</text>
  <text x="50" y="715" font-size="10.5" fill="#475569">（轻微整体升温）。低 Z 生物材料中价电子激发占能量损失的大头、电离次之、声子只贡献尾部。</text>
  <rect x="710" y="422" width="620" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="444.84" font-size="19" fill="#475569" font-weight="700">四、平均自由程：样品厚度的物理红线</text>
  <text x="1020" y="460" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">100–300 kV 电子穿过低 Z 生物物质（蛋白质、玻璃冰）</text>
  <text x="770" y="610" font-size="9.5" fill="#64748b" text-anchor="middle">0</text>
  <text x="844.2857142857142" y="610" font-size="9.5" fill="#64748b" text-anchor="middle">50</text>
  <text x="918.5714285714286" y="610" font-size="9.5" fill="#64748b" text-anchor="middle">100</text>
  <text x="992.8571428571429" y="610" font-size="9.5" fill="#64748b" text-anchor="middle">150</text>
  <text x="1067.142857142857" y="610" font-size="9.5" fill="#64748b" text-anchor="middle">200</text>
  <text x="1141.4285714285716" y="610" font-size="9.5" fill="#64748b" text-anchor="middle">250</text>
  <text x="1215.7142857142858" y="610" font-size="9.5" fill="#64748b" text-anchor="middle">300</text>
  <text x="1290" y="610" font-size="9.5" fill="#64748b" text-anchor="middle">350</text>
  <line x1="770" y1="590" x2="1290" y2="590" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="844.2857142857142" y="486" width="148.57142857142867" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="778" y="501" font-size="11" fill="#991b1b" font-weight="700">非弹性 50–150 nm</text>
  <rect x="918.5714285714286" y="530" width="297.1428571428572" height="22" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="778" y="545" font-size="11" fill="#075985" font-weight="700">弹性 100–300 nm</text>
  <text x="1030" y="634" font-size="10.5" fill="#64748b" text-anchor="middle">平均自由程（nm）</text>
  <rect x="868.60085" y="659.075" width="262.79830000000004" height="17.849999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1000" y="671.78" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">非弹性/弹性截面之比约 20/Z：冰既「透」又「脏」</text>
  <text x="730" y="696" font-size="10.5" fill="#475569">300 kV 电子穿过 100 nm 冰：平均非弹性事件约 0.5–0.7 次——薄冰的统计学红利；穿 400 nm 则两三次，</text>
  <text x="730" y="711" font-size="10.5" fill="#475569">信噪与解释同时恶化。厚度逼近自由程，</text>
  <text x="730" y="726" font-size="10.5" fill="#475569">单次散射近似与弱相位物体近似双双失效——冷冻电镜把冰控制在约 100 nm 以内的物理根源。</text>
</svg>