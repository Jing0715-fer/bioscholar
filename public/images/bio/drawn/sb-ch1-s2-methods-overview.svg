  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">三大结构解析方法总览：X 射线晶体学 · 冷冻电镜 · 溶液 NMR</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">晶体学以10<tspan dy="-5.8" font-size="12.2">13</tspan><tspan dy="5.8">–10</tspan><tspan dy="-5.8" font-size="12.2">15</tspan><tspan dy="5.8">个分子的有序晶格放大信号、常规约1.0–2.5Å（纪录0.48Å）；冷冻电镜约100kDa起、2–3Å常规（最佳1.22Å）；NMR常规小于30–50kDa、TROSY</tspan></text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">加氘代至约100kDa，皮秒至秒动力学独有</text>
  <rect x="30" y="132" width="1340" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、六维对比：样品、分子量、分辨率、动态、周期与门槛</text>
  <rect x="50" y="172" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="199.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">维度</text>
  <rect x="190" y="172" width="392" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="386" y="199.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">X 射线晶体学</text>
  <rect x="582" y="172" width="384" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="774" y="199.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">冷冻电镜（单颗粒）</text>
  <rect x="966" y="172" width="384" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="199.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">溶液 NMR</text>
  <rect x="50" y="216" width="140" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="242.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">样品要求</text>
  <rect x="190" y="216" width="392" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="386" y="242.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">有序晶体：10<tspan dy="-4.3" font-size="9.0">13</tspan><tspan dy="4.3">–10</tspan><tspan dy="-4.3" font-size="9.0">15</tspan><tspan dy="4.3"> 个分子同相位散射</tspan></text>
  <rect x="582" y="216" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="774" y="242.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">玻璃化薄冰约 100 nm，无需晶体</text>
  <rect x="966" y="216" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="242.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500"><tspan dy="-4.3" font-size="9.0">15</tspan><tspan dy="4.3">N/</tspan><tspan dy="-4.3" font-size="9.0">13</tspan><tspan dy="4.3">C 双标记溶液，0.1–1 mM</tspan></text>
  <rect x="50" y="258" width="1300" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="258" width="140" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="284.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">适用分子量</text>
  <rect x="190" y="258" width="392" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="386" y="284.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">数 kDa 至数 MDa 无上限（50S 约 1.6 MDa，2000 年）</text>
  <rect x="582" y="258" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="774" y="284.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">约 100 kDa 起，大于 300 kDa 更可靠</text>
  <rect x="966" y="258" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="284.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">常规小于 30–50 kDa；TROSY 加氘代约 100 kDa</text>
  <rect x="50" y="300" width="140" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="326.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">常规分辨率</text>
  <rect x="190" y="300" width="392" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="386" y="326.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">约 1.0–2.5 Å；纪录 0.48 Å（crambin，46 残基）</text>
  <rect x="582" y="300" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="774" y="326.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">约 2–3 Å；最佳 1.22 Å（铁蛋白，2020）</text>
  <rect x="966" y="300" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="326.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">局部约束约 1–2 Å；约 15–20 构象的系综</text>
  <rect x="50" y="342" width="1300" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="342" width="140" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="368.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">动态信息</text>
  <rect x="190" y="342" width="392" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="386" y="368.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">晶格静态快照，可辅时间分辨串晶学</text>
  <rect x="582" y="342" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="774" y="368.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">构象异质性可分类、分别重构</text>
  <rect x="966" y="342" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="368.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">皮秒至秒动力学直接可测（三法独有）</text>
  <rect x="50" y="384" width="140" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="410.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">单个结构周期</text>
  <rect x="190" y="384" width="392" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="386" y="410.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">数天至数月（含结晶瓶颈）</text>
  <rect x="582" y="384" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="774" y="410.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">数天至数周</text>
  <rect x="966" y="384" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="410.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">数周至数月</text>
  <rect x="50" y="426" width="1300" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="426" width="140" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="452.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">门槛与成本</text>
  <rect x="190" y="426" width="392" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="386" y="452.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">同步辐射机时；实验室 Cu Kα 1.5418 Å</text>
  <rect x="582" y="426" width="384" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
