  <text x="726" y="700" font-size="10.5" fill="#475569">0.48 Å＝crambin 纪录；1.22 Å＝铁蛋白冷冻电镜最佳（2020）</text>
  <text x="726" y="714" font-size="10.5" fill="#475569">；1.2 Å 级电子密度可见氢原子、交替构象与半占据水。</text>
  <text x="1052" y="700" font-size="10.5" fill="#475569">3 Å：主链清晰、侧链细节受限；6 Å：仅辨螺旋轮廓；</text>
  <text x="1052" y="714" font-size="10.5" fill="#475569">冷冻电镜以 FSC＝0.143 为金标准；</text>
  <text x="1052" y="728" font-size="10.5" fill="#475569">3 Å 结构坐标误差约 0.3 Å 量级。</text>
  <rect x="30" y="770" width="1340" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="792.84" font-size="19" fill="#475569" font-weight="700">四、方法选择决策与当代互补实践</text>
  <rect x="73.67500000000001" y="800.65" width="162.64999999999998" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="155" y="813.96" font-size="11" fill="#075985" text-anchor="middle">小于 30 kDa → X 射线或 NMR</text>
  <rect x="307.925" y="800.65" width="168.14999999999998" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="392" y="813.96" font-size="11" fill="#831843" text-anchor="middle">大于 300 kDa → 冷冻电镜优先</text>
  <rect x="546.575" y="800.65" width="142.84999999999997" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="618" y="813.96" font-size="11" fill="#4c1d95" text-anchor="middle">要皮秒至秒动力学 → NMR</text>
  <rect x="776.155" y="800.65" width="191.69" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="872" y="813.96" font-size="11" fill="#134e4a" text-anchor="middle">追求 1.2 Å 级细节 → 高分辨 X 射线</text>
  <rect x="1067.305" y="800.65" width="155.39" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1145" y="813.96" font-size="11" fill="#78350f" text-anchor="middle">难结晶／膜蛋白 → 冷冻电镜</text>
  <text x="50" y="848" font-size="11" fill="#475569">PDB 存量（2024 年超 22 万条）约八成五来自 X 射线晶体学，溶液 NMR 约占不足一成，冷冻电镜条目增速居首；2013 年直接电子探测相机配合运动校正掀起「分辨率革命」——当年 TRPV1 通道即以 3.4 Å 刷新膜蛋白纪录。</text>
  <text x="50" y="884" font-size="11" fill="#475569">三法互补分工：小而稳定、能结晶的蛋白交给晶体学追求极限分辨率；大而难结晶、构象多样的复合物交给冷冻电镜；以动力学为核心问题的中小蛋白交给 NMR——「电镜看整体、晶体看口袋、NMR 看动态」。</text>
  <text x="50" y="920" font-size="11" fill="#475569">核糖体为典型接力：50S 与 30S 亚基晶体结构（2000 年前后）给出原子细节，70S 功能态系列由冷冻电镜接力补全；GPCR 家族中晶体结构（2011 年 β2 受体-抗体片段复合物）、冷冻电镜复合物与 NMR 构象动力学相互衔接。</text>
</svg>