  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">递质的鉴定标准与分类：四条判据、五大类与气体信使 NO</text>
  <text x="700" y="74" text-anchor="middle" font-size="14" fill="#64748b">鉴定四标准：突触前存在与合成、钙依赖释放、受体复现与拮抗剂取消、明确清除机制；五大类：乙酰胆碱/单胺/氨基酸（小清亮囊泡）、神经肽（大致密核心囊泡，需高频高钙）、气体信使（即制即用）；Dale</text>
  <text x="700" y="100" text-anchor="middle" font-size="14" fill="#64748b">原则：同一神经元各末梢释放同一组递质，快慢搭配按频率分级；NO经nNOS即制即放、以sGC-cGMP为受体通路（EDRF，1998诺奖），西地那非抑制PDE5、与硝酸酯合用有低血压风险</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、鉴定递质的四条标准</text>
  <rect x="60" y="190" width="290" height="130" rx="9" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.6"/>
  <text x="205" y="224" font-size="14.5" fill="#075985" text-anchor="middle" font-weight="700">① 突触前存在与合成</text>
  <text x="84" y="254" font-size="11.5" fill="#475569">突触前区内有递质前体与合成酶</text>
  <rect x="370" y="190" width="290" height="130" rx="9" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.6"/>
  <text x="515" y="224" font-size="14.5" fill="#075985" text-anchor="middle" font-weight="700">② 钙依赖的释放</text>
  <text x="394" y="254" font-size="11.5" fill="#475569">突触前 Ca²⁺ 内流触发量子化释放</text>
  <rect x="60" y="336" width="290" height="130" rx="9" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.6"/>
  <text x="205" y="370" font-size="14.5" fill="#075985" text-anchor="middle" font-weight="700">③ 受体复现与取消</text>
  <text x="84" y="400" font-size="11.5" fill="#475569">外源施加递质复现突触反应；特异拮抗剂取消之</text>
  <rect x="370" y="336" width="290" height="130" rx="9" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.6"/>
  <text x="515" y="370" font-size="14.5" fill="#075985" text-anchor="middle" font-weight="700">④ 明确的清除机制</text>
  <text x="394" y="400" font-size="11.5" fill="#475569">酶解、再摄取或扩散——信号必须能被关掉</text>
  <text x="60" y="492" font-size="11.5" fill="#475569">直到 1960 年代，主流仍怀疑哺乳动物中枢的快传递是否真用化学递质——理由是化学「太慢」，</text>
  <text x="60" y="508" font-size="11.5" fill="#475569">赶不上中枢突触的毫秒级延迟；四条标准正是这场争论沉淀的判据。</text>
  <rect x="720" y="132" width="650" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="736" y="154.84" font-size="19" fill="#475569" font-weight="700">二、递质的化学分类：五大类</text>
  <rect x="750" y="190" width="72" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="786" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">类别</text>
  <rect x="822" y="190" width="118" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="881" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">代表成员</text>
  <rect x="940" y="190" width="132" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1006" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">储存方式</text>
  <rect x="1072" y="190" width="128" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1136" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">受体类型</text>
  <rect x="1200" y="190" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">终止方式</text>
  <rect x="750" y="234" width="72" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="786" y="262.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">乙酰胆碱</text>
  <rect x="822" y="234" width="118" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="881" y="262.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">ACh</text>
  <rect x="940" y="234" width="132" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1006" y="262.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">小清亮囊泡</text>
  <rect x="1072" y="234" width="128" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1136" y="262.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">nAChR / mAChR</text>
  <rect x="1200" y="234" width="140" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="262.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">AChE 水解</text>
  <rect x="750" y="280" width="590" height="46" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="750" y="280" width="72" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="786" y="308.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">单胺</text>
  <rect x="822" y="280" width="118" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="881" y="308.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">DA · NE · 5-HT</text>
  <rect x="940" y="280" width="132" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1006" y="308.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">小清亮囊泡</text>
  <rect x="1072" y="280" width="128" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1136" y="308.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">GPCR</text>
  <rect x="1200" y="280" width="140" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="308.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">再摄取（转运体）</text>
  <rect x="750" y="326" width="72" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="786" y="354.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">氨基酸</text>
  <rect x="822" y="326" width="118" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="881" y="354.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">Glu · GABA · Gly</text>
  <rect x="940" y="326" width="132" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1006" y="354.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">小清亮囊泡</text>
  <rect x="1072" y="326" width="128" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1136" y="354.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">离子型 + GPCR</text>
  <rect x="1200" y="326" width="140" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="354.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">EAAT 摄取 / 扩散</text>
  <rect x="750" y="372" width="590" height="46" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="750" y="372" width="72" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="786" y="400.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">神经肽</text>
  <rect x="822" y="372" width="118" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="881" y="400.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">P 物质 · NPY 等</text>
  <rect x="940" y="372" width="132" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1006" y="400.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">大致密核心囊泡</text>
  <rect x="1072" y="372" width="128" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1136" y="400.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">GPCR</text>
  <rect x="1200" y="372" width="140" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="400.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">酶解（无再摄取）</text>
  <rect x="750" y="418" width="72" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="786" y="446.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">气体信使</text>
  <rect x="822" y="418" width="118" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="881" y="446.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">NO · CO</text>
  <rect x="940" y="418" width="132" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1006" y="446.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">不储存，即制即用</text>
  <rect x="1072" y="418" width="128" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1136" y="446.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">sGC（胞内）</text>
  <rect x="1200" y="418" width="140" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="446.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">扩散 + 代谢</text>
  <text x="750" y="486" font-size="11.5" fill="#475569">小清亮囊泡就近释放、快；大致密核心囊泡需高频高钙才释放——快慢搭配按活动频率分级动用。</text>
  <rect x="30" y="576" width="1340" height="402" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、Dale 原则的现代理解与 NO：即制即用的逆行信使</text>
  <text x="340" y="636" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Dale 原则：同一组递质</text>
  <circle cx="160" cy="760" r="30" fill="#ffffff" stroke="#1e293b" stroke-width="2.4"/>
  <circle cx="160" cy="760" r="11" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <line x1="190" y1="760" x2="400" y2="760" stroke="#1e293b" stroke-width="2.6"/>
  <rect x="220" y="748" width="32" height="24" rx="9" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <rect x="268" y="748" width="32" height="24" rx="9" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <rect x="316" y="748" width="32" height="24" rx="9" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <rect x="364" y="748" width="32" height="24" rx="9" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <path d="M400,760 q26,-32 46,-52" fill="none" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <path d="M400,760 q26,32 46,52" fill="none" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <ellipse cx="470" cy="700" rx="38" ry="20" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="470" cy="820" rx="38" ry="20" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <rect x="431.3875" y="650.225" width="77.225" height="19.55" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="470" y="664.14" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">同一组递质</text>
  <rect x="431.3875" y="852.225" width="77.225" height="19.55" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="470" y="866.14" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">同一组递质</text>
  <text x="160" y="812" font-size="11.5" fill="#475569" text-anchor="middle">胞体</text>
  <text x="60" y="900" font-size="11.5" fill="#475569">Dale（1935）原意：同一神经元的所有末梢释放同一组相同的递质；递质共存普遍——快递质装在小清亮囊泡、</text>
  <text x="60" y="916" font-size="11.5" fill="#475569">低频即释放，神经肽装在大致密核心囊泡、需高频高钙——按活动频率分级释放。</text>
  <text x="1030" y="636" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">NO：即制即用的气体信使</text>
  <rect x="720" y="656" width="240" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.5"/>
  <text x="840" y="684" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">突触前末梢：谷氨酸释放</text>
  <line x1="840" y1="702" x2="840" y2="728" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="720" y="732" width="240" height="56" rx="8" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.5"/>
  <text x="840" y="766" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">突触后：受体 → Ca²⁺ ↑</text>
  <line x1="960" y1="760" x2="994" y2="760" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="1005.6982" y="748.95" width="36.6036" height="22.099999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1024" y="764.68" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">NO</text>
  <line x1="1058" y1="760" x2="1082" y2="760" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="1086" y="732" width="264" height="56" rx="8" fill="#ede9fe" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1218" y="757" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">sGC → cGMP</text>
  <text x="1218" y="776" font-size="10.5" fill="#475569" text-anchor="middle">（NO 的受体通路）</text>
  <path d="M1016,778 C950,820 760,812 842,708" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-bad)"/>
  <text x="915" y="814" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">逆行弥散 · 不储存、即制即放</text>
  <rect x="720" y="836" width="630" height="96" rx="9" fill="#d1fae5" fill-opacity="0.35" stroke="#059669" stroke-width="1.5"/>
  <text x="740" y="862" font-size="13.5" fill="#065f46" font-weight="700">临床与药理</text>
  <text x="740" y="886" font-size="11.5" fill="#475569">NO 即「血管内皮衍生舒张因子」（EDRF）——为 Furchgott、Ignarro 与 Murad 赢得 1998 年诺贝尔奖；</text>
  <text x="740" y="902" font-size="11.5" fill="#475569">西地那非抑制 PDE5 延长 cGMP 信号，与硝酸酯合用有低血压风险。</text>
</svg>