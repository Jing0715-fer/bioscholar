  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">定量蛋白质组学：报告离子、DIA 窗口循环与三级工作流</text>
  <text x="700" y="74" text-anchor="middle" font-size="14" fill="#64748b">iTRAQ/TMT以报告基团-平衡基团的同量异位设计在MS1不可区分、碎裂后以报告离子强度比定量，共洗脱干扰造成比值压缩由SPS-MS3缓解；DIA把质量范围划成固定窗口（如每25Da一档）循环全碎，</text>
  <text x="700" y="100" text-anchor="middle" font-size="14" fill="#64748b">无随机遗漏可回溯重搜；发现（DDA）、全景定量（DIA）、靶向验证（MRM/PRM）构成三级工作流；AQUA重标肽段实现绝对定量；mRNA与蛋白相关性约0.4–0.6，翻译后缓冲层是两层互补整合的理由</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、iTRAQ / TMT：报告离子的同量异位设计</text>
  <text x="125" y="192" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">报告基团</text>
  <text x="240" y="192" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">平衡基团</text>
  <text x="392" y="192" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">肽段</text>
  <rect x="80" y="202" width="90" height="26" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="125" y="220" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">R126</text>
