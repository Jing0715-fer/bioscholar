  <text x="240" y="220" font-size="9.5" fill="#64748b" text-anchor="middle">补齐质量</text>
  <rect x="310" y="202" width="170" height="26" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
