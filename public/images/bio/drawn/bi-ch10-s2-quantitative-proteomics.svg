  <text x="125" y="316" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">R129</text>
  <rect x="170" y="298" width="140" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="240" y="316" font-size="9.5" fill="#64748b" text-anchor="middle">补齐质量</text>
