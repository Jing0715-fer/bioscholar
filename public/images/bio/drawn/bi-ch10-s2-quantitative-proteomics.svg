  <text x="1130" y="671" font-size="11" fill="#475569">约 0.4–0.6——翻译与翻译后</text>
  <text x="1130" y="686" font-size="11" fill="#475569">过程构成缓冲层。</text>
  <text x="1130" y="736" font-size="11" fill="#475569">这层缓冲正是两层互补整合的理由：</text>
  <text x="1130" y="751" font-size="11" fill="#475569">各答一问，合起来才见全貌。</text>
  <text x="930" y="948" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="600">读定量先读偏差：标签法的比值压缩、无标记法的缺失值、DIA 的嵌合谱。</text>
</svg>