  <text x="580" y="392" font-size="10" fill="#64748b" text-anchor="middle">129</text>
  <text x="540" y="412" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">MS2：报告离子强度比 → 定量</text>
  <text x="60" y="446" font-size="11.5" fill="#475569">多通道合并进样、互相校准提灵敏度；参照通道缝合多批次。主要代价：</text>
  <text x="60" y="462" font-size="11.5" fill="#475569">共洗脱干扰造成比值压缩——SPS-MS3 再碎裂是主流缓解方案。</text>
  <text x="60" y="496" font-size="11.5" fill="#64748b">同量异位的化学魔术：MS1 不可区分，碎裂后才以报告离子现形。</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、label-free 与 DIA：不受通道数约束的两条路</text>
  <text x="740" y="190" font-size="13" fill="#1e293b" font-weight="700">label-free 定量</text>
  <rect x="740" y="202" width="290" height="56" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.6"/>
  <text x="885" y="226" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">强度法</text>
  <text x="885" y="246" font-size="10.5" fill="#475569" text-anchor="middle">提取离子色谱（XIC）峰面积</text>
  <rect x="1050" y="202" width="290" height="56" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1195" y="226" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">谱计数法</text>
  <text x="1195" y="246" font-size="10.5" fill="#475569" text-anchor="middle">计数匹配到各蛋白的谱图数</text>
  <text x="740" y="284" font-size="11.5" fill="#475569">不受通道数限制，但对重现性要求苛刻；缺失值插补与中位数归一是统计上的两大功课。</text>
  <line x1="730" y1="330" x2="1360" y2="330" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="740" y="356" font-size="13" fill="#1e293b" font-weight="700">DIA / SWATH：数据非依赖采集</text>
  <rect x="740" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="790" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="840" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="890" y="372" width="50" height="22" rx="3" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <rect x="940" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="990" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1040" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1090" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1140" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1190" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1240" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1290" y="372" width="50" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="740" y="416" font-size="11.5" fill="#475569">把整个质量范围划成固定宽度窗口（如每 25 Da 一档），逐窗口依次碎裂、</text>
  <text x="740" y="432" font-size="11.5" fill="#475569">循环往复——每张二级谱都完整覆盖该窗口内全部母离子。</text>
  <text x="740" y="468" font-size="11.5" fill="#475569">无随机遗漏、数据可回溯重搜；代价是嵌合谱解卷积与谱图库——预测谱库使无库 DIA 渐成现实。</text>
  <rect x="30" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、三级工作流、载体通道与 AQUA 绝对定量</text>
  <rect x="60" y="618" width="180" height="58" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="150" y="641" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">发现 · DDA</text>
  <text x="150" y="661" font-size="10.5" fill="#475569" text-anchor="middle">挑母离子碎裂</text>
  <rect x="260" y="618" width="180" height="58" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="350" y="641" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">全景定量 · DIA</text>
  <text x="350" y="661" font-size="10.5" fill="#475569" text-anchor="middle">窗口循环全碎</text>
  <rect x="460" y="618" width="180" height="58" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="550" y="641" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">靶向验证 · MRM/PRM</text>
  <text x="550" y="661" font-size="10.5" fill="#475569" text-anchor="middle">预设母离子对</text>
  <line x1="240" y1="647" x2="260" y2="647" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="440" y1="647" x2="460" y2="647" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <text x="60" y="700" font-size="11.5" fill="#475569">发现（DDA）、全景定量（DIA）、靶向验证（MRM / PRM）构成蛋白质组学的三级工作流；</text>
  <text x="60" y="716" font-size="11.5" fill="#475569">载体通道以大剂量同量异位载体放大信号，支撑单细胞蛋白质组。</text>
  <text x="60" y="782" font-size="13" fill="#1e293b" font-weight="700">AQUA 重标肽段：绝对定量的口径</text>
  <line x1="80" y1="930" x2="350" y2="930" stroke="#475569" stroke-width="1.6"/>
  <line x1="150" y1="930" x2="150" y2="878" stroke="#0f766e" stroke-width="2.6"/>
  <circle cx="150" cy="878" r="3.5" fill="#0f766e"/>
  <line x1="225" y1="930" x2="225" y2="864" stroke="#be185d" stroke-width="2.6"/>
  <circle cx="225" cy="864" r="3.5" fill="#be185d"/>
  <text x="150" y="948" font-size="10" fill="#134e4a" text-anchor="middle">内源轻肽</text>
  <text x="225" y="948" font-size="10" fill="#831843" text-anchor="middle">重标内标</text>
  <text x="380" y="812" font-size="11" fill="#475569">合成同位素重标肽段作内标：与内源肽共洗脱、</text>
  <text x="380" y="827" font-size="11" fill="#475569">同步离子化——峰面积比 × 已知内标量，</text>
  <text x="380" y="842" font-size="11" fill="#475569">把靶向定量推向绝对口径。</text>
  <rect x="710" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
