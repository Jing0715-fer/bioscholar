<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">微生物与人类：从瘟疫到文明</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">黑死病（1347–1351）夺走欧洲约 1/3 人口；1918 大流感感染约 5 亿、死亡 5000 万–1 亿；而发酵食品、抗生素与环境治理反向造福文明</text>
  <rect x="30" y="132" width="1340" height="316" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、改写人类历史的三大流行病（1347–1992）</text>
  <line x1="110" y1="296" x2="1330" y2="296" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="146.6" cy="296" r="6.5" fill="#dc2626"/>
  <line x1="146.6" y1="287" x2="146.6" y2="266" stroke="#dc2626" stroke-width="1.7"/>
  <text x="146.6" y="246" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1347–1351 黑死病</text>
  <text x="146.6" y="226" font-size="12" fill="#64748b" text-anchor="middle">鼠疫耶尔森氏菌·欧洲约 1/3 人口</text>
  <circle cx="476" cy="296" r="6.5" fill="#dc2626"/>
  <line x1="476" y1="305" x2="476" y2="326" stroke="#dc2626" stroke-width="1.7"/>
  <text x="476" y="346" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1817 霍乱大流行开始</text>
  <text x="476" y="366" font-size="12" fill="#64748b" text-anchor="middle">O1 群霍乱弧菌·水路与贸易网络</text>
  <circle cx="622.4" cy="296" r="6.5" fill="#0369a1"/>
  <line x1="622.4" y1="287" x2="622.4" y2="266" stroke="#0369a1" stroke-width="1.7"/>
  <text x="622.4" y="246" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1854 宽街水泵事件</text>
  <text x="622.4" y="226" font-size="12" fill="#64748b" text-anchor="middle">斯诺统计地图锁定水源——流行病学开山之作</text>
  <circle cx="781" cy="296" r="6.5" fill="#0f766e"/>
  <line x1="781" y1="305" x2="781" y2="326" stroke="#0f766e" stroke-width="1.7"/>
  <text x="781" y="346" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1894 香港分离鼠疫菌</text>
  <text x="781" y="366" font-size="12" fill="#64748b" text-anchor="middle">北里柴三郎与耶尔森先后分离病原</text>
  <circle cx="939.6" cy="296" r="6.5" fill="#dc2626"/>
  <line x1="939.6" y1="287" x2="939.6" y2="266" stroke="#dc2626" stroke-width="1.7"/>
  <text x="939.6" y="246" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1918 大流感（H1N1）</text>
  <text x="939.6" y="226" font-size="12" fill="#64748b" text-anchor="middle">感染约 5 亿·死亡 5000 万–1 亿</text>
  <circle cx="1110.4" cy="296" r="6.5" fill="#dc2626"/>
  <line x1="1110.4" y1="305" x2="1110.4" y2="326" stroke="#dc2626" stroke-width="1.7"/>
  <text x="1110.4" y="346" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1961 第七次霍乱</text>
  <text x="1110.4" y="366" font-size="12" fill="#64748b" text-anchor="middle">埃尔托生物型</text>
  <circle cx="1256.8" cy="296" r="6.5" fill="#d97706"/>
  <line x1="1256.8" y1="287" x2="1256.8" y2="266" stroke="#d97706" stroke-width="1.7"/>
  <text x="1256.8" y="246" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1992 O139 新株</text>
  <text x="1256.8" y="226" font-size="12" fill="#64748b" text-anchor="middle">霍乱弧菌新血清群</text>
  <text x="700" y="418" font-size="11.5" fill="#64748b" text-anchor="middle">1918 大流感死亡数（5000 万–1 亿）远超第一次世界大战直接死于战火的总数；黑死病深刻重塑了欧洲的社会结构与经济关系</text>
  <rect x="30" y="468" width="1340" height="512" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="490.84" font-size="19" fill="#475569" font-weight="700">二、造福文明：发酵食品、抗生素、发酵工业与环境治理四大支柱</text>
  <rect x="50" y="516" width="395" height="150" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="68" y="546" font-size="14.5" fill="#78350f" font-weight="700">① 发酵食品文明</text>
  <text x="68" y="574" font-size="12" fill="#475569">数千年的酿酒、</text>
  <text x="68" y="593" font-size="12" fill="#475569">制酱与乳制品实践——史前期即已「知其然」的自觉应用，</text>
  <text x="68" y="612" font-size="12" fill="#475569">支撑起定居文明的餐桌。</text>
  <rect x="465" y="516" width="395" height="150" rx="9" fill="#ffffff" stroke="#be185d" stroke-width="1.6"/>
  <text x="483" y="546" font-size="14.5" fill="#831843" font-weight="700">② 抗生素时代</text>
  <text x="483" y="574" font-size="12" fill="#475569">1928 年弗莱明发现青霉素，</text>
  <text x="483" y="593" font-size="12" fill="#475569">开启抗生素时代——人类首次系统性地战胜细菌感染。</text>
  <rect x="50" y="686" width="395" height="150" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="68" y="716" font-size="14.5" fill="#075985" font-weight="700">③ 氨基酸·维生素·酶制剂工业</text>
  <text x="68" y="744" font-size="12" fill="#475569">工业发酵的三大产品线：氨基酸、</text>
  <text x="68" y="763" font-size="12" fill="#475569">维生素与酶制剂——医药与食品工业的重要支柱。</text>
  <rect x="465" y="686" width="395" height="150" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
  <text x="483" y="716" font-size="14.5" fill="#059669" font-weight="700">④ 环境治理</text>
  <text x="483" y="744" font-size="12" fill="#475569">活性污泥法净化污水；生物修复（bioremediation）</text>
  <text x="483" y="763" font-size="12" fill="#475569">降解土壤与水体中的污染物。</text>
  <rect x="50" y="856" width="400" height="108" rx="9" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-width="1.5"/>
  <text x="68" y="884" font-size="13.5" fill="#075985" font-weight="700">⑤ 基因工程工具箱</text>
  <text x="68" y="906" font-size="11.5" fill="#475569">限制酶、Taq 聚合酶、</text>
  <text x="68" y="923" font-size="11.5" fill="#475569">载体与表达宿主皆取自微生物——1982 年重组人胰岛素为标志成果。</text>
  <rect x="460" y="856" width="400" height="108" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.5"/>
  <text x="478" y="884" font-size="13.5" fill="#dc2626" font-weight="700">有害面：餐桌上的威胁</text>
  <text x="478" y="906" font-size="11" fill="#475569">沙门氏菌（禽蛋肉制品）· 金葡菌耐热肠毒素（久置糕点）· 肉毒毒素</text>
  <text x="478" y="922" font-size="11" fill="#475569">（厌氧罐头，已知毒性最强的生物毒素之一）</text>
  <rect x="880" y="516" width="460" height="448" rx="10" fill="#ede9fe" fill-opacity="0.3" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="898" y="546" font-size="15" fill="#4c1d95" font-weight="700">人体微生物组：看不见的「器官」</text>
  <circle cx="1010" cy="588" r="22" fill="#f1f5f9" stroke="#475569" stroke-width="2.2"/>
  <rect x="982" y="614" width="56" height="92" rx="24" fill="#f1f5f9" stroke="#475569" stroke-width="2.2"/>
  <ellipse cx="1010" cy="660" rx="17" ry="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <circle cx="975" cy="622" r="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <circle cx="1046" cy="636" r="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <circle cx="988" cy="694" r="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <circle cx="1032" cy="702" r="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <circle cx="967" cy="664" r="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <circle cx="1052" cy="672" r="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="1145" y="640" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">皮肤·口腔·肠道等</text>
  <text x="1145" y="660" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">黏膜表面定殖菌群</text>
  <rect x="900" y="756" width="420" height="54" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="916" y="780" font-size="13.5" fill="#4c1d95" font-weight="700">细菌数 : 人体自身细胞数 ≈ 1.3 : 1</text>
  <text x="916" y="799" font-size="10.5" fill="#64748b">经重估两者为同一数量级（旧估「10:1」已被修正）</text>
  <rect x="900" y="818" width="420" height="54" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="916" y="842" font-size="13.5" fill="#4c1d95" font-weight="700">肠道宏基因组 ≈ 人基因组的 100 倍以上</text>
  <text x="916" y="861" font-size="10.5" fill="#64748b">——人体的「第二基因组」</text>
  <rect x="900" y="880" width="420" height="54" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="916" y="904" font-size="13.5" fill="#4c1d95" font-weight="700">参与营养消化、免疫训练与代谢调节</text>
  <text x="916" y="923" font-size="10.5" fill="#64748b">——被称为「看不见的器官」</text>
</svg>