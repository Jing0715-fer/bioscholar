  <line x1="238" y1="262" x2="238" y2="283" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="238" y="296" font-size="10" fill="#475569" text-anchor="middle">锤骨</text>
  <line x1="282" y1="262" x2="282" y2="283" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="282" y="296" font-size="10" fill="#475569" text-anchor="middle">砧骨</text>
  <line x1="322" y1="262" x2="322" y2="283" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="322" y="296" font-size="10" fill="#475569" text-anchor="middle">镫骨</text>
  <rect x="250.43599999999998" y="321.075" width="139.12800000000001" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="320" y="333.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">听骨链杠杆增压约 1.3 倍</text>
  <rect x="444" y="200" width="150" height="140" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <circle cx="519" cy="268" r="40" fill="none" stroke="#0369a1" stroke-width="1.8"/>
  <circle cx="519" cy="268" r="26" fill="none" stroke="#0369a1" stroke-width="1.6"/>
  <circle cx="519" cy="268" r="12" fill="none" stroke="#0369a1" stroke-width="1.4"/>
  <text x="519" y="214" font-size="10.5" fill="#475569" text-anchor="middle">耳蜗（含淋巴液）</text>
  <ellipse cx="444" cy="248" rx="6" ry="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="470" y="236" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">卵圆窗</text>
  <ellipse cx="444" cy="300" rx="6" ry="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="480" y="320" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">圆窗（压力释放）</text>
  <polyline points="330,346 372,372 400,388" fill="none" stroke="#475569" stroke-width="5"/>
  <text x="408" y="390" font-size="10.5" fill="#475569">咽鼓管（平衡气压）</text>
  <rect x="57.25828799999999" y="458.65" width="365.483424" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="240" y="471.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">总增压 = 面积比约 17:1（55 mm<tspan dy="-3.7" font-size="7.9">2</tspan><tspan dy="3.7">:3.2 mm</tspan><tspan dy="-3.7" font-size="7.9">2</tspan><tspan dy="3.7">）× 杠杆比约 1.3 ≈ 22 倍</tspan></text>
  <text x="50" y="516" font-size="10.5" fill="#475569">鼓膜-听骨链把空气与耳蜗液体间约 4000 倍的阻抗差匹配起来、避免反射损失；咽鼓管平衡中耳气压，防止鼓膜内陷</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、耳蜗剖面与基底膜行波（tonotopy）</text>
  <rect x="740" y="200" width="590" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1035" y="226" font-size="10.5" fill="#075985" text-anchor="middle">前庭阶（外淋巴，含 Na<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6">）</tspan></text>
  <rect x="740" y="250" width="590" height="40" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1035" y="274" font-size="10.5" fill="#134e4a" text-anchor="middle">蜗管中阶（内淋巴高 K<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6">，+80 mV）</tspan></text>
  <polygon points="742,293 1328,289 1328,301 742,299" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="740" y="306" width="590" height="40" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1080" y="330" font-size="10.5" fill="#475569" text-anchor="middle">鼓阶（外淋巴）</text>
  <ellipse cx="740" cy="222" rx="7" ry="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="762" y="190" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">卵圆窗</text>
  <ellipse cx="740" cy="326" rx="7" ry="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="800" y="330" font-size="10" fill="#065f46" text-anchor="middle">圆窗</text>
  <circle cx="1332" cy="273" r="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <text x="1332" y="190" font-size="10" fill="#475569" text-anchor="middle">蜗孔</text>
  <path d="M742,290 C780,286 800,258 830,258 C860,258 880,284 920,290" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <path d="M980,290 C1050,286 1150,250 1250,250 C1300,250 1320,278 1330,286" fill="none" stroke="#0f766e" stroke-width="2.2"/>
  <text x="815" y="244" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">高频：峰值在基部（窄而硬）</text>
  <text x="1190" y="244" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">低频：峰值在顶部（宽而软）</text>
  <text x="742" y="356" font-size="10.5" fill="#475569">基部：基底膜窄而硬 → 感受高频（至 20 kHz）</text>
  <text x="742" y="382" font-size="10.5" fill="#475569">顶部：基底膜宽而软 → 感受低频（至 20 Hz）——频率沿膜定位（tonotopy）</text>
  <text x="742" y="420" font-size="10.5" fill="#475569">行波由卵圆窗驱动、自基部向顶部传播，幅度在其共振点骤增并随即衰减；</text>
  <text x="742" y="438" font-size="10.5" fill="#475569">每个频率都有特征峰值位置——耳蜗的机械傅里叶分析</text>
  <text x="742" y="466" font-size="10.5" fill="#475569">基底膜振动 → 毛细胞顶部的静纤毛与盖膜发生相对位移（剪切运动）→ 机械-电换能（见左下图）</text>
  <rect x="30" y="572" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、毛细胞机械-电换能</text>
