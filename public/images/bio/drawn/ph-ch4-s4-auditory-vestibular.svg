  <path d="M105,606 Q175,572 245,606" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="250" y="588" font-size="10.5" fill="#4c1d95" font-weight="700">盖膜</text>
  <line x1="160" y1="594" x2="220" y2="598" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <text x="262" y="616" font-size="10.5" fill="#075985" font-weight="700">偏向最长静纤毛 → 通道开放</text>
  <rect x="440.2564" y="630.65" width="129.48720000000003" height="18.7" rx="7" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="505" y="643.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">① 静纤毛向最长侧偏转</text>
  <line x1="505" y1="652" x2="505" y2="661" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-mute)"/>
  <rect x="425.332524" y="662.65" width="159.33495200000002" height="18.7" rx="7" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="505" y="675.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">② 顶端机械门控 K<tspan dy="-3.7" font-size="7.9">+</tspan><tspan dy="3.7"> 通道开放</tspan></text>
  <line x1="505" y1="684" x2="505" y2="693" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-mute)"/>
  <rect x="397.85727399999996" y="694.65" width="214.28545200000002" height="18.7" rx="7" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="505" y="707.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">③ K<tspan dy="-3.7" font-size="7.9">+</tspan><tspan dy="3.7"> 内流（内淋巴电位驱动）→ 去极化</tspan></text>
  <line x1="505" y1="716" x2="505" y2="725" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-mute)"/>
  <rect x="419.857868" y="726.65" width="170.284264" height="18.7" rx="7" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="505" y="739.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">④ 底侧电压门控 Ca<tspan dy="-3.7" font-size="7.9">2+</tspan><tspan dy="3.7"> 通道开放</tspan></text>
  <line x1="505" y1="748" x2="505" y2="757" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-mute)"/>
  <rect x="425.1875" y="758.65" width="159.625" height="18.7" rx="7" fill="#d1fae5" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="505" y="771.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">⑤ 谷氨酸胞吐 → 传入放电 ↑</text>
  <line x1="175" y1="852" x2="175" y2="884" stroke="#be185d" stroke-width="1.8" marker-end="url(#arr-enz)"/>
  <line x1="200" y1="880" x2="200" y2="866" stroke="#be185d" stroke-width="1.6"/>
  <line x1="216" y1="880" x2="216" y2="866" stroke="#be185d" stroke-width="1.6"/>
  <line x1="232" y1="880" x2="232" y2="866" stroke="#be185d" stroke-width="1.6"/>
  <line x1="248" y1="880" x2="248" y2="866" stroke="#be185d" stroke-width="1.6"/>
  <line x1="264" y1="880" x2="264" y2="866" stroke="#be185d" stroke-width="1.6"/>
  <text x="196" y="902" font-size="10.5" fill="#831843">传入放电</text>
  <text x="120" y="930" font-size="10.5" fill="#475569">内毛细胞 1 排：约 95% 传入纤维（听觉信息主通道）；外毛细胞 3 排：prestin 电能动性主动放大行波</text>
  <text x="120" y="948" font-size="10.5" fill="#475569">（耳声发射的来源）</text>
  <rect x="710" y="572" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、前庭器官与听觉频率范围</text>
  <text x="850" y="648" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">三半规管（感知角加速度）</text>
  <ellipse cx="830" cy="690" rx="24" ry="38" fill="none" stroke="#0369a1" stroke-width="2"/>
  <ellipse cx="874" cy="690" rx="24" ry="38" fill="none" stroke="#0369a1" stroke-width="2"/>
  <ellipse cx="852" cy="732" rx="44" ry="16" fill="none" stroke="#0369a1" stroke-width="2"/>
  <ellipse cx="852" cy="692" rx="16" ry="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <rect x="960" y="660" width="70" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
  <path d="M975,725 L975,700 Q995,688 1015,700 L1015,725" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <path d="M975,700 Q995,655 1015,700" fill="#ede9fe" fill-opacity="0.8" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="995" y="748" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">壶腹嵴（杯嵴）</text>
  <text x="960" y="770" font-size="10" fill="#64748b">内淋巴流动 → 嵴偏斜</text>
  <rect x="760" y="760" width="90" height="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="765" cy="755" r="2.5" fill="#d97706"/>
  <circle cx="775" cy="755" r="2.5" fill="#d97706"/>
  <circle cx="785" cy="755" r="2.5" fill="#d97706"/>
  <circle cx="795" cy="755" r="2.5" fill="#d97706"/>
  <circle cx="805" cy="755" r="2.5" fill="#d97706"/>
  <circle cx="815" cy="755" r="2.5" fill="#d97706"/>
  <circle cx="825" cy="755" r="2.5" fill="#d97706"/>
  <circle cx="835" cy="755" r="2.5" fill="#d97706"/>
  <circle cx="845" cy="755" r="2.5" fill="#d97706"/>
  <text x="805" y="800" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">椭圆囊/球囊斑（耳石器）</text>
  <text x="805" y="820" font-size="10" fill="#475569" text-anchor="middle">感知直线加速度与重力（头位）</text>
  <text x="1080" y="656" font-size="10.5" fill="#475569">半规管三管互成直角：</text>
  <text x="1080" y="674" font-size="10.5" fill="#475569">角加速度使内淋巴滞后流动 → 壶腹嵴偏斜 → 毛细胞换能；</text>
  <text x="1080" y="692" font-size="10.5" fill="#475569">旋转同侧兴奋、对侧抑制</text>
  <text x="1080" y="760" font-size="10.5" fill="#475569">耳石器：耳石（碳酸钙结晶）</text>
  <text x="1080" y="778" font-size="10.5" fill="#475569">的惯性使毛细胞受力方向改变 → 感受重力与直线加速度</text>
  <text x="740" y="866" font-size="10.5" fill="#475569">人耳可听 20 Hz–20 kHz；听阈最低（最敏感）区约 1–4 kHz</text>
  <rect x="971.297947614284" y="878" width="196.66666666666663" height="22" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="1069.6312809476174" y="893" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">语言频带 0.3–3 kHz</text>
  <line x1="740" y1="900" x2="1330" y2="900" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
