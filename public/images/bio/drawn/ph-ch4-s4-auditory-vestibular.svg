  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">听觉与前庭：传声增压、行波换能与平衡</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">鼓膜-听骨链杠杆增压约22倍（面积比17:1×杠杆比1.3）；高频行波峰值在基底膜基部、低频在顶部；内毛细胞承接约95%传入纤维；人耳可听20Hz–20kHz</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、传声链：外耳道 → 鼓膜 → 听骨链 → 卵圆窗</text>
  <text x="70" y="214" font-size="10.5" fill="#92400e" text-anchor="middle">声波</text>
  <path d="M 74,234 a 10 30 0 0 1 0 68" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <path d="M 85,234 a 15 40 0 0 1 0 88" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <path d="M 96,234 a 20 50 0 0 1 0 108" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <polygon points="92,224 190,238 190,302 92,316" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="150" y="208" font-size="10.5" fill="#475569" text-anchor="middle">外耳道（集音）</text>
  <ellipse cx="196" cy="270" rx="8" ry="42" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="196" y="330" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">鼓膜</text>
  <rect x="214" y="196" width="220" height="150" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="324" y="186" font-size="10.5" fill="#475569" text-anchor="middle">鼓室（中耳腔，含气）</text>
  <circle cx="238" cy="252" r="8" fill="#64748b"/>
  <line x1="238" y1="260" x2="200" y2="268" stroke="#1e293b" stroke-width="2.4"/>
  <line x1="246" y1="252" x2="274" y2="251" stroke="#1e293b" stroke-width="2"/>
  <circle cx="282" cy="250" r="8" fill="#64748b"/>
  <line x1="290" y1="251" x2="316" y2="254" stroke="#1e293b" stroke-width="2"/>
