  <line x1="120" y1="740" x2="120" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="390" y="788" font-size="14" fill="#475569" text-anchor="middle" font-weight="600">φ（°）</text>
  <text x="86" y="460" font-size="14" fill="#475569" text-anchor="end" font-weight="600">ψ（°）</text>
  <rect x="382" y="181.8" width="11" height="8.4" rx="3" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="401" y="189.6" font-size="10" fill="#475569">favored 最优势区</text>
  <rect x="502.6" y="181.8" width="11" height="8.4" rx="3" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1"/>
  <text x="521.6" y="189.6" font-size="10" fill="#475569">allowed 边缘许可</text>
  <text x="60" y="830" font-size="10.5" fill="#475569">1963 年 Ramachandran、Ramakrishnan 与 Sasisekharan 以硬球排斥模型算出主链二面角允许范围；现代三区轮廓由 MolProbity 以高质量结构</text>
  <text x="60" y="845" font-size="10.5" fill="#475569">（约 1.8 Å 以内、数万残基）的统计划定。行业惯例：outlier 占比低于 0.5% 才算合格，优秀结构 favored 不低于 98% 且 outlier 为零。</text>
  <text x="60" y="892" font-size="10.5" fill="#64748b">outlier 不是「扣分项」而是「传唤」——每一个都须当面解释：真实的应变构象、功能相关的扭曲，或建模错误。</text>
  <text x="60" y="907" font-size="10.5" fill="#64748b">落在活性位点应变区且有文献佐证的可以保留；落在环区且密度平庸的先修后审。</text>
  <rect x="790" y="132" width="580" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="806" y="154.84" font-size="19" fill="#475569" font-weight="700">二、几何验证阈值速查</text>
  <rect x="810" y="220" width="168" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="894" y="247.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">指标</text>
  <rect x="978" y="220" width="212" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1084" y="247.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">合格阈值</text>
  <rect x="1190" y="220" width="160" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="247.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">工具</text>
  <rect x="810" y="264" width="168" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="894" y="285.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">Ramachandran outlier</text>
  <rect x="978" y="264" width="212" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1084" y="285.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">低于 0.5%（favored≥98%）</text>
  <rect x="1190" y="264" width="160" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="285.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">MolProbity</text>
  <rect x="810" y="296" width="540" height="32" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="810" y="296" width="168" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="894" y="317.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">rotamer outlier</text>
  <rect x="978" y="296" width="212" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1084" y="317.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">低于 1%</text>
  <rect x="1190" y="296" width="160" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="317.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">MolProbity</text>
  <rect x="810" y="328" width="168" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="894" y="349.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">clashscore</text>
  <rect x="978" y="328" width="212" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1084" y="349.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">低于 5（每千原子）</text>
  <rect x="1190" y="328" width="160" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="349.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">MolProbity＋Reduce</text>
  <rect x="810" y="360" width="540" height="32" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="810" y="360" width="168" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="894" y="381.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">C<tspan dy="2.5" font-size="8.3">β</tspan><tspan dy="-2.5"> 偏离</tspan></text>
  <rect x="978" y="360" width="212" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1084" y="381.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">低于 0.25 Å</text>
  <rect x="1190" y="360" width="160" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="381.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">MolProbity</text>
  <rect x="810" y="392" width="168" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="894" y="413.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">几何 rmsZ</text>
  <rect x="978" y="392" width="212" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1084" y="413.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">约 1（0.8–1.5 可接受）</text>
  <rect x="1190" y="392" width="160" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="413.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">phenix／REFMAC</text>
  <rect x="810" y="424" width="540" height="32" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="810" y="424" width="168" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="894" y="445.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">ω 平面偏离</text>
  <rect x="978" y="424" width="212" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1084" y="445.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">低于约 15°</text>
  <rect x="1190" y="424" width="160" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1270" y="445.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">验证报告</text>
  <text x="810" y="470" font-size="10" fill="#475569">rotamer 库为 Lovell 等 2000 年完备库；clashscore＝每一千个原子的严重冲突数（原子对重叠不低于 0.4 Å），</text>
  <text x="810" y="484" font-size="10" fill="#475569">好结构低于 5——不加氢的重原子检查会放过半数立体化学灾难，「全原子」三个字的分量正在于此。</text>
  <rect x="790" y="532" width="580" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="806" y="554.84" font-size="19" fill="#475569" font-weight="700">三、特殊残基轮廓与低分辨率哲学</text>
  <rect x="804.2980239999999" y="574.65" width="151.403952" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="880" y="587.96" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">Gly：无 C<tspan dy="2.4" font-size="7.9">β</tspan><tspan dy="-2.4">，四象限皆可及</tspan></text>
  <rect x="1049.4485" y="574.65" width="121.103" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1110" y="587.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">Pro：φ 锁于约 −60°</text>
  <rect x="903.1629" y="618.65" width="173.67419999999998" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="990" y="631.96" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">pre-Pro：被环推挤、自成一区</text>
  <text x="810" y="670" font-size="10.5" fill="#475569">验证程序对这三类残基自动换用各自轮廓——不换则误报成灾。C<tspan dy="2.3" font-size="7.6">β</tspan><tspan dy="-2.3"> 偏离检验尤灵敏：C</tspan><tspan dy="2.3" font-size="7.6">β</tspan><tspan dy="-2.3"> 的理想位置由 N、CA、</tspan></text>
  <text x="810" y="685" font-size="10.5" fill="#475569">C 三原子几何唯一决定（零自由度），主链 φ/ψ 一错或手性一翻，C<tspan dy="2.3" font-size="7.6">β</tspan><tspan dy="-2.3"> 立刻偏离——一处报警、</tspan></text>
  <text x="810" y="700" font-size="10.5" fill="#475569">多处病灶的「无自由度证人」；手性体积（三条键矢量的混合积）核查 Ile 与 Thr 的 C<tspan dy="2.3" font-size="7.6">β</tspan><tspan dy="-2.3"> 手性及主链 CA 构型。</tspan></text>
  <text x="810" y="762" font-size="10.5" fill="#64748b">低分辨率分层：群体指标（平均键长偏差、整体 clashscore）随分辨率放宽是物理现实——看趋势即可；</text>
  <text x="810" y="777" font-size="10.5" fill="#64748b">但个别 outlier 不在宽容之列——Ramachandran 禁区就是禁区、C<tspan dy="2.3" font-size="7.6">β</tspan><tspan dy="-2.3"> 偏 0.4 Å 就是事故。宽容是物理的，</tspan></text>
  <text x="810" y="792" font-size="10.5" fill="#64748b">是非是化学的。</text>
  <text x="810" y="838" font-size="10.5" fill="#475569">验证实战顺序：先跑几何全套（clashscore、Ramachandran、rotamer），红条目按严重度排队；</text>
  <text x="810" y="853" font-size="10.5" fill="#475569">再开双图逐个现场复核（报警处密度是否支持「真实应变」的辩护）；</text>
  <text x="810" y="868" font-size="10.5" fill="#475569">修复重新精修一轮再验——修几何的动作本身可能制造新的 clash，验证是循环而非清单。</text>
  <text x="1080" y="932" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">MolProbity 三鼎：Ramachandran · rotamer · clashscore</text>
</svg>