  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">Ramachandran 图：主链二面角的三区审判台</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">favored／allowed／outlier三区判定，outlier＜0.5%为行业惯例（优秀结构favored≥98%）；Gly无C<tspan dy="3.7" font-size="12.2">β</tspan><tspan dy="-3.7">四象限皆可及、Pro的φ锁于约−60°、pre-Pro自成一区；β／α</tspan><tspan dy="3.7" font-size="12.2">R</tspan><tspan dy="-3.7">／α</tspan><tspan dy="3.7" font-size="12.2">L</tspan></text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">典型区块与红叉outlier</text>
