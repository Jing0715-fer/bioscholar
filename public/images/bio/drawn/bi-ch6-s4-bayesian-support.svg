  <text x="758" y="522" font-size="11.5" fill="#065f46">惯例：不低于 70% 视为可接受（严格场合取 80% 或 95%）；UFBoot 把成本大幅降低。</text>
  <text x="740" y="296" font-size="11.5" fill="#1e293b" font-weight="700">位点重抽：以数据自身的扰动</text>
