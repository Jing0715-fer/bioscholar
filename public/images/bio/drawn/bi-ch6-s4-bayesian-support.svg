  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">贝叶斯推断与树的评估：MCMC、自展与长枝吸引</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">贝叶斯输出树与参数的后验分布，分支后验概率即采样树中含该分支的比例，MCMC须老化、多链并行并核查ESS高于200；自展以位点重抽度量信号稳健度、不低于70%</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">为可接受惯例、UFBoot大幅降本；长枝吸引把快演化谱系虚假拉拢（Felsenstein1978）；分歧时间靠化石定标与宽松钟</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、贝叶斯推断：后验即答案</text>
  <rect x="60" y="186" width="580" height="100" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="350" y="214" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">后验 ∝ 似然 × 先验</text>
  <text x="350" y="240" font-size="11.5" fill="#475569" text-anchor="middle">输出树与参数的后验分布；分支后验概率 = 采样树中含该分支的比例</text>
  <text x="350" y="266" font-size="11.5" fill="#64748b" text-anchor="middle">MCMC 以「提议—接受」采样逼近后验（MrBayes / BEAST 等实现）</text>
