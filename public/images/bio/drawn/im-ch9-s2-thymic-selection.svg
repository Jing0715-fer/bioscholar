  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">T 细胞在胸腺的发育与选择：β 选择、阳性选择与阴性选择</text>
  <text x="700" y="74" text-anchor="middle" font-size="15" fill="#64748b">T细胞经DN（CD4⁻CD8⁻）至DP（CD4⁺CD8⁺）推进，TCRβ重排成功引发β选择与等位基因排除；阳性选择以适当低亲和力自身肽-MHC识别赋予存活信号、自身MHC限制性与CD4/CD8谱系定向，</text>
  <text x="700" y="100" text-anchor="middle" font-size="15" fill="#64748b">阴性选择删除高亲和力自身反应克隆（或分流为tTreg）；约95%以上胸腺细胞死于选择，仅百分之几输出外周；AIRE驱动mTEC异位表达组织特异性抗原扩展考卷，其突变致APS-1/APECED</text>
  <rect x="30" y="132" width="1340" height="292" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、胸腺加工线：DN → DP → SP，经阳性选择与阴性选择两道关口</text>
  <rect x="70" y="190" width="200" height="64" rx="8" fill="#0369a1" fill-opacity="0.09" stroke="#0369a1" stroke-width="1.7"/>
  <text x="84" y="212" font-size="12.5" fill="#0369a1" font-weight="700">DN 双阴性</text>
  <text x="84" y="230" font-size="9.5" fill="#1e293b" font-weight="600">CD4⁻CD8⁻</text>
  <text x="84" y="244" font-size="9.5" fill="#475569">TCR 基因重排启动</text>
  <rect x="310" y="190" width="200" height="64" rx="8" fill="#0369a1" fill-opacity="0.09" stroke="#0369a1" stroke-width="1.7"/>
  <text x="324" y="212" font-size="12.5" fill="#0369a1" font-weight="700">DP 双阳性</text>
  <text x="324" y="230" font-size="9.5" fill="#1e293b" font-weight="600">CD4⁺CD8⁺</text>
  <text x="324" y="244" font-size="9.5" fill="#475569">TCR 已组装待检</text>
  <rect x="550" y="190" width="250" height="64" rx="8" fill="#0f766e" fill-opacity="0.09" stroke="#0f766e" stroke-width="1.7"/>
  <text x="564" y="212" font-size="12.5" fill="#0f766e" font-weight="700">阳性选择</text>
  <text x="564" y="230" font-size="9.5" fill="#1e293b" font-weight="600">适当低亲和力识别自身肽-MHC</text>
  <text x="564" y="244" font-size="9.5" fill="#475569">存活信号 + 谱系定向</text>
  <rect x="840" y="190" width="250" height="64" rx="8" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-width="1.7"/>
  <text x="854" y="212" font-size="12.5" fill="#dc2626" font-weight="700">阴性选择</text>
  <text x="854" y="230" font-size="9.5" fill="#1e293b" font-weight="600">高亲和力识别自身肽-MHC</text>
  <text x="854" y="244" font-size="9.5" fill="#475569">凋亡指令（或分流为 tTreg）</text>
  <rect x="1120" y="190" width="190" height="64" rx="8" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-width="1.7"/>
  <text x="1134" y="212" font-size="12.5" fill="#059669" font-weight="700">SP 初始 T</text>
  <text x="1134" y="230" font-size="9.5" fill="#1e293b" font-weight="600">CD4⁺ 或 CD8⁺ 单阳性</text>
  <text x="1134" y="244" font-size="9.5" fill="#475569">输出外周</text>
  <line x1="274" y1="222" x2="306" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <text x="290" y="176" font-size="10" fill="#64748b" text-anchor="middle" font-weight="700">β 选择</text>
  <text x="290" y="164" font-size="9" fill="#64748b" text-anchor="middle">TCR β 重排成功 → 增殖并锁定等位基因排除</text>
  <line x1="514" y1="222" x2="546" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="804" y1="222" x2="836" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="1094" y1="222" x2="1116" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="675" y1="258" x2="675" y2="296" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <rect x="550" y="300" width="250" height="54" rx="7" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.4"/>
  <text x="675" y="322" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">死于忽视</text>
  <text x="675" y="342" font-size="9" fill="#475569" text-anchor="middle">不能识别自身 MHC 者无存活信号</text>
  <line x1="965" y1="258" x2="965" y2="296" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <rect x="840" y="300" width="250" height="54" rx="7" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.4"/>
  <text x="965" y="322" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">死于删除</text>
  <text x="965" y="342" font-size="9" fill="#475569" text-anchor="middle">高亲和力自身反应克隆被清除</text>
  <rect x="70" y="372" width="1240" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="90" y="396" font-size="11" fill="#1e293b" font-weight="600">选择的账本：约 95% 以上的胸腺细胞在 DP 阶段及其前后死于凋亡，仅百分之几的 SP 初始 T 细胞获准输出至外周——残酷而高效的质检。</text>
  <rect x="30" y="440" width="1340" height="252" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="462.84" font-size="19" fill="#475569" font-weight="700">二、阳性选择与阴性选择：同一考场、两种亲和力、相反结局</text>
  <rect x="60" y="492" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="519.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">比较项目</text>
  <rect x="230" y="492" width="530" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="495" y="519.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">阳性选择</text>
  <rect x="760" y="492" width="580" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="519.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">阴性选择</text>
  <rect x="60" y="536" width="170" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="557" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">主要部位</text>
  <rect x="230" y="536" width="530" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="495" y="557" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">皮质，cTEC</text>
  <rect x="760" y="536" width="580" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="557" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">皮髓交界与髓质，mTEC 及胸腺 DC</text>
  <rect x="60" y="567" width="1280" height="31" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="567" width="170" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="588" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">识别亲和力</text>
  <rect x="230" y="567" width="530" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="495" y="588" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">适当偏低</text>
  <rect x="760" y="567" width="580" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="588" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">高</text>
  <rect x="60" y="598" width="170" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="619" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">信号结局</text>
  <rect x="230" y="598" width="530" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="495" y="619" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">存活信号</text>
  <rect x="760" y="598" width="580" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="619" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">凋亡指令（或分流为 tTreg）</text>
  <rect x="60" y="629" width="1280" height="31" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="629" width="170" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="650" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">获得性能</text>
  <rect x="230" y="629" width="530" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="495" y="650" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">自身 MHC 限制性与 CD4/CD8 谱系定向</text>
  <rect x="760" y="629" width="580" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="650" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">中枢自身耐受</text>
  <rect x="60" y="660" width="170" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="681" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">失败代价</text>
  <rect x="230" y="660" width="530" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="495" y="681" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">死于忽视</text>
  <rect x="760" y="660" width="580" height="31" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="681" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">自身免疫病风险</text>
  <rect x="30" y="704" width="1340" height="268" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="726.84" font-size="19" fill="#475569" font-weight="700">三、AIRE 驱动的「考卷扩展」：中枢耐受的核心装置</text>
  <rect x="60" y="754" width="740" height="170" rx="9" fill="#ccfbf1" fill-opacity="0.35" stroke="#0f766e" stroke-width="1.6"/>
  <text x="80" y="780" font-size="12.5" fill="#134e4a" font-weight="700">mTEC 的异位表达：把全身蛋白搬进考场</text>
  <rect x="90" y="800" width="170" height="56" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="175" y="824" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">mTEC（髓质上皮）</text>
  <text x="175" y="844" font-size="9.5" fill="#475569" text-anchor="middle">AIRE 转录调控</text>
  <line x1="264" y1="828" x2="320" y2="828" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <rect x="324" y="800" width="210" height="56" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="429" y="824" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">异位表达组织特异性抗原</text>
  <text x="429" y="844" font-size="9.5" fill="#475569" text-anchor="middle">阴性选择考卷覆盖全身</text>
  <line x1="538" y1="828" x2="594" y2="828" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <rect x="598" y="800" width="180" height="56" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5"/>
  <text x="688" y="824" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">自身反应克隆删除</text>
  <text x="688" y="844" font-size="9.5" fill="#475569" text-anchor="middle">中枢耐受建立</text>
  <text x="80" y="890" font-size="10.5" fill="#475569">胸腺细胞在 DP 阶段及其前后死于凋亡者约 95% 以上；中等亲和力分支则分流为 tTreg，先天携带抑制装备。</text>
  <rect x="830" y="754" width="610" height="78" rx="9" fill="#fee2e2" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.6"/>
  <text x="848" y="778" font-size="12.5" fill="#dc2626" font-weight="700">AIRE 突变 → APS-1 / APECED</text>
  <text x="848" y="800" font-size="10.5" fill="#475569">组织特异性抗原「考卷」缩水 → 器官特异性自身免疫病。</text>
  <rect x="830" y="846" width="610" height="78" rx="9" fill="#ede9fe" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="848" y="870" font-size="12.5" fill="#4c1d95" font-weight="700">阴性选择的中间带分流：tTreg</text>
  <text x="848" y="892" font-size="10.5" fill="#475569">识别自身肽-MHC 亲和力居中的克隆转为调节性 T 细胞，以抑制执行耐受。</text>
</svg>