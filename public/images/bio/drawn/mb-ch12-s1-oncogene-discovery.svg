  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">癌基因的发现：从 Rous 肉瘤病毒到原癌基因</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">1911 RSV → ts / 缺失 / 分子杂交三实验确立 v-src 源自 c-src——转导 / 插入两条激活路线与 DNA 肿瘤病毒的抑癌蛋白劫持</text>
  <rect x="30" y="132" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Rous 肉瘤病毒（1911）：逆转录病毒携带 v-src</text>
  <circle cx="140" cy="240" r="46" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/>
