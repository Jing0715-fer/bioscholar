  <rect x="330" y="226" width="60" height="28" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <text x="360" y="244" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">v-src</text>
  <text x="376" y="306" font-size="11.5" fill="#64748b" text-anchor="middle">前病毒整合入宿主基因组</text>
  <line x1="486" y1="240" x2="548" y2="240" stroke="#be185d" stroke-width="2.4" marker-end="url(#arr-enz)"/>
  <ellipse cx="610" cy="240" rx="56" ry="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
  <text x="610" y="236" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">转化细胞</text>
  <text x="610" y="254" font-size="10.5" fill="#dc2626" text-anchor="middle">（肉瘤）</text>
  <rect x="700" y="176" width="640" height="130" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="716" y="204" font-size="13.5" fill="#1e293b" font-weight="700">1911 年 Peyton Rous：无细胞滤过液诱发鸡肉瘤</text>
  <text x="716" y="230" font-size="11.5" fill="#475569">首个肿瘤病毒——属逆转录病毒：基因组 RNA 经反转录整合入宿主基因组，携带病毒癌基因 v-src</text>
  <text x="716" y="280" font-size="12" fill="#78350f" font-weight="600">1966 年获诺贝尔奖，距发现 55 年</text>
  <text x="360" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">「转化功能与复制功能」共存于同一病毒颗粒</text>
  <rect x="30" y="400" width="700" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="422.84" font-size="19" fill="#475569" font-weight="700">二、三个经典实验确立「癌基因」概念</text>
  <rect x="46" y="440" width="668" height="64" rx="8" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="62" y="462" font-size="12" fill="#1e293b" font-weight="700">温度敏感突变体（Martin，1970）</text>
  <text x="62" y="482" font-size="10.5" fill="#475569">ts 突变的 RSV 在允许温度转化细胞、非允许温度不转化但复制正常——转化功能与复制功能分离</text>
  <text x="694" y="462" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="600">存在独立的转化基因</text>
  <rect x="46" y="514" width="668" height="64" rx="8" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="62" y="536" font-size="12" fill="#1e293b" font-weight="700">转化缺陷突变体（Vogt）</text>
  <text x="62" y="556" font-size="10.5" fill="#475569">缺失约 20% 基因组的突变株正常复制却丧失转化能力——缺失片段即 src</text>
  <text x="694" y="536" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="600">src = 转化基因</text>
  <rect x="46" y="588" width="668" height="64" rx="8" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.3"/>
  <text x="62" y="610" font-size="12" fill="#1e293b" font-weight="700">分子杂交（Stehelin / Varmus / Bishop，1976）</text>
  <text x="62" y="630" font-size="10.5" fill="#475569">用 v-src 探针在未感染的健康鸡细胞中也检出同源序列——src 是病毒从宿主「偷走」的细胞基因</text>
  <text x="694" y="610" font-size="10.5" fill="#059669" text-anchor="end" font-weight="600">原癌基因概念（1989 年诺奖）</text>
  <text x="46" y="664" font-size="11.5" fill="#059669" font-weight="600">结论：正常的细胞基因被劫持或激活即成癌基因——Varmus 与 Bishop 提出原癌基因（proto-oncogene, c-onc）概念</text>
  <rect x="710" y="400" width="660" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="422.84" font-size="19" fill="#475569" font-weight="700">三、病毒激活癌基因的两条路线</text>
  <rect x="726" y="440" width="306" height="218" rx="9" fill="#fce7f3" fill-opacity="0.35" stroke="#be185d" stroke-width="1.4"/>
  <text x="879" y="464" font-size="12.5" fill="#831843" text-anchor="middle" font-weight="700">转导性逆转录病毒（急性转化）</text>
  <text x="742" y="488" font-size="11" fill="#475569">RSV 捕获 c-src 时 C 端缺失 Tyr527</text>
  <text x="742" y="504" font-size="11" fill="#475569">（c-Src 的负调控自抑制位点）</text>
  <text x="742" y="520" font-size="11" fill="#475569">——酪氨酸激酶活性组成性激活</text>
  <rect x="768.6975" y="568.225" width="122.605" height="19.55" rx="7" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="830" y="582.14" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">「去掉刹车」式激活</text>
  <text x="742" y="608" font-size="10.5" fill="#64748b">多数急性转化病毒</text>
  <text x="742" y="623" font-size="10.5" fill="#64748b">（如携带 v-myc 的禽类成髓细胞瘤病毒）</text>
  <text x="742" y="638" font-size="10.5" fill="#64748b">还伴随 LTR 强启动子的「过表达」</text>
  <rect x="1046" y="440" width="306" height="218" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.4"/>
  <text x="1199" y="464" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">插入性突变（慢性转化）</text>
  <line x1="1062" y1="540" x2="1336" y2="540" stroke="#0f766e" stroke-width="2.6"/>
  <rect x="1140" y="526" width="84" height="28" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="1182" y="544" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">ALV 前病毒</text>
  <rect x="1252" y="526" width="56" height="28" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1280" y="544" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">c-myc</text>
  <line x1="1224" y1="566" x2="1252" y2="566" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <text x="1238" y="588" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">激活</text>
  <text x="1062" y="608" font-size="10.5" fill="#475569">不含 onc 的逆转录病毒（如 ALV）随机整合，</text>
  <text x="1062" y="623" font-size="10.5" fill="#475569">充当活跃「增强子 / 启动子」——插入诱变是发现新癌基因的遗传学工具</text>
  <rect x="30" y="700" width="1340" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="722.84" font-size="19" fill="#475569" font-weight="700">四、DNA 肿瘤病毒的另一手：结合并失活抑癌蛋白</text>
  <rect x="56" y="744" width="186" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="149" y="768" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">SV40 大 T 抗原</text>
  <text x="149" y="788" font-size="10.5" fill="#64748b" text-anchor="middle">结合并失活 p53 · Rb</text>
  <line x1="244" y1="772" x2="254" y2="772" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="256" y="744" width="186" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="349" y="768" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">HPV E6 / E7</text>
  <text x="349" y="788" font-size="10.5" fill="#64748b" text-anchor="middle">E6 降解 p53 · E7 失活 Rb</text>
  <line x1="444" y1="772" x2="454" y2="772" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="456" y="744" width="186" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="549" y="768" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">腺病毒 E1A / E1B</text>
  <text x="549" y="788" font-size="10.5" fill="#64748b" text-anchor="middle">E1A 结 Rb · E1B 结 p53</text>
  <rect x="680" y="744" width="140" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="750" y="768" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">p53</text>
  <text x="750" y="788" font-size="10.5" fill="#dc2626" text-anchor="middle">抑癌蛋白</text>
  <rect x="840" y="744" width="140" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="910" y="768" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Rb</text>
  <text x="910" y="788" font-size="10.5" fill="#dc2626" text-anchor="middle">抑癌蛋白</text>
  <line x1="644" y1="772" x2="672" y2="772" stroke="#dc2626" stroke-width="2.4"/>
  <line x1="672" y1="764" x2="684" y2="780" stroke="#dc2626" stroke-width="2.4"/>
  <line x1="684" y1="764" x2="672" y2="780" stroke="#dc2626" stroke-width="2.4"/>
  <text x="1020" y="772" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">→ 转化</text>
  <rect x="56" y="824" width="1296" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="848" font-size="11.5" fill="#475569">与逆转录病毒「携带 / 激活正调控基因」相反，DNA 肿瘤病毒（SV40 · 多瘤 · HPV · 腺病毒）的致癌蛋白通过结合并失活宿主抑癌蛋白实现转化——两条路线殊途同归：</text>
  <text x="72" y="872" font-size="12" fill="#1e293b" font-weight="600">癌症是细胞固有基因调控网络的疾病，病毒只是最早把「扳机」递到研究者手中的信使</text>
  <text x="700" y="926" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="600">范式转移：从「癌症是否遗传」之争 → 「哪些基因 · 何种改变 · 怎样组合」的分子解剖学</text>
</svg>