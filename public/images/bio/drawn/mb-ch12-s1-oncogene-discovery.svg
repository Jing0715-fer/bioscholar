  <text x="140" y="252" font-size="10.5" fill="#78350f" text-anchor="middle">基因组</text>
  <text x="140" y="306" font-size="11.5" fill="#64748b" text-anchor="middle">RSV 粒子（包膜）</text>
  <line x1="196" y1="240" x2="258" y2="240" stroke="#b45309" stroke-width="2.4" marker-end="url(#arr-rna)"/>
