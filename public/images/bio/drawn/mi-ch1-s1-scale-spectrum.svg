  <text x="700" y="558" font-size="11.5" fill="#64748b" text-anchor="middle">光学显微镜的分辨极限 ≈ 0.2 μm 恰好把普通细菌留在可见的边缘，而把病毒彻底排除在视野之外</text>
  <rect x="30" y="612" width="1340" height="368" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="634.84" font-size="19" fill="#475569" font-weight="700">二、三域系统与微生物六大共性</text>
