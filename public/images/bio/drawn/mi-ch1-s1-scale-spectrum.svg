  <text x="572.5" y="921.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">无——不属于任何一域</text>
  <rect x="700" y="688" width="310" height="132" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="716" y="716" font-size="13.5" fill="#134e4a" font-weight="700">①② 体积小 → 吸收多、转化快</text>
  <text x="716" y="742" font-size="11.5" fill="#475569">体积小则比表面积大，</text>
  <text x="716" y="760" font-size="11.5" fill="#475569">与环境物质交换强度极高——吸收多、</text>
  <text x="716" y="778" font-size="11.5" fill="#475569">转化快的物理基础。</text>
  <rect x="1036" y="688" width="310" height="132" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1052" y="716" font-size="13.5" fill="#075985" font-weight="700">③ 生长旺、繁殖快</text>
  <text x="1052" y="742" font-size="11.5" fill="#475569">大肠杆菌约 20 min 分裂一次；</text>
  <text x="1052" y="760" font-size="11.5" fill="#475569">48 h 理论可达 2.2×10⁴³ 个——现实受营养与空间限制。</text>
  <rect x="700" y="838" width="310" height="132" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="716" y="866" font-size="13.5" fill="#92400e" font-weight="700">④⑤ 适应强、分布广、种类多</text>
  <text x="716" y="892" font-size="11.5" fill="#475569">每克肥沃土壤含菌 10⁸–10⁹ 个量级；适应、变异、</text>
  <text x="716" y="910" font-size="11.5" fill="#475569">分布与种类均居生命世界之首。</text>
  <rect x="1036" y="838" width="310" height="132" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1052" y="866" font-size="13.5" fill="#4c1d95" font-weight="700">⑥ 独立与共生并存</text>
  <text x="1052" y="892" font-size="11.5" fill="#475569">既能独立生活，也与宿主结成共生、</text>
  <text x="1052" y="910" font-size="11.5" fill="#475569">寄生等关系——人体微生物组即典型例证。</text>
</svg>