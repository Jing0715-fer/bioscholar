  <rect x="50" y="838" width="105" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="102.5" y="869.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">真核 Eukarya</text>
  <rect x="155" y="838" width="215" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="262.5" y="869.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">酵母·霉菌·原生动物</text>
