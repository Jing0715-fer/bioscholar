  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">微生物的类群、尺度与共性：从 20 nm 病毒到肉眼可见的蕈菌</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">微生物横跨细菌、古菌与真核三域（病毒为非细胞类群）；光镜分辨极限≈0.2μm恰在细菌与病毒之间；大肠杆菌约20min一代、48h理论2.2×10⁴³个；每克肥土含菌10⁸–10⁹</text>
  <rect x="30" y="132" width="1340" height="452" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、尺度谱：从 20 nm 的病毒到肉眼可见的蕈菌——跨越五个数量级以上</text>
