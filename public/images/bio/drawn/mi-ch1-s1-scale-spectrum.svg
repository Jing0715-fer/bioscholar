  <text x="102.5" y="817.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">古菌 Archaea</text>
  <rect x="155" y="786" width="215" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
