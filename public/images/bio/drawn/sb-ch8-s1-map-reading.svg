  <ellipse cx="100" cy="280" rx="13.200000000000001" ry="8.25" fill="#0f766e" fill-opacity="0.35" stroke="#134e4a" stroke-width="1.2"/>
  <circle cx="100" cy="280" r="3.2" fill="#134e4a" stroke="none"/>
  <ellipse cx="150" cy="300" rx="39" ry="29" fill="#ccfbf1" fill-opacity="0.3" stroke="#0f766e" stroke-width="1.1" stroke-dasharray="5 4"/>
