  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">电子密度图的解读：主图、差值图与无偏检验</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">2Fo−Fc主图按1σ勾画连续「香肠」；Fo−Fc差值图+3σ表缺失、−3σ表多余；omit图防模型偏差、polder图（Liebschner2017）加掩膜挡溶剂为配体判定首选；sigma-A</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">加权逐反射压偏差；1.2Å见氢、6Å仅见包络</text>
  <rect x="30" y="132" width="660" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、2Fo−Fc 主图与 Fo−Fc 差值图</text>
  <rect x="56" y="212" width="300" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="206" y="230" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">2Fo−Fc 主图：1σ 连续「香肠」</text>
  <ellipse cx="100" cy="280" rx="37" ry="28" fill="#ccfbf1" fill-opacity="0.3" stroke="#0f766e" stroke-width="1.1" stroke-dasharray="5 4"/>
