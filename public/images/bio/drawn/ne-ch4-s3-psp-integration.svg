  <text x="770" y="548" font-size="11.5" fill="#475569">E_rev 为各离子电池按电导的加权平均；V_m 在 E_rev 之上或之下，电流方向随之翻转。</text>
  <rect x="30" y="576" width="1340" height="402" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
