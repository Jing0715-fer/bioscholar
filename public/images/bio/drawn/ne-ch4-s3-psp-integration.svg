  <line x1="300" y1="258" x2="240" y2="270" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr-bad)"/>
  <path d="M330,280 C338.3,290.4 363.3,330.0 380,342.5 C396.7,355.0 408.3,357.9 430,355 C451.7,352.1 478.3,335.4 510,325 C541.7,314.6 601.7,297.9 620,292.5" fill="none" stroke="#0369a1" stroke-width="2.6"/>
