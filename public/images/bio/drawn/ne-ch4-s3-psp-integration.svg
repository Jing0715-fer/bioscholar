  <text x="70" y="500" font-size="11" fill="#475569">中枢单个 EPSP 仅约 0.5–1 mV，与阈值差一个数量级：自 −70 抵达 −55 需 +15 mV，须数十个量子在数毫秒内同步，</text>
  <text x="70" y="515" font-size="11" fill="#475569">或同一输入数十 Hz 连发、由时间总和积攒。IPSP 由 GABA（GABA_A 氯通道）或甘氨酸介导，多为超极化或「钉住不动」。</text>
