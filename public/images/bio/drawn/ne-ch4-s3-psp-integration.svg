  <text x="520" y="654" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">远端 · 衰减多</text>
  <text x="710" y="654" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">近端 · 衰减少</text>
  <text x="470" y="770" font-size="11" fill="#475569">抑制的解剖位置本身就是计算变量：放在树突只压局部，</text>
  <text x="470" y="785" font-size="11" fill="#475569">放在胞体压全局；吊灯细胞的轴-轴突突更直接把守 AIS 闸门。</text>
