  <text x="330" y="452" font-size="13" fill="#64748b" text-anchor="middle">刺激 ②（抑制性）</text>
  <line x1="114" y1="405" x2="120" y2="405" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="409" font-size="13" fill="#64748b" text-anchor="end">−80</text>
