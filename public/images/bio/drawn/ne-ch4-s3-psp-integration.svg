  <text x="110" y="221.5" font-size="13" fill="#64748b" text-anchor="end">−65</text>
  <text x="370" y="474" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">时间</text>
  <text x="74" y="305" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">膜电位（mV）</text>
  <rect x="120" y="305" width="500" height="125" fill="#e0f2fe" fill-opacity="0.15" stroke="none"/>
  <text x="614" y="302" font-size="10.5" fill="#075985" text-anchor="end" font-weight="700">IPSP 的去向：E_Cl ≈ −70 ～ −80 mV</text>
  <path d="M160,280 C165.0,277.5 180.0,267.3 190,265 C200.0,262.7 206.7,265.0 220,266.25 C233.3,267.5 251.7,270.2 270,272.5 C288.3,274.8 305.0,278.8 330,280 C355.0,281.3 405.0,280.0 420,280" fill="none" stroke="#dc2626" stroke-width="2.6"/>
