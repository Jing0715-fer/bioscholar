  <text x="310" y="664" font-size="11" fill="#134e4a" font-weight="700">数十 Hz 连发 → 叠加达阈</text>
  <text x="150" y="790" font-size="11" fill="#075985" font-weight="700">低频 → 各自衰减</text>
  <text x="90" y="944" font-size="11" fill="#475569">同一输入数十 Hz 连发，EPSP 落在前一衰减尾巴上——积少成多；</text>
  <text x="90" y="959" font-size="11" fill="#475569">须数十个量子同步方能抵达阈值。</text>
  <text x="640" y="636" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">空间总和：电缆衰减定权重</text>
