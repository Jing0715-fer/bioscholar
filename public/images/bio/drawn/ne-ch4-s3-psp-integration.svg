  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">突触后电位与整合：EPSP/IPSP、反转电位与总和</text>
  <text x="700" y="74" text-anchor="middle" font-size="13" fill="#64748b">中枢单个EPSP约0.5–1mV（AMPA的E_rev约0mV），自−70抵达−55需数十个量子同步或数十Hz连发；IPSP由GABA_A/甘氨酸介导、向E_Cl（约−70～−80mV）靠拢；多离子通道E_rev为各离子电池按电导的加权平均；</text>
  <text x="700" y="100" text-anchor="middle" font-size="13" fill="#64748b">时间总和受τ≈5–20ms限窗，空间总和权重由树突电缆衰减决定；AIS的Nav密度最高、阈值最低，是放电终审位；化学突触延迟约0.5ms，NMJ以50–70mV终板电位与安全系数约2–4换取确定性</text>
  <rect x="30" y="132" width="700" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、EPSP 与 IPSP：突触后的两种货币</text>
