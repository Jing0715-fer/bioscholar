<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">同源建模与折叠识别：同一性分区、四步流程与质量评估</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">同一性高于40%建模近乎照抄（主链误差约1Å）、30%上下1.5–2Å、低于30%进入暮光区；SWISS-MODEL四步为模板识别、序列比对、模型搭建与质量评估，</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">侧链用旋转异构体库安装、环区是误差主要来源；穿线按残基-环境相容性打分；Ramachandran许可区占比约九成以上、QMEAN给出准确性估计</text>
  <rect x="30" y="132" width="900" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、序列同一性：同源建模的舒适边界</text>
  <rect x="80" y="210" width="220" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <rect x="300" y="210" width="220" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <rect x="520" y="210" width="340" height="40" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="190" y="234" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">暮光区 &lt; 30%</text>
  <text x="410" y="234" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">可信区 30–40%</text>
  <text x="690" y="234" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">舒适区 &gt; 40%</text>
  <line x1="80" y1="290" x2="860" y2="290" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="470" y="316" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">可比对区域的序列同一性 →</text>
  <line x1="300" y1="282" x2="300" y2="298" stroke="#475569" stroke-width="2"/>
  <line x1="520" y1="282" x2="520" y2="298" stroke="#475569" stroke-width="2"/>
  <text x="300" y="274" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">30%</text>
  <text x="520" y="274" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">40%</text>
  <text x="80" y="344" font-size="11.5" fill="#dc2626">&lt;30%：比对本身开始不可靠，</text>
  <text x="80" y="360" font-size="11.5" fill="#dc2626">插入缺失位置难定，结构相似性存疑。</text>
  <text x="316" y="344" font-size="11.5" fill="#92400e">30% 上下：主链误差约 1.5–2 Å，</text>
  <text x="316" y="360" font-size="11.5" fill="#92400e">环区与侧链可信度下降。</text>
  <text x="536" y="344" font-size="11.5" fill="#065f46">&gt;40%：主链结构均方根偏差通常很小，建模近乎照抄</text>
  <text x="536" y="360" font-size="11.5" fill="#065f46">（主链误差约 1 Å）。</text>
  <rect x="80" y="420" width="380" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="100" y="448" font-size="13" fill="#1e293b" font-weight="700">1969 · Browne 等</text>
  <text x="100" y="472" font-size="11" fill="#475569">以鸡蛋清溶菌酶晶体结构为模板，</text>
  <text x="100" y="487" font-size="11" fill="#475569">手工搭建 α-乳清蛋白模型——比较建模开山之作。</text>
  <rect x="490" y="420" width="380" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="510" y="448" font-size="13" fill="#1e293b" font-weight="700">1993 · Sali 与 Blundell</text>
  <text x="510" y="472" font-size="11" fill="#475569">MODELLER：</text>
  <text x="510" y="487" font-size="11" fill="#475569">模板距离 / 二面角约束 + 比对对应 + 标准立体化学构成约束体系，</text>
  <text x="510" y="502" font-size="11" fill="#475569">自动化。</text>
  <rect x="940" y="132" width="430" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="956" y="154.84" font-size="19" fill="#475569" font-weight="700">二、SWISS-MODEL 四步流程</text>
  <rect x="970" y="190" width="370" height="64" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.7"/>
  <text x="1155" y="216" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="600">① 模板识别——看分辨率与配体结合状态，而非仅看同一性</text>
  <line x1="1155" y1="256" x2="1155" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="970" y="270" width="370" height="64" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.7"/>
  <text x="1155" y="296" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="600">② 序列比对——多模板并用须以统一比对框架为前提</text>
  <line x1="1155" y1="336" x2="1155" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="970" y="350" width="370" height="64" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.7"/>
  <text x="1155" y="376" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="600">③ 模型搭建——侧链自旋转异构体库安装；环区是误差主要来源</text>
  <line x1="1155" y1="416" x2="1155" y2="428" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="970" y="430" width="370" height="64" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.7"/>
  <text x="1155" y="456" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="600">④ 质量评估——全局分数之外，局部质量剖面不可省</text>
  <text x="970" y="528" font-size="11.5" fill="#475569">结构比序列更保守——这正是同源建模可行的原因。</text>
  <rect x="30" y="576" width="1340" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、折叠识别（穿线）与模型质量评估</text>
  <rect x="60" y="656" width="240" height="34" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="180" y="678" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">MKTLLLAV…（目标序列）</text>
  <line x1="308" y1="673" x2="352" y2="673" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="330" y="652" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">穿上</text>
  <circle cx="400" cy="673" r="18" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <polyline points="420,673 440,658 460,688 480,658 500,688 520,668" fill="none" stroke="#6d28d9" stroke-width="2.4"/>
  <circle cx="548" cy="673" r="18" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <text x="470" y="712" font-size="11" fill="#64748b" text-anchor="middle">已知折叠骨架</text>
  <text x="60" y="744" font-size="11.5" fill="#475569">穿线：把序列「穿」到已知折叠骨架上，按残基-环境相容性打分（残基是否适应其所处的结构环境）。</text>
  <text x="60" y="792" font-size="11.5" fill="#475569">依赖「折叠类型有限」假设；适合远缘而无同源证据的序列——比同源建模的证据更间接，可靠性更低。</text>
  <text x="60" y="852" font-size="11.5" fill="#475569">质量评估：Ramachandran 图检验物理合理性（许可区占比约九成以上）；</text>
  <text x="60" y="868" font-size="11.5" fill="#475569">QMEAN 综合描述子给出准确性估计。</text>
  <rect x="880" y="640" width="400" height="220" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="880" y1="805" x2="1280" y2="805" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="980" y1="860" x2="980" y2="640" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="880" y1="750" x2="1280" y2="750" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1080" y1="860" x2="1080" y2="640" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="880" y1="695" x2="1280" y2="695" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1180" y1="860" x2="1180" y2="640" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="904" y1="860" x2="904" y2="866" stroke="#475569" stroke-width="1.8"/>
  <text x="904" y="882" font-size="13" fill="#64748b" text-anchor="middle">−180°</text>
  <line x1="1080" y1="860" x2="1080" y2="866" stroke="#475569" stroke-width="1.8"/>
  <text x="1080" y="882" font-size="13" fill="#64748b" text-anchor="middle">0°</text>
  <line x1="1256" y1="860" x2="1256" y2="866" stroke="#475569" stroke-width="1.8"/>
  <text x="1256" y="882" font-size="13" fill="#64748b" text-anchor="middle">180°</text>
  <line x1="874" y1="846.8" x2="880" y2="846.8" stroke="#475569" stroke-width="1.8"/>
  <text x="870" y="850.8" font-size="13" fill="#64748b" text-anchor="end">−180°</text>
  <line x1="874" y1="750" x2="880" y2="750" stroke="#475569" stroke-width="1.8"/>
  <text x="870" y="754" font-size="13" fill="#64748b" text-anchor="end">0°</text>
  <line x1="874" y1="653.2" x2="880" y2="653.2" stroke="#475569" stroke-width="1.8"/>
  <text x="870" y="657.2" font-size="13" fill="#64748b" text-anchor="end">180°</text>
  <text x="1080" y="904" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">φ</text>
  <text x="1080" y="628" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Ramachandran 图（φ–ψ 平面）</text>
  <ellipse cx="947" cy="673" rx="44" ry="32" fill="#e0f2fe" fill-opacity="0.85" stroke="#0369a1" stroke-width="1.8"/>
  <text x="947" y="678" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">β 区</text>
  <ellipse cx="1010" cy="789" rx="48" ry="36" fill="#d1fae5" fill-opacity="0.85" stroke="#059669" stroke-width="1.8"/>
  <text x="1010" y="794" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">α 区</text>
  <text x="1068" y="710" font-size="10.5" fill="#64748b">落在许可区之外的残基</text>
  <text x="1068" y="726" font-size="10.5" fill="#64748b">提示模型局部不合理</text>
  <text x="1068" y="840" font-size="10.5" fill="#475569" font-weight="600">合格判据：许可区 ≥ 90%</text>
  <text x="880" y="934" font-size="11.5" fill="#dc2626">低精度模型不得直接用于需原子级精度的任务（如配体结合位点分析）。</text>
</svg>