  <text x="818" y="764" font-size="13" fill="#64748b" text-anchor="middle">205</text>
  <line x1="948.5" y1="742" x2="948.5" y2="748" stroke="#475569" stroke-width="1.8"/>
  <text x="948.5" y="764" font-size="13" fill="#64748b" text-anchor="middle">240</text>
  <line x1="1025" y1="742" x2="1025" y2="748" stroke="#475569" stroke-width="1.8"/>
  <text x="1025" y="764" font-size="13" fill="#64748b" text-anchor="middle">260</text>
  <line x1="1101.5" y1="742" x2="1101.5" y2="748" stroke="#475569" stroke-width="1.8"/>
  <text x="1101.5" y="764" font-size="13" fill="#64748b" text-anchor="middle">280</text>
