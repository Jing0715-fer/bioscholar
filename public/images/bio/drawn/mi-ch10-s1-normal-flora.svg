<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">正常菌群、微生态与机会致病：人体分布地图与屏障机制</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">结肠菌量10¹¹–10¹²/g，胃至结肠升约9个数量级；微生物组经典约10¹⁴、修订约3.8×10¹³（约1:1）；厌氧菌定植抗力破则失调与二重感染（鹅口疮、伪膜性肠炎）</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、正常菌群的人体分布「地图」：部位与优势菌群</text>
  <circle cx="210" cy="196" r="26" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="180" y="228" width="62" height="150" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <line x1="190" y1="250" x2="150" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="232" y1="250" x2="272" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="196" y1="378" x2="188" y2="470" stroke="#475569" stroke-width="2"/>
  <line x1="226" y1="378" x2="234" y2="470" stroke="#475569" stroke-width="2"/>
  <line x1="184" y1="500" x2="202" y2="500" stroke="#475569" stroke-width="2"/>
  <line x1="228" y1="500" x2="246" y2="500" stroke="#475569" stroke-width="2"/>
  <text x="210" y="178" font-size="10" fill="#64748b" text-anchor="middle">头皮</text>
  <line x1="150" y1="250" x2="110" y2="262" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="150" cy="250" r="4" fill="#0f766e"/>
  <rect x="41.67" y="252.65" width="36.66" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="60" y="265.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">皮肤</text>
  <text x="44" y="284" font-size="9.5" fill="#475569">葡萄球菌等 · 干燥酸性</text>
  <line x1="246" y1="232" x2="320" y2="218" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="246" cy="232" r="4" fill="#d97706"/>
  <rect x="341.67" y="208.65" width="36.66" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="221.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">口腔</text>
  <text x="340" y="240" font-size="9.5" fill="#475569">链球菌等 · 量大种多</text>
  <line x1="180" y1="258" x2="96" y2="330" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="180" cy="258" r="4" fill="#dc2626"/>
  <rect x="33.335" y="320.65" width="25.33" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="46" y="333.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">胃</text>
  <text x="30" y="352" font-size="9.5" fill="#475569">菌量极少 · 胃酸屏障</text>
  <line x1="244" y1="280" x2="330" y2="300" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="244" cy="280" r="4" fill="#0369a1"/>
  <rect x="351.67" y="290.65" width="36.66" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="370" y="303.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">小肠</text>
  <text x="350" y="322" font-size="9.5" fill="#475569">较低 · 排空快</text>
  <line x1="244" y1="350" x2="340" y2="386" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="244" cy="350" r="4" fill="#6d28d9"/>
  <rect x="361.67" y="376.65" width="36.66" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="380" y="389.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">结肠</text>
  <text x="360" y="408" font-size="9.5" fill="#475569">厌氧菌为主 10¹¹–10¹²/g</text>
  <line x1="178" y1="360" x2="96" y2="420" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="178" cy="360" r="4" fill="#b45309"/>
  <rect x="27.67" y="410.65" width="36.66" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="46" y="423.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">阴道</text>
  <text x="30" y="442" font-size="9.5" fill="#475569">乳酸杆菌 · 维持低 pH</text>
  <text x="50" y="528" font-size="10.5" fill="#64748b">各部位生态位由 pH、氧分压、分泌物与黏液共同塑造——菌群组成高度特异。</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、自胃至结肠菌量上升约 9 个数量级；「第二基因组」</text>
  <rect x="740" y="190" width="100" height="280" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="742" y="468" width="96" height="26" fill="#6d28d9" fill-opacity="0.12"/>
  <rect x="742" y="440" width="96" height="26" fill="#6d28d9" fill-opacity="0.2"/>
  <rect x="742" y="412" width="96" height="26" fill="#6d28d9" fill-opacity="0.28"/>
  <rect x="742" y="384" width="96" height="26" fill="#6d28d9" fill-opacity="0.36"/>
  <rect x="742" y="356" width="96" height="26" fill="#6d28d9" fill-opacity="0.44"/>
  <rect x="742" y="328" width="96" height="26" fill="#6d28d9" fill-opacity="0.52"/>
  <rect x="742" y="300" width="96" height="26" fill="#6d28d9" fill-opacity="0.6"/>
  <rect x="742" y="272" width="96" height="26" fill="#6d28d9" fill-opacity="0.68"/>
  <rect x="742" y="244" width="96" height="26" fill="#6d28d9" fill-opacity="0.76"/>
  <rect x="742" y="216" width="96" height="26" fill="#6d28d9" fill-opacity="0.84"/>
  <text x="760" y="214" font-size="10.5" fill="#475569" font-weight="700">菌量对数 ↑</text>
  <text x="870" y="470" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">胃</text>
  <text x="870" y="414" font-size="10" fill="#64748b" text-anchor="middle">十二指肠</text>
  <text x="870" y="358" font-size="10" fill="#64748b" text-anchor="middle">空肠</text>
  <text x="870" y="302" font-size="10" fill="#64748b" text-anchor="middle">回肠</text>
  <text x="870" y="236" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700">结肠</text>
  <text x="950" y="240" font-size="11" fill="#475569">梯度由胃酸、胆汁、蠕动速率与黏液分泌共同塑造——小肠远低于结肠，</text>
  <text x="950" y="256" font-size="11" fill="#475569">与其排空快、抗菌物质浓度高直接相关。</text>
  <rect x="940" y="330" width="410" height="90" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.5"/>
  <text x="960" y="354" font-size="13" fill="#075985" font-weight="700">人体微生物组</text>
  <text x="960" y="378" font-size="11" fill="#475569">经典估计约 10¹⁴ 个细胞（自身细胞的 10 倍）；</text>
  <text x="960" y="394" font-size="11" fill="#475569">直接计数修订为约 3.8×10¹³（约 1:1）。</text>
  <text x="940" y="444" font-size="11" fill="#475569">微生物编码基因总数远超人类基因组的约 2 万个基因——肠道菌群因此被称为人体的「第二基因组」，</text>
  <text x="940" y="460" font-size="11" fill="#475569">承担免疫训练、维生素合成与定植抗力。</text>
  <rect x="30" y="564" width="1340" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="586.84" font-size="19" fill="#475569" font-weight="700">三、定植抗力：厌氧菌主导的排斥屏障；失调与二重感染</text>
  <rect x="50" y="598" width="620" height="140" rx="9" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="622" font-size="12.5" fill="#059669" font-weight="700">定植抗力（colonization resistance）</text>
  <text x="70" y="646" font-size="11" fill="#475569">占结肠菌群 99% 以上的厌氧菌，通过占位竞争、营养争夺以及代谢产物（短链脂肪酸、脱结合胆汁酸、细菌素）</text>
  <text x="70" y="662" font-size="11" fill="#475569">的抑制，形成排斥外来菌定殖的屏障。</text>
  <text x="70" y="710" font-size="11" fill="#059669" font-weight="700">屏障一旦削弱，致病菌与耐药菌即可乘虚定殖。</text>
  <rect x="690" y="598" width="650" height="140" rx="9" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.5"/>
  <text x="710" y="622" font-size="12.5" fill="#dc2626" font-weight="700">菌群失调 → 二重感染</text>
  <text x="710" y="646" font-size="11" fill="#475569">广谱抗生素、饮食骤变与免疫抑制破坏屏障引发失调：白假丝酵母菌过度增殖致鹅口疮，</text>
  <text x="710" y="662" font-size="11" fill="#475569">艰难梭菌增殖致伪膜性肠炎——正常菌群成员本身成为病原。</text>
  <text x="710" y="710" font-size="11" fill="#dc2626" font-weight="700">二重感染 = 抗感染治疗诱发的感染，</text>
  <text x="710" y="726.5" font-size="11" fill="#dc2626" font-weight="700">是其最刺眼的临床形式。</text>
  <rect x="30" y="776" width="1340" height="204" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="798.84" font-size="19" fill="#475569" font-weight="700">四、机会致病的条件与微生态干预</text>
  <text x="60" y="824" font-size="12.5" fill="#1e293b" font-weight="700">条件致病菌 → 机会感染的三类条件</text>
  <circle cx="74" cy="834" r="3.5" fill="#dc2626"/>
  <text x="88" y="838" font-size="11" fill="#475569">免疫屏障破损（放化疗、烧伤、老年）</text>
  <circle cx="74" cy="862" r="3.5" fill="#dc2626"/>
  <text x="88" y="866" font-size="11" fill="#475569">正常菌群失调（抗生素后生态位空出）</text>
  <circle cx="74" cy="890" r="3.5" fill="#dc2626"/>
  <text x="88" y="894" font-size="11" fill="#475569">侵入性装置（导管、人工关节生物膜）</text>
  <text x="60" y="928" font-size="11" fill="#dc2626" font-weight="700">条件致病菌是医院内感染与导管相关感染的主要病原。</text>
  <rect x="700" y="800" width="640" height="64" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.4"/>
  <text x="720" y="824" font-size="12.5" fill="#075985" font-weight="700">重建菌群屏障</text>
  <text x="720" y="848" font-size="11" fill="#475569">粪菌移植与微生态制剂（益生菌、益生元）——把「屏障」本身当作治疗对象。</text>
  <rect x="700" y="876" width="640" height="84" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="720" y="900" font-size="12.5" fill="#1e293b" font-weight="700">研究模型</text>
  <text x="720" y="924" font-size="11" fill="#475569">无菌动物与悉生动物：在「无菌群」与「已知菌群」两种极端之间做加减法，</text>
  <text x="720" y="940" font-size="11" fill="#475569">证明菌群对免疫发育与营养供应的因果性贡献。</text>
</svg>