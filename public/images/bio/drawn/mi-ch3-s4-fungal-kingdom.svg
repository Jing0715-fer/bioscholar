<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">真菌界概览与经济真菌：四门分类、共同特征与产业支柱</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">子囊菌门约占已知真菌半数（子囊内 8 个子囊孢子），担子菌门外生 4 个担孢子；脉孢霉营养缺陷型研究奠定一基因一酶学说（1958 年诺奖）</text>
  <rect x="30" y="132" width="1340" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、真菌界的共同特征（与动物同属后鞭毛生物）</text>
  <rect x="50" y="168" width="400" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="68" y="192" font-size="13" fill="#134e4a" font-weight="700">壳多糖 + 葡聚糖细胞壁</text>
  <text x="68" y="212" font-size="11" fill="#64748b">区别于植物的纤维素与细菌的肽聚糖</text>
  <rect x="470" y="168" width="400" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="488" y="192" font-size="13" fill="#134e4a" font-weight="700">渗透营养（吸收式异养）</text>
  <text x="488" y="212" font-size="11" fill="#64748b">胞外酶消化底物，再经膜吸收小分子</text>
  <rect x="890" y="168" width="400" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="908" y="192" font-size="13" fill="#134e4a" font-weight="700">无质体（不含叶绿体）</text>
  <text x="908" y="212" font-size="11" fill="#64748b">不行光合作用，依赖有机碳</text>
  <rect x="50" y="234" width="400" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="68" y="258" font-size="13" fill="#134e4a" font-weight="700">孢子繁殖</text>
  <text x="68" y="278" font-size="11" fill="#64748b">无性孢子与有性孢子交替完成生活史</text>
  <rect x="470" y="234" width="400" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="488" y="258" font-size="13" fill="#134e4a" font-weight="700">储藏多糖为糖原</text>
  <text x="488" y="278" font-size="11" fill="#64748b">而非植物储藏的淀粉</text>
  <rect x="890" y="234" width="400" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="908" y="258" font-size="13" fill="#134e4a" font-weight="700">酵母型或菌丝体型</text>
  <text x="908" y="278" font-size="11" fill="#64748b">单细胞酵母；有隔/无隔菌丝构成菌丝体</text>
  <text x="700" y="320" font-size="11" fill="#64748b" text-anchor="middle">分子系统学：真菌与动物最近缘——同属后鞭毛生物（Opisthokonta）超群</text>
  <rect x="30" y="362" width="1340" height="262" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="384.84" font-size="19" fill="#475569" font-weight="700">二、四个主要门的概览与「移出」的卵菌、黏菌</text>
  <rect x="50" y="396" width="210" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="155" y="423.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">门</text>
  <rect x="260" y="396" width="660" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="590" y="423.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">菌丝与孢子特征</text>
  <rect x="920" y="396" width="420" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1130" y="423.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">代表真菌</text>
  <rect x="50" y="440" width="210" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="155" y="465.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">子囊菌门（种类最多）</text>
  <rect x="260" y="440" width="660" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="590" y="465.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">有隔菌丝；子囊内产 8 个子囊孢子；兼有酵母型（约占已知真菌半数以上）</text>
  <rect x="920" y="440" width="420" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1130" y="465.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">酿酒酵母、青霉、脉孢霉</text>
  <rect x="50" y="480" width="1290" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="480" width="210" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="155" y="505.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">担子菌门</text>
  <rect x="260" y="480" width="660" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="590" y="505.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">有隔（常为桶孔隔膜）菌丝；担子上外生 4 个担孢子</text>
  <rect x="920" y="480" width="420" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1130" y="505.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">蘑菇、锈菌、黑粉菌</text>
  <rect x="50" y="520" width="210" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="155" y="545.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">接合菌门</text>
  <rect x="260" y="520" width="660" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="590" y="545.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">无隔多核菌丝；有性生殖产接合孢子</text>
  <rect x="920" y="520" width="420" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1130" y="545.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">毛霉、根霉</text>
  <rect x="50" y="560" width="1290" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="560" width="210" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="155" y="585.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">壶菌门</text>
  <rect x="260" y="560" width="660" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="590" y="585.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">无隔菌丝，保留游动孢子——真菌中的原始水生分支</text>
  <rect x="920" y="560" width="420" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1130" y="585.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">异水霉</text>
  <text x="50" y="612" font-size="11" fill="#dc2626">移出真菌界：卵菌（纤维素细胞壁、双鞭毛——致病疫霉引发 1840 年代爱尔兰马铃薯晚疫病，百万人死亡）与黏菌（裸变形体）经分子证据移出真菌界。</text>
  <rect x="30" y="644" width="1340" height="336" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="666.84" font-size="19" fill="#475569" font-weight="700">三、经济真菌：食用、药用与发酵工业；模式生物与真菌病害</text>
  <rect x="50" y="670" width="620" height="88" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="68" y="698" font-size="13.5" fill="#059669" font-weight="700">① 食用菌</text>
  <text x="68" y="722" font-size="11.5" fill="#475569">蘑菇、香菇、木耳等——担子菌与子囊菌的子实体，高蛋白低脂食品。</text>
  <rect x="50" y="768" width="620" height="88" rx="9" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="68" y="796" font-size="13.5" fill="#831843" font-weight="700">② 药用真菌产物</text>
  <text x="68" y="820" font-size="11.5" fill="#475569">青霉素（青霉属）等抗生素与药用真菌次级代谢产物。</text>
  <rect x="50" y="866" width="620" height="88" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="68" y="894" font-size="13.5" fill="#075985" font-weight="700">③ 发酵工业</text>
  <text x="68" y="918" font-size="11.5" fill="#475569">曲霉酶系（淀粉酶、蛋白酶等）支撑酿造、制糖等传统与现代发酵工业。</text>
  <rect x="690" y="670" width="650" height="200" rx="10" fill="#ede9fe" fill-opacity="0.3" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="710" y="698" font-size="14" fill="#4c1d95" font-weight="700">模式生物：粗糙脉孢霉（Neurospora crassa）</text>
  <text x="710" y="724" font-size="12" fill="#475569">1941 年比德尔与塔图姆以 X 射线诱变其分生孢子，获得一系列营养缺陷型突变株，</text>
  <text x="710" y="743" font-size="12" fill="#475569">再用生长谱法逐一判定缺陷的代谢步骤。</text>
  <line x1="710" y1="806" x2="710" y2="830" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <text x="726" y="822" font-size="12.5" fill="#4c1d95" font-weight="700">→ 奠定「一基因一酶」学说（1958 年诺贝尔奖）</text>
  <rect x="690" y="884" width="650" height="70" rx="9" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.4"/>
  <text x="710" y="908" font-size="12.5" fill="#dc2626" font-weight="700">机会性真菌感染</text>
  <text x="710" y="928" font-size="11.5" fill="#475569">白假丝酵母等条件致病菌在免疫低下人群中致病——临床重要挑战。</text>
</svg>