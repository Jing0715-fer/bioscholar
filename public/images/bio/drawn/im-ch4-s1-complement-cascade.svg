  <text x="370" y="673.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">C4b2a</text>
  <rect x="550" y="648" width="380" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="673.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">C4b2a</text>
