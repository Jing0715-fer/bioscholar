  <text x="1135" y="633.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">C3b · B 因子 · D 因子 · 备解素</text>
  <rect x="60" y="648" width="130" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
