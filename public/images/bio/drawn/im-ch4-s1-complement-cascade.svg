  <text x="490" y="350" font-size="9.5" fill="#64748b" text-anchor="middle">血清浓度最高（约 1.2–1.6 g/L）</text>
  <line x1="530" y1="288" x2="586" y2="288" stroke="#be185d" stroke-width="2.4" marker-end="url(#arr-enz)"/>
