  <text x="370" y="593.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">抗原-抗体复合物结合 C1q</text>
  <rect x="550" y="568" width="380" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="593.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">MBL 识别病原体表面甘露糖样糖结构</text>
  <rect x="930" y="568" width="410" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1135" y="593.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">血清 C3 持续低水平自发性水解</text>
