  <rect x="930" y="688" width="410" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1135" y="713.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">可放大的正反馈回路</text>
