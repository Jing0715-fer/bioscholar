  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">补体系统概览：三条激活途径的级联瀑布与共同末端通路</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">40 余种蛋白组成、肝细胞与单核-巨噬细胞合成，C3 血清浓度最高（约 1.2–1.6 g/L）；经典/凝集素/旁路三途径在 C3 汇合，经 C3 转化酶（C4b2a 或 C3bBb）与 C5 转化酶进入共同末端通路，C5b 募集 12–18 个 C9 形成攻膜复合物；效应涵盖溶菌、调理、过敏毒素、免疫复合物清除与 B 细胞共刺激</text>
  <rect x="30" y="132" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、补体激活的级联瀑布：三条途径在 C3 汇合，共用末端通路形成 MAC</text>
  <rect x="60" y="180" width="330" height="60" rx="8" fill="#0369a1" fill-opacity="0.1" stroke="#0369a1" stroke-width="1.7"/>
  <text x="76" y="204" font-size="13.5" fill="#075985" font-weight="700">经典途径</text>
  <text x="76" y="224" font-size="9.5" fill="#475569">免疫复合物（抗原-抗体）——结合 C1q 起步</text>
  <rect x="60" y="258" width="330" height="60" rx="8" fill="#6d28d9" fill-opacity="0.1" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="76" y="282" font-size="13.5" fill="#4c1d95" font-weight="700">凝集素途径</text>
  <text x="76" y="302" font-size="9.5" fill="#475569">甘露糖结合凝集素（MBL）——识别病原体表面糖结构</text>
  <rect x="60" y="336" width="330" height="60" rx="8" fill="#b45309" fill-opacity="0.1" stroke="#b45309" stroke-width="1.7"/>
  <text x="76" y="360" font-size="13.5" fill="#78350f" font-weight="700">旁路途径</text>
  <text x="76" y="380" font-size="9.5" fill="#475569">血清 C3 低水平自发水解——微生物表面激活并放大</text>
