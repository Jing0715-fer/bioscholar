  <text x="545" y="400" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">C3b 正反馈放大回路（回到旁路途径）</text>
  <text x="60" y="436" font-size="11" fill="#64748b">补体系统由 40 余种可溶性与膜结合蛋白组成，肝细胞与单核-巨噬细胞为主要合成场所；调节蛋白维持级联的时空边界。</text>
  <rect x="30" y="478" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="500.84" font-size="19" fill="#475569" font-weight="700">二、三条激活途径对照：殊途同归</text>
