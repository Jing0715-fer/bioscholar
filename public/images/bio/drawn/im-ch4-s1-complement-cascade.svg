  <text x="1230" y="296" font-size="9" fill="#475569">C5b·C6·C7·C8 募集 12–18 个 C9 聚合成贯穿脂质双层的管状孔道</text>
  <g><circle cx="1150" cy="350" r="5.5" fill="#dc2626" fill-opacity="0.5"/><line x1="1150" y1="354" x2="1150" y2="359" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1150" cy="363" r="5.5" fill="#dc2626" fill-opacity="0.5"/><circle cx="1174" cy="350" r="5.5" fill="#dc2626" fill-opacity="0.5"/><line x1="1174" y1="354" x2="1174" y2="359" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1174" cy="363" r="5.5" fill="#dc2626" fill-opacity="0.5"/><circle cx="1198" cy="350" r="5.5" fill="#dc2626" fill-opacity="0.5"/><line x1="1198" y1="354" x2="1198" y2="359" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1198" cy="363" r="5.5" fill="#dc2626" fill-opacity="0.5"/><circle cx="1222" cy="350" r="5.5" fill="#dc2626" fill-opacity="0.5"/><line x1="1222" y1="354" x2="1222" y2="359" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1222" cy="363" r="5.5" fill="#dc2626" fill-opacity="0.5"/><circle cx="1246" cy="350" r="5.5" fill="#dc2626" fill-opacity="0.5"/><line x1="1246" y1="354" x2="1246" y2="359" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1246" cy="363" r="5.5" fill="#dc2626" fill-opacity="0.5"/><circle cx="1270" cy="350" r="5.5" fill="#dc2626" fill-opacity="0.5"/><line x1="1270" y1="354" x2="1270" y2="359" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1270" cy="363" r="5.5" fill="#dc2626" fill-opacity="0.5"/><circle cx="1294" cy="350" r="5.5" fill="#dc2626" fill-opacity="0.5"/><line x1="1294" y1="354" x2="1294" y2="359" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1294" cy="363" r="5.5" fill="#dc2626" fill-opacity="0.5"/></g>
  <polygon points="1215,340 1226,344 1230,366 1226,370 1215,374 1210,366" fill="#dc2626" fill-opacity="0.75" stroke="#dc2626" stroke-width="1.6"/>
  <text x="1230" y="396" font-size="9.5" fill="#64748b" text-anchor="middle">管状孔道 → 溶菌溶细胞</text>
