  <rect x="60" y="880" width="1280" height="82" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="908" font-size="13.5" fill="#dc2626" font-weight="700">调节蛋白缺陷的对应疾病</text>
