<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">饥饿与应激的燃料切换：糖原 → 糖异生 → 酮体优先</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">餐后胰岛素占优；短期饥饿肝糖原约 24 h 耗尽转糖异生（日耗约 75 g 肌蛋白）；长期饥饿酮体成脑主要燃料（脑糖 120→40 g/天）；应激升糖级联</text>
  <rect x="30" y="132" width="1340" height="478" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、四阶段燃料切换：血糖来源 糖原 → 糖异生 → 酮体优先</text>
  <rect x="56" y="190" width="306" height="310" rx="10" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.6"/>
  <text x="72" y="216" font-size="18" fill="#475569" font-weight="700">① 餐后 1~4 h（饱食）</text>
  <text x="72" y="238" font-size="13.5" fill="#64748b">胰岛素 / 胰高血糖素 ↑</text>
  <text x="72" y="272" font-size="11" fill="#475569">肝与肌肉糖原合成 ↑、糖酵解 ↑；</text>
  <text x="72" y="288" font-size="11" fill="#475569">脂肪组织 LPL 活性 ↑，TAG 储存 ↑；</text>
  <text x="72" y="304" font-size="11" fill="#475569">氨基酸入肝合成蛋白。过量摄入：</text>
  <text x="72" y="320" font-size="11" fill="#475569">糖与脂肪酸转向脂肪酸合成（ACC 激活），</text>
  <text x="72" y="336" font-size="11" fill="#475569">VLDL 输出至脂肪组织储存。</text>
  <rect x="390" y="190" width="306" height="310" rx="10" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.6"/>
  <text x="406" y="216" font-size="18" fill="#475569" font-weight="700">② 短期饥饿 12~24 h</text>
  <text x="406" y="238" font-size="13.5" fill="#64748b">胰岛素 ↓ · 胰高血糖素 ↑</text>
  <text x="406" y="272" font-size="11" fill="#475569">① 肝糖原分解维持血糖（约 70~100 g，</text>
  <text x="406" y="288" font-size="11" fill="#475569">约 24 h 内耗尽）；② 糖异生渐强</text>
  <text x="406" y="304" font-size="11" fill="#475569">（甘油 · 乳酸 · 氨基酸）；③ 脂肪动员开始，</text>
  <text x="406" y="320" font-size="11" fill="#475569">肌肉改烧脂肪酸，节约葡萄糖给脑；④ 糖原耗尽后，</text>
  <text x="406" y="336" font-size="11" fill="#475569">糖异生成为血糖的唯一来源，</text>
  <text x="406" y="352" font-size="11" fill="#475569">原料主要为肌肉蛋白的丙氨酸 / 谷氨酰胺</text>
  <text x="406" y="368" font-size="11" fill="#475569">（每日约分解 75 g 蛋白）。</text>
  <rect x="724" y="190" width="306" height="310" rx="10" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.6"/>
  <text x="740" y="216" font-size="18" fill="#475569" font-weight="700">③ 长期饥饿 ≥ 3 天</text>
  <text x="740" y="238" font-size="13.5" fill="#64748b">胰岛素 ↓↓ · 胰高血糖素 ↑</text>
  <text x="740" y="272" font-size="11" fill="#475569">① 脂肪动员大幅增强 → 酮体生成显著增多</text>
  <text x="740" y="288" font-size="11" fill="#475569">（血酮 1~2 mmol/L）；② 脑适应利用酮体，</text>
  <text x="740" y="304" font-size="11" fill="#475569">葡萄糖需要降至约 40 g/天；③ 肌肉蛋白分解减少</text>
  <text x="740" y="320" font-size="11" fill="#475569">（每日 75 g → 约 20 g）；④ 肾糖异生比例上升</text>
  <text x="740" y="336" font-size="11" fill="#475569">（谷氨酰胺代谢产 NH₄⁺ 兼顾排 H⁺）；</text>
  <text x="740" y="352" font-size="11" fill="#475569">⑤ 基础代谢率下降（T₃ 转变减少）。</text>
  <rect x="1058" y="190" width="306" height="310" rx="10" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.6"/>
  <text x="1074" y="216" font-size="18" fill="#475569" font-weight="700">④ 应激（创伤 · 感染 · 手术）</text>
  <text x="1074" y="238" font-size="13.5" fill="#64748b">胰岛素相对 ↓ + 儿茶酚胺 / 糖皮质激素 ↑</text>
  <text x="1074" y="272" font-size="11" fill="#475569">交感神经兴奋 + 肾上腺素 / 糖皮质激素 / 胰高血糖素 ↑、</text>
  <text x="1074" y="288" font-size="11" fill="#475569">胰岛素相对 ↓：血糖升高（应激性高血糖，</text>
  <text x="1074" y="304" font-size="11" fill="#475569">为脑与修复组织供能）；脂肪动员 ↑；肌肉蛋白分解 ↑</text>
  <text x="1074" y="320" font-size="11" fill="#475569">（氨基酸合成急性期蛋白与糖异生）→ 应激性糖尿病。</text>
  <text x="60" y="516" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">燃料来源演进</text>
  <rect x="60" y="524" width="380" height="44" rx="8" fill="#f1f5f9" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="250" y="551" font-size="11.5" fill="#1e293b" text-anchor="middle">① 餐后：外源葡萄糖 + 糖原 / TAG 合成</text>
  <line x1="444" y1="546" x2="474" y2="546" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="480" y="524" width="400" height="44" rx="8" fill="#f1f5f9" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="680" y="551" font-size="11.5" fill="#1e293b" text-anchor="middle">② 短期饥饿：肝糖原分解（约 24 h 耗尽）→ 糖异生</text>
  <line x1="884" y1="546" x2="914" y2="546" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="920" y="524" width="400" height="44" rx="8" fill="#f1f5f9" fill-opacity="0.9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1120" y="551" font-size="11.5" fill="#1e293b" text-anchor="middle">③ 长期饥饿：酮体优先 · 脑糖 120 → 40 g/天</text>
  <rect x="30" y="644" width="700" height="336" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="666.84" font-size="19" fill="#475569" font-weight="700">二、长期饥饿的「节约」效应：数字说话</text>
  <text x="220" y="694" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">脑的葡萄糖需要量</text>
  <rect x="105.2" y="745.6521739130435" width="89.60000000000001" height="104.34782608695652" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="150" y="736.6521739130435" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">约 120 g/天</text>
  <text x="150" y="870" font-size="12.5" fill="#64748b" text-anchor="middle">平时</text>
  <rect x="245.2" y="815.2173913043479" width="89.60000000000001" height="34.78260869565217" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="290" y="806.2173913043479" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">约 40 g/天</text>
  <text x="290" y="870" font-size="12.5" fill="#64748b" text-anchor="middle">长期饥饿</text>
  <line x1="80" y1="850" x2="360" y2="850" stroke="#475569" stroke-width="1.6"/>
  <text x="540" y="694" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">肌肉蛋白分解量</text>
  <rect x="425.2" y="745.6521739130435" width="89.60000000000001" height="104.34782608695652" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="470" y="736.6521739130435" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">约 75 g/天</text>
  <text x="470" y="870" font-size="12.5" fill="#64748b" text-anchor="middle">饥饿早期</text>
  <rect x="565.2" y="822.1739130434783" width="89.60000000000001" height="27.82608695652174" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="610" y="813.1739130434783" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">约 20 g/天</text>
  <text x="610" y="870" font-size="12.5" fill="#64748b" text-anchor="middle">数日后</text>
  <line x1="400" y1="850" x2="680" y2="850" stroke="#475569" stroke-width="1.6"/>
  <text x="56" y="892" font-size="11" fill="#475569">脑适应酮体后，对葡萄糖的需要由约 120 g/天降至约 40 g/天；</text>
  <text x="56" y="908" font-size="11" fill="#475569">肌肉蛋白分解由每日约 75 g 降至约 20 g——「优先保脑 · 保护蛋白 · 以脂代糖」三大总原则的体现；血酮可升至 1~2 mmol/L。</text>
  <rect x="750" y="644" width="620" height="336" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="666.84" font-size="19" fill="#475569" font-weight="700">三、糖尿病：燃料管理程序的失控</text>
  <rect x="770" y="700" width="120" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="830" y="727.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">分型要点</text>
  <rect x="890" y="700" width="210" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="995" y="727.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">1 型</text>
  <rect x="1100" y="700" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="727.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">2 型</text>
  <rect x="770" y="744" width="120" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="830" y="771.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">胰岛</text>
  <rect x="890" y="744" width="210" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="995" y="771.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">绝对缺乏（β 细胞破坏）</text>
  <rect x="1100" y="744" width="250" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="771.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">抵抗 + 相对不足</text>
  <rect x="770" y="788" width="580" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="770" y="788" width="120" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="830" y="815.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">代谢</text>
  <rect x="890" y="788" width="210" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="995" y="815.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">GLUT4 不上膜 · 脂解失控</text>
  <rect x="1100" y="788" width="250" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="815.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">高胰岛素血症 · 高血糖</text>
  <rect x="770" y="832" width="120" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="830" y="859.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">倾向</text>
  <rect x="890" y="832" width="210" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="995" y="859.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">酮症酸中毒</text>
  <rect x="1100" y="832" width="250" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="859.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">慢性并发症为主</text>
  <text x="770" y="896" font-size="10.5" fill="#475569">生化本质：饥饿状态的「燃料管理程序」在饱食环境中错误持续开启。长期高血糖经多元醇通路 · 糖基化终产物（AGE）</text>
  <text x="770" y="911" font-size="10.5" fill="#475569">· PKC 激活 · 己糖胺通路，导致视网膜 / 肾 / 神经 / 血管并发症。</text>
</svg>