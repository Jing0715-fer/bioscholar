  <rect x="1018" y="846" width="328" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1182" y="865" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">约 2–2.5 Å（霍奇金 1964 年独享化学奖）</text>
  <rect x="730" y="873" width="616" height="27" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="873" width="92" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="776" y="892" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1965</text>
  <rect x="822" y="873" width="196" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="892" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">溶菌酶</text>
  <rect x="1018" y="873" width="328" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
