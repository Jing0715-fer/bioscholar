  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">生物大分子晶体学的黎明：1934—1969</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">1934贝尔纳胃蛋白酶母液保湿→约2Å；1953同晶置换；1958/1960肌红蛋白6/2Å；1962佩鲁茨与肯德鲁诺奖；1964霍奇金；1965溶菌酶2Å；1969胰岛素2.5Å</text>
  <rect x="30" y="132" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、大分子晶体学的黎明：1934—1969 标杆时间线</text>
  <line x1="120" y1="302" x2="1240" y2="302" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="120" cy="302" r="6.5" fill="#0369a1"/>
  <line x1="120" y1="293" x2="120" y2="272" stroke="#0369a1" stroke-width="1.7"/>
  <text x="120" y="252" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1934 贝尔纳·胃蛋白酶</text>
  <text x="120" y="232" font-size="12" fill="#64748b" text-anchor="middle">母液保湿→约 2 Å 衍射</text>
  <circle cx="411.2" cy="302" r="6.5" fill="#0369a1"/>
  <line x1="411.2" y1="311" x2="411.2" y2="332" stroke="#0369a1" stroke-width="1.7"/>
  <text x="411.2" y="352" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1953 同晶置换法</text>
  <text x="411.2" y="372" font-size="12" fill="#64748b" text-anchor="middle">佩鲁茨：重原子定相位</text>
  <circle cx="590.4" cy="302" r="6.5" fill="#0f766e"/>
  <line x1="590.4" y1="293" x2="590.4" y2="272" stroke="#0f766e" stroke-width="1.7"/>
  <text x="590.4" y="252" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1958 肌红蛋白 6 Å</text>
  <text x="590.4" y="232" font-size="12" fill="#64748b" text-anchor="middle">首张三级结构像</text>
  <circle cx="724.8000000000001" cy="302" r="6.5" fill="#0f766e"/>
  <line x1="724.8000000000001" y1="311" x2="724.8000000000001" y2="332" stroke="#0f766e" stroke-width="1.7"/>
  <text x="724.8000000000001" y="352" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1960 肌红蛋白 2 Å</text>
  <text x="724.8000000000001" y="372" font-size="12" fill="#64748b" text-anchor="middle">原子级蛋白结构首例</text>
  <circle cx="859.2" cy="302" r="6.5" fill="#6d28d9"/>
  <line x1="859.2" y1="293" x2="859.2" y2="272" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="859.2" y="252" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1962 诺贝尔化学奖</text>
  <text x="859.2" y="232" font-size="12" fill="#64748b" text-anchor="middle">佩鲁茨与肯德鲁</text>
  <circle cx="982.4" cy="302" r="6.5" fill="#b45309"/>
  <line x1="982.4" y1="311" x2="982.4" y2="332" stroke="#b45309" stroke-width="1.7"/>
  <text x="982.4" y="352" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1964 霍奇金诺奖</text>
  <text x="982.4" y="372" font-size="12" fill="#64748b" text-anchor="middle">青霉素·维生素 B12</text>
  <circle cx="1105.6" cy="302" r="6.5" fill="#be185d"/>
  <line x1="1105.6" y1="293" x2="1105.6" y2="272" stroke="#be185d" stroke-width="1.7"/>
  <text x="1105.6" y="252" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1965 溶菌酶 2 Å</text>
  <text x="1105.6" y="232" font-size="12" fill="#64748b" text-anchor="middle">首个酶结构</text>
  <circle cx="1240" cy="302" r="6.5" fill="#059669"/>
  <line x1="1240" y1="311" x2="1240" y2="332" stroke="#059669" stroke-width="1.7"/>
  <text x="1240" y="352" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1969 胰岛素 2.5 Å</text>
  <text x="1240" y="372" font-size="12" fill="#64748b" text-anchor="middle">中英协作里程碑</text>
  <text x="700" y="404" font-size="11.5" fill="#475569" text-anchor="middle">从 1934 年胃蛋白酶照片到 1969 年胰岛素结构：三十五年把「原则上不可解」变成常规；1962 年诺奖距贝尔纳照片 28 年、距佩鲁茨 1937 年开工 25 年</text>
  <rect x="30" y="452" width="660" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">二、1934 年的保湿教训：湿晶体才会衍射</text>
  <rect x="130.28" y="491.8" width="69.44" height="20.4" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="165" y="506.32" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">干燥晶体</text>
  <rect x="422.4024" y="491.8" width="135.1952" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="490" y="506.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">毛细管封存·浸没母液</text>
  <rect x="58" y="556" width="44" height="24" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="80" y="572" font-size="9.5" fill="#475569" text-anchor="middle">X 射线</text>
  <line x1="106" y1="568" x2="178" y2="615" stroke="#d97706" stroke-width="2" marker-end="url(#arr-warn)"/>
  <polygon points="172,596 228,588 252,620 224,656 178,650" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="196" y1="606" x2="216" y2="640" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="222" y1="604" x2="208" y2="644" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="258" y1="646" x2="322" y2="676" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arr-mute)"/>
  <text x="300" y="700" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">几乎不衍射</text>
  <rect x="352" y="560" width="210" height="150" rx="16" fill="#e0f2fe" fill-opacity="0.55" stroke="#475569" stroke-width="2"/>
  <rect x="344" y="566" width="8" height="138" rx="2" fill="#475569"/>
  <rect x="562" y="566" width="8" height="138" rx="2" fill="#475569"/>
  <text x="457" y="584" font-size="10" fill="#075985" text-anchor="middle">母液保持湿润</text>
  <polygon points="420,616 466,608 488,638 462,672 420,664" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <line x1="300" y1="596" x2="408" y2="632" stroke="#d97706" stroke-width="2" marker-end="url(#arr-warn)"/>
  <rect x="588" y="556" width="16" height="158" rx="3" fill="#334155"/>
  <text x="596" y="732" font-size="9.5" fill="#64748b" text-anchor="middle">底片</text>
  <line x1="486" y1="640" x2="574" y2="586" stroke="#be185d" stroke-width="1.6" marker-end="url(#arr-enz)"/>
  <circle cx="586" cy="586" r="3.4" fill="#be185d"/>
  <line x1="486" y1="640" x2="571" y2="616" stroke="#be185d" stroke-width="1.6" marker-end="url(#arr-enz)"/>
  <circle cx="583" cy="616" r="3.4" fill="#be185d"/>
  <line x1="486" y1="640" x2="572" y2="646" stroke="#be185d" stroke-width="1.6" marker-end="url(#arr-enz)"/>
  <circle cx="584" cy="646" r="3.4" fill="#be185d"/>
  <line x1="486" y1="640" x2="570" y2="676" stroke="#be185d" stroke-width="1.6" marker-end="url(#arr-enz)"/>
  <circle cx="582" cy="676" r="3.4" fill="#be185d"/>
  <line x1="486" y1="640" x2="573" y2="700" stroke="#be185d" stroke-width="1.6" marker-end="url(#arr-enz)"/>
  <circle cx="585" cy="700" r="3.4" fill="#be185d"/>
  <text x="490" y="748" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">衍射斑点延伸到约 2 Å 角域</text>
  <text x="50" y="782" font-size="10.5" fill="#475569">贝尔纳与克劳福特（婚后的霍奇金）把一粒胃蛋白酶晶体置于 X 射线束前：干燥晶体几乎不衍射；封入毛细管、</text>
  <text x="50" y="797.5" font-size="10.5" fill="#475569">浸没母液保持湿润的晶体给出清晰斑点。蛋白晶体是裹挟大量母液的「湿晶体」，</text>
  <text x="50" y="813" font-size="10.5" fill="#475569">内部长程有序完好——保湿从此成为不可动摇的操作纪律（低温冷冻只是它的发展而非否定）。</text>
  <text x="50" y="876" font-size="10.5" fill="#64748b">观念背景：萨姆纳 1926 年结晶脲酶、诺思罗普 1930 年前后结晶胃蛋白酶与胰蛋白酶（分享 1946 年诺贝尔化学奖）</text>
  <text x="50" y="891.5" font-size="10.5" fill="#64748b">已证明酶是可纯化的均一分子；贝尔纳的照片再进一步——蛋白质内部排列与简单盐类同样规则。</text>
  <rect x="710" y="452" width="660" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="474.84" font-size="19" fill="#475569" font-weight="700">三、同晶置换法与早期标杆结构</text>
  <rect x="725" y="496" width="130" height="58" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="790" y="519" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">天然晶体</text>
  <text x="790" y="540" font-size="10.5" fill="#475569" text-anchor="middle">|F<tspan dy="2.3" font-size="7.6">P</tspan><tspan dy="-2.3">|</tspan></text>
  <rect x="875" y="496" width="130" height="58" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="940" y="519" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">＋Hg 重原子</text>
  <text x="940" y="540" font-size="10.5" fill="#475569" text-anchor="middle">同晶衍生物 |F<tspan dy="2.3" font-size="7.6">PH</tspan><tspan dy="-2.3">|</tspan></text>
  <rect x="1025" y="496" width="130" height="58" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1090" y="519" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">差值 Patterson</text>
  <text x="1090" y="540" font-size="10.5" fill="#475569" text-anchor="middle">定位重原子</text>
  <rect x="1175" y="496" width="130" height="58" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1240" y="519" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">多对联立</text>
  <text x="1240" y="540" font-size="10.5" fill="#475569" text-anchor="middle">解出相位（MIR）</text>
  <line x1="856" y1="525" x2="872" y2="525" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="1006" y1="525" x2="1022" y2="525" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="1156" y1="525" x2="1172" y2="525" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="852" y="571.5" width="176" height="17" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="940" y="583.6" font-size="10" fill="#64748b" text-anchor="middle">同晶＝晶胞参数与分子排布基本不变</text>
  <text x="730" y="616" font-size="10.5" fill="#475569">1953 年佩鲁茨发明重原子同晶置换法：把汞等重原子选择性引入与天然蛋白同晶的少数位点，</text>
  <text x="730" y="631.5" font-size="10.5" fill="#475569">比较两套衍射强度即可逐步推算相位；肯德鲁为肌红蛋白 2 Å 工作制备至少 5 种重原子衍生物，「多对同晶置换」（MIR）</text>
  <text x="730" y="647" font-size="10.5" fill="#475569">流程由此定型。</text>
  <text x="1038" y="682" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">早期标杆结构一览</text>
  <rect x="730" y="694" width="92" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="776" y="721.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">年份</text>
  <rect x="822" y="694" width="196" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="721.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">结构</text>
  <rect x="1018" y="694" width="328" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1182" y="721.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">分辨率与要点</text>
  <rect x="730" y="738" width="92" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="776" y="757" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1934</text>
  <rect x="822" y="738" width="196" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="757" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">胃蛋白酶（母液中）</text>
  <rect x="1018" y="738" width="328" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1182" y="757" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">衍射照片，约 2 Å 角域</text>
  <rect x="730" y="765" width="616" height="27" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="765" width="92" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="776" y="784" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1958</text>
  <rect x="822" y="765" width="196" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="784" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">肌红蛋白</text>
  <rect x="1018" y="765" width="328" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1182" y="784" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">6 Å·首张三级结构像</text>
  <rect x="730" y="792" width="92" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="776" y="811" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1960</text>
  <rect x="822" y="792" width="196" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="811" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">肌红蛋白</text>
  <rect x="1018" y="792" width="328" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1182" y="811" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">2 Å·原子级蛋白结构首例</text>
  <rect x="730" y="819" width="616" height="27" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="819" width="92" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="776" y="838" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">1959</text>
  <rect x="822" y="819" width="196" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="920" y="838" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">血红蛋白</text>
  <rect x="1018" y="819" width="328" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1182" y="838" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">5.5 Å·后至原子级</text>
  <rect x="730" y="846" width="92" height="27" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
