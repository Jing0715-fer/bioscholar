<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">病毒学发展史：从滤过性因子到逆转录酶（1892—1970）</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">1892伊万诺夫斯基／1898贝杰林克「传染性活液」；1935斯坦利结晶TMV（1946诺奖）；1949恩德斯组织培养（1954诺奖）；1970逆转录酶（1975诺奖）</text>
  <rect x="30" y="132" width="1340" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、病毒学发展史：1892—1970 的里程碑</text>
  <line x1="110" y1="300" x2="1270" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="110" cy="300" r="6.5" fill="#0369a1"/>
  <line x1="110" y1="291" x2="110" y2="270" stroke="#0369a1" stroke-width="1.7"/>
  <text x="110" y="250" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1892 伊万诺夫斯基</text>
  <text x="110" y="230" font-size="12" fill="#64748b" text-anchor="middle">滤液仍使烟株发病</text>
  <circle cx="255" cy="300" r="6.5" fill="#0369a1"/>
  <line x1="255" y1="309" x2="255" y2="330" stroke="#0369a1" stroke-width="1.7"/>
  <text x="255" y="350" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1898 贝杰林克</text>
  <text x="255" y="370" font-size="12" fill="#64748b" text-anchor="middle">「传染性活液」</text>
  <circle cx="400" cy="300" r="6.5" fill="#0369a1"/>
  <line x1="400" y1="291" x2="400" y2="270" stroke="#0369a1" stroke-width="1.7"/>
  <text x="400" y="250" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1900 里德</text>
  <text x="400" y="230" font-size="12" fill="#64748b" text-anchor="middle">黄热病＝首个人类病毒</text>
  <circle cx="545" cy="300" r="6.5" fill="#0f766e"/>
  <line x1="545" y1="309" x2="545" y2="330" stroke="#0f766e" stroke-width="1.7"/>
  <text x="545" y="350" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1917 德赫雷尔</text>
  <text x="545" y="370" font-size="12" fill="#64748b" text-anchor="middle">发现并命名噬菌体</text>
  <circle cx="690" cy="300" r="6.5" fill="#be185d"/>
  <line x1="690" y1="291" x2="690" y2="270" stroke="#be185d" stroke-width="1.7"/>
  <text x="690" y="250" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1935 斯坦利</text>
  <text x="690" y="230" font-size="12" fill="#64748b" text-anchor="middle">结晶 TMV</text>
  <circle cx="835" cy="300" r="6.5" fill="#be185d"/>
  <line x1="835" y1="309" x2="835" y2="330" stroke="#be185d" stroke-width="1.7"/>
  <text x="835" y="350" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1939 考舍等</text>
  <text x="835" y="370" font-size="12" fill="#64748b" text-anchor="middle">首张病毒电镜像</text>
  <circle cx="980" cy="300" r="6.5" fill="#b45309"/>
  <line x1="980" y1="291" x2="980" y2="270" stroke="#b45309" stroke-width="1.7"/>
  <text x="980" y="250" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1949 恩德斯等</text>
  <text x="980" y="230" font-size="12" fill="#64748b" text-anchor="middle">脊灰组织培养</text>
  <circle cx="1125" cy="300" r="6.5" fill="#b45309"/>
  <line x1="1125" y1="309" x2="1125" y2="330" stroke="#b45309" stroke-width="1.7"/>
  <text x="1125" y="350" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1955 弗伦克尔-康拉特</text>
  <text x="1125" y="370" font-size="12" fill="#64748b" text-anchor="middle">重建 TMV</text>
  <circle cx="1270" cy="300" r="6.5" fill="#dc2626"/>
  <line x1="1270" y1="291" x2="1270" y2="270" stroke="#dc2626" stroke-width="1.7"/>
  <text x="1270" y="250" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1970 特明 / 巴尔的摩</text>
  <text x="1270" y="230" font-size="12" fill="#64748b" text-anchor="middle">证实逆转录酶</text>
  <text x="700" y="418" font-size="11.5" fill="#475569" text-anchor="middle">从滤过性因子到逆转录酶：滤器（1892）—结晶（1935）—电镜（1939）—组织培养（1949）——每一次工具革新都重写了「病毒」的定义</text>
  <rect x="30" y="470" width="660" height="246" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="492.84" font-size="19" fill="#475569" font-weight="700">二、滤过性因子：病毒学的开端</text>
  <rect x="50" y="528" width="120" height="52" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="110" y="550" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">患病烟叶</text>
  <text x="110" y="568" font-size="10.5" fill="#64748b" text-anchor="middle">研磨汁液</text>
  <line x1="174" y1="554" x2="206" y2="554" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <polygon points="216,526 336,526 318,580 234,580" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="226" y1="534" x2="252" y2="572" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="250" y1="534" x2="274" y2="572" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="274" y1="534" x2="296" y2="572" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="298" y1="534" x2="318" y2="572" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="276" y="596" font-size="10.5" fill="#64748b" text-anchor="middle">尚贝兰细菌滤器</text>
  <line x1="346" y1="554" x2="378" y2="554" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="388" y="528" width="110" height="52" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="443" y="558" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">无菌滤液</text>
  <line x1="504" y1="554" x2="536" y2="554" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <rect x="546" y="528" width="124" height="52" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="608" y="550" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">健康烟株</text>
  <text x="608" y="568" font-size="10.5" fill="#dc2626" text-anchor="middle">仍然发病</text>
  <text x="50" y="628" font-size="12" fill="#1e293b" font-weight="700">1898 年贝杰林克的四项判据：</text>
  <rect x="83.5" y="646.65" width="73" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="120" y="659.96" font-size="11" fill="#075985" text-anchor="middle">能透过滤器</text>
  <rect x="206" y="646.65" width="84" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="248" y="659.96" font-size="11" fill="#075985" text-anchor="middle">可扩散入琼脂</text>
  <rect x="323.5" y="646.65" width="117" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="382" y="659.96" font-size="11" fill="#075985" text-anchor="middle">无细胞培养基不生长</text>
  <rect x="504.5" y="646.65" width="95" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="552" y="659.96" font-size="11" fill="#075985" text-anchor="middle">活植株内可增殖</text>
  <text x="360" y="696" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">结论：一种「传染性活液」——病毒学诞生</text>
  <rect x="710" y="470" width="660" height="246" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="492.84" font-size="19" fill="#475569" font-weight="700">三、TMV：从结晶到重建（病毒成为「分子」）</text>
  <rect x="739.572" y="538.225" width="76.856" height="19.55" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="778" y="552.14" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">1935 结晶</text>
  <polygon points="900,528 1010,518 1014,526 904,536" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <polygon points="908,536 1018,548 1016,556 906,544" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="900" y="574" font-size="10.5" fill="#475569">斯坦利提纯针状结晶，溶解后仍具感染性</text>
  <text x="740" y="574" font-size="10.5" fill="#475569">1946 年诺贝尔化学奖；</text>
  <text x="740" y="588" font-size="10.5" fill="#475569">病毒的化学本质首次被「拿到手里」。</text>
  <rect x="739.572" y="612.225" width="76.856" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="778" y="626.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">1936 组成</text>
  <rect x="900" y="610" width="285" height="22" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="1185" y="610" width="15" height="22" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="1050" y="648" font-size="10.5" fill="#4c1d95" text-anchor="middle">蛋白质约 95%</text>
  <text x="1192" y="648" font-size="10.5" fill="#b45309" text-anchor="middle">RNA 5%</text>
  <text x="740" y="650" font-size="10.5" fill="#475569">鲍登与皮里：</text>
  <text x="740" y="664" font-size="10.5" fill="#475569">病毒确认为一类核蛋白。</text>
  <rect x="739.572" y="686.225" width="76.856" height="19.55" rx="7" fill="#b45309" stroke-width="1.5"/>
  <text x="778" y="700.14" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">1955 重建</text>
  <text x="900" y="690" font-size="11" fill="#78350f" font-weight="700">分离的蛋白亚基 + RNA 重新装配 → 仍具感染性：遗传信息在 RNA。</text>
  <rect x="30" y="736" width="1340" height="244" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="758.84" font-size="19" fill="#475569" font-weight="700">四、定量时代与中心法则的补全</text>
  <text x="50" y="786" font-size="11" fill="#475569">组织培养革命：</text>
  <text x="50" y="802" font-size="11" fill="#475569">1949 年恩德斯等实现脊髓灰质炎病毒的非神经组织培养，</text>
  <text x="50" y="818" font-size="11" fill="#475569">获 1954 年诺贝尔奖；</text>
  <text x="50" y="834" font-size="11" fill="#475569">组织培养与蚀斑法使病毒学走向定量化。</text>
  <rect x="380" y="792" width="140" height="50" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="450" y="822" font-size="16" fill="#134e4a" text-anchor="middle" font-weight="700">DNA</text>
  <line x1="528" y1="817" x2="618" y2="817" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="573" y="800" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">转录</text>
  <rect x="626" y="792" width="140" height="50" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="696" y="822" font-size="16" fill="#78350f" text-anchor="middle" font-weight="700">RNA</text>
  <line x1="774" y1="817" x2="864" y2="817" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="819" y="800" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">翻译</text>
  <rect x="872" y="792" width="150" height="50" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="947" y="822" font-size="15" fill="#4c1d95" text-anchor="middle" font-weight="700">蛋白质</text>
  <path d="M 700,855 C 620,905 520,905 448,862" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arr-bad)"/>
  <text x="575" y="905" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">逆转录（1970 年证实）</text>
  <text x="710" y="886" font-size="11" fill="#475569">逆转录酶：特明与巴尔的摩于 1970 年各自证实，</text>
  <text x="710" y="902" font-size="11" fill="#475569">与杜尔贝科共获 1975 年诺贝尔生理学或医学奖——中心法则自此有了反向箭头。</text>
  <text x="50" y="920" font-size="11" fill="#475569">同期工具箱：电镜（1939）看到颗粒、结晶（1935）拿到分子、组织培养与蚀斑法（1949—）</text>
  <text x="50" y="936" font-size="11" fill="#475569">数出数目——病毒学从「不可见」走向「可计数、可操纵」。</text>
</svg>