    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">负染技术：以重元素造背景的快速筛查</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">辉光放电（15–30mA、约60s）→滴样3–5μL吸附30–60s→滤纸吸干→染色30–60s（可两次）→空气干燥；分辨率约15–20Å，半小时给出二维形态学答案</text>
  <rect x="30" y="132" width="1340" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、五步操作流程（全程不过十分钟）</text>
  <rect x="55" y="190" width="240" height="140" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="175" y="216" font-size="13.5" fill="#075985" text-anchor="middle" font-weight="700">① 辉光放电</text>
  <text x="175" y="242" font-size="10.5" fill="#475569" text-anchor="middle">连续碳膜铜网亲水化</text>
  <text x="175" y="261" font-size="10.5" fill="#475569" text-anchor="middle">典型 15–30 mA、约 60 s</text>
  <text x="175" y="280" font-size="10.5" fill="#475569" text-anchor="middle">接触角 &gt; 90° → &lt; 20°</text>
  <text x="175" y="299" font-size="10.5" fill="#475569" text-anchor="middle">否则水滴缩球、颗粒附不上</text>
  <rect x="330" y="190" width="240" height="140" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="450" y="216" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="700">② 滴样吸附</text>
  <text x="450" y="242" font-size="10.5" fill="#475569" text-anchor="middle">滴上约 3–5 μL 样品</text>
  <text x="450" y="261" font-size="10.5" fill="#475569" text-anchor="middle">静置 30–60 s</text>
  <text x="450" y="280" font-size="10.5" fill="#475569" text-anchor="middle">静电与物理吸附贴膜</text>
  <text x="450" y="299" font-size="10.5" fill="#475569" text-anchor="middle">亲和强者数秒即足</text>
  <rect x="605" y="190" width="240" height="140" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="725" y="216" font-size="13.5" fill="#4c1d95" text-anchor="middle" font-weight="700">③ 滤纸吸干</text>
  <text x="725" y="242" font-size="10.5" fill="#475569" text-anchor="middle">滤纸从网边吸走液滴</text>
  <text x="725" y="261" font-size="10.5" fill="#475569" text-anchor="middle">残液量决定染壳厚度</text>
  <text x="725" y="280" font-size="10.5" fill="#475569" text-anchor="middle">滤纸批次与含湿量是变量</text>
  <rect x="880" y="190" width="240" height="140" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="1000" y="216" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="700">④ 染色</text>
  <text x="1000" y="242" font-size="10.5" fill="#475569" text-anchor="middle">滴染液 30–60 s 后吸干</text>
  <text x="1000" y="261" font-size="10.5" fill="#475569" text-anchor="middle">可重复一次加深衬度</text>
  <text x="1000" y="280" font-size="10.5" fill="#475569" text-anchor="middle">染液浓度 0.5–2%（w/v）</text>
  <rect x="1155" y="190" width="240" height="140" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="1275" y="216" font-size="13.5" fill="#065f46" text-anchor="middle" font-weight="700">⑤ 空气干燥</text>
  <text x="1275" y="242" font-size="10.5" fill="#475569" text-anchor="middle">空气中自然干燥即成</text>
  <text x="1275" y="261" font-size="10.5" fill="#475569" text-anchor="middle">样品浓度约 10–50 μg/mL</text>
  <text x="1275" y="280" font-size="10.5" fill="#475569" text-anchor="middle">太稀颗粒寥寥、太浓叠罗汉</text>
  <line x1="297" y1="260" x2="326" y2="260" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="572" y1="260" x2="601" y2="260" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="847" y1="260" x2="876" y2="260" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="1122" y1="260" x2="1151" y2="260" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="700" y="372" font-size="10.5" fill="#475569" text-anchor="middle">常规筛查以连续碳膜为默认（颗粒密度高而均匀）；微孔碳膜让部分颗粒悬于孔内薄冰，形态统计更接近溶液状态</text>
  <text x="700" y="400" font-size="10.5" fill="#64748b" text-anchor="middle">历史：1962 年 Caspar 与 Klug 从负染病毒图像提炼二十面体准等价理论；TMV 螺旋参数同样先由负染定调</text>
  <rect x="30" y="444" width="660" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="466.84" font-size="19" fill="#475569" font-weight="700">二、染液三杰与选择</text>
  <rect x="50" y="488" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="515.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">染液</text>
  <rect x="160" y="488" width="90" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="515.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">常用浓度</text>
  <rect x="250" y="488" width="120" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="515.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">pH 特点</text>
  <rect x="370" y="488" width="300" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="520" y="515.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">适用与注意</text>
  <rect x="50" y="532" width="110" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="559.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">醋酸铀 UAc</text>
  <rect x="160" y="532" width="90" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="559.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">1–2%</text>
  <rect x="250" y="532" width="120" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="559.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">约 4</text>
  <rect x="370" y="532" width="300" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="520" y="559.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">通用、颗粒细腻；酸性改变某些蛋白</text>
  <rect x="50" y="576" width="620" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="576" width="110" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="603.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">甲酸铀 UF</text>
  <rect x="160" y="576" width="90" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="603.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">0.5–1%</text>
  <rect x="250" y="576" width="120" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="603.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">约 3.5–4</text>
  <rect x="370" y="576" width="300" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="520" y="603.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">颗粒最细、细节最佳；须新鲜配制并过滤</text>
  <rect x="50" y="620" width="110" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="105" y="647.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">磷钨酸 PTA</text>
  <rect x="160" y="620" width="90" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="205" y="647.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">1–2%</text>
  <rect x="250" y="620" width="120" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="310" y="647.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">可调至中性</text>
  <rect x="370" y="620" width="300" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="520" y="647.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">对酶颗粒与 pH 敏感样品友好</text>
  <text x="50" y="690" font-size="10.5" fill="#475569">铀（Z = 92）与钨（Z = 74）电子密度远高于有机物；两型化学：铀酰离子与负电基团配位渗入（UAc / UF），</text>
  <text x="50" y="705" font-size="10.5" fill="#475569">磷钨酸根与蛋白相斥仅机械包裹且 pH 可调。</text>
  <rect x="710" y="444" width="660" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="466.84" font-size="19" fill="#475569" font-weight="700">三、负片成像原理：亮颗粒嵌于暗背景</text>
  <rect x="740" y="490" width="260" height="180" rx="5" fill="#1e293b"/>
  <circle cx="752" cy="502" r="1.6" fill="#475569" opacity="0.8"/>
  <circle cx="818.2500542609487" cy="540.3813894149862" r="3.152019984647268" fill="#475569" opacity="0.8"/>
  <circle cx="940.0920498585838" cy="600.9731722027791" r="3.1477379608448244" fill="#475569" opacity="0.8"/>
  <circle cx="933.2099847974023" cy="538.2395684002913" r="2.092135892003353" fill="#475569" opacity="0.8"/>
