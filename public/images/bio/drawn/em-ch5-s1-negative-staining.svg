  <circle cx="848.2341743510624" cy="595.4104739262257" r="2.8876234218569152" fill="#475569" opacity="0.8"/>
  <circle cx="809.9792290239129" cy="518.6806068452861" r="3.1458271192444958" fill="#475569" opacity="0.8"/>
  <circle cx="803.0992010425325" cy="522.3385113022123" r="3.05007237436476" fill="#475569" opacity="0.8"/>
