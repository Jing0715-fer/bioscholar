  <circle cx="853.9937834113007" cy="584.5549247784656" r="2.934120687508676" fill="#475569" opacity="0.8"/>
  <circle cx="918.580067590985" cy="546.8225710505167" r="2.2463717082909174" fill="#475569" opacity="0.8"/>
  <circle cx="968.1670869280788" cy="504.45343132165726" r="3.2436894449288958" fill="#475569" opacity="0.8"/>
  <circle cx="867.6894868014788" cy="543.76473732046" r="2.1109606881607763" fill="#475569" opacity="0.8"/>
  <circle cx="878.2640075230593" cy="503.63394142722245" r="2.6358320318624466" fill="#475569" opacity="0.8"/>
  <circle cx="920.5078183790756" cy="604.0212628633035" r="2.7001548578246366" fill="#475569" opacity="0.8"/>
  <circle cx="917.7405894297117" cy="552.154353119684" r="2.171271745691047" fill="#475569" opacity="0.8"/>
  <circle cx="935.1502735733229" cy="597.0398893684178" r="1.6545400989267365" fill="#475569" opacity="0.8"/>
  <circle cx="829.9455749799672" cy="593.1543142352748" r="2.4702546149906994" fill="#475569" opacity="0.8"/>
  <polygon points="870,534 909.8371685740842,557 909.8371685740842,603 870,626 830.1628314259158,603 830.1628314259158,557" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="870" y="700" font-size="10.5" fill="#475569" text-anchor="middle">负染像：颗粒成亮影、染壳背景暗（负片式）</text>
  <text x="1020" y="510" font-size="10.5" fill="#475569">重金属盐干燥成壳包埋颗粒；成像正片逻辑里颗粒成了亮影、</text>
  <text x="1020" y="526" font-size="10.5" fill="#475569">背景才是暗底——「负」染之名由此而来。</text>
  <rect x="1114.7369" y="591.075" width="120.52619999999999" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1175" y="603.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">分辨率 15–20 Å 封顶</text>
  <rect x="1124" y="623.075" width="102" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1175" y="635.78" font-size="10.5" fill="#991b1b" text-anchor="middle">空气干燥压扁假象</text>
  <rect x="1108.46" y="655.075" width="133.07999999999998" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1175" y="667.78" font-size="10.5" fill="#991b1b" text-anchor="middle">优先取向 / 内部密度缺失</text>
  <rect x="30" y="728" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="750.84" font-size="19" fill="#475569" font-weight="700">四、负染 vs 冷冻单颗粒：先侦察、后主攻</text>
  <rect x="50" y="772" width="180" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="799.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">投入项</text>
  <rect x="230" y="772" width="350" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="405" y="799.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">负染</text>
  <rect x="580" y="772" width="370" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="765" y="799.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">冷冻单颗粒</text>
  <rect x="50" y="816" width="180" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="837.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">蛋白用量</text>
  <rect x="230" y="816" width="350" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="405" y="837.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">数微升、约 0.1–0.5 μg</text>
  <rect x="580" y="816" width="370" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="765" y="837.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">数十微升、约 10–100 μg</text>
  <rect x="50" y="848" width="900" height="32" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="848" width="180" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="869.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">浓度要求</text>
  <rect x="230" y="848" width="350" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="405" y="869.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">约 10–50 μg/mL</text>
  <rect x="580" y="848" width="370" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="765" y="869.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">约 0.5–5 mg/mL</text>
  <rect x="50" y="880" width="180" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="901.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">设备与耗材</text>
  <rect x="230" y="880" width="350" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="405" y="901.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">铜网、染液、常温电镜</text>
  <rect x="580" y="880" width="370" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="765" y="901.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">冷冻制样装置、低温冷台、机时</text>
  <rect x="50" y="912" width="900" height="32" fill="#f8fafc" fill-opacity="0.85"/>
