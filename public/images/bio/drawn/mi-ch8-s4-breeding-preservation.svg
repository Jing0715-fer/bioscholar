  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">菌种选育、衰退与保藏：从自然选育到基因工程的四条路线</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">诱变育种中等致死率70%–80%正突变比例更高；营养缺陷型靠CM/MM、影印与青霉素浓缩；PEG30%–40%促融；1982胰岛素、1986乙肝疫苗；保藏以冻干与液氮最优</text>
  <rect x="30" y="132" width="1340" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、菌种选育的四条路线：随机性递减、定向性递增</text>
  <rect x="50" y="162" width="320" height="168" rx="10" fill="#f1f5f9" fill-opacity="0.5" stroke="#64748b" stroke-width="1.7"/>
  <rect x="172.19" y="180.525" width="75.62" height="22.95" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="210" y="196.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">自然选育</text>
  <text x="66" y="226" font-size="11" fill="#475569">从生产与自然界筛选自发突变——效率低，</text>
  <text x="66" y="242" font-size="11" fill="#475569">但青霉素早期产量提升即始于此</text>
  <rect x="390" y="162" width="320" height="168" rx="10" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.7"/>
  <rect x="512.19" y="180.525" width="75.62" height="22.95" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="550" y="196.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">诱变育种</text>
  <text x="406" y="226" font-size="11" fill="#475569">NTG 与 UV 诱变 + 筛选；</text>
  <text x="406" y="242" font-size="11" fill="#475569">产量提升靠多轮诱变-筛选累积——工业主力</text>
  <rect x="730" y="162" width="320" height="168" rx="10" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.7"/>
  <rect x="838.285" y="180.525" width="103.43" height="22.95" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="890" y="196.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">原生质体融合</text>
  <text x="746" y="226" font-size="11" fill="#475569">酶解壁 + PEG-Ca²⁺ 促融 + 高渗再生——打破种间杂交屏障实现远缘重组</text>
  <rect x="1070" y="162" width="320" height="168" rx="10" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.7"/>
  <rect x="1192.19" y="180.525" width="75.62" height="22.95" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1230" y="196.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">基因工程</text>
  <text x="1086" y="226" font-size="11" fill="#475569">体外定向装配并导回宿主——从随机到精准</text>
  <line x1="60" y1="352" x2="1330" y2="352" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <text x="700" y="342" font-size="10.5" fill="#64748b" text-anchor="middle">技术演进方向</text>
  <rect x="30" y="424" width="660" height="276" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="446.84" font-size="19" fill="#475569" font-weight="700">二、诱变育种要点：中等致死率区正突变比例常更高；营养缺陷型检出</text>
  <rect x="60" y="490" width="280" height="150" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="60" y1="602.5" x2="340" y2="602.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="130" y1="640" x2="130" y2="490" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="60" y1="565" x2="340" y2="565" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="200" y1="640" x2="200" y2="490" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="60" y1="527.5" x2="340" y2="527.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="270" y1="640" x2="270" y2="490" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="200" y1="640" x2="200" y2="646" stroke="#475569" stroke-width="1.8"/>
  <text x="200" y="662" font-size="13" fill="#64748b" text-anchor="middle">中等剂量</text>
  <line x1="312" y1="640" x2="312" y2="646" stroke="#475569" stroke-width="1.8"/>
  <text x="312" y="662" font-size="13" fill="#64748b" text-anchor="middle">重剂量</text>
  <line x1="54" y1="632.5" x2="60" y2="632.5" stroke="#475569" stroke-width="1.8"/>
  <text x="50" y="636.5" font-size="13" fill="#64748b" text-anchor="end">低</text>
  <line x1="54" y1="565" x2="60" y2="565" stroke="#475569" stroke-width="1.8"/>
  <text x="50" y="569" font-size="13" fill="#64748b" text-anchor="end">中</text>
  <line x1="54" y1="497.5" x2="60" y2="497.5" stroke="#475569" stroke-width="1.8"/>
  <text x="50" y="501.5" font-size="13" fill="#64748b" text-anchor="end">高</text>
  <text x="200" y="684" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">诱变剂量（UV 照射时间）</text>
  <text x="270" y="515" font-size="13" fill="#475569" font-weight="600">相对比例</text>
  <path d="M60.0,490.0 L116.0,527.5 L172.0,565.0 L214.0,595.0 L256.0,610.0 L298.0,622.0 L340.0,632.5" fill="none" stroke="#0f766e" stroke-width="2.6"/>
  <path d="M60.0,632.5 L116.0,610.0 L172.0,572.5 L233.6,532.0 L284.0,565.0 L340.0,602.5" fill="none" stroke="#d97706" stroke-width="2.6"/>
  <rect x="140" y="611.8" width="11" height="8.4" rx="3" fill="#0f766e" stroke="#cbd5e1" stroke-width="1"/>
  <text x="159" y="619.6" font-size="10" fill="#475569">存活率</text>
  <rect x="199" y="611.8" width="11" height="8.4" rx="3" fill="#d97706" stroke="#cbd5e1" stroke-width="1"/>
  <text x="218" y="619.6" font-size="10" fill="#475569">正突变比例</text>
  <text x="50" y="470" font-size="10" fill="#64748b">中等致死率（约 70%–80%）区间正突变（增产）比例常更高；</text>
  <text x="50" y="484" font-size="10" fill="#64748b">重剂量染色体损伤大、负突变与死亡占优。</text>
  <text x="380" y="464" font-size="12.5" fill="#1e293b" font-weight="700">营养缺陷型的检出与浓缩</text>
  <rect x="380" y="470" width="290" height="172" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <circle cx="396" cy="488" r="3.5" fill="#be185d"/>
  <text x="408" y="492" font-size="11.5" fill="#1e293b" font-weight="700">CM / MM 对照</text>
  <text x="408" y="508" font-size="10" fill="#475569">完全培养基全生长、</text>
  <text x="408" y="521" font-size="10" fill="#475569">基本培养基仅原养型生长——初步定位缺陷</text>
  <circle cx="396" cy="540" r="3.5" fill="#be185d"/>
  <text x="408" y="544" font-size="11.5" fill="#1e293b" font-weight="700">影印法鉴定</text>
  <text x="408" y="560" font-size="10" fill="#475569">影印平板比对，精确挑取缺陷菌落</text>
  <circle cx="396" cy="592" r="3.5" fill="#be185d"/>
  <text x="408" y="596" font-size="11.5" fill="#1e293b" font-weight="700">青霉素浓缩法</text>
  <text x="408" y="612" font-size="10" fill="#475569">MM + 青霉素：野生型生长中被杀死，</text>
  <text x="408" y="625" font-size="10" fill="#475569">缺陷型不生长反而存活——浓度可提高数十倍</text>
  <rect x="710" y="424" width="660" height="276" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="446.84" font-size="19" fill="#475569" font-weight="700">三、基因工程育种：载体演进与里程碑产品</text>
  <circle cx="880" cy="540" r="56" fill="none" stroke="#0369a1" stroke-width="6" opacity="0.85"/>
  <text x="880" y="466" font-size="12.5" fill="#0369a1" text-anchor="middle" font-weight="700">ampR</text>
  <line x1="880" y1="484" x2="880" y2="473" stroke="#0369a1" stroke-width="1.5"/>
  <text x="880" y="622" font-size="12.5" fill="#0369a1" text-anchor="middle" font-weight="700">tetR</text>
  <line x1="880" y1="596" x2="880" y2="607" stroke="#0369a1" stroke-width="1.5"/>
  <text x="946" y="545" font-size="14" fill="#0369a1" font-weight="700">pBR322（4361 bp）</text>
  <text x="730" y="636" font-size="10.5" fill="#475569">第一代通用载体 pBR322：由 pSC101 与 ColE1 片段拼装，</text>
  <text x="730" y="651" font-size="10.5" fill="#475569">带 ampR 与 tetR 双抗性标记与十余个单一切点，</text>
  <text x="730" y="666" font-size="10.5" fill="#475569">靠插入失活筛选重组子；此后演进至 pUC 系列与 Ti 双元载体。</text>
  <text x="1210" y="496" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">里程碑产品</text>
  <line x1="1090" y1="530" x2="1330" y2="530" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="1138" cy="530" r="6.5" fill="#0f766e"/>
  <line x1="1138" y1="521" x2="1138" y2="500" stroke="#0f766e" stroke-width="1.7"/>
  <text x="1138" y="480" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1982</text>
  <text x="1138" y="460" font-size="12" fill="#64748b" text-anchor="middle">重组人胰岛素</text>
  <circle cx="1282" cy="530" r="6.5" fill="#b45309"/>
  <line x1="1282" y1="539" x2="1282" y2="560" stroke="#b45309" stroke-width="1.7"/>
  <text x="1282" y="580" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1986</text>
  <text x="1282" y="600" font-size="12" fill="#64748b" text-anchor="middle">重组乙肝疫苗</text>
  <text x="1090" y="600" font-size="10" fill="#64748b">胰岛素 A、B 链基因分别</text>
  <text x="1090" y="614" font-size="10" fill="#64748b">在大肠杆菌中表达后重折叠组装——</text>
  <text x="1090" y="628" font-size="10" fill="#64748b">首个获准临床的重组蛋白药物。</text>
  <text x="1090" y="652" font-size="10" fill="#64748b">酵母表达 HBsAg 自装配为亚单位颗粒——首个重组疫苗。</text>
  <rect x="30" y="712" width="1340" height="268" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="734.84" font-size="19" fill="#475569" font-weight="700">四、菌种衰退与复壮；四大保藏方法对照</text>
  <rect x="50" y="742" width="620" height="88" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.4"/>
  <text x="70" y="766" font-size="12.5" fill="#dc2626" font-weight="700">衰退与复壮</text>
  <text x="70" y="788" font-size="10.5" fill="#475569">衰退源于负突变累积与群体漂移（产量滑坡、性状不齐）；复壮靠单菌落分离纯化与宿主轮回交替。</text>
  <rect x="50" y="842" width="620" height="56" rx="9" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.4"/>
  <text x="70" y="864" font-size="12.5" fill="#059669" font-weight="700">保藏总原理</text>
  <text x="148" y="864" font-size="10.5" fill="#475569">干燥 · 低温 · 缺氧——使代谢停滞，突变与退化最小化。</text>
  <rect x="690" y="742" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="760" y="769.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">方法</text>
  <rect x="830" y="742" width="220" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="940" y="769.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">手段要点</text>
  <rect x="1050" y="742" width="120" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1110" y="769.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">温度</text>
  <rect x="1170" y="742" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1255" y="769.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">评注</text>
  <rect x="690" y="786" width="140" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="760" y="806.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">斜面冰箱保藏</text>
  <rect x="830" y="786" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="940" y="806.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">普通斜面加塞保存</text>
  <rect x="1050" y="786" width="120" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1110" y="806.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">4 ℃</text>
  <rect x="1170" y="786" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1255" y="806.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">数月（2–3 个月转接）；简便</text>
  <rect x="690" y="816" width="650" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="690" y="816" width="140" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="760" y="836.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">冷冻真空干燥</text>
  <rect x="830" y="816" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="940" y="836.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">悬液加保护剂冻干</text>
  <rect x="1050" y="816" width="120" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1110" y="836.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">低温干燥</text>
  <rect x="1170" y="816" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1255" y="836.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">存活期长——四法中最优之一</text>
  <rect x="690" y="846" width="140" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="760" y="866.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">液氮保藏</text>
  <rect x="830" y="846" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="940" y="866.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">甘油保护剂冻结</text>
  <rect x="1050" y="846" width="120" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1110" y="866.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">超低温</text>
  <rect x="1170" y="846" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1255" y="866.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">最优；设备要求高</text>
  <rect x="690" y="876" width="650" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="690" y="876" width="140" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="760" y="896.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">传代培养保藏</text>
  <rect x="830" y="876" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="940" y="896.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">定期转接</text>
  <rect x="1050" y="876" width="120" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1110" y="896.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">室温/适温</text>
  <rect x="1170" y="876" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1255" y="896.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">易退化，仅短期</text>
  <text x="1015" y="946" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">冻干与液氮为工业菌种库首选</text>
