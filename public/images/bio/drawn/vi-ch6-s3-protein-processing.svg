  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">病毒蛋白的加工与运输：蛋白酶三系、糖基化与地址标签</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">丝氨酸／半胱氨酸／天冬氨酸三系蛋白酶；HIV PR 十一切点以形状吃序列（1995 沙奎那韦）；HA 单体约 7–8 个 N 位点；豆蔻酰化指挥 Gag 上膜</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、病毒蛋白酶的三系谱</text>
  <rect x="82.92" y="201.8" width="94.16" height="20.4" rx="7" fill="#0f766e22" stroke="#0f766e" stroke-width="1.5"/>
  <text x="130" y="216.32" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">丝氨酸蛋白酶</text>
  <text x="260" y="200" font-size="10.5" fill="#475569">丝氨酸—组氨酸—天冬氨酸催化三联体</text>
  <text x="260" y="260" font-size="10.5" fill="#0f766e" font-weight="700">代表：HCV NS3/4A</text>
  <ellipse cx="90" cy="256" rx="30" ry="30" fill="#0f766e22" stroke="#0f766e" stroke-width="1.8"/>
  <text x="90" y="260" font-size="10.5" fill="#0f766e" text-anchor="middle" font-weight="700">Pro</text>
  <rect x="76.74000000000001" y="307.8" width="106.52" height="20.4" rx="7" fill="#b4530922" stroke="#b45309" stroke-width="1.5"/>
  <text x="130" y="322.32" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">半胱氨酸蛋白酶</text>
  <text x="260" y="306" font-size="10.5" fill="#475569">半胱氨酸亲核攻击肽键</text>
  <text x="260" y="366" font-size="10.5" fill="#b45309" font-weight="700">代表：脊灰 3Cpro 与 2Apro</text>
  <ellipse cx="90" cy="362" rx="30" ry="30" fill="#b4530922" stroke="#b45309" stroke-width="1.8"/>
  <text x="90" y="366" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="700">Pro</text>
  <rect x="76.74000000000001" y="413.8" width="106.52" height="20.4" rx="7" fill="#6d28d922" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="130" y="428.32" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="700">天冬氨酸蛋白酶</text>
  <text x="260" y="412" font-size="10.5" fill="#475569">二聚体、双天冬氨酸活性中心</text>
  <text x="260" y="472" font-size="10.5" fill="#6d28d9" font-weight="700">代表：HIV PR</text>
  <ellipse cx="90" cy="468" rx="30" ry="30" fill="#6d28d922" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="90" y="472" font-size="10.5" fill="#6d28d9" text-anchor="middle" font-weight="700">Pro</text>
  <text x="50" y="496" font-size="11" fill="#64748b">病毒把「切自己」这件事做成了专门手艺——多聚蛋白的成熟全靠它们。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、HIV 蛋白酶：十一个切点，保守的是几何</text>
  <text x="730" y="190" font-size="11.5" fill="#1e293b" font-weight="700">Gag-Pol 多聚蛋白：</text>
  <rect x="730" y="204" width="600" height="24" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <line x1="770" y1="198" x2="770" y2="234" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="754" y="254" font-size="8.5" fill="#475569" text-anchor="middle">MA</text>
  <line x1="830" y1="198" x2="830" y2="234" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="814" y="254" font-size="8.5" fill="#475569" text-anchor="middle">CA</text>
  <line x1="890" y1="198" x2="890" y2="234" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="874" y="254" font-size="8.5" fill="#475569" text-anchor="middle">NC</text>
  <line x1="950" y1="198" x2="950" y2="234" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="934" y="254" font-size="8.5" fill="#475569" text-anchor="middle">PR</text>
  <line x1="1010" y1="198" x2="1010" y2="234" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="994" y="254" font-size="8.5" fill="#475569" text-anchor="middle">RT</text>
  <line x1="1070" y1="198" x2="1070" y2="234" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="1054" y="254" font-size="8.5" fill="#475569" text-anchor="middle">RH</text>
  <line x1="1130" y1="198" x2="1130" y2="234" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="1114" y="254" font-size="8.5" fill="#475569" text-anchor="middle">IN</text>
  <text x="1030" y="286" font-size="9.5" fill="#64748b" text-anchor="middle">（示意：十一处切点沿多聚蛋白分布）</text>
  <ellipse cx="830" cy="340" rx="34" ry="22" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <ellipse cx="886" cy="340" rx="34" ry="22" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="858" y="344" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">PR</text>
  <text x="858" y="376" font-size="10" fill="#64748b" text-anchor="middle">同源二聚体</text>
  <text x="960" y="320" font-size="10.5" fill="#475569">切点保守的是几何而非序列：底物以肽链形状「就位」口袋，</text>
  <text x="960" y="335" font-size="10.5" fill="#475569">而非依赖特定残基。</text>
  <text x="960" y="378" font-size="10.5" fill="#475569">耐药突变常顾此失彼：口袋一改，多个切点的切割效率同降，</text>
  <text x="960" y="393" font-size="10.5" fill="#475569">酶活性与病毒适应性双双受损。</text>
  <rect x="729.7346" y="442.65" width="300.5308" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="880" y="455.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">蛋白酶抑制剂相对难以逃逸 · 1995 年沙奎那韦首获批准</text>
  <text x="730" y="502" font-size="11" fill="#64748b">「以形状吃序列」的策略，使 PR 抑制剂成为三联疗法的支柱。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、糖基化流水线：内质网到高尔基</text>
