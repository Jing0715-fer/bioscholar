  <text x="50" y="806" font-size="11" fill="#475569">流感 HA 单体约 7–8 个 N 位点：H1 亚型约 5–8 个；H3 自 1968 年以来头部缓慢增积、现代株可达十个上下。</text>
  <text x="50" y="852" font-size="11" fill="#64748b">新增糖链常恰落在抗体热点之上——像给抗原拧上一枚「糖做的旋钮」；gp120 糖盾更是常备军械。</text>
  <rect x="710" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="608.84" font-size="19" fill="#475569" font-weight="700">四、地址标签：信号肽拓扑与脂修饰</text>
