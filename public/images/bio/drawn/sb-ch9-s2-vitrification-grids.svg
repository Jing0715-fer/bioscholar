<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">玻璃化冷冻与载网制备：Dubochet 的诺贝尔工艺</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">液态乙烷约90K速冷10<tspan dy="-5.8" font-size="12.2">5</tspan><tspan dy="5.8">–10</tspan><tspan dy="-5.8" font-size="12.2">6</tspan><tspan dy="5.8">K/s绕过冰晶成核（Tg约136K）；blot1–5s拿捏冰厚30–100nm；铜/金网与QuantifoilR1.2/1.3谱系；辉光放电15–30mA、30–60s；浓度0.5–5</tspan></text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">mg/mL、低盐缓冲</text>
  <rect x="30" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、玻璃化：绕过冰晶的赛跑（Dubochet 1982）</text>
  <rect x="120" y="230" width="200" height="160" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/>
  <rect x="122" y="262" width="196" height="126" fill="#e0f2fe" stroke="none"/>
  <text x="220" y="250" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">液态乙烷浆料（约 90 K）</text>
  <rect x="90" y="215" width="260" height="185" rx="6" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="220" y="412" font-size="10" fill="#64748b" text-anchor="middle">液氮浴（77 K）</text>
  <circle cx="200" cy="190" r="7" fill="#dc2626" stroke="none"/>
  <line x1="200" y1="200" x2="220" y2="258" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="178" y="176" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">载网夹持 plunge</text>
  <rect x="350.817642" y="230.225" width="138.364716" height="19.55" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="420" y="244.14" font-size="11.5" fill="#065f46" text-anchor="middle" font-weight="700">冷却速率 10<tspan dy="-3.9" font-size="8.3">5</tspan><tspan dy="3.9">–10</tspan><tspan dy="-3.9" font-size="8.3">6</tspan><tspan dy="3.9"> K/s</tspan></text>
  <text x="400" y="275" font-size="10.5" fill="#475569">薄液膜（小于 1 μm）两侧高效换热，</text>
  <text x="400" y="290" font-size="10.5" fill="#475569">水来不及成核即进入玻璃态——Tg 约 136 K。</text>
  <text x="400" y="330" font-size="10.5" fill="#475569">液氮导热悖论：</text>
  <text x="400" y="345" font-size="10.5" fill="#475569">Leidenfrost 气膜使其冷却速率不足——必须用液态乙烷/丙烷作冷媒介质。</text>
  <text x="400" y="385" font-size="10.5" fill="#475569">判别：玻璃冰呈非晶宽晕；</text>
  <text x="400" y="400" font-size="10.5" fill="#475569">六方冰在衍射图出现 3.67/1.92 Å 尖锐环——见第 9 章第 4 节质量评估。</text>
  <rect x="710" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、blotting：把冰厚拿捏在 30–100 nm</text>
  <rect x="750" y="175" width="160" height="210" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="830" y="195" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">环境仓</text>
  <text x="762" y="215" font-size="10.5" fill="#475569">湿度大于 90–100%</text>
  <text x="762" y="235" font-size="10.5" fill="#475569">温度 4–20 °C 可控</text>
  <rect x="770" y="262" width="120" height="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="770" y="306" width="120" height="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="830" y="294" font-size="10" fill="#991b1b" text-anchor="middle">载网</text>
  <rect x="900.6652" y="252.65" width="98.6696" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="950" y="265.96" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">滤纸 blot 1–5 s</text>
  <text x="920" y="300" font-size="10.5" fill="#475569">单/双侧、滤纸型号共同决定吸水量；</text>
  <text x="920" y="315" font-size="10.5" fill="#475569">湿度防蒸发浓缩与盐析。</text>
  <text x="920" y="356" font-size="10.5" fill="#475569">样品要求：浓度 0.5–5 mg/mL；缓冲液低盐</text>
  <text x="920" y="371" font-size="10.5" fill="#475569">（大于 500 mM 高背景）；甘油/DMSO 小于 2%</text>
  <text x="920" y="386" font-size="10.5" fill="#475569">（须透析去除）。</text>
  <text x="920" y="410" font-size="10.5" fill="#475569">Chameleon/Spotiton 免滤纸喷洒：</text>
  <text x="920" y="425" font-size="10.5" fill="#475569">纳升液滴直接喷向自吸干网格，</text>
  <text x="920" y="440" font-size="10.5" fill="#475569">亚毫秒 blot 极薄冰、定向分布改善。</text>
  <rect x="30" y="452" width="660" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">三、载网与支持膜谱系</text>
  <rect x="50" y="492" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="519.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">类型</text>
  <rect x="200" y="492" width="190" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="295" y="519.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">规格</text>
  <rect x="390" y="492" width="280" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="530" y="519.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">特点</text>
  <rect x="50" y="536" width="150" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="561.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">铜网 200–400 mesh</text>
  <rect x="200" y="536" width="190" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="295" y="561.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">孔宽约 100 μm（200 mesh）</text>
  <rect x="390" y="536" width="280" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="530" y="561.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">便宜导热好，束致运动偏大</text>
  <rect x="50" y="576" width="620" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="576" width="150" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="601.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">金网</text>
  <rect x="200" y="576" width="190" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="295" y="601.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">同规格</text>
  <rect x="390" y="576" width="280" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="530" y="601.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">束致运动小（约 2× 数据质量收益）</text>
  <rect x="50" y="616" width="150" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="641.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Quantifoil 多孔碳膜</text>
  <rect x="200" y="616" width="190" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="295" y="641.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">R1.2/1.3：孔径 1.2 μm 间距 1.3 μm</text>
  <rect x="390" y="616" width="280" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="530" y="641.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">规整孔阵、冰悬于孔中</text>
  <rect x="50" y="656" width="620" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="656" width="150" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="125" y="681.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">UltrAuFoil 金箔</text>
  <rect x="200" y="656" width="190" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="295" y="681.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">约 25 nm 金膜</text>
  <rect x="390" y="656" width="280" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="530" y="681.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">界面友好、污染少</text>
  <text x="50" y="672" font-size="10.5" fill="#475569">连续碳膜（约 10–20 nm）令颗粒吸附膜面——取向优势与 AWI 问题（第 9 章第 4 节）常随之而来。</text>
  <rect x="710" y="452" width="660" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="474.84" font-size="19" fill="#475569" font-weight="700">四、辉光放电：亲水化的最后一道工序</text>
  <text x="730" y="492" font-size="10.5" fill="#475569">空气等离子体处理（15–30 mA、30–60 s）清除有机污染物并使碳膜表面亲水带电——液滴得以均匀铺展而非成珠。</text>
  <text x="730" y="508" font-size="10.5" fill="#475569">戊胺气氛可调正电性、增强带负电蛋白的吸附。</text>
  <text x="730" y="560" font-size="10.5" fill="#475569">等离子清洗的时机也有讲究：放电后数小时内使用最佳，久置会重新疏水化——一张「过期」网格足以毁掉一个数据收集日。</text>
  <text x="1040" y="660" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">2017 年诺贝尔化学奖：Dubochet 的玻璃化 · Frank 的算法 · Henderson 的远见</text>
  <text x="700" y="770" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="600">玻璃化把「保持天然态」从愿望变成工艺——下一步：低剂量成像与数据收集（第 9 章第 3 节）</text>
</svg>