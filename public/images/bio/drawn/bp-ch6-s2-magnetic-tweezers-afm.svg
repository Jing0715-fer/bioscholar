<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">磁镊与原子力显微镜：恒力扭转与针尖力谱</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">磁镊：恒力+旋转珠（力程0.01–100pN，dsDNA扭转刚度~400pN·nm²）；AFM（1986）：轻敲模式护软样品、高速AFM每秒数十帧；titinIg域锯齿峰100–200pN、间隔~25</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">nm，WLC拟合得dsDNAp≈50nm</text>
  <rect x="30" y="132" width="1340" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、磁镊：力恒定、可旋转磁珠——DNA 拓扑研究的专属工具</text>
  <rect x="200" y="186" width="140" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="270" y="205" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">磁体（梯度场）</text>
  <line x1="270" y1="276" x2="270" y2="236" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-bad)"/>
  <text x="292" y="258" font-size="10" fill="#dc2626" font-weight="700">F（恒定，无需闭环反馈）</text>
  <circle cx="270" cy="300" r="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
  <path d="M 236,300 A 34,10 0 0 1 304,300" fill="none" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <text x="318" y="296" font-size="10" fill="#831843" font-weight="700">可旋转</text>
  <text x="270" y="300" font-size="9" fill="#075985" text-anchor="middle" font-weight="700">珠</text>
  <path d="M 266,324 C 282,344 250,360 268,378 C 284,394 252,406 266,420" fill="none" stroke="#0f766e" stroke-width="2.2"/>
  <path d="M 274,324 C 258,344 290,360 272,378 C 256,394 288,406 274,420" fill="none" stroke="#0f766e" stroke-width="2.2"/>
  <text x="320" y="372" font-size="10.5" fill="#134e4a" font-weight="700">DNA（可扭转引入超螺旋）</text>
  <rect x="150" y="424" width="240" height="14" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="142" y="434" font-size="9.5" fill="#64748b" text-anchor="end">玻面</text>
  <rect x="560" y="176" width="780" height="256" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="580" y="204" font-size="13.5" fill="#1e293b" font-weight="700">为什么磁镊独占 DNA 拓扑研究</text>
  <circle cx="598" cy="232" r="4" fill="#0369a1"/>
  <text x="612" y="236" font-size="11.5" fill="#1e293b" font-weight="700">力恒定（无需闭环反馈），且无激光光损伤</text>
  <circle cx="598" cy="266" r="4" fill="#0369a1"/>
  <text x="612" y="270" font-size="11.5" fill="#1e293b" font-weight="700">旋转磁珠 → 扭转 DNA 引入超螺旋</text>
  <text x="612" y="289" font-size="10.5" fill="#475569">可定量测扭转刚度：dsDNA 约 400 pN·nm² 量级</text>
  <circle cx="598" cy="312" r="4" fill="#0369a1"/>
  <text x="612" y="316" font-size="11.5" fill="#1e293b" font-weight="700">直接观测拓扑异构酶 / 解旋酶</text>
  <text x="612" y="335" font-size="10.5" fill="#475569">以逐 bp 方式改变双链的连环数（linking number）</text>
  <circle cx="598" cy="358" r="4" fill="#0369a1"/>
  <text x="612" y="362" font-size="11.5" fill="#1e293b" font-weight="700">力程 0.01–100 pN</text>
  <text x="612" y="381" font-size="10.5" fill="#475569">配合荧光可同步读取酶的构象状态</text>
  <text x="580" y="408" font-size="10.5" fill="#64748b">扭转 + 拉伸同场测量——研究超螺旋、拓扑酶与解旋酶的主力单分子技术。</text>
  <rect x="30" y="468" width="1340" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="490.84" font-size="19" fill="#475569" font-weight="700">二、AFM（Binnig、Quate、Gerber，1986）：接触、轻敲与力谱</text>
  <rect x="50" y="506" width="420" height="206" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="66" y="532" font-size="12.5" fill="#1e293b" font-weight="700">① 接触模式</text>
  <polygon points="85,560 210,540 210,552 85,572" fill="#475569" fill-opacity="0.9"/>
  <polygon points="198,548 216,548 212,612" fill="#475569"/>
  <line x1="70" y1="616" x2="270" y2="616" stroke="#64748b" stroke-width="2.5"/>
  <line x1="84" y1="616" x2="76" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="108" y1="616" x2="100" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="132" y1="616" x2="124" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="156" y1="616" x2="148" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="180" y1="616" x2="172" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="204" y1="616" x2="196" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="228" y1="616" x2="220" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="252" y1="616" x2="244" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <text x="66" y="660" font-size="10" fill="#475569">针尖恒力贴面扫描，悬臂偏转反映高度；对软生物样品剪切损伤大</text>
  <rect x="490" y="506" width="420" height="206" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="506" y="532" font-size="12.5" fill="#1e293b" font-weight="700">② 轻敲模式（tapping）</text>
  <polygon points="525,548 650,528 650,540 525,560" fill="#475569" fill-opacity="0.9"/>
  <polygon points="640,540 658,540 654,586" fill="#475569"/>
  <line x1="672" y1="552" x2="672" y2="584" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)" marker-start="url(#arr-enz)"/>
  <text x="688" y="570" font-size="9.5" fill="#831843" font-weight="700">共振振荡、间歇触样</text>
  <line x1="510" y1="616" x2="760" y2="616" stroke="#64748b" stroke-width="2.5"/>
  <line x1="524" y1="616" x2="516" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="548" y1="616" x2="540" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="572" y1="616" x2="564" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="596" y1="616" x2="588" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="620" y1="616" x2="612" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="644" y1="616" x2="636" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="668" y1="616" x2="660" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <line x1="692" y1="616" x2="684" y2="626" stroke="#64748b" stroke-width="1.2"/>
  <text x="506" y="660" font-size="10" fill="#475569">悬臂在共振频率附近振荡、间歇触样——剪切力大幅降低，适合膜与蛋白质；</text>
  <text x="506" y="673.5" font-size="10" fill="#475569">高速 AFM 每秒成像数十帧，实时「看」肌动蛋白聚合与马达行走</text>
  <rect x="930" y="506" width="420" height="206" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="946" y="532" font-size="12.5" fill="#1e293b" font-weight="700">③ 力谱（force spectroscopy）</text>
  <rect x="950" y="550" width="180" height="78" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="950" y1="608.5" x2="1130" y2="608.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="995" y1="628" x2="995" y2="550" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="950" y1="589" x2="1130" y2="589" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1040" y1="628" x2="1040" y2="550" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="950" y1="569.5" x2="1130" y2="569.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1085" y1="628" x2="1085" y2="550" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1040" y1="628" x2="1040" y2="634" stroke="#475569" stroke-width="1.8"/>
  <text x="1040" y="650" font-size="13" fill="#64748b" text-anchor="middle">接触</text>
  <line x1="944" y1="589" x2="950" y2="589" stroke="#475569" stroke-width="1.8"/>
  <text x="940" y="593" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="944" y1="553.9" x2="950" y2="553.9" stroke="#475569" stroke-width="1.8"/>
  <text x="940" y="557.9" font-size="13" fill="#64748b" text-anchor="end">+</text>
  <line x1="944" y1="624.1" x2="950" y2="624.1" stroke="#475569" stroke-width="1.8"/>
  <text x="940" y="628.1" font-size="13" fill="#64748b" text-anchor="end">−</text>
  <path d="M959.0,589.0 L1031.0,589.0 L1040.0,584.3 L1121.0,556.2" fill="none" stroke="#0369a1" stroke-width="2.4"/>
  <path d="M1121.0,556.2 L1040.0,589.0 L1025.6,606.2 L1014.8,606.2 L1004.0,589.0 L959.0,589.0" fill="none" stroke="#be185d" stroke-width="2.4" stroke-dasharray="5 4"/>
  <rect x="1148" y="556.01" width="10.450000000000001" height="7.9799999999999995" rx="3" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1166.45" y="563.42" font-size="9.5" fill="#475569">逼近</text>
  <rect x="1195.45" y="556.01" width="10.450000000000001" height="7.9799999999999995" rx="3" fill="#be185d" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1213.9" y="563.42" font-size="9.5" fill="#475569">撤离</text>
  <text x="1148" y="590" font-size="9.5" fill="#475569">黏附谷：配体–受体解离力随加载速率变化</text>
  <text x="1148" y="602.5" font-size="9.5" fill="#475569">（Bell 模型）</text>
  <text x="946" y="660" font-size="10" fill="#475569">针尖以 nm 步进逼近 / 撤离表面；悬臂偏转 × 弹性常数（热噪声法校准）</text>
  <text x="946" y="673.5" font-size="10" fill="#475569">= pN 级力–距离曲线</text>
  <rect x="30" y="744" width="1340" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="766.84" font-size="19" fill="#475569" font-weight="700">三、单分子力谱：肌联蛋白 titin 的锯齿曲线与蠕虫状链（WLC）拟合</text>
  <rect x="90" y="770" width="640" height="170" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="90" y1="897.5" x2="730" y2="897.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="250" y1="940" x2="250" y2="770" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="90" y1="855" x2="730" y2="855" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="410" y1="940" x2="410" y2="770" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="90" y1="812.5" x2="730" y2="812.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="570" y1="940" x2="570" y2="770" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="90" y1="940" x2="90" y2="946" stroke="#475569" stroke-width="1.8"/>
  <text x="90" y="962" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="223.12" y1="940" x2="223.12" y2="946" stroke="#475569" stroke-width="1.8"/>
  <text x="223.12" y="962" font-size="13" fill="#64748b" text-anchor="middle">25</text>
  <line x1="356.88" y1="940" x2="356.88" y2="946" stroke="#475569" stroke-width="1.8"/>
  <text x="356.88" y="962" font-size="13" fill="#64748b" text-anchor="middle">50</text>
  <line x1="490" y1="940" x2="490" y2="946" stroke="#475569" stroke-width="1.8"/>
  <text x="490" y="962" font-size="13" fill="#64748b" text-anchor="middle">75</text>
  <line x1="623.12" y1="940" x2="623.12" y2="946" stroke="#475569" stroke-width="1.8"/>
  <text x="623.12" y="962" font-size="13" fill="#64748b" text-anchor="middle">100</text>
  <line x1="730" y1="940" x2="730" y2="946" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="962" font-size="13" fill="#64748b" text-anchor="middle">120</text>
  <line x1="84" y1="940" x2="90" y2="940" stroke="#475569" stroke-width="1.8"/>
  <text x="80" y="944" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="84" y1="844.8" x2="90" y2="844.8" stroke="#475569" stroke-width="1.8"/>
  <text x="80" y="848.8" font-size="13" fill="#64748b" text-anchor="end">100</text>
  <line x1="84" y1="770" x2="90" y2="770" stroke="#475569" stroke-width="1.8"/>
  <text x="80" y="774" font-size="13" fill="#64748b" text-anchor="end">180</text>
  <text x="44" y="855" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">力 F (pN)</text>
  <path d="M102.8,934.9 L128.4,923.0 L166.8,880.5 L205.2,824.4 L230.8,798.9 L240.4,914.5 L269.2,897.5 L314.0,855.0 L358.8,817.6 L378.0,797.2 L387.6,909.4 L422.8,892.4 L467.6,851.6 L512.4,815.9 L528.4,795.5 L538.0,906.0 L576.4,889.0 L621.2,846.5 L666.0,810.8 L678.8,793.8 L688.4,902.6 L717.2,863.5" fill="none" stroke="#be185d" stroke-width="2.6"/>
  <line x1="211.6" y1="797.2" x2="698" y2="797.2" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="410" y="787" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">峰值为 100–200 pN：每个 Ig 结构域被拉开</text>
  <path d="M 234.8,937 Q 234.8,928 243.8,928 M 365,928 Q 374,928 374,937" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="243.8" y1="928" x2="365" y2="928" stroke="#64748b" stroke-width="1.7"/>
  <text x="304.40000000000003" y="952" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">≈ 25 nm</text>
  <text x="410" y="975" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">拉伸长度 x（nm）——上升段即 WLC 熵弹性</text>
  <rect x="760" y="786" width="580" height="180" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="780" y="812" font-size="13" fill="#1e293b" font-weight="700">蠕虫状链（WLC）模型</text>
  <text x="1050" y="846" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">F(x) = (k_BT/p)·[1/(2(1−x/L)²) + x/L − 1/2]</text>
  <circle cx="798" cy="874" r="4" fill="#be185d"/>
  <text x="812" y="878" font-size="11" fill="#1e293b" font-weight="700">p：持续长度；L：轮廓长度</text>
  <circle cx="798" cy="900" r="4" fill="#be185d"/>
  <text x="812" y="904" font-size="11" fill="#831843" font-weight="700">dsDNA 拟合 → p ≈ 50 nm</text>
  <text x="812" y="921" font-size="10" fill="#475569">与静态方法一致，验证聚合物弹性理论</text>
  <circle cx="798" cy="942" r="4" fill="#be185d"/>
  <text x="812" y="946" font-size="11" fill="#1e293b" font-weight="700">AFM 力程 10 pN–10 nN</text>
  <text x="812" y="963" font-size="10" fill="#475569">力大、刚度高、扰动强——与光镊互补</text>
</svg>