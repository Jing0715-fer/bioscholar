  <line x1="215" y1="730" x2="215" y2="700" stroke="#0f766e" stroke-width="2.2"/>
  <line x1="270" y1="730" x2="270" y2="684" stroke="#0f766e" stroke-width="2.2"/>
  <line x1="340" y1="730" x2="600" y2="730" stroke="#475569" stroke-width="1.4"/>
  <line x1="380" y1="730" x2="380" y2="694" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 4"/>
  <line x1="435" y1="730" x2="435" y2="672" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 4"/>
  <line x1="495" y1="730" x2="495" y2="700" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 4"/>
  <line x1="555" y1="730" x2="555" y2="684" stroke="#b45309" stroke-width="2.2" stroke-dasharray="5 4"/>
  <line x1="325" y1="712" x2="337" y2="712" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <text x="200" y="752" font-size="10.5" fill="#134e4a" text-anchor="middle">样本 1（保留时间）</text>
  <text x="470" y="752" font-size="10.5" fill="#78350f" text-anchor="middle">样本 2（整体漂移）</text>
  <text x="330" y="690" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">峰对齐：校正保留时间漂移</text>
  <rect x="204.570475" y="790.225" width="250.85905000000002" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="330" y="804.14" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">加合物与共流出 → 特征与化合物非一一对应</text>
  <text x="60" y="852" font-size="13" fill="#1e293b" font-weight="700">归一化的三级武器</text>
  <rect x="119.155" y="874.225" width="41.69" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="140" y="888.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">内标</text>
  <rect x="255.465" y="874.225" width="89.07000000000001" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="300" y="888.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">概率商归一化</text>
  <rect x="435.465" y="874.225" width="89.07000000000001" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="888.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">尿液化学校正</text>
  <text x="60" y="926" font-size="11.5" fill="#475569">共流出加剧离子抑制——特征表只是候选化合物的索引，绝非身份清单。</text>
  <rect x="710" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="598.84" font-size="19" fill="#475569" font-weight="700">四、多元统计的警戒线与通路分析</text>
  <rect x="740" y="630" width="280" height="220" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="740" y1="795" x2="1020" y2="795" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="810" y1="850" x2="810" y2="630" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="740" y1="740" x2="1020" y2="740" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="880" y1="850" x2="880" y2="630" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="740" y1="685" x2="1020" y2="685" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="950" y1="850" x2="950" y2="630" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="740" y1="850" x2="740" y2="856" stroke="#475569" stroke-width="1.8"/>
  <text x="740" y="872" font-size="13" fill="#64748b" text-anchor="middle">低</text>
  <line x1="1020" y1="850" x2="1020" y2="856" stroke="#475569" stroke-width="1.8"/>
  <text x="1020" y="872" font-size="13" fill="#64748b" text-anchor="middle">高</text>
  <line x1="734" y1="850" x2="740" y2="850" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="854" font-size="13" fill="#64748b" text-anchor="end">低</text>
  <line x1="734" y1="630" x2="740" y2="630" stroke="#475569" stroke-width="1.8"/>
  <text x="730" y="634" font-size="13" fill="#64748b" text-anchor="end">高</text>
  <text x="880" y="894" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">成分 1</text>
  <text x="694" y="740" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">成分 2</text>
  <text x="880" y="618" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">PLS-DA（示意）</text>
  <path d="M740.0,645.4 L1020.0,834.6" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/>
  <circle cx="790.4" cy="713.6" r="4.5" fill="#6d28d9" fill-opacity="0.7"/>
  <circle cx="807.2" cy="691.6" r="4.5" fill="#6d28d9" fill-opacity="0.7"/>
  <circle cx="824" cy="729" r="4.5" fill="#6d28d9" fill-opacity="0.7"/>
  <circle cx="801.6" cy="704.8" r="4.5" fill="#6d28d9" fill-opacity="0.7"/>
  <circle cx="832.4" cy="700.4" r="4.5" fill="#6d28d9" fill-opacity="0.7"/>
  <circle cx="815.6" cy="740" r="4.5" fill="#6d28d9" fill-opacity="0.7"/>
  <circle cx="913.6" cy="762" r="4.5" fill="#be185d" fill-opacity="0.7"/>
  <circle cx="936" cy="779.6" r="4.5" fill="#be185d" fill-opacity="0.7"/>
  <circle cx="924.8" cy="751" r="4.5" fill="#be185d" fill-opacity="0.7"/>
  <circle cx="950" cy="766.4" r="4.5" fill="#be185d" fill-opacity="0.7"/>
  <circle cx="941.6" cy="788.4" r="4.5" fill="#be185d" fill-opacity="0.7"/>
  <circle cx="919.2" cy="740" r="4.5" fill="#be185d" fill-opacity="0.7"/>
  <text x="812" y="660" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">组 1</text>
  <text x="958" y="800" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">组 2</text>
  <text x="1060" y="636" font-size="11" fill="#475569">PLS-DA 须以置换检验与交叉验证</text>
  <text x="1060" y="651" font-size="11" fill="#475569">防过拟合——分开的两组先问</text>
  <text x="1060" y="666" font-size="11" fill="#475569">一句「是否过拟合」。</text>
  <text x="1060" y="700" font-size="11" fill="#475569">VIP &gt; 1 仅作候选：与单变量检验交叉印证后，</text>
  <text x="1060" y="715" font-size="11" fill="#475569">再进靶向确证。</text>
  <text x="1060" y="756" font-size="11" fill="#475569">鉴定置信级：二级谱＋标准品比对才达最高级；</text>
  <text x="1060" y="771" font-size="11" fill="#475569">GNPS 分子网络让未知物按谱形归队。</text>
  <text x="1060" y="824" font-size="11" fill="#475569">MetPA 结合富集分析与拓扑影响值——因果方向仍需干预实验裁决。</text>
  <text x="880" y="930" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="600">把统计显著当作因果，是代谢组学最常见的事故。</text>
</svg>