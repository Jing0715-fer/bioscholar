  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">代谢组学：最下游的化学读出、三平台分工与多元统计警戒线</text>
  <text x="700" y="74" text-anchor="middle" font-size="13" fill="#64748b">代谢组是信息流最下游的化学读出，确认口径的代谢物量级为数千种、含推测条目达万级；非靶向全扫描做发现、靶向内标标准曲线做确证，取样须秒级淬灭并以 QC 穿插与 LOESS 校正定义可信窗；GC-MS 胜在 EI 谱库成熟、LC-MS 以 </text>
  <text x="700" y="100" text-anchor="middle" font-size="13" fill="#64748b">C18 与 HILIC 双柱互补、NMR 无损可绝对定量；特征与化合物因加合物与共流出非一一对应；PLS-DA 须置换检验与交叉验证防过拟合、VIP 高于 1 仅作候选；化合物鉴定需二级谱与标准品才达最高置信级，因果方向仍需干预实验裁决</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、信息流最下游的化学读出与两段式提问</text>
  <rect x="91.46000000000001" y="179.8" width="57.08" height="20.4" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="120" y="194.32" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">基因组</text>
  <line x1="170" y1="190" x2="200" y2="190" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="221.46" y="179.8" width="57.08" height="20.4" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="250" y="194.32" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">转录组</text>
  <line x1="300" y1="190" x2="330" y2="190" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="351.46" y="179.8" width="57.08" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="380" y="194.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">蛋白组</text>
  <line x1="430" y1="190" x2="460" y2="190" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="481.46" y="179.8" width="57.08" height="20.4" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="510" y="194.32" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">代谢组</text>
  <text x="330" y="232" font-size="11.5" fill="#475569" text-anchor="middle">信息流向下游：代谢组是距表型最近的化学读出</text>
  <rect x="207.7094" y="254.225" width="244.58120000000002" height="19.55" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="330" y="268.14" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">确认口径数千种代谢物 · 含推测条目达万级</text>
  <rect x="60" y="300" width="290" height="80" rx="9" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.7"/>
  <text x="205" y="330" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">非靶向：全扫描做发现</text>
  <text x="205" y="354" font-size="11" fill="#475569" text-anchor="middle">宽覆盖 · 出候选 · 假设生成</text>
  <rect x="360" y="300" width="290" height="80" rx="9" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.7"/>
  <text x="505" y="330" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">靶向：内标标准曲线确证</text>
  <text x="505" y="354" font-size="11" fill="#475569" text-anchor="middle">精确定量 · 定论口径</text>
  <line x1="350" y1="340" x2="360" y2="340" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <text x="60" y="404" font-size="11.5" fill="#475569">非靶向做发现、靶向做确证——两种提问方式互补成两段式工作流。</text>
  <text x="60" y="438" font-size="11.5" fill="#475569">取样须秒级淬灭以终止代谢反应；QC 样本穿插进样，LOESS 信号漂移校正共同定义数据的可信窗口。</text>
  <text x="60" y="486" font-size="11.5" fill="#64748b">与上游组学不同，代谢谱反映的是酶活与通量的即时状态——这正是「最下游读出」的含义。</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、三大平台：按化学性质分工</text>
  <rect x="740" y="190" width="120" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="217.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">平台</text>
  <rect x="860" y="190" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="985" y="217.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">分离与检测</text>
  <rect x="1110" y="190" width="230" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="217.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">强项</text>
  <rect x="740" y="234" width="120" height="54" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="266.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">GC-MS</text>
  <rect x="860" y="234" width="250" height="54" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="985" y="266.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">气相分离 · EI 电离</text>
  <rect x="1110" y="234" width="230" height="54" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="266.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">EI 谱库成熟</text>
  <rect x="740" y="288" width="600" height="54" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="288" width="120" height="54" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="320.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">LC-MS</text>
  <rect x="860" y="288" width="250" height="54" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="985" y="320.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">C18 与 HILIC 双柱互补</text>
  <rect x="1110" y="288" width="230" height="54" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="320.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">覆盖宽且灵敏</text>
  <rect x="740" y="342" width="120" height="54" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="374.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">NMR</text>
  <rect x="860" y="342" width="250" height="54" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="985" y="374.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">无需色谱分离</text>
  <rect x="1110" y="342" width="230" height="54" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="374.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">无损 · 可绝对定量</text>
  <text x="740" y="426" font-size="11.5" fill="#475569">三平台按化学性质分工：挥发性成分走 GC-MS，极性与中等极性成分走 LC-MS 双柱，定量基准与结构解析求 NMR。</text>
  <text x="740" y="474" font-size="11.5" fill="#475569">C18 看非极性、HILIC 看极性——两柱数据互补拼接，才拼出可观的覆盖面。</text>
  <rect x="30" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、特征表的诞生：峰检出、对齐与归一化</text>
  <rect x="60" y="630" width="130" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="125" y="658" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">峰检出</text>
  <rect x="220" y="630" width="130" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="285" y="658" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">峰对齐</text>
  <rect x="380" y="630" width="130" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="445" y="658" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">归一化</text>
  <rect x="540" y="630" width="130" height="46" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="605" y="658" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">特征表</text>
  <line x1="190" y1="653" x2="220" y2="653" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="350" y1="653" x2="380" y2="653" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="510" y1="653" x2="540" y2="653" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="80" y1="730" x2="320" y2="730" stroke="#475569" stroke-width="1.4"/>
  <line x1="110" y1="730" x2="110" y2="694" stroke="#0f766e" stroke-width="2.2"/>
