<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">BLAST 统计显著性：极值分布、E 值与 bit 分</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">随机序列最高局部比对分服从极值分布，尾部按e的负λS次方指数衰减；E≈K·m·N·e^(−λS)为期望假命中次数，与P值经P=1−e^(−E)换算；数据库翻倍则E近似翻倍，</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">跨搜索比较应使用bit分；蛋白搜索常以E&lt;0.01为显著惯例</text>
  <rect x="30" y="132" width="780" height="480" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、随机高分服从极值分布（Karlin-Altschul，1990）</text>
  <rect x="150" y="210" width="560" height="280" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="150" y1="420" x2="710" y2="420" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="290" y1="490" x2="290" y2="210" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="150" y1="350" x2="710" y2="350" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="430" y1="490" x2="430" y2="210" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="150" y1="280" x2="710" y2="280" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="570" y1="490" x2="570" y2="210" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="183.6" y1="490" x2="183.6" y2="496" stroke="#475569" stroke-width="1.8"/>
  <text x="183.6" y="512" font-size="13" fill="#64748b" text-anchor="middle">低</text>
  <line x1="318" y1="490" x2="318" y2="496" stroke="#475569" stroke-width="1.8"/>
  <text x="318" y="512" font-size="13" fill="#64748b" text-anchor="middle">峰值</text>
  <line x1="497.2" y1="490" x2="497.2" y2="496" stroke="#475569" stroke-width="1.8"/>
  <text x="497.2" y="512" font-size="13" fill="#64748b" text-anchor="middle">高分尾部</text>
  <line x1="682" y1="490" x2="682" y2="496" stroke="#475569" stroke-width="1.8"/>
  <text x="682" y="512" font-size="13" fill="#64748b" text-anchor="middle">极高</text>
  <line x1="144" y1="350" x2="150" y2="350" stroke="#475569" stroke-width="1.8"/>
  <text x="140" y="354" font-size="13" fill="#64748b" text-anchor="end">0.2</text>
  <line x1="144" y1="210" x2="150" y2="210" stroke="#475569" stroke-width="1.8"/>
  <text x="140" y="214" font-size="13" fill="#64748b" text-anchor="end">0.37</text>
  <text x="430" y="534" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">随机序列的最高局部比对分 S →</text>
  <text x="430" y="198" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">最高局部比对分的分布形状</text>
  <path d="M161.2,489.72 C164.9,488.1 176.1,483.3 183.6,480.2 C191.1,477.1 197.6,477.3 206,470.96 C214.4,464.7 224.7,466.3 234,442.4 C243.3,418.5 252.7,357.0 262,327.6 C271.3,298.2 280.7,281.9 290,266 C299.3,250.1 308.7,235.2 318,232.39999999999998 C327.3,229.6 336.7,238.9 346,249.20000000000002 C355.3,259.5 364.7,279.5 374,294 C383.3,308.5 392.7,321.5 402,336 C411.3,350.5 420.7,368.7 430,380.8 C439.3,392.9 448.7,400.4 458,408.8 C467.3,417.2 476.7,424.7 486,431.2 C495.3,437.7 504.7,441.8 514,448 C523.3,454.2 532.7,463.7 542,468.16 C551.3,472.6 560.7,472.6 570,474.6 C579.3,476.6 588.7,478.8 598,480.2 C607.3,481.6 616.7,482.2 626,483 C635.3,483.8 644.7,484.6 654,485.24 C663.3,485.9 672.7,486.5 682,486.92 C691.3,487.4 705.3,487.9 710,488.04" fill="none" stroke="#0f766e" stroke-width="3"/>
  <line x1="505" y1="210" x2="505" y2="490" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.8"/>
  <text x="518" y="250" font-size="11.5" fill="#dc2626" font-weight="700">尾部按 e^(−λS) 指数衰减：</text>
  <text x="518" y="266" font-size="11.5" fill="#dc2626" font-weight="700">分数越高越罕见，</text>
  <text x="518" y="282" font-size="11.5" fill="#dc2626" font-weight="700">衰减速度由 λ 决定</text>
  <rect x="90" y="545" width="660" height="54" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="110" y="568" font-size="15" fill="#1e293b" font-weight="700">E ≈ K·m·N·e^(−λS)</text>
  <text x="330" y="568" font-size="12.5" fill="#075985" font-weight="700">bit 分 S′ = (λS − lnK)/ln2</text>
  <text x="330" y="590" font-size="11.5" fill="#475569">P = 1 − e^(−E)：E 与 P 经此换算</text>
  <rect x="830" y="132" width="540" height="480" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="846" y="154.84" font-size="19" fill="#475569" font-weight="700">二、数据库规模效应与 bit 归一</text>
  <text x="860" y="196" font-size="13" fill="#1e293b" font-weight="700">E 值 ∝ m·N：库翻倍，E 翻倍</text>
  <rect x="880" y="322" width="70" height="60" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <rect x="990" y="262" width="70" height="120" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="915" y="250" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">E ×1</text>
  <text x="1025" y="250" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">E ×2</text>
  <text x="915" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">库 N</text>
  <text x="1025" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">库 2N</text>
  <line x1="958" y1="292" x2="984" y2="292" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <text x="1100" y="300" font-size="11" fill="#475569">同一分数、同一查询：</text>
  <text x="1100" y="315" font-size="11" fill="#475569">数据库规模翻倍，</text>
  <text x="1100" y="330" font-size="11" fill="#475569">E 值近似翻倍</text>
  <text x="860" y="400" font-size="13" fill="#1e293b" font-weight="700">bit 分：每 +1 bit，随机几率约减半</text>
  <rect x="880" y="440" width="44" height="150" fill="#ccfbf1" fill-opacity="1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="902" y="430" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">2⁰</text>
  <rect x="948" y="515" width="44" height="75" fill="#0f766e" fill-opacity="0.75" stroke="#0f766e" stroke-width="1.6"/>
  <text x="970" y="505" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">2⁻¹</text>
  <rect x="1016" y="552" width="44" height="38" fill="#0f766e" fill-opacity="0.75" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1038" y="542" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">2⁻²</text>
  <rect x="1084" y="571" width="44" height="19" fill="#0f766e" fill-opacity="0.75" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1106" y="561" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">2⁻³</text>
  <rect x="1152" y="580" width="44" height="10" fill="#0f766e" fill-opacity="0.75" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1174" y="570" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">2⁻⁴</text>
  <text x="1030" y="612" font-size="11" fill="#64748b" text-anchor="middle">bit 分经 λ 与 K 归一，跨打分体系可比</text>
  <rect x="30" y="640" width="1340" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="662.84" font-size="19" fill="#475569" font-weight="700">三、判读纪律：显著不等于同源</text>
  <rect x="60" y="700" width="400" height="120" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="1.8"/>
  <text x="260" y="732" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">显著 ≠ 同源</text>
  <text x="260" y="764" font-size="11.5" fill="#475569" text-anchor="middle">趋同演化、组成偏性与随机巧合都可制造显著命中</text>
  <rect x="490" y="700" width="400" height="120" rx="10" fill="#f8fafc" stroke="#d97706" stroke-width="1.8"/>
  <text x="690" y="732" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">不显著 ≠ 非同源</text>
  <text x="690" y="764" font-size="11.5" fill="#475569" text-anchor="middle">暮区内的远缘同源可能落在阈值之外——换打分方案或多序列联合证据</text>
  <rect x="920" y="700" width="400" height="120" rx="10" fill="#f8fafc" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1120" y="732" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="700">跨搜索比较用 bit 分</text>
  <text x="1120" y="764" font-size="11.5" fill="#475569" text-anchor="middle">原始分受打分体系影响；bit 分经 λ、K 归一后方可比较</text>
  <rect x="60" y="850" width="1280" height="62" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5"/>
  <text x="80" y="872" font-size="12.5" fill="#065f46" font-weight="600">经验惯例：蛋白搜索常以 E &lt; 0.01 为显著。E 值依赖数据库规模与打分体系——报告搜索结果时应交代口径。</text>
</svg>