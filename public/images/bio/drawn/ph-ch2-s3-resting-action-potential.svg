<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">静息膜电位与动作电位</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">Nernst给出E<tspan dy="3.7" font-size="12.2">K</tspan><tspan dy="-3.7">≈-90、E</tspan><tspan dy="3.7" font-size="12.2">Na</tspan><tspan dy="-3.7">≈+60mV；GHK按通透性加权得静息约-70mV（P</tspan><tspan dy="3.7" font-size="12.2">K</tspan><tspan dy="-3.7">:P</tspan><tspan dy="3.7" font-size="12.2">Na</tspan><tspan dy="-3.7">≈1:0.04）；阈电位-55mV触发Na</tspan><tspan dy="-5.8" font-size="12.2">+</tspan><tspan dy="5.8">再生性升支、超射+30mV，绝对不应期约0.5–2ms</tspan></text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">限定频率上限</text>
  <rect x="30" y="132" width="620" height="560" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、平衡电位标尺与静息电位（GHK）</text>
  <text x="150" y="182" font-size="12" fill="#475569" font-weight="700">膜电位标尺（mV）</text>
  <line x1="120" y1="495" x2="120" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="120" y1="200" x2="160" y2="200" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="187.155718" y="190.65" width="85.688564" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230" y="203.96" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">E<tspan dy="2.4" font-size="7.9">Na</tspan><tspan dy="-2.4"> ≈ +60 mV</tspan></text>
  <text x="112" y="204" font-size="10.5" fill="#991b1b" text-anchor="end">+60</text>
  <line x1="120" y1="312" x2="160" y2="312" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="112" y="316" font-size="10.5" fill="#64748b" text-anchor="end">0</text>
  <line x1="120" y1="443" x2="160" y2="443" stroke="#b45309" stroke-width="1.5"/>
  <rect x="187.971478" y="433.65" width="84.05704400000002" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="230" y="446.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">E<tspan dy="2.4" font-size="7.9">Cl</tspan><tspan dy="-2.4"> ≈ -70 mV</tspan></text>
  <text x="112" y="447" font-size="10.5" fill="#475569" text-anchor="end">-70</text>
  <line x1="120" y1="480" x2="160" y2="480" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="189.276694" y="470.65" width="81.446612" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="230" y="483.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">E<tspan dy="2.4" font-size="7.9">K</tspan><tspan dy="-2.4"> ≈ -90 mV</tspan></text>
  <text x="112" y="484" font-size="10.5" fill="#075985" text-anchor="end">-90</text>
  <line x1="300" y1="443" x2="560" y2="443" stroke="#475569" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="330" y="428" font-size="10.5" fill="#475569">P<tspan dy="2.3" font-size="7.6">K</tspan><tspan dy="-2.3"> : P</tspan><tspan dy="2.3" font-size="7.6">Na</tspan><tspan dy="-2.3"> ≈ 1 : 0.04 → 紧贴 E</tspan><tspan dy="2.3" font-size="7.6">K</tspan></text>
  <rect x="348.620225" y="456.075" width="162.75955000000002" height="17.849999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="430" y="468.78" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">静息膜电位 ≈ -70 mV（GHK）</text>
  <text x="60" y="528" font-size="11" fill="#475569">Nernst（37 ℃）：E = (61.5/z)·lg(外/内)</text>
  <text x="60" y="554" font-size="10.5" fill="#475569">GHK 方程：以通透性为权的对数平均——静息时 P<tspan dy="2.3" font-size="7.6">K</tspan><tspan dy="-2.3"> : P</tspan><tspan dy="2.3" font-size="7.6">Na</tspan><tspan dy="-2.3"> ≈ 1 : 0.04（K</tspan><tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 经 K2P 漏通道外逸），</tspan></text>
  <text x="60" y="572" font-size="10.5" fill="#475569">电位落在 E<tspan dy="2.3" font-size="7.6">K</tspan><tspan dy="-2.3"> 与 E</tspan><tspan dy="2.3" font-size="7.6">Na</tspan><tspan dy="-2.3"> 之间而紧贴 K 侧；钠泵 3 : 2 生电直接贡献仅约 -4 mV</tspan></text>
  <text x="60" y="618" font-size="10.5" fill="#64748b" font-weight="600">「按通透性投票」：静息 K<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 票占多数；升支时 Na</tspan><tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 通道开放、选票易手</tspan></text>
  <text x="60" y="644" font-size="10.5" fill="#475569">泵-漏平衡：Na<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 漏入速率恰被钠泵外排抵消——抑制钠泵，电位以分钟级缓慢去极化；直接作者是 K</tspan><tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 外漏，</tspan></text>
  <text x="60" y="662" font-size="10.5" fill="#475569">间接作者是钠泵</text>
  <rect x="670" y="132" width="700" height="560" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="686" y="154.84" font-size="19" fill="#475569" font-weight="700">二、动作电位：分期、全或无与不应期</text>
  <text x="676" y="205" font-size="11" fill="#475569" font-weight="700">膜电位</text>
  <line x1="720" y1="620" x2="720" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="720" y1="620" x2="1330" y2="620" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="1025" y="648" font-size="11" fill="#475569" text-anchor="middle">时间 (ms) →</text>
  <line x1="720" y1="270" x2="1330" y2="270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="1336" y="274" font-size="10.5" fill="#64748b">+30</text>
  <line x1="720" y1="330" x2="1330" y2="330" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="1336" y="334" font-size="10.5" fill="#64748b">0</text>
  <line x1="720" y1="440" x2="1330" y2="440" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="1336" y="444" font-size="10.5" fill="#991b1b">-55</text>
  <line x1="720" y1="470" x2="1330" y2="470" stroke="#475569" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="1336" y="474" font-size="10.5" fill="#475569">-70</text>
  <text x="770" y="432" font-size="10.5" fill="#991b1b" font-weight="700">阈电位（较静息正 10–15 mV）</text>
  <line x1="828" y1="505" x2="852" y2="462" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <text x="788" y="520" font-size="10.5" fill="#991b1b">刺激</text>
  <polyline points="720,470 800,468 842,460 858,442 872,395 888,325 902,282 918,262 940,260 962,264 982,274 1002,296 1022,332 1042,382 1062,432 1082,464 1098,480 1118,492 1142,496 1168,492 1198,482 1240,473 1330,470" fill="none" stroke="#0f766e" stroke-width="3"/>
  <text x="870" y="240" font-size="11" fill="#991b1b" font-weight="700">0 期：Na<tspan dy="-3.7" font-size="7.9">+</tspan><tspan dy="3.7"> 快速内流（再生性升支）</tspan></text>
  <text x="1150" y="250" font-size="10.5" fill="#991b1b">超射 ≈ +30 mV</text>
  <text x="898" y="322" font-size="10.5" fill="#831843" font-weight="700">Na<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 失活</tspan></text>
  <text x="1080" y="380" font-size="11" fill="#075985" font-weight="700">复极：K<tspan dy="-3.7" font-size="7.9">+</tspan><tspan dy="3.7"> 外流（迟开放）</tspan></text>
  <text x="1120" y="515" font-size="10.5" fill="#475569">后超极化（K<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 通道关闭迟缓）</tspan></text>
  <text x="726" y="576" font-size="11" fill="#475569" font-weight="700">不应期：</text>
  <rect x="880" y="560" width="105" height="25" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="932" y="576" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">绝对不应期</text>
  <rect x="995" y="560" width="150" height="25" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="1070" y="576" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">相对不应期</text>
  <text x="1160" y="576" font-size="10" fill="#475569">失活态不可激发 / 部分复活需强刺激</text>
  <text x="726" y="600" font-size="10.5" fill="#475569">绝对不应期约 0.5–2 ms，为最高发放频率封顶；相对期幅度稍低</text>
  <text x="690" y="666" font-size="10.5" fill="#475569">全或无：达阈后幅度恒定、与刺激强度无关——强刺激改「节拍」而非「音量」（频率编码）；再长的阈下刺激也唤不起动作电位</text>
  <rect x="30" y="706" width="1340" height="276" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="728.84" font-size="19" fill="#475569" font-weight="700">三、离子分布与兴奋性的物理账本</text>
  <rect x="60" y="770" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="797.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">离子</text>
  <rect x="170" y="770" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="797.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">胞内 (mmol/L)</text>
  <rect x="340" y="770" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="797.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">胞外 (mmol/L)</text>
  <rect x="510" y="770" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="595" y="797.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">平衡电位</text>
  <rect x="60" y="814" width="110" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="837.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">K<tspan dy="-3.6" font-size="7.6">+</tspan></text>
  <rect x="170" y="814" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="837.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 140</text>
  <rect x="340" y="814" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="837.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 4–5</text>
  <rect x="510" y="814" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="595" y="837.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 -90 mV</text>
  <rect x="60" y="850" width="620" height="36" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="850" width="110" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="873.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">Na<tspan dy="-3.6" font-size="7.6">+</tspan></text>
  <rect x="170" y="850" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="873.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 10–15</text>
  <rect x="340" y="850" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="873.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 142</text>
  <rect x="510" y="850" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="595" y="873.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 +60 mV</text>
  <rect x="60" y="886" width="110" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="909.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">Ca<tspan dy="-3.6" font-size="7.6">2+</tspan></text>
  <rect x="170" y="886" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="909.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 0.0001（游离）</text>
  <rect x="340" y="886" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="909.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 2.25–2.75</text>
  <rect x="510" y="886" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="595" y="909.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 +125 mV</text>
  <rect x="60" y="922" width="620" height="36" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="922" width="110" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="945.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">Cl<tspan dy="-3.6" font-size="7.6">-</tspan></text>
  <rect x="170" y="922" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="945.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 4–10</text>
  <rect x="340" y="922" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="945.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 105</text>
  <rect x="510" y="922" width="170" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="595" y="945.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">约 -65 至 -70 mV</text>
  <text x="720" y="782" font-size="11" fill="#475569" font-weight="600">电荷分离于薄薄一层：改变 100 mV 只需每平方微米移动数千离子</text>
  <text x="720" y="808" font-size="10.5" fill="#475569">梯度是水库，电位是涟漪——建立电位几乎不消耗浓度</text>
  <text x="720" y="834" font-size="10.5" fill="#475569">利多卡因优先结合失活态 Na<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 通道（使用依赖性）→ 局麻·抗心律失常</tspan></text>
  <text x="720" y="860" font-size="10.5" fill="#475569">Hodgkin 与 Huxley：1939 年枪乌贼巨轴突记录，1952 年电压钳四方程（1963 年诺奖）；心脏动作电位多平台期</text>
  <text x="720" y="878" font-size="10.5" fill="#475569">（Ca<tspan dy="-3.6" font-size="7.6">2+</tspan><tspan dy="3.6"> 内流与 K</tspan><tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 外流对峙），时程更长</tspan></text>
  <text x="720" y="924" font-size="10.5" fill="#475569">复合动作电位幅度依赖兴奋纤维数目与同步性 → 传导检查主看潜伏期</text>
  <text x="720" y="948" font-size="10.5" fill="#475569">升支逼近而不及 E<tspan dy="2.3" font-size="7.6">Na</tspan><tspan dy="-2.3">；后超极化源于 K</tspan><tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 通道关闭迟缓</tspan></text>
</svg>