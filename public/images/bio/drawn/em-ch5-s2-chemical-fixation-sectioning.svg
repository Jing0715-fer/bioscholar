  <text x="655" y="889" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">垂直切割方向的周期性厚带</text>
  <rect x="744" y="869" width="156" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="822" y="889" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">调切速切角、加固夹持</text>
  <rect x="480" y="898" width="86" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="523" y="918" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">压缩</text>
  <rect x="566" y="898" width="178" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="655" y="918" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">沿切割方向缩短变宽</text>
  <rect x="744" y="898" width="156" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="822" y="918" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">调切角、匹配树脂硬度</text>
  <rect x="480" y="927" width="420" height="29" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="480" y="927" width="86" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="523" y="947" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">皱褶</text>
  <rect x="566" y="927" width="178" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="655" y="947" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">切片相互叠压</text>
  <rect x="744" y="927" width="156" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="822" y="947" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">调槽液温度与摊片时间</text>
  <text x="690" y="968" font-size="10" fill="#64748b" text-anchor="middle">混淆两类假象会把好样品误诊为坏固定</text>
  <rect x="930" y="796" width="410" height="168" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="946" y="820" font-size="12" fill="#1e293b" font-weight="700">读图纪律</text>
  <text x="946" y="844" font-size="10" fill="#475569">区分「固定假象」（内容物抽取、收缩、解聚）与「切片假象」（刀痕、颤痕、</text>
  <text x="946" y="858" font-size="10" fill="#475569">压缩的机械痕迹）：前者指向流程前端，后者指向切片台——混淆两者，</text>
  <text x="946" y="872" font-size="10" fill="#475569">会把一块好样品误诊为坏固定。</text>
  <text x="946" y="894" font-size="10" fill="#475569">化学固定的可信度约 2–5 nm：形态学金标准的账本要随身携带；</text>
  <text x="946" y="908" font-size="10" fill="#475569">分子比例与动态的问题，正是第 3 节物理固定要正面回答的。</text>
