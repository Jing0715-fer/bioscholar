  <rect x="744" y="840" width="156" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="822" y="860" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">移刃位或换刀</text>
  <rect x="480" y="869" width="420" height="29" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="480" y="869" width="86" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="523" y="889" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">颤痕</text>
