<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">化学固定、包埋与超薄切片：室温路线流水线</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">戊二醛 2–3% 交联蛋白、锇酸 1–2% 固定脂质；分级脱水、Epon 60 °C 聚合 24–48 h、切片 70–90 nm、双重后染；可信度约 2–5 nm</text>
  <rect x="30" y="132" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、双固定：戊二醛交联蛋白，四氧化锇钉死脂质</text>
  <text x="70" y="205" font-size="13" fill="#4c1d95" font-weight="700">戊二醛：蛋白交联（前固定）</text>
  <ellipse cx="180" cy="268" rx="58" ry="40" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="180" y="273" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="600">蛋白</text>
  <ellipse cx="430" cy="268" rx="52" ry="36" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="430" y="273" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="600">蛋白</text>
  <circle cx="238" cy="268" r="5" fill="#6d28d9"/>
  <circle cx="378" cy="268" r="5" fill="#6d28d9"/>
  <line x1="240" y1="268" x2="376" y2="268" stroke="#6d28d9" stroke-width="3" marker-end="url(#arr-pro)" marker-start="url(#arr-pro)"/>
  <text x="308" y="250" font-size="10.5" fill="#6d28d9" text-anchor="middle" font-weight="600">Schiff 碱桥，跨度约 7 Å</text>
  <text x="70" y="330" font-size="10.5" fill="#475569">五碳二醛：两个醛基进攻赖氨酸等伯氨基形成亚胺连接，亦可经 Michael 型加成接巯基与咪唑基；</text>
  <text x="70" y="345" font-size="10.5" fill="#475569">单体与低聚体的平衡影响渗透速度与最终硬度。</text>
  <rect x="181.1543" y="369.075" width="337.6914" height="17.849999999999998" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="350" y="381.78" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">2–3% 戊二醛 · 磷酸盐或二甲砷酸盐缓冲 pH 7.2–7.4 · 25 °C 1–2 h</text>
  <text x="740" y="205" font-size="13" fill="#075985" font-weight="700">四氧化锇：脂质固定加电子密度（后固定）</text>
  <g><circle cx="780" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="780" y1="262" x2="780" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="780" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="804" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="804" y1="262" x2="804" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="804" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="828" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="828" y1="262" x2="828" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="828" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="852" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="852" y1="262" x2="852" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="852" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="876" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="876" y1="262" x2="876" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="876" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="900" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="900" y1="262" x2="900" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="900" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="924" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="924" y1="262" x2="924" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="924" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="948" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="948" y1="262" x2="948" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="948" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="972" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="972" y1="262" x2="972" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="972" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="996" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="996" y1="262" x2="996" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="996" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="1020" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="1020" y1="262" x2="1020" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1020" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="1044" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="1044" y1="262" x2="1044" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1044" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="1068" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="1068" y1="262" x2="1068" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1068" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/><circle cx="1092" cy="258" r="5.5" fill="#0369a1" fill-opacity="0.85"/><line x1="1092" y1="262" x2="1092" y2="267" stroke="#0369a1" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1092" cy="271" r="5.5" fill="#0369a1" fill-opacity="0.85"/></g>
  <circle cx="860" cy="212" r="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="860" y="216.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">OsO<tspan dy="2.6" font-size="8.6">4</tspan></text>
  <line x1="860" y1="240" x2="860" y2="254" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <text x="740" y="305" font-size="10.5" fill="#475569">对脂质不饱和脂肪酸的碳碳双键做顺式双羟基化加成：锇原子带着两个羟基留在尾区、把脂双层就地钉死；</text>
  <text x="740" y="320" font-size="10.5" fill="#475569">原子序数 76 带来强弹性散射——膜系在图像里的「黑」就是锇原子的集体签名。</text>
  <rect x="935.2795" y="343.075" width="249.44100000000003" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1060" y="355.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">1–2% 四氧化锇 · 0.5–2 h · Z = 76 提供电子密度</text>
  <rect x="420.625" y="391.075" width="558.75" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="700" y="403.78" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">顺序不可颠倒：戊二醛先行锁住蛋白基质、开出渗透通道；锇若先接触组织，表层剧烈硬化反而堵死戊二醛的渗入</text>
  <text x="60" y="422" font-size="10" fill="#64748b">定型史：Palade 1952 缓冲锇固定；Watson 1958 醋酸铀染色；Luft 1961 Epon 环氧包埋；Sabatini、Bensch 与 Barrnett 1963 戊二醛；Reynolds 1963 柠檬酸铅。</text>
  <rect x="30" y="456" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="478.84" font-size="19" fill="#475569" font-weight="700">二、流水线全景：两天上下的化学马拉松</text>
  <line x1="46" y1="496" x2="46" y2="712" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="58" y="490" width="614" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="510" font-size="11.5" fill="#1e293b" font-weight="700">① 前固定</text>
  <text x="170" y="510" font-size="10.5" fill="#475569">2–3% 戊二醛，25 °C 1–2 h——交联蛋白、稳定基质</text>
  <rect x="58" y="523" width="614" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="543" font-size="11.5" fill="#1e293b" font-weight="700">② 后固定</text>
  <text x="170" y="543" font-size="10.5" fill="#475569">1–2% 四氧化锇，0.5–2 h——固定脂质并赋予电子密度</text>
  <rect x="58" y="556" width="614" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="576" font-size="11.5" fill="#1e293b" font-weight="700">③ 分级脱水</text>
  <text x="170" y="576" font-size="10.5" fill="#475569">乙醇 30% 至 100% 逐级置换，每步 10–15 min；70% 台阶可暂存过夜</text>
  <rect x="58" y="589" width="614" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="609" font-size="11.5" fill="#1e293b" font-weight="700">④ 过渡与块染</text>
  <text x="170" y="609" font-size="10.5" fill="#475569">丙酮或氧化丙烯过渡；醋酸铀块染抗抽取（衬度红利是副产品）</text>
  <rect x="58" y="622" width="614" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="642" font-size="11.5" fill="#1e293b" font-weight="700">⑤ 浸透与聚合</text>
  <text x="170" y="642" font-size="10.5" fill="#475569">Epon/Araldite 环氧树脂，60 °C 聚合 24–48 h 固化成硬块</text>
  <rect x="58" y="655" width="614" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="675" font-size="11.5" fill="#1e293b" font-weight="700">⑥ 超薄切片</text>
  <text x="170" y="675" font-size="10.5" fill="#475569">玻璃刀或钻石刀切 70–90 nm，切片漂浮刀槽水面、捞上铜网</text>
  <rect x="58" y="688" width="614" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="72" y="708" font-size="11.5" fill="#1e293b" font-weight="700">⑦ 双重后染</text>
  <text x="170" y="708" font-size="10.5" fill="#475569">醋酸铀染核酸与蛋白；柠檬酸铅染膜系与糖原（Reynolds 1963）</text>
  <text x="58" y="736" font-size="10" fill="#64748b">整条流程约两天、全程室温到 60 °C：稳定、便宜、可批量——病理诊断（肾脏活检、肿瘤分型）的常规武器。</text>
  <rect x="710" y="456" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="478.84" font-size="19" fill="#475569" font-weight="700">三、超薄切片：钻石刀、刀槽与捞网</text>
  <polygon points="750,510 860,510 845,585 765,585" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="805" y="552" font-size="11" fill="#78350f" text-anchor="middle" font-weight="600">树脂块</text>
  <line x1="868" y1="548" x2="938" y2="548" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="903" y="534" font-size="9.5" fill="#64748b" text-anchor="middle">进给</text>
  <polygon points="960,510 1050,510 1005,588" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="1005" y="500" font-size="10" fill="#075985" text-anchor="middle" font-weight="600">钻石刀（刃口半径小而持久）</text>
  <rect x="930" y="592" width="190" height="38" rx="4" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="944" y="588" width="24" height="5" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <rect x="976" y="588" width="24" height="5" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <rect x="1008" y="588" width="24" height="5" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
  <text x="1025" y="616" font-size="9.5" fill="#075985" text-anchor="middle">刀槽水面（切片漂浮摊展）</text>
  <circle cx="1250" cy="560" r="36" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <line x1="1214" y1="560" x2="1286" y2="560" stroke="#94a3b8" stroke-width="1"/>
  <line x1="1250" y1="524" x2="1250" y2="596" stroke="#94a3b8" stroke-width="1"/>
  <line x1="1225" y1="535" x2="1275" y2="585" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="1225" y1="585" x2="1275" y2="535" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="1250" y="618" font-size="10" fill="#475569" text-anchor="middle">铜网捞取</text>
  <line x1="1136" y1="592" x2="1190" y2="576" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="1023.196" y="509.5" width="153.60800000000003" height="17" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1100" y="521.6" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">70–90 nm：干涉色银灰至金黄</text>
  <rect x="877" y="669.5" width="306" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1030" y="681.6" font-size="10" fill="#475569" text-anchor="middle">玻璃刀：临用现断、便宜；刃口寿命仅数十张、微观起伏留细划痕</text>
  <rect x="867" y="699.5" width="326" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1030" y="711.6" font-size="10" fill="#475569" text-anchor="middle">钻石刀：持久（数千张）、压缩颤痕更少；昂贵娇气，一次磕碰即报废</text>
  <text x="730" y="738" font-size="10" fill="#64748b">树脂硬度匹配：软组织配偏硬树脂以获支撑、硬组织配偏软树脂以缓冲切割应力——失配则压缩与颤痕成对出现。</text>
  <rect x="30" y="766" width="1340" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="788.84" font-size="19" fill="#475569" font-weight="700">四、假象清单：能信到几纳米</text>
  <rect x="50" y="796" width="400" height="168" rx="8" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.6"/>
  <text x="66" y="820" font-size="12" fill="#991b1b" font-weight="700">固定假象（指向流程前端）</text>
  <text x="66" y="842" font-size="10" fill="#475569">可溶性蛋白被抽提（固定剂到达前已自由流失）；细胞与细胞器收缩</text>
  <text x="66" y="856" font-size="10" fill="#475569">（渗透失衡与交联收缩）；微管解聚</text>
  <text x="66" y="870" font-size="10" fill="#475569">（未经戊二醛充分预固定几乎必失——教训最深的经典项）；</text>
  <text x="66" y="884" font-size="10" fill="#475569">膜系形态漂移与间隙改变；酶活性与抗原性大损。</text>
  <rect x="199.8524" y="890.65" width="100.2952" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="903.96" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">可信度约 2–5 nm</text>
  <text x="66" y="930" font-size="10" fill="#475569">谈「形态」可靠，谈「分子比例与动态」则危险——后者交给物理固定。</text>
  <rect x="480" y="796" width="86" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="523" y="823.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">切片假象</text>
  <rect x="566" y="796" width="178" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="655" y="823.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">形貌特征</text>
  <rect x="744" y="796" width="156" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="822" y="823.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">对策方向</text>
  <rect x="480" y="840" width="86" height="29" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="523" y="860" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">刀痕</text>
