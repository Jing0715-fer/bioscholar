  <text x="495" y="742" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">铱膜：约 1 nm 级颗粒</text>
  <text x="60" y="776" font-size="10" fill="#475569">膜的粒度就是分辨率的硬地板：常规金或金钯合金 2–10 nm，看 5 nm 以下细节时金膜自己先糊掉；</text>
  <text x="60" y="790" font-size="10" fill="#475569">铱膜颗粒约 1 nm 级更细。</text>
  <rect x="95.9" y="871.5" width="188.2" height="17" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="190" y="883.6" font-size="10" fill="#065f46" text-anchor="middle">OTO 锇-硫卡巴肼-锇导电染色免金属膜</text>
  <rect x="467" y="871.5" width="126" height="17" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="530" y="883.6" font-size="10" fill="#065f46" text-anchor="middle">碳镀对能谱与大样品友好</text>
  <rect x="710" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、截面抛光、块面成像与路线决策表</text>
  <text x="730" y="618" font-size="10.5" fill="#475569">截面抛光（CP）：氩离子束数 kV 铣削、末段约 1 kV 收尾成镜面——平整块面是背散射切面成像与体积电镜的入场券，</text>
  <text x="730" y="633" font-size="10.5" fill="#475569">每切一刀新鲜面自然裸露、无需整体覆膜。</text>
  <rect x="730" y="668" width="220" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="840" y="695.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">样品与目标</text>
  <rect x="950" y="668" width="180" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1040" y="695.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">推荐路线</text>
