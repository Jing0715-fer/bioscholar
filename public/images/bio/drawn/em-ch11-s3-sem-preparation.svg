  <rect x="316" y="360" width="70" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="351" y="388" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">80%</text>
  <line x1="388" y1="383" x2="396" y2="383" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="398" y="360" width="70" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="433" y="388" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">90%</text>
  <line x1="470" y1="383" x2="478" y2="383" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="480" y="360" width="70" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="515" y="388" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">95%</text>
  <line x1="552" y1="383" x2="560" y2="383" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <rect x="562" y="360" width="70" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="597" y="388" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">100%</text>
  <text x="360" y="434" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">乙醇逐级置换，每级 10–20 分钟</text>
  <text x="360" y="452" font-size="10" fill="#64748b" text-anchor="middle">直接投入无水乙醇会因渗透压抽缩变形；几毫米组织块整夜爬梯度、单层细胞半小时走完</text>
  <rect x="127.69999999999999" y="479.5" width="144.60000000000002" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="200" y="491.6" font-size="10" fill="#134e4a" text-anchor="middle">双固定：戊二醛 2–2.5% 过夜</text>
  <rect x="436.09999999999997" y="479.5" width="127.80000000000003" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="500" y="491.6" font-size="10" fill="#134e4a" text-anchor="middle">锇酸 1% 后固定 1–2 小时</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、临界点干燥：让液气界面消失</text>
  <rect x="770" y="230" width="300" height="250" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
