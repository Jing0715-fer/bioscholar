  <text x="1040" y="732.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">CPD + 铱膜</text>
  <rect x="1130" y="712" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="732.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">膜粒度约 1 nm 级</text>
