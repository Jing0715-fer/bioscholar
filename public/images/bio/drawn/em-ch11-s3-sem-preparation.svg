  <text x="140" y="326" font-size="9.5" fill="#64748b" text-anchor="middle">微绒毛舒展</text>
  <line x1="210" y1="268" x2="250" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="230" y="250" font-size="9.5" fill="#991b1b" text-anchor="middle">空气干燥</text>
  <text x="330" y="216" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">空气干燥后</text>
