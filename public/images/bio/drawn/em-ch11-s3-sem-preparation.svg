  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">扫描电镜的样品制备：梯度脱水、临界点干燥与导电化</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">水的表面张力72mN/m，乙醇30至100%逐级脱水每级10–20分钟；CO₂临界点31.1°C、7.4MPa使界面消失；金钯膜2–10nm（金岛2–5nm为分辨率地板）、铱膜约1nm；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">截面抛光末段约1kV收尾</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、双重困境：真空要干燥、张力怕界面</text>
  <rect x="137.51760000000002" y="176.65" width="184.9648" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230" y="189.96" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">水的表面张力 72 mN/m（20 °C）</text>
  <rect x="479.015" y="176.65" width="121.97" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="540" y="189.96" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">气液界面扫过即塌陷</text>
  <text x="140" y="216" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">固定良好</text>
