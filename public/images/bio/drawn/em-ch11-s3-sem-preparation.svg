  <rect x="961.273" y="303.075" width="141.454" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1032" y="315.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">临界点 31.1 °C、7.4 MPa</text>
  <circle cx="898" cy="364" r="5" fill="#dc2626"/>
  <text x="866" y="384" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">液</text>
  <text x="830" y="440" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">固</text>
  <text x="980" y="420" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">气</text>
  <line x1="830" y1="440" x2="886" y2="380" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <line x1="910" y1="364" x2="1000" y2="322" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <text x="940" y="290" font-size="9.5" fill="#831843" text-anchor="middle">① 低温加压以液态 CO<tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> 置换乙醇（互溶，换数次务求换净）</tspan></text>
  <text x="940" y="306" font-size="9.5" fill="#831843" text-anchor="middle">② 升温越过临界点：界面消失、张力归零</text>
  <text x="1100" y="240" font-size="10.5" fill="#475569">越过临界点后液气不再两相共存，</text>
  <text x="1100" y="255" font-size="10.5" fill="#475569">表面张力归零——样品从液态环境直接进入气态而不经过任何界面。</text>
  <rect x="1157.74" y="351.075" width="104.52" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1210" y="363.78" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">陷阱一：残留乙醇</text>
  <rect x="1157.74" y="385.075" width="104.52" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1210" y="397.78" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">陷阱二：卸压过快</text>
  <text x="1040" y="470" font-size="10" fill="#64748b" text-anchor="middle">Anderson 1951 年提出；CO<tspan dy="2.2" font-size="7.2">2</tspan><tspan dy="-2.2"> 以温和临界点与对乙醇的互溶性胜出——半个多世纪物理一字未改</tspan></text>
  <rect x="30" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、导电化：溅射镀膜与导电染色</text>
