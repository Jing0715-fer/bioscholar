  <text x="330" y="272" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700">烙饼</text>
  <text x="330" y="326" font-size="9.5" fill="#64748b" text-anchor="middle">微绒毛并拢成毡</text>
  <rect x="70" y="360" width="70" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="105" y="388" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">30%</text>
  <line x1="142" y1="383" x2="150" y2="383" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
