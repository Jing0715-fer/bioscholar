<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">核苷酸的从头合成与补救合成</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">嘌呤「先PRPP后环」（酰胺转移酶限速，IMP耗6ATP再分支为AMP/GMP）vs嘧啶「先环后糖苷」（CPS-II限速→UMP）；脱氧核苷酸在NDP水平还原；补救靠APRT/HGPRT，</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">HGPRT缺陷致Lesch-Nyhan</text>
  <rect x="30" y="132" width="700" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、嘌呤从头合成（胞质 · 肝为主）：先 PRPP 后环</text>
  <rect x="56" y="184" width="130" height="36" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="121" y="206" font-size="11" fill="#1e293b" text-anchor="middle">核糖-5-磷酸</text>
  <line x1="188" y1="202" x2="240" y2="202" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="214" y="188" font-size="9" fill="#64748b" text-anchor="middle">＋ATP</text>
  <rect x="242" y="184" width="110" height="36" rx="7" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.6"/>
  <text x="297" y="206" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">PRPP</text>
  <line x1="354" y1="202" x2="406" y2="202" stroke="#be185d" stroke-width="2.8" marker-end="url(#arr-enz)"/>
  <rect x="408" y="184" width="130" height="36" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="473" y="206" font-size="11" fill="#1e293b" text-anchor="middle">5-磷酸核糖胺</text>
  <line x1="540" y1="202" x2="580" y2="202" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="560" y="188" font-size="9" fill="#64748b" text-anchor="middle">多步</text>
  <rect x="582" y="182" width="128" height="40" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#b45309" stroke-width="1.8"/>
  <text x="646" y="200" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="700">IMP</text>
  <text x="646" y="214" font-size="8.5" fill="#64748b" text-anchor="middle">前体 / 分支点</text>
  <rect x="181.6235" y="231.925" width="64.75299999999999" height="16.15" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="214" y="243.42" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="600">PRPP 合成酶</text>
  <rect x="324.5" y="231.5" width="111" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="380" y="243.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">酰胺转移酶（限速酶）</text>
  <text x="380" y="262" font-size="9" fill="#64748b" text-anchor="middle">受 AMP / GMP / IMP 反馈抑制</text>
  <path d="M600,222 C480,250 260,296 162,322" fill="none" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <path d="M600,222 C460,286 240,358 162,404" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <rect x="56" y="320" width="106" height="36" rx="7" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="109" y="342" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">AMP</text>
  <rect x="56" y="400" width="106" height="36" rx="7" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.6"/>
  <text x="109" y="422" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">GMP</text>
  <rect x="214.442025" y="281.925" width="171.11595000000003" height="16.15" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="293.42" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="600">腺苷酸代琥珀酸 → 裂解（GTP 供能）</text>
  <rect x="191.39835000000002" y="367.925" width="217.20329999999996" height="16.15" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="379.42" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="600">IMP 脱氢酶 → XMP → GMP 合成酶（ATP 供能）</text>
  <rect x="440" y="396" width="270" height="64" rx="8" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.6"/>
  <text x="456" y="420" font-size="12" fill="#78350f" font-weight="700">合成 1 分子 IMP 消耗 6 ATP</text>
  <text x="456" y="442" font-size="10" fill="#475569">（5 个高能键＋甲酰 THF 当量）——核苷酸合成「昂贵」</text>
  <text x="440" y="480" font-size="10.5" fill="#475569">交叉调节：AMP 分支由 GTP 供能、</text>
  <text x="440" y="495" font-size="10.5" fill="#475569">GMP 分支由 ATP 供能，交叉供能互相促进又彼此牵制，</text>
  <text x="440" y="510" font-size="10.5" fill="#475569">保持两者平衡。</text>
  <text x="56" y="524" font-size="10.5" fill="#64748b">嘌呤环各原子在 PRPP 骨架上逐步装配（见右图）。</text>
  <rect x="750" y="132" width="620" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="154.84" font-size="19" fill="#475569" font-weight="700">二、嘌呤环的「零件表」：各原子来源</text>
  <polygon points="880,274 920.02,297 920.02,343 880,366 839.98,343 839.98,297" fill="#f1f5f9" fill-opacity="0.6" stroke="#cbd5e1" stroke-width="1.4"/>
  <polygon points="839.98,297 811,271.7 838.6,234.89999999999998 875.4,246.39999999999998 880,274" fill="#f1f5f9" fill-opacity="0.6" stroke="#cbd5e1" stroke-width="1.4"/>
  <circle cx="880" cy="366" r="11" fill="#ffffff" stroke="#be185d" stroke-width="1.8"/>
  <text x="880" y="369.5" font-size="8.5" fill="#be185d" text-anchor="middle" font-weight="700">N1</text>
  <circle cx="920.02" cy="343" r="11" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="920.02" y="346.5" font-size="8.5" fill="#b45309" text-anchor="middle" font-weight="700">C2</text>
  <circle cx="920.02" cy="297" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.8"/>
  <text x="920.02" y="300.5" font-size="8.5" fill="#0369a1" text-anchor="middle" font-weight="700">N3</text>
  <circle cx="880" cy="274" r="11" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="880" y="277.5" font-size="8.5" fill="#6d28d9" text-anchor="middle" font-weight="700">C4</text>
  <circle cx="839.98" cy="297" r="11" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="839.98" y="300.5" font-size="8.5" fill="#6d28d9" text-anchor="middle" font-weight="700">C5</text>
  <circle cx="839.98" cy="343" r="11" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="839.98" y="346.5" font-size="8.5" fill="#d97706" text-anchor="middle" font-weight="700">C6</text>
  <circle cx="811" cy="271.7" r="11" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="811" y="275.2" font-size="8.5" fill="#6d28d9" text-anchor="middle" font-weight="700">N7</text>
  <circle cx="838.6" cy="234.89999999999998" r="11" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="838.6" y="238.39999999999998" font-size="8.5" fill="#b45309" text-anchor="middle" font-weight="700">C8</text>
  <circle cx="875.4" cy="246.39999999999998" r="11" fill="#ffffff" stroke="#0369a1" stroke-width="1.8"/>
  <text x="875.4" y="249.89999999999998" font-size="8.5" fill="#0369a1" text-anchor="middle" font-weight="700">N9</text>
  <text x="840" y="408" font-size="10.5" fill="#64748b" text-anchor="middle">嘌呤环（IMP 的碱基部分）</text>
  <rect x="1020" y="208" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="235.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">原子</text>
  <rect x="1130" y="208" width="220" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="235.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">来源</text>
  <rect x="1020" y="252" width="110" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="273.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">N1</text>
  <rect x="1130" y="252" width="220" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="273.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">Asp（天冬氨酸）</text>
  <rect x="1020" y="284" width="330" height="32" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="1020" y="284" width="110" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="305.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">C2 · C8</text>
  <rect x="1130" y="284" width="220" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="305.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">一碳单位（N¹⁰-甲酰 THF）</text>
  <rect x="1020" y="316" width="110" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="337.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">N3 · N9</text>
  <rect x="1130" y="316" width="220" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="337.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">Gln（酰胺 N）</text>
  <rect x="1020" y="348" width="330" height="32" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="1020" y="348" width="110" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="369.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">C4 · C5 · N7</text>
  <rect x="1130" y="348" width="220" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="369.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">Gly（甘氨酸）</text>
  <rect x="1020" y="380" width="110" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="401.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">C6</text>
  <rect x="1130" y="380" width="220" height="32" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="401.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">CO₂</text>
  <text x="766" y="440" font-size="11" fill="#1e293b" font-weight="700">「先 PRPP 后环」：环原子在磷酸核糖骨架上逐步装配——与嘧啶的「先环后糖苷」恰好相反。</text>
  <text x="766" y="484" font-size="10.5" fill="#475569">IMP 是嘌呤核苷酸合成的共同前体，再分支生成 AMP 与 GMP。</text>
  <text x="766" y="524" font-size="10.5" fill="#64748b">甘氨酸一次贡献 3 个原子（C4·C5·N7），是最大的「零件供应商」。</text>
  <rect x="30" y="566" width="700" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="588.84" font-size="19" fill="#475569" font-weight="700">三、嘧啶从头合成（先环后糖苷）与脱氧核苷酸生成</text>
  <rect x="56" y="620" width="150" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="131" y="636" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Gln + CO₂</text>
  <text x="131" y="652" font-size="9.5" fill="#64748b" text-anchor="middle">＋ 2 ATP</text>
  <line x1="208" y1="640" x2="258" y2="640" stroke="#be185d" stroke-width="2.8" marker-end="url(#arr-enz)"/>
  <rect x="260" y="620" width="110" height="40" rx="7" fill="#fce7f3" fill-opacity="0.5" stroke="#be185d" stroke-width="1.5"/>
  <text x="315" y="636" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">氨甲酰磷酸</text>
  <text x="315" y="652" font-size="9" fill="#64748b" text-anchor="middle">（胞质）</text>
  <rect x="191.71915" y="591.925" width="82.5617" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="233" y="603.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">CPS-II（限速）</text>
  <line x1="372" y1="640" x2="422" y2="640" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="397" y="626" font-size="9" fill="#64748b" text-anchor="middle">＋ Asp</text>
  <rect x="424" y="620" width="100" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="474" y="644" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">乳清酸</text>
  <line x1="526" y1="640" x2="576" y2="640" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="578" y="620" width="130" height="40" rx="7" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.6"/>
  <text x="643" y="636" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">OMP → UMP</text>
  <text x="643" y="652" font-size="9" fill="#64748b" text-anchor="middle">（先成环再接糖）</text>
  <text x="56" y="684" font-size="10.5" fill="#475569">CPS-II 受 UMP 反馈抑制、受 PRPP 与 ATP 激活；细菌中限速酶为 ATCase。CTP 由 UTP 经 CTP 合成酶（Gln 供 N · ATP 供能）生成。</text>
  <rect x="56" y="736" width="130" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="121" y="760" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">NDP（二磷酸）</text>
  <line x1="188" y1="756" x2="260" y2="756" stroke="#be185d" stroke-width="2.8" marker-end="url(#arr-enz)"/>
  <rect x="178.8" y="727.5" width="90.4" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="224" y="739.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">核糖核苷酸还原酶</text>
  <rect x="262" y="736" width="110" height="40" rx="7" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="1.6"/>
  <text x="317" y="754" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">dNDP</text>
  <text x="317" y="770" font-size="9" fill="#64748b" text-anchor="middle">（脱氧核糖）</text>
  <text x="56" y="800" font-size="10.5" fill="#475569">在二磷酸水平还原核糖为脱氧核糖：硫氧还蛋白 / 谷氧还蛋白供氢，NADPH 为最终供体；受 dATP / ATP 别构调节以维持 dNTP 平衡。</text>
  <rect x="56" y="848" width="200" height="44" rx="8" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="156" y="864" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">dUMP</text>
  <text x="156" y="882" font-size="9.5" fill="#64748b" text-anchor="middle">（胸苷酸合酶）</text>
  <line x1="258" y1="870" x2="320" y2="870" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-dna)"/>
  <text x="288" y="856" font-size="8.5" fill="#64748b" text-anchor="middle">N⁵,N¹⁰-CH₂-THF</text>
  <rect x="322" y="848" width="120" height="44" rx="8" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="382" y="870" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">dTMP</text>
  <text x="470" y="864" font-size="10.5" fill="#475569">dTMP 由 dUMP 经胸苷酸合酶合成，</text>
  <text x="470" y="879" font-size="10.5" fill="#475569">甲基来自 N⁵,N¹⁰-甲烯 THF——5-FU 的作用靶点。</text>
  <text x="56" y="924" font-size="11" fill="#1e293b" font-weight="700">嘧啶与嘌呤从头合成的根本差异：先造环再接糖 vs 先备糖再造环。</text>
  <rect x="750" y="566" width="620" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="588.84" font-size="19" fill="#475569" font-weight="700">四、补救合成（salvage）：APRT / HGPRT 与 Lesch-Nyhan</text>
  <rect x="770" y="624" width="120" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="830" y="642" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">碱基 + PRPP</text>
  <text x="830" y="660" font-size="9" fill="#64748b" text-anchor="middle">（现成原料）</text>
  <line x1="892" y1="646" x2="952" y2="646" stroke="#be185d" stroke-width="2.6" marker-end="url(#arr-enz)"/>
  <rect x="954" y="624" width="110" height="44" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.6"/>
  <text x="1009" y="646" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">核苷酸</text>
  <rect x="893.25" y="595.5" width="59.5" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="923" y="607.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">补救合成酶</text>
  <rect x="790.3122" y="690.225" width="39.3756" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="810" y="704.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">APRT</text>
  <text x="870" y="704" font-size="11" fill="#475569">腺嘌呤 + PRPP → AMP</text>
  <rect x="816.64025" y="734.225" width="46.7195" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="840" y="748.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">HGPRT</text>
  <text x="900" y="748" font-size="11" fill="#475569">次黄嘌呤 / 鸟嘌呤 + PRPP → IMP / GMP</text>
  <text x="766" y="782" font-size="10.5" fill="#475569">利用现成碱基 / 核苷重新合成，节省能量——在脑、骨髓等「从头合成弱」的组织尤为重要。</text>
  <rect x="766" y="812" width="592" height="84" rx="9" fill="#fee2e2" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.6"/>
  <text x="782" y="836" font-size="12" fill="#dc2626" font-weight="700">HGPRT 完全缺陷 → Lesch-Nyhan 综合征</text>
  <text x="782" y="860" font-size="10.5" fill="#475569">自残行为 · 痛风 · 智力障碍；PRPP 堆积反馈性促使嘌呤从头合成亢进。</text>
  <text x="766" y="916" font-size="11" fill="#1e293b" font-weight="700">从头合成（肝 · 耗 6 ATP）与补救合成（脑 · 骨髓 · 省能）分工互补。</text>
  <text x="766" y="952" font-size="10.5" fill="#64748b">补救途径同时回收分解产生的碱基，减少尿酸生成。</text>
