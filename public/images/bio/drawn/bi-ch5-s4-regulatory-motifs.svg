<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">调控元件与基因组特征：启动子语法、CpG 岛与 CAI</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">σ70 启动子为 -35（TTGACA）与 -10（TATAAT）框加约 15–19 bp 间距；真核增强子挣脱距离与方向约束；CpG 岛判据三件套（长约 200 bp 以上、GC 高于 50%、Obs/Exp 高于 0.6）；PWM 化频数为逐列对数权重、logo 显示逐列信息量；CAI 为高表达参考集相对适应性的几何平均</text>
  <rect x="30" y="132" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、原核 σ70 启动子与真核核心启动子 / 增强子</text>
  <text x="80" y="184" font-size="13.5" fill="#134e4a" font-weight="700">原核 · 大肠杆菌 σ70：两框一距</text>
  <line x1="90" y1="250" x2="630" y2="250" stroke="#0f766e" stroke-width="2.4"/>
  <rect x="120" y="232" width="84" height="36" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="162" y="254" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">TTGACA</text>
  <text x="162" y="222" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">-35 元件</text>
  <rect x="340" y="232" width="84" height="36" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="382" y="254" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">TATAAT</text>
  <text x="382" y="222" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">-10 元件（Pribnow 框）</text>
  <line x1="470" y1="214" x2="560" y2="214" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-rna)"/>
  <text x="470" y="276" font-size="10.5" fill="#64748b" text-anchor="middle">转录起点</text>
  <line x1="470" y1="232" x2="470" y2="248" stroke="#b45309" stroke-width="2"/>
  <path d="M 208,283 Q 208,274 217,274 M 327,274 Q 336,274 336,283" fill="none" stroke="#134e4a" stroke-width="1.7"/>
  <line x1="217" y1="274" x2="327" y2="274" stroke="#134e4a" stroke-width="1.7"/>
  <text x="272" y="298" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="600">约 15–19 bp（约 17 bp 最优）</text>
  <text x="90" y="344" font-size="11.5" fill="#475569">交替 σ 因子各有保守 motif 与语法——间距改变，识别即失。</text>
  <text x="700" y="184" font-size="13.5" fill="#075985" font-weight="700">真核 · 核心启动子与增强子</text>
  <line x1="710" y1="250" x2="1350" y2="250" stroke="#0f766e" stroke-width="2.4"/>
  <rect x="730" y="232" width="100" height="36" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="780" y="254" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">增强子</text>
  <line x1="840" y1="240" x2="950" y2="240" stroke="#be185d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr-enz)"/>
  <text x="895" y="226" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">挣脱距离与方向</text>
  <rect x="960" y="226" width="370" height="52" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="975" y="246" font-size="10.5" fill="#075985" font-weight="700">核心启动子（RNA Pol II 装配平台）</text>
  <rect x="1050" y="234" width="84" height="36" rx="4" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1092" y="256" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">TATAAA</text>
  <rect x="1160" y="234" width="64" height="36" rx="4" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1192" y="256" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">Inr</text>
  <rect x="1240" y="234" width="76" height="36" rx="4" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1278" y="256" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">BRE·DPE</text>
  <text x="1085" y="300" font-size="10.5" fill="#64748b" text-anchor="middle">TATA 框（−25 ~ −30 bp）</text>
  <text x="1205" y="300" font-size="10.5" fill="#64748b" text-anchor="middle">Inr（横跨起点）</text>
  <line x1="1192" y1="226" x2="1192" y2="218" stroke="#b45309" stroke-width="2"/>
  <text x="1192" y="210" font-size="10.5" fill="#64748b" text-anchor="middle">转录起点</text>
  <text x="700" y="344" font-size="11.5" fill="#475569">增强子挣脱距离与方向约束——真核调控预测常需开放染色质数据先行框区。</text>
  <rect x="30" y="472" width="660" height="488" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="494.84" font-size="19" fill="#475569" font-weight="700">二、CpG 岛判据与位置权重矩阵 / motif logo</text>
  <text x="60" y="524" font-size="12.5" fill="#1e293b" font-weight="700">CpG 岛经典判据三件套（Gardiner-Garden 与 Frommer，1987）</text>
  <rect x="113.53220000000002" y="549.8" width="102.93559999999998" height="20.4" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="165" y="564.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">长度 ≥ 200 bp</text>
  <rect x="334.2912" y="549.8" width="71.4176" height="20.4" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="370" y="564.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">GC &gt; 50%</text>
  <rect x="515.6952" y="549.8" width="98.60960000000001" height="20.4" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="565" y="564.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">Obs/Exp &gt; 0.6</text>
  <text x="60" y="598" font-size="11.5" fill="#475569">脊椎动物基因组中 GC 与 CpG 双富集的短区段，多与管家基因启动子关联。</text>
  <text x="60" y="668" font-size="12.5" fill="#1e293b" font-weight="700">PWM 与 motif logo</text>
  <rect x="93" y="711" width="38" height="95" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="112" y="779.704" font-size="58.9" fill="#059669" text-anchor="middle" font-weight="700">A</text>
  <text x="112" y="826" font-size="10" fill="#94a3b8" text-anchor="middle">1</text>
  <rect x="137" y="761" width="38" height="45" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="156" y="793.544" font-size="27.9" fill="#0369a1" text-anchor="middle" font-weight="700">C</text>
  <rect x="137" y="731" width="38" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="156" y="752.696" font-size="18.6" fill="#d97706" text-anchor="middle" font-weight="700">G</text>
  <text x="156" y="826" font-size="10" fill="#94a3b8" text-anchor="middle">2</text>
  <rect x="181" y="716" width="38" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="200" y="781.088" font-size="55.8" fill="#d97706" text-anchor="middle" font-weight="700">G</text>
  <text x="200" y="826" font-size="10" fill="#94a3b8" text-anchor="middle">3</text>
  <rect x="225" y="756" width="38" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="244" y="792.16" font-size="31" fill="#dc2626" text-anchor="middle" font-weight="700">T</text>
  <rect x="225" y="726" width="38" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="244" y="747.696" font-size="18.6" fill="#059669" text-anchor="middle" font-weight="700">A</text>
  <text x="244" y="826" font-size="10" fill="#94a3b8" text-anchor="middle">4</text>
  <rect x="269" y="721" width="38" height="85" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="288" y="782.472" font-size="52.7" fill="#059669" text-anchor="middle" font-weight="700">A</text>
  <text x="288" y="826" font-size="10" fill="#94a3b8" text-anchor="middle">5</text>
  <rect x="313" y="736" width="38" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="332" y="786.624" font-size="43.4" fill="#0369a1" text-anchor="middle" font-weight="700">C</text>
  <text x="332" y="826" font-size="10" fill="#94a3b8" text-anchor="middle">6</text>
  <rect x="357" y="764" width="38" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="376" y="794.3744" font-size="26.04" fill="#d97706" text-anchor="middle" font-weight="700">G</text>
  <rect x="357" y="736" width="38" height="28.000000000000004" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="376" y="756.2496" font-size="17.360000000000003" fill="#dc2626" text-anchor="middle" font-weight="700">T</text>
  <text x="376" y="826" font-size="10" fill="#94a3b8" text-anchor="middle">7</text>
  <text x="430" y="700" font-size="11.5" fill="#475569">PWM 把位点频数化为逐列对数权重；</text>
  <text x="430" y="716" font-size="11.5" fill="#475569">logo 以堆高显示逐列信息量——高柱即保守列。</text>
  <text x="430" y="780" font-size="11" fill="#64748b">第 1 / 3 / 5 列近单一残基：信息量高；</text>
  <text x="430" y="795" font-size="11" fill="#64748b">第 2 / 4 列有分裂：信息量低。</text>
  <rect x="710" y="472" width="660" height="488" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="494.84" font-size="19" fill="#475569" font-weight="700">三、密码子使用偏性与 CAI</text>
  <text x="740" y="524" font-size="11.5" fill="#475569">同义密码子的使用并不均等——同一氨基酸的不同密码子有明显的使用偏好。</text>
  <rect x="760" y="580" width="60" height="110" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="790" y="712" font-size="11" fill="#64748b" text-anchor="middle">常用</text>
  <rect x="850" y="638" width="60" height="52" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="880" y="712" font-size="11" fill="#64748b" text-anchor="middle">次常用</text>
  <rect x="940" y="670" width="60" height="20" fill="#ccfbf1" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="970" y="712" font-size="11" fill="#64748b" text-anchor="middle">罕见</text>
  <text x="860" y="570" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">同义密码子使用频率（示意）</text>
  <rect x="1090" y="560" width="250" height="160" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="1215" y="596" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">CAI = exp( Σ ln wᵢ / L )</text>
  <text x="1105" y="626" font-size="11" fill="#475569">wᵢ：密码子 i 的相对适应性</text>
  <text x="1105" y="641" font-size="11" fill="#475569">（最优同义密码子取 1）</text>
  <text x="1105" y="676" font-size="11" fill="#475569">L：基因内密码子总数——几何平均</text>
  <rect x="740" y="756" width="150" height="54" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.6"/>
  <text x="815" y="787" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">高表达参考集</text>
  <line x1="894" y1="783" x2="926" y2="783" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="930" y="756" width="150" height="54" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1005" y="787" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">逐密码子 w</text>
  <line x1="1084" y1="783" x2="1116" y2="783" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="1120" y="756" width="150" height="54" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1195" y="787" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">几何平均</text>
  <line x1="1274" y1="783" x2="1306" y2="783" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="1290" y="756" width="150" height="54" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1365" y="787" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">CAI</text>
  <text x="740" y="860" font-size="11.5" fill="#475569">CAI 为高表达参考集相对适应性的几何平均——高表达基因的密码子选择向参考集靠拢，CAI 量度这种偏性。</text>
</svg>