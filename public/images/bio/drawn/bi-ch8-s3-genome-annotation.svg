  <rect x="844" y="758" width="24" height="24" rx="3" fill="#059669" fill-opacity="0.75" stroke="#cbd5e1" stroke-width="0.6"/>
  <rect x="870" y="758" width="24" height="24" rx="3" fill="#059669" fill-opacity="0.75" stroke="#cbd5e1" stroke-width="0.6"/>
