    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">基因组注释：重复先行、三方证据合流与 BUSCO 体检</text>
  <text x="700" y="74" text-anchor="middle" font-size="16" fill="#64748b">RepeatMasker同源屏蔽与RepeatModelerdenovo挖掘互补，软屏蔽（小写化）为默认；结构注释由从头预测、转录证据与蛋白同源三方合流，EVM/MAKER加权投票输出一致基因集，</text>
  <text x="700" y="100" text-anchor="middle" font-size="16" fill="#64748b">评估须区分核苷酸级、外显子级与基因级口径；功能注释以直向同源转移为核心（同一性约≥40%且覆盖过半，宁紧勿松）；BUSCO四桶统计完整性——高分不担保基因家族注释正确</text>
  <rect x="30" y="132" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、注释流水线：重复先行 → 结构合流 → 功能转移 → 完整性体检</text>
  <rect x="68" y="185" width="224" height="112" rx="9" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="180" y="214" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">原始基因组组装</text>
  <text x="82" y="240" font-size="10.5" fill="#475569">重叠群 / 支架序列，</text>
  <text x="82" y="254.5" font-size="10.5" fill="#475569">尚未指认任何元件</text>
  <rect x="328" y="185" width="224" height="112" rx="9" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="440" y="214" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">① 重复注释先行</text>
  <text x="342" y="240" font-size="10.5" fill="#475569">RepeatMasker 同源屏蔽＋</text>
  <text x="342" y="254.5" font-size="10.5" fill="#475569">RepeatModeler 等 de novo</text>
  <text x="342" y="269" font-size="10.5" fill="#475569">挖掘；软屏蔽（小写化）</text>
  <text x="342" y="283.5" font-size="10.5" fill="#475569">为默认</text>
  <rect x="588" y="185" width="224" height="112" rx="9" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="700" y="214" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">② 基因结构注释</text>
  <text x="602" y="240" font-size="10.5" fill="#475569">从头预测 ＋ 转录证据</text>
  <text x="602" y="254.5" font-size="10.5" fill="#475569">＋ 蛋白同源三方合流，</text>
  <text x="602" y="269" font-size="10.5" fill="#475569">EVM / MAKER 加权投票</text>
  <rect x="848" y="185" width="224" height="112" rx="9" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="960" y="214" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">③ 功能注释</text>
  <text x="862" y="240" font-size="10.5" fill="#475569">直向同源转移 ＋ InterProScan</text>
  <text x="862" y="254.5" font-size="10.5" fill="#475569">签名扫描，两条路线互为印证</text>
  <rect x="1108" y="185" width="224" height="112" rx="9" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.7"/>
  <text x="1220" y="214" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">④ 完整性评估</text>
  <text x="1122" y="240" font-size="10.5" fill="#475569">BUSCO 以单拷贝直系同源</text>
  <text x="1122" y="254.5" font-size="10.5" fill="#475569">标记集四桶统计</text>
  <line x1="292" y1="241" x2="328" y2="241" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="552" y1="241" x2="588" y2="241" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="812" y1="241" x2="848" y2="241" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="1072" y1="241" x2="1108" y2="241" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="60" y="336" font-size="11.5" fill="#475569">软屏蔽仅把重复区碱基小写化——位置与序列信息俱在，故为默认；重复屏蔽不先行，基因预测会被转座子淹没。</text>
  <rect x="30" y="406" width="660" height="574" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="428.84" font-size="19" fill="#475569" font-weight="700">二、基因结构注释：三方证据的加权合流</text>
  <rect x="60" y="470" width="220" height="64" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#b45309" stroke-width="1.7"/>
  <text x="170" y="497" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">从头预测</text>
  <text x="170" y="519" font-size="11" fill="#475569" text-anchor="middle">不依赖外部证据的编码概率模型</text>
  <rect x="60" y="556" width="220" height="64" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#b45309" stroke-width="1.7"/>
  <text x="170" y="583" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">转录证据</text>
  <text x="170" y="605" font-size="11" fill="#475569" text-anchor="middle">RNA-seq / EST 比对定边界</text>
  <rect x="60" y="642" width="220" height="64" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#b45309" stroke-width="1.7"/>
  <text x="170" y="669" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">蛋白同源</text>
  <text x="170" y="691" font-size="11" fill="#475569" text-anchor="middle">近缘物种蛋白比对定编码可靠性</text>
  <line x1="280" y1="502" x2="345" y2="552" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <line x1="280" y1="588" x2="345" y2="590" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <line x1="280" y1="674" x2="345" y2="628" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <rect x="348" y="540" width="230" height="100" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="463" y="578" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="700">EVM / MAKER</text>
  <text x="463" y="602" font-size="11.5" fill="#475569" text-anchor="middle">按证据类型加权投票</text>
  <line x1="463" y1="640" x2="463" y2="668" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr-pro)"/>
  <rect x="348" y="668" width="230" height="56" rx="8" fill="#ede9fe" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="463" y="701" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">一致基因集</text>
  <text x="60" y="766" font-size="13.5" fill="#1e293b" font-weight="700">评估须区分三种口径</text>
  <rect x="115.28" y="787.8" width="69.44" height="20.4" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="150" y="802.32" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">核苷酸级</text>
  <rect x="315.28" y="787.8" width="69.44" height="20.4" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="350" y="802.32" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">外显子级</text>
  <rect x="521.46" y="787.8" width="57.08" height="20.4" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="550" y="802.32" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">基因级</text>
  <text x="60" y="838" font-size="11.5" fill="#475569">同一注释集在三种口径下的灵敏度可以相差悬殊——报告口径先于数字本身。</text>
  <text x="60" y="876" font-size="11.5" fill="#475569">EvidenceModeler / MAKER 对各证据源加权投票：权重反映每类证据的历史可靠性，最终输出单一一致基因模型。</text>
  <rect x="710" y="406" width="660" height="574" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="428.84" font-size="19" fill="#475569" font-weight="700">三、功能注释：直向同源转移与 BUSCO 完整性体检</text>
  <text x="740" y="458" font-size="13.5" fill="#1e293b" font-weight="700">直向同源（可转移） vs 旁向同源（慎转移）</text>
  <rect x="740" y="474" width="290" height="148" rx="10" fill="#ccfbf1" fill-opacity="0.4" stroke="#0f766e" stroke-width="1.7"/>
  <circle cx="820" cy="530" r="20" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="820" y="535" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700" font-style="italic">a</text>
  <circle cx="950" cy="530" r="20" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="950" y="535" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700" font-style="italic">a′</text>
  <line x1="840" y1="530" x2="930" y2="530" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="885" y="512" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">物种分化</text>
  <text x="756" y="586" font-size="11" fill="#475569">直向同源：功能通常保守——注释转移的首选。</text>
  <rect x="1050" y="474" width="290" height="148" rx="10" fill="#fce7f3" fill-opacity="0.4" stroke="#be185d" stroke-width="1.7"/>
  <circle cx="1130" cy="530" r="20" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="1130" y="535" font-size="12.5" fill="#831843" text-anchor="middle" font-weight="700" font-style="italic">a₁</text>
  <circle cx="1260" cy="530" r="20" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="1260" y="535" font-size="12.5" fill="#831843" text-anchor="middle" font-weight="700" font-style="italic">a₂</text>
  <line x1="1150" y1="530" x2="1240" y2="530" stroke="#be185d" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="1195" y="512" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">基因复制</text>
  <text x="1066" y="586" font-size="11" fill="#475569">旁向同源：常已分化——功能转移须谨慎。</text>
  <rect x="740" y="636" width="600" height="40" rx="8" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.6"/>
  <text x="1040" y="661" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">转移门槛宁紧勿松：同一性约 ≥ 40% 且覆盖过半</text>
  <text x="740" y="700" font-size="11.5" fill="#475569">两条路线互为印证：签名扫描答「凭什么能做」，直向同源转移答「叫什么、做什么」。</text>
  <text x="740" y="736" font-size="13.5" fill="#1e293b" font-weight="700">BUSCO：以类群特异的单拷贝直系同源标记集体检</text>
  <rect x="740" y="758" width="24" height="24" rx="3" fill="#059669" fill-opacity="0.75" stroke="#cbd5e1" stroke-width="0.6"/>
  <rect x="766" y="758" width="24" height="24" rx="3" fill="#059669" fill-opacity="0.75" stroke="#cbd5e1" stroke-width="0.6"/>
  <rect x="792" y="758" width="24" height="24" rx="3" fill="#059669" fill-opacity="0.75" stroke="#cbd5e1" stroke-width="0.6"/>
