  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">毒粒装配的分子逻辑：自组装、准等价与支架蛋白</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">Caspar-Klug 1962 准等价：一个亚基胜任五重／六重轴；TMV 2130 亚基、螺距 2.3 nm、1955 年两组分重建；成核-生长动力学弱键纠错；HSV 支架 VP21/VP24 用完即弃</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、自组装与准等价：少数基因搭大衣壳</text>
  <polygon points="200,266 232.3,289.5 220,327.5 180,327.5 167.7,289.5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <polygon points="284,266 271,288.5 245,288.5 232,266 245,243.5 271,243.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <polygon points="292,330 279,352.5 253,352.5 240,330 253,307.5 279,307.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <polygon points="164,334 151,356.5 125,356.5 112,334 125,311.5 151,311.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <polygon points="160,270 147,292.5 121,292.5 108,270 121,247.5 147,247.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <polygon points="226,366 213,388.5 187,388.5 174,366 187,343.5 213,343.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <polygon points="226,232 213,254.5 187,254.5 174,232 187,209.5 213,209.5" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="200" y="302" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">五聚体</text>
  <text x="400" y="210" font-size="11" fill="#475569">Caspar 与 Klug（1962）准等价理论：</text>
  <text x="400" y="226" font-size="11" fill="#475569">同一亚基只需微调构象，</text>
  <text x="400" y="242" font-size="11" fill="#475569">即可胜任五重轴顶点与六重轴侧面两类位置。</text>
  <text x="400" y="290" font-size="11" fill="#475569">亚基内置信息 + 弱键可逆性：装错了就拆、</text>
  <text x="400" y="306" font-size="11" fill="#475569">重装——忠实与纠错由此保证。</text>
  <text x="400" y="356" font-size="11" fill="#64748b">少数基因编码的蛋白，</text>
  <text x="400" y="372" font-size="11" fill="#64748b">得以搭建庞大衣壳——几何是省基因的最大杠杆。</text>
  <text x="200" y="396" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">一个亚基，两种座位（准等价）</text>
  <text x="50" y="480" font-size="11" fill="#64748b">「自组装」的含义：没有酶催、没有模板指令，信息全部写在亚基的形状与结合面上。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、TMV：两组分复活病毒（1955）</text>
  <rect x="813.8" y="253.2" width="32.4" height="93.60000000000001" rx="8.1" fill="#fee2e2" fill-opacity="0.6" stroke="#dc2626" stroke-width="2.2"/>
