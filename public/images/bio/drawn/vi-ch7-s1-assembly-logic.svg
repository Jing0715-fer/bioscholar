  <line x1="1290" y1="289.8" x2="1290" y2="370.2" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 5"/>
  <text x="730" y="452" font-size="11" fill="#475569">Fraenkel-Conrat 与 Williams 把颗粒解离为蛋白与 RNA，再混合——侵染性颗粒原样重建：装配信息在蛋白亚基、</text>
  <text x="730" y="468" font-size="11" fill="#475569">遗传信息在 RNA。</text>
  <text x="730" y="502" font-size="11" fill="#64748b">装配自基因组内部的起始序列发起，以 20S 双层盘起始；体外数小时即可完成、产物侵染率可观。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、成核-生长：衣壳装配的动力学骨架</text>
