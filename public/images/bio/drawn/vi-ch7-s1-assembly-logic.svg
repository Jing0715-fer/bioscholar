  <text x="110" y="952" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="260" y1="930" x2="260" y2="936" stroke="#475569" stroke-width="1.8"/>
  <text x="260" y="952" font-size="13" fill="#64748b" text-anchor="middle">时间</text>
  <line x1="410" y1="930" x2="410" y2="936" stroke="#475569" stroke-width="1.8"/>
  <text x="410" y="952" font-size="13" fill="#64748b" text-anchor="middle">→</text>
  <line x1="104" y1="930" x2="110" y2="930" stroke="#475569" stroke-width="1.8"/>
  <text x="100" y="934" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="104" y1="680" x2="110" y2="680" stroke="#475569" stroke-width="1.8"/>
  <text x="100" y="684" font-size="13" fill="#64748b" text-anchor="end">完成</text>
  <text x="260" y="668" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">装配程度 vs 时间</text>
  <path d="M110,930 C120.0,928.3 152.5,924.2 170,920 C187.5,915.8 200.0,924.2 215,905 C230.0,885.8 245.0,836.3 260,805 C275.0,773.8 290.0,736.7 305,717.5 C320.0,698.3 332.5,695.4 350,690 C367.5,684.6 400.0,685.8 410,685" fill="none" stroke="#0f766e" stroke-width="2.6"/>
  <text x="190" y="700" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">成核限速</text>
  <text x="330" y="810" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">快速生长</text>
  <text x="440" y="650" font-size="11" fill="#475569">成核是慢步骤：少数亚基凑成「种子」后，</text>
  <text x="440" y="666" font-size="11" fill="#475569">生长一泻千里——S 形曲线由此而来。</text>
  <text x="440" y="724" font-size="11" fill="#475569">成核速率对亚基浓度高度敏感：</text>
  <text x="440" y="740" font-size="11" fill="#475569">浓度不足则装配几乎不启动。</text>
  <text x="440" y="788" font-size="11" fill="#475569">弱键可逆性提供质量控制：</text>
  <text x="440" y="804" font-size="11" fill="#475569">错配中间体自发解体，只有正确衣壳存续。</text>
  <text x="440" y="868" font-size="11" fill="#64748b">可逆＝纠错，这是自组装忠实性的来源。</text>
