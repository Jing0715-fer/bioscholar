<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">分类单元与微生物命名：七级阶梯、双名法与种的操作定义</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">七级阶梯界门纲目科属种；种的操作定义：DNA-DNA 杂交 ≥70% 且 ΔTm ≤5 ℃（16S ≥97% 为线索）；双名法 = 大写属名 + 小写种加词斜体；2020 年乳杆菌属拆 25 属</text>
  <rect x="30" y="132" width="660" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、七级分类阶梯：以大肠埃希氏菌的归属为例</text>
  <rect x="70" y="192" width="120" height="30" rx="6" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.5"/>
  <text x="130" y="211" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">界</text>
  <text x="206" y="211" font-size="11.5" fill="#475569">细菌界（另立古菌界等体系）</text>
  <rect x="70" y="228" width="134" height="30" rx="6" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="137" y="247" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">门</text>
  <text x="220" y="247" font-size="11.5" fill="#475569">变形菌门</text>
  <rect x="70" y="264" width="148" height="30" rx="6" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="144" y="283" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">纲</text>
  <text x="234" y="283" font-size="11.5" fill="#475569">γ-变形菌纲</text>
  <rect x="70" y="300" width="162" height="30" rx="6" fill="#f1f5f9" stroke="#be185d" stroke-width="1.5"/>
  <text x="151" y="319" font-size="13" fill="#be185d" text-anchor="middle" font-weight="700">目</text>
  <text x="248" y="319" font-size="11.5" fill="#475569">肠杆菌目</text>
  <rect x="70" y="336" width="176" height="30" rx="6" fill="#f1f5f9" stroke="#be185d" stroke-width="1.5"/>
  <text x="158" y="355" font-size="13" fill="#be185d" text-anchor="middle" font-weight="700">科</text>
  <text x="262" y="355" font-size="11.5" fill="#475569">肠杆菌科</text>
  <rect x="70" y="372" width="190" height="30" rx="6" fill="#f1f5f9" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="165" y="391" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="700">属</text>
  <text x="276" y="391" font-size="11.5" fill="#475569">埃希氏菌属</text>
  <rect x="70" y="408" width="204" height="30" rx="6" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.5"/>
  <text x="172" y="427" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">种</text>
  <text x="290" y="427" font-size="11.5" fill="#475569">大肠埃希氏菌（大肠杆菌）</text>
  <line x1="660" y1="200" x2="660" y2="424" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <text x="676" y="310" font-size="10" fill="#64748b" text-anchor="middle">自上而下范围递缩</text>
  <rect x="710" y="132" width="660" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、原核生物无生殖隔离——「种」只能操作定义</text>
  <rect x="730" y="190" width="620" height="120" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.6"/>
  <text x="750" y="216" font-size="13" fill="#134e4a" font-weight="700">现行标准（种的操作定义）</text>
  <text x="750" y="242" font-size="11.5" fill="#475569">两菌株 DNA-DNA 杂交同源性 ≥70%，且基因组解链温度差 ΔTm ≤5 ℃——同时满足方归同种。</text>
  <rect x="730" y="324" width="620" height="86" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.5"/>
  <text x="750" y="348" font-size="13" fill="#075985" font-weight="700">快速筛查线索</text>
  <text x="750" y="372" font-size="11.5" fill="#475569">16S rRNA 基因序列相似性 ≥97% 作线索；低于 97% 一般提示不同种。</text>
  <text x="730" y="428" font-size="10.5" fill="#64748b">真核生物以生殖隔离定种，原核生物横向基因转移频繁——两套口径截然不同。</text>
  <rect x="30" y="464" width="660" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="486.84" font-size="19" fill="#475569" font-weight="700">三、双名法：学名 = 属名 + 种加词</text>
  <rect x="186.1305" y="517.25" width="107.73899999999999" height="25.5" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="240" y="535.4" font-size="15" fill="#4c1d95" text-anchor="middle" font-weight="700">Escherichia</text>
  <rect x="405.022" y="517.25" width="49.956" height="25.5" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="430" y="535.4" font-size="15" fill="#831843" text-anchor="middle" font-weight="700">coli</text>
  <text x="100" y="572" font-size="10.5" fill="#4c1d95">属名（名词，首字母大写）</text>
  <text x="300" y="572" font-size="10.5" fill="#831843" text-anchor="middle">种加词（形容词，一律小写）</text>
  <text x="335" y="530" font-size="10" fill="#64748b" text-anchor="middle">斜体书写</text>
  <text x="335" y="510" font-size="11" fill="#475569" text-anchor="middle">（Migula, 1895）</text>
  <text x="335" y="492" font-size="9.5" fill="#64748b" text-anchor="middle">定名人与年份</text>
  <text x="60" y="614" font-size="11" fill="#475569">再次出现可缩写为 E. coli；中文惯称「大肠杆菌」。种加词常编码形态、栖息地等信息</text>
  <text x="60" y="630" font-size="11" fill="#475569">（如 Staphylococcus aureus 的 aureus 即「金黄色」）。</text>
  <rect x="710" y="464" width="660" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="486.84" font-size="19" fill="#475569" font-weight="700">四、种以下的单元与「菌株」</text>
  <rect x="721.0163" y="512.225" width="97.96740000000003" height="19.55" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="770" y="526.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">亚种（subsp.）</text>
  <rect x="884.2325" y="512.225" width="51.535000000000004" height="19.55" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="910" y="526.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">血清型</text>
  <rect x="1008.31" y="512.225" width="63.38" height="19.55" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1040" y="526.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">噬菌体型</text>
  <rect x="1164.2325" y="512.225" width="51.535000000000004" height="19.55" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1190" y="526.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">生物型</text>
  <text x="730" y="560" font-size="10.5" fill="#475569">血清型按表面抗原细分——O157:H7 即大肠杆菌的血清型编号。</text>
  <text x="730" y="590" font-size="11" fill="#475569">菌株是种内的个体：同种不同菌株的毒力与性状可迥异（实验室 K-12 与出血性 O157:H7 同种而天壤之别）。</text>
  <text x="730" y="640" font-size="11" fill="#1e293b" font-weight="700">模式菌株：新种名称的物质凭证，保藏于 ATCC、</text>
  <text x="730" y="656.5" font-size="11" fill="#1e293b" font-weight="700">DSMZ、CGMCC 等公共菌种库。</text>
  <rect x="30" y="716" width="1340" height="264" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="738.84" font-size="19" fill="#475569" font-weight="700">五、命名优先律与学名变更：分类是假说，修订是常态</text>
  <rect x="50" y="752" width="400" height="96" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="70" y="776" font-size="13" fill="#1e293b" font-weight="700">命名优先律</text>
  <text x="70" y="800" font-size="11" fill="#475569">最早合格发表的名称拥有优先权；</text>
  <text x="70" y="816" font-size="11" fill="#475569">1999 年生效的法规修订统一裁定新名称的生效起点，保证检索一致。</text>
  <rect x="529.0532" y="779.8" width="181.89360000000002" height="20.4" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="620" y="794.32" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">Lactobacillus（旧乳杆菌属）</text>
  <line x1="620" y1="812" x2="620" y2="846" stroke="#b45309" stroke-width="2.6" marker-end="url(#arr-rna)"/>
  <text x="660" y="830" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">2020 年拆分</text>
  <rect x="410" y="856" width="140" height="30" rx="6" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.3"/>
  <text x="480" y="875" font-size="9" fill="#134e4a" text-anchor="middle" font-weight="700">德氏乳杆菌（保留原属名）</text>
  <rect x="590" y="856" width="140" height="30" rx="6" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.3"/>
  <text x="660" y="875" font-size="9" fill="#134e4a" text-anchor="middle" font-weight="700">嗜酸乳杆菌 → 新属</text>
  <rect x="770" y="856" width="140" height="30" rx="6" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.3"/>
  <text x="840" y="875" font-size="9" fill="#134e4a" text-anchor="middle" font-weight="700">鼠李糖乳杆菌 → 新属</text>
  <rect x="950" y="856" width="140" height="30" rx="6" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.3"/>
  <text x="1020" y="875" font-size="9" fill="#134e4a" text-anchor="middle" font-weight="700">…… 共 25 个属</text>
  <text x="1090" y="878" font-size="10" fill="#64748b">基于基因组系统发育分析的规模空前重组</text>
  <text x="50" y="920" font-size="11" fill="#1e293b" font-weight="700">分类修订引起属名更换是常态——每一次更名都是「分类假说」被基因组证据刷新的记录，</text>
  <text x="50" y="936.5" font-size="11" fill="#1e293b" font-weight="700">而非科学的反复无常。</text>
  <text x="50" y="950" font-size="10.5" fill="#64748b">判读要点：学名的稳定性服务于交流，而分类的更新服务于真相。</text>
</svg>