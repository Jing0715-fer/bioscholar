  <text x="1130" y="402" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="700">ν = 1/3</text>
  <text x="1130" y="426" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">R ~ N^(1/3)</text>
  <text x="1130" y="450" font-size="10.5" fill="#475569" text-anchor="middle">单体间净吸引，坍缩成致密球（globule）</text>
  <text x="60" y="478" font-size="10.5" fill="#64748b">Flory 指数 ν 只取决于溶剂条件与空间维数，与链的化学细节无关——统计物理普适性（universality）的典范；θ 温度下链表现为理想高斯链。</text>
