  <text x="1023" y="681.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">100 残基链折叠后半径仅 1.5–2 nm</text>
  <rect x="1148" y="652" width="202" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1249" y="681.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">接近 ν=1/3 的致密球</text>
  <rect x="730" y="700" width="168" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="814" y="729.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">小蛋白经验律</text>
  <rect x="898" y="700" width="250" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1023" y="729.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">Rg ≈ R₀·N^(1/3)，R₀ 约 0.3–0.6 nm</text>
  <rect x="1148" y="700" width="202" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1249" y="729.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">与晶体结构实测一致</text>
  <rect x="730" y="748" width="620" height="48" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="748" width="168" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="814" y="777.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">染色质</text>
  <rect x="898" y="748" width="250" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1023" y="777.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">基因组 DNA 被组蛋白逐级压缩，压缩比近万倍</text>
  <rect x="1148" y="748" width="202" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1249" y="777.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">纳米→微米完整尺寸层级</text>
  <text x="730" y="838" font-size="11" fill="#475569">高浓度变性剂（如尿素）中的蛋白质去折叠链近似处于良溶剂条件（ν ≈ 3/5）；</text>
  <text x="730" y="854" font-size="11" fill="#475569">变性 DNA 线团在电泳凝胶中按长度分开——凝胶电泳迁移率的物理基础。</text>
  <text x="730" y="890" font-size="11" fill="#64748b">基因组 DNA 在凝胶中按长度分离、转录因子沿 DNA 的滑行搜索、染色质的压缩与去压缩、细胞拥挤环境中的有效浓度，</text>
  <text x="730" y="906" font-size="11" fill="#64748b">都可用 ν、b、N 少数参数定量描述。</text>
  <rect x="994.5496" y="929.8" width="70.9008" height="20.4" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1030" y="944.32" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">R ~ b·N^ν</text>
</svg>