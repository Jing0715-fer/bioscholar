  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">Flory 指数与溶剂质量：良 / θ / 不良三种链构象</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">R~b·N^ν：θ 溶剂 ν=1/2（理想高斯线团）、良溶剂 ν≈3/5（0.588 溶胀）、不良溶剂 ν=1/3（坍缩球）；λ 噬菌体 DNA 48.5 kb 伸展 16.5 μm；100 残基蛋白折叠后半径 1.5–2 nm；染色质压缩比近万倍</text>
  <rect x="30" y="132" width="1340" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、溶剂质量决定链构象：Flory 标度律 R ~ b·N^ν（1950s 平均场）</text>
