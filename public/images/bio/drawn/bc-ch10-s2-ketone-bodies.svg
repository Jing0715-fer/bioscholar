<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">酮体的生成与利用：肝内生成、肝外氧化</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">HMG-CoA 合酶限速（肝线粒体），产物乙酰乙酸 ~30% / β-羟丁酸 ~70% / 丙酮微量；肝缺 SCOT 只产不用，肝外氧化得 23.5 / 26 ATP，饥饿时供脑 50%~70% 能量</text>
  <rect x="30" y="132" width="700" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、酮体的生成：肝细胞线粒体（仅在肝内合成）</text>
  <rect x="56" y="168" width="100" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="106" y="188" font-size="11.5" fill="#1e293b" text-anchor="middle">脂肪酸</text>
  <line x1="158" y1="184" x2="205" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="182" y="172" font-size="9" fill="#64748b" text-anchor="middle">β-氧化</text>
  <rect x="208" y="168" width="130" height="32" rx="7" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.5"/>
  <text x="273" y="188" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">2 × 乙酰CoA</text>
  <line x1="273" y1="200" x2="273" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="213" y="228" width="120" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="273" y="248" font-size="11.5" fill="#1e293b" text-anchor="middle">乙酰乙酰CoA</text>
  <rect x="363.238" y="205.5" width="103.52400000000002" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="415" y="217.6" font-size="10" fill="#475569" text-anchor="middle" font-weight="600">乙酰乙酰CoA 硫解酶</text>
  <line x1="273" y1="260" x2="273" y2="286" stroke="#be185d" stroke-width="3" marker-end="url(#arr-enz)"/>
  <rect x="208" y="288" width="130" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="273" y="308" font-size="11.5" fill="#1e293b" text-anchor="middle">HMG-CoA</text>
  <rect x="359.0791" y="264.65" width="141.8418" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="430" y="277.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">HMG-CoA 合酶（限速酶）</text>
  <line x1="273" y1="320" x2="273" y2="346" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="371.581" y="324.5" width="86.83800000000001" height="17" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="415" y="336.6" font-size="10" fill="#475569" text-anchor="middle" font-weight="600">HMG-CoA 裂解酶</text>
  <rect x="208" y="348" width="130" height="32" rx="7" fill="#fef3c7" fill-opacity="0.6" stroke="#d97706" stroke-width="1.6"/>
  <text x="273" y="368" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">乙酰乙酸</text>
  <text x="273" y="396" font-size="10" fill="#64748b" text-anchor="middle">约 30%</text>
  <line x1="230" y1="380" x2="160" y2="430" stroke="#d97706" stroke-width="2" marker-end="url(#arr-warn)"/>
  <rect x="102.60480000000001" y="407.35" width="114.79039999999999" height="15.299999999999999" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="418.24" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">β-羟丁酸脱氢酶（NADH）</text>
  <rect x="78" y="432" width="160" height="40" rx="7" fill="#fef3c7" fill-opacity="0.6" stroke="#d97706" stroke-width="1.5"/>
  <text x="158" y="448" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">D-β-羟丁酸</text>
  <text x="158" y="464" font-size="9.5" fill="#64748b" text-anchor="middle">约 70%（严格说不是酮）</text>
  <line x1="316" y1="380" x2="386" y2="430" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <text x="352" y="415" font-size="9" fill="#64748b" text-anchor="middle">自发脱羧</text>
  <rect x="310" y="432" width="150" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="385" y="448" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">丙酮（微量）</text>
  <text x="385" y="464" font-size="9.5" fill="#64748b" text-anchor="middle">经呼吸道排出</text>
  <text x="510" y="190" font-size="10.5" fill="#475569">脂肪酸动员增强（饥饿 · 糖利用障碍）</text>
  <text x="510" y="205" font-size="10.5" fill="#475569">→ 肝内乙酰CoA 暴增、</text>
  <text x="510" y="220" font-size="10.5" fill="#475569">草酰乙酸被糖异生抽调 → 转向生酮。</text>
  <text x="510" y="288" font-size="10.5" fill="#475569">胰岛素抑制脂解，从而抑制生酮。</text>
  <rect x="553.4386" y="450.65" width="93.12280000000001" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="463.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">酮体 = 三者总称</text>
  <rect x="750" y="132" width="620" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="154.84" font-size="19" fill="#475569" font-weight="700">二、酮体的利用：肝内生成 → 肝外利用</text>
  <ellipse cx="870" cy="262" rx="82" ry="88" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="870" y="262" font-size="18" fill="#475569" text-anchor="middle" font-weight="600">肝</text>
  <text x="870" y="288" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">生成酮体</text>
  <text x="870" y="306" font-size="9.5" fill="#64748b" text-anchor="middle">缺乏 SCOT</text>
  <text x="870" y="319" font-size="9.5" fill="#64748b" text-anchor="middle">（琥珀酰CoA 转硫酶），</text>
  <text x="870" y="332" font-size="9.5" fill="#64748b" text-anchor="middle">乙酰乙酸硫激酶活性极低 → 自身不能利用</text>
  <ellipse cx="1230" cy="262" rx="92" ry="88" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="1230" y="262" font-size="18" fill="#475569" text-anchor="middle" font-weight="600">肝外组织</text>
  <text x="1230" y="288" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">心 · 肾 · 脑 · 骨骼肌</text>
  <text x="1230" y="306" font-size="9.5" fill="#64748b" text-anchor="middle">线粒体内氧化酮体</text>
  <line x1="958" y1="240" x2="1132" y2="240" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-bad)"/>
  <text x="1045" y="226" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">酮体（血）</text>
  <text x="766" y="366" font-size="10.5" fill="#475569">D-β-羟丁酸先经 β-羟丁酸脱氢酶（NAD⁺）氧化为乙酰乙酸，再进入利用：</text>
  <rect x="790" y="396" width="130" height="32" rx="7" fill="#fef3c7" fill-opacity="0.6" stroke="#d97706" stroke-width="1.5"/>
  <text x="855" y="416" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">乙酰乙酸</text>
  <circle cx="1000" cy="412" r="30" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1000" y="415.24" font-size="9" fill="#075985" text-anchor="middle" font-weight="700">＋琥珀酰CoA</text>
  <line x1="1046" y1="412" x2="1090" y2="412" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="1133.6365" y="403.075" width="72.727" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1170" y="415.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">SCOT 转硫酶</text>
  <rect x="1240" y="396" width="110" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1295" y="416" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">乙酰乙酰CoA</text>
  <text x="1295" y="444" font-size="9.5" fill="#64748b" text-anchor="middle">＋ 琥珀酸</text>
  <line x1="855" y1="428" x2="855" y2="458" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="790" y="460" width="130" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="855" y="480" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">2 × 乙酰CoA</text>
  <line x1="920" y1="476" x2="1010" y2="476" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="1031.58165" y="467.075" width="76.83670000000001" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1070" y="479.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">TCA 彻底氧化</text>
  <rect x="766" y="506" width="300" height="44" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.6"/>
  <text x="780" y="524" font-size="10.5" fill="#065f46" font-weight="700">每分子乙酰乙酸 ≈ 23.5 ATP（活化耗 1 GTP 当量）</text>
  <text x="780" y="542" font-size="10.5" fill="#065f46" font-weight="700">β-羟丁酸 ≈ 26 ATP</text>
  <text x="1090" y="524" font-size="10.5" fill="#475569">肝「只产不用」，保证酮体作为输出能源。</text>
  <rect x="30" y="566" width="700" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="588.84" font-size="19" fill="#475569" font-weight="700">三、生理意义：脂肪酸的「水溶性运输形式」</text>
  <text x="280" y="646" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">长期饥饿时脑的能量来源</text>
  <rect x="70" y="668" width="420" height="44" fill="#b45309" fill-opacity="0.8" stroke="#b45309" stroke-width="1.5"/>
  <text x="196" y="695" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">酮体 50%~70%</text>
  <rect x="490" y="668" width="180" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="580" y="695" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">葡萄糖 30%~50%</text>
  <text x="280" y="738" font-size="11" fill="#475569" text-anchor="middle">分子小 · 水溶性 —— 可通过血脑屏障与肌肉毛细血管壁</text>
  <text x="70" y="780" font-size="11.5" fill="#475569">· 饥饿时脑的重要替代能源：长期饥饿可满足脑 50%~70% 的能量需要</text>
  <text x="70" y="814" font-size="11.5" fill="#475569">· 心脏也「偏爱」酮体作为燃料</text>
  <text x="70" y="848" font-size="11.5" fill="#475569">· 酮症（生理性代偿）：长期饥饿、高脂低糖饮食 → 血酮升高，血糖尚可维持</text>
  <text x="70" y="900" font-size="11" fill="#64748b">酮体把肝内不溶的脂肪酸打包成可溶的小分子，经血运往肝外——是脂肪酸的「水溶性运输形式」。</text>
  <text x="380" y="958" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">饥饿 · 糖利用障碍 → 脂肪动员 → 生酮</text>
  <rect x="750" y="566" width="620" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="588.84" font-size="19" fill="#475569" font-weight="700">四、酮症酸中毒（DKA）：糖尿病常见急症</text>
  <rect x="800" y="614" width="340" height="40" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="970" y="638" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">1 型糖尿病：胰岛素绝对缺乏</text>
  <line x1="970" y1="654" x2="970" y2="678" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="800" y="690" width="340" height="40" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="970" y="714" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">脂解失控 · 脂肪酸大量入肝</text>
  <line x1="970" y1="730" x2="970" y2="754" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="800" y="766" width="340" height="40" rx="8" fill="#fef3c7" fill-opacity="0.55" stroke="#d97706" stroke-width="1.6"/>
  <text x="970" y="790" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">酮体生成超量（血酮 &gt; 4 mmol/L）</text>
  <line x1="970" y1="806" x2="970" y2="830" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="800" y="842" width="340" height="40" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="970" y="866" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">乙酰乙酸 / β-羟丁酸（强酸）堆积 → 酸中毒</text>
  <rect x="785.00085" y="921.925" width="89.9983" height="16.15" rx="7" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.5"/>
  <text x="830" y="933.42" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">Kussmaul 深大呼吸</text>
  <rect x="934.215" y="921.925" width="27.57" height="16.15" rx="7" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.5"/>
  <text x="948" y="933.42" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">脱水</text>
  <rect x="1052.215" y="921.925" width="27.57" height="16.15" rx="7" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1066" y="933.42" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">酮尿</text>
  <rect x="1160.43" y="921.925" width="47.14" height="16.15" rx="7" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1184" y="933.42" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">重者昏迷</text>
  <rect x="1170" y="614" width="176" height="108" rx="8" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.5"/>
  <text x="1258" y="638" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">「烂苹果味」</text>
  <text x="1180" y="660" font-size="10" fill="#475569">丙酮经呼吸道排出，</text>
  <text x="1180" y="674" font-size="10" fill="#475569">呼气烂苹果味是酮症酸中毒的体征线索。</text>
  <rect x="1170" y="738" width="176" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="1258" y="760" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">「三多一少」</text>
  <text x="1180" y="782" font-size="10" fill="#475569">多食 · 多饮 · 多尿 · 体重减少——葡萄糖不能利用，</text>
  <text x="1180" y="796" font-size="10" fill="#475569">血糖高渗利尿失水，</text>
  <text x="1180" y="810" font-size="10" fill="#475569">脂解与蛋白分解代偿产酮。</text>
  <text x="766" y="968" font-size="10.5" fill="#64748b">生酮饮食（高脂低糖）可用于治疗难治性癫痫。</text>
</svg>