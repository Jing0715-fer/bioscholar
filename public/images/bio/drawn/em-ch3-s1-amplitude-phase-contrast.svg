<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">振幅衬度与相位衬度：两种成像语言</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">振幅衬度源于电子被散射出光阑（质厚衬度），相位衬度源于投影电位推移波前；WPOA：φ=σ·V<tspan dy="3.7" font-size="12.2">p</tspan><tspan dy="-3.7">·t，10nm约0.35–0.7rad；冷冻薄冰相位衬度约70–90%、Q约0.1–0.2</tspan></text>
  <rect x="30" y="132" width="1340" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、两类衬度的物理图像</text>
  <rect x="146.35500000000002" y="170.95" width="167.29" height="22.099999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230" y="186.68" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">振幅衬度：散射得多就暗</text>
  <rect x="230" y="205" width="10" height="130" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="224" y="242" width="22" height="42" fill="#dc2626" fill-opacity="0.75"/>
  <line x1="80" y1="215" x2="500" y2="215" stroke="#0369a1" stroke-width="1.6"/>
  <line x1="80" y1="320" x2="500" y2="320" stroke="#0369a1" stroke-width="1.6"/>
  <line x1="80" y1="250" x2="230" y2="250" stroke="#d97706" stroke-width="1.6"/>
  <line x1="230" y1="250" x2="350" y2="217" stroke="#d97706" stroke-width="1.6"/>
  <line x1="80" y1="272" x2="230" y2="272" stroke="#d97706" stroke-width="1.6"/>
  <line x1="230" y1="272" x2="350" y2="305" stroke="#d97706" stroke-width="1.6"/>
  <rect x="346" y="205" width="8" height="35" fill="#1e293b"/>
  <rect x="346" y="300" width="8" height="35" fill="#1e293b"/>
  <circle cx="350" cy="217" r="3.5" fill="#dc2626"/>
  <circle cx="350" cy="305" r="3.5" fill="#dc2626"/>
  <text x="350" y="362" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">物镜光阑</text>
  <rect x="508" y="205" width="10" height="130" fill="#059669"/>
  <rect x="530" y="205" width="16" height="130" fill="#e2e8f0"/>
  <rect x="530" y="242" width="16" height="42" fill="#1e293b"/>
  <text x="560" y="240" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">像强度</text>
  <text x="560" y="262" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">重区暗</text>
  <text x="60" y="386" font-size="10.5" fill="#475569">散射角超过光阑半角的电子被挡掉——「质量×厚度」大的地方像上变暗；树脂切片中锇酸固定的膜结构呈深色同理。</text>
  <rect x="933.05" y="170.95" width="153.9" height="22.099999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1010" y="186.68" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">相位衬度：干涉出条纹</text>
  <line x1="750" y1="205" x2="750" y2="335" stroke="#0369a1" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="770" y1="205" x2="770" y2="335" stroke="#0369a1" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="790" y1="205" x2="790" y2="335" stroke="#0369a1" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="810" y1="205" x2="810" y2="335" stroke="#0369a1" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="780" y="362" font-size="10.5" fill="#64748b" text-anchor="middle">平面波照明</text>
  <rect x="850" y="205" width="8" height="130" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="843" y="240" width="22" height="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="843" y="280" width="22" height="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <path d="M 880,205 L 880,232 Q 899,249 880,262 L 880,272 Q 899,289 880,300 L 880,335" fill="none" stroke="#0f766e" stroke-width="2.2"/>
  <text x="935" y="362" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="600">出射波前（相位推移）</text>
  <line x1="915" y1="270" x2="955" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="960" y="208" width="175" height="54" rx="8" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.6"/>
  <text x="972" y="230" font-size="12" fill="#991b1b" font-weight="700">理想正焦：|ψ|<tspan dy="-4.1" font-size="8.6">2</tspan><tspan dy="4.1"> ≡ 1</tspan></text>
  <text x="972" y="250" font-size="10.5" fill="#475569">强度均匀——看不见</text>
  <rect x="1155" y="216" width="80" height="38" fill="#cbd5e1"/>
  <rect x="960" y="284" width="175" height="54" rx="8" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.6"/>
  <text x="972" y="306" font-size="11.5" fill="#134e4a" font-weight="700">离焦与像差：相位转译为强度</text>
  <text x="972" y="326" font-size="10.5" fill="#475569">黑白条纹随 χ(g) 而变</text>
  <rect x="1155" y="292" width="80" height="38" fill="#e2e8f0"/>
  <rect x="1155" y="297" width="80" height="7" fill="#1e293b" fill-opacity="0.65"/>
  <rect x="1155" y="311" width="80" height="7" fill="#1e293b" fill-opacity="0.65"/>
  <rect x="1155" y="325" width="80" height="7" fill="#1e293b" fill-opacity="0.65"/>
  <text x="730" y="386" font-size="10.5" fill="#475569">离焦与像差本身是「缺陷」，却恰好充当了泽尼克相衬板的角色——下一节的 CTF 就是这台天然泽尼克板的频率响应曲线。</text>
  <rect x="30" y="432" width="660" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="454.84" font-size="19" fill="#475569" font-weight="700">二、质厚衬度与负染：借重元素造反差</text>
  <line x1="80" y1="500" x2="280" y2="500" stroke="#475569" stroke-width="2"/>
  <ellipse cx="180" cy="492" rx="54" ry="30" fill="#1e293b" fill-opacity="0.82"/>
  <ellipse cx="180" cy="492" rx="40" ry="20" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
  <text x="180" y="548" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">染壳（重金属，散射近全黑）</text>
  <text x="180" y="566" font-size="10" fill="#64748b" text-anchor="middle">颗粒内部相对「透亮」</text>
  <line x1="180" y1="580" x2="180" y2="604" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="70" y="610" width="220" height="62" fill="#1e293b"/>
  <ellipse cx="180" cy="641" rx="62" ry="18" fill="#e2e8f0"/>
  <text x="180" y="694" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">负片式图像：亮颗粒嵌于暗背景</text>
  <text x="340" y="486" font-size="11" fill="#475569">磷钨酸盐等重金属染液干燥后包裹颗粒：染壳散射极强、</text>
  <text x="340" y="502" font-size="11" fill="#475569">几乎全黑，</text>
  <text x="340" y="518" font-size="11" fill="#475569">未染的颗粒内部相对「透亮」——负染因此成为病毒与酶复合物筛查的第一道工序。</text>
  <rect x="399.2073" y="563.075" width="201.58540000000002" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="500" y="575.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">分辨率被染料颗粒度限制在约 15–20 Å</text>
  <rect x="432.5175" y="601.075" width="134.965" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="500" y="613.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">可靠、直观、剂量效率高</text>
  <text x="340" y="650" font-size="10.5" fill="#475569">强度账：</text>
  <text x="340" y="665" font-size="10.5" fill="#475569">散射角超过光阑半角的电子比例随质量厚度近乎指数增长——切片多切 20 nm，</text>
  <text x="340" y="680" font-size="10.5" fill="#475569">有时整张照片黑成一片。强反差与快速饱和是同一枚硬币的两面。</text>
  <rect x="710" y="432" width="660" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="454.84" font-size="19" fill="#475569" font-weight="700">三、相位物体：弱相位近似与不可见悖论</text>
  <rect x="810.88315" y="470.95" width="138.2337" height="22.099999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="880" y="486.68" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">ψ = exp(iφ) ≈ 1 + iφ</text>
  <rect x="1125.314892" y="470.95" width="109.370216" height="22.099999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1180" y="486.68" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">φ(x) = σ·V<tspan dy="2.9" font-size="9.4">p</tspan><tspan dy="-2.9">(x)·t</tspan></text>
  <text x="730" y="516" font-size="11" fill="#475569">σ 在 200–300 kV 约 0.006–0.007 rad·V<tspan dy="-3.7" font-size="7.9">-1</tspan><tspan dy="3.7">·nm</tspan><tspan dy="-3.7" font-size="7.9">-1</tspan><tspan dy="3.7">，轻元素平均内电势约 5–10 V：10 nm 厚度积累约 0.35–0.7 rad 相位、</tspan></text>
  <text x="730" y="532" font-size="11" fill="#475569">50 nm 达 1.75–3.5 rad——弱相位近似对薄区严格、对厚区只是首项展开。</text>
  <rect x="802.73275" y="576.225" width="374.53450000000004" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="990" y="590.14" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="700">悖论：理想透镜 + 严格正焦，纯相位物体完全不可见（模方恒为 1）</text>
  <text x="730" y="616" font-size="11" fill="#475569">解法是干涉：让被散射的物波与未散射的参考波在像点叠加，</text>
  <text x="730" y="632" font-size="11" fill="#475569">相位差才能变成强度差——离焦量与像差正是「相对相位」的调节旋钮；光学同题的答案是泽尼克相衬板</text>
  <text x="730" y="648" font-size="11" fill="#475569">（1953 年诺贝尔物理学奖）。</text>
  <rect x="868.92825" y="672.225" width="282.14349999999996" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1010" y="686.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">冰包埋颗粒恰在 10–100 nm：相位物体的经典领地</text>
  <rect x="30" y="732" width="1340" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="754.84" font-size="19" fill="#475569" font-weight="700">四、生物样品的衬度配比与噪声地板</text>
  <rect x="50" y="782" width="240" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="809.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">样品状态</text>
  <rect x="290" y="782" width="210" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="809.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">主导衬度</text>
  <rect x="500" y="782" width="160" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="580" y="809.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">振幅分数 Q</text>
  <rect x="660" y="782" width="230" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="809.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">典型应用</text>
  <rect x="50" y="826" width="240" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="846.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">重金属负染</text>
  <rect x="290" y="826" width="210" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="846.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">振幅（质厚）</text>
  <rect x="500" y="826" width="160" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="580" y="846.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">大于 0.5</text>
  <rect x="660" y="826" width="230" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="846.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">病毒筛查</text>
  <rect x="50" y="856" width="840" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="856" width="240" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="876.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">树脂切片 + 锇酸固定</text>
  <rect x="290" y="856" width="210" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="876.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">振幅为主</text>
  <rect x="500" y="856" width="160" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="580" y="876.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">约 0.5</text>
  <rect x="660" y="856" width="230" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="876.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">超微结构形态学</text>
  <rect x="50" y="886" width="240" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="906.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">冷冻薄冰（10–100 nm）</text>
  <rect x="290" y="886" width="210" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="906.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">相位为主（约 70–90%）</text>
  <rect x="500" y="886" width="160" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="580" y="906.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">约 0.1–0.2</text>
  <rect x="660" y="886" width="230" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="906.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">高分辨结构解析</text>
  <rect x="50" y="916" width="840" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="916" width="240" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="170" y="936.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">冷冻厚冰（大于 100 nm）</text>
  <rect x="290" y="916" width="210" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="936.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">相位 + 多重散射</text>
  <rect x="500" y="916" width="160" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="580" y="936.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">上升</text>
  <rect x="660" y="916" width="230" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="936.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">断层扫描</text>
  <text x="920" y="800" font-size="11" fill="#475569">泊松噪声：计数的相对涨落为 1/√N——一个区域只收到 100 个电子，</text>
  <text x="920" y="816" font-size="11" fill="#475569">其强度判读的相对误差就有 10%。</text>
  <text x="920" y="850" font-size="11" fill="#475569">信噪比随剂量的平方根增长：剂量抬高信噪比却加速辐射损伤（第 4 章）；</text>
  <text x="920" y="866" font-size="11" fill="#475569">平均与三维重构把数千张同剂量图像叠加，信噪比按颗粒数的平方根上升。</text>
  <text x="920" y="910" font-size="11" fill="#475569">Q 并非常数：厚度增加、染料掺入、电压降低都会推高 Q；</text>
  <text x="920" y="926" font-size="11" fill="#475569">高电压与前向散射使 Q 下降。</text>
</svg>