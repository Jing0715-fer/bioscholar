<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">二级结构预测：从局部倾向到进化信息的三次台阶</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">Chou-Fasman 以构象参数与成核规则达约 50%–60%（Pro 与 Gly 是螺旋破坏者）；GOR 以 17 残基窗口的信息论框架达约 60%–65%；PSIPRED 融合 PSI-BLAST 概型与双层神经网络达约 75%–80%；DSSP（1983）以氢键周期性指派为口径；Q8 信息量更大而数值更低，无序区使 Q3 有原理性上限</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Q3 准确率的三次台阶</text>
  <rect x="100" y="190" width="560" height="270" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="100" y1="392.5" x2="660" y2="392.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="240" y1="460" x2="240" y2="190" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="100" y1="325" x2="660" y2="325" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="380" y1="460" x2="380" y2="190" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="100" y1="257.5" x2="660" y2="257.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="520" y1="460" x2="520" y2="190" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="94" y1="460" x2="100" y2="460" stroke="#475569" stroke-width="1.8"/>
  <text x="90" y="464" font-size="13" fill="#64748b" text-anchor="end">0%</text>
  <line x1="94" y1="392.5" x2="100" y2="392.5" stroke="#475569" stroke-width="1.8"/>
  <text x="90" y="396.5" font-size="13" fill="#64748b" text-anchor="end">25%</text>
  <line x1="94" y1="325" x2="100" y2="325" stroke="#475569" stroke-width="1.8"/>
  <text x="90" y="329" font-size="13" fill="#64748b" text-anchor="end">50%</text>
  <line x1="94" y1="257.5" x2="100" y2="257.5" stroke="#475569" stroke-width="1.8"/>
  <text x="90" y="261.5" font-size="13" fill="#64748b" text-anchor="end">75%</text>
  <line x1="94" y1="190" x2="100" y2="190" stroke="#475569" stroke-width="1.8"/>
  <text x="90" y="194" font-size="13" fill="#64748b" text-anchor="end">100%</text>
  <text x="380" y="504" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">方法（按年代）</text>
  <text x="380" y="178" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">残基级三状态准确率 Q3</text>
  <rect x="195.2" y="311.5" width="89.60000000000001" height="148.5" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="240" y="302.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">50–60%</text>
  <text x="240" y="480" font-size="12.5" fill="#64748b" text-anchor="middle">Chou-Fasman（1974）</text>
  <rect x="335.2" y="291.25" width="89.60000000000001" height="168.75" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="380" y="282.25" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">60–65%</text>
  <text x="380" y="480" font-size="12.5" fill="#64748b" text-anchor="middle">GOR（1980s）</text>
  <rect x="475.2" y="250.75" width="89.60000000000001" height="209.25" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="520" y="241.75" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">75–80%</text>
  <text x="520" y="480" font-size="12.5" fill="#64748b" text-anchor="middle">PSIPRED</text>
  <line x1="100" y1="325" x2="660" y2="325" stroke="#64748b" stroke-width="1.4" stroke-dasharray="7 5" opacity="0.9"/>
  <text x="652" y="318" font-size="11" fill="#64748b" text-anchor="end" font-weight="700">「全卷曲」基线 ≈ 50%</text>
  <text x="60" y="540" font-size="11.5" fill="#475569">DSSP（1983）以主链氢键的周期性指派二级结构，是预测准确率的口径来源；评估须分状态统计。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、三代方法的核心思想</text>
  <rect x="740" y="190" width="580" height="100" rx="10" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.8"/>
  <text x="762" y="222" font-size="15" fill="#134e4a" font-weight="700">Chou-Fasman（1974）</text>
  <text x="762" y="250" font-size="11.5" fill="#475569">残基构象参数 + 成核规则；Pro 与 Gly 是典型的螺旋破坏者。</text>
  <rect x="740" y="308" width="580" height="100" rx="10" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.8"/>
  <text x="762" y="340" font-size="15" fill="#78350f" font-weight="700">GOR（1980s）</text>
  <text x="762" y="368" font-size="11.5" fill="#475569">以 17 个残基的窗口为上下文的信息论框架，显式刻画预测的不确定性。</text>
  <rect x="740" y="426" width="580" height="100" rx="10" fill="#ede9fe" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="762" y="458" font-size="15" fill="#4c1d95" font-weight="700">PSIPRED</text>
  <text x="762" y="486" font-size="11.5" fill="#475569">PSI-BLAST 多序列比对概型 + 双层神经网络——确立「进化信息 + 机器学习」范式。</text>
  <rect x="30" y="576" width="1340" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、Q3 / Q8 口径与预测的原理性上限</text>
  <text x="60" y="648" font-size="12.5" fill="#1e293b" font-weight="700">Q3（三状态）</text>
  <rect x="100" y="664" width="90" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="145" y="692" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">H 螺旋</text>
  <rect x="280" y="664" width="90" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="325" y="692" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">E 片层</text>
  <rect x="460" y="664" width="90" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="505" y="692" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">C 卷曲</text>
  <text x="60" y="762" font-size="12.5" fill="#1e293b" font-weight="700">Q8（八状态）</text>
  <rect x="70" y="778" width="56" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="98" y="800" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">H</text>
  <text x="98" y="816" font-size="8.5" fill="#64748b" text-anchor="middle">α 螺旋</text>
  <rect x="140" y="778" width="56" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="168" y="800" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">G</text>
  <text x="168" y="816" font-size="8.5" fill="#64748b" text-anchor="middle">3₁₀</text>
  <rect x="210" y="778" width="56" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="238" y="800" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">I</text>
  <text x="238" y="816" font-size="8.5" fill="#64748b" text-anchor="middle">π 螺旋</text>
  <rect x="280" y="778" width="56" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="308" y="800" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">E</text>
  <text x="308" y="816" font-size="8.5" fill="#64748b" text-anchor="middle">β 链</text>
  <rect x="350" y="778" width="56" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="378" y="800" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">B</text>
  <text x="378" y="816" font-size="8.5" fill="#64748b" text-anchor="middle">桥</text>
  <rect x="420" y="778" width="56" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="448" y="800" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">T</text>
  <text x="448" y="816" font-size="8.5" fill="#64748b" text-anchor="middle">转角</text>
  <rect x="490" y="778" width="56" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="518" y="800" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">S</text>
  <text x="518" y="816" font-size="8.5" fill="#64748b" text-anchor="middle">弯</text>
  <rect x="560" y="778" width="56" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="588" y="800" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">C</text>
  <text x="588" y="816" font-size="8.5" fill="#64748b" text-anchor="middle">卷曲</text>
  <line x1="145" y1="710" x2="98" y2="778" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="145" y1="710" x2="168" y2="778" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="145" y1="710" x2="238" y2="778" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="325" y1="710" x2="348" y2="778" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="325" y1="710" x2="418" y2="778" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="505" y1="710" x2="558" y2="778" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="505" y1="710" x2="628" y2="778" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="505" y1="710" x2="698" y2="778" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="60" y="856" font-size="11.5" fill="#475569">Q8 信息量更大而数值更低——同一模型换口径，分数自然下降；报告准确率必须先报口径。</text>
  <rect x="700" y="640" width="640" height="100" rx="8" fill="#fef3c7" fill-opacity="0.45" stroke="#d97706" stroke-width="1.5"/>
  <text x="720" y="668" font-size="13" fill="#92400e" font-weight="700">原理性上限</text>
  <text x="720" y="694" font-size="11.5" fill="#475569">局部氢键模式使预测部分可行；远距离相互作用决定其无法完全确定——内在无序区不存在固定二级结构，</text>
  <text x="720" y="710" font-size="11.5" fill="#475569">Q3 存在上限。</text>
  <rect x="700" y="756" width="640" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="720" y="784" font-size="13" fill="#1e293b" font-weight="700">评估纪律</text>
  <text x="720" y="810" font-size="11.5" fill="#475569">「全卷曲」基线即可得约五成准确率——评估须分状态（H/E/C）统计，混淆矩阵比单一数字诚实。</text>
</svg>