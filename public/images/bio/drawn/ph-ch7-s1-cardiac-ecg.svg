  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">心脏的电活动与心电图：从窦房结到体表波形</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">传导系统频率梯度：窦房结60–100次/分优势起搏、房室结延搁0.1s、浦肯野15–40次/分；心室肌2期Ca<tspan dy="-5.8" font-size="12.2">2+</tspan><tspan dy="5.8">平台使APD达0.2–0.3s；ECG之PR0.12–0.20s、QRS0.06–0.10s</tspan></text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、传导系统：频率最高者统治</text>
  <rect x="96" y="186" width="252" height="62" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="222" y="222" font-size="10.5" fill="#475569" text-anchor="middle">心房肌（结间束 0.3–0.5 m/s）</text>
  <path d="M 96,258 L 348,258 L 316,452 L 128,452 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="222" y="300" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">心室肌</text>
  <line x1="278" y1="214" x2="166" y2="214" stroke="#be185d" stroke-width="1.6" marker-end="url(#arr-enz)"/>
  <ellipse cx="300" cy="204" rx="13" ry="11" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="300" y="208" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">①</text>
  <ellipse cx="196" cy="252" rx="12" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="196" y="256" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">②</text>
  <line x1="196" y1="262" x2="196" y2="300" stroke="#0369a1" stroke-width="4"/>
  <text x="196" y="288" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">③</text>
  <line x1="196" y1="300" x2="162" y2="380" stroke="#0369a1" stroke-width="3"/>
  <line x1="196" y1="300" x2="230" y2="380" stroke="#0369a1" stroke-width="3"/>
  <line x1="162" y1="380" x2="140" y2="430" stroke="#0f766e" stroke-width="2"/>
  <line x1="162" y1="380" x2="164" y2="432" stroke="#0f766e" stroke-width="2"/>
  <line x1="162" y1="380" x2="186" y2="428" stroke="#0f766e" stroke-width="2"/>
  <line x1="230" y1="380" x2="208" y2="428" stroke="#0f766e" stroke-width="2"/>
  <line x1="230" y1="380" x2="232" y2="432" stroke="#0f766e" stroke-width="2"/>
  <line x1="230" y1="380" x2="254" y2="430" stroke="#0f766e" stroke-width="2"/>
  <text x="160" y="408" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">④</text>
  <text x="236" y="408" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">⑤</text>
  <text x="420" y="192" font-size="11" fill="#831843" font-weight="700">① 窦房结：60–100 次/分（优势起搏）</text>
  <text x="420" y="222" font-size="11" fill="#92400e" font-weight="700">② 房室结：40–60 次/分 · 延搁 0.1 s</text>
  <text x="420" y="252" font-size="11" fill="#075985" font-weight="700">③ 希氏束与束支：1.5–4.0 m/s</text>
  <text x="420" y="282" font-size="11" fill="#134e4a" font-weight="700">④⑤ 浦肯野纤维：15–40 次/分 · 3–4 m/s</text>
  <text x="420" y="312" font-size="10" fill="#64748b">（心房肌 0.3–0.5、结间束约 1.0 m/s）</text>
  <text x="420" y="342" font-size="10" fill="#475569">房室延搁保证心房收缩先行、</text>
  <text x="420" y="358" font-size="10" fill="#475569">完成心室最后 20%–30% 充盈；</text>
  <text x="420" y="374" font-size="10" fill="#475569">浦肯野高速传导使双室在约 0.1 s 内同步去极化。</text>
  <text x="420" y="408" font-size="10" fill="#475569">优势起搏＋超速驱动压抑：</text>
  <text x="420" y="424" font-size="10" fill="#475569">高频驱动使下位细胞 Na<tspan dy="-3.4" font-size="7.2">+</tspan><tspan dy="3.4">-K</tspan><tspan dy="-3.4" font-size="7.2">+</tspan><tspan dy="3.4"> 泵代偿性增强</tspan></text>
  <text x="420" y="440" font-size="10" fill="#475569">（3Na<tspan dy="-3.4" font-size="7.2">+</tspan><tspan dy="3.4"> 出 : 2K</tspan><tspan dy="-3.4" font-size="7.2">+</tspan><tspan dy="3.4"> 入）→ 轻度过度极化、</tspan></text>
  <text x="420" y="456" font-size="10" fill="#475569">自律性被「锁死」；</text>
  <text x="420" y="472" font-size="10" fill="#475569">窦房结停搏时下位起搏点需数秒「温醒」。</text>
  <text x="50" y="500" font-size="10" fill="#475569">临床：房室传导减慢（PR 延长）或中断（房室传导阻滞）→ 房室配合作业瓦解，是人工起搏器的经典适应证；</text>
  <text x="50" y="516" font-size="10" fill="#475569">室性逸搏 15–40 次/分已难以维持足够心输出量。</text>
  <rect x="710" y="132" width="660" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、心室肌动作电位：五期谱</text>
  <line x1="770" y1="312" x2="770" y2="172" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="770" y1="312" x2="1100" y2="312" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="770" y1="250" x2="1090" y2="250" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="762" y="186" font-size="10" fill="#64748b" text-anchor="end">+30</text>
  <text x="762" y="254" font-size="10" fill="#64748b" text-anchor="end">0</text>
  <text x="762" y="300" font-size="10" fill="#64748b" text-anchor="end">−85</text>
  <text x="782" y="170" font-size="10" fill="#475569">膜电位 (mV)</text>
  <polyline points="785,296 790,286 794,178 802,206 808,212 850,216 900,220 940,224 975,258 1000,282 1015,296 1085,296" fill="none" stroke="#0369a1" stroke-width="3"/>
  <rect x="787" y="286" width="208" height="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="890" y="281" font-size="9" fill="#991b1b" text-anchor="middle">有效不应期（覆盖收缩期）</text>
  <text x="1150" y="196" font-size="9.5" fill="#475569">0 期 快 Na<tspan dy="-3.2" font-size="6.8">+</tspan><tspan dy="3.2"> 内流，1 ms 达 +30</tspan></text>
  <text x="1150" y="220" font-size="9.5" fill="#475569">1 期 Ito 瞬时外向 K<tspan dy="-3.2" font-size="6.8">+</tspan></text>
  <text x="1150" y="244" font-size="9.5" fill="#475569">2 期 L 型 Ca<tspan dy="-3.2" font-size="6.8">2+</tspan><tspan dy="3.2"> 平台 0.1–0.2 s</tspan></text>
  <text x="1150" y="268" font-size="9.5" fill="#475569">3 期 K<tspan dy="-3.2" font-size="6.8">+</tspan><tspan dy="3.2"> 外流复极</tspan></text>
  <text x="1150" y="292" font-size="9.5" fill="#475569">4 期 泵与交换体恢复离子分布</text>
  <text x="940" y="336" font-size="9.5" fill="#64748b" text-anchor="middle">动作电位时程 0.2–0.3 s → 心肌不可能完全强直收缩</text>
  <rect x="710" y="362" width="660" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="384.84" font-size="19" fill="#475569" font-weight="700">三、窦房结：4 期自动去极化与自主神经调制</text>
  <line x1="770" y1="545" x2="770" y2="405" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="770" y1="545" x2="1140" y2="545" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="770" y1="462" x2="1145" y2="462" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="778" y="452" font-size="9.5" fill="#991b1b" font-weight="700">阈电位 −40 mV</text>
  <text x="778" y="527" font-size="9.5" fill="#64748b">最大舒张电位 −55～−60 mV</text>
  <polyline points="780,505 800,500 820,493 840,480 850,468 856,455 864,438 870,432 876,440 884,470 895,505 915,500 935,493 955,480 965,468 971,455 979,438 985,432 991,440 999,470 1010,505 1030,500 1050,494 1070,487 1090,477" fill="none" stroke="#0369a1" stroke-width="2.6"/>
  <text x="880" y="415" font-size="9.5" fill="#075985" font-weight="700">0 期：L 型 Ca<tspan dy="-3.2" font-size="6.8">2+</tspan><tspan dy="3.2">（慢反应、升支缓）</tspan></text>
  <text x="785" y="540" font-size="9.5" fill="#831843" font-weight="700">4 期：IK 衰减 ＋ If（Na<tspan dy="-3.2" font-size="6.8">+</tspan><tspan dy="3.2"> 内流）递增</tspan></text>
  <text x="1180" y="420" font-size="9.5" fill="#475569">交感 β<tspan dy="2.1" font-size="6.8">1</tspan><tspan dy="-2.1">：</tspan></text>
  <text x="1180" y="434" font-size="9.5" fill="#475569">cAMP↑ → If 与 L 型 Ca<tspan dy="-3.2" font-size="6.8">2+</tspan><tspan dy="3.2">↑ → 斜率陡、</tspan></text>
  <text x="1180" y="448" font-size="9.5" fill="#475569">心率↑</text>
  <text x="1180" y="465" font-size="9.5" fill="#475569">迷走 M<tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1">：开 K</tspan><tspan dy="-3.2" font-size="6.8">+</tspan><tspan dy="3.2"> 通道 → 过度极化、</tspan></text>
  <text x="1180" y="479" font-size="9.5" fill="#475569">斜率缓、心率↓</text>
  <text x="1180" y="510" font-size="9.5" fill="#64748b">心率悬于一对自主神经的拔河</text>
  <rect x="30" y="582" width="1340" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="604.84" font-size="19" fill="#475569" font-weight="700">四、体表心电图：波、间期与电-机械对应</text>
  <line x1="100" y1="800" x2="620" y2="800" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 5"/>
  <polyline points="100,800 148,800 158,781 170,769 182,781 190,800 252,800 254,806 263,730 268,700 274,712 280,810 286,798 292,800 360,800 380,781 415,758 450,781 470,800 620,800" fill="none" stroke="#1e293b" stroke-width="2.6"/>
  <text x="330" y="670" font-size="10" fill="#475569">心率 75 次/分（周期 0.8 s）</text>
  <text x="170" y="726" font-size="10" fill="#831843" text-anchor="middle">心房去极化</text>
  <line x1="170" y1="732" x2="170" y2="762" stroke="#be185d" stroke-width="1.4" marker-end="url(#arr-enz)"/>
  <text x="146" y="768" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">P</text>
  <text x="268" y="660" font-size="10" fill="#991b1b" text-anchor="middle">心室去极化</text>
  <line x1="268" y1="670" x2="268" y2="692" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-bad)"/>
  <text x="300" y="680" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">QRS</text>
  <text x="415" y="706" font-size="10" fill="#065f46" text-anchor="middle">心室复极</text>
  <line x1="415" y1="712" x2="415" y2="752" stroke="#059669" stroke-width="1.4" marker-end="url(#arr-ok)"/>
  <text x="452" y="742" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">T</text>
  <text x="326" y="790" font-size="9" fill="#475569" text-anchor="middle">ST 段＝平台期（等电位）</text>
  <line x1="100" y1="800" x2="100" y2="806" stroke="#475569" stroke-width="1.6"/>
  <text x="100" y="820" font-size="9.5" fill="#64748b" text-anchor="middle">0</text>
  <line x1="360" y1="800" x2="360" y2="806" stroke="#475569" stroke-width="1.6"/>
  <text x="360" y="820" font-size="9.5" fill="#64748b" text-anchor="middle">0.4 s</text>
  <line x1="620" y1="800" x2="620" y2="806" stroke="#475569" stroke-width="1.6"/>
  <text x="620" y="820" font-size="9.5" fill="#64748b" text-anchor="middle">0.8 s</text>
  <text x="252" y="828" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700">S1</text>
  <text x="470" y="828" font-size="9" fill="#075985" text-anchor="middle" font-weight="700">S2</text>
  <line x1="148" y1="836" x2="252" y2="836" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="200" y="856" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">PR 0.12–0.20 s</text>
  <line x1="252" y1="878" x2="292" y2="878" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="272" y="872" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">QRS 0.06–0.10 s</text>
  <line x1="252" y1="900" x2="460" y2="900" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)" marker-start="url(#arr-mute)"/>
  <text x="356" y="920" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">QT ≈0.36 s（QTc ≤0.44 s）</text>
  <text x="100" y="946" font-size="10" fill="#475569">Einthoven 1903 弦线电流计记录体表 ECG（1924 诺贝尔奖）；十二导联＝综合心电向量的十二个角度「照片」——既能定时，</text>
  <text x="100" y="961" font-size="10" fill="#475569">也能定位。</text>
  <rect x="760" y="640" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="667.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">成分</text>
  <rect x="870" y="640" width="300" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="667.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">电生理含义</text>
  <rect x="1170" y="640" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="667.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">正常参考</text>
  <rect x="760" y="684" width="110" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="704.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">P 波</text>
  <rect x="870" y="684" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="704.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">心房去极化（Ta 波淹没于 QRS）</text>
  <rect x="1170" y="684" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="704.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">&lt;0.12 s</text>
  <rect x="760" y="714" width="560" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="760" y="714" width="110" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="734.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">PR 间期</text>
  <rect x="870" y="714" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="734.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">房去极化始→室去极化始，含房室延搁</text>
  <rect x="1170" y="714" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="734.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">0.12–0.20 s</text>
  <rect x="760" y="744" width="110" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="764.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">QRS 波群</text>
  <rect x="870" y="744" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="764.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">心室去极化</text>
  <rect x="1170" y="744" width="150" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="764.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">0.06–0.10 s</text>
  <rect x="760" y="774" width="560" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="760" y="774" width="110" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="794.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">ST 段</text>
  <rect x="870" y="774" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1020" y="794.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">全室处于去极化平台，无净电位差</text>
