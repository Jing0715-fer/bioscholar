<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">分子置换的现代实践：两步搜索、Phaser 判据与模型来源</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">旋转函数定取向＋平移函数定位置＋packing闸门；TFZ＞8大概率正确、5–8存疑、LLG显著为正；同源＞30%直接用／20–30%修剪／＜20%用AlphaFold（pLDDT＞90主链约1</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">Å）；ensemble把约1Å误差压到一半以下</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Patterson 旋转／平移两步搜索</text>
  <rect x="60" y="178" width="262" height="44" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="191" y="205" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">晶体 Patterson（实验 |F|<tspan dy="-3.7" font-size="7.9">2</tspan><tspan dy="3.7">）</tspan></text>
  <rect x="398" y="178" width="262" height="44" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="529" y="205" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">模型 Patterson（已知结构）</text>
  <line x1="191" y1="222" x2="300" y2="252" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="529" y1="222" x2="420" y2="252" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="215" y="256" width="300" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="365" y="278" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">① 旋转函数——定取向 Ω</text>
  <text x="365" y="300" font-size="10" fill="#475569" text-anchor="middle">分子内向量对齐（限定向径 10 Å 内）</text>
  <line x1="365" y1="312" x2="365" y2="330" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="470" y="326" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="700">峰列表前 10–100 名</text>
  <rect x="215" y="334" width="300" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="365" y="356" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">② 平移函数——定位置 x</text>
  <text x="365" y="378" font-size="10" fill="#475569" text-anchor="middle">交叉向量吻合（FFT 平移搜索提速）</text>
  <line x1="365" y1="390" x2="365" y2="408" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="215" y="412" width="300" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="365" y="434" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">③ packing 检查（硬闸门）</text>
  <text x="365" y="452" font-size="10" fill="#475569" text-anchor="middle">分子与对称像穿模即出局</text>
  <line x1="515" y1="436" x2="560" y2="436" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <rect x="539.1184" y="426.65" width="97.7632" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="588" y="439.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">LLG／TFZ 裁决</text>
  <text x="60" y="494" font-size="10.5" fill="#64748b">分诊：旋转都无峰→查模型质量与指标化；旋转有峰而平移失败→嫌疑 NCS 与伪平移；两步都成而精修不动→空间群受审。</text>
  <text x="60" y="530" font-size="10.5" fill="#475569">Patterson 峰对应原子间向量：约 3000 原子的蛋白对应近 900 万个向量峰，2–3 Å 下重叠成丘陵——但分子内向量（10 Å 内）</text>
  <text x="60" y="545" font-size="10.5" fill="#475569">的取向信息幸存，正是旋转函数的立足点（Rossmann 与 Blow 1962；快速旋转函数 Crowther 1972）。</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、Phaser 与最大似然判据：LLG／TFZ</text>
  <text x="730" y="182" font-size="10.5" fill="#475569">当代标准引擎 Phaser（McCoy 等 2007 年）：不问「模型与数据的乘积积分多高」，而问「假定此解为真，</text>
  <text x="730" y="197" font-size="10.5" fill="#475569">观测到这组数据的概率多大」——模型误差以 σ<tspan dy="2.3" font-size="7.6">A</tspan><tspan dy="-2.3"> 概率模型显式吸收（Read 的 sigma-A 框架，亦是第 9 章 sigma-A 加权图的地基），</tspan></text>
  <text x="730" y="212" font-size="10.5" fill="#475569">弱信号不被系统误差淹没。</text>
  <rect x="760" y="262" width="225" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <rect x="985" y="262" width="135" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <rect x="1120" y="262" width="180" height="30" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="760" y="312" font-size="10.5" fill="#64748b" text-anchor="middle">0</text>
  <text x="985" y="312" font-size="10.5" fill="#64748b" text-anchor="middle">5</text>
  <text x="1120" y="312" font-size="10.5" fill="#64748b" text-anchor="middle">8</text>
  <text x="1300" y="312" font-size="10.5" fill="#64748b" text-anchor="middle">12</text>
  <text x="872.5" y="281" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">基本不可信</text>
  <text x="1052.5" y="281" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">存疑·需复核</text>
  <text x="1210" y="281" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">大概率正确解</text>
  <text x="1030" y="336" font-size="10.5" fill="#475569" text-anchor="middle">TFZ（translation function Z-score，平移峰标准化分数）</text>
  <text x="730" y="372" font-size="10.5" fill="#475569">LLG（log-likelihood gain，对数似然增益）：衡量「解」比随机噪声假设好多少——正确解应显著为正且随精修上升。</text>
  <text x="730" y="414" font-size="12" fill="#1e293b" font-weight="700">多拷贝递增搜索：</text>
  <text x="730" y="436" font-size="10.5" fill="#475569">不对称单位含 n 个分子时先搜信号最强的第一拷贝，固定后在其相位贡献下搜第二个、</text>
  <text x="730" y="451" font-size="10.5" fill="#475569">依次递增——每一步都借已完成拷贝的力量增强下一个的信号，比一次性盲搜 n 个稳健得多。</text>
  <text x="730" y="500" font-size="10.5" fill="#64748b">分诊口径：TFZ 大于 8 为大概率正确；5–8 存疑需后续复核；小于 5 基本不可信。刚体精修后 R 因子应从约 0.45–0.50 明显回落，</text>
  <text x="730" y="515" font-size="10.5" fill="#64748b">R<tspan dy="2.3" font-size="7.6">free</tspan><tspan dy="-2.3"> 原地踏步者直接弃。</tspan></text>
  <rect x="30" y="572" width="660" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、模型来源决策树：同源结构还是 AlphaFold</text>
  <rect x="170" y="612" width="320" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="330" y="640" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">与 PDB 已知结构的序列一致性？</text>
  <rect x="46" y="700" width="190" height="84" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="141" y="722" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">＞30%</text>
  <text x="141" y="742" font-size="10" fill="#475569" text-anchor="middle">PDB 同源结构直接用</text>
  <text x="141" y="760" font-size="10" fill="#475569" text-anchor="middle">主链偏差＜1.5 Å</text>
  <rect x="256" y="700" width="190" height="84" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="351" y="722" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">20%–30%</text>
  <text x="351" y="742" font-size="10" fill="#475569" text-anchor="middle">按一致性修剪侧链</text>
  <text x="351" y="760" font-size="10" fill="#475569" text-anchor="middle">常截到 CB、重置 B</text>
  <rect x="466" y="700" width="180" height="84" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="556" y="722" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">＜20%</text>
  <text x="556" y="742" font-size="10" fill="#475569" text-anchor="middle">AlphaFold 模型</text>
  <text x="556" y="760" font-size="10" fill="#475569" text-anchor="middle">pLDDT＞90 主链约 1 Å</text>
  <line x1="240" y1="656" x2="141" y2="700" stroke="#475569" stroke-width="1.6"/>
  <line x1="330" y1="656" x2="351" y2="700" stroke="#475569" stroke-width="1.6"/>
  <line x1="420" y1="656" x2="556" y2="700" stroke="#475569" stroke-width="1.6"/>
  <rect x="186" y="826" width="340" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="356" y="848" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">无任何模型 → 第 8 章实验相位</text>
  <text x="356" y="870" font-size="10.5" fill="#64748b" text-anchor="middle">SAD／MAD 接管（重原子亚结构信号）</text>
  <line x1="330" y1="784" x2="330" y2="824" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="536" y="830" font-size="10" fill="#64748b">AF 模型入 MR 前按 pLDDT 裁剪：</text>
  <text x="536" y="844" font-size="10" fill="#64748b">＞70 取用、</text>
  <text x="536" y="858" font-size="10" fill="#64748b">30–70 只取主链、</text>
  <text x="536" y="872" font-size="10" fill="#64748b">＜30 弃用。</text>
  <rect x="710" y="572" width="660" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、ensemble 降误差与模型修剪</text>
  <path d="M 740,668 C 770,640 830,640 860,668" fill="none" opacity="0.5" stroke="#0f766e" stroke-width="3"/>
  <path d="M 746,676 C 776,648 836,648 866,676" fill="none" opacity="0.5" stroke="#b45309" stroke-width="3"/>
  <line x1="880" y1="660" x2="930" y2="660" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <path d="M 940,660 C 970,636 1030,636 1060,660" fill="none" stroke="#6d28d9" stroke-width="4"/>
  <text x="800" y="700" font-size="10" fill="#475569" text-anchor="middle">两个同源模型（各差约 1 Å）</text>
  <text x="1000" y="700" font-size="10" fill="#475569" text-anchor="middle">叠合平均（低通滤波）</text>
  <text x="730" y="728" font-size="10.5" fill="#475569">ensemble：成员按保守区叠合、逐原子平均，「摇晃」部分相互抵消——两个各自差约 1 Å 的模型组成的 ensemble，</text>
  <text x="730" y="743" font-size="10.5" fill="#475569">常把有效误差压到一半以下；成员间主链偏差 1–2 Å 为宜，差异过大则平均模型虚胖、旋转峰变钝。</text>
  <text x="730" y="806" font-size="10.5" fill="#475569">修剪的哲学是「宁缺毋滥」：错误坐标贡献的错误相位比缺失更伤。</text>
  <text x="730" y="821" font-size="10.5" fill="#475569">Sculptor 与 CHAINSAW 按逐残基一致性决定侧链保留——一致残基保留全长、可变残基截到 CB；统一重置 B 因子 20–30 Å²</text>
  <text x="730" y="836" font-size="10.5" fill="#475569">（过低高估可靠性、过高无差别降权）。Molrep（Vagin 与 Teplyakov，1997 年起）为备用引擎：</text>
  <text x="730" y="851" font-size="10.5" fill="#475569">一个解不动时换引擎重跑是常规操作。</text>
  <text x="730" y="886" font-size="10.5" fill="#64748b">时代背景：PDB 超二十万条实验结构（2023 年破二十万）</text>
  <text x="730" y="901" font-size="10.5" fill="#64748b">＋AlphaFold 数据库 2022 年公开约两亿条预测模型——「已知相似结构」从稀缺变为过剩，MR 成为当代第一路径</text>
  <text x="730" y="916" font-size="10.5" fill="#64748b">（典型流程从 MTZ 到候选解常在半小时内）。</text>
</svg>