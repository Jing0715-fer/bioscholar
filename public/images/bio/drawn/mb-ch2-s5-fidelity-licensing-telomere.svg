<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">复制的忠实性与真核 DNA 复制</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">碱基选择→3′→5′校对→错配修复三层叠加，总错误率低至10⁻⁹～10⁻¹⁰；真核以ORC-Cdc6-Cdt1加载MCM的许可机制保证一周期一复制，端粒酶化解末端复制问题</text>
  <rect x="30" y="132" width="700" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、复制忠实性的三层校验（大肠杆菌）</text>
  <rect x="60" y="176" width="600" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="198" font-size="13.5" fill="#1e293b" font-weight="700">① 聚合酶碱基选择</text>
  <text x="80" y="218" font-size="11.5" fill="#475569">沃森-克里克几何构型选择正确 dNTP · 错误率约 10⁻⁵～10⁻⁶</text>
  <line x1="360" y1="230" x2="360" y2="250" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="60" y="252" width="600" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="274" font-size="13.5" fill="#1e293b" font-weight="700">② 3′→5′ 校对（ε 亚基）</text>
  <text x="80" y="294" font-size="11.5" fill="#475569">错配使 3′ 端构型改变，被外切活性切除重合成 · 再降 10²～10³ 倍</text>
  <line x1="360" y1="306" x2="360" y2="326" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="60" y="328" width="600" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="350" font-size="13.5" fill="#1e293b" font-weight="700">③ 错配修复（MMR）</text>
  <text x="80" y="370" font-size="11.5" fill="#475569">MutS / MutL / MutH 修复错配 · 再降 10²～10³ 倍</text>
  <rect x="222.04130000000004" y="388.1" width="275.91739999999993" height="23.8" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="360" y="405.04" font-size="14" fill="#065f46" text-anchor="middle" font-weight="700">总错误率约 10⁻⁹～10⁻¹⁰ / 碱基对 / 代</text>
  <rect x="740" y="132" width="630" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="154.84" font-size="19" fill="#475569" font-weight="700">二、错配修复：GATC 甲基化区分新旧链</text>
  <text x="760" y="186" font-size="11.5" fill="#134e4a">亲代链（GATC 已甲基化）</text>
  <line x1="760" y1="206" x2="1330" y2="206" stroke="#0f766e" stroke-width="2.4"/>
  <circle cx="830" cy="206" r="6" fill="#059669"/>
  <circle cx="990" cy="206" r="6" fill="#059669"/>
  <circle cx="1150" cy="206" r="6" fill="#059669"/>
  <line x1="760" y1="256" x2="1330" y2="256" stroke="#0369a1" stroke-width="2.4"/>
  <circle cx="830" cy="256" r="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.8"/>
  <circle cx="990" cy="256" r="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.8"/>
  <circle cx="1150" cy="256" r="6" fill="#ffffff" stroke="#0369a1" stroke-width="1.8"/>
  <text x="760" y="280" font-size="11.5" fill="#075985">新合成链（GATC 未甲基化）</text>
  <ellipse cx="826" cy="231" rx="28" ry="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="826" y="235" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">MutL</text>
  <ellipse cx="900" cy="231" rx="36" ry="18" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="900" y="236" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">MutS</text>
  <line x1="890" y1="220" x2="884" y2="208" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="894" y1="220" x2="900" y2="208" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="990" cy="256" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="990" y="260" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700">MutH</text>
  <text x="760" y="316" font-size="12.5" fill="#475569">① MutS 识别错配、MutL 协同；② MutH 在未甲基化 GATC 位点切开新合成链；</text>
  <text x="760" y="334" font-size="12.5" fill="#475569">③ 外切酶切除错误片段后由 pol III 与连接酶修复。</text>
  <text x="760" y="372" font-size="12" fill="#dc2626">人类同源蛋白 MSH2/6、MLH1/PMS2 突变导致遗传性非息肉性结直肠癌（Lynch 综合征）。</text>
  <rect x="30" y="452" width="700" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">三、复制许可：一个细胞周期只复制一次</text>
  <rect x="80" y="492" width="560" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="518" font-size="12.5" fill="#475569" text-anchor="middle">G₁ 期：ORC（起点识别复合体）结合复制起点</text>
  <line x1="360" y1="536" x2="360" y2="548" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="550" width="560" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="576" font-size="12.5" fill="#475569" text-anchor="middle">Cdc6 与 Cdt1 加载 MCM2-7 解旋酶 → pre-RC（获得许可）</text>
  <line x1="360" y1="594" x2="360" y2="606" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="608" width="560" height="42" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="360" y="634" font-size="12.5" fill="#475569" text-anchor="middle">S 期：CDK 与 DDK 激酶激活 MCM，起始复制</text>
  <line x1="360" y1="652" x2="360" y2="664" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="666" width="560" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="692" font-size="12.5" fill="#475569" text-anchor="middle">Geminin 与降解机制清除许可因子 → 待下一 G₁ 期重新许可</text>
  <text x="80" y="700" font-size="12" fill="#64748b">「许可因子一次性消耗」的逻辑防止重复复制。</text>
  <rect x="740" y="452" width="630" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="474.84" font-size="19" fill="#475569" font-weight="700">四、末端复制问题与端粒酶（Blackburn 与 Greider，1985）</text>
  <text x="1010" y="490" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">端粒酶：TERT（逆转录酶）+ TER（RNA 模板）</text>
  <ellipse cx="1010" cy="516" rx="74" ry="28" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="1010" y="521" font-size="14" fill="#831843" text-anchor="middle" font-weight="700">端粒酶</text>
  <path d="M1010,544 C 1010,562 1140,560 1160,580" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1060" y="566" font-size="10.5" fill="#78350f" text-anchor="middle">内置 RNA 模板</text>
  <line x1="760" y1="580" x2="1180" y2="580" stroke="#0f766e" stroke-width="2.4"/>
  <line x1="760" y1="620" x2="1120" y2="620" stroke="#0f766e" stroke-width="2.4"/>
  <rect x="1120" y="612" width="70" height="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="1155" y="624" font-size="9.5" fill="#78350f" text-anchor="middle">RNA 引物</text>
  <line x1="1148" y1="634" x2="1162" y2="646" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="1148" y1="646" x2="1162" y2="634" stroke="#dc2626" stroke-width="2.2"/>
  <text x="1155" y="662" font-size="10.5" fill="#dc2626" text-anchor="middle">引物切除</text>
  <line x1="1184" y1="580" x2="1330" y2="580" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-dna)"/>
  <text x="1257" y="566" font-size="10.5" fill="#134e4a" text-anchor="middle">TTAGGG 延伸</text>
  <path d="M 1120,649 Q 1120,640 1129,640 M 1171,640 Q 1180,640 1180,649" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="1129" y1="640" x2="1171" y2="640" stroke="#64748b" stroke-width="1.7"/>
  <text x="1150" y="664" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="600">末端复制问题</text>
  <text x="760" y="690" font-size="11.5" fill="#475569">核糖核蛋白，以 3′ 端突出单链为引物反复回折延伸端粒重复序列（人端粒为 5′-TTAGGG-3′ 串联）。</text>
  <rect x="30" y="732" width="1340" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="754.84" font-size="19" fill="#475569" font-weight="700">五、端粒的生理意义：衰老、干细胞与肿瘤</text>
  <rect x="56" y="786" width="400" height="100" rx="10" fill="#f1f5f9" fill-opacity="0.55" stroke="#64748b" stroke-width="1.8"/>
  <text x="256" y="812" font-size="14.5" fill="#64748b" text-anchor="middle" font-weight="700">体细胞</text>
  <text x="256" y="838" font-size="11.5" fill="#475569" text-anchor="middle">端粒酶活性低，端粒逐代缩短——Hayflick 极限（复制衰老，</text>
  <text x="256" y="855" font-size="11.5" fill="#475569" text-anchor="middle">p53/p16 介导），与衰老相关</text>
  <rect x="480" y="786" width="400" height="100" rx="10" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.8"/>
  <text x="680" y="812" font-size="14.5" fill="#059669" text-anchor="middle" font-weight="700">生殖细胞 / 干细胞</text>
  <text x="680" y="838" font-size="11.5" fill="#475569" text-anchor="middle">端粒酶活跃，维持端粒长度，保障持续分裂能力</text>
  <rect x="904" y="786" width="436" height="100" rx="10" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1122" y="812" font-size="14.5" fill="#dc2626" text-anchor="middle" font-weight="700">肿瘤细胞（约 85%～90%）</text>
  <text x="1122" y="838" font-size="11.5" fill="#475569" text-anchor="middle">重新激活端粒酶获得永生化；其余肿瘤利用 ALT（重组机制）延长端粒</text>
  <text x="56" y="926" font-size="12" fill="#64748b">端粒末端以 D 环 / t 环结构（shelterin 复合体）保护，避免被识别为 DNA 断裂；端粒酶活性可经 TRAP 实验检测。</text>
</svg>