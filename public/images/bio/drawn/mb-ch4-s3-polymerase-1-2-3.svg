<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">真核 RNA 聚合酶 I、II、III</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">三类细胞核聚合酶（各约 14 亚基）按产物分工：pol I 核仁转录 45S pre-rRNA、pol II 转录 pre-mRNA 且具 YSPTSPS 重复 CTD、pol III 转录短 RNA——对 α-鹅膏蕈碱敏感性依次为不敏感 / 极敏感 / 中度敏感</text>
  <rect x="30" y="132" width="1340" height="296" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、三类细胞核 RNA 聚合酶的分工（各约 14 亚基）</text>
  <rect x="60" y="186" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="213.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">聚合酶</text>
  <rect x="230" y="186" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="305" y="213.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">定位</text>
  <rect x="380" y="186" width="620" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="690" y="213.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">转录产物</text>
  <rect x="1000" y="186" width="340" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="213.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">α-鹅膏蕈碱敏感性</text>
  <rect x="60" y="230" width="170" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="258.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">RNA pol I</text>
  <rect x="230" y="230" width="150" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="305" y="258.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">核仁</text>
  <rect x="380" y="230" width="620" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="690" y="258.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">45S pre-rRNA（成熟为 18S、5.8S、28S，不含 5S）</text>
  <rect x="1000" y="230" width="340" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="258.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">不敏感</text>
  <rect x="60" y="276" width="1280" height="46" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="276" width="170" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="304.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">RNA pol II</text>
  <rect x="230" y="276" width="150" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="305" y="304.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">核质</text>
  <rect x="380" y="276" width="620" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="690" y="304.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">mRNA 前体（pre-mRNA）、多数 snRNA、miRNA</text>
  <rect x="1000" y="276" width="340" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="304.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">极敏感（1 μg/ml 即抑制）</text>
  <rect x="60" y="322" width="170" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="350.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">RNA pol III</text>
  <rect x="230" y="322" width="150" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="305" y="350.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">核质</text>
  <rect x="380" y="322" width="620" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="690" y="350.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">tRNA、5S rRNA、U6 snRNA 及其他短 RNA</text>
  <rect x="1000" y="322" width="340" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="350.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">中度敏感（高浓度抑制）</text>
  <text x="60" y="384" font-size="12" fill="#64748b">三者共有 12～17 个同源亚基；催化化学与原核相同，分工与敏感性不同。</text>
  <rect x="30" y="448" width="660" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="470.84" font-size="19" fill="#475569" font-weight="700">二、α-鹅膏蕈碱敏感性：经典鉴定依据</text>
  <text x="80" y="508" font-size="13.5" fill="#1e293b" font-weight="700">pol I</text>
  <rect x="170" y="494" width="81.81818181818181" height="26" rx="4" fill="#0369a1" opacity="0.75"/>
  <text x="263.8181818181818" y="512" font-size="11.5" fill="#475569">不敏感</text>
  <text x="80" y="574" font-size="13.5" fill="#1e293b" font-weight="700">pol III</text>
  <rect x="170" y="560" width="196.36363636363635" height="26" rx="4" fill="#d97706" opacity="0.75"/>
  <text x="378.3636363636364" y="578" font-size="11.5" fill="#475569">中度敏感（高浓度抑制）</text>
  <text x="80" y="640" font-size="13.5" fill="#1e293b" font-weight="700">pol II</text>
  <rect x="170" y="626" width="360" height="26" rx="4" fill="#dc2626" opacity="0.75"/>
  <text x="542" y="644" font-size="11.5" fill="#475569">极敏感（1 μg/ml 即抑制）</text>
  <text x="80" y="690" font-size="10" fill="#64748b">敏感性分级示意（非定量刻度）</text>
  <rect x="68.0009" y="654.225" width="223.9982" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="180" y="668.14" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="700">误食毒鹅膏致死：肝细胞 pol II 被抑制</text>
  <rect x="710" y="448" width="660" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="470.84" font-size="19" fill="#475569" font-weight="700">三、pol II 最大亚基（RPB1）的 CTD</text>
  <ellipse cx="860" cy="560" rx="84" ry="46" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="860" y="566" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">pol II 酶体</text>
  <text x="860" y="524" font-size="11" fill="#64748b" text-anchor="middle">RPB1 最大亚基</text>
  <rect x="952" y="552" width="44" height="18" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="974" y="565" font-size="7.5" fill="#4c1d95" text-anchor="middle" font-weight="700">YSPTSPS</text>
  <rect x="1004" y="552" width="44" height="18" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="1026" y="565" font-size="7.5" fill="#78350f" text-anchor="middle" font-weight="700">YSPTSPS</text>
  <rect x="1056" y="552" width="44" height="18" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="1078" y="565" font-size="7.5" fill="#4c1d95" text-anchor="middle" font-weight="700">YSPTSPS</text>
  <rect x="1108" y="552" width="44" height="18" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="1130" y="565" font-size="7.5" fill="#78350f" text-anchor="middle" font-weight="700">YSPTSPS</text>
  <rect x="1160" y="552" width="44" height="18" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="1182" y="565" font-size="7.5" fill="#4c1d95" text-anchor="middle" font-weight="700">YSPTSPS</text>
  <rect x="1212" y="552" width="44" height="18" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="1234" y="565" font-size="7.5" fill="#78350f" text-anchor="middle" font-weight="700">YSPTSPS</text>
  <rect x="1264" y="552" width="44" height="18" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="1286" y="565" font-size="7.5" fill="#4c1d95" text-anchor="middle" font-weight="700">YSPTSPS</text>
  <text x="952" y="596" font-size="12" fill="#1e293b" font-weight="700">七肽重复单元 YSPTSPS：酵母 26 次重复 · 人 52 次重复</text>
  <text x="952" y="616" font-size="10" fill="#64748b" text-anchor="middle">（图中仅示意 7 个重复）</text>
  <rect x="940.0326" y="646.225" width="179.93480000000002" height="19.55" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1030" y="660.14" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">Ser2 / Ser5 磷酸化＝分子开关</text>
  <text x="730" y="694" font-size="11.5" fill="#475569">CTD 磷酸化状态将转录阶段与 RNA 加工（加帽、剪接、加尾）在时空中偶联——详见本章第 5 节。</text>
  <rect x="30" y="748" width="1340" height="222" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="770.84" font-size="19" fill="#475569" font-weight="700">四、其他 RNA 聚合酶与演化视角</text>
  <rect x="60" y="796" width="620" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="76" y="820" font-size="13.5" fill="#1e293b" font-weight="700">植物 pol IV / pol V</text>
  <text x="76" y="840" font-size="11.5" fill="#475569">参与 siRNA 引导的转录水平基因沉默</text>
  <text x="530" y="828" font-size="10.5" fill="#64748b">RdDM 途径</text>
  <rect x="710" y="796" width="620" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="726" y="820" font-size="13.5" fill="#1e293b" font-weight="700">古菌 RNAP</text>
  <text x="726" y="840" font-size="11.5" fill="#475569">与真核 pol II（含 Rpo 亚基）结构高度相似</text>
  <text x="1180" y="828" font-size="10.5" fill="#64748b">支持真核转录机器起源于古菌</text>
  <rect x="60" y="878" width="620" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="76" y="902" font-size="13.5" fill="#1e293b" font-weight="700">线粒体 / 叶绿体</text>
  <text x="76" y="922" font-size="11.5" fill="#475569">噬菌体型 RNA 聚合酶（如哺乳动物 POLRMT）</text>
  <text x="530" y="910" font-size="10.5" fill="#64748b">细胞器自主转录</text>
  <rect x="710" y="878" width="620" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="726" y="902" font-size="13.5" fill="#1e293b" font-weight="700">pol I 调控</text>
  <text x="726" y="922" font-size="11.5" fill="#475569">活性最高 · mTOR 通路调控 rRNA 合成；pol III 受 mTOR 与 Maf1 抑制</text>
  <text x="1180" y="910" font-size="10.5" fill="#64748b">「生长调控的输出阀门」</text>
</svg>