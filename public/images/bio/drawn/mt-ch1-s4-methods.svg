    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">研究方法：从膜片钳到冷冻电镜</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">膜片钳（1976，1991诺奖）以吉欧级高阻封接测皮安级单通道电流；爪蟾卵母细胞表达克隆鉴定SGLT1（1987）与AQP1（1992）；KcsA（1998）与SERCA1a（2000）</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">开启结构时代，cryo-EM（2017诺奖）解锁GLUT/SWEET/Piezo；植物侧另有MIFE、钙成像与SOS突变体筛选</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、膜片钳四构型（Neher–Sakmann，1976）</text>
  <text x="60" y="192" font-size="11" fill="#475569">吉欧级（10<tspan dy="-3.7" font-size="7.9">9</tspan><tspan dy="3.7"> Ω）高阻封接，电极下约 1 μm</tspan><tspan dy="-3.7" font-size="7.9">2</tspan><tspan dy="3.7"> 的膜片被电学隔离</tspan></text>
  <polygon points="115,219 125,219 136,172 104,172" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <line x1="120" y1="172" x2="120" y2="162" stroke="#0369a1" stroke-width="2"/>
  <circle cx="120" cy="158" r="4" fill="#0369a1"/>
  <circle cx="120" cy="265" r="46" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="219" r="4" fill="#6d28d9"/>
  <polygon points="280,243 290,243 301,172 269,172" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <line x1="285" y1="172" x2="285" y2="162" stroke="#0369a1" stroke-width="2"/>
  <circle cx="285" cy="158" r="4" fill="#0369a1"/>
  <circle cx="285" cy="265" r="46" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <ellipse cx="285" cy="243" rx="10" ry="7" fill="none" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="252" y1="286" x2="243" y2="298" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <line x1="318" y1="286" x2="327" y2="298" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-mute)"/>
  <polygon points="445,240 455,240 466,172 434,172" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <line x1="450" y1="172" x2="450" y2="162" stroke="#0369a1" stroke-width="2"/>
  <circle cx="450" cy="158" r="4" fill="#0369a1"/>
  <circle cx="441" cy="240" r="4" fill="#0f766e"/>
  <circle cx="459" cy="240" r="4" fill="#0f766e"/>
  <line x1="441" y1="244" x2="459" y2="244" stroke="#0f766e" stroke-width="3"/>
  <text x="425" y="292" font-size="9.5" fill="#64748b">胞内侧朝灌流液</text>
  <polygon points="610,240 620,240 631,172 599,172" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <line x1="615" y1="172" x2="615" y2="162" stroke="#0369a1" stroke-width="2"/>
  <circle cx="615" cy="158" r="4" fill="#0369a1"/>
  <circle cx="606" cy="240" r="4" fill="#0f766e"/>
  <circle cx="624" cy="240" r="4" fill="#0f766e"/>
  <line x1="606" y1="244" x2="624" y2="244" stroke="#0f766e" stroke-width="3"/>
  <circle cx="615" cy="228" r="3" fill="#059669"/>
  <text x="588" y="292" font-size="9.5" fill="#64748b">胞外侧朝灌流液</text>
  <text x="120" y="336" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">① 细胞吸附</text>
  <text x="120" y="358" font-size="9.5" fill="#64748b" text-anchor="middle">保留胞内环境</text>
  <text x="120" y="376" font-size="9.5" fill="#64748b" text-anchor="middle">单通道记录的主力构型</text>
  <text x="285" y="336" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">② 全细胞</text>
  <text x="285" y="358" font-size="9.5" fill="#64748b" text-anchor="middle">打穿孔，测宏电流</text>
  <text x="285" y="376" font-size="9.5" fill="#64748b" text-anchor="middle">胞液与电极液互通</text>
  <text x="450" y="336" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">③ 内面向外</text>
  <text x="450" y="358" font-size="9.5" fill="#64748b" text-anchor="middle">胞内侧暴露于灌流液</text>
  <text x="450" y="376" font-size="9.5" fill="#64748b" text-anchor="middle">胞内配体门控一测便知</text>
  <text x="615" y="336" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">④ 外面向外</text>
  <text x="615" y="358" font-size="9.5" fill="#64748b" text-anchor="middle">胞外侧暴露于浴液</text>
  <text x="615" y="376" font-size="9.5" fill="#64748b" text-anchor="middle">测胞外侧药物 / 毒素</text>
  <text x="60" y="412" font-size="11" fill="#475569">皮安级（10<tspan dy="-3.7" font-size="7.9">-12</tspan><tspan dy="3.7"> A）电流 ÷ 驱动电压 = 单通道电导（以 pS 计）</tspan></text>
  <text x="60" y="440" font-size="10.5" fill="#475569">门控由哪一侧、由什么化学物质控制，从此成为可拆解的实验问题</text>
  <text x="60" y="464" font-size="10.5" fill="#475569">超低噪声放大器分辨皮安级单通道电流</text>
  <text x="60" y="488" font-size="10.5" fill="#475569">Neher 与 Sakmann 获 1991 年诺贝尔生理学或医学奖</text>
  <path d="M450.0,425.0 L470.0,425.0 L470.0,457.4 L502.0,457.4 L502.0,425.0 L526.0,425.0 L526.0,466.4 L574.0,466.4 L574.0,425.0 L610.0,425.0 L610.0,454.3 L634.0,454.3 L634.0,425.0 L650.0,425.0" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="450" y="496" font-size="10" fill="#64748b">单通道电流记录：方波样开合（pA 级）</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、爪蟾卵母细胞：让表型替基因说话</text>
  <circle cx="880" cy="295" r="88" fill="#f8fafc" stroke="#475569" stroke-width="2.6"/>
  <circle cx="912" cy="268" r="15" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <rect x="958" y="262" width="9" height="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <ellipse cx="952" cy="300" rx="8" ry="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <line x1="778" y1="198" x2="835" y2="242" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <text x="738" y="188" font-size="10.5" fill="#831843" font-weight="700">注射 mRNA / cRNA</text>
  <text x="880" y="408" font-size="10.5" fill="#475569" text-anchor="middle">直径约 1 mm · 内源性通道背景低</text>
  <text x="880" y="430" font-size="10" fill="#64748b" text-anchor="middle">cRNA 忠实翻译，蛋白送上质膜</text>
  <rect x="1050" y="190" width="310" height="108" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1066" y="216" font-size="12.5" fill="#075985" font-weight="700">1987 · SGLT1（Hediger）</text>
  <text x="1066" y="240" font-size="10.5" fill="#475569">注射兔小肠 mRNA，</text>
  <text x="1066" y="258" font-size="10.5" fill="#475569">以同位素标记葡萄糖类似物的摄取为读出</text>
  <text x="1066" y="282" font-size="10.5" fill="#475569" font-weight="600">首个拿到初级序列的继发性主动转运体</text>
  <rect x="1050" y="312" width="310" height="108" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1066" y="338" font-size="12.5" fill="#134e4a" font-weight="700">1992 · AQP1（Agre，CHIP28）</text>
  <text x="1066" y="362" font-size="10.5" fill="#475569">cRNA 注入卵母细胞，低渗液中细胞迅速胀破</text>
  <text x="1066" y="386" font-size="10.5" fill="#134e4a" font-weight="600">水通道一锤定音——2003 年诺贝尔化学奖</text>
  <rect x="730" y="442" width="305" height="96" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="746" y="468" font-size="12" fill="#475569" font-weight="700">Ussing 灌流室（1951）</text>
  <text x="746" y="492" font-size="10.5" fill="#475569">上皮夹在两室，电压钳钳制跨上皮电位为零</text>
  <text x="746" y="516" font-size="10.5" fill="#475569">测得电流 = 净主动离子流（蛙皮 Na<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 吸收）</tspan></text>
  <rect x="1055" y="442" width="305" height="96" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1071" y="468" font-size="12" fill="#475569" font-weight="700">蛋白脂质体 + 同位素示踪</text>
  <text x="1071" y="492" font-size="10.5" fill="#475569">纯化蛋白重组进人工脂质体，梯度人为设定</text>
  <text x="1071" y="514" font-size="10.5" fill="#475569"><tspan dy="-3.6" font-size="7.6">36</tspan><tspan dy="3.6">Cl</tspan><tspan dy="-3.6" font-size="7.6">-</tspan><tspan dy="3.6"> 测氯转运 · </tspan><tspan dy="-3.6" font-size="7.6">86</tspan><tspan dy="3.6">Rb</tspan><tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 代钾测摄取</tspan></text>
  <text x="1071" y="534" font-size="10" fill="#64748b">泵的化学计量与耦联比多由此测定</text>
  <rect x="30" y="567" width="660" height="418" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="589.84" font-size="19" fill="#475569" font-weight="700">三、结构解析接力：从 KcsA 到冷冻电镜</text>
  <text x="60" y="612" font-size="11" fill="#475569">膜蛋白结晶曾被视为不可能任务——两亲性分子既亲水又疏水，晶体学长期束手无策</text>
  <line x1="60" y1="705" x2="660" y2="705" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="114" cy="705" r="6.5" fill="#dc2626"/>
  <line x1="114" y1="696" x2="114" y2="675" stroke="#dc2626" stroke-width="1.7"/>
  <text x="114" y="655" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1998 · KcsA</text>
  <text x="114" y="635" font-size="12" fill="#64748b" text-anchor="middle">3.2 Å，选择性滤器</text>
  <circle cx="192" cy="705" r="6.5" fill="#d97706"/>
  <line x1="192" y1="714" x2="192" y2="735" stroke="#d97706" stroke-width="1.7"/>
  <text x="192" y="755" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2000 · SERCA1a</text>
  <text x="192" y="775" font-size="12" fill="#64748b" text-anchor="middle">P 型泵原子坐标</text>
  <circle cx="288" cy="705" r="6.5" fill="#0f766e"/>
  <line x1="288" y1="696" x2="288" y2="675" stroke="#0f766e" stroke-width="1.7"/>
  <text x="288" y="655" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2003 · 诺奖</text>
  <text x="288" y="635" font-size="12" fill="#64748b" text-anchor="middle">MacKinnon / Agre</text>
  <circle cx="492" cy="705" r="6.5" fill="#0369a1"/>
  <line x1="492" y1="714" x2="492" y2="735" stroke="#0369a1" stroke-width="1.7"/>
  <text x="492" y="755" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2013 · 直接电子探测</text>
  <text x="492" y="775" font-size="12" fill="#64748b" text-anchor="middle">相机引爆分辨率革命</text>
  <circle cx="612" cy="705" r="6.5" fill="#059669"/>
  <line x1="612" y1="696" x2="612" y2="675" stroke="#059669" stroke-width="1.7"/>
  <text x="612" y="655" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2017 · cryo-EM 诺奖</text>
  <text x="612" y="635" font-size="12" fill="#64748b" text-anchor="middle">GLUT / SWEET / Piezo</text>
  <text x="60" y="815" font-size="10.5" fill="#475569">KcsA：TVGYG 主链羰基排成四个 K<tspan dy="-3.6" font-size="7.6">+</tspan><tspan dy="3.6"> 位点的氧笼——几何与能量双双讲清「为什么是钾」</tspan></text>
  <text x="60" y="848" font-size="10.5" fill="#475569">SERCA1a：P 型 ATPase 的 E1/E2 构象循环第一次有了原子坐标（Toyoshima，2000）</text>
  <text x="60" y="876" font-size="10.5" fill="#475569">X 射线相继攻克 aquaporin、LeuT、β 肾上腺素受体；cryo-EM 革命不再需要结晶——GLUT1/3、SWEET、</text>
  <text x="60" y="894" font-size="10.5" fill="#475569">Piezo 等大而软的分子接连成像</text>
  <text x="60" y="924" font-size="11" fill="#475569" font-weight="600">电生理与结构生物学从此能在同一个分子上会师</text>
  <text x="60" y="954" font-size="10" fill="#64748b">方法分工：膜片钳问多快、卵母细胞与酵母问是什么、Ussing 问净多少、结构问长什么样、脂质体问搬几个、</text>
  <text x="60" y="972" font-size="10" fill="#64748b">MIFE 与突变体问在活植物里干什么</text>
  <rect x="710" y="567" width="660" height="418" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="589.84" font-size="19" fill="#475569" font-weight="700">四、植物特有手段：在活植物里提问</text>
  <rect x="730" y="596" width="305" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="746" y="624" font-size="12.5" fill="#075985" font-weight="700">MIFE 离子流测定</text>
  <polygon points="788,650 812,650 801,760" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <line x1="784" y1="690" x2="776" y2="687" stroke="#0f766e" stroke-width="1" opacity="0.6"/>
  <line x1="784" y1="706" x2="775" y2="704" stroke="#0f766e" stroke-width="1" opacity="0.6"/>
  <line x1="784" y1="722" x2="776" y2="721" stroke="#0f766e" stroke-width="1" opacity="0.6"/>
  <line x1="822" y1="648" x2="818" y2="670" stroke="#0369a1" stroke-width="1.8"/>
  <line x1="844" y1="648" x2="846" y2="670" stroke="#0369a1" stroke-width="1.8"/>
  <line x1="820" y1="664" x2="844" y2="664" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arr-acc)" marker-start="url(#arr-acc)"/>
  <text x="850" y="656" font-size="10" fill="#475569">离子选择微电极贴根表两点间振动</text>
  <text x="850" y="678" font-size="10" fill="#475569">由浓度差反推净离子流</text>
  <text x="850" y="700" font-size="10" fill="#475569">K<tspan dy="-3.4" font-size="7.2">+</tspan><tspan dy="3.4"> · H</tspan><tspan dy="-3.4" font-size="7.2">+</tspan><tspan dy="3.4"> · Ca</tspan><tspan dy="-3.4" font-size="7.2">2+</tspan><tspan dy="3.4"> · NH</tspan><tspan dy="2.2" font-size="7.2">4</tspan><tspan dy="-5.6" font-size="7.2">+</tspan></text>
  <text x="850" y="722" font-size="10" fill="#475569">不进细胞即可连续测定</text>
  <text x="850" y="744" font-size="10" fill="#475569">根系吸收动力学标准仪器</text>
  <rect x="1055" y="596" width="305" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1071" y="624" font-size="12.5" fill="#4c1d95" font-weight="700">共聚焦钙成像</text>
  <circle cx="1140" cy="698" r="42" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <circle cx="1140" cy="698" r="20" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.7"/>
  <circle cx="1140" cy="698" r="32" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4"/>
  <circle cx="1128" cy="686" r="3" fill="#dc2626"/>
  <circle cx="1154" cy="690" r="3" fill="#dc2626"/>
  <circle cx="1136" cy="714" r="3" fill="#dc2626"/>
  <circle cx="1152" cy="712" r="3" fill="#dc2626"/>
  <text x="1140" y="702" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Ca<tspan dy="-3.4" font-size="7.2">2+</tspan></text>
  <text x="1200" y="656" font-size="10" fill="#475569">荧光指示剂或转基因钙传感器</text>
  <text x="1200" y="678" font-size="10" fill="#475569">追踪胞质 Ca<tspan dy="-3.4" font-size="7.2">2+</tspan><tspan dy="3.4"> 时空波动</tspan></text>
  <text x="1200" y="700" font-size="10" fill="#475569">GLR / CNGC 介导的信号</text>
  <text x="1200" y="722" font-size="10" fill="#475569">多以钙波现形</text>
