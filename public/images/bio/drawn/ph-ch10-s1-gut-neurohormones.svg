  <rect x="830" y="684" width="112" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="886" y="711.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">十二指肠 I 细胞</text>
  <rect x="942" y="684" width="132" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1008" y="711.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">脂肪·蛋白产物</text>
  <rect x="1074" y="684" width="284" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1216" y="711.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">胰酶分泌·胆囊收缩·饱感</text>
  <rect x="722" y="728" width="108" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
