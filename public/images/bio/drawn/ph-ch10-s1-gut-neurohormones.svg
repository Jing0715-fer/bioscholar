  <line x1="452" y1="223" x2="466" y2="207" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="470" y="212" font-size="12.5" fill="#1e293b" font-weight="700">黏膜层</text>
  <text x="470" y="231" font-size="10.5" fill="#64748b">上皮·固有层·黏膜肌</text>
  <line x1="452" y1="282" x2="466" y2="273" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="470" y="278" font-size="12.5" fill="#1e293b" font-weight="700">黏膜下层</text>
  <text x="470" y="297" font-size="10.5" fill="#64748b">内含 Meissner 神经丛</text>
  <line x1="452" y1="329" x2="466" y2="329" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="470" y="334" font-size="12.5" fill="#1e293b" font-weight="700">环行肌</text>
  <line x1="452" y1="360" x2="466" y2="359" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="470" y="364" font-size="12.5" fill="#1e293b" font-weight="700">肌间神经丛</text>
  <text x="470" y="383" font-size="10.5" fill="#64748b">（Auerbach 丛）</text>
  <line x1="452" y1="389" x2="466" y2="407" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="470" y="412" font-size="12.5" fill="#1e293b" font-weight="700">纵行肌</text>
  <line x1="452" y1="423" x2="466" y2="423" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="470" y="428" font-size="12.5" fill="#1e293b" font-weight="700">外膜 / 浆膜</text>
  <text x="50" y="466" font-size="12" fill="#475569">壁内神经丛分两层：黏膜下丛调节分泌与局部血流，肌间丛驱动蠕动与分节运动——它们由感觉、</text>
  <text x="50" y="485" font-size="12" fill="#475569">中间与运动神经元构成微型反射中枢，即使离断外来神经仍能独立工作。</text>
  <rect x="710" y="132" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、肠神经系统（ENS）：「第二大脑」</text>
  <rect x="827.0196" y="184.8" width="185.9608" height="20.4" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="920" y="199.32" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">腔内刺激（扩张·pH·营养物）</text>
  <line x1="920" y1="209" x2="920" y2="232" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <rect x="840" y="234" width="160" height="34" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="920" y="255" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">感觉神经元</text>
  <line x1="920" y1="270" x2="920" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="840" y="294" width="160" height="34" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="920" y="315" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">中间神经元</text>
  <line x1="920" y1="330" x2="920" y2="352" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="840" y="354" width="160" height="34" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="920" y="375" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">运动神经元</text>
  <line x1="870" y1="390" x2="830" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="970" y1="390" x2="1050" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="740" y="420" width="180" height="44" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="830" y="437" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">平滑肌</text>
  <text x="830" y="456" font-size="10.5" fill="#475569" text-anchor="middle">蠕动·分节运动</text>
  <rect x="960" y="420" width="180" height="44" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="1050" y="437" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">腺上皮 / 血管</text>
  <text x="1050" y="456" font-size="10.5" fill="#475569" text-anchor="middle">分泌·血流调节</text>
  <rect x="1183.70125" y="229.375" width="112.5975" height="21.25" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1240" y="244.5" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">约 1 亿神经元</text>
  <text x="1240" y="272" font-size="11.5" fill="#64748b" text-anchor="middle">≈ 脊髓神经元总量级</text>
  <rect x="1185.375" y="299.375" width="109.25" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1240" y="314.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">「第二大脑」</text>
  <rect x="1174.6975" y="345.225" width="130.60500000000002" height="19.55" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1240" y="359.14" font-size="11.5" fill="#065f46" text-anchor="middle" font-weight="700">切断外来神经仍工作</text>
  <rect x="1150" y="388" width="200" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1250" y="412" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">外来神经</text>
  <text x="1250" y="432" font-size="10.5" fill="#64748b" text-anchor="middle">（交感 / 副交感：调制）</text>
  <line x1="1148" y1="410" x2="1006" y2="374" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-mute)"/>
  <text x="730" y="495" font-size="12" fill="#475569">ENS 与中枢经迷走/交感双向联系（脑-肠轴）；迷走节前纤维大多在壁内换元——「肠脑」自主处理日常反射，</text>
  <text x="730" y="514" font-size="12" fill="#475569">中枢仅作指令级调制。</text>
  <rect x="30" y="546" width="660" height="439" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="568.84" font-size="19" fill="#475569" font-weight="700">三、电慢波起步：ICC（Cajal 间质细胞）起搏</text>
  <text x="50" y="600" font-size="12" fill="#475569">ICC 是胃肠起搏细胞：自发性内向电流产生周期性部分去极化——慢波（基本电节律）。慢波决定收缩节律的上限：</text>
  <text x="50" y="619" font-size="12" fill="#475569">锋电位叠加于慢波波峰时才触发收缩，任何收缩频率都不会超过该段慢波频率。</text>
  <text x="350" y="672" font-size="11" fill="#64748b" text-anchor="middle">幅度 −5 ~ −15 mV（周期性部分去极化）</text>
  <text x="60" y="705" font-size="12.5" fill="#475569" font-weight="700">胃体</text>
  <path d="M150,705 q 32.9,-28 65.8,0 q 32.9,28 65.8,0 q 32.9,-28 65.8,0 q 32.9,28 65.8,0 q 32.9,-28 65.8,0 q 32.9,28 65.8,0" fill="none" stroke="#0369a1" stroke-width="2.6"/>
  <text x="560" y="705" font-size="12" fill="#075985" font-weight="700">3 次/分</text>
  <text x="60" y="765" font-size="12.5" fill="#475569" font-weight="700">十二指肠</text>
  <path d="M150,765 q 12.3,-28 24.7,0 q 12.3,28 24.7,0 q 12.3,-28 24.7,0 q 12.3,28 24.7,0 q 12.3,-28 24.7,0 q 12.3,28 24.7,0 q 12.3,-28 24.7,0 q 12.3,28 24.7,0 q 12.3,-28 24.7,0 q 12.3,28 24.7,0 q 12.3,-28 24.7,0 q 12.3,28 24.7,0 q 12.3,-28 24.7,0 q 12.3,28 24.7,0 q 12.3,-28 24.7,0 q 12.3,28 24.7,0" fill="none" stroke="#0f766e" stroke-width="2.6"/>
  <text x="560" y="765" font-size="12" fill="#134e4a" font-weight="700">12 次/分</text>
  <text x="60" y="825" font-size="12.5" fill="#475569" font-weight="700">结肠</text>
  <path d="M150,825 q 16.5,-28 32.9,0 q 16.5,28 32.9,0 q 16.5,-28 32.9,0 q 16.5,28 32.9,0 q 16.5,-28 32.9,0 q 16.5,28 32.9,0 q 16.5,-28 32.9,0 q 16.5,28 32.9,0 q 16.5,-28 32.9,0 q 16.5,28 32.9,0 q 16.5,-28 32.9,0 q 16.5,28 32.9,0" fill="none" stroke="#b45309" stroke-width="2.6"/>
  <text x="560" y="825" font-size="12" fill="#78350f" font-weight="700">6–8 次/分</text>
  <text x="50" y="870" font-size="12" fill="#475569">各段慢波频率：胃 3、十二指肠 11–12、空肠 9–11、回肠 8–9、结肠 6–8 次/分——沿口向肛向递减，</text>
  <text x="50" y="889" font-size="12" fill="#475569">由各段 ICC 固有特性决定。</text>
  <rect x="237.24925" y="930.225" width="245.50150000000002" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="360" y="944.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">ICC 分布：环行肌-纵行肌之间及黏膜下层</text>
  <rect x="710" y="546" width="660" height="439" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="568.84" font-size="19" fill="#475569" font-weight="700">四、主要胃肠激素：来源—刺激—效应</text>
