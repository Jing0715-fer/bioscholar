  <circle cx="180" cy="360" r="5.5" fill="#d97706" stroke="#92400e" stroke-width="1.2"/>
  <circle cx="250" cy="360" r="5.5" fill="#d97706" stroke="#92400e" stroke-width="1.2"/>
