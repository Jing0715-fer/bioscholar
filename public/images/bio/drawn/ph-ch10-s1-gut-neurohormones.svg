  <rect x="830" y="640" width="112" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="886" y="667.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">胃窦 G 细胞</text>
  <rect x="942" y="640" width="132" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
