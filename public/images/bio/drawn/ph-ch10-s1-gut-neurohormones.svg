  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">消化道总论：壁的四层结构、ENS 与胃肠激素</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">肠神经系统约 1 亿神经元构成「第二大脑」，脱离外来神经仍可完成局部反射；ICC 起搏电慢波——胃 3、十二指肠 12、结肠 6–8 次/分</text>
  <rect x="30" y="132" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、消化道壁的四层结构与壁内神经丛</text>
  <text x="260" y="182" font-size="12" fill="#64748b" text-anchor="middle">← 管腔（肠腔）面</text>
  <rect x="70" y="190" width="380" height="66" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <rect x="70" y="256" width="380" height="52" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <rect x="70" y="308" width="380" height="42" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <rect x="70" y="350" width="380" height="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <rect x="70" y="370" width="380" height="38" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <rect x="70" y="408" width="380" height="30" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <circle cx="130" cy="282" r="5.5" fill="#d97706" stroke="#92400e" stroke-width="1.2"/>
  <circle cx="205" cy="282" r="5.5" fill="#d97706" stroke="#92400e" stroke-width="1.2"/>
  <circle cx="280" cy="282" r="5.5" fill="#d97706" stroke="#92400e" stroke-width="1.2"/>
  <circle cx="355" cy="282" r="5.5" fill="#d97706" stroke="#92400e" stroke-width="1.2"/>
