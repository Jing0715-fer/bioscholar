  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">嗅觉与味觉：组合编码、不经丘脑的直达通路与五味受体</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">约 400 个功能 OR 组合编码万千气味；甜鲜苦走 gustducin–TRPM5 级联，咸酸由离子直接介导</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、嗅受体：最大基因家族与放大级联</text>
  <rect x="236.57729999999998" y="186.225" width="246.84540000000004" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="360" y="200.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">OR 属 GPCR · 每只嗅神经元终身只表达一种</text>
  <text x="60" y="240" font-size="11" fill="#475569">人类基因组 OR 座位逾 800 个、功能基因约 400 个（小鼠约 1000 个，约占其基因总数 3%）——人类最大的基因家族。</text>
  <text x="60" y="256" font-size="11" fill="#475569">Buck 与 Axel 1991 年克隆首个 OR 基因，获 2004 年诺贝尔奖。</text>
  <rect x="80" y="310" width="560" height="32" rx="7" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="100" y="331" font-size="12" fill="#1e293b" font-weight="600">气味分子结合 OR（GPCR）</text>
  <line x1="360" y1="342" x2="360" y2="354" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="354" width="560" height="32" rx="7" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="100" y="375" font-size="12" fill="#1e293b" font-weight="600">偶联 Golf → 腺苷酸环化酶 → cAMP</text>
  <line x1="360" y1="386" x2="360" y2="398" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="398" width="560" height="32" rx="7" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.6"/>
  <text x="100" y="419" font-size="12" fill="#1e293b" font-weight="600">CNG 通道开放 → Ca²⁺ 内流去极化</text>
  <line x1="360" y1="430" x2="360" y2="442" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="442" width="560" height="32" rx="7" fill="#fce7f3" fill-opacity="0.5" stroke="#be185d" stroke-width="1.6"/>
  <text x="100" y="463" font-size="12" fill="#1e293b" font-weight="600">Ca²⁺ 激活 Cl⁻ 通道 → Cl⁻ 外流放大</text>
  <line x1="360" y1="474" x2="360" y2="486" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="486" width="560" height="32" rx="7" fill="#ede9fe" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="100" y="507" font-size="12" fill="#1e293b" font-weight="600">动作电位沿嗅神经轴突入嗅球</text>
  <text x="80" y="538" font-size="10.5" fill="#64748b">Cl⁻ 外流是嗅觉特有的放大设计：嗅神经元内 Cl⁻ 浓度高，通道开放时氯外流而非内流，与去极化同向叠加。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、组合编码：约 400 种受体辨识万千气味</text>
  <text x="920" y="216" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">激活组合谱（颜色深浅 ∝ 亲和力）</text>
  <text x="748" y="260" font-size="11" fill="#475569" font-weight="700">气味 A</text>
  <text x="748" y="312" font-size="11" fill="#475569" font-weight="700">气味 B</text>
  <text x="748" y="364" font-size="11" fill="#475569" font-weight="700">气味 C</text>
  <text x="824" y="240" font-size="10.5" fill="#64748b" text-anchor="middle">OR1</text>
  <text x="890" y="240" font-size="10.5" fill="#64748b" text-anchor="middle">OR2</text>
  <text x="956" y="240" font-size="10.5" fill="#64748b" text-anchor="middle">OR3</text>
  <text x="1022" y="240" font-size="10.5" fill="#64748b" text-anchor="middle">OR4</text>
  <text x="1088" y="240" font-size="10.5" fill="#64748b" text-anchor="middle">OR5</text>
  <rect x="800" y="248" width="48" height="40" rx="4" fill="#0f766e" fill-opacity="0.88" stroke="#0f766e" stroke-width="1.2"/>
  <text x="824" y="272" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">强</text>
