  <text x="824" y="324" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">弱</text>
  <rect x="800" y="352" width="48" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
