<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">运动单位与脊髓反射：大小原则、牵张反射与交叉伸肌对偶</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">募集顺序固定为 S→FR→FF；牵张反射为单突触弧（潜伏期约 20–25 ms）伴交互抑制</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、运动单位三型：力量-速度-耐力梯度</text>
  <rect x="60" y="200" width="100" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="110" y="227.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">单位类型</text>
  <rect x="160" y="200" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="227.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">纤维类型</text>
  <rect x="310" y="200" width="100" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="227.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">收缩速度</text>
  <rect x="410" y="200" width="100" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="460" y="227.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">抗疲劳性</text>
  <rect x="510" y="200" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="585" y="227.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">典型职责</text>
  <rect x="60" y="244" width="100" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="110" y="274.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">S</text>
  <rect x="160" y="244" width="150" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="274.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">I 型慢氧化</text>
  <rect x="310" y="244" width="100" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="274.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">慢</text>
  <rect x="410" y="244" width="100" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="460" y="274.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">极强</text>
  <rect x="510" y="244" width="150" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="585" y="274.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">姿势维持与持续低张力</text>
  <rect x="60" y="294" width="600" height="50" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="294" width="100" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="110" y="324.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">FR</text>
  <rect x="160" y="294" width="150" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="324.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IIa 快氧化酵解</text>
  <rect x="310" y="294" width="100" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="324.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">快</text>
  <rect x="410" y="294" width="100" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="460" y="324.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">较强</text>
  <rect x="510" y="294" width="150" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="585" y="324.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">中等力量的持续动作</text>
  <rect x="60" y="344" width="100" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="110" y="374.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">FF</text>
  <rect x="160" y="344" width="150" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="235" y="374.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">IIb/IIx 快酵解</text>
  <rect x="310" y="344" width="100" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="374.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">快</text>
  <rect x="410" y="344" width="100" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="460" y="374.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">弱</text>
  <rect x="510" y="344" width="150" height="50" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="585" y="374.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">爆发、冲刺与跳跃</text>
  <text x="60" y="440" font-size="11" fill="#475569">一个运动单位 = 一个 α 运动神经元 + 其支配的全部肌纤维；</text>
  <text x="60" y="456" font-size="11" fill="#475569">肌肉由数千单位按梯度混合编成——从「省电耐用」到「峰值爆发」的力量梯队。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、Henneman 大小原则（1965）：小的先上</text>
  <rect x="790" y="210" width="500" height="260" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="790" y1="405" x2="1290" y2="405" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="915" y1="470" x2="915" y2="210" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="790" y1="340" x2="1290" y2="340" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1040" y1="470" x2="1040" y2="210" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="790" y1="275" x2="1290" y2="275" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1165" y1="470" x2="1165" y2="210" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="830" y1="470" x2="830" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="830" y="492" font-size="13" fill="#64748b" text-anchor="middle">轻握茶杯</text>
  <line x1="990" y1="470" x2="990" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="990" y="492" font-size="13" fill="#64748b" text-anchor="middle">提购物袋</text>
  <line x1="1165" y1="470" x2="1165" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="1165" y="492" font-size="13" fill="#64748b" text-anchor="middle">搬起杠铃</text>
  <line x1="1290" y1="470" x2="1290" y2="476" stroke="#475569" stroke-width="1.8"/>
  <text x="1290" y="492" font-size="13" fill="#64748b" text-anchor="middle">冲刺</text>
  <line x1="784" y1="457" x2="790" y2="457" stroke="#475569" stroke-width="1.8"/>
  <text x="780" y="461" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="784" y1="379" x2="790" y2="379" stroke="#475569" stroke-width="1.8"/>
  <text x="780" y="383" font-size="13" fill="#64748b" text-anchor="end">低</text>
  <line x1="784" y1="301" x2="790" y2="301" stroke="#475569" stroke-width="1.8"/>
  <text x="780" y="305" font-size="13" fill="#64748b" text-anchor="end">中</text>
  <line x1="784" y1="223" x2="790" y2="223" stroke="#475569" stroke-width="1.8"/>
  <text x="780" y="227" font-size="13" fill="#64748b" text-anchor="end">高</text>
  <text x="1040" y="514" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">力量需求（突触驱动的去极化）</text>
  <text x="744" y="340" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">募集与放电率</text>
  <path d="M790,457 C794.2,456.6 808.3,464.4 815,454.4 C821.7,444.4 809.2,408.9 830,397.2 C850.8,385.5 900.8,388.5 940,384.2 C979.2,379.9 1006.7,375.1 1065,371.2 C1123.3,367.3 1252.5,362.5 1290,360.8" fill="none" stroke="#059669" stroke-width="3"/>
  <path d="M790,457 C813.3,457.0 902.5,476.5 930,457 C957.5,437.5 928.3,363.0 955,340 C981.7,317.0 1034.2,325.3 1090,319.20000000000005 C1145.8,313.1 1256.7,306.2 1290,303.6" fill="none" stroke="#b45309" stroke-width="3"/>
  <path d="M790,457 C840.0,457.0 1033.3,486.0 1090,457 C1146.7,428.0 1096.7,320.5 1130,282.8 C1163.3,245.1 1263.3,239.5 1290,230.79999999999998" fill="none" stroke="#dc2626" stroke-width="3"/>
  <rect x="800" y="491.59" width="11.55" height="8.82" rx="3" fill="#059669" stroke="#cbd5e1" stroke-width="1"/>
  <text x="819.55" y="499.78" font-size="10.5" fill="#475569">S（约 8–12 Hz 起步）</text>
  <rect x="947.5999999999999" y="491.59" width="11.55" height="8.82" rx="3" fill="#b45309" stroke="#cbd5e1" stroke-width="1"/>
  <text x="967.1499999999999" y="499.78" font-size="10.5" fill="#475569">FR</text>
  <rect x="1002.17" y="491.59" width="11.55" height="8.82" rx="3" fill="#dc2626" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1021.7199999999999" y="499.78" font-size="10.5" fill="#475569">FF（高频放电）</text>
  <text x="740" y="530" font-size="10.5" fill="#475569">神经元胞体愈小 → 膜面积愈小 → 输入电阻愈高 → 同等突触电流去极化愈大 → 阈值愈低、愈先募集；</text>
  <text x="740" y="545" font-size="10.5" fill="#475569">放电率在约 8–50 Hz 范围内上调（频率编码）+ 更大单位顺序加入（募集编码）= 力量分级。</text>
  <rect x="30" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、牵张反射：单突触弧 + 交互抑制</text>
  <rect x="60" y="660" width="150" height="30" rx="14" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.8"/>
  <text x="135" y="680" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">肌梭（Ia 传入）</text>
  <line x1="210" y1="675" x2="300" y2="675" stroke="#0f766e" stroke-width="2.6" marker-end="url(#arr-dna)"/>
  <text x="255" y="658" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">牵拉</text>
  <rect x="300" y="648" width="180" height="200" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="390" y="672" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">脊髓</text>
  <circle cx="340" cy="720" r="16" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="340" y="724" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">α</text>
  <text x="340" y="752" font-size="9.5" fill="#64748b" text-anchor="middle">同名肌</text>
  <text x="340" y="765" font-size="9.5" fill="#64748b" text-anchor="middle">（伸肌）</text>
  <line x1="300" y1="690" x2="326" y2="708" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <text x="278" y="700" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">单突触</text>
  <circle cx="430" cy="760" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="430" y="764" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">I</text>
  <line x1="348" y1="736" x2="419" y2="754" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-rna)"/>
  <text x="400" y="728" font-size="9.5" fill="#78350f" text-anchor="middle">Ia 侧支</text>
  <circle cx="430" cy="820" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="824" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">α</text>
  <text x="466" y="824" font-size="9.5" fill="#64748b" text-anchor="middle">拮抗肌（屈肌）</text>
  <line x1="430" y1="793" x2="430" y2="806" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-rna)"/>
  <text x="495" y="800" font-size="9.5" fill="#78350f" text-anchor="middle" font-weight="700">抑制</text>
  <line x1="324" y1="720" x2="230" y2="700" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <text x="60" y="704" font-size="10.5" fill="#065f46" font-weight="700">兴奋 → 肌收缩（膝跳）</text>
  <text x="60" y="886" font-size="10.5" fill="#475569">牵张反射潜伏期约 20–25 ms（单突触最快通路）；</text>
  <text x="60" y="901" font-size="10.5" fill="#475569">梭外肌主动缩短时 α-γ 共激活令肌梭全程保持敏感——「预计性调节」的现代观点由此而来。</text>
  <rect x="710" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="600.84" font-size="19" fill="#475569" font-weight="700">四、屈肌反射 + 交叉伸肌反射：一侧回撤、对侧支撑</text>
  <rect x="760" y="660" width="220" height="60" rx="9" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.8"/>
  <text x="870" y="682" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">刺激侧（踩到钉子）</text>
  <text x="870" y="702" font-size="10" fill="#64748b" text-anchor="middle">伤害感受器 → 多突触回路</text>
  <rect x="760" y="760" width="220" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="870" y="782" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">同侧：屈肌收缩</text>
  <text x="870" y="800" font-size="10" fill="#64748b" text-anchor="middle">（回撤，伸肌同时舒张）</text>
  <rect x="1030" y="660" width="240" height="60" rx="9" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.8"/>
  <text x="1150" y="682" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">对侧（支撑体重）</text>
  <text x="1150" y="702" font-size="10" fill="#64748b" text-anchor="middle">经连合纤维交叉</text>
  <rect x="1030" y="760" width="240" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1150" y="782" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">对侧：伸肌收缩</text>
  <text x="1150" y="800" font-size="10" fill="#64748b" text-anchor="middle">（支撑身体不倒）</text>
  <line x1="870" y1="720" x2="870" y2="760" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <line x1="980" y1="690" x2="1030" y2="690" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <text x="1005" y="672" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">交叉</text>
  <text x="740" y="856" font-size="10.5" fill="#475569">多突触回路（经若干中间神经元与连合纤维）构成「一侧回撤、对侧支撑」的保护-支持对偶——回撤优先于定位，</text>
  <text x="740" y="871" font-size="10.5" fill="#475569">故屈肌反射的潜伏期远长于牵张反射。</text>
</svg>