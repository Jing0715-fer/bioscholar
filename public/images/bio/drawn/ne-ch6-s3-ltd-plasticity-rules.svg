    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">长时程抑制与可塑性规则：双向开关、±20 ms 因果窗与稳态刹车</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">同一 NMDA 受体以钙信号波形定方向；STDP 把因果律写进毫秒级时序；稳态可塑性防 Hebb 正反馈发散</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、小脑平行纤维 LTD：运动学习的计算基底（Ito 1982）</text>
  <ellipse cx="180" cy="330" rx="34" ry="30" fill="#ede9fe" fill-opacity="0.6" stroke="#6d28d9" stroke-width="2"/>
  <text x="180" y="335" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">Purkinje</text>
  <path d="M180,300 C170,250 150,230 130,205" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <path d="M180,300 C192,250 212,228 234,204" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <path d="M180,300 L180,240" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <line x1="100" y1="236" x2="420" y2="236" stroke="#0f766e" stroke-width="2.4"/>
  <text x="330" y="222" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">平行纤维 PF（颗粒细胞）</text>
  <circle cx="180" cy="236" r="5" fill="#0f766e"/>
  <text x="180" y="258" font-size="10" fill="#64748b" text-anchor="middle">PF–Purkinje 突触</text>
  <path d="M470,430 C450,380 420,360 320,352 C260,348 220,345 205,345" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <text x="490" y="418" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">爬行纤维 CF</text>
  <text x="490" y="434" font-size="10" fill="#64748b" text-anchor="middle">（下橄榄核 · 误差信号）</text>
  <rect x="100" y="442" width="560" height="88" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="118" y="468" font-size="12.5" fill="#1e293b" font-weight="700">经典协议：PF 与 CF 按约 1 Hz 联合刺激数分钟</text>
  <text x="118" y="490" font-size="11" fill="#475569">PF 宜先于 CF 数十毫秒 → 平行纤维-Purkinje 突触的 AMPA 反应长时程下降——爬行纤维带来的误差信号「教会」Purkinje 细胞下调此前活跃的输入。</text>
  <rect x="440" y="190" width="236" height="118" rx="9" fill="#fce7f3" fill-opacity="0.4" stroke="#be185d" stroke-width="1.6"/>
  <text x="456" y="214" font-size="12.5" fill="#831843" font-weight="700">mGluR1–IP3–Ca²⁺ 汇合–PKC</text>
  <text x="456" y="236" font-size="10.5" fill="#475569">mGluR1 → IP3 → 内质网释钙 → 与 PF 去极化钙汇合 → PKC 激活 → AMPA 受体内吞 → 突触电流长时程下降。</text>
  <line x1="360" y1="244" x2="440" y2="248" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、同一 NMDA 受体，双向开关：钙信号波形定方向</text>
  <rect x="957.694" y="188.95" width="164.61200000000002" height="22.099999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1040" y="204.68" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">NMDA 受体（同一分子）</text>
  <line x1="960" y1="226" x2="860" y2="276" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <line x1="1120" y1="226" x2="1220" y2="276" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <rect x="740" y="282" width="260" height="60" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.8"/>
  <text x="870" y="304" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">钙信号大而快</text>
  <text x="870" y="324" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">→ CaMKII 激酶路线</text>
  <rect x="1080" y="282" width="260" height="60" rx="8" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1210" y="304" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">钙信号小而慢</text>
  <text x="1210" y="324" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">→ 钙神经素–PP1 磷酸酶路线</text>
  <line x1="870" y1="342" x2="870" y2="366" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <line x1="1210" y1="342" x2="1210" y2="366" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="819.25835" y="384.525" width="101.4833" height="22.95" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="870" y="400.86" font-size="13.5" fill="#065f46" text-anchor="middle" font-weight="700">LTP（增强）</text>
  <rect x="1159.25835" y="384.525" width="101.4833" height="22.95" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1210" y="400.86" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="700">LTD（抑制）</text>
  <text x="740" y="448" font-size="11" fill="#475569">Dudek 与 Bear 1992：以 1 Hz、约 900 个脉冲（约 15 分钟）刺激 Schaffer 侧枝，</text>
  <text x="740" y="464" font-size="11" fill="#475569">稳定诱出 CA1 突触反应的长时程下降——高频强直则走 LTP。</text>
  <text x="740" y="508" font-size="11" fill="#64748b">BCM 理论（1982）：修饰量是突触后活动的函数，低于滑动阈值 θm 诱发抑制、高于阈值诱发增强；</text>
  <text x="740" y="524" font-size="11" fill="#64748b">阈值随平均活动滑动，防止单向发散。</text>
  <rect x="30" y="578" width="690" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、峰时依赖可塑性：±20 ms 时间窗里的因果律</text>
  <rect x="120" y="620" width="520" height="260" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="120" y1="815" x2="640" y2="815" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="250" y1="880" x2="250" y2="620" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="120" y1="750" x2="640" y2="750" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="380" y1="880" x2="380" y2="620" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="120" y1="685" x2="640" y2="685" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="510" y1="880" x2="510" y2="620" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="120" y1="880" x2="120" y2="886" stroke="#475569" stroke-width="1.8"/>
  <text x="120" y="902" font-size="13" fill="#64748b" text-anchor="middle">−40</text>
  <line x1="185" y1="880" x2="185" y2="886" stroke="#475569" stroke-width="1.8"/>
  <text x="185" y="902" font-size="13" fill="#64748b" text-anchor="middle">−30</text>
  <line x1="250" y1="880" x2="250" y2="886" stroke="#475569" stroke-width="1.8"/>
  <text x="250" y="902" font-size="13" fill="#64748b" text-anchor="middle">−20</text>
  <line x1="315" y1="880" x2="315" y2="886" stroke="#475569" stroke-width="1.8"/>
  <text x="315" y="902" font-size="13" fill="#64748b" text-anchor="middle">−10</text>
  <line x1="380" y1="880" x2="380" y2="886" stroke="#475569" stroke-width="1.8"/>
  <text x="380" y="902" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="445" y1="880" x2="445" y2="886" stroke="#475569" stroke-width="1.8"/>
  <text x="445" y="902" font-size="13" fill="#64748b" text-anchor="middle">+10</text>
  <line x1="510" y1="880" x2="510" y2="886" stroke="#475569" stroke-width="1.8"/>
  <text x="510" y="902" font-size="13" fill="#64748b" text-anchor="middle">+20</text>
  <line x1="575" y1="880" x2="575" y2="886" stroke="#475569" stroke-width="1.8"/>
  <text x="575" y="902" font-size="13" fill="#64748b" text-anchor="middle">+30</text>
  <line x1="640" y1="880" x2="640" y2="886" stroke="#475569" stroke-width="1.8"/>
  <text x="640" y="902" font-size="13" fill="#64748b" text-anchor="middle">+40</text>
  <line x1="114" y1="854" x2="120" y2="854" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="858" font-size="13" fill="#64748b" text-anchor="end">−100%</text>
  <line x1="114" y1="802" x2="120" y2="802" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="806" font-size="13" fill="#64748b" text-anchor="end">−50%</text>
  <line x1="114" y1="750" x2="120" y2="750" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="754" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="114" y1="698" x2="120" y2="698" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="702" font-size="13" fill="#64748b" text-anchor="end">+50%</text>
  <line x1="114" y1="646" x2="120" y2="646" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="650" font-size="13" fill="#64748b" text-anchor="end">+100%</text>
  <text x="380" y="924" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">Δt = t_post − t_pre（ms）</text>
  <text x="74" y="733" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">突触权重变化</text>
  <text x="74" y="753" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">ΔW</text>
  <line x1="120" y1="750" x2="640" y2="750" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.8"/>
  <path d="M380,646 C385.4,649.8 401.7,662.1 412.5,668.88 C423.3,675.6 434.2,681.2 445,686.56 C455.8,691.9 466.7,696.7 477.5,700.86 C488.3,705.0 499.2,708.4 510,711.52 C520.8,714.6 531.7,717.0 542.5,719.58 C553.3,722.1 564.2,724.7 575,726.86 C585.8,729.0 596.7,730.8 607.5,732.32 C618.3,733.8 634.6,735.4 640,735.96" fill="none" stroke="#059669" stroke-width="3"/>
  <path d="M120,774.96 C125.4,775.3 141.7,776.1 152.5,776.78 C163.3,777.5 174.2,778.5 185,779.12 C195.8,779.7 206.7,780.0 217.5,780.42 C228.3,780.9 239.2,780.5 250,781.72 C260.8,782.9 271.7,786.2 282.5,787.7 C293.3,789.2 304.2,789.2 315,790.56 C325.8,791.9 337.8,794.4 347.5,796.02 C357.3,797.7 368.1,799.4 373.5,800.44 C378.9,801.4 378.9,801.7 380,802" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="448" y="612" font-size="12" fill="#065f46" font-weight="700">pre 先于 post：先因后果 → 增强</text>
  <text x="140" y="612" font-size="12" fill="#dc2626" font-weight="700">次序颠倒 → 抑制</text>
  <text x="640" y="940" font-size="11" fill="#64748b" text-anchor="middle">Bi 与 Poo 1998 于海马培养神经元系统测量；窗口以 ±20 ms 为典型量级</text>
  <rect x="740" y="578" width="630" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="600.84" font-size="19" fill="#475569" font-weight="700">四、突触标签与稳态可塑性：不许失控</text>
  <text x="760" y="646" font-size="13.5" fill="#1e293b" font-weight="700">突触标签假说：局部标签 + 全局货物</text>
  <text x="760" y="668" font-size="11" fill="#475569">弱刺激只在突触上留下可逆的「局部标签」；强刺激驱动 PKA 入核、CREB 转录，产出「全局货物」随扩散送达。</text>
  <text x="760" y="684" font-size="11" fill="#475569">在时间窗内标签捕捉到货物，弱输入即可搭便车转为长时增强——突触特异性与核基因表达由此调和。</text>
  <rect x="760" y="742" width="180" height="44" rx="8" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.6"/>
  <text x="850" y="762" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="700">弱输入：设标签</text>
  <text x="850" y="778" font-size="10" fill="#64748b" text-anchor="middle">（仅磷酸化 · 可逆）</text>
  <rect x="980" y="742" width="180" height="44" rx="8" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1070" y="762" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">强输入：产货物</text>
  <text x="1070" y="778" font-size="10" fill="#64748b" text-anchor="middle">（PKA·CREB·新蛋白）</text>
  <line x1="940" y1="764" x2="980" y2="764" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="960" y="748" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">搭便车</text>
  <text x="760" y="826" font-size="13.5" fill="#1e293b" font-weight="700">稳态可塑性：把活动拉回设定点</text>
  <text x="760" y="848" font-size="11" fill="#475569">Hebb 正反馈若无刹车将发散失控。多级闸门：① 突触缩放——Turrigiano 等 1998 年用河豚毒素阻断活动一至两天后，</text>
  <text x="760" y="864" font-size="11" fill="#475569">培养神经元整体上调突触强度以补偿；② 内在兴奋性调节（离子通道表达的慢调整）；</text>
  <text x="760" y="880" font-size="11" fill="#475569">③ 睡眠去权——整体减弱 synaptic 权重，为次日学习腾出容量。</text>
</svg>