  <rect x="30" y="574" width="1340" height="406" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="596.84" font-size="19" fill="#475569" font-weight="700">三、四类典型产物的代谢逻辑；代谢工程与固定化细胞</text>
  <rect x="50" y="592" width="420" height="92" rx="9" fill="#fef3c7" fill-opacity="0.45" stroke="#b45309" stroke-width="1.5"/>
  <rect x="115.25" y="605.375" width="69.5" height="21.25" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="150" y="620.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">燃料乙醇</text>
  <text x="66" y="644" font-size="10.5" fill="#475569">同步糖化发酵（SSF）；成熟醪液乙醇浓度可达约 10%（v/v）</text>
  <rect x="495" y="592" width="420" height="92" rx="9" fill="#d1fae5" fill-opacity="0.45" stroke="#059669" stroke-width="1.5"/>
  <rect x="566.6875" y="605.375" width="56.625" height="21.25" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="595" y="620.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">柠檬酸</text>
  <text x="511" y="644" font-size="10.5" fill="#475569">限锰 + pH 控 2–3 抑制下游酶；对糖转化率达理论值的 80%–90%</text>
  <rect x="940" y="592" width="420" height="92" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="1011.6875" y="605.375" width="56.625" height="21.25" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1040" y="620.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">谷氨酸</text>
  <text x="956" y="644" font-size="10.5" fill="#475569">生物素亚适量→膜渗漏；糖酸转化率可达 50% 以上</text>
  <rect x="50" y="702" width="420" height="92" rx="9" fill="#fce7f3" fill-opacity="0.45" stroke="#be185d" stroke-width="1.5"/>
  <rect x="121.6875" y="715.375" width="56.625" height="21.25" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="150" y="730.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">赖氨酸</text>
  <text x="66" y="754" font-size="10.5" fill="#475569">抗反馈育种解除终产物抑制</text>
  <rect x="495" y="702" width="420" height="92" rx="9" fill="#ede9fe" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="547.375" y="715.375" width="95.25" height="21.25" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="595" y="730.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">基因工程药物</text>
  <text x="511" y="754" font-size="10.5" fill="#475569">1982 年人胰岛素：A/B 链在大肠杆菌高表达；须面对包涵体的溶解与复性</text>
  <rect x="940" y="702" width="420" height="92" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="998.8125" y="715.375" width="82.375" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1040" y="730.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">固定化细胞</text>
  <text x="956" y="754" font-size="10.5" fill="#475569">1973 年固定化大肠杆菌连续产 L-天冬氨酸，</text>
  <text x="956" y="769" font-size="10.5" fill="#475569">反应柱连续运转数月——「细胞即催化剂」</text>
  <rect x="50" y="830" width="1310" height="60" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="70" y="854" font-size="12.5" fill="#1e293b" font-weight="700">代谢工程</text>
  <text x="148" y="854" font-size="11" fill="#475569">代谢通量分析与系统代谢工程把菌株改良从经验育种推向理性设计——测序与组学数据驱动的第二轮育种革命。</text>
  <text x="50" y="924" font-size="11.5" fill="#1e293b" font-weight="700">发酵工程 = 菌种（遗传）+ 培养基（营养）+ 工艺</text>
  <text x="50" y="941.25" font-size="11.5" fill="#1e293b" font-weight="700">（传递与控制）三者耦合的系统工程。</text>
</svg>