  <text x="955" y="217.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">初级代谢</text>
  <rect x="1080" y="190" width="270" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
