  <rect x="830" y="394" width="250" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="955" y="419.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">营养充足即进行</text>
  <rect x="1080" y="394" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1215" y="419.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">常因营养受限而启动</text>
  <rect x="30" y="475" width="1340" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="497.84" font-size="19" fill="#475569" font-weight="700">二、次级代谢产物的六大类</text>
  <rect x="50" y="510" width="430" height="76" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="97.1425" y="536.525" width="61.715" height="22.95" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="128" y="552.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">抗生素</text>
  <text x="200" y="530" font-size="11" fill="#475569">青霉素、链霉素——抑制或杀灭其他微生物</text>
  <rect x="495" y="510" width="430" height="76" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="549.095" y="536.525" width="47.81" height="22.95" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="573" y="552.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">毒素</text>
  <text x="645" y="530" font-size="11" fill="#475569">肉毒毒素等——对宿主或他菌有毒害作用</text>
  <rect x="940" y="510" width="430" height="76" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
  <rect x="994.095" y="536.525" width="47.81" height="22.95" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1018" y="552.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">色素</text>
  <text x="1090" y="530" font-size="11" fill="#475569">灵菌红素等——菌落呈色、工业染色</text>
  <rect x="50" y="600" width="430" height="76" rx="9" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <rect x="97.1425" y="626.525" width="61.715" height="22.95" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="128" y="642.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">生物碱</text>
  <text x="200" y="620" font-size="11" fill="#475569">麦角碱等——含氮碱性有机活性物</text>
  <rect x="495" y="600" width="430" height="76" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
  <rect x="528.2375" y="626.525" width="89.525" height="22.95" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="573" y="642.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">植物生长素</text>
  <text x="645" y="620" font-size="11" fill="#475569">赤霉素等——促进或调节植物生长发育</text>
  <rect x="940" y="600" width="430" height="76" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <rect x="987.1425" y="626.525" width="61.715" height="22.95" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1018" y="642.86" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">信息素</text>
  <text x="1090" y="620" font-size="11" fill="#475569">群体感应信号分子——调控种群行为</text>
  <rect x="30" y="702" width="1340" height="278" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="724.84" font-size="19" fill="#475569" font-weight="700">三、青霉素与链霉素的科学史；次级代谢的调节与工业产量提升</text>
  <text x="380" y="834" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">从偶然发现到系统筛选</text>
  <line x1="70" y1="868" x2="690" y2="868" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="101" cy="868" r="6.5" fill="#0f766e"/>
  <line x1="101" y1="859" x2="101" y2="838" stroke="#0f766e" stroke-width="1.7"/>
  <text x="101" y="818" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1928</text>
  <text x="101" y="798" font-size="12" fill="#64748b" text-anchor="middle">弗莱明发现抑菌环</text>
  <circle cx="256" cy="868" r="6.5" fill="#0369a1"/>
  <line x1="256" y1="877" x2="256" y2="898" stroke="#0369a1" stroke-width="1.7"/>
  <text x="256" y="918" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1940</text>
  <text x="256" y="938" font-size="12" fill="#64748b" text-anchor="middle">弗洛里与钱恩提纯验证</text>
  <circle cx="392.40000000000003" cy="868" r="6.5" fill="#b45309"/>
  <line x1="392.40000000000003" y1="859" x2="392.40000000000003" y2="838" stroke="#b45309" stroke-width="1.7"/>
  <text x="392.40000000000003" y="818" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1943</text>
  <text x="392.40000000000003" y="798" font-size="12" fill="#64748b" text-anchor="middle">沙茨分离链霉素</text>
  <circle cx="528.8" cy="868" r="6.5" fill="#059669"/>
  <line x1="528.8" y1="877" x2="528.8" y2="898" stroke="#059669" stroke-width="1.7"/>
  <text x="528.8" y="918" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1945</text>
  <text x="528.8" y="938" font-size="12" fill="#64748b" text-anchor="middle">三人共获诺奖</text>
  <circle cx="665.1999999999999" cy="868" r="6.5" fill="#6d28d9"/>
  <line x1="665.1999999999999" y1="859" x2="665.1999999999999" y2="838" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="665.1999999999999" y="818" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1952</text>
  <text x="665.1999999999999" y="798" font-size="12" fill="#64748b" text-anchor="middle">瓦克斯曼诺奖</text>
  <text x="70" y="946" font-size="10.5" fill="#475569">1943 年沙茨从灰色链霉菌培养物中分离到链霉素——第一个抗革兰氏阴性菌与结核分枝杆菌的抗生素，使结核不再是不治之症；</text>
  <text x="70" y="961" font-size="10.5" fill="#475569">二战期间深层通气发酵把青霉素放大投产。</text>
  <rect x="730" y="745" width="620" height="108" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="750" y="772" font-size="13" fill="#1e293b" font-weight="700">次级代谢合成的多重调节</text>
  <text x="750" y="796" font-size="11" fill="#475569">① 终产物反馈抑制　② 碳氮代谢调节（碳代谢物阻遏：速效碳源抑制次级合成）　③ 磷酸盐调节</text>
  <text x="750" y="812" font-size="11" fill="#475569">（高磷抑制多种抗生素合成）</text>
  <rect x="730" y="868" width="620" height="96" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.4"/>
  <text x="750" y="894" font-size="13" fill="#075985" font-weight="700">工业产量提升策略</text>
  <text x="750" y="918" font-size="11" fill="#475569">抗反馈突变株（解除终产物抑制）· 前体添加（绕过限速步骤）· 互补发酵（两菌株中间物互补）</text>
</svg>