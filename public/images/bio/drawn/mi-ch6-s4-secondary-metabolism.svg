  <rect x="1080" y="314" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1215" y="339.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">由初级代谢中间物衍生</text>
  <rect x="680" y="354" width="670" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="680" y="354" width="150" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="755" y="379.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">典型产物</text>
  <rect x="830" y="354" width="250" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="955" y="379.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">氨基酸、核苷酸、维生素</text>
  <rect x="1080" y="354" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1215" y="379.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">抗生素、毒素、色素等</text>
  <rect x="680" y="394" width="150" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
