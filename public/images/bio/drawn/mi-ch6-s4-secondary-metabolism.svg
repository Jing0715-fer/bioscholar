  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">次级代谢及其产物：合成期与生长曲线的对照</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">初级代谢对数期必需；次级代谢主在稳定期，分抗生素等六类，受反馈、碳氮与磷酸盐调节；青霉素 1928 年发现、1945 年诺奖，链霉素 1952 年诺奖</text>
  <rect x="30" y="132" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、合成期对照：初级代谢伴随对数期，次级代谢主要在稳定期</text>
