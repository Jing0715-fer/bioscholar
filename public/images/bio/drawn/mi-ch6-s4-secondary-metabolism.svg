  <text x="755" y="259.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">发生时期</text>
  <rect x="830" y="234" width="250" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="955" y="259.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">对数期（旺盛生长）</text>
