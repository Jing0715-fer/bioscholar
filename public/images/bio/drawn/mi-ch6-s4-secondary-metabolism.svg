  <text x="24" y="322.5" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">菌数（对数）</text>
  <path d="M70.0,410.3 L115.6,408.3 L161.2,400.5 L229.6,357.6 L298.0,287.4 L355.0,248.4 L423.4,234.8 L514.6,236.7 L594.4,248.4 L640.0,275.7" fill="none" stroke="#1e293b" stroke-width="3"/>
