  <text x="475" y="215.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">次级代谢（非必需）</text>
  <text x="70" y="452" font-size="10.5" fill="#64748b">次级代谢产物由初级代谢的中间物衍生——营养受限、生长进入稳定期后方才大量涌现。</text>
  <rect x="680" y="190" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
