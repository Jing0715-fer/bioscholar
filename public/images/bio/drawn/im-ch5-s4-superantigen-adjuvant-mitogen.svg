<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">超抗原、佐剂与丝裂原：三类「非典型」免疫激活物质</text>
  <text x="700" y="74" text-anchor="middle" font-size="16" fill="#64748b">超抗原不经加工、不占MHC沟槽，而结合MHCII非多态区与TCRVβ直接交联，纳克级剂量即可激活2%–20%的T细胞（普通抗原不足万分之一），金葡菌肠毒素与TSST-1</text>
  <text x="700" y="100" text-anchor="middle" font-size="16" fill="#64748b">引发中毒性休克综合征；佐剂经储库效应、APC招募与PRR刺激增强免疫原性（铝佐剂与弗氏完全佐剂）；丝裂原非特异多克隆激活——PHA/ConA作用于T细胞、LPS作用于小鼠B细胞</text>
  <rect x="30" y="132" width="1340" height="316" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、超抗原：绕过加工的克隆引爆器——不经加工、不占 MHC 沟槽</text>
  <rect x="60" y="178" width="400" height="170" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="260" y="202" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">普通抗原（对照）</text>
  <rect x="120" y="250" width="280" height="34" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="260" y="272" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">MHC II 沟槽中的抗原肽</text>
  <circle cx="200" cy="316" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <circle cx="320" cy="316" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <line x1="200" y1="301" x2="200" y2="286" stroke="#b45309" stroke-width="1.6"/>
  <line x1="320" y1="301" x2="320" y2="286" stroke="#b45309" stroke-width="1.6"/>
  <text x="260" y="320" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">TCR</text>
  <text x="260" y="344" font-size="10.5" fill="#64748b" text-anchor="middle">高度特异识别</text>
  <rect x="490" y="178" width="400" height="170" rx="9" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.8"/>
  <text x="690" y="202" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">超抗原（SAg）</text>
  <rect x="550" y="250" width="280" height="34" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="690" y="272" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">MHC II（沟槽空置）</text>
  <rect x="665.005" y="306.65" width="49.99" height="18.7" rx="7" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
  <text x="690" y="319.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">超抗原</text>
  <line x1="662" y1="306" x2="618" y2="288" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <line x1="718" y1="316" x2="782" y2="316" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <circle cx="800" cy="316" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="800" y="320" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">Vβ</text>
  <text x="660" y="344" font-size="10.5" fill="#dc2626" text-anchor="middle">同时结合 MHC II 非多态区与 TCR Vβ</text>
  <rect x="920" y="178" width="440" height="170" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1140" y="204" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">激活克隆比例对比</text>
  <text x="1140" y="240" font-size="11.5" fill="#475569" text-anchor="middle">普通抗原：通常不足万分之一</text>
  <text x="1140" y="272" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">超抗原：约 2%–20%</text>
  <text x="1140" y="304" font-size="11.5" fill="#475569" text-anchor="middle">只需极低剂量（纳克级）</text>
  <text x="1140" y="332" font-size="11.5" fill="#475569" text-anchor="middle">即可引爆大量 T 细胞</text>
  <text x="700" y="388" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">金黄色葡萄球菌肠毒素与 TSST-1 经 Vβ 特异激活引发细胞因子风暴样中毒性休克综合征</text>
  <rect x="30" y="464" width="1340" height="222" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="486.84" font-size="19" fill="#475569" font-weight="700">二、普通抗原 · 超抗原 · 丝裂原：三类激活物质的鲜明对照</text>
  <rect x="60" y="510" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="537.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">比较项目</text>
  <rect x="200" y="510" width="330" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="537.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">普通抗原</text>
  <rect x="530" y="510" width="380" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="720" y="537.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">超抗原</text>
  <rect x="910" y="510" width="430" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="537.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">丝裂原</text>
  <rect x="60" y="554" width="140" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="578.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">识别方式</text>
  <rect x="200" y="554" width="330" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="578.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">经 MHC 提呈，TCR 特异识别</text>
  <rect x="530" y="554" width="380" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="720" y="578.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">结合 MHC II 非多态区与 TCR Vβ 直接交联</text>
  <rect x="910" y="554" width="430" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="578.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">非特异性多克隆激活</text>
  <rect x="60" y="592" width="1280" height="38" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="592" width="140" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="616.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">MHC 参与</text>
  <rect x="200" y="592" width="330" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="616.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">必须（肽占 MHC 沟槽）</text>
  <rect x="530" y="592" width="380" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="720" y="616.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">不经加工、不占沟槽</text>
  <rect x="910" y="592" width="430" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="616.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">不需要</text>
  <rect x="60" y="630" width="140" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="654.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">激活克隆比例</text>
  <rect x="200" y="630" width="330" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="654.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">通常不足万分之一</text>
  <rect x="530" y="630" width="380" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="720" y="654.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">约 2%–20%</text>
  <rect x="910" y="630" width="430" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="654.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">多克隆、大比例</text>
  <rect x="60" y="668" width="1280" height="38" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="668" width="140" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="692.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">代表</text>
  <rect x="200" y="668" width="330" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="365" y="692.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">各类蛋白抗原</text>
  <rect x="530" y="668" width="380" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="720" y="692.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">金葡菌肠毒素 · TSST-1</text>
  <rect x="910" y="668" width="430" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="692.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">PHA · ConA（T 细胞）；LPS（小鼠 B 细胞）</text>
  <rect x="30" y="702" width="1340" height="276" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="724.84" font-size="19" fill="#475569" font-weight="700">三、佐剂：免疫原性的放大器——储库 · 招募 · PRR 刺激三重机制</text>
  <rect x="60" y="748" width="420" height="88" rx="9" fill="#0369a1" fill-opacity="0.09" stroke="#0369a1" stroke-width="1.7"/>
  <text x="80" y="774" font-size="13.5" fill="#075985" font-weight="700">储库效应</text>
  <text x="80" y="798" font-size="11" fill="#475569">抗原在局部缓慢释放，延长暴露时间</text>
  <rect x="470" y="748" width="420" height="88" rx="9" fill="#0f766e" fill-opacity="0.09" stroke="#0f766e" stroke-width="1.7"/>
  <text x="490" y="774" font-size="13.5" fill="#134e4a" font-weight="700">招募 APC</text>
  <text x="490" y="798" font-size="11" fill="#475569">吸引与活化抗原提呈细胞</text>
  <rect x="880" y="748" width="420" height="88" rx="9" fill="#6d28d9" fill-opacity="0.09" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="900" y="774" font-size="13.5" fill="#4c1d95" font-weight="700">PRR 刺激</text>
  <text x="900" y="798" font-size="11" fill="#475569">激活模式识别受体，上调共刺激（发放「许可证」）</text>
  <rect x="60" y="856" width="1280" height="100" rx="9" fill="#fef3c7" fill-opacity="0.35" stroke="#b45309" stroke-width="1.5"/>
  <text x="80" y="882" font-size="13" fill="#78350f" font-weight="700">经典佐剂</text>
  <text x="80" y="910" font-size="11.5" fill="#475569">铝佐剂（氢氧化铝 / 磷酸铝，人类疫苗最常用）</text>
  <text x="760" y="910" font-size="11.5" fill="#475569">弗氏完全佐剂（含灭活结核杆菌，实验用）</text>
  <text x="700" y="940" font-size="10.5" fill="#64748b" text-anchor="middle">丝裂原则反向提醒：PHA / ConA 激活 T 细胞、LPS 激活小鼠 B 细胞——皆非特异性</text>
</svg>