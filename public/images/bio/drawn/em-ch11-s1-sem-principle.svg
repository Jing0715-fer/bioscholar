<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">扫描电镜的原理与构造：点扫成像与探针形成链</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">放大倍数＝屏边长÷扫描区边长（约10至10⁶倍，与透镜无关）；亮度阶梯钨约10⁹、肖特基10¹²–10¹³、冷场发射10¹³–10¹⁴A·cm⁻²·sr⁻¹，d∝√(I/β)；末光阑20–100μm、</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">工作距离2–15mm；减速模式落地0.5keV</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、点扫成像：放大倍数与透镜无关</text>
  <rect x="70" y="190" width="200" height="150" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <line x1="90" y1="210" x2="250" y2="210" stroke="#0369a1" stroke-width="1.6" opacity="0.5"/>
  <line x1="90" y1="238" x2="250" y2="238" stroke="#0369a1" stroke-width="1.6" opacity="0.5"/>
  <line x1="90" y1="266" x2="250" y2="266" stroke="#0369a1" stroke-width="1.6" opacity="0.5"/>
  <line x1="90" y1="294" x2="250" y2="294" stroke="#0369a1" stroke-width="1.6" opacity="0.5"/>
  <line x1="90" y1="322" x2="250" y2="322" stroke="#0369a1" stroke-width="1.6" opacity="0.5"/>
  <text x="170" y="360" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">显示屏（10 cm 边长）</text>
  <line x1="286" y1="265" x2="356" y2="265" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="321" y="247" font-size="9.5" fill="#475569" text-anchor="middle">逐点同步扫描</text>
  <rect x="366" y="226" width="90" height="78" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="378" y1="246" x2="444" y2="246" stroke="#0369a1" stroke-width="1.2" opacity="0.6"/>
  <line x1="378" y1="270" x2="444" y2="270" stroke="#0369a1" stroke-width="1.2" opacity="0.6"/>
  <line x1="378" y1="294" x2="444" y2="294" stroke="#0369a1" stroke-width="1.2" opacity="0.6"/>
  <text x="411" y="360" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">样品上被扫区域</text>
  <text x="490" y="200" font-size="10.5" fill="#475569">放大倍数＝显示屏边长 ÷ 扫描区边长：</text>
  <text x="490" y="215" font-size="10.5" fill="#475569">10 cm 的屏扫 100 μm 即 1000 倍、</text>
  <text x="490" y="230" font-size="10.5" fill="#475569">扫 10 μm 即 10000 倍——换倍率只改扫描电流，</text>
  <text x="490" y="245" font-size="10.5" fill="#475569">与透镜焦距无关。</text>
  <rect x="130.401392" y="401.075" width="139.19721600000003" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="200" y="413.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">倍数范围约 10 至 10<tspan dy="-3.6" font-size="7.6">6</tspan><tspan dy="3.6"> 倍</tspan></text>
  <rect x="408.2575" y="401.075" width="223.485" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="520" y="413.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">分辨率由探针尺寸与信号逸出体积共同决定</text>
  <text x="360" y="470" font-size="10" fill="#64748b" text-anchor="middle">「扫得小、放得大」：点扫把成像从透镜光学搬到扫描几何，放大与解耦</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、探针形成链：从枪到末光阑</text>
  <rect x="760" y="178" width="90" height="56" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="805" y="200" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">电子枪</text>
  <text x="805" y="218" font-size="9" fill="#64748b" text-anchor="middle">钨／肖特基／冷场发射</text>
  <line x1="805" y1="238" x2="805" y2="258" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="760" y="262" width="90" height="30" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="805" y="282" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">聚光镜</text>
  <line x1="805" y1="296" x2="805" y2="316" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="760" y="320" width="90" height="30" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="805" y="340" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">物镜</text>
  <rect x="778" y="358" width="54" height="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="805" y="386" font-size="9.5" fill="#92400e" text-anchor="middle">末光阑：孔径 20–100 μm</text>
  <line x1="805" y1="372" x2="805" y2="424" stroke="#0369a1" stroke-width="2.4" marker-end="url(#arr-acc)"/>
  <text x="815" y="404" font-size="9.5" fill="#475569">会聚半角约 1–20 mrad</text>
  <line x1="740" y1="430" x2="890" y2="430" stroke="#475569" stroke-width="3"/>
  <rect x="760" y="430" width="110" height="24" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="815" y="446" font-size="10" fill="#475569" text-anchor="middle">样品</text>
  <text x="930" y="190" font-size="10.5" fill="#475569">末光阑以下的会聚锥决定探针尺寸与束流的折衷；工作距离典型 2–15 mm，</text>
  <text x="930" y="205" font-size="10.5" fill="#475569">高分辨须小于 5 mm——距离越长像差越重。</text>
  <rect x="942.00805" y="277.075" width="115.98389999999999" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1000" y="289.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">探针直径约 1–10 nm</text>
  <rect x="923.38" y="311.075" width="153.24" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1000" y="323.78" font-size="10.5" fill="#134e4a" text-anchor="middle">束流：高分辨 SE 像数十皮安</text>
  <rect x="903.43" y="345.075" width="193.14000000000001" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1000" y="357.78" font-size="10.5" fill="#134e4a" text-anchor="middle">能谱面扫纳安级、探针放宽 10–50 nm</text>
  <text x="1180" y="430" font-size="9.5" fill="#64748b" text-anchor="middle">（探针形成链示意，非比例）</text>
  <rect x="30" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、亮度阶梯：d 与 √(I/β) 成比例</text>
  <rect x="89.8" y="811.5384615384615" width="70.4" height="38.46153846153846" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="125" y="802.5384615384615" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">约 10<tspan dy="-4.3" font-size="9.0">9</tspan></text>
  <text x="125" y="870" font-size="12.5" fill="#64748b" text-anchor="middle">钨灯丝</text>
  <rect x="199.8" y="715.3846153846154" width="70.4" height="134.6153846153846" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="235" y="706.3846153846154" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">10<tspan dy="-4.3" font-size="9.0">12</tspan><tspan dy="4.3">–10</tspan><tspan dy="-4.3" font-size="9.0">13</tspan></text>
  <text x="235" y="870" font-size="12.5" fill="#64748b" text-anchor="middle">肖特基</text>
  <rect x="309.8" y="676.9230769230769" width="70.4" height="173.07692307692307" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="345" y="667.9230769230769" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">10<tspan dy="-4.3" font-size="9.0">13</tspan><tspan dy="4.3">–10</tspan><tspan dy="-4.3" font-size="9.0">14</tspan></text>
  <text x="345" y="870" font-size="12.5" fill="#64748b" text-anchor="middle">冷场发射</text>
  <text x="235" y="600" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">亮度 β（A·cm<tspan dy="-3.7" font-size="7.9">-2</tspan><tspan dy="3.7">·sr</tspan><tspan dy="-3.7" font-size="7.9">-1</tspan><tspan dy="3.7">，对数示意）</tspan></text>
  <text x="440" y="616" font-size="10.5" fill="#475569">束流需求一升、探针必须放大：</text>
  <text x="440" y="631" font-size="10.5" fill="#475569">探针最小可聚尺寸受衍射极限（约 0.6λ/α）</text>
  <text x="440" y="646" font-size="10.5" fill="#475569">与低电压色差展宽限制——1 kV 电子波长 0.039 nm，</text>
  <text x="440" y="661" font-size="10.5" fill="#475569">中等会聚角下衍射极限约 1–2 nm。</text>
  <rect x="505.173076" y="748.95" width="89.653848" height="22.099999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="550" y="764.68" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">d ∝ (I/β)<tspan dy="-4.4" font-size="9.4">1/2</tspan></text>
  <text x="235" y="900" font-size="10" fill="#64748b" text-anchor="middle">亮度高一个量级，同束流下探针细一截</text>
  <rect x="710" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、减速模式：柱内高能、落地低能</text>
  <rect x="740" y="616" width="150" height="190" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="815" y="640" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">镜筒内</text>
  <line x1="815" y1="656" x2="815" y2="760" stroke="#0369a1" stroke-width="2.4" marker-end="url(#arr-acc)"/>
  <text x="825" y="700" font-size="9.5" fill="#475569">高束能保光学</text>
  <rect x="740" y="810" width="150" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="815" y="832" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700">样品负偏压（减速）</text>
  <rect x="940.54415" y="651.075" width="138.9117" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1010" y="663.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">落地能量压到 0.5 keV 级</text>
  <rect x="989.5" y="685.075" width="81" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1030" y="697.78" font-size="10.5" fill="#065f46" text-anchor="middle">表面衬度更真</text>
  <rect x="1108.5" y="685.075" width="123" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1170" y="697.78" font-size="10.5" fill="#065f46" text-anchor="middle">探针更细（色差减小）</text>
  <rect x="1005.25" y="719.075" width="49.5" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1030" y="731.78" font-size="10.5" fill="#065f46" text-anchor="middle">低荷电</text>
  <rect x="1150.185" y="719.075" width="39.629999999999995" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1170" y="731.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">三得</text>
  <text x="930" y="776" font-size="10" fill="#475569">历史一笔：1937 年 von Ardenne 造出首台扫描电镜原理机，</text>
  <text x="930" y="790" font-size="10" fill="#475569">剑桥 Oatley 学派 1950 年代推向实用，</text>
  <text x="930" y="804" font-size="10" fill="#475569">1965 年剑桥仪器公司推出首台商品机 Stereoscan——比商品透射电镜晚了近三十年，</text>
  <text x="930" y="818" font-size="10" fill="#475569">探针路线须等场发射枪与探测器技术双双成熟。</text>
  <text x="1040" y="930" font-size="10" fill="#64748b" text-anchor="middle">景深长与原位实验腔是形貌与动态研究的本钱</text>
</svg>