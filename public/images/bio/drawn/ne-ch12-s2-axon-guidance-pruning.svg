<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">轴突导向与突触修剪：四类线索、Robo 开关与 reelin 分层</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">生长锥探测 Netrin/Slit/Sema/Ephrin；中线「先允许后禁止」；小胶质细胞经补体标记吞噬弱突触</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、生长锥：丝足探测线索，Rho GTP 酶掌舵</text>
  <line x1="120" y1="320" x2="300" y2="320" stroke="#0f766e" stroke-width="5"/>
  <polygon points="300,300 356,320 300,340" fill="#ccfbf1" fill-opacity="0.8" stroke="#0f766e" stroke-width="2"/>
  <line x1="356" y1="320" x2="402" y2="278" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="402" cy="278" r="3.5" fill="#0f766e"/>
  <line x1="356" y1="320" x2="412" y2="316" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="412" cy="316" r="3.5" fill="#0f766e"/>
  <line x1="356" y1="320" x2="396" y2="356" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="396" cy="356" r="3.5" fill="#0f766e"/>
  <text x="250" y="292" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">轴突（束状）</text>
  <text x="462" y="300" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">片足</text>
  <text x="310" y="258" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">丝足（探测分子线索）</text>
  <text x="150" y="356" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">生长锥</text>
  <rect x="475.03935" y="235.075" width="89.92130000000002" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="520" y="247.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">Netrin（吸引）</text>
  <rect x="464.7651" y="275.075" width="110.46979999999999" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="520" y="287.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">Slit / Sema（排斥）</text>
  <rect x="475.03935" y="315.075" width="89.92130000000002" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="520" y="327.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">Ephrin（接触）</text>
  <text x="60" y="400" font-size="11" fill="#475569">同一配体可因受体组合或胞内 cAMP / cGMP 水平而效应相反——「线索的读法」由生长锥自己决定；</text>
  <text x="60" y="416" font-size="11" fill="#475569">Rho 家族 GTP 酶重组肌动蛋白实现转向。</text>
  <text x="60" y="460" font-size="11" fill="#64748b">转向 = 肌动蛋白在丝足内的定向组装：吸引侧稳定、排斥侧坍缩。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、四类经典导向线索与「先允许、后禁止」</text>
  <rect x="740" y="200" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="795" y="227.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">家族</text>
  <rect x="850" y="200" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="227.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">代表配体与来源</text>
  <rect x="1020" y="200" width="160" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1100" y="227.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">受体</text>
  <rect x="1180" y="200" width="160" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="227.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">典型效应</text>
  <rect x="740" y="244" width="110" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="795" y="275.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">Netrin</text>
  <rect x="850" y="244" width="170" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="275.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">底板分泌 Netrin-1</text>
  <rect x="1020" y="244" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1100" y="275.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">DCC（或 DCC-UNC5）</text>
  <rect x="1180" y="244" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="275.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">长程吸引抵达中线</text>
  <rect x="740" y="296" width="600" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="296" width="110" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="795" y="327.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">Slit</text>
  <rect x="850" y="296" width="170" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="327.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">底板分泌</text>
  <rect x="1020" y="296" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1100" y="327.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">Robo</text>
  <rect x="1180" y="296" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="327.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">排斥已过中线者</text>
  <rect x="740" y="348" width="110" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="795" y="379.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">Semaphorin</text>
  <rect x="850" y="348" width="170" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="379.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">Sema3A 等分泌/膜型</text>
  <rect x="1020" y="348" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1100" y="379.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">Neuropilin + Plexin</text>
  <rect x="1180" y="348" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="379.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">多为排斥</text>
  <rect x="740" y="400" width="600" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="400" width="110" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="795" y="431.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">Ephrin</text>
  <rect x="850" y="400" width="170" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="935" y="431.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">膜结合 A / B 型</text>
  <rect x="1020" y="400" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1100" y="431.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">EphA / EphB</text>
  <rect x="1180" y="400" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="431.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">接触依赖双向信号</text>
  <text x="1040" y="460" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">中线穿越的 Robo 开关</text>
  <rect x="760" y="480" width="540" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="776" y="504" font-size="10.5" fill="#059669" font-weight="700">穿越前：压低 Robo → Slit 排斥被「静音」→ 允许靠近中线</text>
  <text x="776" y="526" font-size="10.5" fill="#dc2626" font-weight="700">穿越后：Robo 表达恢复 → Slit 排斥生效 → 禁止回穿——单次穿越的分子闸门</text>
  <rect x="30" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、reelin 信号：晚生者在外层「刹车」</text>
  <rect x="60" y="648" width="580" height="180" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="70" y="658" width="560" height="34" rx="6" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.5"/>
  <text x="350" y="680" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">边缘带：Cajal-Retzius 细胞分泌 reelin</text>
  <rect x="86" y="704" width="528" height="26" rx="4" fill="#6d28d9" fill-opacity="0.25" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="350" y="721" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">VI 层（早生）</text>
  <rect x="86" y="734" width="528" height="26" rx="4" fill="#0369a1" fill-opacity="0.25" stroke="#0369a1" stroke-width="1.2"/>
  <text x="350" y="751" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">V 层</text>
  <rect x="86" y="764" width="528" height="26" rx="4" fill="#0f766e" fill-opacity="0.25" stroke="#0f766e" stroke-width="1.2"/>
  <text x="350" y="781" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">IV 层</text>
  <rect x="86" y="794" width="528" height="26" rx="4" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.2"/>
  <text x="350" y="811" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">II–III 层（晚生）</text>
  <line x1="130" y1="830" x2="130" y2="700" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#arr-pro)"/>
  <text x="160" y="850" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">晚生神经元沿放射状纤维攀行</text>
  <text x="60" y="866" font-size="10.5" fill="#475569">reelin 使晚生神经元在最外层「刹车」定居——皮层由内向外（inside-out）分层；reeler 小鼠 reelin 缺陷致层序大体颠倒、</text>
  <text x="60" y="881" font-size="10.5" fill="#475569">小脑发育不良且共济失调（1951 年发现的经典突变）。</text>
  <rect x="710" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="600.84" font-size="19" fill="#475569" font-weight="700">四、突触修剪：经验、小胶质细胞与青春期</text>
  <rect x="740" y="648" width="290" height="130" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.8"/>
  <text x="756" y="674" font-size="12.5" fill="#075985" font-weight="700">经验依赖修剪</text>
  <text x="756" y="698" font-size="11" fill="#475569">视觉关键期的单眼剥夺实验：</text>
  <text x="756" y="713" font-size="11" fill="#475569">被剥夺眼的突触被成批删除——「用进废退」在突触尺度的直接演示。</text>
  <rect x="1050" y="648" width="290" height="130" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1066" y="674" font-size="12.5" fill="#134e4a" font-weight="700">小胶质细胞的吞噬修剪</text>
  <text x="1066" y="698" font-size="11" fill="#475569">补体 C1q 与 C3 标记弱突触，</text>
  <text x="1066" y="713" font-size="11" fill="#475569">小胶质细胞经 CR3 介导吞噬——免疫分子被征用为「突触裁决官」。</text>
  <rect x="740" y="806" width="600" height="96" rx="9" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.6"/>
  <text x="756" y="830" font-size="12.5" fill="#dc2626" font-weight="700">修剪失衡的代价</text>
  <text x="756" y="852" font-size="11" fill="#475569">青春期前额叶修剪异常与精神分裂症风险相关：修剪过少→连接过密假说，</text>
  <text x="756" y="868" font-size="11" fill="#475569">修剪过多→突触贫乏——「适度删除」是精确组装的必要代价。</text>
</svg>