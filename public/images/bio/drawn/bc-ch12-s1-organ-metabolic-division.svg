<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">六大器官的代谢分工：燃料偏好与特有功能</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">肝唯一生成酮体与尿素且不利用酮体；脑日耗糖100~120g不能用脂肪酸；心肌偏爱脂肪酸；肌缺G6P酶经Cori循环补糖；红细胞仅糖酵解（2,3-BPG调运氧）</text>
  <rect x="30" y="132" width="1340" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、六大器官的燃料偏好与特有功能对照</text>
  <rect x="64" y="186" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="149" y="213.5" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="700">器官</text>
  <rect x="234" y="186" width="330" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="399" y="213.5" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="700">主要燃料</text>
  <rect x="564" y="186" width="772" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="950" y="213.5" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="700">特有 / 关键功能</text>
  <rect x="64" y="230" width="170" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="149" y="265.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">肝（代谢中枢）</text>
  <rect x="234" y="230" width="330" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="399" y="265.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">脂肪酸 · 氨基酸</text>
  <rect x="564" y="230" width="772" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="950" y="265.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">糖异生主场所；唯一生成酮体与尿素；组装 VLDL；不利用酮体（缺 SCOT）</text>
  <rect x="64" y="290" width="1272" height="60" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="64" y="290" width="170" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="149" y="325.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">脑</text>
  <rect x="234" y="290" width="330" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="399" y="325.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">葡萄糖（长期饥饿加用酮体）</text>
  <rect x="564" y="290" width="772" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="950" y="325.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">日耗糖 100~120 g（占全身 60% 以上）；不能用长链脂肪酸；血糖 &lt; 2 mmol/L 即昏迷</text>
  <rect x="64" y="350" width="170" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="149" y="385.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">心肌</text>
  <rect x="234" y="350" width="330" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="399" y="385.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">脂肪酸 ＞ 酮体 / 乳酸</text>
  <rect x="564" y="350" width="772" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="950" y="385.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">线粒体密度高、有氧氧化为主，耐力型氧化代谢；极少依赖无氧酵解</text>
  <rect x="64" y="410" width="1272" height="60" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="64" y="410" width="170" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="149" y="445.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">骨骼肌</text>
  <rect x="234" y="410" width="330" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="399" y="445.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">视运动强度（静息脂肪酸 / 剧烈运动糖酵解）</text>
  <rect x="564" y="410" width="772" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="950" y="445.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">缺 G6P 磷酸酶 → 肌糖原不直接补血糖，经 Cori 循环间接输出碳与氮</text>
  <rect x="64" y="470" width="170" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="149" y="505.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">脂肪组织</text>
  <rect x="234" y="470" width="330" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="399" y="505.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">—（储而不耗）</text>
  <rect x="564" y="470" width="772" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="950" y="505.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">LPL 储脂 · HSL 动员；TAG 储库 + 内分泌器官（瘦素 · 脂联素 · 抵抗素）</text>
  <rect x="64" y="530" width="1272" height="60" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="64" y="530" width="170" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="149" y="565.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">红细胞</text>
  <rect x="234" y="530" width="330" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="399" y="565.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">葡萄糖（仅糖酵解）</text>
  <rect x="564" y="530" width="772" height="60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="950" y="565.5" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="500">无线粒体，糖酵解唯一产能途径；2,3-BPG 旁路调节血红蛋白运氧；NADPH 维持 GSH</text>
  <text x="710" y="612" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">三句口诀：肝是唯一生成酮体与尿素的器官 · 脑不能用脂肪酸 · 红细胞只靠糖酵解。</text>
  <rect x="30" y="634" width="700" height="346" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="656.84" font-size="19" fill="#475569" font-weight="700">二、器官间协作：Cori 循环与葡萄糖-丙氨酸循环</text>
  <rect x="56" y="706" width="180" height="210" rx="10" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.8"/>
  <text x="146" y="738" font-size="17" fill="#075985" text-anchor="middle" font-weight="700">肝</text>
  <text x="146" y="766" font-size="10" fill="#475569" text-anchor="middle">糖异生 · 尿素 · 酮体</text>
  <text x="146" y="788" font-size="10" fill="#475569" text-anchor="middle">VLDL · 血糖缓冲器</text>
  <text x="146" y="810" font-size="9" fill="#64748b" text-anchor="middle">葡糖激酶 Km≈10 mmol/L</text>
  <text x="146" y="832" font-size="9" fill="#64748b" text-anchor="middle">不利用酮体（缺 SCOT）</text>
  <text x="146" y="854" font-size="9" fill="#64748b" text-anchor="middle">胆固醇合成 70%~80%</text>
  <rect x="500" y="706" width="170" height="210" rx="10" fill="#ede9fe" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="585" y="738" font-size="17" fill="#4c1d95" text-anchor="middle" font-weight="700">骨骼肌</text>
  <text x="585" y="766" font-size="10" fill="#475569" text-anchor="middle">静息：脂肪酸氧化</text>
  <text x="585" y="788" font-size="10" fill="#475569" text-anchor="middle">剧烈运动：糖酵解</text>
  <text x="585" y="810" font-size="9" fill="#64748b" text-anchor="middle">缺 G6P 磷酸酶</text>
  <text x="585" y="832" font-size="9" fill="#64748b" text-anchor="middle">支链 AA（Leu·Ile·Val）</text>
  <text x="585" y="854" font-size="9" fill="#64748b" text-anchor="middle">主要在肌内氧化供能</text>
  <line x1="492" y1="752" x2="246" y2="752" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <text x="368" y="736" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">乳酸</text>
  <text x="368" y="772" font-size="9" fill="#64748b" text-anchor="middle">肌糖原经糖酵解</text>
  <line x1="244" y1="806" x2="490" y2="806" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <text x="368" y="790" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">葡萄糖</text>
  <text x="368" y="826" font-size="9" fill="#64748b" text-anchor="middle">肝糖异生回输</text>
  <path d="M 250,857 Q 250,848 259,848 M 481,848 Q 490,848 490,857" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <line x1="259" y1="848" x2="481" y2="848" stroke="#64748b" stroke-width="1.7"/>
  <text x="370" y="872" font-size="14" fill="#64748b" text-anchor="middle" font-weight="600">Cori 循环</text>
  <line x1="492" y1="910" x2="246" y2="910" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#arr-pro)"/>
  <text x="368" y="894" font-size="10.5" fill="#4c1d95" text-anchor="middle" font-weight="700">丙氨酸（碳 + 氮）</text>
  <text x="368" y="930" font-size="9" fill="#64748b" text-anchor="middle">葡萄糖-丙氨酸循环 · 氮 → 尿素</text>
  <text x="368" y="954" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="600">肌缺 G6P 酶 → 肌糖原不直接升血糖，间接输出碳与氮</text>
  <rect x="750" y="634" width="620" height="346" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="656.84" font-size="19" fill="#475569" font-weight="700">三、三个「极端」器官的关键数字</text>
  <rect x="775.305" y="691.95" width="29.39" height="22.099999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="790" y="707.68" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">脑</text>
  <text x="838" y="690" font-size="10.5" fill="#475569">日耗葡萄糖 100~120 g（占全身 60% 以上），不能用长链脂肪酸；长期饥饿时酮体满足 50%~70% 需要</text>
  <text x="838" y="705" font-size="10.5" fill="#475569">（节约肌肉蛋白）；血糖 &lt; 2 mmol/L 即低血糖昏迷。</text>
  <line x1="770" y1="733" x2="1350" y2="733" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="775.305" y="746.95" width="29.39" height="22.099999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="790" y="762.68" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">肝</text>
  <text x="838" y="745" font-size="10.5" fill="#475569">胆固醇合成占全身 70%~80%；氧化脂肪酸「挥霍」供能而不利用酮体（缺 SCOT）；</text>
  <text x="838" y="760" font-size="10.5" fill="#475569">一般不完整氧化葡萄糖（优先输出）——代谢中枢「改造厂」。</text>
  <line x1="770" y1="788" x2="1350" y2="788" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="761.915" y="801.95" width="56.17" height="22.099999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="790" y="817.68" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">红细胞</text>
  <text x="838" y="800" font-size="10.5" fill="#475569">无线粒体，糖酵解为唯一产能途径；2,3-BPG 旁路调节血红蛋白氧亲和力；PPP 产 NADPH 维持 GSH，</text>
  <text x="838" y="815" font-size="10.5" fill="#475569">抗氧化护膜。</text>
  <rect x="766" y="862" width="588" height="92" rx="9" fill="#f1f5f9" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="782" y="886" font-size="12" fill="#1e293b" font-weight="700">「中枢-外周」燃料互补</text>
  <text x="782" y="910" font-size="10.5" fill="#475569">肝输出葡萄糖 / 酮体 / VLDL 供脑与外周；外周回输乳酸 · 丙氨酸 · 甘油 · FFA 作肝原料——血糖与燃料池由此恒定。</text>
</svg>