<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">光镊：强会聚激光的梯度势阱与单分子力测量</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">梯度力（指向焦点）与散射力（沿传播方向）平衡俘获介电微珠；F = −k·Δx 实现 pN 级力谱</text>
  <rect x="30" y="150" width="660" height="560" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="172.84" font-size="19" fill="#475569" font-weight="700">一、光路：强会聚激光形成三维梯度势阱</text>
  <rect x="60" y="186" width="96" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="108" y="212" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">激光器</text>
  <text x="60" y="252" font-size="11" fill="#64748b">近红外 ~1064 nm（活样品光损伤小）</text>
  <line x1="156" y1="208" x2="330" y2="208" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="212.37" y="181.075" width="55.26" height="17.849999999999998" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="193.78" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">二向色镜</text>
  <line x1="306" y1="178" x2="354" y2="232" stroke="#475569" stroke-width="4"/>
  <line x1="330" y1="208" x2="330" y2="268" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6"/>
  <polygon points="292,268 368,268 352,340 308,340" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.2"/>
  <text x="282" y="296" font-size="12" fill="#075985" text-anchor="end" font-weight="700">高 NA 油浸物镜</text>
  <text x="282" y="316" font-size="10.5" fill="#64748b" text-anchor="end">NA ≥ 1.2 会聚角大</text>
  <rect x="190" y="400" width="330" height="150" rx="10" fill="#e0f2fe" fill-opacity="0.25" stroke="#475569" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="200" y="392" font-size="11" fill="#64748b">样品池（水溶液介质，折射率 n₀ ≈ 1.33）</text>
  <polygon points="308,340 352,340 336,470 324,470" fill="#d97706" fill-opacity="0.22"/>
  <circle cx="330" cy="470" r="22" fill="#fce7f3" stroke="#be185d" stroke-width="2.4"/>
  <text x="330" y="475" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">珠</text>
  <text x="380" y="448" font-size="11.5" fill="#1e293b" font-weight="700">介电微珠（直径 ~1 μm）</text>
  <text x="380" y="468" font-size="10.5" fill="#64748b">折射率 n₁ ≈ 1.5 &gt; 介质 n₀ ≈ 1.33（聚苯乙烯/石英）</text>
  <line x1="330" y1="442" x2="330" y2="408" stroke="#0f766e" stroke-width="2.6" marker-end="url(#arr-dna)"/>
  <text x="352" y="421" font-size="11" fill="#0f766e" font-weight="700">F梯度：指向焦点</text>
  <line x1="330" y1="498" x2="330" y2="532" stroke="#be185d" stroke-width="2.6" marker-end="url(#arr-enz)"/>
  <text x="344" y="522" font-size="11" fill="#be185d" font-weight="700">F散射：沿光传播方向</text>
  <text x="200" y="570" font-size="11" fill="#475569">两力平衡 → 微珠稳定于焦点附近；微珠偶联单个生物分子（马达蛋白 / RNA 聚合酶 / DNA…）</text>
  <text x="200" y="586" font-size="11" fill="#475569">，pN 级牵引力使珠偏离焦点、位移与力成正比。</text>
  <rect x="720" y="150" width="650" height="560" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="736" y="172.84" font-size="19" fill="#475569" font-weight="700">二、光线追迹：折射与动量传递解释力源</text>
  <circle cx="1010" cy="360" r="78" fill="#ffffff" stroke="#be185d" stroke-width="2.6"/>
  <line x1="1010" y1="250" x2="1010" y2="470" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="1010" y="240" font-size="10.5" fill="#64748b" text-anchor="middle">法线</text>
  <line x1="850" y1="282" x2="952" y2="326" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="952" y1="326" x2="1060" y2="402" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-warn)"/>
  <line x1="880" y1="250" x2="975" y2="306" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="975" y1="306" x2="1076" y2="438" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-warn)"/>
  <line x1="826" y1="330" x2="940" y2="348" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="940" y1="348" x2="1030" y2="462" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-warn)"/>
  <rect x="816.9625" y="221.075" width="66.075" height="17.849999999999998" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="850" y="233.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">会聚激光束</text>
  <line x1="1060" y1="420" x2="1060" y2="470" stroke="#d97706" stroke-width="2.4" marker-end="url(#arr-warn)"/>
  <text x="1082" y="430" font-size="11" fill="#475569">出射光动量方向改变</text>
  <text x="1082" y="448" font-size="11" fill="#475569">→ 光子动量变化 Δp 向下</text>
  <text x="1082" y="466" font-size="11" fill="#475569">→ 珠获得向上的反作用力</text>
  <line x1="1010" y1="276" x2="1010" y2="226" stroke="#0f766e" stroke-width="3" marker-end="url(#arr-dna)"/>
  <text x="1030" y="250" font-size="11" fill="#134e4a" font-weight="700">净合力指向光强更大处（焦点）＝梯度力来源</text>
  <text x="750" y="560" font-size="11" fill="#475569">微珠折射率高于介质 → 光线穿珠向法线偏折 → 动量沿光传播方向向下传递 → 反推微珠指向焦点；</text>
  <text x="750" y="577" font-size="11" fill="#475569">焦上焦下光线不对称度决定阱刚度。</text>
  <rect x="30" y="740" width="660" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="762.84" font-size="19" fill="#475569" font-weight="700">三、小位移近似：简谐势阱</text>
  <rect x="70" y="800" width="12" height="100" fill="#475569"/>
  <polyline points="82,836 96,862 110,836 124,862 138,836 152,862 166,836 180,862 194,836" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="236" cy="850" r="20" fill="#fce7f3" stroke="#be185d" stroke-width="2.2"/>
  <text x="236" y="855" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">珠</text>
  <line x1="320" y1="850" x2="262" y2="850" stroke="#0f766e" stroke-width="2.6" marker-end="url(#arr-dna)"/>
  <text x="330" y="842" font-size="13" fill="#134e4a" font-weight="700">F = −k·Δx</text>
  <text x="330" y="864" font-size="10.5" fill="#64748b">（回复力指向焦点）</text>
  <text x="100" y="910" font-size="11" fill="#475569">k 为阱刚度（典型 ~0.1 pN/nm）；珠偏离焦点量与分子牵引力成正比，</text>
  <text x="100" y="927" font-size="11" fill="#475569">经标定实时输出 pN 级力曲线——力分辨率 ~0.1 pN、位移分辨率 ~nm。</text>
  <rect x="720" y="740" width="650" height="236" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="736" y="762.84" font-size="19" fill="#475569" font-weight="700">四、典型应用（单分子力谱）</text>
  <text x="744" y="790" font-size="12" fill="#1e293b">① 单分子马达步进：驱动蛋白 / 肌球蛋白的 8 nm 台阶与动力冲程；</text>
  <text x="744" y="830" font-size="12" fill="#1e293b">② RNA 聚合酶转录停顿与回溯的力依赖行为；</text>
  <text x="744" y="870" font-size="12" fill="#1e293b">③ DNA / 蛋白质去折叠力学谱：解链、结构域展开的中间态；</text>
  <text x="744" y="910" font-size="12" fill="#1e293b">④ 与荧光显微联用实现「看得见 + 拉得动」的杂合测量（1997–2018 多届诺贝尔奖相关技术）。</text>
</svg>