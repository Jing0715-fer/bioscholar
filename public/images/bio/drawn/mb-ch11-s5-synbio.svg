<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">合成生物学：基因线路与底盘细胞</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">JCVI-syn3.0 最小基因组（531 kb · 473 基因）——启动子-RBS-ORF-终止子标准装置、拨动开关与阻遏振荡器、酵母青蒿酸工程</text>
  <rect x="30" y="132" width="1340" height="252" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、两条路线：自上而下简化 vs 自下而上搭建</text>
  <line x1="70" y1="216" x2="1330" y2="216" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <circle cx="180" cy="216" r="6" fill="#1e293b"/>
  <text x="180" y="192" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">JCVI-syn1.0（2010）</text>
  <text x="180" y="238" font-size="11.5" fill="#475569" text-anchor="middle">全基因组合成与移植——首个「合成细胞」</text>
  <circle cx="620" cy="216" r="6" fill="#1e293b"/>
  <text x="620" y="192" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">Tn5 转座子饱和突变</text>
  <text x="620" y="238" font-size="11.5" fill="#475569" text-anchor="middle">逐个敲除非必需基因</text>
  <circle cx="1060" cy="216" r="6" fill="#1e293b"/>
  <text x="1060" y="192" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">JCVI-syn3.0（2016）</text>
  <text x="1060" y="238" font-size="11.5" fill="#475569" text-anchor="middle">531 kb · 473 基因的最小基因组</text>
  <rect x="56" y="286" width="620" height="78" rx="9" fill="#ccfbf1" fill-opacity="0.4" stroke="#0f766e" stroke-width="1.4"/>
  <text x="72" y="310" font-size="13" fill="#134e4a" font-weight="700">最小基因组的含义</text>
  <text x="72" y="332" font-size="11.5" fill="#475569">维持独立生命的最小基因目录（仍有未知功能者 149 个）——为「生命必需性」提供基线</text>
  <rect x="692" y="286" width="604" height="78" rx="9" fill="#ede9fe" fill-opacity="0.4" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="708" y="310" font-size="13" fill="#4c1d95" font-weight="700">自下而上（bottom-up）</text>
  <text x="708" y="332" font-size="11.5" fill="#475569">从标准化元件搭建新功能——启动子 / RBS / ORF / 终止子拼装为基因线路</text>
  <rect x="30" y="396" width="700" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="418.84" font-size="19" fill="#475569" font-weight="700">二、基因线路的标准装置与底盘细胞</text>
  <line x1="56" y1="462" x2="616" y2="462" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="57" y="447" width="121.2" height="30" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="117.6" y="495" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">启动子</text>
  <rect x="180.2" y="447" width="65.2" height="30" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="212.79999999999998" y="495" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">RBS</text>
  <rect x="247.39999999999998" y="447" width="266.8" height="30" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="380.79999999999995" y="495" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">ORF（目的基因）</text>
  <rect x="516.2" y="447" width="98.8" height="30" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="565.6" y="495" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">终止子</text>
  <text x="336" y="512" font-size="10.5" fill="#075985" text-anchor="middle">定强度（-35 / -10 / 间隔组合改造）</text>
  <text x="336" y="530" font-size="10.5" fill="#78350f" text-anchor="middle">RBS 计算模型（Salis）预测翻译起始速率</text>
  <ellipse cx="560" cy="560" rx="120" ry="62" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="560" y="548" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">底盘细胞（chassis）</text>
  <text x="560" y="568" font-size="10.5" fill="#64748b" text-anchor="middle">大肠杆菌 / 酵母提供</text>
  <text x="560" y="584" font-size="10.5" fill="#64748b" text-anchor="middle">转录翻译机器与代谢</text>
  <line x1="430" y1="486" x2="475" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="250" y="560" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="600">元件 → 底盘 → 功能</text>
  <text x="56" y="622" font-size="11.5" fill="#475569">BioBrick 标准化：统一接口的可拼装 DNA 元件库（iGEM 竞赛推动）；正交系统（T7 RNAP · 正交核糖体）隔离宿主干扰</text>
  <text x="56" y="656" font-size="11.5" fill="#475569">酵母合成染色体计划（Sc2.0）：全合成并重新设计酿酒酵母染色体（去重复 · 加 loxP 指纹）</text>
  <rect x="710" y="396" width="660" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="418.84" font-size="19" fill="#475569" font-weight="700">三、2000 年双突破：拨动开关与阻遏振荡器</text>
  <rect x="726" y="436" width="306" height="224" rx="9" fill="#ffffff" stroke="#be185d" stroke-width="1.4"/>
  <text x="879" y="460" font-size="12.5" fill="#831843" text-anchor="middle" font-weight="700">拨动开关（Gardner 等，2000）</text>
  <ellipse cx="800" cy="528" rx="58" ry="24" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <text x="800" y="533" font-size="12" fill="#831843" text-anchor="middle" font-weight="700">LacI</text>
  <ellipse cx="958" cy="528" rx="58" ry="24" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="958" y="533" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">TetR</text>
  <line x1="862" y1="516" x2="898" y2="516" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <line x1="898" y1="540" x2="862" y2="540" stroke="#b45309" stroke-width="2" marker-end="url(#arr-rna)"/>
  <text x="879" y="502" font-size="10.5" fill="#64748b" text-anchor="middle">相互抑制</text>
  <rect x="748.63495" y="583.075" width="82.7301" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="790" y="595.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">态 1：LacI 高</text>
  <rect x="926.63495" y="583.075" width="82.7301" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="968" y="595.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">态 2：TetR 高</text>
  <text x="879" y="628" font-size="11" fill="#475569" text-anchor="middle">双稳态记忆：诱导信号切换状态并保持</text>
  <rect x="1046" y="436" width="306" height="224" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="1199" y="460" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">阻遏振荡器（Elowitz 与 Leibler，2000）</text>
  <ellipse cx="1130" cy="516" rx="52" ry="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1130" y="521" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">LacI</text>
  <ellipse cx="1268" cy="516" rx="52" ry="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1268" y="521" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">TetR</text>
  <ellipse cx="1199" cy="592" rx="52" ry="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1199" y="597" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">CI</text>
  <line x1="1184" y1="510" x2="1214" y2="510" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <path d="M1240,538 C1226,566 1212,578 1199,570" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <path d="M1199,570 C1186,578 1172,566 1158,538" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="1199" y="628" font-size="11" fill="#475569" text-anchor="middle">三个阻遏子环形抑制 → 周期性振荡</text>
  <text x="726" y="665" font-size="11" fill="#64748b">逻辑门（AND / OR / NOT）以启动子组合 · RNA 开关（riboregulator / toehold）或 split-Cas9 实现；控制论设计</text>
  <text x="726" y="680" font-size="11" fill="#64748b">（比例-积分 · 类数字计数器）正被移植入细胞</text>
  <rect x="30" y="700" width="1340" height="260" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="722.84" font-size="19" fill="#475569" font-weight="700">四、代谢工程应用与治理：从青蒿酸到感知-响应线路</text>
  <rect x="56" y="744" width="720" height="130" rx="10" fill="#d1fae5" fill-opacity="0.35" stroke="#059669" stroke-width="1.5"/>
  <text x="416" y="770" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">酵母青蒿酸工程（Keasling 实验室）——抗疟药供应链的「植物提取 → 发酵罐」转型</text>
  <line x1="88" y1="816" x2="648" y2="816" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="89" y="801" width="188.4" height="30" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="183.2" y="849" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">甲羟戊酸途径改造</text>
  <rect x="279.4" y="801" width="188.4" height="30" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="373.59999999999997" y="849" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">紫穗槐二烯合酶 ADS</text>
  <rect x="469.79999999999995" y="801" width="177.20000000000002" height="30" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <text x="558.4" y="849" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">细胞色素 P450 级联</text>
  <line x1="660" y1="816" x2="700" y2="816" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <rect x="698.6875" y="805.375" width="54.625" height="21.25" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="726" y="820.5" font-size="12.5" fill="#059669" text-anchor="middle" font-weight="700">青蒿酸</text>
  <text x="720" y="850" font-size="11.5" fill="#059669" text-anchor="middle">化学半合成 → 青蒿素</text>
  <text x="416" y="866" font-size="11" fill="#64748b" text-anchor="middle">在酿酒酵母中引入的异源途径（工业化生产）</text>
  <rect x="796" y="744" width="548" height="62" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="812" y="766" font-size="11" fill="#475569">类似路线：大麻素 · 稀有人乳寡糖 · 生物燃料 · 可降解材料；感知-响应线路</text>
  <text x="812" y="782" font-size="11" fill="#475569">（检测炎症因子并输出抗炎因子）</text>
  <text x="812" y="792" font-size="11" fill="#475569">经调控细菌定植治疗代谢病</text>
  <rect x="796" y="816" width="548" height="58" rx="9" fill="#fef3c7" fill-opacity="0.35" stroke="#b45309" stroke-width="1.3"/>
  <text x="812" y="838" font-size="11" fill="#475569">深层议题与治理：密码子重定义与合成细胞是否模糊「自然 / 人工」边界？</text>
  <text x="812" y="854" font-size="11" fill="#475569">AI 辅助设计正在加速能力扩散——生物安全与开源规范需与技术同步演进。</text>
  <text x="700" y="920" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">工程学范式：抽象 · 标准化 · 解耦 · 预测——把生命系统变为可设计对象</text>
</svg>