  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">非平衡态热力学与耗散结构：从最小熵产生到时空自组织</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">线性区：最小熵产生（Onsager1931，1968诺奖）；跨过λc：涨落放大、分岔出耗散结构（Prigogine1977诺奖）——贝纳尔六角涡胞、糖酵解NADH振荡、黏菌/心电螺旋波；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">MEPP为强驱动区猜想；涨落定理推广到单分子</text>
  <rect x="30" y="132" width="1340" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、从平衡走向远离平衡：驱动强度跨过 λc 后涨落放大、分岔出有序</text>
  <rect x="110" y="181" width="560" height="215" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="110" y1="342.25" x2="670" y2="342.25" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
