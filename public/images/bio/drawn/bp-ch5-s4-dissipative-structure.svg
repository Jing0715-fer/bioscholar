  <text x="545" y="956.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">猜想性假说（Kleidon、Dewar）</text>
  <rect x="50" y="968" width="90" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="990.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">预言</text>
