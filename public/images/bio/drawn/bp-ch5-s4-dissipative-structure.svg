  <text x="306" y="418" font-size="13" fill="#64748b" text-anchor="middle">线性区</text>
  <line x1="457.2" y1="396" x2="457.2" y2="402" stroke="#475569" stroke-width="1.8"/>
  <text x="457.2" y="418" font-size="13" fill="#64748b" text-anchor="middle">λc（分岔点）</text>
  <line x1="647.6" y1="396" x2="647.6" y2="402" stroke="#475569" stroke-width="1.8"/>
  <text x="647.6" y="418" font-size="13" fill="#64748b" text-anchor="middle">强驱动</text>
