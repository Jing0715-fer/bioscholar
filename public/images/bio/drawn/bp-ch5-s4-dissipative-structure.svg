  <text x="730" y="852" font-size="13" fill="#1e293b" font-weight="700">单分子尺度的非平衡：随机热力学</text>
  <text x="730" y="878" font-size="10.5" fill="#475569">涨落定理与 Jarzynski/Crooks 关系把第二定律推广到小系统、短时间的涨落尺度，其修正项可在光镊拉伸、</text>
  <text x="730" y="892.5" font-size="10.5" fill="#475569">分子马达做功等单分子实验中直接验证。</text>
