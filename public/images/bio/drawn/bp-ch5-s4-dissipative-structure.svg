  <text x="130" y="222" font-size="9.5" fill="#64748b">（最小熵产生，稳定）</text>
  <text x="480" y="188" font-size="10.5" fill="#475569" font-weight="700">非线性区（远离平衡）</text>
  <text x="250" y="262" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">热力学分支（稳定 → 失稳）</text>
  <text x="500" y="244" font-size="10" fill="#dc2626" font-weight="700">涨落被放大 → 分岔</text>
  <text x="648" y="192" font-size="11" fill="#831843" text-anchor="end" font-weight="700">耗散结构分支</text>
  <rect x="720" y="176" width="620" height="250" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="740" y="202" font-size="13.5" fill="#1e293b" font-weight="700">两条原理的分工：近平衡 vs 远平衡</text>
  <rect x="740" y="216" width="580" height="96" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.4"/>
  <text x="756" y="240" font-size="12" fill="#065f46" font-weight="700">最小熵产生原理（线性区）</text>
  <text x="756" y="262" font-size="10.5" fill="#475569">Onsager 倒易关系（1931；1968 年诺贝尔化学奖）。靠近平衡的定态熵产生率最小，扰动后自动回归——稳定、</text>
  <text x="756" y="276" font-size="10.5" fill="#475569">可预测。</text>
  <rect x="740" y="324" width="580" height="96" rx="8" fill="#fce7f3" fill-opacity="0.5" stroke="#be185d" stroke-width="1.4"/>
  <text x="756" y="348" font-size="12" fill="#831843" font-weight="700">耗散结构（Prigogine，1977 年诺贝尔化学奖）</text>
  <text x="756" y="370" font-size="10.5" fill="#475569">持续强驱动、超出线性区：涨落不再被衰减而被放大，系统自发「结晶」出新的时空有序结构。</text>
  <text x="1030" y="440" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">有序以足够的熵产生为代价，且只在开放、远离平衡的条件下出现</text>
  <rect x="30" y="468" width="1340" height="292" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="490.84" font-size="19" fill="#475569" font-weight="700">二、三个层次的耗散结构例证：对流、振荡、时空波</text>
