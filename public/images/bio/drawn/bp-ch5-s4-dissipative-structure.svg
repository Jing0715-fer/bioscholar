  <text x="270" y="990.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">熵产生率取极小</text>
  <rect x="400" y="968" width="290" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
