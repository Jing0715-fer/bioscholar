  <text x="851" y="874" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">40°</text>
  <rect x="790" y="953.59" width="11.55" height="8.82" rx="3" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="809.55" y="961.78" font-size="10.5" fill="#475569">ATP 结合 → 80°</text>
  <rect x="905.565" y="953.59" width="11.55" height="8.82" rx="3" fill="#be185d" stroke="#cbd5e1" stroke-width="1"/>
  <text x="925.115" y="961.78" font-size="10.5" fill="#475569">水解 / 产物释放 → 40°</text>
  <text x="90" y="972" font-size="9.5" fill="#475569">驻留时间涨落明显：低 ATP 下步进间隔近似泊松过程（随机度 ~1）；高 ATP 下 F₁ 接近匀速——「马达的钟表」在分子尺度其实是统计规律。</text>
</svg>