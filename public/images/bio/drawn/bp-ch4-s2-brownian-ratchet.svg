  <text x="266" y="894" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">背步 −8 nm</text>
  <rect x="740" y="790" width="560" height="140" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="740" y1="930" x2="740" y2="936" stroke="#475569" stroke-width="1.8"/>
