    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">分子马达的随机步进：布朗棘轮与能量冲程</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">kinesin-1 恒定 8 nm 步长、与 ATP 水解 1:1 耦合；棘轮 = 选择性捕获热涨落，冲程 = 构象摆动直接做功（kinesin 杂化：15 pN·nm 偏置 + ~8 nm 受限扩散）；F₁ 台阶 120° = 80° + 40°</text>
  <rect x="30" y="132" width="1340" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、过程性与恒定步长：kinesin-1 的 1:1 机械化学耦合</text>
  <line x1="90" y1="300" x2="660" y2="300" stroke="#475569" stroke-width="3"/>
  <line x1="90" y1="300" x2="90" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="130" y1="300" x2="130" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="170" y1="300" x2="170" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="210" y1="300" x2="210" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="250" y1="300" x2="250" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="290" y1="300" x2="290" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="330" y1="300" x2="330" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="370" y1="300" x2="370" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="410" y1="300" x2="410" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="300" x2="450" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="490" y1="300" x2="490" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="530" y1="300" x2="530" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="570" y1="300" x2="570" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="610" y1="300" x2="610" y2="308" stroke="#475569" stroke-width="2"/>
  <line x1="650" y1="300" x2="650" y2="308" stroke="#475569" stroke-width="2"/>
  <text x="375" y="342" font-size="10.5" fill="#64748b" text-anchor="middle">微管：原聚体周期 8 nm</text>
  <circle cx="430" cy="287" r="13" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <circle cx="350" cy="258" r="13" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <line x1="360" y1="264" x2="419" y2="279" stroke="#6d28d9" stroke-width="2.4"/>
  <line x1="430" y1="274" x2="430" y2="210" stroke="#6d28d9" stroke-width="2.8"/>
  <rect x="398" y="182" width="64" height="28" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="430" y="200" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">货物</text>
  <line x1="350" y1="230" x2="470" y2="230" stroke="#be185d" stroke-width="2.4" marker-end="url(#arr-enz)"/>
  <text x="410" y="216" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">步进 8 nm（恒定）</text>
  <rect x="114.02" y="230.65" width="151.96" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="190" y="243.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">每步水解 1 个 ATP（1:1）</text>
  <text x="472" y="320" font-size="9.5" fill="#4c1d95" text-anchor="middle">前头（结合）</text>
  <text x="322" y="320" font-size="9.5" fill="#64748b" text-anchor="middle">后头（迈向下一位点）</text>
  <text x="70" y="378" font-size="10.5" fill="#475569">双手交替、两头上总有一头结合轨道：平均连续走 ~100 步、行程约 1 μm；低 ATP 浓度下步进频率严格正比于 [ATP]。</text>
  <rect x="820" y="190" width="500" height="140" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="820" y1="295" x2="1320" y2="295" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="945" y1="330" x2="945" y2="190" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="820" y1="260" x2="1320" y2="260" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1070" y1="330" x2="1070" y2="190" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="820" y1="225" x2="1320" y2="225" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="1195" y1="330" x2="1195" y2="190" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="820" y1="330" x2="820" y2="336" stroke="#475569" stroke-width="1.8"/>
  <text x="820" y="352" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="1320" y1="330" x2="1320" y2="336" stroke="#475569" stroke-width="1.8"/>
  <text x="1320" y="352" font-size="13" fill="#64748b" text-anchor="middle">t</text>
  <line x1="814" y1="330" x2="820" y2="330" stroke="#475569" stroke-width="1.8"/>
  <text x="810" y="334" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="814" y1="260" x2="820" y2="260" stroke="#475569" stroke-width="1.8"/>
  <text x="810" y="264" font-size="13" fill="#64748b" text-anchor="end">4 nm</text>
  <line x1="814" y1="190" x2="820" y2="190" stroke="#475569" stroke-width="1.8"/>
  <text x="810" y="194" font-size="13" fill="#64748b" text-anchor="end">8 nm</text>
  <text x="774" y="260" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">位置</text>
  <text x="1070" y="178" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">光镊位置记录：8 nm 台阶</text>
  <path d="M820.0,330.0 L870.0,330.0 L870.0,306.2 L940.0,306.2 L940.0,282.4 L1010.0,282.4 L1010.0,260.0 L1080.0,260.0 L1080.0,236.2 L1150.0,236.2 L1150.0,212.4 L1220.0,212.4 L1220.0,190.0 L1320.0,190.0" fill="none" stroke="#0369a1" stroke-width="3"/>
  <text x="830" y="388" font-size="10.5" fill="#475569">myosin V：沿肌动蛋白双螺旋每 36 nm 步进（半个螺旋周期），沿丝的中线「走钢丝」；myosin II：</text>
  <text x="830" y="402" font-size="10.5" fill="#475569">占空比仅 ~4%，单体不能过程行走——肌肉中靠数百个头「接力」。</text>
  <rect x="30" y="436" width="1340" height="262" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="458.84" font-size="19" fill="#475569" font-weight="700">二、两种驱动极限：布朗棘轮 vs 能量冲程（真实马达多为杂化）</text>
  <rect x="50" y="470" width="610" height="158" rx="8" fill="#fce7f3" fill-opacity="0.4" stroke="#be185d" stroke-width="1.2"/>
  <text x="70" y="496" font-size="13" fill="#831843" font-weight="700">布朗棘轮（Brownian ratchet）</text>
  <path d="M 90,560 L 150,514 L 150,560 L 210,514 L 210,560 L 270,514 L 270,560" fill="none" stroke="#be185d" stroke-width="2.4"/>
  <circle cx="180" cy="537" r="7" fill="#1e293b"/>
  <line x1="158" y1="502" x2="176" y2="502" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <line x1="176" y1="502" x2="194" y2="502" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-mute)"/>
  <line x1="150" y1="560" x2="150" y2="588" stroke="#dc2626" stroke-width="2.6"/>
  <text x="168" y="600" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">Pi 释放：选择性锁住前进态</text>
  <text x="330" y="528" font-size="10.5" fill="#475569">做功来自对扩散的选择性捕获：先由热涨落产生随机小步</text>
  <text x="330" y="542" font-size="10.5" fill="#475569">（前 / 后皆可），化学反应「选择性锁住」前进态；</text>
  <text x="330" y="556" font-size="10.5" fill="#475569">步进与化学事件不必一一同步。</text>
  <rect x="700" y="470" width="650" height="158" rx="8" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.2"/>
  <text x="720" y="496" font-size="13" fill="#075985" font-weight="700">能量冲程（power stroke）</text>
  <line x1="720" y1="560" x2="1000" y2="560" stroke="#dc2626" stroke-width="3"/>
  <line x1="720" y1="566" x2="1000" y2="566" stroke="#dc2626" stroke-width="3"/>
  <circle cx="860" cy="548" r="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.2"/>
  <line x1="848" y1="540" x2="812" y2="508" stroke="#0369a1" stroke-width="4"/>
  <line x1="872" y1="540" x2="908" y2="512" stroke="#075985" stroke-width="4"/>
  <path d="M 826,534 Q 852,492 896,522" fill="none" stroke="#be185d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-enz)"/>
  <text x="780" y="524" font-size="9.5" fill="#075985" text-anchor="middle">预存应变（上弦）</text>
  <text x="935" y="524" font-size="9.5" fill="#075985" text-anchor="middle">冲程后</text>
  <text x="1040" y="528" font-size="10.5" fill="#475569">化学态变化直接引发马达结构的大幅构象摆动</text>
  <text x="1040" y="542" font-size="10.5" fill="#475569">（如杠杆臂偏转），像释放的弹簧一样定向做功。</text>
  <text x="720" y="598" font-size="10" fill="#64748b">杂化实例：kinesin 前头结合微管后，颈部连接 docking 提供约 15 pN·nm 的前向偏置（冲程成分）；</text>
  <text x="720" y="611.5" font-size="10" fill="#64748b">前头还要经历 ~8 nm 的受限扩散才能捕获下一个结合位点（棘轮成分）。</text>
  <text x="50" y="666" font-size="10.5" fill="#475569">Feynman 棘轮–棘爪早已证明：与单一热源平衡且无耗散的装置不能定向做功。马达定向性的物理本质是 ATP 水解的不可逆性（远离平衡）打破细致平衡——以化学自由能的耗散为代价，从热噪声中「采购」定向运动。</text>
  <rect x="30" y="722" width="1340" height="258" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="744.84" font-size="19" fill="#475569" font-weight="700">三、步进统计：步长直方图与 F₁ 的 120° 台阶</text>
