  <text x="1236" y="610" font-size="11" fill="#92400e" font-weight="700">超极化 · 抑制放电</text>
  <text x="1100" y="712" font-size="11.5" fill="#475569" text-anchor="middle">DREADD 化学遗传学补足慢时间尺度（分钟级）</text>
  <rect x="30" y="740" width="1340" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="762.84" font-size="19" fill="#475569" font-weight="700">四、成像与全景时代：看见活动、看见全脑</text>
  <rect x="60" y="806" width="290" height="130" rx="9" fill="#6d28d9" fill-opacity="0.07" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="205" y="836" font-size="15.5" fill="#6d28d9" text-anchor="middle" font-weight="700">钙成像</text>
  <text x="84" y="866" font-size="11.5" fill="#475569">钙指示剂把放电翻译为荧光，</text>
  <text x="84" y="900" font-size="11.5" fill="#475569">群体活动可视化</text>
  <rect x="390" y="806" width="290" height="130" rx="9" fill="#0f766e" fill-opacity="0.07" stroke="#0f766e" stroke-width="1.6"/>
