  <rect x="130" y="500" width="140" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="200" y="531.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">脑电图 EEG</text>
  <rect x="270" y="500" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="350" y="531.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">Berger</text>
  <rect x="430" y="500" width="350" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="605" y="531.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">人头皮上无创记录脑的电活动</text>
  <rect x="60" y="552" width="720" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="552" width="70" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="583.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">1949</text>
  <rect x="130" y="552" width="140" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="200" y="583.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">玻璃微电极</text>
  <rect x="270" y="552" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="350" y="583.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">Ling &amp; Gerard</text>
  <rect x="430" y="552" width="350" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="605" y="583.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">尖端 &lt;1 μm，实现单细胞胞内记录——静息电位与动作电位数值可直读</text>
  <rect x="60" y="604" width="70" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="635.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">1976</text>
  <rect x="130" y="604" width="140" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="200" y="635.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">膜片钳</text>
  <rect x="270" y="604" width="160" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="350" y="635.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">Neher &amp; Sakmann</text>
  <rect x="430" y="604" width="350" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="605" y="635.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">吉欧（10 GΩ）封接骤降噪声，皮安级单通道电流可辨（1991 诺奖）</text>
  <rect x="60" y="668" width="720" height="40" rx="7" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.4"/>
  <text x="78" y="692" font-size="11.5" fill="#134e4a">电压钳（Hodgkin &amp; Huxley）先行分离离子电流，膜片钳再下探到单通道——电生理两级台阶。</text>
  <rect x="830" y="396" width="540" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="846" y="418.84" font-size="19" fill="#475569" font-weight="700">三、光遗传学：毫秒级、细胞类型特异的开关</text>
