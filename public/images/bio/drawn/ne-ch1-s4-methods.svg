  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">神经科学的研究方法：染色 · 电生理 · 成像 · 干预 · 连接组</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">1929EEG无创读脑；1949玻璃微电极（&lt;1μm）实现胞内记录；1976膜片钳以10GΩ封接记录皮安级单通道电流（1991诺奖）；1990双光子与BOLDfMRI开启成像时代；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">2005光遗传学以ChR2（蓝光约473nm）/NpHR（黄光约590nm）实现毫秒级操控；连接组学已绘线虫302（1986）与果蝇约14万神经元（2024）</text>
  <rect x="30" y="132" width="1340" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、读脑工具的六个时代：从染色到连接组</text>
  <rect x="56" y="190" width="196" height="122" rx="9" fill="#0369a1" fill-opacity="0.08" stroke="#0369a1" stroke-width="1.6"/>
  <text x="154" y="218" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="700">解剖学时代</text>
  <text x="154" y="252" font-size="11.5" fill="#475569" text-anchor="middle">高尔基 · 尼氏 · 髓鞘染色</text>
  <text x="154" y="276" font-size="11.5" fill="#475569" text-anchor="middle">HRP 逆行示踪通路</text>
  <text x="154" y="300" font-size="12" fill="#64748b" text-anchor="middle">↓</text>
  <rect x="274" y="190" width="196" height="122" rx="9" fill="#0f766e" fill-opacity="0.08" stroke="#0f766e" stroke-width="1.6"/>
  <text x="372" y="218" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">电生理时代</text>
  <text x="372" y="252" font-size="11.5" fill="#475569" text-anchor="middle">1949 玻璃微电极 &lt;1 μm</text>
  <text x="372" y="276" font-size="11.5" fill="#475569" text-anchor="middle">胞内记录 · 电压钳</text>
  <text x="372" y="300" font-size="12" fill="#64748b" text-anchor="middle">↓</text>
  <rect x="492" y="190" width="196" height="122" rx="9" fill="#6d28d9" fill-opacity="0.08" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="590" y="218" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="700">成像时代</text>
  <text x="590" y="252" font-size="11.5" fill="#475569" text-anchor="middle">钙成像 · 双光子 1990</text>
  <text x="590" y="276" font-size="11.5" fill="#475569" text-anchor="middle">fMRI BOLD 1990</text>
  <text x="590" y="300" font-size="12" fill="#64748b" text-anchor="middle">↓</text>
  <rect x="710" y="190" width="196" height="122" rx="9" fill="#be185d" fill-opacity="0.08" stroke="#be185d" stroke-width="1.6"/>
  <text x="808" y="218" font-size="15" fill="#be185d" text-anchor="middle" font-weight="700">干预时代</text>
  <text x="808" y="252" font-size="11.5" fill="#475569" text-anchor="middle">光遗传 ChR2 · NpHR</text>
  <text x="808" y="276" font-size="11.5" fill="#475569" text-anchor="middle">DREADD 化学遗传</text>
  <text x="808" y="300" font-size="12" fill="#64748b" text-anchor="middle">↓</text>
  <rect x="928" y="190" width="196" height="122" rx="9" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-width="1.6"/>
  <text x="1026" y="218" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">理论与计算</text>
  <text x="1026" y="252" font-size="11.5" fill="#475569" text-anchor="middle">Hodgkin-Huxley 类模型</text>
  <text x="1026" y="276" font-size="11.5" fill="#475569" text-anchor="middle">计算神经科学</text>
  <text x="1026" y="300" font-size="12" fill="#64748b" text-anchor="middle">↓</text>
  <rect x="1146" y="190" width="196" height="122" rx="9" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1.6"/>
  <text x="1244" y="218" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">全景时代</text>
  <text x="1244" y="252" font-size="11.5" fill="#475569" text-anchor="middle">透明脑 · 连接组学</text>
  <text x="1244" y="276" font-size="11.5" fill="#475569" text-anchor="middle">线虫 302 → 果蝇 14 万</text>
  <text x="1244" y="300" font-size="12" fill="#64748b" text-anchor="middle">↓</text>
  <line x1="254" y1="251" x2="272" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="472" y1="251" x2="490" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="690" y1="251" x2="708" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="908" y1="251" x2="926" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="1126" y1="251" x2="1144" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="30" y="396" width="780" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="418.84" font-size="19" fill="#475569" font-weight="700">二、电生理的阶梯：把电流变成数字</text>
  <rect x="60" y="456" width="70" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="95" y="483.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">年代</text>
  <rect x="130" y="456" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="200" y="483.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">技术</text>
