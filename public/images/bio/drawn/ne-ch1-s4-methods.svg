  <path d="M1180,566 q18,10 34,12" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="1011.5381" y="602.225" width="136.92380000000003" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1080" y="616.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">ChR2 / NpHR 表达于膜</text>
  <line x1="946" y1="468" x2="1056" y2="540" stroke="#0369a1" stroke-width="3" marker-end="url(#arr-acc)"/>
  <text x="940" y="452" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">蓝光 ≈473 nm</text>
  <rect x="935.2916" y="489.8" width="45.416799999999995" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="958" y="504.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">ChR2</text>
  <line x1="946" y1="668" x2="1056" y2="596" stroke="#d97706" stroke-width="3" marker-end="url(#arr-warn)"/>
  <text x="940" y="690" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">黄光 ≈590 nm</text>
