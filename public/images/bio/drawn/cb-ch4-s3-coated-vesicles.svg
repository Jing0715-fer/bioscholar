  <path d="M 815,262 q 32.5,-14 65,0 q 32.5,14 65,0" fill="#e0f2fe" fill-opacity="0.9" stroke="#0369a1" stroke-width="2"/>
  <text x="880" y="300" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">高尔基体</text>
  <circle cx="1070" cy="250" r="24" fill="#ffffff" stroke="#0f766e" stroke-width="2.4"/>
  <circle cx="1070" cy="250" r="31" fill="none" stroke="#dc2626" stroke-width="1.9" stroke-dasharray="5 4"/>
  <line x1="950" y1="246" x2="1036" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <text x="1070" y="300" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="600">COPI 小泡（逆向）</text>
  <g><circle cx="1150" cy="250" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="1150" y1="254" x2="1150" y2="259" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1150" cy="263" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="1174" cy="250" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="1174" y1="254" x2="1174" y2="259" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1174" cy="263" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="1198" cy="250" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="1198" y1="254" x2="1198" y2="259" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1198" cy="263" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="1222" cy="250" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="1222" y1="254" x2="1222" y2="259" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1222" cy="263" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="1246" cy="250" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="1246" y1="254" x2="1246" y2="259" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1246" cy="263" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="1270" cy="250" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="1270" y1="254" x2="1270" y2="259" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1270" cy="263" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="1294" cy="250" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="1294" y1="254" x2="1294" y2="259" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1294" cy="263" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="1318" cy="250" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="1318" y1="254" x2="1318" y2="259" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="1318" cy="263" r="5.5" fill="#0f766e" fill-opacity="0.85"/></g>
  <text x="1240" y="290" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="600">ER 膜</text>
  <line x1="1100" y1="250" x2="1142" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <circle cx="1070" cy="250" r="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="1070" y="222" font-size="10" fill="#78350f" text-anchor="middle">KDEL 受体货运</text>
  <text x="740" y="366" font-size="11.5" fill="#1e293b" font-weight="700">① Arf1 激活</text>
  <text x="850" y="355" font-size="10.5" fill="#475569">小 GTP 酶 Arf1 激活后招募七聚体 coatomer（αββ'δεγζ）形成包被</text>
  <text x="740" y="408" font-size="11.5" fill="#1e293b" font-weight="700">② 识别回收货物</text>
  <text x="850" y="397" font-size="10.5" fill="#475569">可溶性蛋白经 KDEL 受体识别 C 端 KDEL 序列；膜蛋白被直接识别 C 端 KKXX 基序</text>
  <text x="740" y="450" font-size="11.5" fill="#1e293b" font-weight="700">③ 维持驻留平衡</text>
  <text x="850" y="439" font-size="10.5" fill="#475569">同时维持高尔基体内部顺面驻留蛋白的回流</text>
  <text x="740" y="508" font-size="10.5" fill="#64748b">布雷菲德菌素 A（BFA）抑制 Arf 的 GEF → COPI 解离、高尔基体逆向融合入 ER，是研究分泌途径的经典工具药。</text>
  <rect x="30" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、网格蛋白包被小泡：TGN→内体与质膜→内体</text>
  <text x="140" y="640" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">三足蛋白 triskelion</text>
