  <circle cx="396" cy="716" r="4" fill="#d97706"/>
  <text x="360" y="780" font-size="10.5" fill="#475569" text-anchor="middle">多个三足蛋白聚合成多面体笼架</text>
  <text x="60" y="826" font-size="11.5" fill="#1e293b" font-weight="700">接头蛋白连接货物与网格蛋白：</text>
  <rect x="109.77" y="846.65" width="80.46000000000001" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="150" y="859.96" font-size="11" fill="#075985" text-anchor="middle">AP2（质膜）</text>
  <rect x="275.03" y="846.65" width="109.94" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="330" y="859.96" font-size="11" fill="#134e4a" text-anchor="middle">AP1 / GGA（TGN）</text>
  <text x="60" y="886" font-size="10.5" fill="#475569">TGN 处 AP1 与 GGA 识别 M6P 受体胞质尾的分选基序；质膜处小泡由 dynamin 缢断；负责溶酶体酶运输、</text>
  <text x="60" y="900.5" font-size="10.5" fill="#475569">受体内部化与质膜组分回收。</text>
  <text x="60" y="948" font-size="10" fill="#64748b">网格蛋白小泡同样需要脱包被后才能与靶膜融合。</text>
  <rect x="710" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="598.84" font-size="19" fill="#475569" font-weight="700">四、三类包被膜泡对照</text>
  <rect x="726" y="626" width="76" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="764" y="653.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">类型</text>
  <rect x="802" y="626" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="867" y="653.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">包被核心</text>
  <rect x="932" y="626" width="62" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="963" y="653.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">小 GTP 酶</text>
  <rect x="994" y="626" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1059" y="653.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">运输方向</text>
  <rect x="1124" y="626" width="230" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1239" y="653.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">主要货物</text>
  <rect x="726" y="670" width="76" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="764" y="701.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">COPII</text>
  <rect x="802" y="670" width="130" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="867" y="701.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">Sec23/24-Sec13/31</text>
  <rect x="932" y="670" width="62" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="963" y="701.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">Sar1</text>
  <rect x="994" y="670" width="130" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1059" y="701.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">ER→高尔基体</text>
  <rect x="1124" y="670" width="230" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1239" y="701.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">分泌蛋白、溶酶体酶原</text>
