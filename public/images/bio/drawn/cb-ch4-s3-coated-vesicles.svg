  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">三类包被膜泡：COPII、COPI 与网格蛋白</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">COPII（Sar1–Sec23/24–Sec13/31）介导 ER→高尔基体正向运输、Sec24 识别 exit 信号；COPI（Arf1–coatomer）回收 KDEL/KKXX 货物、BFA 使高尔基体崩解入 ER；网格蛋白经 AP1/GGA 与 AP2 接头选择货物</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、COPII 包被小泡：ER → 高尔基体正向运输</text>
  <g><circle cx="60" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="60" y1="304" x2="60" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="60" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="84" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="84" y1="304" x2="84" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="84" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="108" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="108" y1="304" x2="108" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="108" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="132" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="132" y1="304" x2="132" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="132" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="156" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="156" y1="304" x2="156" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="156" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="180" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="180" y1="304" x2="180" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="180" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="204" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="204" y1="304" x2="204" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="204" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="228" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="228" y1="304" x2="228" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="228" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="252" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="252" y1="304" x2="252" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="252" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="276" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="276" y1="304" x2="276" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="276" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/><circle cx="300" cy="300" r="5.5" fill="#0f766e" fill-opacity="0.85"/><line x1="300" y1="304" x2="300" y2="309" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="300" cy="313" r="5.5" fill="#0f766e" fill-opacity="0.85"/></g>
  <text x="185" y="340" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="600">ER 膜（ERES 出芽位点）</text>
  <rect x="128" y="280" width="34" height="20" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="145" y="294" font-size="9.5" fill="#059669" text-anchor="middle" font-weight="700">Sec12</text>
  <circle cx="100" cy="252" r="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="100" y="256" font-size="9" fill="#075985" text-anchor="middle" font-weight="700">Sar1</text>
  <text x="100" y="224" font-size="10" fill="#475569" text-anchor="middle">Sar1-GDP（GEF 激活）</text>
  <line x1="100" y1="268" x2="128" y2="282" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <circle cx="300" cy="240" r="24" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="300" cy="240" r="31" fill="none" stroke="#0369a1" stroke-width="1.9" stroke-dasharray="5 4"/>
  <path d="M 300,290 L 300,268" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="300" y="196" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="600">COPII 小泡（出芽）</text>
  <text x="60" y="366" font-size="11.5" fill="#1e293b" font-weight="700">① Sar1 激活</text>
  <text x="170" y="355" font-size="10.5" fill="#475569">小 GTP 酶 Sar1 被 ER 膜上 GEF（Sec12）激活，Sar1-GTP 的 N 端两性螺旋插入膜内启动出芽</text>
  <text x="60" y="408" font-size="11.5" fill="#1e293b" font-weight="700">② Sec23/Sec24</text>
  <text x="170" y="397" font-size="10.5" fill="#475569">Sar1 招募 Sec23/Sec24 异二聚体：Sec24 是货物识别核心，结合分泌蛋白胞质尾的 exit 信号</text>
  <text x="170" y="410.5" font-size="10.5" fill="#475569">（如二酸性基序 DxE）</text>
  <text x="60" y="450" font-size="11.5" fill="#1e293b" font-weight="700">③ Sec13/Sec31</text>
  <text x="170" y="439" font-size="10.5" fill="#475569">外层 Sec13/Sec31 形成笼架，完成包被</text>
  <text x="60" y="508" font-size="10.5" fill="#64748b">从 ERES 生成，经 ERGIC 送往顺面高尔基体；组成型、持续进行。约 1/3 的 ER 膜蛋白会「逃逸」到高尔基体，需 COPI 回收。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、COPI 包被小泡：高尔基体 → ER 逆向回收</text>
  <path d="M 852.7,210 q 13.65,-14 27.3,0 q 13.65,14 27.3,0" fill="#e0f2fe" fill-opacity="0.9" stroke="#0369a1" stroke-width="2"/>
