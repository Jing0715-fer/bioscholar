  <polygon points="300,660 380,640 440,690 420,745 330,750 280,705" fill="#fef3c7" fill-opacity="0.4" stroke="#d97706" stroke-width="1.8"/>
  <path d="M 340,690 L 340,681 L 334.4728870287177,670.7788912337846" fill="none" stroke="#d97706" stroke-width="2.6"/>
  <path d="M 340,690 L 347.79422863405995,694.5 L 359.4095249660875,694.8239341403907" fill="none" stroke="#d97706" stroke-width="2.6"/>
