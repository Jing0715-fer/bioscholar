  <text x="280" y="875" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">CCA</text>
  <rect x="322" y="858" width="72" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="358" y="875" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">GGG</text>
  <rect x="400" y="858" width="72" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="436" y="875" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">UCA</text>
  <rect x="478" y="858" width="72" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="514" y="875" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">AAU</text>
  <text x="60" y="910" font-size="12" fill="#475569" font-weight="700">新读框（整体移位，肽链序列彻底改变）：</text>
  <rect x="320" y="922" width="72" height="26" rx="4" fill="#ccfbf1" stroke="#134e4a" stroke-width="1.5"/>
  <text x="356" y="939" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">AUG</text>
  <rect x="398" y="922" width="72" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="434" y="939" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">CUU</text>
  <rect x="476" y="922" width="72" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="512" y="939" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">UCC</text>
  <rect x="554" y="922" width="72" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="590" y="939" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">AGG</text>
  <rect x="632" y="922" width="72" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="668" y="939" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">GUC</text>
  <rect x="710" y="922" width="72" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="746" y="939" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">AAA</text>
  <rect x="788" y="922" width="72" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="824" y="939" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="700">U…</text>
  <text x="660" y="788" font-size="11" fill="#475569">插入 / 缺失非 3 倍数核苷酸引起移码突变——Brenner 等用 T4 rII 移码突变首次证明三联体阅读方式。</text>
  <text x="660" y="838" font-size="11" fill="#475569">部分病毒基因用程序性核糖体移码（-1 frameshift）以一个基因产出两种蛋白（如逆转录病毒的 gag-pol 融合）</text>
  <text x="660" y="854" font-size="11" fill="#475569">——「框架」也可被 RNA 结构主动调控。</text>
  <text x="660" y="900" font-size="11" fill="#64748b">密码子在绝大多数生物中通用，是生命同源性的有力证据，使异源表达与进化比较成为可能。</text>
</svg>