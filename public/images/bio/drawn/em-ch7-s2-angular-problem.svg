  <line x1="1246.112011030745" y1="238.20218497572142" x2="1253.887988969255" y2="361.7978150242786" stroke="#dc2626" stroke-width="2.2" opacity="0.8"/>
  <line x1="1247.4070595210878" y1="238.1343143602787" x2="1252.5929404789122" y2="361.86568563972133" stroke="#dc2626" stroke-width="2.2" opacity="0.8"/>
  <line x1="1248.7032453608226" y1="238.09358007923757" x2="1251.2967546391774" y2="361.90641992076246" stroke="#dc2626" stroke-width="2.2" opacity="0.8"/>
