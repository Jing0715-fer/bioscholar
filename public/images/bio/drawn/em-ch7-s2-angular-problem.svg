  <line x1="1256.4724024455331" y1="238.4192042387965" x2="1243.5275975544669" y2="361.5807957612035" stroke="#dc2626" stroke-width="2.2" opacity="0.8"/>
  <circle cx="1250" cy="300" r="3.5" fill="#1e293b"/>
  <text x="1250" y="398" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="700">优势取向</text>
  <text x="1250" y="416" font-size="9.5" fill="#64748b" text-anchor="middle">单一视角信息论上不可重构</text>
  <text x="730" y="462" font-size="10.5" fill="#475569">优势取向是单颗粒最常见失败模式：颗粒贴附界面或择优躺平，中心截面挤成一束——缺失锥使分辨率各向异性，</text>
  <text x="730" y="477" font-size="10.5" fill="#475569">单一视角数据在信息论意义上不可重构，取向加权与倾斜数据收集只能部分补救。</text>
  <rect x="30" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、无参考定向：共线法与随机锥形重构</text>
  <circle cx="190" cy="700" r="78" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="120" y1="660" x2="258" y2="742" stroke="#0f766e" stroke-width="2.4"/>
  <line x1="126" y1="748" x2="254" y2="655" stroke="#6d28d9" stroke-width="2.4"/>
  <line x1="190" y1="626" x2="190" y2="774" stroke="#be185d" stroke-width="2.6"/>
  <text x="190" y="610" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">公共线（过原点）</text>
  <circle cx="190" cy="700" r="3.5" fill="#1e293b"/>
  <text x="190" y="792" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">两个中心截面必交于公共线</text>
  <text x="80" y="830" font-size="10.5" fill="#475569">共线法：van Heel 1987 年 angular reconstitution 从几张最清晰的 2D 类平均出发，搜索使公共线一致的相对取向，</text>
  <text x="80" y="845" font-size="10.5" fill="#475569">以多组三投影投票自举（bootstrap）出低分辨率初始模型——无须任何外部参考。</text>
  <rect x="163.87385000000006" y="891.075" width="392.2522999999999" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="360" y="903.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">随机锥形重构（Radermacher，1981 年前后构想、1986–1987 年系统发表）</text>
  <text x="80" y="938" font-size="10.5" fill="#475569">倾转已知角度 α 加 0 度两张照片：0 度像定面内角、倾转像补第三维，</text>
  <text x="80" y="953" font-size="10.5" fill="#475569">两像的取向共同张出一个锥面覆盖——用实验设计绕开取向搜索。</text>
  <rect x="710" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、现代 ab initio 与参考偏差的防线</text>
  <rect x="730" y="616" width="620" height="84" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1040" y="642" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">cryoSPARC ab initio（Punjani 2017）</text>
  <text x="1040" y="664" font-size="10.5" fill="#475569" text-anchor="middle">随机初始模型 + SGD 联合优化取向与密度 + 频率由低到高爬升</text>
  <text x="1040" y="686" font-size="10" fill="#64748b" text-anchor="middle">对小于约 100 kDa 的样品常须百万级颗粒才稳</text>
  <line x1="1040" y1="704" x2="1040" y2="730" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="730" y="756" font-size="11" fill="#1e293b" font-weight="700">参考偏差风险由 Dotson 与 Glaeser 2016 年论战推到台前，防线成套：</text>
  <rect x="736.34" y="779.075" width="247.32000000000002" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="860" y="791.78" font-size="10.5" fill="#065f46" text-anchor="middle">金标准半图精修与 FSC 0.143（Scheres 2012）</text>
  <rect x="1108" y="779.075" width="144" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1180" y="791.78" font-size="10.5" fill="#065f46" text-anchor="middle">参考低通滤波防噪声入参考</text>
  <rect x="793.25" y="811.075" width="133.5" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="860" y="823.78" font-size="10.5" fill="#065f46" text-anchor="middle">纯噪声对照检验虚假信号</text>
  <rect x="1118.5" y="811.075" width="123" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1180" y="823.78" font-size="10.5" fill="#065f46" text-anchor="middle">独立初始模型交叉验证</text>
  <text x="730" y="862" font-size="11" fill="#1e293b" font-weight="700">定向与初始模型方法对照：</text>
  <rect x="730" y="878" width="230" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="845" y="905.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">方法</text>
  <rect x="960" y="878" width="180" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1050" y="905.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">依赖</text>
  <rect x="1140" y="878" width="210" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1245" y="905.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">主要风险</text>
  <rect x="730" y="922" width="230" height="26" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="845" y="940.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">共线法 / angular reconstitution</text>
