  <text x="1040" y="244" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">缺失锥</text>
  <text x="1040" y="398" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="700">缺失锥/缺失楔</text>
  <text x="1040" y="416" font-size="9.5" fill="#64748b" text-anchor="middle">密度沿缺失方向拉长</text>
