  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">三维重构的角度问题：Crowther 判据与取向覆盖</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">N≈πD/d（D=100Å：10Å约32个视角、4Å约80、2Å约157）；缺失锥与优势取向是失败主因，共线法、随机锥形与abinitio各自给出无参考定向路线</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Crowther 判据：视角数的几何账</text>
  <text x="50" y="184" font-size="14" fill="#1e293b" font-weight="700">N<tspan dy="3.1" font-size="10.1">view</tspan><tspan dy="-3.1"> ≈ πD/d（Crowther、DeRosier 与 Klug，1970）</tspan></text>
  <text x="50" y="208" font-size="10.5" fill="#475569">直径 D 的颗粒要无混叠地分辨尺度 d 的细节，需约 πD/d 个均匀分布的投影：相邻中心截面的角间隔不超过 d/D 量级，</text>
  <text x="50" y="223" font-size="10.5" fill="#475569">才不致把高频信息折叠混叠。</text>
  <rect x="102.8" y="356.9142857142857" width="81.06666666666668" height="31.085714285714285" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="143.33333333333334" y="347.9142857142857" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">约 32</text>
  <text x="143.33333333333334" y="408" font-size="12.5" fill="#64748b" text-anchor="middle">d = 10 Å</text>
  <rect x="229.4666666666667" y="310.2857142857143" width="81.06666666666668" height="77.71428571428571" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="270" y="301.2857142857143" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">约 80</text>
  <text x="270" y="408" font-size="12.5" fill="#64748b" text-anchor="middle">d = 4 Å</text>
  <rect x="356.1333333333334" y="235.4857142857143" width="81.06666666666668" height="152.5142857142857" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="396.6666666666667" y="226.4857142857143" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">约 157</text>
  <text x="396.6666666666667" y="408" font-size="12.5" fill="#64748b" text-anchor="middle">d = 2 Å</text>
  <text x="270" y="300" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">固定 D = 100 Å：分辨率每提高一倍，所需视角翻倍</text>
  <text x="270" y="436" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">目标分辨率 d</text>
  <text x="480" y="318" font-size="10.5" fill="#475569">两点必须强调：其一，</text>
  <text x="480" y="333" font-size="10.5" fill="#475569">均匀分布是前提——200 个挤在同一方向的投影，</text>
  <text x="480" y="348" font-size="10.5" fill="#475569">不及 80 个均匀铺开的视角；其二，</text>
  <text x="480" y="363" font-size="10.5" fill="#475569">判据只算几何账，</text>
  <text x="480" y="378" font-size="10.5" fill="#475569">统计账须再乘几个数量级，</text>
  <text x="480" y="393" font-size="10.5" fill="#475569">10<tspan dy="-3.6" font-size="7.6">5</tspan><tspan dy="3.6"> 级颗粒数据集由此而来。</tspan></text>
  <rect x="468.2575" y="443.075" width="223.485" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="580" y="455.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">大复合物「高分辨须大颗粒数」的定量出处</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、傅里叶空间的取向覆盖：三种命运</text>
