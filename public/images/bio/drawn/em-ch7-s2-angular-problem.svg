  <line x1="890.1207173350211" y1="285.1815740673144" x2="769.8792826649789" y2="314.8184259326856" stroke="#059669" stroke-width="2.2" opacity="0.8"/>
  <circle cx="830" cy="300" r="3.5" fill="#1e293b"/>
  <text x="830" y="398" font-size="11.5" fill="#065f46" text-anchor="middle" font-weight="700">均匀覆盖</text>
  <text x="830" y="416" font-size="9.5" fill="#64748b" text-anchor="middle">中心截面稠密铺满体积</text>
  <path d="M 1040,300 L 992,246 A 72,72 0 0 1 992,354 Z" fill="#fee2e2" fill-opacity="0.8" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
