  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">体液免疫应答的规律：初次与再次应答、抗体持久性与母传抗体</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">初次应答潜伏期约 5–10 天、IgM 起步、平台低而亲和力低；再次应答潜伏期约 1–3 天、IgG 为主、平台高数倍至数十倍且维持更久；IgG 血清半衰期约 23 天（IgG3 约一周、IgM 约 5 天、IgE 约 2 天），经 FcRn 酸性内体拾取-中性释放的回收循环延寿；长期维持由骨髓生存龛长寿浆细胞不依赖抗原持续供给；母体 IgG 经胎盘 FcRn 转运（孕晚期最活跃）、母乳 sIgA 覆盖黏膜构成被动免疫，脐血 IgM 升高提示宫内感染，母传 IgG 干扰疫苗应答故麻疹疫苗约 9 月龄前后接种</text>
