  <rect x="258" y="580" width="130" height="46" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="323" y="600" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">酸性内体</text>
  <text x="323" y="616" font-size="9" fill="#64748b" text-anchor="middle">FcRn 结合</text>
  <line x1="392" y1="603" x2="432" y2="603" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="436" y="580" width="130" height="46" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="501" y="600" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">中性 pH 释放</text>
  <text x="501" y="616" font-size="9" fill="#64748b" text-anchor="middle">IgG 回血</text>
  <text x="78" y="654" font-size="10.5" fill="#075985" font-weight="600">治疗性单抗每数周给药一次的药理节律即由此而来。</text>
