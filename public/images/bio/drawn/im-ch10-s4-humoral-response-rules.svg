  <text x="1084" y="560" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">IgA</text>
  <text x="1084" y="576" font-size="9" fill="#475569" text-anchor="middle">约数日</text>
  <rect x="1163" y="544" width="132" height="40" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
  <text x="1229" y="560" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">IgE</text>
  <text x="1229" y="576" font-size="9" fill="#475569" text-anchor="middle">约 2 天</text>
  <text x="728" y="610" font-size="10.5" fill="#475569">血清抗体的长期维持另有账本：骨髓生存龛中的长寿浆细胞持续供给——不依赖抗原存在，由 CXCL12⁺ 基质细胞与 APRIL</text>
  <text x="728" y="625" font-size="10.5" fill="#475569">（经 BCMA）、IL-6 等信号供养，可存活数月至数十年乃至终宿主一生。</text>
  <rect x="30" y="718" width="1340" height="256" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="740.84" font-size="19" fill="#475569" font-weight="700">三、母传抗体：「母传让位、自体接棒」的儿科免疫经典图景</text>
