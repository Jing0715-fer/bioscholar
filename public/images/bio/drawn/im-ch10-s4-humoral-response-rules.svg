  <text x="728" y="526" font-size="12.5" fill="#134e4a" font-weight="700">半衰期账本与长寿浆细胞</text>
  <rect x="728" y="544" width="132" height="40" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
