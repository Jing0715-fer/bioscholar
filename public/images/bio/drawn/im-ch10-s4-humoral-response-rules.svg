  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">二、抗体的持久性：FcRn 回收延寿 + 骨髓长寿浆细胞的细水长流</text>
  <rect x="60" y="502" width="620" height="182" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.6"/>
  <text x="78" y="526" font-size="12.5" fill="#075985" font-weight="700">FcRn 回收循环：IgG 的长寿保险</text>
  <text x="78" y="550" font-size="10.5" fill="#475569">组织细胞胞饮摄入的 IgG 在酸性内体中被 FcRn 拾起，护送至细胞表面、于中性 pH 释放回血——免于溶酶体降解的往返。</text>
  <rect x="90" y="580" width="120" height="46" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.4"/>
  <text x="150" y="606" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">胞饮摄入</text>
