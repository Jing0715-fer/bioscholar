<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">注释层级：RefSeq 代表序列与 UniProtKB 审阅层</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">RefSeq以NM_/NP_（策展）与XM_/XP_（预测，随注释版本变动）为每个基因提供唯一代表；UniProtKB手工审阅约50余万条、自动注释数亿条，相差约三个数量级；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">注释沿「文献→审阅层→自动层」传播——视数据库为带时间戳的假说集合</text>
  <rect x="30" y="132" width="640" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、RefSeq：给每个基因一位代表序列</text>
  <rect x="60" y="216" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="243.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">前缀</text>
  <rect x="170" y="216" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="243.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">对象</text>
  <rect x="340" y="216" width="300" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="490" y="243.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">层级</text>
  <rect x="60" y="260" width="110" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="289.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">NM_</text>
  <rect x="170" y="260" width="170" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="289.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">mRNA</text>
  <rect x="340" y="260" width="300" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="490" y="289.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">策展层（人工审阅）</text>
  <rect x="60" y="308" width="580" height="48" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="308" width="110" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="337.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">NP_</text>
  <rect x="170" y="308" width="170" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="337.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">蛋白</text>
  <rect x="340" y="308" width="300" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="490" y="337.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">策展层（人工审阅）</text>
  <rect x="60" y="356" width="110" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="385.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">XM_</text>
  <rect x="170" y="356" width="170" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="385.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">预测 mRNA</text>
  <rect x="340" y="356" width="300" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="490" y="385.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">预测层（随注释版本变动）</text>
  <rect x="60" y="404" width="580" height="48" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="404" width="110" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="433.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">XP_</text>
  <rect x="170" y="404" width="170" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="255" y="433.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">预测蛋白</text>
  <rect x="340" y="404" width="300" height="48" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="490" y="433.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">预测层（随注释版本变动）</text>
  <rect x="60" y="462" width="580" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="78" y="486" font-size="11.5" fill="#475569">RefSeq 以策展为每个基因提供唯一代表序列：NM_/NP_ 稳定可靠；XM_/XP_ 属预测层，</text>
  <text x="78" y="503" font-size="11.5" fill="#475569">会随注释版本的更新而变动——引用前先看清前缀。</text>
  <rect x="690" y="132" width="680" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="706" y="154.84" font-size="19" fill="#475569" font-weight="700">二、UniProtKB：审阅层与自动层</text>
  <polygon points="900,246 1030,246 1062,330 868,330" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="965" y="282" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">Swiss-Prot 手工审阅</text>
  <text x="965" y="308" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">≈ 50 余万条</text>
  <polygon points="868,330 1062,330 1100,418 830,418" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="965" y="364" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">TrEMBL 自动注释</text>
  <text x="965" y="390" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">数亿条量级</text>
  <line x1="1150" y1="246" x2="1150" y2="418" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-bad)" marker-start="url(#arr-bad)"/>
  <text x="1166" y="316" font-size="11.5" fill="#dc2626" font-weight="700">相差约三个数量级</text>
  <text x="852" y="288" font-size="11.5" fill="#4c1d95" text-anchor="end" font-weight="700">准确优先</text>
  <text x="818" y="384" font-size="11.5" fill="#64748b" text-anchor="end" font-weight="700">覆盖优先</text>
  <rect x="720" y="452" width="620" height="84" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.3"/>
  <text x="738" y="474" font-size="11.5" fill="#475569">每条注释带证据代码；蛋白存在性以五级等级（PE）显式编码——把「怎么知道的」写进条目，引用前应查看。</text>
  <rect x="30" y="576" width="1340" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、注释的传播链：放大覆盖，也放大错误与陈旧</text>
  <rect x="70" y="652" width="292" height="84" rx="10" fill="#d1fae5" fill-opacity="0.6" stroke="#059669" stroke-width="1.8"/>
  <text x="216" y="682" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">原始文献</text>
  <text x="216" y="710" font-size="11.5" fill="#475569" text-anchor="middle">实验证据 · 一次结论</text>
  <line x1="366" y1="694" x2="388" y2="694" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="377" y="676" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">人工审阅</text>
  <rect x="394" y="652" width="292" height="84" rx="10" fill="#ede9fe" fill-opacity="0.6" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="540" y="682" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="700">审阅层</text>
  <text x="540" y="710" font-size="11.5" fill="#475569" text-anchor="middle">Swiss-Prot 人工整合</text>
  <line x1="690" y1="694" x2="712" y2="694" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="701" y="676" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">自动传播</text>
  <rect x="718" y="652" width="292" height="84" rx="10" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.8"/>
  <text x="864" y="682" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="700">自动层</text>
  <text x="864" y="710" font-size="11.5" fill="#475569" text-anchor="middle">TrEMBL 计算推断 · 批量传播</text>
  <line x1="1014" y1="694" x2="1036" y2="694" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="1025" y="676" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">放大</text>
  <rect x="1042" y="652" width="292" height="84" rx="10" fill="#f1f5f9" fill-opacity="0.6" stroke="#64748b" stroke-width="1.8"/>
  <text x="1188" y="682" font-size="15" fill="#64748b" text-anchor="middle" font-weight="700">下游</text>
  <text x="1188" y="710" font-size="11.5" fill="#475569" text-anchor="middle">数据库与论文引用</text>
  <rect x="70" y="762" width="1296" height="64" rx="8" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="90" y="786" font-size="12" fill="#dc2626">错误与陈旧沿链放大：一次误注会被自动层批量复制到下游——把数据库视为「带时间戳的假说集合」，关键结论须回溯原始证据。</text>
  <rect x="70" y="848" width="628" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="90" y="872" font-size="12.5" fill="#1e293b" font-weight="700">引用前自检三步</text>
  <text x="90" y="894" font-size="11.5" fill="#475569">① 查证据代码（实验 / 电子）</text>
  <rect x="738" y="848" width="628" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="758" y="872" font-size="12.5" fill="#1e293b" font-weight="700">选层级的本质</text>
  <text x="758" y="894" font-size="11.5" fill="#475569">覆盖面（自动层）与可信度（审阅层）的取舍</text>
</svg>