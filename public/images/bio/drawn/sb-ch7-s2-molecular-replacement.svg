<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">分子置换：Patterson 旋转/平移两步搜索与现代实践</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">P(u)=Σ|F|<tspan dy="-5.8" font-size="12.2">2</tspan><tspan dy="5.8">exp(−2πih·u)免相位；旋转函数定取向（Rossmann-Blow1962）＋平移定位置＋packing闸门；PhaserTFZ大于8判定；同源大于30%直接用／小于20%用</tspan></text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">AlphaFold（pLDDT剪枝）</text>
  <rect x="30" y="132" width="660" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Patterson 函数：不用相位的相关图</text>
  <rect x="23.89755000000001" y="159.375" width="172.20489999999998" height="21.25" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="110" y="174.5" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">P(u) = Σ |F|<tspan dy="-4.3" font-size="9.0">2</tspan><tspan dy="4.3"> exp(−2πi h·u)</tspan></text>
  <text x="60" y="205" font-size="10.5" fill="#475569">以 |F|² 为系数的傅里叶合成——无需相位即可计算；每个峰对应一对原子间的位移向量（峰高 ~ Z<tspan dy="2.3" font-size="7.6">1</tspan><tspan dy="-2.3">Z</tspan><tspan dy="2.3" font-size="7.6">2</tspan><tspan dy="-2.3">）。分子内向量聚成特征簇，</tspan></text>
  <text x="60" y="220" font-size="10.5" fill="#475569">其位置只随分子取向变化、不随平移变化——这是旋转函数的罗盘。</text>
  <rect x="90" y="260" width="180" height="150" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="180" y="278" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">分子（5 原子示意）</text>
  <circle cx="130" cy="320" r="5" fill="#0f766e" stroke="none"/>
  <circle cx="175" cy="305" r="5" fill="#0f766e" stroke="none"/>
  <circle cx="215" cy="330" r="5" fill="#0f766e" stroke="none"/>
  <circle cx="155" cy="355" r="5" fill="#0f766e" stroke="none"/>
  <circle cx="205" cy="380" r="5" fill="#0f766e" stroke="none"/>
  <rect x="300" y="260" width="180" height="150" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="390" y="278" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">分子内向量簇</text>
  <circle cx="408.9" cy="328.7" r="2.2" fill="#0f766e" stroke="none"/>
  <circle cx="425.7" cy="339.2" r="2.2" fill="#0f766e" stroke="none"/>
  <circle cx="400.5" cy="349.7" r="2.2" fill="#0f766e" stroke="none"/>
  <circle cx="421.5" cy="360.2" r="2.2" fill="#0f766e" stroke="none"/>
  <circle cx="406.8" cy="345.5" r="2.2" fill="#0f766e" stroke="none"/>
  <circle cx="381.6" cy="356" r="2.2" fill="#0f766e" stroke="none"/>
  <circle cx="402.6" cy="366.5" r="2.2" fill="#0f766e" stroke="none"/>
  <circle cx="364.8" cy="345.5" r="2.2" fill="#0f766e" stroke="none"/>
  <circle cx="385.8" cy="356" r="2.2" fill="#0f766e" stroke="none"/>
  <circle cx="411" cy="345.5" r="2.2" fill="#0f766e" stroke="none"/>
  <line x1="275" y1="335" x2="295" y2="335" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="500" y="290" font-size="10.5" fill="#475569">把「分子内向量簇」当作指纹：</text>
  <text x="500" y="305" font-size="10.5" fill="#475569">晶体 Patterson 与模型 Patterson 在取向空间互相关，</text>
  <text x="500" y="320" font-size="10.5" fill="#475569">峰值即正确取向——旋转函数</text>
  <text x="500" y="335" font-size="10.5" fill="#475569">（Rossmann 与 Blow 1962 年；</text>
  <text x="500" y="350" font-size="10.5" fill="#475569">Crowther 1972 年快速实现）。</text>
  <text x="500" y="390" font-size="10.5" fill="#475569">取向固定后，</text>
  <text x="500" y="405" font-size="10.5" fill="#475569">沿晶格三个方向平移搜索使交叉向量匹配——平移函数给出分子在晶胞中的位置。</text>
  <rect x="710" y="132" width="660" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、旋转 → 平移 → packing 三道闸门</text>
  <rect x="722.3351" y="175.225" width="75.3298" height="19.55" rx="7" fill="#0369a122" stroke="#0369a1" stroke-width="1.5"/>
  <text x="760" y="189.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">① 旋转函数</text>
  <text x="880" y="189" font-size="10.5" fill="#475569">模型取向扫描（角度网格/快速 FFT）</text>
  <line x1="800" y1="203" x2="800" y2="219" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="722.3351" y="227.225" width="75.3298" height="19.55" rx="7" fill="#0f766e22" stroke="#0f766e" stroke-width="1.5"/>
  <text x="760" y="241.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">② 平移函数</text>
  <text x="880" y="241" font-size="10.5" fill="#475569">三轴平移搜索交叉峰</text>
  <line x1="800" y1="255" x2="800" y2="271" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="711.9115" y="279.225" width="96.177" height="19.55" rx="7" fill="#d9770622" stroke="#d97706" stroke-width="1.5"/>
  <text x="760" y="293.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">③ packing 检验</text>
  <text x="880" y="293" font-size="10.5" fill="#475569">排除分子碰撞的物理解</text>
  <line x1="800" y1="307" x2="800" y2="323" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <rect x="713.2144499999999" y="331.225" width="93.5711" height="19.55" rx="7" fill="#05966922" stroke="#059669" stroke-width="1.5"/>
  <text x="760" y="345.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">④ Phaser 判读</text>
  <text x="880" y="345" font-size="10.5" fill="#475569">LLG 显著为正、TFZ 分档</text>
  <text x="730" y="410" font-size="10.5" fill="#475569">TFZ 分档：大于 8 大概率正确解、5–8 存疑需复核；多拷贝时递增搜索（逐个加上并重跑平移）。</text>
  <text x="730" y="426" font-size="10.5" fill="#475569">ensemble 多模型平均可把约 1 Å 的模型误差压缩过半。</text>
  <rect x="30" y="482" width="660" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="504.84" font-size="19" fill="#475569" font-weight="700">三、模型来源决策（AlphaFold 时代）</text>
  <rect x="50" y="522" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="549.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">来源</text>
  <rect x="220" y="522" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="549.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">序列一致性</text>
  <rect x="360" y="522" width="310" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="549.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">操作</text>
  <rect x="50" y="566" width="170" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="591.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">PDB 同源结构</text>
  <rect x="220" y="566" width="140" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="591.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">大于 30%</text>
  <rect x="360" y="566" width="310" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="591.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">直接使用，成功率最高</text>
  <rect x="50" y="606" width="620" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="606" width="170" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="631.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">同源需修剪</text>
  <rect x="220" y="606" width="140" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="631.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">20–30%</text>
  <rect x="360" y="606" width="310" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="631.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">Sculptor/CHAINSAW 截侧链</text>
  <rect x="50" y="646" width="170" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="671.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">AlphaFold 预测</text>
  <rect x="220" y="646" width="140" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="671.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">小于 20%</text>
  <rect x="360" y="646" width="310" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="671.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">按 pLDDT 剪枝后常能破局</text>
  <rect x="50" y="686" width="620" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="686" width="170" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="711.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">多模型 ensemble</text>
  <rect x="220" y="686" width="140" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="290" y="711.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">多候选</text>
  <rect x="360" y="686" width="310" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="711.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">平均降误差约一半</text>
  <text x="50" y="706" font-size="10.5" fill="#475569">AF2 模型主链精度（pLDDT 大于 90 时约 1 Å）已与优质同源模型相当——分子置换成功率在预测时代大幅跃升。</text>
  <rect x="710" y="482" width="660" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="504.84" font-size="19" fill="#475569" font-weight="700">四、四大陷阱与退路</text>
  <circle cx="740" cy="522" r="5" fill="#dc2626" stroke="none"/>
  <text x="756" y="526" font-size="10.5" fill="#475569">假解：LLG 边缘值、精修 R 不降、图不成蛋白样</text>
  <circle cx="740" cy="558" r="5" fill="#d97706" stroke="none"/>
  <text x="756" y="562" font-size="10.5" fill="#475569">空间群错：指标化歧义/伪对称——重索引后重试</text>
  <circle cx="740" cy="594" r="5" fill="#0369a1" stroke="none"/>
  <text x="756" y="598" font-size="10.5" fill="#475569">多拷贝 NCS：顺序搜索 + packing 把关</text>
  <circle cx="740" cy="630" r="5" fill="#0f766e" stroke="none"/>
  <text x="756" y="634" font-size="10.5" fill="#475569">低分辨率：强 NCS 限制 + 密度修饰救图</text>
  <text x="730" y="688" font-size="10.5" fill="#475569">退路：MR-SAD 组合（弱模型＋弱反常互补）、换结晶条件、回到实验定相（第 7 章第 3 节）。</text>
  <text x="700" y="770" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="600">分子置换把「已知」借给「未知」——先用模型粗略定相、再让数据逐步说服几何</text>
</svg>