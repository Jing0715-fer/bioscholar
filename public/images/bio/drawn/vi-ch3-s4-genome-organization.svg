<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">基因组的策略性组织：重叠基因、时序排布与嵌套转录</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">φX174 以 5,386 nt 容纳 11 个基因（B 嵌于 A、E 嵌于 D）；HBV 四阅读框重叠；IRES 赋予帽独立性；冠状病毒经 TRS 产生共享前导的嵌套 sg mRNA</text>
  <rect x="30" y="132" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、重叠基因：小基因组的极限压缩</text>
  <path d="M 170.0,190.0 A 72,72 0 0 1 235.3,292.4" fill="none" stroke="#0f766e" stroke-width="11"/>
  <path d="M 232.4,298.0 A 72,72 0 0 1 194.6,329.7" fill="none" stroke="#0f766e" stroke-width="11"/>
  <path d="M 188.6,331.5 A 72,72 0 0 1 102.3,286.6" fill="none" stroke="#0f766e" stroke-width="11"/>
  <path d="M 100.5,280.6 A 72,72 0 0 1 104.7,231.6" fill="none" stroke="#0f766e" stroke-width="11"/>
  <path d="M 107.6,226.0 A 72,72 0 0 1 145.4,194.3" fill="none" stroke="#0f766e" stroke-width="11"/>
  <path d="M 151.4,192.5 A 72,72 0 0 1 167.5,190.0" fill="none" stroke="#0f766e" stroke-width="11"/>
  <path d="M 187.8,213.1 A 52,52 0 0 1 217.1,240.0" fill="none" stroke="#b45309" stroke-width="11"/>
  <path d="M 165.5,313.8 A 52,52 0 0 1 133.2,298.8" fill="none" stroke="#b45309" stroke-width="11"/>
  <path d="M 211.0,294.0 A 52,52 0 0 1 197.6,306.1" fill="none" stroke="#b45309" stroke-width="11"/>
  <text x="118" y="200" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">A</text>
  <text x="256" y="238" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">C</text>
  <text x="232" y="328" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">D</text>
  <text x="92" y="296" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">F</text>
  <text x="118" y="256" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">G</text>
  <text x="222" y="204" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">H</text>
  <text x="172" y="260" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">B</text>
  <text x="178" y="304" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">E</text>
  <text x="216" y="268" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">K</text>
  <text x="170" y="370" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">φX174</text>
  <text x="290" y="196" font-size="11" fill="#1e293b" font-weight="700">1977 年桑格完成史上第一个基因组全序列：φX174 共 5,386 nt。</text>
  <text x="290" y="236" font-size="11" fill="#475569">按已知蛋白数推算，基因总长超出基因组长度——答案是 B 嵌于 A、</text>
  <text x="290" y="252" font-size="11" fill="#475569">E 嵌于 D：5.4 kb 由此容纳 11 个基因，「一寸核酸两寸用」。</text>
  <rect x="290" y="315.59" width="11.55" height="8.82" rx="3" fill="#0f766e" stroke="#cbd5e1" stroke-width="1"/>
  <text x="309.55" y="323.78" font-size="10.5" fill="#475569">外圈基因</text>
  <rect x="363.55" y="315.59" width="11.55" height="8.82" rx="3" fill="#b45309" stroke="#cbd5e1" stroke-width="1"/>
  <text x="383.1" y="323.78" font-size="10.5" fill="#475569">嵌套基因（B／E／K）</text>
  <text x="50" y="372" font-size="12.5" fill="#1e293b" font-weight="700">HBV 约 3.2 kb：四个阅读框广泛重叠</text>
  <rect x="210" y="388" width="80" height="88" fill="#fee2e2" fill-opacity="0.3"/>
  <rect x="280" y="388" width="190" height="88" fill="#fee2e2" fill-opacity="0.3"/>
  <rect x="500" y="388" width="115" height="88" fill="#fee2e2" fill-opacity="0.3"/>
  <text x="122" y="405" font-size="10.5" fill="#0369a1" text-anchor="end" font-weight="700">X</text>
  <rect x="130" y="392" width="160" height="16" rx="4" fill="#0369a122" stroke="#0369a1" stroke-width="1.5"/>
  <text x="122" y="431" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">P（最长）</text>
  <rect x="210" y="418" width="450" height="16" rx="4" fill="#dc262622" stroke="#dc2626" stroke-width="1.5"/>
  <text x="122" y="457" font-size="10.5" fill="#0f766e" text-anchor="end" font-weight="700">S</text>
  <rect x="280" y="444" width="190" height="16" rx="4" fill="#0f766e22" stroke="#0f766e" stroke-width="1.5"/>
  <text x="122" y="483" font-size="10.5" fill="#6d28d9" text-anchor="end" font-weight="700">C</text>
  <rect x="500" y="470" width="115" height="16" rx="4" fill="#6d28d922" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="400" y="508" font-size="10.5" fill="#64748b" text-anchor="middle">阴影＝与 P 基因重叠：P 与 S、C、X 皆部分重叠</text>
  <rect x="710" y="132" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、基因组的物理次序常即表达时序</text>
  <text x="730" y="184" font-size="12.5" fill="#1e293b" font-weight="700">负链 RNA 病毒：3′ 起始的转录梯度</text>
  <rect x="730" y="200" width="116" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="854" y="200" width="116" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="978" y="200" width="116" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="1102" y="200" width="116" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="1226" y="200" width="116" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="730" y="180" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">3′</text>
  <text x="1345" y="180" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">5′</text>
  <rect x="730" y="232" width="110" height="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <line x1="844" y1="238" x2="846" y2="254" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-ink)"/>
  <rect x="730" y="252" width="92" height="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <line x1="826" y1="258" x2="828" y2="274" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-ink)"/>
  <rect x="730" y="272" width="74" height="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <line x1="808" y1="278" x2="810" y2="294" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-ink)"/>
  <rect x="730" y="292" width="56" height="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <line x1="790" y1="298" x2="792" y2="314" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr-ink)"/>
  <rect x="730" y="312" width="38" height="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="854" y="330" font-size="10.5" fill="#64748b" text-anchor="middle">基因排位靠 3′ → 转录本越多（转录梯度）</text>
  <text x="730" y="360" font-size="12.5" fill="#1e293b" font-weight="700">T7 噬菌体：自左向右的时序分区</text>
  <rect x="730" y="376" width="199" height="30" rx="6" fill="#0f766e22" stroke="#0f766e" stroke-width="1.5"/>
  <text x="829" y="396" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">早：接管宿主</text>
  <rect x="937" y="376" width="199" height="30" rx="6" fill="#b4530922" stroke="#b45309" stroke-width="1.5"/>
  <text x="1036" y="396" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">中：复制</text>
  <rect x="1144" y="376" width="199" height="30" rx="6" fill="#6d28d922" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1243" y="396" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">晚：结构与装配</text>
  <line x1="730" y1="428" x2="1350" y2="428" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <text x="1040" y="448" font-size="10.5" fill="#64748b" text-anchor="middle">表达沿基因组自左向右推进</text>
  <text x="730" y="480" font-size="12.5" fill="#1e293b" font-weight="700">冠状病毒：复制酶基因排在最前</text>
  <rect x="730" y="492" width="410" height="20" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="935" y="506" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">复制酶基因（约占 5′ 端三分之二）</text>
  <rect x="1140" y="492" width="210" height="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1245" y="506" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">结构与辅助基因</text>
  <text x="935" y="530" font-size="10.5" fill="#64748b" text-anchor="middle">先造复制机器、再造结构部件</text>
  <rect x="30" y="556" width="660" height="424" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="578.84" font-size="19" fill="#475569" font-weight="700">三、IRES：不依赖帽的翻译开关</text>
  <text x="50" y="616" font-size="12.5" fill="#1e293b" font-weight="700">帽依赖翻译（宿主常规）：</text>
  <circle cx="66" cy="664" r="9" fill="#d97706" stroke="#d97706" stroke-width="1"/>
  <text x="66" y="690" font-size="10" fill="#64748b" text-anchor="middle">5′ 帽</text>
  <line x1="78" y1="664" x2="260" y2="664" stroke="#b45309" stroke-width="3"/>
  <text x="170" y="690" font-size="10" fill="#b45309" text-anchor="middle">mRNA</text>
  <rect x="250" y="648" width="60" height="18" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="280" y="661" font-size="10" fill="#4c1d95" text-anchor="middle" font-weight="700">eIF4E</text>
  <path d="M 316.5,667.6 a 13.5 9 0 0 1 27,0 z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.9"/>
  <path d="M 321,668.5 a 9 6.75 0 0 0 18,0 z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.9"/>
  <line x1="300" y1="664" x2="312" y2="664" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-pro)"/>
  <text x="330" y="700" font-size="10" fill="#64748b" text-anchor="middle">40S 扫描至 AUG</text>
  <text x="50" y="748" font-size="12.5" fill="#1e293b" font-weight="700">IRES 起始（小 RNA 病毒等）：</text>
  <path d="M84,800 L84,758 A14,14 0 0 1 96,758 L96,800" fill="none" stroke="#b45309" stroke-width="2.2"/>
  <path d="M124,800 L124,770 A11,11 0 0 1 136,770 L136,800" fill="none" stroke="#b45309" stroke-width="2.2"/>
  <line x1="150" y1="800" x2="300" y2="800" stroke="#b45309" stroke-width="3"/>
  <text x="200" y="826" font-size="10" fill="#b45309" text-anchor="middle">IRES（5′ 非翻译区结构）</text>
  <path d="M 226.5,763.6 a 13.5 9 0 0 1 27,0 z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.9"/>
  <path d="M 231,764.5 a 9 6.75 0 0 0 18,0 z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.9"/>
  <line x1="240" y1="744" x2="240" y2="726" stroke="#b45309" stroke-width="1.6" marker-end="url(#arr-rna)"/>
  <text x="240" y="712" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">直接募集 40S 亚基</text>
  <text x="360" y="620" font-size="12" fill="#1e293b" font-weight="700">无需帽、无需扫描：</text>
  <text x="360" y="646" font-size="11" fill="#475569">IRES 的发现（1988 年前后）</text>
  <text x="360" y="662" font-size="11" fill="#475569">改写了「帽为翻译必需」的教条。</text>
  <text x="360" y="694" font-size="11" fill="#475569">宿主翻译被关闭后，病毒经 IRES 独享核糖体——关闭宿主、</text>
  <text x="360" y="710" font-size="11" fill="#475569">自己接着翻译。</text>
  <text x="360" y="742" font-size="11" fill="#475569">HCV 的 IRES 直接募集 40S 亚基，不经 eIF4E。</text>
  <text x="360" y="790" font-size="11" fill="#64748b">5′ 非翻译区由此成为基因组上信息密度最高的区段：</text>
  <text x="360" y="806" font-size="11" fill="#64748b">复制起点、翻译开关、衣壳识别信号常在此叠床架屋。</text>
  <text x="50" y="880" font-size="11" fill="#475569">含义：小基因组不止靠重叠基因省空间，还把「说明书」写进 RNA 的二级结构里。</text>
  <rect x="710" y="556" width="660" height="424" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="578.84" font-size="19" fill="#475569" font-weight="700">四、冠状病毒：TRS 介导的嵌套亚基因组转录</text>
  <rect x="730" y="616" width="26" height="18" fill="#b45309" stroke="#78350f" stroke-width="1"/>
  <text x="743" y="644" font-size="9.5" fill="#b45309" text-anchor="middle">前导</text>
  <rect x="756" y="616" width="414" height="18" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <text x="963" y="629" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">复制酶基因（约 30 kb 的三分之二）</text>
  <rect x="1170" y="616" width="180" height="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="1260" y="629" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">结构／辅助基因</text>
  <text x="730" y="604" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">5′</text>
  <text x="1350" y="604" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">3′</text>
  <rect x="760" y="676" width="26" height="12" fill="#b45309" stroke="#78350f" stroke-width="1"/>
  <rect x="786" y="676" width="90" height="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="786" y1="672" x2="786" y2="692" stroke="#be185d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="890" y="686" font-size="9.5" fill="#64748b" text-anchor="middle">最短 sg mRNA</text>
  <rect x="760" y="702" width="26" height="12" fill="#b45309" stroke="#78350f" stroke-width="1"/>
  <rect x="786" y="702" width="150" height="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="786" y1="698" x2="786" y2="718" stroke="#be185d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="950" y="712" font-size="9.5" fill="#64748b" text-anchor="middle"></text>
  <rect x="760" y="728" width="26" height="12" fill="#b45309" stroke="#78350f" stroke-width="1"/>
  <rect x="786" y="728" width="210" height="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="786" y1="724" x2="786" y2="744" stroke="#be185d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="1010" y="738" font-size="9.5" fill="#64748b" text-anchor="middle"></text>
  <rect x="760" y="754" width="26" height="12" fill="#b45309" stroke="#78350f" stroke-width="1"/>
  <rect x="786" y="754" width="270" height="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="786" y1="750" x2="786" y2="770" stroke="#be185d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="1070" y="764" font-size="9.5" fill="#64748b" text-anchor="middle"></text>
  <rect x="760" y="780" width="26" height="12" fill="#b45309" stroke="#78350f" stroke-width="1"/>
  <rect x="786" y="780" width="330" height="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <line x1="786" y1="776" x2="786" y2="796" stroke="#be185d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="1130" y="790" font-size="9.5" fill="#64748b" text-anchor="middle">最长 sg mRNA</text>
  <rect x="904.4881" y="820.65" width="211.02380000000002" height="18.7" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1010" y="833.96" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">TRS（转录调节序列）介导不连续转录</text>
  <text x="730" y="880" font-size="11" fill="#475569">十余条嵌套亚基因组 mRNA 共享同一段 5′ 前导、3′ 端彼此嵌套；每条近单顺反子——先表达复制酶、再按需表达结构蛋白。</text>
  <text x="730" y="924" font-size="11" fill="#64748b">LTR、ψ 与 DIS、cos、att、ITR、TRS、复制起点等顺式元件密集分布于基因组两端，构成复制、包装、</text>
  <text x="730" y="940" font-size="11" fill="#64748b">整合与表达的全套指令。</text>
</svg>