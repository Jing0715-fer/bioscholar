<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">神经损伤的修复与前沿</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">中枢再生三重障碍（Nogo-A/MAG/OMgp经NgR-RhoA；CSPG瘢痕）vs周围神经Büngner带1–3mm/日·NGF靶源性营养（1986诺奖）·干细胞/类脑器官/光遗传</text>
  <rect x="30" y="132" width="680" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、中枢 vs 周围神经的再生命运</text>
  <text x="200" y="195" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">中枢神经（CNS）——再生失败</text>
  <line x1="80" y1="240" x2="170" y2="240" stroke="#0f766e" stroke-width="4"/>
  <line x1="230" y1="240" x2="340" y2="240" stroke="#0f766e" stroke-width="4" stroke-dasharray="10 6" opacity="0.5"/>
  <circle cx="175" cy="240" r="9" fill="#dc2626"/>
  <text x="190" y="225" font-size="11.5" fill="#dc2626" text-anchor="middle">生长锥坍缩</text>
  <rect x="103.84535000000002" y="275.65" width="252.30929999999995" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="230" y="288.96" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">Nogo-A · MAG · OMgp（经 NgR1→RhoA-ROCK）</text>
  <rect x="151.488" y="308.65" width="157.02400000000003" height="18.7" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="321.96" font-size="11" fill="#78350f" text-anchor="middle" font-weight="600">CSPG 胶质瘢痕（化学屏障）</text>
  <rect x="138.11860000000001" y="338.65" width="183.7628" height="18.7" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="351.96" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">生长因子缺乏 + 内在生长程序下调</text>
  <text x="200" y="400" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">周围神经（PNS）——可再生</text>
  <line x1="80" y1="445" x2="170" y2="445" stroke="#0f766e" stroke-width="4"/>
  <path d="M 175,445 Q 200,425 225,445" fill="none" stroke="#059669" stroke-width="3.4" marker-end="url(#arr-ok)"/>
  <path d="M 175,445 Q 200,465 225,445" fill="none" stroke="#059669" stroke-width="3.4" marker-end="url(#arr-ok)"/>
  <line x1="240" y1="445" x2="330" y2="445" stroke="#0f766e" stroke-width="4"/>
  <text x="255" y="495" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">Büngner 带（施万细胞基底膜管引导）· 约 1–3 mm/日</text>
  <text x="255" y="525" font-size="12" fill="#64748b" text-anchor="middle">远侧段 Wallerian 变性：施万细胞清碎片→去分化→再髓鞘化</text>
  <line x1="60" y1="370" x2="680" y2="370" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
  <rect x="740" y="132" width="630" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="154.84" font-size="19" fill="#475569" font-weight="700">二、NGF：靶源性营养与竞争生存（1986 诺奖）</text>
  <rect x="790" y="175" width="90" height="50" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="835" y="203" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">靶器官</text>
  <line x1="890" y1="200" x2="960" y2="200" stroke="#0369a1" stroke-width="2.4" marker-end="url(#arr-acc)"/>
  <text x="925" y="188" font-size="11.5" fill="#64748b" text-anchor="middle">NGF 逆行运输</text>
  <circle cx="1050" cy="165" r="20" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="1050" cy="240" r="20" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <line x1="1070" y1="165" x2="1140" y2="195" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <line x1="1070" y1="240" x2="1140" y2="210" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <rect x="1175.55395" y="170.225" width="108.8921" height="19.55" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1230" y="184.14" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">存活（获得 NGF）</text>
  <rect x="1176.62" y="235.225" width="106.76" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1230" y="249.14" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">凋亡（竞争失败）</text>
  <text x="760" y="310" font-size="12" fill="#475569">1950 年代 Levi-Montalcini 与 Cohen：</text>
  <text x="760" y="328" font-size="12" fill="#475569">小鼠肉瘤移植鸡胚后感觉/交感神经节向肿瘤长出「神经晕」——肿瘤分泌的可扩散因子即 NGF。临床教训：</text>
  <text x="760" y="346" font-size="12" fill="#475569">给药方式与剂量窗决定疗效（NGF/GDNF 试验受挫之因）。</text>
  <rect x="740" y="352" width="630" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="756" y="374.84" font-size="19" fill="#475569" font-weight="700">三、前沿：干细胞、类脑器官与光遗传</text>
  <circle cx="790" cy="410" r="5" fill="#0f766e"/>
  <text x="870" y="415" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">成年神经发生</text>
  <text x="950" y="410" font-size="11.5" fill="#475569">SGZ 与 SVZ 保留神经发生；</text>
  <text x="950" y="426" font-size="11.5" fill="#475569">胎儿中脑移植经验推动 ESC/iPSC 多巴胺前体进入 PD 临床试验</text>
  <circle cx="790" cy="458" r="5" fill="#0f766e"/>
  <text x="870" y="463" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">类脑器官</text>
  <text x="950" y="458" font-size="11.5" fill="#475569">Zika 感染放射状胶质→小头畸形的机制在类脑器官中确立</text>
  <circle cx="790" cy="506" r="5" fill="#0f766e"/>
  <text x="870" y="511" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">光遗传基因治疗</text>
  <text x="950" y="506" font-size="11.5" fill="#475569">ChR2 使视网膜色素变性患者临床试验中恢复部分视物能力</text>
  <rect x="30" y="580" width="1340" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="618" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="600">再生医学的路线图：解除抑制（anti-Nogo 抗体/ROCK 抑制剂）+ 桥接引导（神经导管）+ 营养支持（因子缓释）+ 细胞替代（干细胞）+ 光控功能重建（光遗传）</text>
</svg>