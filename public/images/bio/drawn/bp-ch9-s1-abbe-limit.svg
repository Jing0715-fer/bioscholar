  <text x="400" y="919.6" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">油浸 NA=1.4、λ≈550 nm → d ≈ 200 nm</text>
  <rect x="710" y="592" width="660" height="388" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="614.84" font-size="19" fill="#475569" font-weight="700">三、200 nm 以下的世界与两条突破思路</text>
  <text x="730" y="622" font-size="10.5" fill="#1e293b" font-weight="700">200 nm 以内拥挤着最精彩的分子世界——衍射极限把它们挡在光学显微镜之外；</text>
  <text x="730" y="646" font-size="10" fill="#475569">电镜分辨率虽达 Å 级，但要求真空、固定与重金属染色，难以观察活细胞。</text>
  <text x="730" y="670" font-size="10" fill="#475569">分辨率 ≠ 放大率：放大率只是把艾里斑投得更大——「空放大」不增加任何信息。</text>
