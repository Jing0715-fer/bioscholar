  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">光学成像的分辨率极限：艾里斑、Abbe 判据与 200 nm 以下的世界</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">d=λ/(2NA)：可见光λ≈550nm+油浸NA=1.4→d≈200nm；两点距离小于艾里斑半径（第一暗环）不可分辨；突破思路＝时间上分开或非线性压缩→2014</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">年诺贝尔化学奖「看见不可见」</text>
