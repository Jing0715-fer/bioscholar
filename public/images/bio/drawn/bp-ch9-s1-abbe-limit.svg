  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、点扩散函数（艾里斑）：成像分辨的基本单元</text>
  <text x="70" y="195" font-size="11" fill="#1e293b" font-weight="700">点源经有限孔径透镜成像为艾里斑——其强度分布即 PSF</text>
