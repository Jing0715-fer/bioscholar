  <line x1="488" y1="462" x2="452" y2="462" stroke="#be185d" stroke-width="1.6" marker-end="url(#arr-enz)"/>
  <text x="64" y="478" font-size="10" fill="#475569">CENP-A（H3 变体）替换着丝粒核小体——身份由表观遗传决定，新着丝粒可出现在缺乏卫星 DNA 的位点；每个动粒可附着 1 至数十条微管</text>
  <text x="64" y="492" font-size="10" fill="#475569">（哺乳动物）。</text>
  <text x="64" y="526" font-size="10" fill="#64748b">SAC 传感平台：未附着 / 缺乏张力的动粒募集 Mad2·BubR1 抑制 APC/C；CPC（Aurora B）纠错（见第 10 章）。</text>
