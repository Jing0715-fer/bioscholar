  <text x="820" y="831.6" font-size="10" fill="#059669" text-anchor="middle">生殖细胞 · 干细胞：活跃</text>
  <rect x="984" y="819.5" width="92" height="17" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1030" y="831.6" font-size="10" fill="#dc2626" text-anchor="middle">多数体细胞：抑制</text>
  <text x="760" y="866" font-size="10" fill="#64748b">先天性角化不良等端粒病源于端粒维护缺陷。</text>
