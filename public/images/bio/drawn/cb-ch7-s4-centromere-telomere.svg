  <text x="385" y="660" font-size="10" fill="#64748b" text-anchor="middle" font-weight="700">复制</text>
  <line x1="440" y1="660" x2="700" y2="660" stroke="#0f766e" stroke-width="3.5"/>
  <line x1="440" y1="690" x2="700" y2="690" stroke="#059669" stroke-width="3.5"/>
  <text x="570" y="640" font-size="9.5" fill="#059669" text-anchor="middle">子代 ①：先导链连续合成 → 全长</text>
  <line x1="440" y1="736" x2="700" y2="736" stroke="#0f766e" stroke-width="3.5"/>
  <line x1="440" y1="766" x2="640" y2="766" stroke="#b45309" stroke-width="3.5"/>
  <line x1="640" y1="766" x2="700" y2="766" stroke="#b45309" stroke-width="3.5" stroke-dasharray="5 5"/>
  <rect x="642" y="756" width="56" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="570" y="716" font-size="9.5" fill="#78350f" text-anchor="middle">子代 ②：后随链（冈崎片段）末端 RNA 引物切除</text>
  <line x1="616" y1="788" x2="690" y2="788" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="570" y="808" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">末端空缺无法补齐 → 每次复制缩短 50—200 bp</text>
  <text x="90" y="836" font-size="10" fill="#475569">端粒酶在多数体细胞中被抑制——端粒逐次缩短最终触发复制性衰老（Hayflick 界限，第 11 章）。</text>
  <text x="760" y="616" font-size="11.5" fill="#1e293b" font-weight="700">端粒酶：以自身 RNA 为模板的逆转录核糖核蛋白</text>
