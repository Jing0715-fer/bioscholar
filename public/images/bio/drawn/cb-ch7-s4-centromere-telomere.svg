  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">着丝粒、动粒与端粒：遗传忠实性的两大守护结构</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">着丝粒由 CENP-A 表观遗传决定，动粒 CCAN/KMN 捕捉微管兼 SAC 平台；端粒 TTAGGG 折成 T 环藏起末端，每代缩 50—200 bp，端粒酶（2009 诺奖）回补</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、着丝粒与动粒：CENP-A 表观遗传标志＋三层动粒</text>
