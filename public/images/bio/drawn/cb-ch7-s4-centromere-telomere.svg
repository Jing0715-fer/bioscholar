  <text x="1080" y="620" font-size="9.5" fill="#059669" text-anchor="middle" font-weight="700">回补 TTAGGG 重复</text>
  <text x="760" y="726" font-size="10.5" fill="#475569">Blackburn、Greider 与 Szostak 因发现端粒酶获 2009 年诺贝尔生理学或医学奖。端粒酶在生殖细胞、</text>
  <text x="760" y="741" font-size="10.5" fill="#475569">干细胞与约 85%—90% 的肿瘤中活跃——肿瘤细胞经其重激活实现永生化，端粒酶因此成为抗癌药靶。</text>
