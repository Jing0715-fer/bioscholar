  <rect x="945.5116" y="283.925" width="92.97680000000001" height="16.15" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="992" y="295.42" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="700">POT1（结合单链）</text>
  <text x="930" y="320" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">shelterin 复合体</text>
  <text x="740" y="424" font-size="10.5" fill="#475569">保护机制：T 环＋shelterin 使染色体天然末端免被 DNA 损伤应答系统识别为双链断裂。</text>
  <text x="740" y="462" font-size="10" fill="#64748b">人类由 TTAGGG 串联重复（约 5—15 kb）与 3′ 端 G 链突出构成。</text>
  <rect x="30" y="576" width="1340" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、末端复制问题与端粒酶：缩短 50—200 bp / 代及其回补</text>
  <text x="64" y="616" font-size="11.5" fill="#1e293b" font-weight="700">末端复制问题：后随链最末端 RNA 引物被切除后无法补齐</text>
