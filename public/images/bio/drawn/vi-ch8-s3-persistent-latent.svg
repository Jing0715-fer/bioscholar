  <line x1="218" y1="720" x2="218" y2="732" stroke="#0f766e" stroke-width="1.4" opacity="0.55"/>
  <text x="200" y="760" font-size="9.5" fill="#134e4a" text-anchor="middle">潜伏基因组（环形）</text>
  <text x="200" y="636" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="700">LAT＝唯一大量转录产物</text>
  <text x="60" y="820" font-size="11" fill="#475569">HSV 潜伏于感觉神经节：不产毒粒、仅 LAT 长期低语——「不表达」让免疫与药物都无从下手。</text>
  <line x1="90" y1="900" x2="650" y2="900" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
