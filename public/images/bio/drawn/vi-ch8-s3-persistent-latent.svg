  <text x="506" y="310" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">慢病毒</text>
  <path d="M366,442 C375.3,440.0 403.3,435.0 422,430 C440.7,425.0 459.3,419.0 478,412 C496.7,405.0 515.3,397.0 534,388 C552.7,379.0 571.3,367.0 590,358 C608.7,349.0 636.7,338.0 646,334" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <text x="50" y="506" font-size="11" fill="#475569">难点各不相同：储库（慢性）、靶点不表达（潜伏）、免疫失效（慢病毒）——治疗思路亦随之不同。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、慢性感染储库：HBV 的 cccDNA</text>
