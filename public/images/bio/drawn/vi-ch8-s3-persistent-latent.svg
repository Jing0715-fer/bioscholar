  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">持续性感染与潜伏感染：四型曲线、储库与沉默</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">急性／慢性／潜伏／慢病毒四型结局；HBV靠cccDNA储库（核苷类似物不能清除、功能性治愈为目标）；HSV潜伏神经节仅转录LAT；EBV潜伏记忆B细胞</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、感染结局四型：病毒载量曲线</text>
