  <text x="330" y="464" font-size="13" fill="#64748b" text-anchor="middle">时间→</text>
  <text x="190" y="310" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">潜伏</text>
  <path d="M50,442 C54.7,426.0 68.7,347.2 78,346 C87.3,344.8 87.3,419.4 106,434.8 C124.7,450.2 165.7,438.2 190,438.4 C214.3,438.6 237.6,449.4 251.6,436 C265.6,422.6 265.6,363.0 274,358 C282.4,353.0 292.7,392.8 302,406 C311.3,419.2 325.3,432.0 330,437.2" fill="none" stroke="#0f766e" stroke-width="2.2"/>
  <text x="240" y="314" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">再激活</text>
  <line x1="272" y1="320" x2="272" y2="338" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-bad)"/>
  <rect x="366" y="322" width="280" height="120" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="366" y1="442" x2="366" y2="448" stroke="#475569" stroke-width="1.8"/>
  <text x="366" y="464" font-size="13" fill="#64748b" text-anchor="middle">0</text>
