  <text x="1010" y="256" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">cccDNA</text>
  <text x="730" y="200" font-size="11" fill="#475569">HBV 持久性的核心：核内 cccDNA 微染色体储库——核苷类似物只压复制、不能清除之。</text>
  <line x1="880" y1="320" x2="940" y2="306" stroke="#be185d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-enz)"/>
  <text x="900" y="336" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">核苷类似物</text>
  <text x="1010" y="390" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">✗ 清除不了</text>
  <rect x="985.1433999999999" y="470.65" width="269.71320000000003" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1120" y="483.96" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">功能性治愈：压到不可检出并维持——现实治疗目标</text>
  <text x="730" y="440" font-size="11" fill="#64748b">停药即回升的根源就在这枚「微染色体」：半衰期长、不随药物消失。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、潜伏感染：神经节里的沉默与再激活</text>
  <circle cx="200" cy="700" r="56" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="200" y="700" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">感觉神经节</text>
  <path d="M168,726L168.0,726.0L170.0,724.1L172.0,722.5L174.0,721.1L176.0,720.3L178.0,720.0L180.0,720.3L182.0,721.1L184.0,722.5L186.0,724.1L188.0,726.0L190.0,727.9L192.0,729.5L194.0,730.9L196.0,731.7L198.0,732.0L200.0,731.7L202.0,730.9L204.0,729.5L206.0,727.9L208.0,726.0L210.0,724.1L212.0,722.5L214.0,721.1L216.0,720.3L218.0,720.0L220.0,720.3L222.0,721.1L224.0,722.5L226.0,724.1L228.0,726.0L230.0,727.9L232.0,729.5" fill="none" stroke="#0f766e" stroke-width="2.6"/>
