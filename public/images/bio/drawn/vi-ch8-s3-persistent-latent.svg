  <line x1="134.8" y1="909" x2="134.8" y2="930" stroke="#0369a1" stroke-width="1.7"/>
  <text x="134.8" y="950" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">儿童：水痘</text>
  <text x="134.8" y="970" font-size="12" fill="#64748b" text-anchor="middle">初次感染</text>
  <circle cx="370" cy="900" r="6.5" fill="#64748b"/>
  <line x1="370" y1="891" x2="370" y2="870" stroke="#64748b" stroke-width="1.7"/>
  <text x="370" y="850" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">潜伏数十年</text>
  <text x="370" y="830" font-size="12" fill="#64748b" text-anchor="middle">神经节内沉默</text>
  <circle cx="605.2" cy="900" r="6.5" fill="#dc2626"/>
  <line x1="605.2" y1="909" x2="605.2" y2="930" stroke="#dc2626" stroke-width="1.7"/>
  <text x="605.2" y="950" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">老年：带状疱疹</text>
  <text x="605.2" y="970" font-size="12" fill="#64748b" text-anchor="middle">再激活</text>
  <text x="370" y="962" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">VZV：同一病毒相隔数十年的两副面孔</text>
  <rect x="710" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="608.84" font-size="19" fill="#475569" font-weight="700">四、EB 病毒与慢病毒：另外两种藏法</text>
  <ellipse cx="860" cy="680" rx="80" ry="48" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="860" y="672" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">静息记忆 B 细胞</text>
  <circle cx="860" cy="690" r="20" fill="none" stroke="#dc2626" stroke-width="6" opacity="0.85"/>
  <text x="860" y="656" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">附加体</text>
  <text x="860" y="744" font-size="10" fill="#475569" text-anchor="middle">EBNA1 低表达维护附加体</text>
  <text x="730" y="636" font-size="11" fill="#475569">EB 病毒潜伏于静息记忆 B 细胞：几乎不表达抗原，免疫监视近乎失明——成人感染率逾九成。</text>
  <rect x="1010" y="760" width="330" height="160" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="1010" y1="920" x2="1010" y2="926" stroke="#475569" stroke-width="1.8"/>
  <text x="1010" y="942" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="1340" y1="920" x2="1340" y2="926" stroke="#475569" stroke-width="1.8"/>
  <text x="1340" y="942" font-size="13" fill="#64748b" text-anchor="middle">时间→</text>
  <text x="1175" y="748" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">慢病毒（Maedi-Visna）：抗原漂变</text>
  <path d="M1010,840 C1018.3,832.0 1045.8,786.7 1059.5,792 C1073.3,797.3 1078.8,868.0 1092.5,872 C1106.3,876.0 1125.5,814.7 1142,816 C1158.5,817.3 1175.0,878.7 1191.5,880 C1208.0,881.3 1224.5,822.7 1241,824 C1257.5,825.3 1274.0,886.7 1290.5,888 C1307.0,889.3 1331.8,841.3 1340,832" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <text x="1040" y="720" font-size="10.5" fill="#475569">免疫失效型：抗原持续漂变、波浪式推进——免疫总慢半拍。</text>
  <text x="730" y="788" font-size="11" fill="#64748b">无包膜病毒同样构成储库：HPV 的附加体、腺病毒与细小病毒的隐匿——「潜伏」不是有包膜者的专利。</text>
