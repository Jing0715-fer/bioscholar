  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">中介复合物与信号诱导的转录调控</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">Mediator 通用接头 + 共激活/共抑制因子——类固醇、JAK-STAT、NF-κB 与 MAPK 四路信号的汇聚</text>
