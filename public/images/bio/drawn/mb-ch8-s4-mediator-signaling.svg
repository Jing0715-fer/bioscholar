  <line x1="1030" y1="466" x2="690" y2="452" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <text x="700" y="524" font-size="12" fill="#475569" text-anchor="middle">共激活：滑动/排出核小体 + 乙酰化 ｜ 共抑制：去乙酰化 + 沉默标记</text>
  <text x="700" y="508" font-size="11.5" fill="#64748b" text-anchor="middle">核小体</text>
  <rect x="30" y="574" width="1340" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="596.84" font-size="19" fill="#475569" font-weight="700">二、四条经典信号诱导通路：殊途同归于 Mediator 总线</text>
  <rect x="55.2375" y="634.525" width="89.525" height="22.95" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="100" y="650.86" font-size="13.5" fill="#b45309" text-anchor="middle" font-weight="700">类固醇受体</text>
  <rect x="180" y="620" width="278" height="56" rx="8" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.6"/>
  <text x="194" y="642" font-size="12" fill="#475569">脂溶性激素经胞内受体直接调控</text>
  <line x1="462" y1="648" x2="478" y2="648" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-rna)"/>
  <rect x="482" y="620" width="278" height="56" rx="8" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.6"/>
  <text x="496" y="642" font-size="12" fill="#475569">激素结合 → 与 Hsp90 解离、暴露 NLS 入核</text>
  <line x1="764" y1="648" x2="780" y2="648" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-rna)"/>
  <rect x="784" y="620" width="278" height="56" rx="8" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="1.6"/>
  <text x="798" y="642" font-size="12" fill="#475569">同源二聚体结合 GRE（AGAACAnnnTGTTCT）</text>
  <line x1="1066" y1="648" x2="1082" y2="648" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-rna)"/>
  <rect x="1086" y="620" width="278" height="56" rx="8" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.6"/>
  <text x="1100" y="642" font-size="12" fill="#475569">招募 SRC → CBP/p300 → Mediator</text>
  <rect x="56.21085" y="716.525" width="87.5783" height="22.95" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="100" y="732.86" font-size="13.5" fill="#0369a1" text-anchor="middle" font-weight="700">JAK-STAT</text>
  <rect x="180" y="702" width="278" height="56" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.6"/>
  <text x="194" y="724" font-size="12" fill="#475569">细胞因子（干扰素、白介素）结合膜受体</text>
  <line x1="462" y1="730" x2="478" y2="730" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="482" y="702" width="278" height="56" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.6"/>
  <text x="496" y="724" font-size="12" fill="#475569">JAK 磷酸化受体 → STAT 经 SH2 募集并磷酸化</text>
  <line x1="764" y1="730" x2="780" y2="730" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="784" y="702" width="278" height="56" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.6"/>
  <text x="798" y="724" font-size="12" fill="#475569">pSTAT 二聚体入核结合 GAS / ISRE</text>
  <text x="798" y="743" font-size="12" fill="#475569">（ISGF3）</text>
  <line x1="1066" y1="730" x2="1082" y2="730" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="1086" y="702" width="278" height="56" rx="8" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1100" y="724" font-size="12" fill="#475569">SOCS 蛋白负反馈关闭通路</text>
  <rect x="69.83775" y="798.525" width="60.3245" height="22.95" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="100" y="814.86" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="700">NF-κB</text>
  <rect x="180" y="784" width="278" height="56" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="194" y="806" font-size="12" fill="#475569">炎症信号（TNFα、LPS-TLR4）</text>
  <line x1="462" y1="812" x2="478" y2="812" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="482" y="784" width="278" height="56" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="496" y="806" font-size="12" fill="#475569">IKK 复合体磷酸化 IκB → 泛素-蛋白酶体降解</text>
  <line x1="764" y1="812" x2="780" y2="812" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="784" y="784" width="278" height="56" rx="8" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="1.6"/>
  <text x="798" y="806" font-size="12" fill="#475569">p65/p50 入核结合 κB 位点（GGGRNNYYCC）</text>
  <line x1="1066" y1="812" x2="1082" y2="812" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="1086" y="784" width="278" height="56" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="1100" y="806" font-size="12" fill="#475569">启动炎症 / 存活基因</text>
  <rect x="72.7578" y="880.525" width="54.4844" height="22.95" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="100" y="896.86" font-size="13.5" fill="#059669" text-anchor="middle" font-weight="700">MAPK</text>
  <rect x="180" y="866" width="278" height="56" rx="8" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.6"/>
  <text x="194" y="888" font-size="12" fill="#475569">生长因子经 RTK / GPCR 入胞</text>
  <line x1="462" y1="894" x2="478" y2="894" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <rect x="482" y="866" width="278" height="56" rx="8" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.6"/>
  <text x="496" y="888" font-size="12" fill="#475569">Ras → Raf → MEK → ERK 三级级联</text>
  <line x1="764" y1="894" x2="780" y2="894" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <rect x="784" y="866" width="278" height="56" rx="8" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.6"/>
  <text x="798" y="888" font-size="12" fill="#475569">ERK 磷酸化 Elk-1 等既存转录因子</text>
  <line x1="1066" y1="894" x2="1082" y2="894" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-ok)"/>
  <rect x="1086" y="866" width="278" height="56" rx="8" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.6"/>
  <text x="1100" y="888" font-size="12" fill="#475569">改变其 DNA 结合与激活活性</text>
  <rect x="46" y="930" width="1308" height="26" fill="none"/>
  <text x="700" y="948" font-size="12.5" fill="#475569" text-anchor="middle">四条通路殊途同归：把信号转化为特定转录因子在特定位点、特定时间的活性，再经 Mediator 桥接为 pol II 的启动频率——信号转导的终点即转录调控的起点</text>
</svg>