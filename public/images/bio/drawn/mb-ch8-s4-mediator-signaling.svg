  <rect x="1066.985625" y="417.375" width="166.02875" height="21.25" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1150" y="432.5" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="600">NCoR / SMRT → HDAC3</text>
  <rect x="1026.80275" y="452.225" width="246.39449999999997" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1150" y="466.14" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="600">PRC1：H2AK119ub；PRC2：H3K27me3</text>
