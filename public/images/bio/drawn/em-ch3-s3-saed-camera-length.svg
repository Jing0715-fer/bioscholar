  <path d="M 750,565 Q 860,595 975,565" fill="none" stroke="#0369a1" stroke-width="2.6"/>
  <circle cx="790" cy="574" r="4.2" fill="#0369a1"/>
  <circle cx="850" cy="580" r="4.2" fill="#0369a1"/>
  <circle cx="910" cy="577" r="4.2" fill="#0369a1"/>
  <circle cx="970" cy="566" r="4.2" fill="#0369a1"/>
  <text x="730" y="508" font-size="10.5" fill="#075985" font-weight="700">Ewald 球面（1/λ 约 508 nm<tspan dy="-3.6" font-size="7.6">-1</tspan><tspan dy="3.6">）</tspan></text>
  <text x="730" y="660" font-size="10.5" fill="#475569">球面在倒易格点尺度上近乎平面：</text>
  <text x="730" y="675" font-size="10.5" fill="#475569">沿晶带轴一张照片可同时记录多层 hkl 反射</text>
  <text x="730" y="690" font-size="10.5" fill="#475569">（X 射线须旋转晶体逐层收集）。</text>
  <rect x="1010" y="510" width="100" height="100" rx="3" fill="#1e293b"/>
  <circle cx="1060" cy="560" r="4" fill="#f8fafc"/>
  <circle cx="1060" cy="560" r="22" fill="none" stroke="#e2e8f0" stroke-width="6" opacity="0.5"/>
  <circle cx="1060" cy="560" r="38" fill="none" stroke="#e2e8f0" stroke-width="5" opacity="0.35"/>
  <text x="1060" y="632" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="600">非晶宽环：冰约 0.37 nm</text>
  <rect x="1125" y="510" width="100" height="100" rx="3" fill="#1e293b"/>
  <circle cx="1148" cy="533" r="2.6" fill="#e2e8f0"/>
  <circle cx="1148" cy="551" r="2.6" fill="#e2e8f0"/>
