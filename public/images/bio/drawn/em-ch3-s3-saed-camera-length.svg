  <text x="1175" y="632" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="600">单晶：离散斑点阵</text>
  <rect x="1240" y="510" width="100" height="100" rx="3" fill="#1e293b"/>
  <circle cx="1290" cy="560" r="13" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="1290" cy="560" r="25" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="1290" cy="560" r="37" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1290" y="632" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="600">多晶：同心锐环（金环系）</text>
  <text x="1010" y="672" font-size="10.5" fill="#475569">电子散射比 X 射线强约 10<tspan dy="-3.6" font-size="7.6">4</tspan><tspan dy="3.6">–10</tspan><tspan dy="-3.6" font-size="7.6">5</tspan><tspan dy="3.6"> 倍：几百纳米的晶体就够衍射</tspan></text>
  <text x="1010" y="687" font-size="10.5" fill="#475569">（MicroED 的根本优势），代价是动力学散射须防；</text>
  <text x="1010" y="702" font-size="10.5" fill="#475569">散射振幅约随 Z 一次方增长（X 射线强度约 Z<tspan dy="-3.6" font-size="7.6">2</tspan><tspan dy="3.6">），轻元素相对更可见。</tspan></text>
</svg>