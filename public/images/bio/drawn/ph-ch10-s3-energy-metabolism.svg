<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">能量代谢：间接测热、呼吸商与基础代谢率</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">Weir公式以VO<tspan dy="3.7" font-size="12.2">2</tspan><tspan dy="-3.7">/VCO</tspan><tspan dy="3.7" font-size="12.2">2</tspan><tspan dy="-3.7">换算产热；呼吸商糖1.00、混合膳食0.85、蛋白0.80、脂肪0.70；甲亢/甲减时BMR变动可达±40–60%，蛋白质特殊动力效应约30%</tspan></text>
  <rect x="30" y="132" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、间接测热：从气体交换到 Weir 公式</text>
  <rect x="260.0625" y="181.375" width="139.875" height="21.25" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="330" y="196.5" font-size="12.5" fill="#78350f" text-anchor="middle" font-weight="700">三大营养素体内氧化</text>
  <line x1="300" y1="204" x2="232" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="385" y1="204" x2="448" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="150" y="240" width="160" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="230" y="266" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">O<tspan dy="2.6" font-size="8.6">2</tspan><tspan dy="-2.6"> 消耗（VO</tspan><tspan dy="2.6" font-size="8.6">2</tspan><tspan dy="-2.6">）</tspan></text>
  <rect x="370" y="240" width="160" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="450" y="266" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">CO<tspan dy="2.6" font-size="8.6">2</tspan><tspan dy="-2.6"> 产生（VCO</tspan><tspan dy="2.6" font-size="8.6">2</tspan><tspan dy="-2.6">）</tspan></text>
  <line x1="230" y1="286" x2="310" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="450" y1="286" x2="390" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="260" y="330" width="180" height="46" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
  <text x="350" y="358" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">呼吸气体分析（代谢车）</text>
  <line x1="350" y1="378" x2="350" y2="400" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="90" y="402" width="460" height="62" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="110" y="428" font-size="14" fill="#075985" font-weight="700">产热(kcal/d) = (3.9×VO<tspan dy="3.1" font-size="10.1">2</tspan><tspan dy="-3.1"> + 1.1×VCO</tspan><tspan dy="3.1" font-size="10.1">2</tspan><tspan dy="-3.1">) × 1440</tspan></text>
  <text x="110" y="452" font-size="11.5" fill="#475569">（VO<tspan dy="2.5" font-size="8.3">2</tspan><tspan dy="-2.5">、VCO</tspan><tspan dy="2.5" font-size="8.3">2</tspan><tspan dy="-2.5"> 以 L/min 计；与量热舱直接测热相差 &lt;1–2%）</tspan></text>
  <text x="50" y="490" font-size="12" fill="#475569">氧热价（每升 O<tspan dy="2.6" font-size="8.6">2</tspan><tspan dy="-2.6"> 的产热）：糖 5.05、混合膳食 4.825、蛋白 4.60、</tspan></text>
  <text x="50" y="509" font-size="12" fill="#475569">脂肪 4.69 kcal/L——间接测热据此把气体交换换算为能量，无需密闭量热舱。</text>
  <rect x="710" y="132" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、呼吸商（RQ）标尺：底物决定产 CO₂ 比例</text>
  <text x="1040" y="195" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">RQ = VCO<tspan dy="3.3" font-size="10.8">2</tspan><tspan dy="-3.3"> / VO</tspan><tspan dy="3.3" font-size="10.8">2</tspan></text>
  <line x1="740" y1="300" x2="1340" y2="300" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <line x1="750" y1="300" x2="750" y2="306" stroke="#475569" stroke-width="1.8"/>
  <text x="750" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">0.70</text>
  <line x1="840" y1="300" x2="840" y2="306" stroke="#475569" stroke-width="1.8"/>
  <text x="840" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">0.75</text>
  <line x1="930" y1="300" x2="930" y2="306" stroke="#475569" stroke-width="1.8"/>
  <text x="930" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">0.80</text>
  <line x1="1020" y1="300" x2="1020" y2="306" stroke="#475569" stroke-width="1.8"/>
  <text x="1020" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">0.85</text>
  <line x1="1110" y1="300" x2="1110" y2="306" stroke="#475569" stroke-width="1.8"/>
  <text x="1110" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">0.90</text>
  <line x1="1200" y1="300" x2="1200" y2="306" stroke="#475569" stroke-width="1.8"/>
  <text x="1200" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">0.95</text>
  <line x1="1290" y1="300" x2="1290" y2="306" stroke="#475569" stroke-width="1.8"/>
  <text x="1290" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">1.00</text>
  <rect x="725.34875" y="235.225" width="69.30250000000001" height="19.55" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="760" y="249.14" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="700">脂肪 0.70</text>
  <line x1="760" y1="255" x2="760" y2="294" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="895.34875" y="205.225" width="69.30250000000001" height="19.55" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="930" y="219.14" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">蛋白 0.80</text>
  <line x1="930" y1="225" x2="930" y2="294" stroke="#6d28d9" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="973.50375" y="235.225" width="92.9925" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1020" y="249.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">混合膳食 0.85</text>
  <line x1="1020" y1="255" x2="1020" y2="294" stroke="#0369a1" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="1261.27125" y="235.225" width="57.4575" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1290" y="249.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">糖 1.00</text>
  <line x1="1290" y1="255" x2="1290" y2="294" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="850" y="352" font-size="11" fill="#64748b" text-anchor="middle">← 脂类底物</text>
  <text x="1230" y="352" font-size="11" fill="#64748b" text-anchor="middle">糖类底物 →</text>
  <text x="730" y="395" font-size="12" fill="#475569">RQ 由氧化底物决定：糖「含氧充足」，每耗 1 分子 O<tspan dy="2.6" font-size="8.6">2</tspan><tspan dy="-2.6"> 即产 1 分子 CO</tspan><tspan dy="2.6" font-size="8.6">2</tspan><tspan dy="-2.6">；脂的碳氢长链需额外耗氧，产 CO</tspan><tspan dy="2.6" font-size="8.6">2</tspan><tspan dy="-2.6"> 较少。</tspan></text>
  <text x="730" y="414" font-size="12" fill="#475569">非底物因素：过度通气或酸中毒（缓冲碱放出 CO<tspan dy="2.6" font-size="8.6">2</tspan><tspan dy="-2.6">）可令 RQ&gt;1；长期饥饿、糖异生旺盛时可低于 0.70。</tspan></text>
  <rect x="30" y="546" width="660" height="439" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="568.84" font-size="19" fill="#475569" font-weight="700">三、基础代谢率：条件与影响因素</text>
  <text x="50" y="618" font-size="14" fill="#475569" font-weight="700">测定条件</text>
  <rect x="48" y="639" width="11" height="11" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="66" y="650" font-size="12" fill="#475569">清晨清醒、静卧（肌松）</text>
  <rect x="48" y="667" width="11" height="11" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="66" y="678" font-size="12" fill="#475569">禁食 12–14 h（排除 SDA）</text>
  <rect x="48" y="695" width="11" height="11" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="66" y="706" font-size="12" fill="#475569">室温 20–25 ℃</text>
  <rect x="48" y="723" width="11" height="11" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
  <text x="66" y="734" font-size="12" fill="#475569">情绪安定、无应激</text>
  <text x="300" y="618" font-size="14" fill="#475569" font-weight="700">影响因素</text>
  <text x="300" y="646" font-size="12" fill="#475569">① 体表面积律：BMR 与体表面积成正比</text>
  <text x="300" y="665" font-size="12" fill="#475569">（同体重下瘦高者高于矮胖者）；</text>
  <text x="300" y="684" font-size="12" fill="#475569">② 甲状腺激素是 BMR 最主要的内源性驱动；③ 年龄递减、</text>
  <text x="300" y="703" font-size="12" fill="#475569">男性略高于女性；④ 体温每升高 1 ℃ 代谢率约增 13%。</text>
  <text x="50" y="770" font-size="11.5" fill="#475569">BMR 常以体表面积归一（kcal/m<tspan dy="-3.9" font-size="8.3">2</tspan><tspan dy="3.9">·h）；</tspan></text>
  <text x="50" y="787" font-size="11.5" fill="#475569">甲状腺功能检查是 BMR 异常的第一筛查方向。</text>
  <rect x="435.775" y="745.225" width="138.45" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="505" y="759.14" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="700">甲状腺激素为主导因素</text>
  <line x1="320" y1="880" x2="650" y2="880" stroke="#475569" stroke-width="2"/>
  <rect x="478" y="810" width="44" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="500" y="800" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="700">+40–60%</text>
  <text x="500" y="905" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">甲亢</text>
  <line x1="400" y1="873" x2="400" y2="887" stroke="#475569" stroke-width="2.6"/>
  <text x="400" y="905" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">正常 100%</text>
  <rect x="568" y="880" width="44" height="50" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="590" y="948" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">−40–60%</text>
  <text x="590" y="972" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">甲减</text>
  <text x="470" y="936" font-size="11.5" fill="#64748b" text-anchor="middle">BMR（相对正常值幅度）</text>
  <rect x="710" y="546" width="660" height="439" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="568.84" font-size="19" fill="#475569" font-weight="700">四、食物特殊动力效应与能量平衡</text>
  <text x="910" y="600" font-size="15" fill="#475569" text-anchor="middle" font-weight="700">食物特殊动力效应（SDA）</text>
  <text x="740" y="628" font-size="11.5" fill="#475569">进食后额外产热（占摄入能百分比）：</text>
  <text x="740" y="645" font-size="11.5" fill="#475569">蛋白质最显著——氨基酸脱氨与尿素合成耗能。</text>
  <line x1="760" y1="830" x2="760" y2="655" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <line x1="754" y1="830" x2="760" y2="830" stroke="#475569" stroke-width="1.8"/>
  <text x="748" y="834" font-size="11" fill="#64748b" text-anchor="end">0</text>
  <line x1="754" y1="778" x2="760" y2="778" stroke="#475569" stroke-width="1.8"/>
  <text x="748" y="782" font-size="11" fill="#64748b" text-anchor="end">10</text>
  <line x1="754" y1="726" x2="760" y2="726" stroke="#475569" stroke-width="1.8"/>
  <text x="748" y="730" font-size="11" fill="#64748b" text-anchor="end">20</text>
  <line x1="754" y1="674" x2="760" y2="674" stroke="#475569" stroke-width="1.8"/>
  <text x="748" y="678" font-size="11" fill="#64748b" text-anchor="end">30</text>
  <text x="748" y="648" font-size="11.5" fill="#475569" text-anchor="end" font-weight="600">额外产热（%）</text>
  <rect x="778" y="674" width="56" height="156" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="806" y="664" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="700">~30%</text>
  <rect x="853" y="799" width="56" height="31" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="881" y="789" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">~6%</text>
  <rect x="928" y="809" width="56" height="21" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="956" y="799" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">~4%</text>
  <rect x="1003" y="778" width="56" height="52" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1031" y="768" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">~10%</text>
  <text x="806" y="852" font-size="11.5" fill="#475569" text-anchor="middle">蛋白质</text>
  <text x="881" y="852" font-size="11.5" fill="#475569" text-anchor="middle">糖类</text>
  <text x="956" y="852" font-size="11.5" fill="#475569" text-anchor="middle">脂肪</text>
  <text x="1031" y="852" font-size="11.5" fill="#475569" text-anchor="middle">混合膳食</text>
  <text x="740" y="880" font-size="11.5" fill="#475569">BMR 测定须禁食 12 h 以上，正是为排除 SDA 干扰；</text>
  <text x="740" y="897" font-size="11.5" fill="#475569">高蛋白餐后代谢率可升高约 30% 并持续数小时。</text>
  <rect x="1080" y="615" width="285" height="95" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="1222" y="648" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">摄入能量</text>
  <text x="1222" y="676" font-size="13" fill="#075985" text-anchor="middle" font-weight="600">= 输出能量 + 贮存变动</text>
  <text x="1080" y="735" font-size="12" fill="#475569">输出 = 外做功（机械功）+ 产热</text>
  <text x="1080" y="754" font-size="12" fill="#475569">（基础代谢 + SDA + 肌肉活动生热）；</text>
  <text x="1080" y="773" font-size="12" fill="#475569">贮存变动 = 脂肪与糖原的净增减——长期正平衡则增重、</text>
  <text x="1080" y="792" font-size="12" fill="#475569">负平衡则减重，肥胖的本质是长期正平衡。</text>
  <text x="1080" y="840" font-size="11.5" fill="#475569">衡量指标：体质指数 BMI = 体重(kg)/身高(m)<tspan dy="-3.9" font-size="8.3">2</tspan><tspan dy="3.9">；</tspan></text>
  <text x="1080" y="857" font-size="11.5" fill="#475569">基础状态下产热几乎全部转化为体热，外做功近零。</text>
</svg>