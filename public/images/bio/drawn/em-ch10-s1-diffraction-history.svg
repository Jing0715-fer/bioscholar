  <text x="99" y="710" font-size="12" fill="#64748b" text-anchor="middle">德布罗意物质波假说</text>
  <circle cx="197.6" cy="780" r="6.5" fill="#dc2626"/>
  <line x1="197.6" y1="789" x2="197.6" y2="810" stroke="#dc2626" stroke-width="1.7"/>
  <text x="197.6" y="830" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1927</text>
  <text x="197.6" y="850" font-size="12" fill="#64748b" text-anchor="middle">两路衍射实验裁决</text>
  <circle cx="313.6" cy="780" r="6.5" fill="#dc2626"/>
  <line x1="313.6" y1="771" x2="313.6" y2="750" stroke="#dc2626" stroke-width="1.7"/>
  <text x="313.6" y="730" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1930–40 年代</text>
  <text x="313.6" y="710" font-size="12" fill="#64748b" text-anchor="middle">电子衍射相机成常规仪器</text>
  <circle cx="429.6" cy="780" r="6.5" fill="#dc2626"/>
  <line x1="429.6" y1="789" x2="429.6" y2="810" stroke="#dc2626" stroke-width="1.7"/>
  <text x="429.6" y="830" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1940–50 年代</text>
  <text x="429.6" y="850" font-size="12" fill="#64748b" text-anchor="middle">苏联学派电子衍射结构分析</text>
  <circle cx="557.2" cy="780" r="6.5" fill="#dc2626"/>
  <line x1="557.2" y1="771" x2="557.2" y2="750" stroke="#dc2626" stroke-width="1.7"/>
  <text x="557.2" y="730" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1960 年代</text>
  <text x="557.2" y="710" font-size="12" fill="#64748b" text-anchor="middle">Vainshtein 专著译介西方</text>
  <text x="50" y="880" font-size="10.5" fill="#475569">电子衍射相机定量测定金属蒸镀层晶粒取向、表面氧化层织构与脂肪酸单分子层堆积周期；</text>
  <text x="50" y="895" font-size="10.5" fill="#475569">Pinsker 与 Vainshtein 等人以强度统计解出轻原子薄层与粘土矿物结构。</text>
  <rect x="157" y="921.075" width="186" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="933.78" font-size="10.5" fill="#475569" text-anchor="middle">表面与薄膜：电子的浅穿透恰成优势</text>
  <rect x="710" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="594.84" font-size="19" fill="#475569" font-weight="700">四、生物样品：剂量困境与紫膜加冕</text>
  <rect x="788.2574999999999" y="611.075" width="223.485" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="900" y="623.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">Taylor 与 Glaeser 1974：冷冻催化酶晶体</text>
