  <circle cx="600" cy="237" r="42" fill="none" stroke="#be185d" stroke-width="1.6" opacity="0.75"/>
  <text x="600" y="300" font-size="9.5" fill="#831843" text-anchor="middle">透射衍射环</text>
  <rect x="452.25" y="313.075" width="175.5" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="540" y="325.78" font-size="10.5" fill="#78350f" text-anchor="middle">环纹＝多晶取向平均的布拉格反射</text>
  <rect x="143.0161" y="383.075" width="213.96779999999998" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="250" y="395.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">德布罗意 1929 年先行获诺贝尔物理学奖</text>
  <rect x="453.8813" y="383.075" width="212.2374" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="560" y="395.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">戴维孙与 G. P. 汤姆孙 1937 年共享诺奖</text>
  <text x="360" y="468" font-size="10" fill="#64748b" text-anchor="middle">J. J. 汤姆孙因证明电子是粒子获 1906 年诺奖，儿子 G. P. 因证明电子是波获 1937 年——父证其粒、子证其波</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、电子波长随加速电压缩短</text>
  <rect x="773.5" y="395.47777777777776" width="48" height="4.522222222222221" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="797.5" y="386.47777777777776" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">0.037 Å</text>
  <text x="797.5" y="420" font-size="12.5" fill="#64748b" text-anchor="middle">100 kV</text>
  <rect x="848.5" y="396.94444444444446" width="48" height="3.055555555555556" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="872.5" y="387.94444444444446" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">0.025 Å</text>
  <text x="872.5" y="420" font-size="12.5" fill="#64748b" text-anchor="middle">200 kV</text>
  <rect x="923.5" y="397.55555555555554" width="48" height="2.4444444444444446" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="947.5" y="388.55555555555554" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">0.020 Å</text>
  <text x="947.5" y="420" font-size="12.5" fill="#64748b" text-anchor="middle">300 kV</text>
  <rect x="998.5" y="211.7777777777778" width="48" height="188.2222222222222" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1022.5" y="202.7777777777778" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">1.54 Å</text>
  <text x="1022.5" y="420" font-size="12.5" fill="#64748b" text-anchor="middle">Cu Kα</text>
  <text x="910" y="186" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">电子波长比常用 X 射线短数十倍</text>
  <text x="740" y="216" font-size="10.5" fill="#475569">短波长意味着超小的衍射角与接近平面的 Ewald 球（本章第 3 节 MicroED 的物理红利）；</text>
  <text x="740" y="231" font-size="10.5" fill="#475569">电子散射截面比 X 射线高多个数量级——薄膜即可衍射，亚微米微晶也给出可测强度。</text>
  <rect x="1109.015" y="290.65" width="121.97" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1170" y="303.96" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">散射强：薄膜即衍射</text>
  <rect x="1114.68" y="326.65" width="110.64" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1170" y="339.96" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">代价：动力学散射</text>
  <text x="740" y="470" font-size="10.5" fill="#475569">多束相干相互作用使强度偏离 |F|<tspan dy="-3.6" font-size="7.6">2</tspan><tspan dy="3.6">——「电子衍射不可定量」的质疑伴随半个世纪，直到动力学精修给出回应（本章第 3、4 节）</tspan></text>
  <text x="740" y="485" font-size="10.5" fill="#475569">。</text>
  <rect x="30" y="572" width="660" height="398" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="594.84" font-size="19" fill="#475569" font-weight="700">三、1930 至 1950 年代：从物理玩具到结构工具</text>
