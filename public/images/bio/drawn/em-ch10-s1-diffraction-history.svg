  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">电子衍射的发现与早期历史：从物质波到紫膜</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">1927年戴维孙-革末镍单晶（54eV，波长约1.67Å）与G.P.汤姆孙薄膜环状衍射证实电子波动性（1937年诺奖）；电子波长100/200/300kV为0.037/0.025/0.020Å；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">Henderson与Unwin1975年紫膜7Å</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、1927 年：两路实验同时裁决物质波</text>
  <text x="50" y="180" font-size="12.5" fill="#1e293b" font-weight="700">λ = h/p（德布罗意 1924 年物质波假说）</text>
  <text x="178" y="204" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">戴维孙-革末：镍单晶弹性散射</text>
  <rect x="60" y="224" width="42" height="26" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="81" y="241" font-size="9" fill="#075985" text-anchor="middle" font-weight="700">e<tspan dy="-3.1" font-size="6.5">-</tspan><tspan dy="3.1">枪</tspan></text>
  <line x1="106" y1="237" x2="160" y2="237" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <polygon points="160,218 196,218 188,258 168,258" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="178" y="276" font-size="9.5" fill="#92400e" text-anchor="middle">镍单晶</text>
  <line x1="192" y1="231" x2="262" y2="205" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <rect x="262" y="190" width="34" height="26" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <text x="279" y="207" font-size="8.5" fill="#831843" text-anchor="middle">收集器</text>
  <path d="M 150,252 A 40,40 0 0 0 186,262" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <text x="168" y="288" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">θ</text>
  <rect x="114.16329999999998" y="313.075" width="151.67340000000004" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="190" y="325.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">54 eV 电子，波长约 1.67 Å</text>
  <text x="540" y="204" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">G. P. 汤姆孙：多晶薄膜环状衍射</text>
  <rect x="380" y="224" width="42" height="26" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="401" y="241" font-size="9" fill="#075985" text-anchor="middle" font-weight="700">e<tspan dy="-3.1" font-size="6.5">-</tspan><tspan dy="3.1">枪</tspan></text>
