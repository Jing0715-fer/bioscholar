  <text x="1010" y="690" font-size="10.5" fill="#475569">Henderson 与 Unwin 1975 年紫膜结构：葡萄糖包埋防脱水、</text>
  <text x="1010" y="705" font-size="10.5" fill="#475569">衍射收振幅加图像收相位，</text>
  <text x="1010" y="720" font-size="10.5" fill="#475569">得 7 Å 面内分辨率——首个非染色天然膜蛋白结构；</text>
  <text x="1010" y="735" font-size="10.5" fill="#475569">1990 年达 3.5 Å 完整原子模型。</text>
