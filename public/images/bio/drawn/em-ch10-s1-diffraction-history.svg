  <text x="484" y="276" font-size="9.5" fill="#4c1d95" text-anchor="middle">多晶薄膜</text>
  <line x1="492" y1="237" x2="540" y2="237" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <circle cx="600" cy="237" r="52" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
