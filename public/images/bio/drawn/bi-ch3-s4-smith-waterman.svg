  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">Smith-Waterman 局部比对：负分截断与仿射空位</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">在递推中加入零选项实现负分截断，回溯改从全矩阵最大值出发、遇零即停；仿射空位把「新开 go」与「延长 ge」分账，Gotoh（1982）用 M、Ix、Iy 三矩阵递推、复杂度仍 O(mn)；带状 DP、X-drop、线性空间与向量化把精确算法推回实用区间</text>
