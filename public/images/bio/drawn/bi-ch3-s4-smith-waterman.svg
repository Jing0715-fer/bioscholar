  <text x="95" y="504" font-size="11.5" fill="#64748b">回溯：右下角 → 左上角，强制整条路径</text>
  <text x="95" y="540" font-size="11" fill="#64748b">负分一路累积：整条序列必须全部参与比对。</text>
