  <text x="545" y="480" font-size="12" fill="#134e4a" font-weight="700">H(i,j) = max{ 0, H(i−1,j−1)+s, H(i−1,j)−d, H(i,j−1)−d }</text>
  <text x="545" y="504" font-size="11.5" fill="#64748b">回溯：从最大值出发 → 遇零即停；负分被截断，零是新的起跑线</text>
  <text x="545" y="540" font-size="11" fill="#64748b">两处修改让比对可以只取各自内部最相似的片段对——适配域重组与嵌合情形。</text>
  <rect x="960" y="132" width="410" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="976" y="154.84" font-size="19" fill="#475569" font-weight="700">二、仿射空位：开与延的分账</text>
