  <text x="1140" y="324" font-size="11" fill="#92400e" text-anchor="middle" font-weight="600">一个长空位（长度 L）</text>
  <text x="990" y="352" font-size="11.5" fill="#475569">空位罚分 = go + (L−1)·ge：新开（go）与延长（ge）</text>
  <text x="990" y="368" font-size="11.5" fill="#475569">分账——长空位不再按长度线性重罚。</text>
  <text x="990" y="400" font-size="13" fill="#1e293b" font-weight="700">Gotoh（1982）三矩阵递推</text>
  <rect x="990" y="416" width="100" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1040" y="448" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">M</text>
  <text x="1040" y="488" font-size="10.5" fill="#64748b" text-anchor="middle">残基对残基</text>
  <rect x="1123" y="416" width="100" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1173" y="448" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">Ix</text>
  <text x="1173" y="488" font-size="10.5" fill="#64748b" text-anchor="middle">x 对空位</text>
  <rect x="1256" y="416" width="100" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1306" y="448" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">Iy</text>
  <text x="1306" y="488" font-size="10.5" fill="#64748b" text-anchor="middle">空位对 y</text>
  <line x1="1092" y1="444" x2="1119" y2="444" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="1225" y1="444" x2="1252" y2="444" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
