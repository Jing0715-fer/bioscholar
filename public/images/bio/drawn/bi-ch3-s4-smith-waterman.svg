  <text x="990" y="530" font-size="11" fill="#475569">三矩阵互相递推，复杂度仍为 O(mn)——精确解与实用性的折中。</text>
  <rect x="30" y="656" width="1340" height="304" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="678.84" font-size="19" fill="#475569" font-weight="700">三、把精确算法推回实用区间</text>
  <rect x="60" y="716" width="300" height="110" rx="10" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="210" y="748" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">带状 DP</text>
  <text x="210" y="780" font-size="11" fill="#475569" text-anchor="middle">只算对角带内的单元——牺牲远处换速度</text>
  <rect x="388" y="716" width="300" height="110" rx="10" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="538" y="748" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">X-drop 截断</text>
  <text x="538" y="780" font-size="11" fill="#475569" text-anchor="middle">延伸中分数跌到阈值以下即丢弃</text>
  <rect x="716" y="716" width="300" height="110" rx="10" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="866" y="748" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">线性空间</text>
  <text x="866" y="780" font-size="11" fill="#475569" text-anchor="middle">分治复用内存，行列只留当前与上一行</text>
  <rect x="1044" y="716" width="300" height="110" rx="10" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1194" y="748" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">向量化</text>
  <text x="1194" y="780" font-size="11" fill="#475569" text-anchor="middle">同一指令处理一排单元（SIMD 并行）</text>
  <rect x="60" y="852" width="1280" height="62" rx="8" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="80" y="874" font-size="12.5" fill="#134e4a" font-weight="600">Smith-Waterman 是数据库搜索的理论金标准——其打分行为的统计理论（Karlin-Altschul）正是 BLAST 的基石。</text>
</svg>