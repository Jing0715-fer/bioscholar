  <ellipse cx="195" cy="268" rx="41.4" ry="11.700000000000001" fill="none" stroke="#0f766e" stroke-width="1.1" opacity="0.35" transform="rotate(-14 195 268)"/>
  <ellipse cx="150" cy="238" rx="24" ry="17" fill="none" stroke="#0f766e" stroke-width="2" opacity="0.9" transform="rotate(-20 150 238)"/>
  <ellipse cx="150" cy="238" rx="17.28" ry="12.24" fill="none" stroke="#0f766e" stroke-width="1.4" opacity="0.55" transform="rotate(-20 150 238)"/>
  <ellipse cx="150" cy="238" rx="10.8" ry="7.65" fill="none" stroke="#0f766e" stroke-width="1.1" opacity="0.35" transform="rotate(-20 150 238)"/>
  <ellipse cx="244" cy="300" rx="26" ry="18" fill="none" stroke="#0f766e" stroke-width="2" opacity="0.9" transform="rotate(-10 244 300)"/>
  <ellipse cx="244" cy="300" rx="18.72" ry="12.959999999999999" fill="none" stroke="#0f766e" stroke-width="1.4" opacity="0.55" transform="rotate(-10 244 300)"/>
  <ellipse cx="244" cy="300" rx="11.700000000000001" ry="8.1" fill="none" stroke="#0f766e" stroke-width="1.1" opacity="0.35" transform="rotate(-10 244 300)"/>
  <circle cx="112" cy="250" r="4" fill="#1e293b"/>
  <circle cx="136" cy="262" r="4" fill="#1e293b"/>
  <circle cx="160" cy="273" r="4" fill="#1e293b"/>
  <circle cx="184" cy="283" r="4" fill="#1e293b"/>
  <circle cx="208" cy="292" r="4" fill="#1e293b"/>
  <circle cx="232" cy="299" r="4" fill="#1e293b"/>
  <circle cx="256" cy="304" r="4" fill="#1e293b"/>
  <circle cx="280" cy="307" r="4" fill="#1e293b"/>
  <text x="195" y="340" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">α 螺旋的「香肠管」密度（直径约 5 Å）</text>
  <text x="195" y="358" font-size="10" fill="#64748b" text-anchor="middle">侧链如齿轮从一侧咬出</text>
  <text x="60" y="388" font-size="10" fill="#475569">主链侧链一图尽收，日常建模九成时间看它；</text>
  <text x="60" y="402" font-size="10" fill="#475569">系数 2|F<tspan dy="2.2" font-size="7.2">obs</tspan><tspan dy="-2.2">|−|F</tspan><tspan dy="2.2" font-size="7.2">calc</tspan><tspan dy="-2.2">|、相位取模型相位。</tspan></text>
  <rect x="432.476675" y="172.225" width="155.04665" height="19.55" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="510" y="186.14" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">mFo−DFc 画 ±3σ：差在哪</text>
  <ellipse cx="470" cy="258" rx="34" ry="24" fill="none" stroke="#059669" stroke-width="2" opacity="0.9" transform="rotate(12 470 258)"/>
  <ellipse cx="470" cy="258" rx="24.48" ry="17.28" fill="none" stroke="#059669" stroke-width="1.4" opacity="0.55" transform="rotate(12 470 258)"/>
  <ellipse cx="470" cy="258" rx="15.3" ry="10.8" fill="none" stroke="#059669" stroke-width="1.1" opacity="0.35" transform="rotate(12 470 258)"/>
  <rect x="428.06755" y="291.075" width="83.8649" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="470" y="303.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">＋3σ 缺失原子</text>
  <text x="470" y="322" font-size="9.5" fill="#64748b" text-anchor="middle">配体、水、替代构象</text>
  <circle cx="600" cy="262" r="4" fill="#1e293b"/>
  <ellipse cx="600" cy="262" rx="22" ry="17" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 4"/>
  <rect x="549.84815" y="291.075" width="100.30369999999999" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="303.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">−3σ 多余／占位错</text>
  <text x="370" y="388" font-size="10" fill="#475569">铁律：差值峰高于 3σ 且位置化学合理才当真；</text>
  <text x="370" y="402" font-size="10" fill="#475569">1–2σ 的碎斑只是噪声的日常涨落——把每个小峰都当原子补，</text>
  <text x="370" y="416" font-size="10" fill="#475569">模型很快被噪声殖民。</text>
  <text x="60" y="436" font-size="10.5" fill="#64748b">sigma-A 加权（Read 1986 年）：m 为反射相位的 figure of merit、</text>
  <text x="60" y="451" font-size="10.5" fill="#64748b">D 为与 σ<tspan dy="2.3" font-size="7.6">A</tspan><tspan dy="-2.3"> 挂钩的折扣因子——2mFo−DFc 与 mFo−DFc 图让可靠反射发言大、可疑反射发言小，图的噪声显著低于朴素版本。</tspan></text>
  <rect x="710" y="132" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、omit 与 polder：防模型偏差的挖除术</text>
  <text x="730" y="184" font-size="12" fill="#1e293b" font-weight="700">omit 三步（顺序颠倒便前功尽弃）：</text>
  <rect x="730" y="200" width="186" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="823" y="224" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">① 挖区</text>
  <text x="823" y="244" font-size="10" fill="#475569" text-anchor="middle">删除可疑区域原子</text>
  <rect x="948" y="200" width="186" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="1041" y="224" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">② 精修</text>
  <text x="1041" y="244" font-size="10" fill="#475569" text-anchor="middle">重算掩膜与体溶剂</text>
  <rect x="1166" y="200" width="186" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="1259" y="224" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">③ 重构图</text>
  <text x="1259" y="244" font-size="10" fill="#475569" text-anchor="middle">以新相位重新综合</text>
  <line x1="920" y1="228" x2="944" y2="228" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <line x1="1138" y1="228" x2="1162" y2="228" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <text x="730" y="284" font-size="10.5" fill="#475569">模型偏差有自我实现的魔法：只要原子在模型里，它的密度就会被「画出来」（相位来自模型）。</text>
  <text x="730" y="299" font-size="10.5" fill="#475569">omit 把可疑区域整段挖除后重新综合——挖除后仍出现的密度才是真凭实据；只删原子而沿用旧相位，等于戴着有色眼镜做「验证」。</text>
  <text x="730" y="314" font-size="10.5" fill="#475569">挖区尺寸几 Å 到十几 Å 为宜。</text>
  <circle cx="790" cy="402" r="34" fill="#e2e8f0" fill-opacity="0.85" stroke="#475569" stroke-width="1.6"/>
  <text x="776" y="398" font-size="9" fill="#64748b">溶剂</text>
  <ellipse cx="790" cy="402" rx="13" ry="10" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.9" transform="rotate(0 790 402)"/>
  <ellipse cx="790" cy="402" rx="9.36" ry="7.199999999999999" fill="none" stroke="#94a3b8" stroke-width="1.4" opacity="0.55" transform="rotate(0 790 402)"/>
  <ellipse cx="790" cy="402" rx="5.8500000000000005" ry="4.5" fill="none" stroke="#94a3b8" stroke-width="1.1" opacity="0.35" transform="rotate(0 790 402)"/>
  <text x="790" y="454" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">传统 omit：体溶剂淹没弱配体</text>
  <line x1="856" y1="402" x2="902" y2="402" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <circle cx="950" cy="402" r="34" fill="#ffffff" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/>
  <ellipse cx="950" cy="402" rx="16" ry="12" fill="none" stroke="#059669" stroke-width="2" opacity="0.9" transform="rotate(0 950 402)"/>
  <ellipse cx="950" cy="402" rx="11.52" ry="8.64" fill="none" stroke="#059669" stroke-width="1.4" opacity="0.55" transform="rotate(0 950 402)"/>
  <ellipse cx="950" cy="402" rx="7.2" ry="5.4" fill="none" stroke="#059669" stroke-width="1.1" opacity="0.35" transform="rotate(0 950 402)"/>
  <text x="950" y="454" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">polder：掩膜排除溶剂</text>
  <text x="1010" y="380" font-size="10.5" fill="#475569">polder omit（Liebschner 等 2017 年）：</text>
  <text x="1010" y="395" font-size="10.5" fill="#475569">把目标区域与周围体溶剂一并从掩膜排除——小分子密度「裸露」成像；</text>
  <text x="1010" y="410" font-size="10.5" fill="#475569">对低占位配体、糖链、脂质的无偏检验已成事实标准。实操纪律：</text>
  <text x="1010" y="425" font-size="10.5" fill="#475569">配体验证须 polder 图与合理相互作用双证齐全。</text>
  <rect x="30" y="552" width="1340" height="410" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="574.84" font-size="19" fill="#475569" font-weight="700">三、分辨率决定可见细节：从氢原子到螺旋轮廓</text>
  <rect x="60" y="618" width="110" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="645.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">分辨率</text>
  <rect x="170" y="618" width="520" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="645.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">图上可见</text>
  <rect x="690" y="618" width="370" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="875" y="645.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">建模口径</text>
  <rect x="60" y="662" width="110" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="681.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">1.05 Å</text>
  <rect x="170" y="662" width="520" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="681.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">氢键中的氢原子可辨、各向异性 B 因子可精修</text>
  <rect x="690" y="662" width="370" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="875" y="681.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">近原子精度建模</text>
  <rect x="60" y="690" width="1000" height="28" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="690" width="110" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="709.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">1.2 Å</text>
  <rect x="170" y="690" width="520" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="709.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">氢原子（清晰区）、交替构象、完整水网</text>
  <rect x="690" y="690" width="370" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="875" y="709.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">几乎照抄密度</text>
  <rect x="60" y="718" width="110" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="737.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">1.5 Å</text>
  <rect x="170" y="718" width="520" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="737.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">各向同性 B 因子可靠精修、水分子密集可见</text>
  <rect x="690" y="718" width="370" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="875" y="737.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">常规高分辨建模</text>
  <rect x="60" y="746" width="1000" height="28" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="746" width="110" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="765.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">1.8 Å</text>
  <rect x="170" y="746" width="520" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="765.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">主链与羰基开始分叶、侧链构象明确</text>
  <rect x="690" y="746" width="370" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="875" y="765.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">rotamer 挑选即可</text>
  <rect x="60" y="774" width="110" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="793.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">2.5 Å</text>
  <rect x="170" y="774" width="520" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="793.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">侧链清晰、多数水可见</text>
  <rect x="690" y="774" width="370" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="875" y="793.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">常规手工建模</text>
  <rect x="60" y="802" width="1000" height="28" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="802" width="110" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="821.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">2.8 Å</text>
  <rect x="170" y="802" width="520" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="821.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">大侧链末端分叶消失、水的可靠性下降</text>
  <rect x="690" y="802" width="370" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="875" y="821.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">侧链与水均须保守</text>
  <rect x="60" y="830" width="110" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="849.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">3.2 Å</text>
  <rect x="170" y="830" width="520" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="849.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">主链清晰、侧链断续</text>
  <rect x="690" y="830" width="370" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="875" y="849.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">借序列与 rotamer 推断</text>
  <rect x="60" y="858" width="1000" height="28" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="858" width="110" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="115" y="877.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">6 Å</text>
  <rect x="170" y="858" width="520" height="28" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="430" y="877.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">螺旋管状轮廓、结构域分区</text>
