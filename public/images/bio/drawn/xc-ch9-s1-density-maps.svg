  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">电子密度图解读：主力图、差值图与分辨率阶梯</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">2mFo−DFc主力图1σ／mFo−DFc差值图±3σ；omit三步（挖区→精修→重构图）与polder无偏图（Liebschner2017）；1.2Å见氢、1.8Å键分叶、3.2Å侧链断续、6Å</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">只余螺旋轮廓</text>
  <rect x="30" y="132" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、2mFo−DFc 主力图 与 mFo−DFc 差值图</text>
  <rect x="107.91634999999998" y="172.225" width="164.16730000000004" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="190" y="186.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">2mFo−DFc 画约 1σ：有什么</text>
  <ellipse cx="195" cy="268" rx="92" ry="26" fill="none" stroke="#0f766e" stroke-width="2" opacity="0.9" transform="rotate(-14 195 268)"/>
