  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">模型搭建的实践：Coot 工作流与自动流水线</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">Coot（Emsley与Cowtan2004）：骨架化、baton接力、mutate、fitrotamer、realspacerefine、peptideflip；ARP/wARP要求优于约1.7Å、Buccaneer面向2–3.5Å；</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">水三判据（3σ、氢键2.6–3.0Å、B相当）；配体先造字典再过polder图</text>
