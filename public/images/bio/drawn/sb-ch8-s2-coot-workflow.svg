  <rect x="30" y="482" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="504.84" font-size="19" fill="#475569" font-weight="700">三、自动建模流水线：分工与门槛</text>
  <rect x="56" y="504" width="600" height="82" rx="8" fill="#0369a114" stroke="#0369a1" stroke-width="1.4"/>
  <text x="72" y="526" font-size="12" fill="#0369a1" font-weight="700">ARP/wARP</text>
  <text x="130.8" y="526" font-size="9.5" fill="#64748b">（Perrakis 等 1999）</text>
  <text x="240" y="524" font-size="10" fill="#475569">自由原子反复「播种—连接—重评」，拼主链再挂序列</text>
  <text x="240" y="556" font-size="9.5" fill="#64748b">要求优于约 1.7 Å；数十分钟产出九成以上正确全原子</text>
  <rect x="56" y="592" width="600" height="82" rx="8" fill="#0f766e14" stroke="#0f766e" stroke-width="1.4"/>
  <text x="72" y="614" font-size="12" fill="#0f766e" font-weight="700">Buccaneer</text>
  <text x="137.4" y="614" font-size="9.5" fill="#64748b">（Cowtan 2006）</text>
  <text x="240" y="612" font-size="10" fill="#475569">从密度特征直接预测主链片段与残基类型，逐步拉长链条</text>
  <text x="240" y="644" font-size="9.5" fill="#64748b">面向 2–3.5 Å 中低分辨率，长链蛋白尤其受益</text>
  <rect x="56" y="680" width="600" height="82" rx="8" fill="#6d28d914" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="72" y="702" font-size="12" fill="#6d28d9" font-weight="700">Phenix AutoBuild</text>
  <text x="183.59999999999997" y="702" font-size="9.5" fill="#64748b">（Terwilliger 等 2008）</text>
  <text x="336" y="700" font-size="10" fill="#475569">定相、修饰、建模、精修组成循环</text>
  <text x="240" y="732" font-size="9.5" fill="#64748b">每一轮重建都以最新相位为底</text>
  <rect x="56" y="768" width="600" height="82" rx="8" fill="#be185d14" stroke="#be185d" stroke-width="1.4"/>
  <text x="72" y="790" font-size="12" fill="#be185d" font-weight="700">AlphaFold 初稿</text>
  <text x="168" y="790" font-size="9.5" fill="#64748b">（2021 年后的新实践）</text>
  <text x="336" y="788" font-size="10" fill="#475569">预测模型按密度对接为骨架参考，任务变「逐段校」</text>
  <text x="240" y="820" font-size="9.5" fill="#64748b">低置信环区仍须手工，工作量普遍减半</text>
  <text x="56" y="870" font-size="10" fill="#475569">自动与手工衔接：自动程序先交七八成骨架，建模员在 Coot 处理环区、侧链与配体，再进全局精修</text>
  <rect x="710" y="482" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
