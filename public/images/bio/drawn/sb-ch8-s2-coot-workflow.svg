  <text x="930" y="574" font-size="9" fill="#64748b" text-anchor="middle" font-weight="700">2.6–3.0 Å</text>
  <text x="742" y="624" font-size="9.5" fill="#475569">① Fo−Fc 不低于约 3σ（稳妥 2.5σ 配主图）</text>
  <text x="742" y="638" font-size="9.5" fill="#475569">② 氢键 2.6–3.0 Å、几何不荒谬（孤立水不放）</text>
  <text x="742" y="652" font-size="9.5" fill="#475569">③ B 因子与邻居相当——B 飙过 80 多半在占噪声位</text>
