  <text x="56" y="356" font-size="10" fill="#475569">核心逻辑：把「看图、改模、验证」压缩进同一界面。加减残基接续断链、mutate 把暂放残基换成序列指定类型；</text>
  <text x="56" y="370.5" font-size="10" fill="#475569">rotamer 从 Richardson 系统计库挑最贴合密度者，是防止「怪构象」的第一道闸。</text>
