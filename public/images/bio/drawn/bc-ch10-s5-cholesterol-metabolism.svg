<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">胆固醇的代谢：HMG-CoA 还原酶限速与三大转变去路</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">18乙酰CoA+36ATP+16NADPH经MVA→鲨烯→胆固醇（27C）；不能氧化分解，转变成胆汁酸（7α-羟化酶限速）、类固醇激素与维D₃；LDL受体介导内吞，</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">他汀竞争性抑制限速酶并代偿上调受体</text>
  <rect x="30" y="132" width="700" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、胆固醇的合成：三阶段（肝占 70%~80%，胞质与内质网）</text>
  <text x="46" y="176" font-size="11.5" fill="#1e293b" font-weight="700">原料：18 乙酰CoA + 36 ATP + 16 NADPH → 1 分子胆固醇（27C）。</text>
  <rect x="46" y="202" width="200" height="118" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="60" y="226" font-size="11.5" fill="#1e293b" font-weight="700">① 甲羟戊酸（MVA）阶段</text>
  <text x="60" y="250" font-size="9.5" fill="#475569">2 乙酰CoA → 乙酰乙酰CoA</text>
  <text x="60" y="270" font-size="9.5" fill="#475569">→（HMG-CoA 合酶）HMG-CoA</text>
  <rect x="59.93194999999999" y="287.925" width="120.13610000000001" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="120" y="299.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">HMG-CoA 还原酶（限速）</text>
  <text x="60" y="316" font-size="9.5" fill="#475569">→ MVA（6C · 耗 2 NADPH）</text>
  <rect x="262" y="202" width="200" height="118" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="276" y="226" font-size="11.5" fill="#1e293b" font-weight="700">② 鲨烯阶段</text>
  <text x="276" y="250" font-size="9.5" fill="#475569">MVA 磷酸化活化为焦磷酸异戊烯（IPP）</text>
  <text x="276" y="263" font-size="9.5" fill="#475569">等活性异戊二烯单位</text>
  <text x="276" y="300" font-size="9.5" fill="#475569">6 × 异戊二烯（30C）→ 鲨烯</text>
  <rect x="478" y="202" width="222" height="118" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="492" y="226" font-size="11.5" fill="#1e293b" font-weight="700">③ 环化阶段</text>
  <text x="492" y="250" font-size="9.5" fill="#475569">鲨烯经单加氧酶、环化酶</text>
  <text x="492" y="263" font-size="9.5" fill="#475569">（固醇载体蛋白 SCP 携带）→ 羊毛固醇</text>
  <rect x="586" y="288" width="100" height="32" rx="8" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="636" y="308" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">胆固醇 27C</text>
  <line x1="246" y1="262" x2="260" y2="262" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="462" y1="262" x2="476" y2="262" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="46" y="342" width="654" height="100" rx="9" fill="#fce7f3" fill-opacity="0.4" stroke="#be185d" stroke-width="1.6"/>
  <text x="60" y="366" font-size="11.5" fill="#831843" font-weight="700">HMG-CoA 还原酶的多级调控：</text>
  <text x="60" y="388" font-size="10" fill="#475569">① 酶量：高胆固醇经 SREBP-2-SCAP-Insig 通路反馈抑制转录；② 共价修饰：AMPK 磷酸化失活、胰岛素去磷酸化激活；③ 昼夜节律</text>
  <text x="60" y="402" font-size="10" fill="#475569">（午夜峰值）；④ 饥饿抑制、高糖高脂饮食促进。</text>
  <text x="46" y="468" font-size="10.5" fill="#64748b">LDL 受体基因同样受 SREBP-2 调节——酶量与「进口量」同步反馈。</text>
  <text x="46" y="506" font-size="11" fill="#1e293b" font-weight="700">胆固醇不能被彻底氧化分解，只能转变或随胆汁排出。</text>
  <rect x="750" y="132" width="620" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="154.84" font-size="19" fill="#475569" font-weight="700">二、转变去路：胆汁酸 · 类固醇激素 · 维生素 D₃</text>
  <rect x="950" y="172" width="120" height="40" rx="8" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1010" y="196" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">胆固醇</text>
  <text x="1010" y="160" font-size="9.5" fill="#64748b" text-anchor="middle">（不能氧化分解）</text>
  <line x1="960" y1="212" x2="860" y2="258" stroke="#0369a1" stroke-width="2.4" marker-end="url(#arr-acc)"/>
  <rect x="766" y="260" width="190" height="56" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.8"/>
  <text x="861" y="282" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">胆汁酸（主要去路）</text>
  <text x="861" y="302" font-size="10" fill="#475569" text-anchor="middle">7α-羟化酶（限速）</text>
  <text x="766" y="340" font-size="10" fill="#475569">胆酸与鹅脱氧胆酸（与甘氨酸 / 牛磺酸结合），</text>
  <text x="766" y="354" font-size="10" fill="#475569">随胆汁乳化脂类；肠肝循环重吸收约 95%。</text>
  <line x1="1010" y1="212" x2="1010" y2="258" stroke="#b45309" stroke-width="2.4" marker-end="url(#arr-rna)"/>
  <rect x="920" y="260" width="180" height="56" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#b45309" stroke-width="1.8"/>
  <text x="1010" y="282" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">类固醇激素</text>
  <text x="1010" y="302" font-size="10" fill="#475569" text-anchor="middle">P450 侧链裂解酶起步</text>
  <text x="920" y="340" font-size="10" fill="#475569">肾上腺皮质（糖皮质 · 盐皮质激素）与性腺（性激素）</text>
  <text x="920" y="354" font-size="10" fill="#475569">——第一步生成孕烯醇酮。</text>
  <line x1="1060" y1="212" x2="1160" y2="258" stroke="#d97706" stroke-width="2.4" marker-end="url(#arr-warn)"/>
  <rect x="1114" y="260" width="160" height="56" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#d97706" stroke-width="1.8"/>
  <text x="1194" y="282" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">维生素 D₃</text>
  <text x="1194" y="302" font-size="10" fill="#475569" text-anchor="middle">皮肤 · 紫外线</text>
  <text x="1114" y="340" font-size="10" fill="#475569">皮肤 7-脱氢胆固醇经紫外线转变。</text>
  <text x="766" y="412" font-size="10.5" fill="#475569">树脂类药物与膳食纤维促进胆汁酸排泄，间接拉动胆固醇转变为胆汁酸而降胆固醇。</text>
  <text x="766" y="456" font-size="10.5" fill="#64748b">三大去路中胆汁酸量最大——「变废为乳」用于脂类消化吸收。</text>
  <rect x="30" y="566" width="700" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="588.84" font-size="19" fill="#475569" font-weight="700">三、血浆脂蛋白与 LDL 受体途径（Brown &amp; Goldstein，1985 诺奖）</text>
  <rect x="46" y="620" width="128" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="110" y="647.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">脂蛋白</text>
  <rect x="174" y="620" width="176" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="262" y="647.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">主要脂质</text>
  <rect x="350" y="620" width="236" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="468" y="647.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">功能</text>
  <rect x="586" y="620" width="114" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="643" y="647.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">电泳</text>
  <rect x="46" y="664" width="128" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="110" y="686.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">CM 乳糜微粒</text>
  <rect x="174" y="664" width="176" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="262" y="686.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">外源性 TAG</text>
  <rect x="350" y="664" width="236" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="468" y="686.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">转运膳食脂肪</text>
  <rect x="586" y="664" width="114" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="643" y="686.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">原点</text>
  <rect x="46" y="698" width="654" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="46" y="698" width="128" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="110" y="720.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">VLDL</text>
  <rect x="174" y="698" width="176" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="262" y="720.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">内源性 TAG</text>
  <rect x="350" y="698" width="236" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="468" y="720.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">肝输出脂肪</text>
  <rect x="586" y="698" width="114" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="643" y="720.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">前 β</text>
  <rect x="46" y="732" width="128" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="110" y="754.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">LDL</text>
  <rect x="174" y="732" width="176" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="262" y="754.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">胆固醇酯 ~50%</text>
  <rect x="350" y="732" width="236" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="468" y="754.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">肝 → 外周运输胆固醇</text>
  <rect x="586" y="732" width="114" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="643" y="754.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">β</text>
  <rect x="46" y="766" width="654" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="46" y="766" width="128" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="110" y="788.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">HDL</text>
  <rect x="174" y="766" width="176" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="262" y="788.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">蛋白 / 磷脂</text>
  <rect x="350" y="766" width="236" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="468" y="788.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">胆固醇逆向转运（外周 → 肝）</text>
  <rect x="586" y="766" width="114" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="643" y="788.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">α</text>
  <text x="46" y="812" font-size="12" fill="#1e293b" font-weight="700">LDL 受体途径：</text>
  <rect x="180" y="796" width="160" height="32" rx="7" fill="#f8fafc" stroke="#0369a1" stroke-width="1.4"/>
  <text x="260" y="814" font-size="10" fill="#1e293b" text-anchor="middle">识别 ApoB100</text>
  <line x1="342" y1="812" x2="352" y2="812" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="356" y="796" width="160" height="32" rx="7" fill="#f8fafc" stroke="#0369a1" stroke-width="1.4"/>
  <text x="436" y="814" font-size="10" fill="#1e293b" text-anchor="middle">网格蛋白包被凹陷内吞</text>
  <line x1="518" y1="812" x2="528" y2="812" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <rect x="532" y="796" width="160" height="32" rx="7" fill="#f8fafc" stroke="#0369a1" stroke-width="1.4"/>
  <text x="612" y="814" font-size="10" fill="#1e293b" text-anchor="middle">溶酶体水解释放游离胆固醇</text>
  <text x="46" y="852" font-size="10.5" fill="#475569">胞内胆固醇升高 → ① 抑制 HMG-CoA 还原酶（停止合成）② 抑制 LDL 受体基因（SREBP 通路，减少摄取）③ 激活 ACAT（重新酯化储存）。</text>
  <rect x="46" y="892" width="654" height="70" rx="8" fill="#fee2e2" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.6"/>
  <text x="62" y="916" font-size="11.5" fill="#dc2626" font-weight="700">家族性高胆固醇血症（FH）：LDL 受体缺陷</text>
  <text x="62" y="938" font-size="10" fill="#475569">杂合子血 LDL 升高 2~3 倍；纯合子升高 5~6 倍，早年即发生致死性动脉粥样硬化。</text>
  <rect x="750" y="566" width="620" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="588.84" font-size="19" fill="#475569" font-weight="700">四、他汀与降胆固醇策略</text>
  <rect x="790" y="620" width="150" height="44" rx="8" fill="#fce7f3" fill-opacity="0.6" stroke="#be185d" stroke-width="1.8"/>
  <text x="865" y="640" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">HMG-CoA 还原酶</text>
  <text x="865" y="656" font-size="9.5" fill="#64748b" text-anchor="middle">（限速酶）</text>
  <line x1="940" y1="642" x2="1000" y2="642" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-bad)"/>
  <text x="970" y="626" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">竞争性抑制</text>
  <rect x="1027.2232" y="631.8" width="95.5536" height="20.4" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1075" y="646.32" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">他汀类 statins</text>
  <text x="766" y="692" font-size="10.5" fill="#475569">他汀结构类似 HMG-CoA 的过渡态，与底物竞争结合限速酶 → 阻断内源性胆固醇合成。</text>
  <rect x="766" y="726" width="592" height="84" rx="9" fill="#d1fae5" fill-opacity="0.45" stroke="#059669" stroke-width="1.6"/>
  <text x="782" y="750" font-size="12" fill="#065f46" font-weight="700">连锁效应：肝细胞代偿上调 LDL 受体 → 血 LDL 清除加快</text>
  <text x="782" y="774" font-size="10.5" fill="#475569">他汀类由此成为降胆固醇治疗的基石；LDL 运胆固醇出肝、HDL 行逆向转运，两者方向相反。</text>
  <rect x="766" y="828" width="286" height="76" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="780" y="852" font-size="11.5" fill="#075985" font-weight="700">PCSK9 抑制剂（近年新靶点）</text>
  <text x="780" y="874" font-size="10" fill="#475569">减少 LDL 受体降解，增强清除。</text>
  <rect x="1072" y="828" width="286" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1086" y="852" font-size="11.5" fill="#475569" font-weight="700">树脂类 + 膳食纤维</text>
  <text x="1086" y="874" font-size="10" fill="#475569">促胆汁酸排泄，间接拉动胆固醇转变消耗。</text>
  <text x="766" y="930" font-size="11" fill="#1e293b" font-weight="700">「限速酶 + 受体反馈」双节点是降胆固醇药物设计的经典范式。</text>
</svg>