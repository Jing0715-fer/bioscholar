  <text x="812" y="760" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700">局部极小</text>
  <circle cx="1010" cy="760" r="5.5" fill="#059669"/>
  <text x="1010" y="746" font-size="9" fill="#065f46" text-anchor="middle" font-weight="700">全局极小</text>
  <path d="M 820,768 q 60,-40 180,-2" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-warn)"/>
  <text x="905" y="738" font-size="9.5" fill="#92400e" text-anchor="middle" font-weight="700">高温扰动</text>
  <text x="730" y="836" font-size="10" fill="#475569">给坐标一个高温再缓慢降温的动力学扰动，使其有机会跃出局部极小——经典场景是 MR 模型偏差大、普通最小化推不动的骨架。</text>
  <text x="700" y="946" font-size="12" fill="#64748b" text-anchor="middle" font-weight="600">精修是在观测与化学之间找平衡——restraints 补足方程，Rfree（第 4 节）守住不作弊的底线</text>
