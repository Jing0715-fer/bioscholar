    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">结构精修的原理：目标函数、restraints 与参数化</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">目标函数Σw(F<tspan dy="3.7" font-size="12.2">o</tspan><tspan dy="-3.7">−F</tspan><tspan dy="3.7" font-size="12.2">c</tspan><tspan dy="-3.7">)</tspan><tspan dy="-5.8" font-size="12.2">2</tspan><tspan dy="5.8">加几何项，现代程序改用最大似然；300残基近万参数对同量级反射，restraints以数千条虚拟观测拉回超定（Engh与Huber：键长σ约0.02Å、键角约2°）</tspan></text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">；B=8π<tspan dy="-5.8" font-size="12.2">2</tspan><tspan dy="5.8">⟨u</tspan><tspan dy="-5.8" font-size="12.2">2</tspan><tspan dy="5.8">⟩；TLS每集团20参数；模拟退火跳出局部极小</tspan></text>
  <rect x="30" y="132" width="660" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、精修循环：模型与数据的往复对话</text>
  <rect x="103.5814" y="211" width="72.8372" height="42" rx="7" fill="#6d28d918" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="140" y="235.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">① 模型参数</text>
  <text x="140" y="266" font-size="9" fill="#64748b" text-anchor="middle">坐标 x,y,z + B 因子 + 占有率</text>
  <rect x="297.465324" y="211" width="65.06935200000001" height="42" rx="7" fill="#0369a118" stroke="#0369a1" stroke-width="1.5"/>
  <text x="330" y="235.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">② 计算 F<tspan dy="2.4" font-size="7.9">c</tspan></text>
  <text x="330" y="266" font-size="9" fill="#64748b" text-anchor="middle">结构因子 + bulk 溶剂校正</text>
  <rect x="293.58140000000003" y="335" width="72.8372" height="42" rx="7" fill="#0f766e18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="330" y="359.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">③ 目标函数</text>
  <text x="330" y="390" font-size="9" fill="#64748b" text-anchor="middle">数据项 + 几何项 + 权重</text>
  <rect x="97.9164" y="335" width="84.16720000000001" height="42" rx="7" fill="#be185d18" stroke="#be185d" stroke-width="1.5"/>
  <text x="140" y="359.96" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">④ 最小化更新</text>
  <text x="140" y="390" font-size="9" fill="#64748b" text-anchor="middle">梯度下降或多轮精修策略</text>
  <line x1="218" y1="232" x2="252" y2="232" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="330" y1="276" x2="330" y2="312" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="252" y1="356" x2="218" y2="356" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="140" y1="312" x2="140" y2="276" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <text x="235" y="300" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">循环至收敛</text>
  <rect x="503.791056" y="241.075" width="112.417888" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="560" y="253.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">经典：Σ w (F<tspan dy="2.3" font-size="7.6">o</tspan><tspan dy="-2.3"> − F</tspan><tspan dy="2.3" font-size="7.6">c</tspan><tspan dy="-2.3">)</tspan><tspan dy="-3.6" font-size="7.6">2</tspan></text>
  <rect x="455.63925" y="301.925" width="208.72149999999996" height="16.15" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="560" y="313.42" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">现代：最大似然（refmac5、phenix.refine）</text>
  <text x="460" y="356" font-size="9.5" fill="#475569">把测量误差与模型不完备性显式纳入，</text>
  <text x="460" y="369.5" font-size="9.5" fill="#475569">对「部分错、部分对」的中间态更宽容，</text>
  <text x="460" y="383" font-size="9.5" fill="#475569">收敛更稳。</text>
  <text x="56" y="418" font-size="10" fill="#475569">调整参数使计算衍射与观测之差最小——但权重系数决定「听数据的」还是「听化学的」：程序按分辨率自动调节；权重过大则图跟不上，</text>
  <text x="56" y="432.5" font-size="10" fill="#475569">过小则几何崩坏。</text>
  <rect x="710" y="132" width="660" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、欠定问题：restraints 是「虚拟观测」</text>
  <text x="730" y="226" font-size="11" fill="#6d28d9" font-weight="700">待精修参数</text>
  <rect x="803" y="214" width="159.6" height="24" rx="4" fill="#6d28d926" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="730" y="250" font-size="9.5" fill="#475569">300 残基约 2,400 原子：坐标 7,200 + 各向同性 B 2,400，近万</text>
  <text x="730" y="290" font-size="11" fill="#0369a1" font-weight="700">独立反射观测</text>
  <rect x="814" y="278" width="190" height="24" rx="4" fill="#0369a126" stroke="#0369a1" stroke-width="1.6"/>
  <text x="730" y="314" font-size="9.5" fill="#475569">2 Å 数据的独立反射典型数万——与参数同量级</text>
  <text x="730" y="354" font-size="11" fill="#059669" font-weight="700">加 restraints 后</text>
  <rect x="842.6" y="342" width="380" height="24" rx="4" fill="#05966926" stroke="#059669" stroke-width="1.6"/>
  <text x="730" y="378" font-size="9.5" fill="#475569">数千条化学「虚拟观测」，把体系从欠定拉回超定</text>
  <rect x="750.0569999999999" y="395.075" width="279.8860000000002" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="890" y="407.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">Engh 与 Huber 1991：键长 σ 约 0.02 Å · 键角 σ 约 2°</text>
  <text x="730" y="432" font-size="10" fill="#475569">每个键长键角约束都是一条虚拟观测；分辨率越低观测越少，几何先验权重必须越大——低分辨率的模型更多「由化学写成」。</text>
  <rect x="30" y="482" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="504.84" font-size="19" fill="#475569" font-weight="700">三、B 因子参数化：从原子到刚体</text>
  <text x="206" y="524" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">exp(−B sin<tspan dy="-4.1" font-size="8.6">2</tspan><tspan dy="4.1">θ/λ</tspan><tspan dy="-4.1" font-size="8.6">2</tspan><tspan dy="4.1">)：B 对高分辨率的衰减</tspan></text>
  <rect x="56" y="530" width="300" height="130" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="56" y1="627.5" x2="356" y2="627.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="131" y1="660" x2="131" y2="530" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="56" y1="595" x2="356" y2="595" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="206" y1="660" x2="206" y2="530" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="56" y1="562.5" x2="356" y2="562.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="281" y1="660" x2="281" y2="530" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="62" y1="660" x2="62" y2="666" stroke="#475569" stroke-width="1.8"/>
  <text x="62" y="682" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="206" y1="660" x2="206" y2="666" stroke="#475569" stroke-width="1.8"/>
  <text x="206" y="682" font-size="13" fill="#64748b" text-anchor="middle">0.25（2 Å）</text>
  <line x1="356" y1="660" x2="356" y2="666" stroke="#475569" stroke-width="1.8"/>
  <text x="356" y="682" font-size="13" fill="#64748b" text-anchor="middle">0.5（1 Å）</text>
  <line x1="50" y1="653.5" x2="56" y2="653.5" stroke="#475569" stroke-width="1.8"/>
  <line x1="50" y1="536.5" x2="56" y2="536.5" stroke="#475569" stroke-width="1.8"/>
  <path d="M56.0,530.0 L131.0,545.6 L206.0,589.8 L281.0,627.5 L356.0,649.6" fill="none" stroke="#059669" stroke-width="2.4"/>
  <text x="62" y="537.6" font-size="9.5" fill="#059669" font-weight="700">B=10</text>
  <path d="M56.0,530.0 L131.0,578.1 L206.0,640.5 L281.0,657.9 L356.0,659.7" fill="none" stroke="#d97706" stroke-width="2.4"/>
  <text x="62" y="570.1" font-size="9.5" fill="#d97706" font-weight="700">B=30</text>
  <path d="M56.0,530.0 L131.0,609.3 L206.0,656.9 L281.0,659.9 L356.0,660.0" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <text x="62" y="601.3" font-size="9.5" fill="#dc2626" font-weight="700">B=60</text>
  <text x="56" y="690" font-size="10" fill="#475569">B = 8π<tspan dy="-3.4" font-size="7.2">2</tspan><tspan dy="3.4">⟨u</tspan><tspan dy="-3.4" font-size="7.2">2</tspan><tspan dy="3.4">⟩：位移均方的放大镜。B 大到 80 以上的原子，</tspan></text>
  <text x="56" y="704.5" font-size="10" fill="#475569">高分辨率反射几乎不贡献信息。</text>
  <rect x="400" y="512" width="280" height="180" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="540" y="532" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">TLS 刚体参数化（Schomaker 与 Trueblood 1968）</text>
  <ellipse cx="490" cy="590" rx="58" ry="34" fill="#ede9fe" fill-opacity="0.6" stroke="#6d28d9" stroke-width="2"/>
  <line x1="470" y1="580" x2="502" y2="556" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <text x="506" y="552" font-size="10" fill="#075985" font-weight="700">T 平移</text>
  <path d="M 548,596 a 30 30 0 0 1 -18 26" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-warn)"/>
  <text x="536" y="632" font-size="10" fill="#92400e" font-weight="700">L 摆动</text>
  <path d="M 450,608 q 10 -26 30 -18 q 16 6 10 -18" fill="none" stroke="#be185d" stroke-width="2" marker-end="url(#arr-enz)"/>
  <text x="414" y="620" font-size="10" fill="#be185d" font-weight="700">S 螺旋耦合</text>
  <text x="410" y="662" font-size="10" fill="#475569">每集团仅 20 参数即描述整体振动；</text>
  <text x="410" y="676" font-size="10" fill="#475569">中低分辨率的省参数利器。策略：优于 2 Å 用个别 B；</text>
  <text x="410" y="690" font-size="10" fill="#475569">2–3 Å TLS 加个别 B；3–3.5 Å group B 加 TLS 加强 NCS。</text>
  <rect x="132.91384999999997" y="833.925" width="454.17230000000006" height="16.15" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="360" y="845.42" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">bulk 溶剂校正：Babinet 原则——低角整体衰减，平坦溶剂加掩膜统一校正（Jiang 与 Brünger 1994）</text>
  <rect x="710" y="482" width="660" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="504.84" font-size="19" fill="#475569" font-weight="700">四、策略阶梯与模拟退火</text>
  <rect x="730" y="528" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="555.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">数据分辨率</text>
  <rect x="870" y="528" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="995" y="555.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">推荐策略</text>
  <rect x="1120" y="528" width="230" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="555.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">典型程序选项</text>
  <rect x="730" y="572" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="594.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">优于 1.2 Å</text>
  <rect x="870" y="572" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="995" y="594.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">各向异性 B、riding 氢</text>
  <rect x="1120" y="572" width="230" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="594.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">phenix.refine 个体各向异性</text>
  <rect x="730" y="606" width="620" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="606" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="628.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">1.5–2.0 Å</text>
  <rect x="870" y="606" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="995" y="628.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">个别 B、逐个加水、全 restraints</text>
  <rect x="1120" y="606" width="230" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="628.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">refmac5 加权约束精修</text>
  <rect x="730" y="640" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="662.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">2.0–2.5 Å</text>
  <rect x="870" y="640" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="995" y="662.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">TLS 加个别 B</text>
  <rect x="1120" y="640" width="230" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1235" y="662.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">phenix TLS 加个体 B 交替</text>
  <rect x="730" y="674" width="620" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="674" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="800" y="696.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">2.5–3.5 Å</text>
  <rect x="870" y="674" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
