<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">培养基的设计原则与类型：琼脂物理状态、选择与鉴别体系</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">四原则：目的明确、营养协调、理化适宜、经济节约；琼脂熔点约96℃、凝固点约40℃——固体加1.5%–2%；EMB鉴别乳糖发酵（大肠杆菌紫黑色金属光泽菌落）</text>
  <rect x="30" y="132" width="1340" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、配制培养基的四条原则</text>
  <rect x="50" y="168" width="310" height="76" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="68" y="194" font-size="13.5" fill="#075985" font-weight="700">① 目的明确</text>
  <text x="68" y="216" font-size="11" fill="#475569">依培养对象与目标（长菌/产物）定方案</text>
  <rect x="384" y="168" width="310" height="76" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="402" y="194" font-size="13.5" fill="#075985" font-weight="700">② 营养协调</text>
  <text x="402" y="216" font-size="11" fill="#475569">要素齐全、比例适宜（注意 C/N）</text>
  <rect x="718" y="168" width="310" height="76" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="736" y="194" font-size="13.5" fill="#075985" font-weight="700">③ 理化条件适宜</text>
  <text x="736" y="216" font-size="11" fill="#475569">灭菌后校正 pH；兼顾氧化还原电位 Eh</text>
  <rect x="1052" y="168" width="310" height="76" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1070" y="194" font-size="13.5" fill="#075985" font-weight="700">④ 经济节约</text>
  <text x="1070" y="216" font-size="11" fill="#475569">大规模生产选廉价原料</text>
  <rect x="30" y="302" width="1340" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="324.84" font-size="19" fill="#475569" font-weight="700">二、培养基分类树：按物理状态、用途与化学成分</text>
  <rect x="74.825" y="449.25" width="70.35" height="25.5" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="467.4" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">培养基</text>
  <line x1="155" y1="462" x2="200" y2="379" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="208.8125" y="368.375" width="82.375" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="250" y="383.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">按物理状态</text>
  <line x1="300" y1="379" x2="412" y2="379" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="155" y1="462" x2="200" y2="469" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="221.6875" y="458.375" width="56.625" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="250" y="473.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">按用途</text>
  <line x1="300" y1="469" x2="412" y2="469" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="155" y1="462" x2="200" y2="559" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="208.8125" y="548.375" width="82.375" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="250" y="563.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">按化学成分</text>
  <line x1="300" y1="559" x2="412" y2="559" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="420" y="348" width="250" height="62" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
  <text x="436" y="371" font-size="11.5" fill="#134e4a" font-weight="700">液体（0% 琼脂）</text>
  <text x="436" y="390" font-size="10" fill="#64748b">深层发酵、菌体与代谢物生产</text>
  <rect x="690" y="348" width="250" height="62" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
  <text x="706" y="371" font-size="11.5" fill="#134e4a" font-weight="700">半固体（0.3%–0.5%）</text>
  <text x="706" y="390" font-size="10" fill="#64748b">穿刺接种观察动力；短期保存</text>
  <rect x="960" y="348" width="250" height="62" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
  <text x="976" y="371" font-size="11.5" fill="#134e4a" font-weight="700">固体（1.5%–2%）</text>
  <text x="976" y="390" font-size="10" fill="#64748b">菌落分离纯化、计数、鉴别培养</text>
  <rect x="420" y="438" width="250" height="62" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
  <text x="436" y="461" font-size="11.5" fill="#78350f" font-weight="700">加富培养基</text>
  <text x="436" y="480" font-size="10" fill="#64748b">加目的菌偏爱底物——富集目的菌</text>
  <rect x="690" y="438" width="250" height="62" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
  <text x="706" y="461" font-size="11.5" fill="#78350f" font-weight="700">选择培养基</text>
  <text x="706" y="480" font-size="10" fill="#64748b">加抑制剂——抑制非目的菌</text>
  <rect x="960" y="438" width="250" height="62" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
  <text x="976" y="461" font-size="11.5" fill="#78350f" font-weight="700">鉴别培养基</text>
  <text x="976" y="480" font-size="10" fill="#64748b">含底物与指示剂——菌落可辨</text>
  <rect x="420" y="528" width="250" height="62" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-width="1.3"/>
  <text x="436" y="551" font-size="11.5" fill="#4c1d95" font-weight="700">天然培养基</text>
  <text x="436" y="570" font-size="10" fill="#64748b">成分不明确但营养丰富（牛肉膏）</text>
  <rect x="690" y="528" width="250" height="62" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-width="1.3"/>
  <text x="706" y="551" font-size="11.5" fill="#4c1d95" font-weight="700">合成培养基</text>
  <text x="706" y="570" font-size="10" fill="#64748b">成分与含量完全明确（高氏一号）</text>
  <rect x="960" y="528" width="384" height="62" rx="9" fill="#d1fae5" fill-opacity="0.45" stroke="#059669" stroke-width="1.4"/>
  <text x="978" y="551" font-size="11.5" fill="#059669" font-weight="700">琼脂：熔点 ≈ 96 ℃ · 凝固点 ≈ 40 ℃</text>
  <text x="978" y="572" font-size="10.5" fill="#475569">几乎不被微生物降解——只赋形不供能</text>
  <rect x="30" y="652" width="1340" height="328" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="674.84" font-size="19" fill="#475569" font-weight="700">三、四大经典配方与选择 / 鉴别培养基实例</text>
  <rect x="50" y="700" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="727.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">经典培养基</text>
  <rect x="220" y="700" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="345" y="727.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">成分要点</text>
  <rect x="470" y="700" width="200" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="570" y="727.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">适用对象</text>
  <rect x="50" y="744" width="170" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="771.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">牛肉膏蛋白胨</text>
  <rect x="220" y="744" width="250" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="345" y="771.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">天然培养基（动物性营养）</text>
  <rect x="470" y="744" width="200" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="570" y="771.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">细菌（多数异养菌）</text>
  <rect x="50" y="788" width="620" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="788" width="170" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="815.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">高氏一号</text>
  <rect x="220" y="788" width="250" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="345" y="815.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">合成培养基（可加淀粉）</text>
  <rect x="470" y="788" width="200" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="570" y="815.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">放线菌</text>
  <rect x="50" y="832" width="170" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="859.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">查氏 / PDA</text>
  <rect x="220" y="832" width="250" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="345" y="859.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">蔗糖-硝酸盐 / 土豆-葡萄糖</text>
  <rect x="470" y="832" width="200" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="570" y="859.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">真菌</text>
  <rect x="50" y="876" width="620" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="876" width="170" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="135" y="903.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">麦芽汁</text>
  <rect x="220" y="876" width="250" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="345" y="903.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">天然培养基（麦芽糖为主）</text>
  <rect x="470" y="876" width="200" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="570" y="903.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">酵母菌</text>
  <text x="360" y="940" font-size="11" fill="#64748b" text-anchor="middle">——「细菌用肉汤、放线菌用高氏、真菌用查氏、酵母用麦芽汁」</text>
  <rect x="690" y="700" width="650" height="82" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="712.8076" y="715.8" width="94.3848" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="760" y="730.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">EMB 伊红美蓝</text>
  <text x="900" y="726" font-size="10.5" fill="#78350f" font-weight="700">鉴别</text>
  <text x="710" y="756" font-size="11" fill="#475569">抑制革兰氏阳性菌；大肠杆菌发酵乳糖产酸——形成紫黑色带金属光泽的菌落。</text>
  <rect x="690" y="790" width="650" height="82" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="720.1" y="805.8" width="79.80000000000001" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="760" y="820.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">马丁培养基</text>
  <text x="900" y="816" font-size="10.5" fill="#78350f" font-weight="700">选择</text>
  <text x="710" y="846" font-size="11" fill="#475569">加入孟加拉红与链霉素等——抑制细菌、分离真菌。</text>
  <rect x="690" y="880" width="650" height="82" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="728.9992" y="895.8" width="62.0016" height="20.4" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="760" y="910.32" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">SS 琼脂</text>
  <text x="900" y="906" font-size="10.5" fill="#78350f" font-weight="700">选择</text>
  <text x="710" y="936" font-size="11" fill="#475569">抑制大肠杆菌与革兰氏阳性菌——分离肠道致病菌（沙门氏、志贺氏菌）。</text>
  <circle cx="1280" cy="738" r="26" fill="#ccfbf1" fill-opacity="0.4" stroke="#0f766e" stroke-width="1.8"/>
  <circle cx="1272" cy="732" r="6" fill="#1e293b"/>
  <circle cx="1290" cy="744" r="5" fill="#1e293b"/>
  <text x="1280" y="776" font-size="9.5" fill="#64748b" text-anchor="middle">紫黑色菌落</text>
</svg>