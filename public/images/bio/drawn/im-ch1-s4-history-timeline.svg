<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">免疫学发展简史：从牛痘接种到免疫检查点治疗的里程碑时间线</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">1796年琴纳牛痘接种开创理性疫苗接种，1980年天花被宣布根除；巴斯德研制炭疽（1881）与狂犬病（1885）减毒疫苗；1890年血清疗法与1908</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">年细胞/体液两派共享诺奖；1975年杂交瘤技术诞生单克隆抗体；2018年CTLA-4与PD-1免疫检查点治疗获诺贝尔奖</text>
  <rect x="30" y="132" width="1340" height="372" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、免疫学发展简史：从人痘经验到检查点治疗的里程碑</text>
  <line x1="80" y1="350" x2="1330" y2="350" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="105" cy="350" r="6.5" fill="#0f766e"/>
  <line x1="105" y1="341" x2="105" y2="320" stroke="#0f766e" stroke-width="1.7"/>
  <text x="105" y="300" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1796 琴纳牛痘接种</text>
  <text x="105" y="280" font-size="12" fill="#64748b" text-anchor="middle">开创理性疫苗接种</text>
  <circle cx="242.5" cy="350" r="6.5" fill="#dc2626"/>
  <line x1="242.5" y1="359" x2="242.5" y2="380" stroke="#dc2626" stroke-width="1.7"/>
  <text x="242.5" y="400" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">巴斯德减毒疫苗</text>
  <text x="242.5" y="420" font-size="12" fill="#64748b" text-anchor="middle">炭疽 1881 · 狂犬 1885</text>
  <circle cx="392.5" cy="350" r="6.5" fill="#0369a1"/>
  <line x1="392.5" y1="341" x2="392.5" y2="320" stroke="#0369a1" stroke-width="1.7"/>
  <text x="392.5" y="300" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1890 血清疗法</text>
  <text x="392.5" y="280" font-size="12" fill="#64748b" text-anchor="middle">Behring 与北里柴三郎 · 1901 首届诺奖</text>
  <circle cx="542.5" cy="350" r="6.5" fill="#6d28d9"/>
  <line x1="542.5" y1="359" x2="542.5" y2="380" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="542.5" y="400" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1908 两派和解</text>
  <text x="542.5" y="420" font-size="12" fill="#64748b" text-anchor="middle">梅奇尼科夫与埃尔利希共享诺奖</text>
  <circle cx="705" cy="350" r="6.5" fill="#be185d"/>
  <line x1="705" y1="341" x2="705" y2="320" stroke="#be185d" stroke-width="1.7"/>
  <text x="705" y="300" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">克隆选择学说</text>
  <text x="705" y="280" font-size="12" fill="#64748b" text-anchor="middle">伯内特：统一特异性·记忆·耐受</text>
  <circle cx="855" cy="350" r="6.5" fill="#0f766e"/>
  <line x1="855" y1="359" x2="855" y2="380" stroke="#0f766e" stroke-width="1.7"/>
  <text x="855" y="400" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1975 杂交瘤技术</text>
  <text x="855" y="420" font-size="12" fill="#64748b" text-anchor="middle">单克隆抗体诞生</text>
  <circle cx="1005" cy="350" r="6.5" fill="#059669"/>
  <line x1="1005" y1="341" x2="1005" y2="320" stroke="#059669" stroke-width="1.7"/>
  <text x="1005" y="300" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1980 天花根除</text>
  <text x="1005" y="280" font-size="12" fill="#64748b" text-anchor="middle">世界卫生大会宣布</text>
  <circle cx="1155" cy="350" r="6.5" fill="#6d28d9"/>
  <line x1="1155" y1="359" x2="1155" y2="380" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="1155" y="400" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">抗体基因重排</text>
  <text x="1155" y="420" font-size="12" fill="#64748b" text-anchor="middle">利根川进破解多样性之谜</text>
  <circle cx="1292.5" cy="350" r="6.5" fill="#dc2626"/>
  <line x1="1292.5" y1="341" x2="1292.5" y2="320" stroke="#dc2626" stroke-width="1.7"/>
  <text x="1292.5" y="300" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2018 检查点诺奖</text>
  <text x="1292.5" y="280" font-size="12" fill="#64748b" text-anchor="middle">CTLA-4 与 PD-1 改写肿瘤治疗</text>
  <text x="700" y="478" font-size="11.5" fill="#64748b" text-anchor="middle">经验免疫学时期：明代中国的「人痘接种」经蒙塔古夫人西传，为琴纳的牛痘接种铺路；1798 年琴纳发表论文，vaccination 词根 vacca 即「牛」</text>
  <rect x="30" y="520" width="1340" height="216" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="542.84" font-size="19" fill="#475569" font-weight="700">二、细胞免疫与体液免疫：两派之争的和解</text>
  <rect x="70" y="568" width="560" height="104" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.7"/>
  <text x="90" y="594" font-size="14" fill="#134e4a" font-weight="700">细胞免疫学派 —— 梅奇尼科夫</text>
  <text x="90" y="618" font-size="11.5" fill="#475569">吞噬理论：白细胞吞噬病原体即免疫之本；1881 年普利堡绵羊试验轰动欧洲。</text>
  <circle cx="120" cy="648" r="13" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <rect x="112" y="644.5" width="16" height="7" rx="3.5" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
  <text x="140" y="652" font-size="10.5" fill="#64748b">吞噬病原体的白细胞</text>
  <rect x="678.421" y="607.25" width="43.158" height="25.5" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="625.4" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">VS</text>
  <rect x="770" y="568" width="560" height="104" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.7"/>
  <text x="790" y="594" font-size="14" fill="#075985" font-weight="700">体液免疫学派 —— Behring 与北里柴三郎</text>
  <text x="790" y="618" font-size="11.5" fill="#475569">1890 年证明免疫血清中存在「抗毒素」，可中和白喉与破伤风毒素——血清疗法诞生，</text>
  <text x="790" y="635" font-size="11.5" fill="#475569">Behring 独得 1901 年首届诺贝尔奖。</text>
  <rect x="903.675" y="638.65" width="72.65" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="940" y="651.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">血清抗毒素</text>
  <rect x="1069.34" y="638.65" width="61.32" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1100" y="651.96" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">中和毒素</text>
  <line x1="1010" y1="648" x2="1054" y2="648" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <text x="700" y="706" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">1908 年梅奇尼科夫与埃尔利希共享诺贝尔奖——细胞免疫与体液免疫各有其位，恰是现代免疫学的常识</text>
  <rect x="30" y="752" width="1340" height="226" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="774.84" font-size="19" fill="#475569" font-weight="700">三、现代免疫学的理论基石与一场完胜</text>
  <rect x="70" y="792" width="620" height="130" rx="9" fill="#fce7f3" fill-opacity="0.35" stroke="#be185d" stroke-width="1.7"/>
  <text x="90" y="818" font-size="14" fill="#831843" font-weight="700">克隆选择学说（伯内特）</text>
  <text x="90" y="842" font-size="11.5" fill="#475569">抗原从预存的受体库中选择相应克隆并使之扩增——统一解释特异性、记忆与耐受，是现代免疫学的理论基石。</text>
  <circle cx="100" cy="898" r="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="132" cy="898" r="8" fill="#be185d" stroke="#be185d" stroke-width="1.6"/>
  <circle cx="164" cy="898" r="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <circle cx="196" cy="898" r="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="210" y1="898" x2="250" y2="898" stroke="#be185d" stroke-width="1.8" marker-end="url(#arr-enz)"/>
  <circle cx="260" cy="898" r="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <circle cx="286" cy="898" r="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <circle cx="312" cy="898" r="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <text x="340" y="902" font-size="10.5" fill="#831843" font-weight="700">抗原选中 → 克隆扩增</text>
  <rect x="720" y="792" width="620" height="130" rx="9" fill="#ede9fe" fill-opacity="0.35" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="740" y="818" font-size="14" fill="#4c1d95" font-weight="700">抗体的结构与多样性之谜</text>
  <text x="740" y="842" font-size="11.5" fill="#475569">波特与埃德尔曼解析抗体四肽链结构；</text>
  <text x="740" y="859" font-size="11.5" fill="#475569">利根川进以基因重排破解抗体多样性之谜——两条重链与两条轻链如何编码近乎无限的识别库。</text>
  <path d="M 950 912 L 950 886 M 950 886 L 936 866 M 950 886 L 964 866" fill="none" stroke="#6d28d9" stroke-width="4.5"/>
  <circle cx="936" cy="862" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <circle cx="964" cy="862" r="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="978" y="900" font-size="10.5" fill="#4c1d95" font-weight="700">Y 形四肽链抗体（2 重链 + 2 轻链）</text>
  <rect x="70" y="936" width="1280" height="32" rx="7" fill="#d1fae5" fill-opacity="0.45" stroke="#059669" stroke-width="1.3"/>
  <text x="710" y="958" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">1980 年 5 月，世界卫生大会正式宣布天花在全球根除——免疫学以一场完胜回报了它的起点</text>
</svg>