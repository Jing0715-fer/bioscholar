<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">神经系统的早期发育：神经诱导、神经管闭合与皮层 inside-out 分层</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">诱导即去抑制（noggin/chordin 拮抗 BMP）；前孔约 25 天、后孔约 27–28 天闭合；约半数神经元经凋亡删减</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、神经诱导：组织者与默认模型（Spemann 1924）</text>
  <text x="60" y="200" font-size="11" fill="#475569">Spemann 与 Mangold 将蝾螈背侧胚孔唇移植到另一胚胎腹侧，</text>
  <text x="60" y="216" font-size="11" fill="#475569">竟诱导出完整的次级神经轴乃至双头胚胎——移植物发出改变命运的信号，这块组织被称为「组织者」。</text>
  <rect x="60" y="268" width="200" height="90" rx="9" fill="#ede9fe" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="160" y="296" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">外胚层</text>
  <text x="160" y="318" font-size="10.5" fill="#64748b" text-anchor="middle">（默认命运 → 神经）</text>
  <text x="160" y="340" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">「默认成神经」</text>
  <rect x="312.88445" y="278.65" width="114.23110000000001" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="370" y="291.96" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">BMP 信号 → 表皮化</text>
  <line x1="262" y1="288" x2="303" y2="288" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-bad)"/>
  <rect x="290.3944" y="334.65" width="159.2112" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="370" y="347.96" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">组织者分泌 noggin / chordin</text>
  <line x1="370" y1="330" x2="330" y2="316" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <text x="470" y="372" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">拮抗 BMP → 神经诱导</text>
  <text x="60" y="392" font-size="11" fill="#475569" font-weight="700">诱导即「去抑制」：组织者不添加神经指令，而是解除 BMP 的表皮化命令——默认模型由此得名。</text>
  <text x="60" y="442" font-size="11" fill="#64748b">神经诱导是区域化的：组织者信号沿头尾轴梯度分布，为后继的脑区划分预埋位置信息。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、神经管闭合（第 3–4 周）与三脑泡分区</text>
  <line x1="740" y1="200" x2="1330" y2="200" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="756" cy="200" r="5.5" fill="#0f766e"/>
  <text x="756" y="224" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">约第 22 天</text>
  <text x="756" y="242" font-size="10" fill="#64748b" text-anchor="middle">神经褶开始愈合</text>
  <circle cx="930" cy="200" r="5.5" fill="#0f766e"/>
  <text x="930" y="224" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">约 25 天</text>
  <text x="930" y="242" font-size="10" fill="#64748b" text-anchor="middle">前神经孔闭合</text>
  <circle cx="1104" cy="200" r="5.5" fill="#0f766e"/>
  <text x="1104" y="224" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">约 27–28 天</text>
  <text x="1104" y="242" font-size="10" fill="#64748b" text-anchor="middle">后神经孔闭合</text>
  <circle cx="1290" cy="200" r="5.5" fill="#0f766e"/>
  <text x="1290" y="224" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">此后</text>
  <text x="1290" y="242" font-size="10" fill="#64748b" text-anchor="middle">脑泡分区与增殖</text>
  <rect x="740" y="258" width="290" height="84" rx="9" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.6"/>
  <text x="756" y="280" font-size="11" fill="#475569">闭合缺陷：前孔不闭 → 无脑畸形；</text>
  <text x="756" y="295" font-size="11" fill="#475569">后孔不闭 → 脊柱裂。围孕期补充叶酸可显著预防。</text>
  <rect x="1050" y="258" width="280" height="84" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1066" y="280" font-size="11" fill="#475569">分区基因：Hox 编码后脑菱脑节；</text>
  <text x="1066" y="295" font-size="11" fill="#475569">Otx2 / Gbx2 划定中脑-后脑边界；</text>
  <text x="1066" y="310" font-size="11" fill="#475569">信号中心提供位置信息。</text>
  <rect x="740" y="352" width="100" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="379.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">初级脑泡</text>
  <rect x="840" y="352" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="925" y="379.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">次级结构</text>
  <rect x="1010" y="352" width="320" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="379.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">主要衍生物</text>
  <rect x="740" y="396" width="100" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="416.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">前脑</text>
  <rect x="840" y="396" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="925" y="416.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">端脑</text>
  <rect x="1010" y="396" width="320" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="416.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">大脑皮层、基底神经节、海马</text>
  <rect x="740" y="426" width="590" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="426" width="100" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="446.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">前脑</text>
  <rect x="840" y="426" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="925" y="446.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">间脑</text>
  <rect x="1010" y="426" width="320" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="446.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">丘脑、下丘脑、上丘脑与视网膜</text>
  <rect x="740" y="456" width="100" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="476.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">中脑</text>
  <rect x="840" y="456" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="925" y="476.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">中脑</text>
  <rect x="1010" y="456" width="320" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="476.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">上丘与下丘、黑质、红核</text>
  <rect x="740" y="486" width="590" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="486" width="100" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="506.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">后脑</text>
  <rect x="840" y="486" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="925" y="506.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">菱脑前部</text>
  <rect x="1010" y="486" width="320" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="506.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">脑桥与小脑</text>
  <rect x="740" y="516" width="100" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="790" y="536.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">后脑</text>
  <rect x="840" y="516" width="170" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="925" y="536.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">末脑（延髓）</text>
  <rect x="1010" y="516" width="320" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1170" y="536.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">延髓（呼吸与心血管中枢）</text>
  <rect x="30" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、放射状胶质：干细胞 + 迁移脚手架的双重身份</text>
  <rect x="80" y="648" width="560" height="240" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="80" y1="706" x2="640" y2="706" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="80" y1="764" x2="640" y2="764" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="120" y="676" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">VZ 脑室区（放射状胶质胞体）</text>
  <text x="120" y="730" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">SVZ 脑室下区（人类显著扩张）</text>
  <text x="140" y="800" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">皮层板（六层，由内向外生成）</text>
  <line x1="220" y1="712" x2="220" y2="840" stroke="#6d28d9" stroke-width="1.8" opacity="0.75"/>
  <line x1="300" y1="712" x2="300" y2="840" stroke="#6d28d9" stroke-width="1.8" opacity="0.75"/>
  <line x1="380" y1="712" x2="380" y2="840" stroke="#6d28d9" stroke-width="1.8" opacity="0.75"/>
  <line x1="460" y1="712" x2="460" y2="840" stroke="#6d28d9" stroke-width="1.8" opacity="0.75"/>
  <circle cx="300" cy="780" r="7" fill="#b45309"/>
  <circle cx="380" cy="745" r="7" fill="#b45309"/>
  <circle cx="460" cy="815" r="7" fill="#b45309"/>
  <line x1="455" y1="822" x2="485" y2="845" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <text x="545" y="878" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">沿放射状纤维攀行</text>
  <text x="80" y="908" font-size="11" fill="#475569">inside-out 分层：早生者居深层、晚生者越过先辈居浅层——皮层的「年轮」由内向外生长；</text>
  <text x="80" y="923" font-size="11" fill="#475569">人类 SVZ 扩张与皮层神经元数量及脑沟回复杂度相关。</text>
  <rect x="710" y="578" width="620" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="600.84" font-size="19" fill="#475569" font-weight="700">四、发育性凋亡：约半数神经元的「选拔赛」</text>
  <rect x="816" y="742.9565217391304" width="128" height="113.04347826086958" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <text x="880" y="733.9565217391304" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">100%</text>
  <text x="880" y="876" font-size="12.5" fill="#64748b" text-anchor="middle">出生时神经元数</text>
  <rect x="1016" y="799.4782608695652" width="128" height="56.52173913043479" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.6"/>
  <text x="1080" y="790.4782608695652" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">约 50% 存活</text>
  <text x="1080" y="876" font-size="12.5" fill="#64748b" text-anchor="middle">存活（约半数）</text>
  <text x="740" y="660" font-size="11.5" fill="#475569">约半数神经元经发育性凋亡被删除；存活取决于靶源性神经营养因子（NGF、BDNF 等）</text>
  <text x="740" y="677" font-size="11.5" fill="#475569">——「谁拿到靶区的营养券，谁活下去」。</text>
  <text x="740" y="902" font-size="11" fill="#64748b">这一选拔使神经元数量与靶组织规模匹配：神经支配富余即被裁撤，突触连接精度由此打磨。</text>
</svg>