  <text x="1060" y="208" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">去核卵母细胞</text>
  <line x1="950" y1="250" x2="1010" y2="250" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#arr-pro)"/>
