  <text x="190" y="431.42" font-size="9.5" fill="#134e4a" text-anchor="middle">管家基因：各类细胞均表达（维持基本生命活动）</text>
  <rect x="453.25" y="419.925" width="133.5" height="16.15" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="431.42" font-size="9.5" fill="#78350f" text-anchor="middle">奢侈基因：组织特异性高表达</text>
  <text x="64" y="470" font-size="10" fill="#475569">分化＝奢侈基因的选择性表达：产物赋予细胞特化表型（血红蛋白、胰岛素、白蛋白）；</text>
  <text x="64" y="484" font-size="10" fill="#475569">分化是基因表达调控的结果而非基因丢失——基因组 DNA 含量保持不变。</text>
  <text x="64" y="518" font-size="9.5" fill="#64748b">少数例外：B 淋巴细胞免疫球蛋白基因重排、tRNA / 抗体基因的体细胞突变。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、Gurdon 爪蟾核移植（1962）：终末分化细胞核仍全能</text>
