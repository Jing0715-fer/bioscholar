  <rect x="211.0838" y="720.65" width="37.83240000000001" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="230" y="733.96" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">Pax6</text>
  <text x="230" y="758" font-size="9" fill="#64748b" text-anchor="middle">决定眼的发育</text>
  <text x="64" y="806" font-size="10" fill="#475569" font-weight="600">组合调控：少数转录因子经组合排列调控数以千计的靶基因。</text>
