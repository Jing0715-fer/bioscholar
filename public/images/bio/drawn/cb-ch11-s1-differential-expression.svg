  <text x="1060" y="312" font-size="9.5" fill="#64748b" text-anchor="middle">核移植入卵质</text>
  <line x1="1130" y1="250" x2="1220" y2="250" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <circle cx="1252" cy="250" r="20" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="1252" y="254" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">胚胎</text>
  <line x1="1252" y1="272" x2="1252" y2="314" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <text x="1252" y="340" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">正常克隆蛙</text>
  <text x="740" y="396" font-size="10" fill="#475569">首次证明终末分化细胞的细胞核仍保有全套发育潜能（核的全能性）——分化的可逆性由此确立，开启核移植研究。</text>
  <rect x="727.001" y="443.5" width="265.998" height="17" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="860" y="455.6" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">Gurdon 与山中伸弥共享 2012 年诺贝尔生理学或医学奖</text>
  <text x="740" y="500" font-size="9.5" fill="#64748b">非洲爪蟾肠上皮细胞核 → 去核卵母细胞 → 培育出正常克隆蛙。</text>
  <rect x="30" y="576" width="1340" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、主导转录因子的组合调控与表观遗传记忆</text>
  <text x="64" y="618" font-size="11.5" fill="#1e293b" font-weight="700">主导转录因子（master TF）</text>
  <ellipse cx="140" cy="672" rx="52" ry="28" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="140" y="716" font-size="9" fill="#64748b" text-anchor="middle">成纤维细胞</text>
  <rect x="211.0838" y="662.65" width="37.83240000000001" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="230" y="675.96" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">MyoD</text>
