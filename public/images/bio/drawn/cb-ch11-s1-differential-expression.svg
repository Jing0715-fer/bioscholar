  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">细胞分化的本质：基因的差异表达与可逆性</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">管家基因持续表达、奢侈基因按类型开启（基因组不变）；Gurdon 1962 核移植证明分化可逆（2012 诺奖）；MyoD/Pax6 组合调控，表观遗传维持细胞记忆</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、管家基因持续表达，奢侈基因选择性开启</text>
  <text x="64" y="186" font-size="10.5" fill="#475569" font-weight="700">基因表达谱（深＝高表达）</text>
  <text x="130" y="214" font-size="9" fill="#64748b" text-anchor="middle">糖酵解酶</text>
  <text x="226" y="214" font-size="9" fill="#64748b" text-anchor="middle">核糖体蛋白</text>
  <text x="322" y="214" font-size="9" fill="#64748b" text-anchor="middle">白蛋白</text>
  <text x="418" y="214" font-size="9" fill="#64748b" text-anchor="middle">血红蛋白</text>
