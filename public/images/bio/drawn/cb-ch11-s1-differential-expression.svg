  <text x="800" y="306" font-size="9.5" fill="#64748b" text-anchor="middle">肠上皮细胞</text>
  <text x="800" y="322" font-size="9" fill="#64748b" text-anchor="middle">（终末分化）</text>
  <line x1="856" y1="250" x2="950" y2="250" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#arr-pro)"/>
