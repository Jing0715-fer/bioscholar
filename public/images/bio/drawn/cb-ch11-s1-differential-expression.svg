  <text x="833" y="721" font-size="8.5" fill="#075985" text-anchor="middle" font-weight="700">胰腺 β 细胞</text>
  <text x="470" y="762" font-size="9.5" fill="#64748b">同一套因子以不同组合开启不同基因程序。</text>
  <text x="920" y="618" font-size="11.5" fill="#1e293b" font-weight="700">表观遗传：既执行程序又维持记忆</text>
  <rect x="979.65685" y="639.925" width="60.686299999999996" height="16.15" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1010" y="651.42" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">DNA 甲基化</text>
  <text x="1140" y="652" font-size="9.5" fill="#475569">CpG 位点甲基化关闭基因</text>
  <rect x="980.5375" y="679.925" width="58.925000000000004" height="16.15" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1010" y="691.42" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">组蛋白修饰</text>
  <text x="1140" y="692" font-size="9.5" fill="#475569">乙酰化开放 / 甲基化压缩</text>
  <rect x="960.28255" y="719.925" width="99.4349" height="16.15" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1010" y="731.42" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">Polycomb·H3K27me3</text>
  <text x="1140" y="732" font-size="9.5" fill="#475569">谱系基因的沉默标记</text>
  <rect x="980.5375" y="759.925" width="58.925000000000004" height="16.15" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1010" y="771.42" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">染色质重塑</text>
  <text x="1140" y="772" font-size="9.5" fill="#475569">核小体定位改变可及性</text>
  <text x="920" y="826" font-size="10" fill="#475569">分裂后将谱系特异的染色质状态传递给子细胞（细胞记忆）；肿瘤细胞分化状态丧失</text>
  <text x="920" y="840" font-size="10" fill="#475569">（去分化 / 发育不良）成为病理诊断依据。</text>
  <text x="64" y="858" font-size="10" fill="#64748b">两百余种细胞类型共享同一基因组——差异表达 + 表观遗传记忆的组合，构成分化的分子基础。</text>
</svg>