  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">全局指标与验证报告：百分位、PDB_REDO 与可重复性</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">wwPDB 报告（2012 起强制）：绝对值＋百分位，按分辨率分组解读；clashscore 好于 95% 即前 5%；PDB_REDO 平均 Rfree 再降约 2 个百分点</text>
  <rect x="30" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、wwPDB 验证报告：三层结构与两版分发</text>
  <text x="60" y="200" font-size="10.5" fill="#1e293b" font-weight="700">第一层 · 首页汇总表（绝对值＋百分位）</text>
  <rect x="60" y="210" width="168" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="144" y="237.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">指标</text>
  <rect x="228" y="210" width="92" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="274" y="237.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">绝对值</text>
  <rect x="320" y="210" width="100" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="370" y="237.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">百分位</text>
  <rect x="60" y="254" width="168" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="144" y="271.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">R<tspan dy="2.1" font-size="6.8">work</tspan><tspan dy="-2.1">／R</tspan><tspan dy="2.1" font-size="6.8">free</tspan></text>
  <rect x="228" y="254" width="92" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="274" y="271.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">0.19／0.23</text>
  <rect x="320" y="254" width="100" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="370" y="271.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">前 15%</text>
  <rect x="60" y="278" width="360" height="24" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="278" width="168" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="144" y="295.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">clashscore</text>
  <rect x="228" y="278" width="92" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="274" y="295.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">3.2</text>
  <rect x="320" y="278" width="100" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="370" y="295.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">前 5%</text>
  <rect x="60" y="302" width="168" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="144" y="319.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">Ramachandran outlier</text>
  <rect x="228" y="302" width="92" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="274" y="319.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">0.2%</text>
  <rect x="320" y="302" width="100" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="370" y="319.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">前 10%</text>
  <rect x="60" y="326" width="360" height="24" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="326" width="168" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="144" y="343.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">rotamer outlier</text>
  <rect x="228" y="326" width="92" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="274" y="343.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">0.8%</text>
  <rect x="320" y="326" width="100" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="370" y="343.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">前 20%</text>
  <rect x="60" y="350" width="168" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="144" y="367.5" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="700">配体 llgf</text>
  <rect x="228" y="350" width="92" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="274" y="367.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">＋85</text>
  <rect x="320" y="350" width="100" height="24" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="370" y="367.5" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="500">正区</text>
  <text x="60" y="394" font-size="10.5" fill="#1e293b" font-weight="700">第二层 · outlier 清单</text>
  <rect x="60" y="402" width="360" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="70" y="418" font-size="9" fill="#475569">Ramachandran、rotamer、clash、</text>
  <text x="70" y="430" font-size="9" fill="#475569">RSRZ 各自点名到残基与原子</text>
  <line x1="336" y1="438" x2="350" y2="410" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="360" y1="438" x2="374" y2="412" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="384" y1="438" x2="398" y2="414" stroke="#dc2626" stroke-width="1.6"/>
  <text x="60" y="464" font-size="10.5" fill="#1e293b" font-weight="700">第三层 · 数据质量节</text>
  <rect x="60" y="472" width="360" height="30" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="70" y="491" font-size="9" fill="#475569">完整度 · 信噪比 · 异常反射比例</text>
  <text x="448" y="200" font-size="9.5" fill="#475569">2011 年 Read 等代表 wwPDB 发表新一代晶体学验证工具体系；</text>
  <text x="448" y="213" font-size="9.5" fill="#475569">2012 年起 OneDep 投递流程强制自动生成验证报告——每项指标给绝对值与百分位排名。</text>
  <text x="448" y="264" font-size="9.5" fill="#475569">两版分发：投递人自查的完整版（OneDep 下载）</text>
  <text x="448" y="277" font-size="9.5" fill="#475569">与随结构公开的精简版。</text>
  <text x="448" y="302" font-size="9.5" fill="#475569">IUCr 系刊与多数结构期刊已把「随附验证报告」写进投稿要求；</text>
  <text x="448" y="315" font-size="9.5" fill="#475569">审稿人对照红色条目逐一发问——报告是投稿时就站在案头的体检单，</text>
  <text x="448" y="328" font-size="9.5" fill="#475569">不是发表后的评语。</text>
  <text x="448" y="366" font-size="9.5" fill="#475569">三层信息量递增、阅读成本也递增：审稿人看首页、</text>
  <text x="448" y="379" font-size="9.5" fill="#475569">作者看全部；</text>
  <text x="448" y="392" font-size="9.5" fill="#475569">要出问题的结构往往在第三层才露出马脚。</text>
  <text x="448" y="417" font-size="9.5" fill="#64748b">检索工具：按 clashscore、分辨率、</text>
  <text x="448" y="430" font-size="9.5" fill="#64748b">配体适合度筛库，已是数据库使用的常规姿势。</text>
  <rect x="710" y="132" width="660" height="412" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、百分位的解读：同分辨率区间内的体检</text>
  <rect x="740" y="196" width="140" height="26" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <rect x="880" y="196" width="392" height="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="1272" y="196" width="28" height="26" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <polygon points="1277,194 1289,194 1283,183" fill="#059669"/>
  <text x="1270" y="180" font-size="9.5" fill="#065f46" text-anchor="end" font-weight="700">clashscore 好于 95% 的同期条目＝前 5%</text>
  <line x1="740" y1="222" x2="740" y2="230" stroke="#475569" stroke-width="1.6"/>
  <text x="740" y="246" font-size="9" fill="#64748b" text-anchor="middle">0%</text>
  <line x1="880" y1="222" x2="880" y2="230" stroke="#475569" stroke-width="1.6"/>
  <text x="880" y="246" font-size="9" fill="#64748b" text-anchor="middle">25%</text>
  <line x1="1020" y1="222" x2="1020" y2="230" stroke="#475569" stroke-width="1.6"/>
  <text x="1020" y="246" font-size="9" fill="#64748b" text-anchor="middle">50%</text>
  <line x1="1160" y1="222" x2="1160" y2="230" stroke="#475569" stroke-width="1.6"/>
  <text x="1160" y="246" font-size="9" fill="#64748b" text-anchor="middle">75%</text>
  <line x1="1300" y1="222" x2="1300" y2="230" stroke="#475569" stroke-width="1.6"/>
  <text x="1300" y="246" font-size="9" fill="#64748b" text-anchor="middle">100%</text>
  <text x="740" y="266" font-size="9.5" fill="#dc2626" font-weight="700">0–25%：后四分之一</text>
  <text x="1300" y="266" font-size="9.5" fill="#065f46" text-anchor="end" font-weight="700">95–100%：前 5%</text>
  <polygon points="756,368 796,365 836,354 871,314 906,354 946,365 986,368" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="2"/>
  <text x="871" y="302" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">1.2 Å 组</text>
  <polygon points="1026,368 1066,365 1106,354 1141,314 1176,354 1216,365 1256,368" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="2"/>
  <text x="1141" y="302" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">3.5 Å 组</text>
  <line x1="1000" y1="330" x2="1018" y2="348" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="1018" y1="330" x2="1000" y2="348" stroke="#dc2626" stroke-width="2.2"/>
  <text x="1010" y="368" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">不跨组</text>
  <text x="1030" y="390" font-size="9.5" fill="#475569" text-anchor="middle">3.5 Å 的结构与 3.5 Å 的比，不与 1.2 Å 的比——分辨率决定可达质量</text>
  <text x="726" y="414" font-size="9.5" fill="#475569">两条纪律：其一，百分位按分辨率区间分组解读；其二，百分位是体检不是审判——一项落后查一项（多为可修复的局部），</text>
  <text x="726" y="427" font-size="9.5" fill="#475569">成片落后提示系统性问题（数据、精修或建模某一环）。红色条目是作者与读者共同的整改清单，不是给结构贴的封条。</text>
  <text x="726" y="452" font-size="9.5" fill="#475569">作者姿势：投稿前打印 outlier 清单，逐个修复可修的（几何、水、占有率）；修不了的（活性位点真实应变、局部无序）在正文预作说明、</text>
  <text x="726" y="465" font-size="9.5" fill="#475569">附上证据——审稿人发问之前先自答，是报告时代的写作礼仪。</text>
  <text x="726" y="490" font-size="9.5" fill="#64748b">分辨率与 R<tspan dy="2.1" font-size="6.8">free</tspan><tspan dy="-2.1"> 的规律曲线对一切指标同样成立——判读百分位先看分组、再看单项。</tspan></text>
  <rect x="30" y="552" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="574.84" font-size="19" fill="#475569" font-weight="700">三、PDB_REDO：全库的再精修运动（Joosten 等，2009 年起）</text>
  <line x1="60" y1="745" x2="280" y2="745" stroke="#475569" stroke-width="1.8"/>
  <rect x="80" y="625" width="60" height="120" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="110" y="618" font-size="9.5" fill="#92400e" text-anchor="middle" font-weight="700">约 0.24</text>
  <text x="110" y="768" font-size="10" fill="#475569" text-anchor="middle">原条目</text>
  <rect x="180" y="635" width="60" height="110" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="210" y="628" font-size="9.5" fill="#065f46" text-anchor="middle" font-weight="700">约 0.22</text>
  <text x="210" y="768" font-size="10" fill="#475569" text-anchor="middle">PDB_REDO</text>
  <rect x="94.95935999999999" y="587.5" width="150.08128000000002" height="17" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="170" y="599.6" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">平均 R<tspan dy="2.2" font-size="7.2">free</tspan><tspan dy="-2.2"> 再降约 2 个百分点</tspan></text>
  <text x="320" y="588" font-size="10.5" fill="#1e293b" font-weight="700">全库规模的统计结论</text>
  <rect x="320" y="590" width="168" height="54" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="404" y="612" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Ramachandran outlier</text>
  <text x="404" y="632" font-size="9.5" fill="#065f46" text-anchor="middle" font-weight="700">大面积清零</text>
  <rect x="504" y="590" width="168" height="54" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="588" y="612" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">rotamer outlier</text>
  <text x="588" y="632" font-size="9.5" fill="#065f46" text-anchor="middle" font-weight="700">大面积清零</text>
  <rect x="320" y="656" width="168" height="54" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="404" y="678" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">clashscore</text>
  <text x="404" y="698" font-size="9.5" fill="#065f46" text-anchor="middle" font-weight="700">显著回落</text>
  <rect x="504" y="656" width="168" height="54" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="588" y="678" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">侧链·氢·水</text>
  <text x="588" y="698" font-size="9.5" fill="#065f46" text-anchor="middle" font-weight="700">按现代参数集重建</text>
  <text x="46" y="792" font-size="9.5" fill="#475569">对全库历史条目自动再精修：按现代参数集重建侧链与氢、重放水、重调权重，</text>
  <text x="46" y="805" font-size="9.5" fill="#475569">再以同一套验证指标前后对照——「行动队」补上验证时代的执行侧。</text>
  <text x="46" y="830" font-size="9.5" fill="#475569">方法学「再优化、不重建」：只在既有模型的参数与权重层面找便宜（重精修、重加氢与水、重挑 rotamer），</text>
  <text x="46" y="843" font-size="9.5" fill="#475569">不动大架构——收益可归因于方法与工具的进化；工程上是一棵决策树逐条目判断，历史条目的自由集未必在档，</text>
  <text x="46" y="856" font-size="9.5" fill="#475569">重抽自由集则前后 R<tspan dy="2.1" font-size="6.8">free</tspan><tspan dy="-2.1"> 不可直接比较，须如实标注。</tspan></text>
  <text x="46" y="882" font-size="9.5" fill="#64748b">两点启示：历史欠账是系统性的——「入库」不等于「定稿」；再精修必须与再验证同笼，个别条目也可能变差，逐条对照才是负责任的用法。</text>
  <text x="46" y="895" font-size="9.5" fill="#64748b">结构是可以被后人持续再精修的活文档；PDB_REDO 条目与原条目并排可查，取哪个版本做后续研究，本身就是一道要过验证报告的选择题。</text>
  <rect x="710" y="552" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="574.84" font-size="19" fill="#475569" font-weight="700">四、跨技术统一与原始衍射图存档</text>
  <rect x="726" y="596" width="628" height="46" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="1040" y="614" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">几何指标：Ramachandran · clashscore · rotamer</text>
  <text x="1040" y="632" font-size="9" fill="#475569" text-anchor="middle">只看模型——对 X 射线与 EM 结构一视同仁</text>
  <rect x="726" y="650" width="306" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="879" y="668" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">X 射线密度端</text>
  <text x="879" y="684" font-size="9" fill="#475569" text-anchor="middle">RSRZ 与 R<tspan dy="2.0" font-size="6.5">free</tspan><tspan dy="-2.0"> 为纲</tspan></text>
  <rect x="1048" y="650" width="306" height="44" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1201" y="668" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">EM 密度端</text>
  <text x="1201" y="684" font-size="9" fill="#475569" text-anchor="middle">map-model FSC 与 Q-score 为纲</text>
  <text x="726" y="712" font-size="9.5" fill="#475569">「模型对图的责任」跨技术成立、报告版式趋同：同一套几何指标给跨技术比较立了公共标尺——X 射线与 EM 结构的 clashscore 可直接并排，</text>
  <text x="726" y="725" font-size="9.5" fill="#475569">检索可按验证指标筛选而不问技术出身（NMR 一侧补构象系综一致性）。</text>
  <text x="726" y="762" font-size="10.5" fill="#1e293b" font-weight="700">原始衍射图存档运动：结构基因组学中心带头、wwPDB 与 IUCr 推动图像库试点</text>
  <rect x="726" y="774" width="148" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="800" y="792" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">衍射图＋参数归档</text>
  <text x="800" y="812" font-size="8.5" fill="#475569" text-anchor="middle">连同处理参数入库</text>
  <rect x="886" y="774" width="148" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="960" y="792" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">处理可重走</text>
  <text x="960" y="812" font-size="8.5" fill="#475569" text-anchor="middle">指标化·积分·缩放逐步复核</text>
  <rect x="1046" y="774" width="148" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1120" y="792" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">可疑结构重处理</text>
  <text x="1120" y="812" font-size="8.5" fill="#475569" text-anchor="middle">整体重跑数据管线</text>
  <rect x="1206" y="774" width="148" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1280" y="792" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">历史问题暴露</text>
  <text x="1280" y="812" font-size="8.5" fill="#475569" text-anchor="middle">个别结构现建模问题</text>
  <line x1="874" y1="802" x2="884" y2="802" stroke="#475569" stroke-width="1.7" marker-end="url(#arr-ink)"/>
  <line x1="1034" y1="802" x2="1044" y2="802" stroke="#475569" stroke-width="1.7" marker-end="url(#arr-ink)"/>
  <line x1="1194" y1="802" x2="1204" y2="802" stroke="#475569" stroke-width="1.7" marker-end="url(#arr-ink)"/>
  <text x="726" y="852" font-size="9.5" fill="#475569">R 因子依赖结构因子，结构因子由原始衍射图处理而来——没有图像，「重新处理」无从谈起；</text>
  <text x="726" y="865" font-size="9.5" fill="#475569">已有案例显示个别历史结构在重处理后暴露建模问题。</text>
  <text x="726" y="890" font-size="9.5" fill="#475569">存档不是怀旧，是验证链条的最后一环：几何可查、密度可查、数据处理亦可查——三环齐扣，验证报告的条目解读才有根基。</text>
  <text x="726" y="928" font-size="9.5" fill="#64748b">验证的可信度，最终落在可重复性上（第 6 章的每一步都可重走）。</text>
</svg>