<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">细胞裂解与样品粗提：从湿菌体到清亮粗提液</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">全程 4 °C：超声 10 s/50 s 脉冲、均质 1,000–2,000 psi、溶菌酶 0.2–1 mg/mL；模板液加抑制剂，DNase 或 PEI 除核酸，3 h 粗提</text>
  <rect x="30" y="132" width="680" height="424" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、三种主流裂解方法对照</text>
  <rect x="67.56" y="171.075" width="168.88" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="152" y="183.78" font-size="10.5" fill="#065f46" text-anchor="middle">军规一 · 释放完全（上清 &gt;90%）</text>
  <rect x="285.46000000000004" y="171.075" width="173.07999999999998" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="372" y="183.78" font-size="10.5" fill="#92400e" text-anchor="middle">军规二 · 条件温和（防变性聚集）</text>
  <rect x="498.21500000000003" y="171.075" width="187.57" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="592" y="183.78" font-size="10.5" fill="#075985" text-anchor="middle">军规三 · 参数可放大（1 L 至 20 L）</text>
  <rect x="50" y="208" width="92" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="96" y="235.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">方法</text>
  <rect x="142" y="208" width="128" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="206" y="235.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">作用机制</text>
  <rect x="270" y="208" width="186" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="363" y="235.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">典型条件</text>
  <rect x="456" y="208" width="112" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="512" y="235.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">优点</text>
  <rect x="568" y="208" width="122" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="629" y="235.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">主要局限</text>
  <rect x="50" y="252" width="92" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="96" y="283.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">超声裂解</text>
  <rect x="142" y="252" width="128" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="206" y="283.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">空化气泡崩溃的机械剪切</text>
  <rect x="270" y="252" width="186" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="363" y="283.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">10 s 开/50 s 关脉冲，冰浴 10–20 min</text>
  <rect x="456" y="252" width="112" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="512" y="283.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">设备普及、释放率高</text>
  <rect x="568" y="252" width="122" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="629" y="283.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">局部过热与自由基氧化</text>
  <rect x="50" y="304" width="640" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="304" width="92" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="96" y="335.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">高压均质</text>
  <rect x="142" y="304" width="128" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="206" y="335.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">高压窄缝剪切与骤然泄压</text>
  <rect x="270" y="304" width="186" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="363" y="335.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">1,000–2,000 psi，2–3 遍</text>
  <rect x="456" y="304" width="112" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="512" y="335.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">温和通量高、易放大</text>
  <rect x="568" y="304" width="122" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="629" y="335.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">设备贵、清洗繁琐</text>
  <rect x="50" y="356" width="92" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="96" y="387.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">溶菌酶加渗透冲击</text>
  <rect x="142" y="356" width="128" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="206" y="387.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">酶解肽聚糖后低渗涨破</text>
  <rect x="270" y="356" width="186" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="363" y="387.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">0.2–1 mg/mL 加 1–5 mM EDTA</text>
  <rect x="456" y="356" width="112" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="512" y="387.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">最温和、免专用设备</text>
  <rect x="568" y="356" width="122" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="629" y="387.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">通量低、引入外源蛋白</text>
  <text x="50" y="436" font-size="10.5" fill="#475569">收菌即计时：4 °C 下 4,000–6,000 g 离心 10–20 min 收集湿菌体，以预冷裂解液重悬，</text>
  <text x="50" y="451" font-size="10.5" fill="#475569">或分装冻存于 −80 °C——一次冻融即可释放约 30–50% 可溶性蛋白，常作为酶解路线的前置助力。</text>
  <text x="50" y="502" font-size="10.5" fill="#475569">组合路线：先以低浓度溶菌酶预孵 15–30 min 削弱细胞壁，再以超声或均质收官，所需机械强度约减半，对剪切敏感的蛋白尤其友好。</text>
  <rect x="730" y="132" width="640" height="424" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="746" y="154.84" font-size="19" fill="#475569" font-weight="700">二、裂解液配方要素与全程低温</text>
  <rect x="832.8974000000001" y="170.65" width="414.2052" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1040" y="183.96" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">通用模板：50 mM Tris-HCl pH 8.0 · 300 mM NaCl · 5% 甘油 · 0.5–1 mM TCEP</text>
  <rect x="746" y="206" width="96" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="794" y="233.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">组分</text>
  <rect x="842" y="206" width="118" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="901" y="233.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">浓度</text>
  <rect x="960" y="206" width="396" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="233.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">职责</text>
  <rect x="746" y="250" width="96" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="794" y="272.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">Tris-HCl</text>
  <rect x="842" y="250" width="118" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="901" y="272.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">50 mM · pH 8.0</text>
  <rect x="960" y="250" width="396" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="272.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">维持缓冲能力；pKa 约 8.1 且随温度漂移，冷库读数须校正</text>
  <rect x="746" y="284" width="610" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="746" y="284" width="96" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="794" y="306.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">NaCl</text>
  <rect x="842" y="284" width="118" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="901" y="306.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">300 mM</text>
  <rect x="960" y="284" width="396" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="306.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">离子强度屏蔽静电驱动的聚集与核酸结合</text>
  <rect x="746" y="318" width="96" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="794" y="340.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">甘油</text>
  <rect x="842" y="318" width="118" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="901" y="340.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">5%</text>
  <rect x="960" y="318" width="396" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="340.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">降低溶剂极性、减缓聚集倾向</text>
  <rect x="746" y="352" width="610" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="746" y="352" width="96" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="794" y="374.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">TCEP</text>
  <rect x="842" y="352" width="118" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="901" y="374.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">0.5–1 mM</text>
  <rect x="960" y="352" width="396" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1158" y="374.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">膦类还原剂维持半胱氨酸还原态；不含巯基、对金属亲和介质友好</text>
  <text x="746" y="410" font-size="10" fill="#475569">蛋白酶抑制剂临用前加：cocktail 常含 AEBSF（丝氨酸蛋白酶）、E-64（半胱氨酸）、bestatin（氨肽酶）与 EDTA（金属蛋白酶）；</text>
  <text x="746" y="424" font-size="10" fill="#475569">PMSF 0.1–1 mM 以不可逆酰化灭活丝氨酸蛋白酶，水相半衰期仅约 30–110 min 且随 pH 升高缩短，须经透析或脱盐去除。</text>
  <rect x="894.7864" y="467.075" width="294.4272" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1042" y="479.78" font-size="10.5" fill="#134e4a" text-anchor="middle">His<tspan dy="2.3" font-size="7.6">6</tspan><tspan dy="-2.3"> 标签蛋白可预加 10–20 mM 咪唑，占据杂质弱结合位点</tspan></text>
  <text x="746" y="512" font-size="10.5" fill="#1e293b" font-weight="700">全程 4 °C 低温链：</text>
  <rect x="868" y="503.5" width="32" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="884" y="515.6" font-size="10" fill="#134e4a" text-anchor="middle">收菌</text>
  <line x1="910" y1="512" x2="928" y2="512" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-dna)"/>
  <rect x="938" y="503.5" width="32" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="954" y="515.6" font-size="10" fill="#134e4a" text-anchor="middle">重悬</text>
  <line x1="980" y1="512" x2="998" y2="512" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-dna)"/>
  <rect x="1008" y="503.5" width="32" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1024" y="515.6" font-size="10" fill="#134e4a" text-anchor="middle">裂解</text>
  <line x1="1050" y1="512" x2="1068" y2="512" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-dna)"/>
  <rect x="1078" y="503.5" width="32" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1094" y="515.6" font-size="10" fill="#134e4a" text-anchor="middle">离心</text>
  <line x1="1120" y1="512" x2="1138" y2="512" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-dna)"/>
  <rect x="1148" y="503.5" width="32" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1164" y="515.6" font-size="10" fill="#134e4a" text-anchor="middle">上样</text>
  <text x="746" y="540" font-size="10" fill="#64748b">蛋白酶活性随温度下降而下降数倍，室温等待造成的降解事后无法补救。</text>
  <rect x="30" y="578" width="680" height="372" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、核酸粘度与粗提物澄清</text>
  <text x="50" y="620" font-size="10.5" fill="#475569">裂解完成后最直观的障碍是粘度：基因组 DNA 与 RNA 使裂解物呈胶状，直接上柱会把柱床压塌、流速归零。两条互补对策：</text>
  <rect x="50" y="660" width="296" height="112" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="66" y="684" font-size="11" fill="#134e4a" font-weight="700">路线一 · DNase 酶解</text>
  <text x="66" y="704" font-size="10" fill="#475569">DNase I 约 5 μg/mL 加辅因子 5 mM MgCl<tspan dy="2.2" font-size="7.2">2</tspan><tspan dy="-2.2">，</tspan></text>
  <text x="66" y="718" font-size="10" fill="#475569">4 °C 作用 20–30 min，粘度即显著下降。</text>
  <rect x="366" y="660" width="324" height="112" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="382" y="684" font-size="11" fill="#4c1d95" font-weight="700">路线二 · PEI 絮凝</text>
  <text x="382" y="704" font-size="9.5" fill="#475569">聚乙烯亚胺 pH 约 8 时为聚阳离子，</text>
  <text x="382" y="716.5" font-size="9.5" fill="#475569">0.1–0.5% 终浓度中和核酸磷酸骨架，</text>
  <text x="382" y="729" font-size="9.5" fill="#475569">连同部分杂蛋白与脂多糖一并沉降；</text>
  <text x="382" y="741.5" font-size="9.5" fill="#475569">碱性蛋白共沉淀风险上升时改硫酸鱼精蛋白，</text>
  <text x="382" y="754" font-size="9.5" fill="#475569">或把 NaCl 提到 500 mM 再絮凝。</text>
  <text x="356" y="720" font-size="10" fill="#64748b" text-anchor="middle">或</text>
  <text x="50" y="796" font-size="10.5" fill="#1e293b" font-weight="700">澄清标准流程（两级离心加两级过滤）：</text>
  <rect x="63.79999999999998" y="813.5" width="162.40000000000003" height="17" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="145" y="825.6" font-size="10" fill="#1e293b" text-anchor="middle">一级 10,000–15,000 g 弃大碎片</text>
  <rect x="242.20000000000002" y="813.5" width="175.59999999999997" height="17" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="330" y="825.6" font-size="10" fill="#1e293b" text-anchor="middle">二级 20,000–40,000 g · 30–60 min</text>
  <rect x="433.7" y="813.5" width="72.6" height="17" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="470" y="825.6" font-size="10" fill="#134e4a" text-anchor="middle">0.45 μm 预滤</text>
  <rect x="538.7" y="813.5" width="92.6" height="17" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="585" y="825.6" font-size="10" fill="#065f46" text-anchor="middle">0.22 μm 精滤护柱</text>
  <text x="50" y="856" font-size="10" fill="#475569">粗提液质量快判：A<tspan dy="2.2" font-size="7.2">260</tspan><tspan dy="-2.2">/A</tspan><tspan dy="2.2" font-size="7.2">280</tspan><tspan dy="-2.2"> 比值大于 1 提示核酸残留；粘度以移液枪打液观察即可初判，必要时冰上补一轮 DNase。</tspan></text>
  <text x="50" y="870" font-size="10" fill="#475569">清亮可流动的粗提液就此交棒亲和捕获。</text>
  <text x="50" y="906" font-size="10" fill="#64748b">故障速查：释放不全则延长超声或加均质遍数；降解条带呈涂抹状则加强低温与抑制剂组合；</text>
  <text x="50" y="920" font-size="10" fill="#64748b">上清浑浊聚集则把 NaCl 提至 500 mM 并加 5–10% 甘油，并排查裂解浓度过高。</text>
  <rect x="730" y="578" width="640" height="372" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="746" y="600.84" font-size="19" fill="#475569" font-weight="700">四、粗提工序时间表（2 L 大肠杆菌例）</text>
  <text x="1050" y="624" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">全程 4 °C，合计约 3 h（180 min）</text>
  <rect x="770" y="640" width="62" height="34" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="801" y="661" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">20 min</text>
  <rect x="832" y="640" width="171" height="34" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="917" y="661" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">45–60 min</text>
  <rect x="1003" y="640" width="280" height="34" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="1143" y="661" font-size="9.5" fill="#92400e" text-anchor="middle" font-weight="700">90 min</text>
  <rect x="1283" y="640" width="47" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="1306" y="661" font-size="8.5" fill="#64748b" text-anchor="middle">机动</text>
  <text x="801" y="694" font-size="10" fill="#475569" text-anchor="middle">4 °C 收菌</text>
  <text x="917" y="694" font-size="10" fill="#475569" text-anchor="middle">重悬与裂解（含 DNase 消化）</text>
  <text x="1143" y="694" font-size="10" fill="#475569" text-anchor="middle">两级离心与过滤</text>
  <rect x="941.75" y="721.075" width="196.5" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1040" y="733.78" font-size="10.5" fill="#92400e" text-anchor="middle">每多一小时室温等待，降解风险上一档</text>
  <text x="746" y="758" font-size="10" fill="#475569">放大视角：超声与离心恰是最难平移的两个单元（前者发热、后者通量）；工业路线改用高压均质配碟片式离心机连续流处理，</text>
  <text x="746" y="772" font-size="10" fill="#475569">把粗提压缩进 1 h 以内。</text>
  <text x="746" y="806" font-size="10" fill="#475569">复盘纪律：菌体、全样、上清、沉淀每步留样并全部走胶——三个月后追问「当时为什么收率低」，答案全在这些胶上；</text>
  <text x="746" y="820" font-size="10" fill="#475569">若目的蛋白以包涵体存在，上清几乎无目标条带，应转投变性复性路线而非反复加大裂解强度。</text>
  <rect x="848" y="887.5" width="363.99999999999994" height="17" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1030" y="899.6" font-size="10" fill="#991b1b" text-anchor="middle">超声空化的自由基会氧化 Met 与 Cys 侧链，金属中心敏感的酶优先均质或酶解</text>
</svg>