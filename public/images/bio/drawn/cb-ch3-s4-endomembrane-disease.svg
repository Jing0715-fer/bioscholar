<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">内膜系统与疾病：ER 应激、错误折叠与互作网络</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">未折叠蛋白累积触发 UPR（PERK 抑翻译 / IRE1 剪接 XBP1 / ATF6 入核），失代偿经 CHOP 走向凋亡；CFTR ΔF508 被 ER 质控降解致囊性纤维化；MAM 介导 ER-线粒体 Ca²⁺ 与脂质交换</text>
  <rect x="30" y="132" width="900" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、内质网应激与未折叠蛋白反应（UPR）三条分支</text>
  <path d="M 60,240 q 30,-18 60,0 q 30,18 60,0 q 30,-18 60,0 q 30,18 60,0" fill="none" opacity="0.75" stroke="#0f766e" stroke-width="4.4"/>
  <text x="180" y="218" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="600">ER 腔内未折叠/错误折叠蛋白累积</text>
  <circle cx="80" cy="252" r="5" fill="#dc2626" fill-opacity="0.55"/>
  <circle cx="108" cy="258" r="5" fill="#dc2626" fill-opacity="0.55"/>
  <circle cx="136" cy="252" r="5" fill="#dc2626" fill-opacity="0.55"/>
  <circle cx="164" cy="258" r="5" fill="#dc2626" fill-opacity="0.55"/>
  <circle cx="192" cy="252" r="5" fill="#dc2626" fill-opacity="0.55"/>
  <circle cx="220" cy="258" r="5" fill="#dc2626" fill-opacity="0.55"/>
  <circle cx="248" cy="252" r="5" fill="#dc2626" fill-opacity="0.55"/>
  <circle cx="276" cy="258" r="5" fill="#dc2626" fill-opacity="0.55"/>
  <text x="60" y="296" font-size="10.5" fill="#64748b">基因突变 · 缺氧 · 钙稳态破坏 · 糖剥夺</text>
  <rect x="100" y="320" width="60" height="30" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="130" y="340" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">PERK</text>
  <rect x="200" y="320" width="60" height="30" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="230" y="340" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">IRE1</text>
  <rect x="300" y="320" width="60" height="30" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="330" y="340" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="700">ATF6</text>
  <text x="390" y="330" font-size="10.5" fill="#64748b">应激时伴侣 BiP/GRP78 与传感器解离，传感器活化</text>
  <line x1="130" y1="355" x2="130" y2="392" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <text x="56" y="412" font-size="11" fill="#475569">磷酸化 eIF2α → 全局抑制翻译、</text>
  <text x="56" y="427" font-size="11" fill="#475569">减少蛋白流入</text>
  <line x1="230" y1="355" x2="230" y2="392" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <text x="156" y="412" font-size="11" fill="#475569">非经典剪接 XBP1 mRNA → 转录因子，</text>
  <text x="156" y="427" font-size="11" fill="#475569">上调折叠与 ERAD 基因</text>
  <line x1="330" y1="355" x2="330" y2="392" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <text x="256" y="412" font-size="11" fill="#475569">经 S1P/S2P 切割后入核，</text>
  <text x="256" y="427" font-size="11" fill="#475569">上调伴侣蛋白表达</text>
  <line x1="430" y1="335" x2="470" y2="335" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="475" y="306" width="130" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="540" y="330" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">应激持续失代偿</text>
  <text x="540" y="350" font-size="11" fill="#dc2626" text-anchor="middle">CHOP · caspase-12</text>
  <line x1="540" y1="364" x2="540" y2="392" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="540" y="412" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">凋亡</text>
  <text x="630" y="310" font-size="11" fill="#475569">慢性 ER 应激参与：2 型糖尿病（胰岛 β 细胞衰竭）、</text>
  <text x="630" y="326" font-size="11" fill="#475569">神经退行性疾病（帕金森病、肌萎缩侧索硬化）、</text>
  <text x="630" y="342" font-size="11" fill="#475569">缺血再灌注损伤与肝病。</text>
  <text x="630" y="400" font-size="10.5" fill="#64748b">UPR 三分支协同降低蛋白流入、</text>
  <text x="630" y="415" font-size="10.5" fill="#64748b">增强折叠能力并加速清除——是 ER 蛋白稳态的核心代偿机制。</text>
  <rect x="950" y="132" width="420" height="440" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="966" y="154.84" font-size="19" fill="#475569" font-weight="700">二、内膜系统相关疾病举例</text>
  <rect x="962" y="190" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1027" y="217.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">疾病</text>
  <rect x="1092" y="190" width="266" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="217.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">机制</text>
  <rect x="962" y="234" width="130" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1027" y="267.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">囊性纤维化</text>
  <rect x="1092" y="234" width="266" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="267.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">CFTR ΔF508 错误折叠，被 ER 质量控制降解，膜上功能通道不足</text>
  <rect x="962" y="290" width="396" height="56" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="962" y="290" width="130" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1027" y="323.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">家族性高胆固醇血症</text>
  <rect x="1092" y="290" width="266" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="323.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">LDL 受体缺陷，胆固醇稳态失衡</text>
  <rect x="962" y="346" width="130" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1027" y="379.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">I-cell 病</text>
  <rect x="1092" y="346" width="266" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="379.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">M6P 分选障碍，溶酶体酶错误分泌</text>
  <rect x="962" y="402" width="396" height="56" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="962" y="402" width="130" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1027" y="435.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">α1-抗胰蛋白酶缺乏</text>
  <rect x="1092" y="402" width="266" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="435.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">突变蛋白在 ER 聚集，肝细胞损伤</text>
  <rect x="962" y="458" width="130" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1027" y="491.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Zellweger 综合征</text>
  <rect x="1092" y="458" width="266" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="491.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">过氧化物酶体装配缺陷，VLCFA 累积</text>
  <rect x="962" y="514" width="396" height="56" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="962" y="514" width="130" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1027" y="547.5" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">高尔基体与肿瘤</text>
  <rect x="1092" y="514" width="266" height="56" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1225" y="547.5" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">糖基化谱改变（N-糖链分支增加），与侵袭转移相关</text>
  <text x="962" y="548" font-size="10" fill="#64748b">囊性纤维化新型治疗采用「正确剂」帮助突变蛋白折叠运输。</text>
  <rect x="30" y="588" width="1340" height="392" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="610.84" font-size="19" fill="#475569" font-weight="700">三、细胞器互作网络：内膜系统的稳态即细胞稳态</text>
  <path d="M 90,680 q 27.5,-16.8 55,0 q 27.5,16.8 55,0 q 27.5,-16.8 55,0 q 27.5,16.8 55,0" fill="none" opacity="0.75" stroke="#0f766e" stroke-width="4.4"/>
  <text x="200" y="654" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">内质网 ER</text>
  <ellipse cx="420" cy="690" rx="55" ry="24" fill="#ffedd5" stroke="#d97706" stroke-width="2.4"/>
  <path d="M 372,676.8 L 379,690 L 386,676.8 M 413,676.8 L 420,690 L 427,676.8 M 454,676.8 L 461,690 L 468,676.8 " fill="none" opacity="0.8" stroke="#d97706" stroke-width="1.8"/>
  <text x="420" y="744" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">线粒体</text>
  <rect x="300" y="668" width="84" height="44" rx="6" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.6"/>
  <text x="342" y="694" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">MAM</text>
  <line x1="300" y1="690" x2="284" y2="690" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="384" y1="690" x2="366" y2="690" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <text x="90" y="770" font-size="11" fill="#475569">ER-线粒体接触位点（MAM）介导 Ca²⁺ 与脂质交换，</text>
  <text x="90" y="785.5" font-size="11" fill="#475569">是脂质合成与凋亡调控的平台。</text>
  <line x1="200" y1="712" x2="200" y2="760" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <text x="90" y="786" font-size="11" fill="#475569">ER 以 COPII 出芽为其他细胞器提供膜来源。</text>
  <circle cx="700" cy="700" r="42" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.2"/>
  <text x="700" y="696" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">内体</text>
  <text x="700" y="712" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">系统</text>
  <circle cx="830" cy="700" r="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/>
  <circle cx="852" cy="700" r="3.3" fill="#dc2626" fill-opacity="0.7"/>
  <circle cx="843.7167756408921" cy="717.2002926142967" r="3.3" fill="#dc2626" fill-opacity="0.7"/>
  <circle cx="825.104539452961" cy="721.4484140680001" r="3.3" fill="#dc2626" fill-opacity="0.7"/>
  <circle cx="810.1786849061468" cy="709.5454422605862" r="3.3" fill="#dc2626" fill-opacity="0.7"/>
  <circle cx="810.1786849061468" cy="690.4545577394138" r="3.3" fill="#dc2626" fill-opacity="0.7"/>
  <circle cx="825.104539452961" cy="678.5515859319999" r="3.3" fill="#dc2626" fill-opacity="0.7"/>
  <circle cx="843.7167756408921" cy="682.7997073857033" r="3.3" fill="#dc2626" fill-opacity="0.7"/>
  <text x="830" y="760" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">溶酶体</text>
  <line x1="744" y1="700" x2="786" y2="700" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <rect x="585.95" y="791.075" width="228.10000000000002" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="700" y="803.78" font-size="10.5" fill="#475569" text-anchor="middle">mTORC1 定位于溶酶体膜感受营养（第 8 章）</text>
  <text x="560" y="660" font-size="11" fill="#475569">内体-溶酶体系统既是降解终点又是信号平台。</text>
  <rect x="920" y="636" width="430" height="320" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="944" y="668" font-size="13.5" fill="#1e293b" font-weight="700">共同土壤</text>
  <text x="944" y="700" font-size="11.5" fill="#475569">内膜系统的稳态维系即细胞稳态；其失衡是代谢病、</text>
  <text x="944" y="716.5" font-size="11.5" fill="#475569">衰老与肿瘤的共同土壤。</text>
  <text x="944" y="760" font-size="11" fill="#475569">恶性肿瘤细胞高尔基体常碎裂增大、糖基化谱改变（N-糖链分支增加）</text>
  <text x="944" y="776" font-size="11" fill="#475569">与侵袭转移相关——糖基转移酶成为潜在治疗靶点。</text>
  <text x="944" y="830" font-size="10.5" fill="#64748b">ER 为其他细胞器提供膜来源、</text>
  <text x="944" y="845" font-size="10.5" fill="#64748b">内体-溶酶体兼为信号平台——互作网络的整体观是理解内膜系统疾病的钥匙。</text>
  <line x1="880" y1="700" x2="912" y2="700" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
</svg>