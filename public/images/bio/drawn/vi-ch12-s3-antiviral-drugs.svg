<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">抗病毒药物：选择性、双重闸门与治愈的版图</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">病毒特有靶点撑开治疗窗；阿昔洛韦双重闸门（治疗指数以千倍计、1988 诺奖）；1996 HAART 三联封锁耐药路径、U=U；索非布韦 8–12 周治愈率逾 95%；奥司他韦 48 小时窗口</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、选择性：抗病毒药物的第一性原理</text>
  <text x="46" y="190" font-size="11" fill="#475569">疱疹激酶、逆转录酶、蛋白酶、神经氨酸酶与 RdRp 等病毒特有靶点撑开治疗窗——获批药物集中于约十个病毒属。</text>
  <rect x="56" y="240" width="142" height="60" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="127" y="274" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">吸附·侵入·脱壳</text>
  <line x1="200" y1="270" x2="210" y2="270" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="212" y="240" width="142" height="60" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="283" y="274" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">基因复制与转录</text>
  <line x1="356" y1="270" x2="366" y2="270" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="232.9675" y="321.925" width="100.065" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="283" y="333.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">阿昔洛韦（聚合酶）</text>
  <rect x="238.54495" y="355.925" width="88.9101" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="283" y="367.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">AZT（逆转录酶）</text>
  <rect x="236.49009999999998" y="389.925" width="93.0198" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="283" y="401.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">索非布韦（RdRp）</text>
  <rect x="368" y="240" width="142" height="60" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="439" y="274" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">翻译与蛋白加工</text>
  <line x1="512" y1="270" x2="522" y2="270" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="388.9675" y="321.925" width="100.065" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="439" y="333.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">沙奎那韦（蛋白酶）</text>
  <rect x="384.075" y="355.925" width="109.85000000000001" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="439" y="367.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">玛巴洛沙韦（内切酶）</text>
  <rect x="524" y="240" width="142" height="60" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="595" y="274" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">装配与释放</text>
  <rect x="535.1825" y="321.925" width="119.635" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="595" y="333.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">奥司他韦（神经氨酸酶）</text>
  <text x="46" y="452" font-size="10.5" fill="#475569">干扰素等宿主侧广谱手段难逃全身毒性；真正的主力是「病毒有、宿主无」的酶与结构——靶点即治疗窗。</text>
  <text x="46" y="494" font-size="10.5" fill="#64748b">高度依赖宿主机器的病毒几无独立靶点，构成广谱路线的结构困境。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、阿昔洛韦：一举两得的双重闸门</text>
  <rect x="736" y="226" width="122" height="62" rx="9" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="797" y="252" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">ACV 前药</text>
  <text x="797" y="272" font-size="9" fill="#64748b" text-anchor="middle">静默无活性</text>
  <line x1="860" y1="257" x2="888" y2="257" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-dna)"/>
  <rect x="890" y="226" width="122" height="62" rx="9" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="951" y="252" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">ACV-MP</text>
  <text x="951" y="272" font-size="9" fill="#64748b" text-anchor="middle">仅病毒感染细胞内</text>
  <line x1="1014" y1="257" x2="1042" y2="257" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-dna)"/>
  <rect x="1044" y="226" width="122" height="62" rx="9" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1105" y="252" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">ACV-TP</text>
  <text x="1105" y="272" font-size="9" fill="#64748b" text-anchor="middle">三磷酸活性形式</text>
  <line x1="1168" y1="257" x2="1196" y2="257" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-dna)"/>
  <rect x="1198" y="226" width="122" height="62" rx="9" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1259" y="252" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">掺入即终止</text>
  <text x="1259" y="272" font-size="9" fill="#64748b" text-anchor="middle">病毒 DNA 链延伸停止</text>
  <rect x="809.792" y="191.5" width="124.41600000000001" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="872" y="203.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">① 病毒 TK 选择性磷酸化</text>
  <rect x="1117.174" y="191.5" width="125.65200000000002" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1180" y="203.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">② 病毒聚合酶选择性掺入</text>
  <text x="726" y="330" font-size="10.5" fill="#475569">两道闸门都握在病毒自己的酶手里：未感染细胞既无 TK 也无病毒聚合酶——ACV 对其几乎不活化、不掺入，治疗指数以千倍计。</text>
  <text x="726" y="372" font-size="10.5" fill="#64748b">「前药经病毒酶活化」由此成为合理药物设计的教科书案例；</text>
  <text x="726" y="387" font-size="10.5" fill="#64748b">Elion 与 Hitchings 因包括阿昔洛韦在内的系列成就获 1988 年诺贝尔奖。</text>
  <text x="726" y="428" font-size="10.5" fill="#64748b">同一逻辑的后续：更昔洛韦依赖 CMV 的 UL97 激酶——选择性始终来自病毒自己交出的钥匙。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、HIV 治疗：从单药到 HAART</text>
  <line x1="60" y1="706" x2="620" y2="706" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="104.80000000000001" cy="706" r="6.5" fill="#0f766e"/>
  <line x1="104.80000000000001" y1="697" x2="104.80000000000001" y2="676" stroke="#0f766e" stroke-width="1.7"/>
  <text x="104.80000000000001" y="656" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">AZT 获批</text>
  <text x="104.80000000000001" y="636" font-size="12" fill="#64748b" text-anchor="middle">1987 首个抗 HIV 药</text>
  <circle cx="261.6" cy="706" r="6.5" fill="#b45309"/>
  <line x1="261.6" y1="715" x2="261.6" y2="736" stroke="#b45309" stroke-width="1.7"/>
  <text x="261.6" y="756" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">沙奎那韦</text>
  <text x="261.6" y="776" font-size="12" fill="#64748b" text-anchor="middle">1995 蛋白酶抑制剂</text>
  <circle cx="407.2" cy="706" r="6.5" fill="#dc2626"/>
  <line x1="407.2" y1="697" x2="407.2" y2="676" stroke="#dc2626" stroke-width="1.7"/>
  <text x="407.2" y="656" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">HAART</text>
  <text x="407.2" y="636" font-size="12" fill="#64748b" text-anchor="middle">1996 何大一 · 三联疗法</text>
  <circle cx="564" cy="706" r="6.5" fill="#0369a1"/>
  <line x1="564" y1="715" x2="564" y2="736" stroke="#0369a1" stroke-width="1.7"/>
  <text x="564" y="756" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">整合酶抑制剂</text>
  <text x="564" y="776" font-size="12" fill="#64748b" text-anchor="middle">2007 雷特格韦·多替拉韦</text>
  <text x="46" y="800" font-size="10.5" fill="#475569">AZT 为 3′ 叠氮取代的胸苷类似物，三磷酸化后与底物竞争逆转录酶、掺入即终止；蛋白酶抑制剂以 C2 对称二聚体为靶，</text>
  <text x="46" y="815" font-size="10.5" fill="#475569">沙奎那韦以基于结构的过渡态拟肽设计率先上市。</text>
  <text x="50" y="848" font-size="11.5" fill="#1e293b" font-weight="700">HAART＝同时封锁多条耐药逃逸路径：</text>
  <rect x="97.04400000000001" y="873.075" width="65.91199999999999" height="17.849999999999998" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="130" y="885.78" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">两种 NRTI</text>
  <rect x="232.6021" y="873.075" width="114.7958" height="17.849999999999998" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="290" y="885.78" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">＋ 一种蛋白酶抑制剂</text>
  <rect x="437.032375" y="873.075" width="125.93525" height="17.849999999999998" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="500" y="885.78" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">→ HIV 转为可管理慢病</text>
  <text x="50" y="920" font-size="10.5" fill="#64748b">U=U（检测不到＝不具传染性）使治疗兼具预防意义；整合酶链转移抑制剂以高效低毒成为当代骨架，</text>
  <text x="50" y="935" font-size="10.5" fill="#64748b">单片三联复方进一步改善依从性。</text>
  <rect x="710" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="608.84" font-size="19" fill="#475569" font-weight="700">四、HCV 的口服治愈与流感 48 小时窗</text>
  <rect x="730" y="646" width="300" height="196" rx="10" fill="#fef3c7" fill-opacity="0.5" stroke="#b45309" stroke-width="1.6"/>
  <text x="880" y="672" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">丙肝：首个口服治愈的慢性感染</text>
  <text x="742" y="696" font-size="10" fill="#475569">2011 年第一代 NS3/4A 蛋白酶抑制剂（波普瑞韦、</text>
  <text x="742" y="710" font-size="10" fill="#475569">替拉瑞韦）首破干扰素框架；</text>
  <text x="742" y="724" font-size="10" fill="#475569">索非布韦为基础的 DAA 方案口服八至十二周、治愈率逾 95%。</text>
  <text x="742" y="776" font-size="10" fill="#64748b">定价与可及性自此成为治疗学固有议题。</text>
  <rect x="1050" y="646" width="280" height="196" rx="10" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1190" y="672" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">流感：48 小时黄金窗口</text>
  <line x1="1080" y1="716" x2="1300" y2="716" stroke="#475569" stroke-width="2.6" marker-end="url(#arr-ink)"/>
  <circle cx="1080" cy="716" r="4" fill="#475569"/>
  <text x="1080" y="736" font-size="9" fill="#64748b" text-anchor="middle">0 h</text>
  <circle cx="1180" cy="716" r="4" fill="#475569"/>
  <text x="1180" y="736" font-size="9" fill="#64748b" text-anchor="middle">24 h</text>
  <circle cx="1280" cy="716" r="4" fill="#475569"/>
  <text x="1280" y="736" font-size="9" fill="#64748b" text-anchor="middle">48 h</text>
  <line x1="1280" y1="700" x2="1280" y2="732" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1070" y="762" font-size="9.5" fill="#475569">奥司他韦须在 48 小时内启用方显著获益；</text>
  <text x="1070" y="775.5" font-size="9.5" fill="#475569">H275Y 耐药曾在季节性 H1N1 全球蔓延后被敏感毒株取代；</text>
  <text x="1070" y="789" font-size="9.5" fill="#475569">玛巴洛沙韦以内切核酸酶为靶、单剂给药。</text>
  <text x="726" y="872" font-size="10.5" fill="#475569">广谱路线的困境：瑞德西韦与法匹拉韦证明广谱与高效难以兼得——各病毒科 RdRp 几何互异，高度依赖宿主机器的病毒几无靶点。</text>
  <text x="726" y="918" font-size="10.5" fill="#64748b">抗病毒的版图由「选择性」划定：能治愈的越来越多，能广谱的依旧寥寥。</text>
</svg>