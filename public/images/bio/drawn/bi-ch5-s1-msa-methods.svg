  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">多序列比对：渐进法三步、命门与迭代补救</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">MSA的列揭示家族保守性、是profile/HMM/系统树的共同入口，而最优MSA为NP完全问题；ClustalW按「两两距离建引导树→加权→渐进profile比对」三步走，「onceagap,</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">alwaysagap」不可撤销；T-Coffee以一致性库、MUSCLE以迭代细化补救；SP分数逐对求和、冗余重复计票</text>
