  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">结构生物学发展简史：从劳厄衍射到 AlphaFold2</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">1912年劳厄衍射与1913年布拉格定律奠基，1953年同晶置换铸成相位钥匙，2013年直接电子探测器引发分辨率革命，2020年AlphaFold2达中位GDT_TS约92.4</text>
  <rect x="30" y="132" width="1340" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、百年时间轴：方法学的接力</text>
  <text x="50" y="172" font-size="10.5" fill="#475569">学科节奏清晰可辨：物理学先行（1912 至 1934），方法学奠基（1953 至 1971），基础设施与膜蛋白攻坚（1975 至 2000），分辨率革命与计算预测并进（2013 至今）。两条经验值得写进实验笔记：方法学突破从不均匀降临，</text>
  <text x="50" y="187" font-size="10.5" fill="#475569">每次探测器件或算法的跃迁都会重排哪些问题「可解」。</text>
