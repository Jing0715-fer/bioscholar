  <rect x="30" y="424" width="830" height="534" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="446.84" font-size="19" fill="#475569" font-weight="700">二、学科节奏四阶段</text>
  <rect x="50" y="470" width="380" height="215" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="66" y="496" font-size="12.5" fill="#1e293b" font-weight="700">物理学先行（1912 至 1934）</text>
  <text x="66" y="518" font-size="10" fill="#475569">劳厄与 Friedrich、</text>
  <text x="66" y="533" font-size="10" fill="#475569">Knipping 以硫酸铜晶体证明 X 射线是波长与原子间距相当的电磁波，</text>
  <text x="66" y="548" font-size="10" fill="#475569">劳厄获 1914 年诺贝尔物理学奖；</text>
  <text x="66" y="563" font-size="10" fill="#475569">22 岁的 W. L. Bragg 导出布拉格定律 nλ=2d·sinθ，</text>
  <text x="66" y="578" font-size="10" fill="#475569">父子共享 1915 年物理学奖；</text>
  <text x="66" y="593" font-size="10" fill="#475569">1934 年 Bernal 发现胃蛋白酶湿晶体方可清晰衍射——「永不干燥你的晶体」至今仍是铁律。</text>
  <rect x="445" y="470" width="380" height="215" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="461" y="496" font-size="12.5" fill="#1e293b" font-weight="700">方法学奠基（1953 至 1971）</text>
  <text x="461" y="518" font-size="10" fill="#475569">1953 年 Perutz 以血红蛋白汞衍生物确立多对同晶置换法（MIR），</text>
  <text x="461" y="533" font-size="10" fill="#475569">相位问题的第一把通用钥匙铸成；Kendrew 的抹香鲸肌红蛋白（约 17 kDa、</text>
  <text x="461" y="548" font-size="10" fill="#475569">153 个残基）1958 年 6 Å、1960 年推进至 2 Å；</text>
  <text x="461" y="563" font-size="10" fill="#475569">1965 年 Phillips 解析 2 Å 溶菌酶；1971 年 PDB 建库。</text>
  <rect x="50" y="700" width="380" height="215" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="66" y="726" font-size="12.5" fill="#1e293b" font-weight="700">基础设施与膜蛋白攻坚（1975 至 2000）</text>
  <text x="66" y="748" font-size="10" fill="#475569">Henderson 与 Unwin 1975 年解析细菌视紫红质 7 Å，为膜蛋白结构奠基；</text>
  <text x="66" y="763" font-size="10" fill="#475569">1982 年 Dubochet 玻璃化冷冻为冷冻电镜埋下伏笔；</text>
  <text x="66" y="778" font-size="10" fill="#475569">1988 年光合反应中心三维结构获诺贝尔化学奖；</text>
  <text x="66" y="793" font-size="10" fill="#475569">同步辐射光源与机器人化结晶筛选逐步铺开，PDB 条目数跨入万级。</text>
  <rect x="445" y="700" width="380" height="215" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="461" y="726" font-size="12.5" fill="#1e293b" font-weight="700">分辨率革命与计算时代（2013 至 2020）</text>
  <text x="461" y="748" font-size="10" fill="#475569">直接电子探测相机（Falcon、K2 等）配合束流诱导运动校正，</text>
  <text x="461" y="763" font-size="10" fill="#475569">使冷冻电镜一举跨入 2 至 3 Å 时代；</text>
  <text x="461" y="778" font-size="10" fill="#475569">2015 年施一公团队报道 3.6 Å 酵母剪接体；</text>
  <text x="461" y="793" font-size="10" fill="#475569">2017 年冷冻电镜获诺贝尔化学奖；</text>
  <text x="461" y="808" font-size="10" fill="#475569">2020 年 AlphaFold2 在 CASP14 以中位 GDT_TS 约 92.4 与实验精度相当。</text>
  <rect x="860" y="424" width="510" height="534" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
