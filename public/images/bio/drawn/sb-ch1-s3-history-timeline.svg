  <text x="853.6" y="230" font-size="12" fill="#64748b" text-anchor="middle">1982 Dubochet</text>
  <circle cx="1058.4" cy="300" r="6.5" fill="#d97706"/>
  <line x1="1058.4" y1="291" x2="1058.4" y2="270" stroke="#d97706" stroke-width="1.7"/>
