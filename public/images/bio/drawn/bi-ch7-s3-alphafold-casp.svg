<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">AlphaFold 革命：CASP 双盲竞赛与 GDT-TS 标尺</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">CASP 自 1994 年起以双盲竞赛统一评价结构预测；GDT-TS 取叠合后偏差落在 1/2/4/8 Å 阈值内残基百分比的平均再乘 100，对整体拓扑敏感；CASP14（2020）AlphaFold2 中位 GDT-TS 约 92.4，三大支柱为 MSA 与残基对注意力、等变结构模块、自蒸馏与循环精修；2024 年诺贝尔化学奖表彰结构预测与设计</text>
  <rect x="30" y="132" width="1340" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、CASP：双盲竞赛（1994 年起，偶数年一届）</text>
  <line x1="100" y1="250" x2="1340" y2="250" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="124.8" cy="250" r="6.5" fill="#475569"/>
  <line x1="124.8" y1="241" x2="124.8" y2="220" stroke="#475569" stroke-width="1.7"/>
  <text x="124.8" y="200" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1994 · CASP1</text>
  <text x="124.8" y="180" font-size="12" fill="#64748b" text-anchor="middle">Moult 等发起双盲评估</text>
  <circle cx="720" cy="250" r="6.5" fill="#0369a1"/>
  <line x1="720" y1="259" x2="720" y2="280" stroke="#0369a1" stroke-width="1.7"/>
  <text x="720" y="300" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">靶标两类</text>
  <text x="720" y="320" font-size="12" fill="#64748b" text-anchor="middle">模板建模 / 自由建模（无模板）</text>
  <circle cx="992.8" cy="250" r="6.5" fill="#dc2626"/>
  <line x1="992.8" y1="241" x2="992.8" y2="220" stroke="#dc2626" stroke-width="1.7"/>
  <text x="992.8" y="200" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2020 · CASP14</text>
  <text x="992.8" y="180" font-size="12" fill="#64748b" text-anchor="middle">AlphaFold2 中位 GDT-TS ≈ 92.4</text>
  <circle cx="1278" cy="250" r="6.5" fill="#d97706"/>
  <line x1="1278" y1="259" x2="1278" y2="280" stroke="#d97706" stroke-width="1.7"/>
  <text x="1278" y="300" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2024 · 诺贝尔化学奖</text>
  <text x="1278" y="320" font-size="12" fill="#64748b" text-anchor="middle">表彰结构预测与计算设计</text>
  <text x="80" y="372" font-size="11.5" fill="#475569">规则：预测先于答案揭晓，组织方逐一比对实验结构——杜绝事后挑选式汇报。</text>
  <rect x="30" y="420" width="660" height="540" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="442.84" font-size="19" fill="#475569" font-weight="700">二、GDT-TS：预测质量的标尺</text>
  <rect x="60" y="470" width="600" height="88" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="360" y="500" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">GDT-TS =（P₁ + P₂ + P₄ + P₈）/ 4 × 100</text>
  <text x="360" y="528" font-size="12" fill="#475569" text-anchor="middle">Pₓ：叠合后偏差落在 x Å 阈值内的残基百分比</text>
  <text x="360" y="580" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">叠合后各残基的偏差（示意）</text>
  <circle cx="90" cy="630" r="10" fill="#059669" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="135" cy="630" r="10" fill="#059669" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="180" cy="630" r="10" fill="#059669" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="225" cy="630" r="10" fill="#059669" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="270" cy="630" r="10" fill="#059669" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="330" cy="630" r="10" fill="#d97706" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="375" cy="630" r="10" fill="#d97706" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="420" cy="630" r="10" fill="#d97706" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="480" cy="630" r="10" fill="#0369a1" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="525" cy="630" r="10" fill="#0369a1" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="585" cy="630" r="10" fill="#dc2626" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="625" cy="630" r="10" fill="#94a3b8" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="90" y="681.38" width="12.100000000000001" height="9.24" rx="3" fill="#059669" stroke="#cbd5e1" stroke-width="1"/>
  <text x="110.1" y="689.96" font-size="11" fill="#475569">≤1 Å</text>
  <rect x="149.51" y="681.38" width="12.100000000000001" height="9.24" rx="3" fill="#d97706" stroke="#cbd5e1" stroke-width="1"/>
  <text x="169.60999999999999" y="689.96" font-size="11" fill="#475569">≤2 Å</text>
  <rect x="209.01999999999998" y="681.38" width="12.100000000000001" height="9.24" rx="3" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="229.11999999999998" y="689.96" font-size="11" fill="#475569">≤4 Å</text>
  <rect x="268.53" y="681.38" width="12.100000000000001" height="9.24" rx="3" fill="#dc2626" stroke="#cbd5e1" stroke-width="1"/>
  <text x="288.63" y="689.96" font-size="11" fill="#475569">≤8 Å</text>
  <rect x="328.03999999999996" y="681.38" width="12.100000000000001" height="9.24" rx="3" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="348.14" y="689.96" font-size="11" fill="#475569">&gt;8 Å</text>
  <text x="60" y="730" font-size="11.5" fill="#475569">对整体拓扑敏感、对局部大错不敏感——一段大错只拖累它自己的残基票数。</text>
  <rect x="60" y="760" width="600" height="74" rx="8" fill="#fee2e2" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="784" font-size="11.5" fill="#dc2626" font-weight="600">CASP14（2020）：</text>
  <text x="80" y="800" font-size="11.5" fill="#dc2626" font-weight="600">AlphaFold2 在绝大多数目标上取得中位 GDT-TS 约 92.4——首次达到「与实验精度相当」的量级。</text>
  <rect x="60" y="850" width="600" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="80" y="872" font-size="11.5" fill="#475569">pLDDT：残基级置信度——逐残基给出可信度，画在结构上即是着色图。</text>
  <rect x="710" y="420" width="660" height="540" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="442.84" font-size="19" fill="#475569" font-weight="700">三、AlphaFold2 三大支柱与预测-实验互补</text>
  <rect x="740" y="470" width="600" height="72" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.7"/>
  <text x="760" y="498" font-size="13.5" fill="#075985" font-weight="700">① 注意力表示</text>
  <text x="760" y="522" font-size="11" fill="#475569">MSA 与残基对表示的注意力机制——从共进化信号读出残基间距离</text>
  <rect x="740" y="552" width="600" height="72" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.7"/>
  <text x="760" y="580" font-size="13.5" fill="#075985" font-weight="700">② 等变结构模块</text>
  <text x="760" y="604" font-size="11" fill="#475569">端到端直接输出三维坐标，尊重旋转平移等变性</text>
  <rect x="740" y="634" width="600" height="72" rx="8" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.7"/>
  <text x="760" y="662" font-size="13.5" fill="#075985" font-weight="700">③ 自蒸馏与循环精修</text>
  <text x="760" y="686" font-size="11" fill="#475569">以自身预测扩充训练数据，多轮迭代细化结构</text>
  <rect x="740" y="726" width="600" height="60" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.4"/>
  <text x="760" y="750" font-size="11.5" fill="#065f46" font-weight="600">AFDB：把预测结构开放为数亿量级的按需查询资源。</text>
  <rect x="740" y="800" width="600" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="760" y="826" font-size="13" fill="#1e293b" font-weight="700">预测与实验互补</text>
  <text x="760" y="852" font-size="11.5" fill="#475569">无序区、构象动力学、配体结合态与翻译后修饰仍依赖实验解析——预测结构是起点而非终点。</text>
  <rect x="740" y="898" width="600" height="44" rx="8" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1.3"/>
  <text x="1040" y="926" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">2024 · 诺贝尔化学奖表彰蛋白质结构预测与设计</text>
</svg>