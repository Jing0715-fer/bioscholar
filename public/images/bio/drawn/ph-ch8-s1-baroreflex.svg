  <circle cx="243" cy="790" r="4.5" fill="#0369a1"/>
  <circle cx="316" cy="790" r="4.5" fill="#dc2626"/>
  <line x1="249" y1="790" x2="308" y2="790" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arr-bad)"/>
  <text x="252" y="814" font-size="9" fill="#991b1b" font-weight="700">工作点右移 ≈+30 mmHg</text>
  <text x="356" y="676" font-size="10" fill="#075985" font-weight="700">正常</text>
  <text x="356" y="712" font-size="10" fill="#991b1b" font-weight="700">重调定</text>
  <text x="60" y="968" font-size="9.5" fill="#475569">当代再评价：重调定不完全，慢性期仍有缓冲贡献；颈动脉窦电刺激已用于顽固性高血压。</text>
  <rect x="470" y="575" width="900" height="405" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
