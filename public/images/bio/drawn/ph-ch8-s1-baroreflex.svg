  <text x="486" y="900" font-size="9.5" fill="#475569">平时不作「氧报警」（Hb 氧离曲线平台）；</text>
  <text x="486" y="914" font-size="9.5" fill="#475569">PaO<tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> 低于 60 mmHg 后血氧含量陡降、放电才陡升；</tspan></text>
  <text x="486" y="928" font-size="9.5" fill="#475569">兼测 PaCO<tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> 升高与 pH 下降。主要使命在呼吸调节；</tspan></text>
  <text x="486" y="942" font-size="9.5" fill="#475569">循环效应＝交感缩血管＋心率增快。</text>
  <text x="790" y="616" font-size="12" fill="#065f46" font-weight="700">② 心肺容量感受器（低压系统）</text>
