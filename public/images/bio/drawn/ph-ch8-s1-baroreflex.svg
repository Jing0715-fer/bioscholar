  <path d="M500,668.5 C508.3,674.2 533.3,685.5 550,702.5 C566.7,719.5 583.3,754.4 600,770.5 C616.7,786.6 633.3,792.3 650,799.4 C666.7,806.5 683.3,809.6 700,813 C716.7,816.4 741.7,818.7 750,819.8" fill="none" stroke="#d97706" stroke-width="2.6"/>
