  <text x="120" y="272" font-size="9.5" fill="#831843" font-weight="700">CN IX</text>
  <text x="52" y="288" font-size="10" fill="#075985" font-weight="700">颈动脉窦</text>
  <line x1="96" y1="288" x2="158" y2="292" stroke="#0369a1" stroke-width="1.3" marker-end="url(#arr-acc)"/>
  <text x="215" y="320" font-size="9.5" fill="#92400e" font-weight="700">颈动脉体</text>
  <line x1="212" y1="316" x2="196" y2="303" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-warn)"/>
  <text x="215" y="336" font-size="8.5" fill="#64748b">（PaO<tspan dy="1.9" font-size="6.1">2</tspan><tspan dy="-1.9">·PaCO</tspan><tspan dy="1.9" font-size="6.1">2</tspan><tspan dy="-1.9">·pH）</tspan></text>
  <path d="M 300,398 C 282,384 266,374 266,358 C 266,346 278,340 288,346 C 294,350 298,356 300,362 C 302,356 306,350 312,346 C 322,340 334,346 334,358 C 334,374 318,384 300,398 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="372" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">心</text>
  <path d="M 288,364 C 286,338 300,324 316,324 C 332,324 346,340 348,364" fill="none" stroke="#dc2626" stroke-width="4.5"/>
  <circle cx="332" cy="330" r="5.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <path d="M 318,328 C 300,300 280,278 256,262" fill="none" stroke="#be185d" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-enz)"/>
  <text x="310" y="296" font-size="9.5" fill="#831843" font-weight="700">CN X</text>
  <text x="368" y="302" font-size="9.5" fill="#92400e" font-weight="700">主动脉体</text>
  <line x1="364" y1="306" x2="336" y2="328" stroke="#d97706" stroke-width="1.3" marker-end="url(#arr-warn)"/>
  <text x="366" y="352" font-size="10" fill="#075985" font-weight="700">主动脉弓</text>
  <line x1="362" y1="348" x2="350" y2="358" stroke="#0369a1" stroke-width="1.3" marker-end="url(#arr-acc)"/>
  <text x="46" y="448" font-size="9.5" fill="#475569">压力感受器＝血管外膜内的牵张感受器：对每一心搏的搏动性牵张随节放电，</text>
  <text x="46" y="463" font-size="9.5" fill="#475569">感受的是壁牵张而非压强本身；颈动脉窦传入经 Hering 神经并入 CN IX，</text>
  <text x="46" y="478" font-size="9.5" fill="#475569">主动脉弓传入行走于 CN X（兔的主动脉神经独立成束，是经典实验解剖的便利）。</text>
  <text x="46" y="516" font-size="9.5" fill="#475569">两条传入同归延髓孤束核（NTS）：一路兴奋迷走背核与疑核，一路抑制 RVLM</text>
  <text x="46" y="531" font-size="9.5" fill="#475569">（交感缩血管中枢的引擎）。</text>
  <rect x="470" y="132" width="900" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="486" y="154.84" font-size="19" fill="#475569" font-weight="700">二、降压反射：秒级负反馈闭环</text>
  <rect x="1197.174925" y="166.075" width="105.65015" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1250" y="178.78" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">MAP＝CO×SVR</text>
  <rect x="496.095" y="190.65" width="127.81" height="18.7" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="203.96" font-size="11" fill="#991b1b" text-anchor="middle">血压骤升（MAP↑）</text>
  <rect x="700.565" y="190.65" width="88.87" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="745" y="203.96" font-size="11" fill="#075985" text-anchor="middle">窦·弓牵张↑</text>
  <rect x="845.755" y="190.65" width="148.48999999999998" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="920" y="203.96" font-size="11" fill="#075985" text-anchor="middle">传入频率↑（CN IX/X）</text>
  <rect x="1051.01" y="190.65" width="77.98" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1090" y="203.96" font-size="11" fill="#4c1d95" text-anchor="middle">NTS 整合</text>
  <line x1="622" y1="200" x2="701" y2="200" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="789" y1="200" x2="847" y2="200" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="993" y1="200" x2="1052" y2="200" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="1090" y1="214" x2="1090" y2="305" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="1028.99" y="310.65" width="162.01999999999998" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1110" y="323.96" font-size="11" fill="#4c1d95" text-anchor="middle">迷走↑·交感↓（抑 RVLM）</text>
  <text x="1110" y="352" font-size="9" fill="#64748b" text-anchor="middle">（迷走背核·疑核兴奋；抑制延髓头端腹外侧区）</text>
  <path d="M 1031,326 C 995,350 960,375 933,393" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <rect x="786.745" y="390.65" width="146.51" height="18.7" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="860" y="403.96" font-size="11" fill="#075985" text-anchor="middle">HR·收缩力↓＋血管舒张</text>
  <rect x="538.175" y="390.65" width="143.64999999999998" height="18.7" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="610" y="403.96" font-size="11" fill="#065f46" text-anchor="middle">CO↓·SVR↓→MAP 回落</text>
  <line x1="787" y1="400" x2="682" y2="400" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <path d="M 612,386 C 612,335 565,255 561,216" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-ok)"/>
  <circle cx="495" cy="300" r="13" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <line x1="488" y1="300" x2="502" y2="300" stroke="#065f46" stroke-width="2.2"/>
  <text x="515" y="304" font-size="10" fill="#065f46" font-weight="700">负反馈·数秒</text>
  <text x="486" y="470" font-size="9.5" fill="#475569">全程数秒——机体最快的血压防线；切断「缓冲神经」后血压均值尚存、逐搏波动剧增：压力感受器更像「减震器」而非「恒压器」。</text>
  <text x="486" y="498" font-size="9.5" fill="#475569">双向运转：血压骤降时同一闭环反向加压（HR↑·血管收缩）；临床反向利用——颈动脉窦按摩终止阵发性室上速。</text>
  <text x="486" y="526" font-size="9.5" fill="#64748b">库欣反射：颅内压↑→脑灌注压（MAP−ICP）↓→交感风暴升压→压力感受器对骤升血压回报心动过缓（详见第四面板）。</text>
  <rect x="30" y="575" width="430" height="405" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="597.84" font-size="19" fill="#475569" font-weight="700">三、压力感受器重调定：治不了高血压</text>
  <text x="60" y="625" font-size="9.5" fill="#475569">血压持续升高 1–2 天内，感受器工作点上移——在新的高压水平上重新「尽职」。</text>
  <text x="60" y="648" font-size="9.5" fill="#475569">故该反射不承担长期降压任务；慢性高血压成因须到体液-肾脏层面寻找。</text>
  <text x="112" y="674" font-size="10" fill="#475569" font-weight="600">放电频率 (imp/s)</text>
