  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">动脉血压的神经调节：压力感受器反射与第二梯队</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">MAP＝CO×SVR（安静约120/80mmHg、MAP约93mmHg）；颈动脉窦/主动脉弓牵张感受器经CNIX/X传入孤束核，迷走↑＋交感↓构成秒级降压闭环；持续高压1–2</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">天内重调定故不承担长期降压；化学感受器PaO₂&lt;60mmHg才兴奋，心肺容量感受器开启血量长期调节，脑缺血反应为末位升压防线</text>
  <rect x="30" y="132" width="430" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、感受器解剖：颈动脉窦与主动脉弓</text>
  <ellipse cx="225" cy="200" rx="52" ry="38" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="225" y="204" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">脑</text>
  <rect x="196" y="244" width="58" height="26" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <rect x="199.421" y="248.5" width="51.158" height="17" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="225" y="260.6" font-size="10" fill="#4c1d95" text-anchor="middle" font-weight="700">NTS</text>
  <text x="262" y="260" font-size="9.5" fill="#64748b">延髓</text>
  <path d="M 170,306 L 170,254 C 170,236 184,230 198,234" fill="none" stroke="#0369a1" stroke-width="3.5"/>
