<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">氨基酸的脱氨基作用与氨的转运</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">转氨（PLP/Schiff碱）+L-谷氨酸脱氢酶组成联合脱氨基（主要方式，肌肉改走嘌呤核苷酸循环）；血氨以谷氨酰胺与丙氨酸双载体无毒运输——Gln供脑肌→肝肾、Ala</text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">偶联葡萄糖-丙氨酸循环</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、转氨基作用：PLP 辅酶与可逆的氨基转移</text>
  <rect x="56" y="186" width="118" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="115" y="206" font-size="11.5" fill="#1e293b" text-anchor="middle">α-氨基酸</text>
  <text x="190" y="206" font-size="13" fill="#475569" text-anchor="middle">＋</text>
  <rect x="210" y="186" width="128" height="32" rx="7" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.5"/>
  <text x="274" y="206" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">α-酮戊二酸</text>
  <line x1="170" y1="226" x2="170" y2="268" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)" marker-start="url(#arr-ink)"/>
  <rect x="56" y="276" width="118" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="115" y="296" font-size="11.5" fill="#1e293b" text-anchor="middle">α-酮酸</text>
  <text x="190" y="296" font-size="13" fill="#475569" text-anchor="middle">＋</text>
  <rect x="210" y="276" width="128" height="32" rx="7" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.5"/>
  <text x="274" y="296" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">谷氨酸</text>
  <rect x="391.63145" y="236.225" width="120.7371" height="19.55" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="452" y="250.14" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">转氨酶（辅酶 PLP）</text>
  <text x="452" y="274" font-size="10" fill="#64748b" text-anchor="middle">反应可逆 · 平衡常数≈1</text>
  <text x="390" y="196" font-size="10.5" fill="#475569">PLP 与氨基酸形成 Schiff 碱（醛亚胺），</text>
  <text x="390" y="211" font-size="10.5" fill="#475569">经「醛醇」互变完成氨基转移，PLP ⇌ PMP 循环周转。</text>
  <rect x="56" y="336" width="128" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="363.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">转氨酶</text>
  <rect x="184" y="336" width="312" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="340" y="363.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">催化的反应</text>
  <rect x="496" y="336" width="172" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="582" y="363.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">含量最高器官</text>
  <rect x="56" y="380" width="128" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="402.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">ALT / GPT</text>
  <rect x="184" y="380" width="312" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="340" y="402.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">丙氨酸 + α-KG ⇌ 丙酮酸 + Glu</text>
  <rect x="496" y="380" width="172" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="582" y="402.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">肝</text>
  <rect x="56" y="414" width="612" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="56" y="414" width="128" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="436.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">AST / GOT</text>
  <rect x="184" y="414" width="312" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="340" y="436.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">天冬氨酸 + α-KG ⇌ OAA + Glu</text>
  <rect x="496" y="414" width="172" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="582" y="436.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">心肌</text>
  <rect x="56" y="470" width="612" height="40" rx="8" fill="#fee2e2" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.5"/>
  <text x="72" y="494" font-size="11" fill="#dc2626" font-weight="700">血清转氨酶升高是肝细胞 / 心肌损伤的灵敏指标（急性肝炎 ALT↑↑）</text>
  <text x="56" y="530" font-size="10.5" fill="#64748b">转氨只转移氨基、并未净脱氨——净脱氨需与谷氨酸脱氢酶配合。</text>
  <rect x="750" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="154.84" font-size="19" fill="#475569" font-weight="700">二、联合脱氨基（主要方式）与嘌呤核苷酸循环</text>
  <rect x="770" y="186" width="140" height="36" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="840" y="208" font-size="11.5" fill="#1e293b" text-anchor="middle">各种氨基酸</text>
  <line x1="912" y1="204" x2="1000" y2="204" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="940.55" y="175.5" width="38.900000000000006" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="960" y="187.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">转氨酶</text>
  <rect x="1002" y="186" width="120" height="36" rx="7" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.6"/>
  <text x="1062" y="208" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">谷氨酸</text>
  <line x1="1124" y1="204" x2="1212" y2="204" stroke="#be185d" stroke-width="2.6" marker-end="url(#arr-enz)"/>
  <rect x="1214" y="176" width="136" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1282" y="198" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">α-酮戊二酸</text>
  <text x="1282" y="216" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">＋ NH₄⁺</text>
  <rect x="1062.1571" y="159.075" width="175.68580000000003" height="17.849999999999998" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1150" y="171.78" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">L-谷氨酸脱氢酶 GDH（限速关键）</text>
  <text x="766" y="262" font-size="10.5" fill="#475569">GDH 位于线粒体基质，辅酶 NAD⁺ 或 NADP⁺：谷氨酸 + NAD(P)⁺ + H₂O ⇌ α-KG + NH₄⁺ + NAD(P)H。</text>
  <text x="766" y="300" font-size="10.5" fill="#475569">受 ADP / GDP 激活、ATP / GTP 抑制（能量状态调控）。</text>
  <rect x="766" y="330" width="340" height="44" rx="8" fill="#d1fae5" fill-opacity="0.45" stroke="#059669" stroke-width="1.6"/>
  <text x="782" y="350" font-size="10.5" fill="#065f46" font-weight="700">联合脱氨基 = 转氨 + GDH：体内氨基酸脱氨的主要方式，</text>
  <text x="782" y="364" font-size="10.5" fill="#065f46" font-weight="700">可逆——其逆过程即非必需氨基酸合成的主要途径。</text>
  <rect x="1126" y="330" width="224" height="118" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1142" y="354" font-size="11.5" fill="#1e293b" font-weight="700">肌肉的替代方案：</text>
  <text x="1142" y="376" font-size="10" fill="#475569">骨骼肌与心肌 GDH 活性低，</text>
  <text x="1142" y="390" font-size="10" fill="#475569">改走嘌呤核苷酸循环脱氨：</text>
  <text x="1142" y="404" font-size="10" fill="#475569">AMP → IMP + NH₄⁺。</text>
  <text x="766" y="494" font-size="10.5" fill="#64748b">「转氨收集氨基 → GDH 集中释放」的分工，使各类氨基酸共享一套脱氨机具。</text>
  <text x="766" y="530" font-size="10.5" fill="#64748b">α-酮戊二酸既是共同氨基受体，又是 TCA 中间物——转氨与产能枢纽重叠。</text>
  <rect x="30" y="566" width="700" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="588.84" font-size="19" fill="#475569" font-weight="700">三、氨的转运：谷氨酰胺与丙氨酸两种「无毒载体」</text>
  <text x="46" y="618" font-size="12" fill="#1e293b" font-weight="700">① 谷氨酰胺（脑 · 肌肉 → 肝 / 肾）：</text>
  <ellipse cx="120" cy="690" rx="56" ry="40" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="120" y="690" font-size="18" fill="#475569" text-anchor="middle" font-weight="600">脑 · 肌</text>
  <rect x="210" y="668" width="130" height="44" rx="8" fill="#fef3c7" fill-opacity="0.55" stroke="#b45309" stroke-width="1.6"/>
  <text x="275" y="684" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">谷氨酰胺 Gln</text>
  <text x="275" y="702" font-size="9.5" fill="#64748b" text-anchor="middle">（无毒载氨）</text>
  <line x1="178" y1="690" x2="206" y2="690" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="172.81717500000008" y="639.925" width="214.36564999999987" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="280" y="651.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="600">谷氨酰胺合成酶（耗 ATP）：Glu + NH₄⁺ → Gln</text>
  <line x1="340" y1="690" x2="430" y2="690" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-bad)"/>
  <text x="385" y="676" font-size="10" fill="#64748b" text-anchor="middle">血</text>
  <ellipse cx="500" cy="690" rx="56" ry="40" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="500" y="690" font-size="18" fill="#475569" text-anchor="middle" font-weight="600">肝 · 肾</text>
  <line x1="558" y1="690" x2="626" y2="690" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="498.95345" y="639.925" width="122.09309999999999" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="560" y="651.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="600">谷氨酰胺酶水解释放 NH₄⁺</text>
  <rect x="628" y="668" width="96" height="44" rx="8" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="676" y="684" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">NH₄⁺</text>
  <text x="676" y="702" font-size="9" fill="#64748b" text-anchor="middle">尿素 / 排酸</text>
  <text x="46" y="744" font-size="10.5" fill="#475569">肝内 NH₄⁺ 入尿素循环解毒；肾内以 NH₄⁺ 形式泌 H⁺ 排酸（兼运输与酸碱调节）。</text>
  <text x="46" y="786" font-size="12" fill="#1e293b" font-weight="700">② 丙氨酸（葡萄糖-丙氨酸循环，肌肉 → 肝）：</text>
  <ellipse cx="120" cy="860" rx="56" ry="40" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="120" y="860" font-size="18" fill="#475569" text-anchor="middle" font-weight="600">肌肉</text>
  <rect x="210" y="838" width="130" height="44" rx="8" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="275" y="854" font-size="11.5" fill="#4c1d95" text-anchor="middle" font-weight="700">丙氨酸 Ala</text>
  <text x="275" y="872" font-size="9.5" fill="#64748b" text-anchor="middle">（氨 + 碳架同运）</text>
  <line x1="178" y1="860" x2="206" y2="860" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="219.78517499999998" y="809.925" width="120.42965000000002" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="280" y="821.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="600">丙酮酸接受氨基 → 丙氨酸</text>
  <line x1="340" y1="860" x2="430" y2="860" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#arr-pro)"/>
  <text x="385" y="846" font-size="10" fill="#64748b" text-anchor="middle">血</text>
  <ellipse cx="500" cy="860" rx="56" ry="40" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="500" y="860" font-size="18" fill="#475569" text-anchor="middle" font-weight="600">肝</text>
  <line x1="558" y1="860" x2="626" y2="860" stroke="#059669" stroke-width="2.4" marker-end="url(#arr-ok)"/>
  <rect x="530.28035" y="809.925" width="115.43930000000002" height="16.15" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="588" y="821.42" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="600">脱氨 → 丙酮酸 → 糖异生</text>
  <rect x="628" y="838" width="96" height="44" rx="8" fill="#d1fae5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5"/>
  <text x="676" y="854" font-size="11.5" fill="#065f46" text-anchor="middle" font-weight="700">葡萄糖</text>
  <text x="676" y="872" font-size="9" fill="#64748b" text-anchor="middle">→ 回肌肉</text>
  <text x="46" y="914" font-size="10.5" fill="#475569">肌肉氨基酸的氨基以无毒丙氨酸运至肝脱氨，碳架经糖异生成葡萄糖运回肌肉——运氨兼运碳。</text>
  <text x="46" y="952" font-size="11" fill="#1e293b" font-weight="700">血氨有毒（脑最敏感），必须以 Gln / Ala 形式「押运」。</text>
  <rect x="750" y="566" width="620" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="588.84" font-size="19" fill="#475569" font-weight="700">四、高血氨的毒性：肝性脑病的生化机制</text>
  <rect x="790" y="612" width="360" height="40" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="970" y="636" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">NH₄⁺ 进入脑组织</text>
  <line x1="970" y1="652" x2="970" y2="670" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="790" y="674" width="360" height="40" rx="8" fill="#fef3c7" fill-opacity="0.55" stroke="#d97706" stroke-width="1.6"/>
  <text x="970" y="698" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">与 α-KG 结合生成谷氨酸（消耗 NADH）</text>
  <line x1="970" y1="714" x2="970" y2="732" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="790" y="736" width="360" height="40" rx="8" fill="#fef3c7" fill-opacity="0.55" stroke="#d97706" stroke-width="1.6"/>
  <text x="970" y="760" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">谷氨酰胺合成（消耗 ATP）</text>
  <line x1="970" y1="776" x2="970" y2="794" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="790" y="798" width="360" height="40" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="970" y="822" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">TCA 中间物耗竭 · 能量危机 · 渗透压失衡</text>
  <line x1="970" y1="838" x2="970" y2="856" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="790" y="860" width="360" height="40" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="970" y="884" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">星形胶质细胞肿胀 → 肝性脑病</text>
  <rect x="1170" y="612" width="176" height="130" rx="8" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
  <text x="1258" y="638" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">临床处置</text>
  <text x="1182" y="662" font-size="10.5" fill="#475569">· 限制蛋白质摄入</text>
  <text x="1182" y="690" font-size="10.5" fill="#475569">· 乳果糖酸化肠道，减少氨吸收</text>
  <text x="766" y="942" font-size="10.5" fill="#64748b">氨把脑的「产能机器」与「渗透平衡」同时拖垮——肝功能衰竭时解毒中断。</text>
