<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">微生物学发展简史：从史前发酵经验到分子生物学</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">1674 列文虎克首见「微动物」，1676 首见细菌；巴斯德与科赫双峰并峙（1885 狂犬疫苗、1905 科赫诺奖）；1928 弗莱明发现青霉素开启抗生素时代</text>
  <rect x="30" y="132" width="1340" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、发展简史时间线：从「微动物」到青霉素（1674–1928）</text>
  <line x1="110" y1="300" x2="1330" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="146.6" cy="300" r="6.5" fill="#0369a1"/>
  <line x1="146.6" y1="291" x2="146.6" y2="270" stroke="#0369a1" stroke-width="1.7"/>
  <text x="146.6" y="250" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1674 列文虎克首见「微动物」</text>
  <text x="146.6" y="230" font-size="12" fill="#64748b" text-anchor="middle">自制单式显微镜 200–300×</text>
  <circle cx="250.3" cy="300" r="6.5" fill="#0f766e"/>
  <line x1="250.3" y1="309" x2="250.3" y2="330" stroke="#0f766e" stroke-width="1.7"/>
  <text x="250.3" y="350" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1676 首次看见细菌</text>
  <text x="250.3" y="370" font-size="12" fill="#64748b" text-anchor="middle">牙垢与胡椒浸液中</text>
  <circle cx="439.40000000000003" cy="300" r="6.5" fill="#b45309"/>
  <line x1="439.40000000000003" y1="291" x2="439.40000000000003" y2="270" stroke="#b45309" stroke-width="1.7"/>
  <text x="439.40000000000003" y="250" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1857 发酵由特定微生物引起</text>
  <text x="439.40000000000003" y="230" font-size="12" fill="#64748b" text-anchor="middle">巴斯德：乳酸·丁酸·酒变酸</text>
  <circle cx="634.6" cy="300" r="6.5" fill="#be185d"/>
  <line x1="634.6" y1="309" x2="634.6" y2="330" stroke="#be185d" stroke-width="1.7"/>
  <text x="634.6" y="350" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1876 科赫发现炭疽杆菌</text>
  <text x="634.6" y="370" font-size="12" fill="#64748b" text-anchor="middle">首次证明杆菌体外形成耐热芽孢</text>
  <circle cx="781" cy="300" r="6.5" fill="#be185d"/>
  <line x1="781" y1="291" x2="781" y2="270" stroke="#be185d" stroke-width="1.7"/>
  <text x="781" y="250" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1882 发现结核杆菌</text>
  <text x="781" y="230" font-size="12" fill="#64748b" text-anchor="middle">3·24 → 世界防治结核病日</text>
  <circle cx="915.2" cy="300" r="6.5" fill="#b45309"/>
  <line x1="915.2" y1="309" x2="915.2" y2="330" stroke="#b45309" stroke-width="1.7"/>
  <text x="915.2" y="350" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1885 狂犬疫苗首次救治</text>
  <text x="915.2" y="370" font-size="12" fill="#64748b" text-anchor="middle">减毒疫苗开启免疫接种新纪元</text>
  <circle cx="1086" cy="300" r="6.5" fill="#6d28d9"/>
  <line x1="1086" y1="291" x2="1086" y2="270" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="1086" y="250" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1905 科赫获诺贝尔奖</text>
  <text x="1086" y="230" font-size="12" fill="#64748b" text-anchor="middle">生理学或医学奖</text>
  <circle cx="1244.6000000000001" cy="300" r="6.5" fill="#dc2626"/>
  <line x1="1244.6000000000001" y1="309" x2="1244.6000000000001" y2="330" stroke="#dc2626" stroke-width="1.7"/>
  <text x="1244.6000000000001" y="350" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1928 弗莱明发现青霉素</text>
  <text x="1244.6000000000001" y="370" font-size="12" fill="#64748b" text-anchor="middle">抗生素时代开启</text>
  <text x="700" y="418" font-size="11.5" fill="#64748b" text-anchor="middle">巴斯德与科赫使微生物学从形态描述走向实验科学：纯培养与科赫法则成为病原鉴定的金标准</text>
  <rect x="30" y="472" width="1340" height="508" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="494.84" font-size="19" fill="#475569" font-weight="700">二、奠基双峰：巴斯德与科赫</text>
  <rect x="50" y="512" width="630" height="224" rx="10" fill="#fef3c7" fill-opacity="0.35" stroke="#b45309" stroke-width="1.6"/>
  <rect x="108.69" y="528.1" width="182.62" height="23.8" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="200" y="545.04" font-size="14" fill="#78350f" text-anchor="middle" font-weight="700">巴斯德「微生物学之父」</text>
  <circle cx="72" cy="576" r="3.5" fill="#b45309"/>
  <text x="84" y="580" font-size="12" fill="#475569">曲颈瓶实验否定「自然发生说」</text>
  <circle cx="72" cy="604" r="3.5" fill="#b45309"/>
  <text x="84" y="608" font-size="12" fill="#475569">1857 年起证明乳酸发酵、丁酸发酵与酒的变酸皆由特定微生物引起</text>
  <circle cx="72" cy="632" r="3.5" fill="#b45309"/>
  <text x="84" y="636" font-size="12" fill="#475569">创立巴氏消毒法</text>
  <circle cx="72" cy="660" r="3.5" fill="#b45309"/>
  <text x="84" y="664" font-size="12" fill="#475569">依据老龄培养物毒力减弱原理制成鸡霍乱疫苗与狂犬疫苗（1885 年首次救治被疯犬咬伤的男孩）</text>
  <rect x="50" y="756" width="630" height="224" rx="10" fill="#fce7f3" fill-opacity="0.35" stroke="#be185d" stroke-width="1.6"/>
  <rect x="137.53" y="772.1" width="124.94" height="23.8" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="200" y="789.04" font-size="14" fill="#831843" text-anchor="middle" font-weight="700">科赫与科赫法则</text>
  <circle cx="72" cy="820" r="3.5" fill="#be185d"/>
  <text x="84" y="824" font-size="12" fill="#475569">首创固体培养基，建立纯培养技术</text>
  <circle cx="72" cy="848" r="3.5" fill="#be185d"/>
  <text x="84" y="852" font-size="12" fill="#475569">提出科赫法则（四条）——病原微生物鉴定的金标准</text>
  <circle cx="72" cy="876" r="3.5" fill="#be185d"/>
  <text x="84" y="880" font-size="12" fill="#475569">发现炭疽杆菌（1876）、结核杆菌（1882）、霍乱弧菌（1883）</text>
  <circle cx="72" cy="904" r="3.5" fill="#be185d"/>
  <text x="84" y="908" font-size="12" fill="#475569">1905 年获诺贝尔生理学或医学奖</text>
  <circle cx="72" cy="932" r="3.5" fill="#be185d"/>
  <text x="84" y="936" font-size="12" fill="#475569">门下贝林与北里柴三郎制成白喉与破伤风抗毒素——贝林获 1901 年首届诺贝尔奖</text>
  <text x="1025" y="514" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">微生物学史分期（大致年代）</text>
  <rect x="700" y="530" width="95" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="747.5" y="557.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">分期</text>
  <rect x="795" y="530" width="115" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="852.5" y="557.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">大致年代</text>
  <rect x="910" y="530" width="260" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1040" y="557.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">特征</text>
  <rect x="1170" y="530" width="180" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="557.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">代表人物</text>
  <rect x="700" y="574" width="95" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="747.5" y="602.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">史前期</text>
  <rect x="795" y="574" width="115" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="852.5" y="602.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">史前–1674</text>
  <rect x="910" y="574" width="260" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1040" y="602.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">酿酒、制酱——知其然的经验应用</text>
  <rect x="1170" y="574" width="180" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="602.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">各文明先民</text>
  <rect x="700" y="620" width="650" height="46" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="700" y="620" width="95" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="747.5" y="648.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">初创期</text>
  <rect x="795" y="620" width="115" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="852.5" y="648.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">1674–1861</text>
  <rect x="910" y="620" width="260" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1040" y="648.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">显微镜下的形态描述</text>
  <rect x="1170" y="620" width="180" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="648.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">列文虎克</text>
  <rect x="700" y="666" width="95" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="747.5" y="694.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">奠基期</text>
  <rect x="795" y="666" width="115" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="852.5" y="694.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">1861–1897</text>
  <rect x="910" y="666" width="260" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1040" y="694.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">否定自然发生·纯培养·科赫法则</text>
  <rect x="1170" y="666" width="180" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="694.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">巴斯德·科赫</text>
  <rect x="700" y="712" width="650" height="46" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="700" y="712" width="95" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="747.5" y="740.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">发展期</text>
  <rect x="795" y="712" width="115" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="852.5" y="740.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">1897–1953</text>
  <rect x="910" y="712" width="260" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1040" y="740.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">病毒滤过性·加富培养·抗生素</text>
  <rect x="1170" y="712" width="180" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="740.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">弗莱明等</text>
  <rect x="700" y="758" width="95" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="747.5" y="786.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">分子时期</text>
  <rect x="795" y="758" width="115" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="852.5" y="786.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">1953–</text>
  <rect x="910" y="758" width="260" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1040" y="786.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">DNA 双螺旋 → 分子遗传学与基因工程</text>
  <rect x="1170" y="758" width="180" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1260" y="786.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">沃森、克里克等</text>
  <rect x="700" y="828" width="650" height="148" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.5"/>
  <text x="716" y="856" font-size="13.5" fill="#075985" font-weight="700">四项发现的学科奠基</text>
  <rect x="716" y="881" width="9" height="9" rx="2" fill="#0f766e"/>
  <text x="732" y="890" font-size="12" fill="#475569" font-weight="600">加富培养 → 微生物生态学</text>
  <rect x="716" y="909" width="9" height="9" rx="2" fill="#dc2626"/>
  <text x="732" y="918" font-size="12" fill="#475569" font-weight="600">病毒滤过性 → 病毒学</text>
  <rect x="1040" y="881" width="9" height="9" rx="2" fill="#059669"/>
  <text x="1056" y="890" font-size="12" fill="#475569" font-weight="600">青霉素发现 → 抗生素时代</text>
  <rect x="1040" y="909" width="9" height="9" rx="2" fill="#6d28d9"/>
  <text x="1056" y="918" font-size="12" fill="#475569" font-weight="600">肺炎链球菌转化实验 → 分子遗传学</text>
</svg>