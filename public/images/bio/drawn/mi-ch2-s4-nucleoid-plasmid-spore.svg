  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">核区、质粒与芽孢：原核的遗传装备与休眠胶囊</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">大肠杆菌染色体 4.6×10⁶ bp、周长约 1.6 mm 而细胞仅约 2 μm；芽孢休眠而非繁殖，DPA-Ca 占干重 5%–15%，121 ℃ 湿热 15–30 min 方可杀灭</text>
  <rect x="30" y="132" width="1340" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、核区：压缩近千倍的环状基因组（以大肠杆菌为例）</text>
  <rect x="60" y="185" width="380" height="130" rx="65" fill="#f8fafc" stroke="#475569" stroke-width="2.2"/>
  <path d="M 165 235 C 200 210, 245 250, 285 225 C 320 203, 360 240, 325 260 C 285 280, 240 245, 200 265 C 175 275, 150 250, 165 235" fill="none" stroke="#0f766e" stroke-width="2.2"/>
  <path d="M 200 240 C 230 220, 270 260, 310 235 C 330 222, 350 250, 320 255" fill="none" stroke="#0f766e" stroke-width="2"/>
  <rect x="206.465" y="282.225" width="87.07000000000001" height="19.55" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="250" y="296.14" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">核区（拟核）</text>
  <text x="250" y="342" font-size="11.5" fill="#64748b" text-anchor="middle">大肠杆菌：闭环双链 DNA，无核膜</text>
  <rect x="480" y="180" width="850" height="180" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="700" y="214" font-size="14.5" fill="#1e293b" font-weight="700">染色体 DNA：4.6 × 10⁶ bp · 闭环双链</text>
  <rect x="700" y="236" width="560" height="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1260" y="270" font-size="11.5" fill="#134e4a" text-anchor="end" font-weight="600">完全伸展周长 ≈ 1.6 mm</text>
  <rect x="700" y="300" width="5" height="12" fill="#dc2626"/>
  <text x="718" y="310" font-size="11.5" fill="#dc2626" font-weight="600">细胞长度 ≈ 2 μm</text>
  <text x="718" y="336" font-size="12" fill="#475569" font-weight="600">DNA 总长 ≈ 细胞长的 800 倍 → 必须压缩近千倍：负超螺旋 + 拟核相关蛋白（NAP）</text>
  <rect x="30" y="392" width="1340" height="310" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="414.84" font-size="19" fill="#475569" font-weight="700">二、质粒：染色体外自主复制的小型遗传单位（1 kb – 数百 kb）</text>
  <circle cx="195" cy="505" r="64" fill="none" stroke="#6d28d9" stroke-width="6" opacity="0.85"/>
  <text x="195" y="423" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="700">复制起点 ori</text>
  <line x1="195" y1="441" x2="195" y2="430" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="269.47818472546174" y="552" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="700">转移基因 tra</text>
  <line x1="250.42562584220408" y1="537" x2="259.9519052838329" y2="542.5" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="120.52181527453828" y="552" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="700">选择标记</text>
  <line x1="139.57437415779594" y1="537" x2="130.0480947161671" y2="542.5" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="195" y="612" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-weight="700">共价闭环双链 DNA</text>
  <text x="195" y="634" font-size="10.5" fill="#64748b" text-anchor="middle">严紧型 1–2 拷贝 / 松弛型高拷贝</text>
  <rect x="130.35" y="654.65" width="129.3" height="18.7" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="195" y="667.96" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">独立于染色体自主复制</text>
  <rect x="360" y="445" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="472.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">质粒类型</text>
  <rect x="490" y="445" width="420" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="700" y="472.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">主要功能</text>
  <rect x="910" y="445" width="430" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="472.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">代表实例</text>
  <rect x="360" y="489" width="130" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="512.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">F 质粒</text>
  <rect x="490" y="489" width="420" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="700" y="512.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">接合——形成性菌毛、传递遗传物质</text>
  <rect x="910" y="489" width="430" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="512.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">大肠杆菌 F⁺ / Hfr 菌株</text>
  <rect x="360" y="525" width="980" height="36" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="360" y="525" width="130" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="548.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">R 质粒</text>
  <rect x="490" y="525" width="420" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="700" y="548.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">耐药性——可携带多重耐药基因并在菌间传播</text>
  <rect x="910" y="525" width="430" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="548.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">肠杆菌多重耐药株</text>
  <rect x="360" y="561" width="130" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="584.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Col 质粒</text>
  <rect x="490" y="561" width="420" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="700" y="584.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">编码细菌素——抑制近缘竞争菌</text>
  <rect x="910" y="561" width="430" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="584.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">大肠杆菌素产生菌</text>
  <rect x="360" y="597" width="980" height="36" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="360" y="597" width="130" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="620.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">降解质粒</text>
  <rect x="490" y="597" width="420" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="700" y="620.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">降解萘、樟脑等难降解污染物</text>
  <rect x="910" y="597" width="430" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="620.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">假单胞菌</text>
  <rect x="360" y="633" width="130" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="425" y="656.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Ti 质粒</text>
  <rect x="490" y="633" width="420" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="700" y="656.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">诱发植物冠瘿瘤——植物基因工程载体</text>
  <rect x="910" y="633" width="430" height="36" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1125" y="656.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">根癌农杆菌</text>
  <text x="360" y="690" font-size="10.5" fill="#64748b">拷贝数控制：严紧型与染色体复制同步（1–2 个/细胞）；松弛型独立高频复制——基因工程载体多用松弛型。</text>
  <rect x="30" y="722" width="1340" height="258" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="744.84" font-size="19" fill="#475569" font-weight="700">三、芽孢：休眠的「生命胶囊」——121 ℃ 湿热 15–30 min 方可可靠杀灭</text>
  <ellipse cx="270" cy="852" rx="130" ry="92" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/>
  <ellipse cx="270" cy="852" rx="108" ry="76" fill="none" stroke="#6d28d9" stroke-width="3.5"/>
  <ellipse cx="270" cy="852" rx="84" ry="58" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="5 3"/>
  <ellipse cx="270" cy="852" rx="60" ry="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="335" y="777" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">①</text>
  <text x="378" y="857" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">②</text>
  <text x="312" y="907" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">③</text>
  <text x="322" y="837" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">④</text>
  <text x="270" y="968" font-size="10.5" fill="#64748b" text-anchor="middle">芽孢纵切（层级示意）</text>
  <text x="560" y="768" font-size="13" fill="#1e293b" font-weight="700">抗热结构层级（对应左图）</text>
  <rect x="560" y="785" width="9" height="9" rx="2" fill="#475569"/>
  <text x="578" y="794" font-size="11.5" fill="#475569" font-weight="600">① 孢外壁：脂蛋白薄层（部分菌种具有）</text>
  <rect x="560" y="809" width="9" height="9" rx="2" fill="#6d28d9"/>
  <text x="578" y="818" font-size="11.5" fill="#475569" font-weight="600">② 芽孢衣：坚硬致密的疏水蛋白层——阻挡酶与化学因子</text>
  <rect x="560" y="833" width="9" height="9" rx="2" fill="#0369a1"/>
  <text x="578" y="842" font-size="11.5" fill="#475569" font-weight="600">③ 皮层：特殊肽聚糖，吸水膨胀反向挤压核心</text>
  <rect x="560" y="857" width="9" height="9" rx="2" fill="#d97706"/>
  <text x="578" y="866" font-size="11.5" fill="#475569" font-weight="600">④ 核心：高度脱水；DPA-Ca 占芽孢干重 5%–15%，稳定蛋白质与 DNA</text>
  <rect x="560" y="874" width="790" height="26" rx="6" fill="#fef3c7" fill-opacity="0.45" stroke="#b45309" stroke-width="1.2"/>
  <text x="572" y="891" font-size="11" fill="#78350f" font-weight="600">苏云金芽孢杆菌：伴孢晶体在昆虫碱性肠液中活化成孔——安全高效的生物农药基础</text>
  <rect x="560" y="910" width="150" height="44" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="635" y="928" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">营养细胞</text>
  <text x="635" y="946" font-size="9.5" fill="#64748b" text-anchor="middle">（活跃代谢）</text>
  <line x1="714" y1="935" x2="790" y2="935" stroke="#475569" stroke-width="2" marker-end="url(#arr-mute)"/>
  <text x="753" y="926" font-size="10" fill="#475569" text-anchor="middle">营养匮乏</text>
  <rect x="796" y="910" width="210" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="901" y="928" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">芽孢（休眠）</text>
  <text x="901" y="946" font-size="9.5" fill="#64748b" text-anchor="middle">121 ℃ 湿热 15–30 min 方可杀灭</text>
  <line x1="1012" y1="935" x2="1110" y2="935" stroke="#475569" stroke-width="2" marker-end="url(#arr-mute)"/>
  <text x="1061" y="926" font-size="10" fill="#475569" text-anchor="middle">活化 · 启动 · 长出</text>
  <rect x="1116" y="910" width="154" height="44" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1193" y="928" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">营养细胞</text>
  <text x="1193" y="946" font-size="9.5" fill="#64748b" text-anchor="middle">（萌发恢复）</text>
  <text x="560" y="976" font-size="10.5" fill="#64748b">休眠而非繁殖：一个营养细胞只产一个芽孢，萌发后仍为一个细胞；启动期数分钟内即丧失折光性与抗热性</text>
