  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">生物物理学的研究对象：跨 10 个数量级的尺度层级</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">空间 0.1 nm 原子 → 2 nm DNA → 25 nm 核糖体 → 8 μm 红细胞 → 米级组织；时间从飞秒键振动到小时级细胞分裂；五大分支与「相互作用—结构形态—能量信息」三问</text>
