  <text x="80" y="606" font-size="10.5" fill="#475569">纳米尺度的分子事件如何逐级放大为微米尺度的细胞行为——跨尺度是生物物理研究的基本特征。</text>
  <rect x="30" y="666" width="1340" height="304" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="688.84" font-size="19" fill="#475569" font-weight="700">三、核心问题与五大分支体系</text>
  <text x="50" y="712" font-size="12.5" fill="#1e293b" font-weight="700">生物物理学的三个核心问题</text>
  <rect x="50" y="726" width="400" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="71.31" y="740.225" width="61.38" height="19.55" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="102" y="754.14" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">相互作用</text>
  <text x="168" y="755" font-size="11" fill="#475569">生命系统由什么物理相互作用维系？</text>
  <rect x="50" y="784" width="400" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="71.31" y="798.225" width="61.38" height="19.55" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="102" y="812.14" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">结构形态</text>
  <text x="168" y="813" font-size="11" fill="#475569">结构为何呈现特定的物理形态？</text>
  <rect x="50" y="842" width="400" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="69.4148" y="856.225" width="65.1704" height="19.55" rx="7" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="102" y="870.14" font-size="11.5" fill="#be185d" text-anchor="middle" font-weight="700">能量/信息</text>
  <text x="168" y="871" font-size="11" fill="#475569">能量与信息如何流动与转换？</text>
  <text x="500" y="712" font-size="12.5" fill="#1e293b" font-weight="700">五大分支</text>
  <rect x="500" y="724" width="560" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="508" y="730" width="5" height="22" rx="2" fill="#0f766e"/>
  <text x="522" y="746" font-size="11.5" fill="#0f766e" font-weight="700">分子生物物理</text>
  <text x="700" y="746" font-size="10.5" fill="#475569">蛋白质、核酸等大分子的结构、折叠与相互作用</text>
  <rect x="500" y="764" width="560" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
