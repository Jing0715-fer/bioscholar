  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">单通道记录与单分子统计：从 pA 方波到 P_o 与 1/√N</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">GΩ封接隔离几μm²膜片（1pA≈6×10⁶离子/s）；电导指纹：K⁺4–20pS、nAChR≈40pS、BK≈250pS；P_o=T_open/(T_open+T_closed)，I=N·P_o·g·(V−E_rev)；泊松误差~</text>
