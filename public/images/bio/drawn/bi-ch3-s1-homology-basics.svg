  <circle cx="1140" cy="514" r="4.5" fill="#1e293b"/>
  <text x="1140" y="534" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">B1</text>
  <circle cx="1260" cy="514" r="4.5" fill="#1e293b"/>
  <text x="1260" y="534" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">B2</text>
  <rect x="30" y="576" width="1340" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、全局、局部与半全局比对：三种生物学故事</text>
  <rect x="60" y="636" width="400" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="260" y="664" font-size="14.5" fill="#134e4a" text-anchor="middle" font-weight="700">全局比对</text>
  <rect x="100" y="690" width="180" height="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="100" y="726" width="180" height="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <line x1="100" y1="710" x2="100" y2="726" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="145" y1="710" x2="145" y2="726" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="190" y1="710" x2="190" y2="726" stroke="#94a3b8" stroke-width="1.2"/>
