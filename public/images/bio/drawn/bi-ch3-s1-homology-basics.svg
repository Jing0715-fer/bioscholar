  <line x1="280" y1="710" x2="280" y2="726" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="260" y="776" font-size="11.5" fill="#475569" text-anchor="middle">整条同源：端到端比较</text>
  <rect x="500" y="636" width="400" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="664" font-size="14.5" fill="#075985" text-anchor="middle" font-weight="700">局部比对</text>
  <rect x="540" y="690" width="240" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
