  <rect x="1040" y="734" width="120" height="20" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
  <text x="1140" y="776" font-size="11.5" fill="#475569" text-anchor="middle">嵌套关系：末端自由（如读段对基因组）</text>
  <text x="60" y="880" font-size="13.5" fill="#1e293b" font-weight="700">比对的五大用途</text>
  <rect x="204.25" y="869.375" width="71.5" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="240" y="884.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">功能推断</text>
  <rect x="411.375" y="869.375" width="97.25" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="460" y="884.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">保守残基定位</text>
  <rect x="644.25" y="869.375" width="71.5" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="680" y="884.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">演化重建</text>
  <rect x="864.25" y="869.375" width="71.5" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="900" y="884.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">实验设计</text>
  <rect x="1084.25" y="869.375" width="71.5" height="21.25" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1120" y="884.5" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">数据质检</text>
  <text x="60" y="928" font-size="11.5" fill="#64748b">选错模式会稀释或扭曲信号——先想清楚两条序列讲的是哪种生物学故事。</text>
</svg>