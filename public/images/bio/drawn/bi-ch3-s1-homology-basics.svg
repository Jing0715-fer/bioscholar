  <rect x="570" y="726" width="180" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="610" y="726" width="70" height="20" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
  <text x="700" y="776" font-size="11.5" fill="#475569" text-anchor="middle">共享片段：各取内部最相似片段对</text>
  <rect x="940" y="636" width="400" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1140" y="664" font-size="14.5" fill="#78350f" text-anchor="middle" font-weight="700">半全局比对</text>
