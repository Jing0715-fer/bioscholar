<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">化能异养产能：发酵、有氧呼吸与无氧呼吸的电子受体对照</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">发酵无外源电子受体、每分子葡萄糖仅净得 1–3 ATP；有氧呼吸彻底氧化、ATP 得率经典约 38 修正约 32；无氧呼吸以 NO₃⁻/SO₄²⁻/CO₂ 为受体</text>
  <rect x="30" y="132" width="1340" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、产能机制只有三种通用方式</text>
  <rect x="50" y="178" width="410" height="130" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="70" y="206" font-size="14.5" fill="#075985" font-weight="700">① 底物水平磷酸化</text>
  <text x="70" y="232" font-size="11.5" fill="#475569">高能磷酸基团直接从中间物转移到 ADP——EMP 中 1,3-二磷酸甘油酸与磷酸烯醇式丙酮酸、</text>
  <text x="70" y="250" font-size="11.5" fill="#475569">TCA 中的琥珀酰辅酶 A。</text>
  <rect x="470" y="178" width="410" height="130" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="490" y="206" font-size="14.5" fill="#134e4a" font-weight="700">② 氧化磷酸化</text>
  <text x="490" y="232" font-size="11.5" fill="#475569">电子经呼吸链传递把质子泵出膜外，形成跨膜质子梯度，</text>
  <text x="490" y="250" font-size="11.5" fill="#475569">由 ATP 合酶合成 ATP（化学渗透学说，Mitchell 1961）。</text>
  <rect x="890" y="178" width="410" height="130" rx="9" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
  <text x="910" y="206" font-size="14.5" fill="#059669" font-weight="700">③ 光合磷酸化</text>
  <text x="910" y="232" font-size="11.5" fill="#475569">光能驱动电子传递，同样建立质子梯度产 ATP——与产能代谢的总纲</text>
  <text x="910" y="250" font-size="11.5" fill="#475569">（见自养代谢节）。</text>
  <rect x="30" y="382" width="1340" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="404.84" font-size="19" fill="#475569" font-weight="700">二、发酵 · 无氧呼吸 · 有氧呼吸：外源电子受体决定产能天花板</text>
  <rect x="50" y="420" width="180" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="447.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">比较项目</text>
  <rect x="230" y="420" width="330" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="447.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">发酵</text>
  <rect x="560" y="420" width="370" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="745" y="447.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">无氧呼吸</text>
  <rect x="930" y="420" width="420" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1140" y="447.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">有氧呼吸</text>
  <rect x="50" y="464" width="180" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="491.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">外源电子受体</text>
  <rect x="230" y="464" width="330" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="491.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">无——NADH 经内部再循环再生 NAD⁺</text>
  <rect x="560" y="464" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="745" y="491.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">外源无机物（NO₃⁻、SO₄²⁻、CO₂）</text>
  <rect x="930" y="464" width="420" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1140" y="491.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">分子氧 O₂</text>
  <rect x="50" y="508" width="1300" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="508" width="180" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="535.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">还原终产物</text>
  <rect x="230" y="508" width="330" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="535.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">乳酸、乙醇等有机产物</text>
  <rect x="560" y="508" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="745" y="535.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">N₂、H₂S、CH₄ 等无机物</text>
  <rect x="930" y="508" width="420" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1140" y="535.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">H₂O</text>
  <rect x="50" y="552" width="180" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="579.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">葡萄糖氧化程度</text>
  <rect x="230" y="552" width="330" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="579.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">部分氧化，能量滞留于产物</text>
  <rect x="560" y="552" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="745" y="579.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">不彻底</text>
  <rect x="930" y="552" width="420" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1140" y="579.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">彻底氧化为 CO₂ + H₂O</text>
  <rect x="50" y="596" width="1300" height="44" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="596" width="180" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="623.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">ATP 得率（每分子葡萄糖）</text>
  <rect x="230" y="596" width="330" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="623.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">净得仅 1–3 个</text>
  <rect x="560" y="596" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="745" y="623.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">介于发酵与有氧呼吸之间</text>
  <rect x="930" y="596" width="420" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1140" y="623.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">经典口径约 38；修正口径约 32（真核 30–32）</text>
  <rect x="50" y="640" width="180" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="667.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">呼吸链</text>
  <rect x="230" y="640" width="330" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="395" y="667.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">无</text>
  <rect x="560" y="640" width="370" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="745" y="667.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">有（位于细胞膜）</text>
  <rect x="930" y="640" width="420" height="44" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1140" y="667.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">真细菌呼吸链位于细胞膜；大肠杆菌为分支链</text>
  <text x="700" y="694" font-size="11" fill="#64748b" text-anchor="middle">同一分子葡萄糖：受体电位越正，电子下落的「落差」越大，可泵出的质子越多——ATP 产率也越高</text>
  <rect x="30" y="722" width="1340" height="258" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="744.84" font-size="19" fill="#475569" font-weight="700">三、无氧呼吸的类型与有氧呼吸的三阶段</text>
  <rect x="50" y="762" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="789.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">类型</text>
  <rect x="190" y="762" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="789.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">外源电子受体</text>
  <rect x="360" y="762" width="310" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="789.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">还原终产物</text>
  <rect x="50" y="806" width="140" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="830.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">硝酸盐呼吸</text>
  <rect x="190" y="806" width="170" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="830.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">NO₃⁻</text>
  <rect x="360" y="806" width="310" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="830.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">N₂（经 NO₂⁻、N₂O 多步还原）</text>
  <rect x="50" y="844" width="620" height="38" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="844" width="140" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="868.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">硫酸盐呼吸</text>
  <rect x="190" y="844" width="170" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="868.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">SO₄²⁻</text>
  <rect x="360" y="844" width="310" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="868.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">H₂S</text>
  <rect x="50" y="882" width="140" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="120" y="906.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">碳酸盐呼吸</text>
  <rect x="190" y="882" width="170" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="906.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">CO₂</text>
  <rect x="360" y="882" width="310" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="906.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">CH₄（产甲烷古菌）</text>
  <text x="50" y="930" font-size="11" fill="#64748b">反硝化作用即硝酸盐呼吸的别名——N₂ 回归大气造成土壤氮素流失。</text>
  <rect x="700" y="762" width="200" height="168" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="800" y="788" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">糖酵解（EMP）</text>
  <text x="800" y="816" font-size="10.5" fill="#475569" text-anchor="middle">葡萄糖 → 2 丙酮酸</text>
  <text x="800" y="840" font-size="10.5" fill="#475569" text-anchor="middle">净得 2 ATP（底物水平）</text>
  <text x="800" y="864" font-size="10.5" fill="#475569" text-anchor="middle">＋ 2 NADH</text>
  <rect x="925" y="762" width="200" height="168" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1025" y="788" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">TCA 循环</text>
  <text x="1025" y="816" font-size="10.5" fill="#475569" text-anchor="middle">每乙酰入环释 2 CO₂</text>
  <text x="1025" y="840" font-size="10.5" fill="#475569" text-anchor="middle">产 3 NADH + 1 FADH₂</text>
  <text x="1025" y="864" font-size="10.5" fill="#475569" text-anchor="middle">＋ 1 GTP</text>
  <rect x="1150" y="762" width="200" height="168" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1250" y="788" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">呼吸链＋氧化磷酸化</text>
  <text x="1250" y="816" font-size="10.5" fill="#475569" text-anchor="middle">电子传给 O₂ → H₂O</text>
  <text x="1250" y="840" font-size="10.5" fill="#475569" text-anchor="middle">泵质子建梯度</text>
  <text x="1250" y="864" font-size="10.5" fill="#475569" text-anchor="middle">ATP 合酶产出大头</text>
  <line x1="902" y1="800" x2="923" y2="800" stroke="#475569" stroke-width="2" marker-end="url(#arr-mute)"/>
  <line x1="1127" y1="800" x2="1148" y2="800" stroke="#475569" stroke-width="2" marker-end="url(#arr-mute)"/>
</svg>