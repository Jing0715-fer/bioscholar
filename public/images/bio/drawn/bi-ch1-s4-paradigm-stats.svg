<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">研究范式与方法：干湿循环、多重检验与可重复性</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">干湿实验交替构成研究闭环，计算结论须标注证据等级并量化不确定性；P 值是零假设为真时出现当前或更极端结果的概率；Bonferroni 控 FWER（极保守）、BH 控 FDR（探索性筛选），FDR 5% 即列表中假阳性期望比例约 5%；版本冻结、容器化与工作流引擎把分析变为公共资产</text>
  <rect x="30" y="132" width="640" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、干实验与湿实验：交替的研究节奏</text>
  <rect x="80" y="206" width="250" height="92" rx="10" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="1.8"/>
  <text x="205" y="232" font-size="15" fill="#134e4a" text-anchor="middle" font-weight="700">湿实验</text>
  <text x="205" y="256" font-size="11.5" fill="#475569" text-anchor="middle">设计并产生数据</text>
  <text x="205" y="278" font-size="11" fill="#64748b" text-anchor="middle">高通量产出 · 批次效应须控</text>
  <rect x="350" y="206" width="250" height="92" rx="10" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.8"/>
  <text x="475" y="232" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">数据与数据库</text>
  <text x="475" y="256" font-size="11.5" fill="#475569" text-anchor="middle">版本冻结 · 受控访问</text>
  <text x="475" y="278" font-size="11" fill="#64748b" text-anchor="middle">原始数据是结论的地基</text>
  <rect x="350" y="340" width="250" height="92" rx="10" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="475" y="366" font-size="15" fill="#4c1d95" text-anchor="middle" font-weight="700">干实验（计算分析）</text>
  <text x="475" y="390" font-size="11.5" fill="#475569" text-anchor="middle">统计推断 · 建模 · 预测</text>
  <text x="475" y="412" font-size="11" fill="#64748b" text-anchor="middle">量化不确定性</text>
  <rect x="80" y="340" width="250" height="92" rx="10" fill="#fce7f3" fill-opacity="0.55" stroke="#be185d" stroke-width="1.8"/>
  <text x="205" y="366" font-size="15" fill="#831843" text-anchor="middle" font-weight="700">假设与模型</text>
  <text x="205" y="390" font-size="11.5" fill="#475569" text-anchor="middle">标注证据等级</text>
  <text x="205" y="412" font-size="11" fill="#64748b" text-anchor="middle">回实验台验证才是终点</text>
  <line x1="332" y1="252" x2="348" y2="252" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="475" y1="300" x2="475" y2="336" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="348" y1="386" x2="332" y2="386" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="205" y1="336" x2="205" y2="302" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="283" y="316" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">循环</text>
  <text x="60" y="480" font-size="12" fill="#475569">健康的研究节奏是干湿交替的循环：计算结论须标注证据等级并量化不确定性——星号不是终点，</text>
  <text x="60" y="498" font-size="12" fill="#475569">回到实验台验证才是。</text>
  <rect x="690" y="132" width="680" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="706" y="154.84" font-size="19" fill="#475569" font-weight="700">二、P 值正读与多重检验的两把闸门</text>
  <rect x="720" y="192" width="620" height="104" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="1030" y="222" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">P 值 = 零假设为真时，出现当前或更极端结果的概率</text>
  <text x="1030" y="250" font-size="11.5" fill="#475569" text-anchor="middle">它不等于「零假设为真的概率」——报告效应量与置信区间比星号更规范</text>
  <text x="1030" y="276" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="600">高通量场景一次检验成千上万个假设 → 多重检验问题</text>
  <rect x="720" y="322" width="176" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="808" y="349.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">策略</text>
  <rect x="896" y="322" width="148" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="349.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">控制目标</text>
  <rect x="1044" y="322" width="122" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1105" y="349.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">阈值行为</text>
  <rect x="1166" y="322" width="174" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1253" y="349.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">适合场景</text>
  <rect x="720" y="366" width="176" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="808" y="394.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Bonferroni</text>
  <rect x="896" y="366" width="148" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="394.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">家族错误率 FWER</text>
  <rect x="1044" y="366" width="122" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1105" y="394.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">极保守</text>
  <rect x="1166" y="366" width="174" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1253" y="394.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">确证性检验</text>
  <rect x="720" y="412" width="620" height="46" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="720" y="412" width="176" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="808" y="440.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Benjamini-Hochberg</text>
  <rect x="896" y="412" width="148" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="970" y="440.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">错误发现率 FDR</text>
  <rect x="1044" y="412" width="122" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1105" y="440.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">较宽松</text>
  <rect x="1166" y="412" width="174" height="46" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1253" y="440.5" font-size="12" fill="#475569" text-anchor="middle" font-weight="500">探索性筛选</text>
  <rect x="720" y="468" width="620" height="62" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#d97706" stroke-width="1.4"/>
  <text x="738" y="490" font-size="11.5" fill="#92400e">FDR 5% 的数字感：若得 500 个显著基因，含义是「其中假阳性的期望比例约 5%」，</text>
  <text x="738" y="506" font-size="11.5" fill="#92400e">而非「每个基因都有 95% 把握为真」。</text>
  <rect x="30" y="576" width="1340" height="384" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、可重复性：把分析变为公共资产的工程对策</text>
  <rect x="60" y="640" width="236" height="92" rx="10" fill="#ccfbf1" fill-opacity="0.55" stroke="#0f766e" stroke-width="1.8"/>
  <text x="178" y="668" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="700">原始数据</text>
  <text x="178" y="694" font-size="11" fill="#475569" text-anchor="middle">版本冻结（快照 + 元数据）</text>
  <line x1="300" y1="686" x2="316" y2="686" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="318" y="640" width="236" height="92" rx="10" fill="#e0f2fe" fill-opacity="0.55" stroke="#0369a1" stroke-width="1.8"/>
  <text x="436" y="668" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="700">分析环境</text>
  <text x="436" y="694" font-size="11" fill="#475569" text-anchor="middle">容器化镜像（依赖打包）</text>
  <line x1="558" y1="686" x2="574" y2="686" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="576" y="640" width="236" height="92" rx="10" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="694" y="668" font-size="15" fill="#6d28d9" text-anchor="middle" font-weight="700">分析流程</text>
  <text x="694" y="694" font-size="11" fill="#475569" text-anchor="middle">工作流引擎（Snakemake / Nextflow）</text>
  <line x1="816" y1="686" x2="832" y2="686" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="834" y="640" width="236" height="92" rx="10" fill="#fce7f3" fill-opacity="0.55" stroke="#be185d" stroke-width="1.8"/>
  <text x="952" y="668" font-size="15" fill="#be185d" text-anchor="middle" font-weight="700">使用门槛</text>
  <text x="952" y="694" font-size="11" fill="#475569" text-anchor="middle">Galaxy 等平台（图形化）</text>
  <line x1="1074" y1="686" x2="1090" y2="686" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <rect x="1092" y="640" width="236" height="92" rx="10" fill="#d1fae5" fill-opacity="0.55" stroke="#059669" stroke-width="1.8"/>
  <text x="1210" y="668" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">公共资产</text>
  <text x="1210" y="694" font-size="11" fill="#475569" text-anchor="middle">他人可复现的完整分析</text>
  <rect x="60" y="772" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="799.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">要素</text>
  <rect x="230" y="772" width="470" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="465" y="799.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">问题</text>
  <rect x="700" y="772" width="660" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1030" y="799.5" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">工程对策</text>
  <rect x="60" y="816" width="170" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="842.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">数据</text>
  <rect x="230" y="816" width="470" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="465" y="842.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">版本漂移与「悄悄更新」</text>
  <rect x="700" y="816" width="660" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1030" y="842.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">版本冻结 + 持久标识（登录号.版本号）</text>
  <rect x="60" y="858" width="1300" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="858" width="170" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="884.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">环境</text>
  <rect x="230" y="858" width="470" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="465" y="884.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">依赖与系统漂移</text>
  <rect x="700" y="858" width="660" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1030" y="884.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">容器化环境（同一镜像在任何机器复现）</text>
  <rect x="60" y="900" width="170" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="145" y="926.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">流程</text>
  <rect x="230" y="900" width="470" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="465" y="926.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">手工步骤不可复述</text>
  <rect x="700" y="900" width="660" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1030" y="926.5" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="500">工作流引擎 / Galaxy 平台代码化</text>
</svg>