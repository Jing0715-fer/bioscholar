  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">微生物与食品：发酵食品矩阵、栅栏技术与单细胞蛋白</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">统一逻辑：生物保藏+风味制造；酸奶约42℃共生至pH4.4–4.6；啤酒拉格8–13℃、艾尔15–25℃、酒精度3%–5%；泡菜亚硝酸盐单峰、安全期在充分发酵后</text>
  <rect x="30" y="132" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、发酵食品矩阵：原料 · 主导微生物 · 核心反应</text>
  <rect x="60" y="182" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="209.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">食品</text>
  <rect x="200" y="182" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="209.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">原料</text>
  <rect x="350" y="182" width="330" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="209.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">主导微生物</text>
  <rect x="680" y="182" width="660" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1010" y="209.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">核心反应与关键数字</text>
  <rect x="60" y="226" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="248.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">酸奶</text>
  <rect x="200" y="226" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="248.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">牛乳</text>
  <rect x="350" y="226" width="330" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="248.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">保加利亚乳杆菌 + 嗜热链球菌</text>
  <rect x="680" y="226" width="660" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1010" y="248.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">约 42 ℃ 交叉喂养共生；终点 pH 4.4–4.6 凝乳；后酸化靠冷链与菌种控制</text>
  <rect x="60" y="260" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="260" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="282.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">干酪</text>
  <rect x="200" y="260" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="282.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">牛乳</text>
  <rect x="350" y="260" width="330" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="282.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">凝乳酶 + 成熟期霉菌与酶系</text>
  <rect x="680" y="260" width="660" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1010" y="282.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">凝乳酶专一切割 κ-酪蛋白成凝乳；成熟期酶系接力水解转化风味</text>
  <rect x="60" y="294" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="316.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">酱油</text>
  <rect x="200" y="294" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="316.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">大豆 · 小麦</text>
  <rect x="350" y="294" width="330" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="316.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">米曲霉 + 耐盐乳酸菌 · 酵母</text>
  <rect x="680" y="294" width="660" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1010" y="316.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">制曲产酶；拌入约 18% 盐水成酱醪，高盐后熟中蛋白酶切鲜味、酵母酯化</text>
  <rect x="60" y="328" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="328" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="350.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">泡菜</text>
  <rect x="200" y="328" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="350.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">蔬菜</text>
  <rect x="350" y="328" width="330" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="350.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">自然菌群（异型发酵 → 同型乳酸菌）</text>
  <rect x="680" y="328" width="660" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1010" y="350.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">菌群演替降 pH 实现生物保藏；亚硝酸盐先升后降单峰</text>
  <rect x="60" y="362" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="384.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">啤酒</text>
  <rect x="200" y="362" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="384.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">麦芽汁</text>
  <rect x="350" y="362" width="330" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="384.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">巴氏酵母（拉格）/ 酿酒酵母（艾尔）</text>
  <rect x="680" y="362" width="660" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1010" y="384.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">底层 8–13 ℃ 与上层 15–25 ℃ 两型；成品酒精度多在 3%–5%（v/v）</text>
  <rect x="60" y="396" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="396" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="418.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">浓香型白酒</text>
  <rect x="200" y="396" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="275" y="418.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">高粱等</text>
  <rect x="350" y="396" width="330" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="515" y="418.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">大曲-窖泥混合菌群</text>
  <rect x="680" y="396" width="660" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1010" y="418.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">主体香为己酸乙酯</text>
  <text x="60" y="172" font-size="11" fill="#1e293b" font-weight="700">统一逻辑：以有益菌代谢实现生物保藏（乳酸菌降 pH 抑杂菌）与风味制造（酶解与次级代谢）——一坛发酵食品就是一场可控的微生物生态演替。</text>
  <rect x="30" y="444" width="660" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="466.84" font-size="19" fill="#475569" font-weight="700">二、泡菜的自然菌群演替与亚硝酸盐单峰曲线</text>
  <rect x="100" y="470" width="314" height="160" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="100" y1="590" x2="414" y2="590" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="178.5" y1="630" x2="178.5" y2="470" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="100" y1="550" x2="414" y2="550" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="257" y1="630" x2="257" y2="470" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="100" y1="510" x2="414" y2="510" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="335.5" y1="630" x2="335.5" y2="470" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="156.51999999999998" y1="630" x2="156.51999999999998" y2="636" stroke="#475569" stroke-width="1.8"/>
  <text x="156.51999999999998" y="652" font-size="13" fill="#64748b" text-anchor="middle">前段</text>
  <line x1="272.70000000000005" y1="630" x2="272.70000000000005" y2="636" stroke="#475569" stroke-width="1.8"/>
  <text x="272.70000000000005" y="652" font-size="13" fill="#64748b" text-anchor="middle">充分发酵</text>
  <line x1="388.88" y1="630" x2="388.88" y2="636" stroke="#475569" stroke-width="1.8"/>
  <text x="388.88" y="652" font-size="13" fill="#64748b" text-anchor="middle">后段</text>
  <line x1="94" y1="622" x2="100" y2="622" stroke="#475569" stroke-width="1.8"/>
  <text x="90" y="626" font-size="13" fill="#64748b" text-anchor="end">低</text>
  <line x1="94" y1="478" x2="100" y2="478" stroke="#475569" stroke-width="1.8"/>
  <text x="90" y="482" font-size="13" fill="#64748b" text-anchor="end">高</text>
  <text x="257" y="674" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">发酵时间</text>
  <text x="54" y="550" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">含量 / 菌数</text>
  <path d="M106.3,626.8 L156.5,558.0 L194.2,494.0 L241.3,550.0 L294.7,606.0 L351.2,622.0 L414.0,625.2" fill="none" stroke="#dc2626" stroke-width="3"/>
  <path d="M194.2,626.8 L241.3,606.0 L288.4,566.0 L335.5,510.0 L382.6,486.0 L414.0,482.8" fill="none" stroke="#0f766e" stroke-width="2.6"/>
  <path d="M106.3,626.8 L147.1,566.0 L194.2,542.0 L241.3,582.0 L288.4,614.0 L335.5,623.6 L414.0,626.8" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 4"/>
  <rect x="100" y="479.8" width="11" height="8.4" rx="3" fill="#dc2626" stroke="#cbd5e1" stroke-width="1"/>
  <text x="119" y="487.6" font-size="10" fill="#475569">亚硝酸盐</text>
  <rect x="169" y="479.8" width="11" height="8.4" rx="3" fill="#d97706" stroke="#cbd5e1" stroke-width="1"/>
  <text x="188" y="487.6" font-size="10" fill="#475569">异型发酵菌（先行）</text>
  <rect x="288" y="479.8" width="11" height="8.4" rx="3" fill="#0f766e" stroke="#cbd5e1" stroke-width="1"/>
  <text x="307" y="487.6" font-size="10" fill="#475569">同型乳酸菌（收尾）</text>
  <text x="70" y="690" font-size="10.5" fill="#dc2626" font-weight="700">安全食用期在充分发酵之后——亚硝酸盐峰已过、酸度足够。</text>
  <rect x="710" y="444" width="660" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="466.84" font-size="19" fill="#475569" font-weight="700">三、栅栏技术：多重温和因子复合累加实现食品保藏</text>
  <rect x="780" y="490" width="14" height="120" rx="3" fill="#0369a1"/>
  <text x="787" y="630" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">冷藏</text>
  <rect x="880" y="490" width="14" height="120" rx="3" fill="#0369a1"/>
  <text x="887" y="630" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">低 pH</text>
  <rect x="980" y="490" width="14" height="120" rx="3" fill="#0369a1"/>
  <text x="987" y="630" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">低 aw</text>
  <rect x="1080" y="490" width="14" height="120" rx="3" fill="#0369a1"/>
  <text x="1087" y="630" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">防腐剂</text>
  <rect x="1180" y="490" width="14" height="120" rx="3" fill="#0369a1"/>
  <text x="1187" y="630" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">包装</text>
  <polyline points="730,500 770,496 790,516 870,512 890,540 970,536 990,568 1070,564 1090,592 1170,588 1190,612 1280,610" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <text x="740" y="486" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">菌数</text>
  <text x="1290" y="626" font-size="9.5" fill="#64748b" text-anchor="middle">死亡线</text>
  <line x1="730" y1="618" x2="1300" y2="618" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="730" y="664" font-size="10.5" fill="#475569">单一因子需足够剧烈（伤品质）；多重温和栅栏复合累加即可把微生物逐级逼向死亡线——保藏与品质兼得。</text>
  <rect x="30" y="726" width="1340" height="254" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="748.84" font-size="19" fill="#475569" font-weight="700">四、益生菌的硬指标与单细胞蛋白的机遇制约</text>
  <rect x="50" y="762" width="620" height="118" rx="9" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="786" font-size="13" fill="#059669" font-weight="700">益生菌</text>
  <text x="70" y="810" font-size="11" fill="#475569">保质期活菌数为硬指标——「活」到入口才算数；菌株水平的功能验证与安全性评价缺一不可。</text>
  <text x="70" y="856" font-size="10.5" fill="#64748b">与酸奶的后酸化控制共用一套菌种工程逻辑。</text>
  <rect x="690" y="762" width="650" height="118" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.5"/>
  <text x="710" y="786" font-size="13" fill="#134e4a" font-weight="700">单细胞蛋白（SCP）</text>
  <text x="710" y="810" font-size="11" fill="#475569">酵母干菌体含蛋白约 50%、螺旋藻可达 60% 以上——生长快、不占耕地、可利用工农业废料。</text>
  <text x="710" y="856" font-size="10.5" fill="#dc2626">制约：核酸含量高，人类膳食须把 RNA 降至 2% 以下以减轻嘌呤代谢负担，加之相对成本。</text>
  <text x="50" y="916" font-size="11.5" fill="#1e293b" font-weight="700">发酵食品是「驯化的微生物生态」：酸奶的共生对、酱油的制曲-后熟接力、泡菜的演替——每一种食品都是一套被人类指挥的微生物军团。</text>
  <text x="50" y="948" font-size="10.5" fill="#64748b">啤酒两型发酵：拉格（巴氏酵母 8–13 ℃ 底层）与艾尔（酿酒酵母 15–25 ℃ 上层絮凝）——温度与菌种决定风味性格。</text>
</svg>