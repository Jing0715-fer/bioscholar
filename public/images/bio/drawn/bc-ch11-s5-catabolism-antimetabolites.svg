<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">嘌呤止于尿酸，嘧啶开环水溶：分解命运与抗代谢物</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">嘌呤分解止于尿酸（缺尿酸酶）→ 溶解度低致痛风，别嘌呤醇自杀抑制黄嘌呤氧化酶；嘧啶开环水溶（β-丙氨酸）；抗代谢物：磺胺·MTX·6-MP·5-FU·Ara-C</text>
  <rect x="30" y="132" width="700" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、嘌呤分解：终产物尿酸与痛风</text>
  <text x="56" y="180" font-size="10" fill="#64748b">核苷酸 →（核苷酸酶）→ 核苷 →（核苷磷酸化酶）→ 碱基：</text>
  <rect x="56" y="196" width="100" height="38" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="106" y="220" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">AMP</text>
  <line x1="156" y1="215" x2="190" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="192" y="196" width="100" height="38" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="242" y="220" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">腺嘌呤</text>
  <line x1="292" y1="215" x2="326" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="309" y="190" font-size="9" fill="#64748b" text-anchor="middle">脱氨</text>
  <rect x="328" y="196" width="100" height="38" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="378" y="220" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">次黄嘌呤</text>
  <line x1="428" y1="215" x2="462" y2="215" stroke="#be185d" stroke-width="2.4" marker-end="url(#arr-enz)"/>
  <rect x="464" y="196" width="84" height="38" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="506" y="220" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">黄嘌呤</text>
  <line x1="548" y1="215" x2="582" y2="215" stroke="#be185d" stroke-width="2.4" marker-end="url(#arr-enz)"/>
  <rect x="584" y="196" width="106" height="38" rx="7" fill="#fee2e2" fill-opacity="0.65" stroke="#dc2626" stroke-width="1.8"/>
  <text x="637" y="220" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">尿酸</text>
  <rect x="411.645" y="259.925" width="68.71000000000001" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="446" y="271.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">黄嘌呤氧化酶</text>
  <rect x="531.645" y="259.925" width="68.71000000000001" height="16.15" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="566" y="271.42" font-size="9.5" fill="#831843" text-anchor="middle" font-weight="700">黄嘌呤氧化酶</text>
  <line x1="490" y1="308" x2="456" y2="284" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 4"/>
  <line x1="522" y1="308" x2="556" y2="284" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="506" y="300" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">自杀底物式抑制</text>
  <rect x="478.37" y="315.075" width="55.26" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="506" y="327.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">别嘌呤醇</text>
  <text x="430" y="350" font-size="9" fill="#475569">被黄嘌呤氧化酶氧化为别黄嘌呤后与酶紧密结合；</text>
  <text x="430" y="363" font-size="9" fill="#475569">黄嘌呤 / 次黄嘌呤水溶性高，可经肾排出。</text>
  <text x="56" y="300" font-size="10.5" fill="#1e293b">尿酸（2,6,8-三氧嘌呤）：人类嘌呤分解的终产物——缺尿酸酶，不再分解；</text>
  <text x="56" y="315" font-size="10.5" fill="#1e293b">本身是血浆重要抗氧化剂（进化的权衡）。</text>
  <rect x="56" y="396" width="634" height="84" rx="9" fill="#fee2e2" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.6"/>
  <text x="72" y="420" font-size="12" fill="#dc2626" font-weight="700">尿酸溶解度低（钠盐近饱和，pH 降低时更差）→ 尿酸盐结晶沉积 → 痛风</text>
  <text x="72" y="444" font-size="10.5" fill="#475569">第一跖趾关节最常累：中性粒细胞吞噬结晶引发炎症风暴 → 急性关节炎 · 痛风石 · 肾病与尿路结石。</text>
  <text x="56" y="500" font-size="9.5" fill="#64748b">诱因：高嘌呤饮食 · 酒精（ATP 降解加速）· 果糖（AMP 脱氨增加）· Lesch-Nyhan · 肿瘤溶解综合征</text>
  <text x="56" y="522" font-size="9.5" fill="#475569">治疗：别嘌呤醇 / 非布司他（抑制生成）· 丙磺舒 / 苯溴马隆（促排）· 急性期 NSAIDs / 秋水仙碱（抑制中性粒细胞微管）。</text>
  <rect x="750" y="132" width="620" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="154.84" font-size="19" fill="#475569" font-weight="700">二、嘧啶分解：环被完全打开，产物水溶</text>
  <rect x="770" y="200" width="150" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="845" y="217" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">胞嘧啶 / 尿嘧啶</text>
  <text x="845" y="234" font-size="9" fill="#64748b" text-anchor="middle">（C · U）</text>
  <line x1="920" y1="221" x2="966" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="944" y="206" font-size="9.5" fill="#64748b" text-anchor="middle">开环</text>
  <rect x="970" y="200" width="120" height="42" rx="7" fill="#d1fae5" fill-opacity="0.6" stroke="#059669" stroke-width="1.6"/>
  <text x="1030" y="226" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">β-丙氨酸</text>
  <text x="1104" y="226" font-size="11" fill="#475569">+ CO₂ + NH₃</text>
  <rect x="770" y="268" width="150" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="845" y="285" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">T（胸腺嘧啶）</text>
  <text x="845" y="302" font-size="9" fill="#64748b" text-anchor="middle">（T）</text>
  <line x1="920" y1="289" x2="966" y2="289" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <text x="944" y="274" font-size="9.5" fill="#64748b" text-anchor="middle">开环</text>
  <rect x="970" y="268" width="120" height="42" rx="7" fill="#d1fae5" fill-opacity="0.6" stroke="#059669" stroke-width="1.6"/>
  <text x="1030" y="294" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">β-氨基异丁酸</text>
  <text x="1104" y="294" font-size="11" fill="#475569">+ CO₂ + NH₃</text>
  <text x="766" y="344" font-size="10.5" fill="#475569">嘧啶环被完全打开：C / U → β-丙氨酸，T → β-氨基异丁酸（均伴 CO₂ 与 NH₃）——产物水溶性好，经尿排出或进一步代谢；</text>
  <text x="766" y="359" font-size="10.5" fill="#475569">放化疗后 DNA 大量降解，尿中 β-氨基异丁酸增多。</text>
  <rect x="770" y="400" width="280" height="96" rx="9" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.6"/>
  <text x="786" y="426" font-size="12.5" fill="#dc2626" font-weight="700">嘌呤：环保留</text>
  <text x="786" y="450" font-size="10.5" fill="#475569">终产物尿酸溶解度低 → 结晶沉积 → 痛风</text>
  <rect x="1064" y="400" width="280" height="96" rx="9" fill="#d1fae5" fill-opacity="0.45" stroke="#059669" stroke-width="1.6"/>
  <text x="1080" y="426" font-size="12.5" fill="#065f46" font-weight="700">嘧啶：环打开</text>
  <text x="1080" y="450" font-size="10.5" fill="#475569">β-氨基酸水溶性好 → 不形成结晶</text>
  <text x="766" y="530" font-size="11" fill="#1e293b" font-weight="700">嘌呤分解「止步于尿酸」正是痛风的生化根源；嘧啶分解彻底，无结晶之虞。</text>
  <rect x="30" y="566" width="1340" height="414" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="588.84" font-size="19" fill="#475569" font-weight="700">三、抗代谢物：结构类似物「以假乱真」（竞争性抑制或掺入）</text>
  <rect x="60" y="620" width="200" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="647.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">抗代谢物</text>
  <rect x="260" y="620" width="200" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="647.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">类似物</text>
  <rect x="460" y="620" width="560" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="647.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">靶点 / 机制</text>
  <rect x="1020" y="620" width="320" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1180" y="647.5" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">临床应用</text>
  <rect x="60" y="664" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="690.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">磺胺</text>
  <rect x="260" y="664" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="690.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">对氨基苯甲酸（PABA）</text>
  <rect x="460" y="664" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="690.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">竞争性抑制细菌二氢叶酸合成酶</text>
  <rect x="1020" y="664" width="320" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1180" y="690.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">抗菌（选择性毒性）</text>
  <rect x="60" y="706" width="1280" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="706" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="732.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">氨甲蝶呤（MTX）</text>
  <rect x="260" y="706" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="732.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">叶酸</text>
  <rect x="460" y="706" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="732.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">抑制二氢叶酸还原酶 → dTMP 生成 ↓</text>
  <rect x="1020" y="706" width="320" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1180" y="732.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">抗肿瘤 · 免疫抑制</text>
  <rect x="60" y="748" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="774.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">6-巯基嘌呤（6-MP）</text>
  <rect x="260" y="748" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="774.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">次黄嘌呤</text>
  <rect x="460" y="748" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="774.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">阻断 IMP 从头合成与 AMP / GMP 相互转变</text>
  <rect x="1020" y="748" width="320" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1180" y="774.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">白血病</text>
  <rect x="60" y="790" width="1280" height="42" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="790" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="816.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">5-氟尿嘧啶（5-FU）</text>
  <rect x="260" y="790" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="816.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">尿嘧啶</text>
  <rect x="460" y="790" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="816.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">转变为 FdUMP → 抑制胸苷酸合酶</text>
  <rect x="1020" y="790" width="320" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1180" y="816.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">消化道肿瘤</text>
  <rect x="60" y="832" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="160" y="858.5" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">阿糖胞苷（Ara-C）</text>
  <rect x="260" y="832" width="200" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="858.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">胞苷</text>
  <rect x="460" y="832" width="560" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="740" y="858.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">掺入 DNA · 抑制 DNA 聚合酶</text>
  <rect x="1020" y="832" width="320" height="42" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1180" y="858.5" font-size="13" fill="#475569" text-anchor="middle" font-weight="500">白血病</text>
  <rect x="60" y="890" width="1280" height="74" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.6"/>
  <text x="76" y="914" font-size="12" fill="#075985" font-weight="700">选择性毒性的教科书对照：磺胺 vs MTX</text>
  <text x="76" y="936" font-size="10.5" fill="#475569">细菌需自 PABA 合成叶酸，人类直接从膳食获取叶酸 → 磺胺抑菌不伤人；MTX 抑制人二氢叶酸还原酶，杀伤快速增殖细胞——骨髓与肿瘤同样敏感，故大剂量化疗后以亚叶酸钙「救援」（叶酸 rescue）。</text>
</svg>