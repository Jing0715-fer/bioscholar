  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">脊髓反射与运动单位：牵张反射的完整回路</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">肌梭Ia/II感受长度与变化率、经单突触兴奋同肌α运动神经元；募集按I→IIa→IIx大小原则；膝跳反射潜伏期约20–25ms；腱器官Ib经中间神经元反向保护</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、运动单位与大小原则募集</text>
  <text x="50" y="176" font-size="10.5" fill="#475569">一个 α 运动神经元 + 其支配的全部肌纤维 = 运动单位；单位大小差异巨大（眼外肌 &lt;10 根纤维 vs 股四头肌上千根）</text>
  <ellipse cx="120" cy="255" rx="55" ry="52" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="240" r="13" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="120" y="244" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">α</text>
  <rect x="148" y="234" width="14" height="12" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="169" y="234" width="14" height="12" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="190" y="234" width="14" height="12" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="211" y="234" width="14" height="12" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="232" y="234" width="14" height="12" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2"/>
  <line x1="133" y1="240" x2="148" y2="240" stroke="#6d28d9" stroke-width="2.4"/>
  <line x1="246" y1="240" x2="260" y2="240" stroke="#6d28d9" stroke-width="2.4"/>
  <polyline points="260,240 290,216 300,216" fill="none" stroke="#6d28d9" stroke-width="1.8"/>
  <polyline points="260,240 290,240 300,240" fill="none" stroke="#6d28d9" stroke-width="1.8"/>
  <polyline points="260,240 290,304 300,304" fill="none" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="120" y="330" font-size="10.5" fill="#475569" text-anchor="middle">脊髓 α 运动神经元</text>
  <rect x="300" y="210" width="320" height="12" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="300" y="232" width="320" height="12" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="300" y="254" width="320" height="12" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="300" y="276" width="320" height="12" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="300" y="298" width="320" height="12" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="460" y="330" font-size="10.5" fill="#475569" text-anchor="middle">同一运动单位的肌纤维散在分布（不连片）</text>
  <text x="50" y="410" font-size="10.5" fill="#1e293b" font-weight="700">募集顺序（Henneman 大小原则）：按 I → IIa → IIx 依次募集，阈值与胞体大小成正比</text>
  <line x1="50" y1="542" x2="590" y2="542" stroke="#475569" stroke-width="1.6"/>
  <rect x="60" y="500" width="150" height="40" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="135" y="524" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">I 慢氧化（SO）</text>
  <rect x="240" y="476" width="150" height="64" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="315" y="512" font-size="10.5" fill="#92400e" text-anchor="middle" font-weight="700">IIa 快氧化酵解</text>
  <rect x="420" y="452" width="150" height="88" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="495" y="500" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">IIx 快酵解</text>
  <text x="135" y="484" font-size="10" fill="#475569" text-anchor="middle">阈值低 · 力量小 · 抗疲劳</text>
  <text x="315" y="462" font-size="10" fill="#475569" text-anchor="middle">中等阈值 · 中等力量</text>
  <text x="495" y="438" font-size="10" fill="#475569" text-anchor="middle">阈值高 · 力量大 · 易疲劳</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、肌梭结构与牵张反射弧（单突触）</text>
  <rect x="740" y="190" width="600" height="10" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="746" y="184" font-size="10.5" fill="#92400e">梭外肌纤维（α 支配）</text>
  <rect x="740" y="286" width="600" height="10" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="746" y="310" font-size="10.5" fill="#92400e">梭外肌纤维</text>
  <rect x="900" y="222" width="360" height="56" rx="28" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="910" y1="240" x2="1250" y2="240" stroke="#0f766e" stroke-width="4"/>
  <ellipse cx="1080" cy="240" rx="26" ry="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
