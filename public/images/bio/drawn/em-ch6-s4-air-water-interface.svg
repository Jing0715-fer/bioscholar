  <rect x="60" y="244" width="790" height="128" fill="#e0f2fe" fill-opacity="0.35"/>
  <text x="70" y="268" font-size="10" fill="#075985">水膜（plunge 暴露窗口约 100 ms 至 1 s）</text>
  <circle cx="260" cy="262" r="15" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <line x1="272" y1="268" x2="282" y2="272" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="3 2"/>
  <ellipse cx="294" cy="276" rx="12" ry="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="260" y="302" font-size="9.5" fill="#4c1d95" text-anchor="middle">部分展开</text>
  <circle cx="540" cy="262" r="15" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <line x1="552" y1="268" x2="562" y2="272" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="3 2"/>
  <ellipse cx="574" cy="276" rx="12" ry="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="540" y="302" font-size="9.5" fill="#4c1d95" text-anchor="middle">优势取向贴附</text>
  <circle cx="430" cy="330" r="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="430" y="358" font-size="9.5" fill="#475569" text-anchor="middle">原生折叠（少数）</text>
  <rect x="760" y="252" width="26" height="92" fill="#dc2626" fill-opacity="0.7"/>
  <rect x="760" y="346" width="26" height="12" fill="#059669" fill-opacity="0.7"/>
  <text x="794" y="302" font-size="10" fill="#991b1b" font-weight="700">贴界面 &gt;90%</text>
  <text x="794" y="356" font-size="9.5" fill="#065f46">悬冰不足一成</text>
  <rect x="136.88625" y="383.075" width="326.2275" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="395.78" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">吸附自由能可达数十 kT——为支付入场费，颗粒让结构域局部展开</text>
  <text x="60" y="420" font-size="9.5" fill="#475569">布朗运动与流场把颗粒不断送往界面，吸附在暴露窗口内完成；冷冻断层普查（数颗粒纵向坐标）确认贴附率超过 90%——界面是冷冻制样的主导现实。</text>
  <rect x="910" y="132" width="460" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="926" y="154.84" font-size="19" fill="#475569" font-weight="700">二、界面吸附的三宗罪</text>
  <rect x="930" y="178" width="420" height="76" rx="8" fill="#fee2e2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.6"/>
  <text x="946" y="200" font-size="12" fill="#991b1b" font-weight="700">① 优势取向</text>
  <text x="946" y="220" font-size="10" fill="#475569">颗粒以同一面贴界面：2D 分类只剩单一视角；3D 重构出现缺失锥式角度空洞，</text>
  <text x="946" y="233" font-size="10" fill="#475569">密度图沿缺失方向拉长伪影。</text>
  <rect x="930" y="262" width="420" height="76" rx="8" fill="#ede9fe" fill-opacity="0.55" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="946" y="284" font-size="12" fill="#4c1d95" font-weight="700">② 部分变性</text>
  <text x="946" y="304" font-size="10" fill="#475569">展开的结构域与聚集体混入数据集，占据颗粒挑选的算力却不贡献信号，</text>
  <text x="946" y="317" font-size="10" fill="#475569">2D 平均被「糊」掉一截。</text>
  <rect x="930" y="346" width="420" height="76" rx="8" fill="#fef3c7" fill-opacity="0.55" stroke="#d97706" stroke-width="1.6"/>
  <text x="946" y="368" font-size="12" fill="#92400e" font-weight="700">③ 选择性存活</text>
  <text x="946" y="388" font-size="10" fill="#475569">构象分布被界面筛过：贴不牢的构象被冲走、</text>
  <text x="946" y="401" font-size="10" fill="#475569">留不住的中间态优先消失——留下的样本不代表溶液平衡态。</text>
  <rect x="30" y="456" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="478.84" font-size="19" fill="#475569" font-weight="700">三、对策四件套：把蛋白与界面隔开</text>
  <rect x="60" y="512" width="310" height="150" rx="9" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.8"/>
  <text x="215" y="538" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">① 氟化表面活性剂</text>
  <text x="215" y="564" font-size="10.5" fill="#475569" text-anchor="middle">痕量约 0.01–0.1 mM 在界面成膜</text>
  <text x="215" y="585" font-size="10.5" fill="#475569" text-anchor="middle">氟碳链与疏水口袋无互补性——惰性</text>
  <text x="215" y="606" font-size="10.5" fill="#475569" text-anchor="middle">太低不成膜、太高增背景：逐样品滴定</text>
  <text x="215" y="627" font-size="10.5" fill="#475569" text-anchor="middle">D’Imprima 与 Kühlbrandt（2020 前后）</text>
  <rect x="385" y="512" width="310" height="150" rx="9" fill="#fef3c7" fill-opacity="0.6" stroke="#b45309" stroke-width="1.8"/>
  <text x="540" y="538" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">② 金箔网格 UltrAuFoil</text>
  <text x="540" y="564" font-size="10.5" fill="#475569" text-anchor="middle">金-水界面吸附弱于碳-水界面</text>
  <text x="540" y="585" font-size="10.5" fill="#475569" text-anchor="middle">叠加束致运动小的红利（第 2 节）</text>
  <text x="540" y="606" font-size="10.5" fill="#475569" text-anchor="middle">高分辨与界面敏感样品的首选底物</text>
  <text x="540" y="627" font-size="10.5" fill="#475569" text-anchor="middle">代价：价格较高</text>
  <rect x="710" y="512" width="310" height="150" rx="9" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.8"/>
  <text x="865" y="538" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">③ 高浓度与快速 plunge</text>
  <text x="865" y="564" font-size="10.5" fill="#475569" text-anchor="middle">浓度推高、暴露窗口压短</text>
  <text x="865" y="585" font-size="10.5" fill="#475569" text-anchor="middle">大部分颗粒「来不及」贴附就被冻住</text>
  <text x="865" y="606" font-size="10.5" fill="#475569" text-anchor="middle">与亚毫秒制样装置联动（第 3 节）</text>
  <text x="865" y="627" font-size="10.5" fill="#475569" text-anchor="middle">代价：聚集风险</text>
  <rect x="1035" y="512" width="310" height="150" rx="9" fill="#ede9fe" fill-opacity="0.6" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1190" y="538" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">④ 亲和网格</text>
  <text x="1190" y="564" font-size="10.5" fill="#475569" text-anchor="middle">Ni-NTA 抓 His 标签、链霉亲和素抓生物素</text>
  <text x="1190" y="585" font-size="10.5" fill="#475569" text-anchor="middle">颗粒锚定在膜上、主动脱离界面</text>
  <text x="1190" y="606" font-size="10.5" fill="#475569" text-anchor="middle">顺带获得可控取向</text>
  <text x="1190" y="627" font-size="10.5" fill="#475569" text-anchor="middle">代价：标签效率、构象偏置与批次标定</text>
  <line x1="372" y1="587" x2="383" y2="587" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="697" y1="587" x2="708" y2="587" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <line x1="1022" y1="587" x2="1033" y2="587" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-ink)"/>
  <text x="60" y="690" font-size="10.5" fill="#475569">成膜效率：痕量 0.01–0.05 mM 通常足以铺满界面；普通氢化去垢剂要高出几个数量级的浓度才有类似覆盖度——氟化是关键，且与常规去垢剂共存无碍。</text>
  <text x="60" y="716" font-size="10.5" fill="#64748b">采集端补救：样品台预倾角 20–40 度拍摄可把视角分布整体挪动、部分填补缺失锥，代价是分辨率各向异性与机械稳定性压力——制样与采集对策常需联用。</text>
  <rect x="30" y="766" width="1340" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="788.84" font-size="19" fill="#475569" font-weight="700">四、诊断流程与辩证：先量化、再动刀</text>
  <rect x="50" y="800" width="165" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="132.5" y="827.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">诊断步骤</text>
  <rect x="215" y="800" width="175" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="302.5" y="827.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">观察对象</text>
  <rect x="390" y="800" width="300" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="827.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">阳性判据</text>
  <rect x="50" y="844" width="165" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="132.5" y="864.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">2D 分类视角统计</text>
  <rect x="215" y="844" width="175" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="302.5" y="864.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">类别平均图</text>
  <rect x="390" y="844" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="864.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">视角单一、只剩旋转差异</text>
  <rect x="50" y="874" width="640" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="874" width="165" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="132.5" y="894.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">颗粒贴附统计</text>
  <rect x="215" y="874" width="175" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="302.5" y="894.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">断层或低倍纵览</text>
  <rect x="390" y="874" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="894.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">贴界面比例过高（确诊界面主导）</text>
  <rect x="50" y="904" width="165" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="132.5" y="924.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">3D 角度覆盖图</text>
  <rect x="215" y="904" width="175" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="302.5" y="924.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">欧拉角分布</text>
  <rect x="390" y="904" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="924.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">角度空洞、缺失锥</text>
  <rect x="50" y="934" width="640" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="50" y="934" width="165" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="132.5" y="954.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">对策迭代</text>
  <rect x="215" y="934" width="175" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="302.5" y="954.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">换膜型或加氟化剂</text>
  <rect x="390" y="934" width="300" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="540" y="954.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">覆盖是否改善（定稿制样方案）</text>
  <rect x="720" y="796" width="630" height="170" rx="8" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.6"/>
  <text x="736" y="820" font-size="12.5" fill="#065f46" font-weight="700">辩证一课：界面也可反用</text>
  <text x="736" y="844" font-size="10" fill="#475569">烟草花叶病毒与微管平躺于连续碳膜，统一贡献侧视角——螺旋重构算法恰把一致的侧视展开成三维，</text>
  <text x="736" y="858" font-size="10" fill="#475569">膜吸附的偏置反而成了采集设计的一部分；二十面体蛋白若只贡献五重轴顶视，算法无能为力。</text>
  <text x="736" y="882" font-size="10" fill="#475569">「与界面作战」还是「与界面共舞」，取决于样品的界面耐受度与取向需求——小分子量或柔性样品故意贴附，反而拿到互补视角。</text>
  <rect x="883.85" y="913.5" width="232.3" height="17" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1000" y="925.6" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">每一步都有判据与数字，对策效果可被量化复核</text>
</svg>