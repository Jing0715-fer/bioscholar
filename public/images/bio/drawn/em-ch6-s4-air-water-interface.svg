  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">空气-水界面问题与对策：冷冻制样的达摩克利斯之剑</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">暴露窗口约 100 ms 至 1 s、多数数据集超过 90% 颗粒贴附界面（吸附自由能数十 kT）；对策：氟化去垢剂约 0.01–0.1 mM、金箔、快速 plunge、亲和网格</text>
  <rect x="30" y="132" width="860" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、空气-水界面：吸附与部分变性</text>
  <text x="70" y="210" font-size="11" fill="#64748b">空气</text>
  <text x="70" y="230" font-size="10" fill="#075985">表面张力约 72 mN/m（20 °C 纯水）</text>
  <text x="845" y="230" font-size="9.5" fill="#075985" text-anchor="end">取向水层约 1–2 nm</text>
  <line x1="60" y1="244" x2="850" y2="244" stroke="#0369a1" stroke-width="3"/>
