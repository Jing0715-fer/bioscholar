<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">自主神经系统的结构与递质：镜像对偶、胆碱能例外与第二脑</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">节前一律 ACh；交感节后多 NE（汗腺为 M3 例外）；肠神经系统约一亿神经元独立运转</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、交感与副交感：结构布局的镜像对偶</text>
  <text x="360" y="200" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">中枢内脏神经元 → 节前神经元 → 节后神经元（三级链条）</text>
  <text x="60" y="258" font-size="14" fill="#dc2626" font-weight="700">交感</text>
  <rect x="110" y="240" width="150" height="36" rx="7" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.6"/>
  <text x="185" y="262" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">胸腰段 T1–L2</text>
  <line x1="260" y1="258" x2="330" y2="258" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="330" y="240" width="170" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="415" y="262" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">神经节近中枢（椎旁链）</text>
  <line x1="500" y1="258" x2="560" y2="258" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <text x="610" y="262" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">节后长</text>
  <text x="60" y="330" font-size="14" fill="#134e4a" font-weight="700">副交感</text>
  <rect x="110" y="312" width="150" height="36" rx="7" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="185" y="334" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="700">颅骶段（Ⅲ Ⅶ Ⅸ Ⅹ + S2–S4）</text>
  <line x1="260" y1="330" x2="330" y2="330" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <rect x="330" y="312" width="170" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="415" y="334" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">神经节近效应器</text>
  <line x1="500" y1="330" x2="560" y2="330" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <text x="610" y="334" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">节后短</text>
  <rect x="110" y="386" width="560" height="44" rx="8" fill="#ede9fe" fill-opacity="0.35" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="390" y="412" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="600">效应器：心肌 · 平滑肌 · 外分泌腺（多数器官双重支配、相互拮抗）</text>
  <line x1="185" y1="276" x2="185" y2="386" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arr-ink)"/>
  <line x1="185" y1="348" x2="185" y2="386" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arr-ink)"/>
  <text x="60" y="466" font-size="11" fill="#475569">「 Fight or Flight 」与「Rest and Digest」：交感把血液送往肌肉、扩大瞳孔；副交感保存能量、</text>
  <text x="60" y="482" font-size="11" fill="#475569">促进消化——两者是同一稳态的两个砝码。</text>
  <text x="60" y="522" font-size="11" fill="#64748b" font-weight="700">节前一律 ACh；交感节后多 NE；汗腺为胆碱能例外。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、递质链条与受体：从节前纤维到效应器</text>
  <rect x="740" y="200" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="825" y="227.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">环节</text>
  <rect x="910" y="200" width="100" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="227.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">递质</text>
  <rect x="1010" y="200" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="227.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">主要受体</text>
  <rect x="1140" y="200" width="200" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="227.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">要点</text>
  <rect x="740" y="244" width="170" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="825" y="275.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">节前纤维（两系皆是）</text>
  <rect x="910" y="244" width="100" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="275.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">乙酰胆碱</text>
  <rect x="1010" y="244" width="130" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="275.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">烟碱型 N 受体</text>
  <rect x="1140" y="244" width="200" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="275.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">神经节突触传递，六烃季铵可阻断</text>
  <rect x="740" y="296" width="600" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="296" width="170" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="825" y="327.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">交感节后纤维</text>
  <rect x="910" y="296" width="100" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="327.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">去甲肾上腺素</text>
  <rect x="1010" y="296" width="130" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="327.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">α 与 β 受体</text>
  <rect x="1140" y="296" width="200" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="327.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">血管、心脏、瞳孔开大肌等多数靶</text>
  <rect x="740" y="348" width="170" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="825" y="379.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">交感节后至汗腺</text>
  <rect x="910" y="348" width="100" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="379.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">乙酰胆碱</text>
  <rect x="1010" y="348" width="130" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="379.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">毒蕈碱 M3</text>
  <rect x="1140" y="348" width="200" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="379.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">经典例外，阿托品抑制发汗</text>
  <rect x="740" y="400" width="600" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="400" width="170" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="825" y="431.5" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">副交感节后纤维</text>
  <rect x="910" y="400" width="100" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="431.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">乙酰胆碱</text>
  <rect x="1010" y="400" width="130" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1075" y="431.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">毒蕈碱 M 受体</text>
  <rect x="1140" y="400" width="200" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1240" y="431.5" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="500">心脏、内脏平滑肌与外分泌腺效应</text>
  <rect x="740" y="466" width="600" height="96" rx="9" fill="#fef3c7" fill-opacity="0.45" stroke="#d97706" stroke-width="1.6"/>
  <text x="756" y="490" font-size="12.5" fill="#92400e" font-weight="700">肾上腺髓质：特化的节后「细胞」</text>
  <text x="756" y="512" font-size="11" fill="#475569">嗜铬细胞受节前胆碱能（N 受体）支配，</text>
  <text x="756" y="528" font-size="11" fill="#475569">分泌肾上腺素为主入血——把交感的秒级神经信号转译为分钟级的激素信号。</text>
  <rect x="30" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、肠神经系统：可独立运转的「第二脑」</text>
  <rect x="152.375" y="637.375" width="95.25" height="21.25" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="200" y="652.5" font-size="12.5" fill="#134e4a" text-anchor="middle" font-weight="700">约一亿神经元</text>
  <rect x="60" y="686" width="580" height="120" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="714" font-size="13" fill="#1e293b" font-weight="700">两个神经丛即可完成局部回路</text>
  <text x="80" y="740" font-size="11" fill="#475569">肠肌间神经丛（Auerbach）：驱动蠕动波；黏膜下神经丛（Meissner）：</text>
  <text x="80" y="756" font-size="11" fill="#475569">调节分泌与局部血流——离体肠段仍能蠕动。</text>
  <text x="80" y="790" font-size="11" fill="#64748b">交感（减弱蠕动与分泌）与副交感（迷走，增强）仅作调制——「中央政府只发指导文件，地方政府自办日常」。</text>
  <text x="60" y="840" font-size="11" fill="#475569">肠-脑轴：迷走传入把肠道状态持续上报中枢，肠道菌群代谢物参与情绪与行为调制——「第二脑」之说由此而来。</text>
  <rect x="710" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="600.84" font-size="19" fill="#475569" font-weight="700">四、排尿开关：骶髓反射 + 脑桥 Barrington 核</text>
  <rect x="740" y="648" width="280" height="130" rx="9" fill="#e0f2fe" fill-opacity="0.45" stroke="#0369a1" stroke-width="1.8"/>
  <text x="756" y="674" font-size="12.5" fill="#075985" font-weight="700">脑桥 Barrington 核（M 区）</text>
  <text x="756" y="698" font-size="11" fill="#475569">排尿的指挥中枢：</text>
  <text x="756" y="714" font-size="11" fill="#475569">同步驱动逼尿肌收缩 + 外括约肌松弛——两者必须同步，</text>
  <text x="756" y="730" font-size="11" fill="#475569">缺一即尿潴留或失禁。</text>
  <rect x="1050" y="648" width="290" height="130" rx="9" fill="#ccfbf1" fill-opacity="0.45" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1066" y="674" font-size="12.5" fill="#134e4a" font-weight="700">骶髓节段反射（S2–S4）</text>
  <text x="1066" y="698" font-size="11" fill="#475569">膀胱牵张感受器 → 骶髓 → 逼尿肌初级反射弧；</text>
  <text x="1066" y="714" font-size="11" fill="#475569">婴儿期由其独立运作，</text>
  <text x="1066" y="730" font-size="11" fill="#475569">随皮层控制成熟而受上位统辖。</text>
  <line x1="1020" y1="713" x2="1050" y2="713" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <text x="1035" y="696" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">下达</text>
  <rect x="740" y="806" width="600" height="96" rx="9" fill="#fee2e2" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.6"/>
  <text x="756" y="830" font-size="12.5" fill="#dc2626" font-weight="700">上位中断 → 脊髓膀胱</text>
  <text x="756" y="852" font-size="11" fill="#475569">脊髓横断后 Barrington 指令无法下达：自动性排尿反射亢进但排空不全，需间歇导尿——「开关还在，</text>
  <text x="756" y="868" font-size="11" fill="#475569">指挥线断了」。</text>
</svg>