<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">极端环境微生物：嗜热、嗜盐代表菌与适应机制</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">Taq 源自黄石 70–80 ℃ 热泉，最适延伸 72 ℃、95 ℃ 半衰期约 40 分钟成就 PCR；Methanopyrus 约 122 ℃ 纪录；盐杆菌最适 20%–30% NaCl、低于约 10% 壁解体</text>
  <rect x="30" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、嗜热菌的经典馈赠：Taq DNA 聚合酶与 PCR</text>
  <text x="360" y="176" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">从黄石热泉到诺贝尔奖</text>
  <line x1="70" y1="210" x2="650" y2="210" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="116.4" cy="210" r="6.5" fill="#0f766e"/>
  <line x1="116.4" y1="201" x2="116.4" y2="180" stroke="#0f766e" stroke-width="1.7"/>
  <text x="116.4" y="160" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1960 年代</text>
  <text x="116.4" y="140" font-size="12" fill="#64748b" text-anchor="middle">Brock 分离</text>
  <circle cx="331" cy="210" r="6.5" fill="#0369a1"/>
  <line x1="331" y1="219" x2="331" y2="240" stroke="#0369a1" stroke-width="1.7"/>
  <text x="331" y="260" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1980 年代中期</text>
  <text x="331" y="280" font-size="12" fill="#64748b" text-anchor="middle">引入 PCR</text>
  <circle cx="580.4" cy="210" r="6.5" fill="#6d28d9"/>
  <line x1="580.4" y1="201" x2="580.4" y2="180" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="580.4" y="160" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1993</text>
  <text x="580.4" y="140" font-size="12" fill="#64748b" text-anchor="middle">Mullis 获诺奖</text>
  <text x="60" y="260" font-size="10.5" fill="#475569">Thomas Brock 从黄石公园约 70–80 ℃ 热泉分离嗜热水生栖热菌（Thermus aquaticus）</text>
  <text x="60" y="275" font-size="10.5" fill="#475569">——当时教科书仍断言生命不能在如此高温存活。</text>
  <rect x="50" y="316" width="610" height="96" rx="9" fill="#e0f2fe" fill-opacity="0.4" stroke="#0369a1" stroke-width="1.5"/>
  <text x="70" y="340" font-size="13" fill="#075985" font-weight="700">Taq DNA 聚合酶</text>
  <text x="70" y="364" font-size="11" fill="#475569">最适延伸约 72 ℃、95 ℃ 下半衰期约 40 分钟——恰可耐受 PCR 每轮变性高温，使程序化自动循环成为可能。</text>
  <text x="360" y="298" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">增殖温度纪录：Methanopyrus 约 122 ℃</text>
  <rect x="710" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、嗜盐古菌：「从盐里长出来的生命」</text>
  <line x1="740" y1="250" x2="1320" y2="250" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <text x="1330" y="250" font-size="10" fill="#64748b" text-anchor="middle">NaCl</text>
  <line x1="740" y1="242" x2="740" y2="258" stroke="#1e293b" stroke-width="2"/>
  <text x="740" y="228" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">0%</text>
  <line x1="870" y1="242" x2="870" y2="258" stroke="#1e293b" stroke-width="2"/>
  <text x="870" y="272" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">3.5%</text>
  <text x="870" y="288" font-size="9.5" fill="#64748b" text-anchor="middle">海水</text>
  <line x1="1035" y1="242" x2="1035" y2="258" stroke="#1e293b" stroke-width="2"/>
  <text x="1035" y="228" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">约 10%</text>
  <text x="1035" y="214" font-size="9.5" fill="#64748b" text-anchor="middle">低于此细胞壁解体</text>
  <line x1="1290" y1="242" x2="1290" y2="258" stroke="#1e293b" stroke-width="2"/>
  <text x="1290" y="272" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">20%–30%</text>
  <text x="1290" y="288" font-size="9.5" fill="#64748b" text-anchor="middle">最适生长区</text>
  <rect x="1240" y="244" width="80" height="12" fill="#059669" fill-opacity="0.4"/>
  <rect x="740" y="244" width="295" height="12" fill="#dc2626" fill-opacity="0.25"/>
  <rect x="730" y="320" width="620" height="92" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="750" y="344" font-size="12.5" fill="#1e293b" font-weight="700">盐杆菌（Halobacterium salinarum）的胞内对策</text>
  <text x="750" y="368" font-size="11" fill="#475569">胞内以 KCl 平衡外渗压 + 酸性蛋白适应高盐；紫膜的菌视紫质光驱动质子泵直接产能（无氧光营养）。</text>
  <text x="730" y="424" font-size="10.5" fill="#64748b">生于盐湖、盐田与腌渍物——极端微生物资源服务生物技术的经典注脚。</text>
  <rect x="30" y="444" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="466.84" font-size="19" fill="#475569" font-weight="700">三、极端因子的核心挑战与分子对策（适应策略总表）</text>
  <rect x="60" y="494" width="140" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="521.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">极端因子</text>
  <rect x="200" y="494" width="250" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="521.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">核心挑战</text>
  <rect x="450" y="494" width="380" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="521.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">分子对策</text>
  <rect x="830" y="494" width="510" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="521.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">代表与资源价值</text>
  <rect x="60" y="538" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="560.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">高温</text>
  <rect x="200" y="538" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="560.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">蛋白变性、膜流动过快</text>
  <rect x="450" y="538" width="380" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="560.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">四醚单层膜、伴侣蛋白、提高蛋白刚性</text>
  <rect x="830" y="538" width="510" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="560.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">嗜热水生栖热菌（70–80 ℃ 热泉）；Methanopyrus 约 122 ℃ 增殖纪录</text>
  <rect x="60" y="572" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="572" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="594.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">低温</text>
  <rect x="200" y="572" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="594.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">膜僵化、酶活性骤降</text>
  <rect x="450" y="572" width="380" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="594.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">膜不饱和脂肪酸、冷激蛋白、柔性低温酶</text>
  <rect x="830" y="572" width="510" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="594.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">嗜冷菌；冷适应酶已成洗涤与食品工业资源</text>
  <rect x="60" y="606" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="628.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">高盐</text>
  <rect x="200" y="606" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="628.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">渗透脱水</text>
  <rect x="450" y="606" width="380" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="628.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">胞内 KCl 与酸性蛋白、菌视紫质光泵</text>
  <rect x="830" y="606" width="510" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="628.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">盐杆菌最适 20%–30% NaCl，低于约 10% 壁解体</text>
  <rect x="60" y="640" width="1280" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="640" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="662.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">强酸 / 强碱</text>
  <rect x="200" y="640" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="662.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">胞内必须近中性</text>
  <rect x="450" y="640" width="380" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="662.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">反向转运维持胞内中性（质子泵与 K⁺/H⁺ 对换）</text>
  <rect x="830" y="640" width="510" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="662.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">嗜酸菌、嗜碱菌</text>
  <rect x="60" y="674" width="140" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="130" y="696.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">高压</text>
  <rect x="200" y="674" width="250" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="325" y="696.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">蛋白与膜受压形变</text>
  <rect x="450" y="674" width="380" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="640" y="696.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">膜流动对策与柔性蛋白平衡</text>
  <rect x="830" y="674" width="510" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="696.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">深海嗜压菌</text>
  <text x="60" y="700" font-size="11.5" fill="#1e293b" font-weight="700">四大通用设计：</text>
  <text x="60" y="717.25" font-size="11.5" fill="#1e293b" font-weight="700">四醚单层膜 · 相容溶质 · 反向转运维持胞内中性 · 蛋白刚性柔性平衡。</text>
  <rect x="30" y="756" width="1340" height="224" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="778.84" font-size="19" fill="#475569" font-weight="700">四、极端环境与天体生物学：生命边界的地球参照系</text>
  <rect x="70" y="790" width="190" height="80" rx="9" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="165" y="820" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">南极干谷</text>
  <text x="165" y="844" font-size="10.5" fill="#475569" text-anchor="middle">极度干冷</text>
  <line x1="260" y1="830" x2="830" y2="830" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="330" y="790" width="190" height="80" rx="9" fill="#ccfbf1" fill-opacity="0.5" stroke="#0f766e" stroke-width="1.6"/>
  <text x="425" y="820" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">冰下湖</text>
  <text x="425" y="844" font-size="10.5" fill="#475569" text-anchor="middle">黑暗高压</text>
  <line x1="520" y1="830" x2="830" y2="830" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="590" y="790" width="190" height="80" rx="9" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.6"/>
  <text x="685" y="820" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">深海热泉</text>
  <text x="685" y="844" font-size="10.5" fill="#475569" text-anchor="middle">高温高压无光</text>
  <line x1="780" y1="830" x2="830" y2="830" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-mute)"/>
  <rect x="830" y="790" width="500" height="80" rx="10" fill="#ede9fe" fill-opacity="0.6" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1080" y="818" font-size="14" fill="#4c1d95" text-anchor="middle" font-weight="700">天体生物学</text>
  <text x="1080" y="842" font-size="11" fill="#475569" text-anchor="middle">火星与冰卫星生命探测的地球参照系</text>
  <text x="60" y="906" font-size="11" fill="#475569">极端环境标定生命的温度、盐度、酸度与能量边界——微生物一次次把这些边界推到意料之外，为地外生命「能在哪里存在」提供校准。</text>
  <text x="60" y="946" font-size="10.5" fill="#64748b">嗜冷菌的柔性低温酶、嗜热菌的 Taq——极端微生物的资源属性与科学属性同样极端。</text>
</svg>