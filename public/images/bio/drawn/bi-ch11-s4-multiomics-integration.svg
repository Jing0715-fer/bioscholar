<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">多组学数据整合：层间错位、MOFA 潜因子与 eQTL–pQTL 错位定位</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">mRNA–蛋白相关仅 0.4–0.6；MOFA 共享潜因子解释跨层方差；eQTL–pQTL 错位定位调控层级；配对设计是第一原则</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、整合的动机：mRNA 与蛋白仅弱相关</text>
  <rect x="60" y="196" width="96" height="44" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="108" y="223" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">DNA</text>
  <line x1="160" y1="218" x2="198" y2="218" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-dna)"/>
  <text x="179" y="200" font-size="10.5" fill="#64748b" text-anchor="middle">转录</text>
  <rect x="202" y="196" width="106" height="44" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="255" y="223" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">mRNA</text>
  <line x1="312" y1="218" x2="350" y2="218" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-rna)"/>
  <text x="331" y="200" font-size="10.5" fill="#64748b" text-anchor="middle">翻译</text>
  <rect x="354" y="196" width="84" height="44" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="396" y="223" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">蛋白</text>
  <text x="60" y="282" font-size="12" fill="#1e293b" font-weight="700">层间缓冲与放大：</text>
  <text x="60" y="306" font-size="11" fill="#475569">翻译效率、降解速率与翻译后修饰，使 mRNA 丰度不能线性预测蛋白丰度。</text>
  <rect x="130.8274" y="370.225" width="138.3452" height="19.55" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="384.14" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">单层分析 = 结构性盲区</text>
  <text x="60" y="428" font-size="11" fill="#475569">整合的目的：把被层间缓冲、放大掩盖的调控信号，在多层证据中重新定位。</text>
  <text x="460" y="200" font-size="13" fill="#1e293b" font-weight="700">mRNA ↔ 蛋白相关系数</text>
  <text x="460" y="224" font-size="11" fill="#475569">量级仅 0.4–0.6，</text>
  <text x="460" y="239" font-size="11" fill="#475569">远低于同层的测量可信度。</text>
  <line x1="465" y1="340" x2="655" y2="340" stroke="#475569" stroke-width="2"/>
  <line x1="465" y1="334" x2="465" y2="346" stroke="#475569" stroke-width="1.8"/>
  <line x1="560" y1="334" x2="560" y2="346" stroke="#475569" stroke-width="1.8"/>
  <line x1="655" y1="334" x2="655" y2="346" stroke="#475569" stroke-width="1.8"/>
  <text x="465" y="364" font-size="11" fill="#64748b" text-anchor="middle">0</text>
  <text x="560" y="364" font-size="11" fill="#64748b" text-anchor="middle">0.5</text>
  <text x="655" y="364" font-size="11" fill="#64748b" text-anchor="middle">1.0</text>
  <line x1="541" y1="340" x2="579" y2="340" stroke="#be185d" stroke-width="8"/>
  <text x="560" y="318" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">典型 r = 0.4–0.6</text>
  <text x="460" y="428" font-size="10.5" fill="#475569">配对设计：同一受试者、</text>
  <text x="460" y="443" font-size="10.5" fill="#475569">同源样本分测各层，</text>
  <text x="460" y="458" font-size="10.5" fill="#475569">是整合的第一设计原则；</text>
  <text x="460" y="473" font-size="10.5" fill="#475569">独立样本只能做结论层对照。</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、MOFA：共享潜因子解释跨层方差</text>
  <rect x="740" y="196" width="180" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.7"/>
  <text x="830" y="218" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">转录组</text>
  <text x="830" y="240" font-size="10.5" fill="#475569" text-anchor="middle">mRNA 丰度</text>
  <rect x="740" y="272" width="180" height="56" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="830" y="294" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">蛋白组</text>
  <text x="830" y="316" font-size="10.5" fill="#475569" text-anchor="middle">蛋白丰度</text>
  <rect x="740" y="348" width="180" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="830" y="370" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">代谢组</text>
  <text x="830" y="392" font-size="10.5" fill="#475569" text-anchor="middle">代谢物浓度</text>
  <text x="1065" y="200" font-size="11.5" fill="#075985" font-weight="700">共享潜因子</text>
  <line x1="920" y1="224" x2="1000" y2="236" stroke="#94a3b8" stroke-width="1.1" opacity="0.85"/>
  <line x1="920" y1="224" x2="1000" y2="332" stroke="#94a3b8" stroke-width="1.1" opacity="0.85"/>
  <line x1="920" y1="300" x2="1000" y2="236" stroke="#94a3b8" stroke-width="1.1" opacity="0.85"/>
  <line x1="920" y1="300" x2="1000" y2="332" stroke="#94a3b8" stroke-width="1.1" opacity="0.85"/>
  <line x1="920" y1="376" x2="1000" y2="236" stroke="#94a3b8" stroke-width="1.1" opacity="0.85"/>
  <line x1="920" y1="376" x2="1000" y2="332" stroke="#94a3b8" stroke-width="1.1" opacity="0.85"/>
  <rect x="1000" y="216" width="130" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1065" y="241" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">因子 1</text>
  <rect x="1000" y="312" width="130" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1065" y="337" font-size="12.5" fill="#075985" text-anchor="middle" font-weight="700">因子 2</text>
  <text x="1065" y="390" font-size="12" fill="#64748b" text-anchor="middle">……更多因子</text>
  <text x="1250" y="208" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">因子 1 在各层的负载</text>
  <text x="1250" y="226" font-size="10" fill="#64748b" text-anchor="middle">（示意）</text>
  <rect x="1190.8" y="314.3478260869565" width="38.4" height="95.65217391304348" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <rect x="1250.8" y="378.4347826086956" width="38.4" height="31.565217391304348" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <rect x="1310.8" y="399.4782608695652" width="38.4" height="10.521739130434783" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1202" y="291" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">高</text>
  <text x="1262" y="365" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">低</text>
  <text x="1322" y="389" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">≈ 0</text>
  <text x="1202" y="430" font-size="11" fill="#64748b" text-anchor="middle">转录组</text>
  <text x="1262" y="430" font-size="11" fill="#64748b" text-anchor="middle">蛋白组</text>
  <text x="1322" y="430" font-size="11" fill="#64748b" text-anchor="middle">代谢组</text>
  <text x="740" y="466" font-size="11" fill="#475569">MOFA（多因子分析）在多视图间学共享潜因子：每个因子在每一层各有一个负载向量；层间负载的悬殊，</text>
  <text x="740" y="481" font-size="11" fill="#475569">直接指出「调控发生在哪一层」——转录层独高提示转录调控、蛋白层独高提示翻译后调控。</text>
  <rect x="30" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、eQTL–pQTL 错位：定位调控层级</text>
  <text x="100" y="634" font-size="11" fill="#64748b">纵向：对蛋白（pQTL）；横向：对 mRNA（eQTL）</text>
  <rect x="100" y="655" width="175" height="110" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="187" y="704" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">转录调控</text>
  <text x="187" y="728" font-size="10" fill="#475569" text-anchor="middle">变异→mRNA→蛋白同向</text>
  <rect x="275" y="655" width="175" height="110" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="362" y="704" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">蛋白稳定性 / 修饰</text>
  <text x="362" y="728" font-size="10" fill="#475569" text-anchor="middle">只调蛋白、不调 RNA</text>
  <rect x="100" y="765" width="175" height="110" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="187" y="814" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">翻译 / 降解调控</text>
  <text x="187" y="838" font-size="10" fill="#475569" text-anchor="middle">调 RNA、不调蛋白</text>
  <rect x="275" y="765" width="175" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="362" y="814" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">无效应（背景）</text>
  <text x="362" y="838" font-size="10" fill="#475569" text-anchor="middle">非调控变异</text>
  <text x="94" y="710" font-size="11.5" fill="#475569" text-anchor="end" font-weight="700">pQTL ＋</text>
  <text x="94" y="820" font-size="11.5" fill="#475569" text-anchor="end" font-weight="700">pQTL －</text>
  <text x="187" y="892" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">eQTL ＋</text>
  <text x="362" y="892" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">eQTL －</text>
  <text x="470" y="650" font-size="13" fill="#1e293b" font-weight="700">错位即信息</text>
  <text x="470" y="676" font-size="11" fill="#475569">错位组合定位调控层级：</text>
  <text x="470" y="691" font-size="11" fill="#475569">调 RNA 不调蛋白，提示翻译或降解；</text>
  <text x="470" y="706" font-size="11" fill="#475569">只调蛋白，提示稳定性或修饰。</text>
  <text x="470" y="756" font-size="11" fill="#475569">核糖体分析可进一步区分：</text>
  <text x="470" y="771" font-size="11" fill="#475569">翻译效率的变化与 mRNA 降解的变化。</text>
  <rect x="710" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="598.84" font-size="19" fill="#475569" font-weight="700">四、实务三难与整合的本义</text>
  <rect x="730" y="630" width="190" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/>
  <text x="825" y="654" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">① 批量效应</text>
  <text x="825" y="676" font-size="10.5" fill="#475569" text-anchor="middle">各层自带技术偏差</text>
  <rect x="940" y="630" width="190" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/>
  <text x="1035" y="654" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">② 样本对齐</text>
  <text x="1035" y="676" font-size="10.5" fill="#475569" text-anchor="middle">谁是同一个体</text>
  <rect x="1150" y="630" width="190" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/>
  <text x="1245" y="654" font-size="12.5" fill="#92400e" text-anchor="middle" font-weight="700">③ 维度灾难</text>
  <text x="1245" y="676" font-size="10.5" fill="#475569" text-anchor="middle">特征远多于样本</text>
  <rect x="942.1625" y="712.225" width="195.675" height="19.55" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1040" y="726.14" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">入场券：先层内归一、再统一量纲</text>
  <text x="730" y="762" font-size="12" fill="#1e293b" font-weight="700">整合的闭环：</text>
  <rect x="730" y="782" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="815" y="806" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">整合发现</text>
  <text x="815" y="828" font-size="10.5" fill="#475569" text-anchor="middle">多层证据交叉</text>
  <rect x="940" y="782" width="170" height="60" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="1025" y="806" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">独立复现</text>
  <text x="1025" y="828" font-size="10.5" fill="#475569" text-anchor="middle">外部队列、平台</text>
  <rect x="1150" y="782" width="170" height="60" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <text x="1235" y="806" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">靶向验证</text>
  <text x="1235" y="828" font-size="10.5" fill="#475569" text-anchor="middle">湿实验回验</text>
  <line x1="902" y1="812" x2="936" y2="812" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <line x1="1112" y1="812" x2="1146" y2="812" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <path d="M 1235,848 C 1235,906 815,906 815,850" fill="none" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <text x="1025" y="914" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">数据回流</text>
  <text x="730" y="946" font-size="11" fill="#475569">发现须独立复现并靶向验证——「互为证词」而非「拼贴幻灯」才是整合的本义。</text>
</svg>