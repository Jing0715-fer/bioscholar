<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">中枢耐受：免疫耐受的概念格局与胸腺、骨髓的出厂筛查</text>
  <text x="700" y="74" text-anchor="middle" font-size="13" fill="#64748b">免疫耐受是抗原特异性无应答状态，区别于免疫缺陷与免疫抑制；Burnet克隆选择学说与Medawar新生期小鼠获得性耐受同获1960年诺贝尔奖；T细胞中枢耐受由胸腺阴性选择执行，AIRE驱动mTEC</text>
  <text x="700" y="100" text-anchor="middle" font-size="13" fill="#64748b">异位表达组织特异性抗原扩展考卷，突变致APS-1/APECED；B细胞中枢耐受含删除、失能与受体编辑三手；中枢耐受受空间、亲和力窗口、时序与年龄四重限制，健康人外周可检出少量自身反应细胞，端赖外周耐受接防</text>
  <rect x="30" y="132" width="1340" height="282" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、免疫耐受：抗原特异性的无应答——克隆选择学说的预言</text>
  <rect x="60" y="186" width="620" height="206" rx="9" fill="#ccfbf1" fill-opacity="0.35" stroke="#0f766e" stroke-width="1.6"/>
  <text x="78" y="210" font-size="12.5" fill="#134e4a" font-weight="700">概念辨析：耐受 ≠ 瘫痪</text>
  <rect x="84" y="232" width="270" height="68" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="219" y="254" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">免疫耐受</text>
  <text x="219" y="272" font-size="10" fill="#475569" text-anchor="middle">抗原特异性无应答</text>
  <text x="219" y="288" font-size="9.5" fill="#64748b" text-anchor="middle">只对特定抗原失明</text>
  <rect x="386" y="232" width="270" height="68" rx="8" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="1.5"/>
  <text x="521" y="254" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">免疫缺陷 / 免疫抑制</text>
  <text x="521" y="272" font-size="10" fill="#475569" text-anchor="middle">泛发性、非特异性瘫痪</text>
  <text x="521" y="288" font-size="9.5" fill="#64748b" text-anchor="middle">对一切抗原全面减员</text>
  <text x="78" y="328" font-size="10.5" fill="#475569">自身耐受由中枢与外周两道防线共同维护：中枢负责「出厂筛查」，外周负责「街头巡检」。</text>
  <text x="78" y="366" font-size="10.5" fill="#134e4a" font-weight="600">本节聚焦中枢：T 在胸腺、B 在骨髓完成的发育期筛查。</text>
  <rect x="710" y="186" width="630" height="206" rx="9" fill="#ffffff" stroke="#0369a1" stroke-width="1.6"/>
  <text x="728" y="210" font-size="12.5" fill="#075985" font-weight="700">学说源流：耐受亦可后天获得</text>
  <line x1="750" y1="320" x2="1310" y2="320" stroke="#475569" stroke-width="3" marker-end="url(#arr-ink)"/>
  <circle cx="794.8" cy="320" r="6.5" fill="#0f766e"/>
  <line x1="794.8" y1="311" x2="794.8" y2="290" stroke="#0f766e" stroke-width="1.7"/>
  <text x="794.8" y="270" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">克隆选择学说</text>
  <text x="794.8" y="250" font-size="12" fill="#64748b" text-anchor="middle">Burnet：自身反应克隆在发育早期被删除</text>
  <circle cx="1074.8" cy="320" r="6.5" fill="#0369a1"/>
  <line x1="1074.8" y1="329" x2="1074.8" y2="350" stroke="#0369a1" stroke-width="1.7"/>
  <text x="1074.8" y="370" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">获得性耐受</text>
  <text x="1074.8" y="390" font-size="12" fill="#64748b" text-anchor="middle">Medawar：新生期小鼠诱导同种移植耐受</text>
  <circle cx="1282" cy="320" r="6.5" fill="#6d28d9"/>
  <line x1="1282" y1="311" x2="1282" y2="290" stroke="#6d28d9" stroke-width="1.7"/>
  <text x="1282" y="270" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1960 诺贝尔奖</text>
  <text x="1282" y="250" font-size="12" fill="#64748b" text-anchor="middle">两人分享</text>
  <text x="728" y="230" font-size="10.5" fill="#075985" font-weight="600">「耐受亦可后天获得」——免疫系统能学会不攻击。</text>
  <rect x="30" y="428" width="1340" height="296" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="450.84" font-size="19" fill="#475569" font-weight="700">二、T 细胞（胸腺）与 B 细胞（骨髓）的中枢耐受对照</text>
  <rect x="60" y="480" width="160" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="507.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">比较项目</text>
  <rect x="220" y="480" width="560" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="507.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">T 细胞中枢耐受</text>
  <rect x="780" y="480" width="560" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="507.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">B 细胞中枢耐受</text>
  <rect x="60" y="524" width="160" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="548.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">执行场所</text>
  <rect x="220" y="524" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="548.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">胸腺皮髓交界与髓质</text>
  <rect x="780" y="524" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="548.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">骨髓</text>
  <rect x="60" y="562" width="1280" height="38" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="562" width="160" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="586.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">自身抗原来源</text>
  <rect x="220" y="562" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="586.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">mTEC（AIRE 驱动）与胸腺 DC</text>
  <rect x="780" y="562" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="586.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">骨髓微环境自身抗原</text>
  <rect x="60" y="600" width="160" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="624.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">处置手段</text>
  <rect x="220" y="600" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="624.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">高亲和力删除、中亲和力转轨 tTreg</text>
  <rect x="780" y="600" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="624.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">多价抗原删除、可溶性抗原失能、受体编辑</text>
  <rect x="60" y="638" width="1280" height="38" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="60" y="638" width="160" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="662.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">独有特点</text>
  <rect x="220" y="638" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="662.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">AIRE 异位表达扩展「考卷」</text>
  <rect x="780" y="638" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="662.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">受体编辑可返厂整改</text>
  <rect x="60" y="676" width="160" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="140" y="700.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">失败后果</text>
  <rect x="220" y="676" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="500" y="700.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">APS-1/APECED 等器官特异性自身免疫</text>
  <rect x="780" y="676" width="560" height="38" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1060" y="700.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">自身抗体相关的体液自身免疫</text>
  <rect x="30" y="736" width="1340" height="238" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="758.84" font-size="19" fill="#475569" font-weight="700">三、中枢耐受的局限：筛查有天花板，外周耐受须接防</text>
  <rect x="60" y="786" width="290" height="66" rx="8" fill="#fef3c7" fill-opacity="0.45" stroke="#d97706" stroke-width="1.5"/>
  <text x="76" y="810" font-size="11.5" fill="#92400e" font-weight="700">空间限制</text>
  <text x="76" y="830" font-size="9.5" fill="#475569">抗原须能进入中枢器官</text>
  <rect x="360" y="786" width="290" height="66" rx="8" fill="#fef3c7" fill-opacity="0.45" stroke="#d97706" stroke-width="1.5"/>
  <text x="376" y="810" font-size="11.5" fill="#92400e" font-weight="700">亲和力窗口</text>
  <text x="376" y="830" font-size="9.5" fill="#475569">过弱识别逃过阴性选择</text>
  <rect x="660" y="786" width="290" height="66" rx="8" fill="#fef3c7" fill-opacity="0.45" stroke="#d97706" stroke-width="1.5"/>
  <text x="676" y="810" font-size="11.5" fill="#92400e" font-weight="700">时序限制</text>
  <text x="676" y="830" font-size="9.5" fill="#475569">发育晚期才表达的抗原错过筛查</text>
  <rect x="960" y="786" width="290" height="66" rx="8" fill="#fef3c7" fill-opacity="0.45" stroke="#d97706" stroke-width="1.5"/>
  <text x="976" y="810" font-size="11.5" fill="#92400e" font-weight="700">年龄限制</text>
  <text x="976" y="830" font-size="9.5" fill="#475569">胸腺随年龄萎缩，考卷渐窄</text>
  <rect x="60" y="868" width="1240" height="86" rx="9" fill="#d1fae5" fill-opacity="0.4" stroke="#059669" stroke-width="1.6"/>
  <text x="80" y="892" font-size="12.5" fill="#065f46" font-weight="700">外周耐受接防</text>
  <text x="80" y="916" font-size="10.5" fill="#475569">健康人外周可检出少量自身反应细胞而无病——正说明中枢筛查不可能穷尽，剩余的监管由外周耐受机制（失能、忽视、AICD、Treg 等）完成。</text>
</svg>