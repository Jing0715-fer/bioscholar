  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">触觉与本体感觉：四型皮肤感受器、肌梭与腱器官</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">浅层感受野小而密（指尖两点辨别仅数毫米）；肌梭并联感长度、腱器官串联感张力</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、无毛皮肤四型机械感受器：浅密深疏</text>
  <rect x="70" y="200" width="300" height="300" rx="6" fill="#ede9fe" fill-opacity="0.3" stroke="#6d28d9" stroke-width="1.8"/>
  <line x1="70" y1="280" x2="370" y2="280" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="70" y1="380" x2="370" y2="380" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="80" y="226" font-size="11.5" fill="#4c1d95" font-weight="700">表皮</text>
  <text x="80" y="306" font-size="11.5" fill="#4c1d95" font-weight="700">真皮</text>
  <text x="80" y="406" font-size="11.5" fill="#4c1d95" font-weight="700">皮下</text>
  <circle cx="150" cy="270" r="9" fill="#0f766e" fill-opacity="0.8"/>
  <text x="168" y="260" font-size="10.5" fill="#134e4a" font-weight="700">Merkel（SA1）</text>
  <text x="168" y="273" font-size="9.5" fill="#64748b">棱角·盲文样细节</text>
  <ellipse cx="260" cy="306" rx="10" ry="15" fill="#b45309" fill-opacity="0.75"/>
  <text x="276" y="304" font-size="10.5" fill="#78350f" font-weight="700">Meissner（RA）</text>
  <text x="276" y="318" font-size="9.5" fill="#64748b">5–40 Hz 低频振动</text>
  <ellipse cx="180" cy="420" rx="16" ry="9" fill="#0369a1" fill-opacity="0.75"/>
  <text x="212" y="418" font-size="10.5" fill="#075985" font-weight="700">Ruffini（SA2）</text>
  <text x="212" y="432" font-size="9.5" fill="#64748b">皮肤牵拉·手形</text>
  <ellipse cx="226" cy="462" rx="13" ry="19" fill="#fee2e2" fill-opacity="0.8" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="226" cy="462" r="4" fill="#dc2626"/>
  <text x="252" y="458" font-size="10.5" fill="#dc2626" font-weight="700">环层小体（RA2）</text>
  <text x="252" y="472" font-size="9.5" fill="#64748b">100–300 Hz 高频振动</text>
  <text x="480" y="226" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">感受野：浅小深大</text>
  <circle cx="500" cy="292" r="13" fill="#0f766e" fill-opacity="0.35" stroke="#0f766e" stroke-width="1.8"/>
  <text x="500" y="296" font-size="8.5" fill="#134e4a" text-anchor="middle" font-weight="700">SA1</text>
  <text x="500" y="330" font-size="10" fill="#64748b" text-anchor="middle">小而边界清晰</text>
  <circle cx="560" cy="292" r="20" fill="#b45309" fill-opacity="0.3" stroke="#b45309" stroke-width="1.8"/>
  <text x="560" y="296" font-size="8.5" fill="#78350f" text-anchor="middle" font-weight="700">RA</text>
  <text x="560" y="330" font-size="10" fill="#64748b" text-anchor="middle">小而清晰</text>
  <circle cx="500" cy="412" r="40" fill="#0369a1" fill-opacity="0.22" stroke="#0369a1" stroke-width="1.8"/>
  <text x="500" y="416" font-size="8.5" fill="#075985" text-anchor="middle" font-weight="700">SA2</text>
  <circle cx="596" cy="412" r="34" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1.8"/>
  <text x="596" y="416" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">RA2</text>
  <text x="548" y="470" font-size="10" fill="#64748b" text-anchor="middle">大而模糊</text>
  <text x="430" y="508" font-size="10.5" fill="#475569">浅层两型感受野小、</text>
  <text x="430" y="523" font-size="10.5" fill="#475569">密度高——指尖两点辨别阈仅数毫米；</text>
  <text x="430" y="538" font-size="10.5" fill="#475569">深层两型感受野大，整合大范围机械状态。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、四型分工：把盲文「读」进大脑的主力</text>
  <rect x="740" y="200" width="128" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="804" y="227.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">类型</text>
  <rect x="868" y="200" width="200" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="968" y="227.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">结构与位置</text>
  <rect x="1068" y="200" width="92" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1114" y="227.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">适应</text>
  <rect x="1160" y="200" width="180" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1250" y="227.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">最敏感刺激</text>
  <rect x="740" y="244" width="128" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="804" y="275.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Merkel 复合体</text>
  <rect x="868" y="244" width="200" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="968" y="275.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">表皮基底层上皮细胞+末梢</text>
  <rect x="1068" y="244" width="92" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1114" y="275.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">慢（SA1）</text>
  <rect x="1160" y="244" width="180" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1250" y="275.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">恒压、棱角、边缘细节</text>
  <rect x="740" y="296" width="600" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="296" width="128" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="804" y="327.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Meissner 小体</text>
  <rect x="868" y="296" width="200" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="968" y="327.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">真皮乳头囊状小体</text>
  <rect x="1068" y="296" width="92" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1114" y="327.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">快（RA）</text>
  <rect x="1160" y="296" width="180" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1250" y="327.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">5–40 Hz 抖动、滑动</text>
  <rect x="740" y="348" width="128" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="804" y="379.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Ruffini 末梢</text>
  <rect x="868" y="348" width="200" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="968" y="379.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">真皮深层梭形末梢</text>
  <rect x="1068" y="348" width="92" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1114" y="379.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">慢（SA2）</text>
  <rect x="1160" y="348" width="180" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1250" y="379.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">皮肤牵拉、握持状态</text>
  <rect x="740" y="400" width="600" height="52" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="400" width="128" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="804" y="431.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">环层小体</text>
  <rect x="868" y="400" width="200" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="968" y="431.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">真皮深层与皮下「洋葱头」</text>
  <rect x="1068" y="400" width="92" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1114" y="431.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">极快（RA2）</text>
  <rect x="1160" y="400" width="180" height="52" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1250" y="431.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">100–300 Hz 高频振动</text>
  <text x="740" y="486" font-size="10.5" fill="#475569">SA1 读纹理与盲文；RA 探粗糙度与滑动；环层小体隔着工具「感到」锉刀颗粒或手机震动——高频成分经工具传到手；</text>
  <text x="740" y="501" font-size="10.5" fill="#475569">SA2 监测拉伸方向，为捏握的力方向提供反馈。有毛皮肤另有触觉 C 纤维（低阈值、慢传导、情感性通路），</text>
  <text x="740" y="516" font-size="10.5" fill="#475569">负责「温柔轻抚」的愉悦感受。</text>
  <rect x="30" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="600.84" font-size="19" fill="#475569" font-weight="700">三、肌梭并联于梭外肌：自带调零机构</text>
  <rect x="90" y="660" width="440" height="26" rx="13" fill="#fce7f3" fill-opacity="0.5" stroke="#be185d" stroke-width="1.8"/>
  <text x="310" y="677" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">梭外肌纤维（α 支配）</text>
  <rect x="90" y="780" width="440" height="26" rx="13" fill="#fce7f3" fill-opacity="0.5" stroke="#be185d" stroke-width="1.8"/>
  <rect x="150" y="718" width="320" height="30" rx="15" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="2"/>
  <text x="310" y="737" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">肌梭（核袋 + 核链纤维）</text>
  <text x="310" y="760" font-size="10" fill="#64748b" text-anchor="middle">并联于梭外肌之间</text>
  <line x1="220" y1="718" x2="200" y2="664" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <text x="178" y="698" font-size="11" fill="#134e4a" text-anchor="middle" font-weight="700">Ia</text>
  <line x1="400" y1="718" x2="420" y2="664" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-rna)"/>
  <text x="440" y="698" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">II</text>
  <line x1="310" y1="848" x2="310" y2="808" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#arr-pro)"/>
  <text x="310" y="868" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">γ 运动神经元支配梭内纤维两端</text>
  <text x="60" y="900" font-size="10.5" fill="#475569">Ia 螺旋末梢感长度与变化率、II 末梢感静态长度；梭外肌主动缩短时 γ 共激活令梭内同步缩短，肌梭在任何长度上都不失灵。</text>
  <text x="60" y="915" font-size="10.5" fill="#475569">Ia 放电沿 Ia 纤维以高达 100 m/s 以上速度上传。</text>
  <rect x="710" y="578" width="660" height="396" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="600.84" font-size="19" fill="#475569" font-weight="700">四、腱器官串联感张力；关节感受器报角度</text>
  <rect x="740" y="660" width="150" height="24" rx="12" fill="#fce7f3" fill-opacity="0.5" stroke="#be185d" stroke-width="1.8"/>
  <text x="815" y="676" font-size="10.5" fill="#831843" text-anchor="middle" font-weight="700">肌腹</text>
  <ellipse cx="930" cy="672" rx="24" ry="16" fill="#fef3c7" fill-opacity="0.8" stroke="#d97706" stroke-width="2"/>
  <text x="930" y="676" font-size="9" fill="#92400e" text-anchor="middle" font-weight="700">腱器官</text>
  <line x1="980" y1="672" x2="1050" y2="672" stroke="#475569" stroke-width="5"/>
  <text x="1010" y="652" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">肌腱</text>
  <text x="740" y="720" font-size="10.5" fill="#475569">与约 10–15 条梭外肌纤维「串联」；张力升高时胶原纤维束拉直、挤压 Ib 传入末梢放电——阈值较高，张力危及肌腱时骤增，</text>
  <text x="740" y="735" font-size="10.5" fill="#475569">经反肌伸张反射抑制同一肌肉的 α 神经元（防断保护）。</text>
  <text x="1040" y="788" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">关节感受器四型分工</text>
  <rect x="740" y="800" width="220" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="850" y="827.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">末梢类型</text>
  <rect x="960" y="800" width="370" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1145" y="827.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">报告内容</text>
  <rect x="740" y="844" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="850" y="864.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Ruffini 型（慢适应）</text>
  <rect x="960" y="844" width="370" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1145" y="864.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">关节角度的持续报告</text>
  <rect x="740" y="874" width="590" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="874" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="850" y="894.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">环层小体型</text>
  <rect x="960" y="874" width="370" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1145" y="894.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">运动瞬变</text>
  <rect x="740" y="904" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="850" y="924.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">高尔基型</text>
  <rect x="960" y="904" width="370" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1145" y="924.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">关节接近极限位置时高频报警</text>
  <rect x="740" y="934" width="590" height="30" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="740" y="934" width="220" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="850" y="954.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">游离末梢</text>
  <rect x="960" y="934" width="370" height="30" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1145" y="954.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">仅关节囊被牵扯或发炎时放电</text>
</svg>