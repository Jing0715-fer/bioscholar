<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">DNA 修复途径：从光复活到 SOS 反应</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">直接逆转（光裂合酶 / AGT）——BER 切小损伤（糖苷酶→AP 内切→填补→封口）、NER 切 12～32 nt 大片段（UvrABC / XP 蛋白 + TFIIH）——SOS 诱导易错跨损伤聚合酶</text>
  <rect x="30" y="132" width="420" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、直接逆转：一步修复</text>
  <text x="60" y="186" font-size="13.5" fill="#1e293b" font-weight="700">光复活（photoreactivation）</text>
  <text x="60" y="208" font-size="11" fill="#b45309">可见光 300～500 nm</text>
  <line x1="66" y1="226" x2="110" y2="238" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-warn)"/>
  <ellipse cx="170" cy="246" rx="52" ry="22" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="170" y="251" font-size="12.5" fill="#831843" text-anchor="middle" font-weight="700">光裂合酶</text>
  <line x1="60" y1="286" x2="390" y2="286" stroke="#0f766e" stroke-width="2.4"/>
  <rect x="150" y="278" width="18" height="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <rect x="168" y="278" width="18" height="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="159" y="310" font-size="10.5" fill="#b45309" text-anchor="middle">CPD</text>
  <text x="60" y="326" font-size="11" fill="#475569">FADH⁻ / MTHF 辅基吸光断开环丁烷环——唯一不需切除合成的「一步逆转」；</text>
  <text x="60" y="341.5" font-size="11" fill="#475569">胎盘类（含人）缺失此酶，依赖 NER。</text>
  <line x1="60" y1="372" x2="390" y2="372" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="60" y="392" font-size="13" fill="#1e293b" font-weight="700">AGT / MGMT：自杀式逆转</text>
  <text x="60" y="410" font-size="11" fill="#475569">将 O⁶-烷基鸟嘌呤的烷基夺回至自身活性位点半胱氨酸，</text>
  <text x="60" y="425.5" font-size="11" fill="#475569">一次转移后酶分子即失活。</text>
  <rect x="450" y="132" width="460" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="466" y="154.84" font-size="19" fill="#475569" font-weight="700">二、碱基切除修复（BER）：小型损伤</text>
  <text x="470" y="192" font-size="12" fill="#475569">① 特异 DNA 糖苷酶识别并切断 N-糖苷键，留下 AP 位点（UNG 切 U、</text>
  <text x="470" y="226" font-size="12" fill="#475569">OGG1 切 8-oxoG）② AP 内切核酸酶（如 APE1）</text>
  <text x="470" y="260" font-size="12" fill="#475569">在 AP 位点 5′ 侧切开骨架③ DNA pol β 填补 1 nt 缺口（短修补）；</text>
  <text x="470" y="294" font-size="12" fill="#475569">或 pol δ/ε + FEN1 长修补 2～10 nt④ 连接酶 III/XRCC1（短）或连接酶 I</text>
  <text x="470" y="328" font-size="12" fill="#475569">（长）封口</text>
  <rect x="396.24" y="394.225" width="207.52" height="19.55" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="500" y="408.14" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="600">底物：脱氨、氧化、烷基化小加合物</text>
  <rect x="910" y="132" width="460" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="926" y="154.84" font-size="19" fill="#475569" font-weight="700">三、核苷酸切除修复（NER）：扭曲性大损伤</text>
  <text x="930" y="192" font-size="13" fill="#1e293b" font-weight="700">大肠杆菌（UvrABC 系统）</text>
  <text x="930" y="214" font-size="12" fill="#475569">UvrA₂B 扫描识别 → UvrB 局部解链 → UvrC 在损伤两侧切开</text>
  <text x="930" y="231" font-size="12" fill="#475569">（3′ 侧 4～5 nt、5′ 侧 8 nt）</text>
  <text x="930" y="248" font-size="12" fill="#475569">→ UvrD 取出 12～13 nt 寡核苷酸片段 → pol I 填补、连接酶封口。</text>
  <text x="930" y="306" font-size="13" fill="#1e293b" font-weight="700">真核（XP 蛋白 + TFIIH）</text>
  <text x="930" y="328" font-size="12" fill="#475569">GG-NER 由 XPC-HR23B 识别损伤；TC-NER 由停滞的 RNA pol II 充当传感器</text>
  <text x="930" y="345" font-size="12" fill="#475569">（CSA/CSB 参与）。汇合后 TFIIH（XPB/XPD 解旋酶）解旋，</text>
  <text x="930" y="362" font-size="12" fill="#475569">XPF-ERCC1 与 XPG 内切酶在两侧切割，切除约 24～32 nt 片段，</text>
  <text x="930" y="379" font-size="12" fill="#475569">pol δ/ε 填补后连接。</text>
  <text x="930" y="418" font-size="11.5" fill="#64748b">着色性干皮病（XP）即 NER 缺陷所致。</text>
  <rect x="30" y="452" width="660" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">四、SOS 反应：易错的最后防线</text>
  <rect x="80" y="490" width="600" height="32" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="511" font-size="12.5" fill="#475569" text-anchor="middle">损伤严重 / 复制叉停滞 → ssDNA 积累</text>
  <line x1="380" y1="524" x2="380" y2="532" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="534" width="600" height="32" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="555" font-size="12.5" fill="#475569" text-anchor="middle">RecA-ssDNA 丝状体活化</text>
  <line x1="380" y1="568" x2="380" y2="576" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="578" width="600" height="32" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="599" font-size="12.5" fill="#475569" text-anchor="middle">促进 LexA 阻遏蛋白自切降解</text>
  <line x1="380" y1="612" x2="380" y2="620" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="622" width="600" height="32" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="643" font-size="12.5" fill="#475569" text-anchor="middle">解除对数十个损伤修复基因的抑制</text>
  <line x1="380" y1="656" x2="380" y2="664" stroke="#475569" stroke-width="2" marker-end="url(#arr-ink)"/>
  <rect x="80" y="666" width="600" height="32" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="687" font-size="12.5" fill="#991b1b" text-anchor="middle" font-weight="700">诱导 pol IV（DinB）/ pol V（UmuD′₂C）跨损伤合成（TLS）</text>
  <text x="80" y="716" font-size="11.5" fill="#64748b">TLS 聚合酶活性位点宽松、无严格校对——易错修复，SOS 诱导期是诱变剂产生突变的主要窗口。</text>
  <rect x="690" y="452" width="680" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="706" y="474.84" font-size="19" fill="#475569" font-weight="700">五、BER 与 NER 的比较</text>
  <rect x="710" y="500" width="130" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="527.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">项目</text>
  <rect x="840" y="500" width="240" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="527.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">BER</text>
  <rect x="1080" y="500" width="270" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1215" y="527.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">NER</text>
  <rect x="710" y="544" width="130" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="569.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">底物</text>
  <rect x="840" y="544" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="569.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">小碱基损伤（脱氨、氧化、甲基化）</text>
  <rect x="1080" y="544" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1215" y="569.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">大体积扭曲损伤（二聚体、大加合物）</text>
  <rect x="710" y="584" width="640" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="710" y="584" width="130" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="609.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">识别</text>
  <rect x="840" y="584" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="609.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">各特异糖苷酶（UNG / OGG1）</text>
  <rect x="1080" y="584" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1215" y="609.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">UvrA / XPC 或 RNA pol II</text>
  <rect x="710" y="624" width="130" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="649.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">切除范围</text>
  <rect x="840" y="624" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="649.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">单个碱基至 ~10 nt</text>
  <rect x="1080" y="624" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1215" y="649.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">12～13 nt（原核）/ 24～32 nt（真核）</text>
  <rect x="710" y="664" width="640" height="40" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="710" y="664" width="130" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="775" y="689.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">填补酶</text>
  <rect x="840" y="664" width="240" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="960" y="689.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">pol β 或 δ/ε</text>
  <rect x="1080" y="664" width="270" height="40" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1215" y="689.5" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="500">pol I（原核）/ δ、ε（真核）</text>
  <text x="710" y="716" font-size="12" fill="#64748b">修复途径的选择取决于损伤的体积与对双螺旋的扭曲程度。</text>
</svg>