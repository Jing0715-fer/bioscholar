  <text x="50" y="916" font-size="10" fill="#64748b">读表按约束筛选：分泌型糖蛋白直接排除大肠杆菌；大于 300 kDa 且亚基单独不折叠的复合物，昆虫或哺乳动物共表达几乎是唯一选择；从摇瓶到 5 L 反应器，毕赤与 CHO 放大工艺最成熟——平行启动两三个体系小试，以数据而非习惯做决定。</text>
