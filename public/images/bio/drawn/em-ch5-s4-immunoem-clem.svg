  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">免疫电镜与相关显微学：金标签与光电缝合</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">胶体金 5、10、15 nm 分档，双标先小后大，2 nm 超小金配银增强；包埋后效率约 1–5%、定位几纳米；CLEM 以 fiducial 缝合同一细胞的光与电</text>
  <rect x="30" y="132" width="700" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、免疫金双标记：蛋白 A-金的方向性</text>
  <rect x="60" y="268" width="580" height="40" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="350" y="292" font-size="10" fill="#475569" text-anchor="middle">树脂或蔗糖切片（约 70 nm，两侧切面暴露抗原）</text>
  <line x1="210" y1="232" x2="210" y2="214" stroke="#6d28d9" stroke-width="2.4"/>
  <line x1="210" y1="230" x2="198" y2="262" stroke="#6d28d9" stroke-width="2"/>
  <line x1="210" y1="230" x2="222" y2="262" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="210" cy="266" r="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <circle cx="210" cy="194" r="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="210" y="198" font-size="9" fill="#78350f" text-anchor="middle" font-weight="700">Au</text>
  <text x="150" y="190" font-size="10" fill="#78350f" font-weight="700">5 nm 金</text>
  <line x1="430" y1="238" x2="430" y2="216" stroke="#6d28d9" stroke-width="2.4"/>
  <line x1="430" y1="236" x2="414" y2="262" stroke="#6d28d9" stroke-width="2"/>
  <line x1="430" y1="236" x2="446" y2="262" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="430" cy="266" r="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.8"/>
  <circle cx="430" cy="192" r="22" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/>
  <text x="430" y="197" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">Au</text>
  <text x="470" y="186" font-size="10.5" fill="#78350f" font-weight="700">10 nm 金</text>
  <rect x="284.6643" y="215.925" width="90.67139999999999" height="16.15" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="330" y="227.42" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">蛋白 A 结合 Fc 段</text>
  <line x1="272" y1="224" x2="220" y2="224" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <line x1="388" y1="224" x2="420" y2="224" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <text x="520" y="200" font-size="9.5" fill="#475569">Fab 两臂朝外，</text>
  <text x="520" y="213" font-size="9.5" fill="#475569">抗原结合位点全部外露</text>
  <text x="520" y="240" font-size="9.5" fill="#64748b">直接化学偶联 IgG 取向随机，</text>
  <text x="520" y="253" font-size="9.5" fill="#64748b">半数结合臂等于白挂</text>
  <rect x="43.59500000000003" y="339.5" width="352.80999999999995" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="220" y="351.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">双标记：5 与 10 nm（或 10 与 15 nm），先小后大——小金穿透与位阻占优</text>
  <rect x="421.407" y="339.5" width="187.18600000000004" height="17" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="515" y="351.6" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">三重标记：加约 2 nm 超小金配银增强</text>
  <text x="60" y="382" font-size="10" fill="#475569">金粒径分 5、10、15 nm 数档：小金标记效率高但辨识度低，大金醒目却空间定位粗；5 nm 金的标记中心与抗原位置差约几纳米。</text>
  <text x="60" y="404" font-size="10" fill="#64748b">源流：Turkevich 1951 柠檬酸钠还原氯金酸（柠檬酸盐相对越多、成核越密、粒径越小）；Faulk 与 Taylor 1971 引入胶体金；</text>
  <text x="60" y="418" font-size="10" fill="#64748b">Slot 与 Geuze 确立蛋白 A-金体系。</text>
  <rect x="750" y="132" width="620" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="766" y="154.84" font-size="19" fill="#475569" font-weight="700">二、策略之争与效率的清醒账</text>
  <rect x="770" y="176" width="108" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="824" y="203.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">策略</text>
  <rect x="878" y="176" width="148" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="952" y="203.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">抗体可达性</text>
  <rect x="1026" y="176" width="118" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="203.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">结构保存</text>
  <rect x="1144" y="176" width="92" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1190" y="203.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">典型效率</text>
  <rect x="1236" y="176" width="114" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1293" y="203.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">适用场景</text>
  <rect x="770" y="220" width="108" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="824" y="242" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">包埋前标记</text>
  <rect x="878" y="220" width="148" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="952" y="242" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">需通透化，深部难达</text>
  <rect x="1026" y="220" width="118" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="242" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">受通透损伤</text>
  <rect x="1144" y="220" width="92" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1190" y="242" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">较高</text>
  <rect x="1236" y="220" width="114" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1293" y="242" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">表面与浅层抗原</text>
  <rect x="770" y="253" width="580" height="33" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="770" y="253" width="108" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="824" y="275" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">包埋后（树脂）</text>
  <rect x="878" y="253" width="148" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="952" y="275" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">仅切片表面</text>
  <rect x="1026" y="253" width="118" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="275" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">好</text>
  <rect x="1144" y="253" width="92" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1190" y="275" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">约 1–5%</text>
  <rect x="1236" y="253" width="114" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1293" y="275" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">以定位为主的问题</text>
  <rect x="770" y="286" width="108" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="824" y="308" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Tokuyasu 切片</text>
  <rect x="878" y="286" width="148" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="952" y="308" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">切面暴露充分</text>
  <rect x="1026" y="286" width="118" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1085" y="308" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">好（无脱水树脂）</text>
  <rect x="1144" y="286" width="92" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1190" y="308" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">相对最高</text>
  <rect x="1236" y="286" width="114" height="33" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1293" y="308" font-size="10" fill="#475569" text-anchor="middle" font-weight="500">免疫金标准平台</text>
  <text x="880" y="336" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">定位精度（示意）</text>
  <text x="1110" y="336" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">灵敏度与标记率（示意）</text>
  <line x1="790" y1="410" x2="950" y2="410" stroke="#475569" stroke-width="1.6"/>
  <rect x="800" y="396" width="54" height="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="827" y="390" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="600">几 nm</text>
  <rect x="874" y="358" width="54" height="52" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="901" y="350" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="600">约 200 nm</text>
  <text x="827" y="424" font-size="9.5" fill="#475569" text-anchor="middle">免疫金</text>
  <text x="901" y="424" font-size="9.5" fill="#475569" text-anchor="middle">免疫荧光</text>
  <line x1="1020" y1="410" x2="1180" y2="410" stroke="#475569" stroke-width="1.6"/>
  <rect x="1030" y="401" width="54" height="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1057" y="395" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="600">1–5%</text>
  <rect x="1104" y="365" width="54" height="45" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="1131" y="357" font-size="9.5" fill="#4c1d95" text-anchor="middle" font-weight="600">过半</text>
  <text x="1057" y="424" font-size="9.5" fill="#475569" text-anchor="middle">免疫金</text>
  <text x="1131" y="424" font-size="9.5" fill="#475569" text-anchor="middle">免疫荧光</text>
  <text x="1210" y="360" font-size="10" fill="#475569">互补而非互替：荧光找事件、</text>
  <text x="1210" y="374" font-size="10" fill="#475569">看动态；电镜看结构、定分子。</text>
  <rect x="30" y="456" width="1340" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="478.84" font-size="19" fill="#475569" font-weight="700">三、CLEM：把活细胞的光与电缝在同一个细胞上</text>
  <rect x="60" y="506" width="360" height="116" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="240" y="532" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="700">① 活细胞荧光时序成像</text>
  <text x="240" y="560" font-size="10.5" fill="#475569" text-anchor="middle">GFP-LC3 追踪自噬泡何时何地出现</text>
  <text x="240" y="580" font-size="10.5" fill="#475569" text-anchor="middle">荧光报告 MAM 接触的动态</text>
  <text x="240" y="600" font-size="10.5" fill="#475569" text-anchor="middle">（事件的光学档案：管「何时」）</text>
  <rect x="460" y="506" width="360" height="116" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="640" y="532" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">② fiducial 基准点（缝合针脚）</text>
  <text x="640" y="560" font-size="10.5" fill="#475569" text-anchor="middle">荧光-电子双态纳米珠或量子点</text>
  <text x="640" y="580" font-size="10.5" fill="#475569" text-anchor="middle">刻蚀坐标 finder 载网（网格寻址）</text>
  <text x="640" y="600" font-size="10.5" fill="#475569" text-anchor="middle">光转化沉淀（DAB 产物）</text>
  <rect x="860" y="506" width="360" height="116" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1040" y="532" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">③ 电镜超微结构加坐标对齐</text>
  <text x="1040" y="560" font-size="10.5" fill="#475569" text-anchor="middle">同一细胞、同一坐标系回访</text>
  <text x="1040" y="580" font-size="10.5" fill="#475569" text-anchor="middle">电镜确认双层膜包裹与成熟度分期</text>
  <text x="1040" y="600" font-size="10.5" fill="#475569" text-anchor="middle">（结构的电镜档案：管「何形」）</text>
  <line x1="424" y1="564" x2="456" y2="564" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <line x1="824" y1="564" x2="856" y2="564" stroke="#475569" stroke-width="2.4" marker-end="url(#arr-ink)"/>
  <rect x="60" y="640" width="630" height="84" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="664" font-size="12" fill="#1e293b" font-weight="700">应用一：囊泡运输与自噬体成熟</text>
  <text x="76" y="686" font-size="10" fill="#475569">荧光里「何时出芽」对上电镜里「何处有出芽结构的超微形态」；光镜以 GFP-LC3 追踪自噬泡，</text>
  <text x="76" y="700" font-size="10" fill="#475569">电镜在同一细胞确认双层膜包裹与成熟度分期。</text>
  <rect x="710" y="640" width="630" height="84" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="664" font-size="12" fill="#1e293b" font-weight="700">应用二：MAM 线粒体-内质网接触位点</text>
  <text x="726" y="686" font-size="10" fill="#475569">荧光报告接触的动态，电镜量出约 10–30 nm 的膜间距与拴链结构——光管「何时」，电管「何形」。</text>
  <text x="60" y="744" font-size="10.5" fill="#475569">方法论难点在「同一样品的两次世界」：荧光要薄要活、电镜要固定要衬度——fiducial 基准与低稀释的坐标系统是唯一的黏合剂，三类 fiducial 常可叠加使用。</text>
  <rect x="30" y="766" width="1340" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="788.84" font-size="19" fill="#475569" font-weight="700">四、定量纪律与选择口径</text>
  <rect x="50" y="796" width="640" height="168" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="66" y="820" font-size="12" fill="#1e293b" font-weight="700">归一化口径：跨实验可比（Mayhew 与 Lucocq 系统化）</text>
  <text x="66" y="844" font-size="10" fill="#475569">每微米膜长度的金粒数、每平方微米截面的金粒密度；按结构面积分区清点金粒，以卡方检验与相对标记指数（RLI）</text>
  <text x="66" y="858" font-size="10" fill="#475569">判断分布偏离面积期望的方向与显著性——「哪些结构被显著富集标记」由统计说话而非肉眼印象。</text>
  <text x="66" y="880" font-size="10" fill="#475569">把 1–5% 的抗原占有率诚实写进报告：看到的是少数派，下结论前须先排除表位可及性的偏好。</text>
  <rect x="249.3" y="899.5" width="201.4" height="17" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="350" y="911.6" font-size="10" fill="#831843" text-anchor="middle" font-weight="700">免疫金：定位精确（几纳米）但灵敏度低</text>
  <rect x="234.57100000000003" y="929.5" width="230.85799999999992" height="17" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="350" y="941.6" font-size="10" fill="#4c1d95" text-anchor="middle" font-weight="700">免疫荧光：灵敏度高、定位约 200 nm 衍射极限</text>
  <rect x="710" y="796" width="630" height="168" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="820" font-size="12" fill="#1e293b" font-weight="700">分诊台：先问问题在哪一层</text>
  <text x="726" y="844" font-size="10.5" fill="#475569">问题在「哪里」选电镜标记；问题在「多少与何时」先做荧光；两者都要就上 CLEM。</text>
  <text x="726" y="868" font-size="10.5" fill="#475569">表位能否扛住制样：构象表位、磷酸化表位扛不住热聚合——避开 60 °C 环氧，走 Tokuyasu 或包埋前路线。</text>
  <text x="726" y="892" font-size="10.5" fill="#475569">要定位到多深：表面分子包埋后即可；全细胞分布交给 Tokuyasu 系列。</text>
  <rect x="852.95" y="921.5" width="294.1" height="17" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1000" y="933.6" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">荧光负责「找事件、看动态」，电镜负责「看结构、定分子」</text>
</svg>