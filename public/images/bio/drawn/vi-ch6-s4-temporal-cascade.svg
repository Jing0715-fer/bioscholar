<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">基因表达的时序级联与调控网络：α-β-γ、CI-Cro 与 Tat</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">VP16 起爆 HSV α 级联、ICP4 双向调控、γ2 依赖 DNA 复制；λ 右操纵区 OR1/OR2/OR3 与背靠背启动子构成双稳态；Tat-TAR 募集 P-TEFb 正反馈致全或无表达</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、HSV 的 α-β-γ 三级级联</text>
  <rect x="139.7772" y="186.225" width="120.4456" height="19.55" rx="7" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="200" y="200.14" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">VP16（毒粒携带）</text>
  <line x1="200" y1="218" x2="200" y2="246" stroke="#be185d" stroke-width="2.2" marker-end="url(#arr-enz)"/>
  <text x="280" y="234" font-size="10" fill="#64748b" text-anchor="middle">起爆 α 基因</text>
  <rect x="80" y="252" width="240" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="200" y="272" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">α（立即早期）</text>
  <text x="200" y="290" font-size="10" fill="#475569" text-anchor="middle">ICP4 · ICP27</text>
  <line x1="200" y1="300" x2="200" y2="330" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-bad)"/>
  <rect x="80" y="336" width="240" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="200" y="356" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">β（早期）</text>
  <text x="200" y="374" font-size="10" fill="#475569" text-anchor="middle">复制酶系：合成 DNA</text>
  <line x1="200" y1="384" x2="200" y2="414" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-rna)"/>
  <rect x="80" y="420" width="240" height="44" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="200" y="440" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="700">γ（晚期）</text>
  <text x="200" y="458" font-size="10" fill="#475569" text-anchor="middle">结构蛋白：装配子代</text>
  <path d="M 324,270 C 380,270 380,442 324,442" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr-bad)"/>
  <text x="415" y="350" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">ICP4 双向调控</text>
  <text x="415" y="368" font-size="10" fill="#64748b" text-anchor="middle">自抑 α · 激活 β 与 γ</text>
  <text x="440" y="262" font-size="11" fill="#475569">ICP4 既当刹车又当油门：</text>
  <text x="440" y="278" font-size="11" fill="#475569">抑制自己的 α 基因，却逐级点亮 β、</text>
  <text x="440" y="294" font-size="11" fill="#475569">γ——一个蛋白写就级联骨架。</text>
  <text x="440" y="396" font-size="11" fill="#475569">γ2 绝对依赖 DNA 复制：先复制、后装配，</text>
  <text x="440" y="412" font-size="11" fill="#475569">次序不可颠倒。</text>
  <text x="50" y="500" font-size="11" fill="#64748b">级联各期表达量以数量级变动——时序即「先造工具、后造建材」的调度。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、λ 噬菌体：CI-Cro 双稳态开关</text>
  <text x="730" y="192" font-size="11.5" fill="#1e293b" font-weight="700">右操纵区：三个约 17 bp 位点夹在背靠背启动子间</text>
  <line x1="760" y1="244" x2="1250" y2="244" stroke="#0f766e" stroke-width="3"/>
  <rect x="808" y="232" width="44" height="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="830" y="248" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">OR3</text>
  <rect x="918" y="232" width="44" height="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="940" y="248" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">OR2</text>
  <rect x="1028" y="232" width="44" height="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <text x="1050" y="248" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">OR1</text>
  <text x="740" y="248" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">PRM ▶</text>
  <text x="740" y="268" font-size="9.5" fill="#64748b" text-anchor="middle">驱动 CI</text>
  <text x="1270" y="248" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">▶ PR</text>
  <text x="1270" y="268" font-size="9.5" fill="#64748b" text-anchor="middle">驱动 cro</text>
  <text x="730" y="330" font-size="12" fill="#065f46" font-weight="700">溶原态（CI 占优）：</text>
  <rect x="760" y="344" width="200" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="860" y="364" font-size="10.5" fill="#065f46" text-anchor="middle" font-weight="700">CI 二聚体坐镇 OR1/OR2</text>
  <text x="760" y="412" font-size="10.5" fill="#475569">阻遏 PR（裂解基因关）；又激活 PRM——正负自调、</text>
  <text x="760" y="427" font-size="10.5" fill="#475569">维持溶原。</text>
  <text x="1030" y="330" font-size="12" fill="#dc2626" font-weight="700">裂解态（Cro 占优）：</text>
  <rect x="1060" y="344" width="200" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1160" y="364" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">Cro 先关 PRM</text>
  <text x="1060" y="412" font-size="10.5" fill="#475569">CI 不再生产，</text>
  <text x="1060" y="427" font-size="10.5" fill="#475569">开关翻向裂解——PR 尽情驱动 cro 与裂解基因。</text>
  <rect x="810.2123" y="466.65" width="239.5754" height="18.7" rx="7" fill="#d97706" stroke-width="1.5"/>
  <text x="930" y="479.96" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">UV → RecA 活化体切割 CI → 诱导进入裂解</text>
  <text x="730" y="512" font-size="10.5" fill="#64748b">双稳态：两个自增强的吸引子，一触即翻——后续「潜伏／再激活」的通用语法。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、流感：用运输配额写时序</text>
  <text x="50" y="640" font-size="12" fill="#1e293b" font-weight="700">NP 丰度切换转录 / 复制：</text>
  <rect x="87.375" y="676.65" width="125.25" height="18.7" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="150" y="689.96" font-size="11" fill="#78350f" text-anchor="middle">NP 少 → 转录产 mRNA</text>
  <line x1="300" y1="686" x2="360" y2="686" stroke="#64748b" stroke-width="2" marker-end="url(#arr-mute)"/>
  <text x="330" y="670" font-size="9.5" fill="#64748b" text-anchor="middle">NP 积累</text>
  <rect x="396.375" y="676.65" width="147.25" height="18.7" rx="7" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="470" y="689.96" font-size="11" fill="#134e4a" text-anchor="middle">NP 多 → 切换复制产 cRNA</text>
  <text x="50" y="740" font-size="12" fill="#1e293b" font-weight="700">M1-NEP 复合物的出核运输切换装配：</text>
  <rect x="70" y="758" width="130" height="36" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="135" y="780" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">vRNP＋M1-NEP</text>
  <line x1="206" y1="776" x2="266" y2="776" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="236" y="760" font-size="9.5" fill="#075985" text-anchor="middle">出核</text>
  <rect x="270" y="758" width="110" height="36" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="325" y="780" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">胞质装配</text>
  <text x="50" y="836" font-size="11" fill="#475569">同一套机器，靠「谁押运、运多少」切换模式——运输配额本身就是调控语言。</text>
  <text x="50" y="876" font-size="11" fill="#64748b">不等新转录因子出现，流量重分配即完成程序切换——快而经济。</text>
  <rect x="710" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="608.84" font-size="19" fill="#475569" font-weight="700">四、HIV Tat 正反馈：全或无的分子天平</text>
  <rect x="740" y="640" width="150" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="815" y="660" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700">TAR（RNA 茎环）</text>
  <line x1="900" y1="662" x2="950" y2="662" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-pro)"/>
  <text x="925" y="646" font-size="9.5" fill="#4c1d95" text-anchor="middle">Tat 结合</text>
  <rect x="955" y="640" width="150" height="44" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1030" y="660" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">募集 P-TEFb</text>
  <line x1="1108" y1="662" x2="1158" y2="662" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="1133" y="646" font-size="9.5" fill="#075985" text-anchor="middle">延伸加速</text>
  <rect x="1162" y="640" width="160" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="1242" y="660" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">更多 Tat 产出</text>
  <path d="M 1242,688 C 1242,730 815,730 815,688" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr-bad)"/>
  <text x="1030" y="728" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">正反馈：产得越多、延伸越快</text>
  <text x="730" y="776" font-size="11" fill="#475569">前病毒表达因此呈「全或无」爆发——爆发的另一面是长期沉默：潜伏储库的分子天平。</text>
  <text x="730" y="820" font-size="11" fill="#64748b">共同的语法：正负反馈、前馈与双稳态模体——HSV 级联、λ 开关、Tat 爆发用的是同一套网络词汇。</text>
</svg>