  <rect x="996.3325" y="389.075" width="111.33500000000001" height="17.849999999999998" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1052" y="401.78" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">上升期（十余分钟）</text>
  <text x="1208" y="203.2" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">平台＝平均裂解量 100–200</text>
  <rect x="726" y="481.59" width="11.55" height="8.82" rx="3" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/>
  <text x="745.55" y="489.78" font-size="10.5" fill="#475569">一步生长（培养液计数）</text>
  <rect x="883.05" y="481.59" width="11.55" height="8.82" rx="3" fill="#b45309" stroke="#cbd5e1" stroke-width="1"/>
  <text x="902.5999999999999" y="489.78" font-size="10.5" fill="#475569">胞内侵染性（提前裂解）</text>
  <text x="726" y="508" font-size="10.5" fill="#475569">Doermann 于 1940 年代末以氯仿或氰化物提前裂解感染细胞：</text>
  <text x="726" y="523" font-size="10.5" fill="#475569">潜伏期前半程约 12 分钟内测不到任何侵染性颗粒——胞内子代从无到有、再近乎线性累积。纵轴为每细胞侵染性（PFU）。</text>
  <rect x="30" y="586" width="660" height="394" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="608.84" font-size="19" fill="#475569" font-weight="700">三、单次裂解分析：平均数背后的宽分布</text>
  <text x="220" y="636" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">单个细胞的裂解量分布（示意）</text>
  <text x="220" y="654" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">跨近一个数量级：从数十到数百</text>
  <rect x="76.75" y="849.6470588235294" width="24" height="22.352941176470587" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
