  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">一步生长曲线与感染动力学：同步、稀释与三个读数</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">T4（37 °C）潜伏期 21–25 min、上升期十余分钟、平均裂解量 100–200；Doermann 隐蔽期约 12 min；单细胞裂解量跨近一个数量级、近似对数正态</text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Ellis 与 Delbrück（1939）：同步感染＋大规模稀释</text>
  <rect x="56" y="208" width="136" height="66" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="124" y="234" font-size="13.5" fill="#075985" text-anchor="middle" font-weight="700">同步感染</text>
  <text x="124" y="256" font-size="9.5" fill="#64748b" text-anchor="middle">全部细胞同一时刻吸附</text>
  <line x1="194" y1="241" x2="215" y2="241" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="217" y="208" width="136" height="66" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="285" y="234" font-size="13.5" fill="#075985" text-anchor="middle" font-weight="700">大规模稀释</text>
  <text x="285" y="256" font-size="9.5" fill="#64748b" text-anchor="middle">终止再感染，一步化</text>
  <line x1="355" y1="241" x2="376" y2="241" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="378" y="208" width="136" height="66" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="446" y="234" font-size="13.5" fill="#075985" text-anchor="middle" font-weight="700">定时取样</text>
  <text x="446" y="256" font-size="9.5" fill="#64748b" text-anchor="middle">感染后逐分钟取样</text>
  <line x1="516" y1="241" x2="537" y2="241" stroke="#0369a1" stroke-width="2.2" marker-end="url(#arr-acc)"/>
  <rect x="539" y="208" width="136" height="66" rx="9" fill="#f1f5f9" stroke="#0369a1" stroke-width="1.8"/>
  <text x="607" y="234" font-size="13.5" fill="#075985" text-anchor="middle" font-weight="700">蚀斑计数</text>
  <text x="607" y="256" font-size="9.5" fill="#64748b" text-anchor="middle">读出每细胞 PFU</text>
  <text x="360" y="306" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">让每一只菌都「同时开跑」——群体平均值才配得上「一步」二字</text>
  <rect x="56" y="336" width="286" height="84" rx="8" fill="#ccfbf1" fill-opacity="0.6" stroke="#0f766e" stroke-width="1.6"/>
  <text x="199" y="362" font-size="11.5" fill="#134e4a" text-anchor="middle" font-weight="700">吸附后的感染细胞</text>
  <text x="72" y="384" font-size="9.5" fill="#475569">取样时未裂解者整斑计数（感染中心），</text>
  <text x="72" y="397" font-size="9.5" fill="#475569">裂解者按释放子代计数</text>
  <rect x="356" y="336" width="286" height="84" rx="8" fill="#fef3c7" fill-opacity="0.6" stroke="#b45309" stroke-width="1.6"/>
  <text x="499" y="362" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="700">「噬菌体从何而来」</text>
  <text x="372" y="384" font-size="9.5" fill="#475569">1939 年《普通生理学杂志》把含混争论变成可以定量回答的问题</text>
  <text x="50" y="452" font-size="11" fill="#475569">一步生长实验的灵魂是两条控制：同步（同一时刻感染）与稀释（排除二次感染）</text>
  <text x="50" y="468" font-size="11" fill="#475569">——由此平均曲线才可解读为单细胞事件的统计叠加。</text>
  <text x="50" y="494" font-size="11" fill="#64748b">加州理工学院的这一设计，让「数量」自此成为噬菌体研究的通用语言。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、一步生长曲线（T4，37 °C）：三个经典读数</text>
