  <text x="220" y="918" font-size="11" fill="#64748b" text-anchor="middle">每细胞裂解量</text>
  <text x="510" y="636" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">上升期＝个体裂解时刻的统计叠加</text>
