  <text x="520" y="942" font-size="9.5" fill="#0f766e" text-anchor="middle">累计释放曲线（平滑上升）</text>
  <text x="50" y="958" font-size="10.5" fill="#475569">把培养物极端稀释至每管至多一个感染细胞：个体裂解量差异跨近一个数量级；「平滑上升期」其实是无数离散裂解事件的叠加。</text>
