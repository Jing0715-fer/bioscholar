  <text x="349" y="694" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">肺泡</text>
  <rect x="294" y="745" width="110" height="22" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="349" cy="756" r="9" fill="#7f1d1d"/>
  <text x="349" y="738" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700">栓子</text>
  <line x1="266" y1="756" x2="290" y2="756" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-bad)"/>
  <line x1="392" y1="748" x2="408" y2="764" stroke="#991b1b" stroke-width="2.5"/>
  <line x1="408" y1="748" x2="392" y2="764" stroke="#991b1b" stroke-width="2.5"/>
  <text x="400" y="782" font-size="8.5" fill="#991b1b" text-anchor="middle">血流断绝</text>
  <text x="555" y="645" font-size="9" fill="#94a3b8" text-anchor="middle">通气归零</text>
  <circle cx="555" cy="690" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="555" y="694" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700">塌陷</text>
  <rect x="500" y="745" width="110" height="22" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="527" cy="756" r="5" fill="#dc2626" fill-opacity="0.8"/>
  <circle cx="555" cy="756" r="5" fill="#dc2626" fill-opacity="0.8"/>
  <circle cx="583" cy="756" r="5" fill="#dc2626" fill-opacity="0.8"/>
  <line x1="472" y1="756" x2="496" y2="756" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-bad)"/>
  <line x1="614" y1="756" x2="638" y2="756" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-bad)"/>
  <text x="46" y="806" font-size="9" fill="#475569">通气 4 L/min ∶ 血流 5 L/min。</text>
  <text x="46" y="819.5" font-size="9" fill="#475569">O<tspan dy="2.0" font-size="6.5">2</tspan><tspan dy="-2.0"> 有 Hb 储备库撑腰、</tspan></text>
  <text x="46" y="833" font-size="9" fill="#475569">CO<tspan dy="2.0" font-size="6.5">2</tspan><tspan dy="-2.0"> 清除更依赖持续灌流——通气略「欠配」。</tspan></text>
  <text x="252" y="806" font-size="9" fill="#475569">肺栓塞：照常通气、</text>
  <text x="252" y="819.5" font-size="9" fill="#475569">无血可氧合——通气被「浪费」，</text>
  <text x="252" y="833" font-size="9" fill="#475569">Bohr 测得生理死腔扩大。</text>
  <text x="458" y="806" font-size="9" fill="#475569">肺不张/实变：</text>
  <text x="458" y="819.5" font-size="9" fill="#475569">静脉血未经氧合直入动脉＝肺内右向左分流。</text>
  <rect x="46" y="862" width="610" height="62" rx="8" fill="#f1f5f9"/>
  <text x="60" y="880" font-size="9.5" fill="#475569">吸纯氧可鉴别两极端：死腔样与低 V/Q 区反应良好，真分流区低氧顽固；低氧性肺血管收缩（HPV）</text>
  <text x="60" y="894.5" font-size="9.5" fill="#475569">把血流从低通气区转向通气良好区——高原全肺性 HPV 则成肺动脉高压与高原肺水肿之源。</text>
  <rect x="710" y="582" width="660" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="604.84" font-size="19" fill="#475569" font-weight="700">四、Fick 扩散定律与 CO<tspan dy="4.2" font-size="13.7">2</tspan><tspan dy="-4.2"> 的 20 倍优势</tspan></text>
  <text x="726" y="632" font-size="11.5" fill="#1e293b" font-weight="700">扩散量 ∝ 面积 × 分压差 × 溶解度 /（膜厚度 × √分子量）</text>
  <rect x="900" y="655" width="100" height="90" fill="#e0f2fe" fill-opacity="0.5"/>
  <rect x="1000" y="655" width="8" height="90" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <rect x="1008" y="655" width="100" height="90" fill="#fee2e2" fill-opacity="0.4"/>
  <text x="950" y="720" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">肺泡气</text>
  <text x="1058" y="720" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="700">毛细血管血</text>
  <line x1="930" y1="680" x2="1080" y2="680" stroke="#0369a1" stroke-width="2" marker-end="url(#arr-acc)"/>
  <text x="1000" y="671" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="700">O<tspan dy="2.1" font-size="6.8">2</tspan></text>
  <line x1="1075" y1="702" x2="925" y2="702" stroke="#d97706" stroke-width="2" marker-end="url(#arr-warn)"/>
  <text x="1000" y="715" font-size="9.5" fill="#92400e" text-anchor="middle" font-weight="700">CO<tspan dy="2.1" font-size="6.8">2</tspan></text>
  <text x="900" y="772" font-size="9.5" fill="#475569">呼吸膜厚 0.2–0.6 μm、总交换面积 ≈70 m²——「薄而广」</text>
  <text x="1190" y="616" font-size="10.5" fill="#475569" font-weight="700">扩散能力对比</text>
  <rect x="1215" y="707" width="24" height="13" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1227" y="700" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="600">1</text>
  <rect x="1272" y="625" width="24" height="95" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1284" y="617" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">≈20×</text>
  <text x="1227" y="740" font-size="9.5" fill="#475569" text-anchor="middle">O<tspan dy="2.1" font-size="6.8">2</tspan></text>
  <text x="1284" y="740" font-size="9.5" fill="#475569" text-anchor="middle">CO<tspan dy="2.1" font-size="6.8">2</tspan></text>
  <text x="1190" y="768" font-size="9" fill="#64748b">溶解度高 20 余倍；</text>
  <text x="1190" y="781.5" font-size="9" fill="#64748b">分子量 44 对 32 仅小幅拖累</text>
  <text x="726" y="806" font-size="9.5" fill="#475569">病理次序：呼吸膜增厚或面积缩小（肺纤维化、肺水肿）→低氧血症先于 CO<tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> 潴留出现——O</tspan><tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> 先「输」在扩散慢。</tspan></text>
  <text x="726" y="830" font-size="9.5" fill="#475569">灌注限制 vs 扩散限制：正常 O<tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> 流经肺毛细血管 0.75 s、0.25 s 即平衡（灌注限制）；运动缩短通过时间或膜病变→转扩散限制。</tspan></text>
  <text x="726" y="844.5" font-size="9.5" fill="#475569">CO 与 Hb 亲和极强、分压差不耗竭→纯扩散限制探针（DLCO 测定）。</text>
  <text x="726" y="876" font-size="9.5" fill="#475569">A-a 梯度＝P<tspan dy="2.1" font-size="6.8">AO2</tspan><tspan dy="-2.1">−P</tspan><tspan dy="2.1" font-size="6.8">aO2</tspan><tspan dy="-2.1">：健康青年 5–15 mmHg、随年龄加宽；正常＝低通气或吸入气因素，扩大＝V/Q 失调、分流、扩散障碍。</tspan></text>
  <text x="726" y="912" font-size="9.5" fill="#64748b">师生之争：Christian Bohr 主张肺泡主动「分泌」O<tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1">，其学生 Krogh 以精密分压测量证明被动扩散足以解释全部交换（1920 诺贝尔奖）。</tspan></text>
</svg>