  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">肺换气与通气/血流比：容积计量、死腔折扣与 V/Q 匹配</text>
  <text x="700" y="74" text-anchor="middle" font-size="17" fill="#64748b">潮气量500ml中仅（TV−V<tspan dy="3.7" font-size="12.2">D</tspan><tspan dy="-3.7">）×f有效（解剖死腔约150ml），同样6L/min分钟通气量浅快呼吸的V</tspan><tspan dy="3.7" font-size="12.2">A</tspan><tspan dy="-3.7">从4.2跌至2.4L/min；总体V/Q≈0.8（通气4∶血流5L/min），</tspan></text>
  <text x="700" y="100" text-anchor="middle" font-size="17" fill="#64748b">死腔样→∞（肺栓塞）与分流样→0（肺不张）为两极端；CO<tspan dy="3.7" font-size="12.2">2</tspan><tspan dy="-3.7">扩散能力约为O</tspan><tspan dy="3.7" font-size="12.2">2</tspan><tspan dy="-3.7">的20倍</tspan></text>
  <rect x="30" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、四个容积与四个容量：呼吸计量的积木</text>
  <line x1="120" y1="480" x2="120" y2="152" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-ink)"/>
  <line x1="120" y1="480" x2="260" y2="480" stroke="#475569" stroke-width="1.8"/>
  <text x="130" y="172" font-size="10" fill="#475569">容积 (ml)</text>
  <line x1="114" y1="480" x2="120" y2="480" stroke="#475569" stroke-width="1.6"/>
  <text x="110" y="484" font-size="9.5" fill="#64748b" text-anchor="end">0</text>
  <line x1="114" y1="376" x2="120" y2="376" stroke="#475569" stroke-width="1.6"/>
  <text x="110" y="380" font-size="9.5" fill="#64748b" text-anchor="end">2000</text>
  <line x1="114" y1="272" x2="120" y2="272" stroke="#475569" stroke-width="1.6"/>
  <text x="110" y="276" font-size="9.5" fill="#64748b" text-anchor="end">4000</text>
  <line x1="114" y1="168" x2="120" y2="168" stroke="#475569" stroke-width="1.6"/>
  <text x="110" y="172" font-size="9.5" fill="#64748b" text-anchor="end">6000</text>
  <rect x="150" y="417.6" width="80" height="62.4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="150" y="355.2" width="80" height="62.4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <rect x="150" y="329.2" width="80" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <rect x="150" y="178.4" width="80" height="150.8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="190" y="252" font-size="9.5" fill="#134e4a" text-anchor="middle" font-weight="600">补吸气量</text>
  <text x="190" y="268" font-size="9.5" fill="#64748b" text-anchor="middle">IRV 3000</text>
  <text x="190" y="345" font-size="8.5" fill="#78350f" text-anchor="middle" font-weight="600">TV 500</text>
  <text x="190" y="380" font-size="9.5" fill="#075985" text-anchor="middle" font-weight="600">补呼气量</text>
  <text x="190" y="396" font-size="9.5" fill="#64748b" text-anchor="middle">ERV 1200</text>
  <text x="190" y="445" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="600">残气量</text>
  <text x="190" y="461" font-size="9.5" fill="#64748b" text-anchor="middle">RV 1200</text>
  <text x="46" y="331" font-size="9.5" fill="#78350f" font-weight="600">潮气量 TV</text>
  <text x="46" y="345" font-size="9.5" fill="#64748b">500 ml</text>
  <line x1="94" y1="342" x2="148" y2="342" stroke="#b45309" stroke-width="1.3"/>
  <line x1="110" y1="355.2" x2="665" y2="355.2" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="450" y="349" font-size="9" fill="#64748b">平静呼气末基线（FRC 位）</text>
  <line x1="240" y1="178.4" x2="240" y2="480" stroke="#64748b" stroke-width="1.2"/>
  <line x1="234" y1="178.4" x2="246" y2="178.4" stroke="#64748b" stroke-width="1.2"/>
  <line x1="234" y1="480" x2="246" y2="480" stroke="#64748b" stroke-width="1.2"/>
  <text x="252" y="320" font-size="10" fill="#475569" font-weight="700">肺总量 TLC</text>
  <text x="252" y="336" font-size="9.5" fill="#64748b">≈5800 ml</text>
  <line x1="340" y1="178.4" x2="340" y2="355.2" stroke="#0369a1" stroke-width="1.4"/>
  <line x1="334" y1="178.4" x2="346" y2="178.4" stroke="#0369a1" stroke-width="1.4"/>
  <line x1="334" y1="355.2" x2="346" y2="355.2" stroke="#0369a1" stroke-width="1.4"/>
  <text x="352" y="250" font-size="10" fill="#075985" font-weight="700">肺活量 VC</text>
  <text x="352" y="266" font-size="9.5" fill="#64748b">IRV+TV+ERV</text>
  <text x="352" y="282" font-size="9.5" fill="#64748b">≈4600 ml</text>
  <line x1="340" y1="355.2" x2="340" y2="480" stroke="#be185d" stroke-width="1.4"/>
  <line x1="334" y1="355.2" x2="346" y2="355.2" stroke="#be185d" stroke-width="1.4"/>
  <line x1="334" y1="480" x2="346" y2="480" stroke="#be185d" stroke-width="1.4"/>
  <text x="352" y="400" font-size="10" fill="#831843" font-weight="700">功能残气量 FRC</text>
  <text x="352" y="416" font-size="9.5" fill="#64748b">ERV+RV</text>
  <text x="352" y="432" font-size="9.5" fill="#64748b">≈2400–2500 ml</text>
  <text x="450" y="210" font-size="9.5" fill="#475569">残气量与含残气量的容量（FRC、TLC）</text>
  <text x="450" y="224.5" font-size="9.5" fill="#475569">无法被普通肺活量计直接测出——受试者永远吹不出最后约 1200 ml，</text>
  <text x="450" y="239" font-size="9.5" fill="#475569">须氦气稀释法或体描法间接推算。</text>
  <text x="450" y="280" font-size="9.5" fill="#475569">FRC 是呼气末「蓄水池」：</text>
  <text x="450" y="294.5" font-size="9.5" fill="#475569">以约 2400 ml 稀释每次 500 ml 新鲜空气，</text>
  <text x="450" y="309" font-size="9.5" fill="#475569">使肺泡气 PO<tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1">、PCO</tspan><tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> 的呼吸周期波动被摊薄；</tspan></text>
  <text x="450" y="323.5" font-size="9.5" fill="#475569">FRC 过小（新生儿、ARDS）</text>
  <text x="450" y="338" font-size="9.5" fill="#475569">→肺泡气近乎「推倒重来」。</text>
  <text x="46" y="508" font-size="9.5" fill="#475569">两个及以上容积相加构成容量：VC=IRV+TV+ERV、FRC=ERV+RV、IC=TV+IRV；</text>
  <text x="46" y="522.5" font-size="9.5" fill="#475569">1846 年 Hutchinson 以水封式肺活量计用肺活量预测投保人寿命，远见后被流行病学充分证实。</text>
  <rect x="710" y="132" width="660" height="430" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、肺泡通气量：死腔的折扣</text>
  <text x="726" y="176" font-size="14" fill="#1e293b" font-weight="700">V<tspan dy="3.1" font-size="10.1">A</tspan><tspan dy="-3.1"> =（TV − V</tspan><tspan dy="3.1" font-size="10.1">D</tspan><tspan dy="-3.1">）× f</tspan></text>
  <text x="920" y="176" font-size="9.5" fill="#64748b">解剖死腔 V<tspan dy="2.1" font-size="6.8">D</tspan><tspan dy="-2.1"> ≈ 150 ml：鼻腔→终末细支气管，只传导、不换气</tspan></text>
  <rect x="726" y="220" width="300" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="740" y="244" font-size="11" fill="#075985" font-weight="700">深慢呼吸：TV 500 × f 12</text>
  <text x="797" y="260" font-size="9" fill="#64748b" text-anchor="middle">死腔 150</text>
  <text x="922" y="260" font-size="9" fill="#065f46" text-anchor="middle">入肺泡 350 ml</text>
  <rect x="760" y="268" width="75" height="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="835" y="268" width="175" height="18" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="760" y="304" font-size="9.5" fill="#64748b">V_E = 6.0 L/min</text>
  <text x="760" y="322" font-size="9.5" fill="#475569">V_A =（500−150）×12</text>
  <text x="760" y="345" font-size="12" fill="#065f46" font-weight="700">= 4.2 L/min</text>
  <text x="760" y="366" font-size="9.5" fill="#64748b">死腔占比 30%</text>
  <rect x="1050" y="220" width="306" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1064" y="244" font-size="11" fill="#991b1b" font-weight="700">浅快呼吸：TV 250 × f 24</text>
  <text x="1121" y="260" font-size="9" fill="#64748b" text-anchor="middle">死腔 150</text>
  <text x="1184" y="260" font-size="9" fill="#92400e" text-anchor="middle">入肺泡 100</text>
  <rect x="1084" y="268" width="75" height="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="1159" y="268" width="50" height="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="1084" y="304" font-size="9.5" fill="#64748b">V_E = 6.0 L/min（不变！）</text>
  <text x="1084" y="322" font-size="9.5" fill="#475569">V_A =（250−150）×24</text>
  <text x="1084" y="345" font-size="12" fill="#991b1b" font-weight="700">= 2.4 L/min</text>
  <text x="1084" y="366" font-size="9.5" fill="#64748b">死腔占比 60%</text>
  <text x="726" y="412" font-size="9.5" fill="#475569">同样的分钟通气量 V_E，浅快呼吸的有效肺泡通气近乎腰斩——发热与代谢性酸中毒时中枢选择加深呼吸（Kussmaul 呼吸）的算术原因。</text>
  <text x="726" y="448" font-size="9.5" fill="#475569">Bohr 方程：生理死腔 V<tspan dy="2.1" font-size="6.8">D</tspan><tspan dy="-2.1">/V</tspan><tspan dy="2.1" font-size="6.8">T</tspan><tspan dy="-2.1"> =（PaCO</tspan><tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> − P</tspan><tspan dy="2.1" font-size="6.8">E</tspan><tspan dy="-2.1">CO</tspan><tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1">）/PaCO</tspan><tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1">；正常人肺泡死腔≈0、生理死腔≈解剖死腔，比值升高即提示换气效率受损。</tspan></text>
  <text x="726" y="492" font-size="9.5" fill="#475569">肺泡气方程：P<tspan dy="2.1" font-size="6.8">AO2</tspan><tspan dy="-2.1"> ≈ P</tspan><tspan dy="2.1" font-size="6.8">IO2</tspan><tspan dy="-2.1"> − P</tspan><tspan dy="2.1" font-size="6.8">ACO2</tspan><tspan dy="-2.1">/R ≈ 150 − 40/0.8 = 100 mmHg——通气率是肺泡 PO</tspan><tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> 的「阀门」，CO</tspan><tspan dy="2.1" font-size="6.8">2</tspan><tspan dy="-2.1"> 则是被控变量（第 4 节）。</tspan></text>
  <rect x="30" y="582" width="660" height="390" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="604.84" font-size="19" fill="#475569" font-weight="700">三、通气/血流比：理想 0.8 与两个极端</text>
  <text x="143" y="630" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">① 理想 V/Q≈0.8</text>
  <text x="349" y="630" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">② 死腔样 V/Q→∞</text>
  <text x="555" y="630" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">③ 分流样 V/Q→0</text>
