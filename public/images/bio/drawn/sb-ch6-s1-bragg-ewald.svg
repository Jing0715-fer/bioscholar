<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">X 射线源与衍射几何：布拉格定律与 Ewald 反射球</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">2dsinθ=nλ（λ=1Å：d=2.0/1.0/0.8Å对应θ=14.5°/30.0°/38.7°）；Ewald球半径1/λ五步作图；亮度阶梯10<tspan dy="-5.8" font-size="12.2">8</tspan><tspan dy="5.8">到10</tspan><tspan dy="-5.8" font-size="12.2">22</tspan><tspan dy="5.8">；CuKα1.5418Å/Se边0.9795Å/短波0.5Å</tspan></text>
  <rect x="30" y="132" width="660" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、布拉格定律：把衍射当反射处理</text>
  <line x1="90" y1="250" x2="320" y2="250" stroke="#0369a1" stroke-width="2.2"/>
  <line x1="90" y1="290" x2="320" y2="290" stroke="#0369a1" stroke-width="2.2"/>
  <line x1="90" y1="330" x2="320" y2="330" stroke="#0369a1" stroke-width="2.2"/>
  <text x="340" y="250" font-size="10.5" fill="#64748b" text-anchor="middle">晶面族 (hkl)</text>
  <line x1="110" y1="380" x2="200" y2="252" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <line x1="200" y1="252" x2="290" y2="380" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <text x="140" y="366" font-size="10.5" fill="#134e4a" text-anchor="middle">入射 θ</text>
  <text x="262" y="366" font-size="10.5" fill="#134e4a" text-anchor="middle">衍射 θ</text>
  <line x1="330" y1="250" x2="330" y2="290" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="330" y1="290" x2="330" y2="330" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="348" y="272" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">d</text>
  <path d="M 148,338 A 44 44 0 0 1 178,316" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="196" y="322" font-size="10.5" fill="#475569" text-anchor="middle">相邻面反射程差 = 2d sinθ</text>
  <rect x="414.2035" y="187.25" width="111.59299999999998" height="25.5" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="470" y="205.4" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">2d sinθ = nλ</text>
  <text x="400" y="236" font-size="10.5" fill="#475569">程差为波长整数倍时各面反射相干叠加成衍射斑。</text>
  <text x="400" y="251" font-size="10.5" fill="#475569">λ = 1 Å 时：</text>
  <text x="400" y="266" font-size="10.5" fill="#475569">d = 2.0/1.0/0.8 Å 对应 θ = 14.5°/30.0°/38.7°；</text>
  <text x="400" y="281" font-size="10.5" fill="#475569">d<tspan dy="2.3" font-size="7.6">min</tspan><tspan dy="-2.3"> = λ/(2 sinθ</tspan><tspan dy="2.3" font-size="7.6">max</tspan><tspan dy="-2.3">) 给出分辨率极限。</tspan></text>
  <text x="70" y="400" font-size="10.5" fill="#475569">实验室源：Cu Kα = 1.5418 Å、Mo Kα = 0.7107 Å（密封管/旋转阳极/微焦源）；</text>
  <text x="70" y="415" font-size="10.5" fill="#475569">同步辐射波长连续可调——反常散射定相的先决条件。</text>
  <rect x="30" y="452" width="660" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="474.84" font-size="19" fill="#475569" font-weight="700">二、Ewald 反射球：旋转晶体的衍射罗盘</text>
  <circle cx="250" cy="640" r="120" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.4"/>
  <text x="250" y="666" font-size="10.5" fill="#075985" text-anchor="middle">反射球（半径 1/λ）</text>
  <circle cx="250" cy="640" r="5" fill="#dc2626" stroke="none"/>
  <text x="264" y="628" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="700">晶体</text>
  <line x1="40" y1="470" x2="248" y2="638" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-dna)"/>
  <text x="72" y="488" font-size="10.5" fill="#134e4a" text-anchor="middle">入射波矢 k<tspan dy="2.3" font-size="7.6">0</tspan><tspan dy="-2.3">（长度 1/λ）</tspan></text>
  <line x1="250" y1="640" x2="366" y2="672" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-dna)"/>
  <text x="342" y="694" font-size="10.5" fill="#134e4a" text-anchor="middle">衍射束 k</text>
  <circle cx="366" cy="672" r="4" fill="#dc2626" stroke="none"/>
  <circle cx="382" cy="702" r="2.6" fill="#94a3b8" stroke="none"/>
  <circle cx="346" cy="702" r="4" fill="#dc2626" stroke="none"/>
  <circle cx="400" cy="732" r="2.6" fill="#94a3b8" stroke="none"/>
  <circle cx="428" cy="650" r="2.6" fill="#94a3b8" stroke="none"/>
  <circle cx="400" cy="622" r="2.6" fill="#94a3b8" stroke="none"/>
  <text x="402" y="758" font-size="10" fill="#475569" text-anchor="middle">倒易格点：落在球面上即满足布拉格条件</text>
  <text x="430" y="486" font-size="10.5" fill="#475569">五步作图：① 画半径 1/λ 的球，晶体置于球心；</text>
  <text x="430" y="501" font-size="10.5" fill="#475569">② 入射方向指向球面；</text>
  <text x="430" y="516" font-size="10.5" fill="#475569">③ 倒易点阵原点取在出射束与球面交点；</text>
  <text x="430" y="531" font-size="10.5" fill="#475569">④ 晶体旋转时倒易点阵同步旋转；</text>
  <text x="430" y="546" font-size="10.5" fill="#475569">⑤ 格点扫过球面的一瞬产生衍射斑。</text>
  <text x="430" y="592" font-size="10.5" fill="#475569">限制球半径 2/λ 圈定可及的倒易空间；</text>
  <text x="430" y="607" font-size="10.5" fill="#475569">分辨率从 2 Å 提高到 1 Å，</text>
  <text x="430" y="622" font-size="10.5" fill="#475569">反射数约增 8 倍——高分辨率数据代价陡增的几何根源。</text>
  <text x="360" y="766" font-size="10" fill="#64748b" text-anchor="middle">旋转法（每帧 0.1–1.0°）的几何解释见第 6 章第 2 节</text>
  <rect x="710" y="132" width="660" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">三、光源亮度阶梯（单位 ph/s/mm²/mrad²/0.1%bw）</text>
  <rect x="730" y="172" width="170" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="199.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">光源</text>
  <rect x="900" y="172" width="150" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="975" y="199.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">亮度量级</text>
  <rect x="1050" y="172" width="300" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1200" y="199.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">特征</text>
  <rect x="730" y="216" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="238.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">密封管/旋转阳极</text>
  <rect x="900" y="216" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="975" y="238.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">约 10<tspan dy="-3.7" font-size="7.9">8</tspan><tspan dy="3.7">–10</tspan><tspan dy="-3.7" font-size="7.9">9</tspan></text>
  <rect x="1050" y="216" width="300" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1200" y="238.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">Cu Kα 1.5418 Å，家用日常</text>
  <rect x="730" y="250" width="620" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="250" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="272.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">弯铁同步辐射</text>
  <rect x="900" y="250" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="975" y="272.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">约 10<tspan dy="-3.7" font-size="7.9">12</tspan><tspan dy="3.7">–10</tspan><tspan dy="-3.7" font-size="7.9">13</tspan></text>
  <rect x="1050" y="250" width="300" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1200" y="272.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">第一代与二代光源主力</text>
  <rect x="730" y="284" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="306.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">波荡器（三代）</text>
  <rect x="900" y="284" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="975" y="306.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">约 10<tspan dy="-3.7" font-size="7.9">15</tspan><tspan dy="3.7">–10</tspan><tspan dy="-3.7" font-size="7.9">17</tspan></text>
  <rect x="1050" y="284" width="300" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1200" y="306.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">准单色谐波、能量可调</text>
  <rect x="730" y="318" width="620" height="34" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="730" y="318" width="170" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="815" y="340.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">低发射度扩散源</text>
  <rect x="900" y="318" width="150" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="975" y="340.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">约 10<tspan dy="-3.7" font-size="7.9">18</tspan><tspan dy="3.7">–10</tspan><tspan dy="-3.7" font-size="7.9">22</tspan></text>
  <rect x="1050" y="318" width="300" height="34" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="1200" y="340.5" font-size="11" fill="#475569" text-anchor="middle" font-weight="500">MAX IV 首创，束流更亮更稳</text>
  <text x="1040" y="336" font-size="10.5" fill="#64748b" text-anchor="middle">上海光源 SSRF（3.5 GeV）与北京高能光源 HEPS 服务国内结构生物学</text>
  <rect x="710" y="372" width="660" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="394.84" font-size="19" fill="#475569" font-weight="700">四、波长选择的战场</text>
  <text x="730" y="412" font-size="10.5" fill="#475569">常规收数取 0.9–1.0 Å（损伤与吸收的平衡点）；SeMet 反常定相需在 Se 吸收边 0.9795 Å 附近微调（峰/拐点/远边三波长，</text>
  <text x="730" y="428" font-size="10.5" fill="#475569">见第 7 章）；短波长 0.5 Å 削弱吸收与角度依赖的损伤——串行晶体学常用；家用 1.5418 Å 便利但吸收强。</text>
  <text x="730" y="490" font-size="10.5" fill="#475569">光束准直：光斑 20–100 μm 与晶体尺寸匹配；单色器带宽 ΔE/E 约 10<tspan dy="-3.6" font-size="7.6">−4</tspan><tspan dy="3.6"> 保持衍射斑锐利。</tspan></text>
  <text x="30" y="620" font-size="11.5" fill="#1e293b" font-weight="600">亮度每上一个台阶，可用晶体尺寸就小一号、曝光就短一截、数据就精一分——从劳厄的硫酸铜到波荡器上的微晶，几何定律未曾改变，改变的只是把格点推上球面的力量。</text>
</svg>