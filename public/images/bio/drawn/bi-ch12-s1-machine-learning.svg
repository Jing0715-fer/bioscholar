<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Noto Serif SC, LXGW WenKai, Songti SC, serif">
  <defs>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arr-dna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="arr-rna" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-pro" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
    <marker id="arr-enz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/></marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">机器学习在生物信息学中的应用：五环节、泄漏、过拟合与 AUC</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">五环节与测试集只碰一次；两大泄漏：预筛回头分类、按样本伪独立；p≫n 过拟合用 L1/L2 正则化；AUC 取值 0.5–1；阳性率 1% 时 99% 准确率毫无价值</text>
  <rect x="30" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、监督学习五环节：测试集只许碰一次</text>
  <rect x="50" y="200" width="104" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="102" y="233" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">① 特征表示</text>
  <line x1="156" y1="228" x2="168" y2="228" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="172" y="200" width="104" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="224" y="233" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">② 数据划分</text>
  <line x1="278" y1="228" x2="290" y2="228" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="294" y="200" width="104" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="346" y="233" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">③ 模型训练</text>
  <line x1="400" y1="228" x2="412" y2="228" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="416" y="200" width="104" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="468" y="233" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">④ 交叉验证</text>
  <line x1="522" y1="228" x2="534" y2="228" stroke="#0369a1" stroke-width="1.8" marker-end="url(#arr-acc)"/>
  <rect x="538" y="200" width="104" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="590" y="233" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">⑤ 泛化评估</text>
  <text x="50" y="296" font-size="12" fill="#1e293b" font-weight="700">② 数据划分的三分结构：</text>
  <rect x="50" y="312" width="360" height="34" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.7"/>
  <text x="230" y="334" font-size="11.5" fill="#075985" text-anchor="middle" font-weight="700">训练集（拟合参数）</text>
  <rect x="410" y="312" width="120" height="34" fill="#fce7f3" stroke="#be185d" stroke-width="1.7"/>
  <text x="470" y="334" font-size="11.5" fill="#831843" text-anchor="middle" font-weight="700">验证集（调参）</text>
  <rect x="530" y="312" width="120" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7" stroke-dasharray="6 4"/>
  <text x="590" y="334" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">测试集（终审）</text>
  <text x="50" y="386" font-size="11" fill="#475569">交叉验证只在训练＋验证内部轮转；测试集在最终评估前只许碰一次——每多碰一次，报告的泛化性能就多一分乐观偏差。</text>
  <text x="50" y="424" font-size="11" fill="#475569">示例：特征 = 基因表达向量，标签 = 肿瘤 / 正常；模型 = 逻辑回归、SVM、随机森林、梯度提升树。</text>
  <rect x="710" y="132" width="660" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="154.84" font-size="19" fill="#475569" font-weight="700">二、两大泄漏陷阱：循环论证与伪独立</text>
  <text x="740" y="196" font-size="12.5" fill="#dc2626" font-weight="700">陷阱 A：循环论证</text>
  <rect x="740" y="220" width="250" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="865" y="245" font-size="11" fill="#475569" text-anchor="middle">差异分析选 top 基因（用全部样本）</text>
  <line x1="865" y1="262" x2="865" y2="288" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <rect x="740" y="294" width="250" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="865" y="319" font-size="11" fill="#475569" text-anchor="middle">用这些基因训练分类器</text>
  <line x1="865" y1="336" x2="865" y2="362" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-bad)"/>
  <rect x="740" y="368" width="250" height="40" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="865" y="393" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">验证折上准确率虚高</text>
  <path d="M 998,388 C 1022,388 1022,240 998,240" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-bad)"/>
  <text x="740" y="424" font-size="10.5" fill="#475569">预筛在划分数据前进行，验证折信息已泄入特征，</text>
  <text x="740" y="439" font-size="10.5" fill="#475569">性能因此虚高（循环论证）。</text>
  <text x="1050" y="196" font-size="12.5" fill="#dc2626" font-weight="700">陷阱 B：伪独立</text>
  <rect x="1050" y="216" width="140" height="122" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1120" y="240" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">训练集</text>
  <rect x="1200" y="216" width="140" height="122" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="1270" y="240" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">测试集</text>
  <line x1="1098" y1="268" x2="1242" y2="268" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.85"/>
  <circle cx="1090" cy="268" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <circle cx="1250" cy="268" r="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="1070" y="272" font-size="10.5" fill="#64748b" text-anchor="middle">P1</text>
  <line x1="1098" y1="294" x2="1242" y2="294" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.85"/>
  <circle cx="1090" cy="294" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <circle cx="1250" cy="294" r="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="1070" y="298" font-size="10.5" fill="#64748b" text-anchor="middle">P2</text>
  <line x1="1098" y1="320" x2="1242" y2="320" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.85"/>
  <circle cx="1090" cy="320" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <circle cx="1250" cy="320" r="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="1070" y="324" font-size="10.5" fill="#64748b" text-anchor="middle">P3</text>
  <text x="1050" y="360" font-size="10.5" fill="#475569">按样本而非按患者划分 → 同一患者的样本横跨两侧，</text>
  <text x="1050" y="375" font-size="10.5" fill="#475569">测试集不再独立（伪独立）。</text>
  <text x="1050" y="404" font-size="10.5" fill="#065f46" font-weight="700">正确做法：按患者整体划分训练与测试（患者级 k 折）。</text>
  <text x="740" y="480" font-size="11" fill="#475569">泄漏的共同结构：验证 / 测试数据的信息，以任何途径进入特征选择、参数或流程——结果都不可信。</text>
  <rect x="30" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="598.84" font-size="19" fill="#475569" font-weight="700">三、过拟合：p ≫ n 的结构与学习曲线裂缝</text>
  <rect x="110" y="670" width="280" height="260" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="110" y1="865" x2="390" y2="865" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="180" y1="930" x2="180" y2="670" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="110" y1="800" x2="390" y2="800" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="250" y1="930" x2="250" y2="670" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="110" y1="735" x2="390" y2="735" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="320" y1="930" x2="320" y2="670" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="110" y1="930" x2="110" y2="936" stroke="#475569" stroke-width="1.8"/>
  <text x="110" y="952" font-size="13" fill="#64748b" text-anchor="middle">小</text>
  <line x1="390" y1="930" x2="390" y2="936" stroke="#475569" stroke-width="1.8"/>
  <text x="390" y="952" font-size="13" fill="#64748b" text-anchor="middle">大</text>
  <text x="250" y="974" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">训练样本量 n →</text>
  <text x="250" y="658" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">学习曲线：性能 vs 样本量</text>
  <path d="M110.0,768.8 L152.0,735.0 L194.0,711.6 L250.0,696.0 L306.0,685.6 L390.0,677.8" fill="none" stroke="#0f766e" stroke-width="2.2"/>
  <text x="196.4" y="690.8" font-size="14" fill="#0f766e" font-weight="700">训练性能</text>
  <path d="M110.0,852.0 L152.0,831.2 L194.0,805.2 L250.0,774.0 L306.0,748.0 L390.0,727.2" fill="none" stroke="#be185d" stroke-width="2.2"/>
  <text x="190.8" y="831.2" font-size="14" fill="#be185d" font-weight="700">验证性能</text>
  <line x1="264" y1="700" x2="264" y2="757" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-bad)" marker-start="url(#arr-bad)"/>
  <text x="285" y="732" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">泛化裂缝</text>
  <text x="420" y="650" font-size="13" fill="#1e293b" font-weight="700">过拟合的来源与对策</text>
  <text x="420" y="676" font-size="11" fill="#475569">p ≫ n（特征远多于样本）时，模型足以记住噪声：</text>
  <text x="420" y="691" font-size="11" fill="#475569">训练性能高、验证性能低，裂缝即体征。</text>
  <text x="420" y="746" font-size="11" fill="#475569">首选对策：L1（稀疏选择）、L2（权重收缩）</text>
  <text x="420" y="761" font-size="11" fill="#475569">正则化；特征选择分过滤式、包裹式、</text>
  <text x="420" y="776" font-size="11" fill="#475569">嵌入式三型。</text>
  <text x="420" y="816" font-size="11" fill="#475569">小样本须报告 bootstrap 选择稳定性；</text>
  <text x="420" y="831" font-size="11" fill="#475569">通路级特征聚合，常比裸分子更稳健。</text>
  <rect x="710" y="576" width="660" height="404" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="726" y="598.84" font-size="19" fill="#475569" font-weight="700">四、ROC-AUC 与类别不平衡的准确率陷阱</text>
  <rect x="780" y="680" width="250" height="250" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <line x1="780" y1="867.5" x2="1030" y2="867.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="842.5" y1="930" x2="842.5" y2="680" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="780" y1="805" x2="1030" y2="805" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="905" y1="930" x2="905" y2="680" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="780" y1="742.5" x2="1030" y2="742.5" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="967.5" y1="930" x2="967.5" y2="680" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="4 5" opacity="0.55"/>
  <line x1="780" y1="930" x2="780" y2="936" stroke="#475569" stroke-width="1.8"/>
  <text x="780" y="952" font-size="13" fill="#64748b" text-anchor="middle">0</text>
  <line x1="1030" y1="930" x2="1030" y2="936" stroke="#475569" stroke-width="1.8"/>
  <text x="1030" y="952" font-size="13" fill="#64748b" text-anchor="middle">1</text>
  <line x1="774" y1="930" x2="780" y2="930" stroke="#475569" stroke-width="1.8"/>
  <text x="770" y="934" font-size="13" fill="#64748b" text-anchor="end">0</text>
  <line x1="774" y1="680" x2="780" y2="680" stroke="#475569" stroke-width="1.8"/>
  <text x="770" y="684" font-size="13" fill="#64748b" text-anchor="end">1</text>
  <text x="905" y="974" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">假阳性率 →</text>
  <text x="905" y="668" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">ROC 曲线：真阳性率 vs 假阳性率</text>
  <line x1="780" y1="930" x2="1030" y2="680" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
  <path d="M780.0,930.0 L785.0,842.5 L795.0,780.0 L810.0,742.5 L842.5,710.0 L905.0,692.5 L1030.0,680.0" fill="none" stroke="#0f766e" stroke-width="2.4"/>
  <rect x="790" y="947.59" width="11.55" height="8.82" rx="3" fill="#0f766e" stroke="#cbd5e1" stroke-width="1"/>
  <text x="809.55" y="955.78" font-size="10.5" fill="#475569">ROC 曲线</text>
  <rect x="871.44" y="947.59" width="11.55" height="8.82" rx="3" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="890.99" y="955.78" font-size="10.5" fill="#475569">随机水平 AUC = 0.5</text>
  <text x="1060" y="650" font-size="13" fill="#1e293b" font-weight="700">AUC 的概率释义</text>
  <text x="1060" y="676" font-size="11" fill="#475569">随机取一阳一阴，阳性得分更高的概率。取值 0.5–1：</text>
  <text x="1060" y="691" font-size="11" fill="#475569">0.5 为随机水平、1 为完美分离，</text>
  <text x="1060" y="706" font-size="11" fill="#475569">是阈值无关的整体判别度量。</text>
  <text x="1060" y="750" font-size="12.5" fill="#dc2626" font-weight="700">准确率陷阱：阳性率 1%</text>
  <rect x="1060" y="770" width="290" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1205" y="792" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">「全部预测阴性」策略</text>
  <text x="1205" y="814" font-size="10.5" fill="#475569" text-anchor="middle">准确率 99% · 召回 0 · 毫无价值</text>
  <text x="1060" y="856" font-size="11" fill="#475569">对策：平衡指标、类别加权或重采样；</text>
  <text x="1060" y="871" font-size="11" fill="#475569">并以外部验证集作泛化终审。</text>
</svg>