  <text x="1095" y="287" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">天然构象</text>
  <text x="1095" y="305" font-size="9.5" fill="#475569" text-anchor="middle">自发重氧化</text>
  <circle cx="1056" cy="272" r="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
  <circle cx="1066" cy="272" r="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
