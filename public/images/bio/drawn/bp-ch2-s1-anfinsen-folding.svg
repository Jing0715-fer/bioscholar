  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">Anfinsen 实验与折叠自组织：从序列到唯一天然态</text>
  <text x="700" y="90" text-anchor="middle" font-size="17" fill="#64748b">RNaseA（124aa、4个二硫键）经8mol/L尿素+β-巯基乙醇变性后透析复性、活性几乎全恢复（1972诺奖）；Levinthal悖论3¹⁰⁰≈10⁴⁸构象vs毫秒级折叠→能量漏斗下坡通道</text>
  <rect x="30" y="132" width="1340" height="400" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="154.84" font-size="19" fill="#475569" font-weight="700">一、Anfinsen 实验：RNase A 的变性—复性（获 1972 年诺贝尔化学奖）</text>
