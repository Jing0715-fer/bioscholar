  <text x="630" y="212" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">② 完全去折叠、失活</text>
  <text x="1095" y="212" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">③ 复性：自发重新氧化</text>
