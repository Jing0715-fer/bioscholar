    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="56" text-anchor="middle" font-size="33" font-weight="700" fill="#1e293b">钾通道选择性滤器：以配位几何识别离子（KcsA）</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" fill="#64748b">主链羰基氧串成氧原子笼——用「化学键几何」而非「孔径筛分」区分 K⁺ 与 Na⁺（PDB 1BL8）</text>
  <rect x="30" y="150" width="410" height="700" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="172.84" font-size="19" fill="#475569" font-weight="700">一、氧原子笼：主链羰基氧</text>
  <circle cx="240" cy="330" r="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.4"/>
  <text x="240" y="335" font-size="13" fill="#134e4a" text-anchor="middle" font-weight="700">K⁺</text>
  <circle cx="240" cy="244" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="248" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">O</text>
  <line x1="240" y1="330" x2="240" y2="244" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="240" cy="416" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="420" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">O</text>
  <line x1="240" y1="330" x2="240" y2="416" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="154" cy="330" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="154" y="334" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">O</text>
  <line x1="240" y1="330" x2="154" y2="330" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="326" cy="330" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="326" y="334" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">O</text>
  <line x1="240" y1="330" x2="326" y2="330" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="206.5299" y="199.075" width="66.9402" height="17.849999999999998" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="240" y="211.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">C=O 羰基氧</text>
  <text x="240" y="452" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">配位距离 ~2.8 Å</text>
  <text x="60" y="492" font-size="11.5" fill="#475569">每层来自 4 个亚基的主链 C=O（截面示 2 个 + 斜向 2 个），</text>
  <text x="60" y="509" font-size="11.5" fill="#475569">沿滤器串联成 4 个配位位点 S₁–S₄（共 16 个氧，层间距约 3 Å）。</text>
  <text x="60" y="588" font-size="11.5" fill="#475569">基序 Thr-Val-Gly-Tyr-Gly（TVGYG）</text>
  <text x="60" y="605" font-size="11.5" fill="#475569">在全部钾通道中近乎完全保守——滤器几何即水化壳几何的「复刻」。</text>
  <rect x="470" y="150" width="400" height="710" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="486" y="172.84" font-size="19" fill="#475569" font-weight="700">二、KcsA 孔道纵剖面</text>
  <polygon points="530,214 810,214 726,286 614,286" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="670" y="246" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">细胞外外庭</text>
  <rect x="614" y="286" width="112" height="190" fill="#ffffff" stroke="#dc2626" stroke-width="2.2"/>
  <rect x="814.9625" y="291.075" width="66.075" height="17.849999999999998" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="848" y="303.78" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">选择性滤器</text>
  <rect x="816" y="317.5" width="64" height="17" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="848" y="329.6" font-size="10" fill="#475569" text-anchor="middle">（约 12 Å）</text>
  <circle cx="670" cy="318" r="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="670" y="322" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">K⁺</text>
  <circle cx="670" cy="358" r="8.5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="670" y="362" font-size="8.5" fill="#075985" text-anchor="middle" font-weight="700">H₂O</text>
  <circle cx="670" cy="398" r="11" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="670" y="402" font-size="10" fill="#134e4a" text-anchor="middle" font-weight="700">K⁺</text>
  <circle cx="670" cy="438" r="8.5" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="670" y="442" font-size="8.5" fill="#075985" text-anchor="middle" font-weight="700">H₂O</text>
  <text x="596" y="322" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">S₁</text>
  <text x="596" y="362" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">S₂</text>
  <text x="596" y="402" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">S₃</text>
  <text x="596" y="442" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">S₄</text>
  <ellipse cx="670" cy="560" rx="88" ry="78" fill="#e0f2fe" fill-opacity="0.6" stroke="#0369a1" stroke-width="1.8"/>
  <circle cx="670" cy="560" r="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="670" y="565" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">K⁺</text>
  <circle cx="704" cy="560" r="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="687" cy="585.9807621135332" r="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="653" cy="585.9807621135332" r="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="636" cy="560" r="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="653" cy="534.0192378864668" r="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="687" cy="534.0192378864668" r="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
  <rect x="820.37" y="537.075" width="55.26" height="17.849999999999998" rx="7" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="848" y="549.78" font-size="10.5" fill="#075985" text-anchor="middle" font-weight="700">中央水腔</text>
  <rect x="811" y="563.5" width="74.00000000000001" height="17" rx="7" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="848" y="575.6" font-size="10" fill="#475569" text-anchor="middle">（宽约 10 Å）</text>
  <line x1="600" y1="624" x2="636" y2="776" stroke="#6d28d9" stroke-width="5"/>
  <line x1="740" y1="624" x2="704" y2="776" stroke="#6d28d9" stroke-width="5"/>
  <text x="492" y="796" font-size="10.5" fill="#475569">细胞内侧：pH 门控开合的内螺旋门；</text>
  <text x="492" y="811" font-size="10.5" fill="#475569">中央水腔由螺旋偶极静电稳定水合 K⁺；滤器内 K⁺ 与 H₂O 交替排列</text>
  <text x="492" y="826" font-size="10.5" fill="#475569">（knock-on 队列）——新离子自外庭撞入把整列「顶」过去实现高通量，</text>
  <text x="492" y="841" font-size="10.5" fill="#475569">K⁺ 自外向内通过。</text>
  <rect x="900" y="150" width="470" height="700" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="916" y="172.84" font-size="19" fill="#475569" font-weight="700">三、K⁺ 与 Na⁺：以配位几何识别</text>
  <circle cx="1040" cy="300" r="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.4"/>
  <text x="1040" y="306" font-size="14" fill="#134e4a" text-anchor="middle" font-weight="700">K⁺</text>
  <circle cx="1097.2805310156998" cy="323.7263728066356" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1063.7263728066355" cy="357.2805310156998" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1016.2736271933644" cy="357.2805310156998" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="982.7194689843002" cy="323.7263728066356" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="982.7194689843002" cy="276.27362719336446" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1016.2736271933644" cy="242.71946898430025" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1063.7263728066355" cy="242.71946898430022" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1097.2805310156998" cy="276.2736271933644" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1040" cy="300" r="62" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1118" y="268" font-size="12.5" fill="#134e4a" font-weight="700">K⁺（半径 1.33 Å）</text>
  <text x="1118" y="292" font-size="11" fill="#475569">与同层 8 个氧等长配位（~2.8 Å），</text>
  <text x="1118" y="308" font-size="11" fill="#475569">恰与水化 O 配位距离一致——去水化能量损失被完全补偿，</text>
  <text x="1118" y="324" font-size="11" fill="#475569">几乎「无障碍」通过。</text>
  <circle cx="1040" cy="520" r="18" fill="#fce7f3" stroke="#be185d" stroke-width="2.4"/>
  <text x="1040" y="525" font-size="11" fill="#831843" text-anchor="middle" font-weight="700">Na⁺</text>
  <circle cx="1097.2805310156998" cy="543.7263728066356" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1063.7263728066355" cy="577.2805310156998" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1016.2736271933644" cy="577.2805310156998" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="982.7194689843002" cy="543.7263728066356" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="982.7194689843002" cy="496.27362719336446" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1016.2736271933644" cy="462.71946898430025" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1063.7263728066355" cy="462.71946898430025" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1097.2805310156998" cy="496.2736271933644" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="1040" cy="520" r="62" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="1040" y1="520" x2="996" y2="476" stroke="#be185d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="1040" y1="520" x2="1084" y2="476" stroke="#be185d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="1118" y="488" font-size="12.5" fill="#be185d" font-weight="700">Na⁺（半径 0.95 Å）</text>
  <text x="1118" y="512" font-size="11" fill="#475569">半径过小，无法同时贴近同层 4 个氧，</text>
  <text x="1118" y="528" font-size="11" fill="#475569">只能「偏靠」1–2 个（静电补偿不足）</text>
  <text x="1118" y="544" font-size="11" fill="#475569">——选择性较 K⁺ 低约 10⁴ 倍。</text>
  <rect x="924" y="620" width="422" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1135" y="652" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">通道以「配位几何」而非「孔径筛分」识别离子</text>
  <text x="948" y="686" font-size="11.5" fill="#475569">KcsA 结构（PDB 1BL8，X 射线 3.2 Å）</text>
  <text x="948" y="703" font-size="11.5" fill="#475569">确立该范式——Roderick MacKinnon 获 2003 年诺贝尔化学奖。</text>
  <text x="948" y="746" font-size="11.5" fill="#475569">高通量与高选择性并存：氧笼队列 + 中央水腔静电稳定 + 门控调控导通。</text>
</svg>