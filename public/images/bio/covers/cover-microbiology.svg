<?xml version="1.0" encoding="UTF-8"?>
<!-- 依据学科主题自绘矢量封面（代码绘制，非 AI 生成）：微生物学 · 翠微 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Noto Serif SC, LXGW WenKai, Georgia, serif">
  <defs>
    <pattern id="pgr" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1c1917" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#faf8f4"/>
  <rect width="800" height="500" fill="url(#pgr)"/>

  <!-- 细边框 + 角标 -->
  <rect x="22" y="22" width="756" height="456" fill="none" stroke="#059669" stroke-opacity="0.30" stroke-width="1"/>
  <path d="M22,52 V22 H52 M748,22 H778 V52 M778,448 V478 H748 M52,478 H22 V448" fill="none" stroke="#059669" stroke-opacity="0.6" stroke-width="1.6"/>

  <!-- 顶部菱形标记 -->
  <rect x="396.5" y="59.5" width="7" height="7" transform="rotate(45 400 63)" fill="#059669"/>

  <!-- eyebrow -->
  <text x="402" y="94" text-anchor="middle" font-size="12" letter-spacing="3.2" fill="#047857">MICROBIOLOGY · CORE CURRICULUM</text>

  <!-- 书名 -->
  <text x="407" y="224" text-anchor="middle" font-size="80" font-weight="700" letter-spacing="14" fill="#1c1917">微生物学</text>

