  <!-- 元素小注 -->
  <text x="150" y="449" text-anchor="middle" font-size="11.5" letter-spacing="1" fill="#78716c">苯环</text>
  <text x="310" y="449" text-anchor="middle" font-size="11.5" letter-spacing="1" fill="#78716c">吡喃糖环</text>
  <text x="469" y="449" text-anchor="middle" font-size="11.5" letter-spacing="1" fill="#78716c">肽链骨架</text>
  <text x="640" y="449" text-anchor="middle" font-size="11.5" letter-spacing="1" fill="#78716c">三角烧瓶</text>
