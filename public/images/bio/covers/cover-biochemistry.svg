<?xml version="1.0" encoding="UTF-8"?>
<!-- 依据学科主题自绘矢量封面（代码绘制，非 AI 生成）：生物化学 · 琥珀 -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Noto Serif SC, LXGW WenKai, Georgia, serif">
  <defs>
    <pattern id="pgr" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1c1917" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#faf8f4"/>
  <rect width="800" height="500" fill="url(#pgr)"/>

  <!-- 细边框 + 角标 -->
  <rect x="22" y="22" width="756" height="456" fill="none" stroke="#d97706" stroke-opacity="0.30" stroke-width="1"/>
  <path d="M22,52 V22 H52 M748,22 H778 V52 M778,448 V478 H748 M52,478 H22 V448" fill="none" stroke="#d97706" stroke-opacity="0.6" stroke-width="1.6"/>

  <!-- 顶部菱形标记 -->
  <rect x="396.5" y="59.5" width="7" height="7" transform="rotate(45 400 63)" fill="#d97706"/>

  <!-- eyebrow -->
  <text x="402" y="94" text-anchor="middle" font-size="12" letter-spacing="3.2" fill="#b45309">BIOCHEMISTRY · 101 CORE CURRICULUM</text>

  <!-- 书名 -->
  <text x="407" y="224" text-anchor="middle" font-size="80" font-weight="700" letter-spacing="14" fill="#1c1917">生物化学</text>

  <!-- bio-rule 双分隔线 -->
  <line x1="335" y1="262" x2="465" y2="262" stroke="#d97706" stroke-width="2.5"/>
  <line x1="290" y1="269" x2="510" y2="269" stroke="#1c1917" stroke-opacity="0.38" stroke-width="1"/>

  <!-- 副题 -->
  <text x="401" y="304" text-anchor="middle" font-size="16.5" letter-spacing="1.5" fill="#57534e">王镜岩体系 · 12 章 53 节</text>

  <!-- ===== 科学元素线稿带 ===== -->
