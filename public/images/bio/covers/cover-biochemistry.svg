  <circle cx="427" cy="377" r="2.8" fill="#d97706"/>
  <circle cx="439" cy="403" r="2.8" fill="#d97706"/>
  <circle cx="451" cy="377" r="2.8" fill="#d97706"/>
  <circle cx="463" cy="403" r="2.8" fill="#d97706"/>
  <circle cx="475" cy="377" r="2.8" fill="#d97706"/>
  <circle cx="487" cy="403" r="2.8" fill="#d97706"/>
  <circle cx="499" cy="377" r="2.8" fill="#d97706"/>
  <circle cx="511" cy="403" r="2.8" fill="#d97706"/>
  <circle cx="523" cy="390" r="2.8" fill="#d97706"/>

  <!-- 三角烧瓶 -->
  <path d="M632,346 L632,366 L610,428 Q607,438 619,438 L661,438 Q673,438 670,428 L648,366 L648,346" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
  <line x1="626" y1="346" x2="654" y2="346" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
