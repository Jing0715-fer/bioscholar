  <line x1="340" y1="390" x2="340" y2="402" stroke="#b45309" stroke-width="1.5"/>
  <text x="340" y="414" text-anchor="middle" font-size="9.5" fill="#b45309">OH</text>
  <line x1="295" y1="364" x2="295" y2="352" stroke="#b45309" stroke-width="1.5"/>
  <text x="295" y="349" text-anchor="middle" font-size="9.5" fill="#b45309">OH</text>
  <line x1="295" y1="416" x2="295" y2="427" stroke="#b45309" stroke-width="1.5"/>

  <!-- 锯齿肽链骨架（球棍式） -->
